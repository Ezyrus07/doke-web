<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doke UI Kit</title>
  <link rel="stylesheet" href="../assets/css/core/index.css">
  <link rel="stylesheet" href="../assets/css/pages/app-shell.css">
  <link rel="stylesheet" href="../assets/css/pages/ui-kit/visual-hierarchy.css?v=ui-kit-hierarchy-v1">
</head>
<body data-page="ui-kit">
  <main class="doke-page-rail">
    <header class="section-header">
      <span class="section-kicker">Doke Design System</span>
      <h1>UI Kit canônico</h1>
      <p>Referência visual para revisar botões, cards, campos, tabs, chips, overlays e estados antes de alterar páginas reais.</p>
    </header>

    <section aria-labelledby="buttons-title">
      <h2 id="buttons-title">Botões</h2>
      <div class="doke-form-actions">
        <button class="doke-btn doke-btn--primary" type="button">Primário</button>
        <button class="doke-btn doke-btn--secondary" type="button">Secundário</button>
        <button class="doke-btn doke-btn--ghost" type="button">Ghost</button>
      </div>
    </section>

    <section aria-labelledby="states-title">
      <h2 id="states-title">Estados mínimos</h2>
      <p>loading, empty, ready, error, selected, expanded, owner e visitor.</p>
    </section>
  </main>
</body>
</html>
