<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sugestões de Ícones</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f0f4f8;
        color: #333;
        padding: 40px;
      }
      h1 {
        text-align: center;
        color: #1a365d;
        margin-bottom: 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        max-width: 1000px;
        margin: 0 auto;
      }
      .category-card {
        background: white;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        text-align: center;
      }
      .category-title {
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 15px;
        color: #4a5568;
      }
      .icon-options {
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .icon-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .icon-box i {
        color: #2b6cb0; /* Cor azul semelhante ao seu design */
        width: 32px;
        height: 32px;
      }
      .icon-name {
        font-size: 0.75rem;
        color: #718096;
      }
    </style>
  </head>
  <body>
    <h1>Sugestões de Ícones SVG por Categoria</h1>

    <div class="grid">
      <div class="category-card">
        <div class="category-title">Eletricista</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="zap"></i><span class="icon-name">zap</span>
          </div>
          <div class="icon-box">
            <i data-lucide="lightbulb"></i
            ><span class="icon-name">lâmpada</span>
          </div>
          <div class="icon-box">
            <i data-lucide="plug"></i><span class="icon-name">tomada</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Encanador</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="wrench"></i><span class="icon-name">chave</span>
          </div>
          <div class="icon-box">
            <i data-lucide="droplet"></i><span class="icon-name">gota</span>
          </div>
          <div class="icon-box">
            <i data-lucide="waves"></i><span class="icon-name">água</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Pintura</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="paint-roller"></i
            ><span class="icon-name">rolo</span>
          </div>
          <div class="icon-box">
            <i data-lucide="paintbrush"></i
            ><span class="icon-name">pincel</span>
          </div>
          <div class="icon-box">
            <i data-lucide="palette"></i><span class="icon-name">paleta</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Limpeza</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="sparkles"></i><span class="icon-name">brilho</span>
          </div>
          <div class="icon-box">
            <i data-lucide="spray-can"></i><span class="icon-name">spray</span>
          </div>
          <div class="icon-box">
            <i data-lucide="wind"></i><span class="icon-name">ar puro</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Frete</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="truck"></i><span class="icon-name">caminhão</span>
          </div>
          <div class="icon-box">
            <i data-lucide="package"></i><span class="icon-name">pacote</span>
          </div>
          <div class="icon-box">
            <i data-lucide="map-pin"></i><span class="icon-name">rota</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Tecnologia</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="laptop"></i><span class="icon-name">laptop</span>
          </div>
          <div class="icon-box">
            <i data-lucide="smartphone"></i
            ><span class="icon-name">celular</span>
          </div>
          <div class="icon-box">
            <i data-lucide="cpu"></i><span class="icon-name">chip</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Aulas</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="graduation-cap"></i
            ><span class="icon-name">formatura</span>
          </div>
          <div class="icon-box">
            <i data-lucide="book-open"></i><span class="icon-name">livro</span>
          </div>
          <div class="icon-box">
            <i data-lucide="pen-tool"></i><span class="icon-name">caneta</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Beleza</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="scissors"></i><span class="icon-name">tesoura</span>
          </div>
          <div class="icon-box">
            <i data-lucide="smile"></i><span class="icon-name">rosto</span>
          </div>
          <div class="icon-box">
            <i data-lucide="heart"></i><span class="icon-name">coração</span>
          </div>
        </div>
      </div>

      <div class="category-card">
        <div class="category-title">Reforma</div>
        <div class="icon-options">
          <div class="icon-box">
            <i data-lucide="hammer"></i><span class="icon-name">martelo</span>
          </div>
          <div class="icon-box">
            <i data-lucide="hard-hat"></i
            ><span class="icon-name">capacete</span>
          </div>
          <div class="icon-box">
            <i data-lucide="home"></i><span class="icon-name">casa</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
