<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Doke | Login</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/pages/auth-foundation.css?v=20260715-lote24">
  <link rel="stylesheet" href="../assets/css/components/feedback/document-preloader.css?v=20260712-global-document-boot-v1">
 <link rel="stylesheet" href="../assets/css/components/ui-surface/close-button-authority.css?v=20260713-global-v1">
</head>
<body class="auth-page auth-page--login">
  <section class="doke-document-preloader" data-doke-document-preloader aria-label="Carregando Doke" aria-hidden="false">
    <div class="doke-document-preloader__mark">
      <img class="doke-document-preloader__logo" src="../assets/img/doke-logo-lockup.png" alt="Doke" decoding="async">
    </div>
  </section>
 <main class="auth-shell">
  <section class="auth-card">
   <span class="auth-mark" aria-hidden="true"><img src="../assets/img/doke-logo-lockup.png" alt=""></span>

   <header class="auth-copy">
    <span class="auth-eyebrow">Acesso Doke</span>
    <h1>Entrar na conta</h1>
   </header>

   <form class="auth-form" data-auth-login>
    <label class="auth-field">
     <span>E-mail</span>
     <div class="auth-input">
      <input class="doke-input" id="email-login" type="email" inputmode="email" placeholder="voce@email.com" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
     </div>
     <small class="auth-field-hint">Use o e-mail cadastrado na sua conta.</small>
    </label>

    <label class="auth-field">
     <span>Senha</span>
     <div class="auth-password">
      <input class="doke-input" id="senha-login" type="password" placeholder="Digite sua senha" autocomplete="current-password">
      <button class="auth-password-toggle doke-icon-btn doke-icon-btn--flat" type="button" data-toggle-password="senha-login" aria-label="Mostrar senha">
       <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
       </svg>
      </button>
     </div>
    </label>

    <div class="auth-meta-row">
     <label class="auth-check">
      <input class="doke-checkbox" type="checkbox" id="remember-login">
      <span>Lembrar de mim</span>
     </label>
     <a class="auth-link" href="esqueci-senha.html">Esqueci minha senha</a>
    </div>

    <div class="auth-feedback is-hidden" data-auth-feedback role="status" aria-live="polite"></div>

    <button class="auth-button doke-btn doke-btn--block doke-btn--primary" type="submit" data-auth-submit>Entrar</button>

    <p class="auth-footer">Ainda não tem conta? <a class="auth-switch-link" href="cadastro.html">Criar cadastro</a></p>
   </form>
  </section>
 </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../assets/js/core/supabase-config.js?v=20260718-real-auth-only-v1" defer></script>
  <script src="../assets/js/core/navigation-lifecycle.js?v=20260713-navigation-lifecycle-v1" defer></script>
 <script src="../assets/js/core/session.js" defer></script>
 <script src="../assets/js/repositories/users-repository.js?v=20260718-real-auth-only-v1" defer></script>
 <script src="../assets/js/services/auth-service.js?v=20260718-real-auth-only-v1" defer></script>
 <script src="../assets/js/services/auth-session-authority.js?v=20260724-auth-a06-v1" defer></script>
 <script src="../assets/js/pages/auth.js?v=20260719-auth-redirect-v1" defer></script>
  <script src="../assets/js/ui/responsive-interaction-guard.js?v=20260428-architecture" defer></script>
  <script src="../assets/js/core/document-preloader.js?v=20260712-global-document-boot-v1" defer></script>
</body>
</html>
