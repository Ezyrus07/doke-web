<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Doke | Cadastro</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/core/base.css">

  <link rel="stylesheet" href="../assets/css/pages/auth.css">
  <link rel="stylesheet" href="../assets/css/core/responsive-runtime.css?v=20260511-contract">
  <link rel="stylesheet" href="../assets/css/components/navigation/header-desktop.css?v=20260429-header-standard">
  <link rel="stylesheet" href="../assets/css/components/navigation/header-mobile.css?v=20260429-header-standard">
<link rel="stylesheet" href="../assets/css/components/actions/action-button.css?v=20260429-p4">
  <link rel="stylesheet" href="../assets/css/components/panels/mobile-panel.css?v=20260429-p5">
  <link rel="stylesheet" href="../assets/css/components/cards/card-system.css?v=20260429-p6">
  <link rel="stylesheet" href="../assets/css/core/responsive-audit.css?v=20260429-no-bottomnav-avatar-final">

</head>
<body class="auth-page auth-page--signup">
 <main class="auth-shell">
  <section class="auth-card">
   <span class="auth-mark" aria-hidden="true"><img src="../assets/img/doke-logo-lockup.png" alt=""></span>

   <header class="auth-copy">
    <span class="auth-eyebrow">Novo acesso</span>
    <h1>Criar uma conta</h1>
   </header>

   <form class="auth-form" data-auth-signup>
    <div class="auth-grid-2">
     <label class="auth-field">
      <span>Nome</span>
      <div class="auth-input">
       <input id="nome-cadastro" type="text" placeholder="Seu nome" autocomplete="name">
      </div>
     </label>

     <label class="auth-field">
      <span>E-mail</span>
      <div class="auth-input">
       <input id="email-cadastro" type="email" placeholder="Seu e-mail" autocomplete="email">
      </div>
     </label>
    </div>

    <label class="auth-field">
     <span>Senha</span>
     <div class="auth-password">
      <input id="senha-cadastro" type="password" placeholder="Crie uma senha" autocomplete="new-password" data-password-strength>
      <button type="button" data-toggle-password="senha-cadastro" aria-label="Mostrar senha">
       <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
       </svg>
      </button>
     </div>
    </label>

    <div class="auth-password-strength" aria-hidden="true">
     <span data-strength-bar></span>
     <span data-strength-bar></span>
     <span data-strength-bar></span>
     <span data-strength-bar></span>
    </div>

    <p class="auth-strength-label" data-strength-label></p>

    <p class="auth-note">Use pelo menos 8 caracteres com letras maiúsculas, minúsculas, número e símbolo.</p>

    <div class="auth-feedback is-hidden" data-auth-feedback role="status" aria-live="polite"></div>

    <div class="auth-feedback auth-feedback--success is-hidden" data-confirmation-panel>
     Confirme seu e-mail e depois volte por aqui.
     <a class="auth-switch-link" href="login.html">Já confirmei meu e-mail</a>
    </div>

    <button class="auth-button" type="submit" data-auth-submit>Criar conta</button>

    <div class="auth-divider">OU</div>

    <div class="auth-social">
     <button class="auth-social-btn auth-social-btn--google" type="button" aria-label="Continuar com Google" title="Continuar com Google">
      <svg viewBox="0 0 24 24" aria-hidden="true">
       <path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.33-.18-1.96H12v3.71h5.39a4.61 4.61 0 0 1-2 3.03v2.52h3.24c1.89-1.74 2.97-4.3 2.97-7.3Z"></path>
       <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.47l-3.24-2.52c-.9.6-2.05.95-3.39.95-2.61 0-4.82-1.76-5.61-4.12H3.05v2.6A10 10 0 0 0 12 22Z"></path>
       <path fill="#FBBC05" d="M6.39 13.84A5.98 5.98 0 0 1 6.08 12c0-.64.11-1.26.31-1.84v-2.6H3.05A10 10 0 0 0 2 12c0 1.61.38 3.13 1.05 4.44l3.34-2.6Z"></path>
       <path fill="#EA4335" d="M12 6.04c1.47 0 2.8.51 3.84 1.52l2.88-2.88C16.96 3.03 14.7 2 12 2 8.09 2 4.72 4.24 3.05 7.56l3.34 2.6C7.18 7.8 9.39 6.04 12 6.04Z"></path>
      </svg>
     </button>
     <button class="auth-social-btn auth-social-btn--facebook" type="button" aria-label="Continuar com Facebook" title="Continuar com Facebook">
      <svg viewBox="0 0 24 24" aria-hidden="true">
       <path fill="#111827" d="M13.62 22v-8.04h2.7l.4-3.14h-3.1V8.81c0-.9.25-1.52 1.54-1.52H16.8V4.48c-.29-.04-1.27-.12-2.4-.12-2.38 0-4 1.45-4 4.12v2.34H7.7v3.14h2.7V22h3.22z"/>
      </svg>
     </button>
     <button class="auth-social-btn auth-social-btn--apple" type="button" aria-label="Continuar com Apple" title="Continuar com Apple">
      <svg viewBox="0 0 24 24" aria-hidden="true">
       <path fill="#111827" d="M16.77 12.12c-.03-2.31 1.89-3.43 1.98-3.49-1.08-1.58-2.75-1.8-3.34-1.83-1.42-.15-2.78.84-3.5.84-.73 0-1.85-.82-3.04-.8-1.56.03-3 0.91-3.8 2.31-1.62 2.82-.41 6.99 1.16 9.26.77 1.11 1.68 2.35 2.88 2.31 1.16-.05 1.6-.75 3-.75 1.4 0 1.8.75 3.02.72 1.25-.02 2.04-1.13 2.8-2.25.88-1.29 1.24-2.54 1.26-2.6-.03-.01-2.41-.93-2.42-3.72Zm-2.19-6.77c.64-.78 1.07-1.87.95-2.95-.92.04-2.03.61-2.69 1.39-.59.68-1.11 1.79-.97 2.84 1.02.08 2.07-.52 2.71-1.28Z"></path>
      </svg>
     </button>
    </div>

    <p class="auth-footer">Já tem conta? <a class="auth-switch-link" href="login.html">Entrar</a></p>
   </form>
  </section>
 </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="../assets/js/core/supabase-config.js"></script>
 <script src="../assets/js/core/auth-service.js"></script>
 <script src="../assets/js/pages/auth.js"></script>
  <script src="../assets/js/ui/responsive-interaction-guard.js?v=20260511-contract"></script>
</body>
</html>
