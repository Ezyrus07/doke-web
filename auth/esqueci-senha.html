<head>
 <meta charset="UTF-8">

 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/components/navigation/header-desktop.css?v=20260429-header-standard">

<link rel="stylesheet" href="../assets/css/components/actions/action-button.css?v=20260516-design-system-consolidation-v1">

<body class="auth-page auth-page--login">
 <main class="auth-shell">
  <section class="auth-card">
   <span class="auth-mark" aria-hidden="true"><img src="../assets/img/doke-logo-lockup.png" alt=""></span>

   <header class="auth-copy">
    <span class="auth-eyebrow">Recuperação</span>
    <h1>Recuperar acesso</h1>
    <p>Fluxo simples para reenviar código e redefinir a senha sem inventar interface desnecessária.</p>
   </header>

   <form class="auth-form" data-auth-recovery>
    <div class="auth-recovery-options">
     <label class="auth-choice">
      <input type="radio" name="recovery-method" value="email" checked>
      <span class="auth-choice-card">
       <strong>Por e-mail</strong>
       <span>Envie um código para o endereço cadastrado.</span>
      </span>
     </label>

     <label class="auth-choice">
      <input type="radio" name="recovery-method" value="phone">
      <span class="auth-choice-card">
       <strong>Por telefone</strong>
       <span>Receba um código por SMS no número cadastrado.</span>
      </span>
     </label>
    </div>

    <label class="auth-field">
     <span data-recovery-contact-label>E-mail cadastrado</span>
     <div class="auth-input">
      <input id="recovery-contact" type="text" placeholder="voce@email.com" autocomplete="username" data-phone-mask>
     </div>
    </label>

    <div class="auth-feedback is-hidden" data-auth-feedback role="status" aria-live="polite"></div>

    <p class="auth-note">Use o mesmo contato da conta para localizar o acesso corretamente.</p>

    <button class="auth-button" type="submit" data-auth-submit>Enviar código</button>

    <section class="auth-recovery-reset is-hidden" data-recovery-reset>
     <label class="auth-field">
      <span>Código recebido</span>
      <div class="auth-input">
       <input id="recovery-code" type="text" inputmode="numeric" placeholder="Digite o código recebido">
      </div>
     </label>

     <label class="auth-field">
      <span>Nova senha</span>
      <div class="auth-password">
       <input id="recovery-password" type="password" placeholder="Crie uma nova senha" autocomplete="new-password">
       <button type="button" data-toggle-password="recovery-password" aria-label="Mostrar senha">
        <svg viewBox="0 0 24 24" aria-hidden="true">
         <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
         <circle cx="12" cy="12" r="3"></circle>
        </svg>
       </button>
      </div>
     </label>

     <button class="auth-button auth-button--secondary" type="button" data-recovery-reset-submit>Redefinir senha</button>
    </section>

    <p class="auth-footer">Lembrou da senha? <a class="auth-switch-link" href="login.html">Voltar para entrar</a></p>
   </form>
  </section>
 </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="../assets/js/core/supabase-config.js"></script>
 <script src="../assets/js/core/auth-service.js"></script>
 <script src="../assets/js/pages/auth.js"></script>
  <script src="../assets/js/ui/responsive-interaction-guard.js?v=20260428-architecture"></script>
</body>
</html>
