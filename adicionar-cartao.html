<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doke | Adicionar cartao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/core/tokens.css">
  <link rel="stylesheet" href="assets/css/core/base.css">
  <link rel="stylesheet" href="assets/css/core/layout.css">
  <link rel="stylesheet" href="assets/css/core/components.css">
  <link rel="stylesheet" href="assets/css/pages/app-shell.css">
    <link rel="stylesheet" href="assets/css/pages/wallet-manage.css">
</head>
<body class="shell-home wallet-manage-shell">
  <div class="app-shell">
    <aside class="sidebar" data-shell-sidebar></aside>
    <div class="page">
      <main class="page__content">
        <div class="page__content-inner container shell-home__workspace shell-home__workspace--clean">
          <section class="wallet-manage-page">
            <article class="wallet-manage-card">
              <div class="wallet-manage-card__header">
                <div>
                  <span class="wallet-section__eyebrow">Cartao</span>
                  <h1>Adicionar cartao</h1>
                  <p>Cadastre um novo cartao para usar na carteira e em pagamentos futuros.</p>
                </div>
                <a class="wallet-page__button" href="carteira.html">Voltar</a>
              </div>
              <div class="wallet-manage-grid">
                <label class="wallet-manage-field wallet-manage-field--full"><span>Nome impresso</span><input type="text" value="Gabriel Oliveira"></label>
                <label class="wallet-manage-field wallet-manage-field--full"><span>Numero do cartao</span><input type="text" value="5555 4444 3333 7513"></label>
                <label class="wallet-manage-field"><span>Validade</span><input type="text" value="11/28"></label>
                <label class="wallet-manage-field"><span>CVV</span><input type="password" value="123"></label>
              </div>
              <div class="wallet-manage-actions">
                <a class="wallet-page__button" href="carteira.html">Cancelar</a>
                <a class="wallet-page__button wallet-page__button--primary" href="carteira.html">Salvar cartao</a>
              </div>
            </article>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="assets/js/core/auth.js"></script>
  <script src="assets/js/core/app.js"></script>
</body>
</html>
