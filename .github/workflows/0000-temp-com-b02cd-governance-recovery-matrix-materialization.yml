name: 0000 TEMP COM-B02CD Governance Recovery Matrix Materialization

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/0000-temp-com-b02cd-governance-recovery-matrix-materialization.yml'

permissions:
  contents: read

jobs:
  materialize-derived-matrix-read-only:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SAFE_HEAD: bc47b07674cf3e332001ca58c448ff01bcd0e207
      SAFE_TREE: 0a500a516f0cf3ef0688c8848328d998b3535ea6
      PREDECESSOR_HEAD: 0590e64b75a640880ac00485d2a678b6ac3092e7
      HISTORICAL_PROOF_HEAD: f671d8a93157353bb58b5edf8a4351706461d0ac
      TEMP_PATH: .github/workflows/0000-temp-com-b02cd-governance-recovery-matrix-materialization.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-execution.js
      CONFIG: config/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.json
      TEST: scripts/test-com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.js
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze recovery head and TEMP-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$SAFE_HEAD^{tree}")" = "$SAFE_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD
          git merge-base --is-ancestor "$HISTORICAL_PROOF_HEAD" HEAD
          test "$(git diff --name-only "$SAFE_HEAD" HEAD)" = "$TEMP_PATH"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Re-certify quarantine statically without execution
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'registerOpaqueContinuationState\(|registry\.set\(|new Map\(|executeRepositoryOnlyDeterministicSyntheticRegister' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Materialize and certify only Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          echo "MATRIX_MD_GIT_BLOB=$(git hash-object "$MATRIX_MD")"
          echo "MATRIX_REPORT_GIT_BLOB=$(git hash-object "$MATRIX_REPORT")"
          echo "MATRIX_MD_GZIP_BASE64_BEGIN"
          gzip -c "$MATRIX_MD" | base64 -w0
          echo
          echo "MATRIX_MD_GZIP_BASE64_END"
          echo "MATRIX_REPORT_GZIP_BASE64_BEGIN"
          gzip -c "$MATRIX_REPORT" | base64 -w0
          echo
          echo "MATRIX_REPORT_GZIP_BASE64_END"
