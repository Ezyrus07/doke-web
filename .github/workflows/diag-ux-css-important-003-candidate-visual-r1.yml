name: Doke UX CSS Important 003 Candidate Visual R1
on:
  push:
    branches: [diag/ux-css-important-003-candidate-visual-r1]
    paths: [.github/workflows/diag-ux-css-important-003-candidate-visual-r1.yml]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: b44fe12f2e81cbe155f154527aed78b90144c552
      TARGET_FILE: assets/css/pages/home/mobile-layout.css
      TARGET_BLOB: 576d351eb5e1447cd6e1e188e005b8153573fb3f
      DIAG_BRANCH: diag/ux-css-important-003-candidate-visual-r1
      RESULT_FILE: .diagnostics/ux-css-important-003-candidate-visual-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 2}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: visual
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/visual.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,src=fs.readFileSync(f,'utf8');
          const oldCard=`  body.home-index-shell .home-search-hero__card {\n    display: grid !important;\n    gap: 12px;\n    padding: 10px 10px 12px;\n    background: linear-gradient(180deg, var(--home-stage15-brand) 0%, var(--home-stage15-brand-strong) 100%);\n    border: 1px solid color-mix(in srgb, var(--home-stage15-brand) 82%, white);\n    border-radius: var(--home-stage15-radius);\n    box-shadow: var(--doke-home-mobile-hero-shadow);\n    overflow: hidden !important;\n  }`;
          const newCard=oldCard.replace('display: grid !important;','display: grid;').replace('overflow: hidden !important;','overflow: hidden;');
          const oldRail=`  body.home-index-shell .short-videos .content-rail {\n    display: block !important;\n    overflow: visible;\n  }`;
          const newRail=oldRail.replace('display: block !important;','display: block;');
          const oldTrack=`  body.home-index-shell .short-videos .short-videos__track {\n    display: grid !important;\n    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n    grid-auto-flow: row !important;\n    grid-auto-columns: auto !important;\n    gap: 10px;\n    width: 100%;\n    max-width: 100%;\n    min-width: 0;\n    overflow: visible !important;\n    padding: 0;\n  }`;
          const newTrack=oldTrack.replace(/ !important/g,'');
          if((src.match(/!important\b/g)||[]).length!==29||!src.includes(oldCard)||!src.includes(oldRail)||!src.includes(oldTrack))throw Error('parent drift');
          const out=src.replace(oldCard,newCard).replace(oldRail,newRail).replace(oldTrack,newTrack);fs.writeFileSync('/tmp/candidate.css',out);const z=Buffer.from(out),h=crypto.createHash('sha256').update(z).digest('hex');if((out.match(/!important\b/g)||[]).length!==21)throw Error('count');console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=29->21|files=1|priorityMarkersRemoved=8`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,parent=fs.readFileSync(f,'utf8'),candidate=fs.readFileSync('/tmp/candidate.css','utf8'),ws=[359,379,380,381,430,560,561],browser=await chromium.launch({headless:true}),hash=x=>crypto.createHash('sha256').update(x).digest('hex');
          async function cap(w,phase){const c=await browser.newContext({viewport:{width:w,height:1000}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));for(const u of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**'])await p.route(u,r=>r.fulfill({status:200,contentType:'text/css',body:''}));for(const u of ['https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(u,r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.goto(`http://127.0.0.1:4173/index.html?cssimp003=${phase}-${w}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(1000);await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const vals=await p.evaluate(()=>{const specs=[['.home-search-hero__card',['display','overflow']],['.short-videos .content-rail',['display','overflow']],['.short-videos .short-videos__track',['display','grid-template-columns','grid-auto-flow','grid-auto-columns','overflow']]];return specs.map(([sel,props])=>{const el=document.querySelector(sel);if(!el)return{sel,missing:true};const s=getComputedStyle(el),r=el.getBoundingClientRect(),o={sel,missing:false,rect:[r.x,r.y,r.width,r.height].map(x=>Math.round(x*100)/100)};for(const prop of props)o[prop]=s.getPropertyValue(prop).trim();return o}).concat([{sel:'__document__',missing:false,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyScrollWidth:document.body.scrollWidth}])});if(vals.slice(0,3).some(x=>x.missing))throw Error(`required DOM missing ${JSON.stringify(vals)}`);const main=p.locator('main').first();const png=await main.count()?hash(await main.screenshot({animations:'disabled'})):hash(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{vals,png,errs}}
          const par={},can={};fs.writeFileSync(f,parent);for(const w of ws)par[w]=await cap(w,'parent');fs.writeFileSync(f,candidate);for(const w of ws)can[w]=await cap(w,'candidate');let sd=0,gd=0,pd=0,errs=0;for(const w of ws){errs+=par[w].errs.length+can[w].errs.length;for(let i=0;i<par[w].vals.length;i++){const a=par[w].vals[i],b=can[w].vals[i];if(a.missing!==b.missing){sd++;continue}if(a.missing)continue;for(const k of Object.keys(a)){if(['sel','missing','rect'].includes(k))continue;if(a[k]!==b[k]){sd++;console.log(`STYLE DIFF|${w}|${a.sel}|${k}|${a[k]}|${b[k]}`)}}if(a.rect)for(let j=0;j<4;j++)if(a.rect[j]!==b.rect[j]){gd++;console.log(`GEOM DIFF|${w}|${a.sel}|${j}|${a.rect[j]}|${b.rect[j]}`)}}if(par[w].png!==can[w].png){pd++;console.log(`PNG DIFF|${w}|${par[w].png}|${can[w].png}`)}}if(sd||gd||pd||errs)throw Error(`parity ${sd}/${gd}/${pd}/${errs}`);console.log(`VISUAL PASS|viewports=${ws.join(',')}|computedDiffs=0|geometryDiffs=0|screenshotDiffs=0|screenshots=7|requiredNodes=3/3|syntheticDOM=0|criteriaRelaxed=0|sourceRun=32137798522|rawRun=32137749131`);await browser.close();fs.writeFileSync(f,parent)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.visual.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "VISUAL=${{ steps.visual.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|VISUAL PASS|STYLE DIFF|GEOM DIFF|PNG DIFF)\|' /tmp/visual.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 180 /tmp/visual.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record important003 candidate visual [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
