name: COM-B03C R5H Cleanup Verifier Binding Descriptor Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=f70e70f0d184a950d74a28535539bb8a92bdaa47
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.json)" = "b76b4ecb846a71d01708bb686d3f9b9d340368b0"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.yml)" = "95bc1da2932cd106afae02f8c59df4ba8d95ff9e"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.json)" = "11ca808f80e3cae310b966b39e20d86e1dba113b"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.yml)" = "94f3e5da876f6954be4974e18365731668df49c7"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-sanitized-evidence-recorder.js)" = "11c61cd8666a7929819dc02ea3d367ff4834c85d"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-harness-specification.json)" = "8611bc7cffd54d813248988b3b4fcf9bd894384c"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js)" = "723d33aea011a28766b819fa823aad82f341aba3"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed cleanup-verifier descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.json)" = "b76b4ecb846a71d01708bb686d3f9b9d340368b0"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.yml)" = "95bc1da2932cd106afae02f8c59df4ba8d95ff9e"
          node - <<'NODE'
          const d=require('./config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.json');
          const fields=['caseId','predicate','expectedClassification','joinSubscribed','terminalStatusClassification','extensionValueClassification','cleanupCompleted','zeroResidue','rawErrorCaptured'];
          if(d.contractId!=='com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary-v1')throw new Error('CONTRACT_DRIFT');
          if(d.repositoryContext.parentCertifiedSanitizedEvidenceRecorderBindingHead!=='34ec11fc4c7a6613e1a5ae4fba692730bac69b05')throw new Error('PARENT_DRIFT');
          const c=d.canonicalCleanupVerificationContract;
          if(c.slotId!=='cleanup_verifier'||c.evidenceFields.join('|')!==fields.join('|'))throw new Error('CLEANUP_SCHEMA_DRIFT');
          for(const k of ['sanitizedEvidenceOnly','cleanupCompletedMustEqualTrue','zeroResidueMustEqualTrue','rawErrorCapturedMustEqualFalse','identityCleanupRequired','zeroResidueRequired','terminalStatusAloneCannotProveCause','crossCaseComparisonRequiredForCausalConclusion','rawRemoteErrorForbidden','rawCredentialMaterialForbidden','rawIdentityMaterialForbidden','rawRemotePayloadForbidden','endpointMaterialForbidden','processEnvironmentReadForbidden','remoteDependencyImportForbidden','networkCallForbidden','realtimeSubscriptionForbidden'])if(c.invariants[k]!==true)throw new Error(`CLEANUP_INVARIANT:${k}`);
          for(const k of Object.keys(c.failClosedConditions))if(c.failClosedConditions[k]!==true)throw new Error(`FAIL_CLOSED:${k}`);
          const b=d.cleanupVerifierBindingDescriptor;
          if(b.cleanupVerifierBindingDescriptorDefined!==true||b.cleanupVerifierImplementationPresent!==false||b.cleanupVerifierBindingDefined!==false||b.cleanupVerifierBound!==false||b.schemaOnly!==true)throw new Error('DESCRIPTOR_STATE_DRIFT');
          for(const k of ['verifierContractId','verifierModulePath','verifierModuleBlob','bindingBoundaryHead','cleanupVerifier'])if(b[k]!==null)throw new Error(`CONCRETE_VERIFIER_FORBIDDEN:${k}`);
          if(d.remainingDependentPortState.length!==1||d.remainingDependentPortState[0].slotId!=='cleanup_verifier'||d.remainingDependentPortState[0].descriptorDefined!==true||d.remainingDependentPortState[0].bound!==false)throw new Error('REMAINING_PORT_DRIFT');
          const g=d.governance;
          for(const k of ['cleanupVerifierImplementationPresent','cleanupVerifierBindingDefined','cleanupVerifierBound','evidenceMutationImplemented','evidencePersistenceImplemented','transportBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'])if(g[k]!==false)throw new Error(`GOVERNANCE_DRIFT:${k}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for cleanup verifier binding descriptor" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
