name: ORD-A07C Readiness Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07c-readiness-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07C readiness registry and matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(packageJson.scripts, {
            'plan:ord-001-a07c-staging-migration:dry-run': 'node scripts/plan-ord-001-a07c-staging-migration.js --dry-run',
            'plan:ord-001-a07c-staging-migration:check-env': 'node scripts/plan-ord-001-a07c-staging-migration.js --check-env',
            'test:ord-001-a07c-staging-migration-readiness': 'node scripts/test-ord-001-a07c-staging-migration-readiness.js',
            'audit:ord-001-a07c-staging-migration-readiness': 'node scripts/audit-ord-001-a07c-staging-migration-readiness.js'
          });
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.35';
          matrix.updatedAt = '2026-07-30T16:37:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'config/ord-001-a07c-staging-migration-readiness.json',
            'scripts/plan-ord-001-a07c-staging-migration.js',
            'scripts/test-ord-001-a07c-staging-migration-readiness.js',
            'scripts/audit-ord-001-a07c-staging-migration-readiness.js',
            'docs/ORD-001-A07C-STAGING-MIGRATION-READINESS.md',
            'docs/validation/ORD-001-A07C-STAGING-MIGRATION-READINESS.json',
            '.github/workflows/ord-001-a07c-staging-migration-readiness.yml'
          ]);
          appendUnique(ord.tests, [
            'plan:ord-001-a07c-staging-migration:dry-run',
            'plan:ord-001-a07c-staging-migration:check-env',
            'test:ord-001-a07c-staging-migration-readiness',
            'audit:ord-001-a07c-staging-migration-readiness'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07C readiness locks the canonical Cron header migration by SHA-256 and permits only dry-run or environment recognition; the planner has no execute, network, database or deploy capability.',
            'The staging preflight confirms A07B is present, A07C is absent, the doke-order-event-worker job remains active on * * * * * with its canonical command, and all order-domain counts remain zero.',
            'A07C is constrained to replacing private.invoke_order_event_worker_if_needed while preserving Vault secret names, endpoint, source, limit 25, timeout 30000 and stale-claim recovery; schedule mutation and secret creation are forbidden.'
          ]);
          ord.nextActions = ord.nextActions.filter((action) =>
            !/prepare.*a07c.*gate|a07c.*readiness/i.test(action)
          );
          appendUnique(ord.nextActions, [
            'Apply ORD-A07C only after the exact staging authorization phrase, verify that the Cron schedule and command remain unchanged, then require separate authorization for the Edge Function deploy and remote replay canary.'
          ]);

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/test-ord-001-a07c-staging-migration-readiness.js
          node scripts/plan-ord-001-a07c-staging-migration.js --dry-run
          node scripts/audit-ord-001-a07c-staging-migration-readiness.js
          node scripts/test-ord-001-a07c-worker-invocation-headers.mjs
          node scripts/audit-ord-001-a07c-worker-invocation-headers.js
          node scripts/audit-ord-001-a07b-staging-migration-application.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07C staging readiness evidence' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
