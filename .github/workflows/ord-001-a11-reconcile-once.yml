name: ORD-A11 Scheduling Handoff Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a11-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A11 scheduling handoff
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const configPath = 'config/ord-001-a11-scheduling-authority-handoff.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

          const auditPath = 'scripts/audit-ord-001-a11-scheduling-authority-handoff.js';
          let audit = fs.readFileSync(auditPath, 'utf8');
          audit = audit
            .replace("'SCHED-001 owns'", "'`SCHED-001` owns'")
            .replace("'ORD-001 owns'", "'`ORD-001` owns'");
          fs.writeFileSync(auditPath, audit);

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['audit:ord-001-a11-scheduling-authority-handoff'] =
            'node scripts/audit-ord-001-a11-scheduling-authority-handoff.js';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.43';
          matrix.updatedAt = '2026-07-31T08:10:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
          if (!ord) throw new Error('ORD-001 domain not found');
          if (!sched) throw new Error('SCHED-001 domain not found');

          const paths = [
            configPath,
            'docs/ORD-001-A11-SCHEDULING-AUTHORITY-HANDOFF.md',
            'docs/validation/ORD-001-A11-SCHEDULING-AUTHORITY-HANDOFF.json',
            auditPath,
            '.github/workflows/ord-001-a11-scheduling-authority-handoff.yml'
          ];
          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, paths);
          appendUnique(sched.requiredPaths, [
            ...paths,
            'supabase/migrations/003_communication_finance_community.sql',
            'supabase/migrations/113_availability_reviews_authority.sql',
            'supabase/migrations/119_public_policy_role_separation.sql'
          ]);
          appendUnique(ord.tests, ['audit:ord-001-a11-scheduling-authority-handoff']);
          appendUnique(sched.tests, ['audit:ord-001-a11-scheduling-authority-handoff']);

          appendUnique(ord.evidence, [
            'ORD-A11 transfers canonical availability, hold, reservation, conflict, reschedule, cancellation and timezone authority to SCHED-001 while ORD-001 retains only order lifecycle and a canonical reservation reference/projection.',
            'Repository migrations 113 and 119 enable availability_slots RLS and separate anonymous from authenticated reads, correcting the stale claim that the repository leaves availability RLS disabled; SCHED-specific staging verification is still pending.',
            'Order creation still accepts raw scheduled_at and browser projections still carry desired-date, shift and service availability snapshot data, so ORD-B04 remains open until the server scheduling module and reservation reference are implemented.',
            'ORD-A11 is repository-only and performed zero network requests, staging mutations, migrations, deployments, production changes or merge.'
          ]);

          ord.blockers = ord.blockers.map((blocker) => blocker.id === 'ORD-B04'
            ? {
                ...blocker,
                category: 'scheduling_dependency',
                description: 'ORD-B04 is formally handed to SCHED-001 but remains open. Availability, holds, confirmed reservations, conflict protection, timezone, rescheduling and cancellation must become server-canonical there; ORD-001 must consume one canonical reservation reference instead of treating raw scheduled_at as booking authority.'
              }
            : blocker);
          ord.nextActions = ord.nextActions.filter((action) => !/Handoff ORD-B04 to SCHED-001/i.test(action));
          ord.nextActions.unshift('Execute the SCHED-001 repository baseline and read-only staging security preflight defined by ORD-A11; generic continuation must not apply migrations or mutate staging.');

          sched.requiredPaths = sched.requiredPaths.filter((path) => path !== 'backend/modules/scheduling/.gitkeep');
          appendUnique(sched.requiredPaths, ['backend/modules/scheduling/.gitkeep']);
          sched.evidence = sched.evidence.filter((entry) => !/availability_slots has RLS disabled/i.test(entry));
          appendUnique(sched.evidence, [
            'Repository migrations 113 and 119 enable availability_slots RLS, define owner write policies and separate anonymous available-slot reads from authenticated owner/operator visibility.',
            'No SCHED-specific staging preflight currently records the deployed availability schema, policies and grants, so security verification remains open.',
            'The scheduling backend module remains unimplemented, no canonical hold or reservation lifecycle exists and no database-level active-range anti-double-booking rule is proven.',
            'ORD-A11 defines SCHED-001 as the sole canonical time authority and prohibits ORD-001 from retaining parallel scheduling or raw scheduled_at booking authority.'
          ]);

          sched.blockers = sched.blockers.map((blocker) => {
            if (blocker.id === 'SCHED-B01') return {
              ...blocker,
              severity: 'high',
              category: 'staging_security_verification',
              description: 'Repository migrations enable and role-separate availability_slots RLS, but SCHED-specific read-only staging verification of schema, policies and grants is not yet recorded.'
            };
            if (blocker.id === 'SCHED-B02') return {
              ...blocker,
              description: 'No canonical scheduling service handles availability rules, holds, confirmed reservations, expiration, rescheduling, cancellation or timezone rules.'
            };
            if (blocker.id === 'SCHED-B03') return {
              ...blocker,
              description: 'No database-level exclusion or equivalent active-range contract proves that concurrent holds or bookings for one professional cannot overlap.'
            };
            return blocker;
          });
          if (!sched.blockers.some((blocker) => blocker.id === 'SCHED-B04')) {
            sched.blockers.push({
              id: 'SCHED-B04',
              severity: 'high',
              category: 'order_integration',
              description: 'Orders accept raw scheduled_at and do not reference a canonical schedule reservation, so accepted proposals are not transactionally bound to authoritative occupancy.',
              targetPhase: 'Fase 6'
            });
          }
          sched.nextActions = [...config.orderedNextActions];

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/test-public-data-authority-contract.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A11 scheduling authority handoff' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
