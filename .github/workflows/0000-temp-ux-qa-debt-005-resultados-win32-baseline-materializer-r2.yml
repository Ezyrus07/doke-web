name: TEMP UX-QA-DEBT-005 Resultados Win32 Baseline Materializer R2

on:
  push:
    branches:
      - diag/ux-qa-debt-005-resultados-win32-baseline-materializer-r2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PARENT: 14bdb1af9cfefff4dfd27a78b937443975266001
      PARENT_TREE: 32f449b165b8cb119600c702c0625cc7199f3416
      MATERIALIZER_PATH: .github/workflows/0000-temp-ux-qa-debt-005-resultados-win32-baseline-materializer-r2.yml
      CANDIDATE_BRANCH: diag/ux-qa-debt-005-resultados-win32-baseline-candidate
      SNAPSHOT: tests/visual/doke-visual-regression.spec.js-snapshots/resultados-desktop-1366x768-win32.png
      OLD_SNAPSHOT_BLOB: 1580b5410bcce1ea5424d5528356291a0f288c4e
      DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Freeze diagnostic lineage and target
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$HEAD_SHA" | awk '{print $2}')" = "$PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$MATERIALIZER_PATH"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT:$SNAPSHOT")" = "$OLD_SNAPSHOT_BLOB"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "Candidate branch already exists" >&2
            exit 1
          fi
          echo LINEAGE=PASS
          echo OLD_BASELINE_IDENTITY=PASS
          echo CANDIDATE_ABSENT=PASS
          echo PRODUCT_MUTATION=false
          echo MATRIX_MUTATION=false

      - name: Install locked Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium

      - name: Prepare exact parent worktree with local dependencies
        shell: bash
        run: |
          set -euo pipefail
          parent_dir="$RUNNER_TEMP/qa005-parent-r2"
          git worktree add --detach "$parent_dir" "$PARENT" >/dev/null
          cd "$parent_dir"
          npm ci --ignore-scripts
          test -f node_modules/@playwright/test/cli.js
          cp "$SNAPSHOT" "$RUNNER_TEMP/qa005-old-baseline-r2.png"
          echo WORKTREE_DEPENDENCY_RESOLUTION=PASS

      - name: Generate exact replacement baseline from certified parent
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          node node_modules/@playwright/test/cli.js test tests/visual/doke-visual-regression.spec.js --grep "resultados mantém contrato visual e estrutural em desktop-1366x768" --update-snapshots
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$SNAPSHOT"
          test -s "$SNAPSHOT"
          candidate_blob="$(git hash-object "$SNAPSHOT")"
          test "$candidate_blob" != "$OLD_SNAPSHOT_BLOB"
          echo "CANDIDATE_BLOB=$candidate_blob"
          echo "CANDIDATE_SHA256=$(sha256sum "$SNAPSHOT" | awk '{print $1}')"
          echo "CANDIDATE_BYTES=$(wc -c < "$SNAPSHOT" | tr -d ' ')"
          echo ONE_FILE_BINARY_CANDIDATE=PASS

      - name: Candidate required visual test passes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          node node_modules/@playwright/test/cli.js test tests/visual/doke-visual-regression.spec.js --grep "resultados mantém contrato visual e estrutural em desktop-1366x768"
          echo CANDIDATE_VISUAL_TEST=PASS

      - name: Negative proof old June baseline still fails
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          cp "$SNAPSHOT" "$RUNNER_TEMP/qa005-candidate-baseline-r2.png"
          cp "$RUNNER_TEMP/qa005-old-baseline-r2.png" "$SNAPSHOT"
          set +e
          node node_modules/@playwright/test/cli.js test tests/visual/doke-visual-regression.spec.js --grep "resultados mantém contrato visual e estrutural em desktop-1366x768" > "$RUNNER_TEMP/qa005-negative-r2.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/qa005-negative-r2.log"
          test "$rc" -ne 0
          grep -Eqi "Screenshot comparison failed|pixels .* different|exceeded" "$RUNNER_TEMP/qa005-negative-r2.log"
          cp "$RUNNER_TEMP/qa005-candidate-baseline-r2.png" "$SNAPSHOT"
          node node_modules/@playwright/test/cli.js test tests/visual/doke-visual-regression.spec.js --grep "resultados mantém contrato visual e estrutural em desktop-1366x768"
          echo NEGATIVE_OLD_BASELINE=PASS
          echo CRITERIA_RELAXED=0

      - name: Reconfirm Resultados desktop structural gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          npm run audit:desktop-base
          npm run audit:desktop-phase-entry-gate
          npm run audit:desktop-phase-entry-contract
          npm run audit:visual-baseline
          npm run audit:shared-app-header-contract
          npm run test:results-card-density-contract
          npm run audit:section-header-contract
          npm run audit:overflow-text-clipping
          echo RESULTADOS_DESKTOP_STATIC_GATES=PASS

      - name: Direct-load and stable-shell navigation contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          node node_modules/@playwright/test/cli.js test tests/e2e/global-layout-contract.spec.js --grep "desktop-1366.*resultados.html keeps structural layout contract|DokeNavigate no-reload flow"
          echo RESULTADOS_DIRECT_AND_NAV_LAYOUT=PASS

      - name: Direct-load versus internal-navigation computed parity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const { spawn } = require('child_process');
          const http = require('http');

          const server = spawn(process.execPath, ['scripts/serve-static-site.js', '--host=127.0.0.1', '--port=5500'], {
            env: { ...process.env, DOKE_E2E_DISABLE_REMOTE_SERVICES: '1' },
            stdio: ['ignore', 'pipe', 'pipe']
          });

          const waitForServer = () => new Promise((resolve, reject) => {
            let attempts = 0;
            const probe = () => {
              attempts += 1;
              const req = http.get('http://127.0.0.1:5500/index.html', (res) => {
                res.resume();
                if (res.statusCode === 200) return resolve();
                if (attempts > 50) return reject(new Error(`server status ${res.statusCode}`));
                setTimeout(probe, 250);
              });
              req.on('error', () => attempts > 50 ? reject(new Error('static server unavailable')) : setTimeout(probe, 250));
            };
            probe();
          });

          const routeExternal = async (page) => {
            await page.route('https://unpkg.com/**', (route) => route.fulfill({ contentType: 'application/javascript', body: '' }));
            await page.route('https://cdn.jsdelivr.net/**', (route) => route.fulfill({ contentType: 'application/javascript', body: '' }));
            await page.route('https://fonts.googleapis.com/**', (route) => route.fulfill({ contentType: 'text/css', body: '' }));
            await page.route('https://fonts.gstatic.com/**', (route) => route.abort());
          };

          const stable = async (page) => {
            await page.waitForLoadState('domcontentloaded');
            await page.waitForLoadState('networkidle').catch(() => {});
            await page.addStyleTag({ content: '*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important;caret-color:transparent!important}' });
            await page.waitForTimeout(450);
          };

          const signature = (page) => page.evaluate(() => {
            const visible = (el) => {
              if (!el) return false;
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
            };
            const read = (selector) => {
              const el = Array.from(document.querySelectorAll(selector)).find(visible);
              if (!el) return null;
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return {
                left: Math.round(r.left * 10) / 10,
                width: Math.round(r.width * 10) / 10,
                display: s.display,
                position: s.position,
                gridTemplateColumns: s.gridTemplateColumns,
                gap: s.gap,
                paddingLeft: s.paddingLeft,
                paddingRight: s.paddingRight,
                borderRadius: s.borderRadius
              };
            };
            const root = document.documentElement;
            return {
              dataPage: document.body?.dataset.page || '',
              overflow: root.scrollWidth > root.clientWidth + 1,
              header: read('[data-app-header] .app-header__inner'),
              workspace: read('.search-results-workspace'),
              searchbar: read('.results-searchbar'),
              layout: read('.results-layout')
            };
          });

          const compare = (a, b) => {
            if (a.dataPage !== 'resultados' || b.dataPage !== 'resultados') throw new Error('body[data-page] mismatch');
            if (a.overflow || b.overflow) throw new Error(`horizontal overflow direct=${a.overflow} nav=${b.overflow}`);
            for (const key of ['header', 'workspace', 'searchbar', 'layout']) {
              if (!a[key] || !b[key]) throw new Error(`${key} missing direct/nav`);
              if (Math.abs(a[key].left - b[key].left) > 1 || Math.abs(a[key].width - b[key].width) > 1) {
                throw new Error(`${key} geometry drift ${JSON.stringify({ direct: a[key], nav: b[key] })}`);
              }
              for (const prop of ['display', 'position', 'gridTemplateColumns', 'gap', 'paddingLeft', 'paddingRight', 'borderRadius']) {
                if (a[key][prop] !== b[key][prop]) throw new Error(`${key}.${prop} drift direct=${a[key][prop]} nav=${b[key][prop]}`);
              }
            }
          };

          (async () => {
            let browser;
            try {
              await waitForServer();
              browser = await chromium.launch();
              const context = await browser.newContext({ viewport: { width: 1366, height: 768 } });

              const direct = await context.newPage();
              const directErrors = [];
              direct.on('pageerror', (error) => directErrors.push(String(error)));
              await routeExternal(direct);
              await direct.goto('http://127.0.0.1:5500/resultados.html');
              await stable(direct);
              const directSignature = await signature(direct);
              if (directErrors.length) throw new Error(`direct page errors ${JSON.stringify(directErrors)}`);

              const nav = await context.newPage();
              const navErrors = [];
              nav.on('pageerror', (error) => navErrors.push(String(error)));
              await routeExternal(nav);
              await nav.goto('http://127.0.0.1:5500/index.html');
              await stable(nav);
              await nav.waitForFunction(() => typeof window.DokeNavigate === 'function');
              await nav.evaluate(async () => {
                const result = window.DokeNavigate('/resultados.html');
                if (result && typeof result.then === 'function') await result;
              });
              await nav.waitForURL(/\/resultados\.html(?:$|[?#])/);
              await stable(nav);
              const navSignature = await signature(nav);
              if (navErrors.length) throw new Error(`nav page errors ${JSON.stringify(navErrors)}`);

              compare(directSignature, navSignature);
              console.log(`DIRECT_SIGNATURE=${JSON.stringify(directSignature)}`);
              console.log(`NAV_SIGNATURE=${JSON.stringify(navSignature)}`);
              console.log('DIRECT_INTERNAL_COMPUTED_PARITY=PASS');
            } finally {
              if (browser) await browser.close().catch(() => {});
              server.kill();
            }
          })().catch((error) => {
            console.error(error);
            server.kill();
            process.exit(1);
          });
          NODE

      - name: Materialize diagnostic candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r2"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$SNAPSHOT"
          git diff --check
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git checkout -b "$CANDIDATE_BRANCH"
          git add -- "$SNAPSHOT"
          git commit -m "test(ux-qa-debt-005): refresh Resultados Win32 visual baseline candidate"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^1)" = "$PARENT"
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#committed[@]}" -eq 1
          test "${committed[0]}" = "$SNAPSHOT"
          candidate_blob="$(git rev-parse "HEAD:$SNAPSHOT")"
          test "$candidate_blob" != "$OLD_SNAPSHOT_BLOB"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')" = "$CANDIDATE_SHA"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"
          echo "CANDIDATE_BLOB=$candidate_blob"
          echo "CANDIDATE_SHA256=$(sha256sum "$SNAPSHOT" | awk '{print $1}')"
          echo "CANDIDATE_BYTES=$(wc -c < "$SNAPSHOT" | tr -d ' ')"
          echo UX_QA_DEBT_005_DIAGNOSTIC_MATERIALIZATION=PASS
          echo PRODUCT_MUTATION=false
          echo MATRIX_MUTATION=false
          echo CRITERIA_RELAXED=0
