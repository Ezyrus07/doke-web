name: TEMP UX-CSS-IMPORTANT-041 Permanent Certification

on:
  push:
    branches: [diag/ux-css-important-041-app-header-permanent-certifier]
    paths: [.github/workflows/0000-temp-ux-css-important-041-app-header-permanent-certifier.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  permanent-certifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DIAG_SHA: ${{ github.sha }}
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-041-app-header-permanent-certifier.yml
      RECEIPT_FILE: .diagnostics/ux-css-important-041-app-header-permanent-certification.json
      OUTPUT_BRANCH: diag/ux-css-important-041-app-header-permanent-certifier
      PARENT_SHA: d23744276157a2ea28ac8fa4e44a8d5095103260
      PARENT_TREE: 40972482f565e3e9fac1b26291937c21c0b17f3c
      PERM_SHA: bbcfa17c8fd5ea5070baf0f77b9e2451840209a9
      PERM_TREE: ebd6f2afd9b84f54f3a34763266d55e34a9451ac
      TARGET_FILE: assets/css/components/shell/app-header.css
      PARENT_BLOB: cafaf11c9607a319f790c1f855a1381eb2c7b17e
      PERM_BLOB: f21bb85bf8bd19ec1016e579e77c4c81496c27ac
      PERM_SHA256: d489b52e3e7fa9c057ca85ec1e17f2736e5eaf3315d492afdfe93b91b3ba7ef7
      PERM_BYTES: '40324'
      PARENT_GLOBAL: '5326'
      PERM_GLOBAL: '4745'
      PR_NUMBER: '368'
      BASE_BRANCH: ux/ux-css-important-040-responsive-priority-contract-dormant-priority
      PERM_BRANCH: ux/ux-css-important-041-app-header-dormant-priority
      R1_BRANCH: diag/ux-css-important-041-app-header-r1d
      R1_FILE: .diagnostics/ux-css-important-041-app-header-r1d.json
      R1_BLOB: fb4ca4d817663e2d28cf6caefa349d3fd050289d
      R2_BRANCH: diag/ux-css-important-041-app-header-candidate-r2
      R2_FILE: .diagnostics/ux-css-important-041-app-header-candidate-r2.json
      R2_BLOB: ca57aca2cc8fe88d76d6975f48ea9416affdb69d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}

      - name: Freeze permanent identity lineage and PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PERM_SHA^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PERM_SHA^")" = "$PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git merge-base "$PARENT_SHA" "$PERM_SHA")" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..$PERM_SHA")" = 1
          test "$(git merge-base "$PERM_SHA" "$DIAG_SHA")" = "$PERM_SHA"
          test "$(git rev-list --count "$PERM_SHA..$DIAG_SHA")" = 1
          test "$(git diff --name-only "$PERM_SHA"..."$DIAG_SHA")" = "$WORKFLOW_FILE"
          test "$(git diff --name-only "$PARENT_SHA"..."$PERM_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"..."$PERM_SHA")" = $'581\t581\t'"$TARGET_FILE"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >/tmp/pr.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/pr.json','utf8'));
          if(!(p.state==='open'&&p.draft===true&&p.merged_at===null&&p.mergeable===true&&p.head?.ref===process.env.PERM_BRANCH&&p.head?.sha===process.env.PERM_SHA&&p.base?.ref===process.env.BASE_BRANCH&&p.base?.sha===process.env.PARENT_SHA)) throw Error(`PR mismatch ${p.state}/${p.draft}/${p.mergeable}`);
          fs.writeFileSync('/tmp/pr-facts.json',JSON.stringify({number:p.number,state:p.state,draft:p.draft,merged:false,mergeable:p.mergeable,head:p.head.sha,base:p.base.sha},null,2)+'\n');
          NODE

      - name: Transfer R1 and R2 exact receipts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$R1_BRANCH:refs/remotes/origin/$R1_BRANCH" "refs/heads/$R2_BRANCH:refs/remotes/origin/$R2_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R1_BRANCH:$R1_FILE")" = "$R1_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R2_BRANCH:$R2_FILE")" = "$R2_BLOB"
          git show "refs/remotes/origin/$R1_BRANCH:$R1_FILE" >/tmp/r1.json
          git show "refs/remotes/origin/$R2_BRANCH:$R2_FILE" >/tmp/r2.json
          node <<'NODE'
          const fs=require('fs'),r1=JSON.parse(fs.readFileSync('/tmp/r1.json')),r2=JSON.parse(fs.readFileSync('/tmp/r2.json'));
          if(r1.result!=='PASS'||r1.product.sha!==process.env.PARENT_SHA||r1.target.blob!==process.env.PARENT_BLOB||r1.target.important!==581||r1.target.importantSites!==581||r1.target.unresolvedImportantSites!==0||r1.reach.wholeFileDormant!==true||r1.reach.browserReconciliationRequired!==false)throw Error('R1 mismatch');
          if(r2.result!=='PASS'||r2.parent.sha!==process.env.PARENT_SHA||r2.candidate.gitBlob!==process.env.PERM_BLOB||r2.candidate.sha256!==process.env.PERM_SHA256||r2.candidate.importantAfter!==0||r2.staticMatrix.introducedRegressions!==0||r2.staticMatrix.criteriaRelaxed!==0||r2.browserRequired!==false)throw Error('R2 mismatch');
          NODE

      - name: Independently reconstruct candidate and global debt
        shell: bash
        run: |
          set -euo pipefail
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent.css
          git show "$PERM_SHA:$TARGET_FILE" >/tmp/permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const p=fs.readFileSync('/tmp/parent.css','utf8'),c=fs.readFileSync('/tmp/permanent.css','utf8'),rebuilt=p.replace(/\s*!important\b/gi,'');
          const before=(p.match(/!important\b/gi)||[]).length,after=(c.match(/!important\b/gi)||[]).length;
          if(before!==581||after!==0||rebuilt!==c)throw Error(`reconstruction ${before}->${after} eq=${rebuilt===c}`);
          const sha256=crypto.createHash('sha256').update(c).digest('hex');if(sha256!==process.env.PERM_SHA256||Buffer.byteLength(c)!==Number(process.env.PERM_BYTES))throw Error('hash/bytes');
          const css=cp.execFileSync('git',['ls-tree','-r','--name-only',process.env.PARENT_SHA,'assets/css'],{encoding:'utf8'}).trim().split('\n').filter(x=>x.endsWith('.css'));
          const count=sha=>css.reduce((n,f)=>n+(cp.execFileSync('git',['show',`${sha}:${f}`],{encoding:'utf8'}).match(/!important\b/gi)||[]).length,0);
          const pg=count(process.env.PARENT_SHA),cg=count(process.env.PERM_SHA);if(pg!==Number(process.env.PARENT_GLOBAL)||cg!==Number(process.env.PERM_GLOBAL))throw Error(`global ${pg}->${cg}`);
          fs.writeFileSync('/tmp/comparison.json',JSON.stringify({parent:process.env.PARENT_SHA,parentTree:process.env.PARENT_TREE,permanent:process.env.PERM_SHA,permanentTree:process.env.PERM_TREE,parentBlob:process.env.PARENT_BLOB,permanentBlob:process.env.PERM_BLOB,importantBefore:before,importantAfter:after,globalBefore:pg,globalAfter:cg,globalDelta:cg-pg,markerOnly:true,selectorsRemoved:0,declarationsRemoved:0,propertiesChanged:0,valuesChanged:0,sha256,bytes:Buffer.byteLength(c),additions:581,deletions:581,changedFiles:1,ahead:1,behind:0,mergeBase:process.env.PARENT_SHA},null,2)+'\n');
          NODE

      - name: Independently reprove permanent dormancy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,posixpath,re,subprocess
          SHA=os.environ['PERM_SHA']; TARGET=os.environ['TARGET_FILE']
          def sh(*a): return subprocess.check_output(a,text=True).rstrip('\n')
          files=sh('git','ls-tree','-r','--name-only',SHA).splitlines(); S=set(files)
          def read(p): return subprocess.check_output(['git','show',f'{SHA}:{p}']).decode('utf8','replace')
          def imports(p):
            src=re.sub(r'/\*.*?\*/','',read(p),flags=re.S);out=[]
            rx=r'@import\s+(?:url\(\s*)?[\'\"]?([^\'\"\)\s;]+\.css(?:\?[^\'\"\)\s;]*)?)[\'\"]?\s*\)?[^;]*;'
            for m in re.finditer(rx,src,re.I):
              x=m.group(1).split('?',1)[0].split('#',1)[0]
              if re.match(r'^[a-z]+://',x,re.I):continue
              out.append(x.lstrip('/') if x.startswith('/') else posixpath.normpath(posixpath.join(posixpath.dirname(p),x)))
            return out
          css=[p for p in files if p.endswith('.css')]; im={p:imports(p) for p in css}; direct=sorted(p for p in css if TARGET in im[p])
          html=sorted(p for p in files if p.endswith('.html') and '/' not in p); lr=re.compile(r'<link\b[^>]*?href\s*=\s*[\'\"]([^\'\"]+)[\'\"][^>]*>',re.I|re.S);starts={}
          for h in html:
            arr=[]
            for x in lr.findall(read(h)):
              x=x.split('?',1)[0].split('#',1)[0]
              if x.endswith('.css') and not re.match(r'^[a-z]+://',x,re.I):arr.append(posixpath.normpath(x.lstrip('/')))
            starts[h]=arr
          def closure(xs):
            seen=set();st=list(xs)
            while st:
              p=st.pop()
              if p in seen or p not in S or not p.endswith('.css'):continue
              seen.add(p);st.extend(im.get(p,[]))
            return seen
          reach={h:closure(xs) for h,xs in starts.items()};pages=sorted(h for h,s in reach.items() if TARGET in s);loaded=set();[loaded.update(s) for s in reach.values()]
          direct_html=sorted(h for h,xs in starts.items() if TARGET in xs);runtime=[]
          for p in files:
            if p.startswith('assets/js/') and p.endswith(('.js','.mjs','.cjs')):
              t=read(p)
              if TARGET in t or posixpath.basename(TARGET) in t:runtime.append(p)
          d={'rootHtmlCount':len(html),'loadedCssCount':len(loaded),'canonicalLoaded':TARGET in loaded,'wholeFileDormant':TARGET not in loaded and not direct and not direct_html and not runtime,'targetPages':pages,'directImporters':direct,'directHtmlRefs':direct_html,'runtimeJsRefs':sorted(runtime),'browserRequired':False,'criteriaRelaxed':0}
          if not d['wholeFileDormant'] or d['canonicalLoaded'] or pages or direct or direct_html or runtime:raise SystemExit(json.dumps(d))
          open('/tmp/dormancy.json','w').write(json.dumps(d,indent=2)+'\n')
          PY

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PERM_SHA" >/dev/null;git clean -fd >/dev/null;npm ci --ignore-scripts >/dev/null

      - name: Reexecute parent permanent static matrix
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/gates.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1";sha="$2";: >"/tmp/${phase}.tsv"
          restore(){ git reset --hard "$sha" >/dev/null 2>&1||exit 90;git clean -fd >/dev/null 2>&1||exit 91; }
          norm(){ sed -E -e 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+-]+Z?/<TIME>/g' -e 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$1"; }
          gate(){ l="$1";shift;restore;log="/tmp/${phase}-${l}.log";set +e;"$@">"$log" 2>&1;rc=$?;set -e;norm "$log">"${log}.norm";h="$(sha256sum "${log}.norm"|awk '{print $1}')";printf '%s\t%s\t%s\n' "$l" "$rc" "$h">>"/tmp/${phase}.tsv"; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/gates.sh;/tmp/gates.sh parent "$PARENT_SHA";/tmp/gates.sh permanent "$PERM_SHA"

      - name: Reconcile unchanged criteria
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const parse=f=>new Map(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [l,r,h]=x.split('\t');return[l,{rc:+r,hash:h}]}));const p=parse('/tmp/parent.tsv'),c=parse('/tmp/permanent.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'],debt=['important_reduction_plan','global_css_design_system'];const rows=[];let introduced=0,relaxed=0;
          for(const l of exact){const a=p.get(l),b=c.get(l);if(a.rc===0&&b.rc===0&&a.hash===b.hash)rows.push({label:l,classification:'PASS_BOTH_IDENTICAL',parent:a,permanent:b});else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash)rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,permanent:b});else{introduced++;throw Error(`${l} divergence`);}}
          for(const l of debt){const a=p.get(l),b=c.get(l);if(a.rc===0&&b.rc===0)rows.push({label:l,classification:'PASS_BOTH_EXPECTED_DEBT_DELTA',parent:a,permanent:b});else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash)rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,permanent:b});else if(a.rc!==0&&b.rc===0)rows.push({label:l,classification:'PERMANENT_IMPROVES_BASELINE',parent:a,permanent:b});else{introduced++;throw Error(`${l} regression`);}}
          const a=p.get('frontend_strict'),b=c.get('frontend_strict');if(a.rc!==b.rc)throw Error('frontend rc');const sig=s=>s.split('\n').filter(x=>x.includes('**CRITICAL**')||x.includes('**WARNING**')).sort();if(JSON.stringify(sig(fs.readFileSync('/tmp/parent-frontend_strict.log','utf8')))!==JSON.stringify(sig(fs.readFileSync('/tmp/permanent-frontend_strict.log','utf8'))))throw Error('frontend warning set');rows.push({label:'frontend_strict',classification:a.rc===0?'PASS_BOTH_EXPECTED_DEBT_DELTA':'BASELINE_EQUIVALENT_EXPECTED_DEBT_DELTA',parent:a,permanent:b});
          fs.writeFileSync('/tmp/matrix.json',JSON.stringify({rows,introducedRegressions:introduced,criteriaRelaxed:relaxed},null,2)+'\n');
          NODE

      - name: Restore permanent and publish certification receipt
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PERM_SHA" >/dev/null;git clean -fd >/dev/null
          test "$(git rev-parse HEAD)" = "$PERM_SHA";test "$(git rev-parse HEAD^{tree})" = "$PERM_TREE";test "$(git rev-parse HEAD:$TARGET_FILE)" = "$PERM_BLOB";test "$(git status --porcelain)" = ""
          node <<'NODE'
          const fs=require('fs');const out={proof:'UX-CSS-IMPORTANT-041 Permanent Repository Certification',result:'PASS',checkpoint:'UX-CSS-IMPORTANT-041',pr:JSON.parse(fs.readFileSync('/tmp/pr-facts.json')),comparison:JSON.parse(fs.readFileSync('/tmp/comparison.json')),r1:{branch:process.env.R1_BRANCH,receiptBlob:process.env.R1_BLOB},r2:{branch:process.env.R2_BRANCH,receiptBlob:process.env.R2_BLOB},dormancy:JSON.parse(fs.readFileSync('/tmp/dormancy.json')),staticMatrix:JSON.parse(fs.readFileSync('/tmp/matrix.json')),browserRequired:false,permanentCandidateAltered:false,historicalDiagnosticFailures:[{run:32857025592,job:97831394473,classification:'DIAGNOSTIC_HARNESS_DECLARATION_DOUBLE_COUNT'},{run:32857252380,job:97832143791,classification:'DIAGNOSTIC_HARNESS_HAND_PARSER_INCOMPLETE_579_OF_581'},{run:32857492002,job:97832938727,classification:'DIAGNOSTIC_HARNESS_MISSING_POSTCSS_DEPENDENCY'}],restore:{headExact:true,treeExact:true,targetBlobExact:true,workspaceClean:true,head:process.env.PERM_SHA,tree:process.env.PERM_TREE,targetBlob:process.env.PERM_BLOB},scope:{repositoryOnly:true,staging:false,production:false,backend:false,supabase:false,rpc:false,migrations:false,credentials:false,runtimeRealtime:false,merge:false,readyForReview:false,forcePush:false,historyRewrite:false}};fs.writeFileSync('/tmp/receipt.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RECEIPT_FILE")";cp /tmp/receipt.json "$RECEIPT_FILE"
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RECEIPT_FILE";test "$(git diff --cached --name-only)" = "$RECEIPT_FILE";git commit -m 'diagnostic(ux-css-important-041): publish permanent certification';git push origin HEAD:"$OUTPUT_BRANCH"

      - name: Verify permanent remained frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PERM_SHA^{tree}")" = "$PERM_TREE";test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
          git show HEAD:"$RECEIPT_FILE" >/tmp/remote.json
          node -e "const r=require('/tmp/remote.json');if(r.result!=='PASS'||r.comparison.globalAfter!==4745||r.comparison.importantAfter!==0||r.staticMatrix.introducedRegressions!==0||r.staticMatrix.criteriaRelaxed!==0||!r.restore.workspaceClean)process.exit(1)"
