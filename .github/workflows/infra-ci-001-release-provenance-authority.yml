name: INFRA-CI-001 Release Provenance Authority

on:
  pull_request:
    paths:
      - 'config/release-environment-authority.json'
      - 'scripts/audit-release-environment-authority.js'
      - 'scripts/validate-release-go-no-go-gate.js'
      - 'docs/INFRA-ENVIRONMENT-DEPLOYMENT-AUTHORITY.md'
      - 'package.json'
      - '.github/workflows/infra-ci-001-release-provenance-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-001-release-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-provenance-authority:
    name: INFRA-CI-001 release provenance authority
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Preserve existing domain workflow surface
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          unexpected="$(git diff --name-only "$base...HEAD" -- .github/workflows | grep -v '^.github/workflows/infra-ci-001-release-provenance-authority.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Existing domain workflows changed in INFRA-CI-001 scope:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Syntax-check release authority scripts
        run: |
          node --check scripts/audit-release-environment-authority.js
          node --check scripts/validate-release-go-no-go-gate.js

      - name: Validate release environment authority contract
        run: npm run audit:release-environment-authority

      - name: Validate release gate contract-only integration
        run: node scripts/validate-release-go-no-go-gate.js --dry-run

      - name: Prove production remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/infra-ci-001
          node <<'NODE'
          const fs = require('fs');
          const contract = JSON.parse(fs.readFileSync('config/release-environment-authority.json', 'utf8'));
          const manifest = {
            repository: contract.canonicalRepository,
            source_sha: '1111111111111111111111111111111111111111',
            source_tree_sha: '2222222222222222222222222222222222222222',
            source_branch: contract.canonicalReleaseBranch,
            release_branch: contract.canonicalReleaseBranch,
            vercel_project_id: contract.canonicalVercelProject.projectId,
            preview_deployment_id: 'dpl_infra_ci_001_synthetic',
            preview_deployment_sha: '1111111111111111111111111111111111111111',
            staging_supabase_ref: contract.staging.supabaseProjectRef,
            staging_migration_head: 'synthetic-staging-head',
            edge_function_versions: ['synthetic-function@sha256:00000000'],
            ci_run_ids: ['synthetic-ci-run'],
            rollback_deployment_id: 'dpl_infra_ci_001_rollback',
            production_supabase_ref: 'future-production-ref',
            authorization_id: 'infra-ci-001-synthetic-production-proof'
          };
          fs.writeFileSync('/tmp/infra-ci-001/release-environment-manifest.json', JSON.stringify(manifest, null, 2));
          NODE

          set +e
          DOKE_RELEASE_ENVIRONMENT_MANIFEST_PATH=/tmp/infra-ci-001/release-environment-manifest.json \
            node scripts/audit-release-environment-authority.js --require-production-manifest \
            > /tmp/infra-ci-001/production-authority.json 2>&1
          status=$?
          set -e
          cat /tmp/infra-ci-001/production-authority.json
          if [ "$status" -eq 0 ]; then
            echo 'Production authority unexpectedly passed while production Supabase is unassigned.' >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/infra-ci-001/production-authority.json', 'utf8'));
          const expected = 'Production Supabase authority is UNASSIGNED; production release is forbidden.';
          if (report.status !== 'blocked') throw new Error(`expected blocked status, got ${report.status}`);
          if (!Array.isArray(report.blockers) || !report.blockers.includes(expected)) {
            throw new Error('canonical production fail-closed blocker missing');
          }
          if (report.failures.length !== 0) throw new Error(`unexpected contract failures: ${report.failures.join(' | ')}`);
          if (report.performsExternalNetworkRequest !== false || report.performsExternalMutation !== false) {
            throw new Error('release authority audit must remain repository-only');
          }
          console.log('INFRA-CI-001 production fail-closed proof: PASS');
          NODE

      - name: Diff hygiene
        run: git diff --check
