name: TEMP COM-B02CB Observable Certification and Matrix Reconciliation R2

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02cb-observable-certification-and-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  certify-reconcile-and-finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: e21a1e4a0b98f0cdbd5ac4d96e8bb6d60ed20a85
      CANDIDATE_TREE: 8f7d39e59c84356ef0fb243cd5f5ee428b442c47
      PREDECESSOR_HEAD: 1daff60fdf5bb195522cf5862c7635049af90821
      PREDECESSOR_TREE: 4de945a3da28206fe0eb37d1eeb775a9555b79d2
      B02CB_MODULE_BLOB: c9f2f43c3de8b3132f2d9ec7122ebd70e3264de2
      B02CB_CONFIG_BLOB: 85b9e8be4fd5f8545a87fcc27bdacbab8728b701
      B02CB_TEST_BLOB: 7d6e65404cc276af98f0e6bea92ae508e04925e4
      B02CB_WORKFLOW_BLOB: 8039c6dd047716fc62b47aa2528f99b7d2f49cc5
      B02CA_MODULE_BLOB: 93cc7417a2c36248323bf0b356f9e1d032198391
      B02CA_CONFIG_BLOB: 9333938c3b4710cbb63033fb70ab520bbe6386ee
      B02BJ_IMPLEMENTATION_BLOB: 99d804721a5d350dcf8e59dd935937e24561e094
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02cb-observable-certification-and-matrix-reconciliation.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.js
      CONFIG: config/com-b02cb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.json
      TEST: scripts/test-com-b02cb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.js
      CANONICAL_WORKFLOW: .github/workflows/com-b02cb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.yml
      B02CA_CONFIG: config/com-b02ca-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-invocation-readiness.json
      TEMP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEMP_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze candidate lineage predecessor and exact temporary scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEMP_HEAD_SHA"
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD"
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          expected="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          test "$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)" = "$expected"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02CB_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02CB_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02CB_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02CB_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-invocation-readiness.js)" = "$B02CA_MODULE_BLOB"
          test "$(git rev-parse HEAD:$B02CA_CONFIG)" = "$B02CA_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-methods-implementation.js)" = "$B02BJ_IMPLEMENTATION_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git ls-tree -r --name-only HEAD | grep -c '^\.github/workflows/temp-com-b02cb-')" -eq 1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and strict harness non-invocation invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -F 'Object.defineProperty(' "$TARGET" "$TEST"
          ! grep -E '(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)[[:space:]]*\(' "$TARGET" "$TEST"
          ! grep -E '\.(call|apply)[[:space:]]*\(|Reflect\.apply[[:space:]]*\(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"
          test "$(grep -Fc 'harnessInvokesOperationMethods: false' "$TARGET")" -ge 1
          ! grep -E 'executableOperationMethodsInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Reconcile Matrix only if stale
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run audit:domain-completion-matrix
          matrix_rc=$?
          set -e
          if [ "$matrix_rc" -ne 0 ]; then
            npm run write:domain-completion-matrix
            changed="$(git status --short | awk '{print $2}' | sort)"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
                *) echo "unexpected Matrix reconciliation path: $path"; exit 1 ;;
              esac
            done <<< "$changed"
          fi
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          npm run audit:domain-completion-matrix

      - name: Governance diff hygiene and frozen repository surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD"
          test "$(git rev-parse HEAD:$B02CA_CONFIG)" = "$B02CA_CONFIG_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Commit permanent derived state and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$TEMP_PATH"
          git add docs/DOMAIN-COMPLETION-MATRIX.md || true
          git add -f reports/generated/domain-completion-matrix-report.json || true
          git commit -m "ci(com): finalize B02CB repository-only deterministic synthetic invocation harness certification R2 [run ${{ github.run_id }}]"

      - name: Certify permanent B02CB tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-tree -r --name-only HEAD | grep '^\.github/workflows/temp-com-b02cb-' || true)"
          expected4="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          expected6="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json "$TEST" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected4" || test "$actual" = "$expected6"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02CB_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02CB_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02CB_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02CB_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:$B02CA_CONFIG)" = "$B02CA_CONFIG_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          node "$TEST"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Fast-forward branch only if TEMP head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$TEMP_HEAD_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
