name: Doke UX-CSS-DEBT-047 Profile Visual Hierarchy Static Reach Proof

on:
  push:
    branches:
      - diag/ux-css-debt-047-profile-visual-hierarchy-reach

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9b691b6f1387987172259db6485c2884604fec5b
      PARENT_SHA: 75ab79e2316cb61d602658597e2bf66ce487af87
      TARGET_FILE: assets/css/pages/profile/visual-hierarchy.css
      TARGET_BLOB: 7e3b74a06b7c10f1b12744a92a987d0a4c111567
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Preserve proof helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-047-profile-visual-hierarchy-reach.cjs /tmp/ux-css-debt-047-profile-visual-hierarchy-reach.cjs
          node --check /tmp/ux-css-debt-047-profile-visual-hierarchy-reach.cjs

      - name: Checkout exact certified UX-CSS-DEBT-046 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          clean: true

      - name: Guard exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CHECKPOINT GUARD PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|blob=$TARGET_BLOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install and generate canonical active graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures

      - name: Prove unconditional static cascade and exact reach
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/ux-css-debt-047-profile-visual-hierarchy-reach.cjs | tee /tmp/proof.log
          grep -q 'STATIC CASCADE PROOF PASS' /tmp/proof.log
          grep -q 'unconditionalDominance=1' /tmp/proof.log
          grep -q 'REACH AUTHORITY PASS' /tmp/proof.log
          grep -q 'EPHEMERAL CANDIDATE PASS|decl=50->49|dead=1->0|additions=0|deletions=1' /tmp/proof.log
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          git diff --check

      - name: Preserve governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Restore exact checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0|issueCreated=0|prCreated=0"
