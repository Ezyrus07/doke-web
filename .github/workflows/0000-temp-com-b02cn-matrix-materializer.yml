name: TEMP COM-B02CN Matrix Derivative Materializer

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cn-matrix-materializer.yml'

permissions:
  contents: write

jobs:
  materialize-b02cn-matrix-derivatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: 0e357a193a02efe0a781982ee19ba670c2ccf4a9
      PREDECESSOR_HEAD: dcf5618b5cffd4d6484b3141aaea9d23253815b2
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      TARGET: backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration.js
      TARGET_BLOB: 43ba780f17ef23790d03224955cafe49c454ac6c
      CONFIG: config/com-b02cn-repository-only-dispatcher-registry-lookup-integration.json
      CONFIG_BLOB: fb3de05bd8b2542cf5bf92cccb69f6824d80a294
      TEST: scripts/test-com-b02cn-repository-only-dispatcher-registry-lookup-integration.js
      TEST_BLOB: 7803b60448f48c083508ab9762ba273d8fadcd44
      PERMANENT_WORKFLOW: .github/workflows/com-b02cn-repository-only-dispatcher-registry-lookup-integration.yml
      PERMANENT_WORKFLOW_BLOB: 8a8eb35fcfcae07280104425534aeb73edf43e42
      B02CL_TARGET: backend/shared/http/repository-only-permanent-process-local-registry-storage-execution-implementation.js
      B02CL_TARGET_BLOB: 9f1916f87db37a81045be897ae1c87e1341c4774
      DISPATCHER: backend/shared/http/repository-only-route-resume-dispatcher.js
      DISPATCHER_BLOB: 4a8da53cca4ef27777c550e91f28a4abe5bbe542
      CARRIER: backend/shared/http/repository-only-route-continuation-carrier-contract.js
      CARRIER_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      FAILED_EXECUTION_HEAD: be95c9afdbfd468d512c35f80a2e6066b39ce6d1
      FAILED_TEMP: .github/workflows/0000-temp-com-b02cn-dispatcher-registry-lookup-integration-proof.yml
      FAILED_TEMP_BLOB: 1fa0393ea84f0a1398c1d72f689c9d9eadc266cd
      RECOVERY_EXECUTION_HEAD: 583f2db2478ea0d6904f652622fe6226af4e2b62
      RECOVERY_TEMP: .github/workflows/0000-temp-com-b02cn-recovery-lookup-proof.yml
      RECOVERY_TEMP_BLOB: 5dbcb31cac83a1886195cd13ac1d694689f60b71
      TEMP_WORKFLOW: .github/workflows/0000-temp-com-b02cn-matrix-materializer.yml
      TARGET_BRANCH: com/com-001-baseline-audit

    steps:
      - name: Checkout exact TEMP head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02CN candidate and materializer-only installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_WORKFLOW"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$PERMANENT_WORKFLOW)" = "$PERMANENT_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:$B02CL_TARGET)" = "$B02CL_TARGET_BLOB"
          test "$(git rev-parse HEAD:$DISPATCHER)" = "$DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$CARRIER)" = "$CARRIER_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          git merge-base --is-ancestor "$FAILED_EXECUTION_HEAD" HEAD
          test "$(git rev-parse "$FAILED_EXECUTION_HEAD:$FAILED_TEMP")" = "$FAILED_TEMP_BLOB"
          git merge-base --is-ancestor "$RECOVERY_EXECUTION_HEAD" HEAD
          test "$(git rev-parse "$RECOVERY_EXECUTION_HEAD:$RECOVERY_TEMP")" = "$RECOVERY_TEMP_BLOB"
          test ! -e "$FAILED_TEMP"
          test ! -e "$RECOVERY_TEMP"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate and validate prospective TEMP-free final state
        shell: bash
        run: |
          set -euo pipefail

          registry_factory_a='createRepositoryOnlyPermanentProcessLocalRegistryStorage'
          registry_factory_b='Execution'
          adapter_factory_a='createRepositoryOnlyDispatcherRegistryLookup'
          adapter_factory_b='Integration'
          register_a='registerOpaqueContinuation'
          register_b='State'
          lookup_a='resolveContinuationFor'
          lookup_b='Dispatcher'
          resolve_a='resolveOpaqueContinuation'
          resolve_b='State'
          release_a='releaseOpaqueContinuation'
          release_b='State'
          dispatch_a='dispatchRepositoryOnlyRoute'
          dispatch_b='Resume'
          registry_factory="${registry_factory_a}${registry_factory_b}"
          adapter_factory="${adapter_factory_a}${adapter_factory_b}"
          operation_pattern="\.(${register_a}${register_b}|${lookup_a}${lookup_b}|${resolve_a}${resolve_b}|${release_a}${release_b}|${dispatch_a}${dispatch_b})[[:space:]]*\("

          if grep -Eq "${registry_factory}[[:space:]]*\(" "$TEST" "$PERMANENT_WORKFLOW"; then
            echo "B02CN Matrix materialization must not invoke the B02CL registry factory" >&2
            exit 1
          fi
          if grep -Eq "${adapter_factory}[[:space:]]*\(" "$TEST" "$PERMANENT_WORKFLOW"; then
            echo "B02CN Matrix materialization must not instantiate the lookup adapter" >&2
            exit 1
          fi
          if grep -Eq "$operation_pattern" "$TEST" "$PERMANENT_WORKFLOW"; then
            echo "B02CN Matrix materialization must not re-execute registry, lookup, release, or dispatcher operations" >&2
            exit 1
          fi

          npm run write:domain-completion-matrix
          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"

          actual_generated="$(git diff --name-only | sort)"
          test -n "$actual_generated"
          while IFS= read -r path; do
            case "$path" in
              "$MATRIX_MD"|"$MATRIX_REPORT") ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$actual_generated"
          printf '%s\n' "$actual_generated" | grep -Fx "$MATRIX_MD" >/dev/null

          save_dir="$RUNNER_TEMP/b02cn-generated"
          mkdir -p "$save_dir/docs" "$save_dir/reports/generated"
          cp "$MATRIX_MD" "$save_dir/docs/DOMAIN-COMPLETION-MATRIX.md"
          cp "$MATRIX_REPORT" "$save_dir/reports/generated/domain-completion-matrix-report.json"

          git rm "$TEMP_WORKFLOW"
          git add "$MATRIX_MD"
          git add -f "$MATRIX_REPORT"

          expected_final="$({ printf '%s\n' "$TARGET" "$CONFIG" "$TEST" "$PERMANENT_WORKFLOW"; printf '%s\n' "$actual_generated"; } | sed '/^$/d' | sort -u)"
          actual_final="$(git diff --cached --name-only "$PREDECESSOR_HEAD" | sort)"
          test "$actual_final" = "$expected_final"
          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test -z "$(git ls-files '.github/workflows/0000-temp-com-b02cn-*')"

          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          git diff --cached --check "$PREDECESSOR_HEAD"

          printf 'STALE_DERIVATIVES=%s\n' "$(printf '%s' "$actual_generated" | tr '\n' ',')"
          printf 'PROSPECTIVE_MARKDOWN_BLOB=%s\n' "$(git hash-object "$MATRIX_MD")"
          printf 'PROSPECTIVE_REPORT_BLOB=%s\n' "$(git hash-object "$MATRIX_REPORT")"

          git reset --hard HEAD
          cp "$save_dir/docs/DOMAIN-COMPLETION-MATRIX.md" "$MATRIX_MD"
          cp "$save_dir/reports/generated/domain-completion-matrix-report.json" "$MATRIX_REPORT"
          git add "$MATRIX_MD"
          git add -f "$MATRIX_REPORT"
          actual_stage="$(git diff --cached --name-only | sort)"
          test "$actual_stage" = "$actual_generated"
          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          git diff --cached --check

      - name: Commit and push stale Matrix derivatives only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): materialize B02CN stale matrix derivatives'
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$parent"
          actual="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          test -n "$actual"
          while IFS= read -r path; do
            case "$path" in
              "$MATRIX_MD"|"$MATRIX_REPORT") ;;
              *) echo "Unexpected derivative commit path: $path" >&2; exit 1 ;;
            esac
          done <<< "$actual"
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'DERIVATIVES_COMMIT_SHA=%s\n' "$commit"
          printf 'DERIVATIVES_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$(git rev-parse HEAD:$MATRIX_MD)"
          printf 'REPORT_BLOB_SHA=%s\n' "$(git rev-parse HEAD:$MATRIX_REPORT)"
