name: Doke UX-CSS-DEBT-058 Workers Mobile Fullscreen Proof

on:
  push:
    branches:
      - diag/ux-css-debt-058-workers-mobile-fullscreen-proof

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: d6daeaa876111dbfa3ed27cc5307936084292962
      PARENT_SHA: 28e5d98e1d640a730b2b24457a1ebc83f743f786
      TARGET_FILE: assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css
      TARGET_BLOB: d5adb69cdad3a77bdb5138afc7555071075fd089
      IMPORTER: assets/css/components/before-after-workers-preview.css
      IMPORTER_BLOB: d2065a1d52d82fd7e13a7eeaaf636c526c433f23
      RUNTIME_JS: assets/js/pages/home/workers.js
      RUNTIME_BLOB: 962e267d2591593f8346cb1b7f2b4ce846c098d4
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-057 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact checkpoint and proof inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER")" = "$IMPORTER_BLOB"
          test "$(git hash-object "$RUNTIME_JS")" = "$RUNTIME_BLOB"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "INPUT GUARD PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|target=$TARGET_BLOB|importer=$IMPORTER_BLOB|runtime=$RUNTIME_BLOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install browser and generate parent baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          python3 -m http.server 4173 >/tmp/ux058-http.log 2>&1 &
          echo $! >/tmp/ux058-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          echo 'PARENT BASELINE PASS|responsiveBaseline=1|http=4173'

      - name: Static cascade reach and real runtime proof plus deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ux058-proof.js <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');
          const {chromium}=require('@playwright/test');
          const TARGET=process.env.TARGET_FILE, IMPORTER=process.env.IMPORTER, RUNTIME=process.env.RUNTIME_JS;
          const BASE='http://127.0.0.1:4173';
          const pages=['index.html','resultados.html'];
          const viewports=[359,379,380,381,430,759,760,761,1024].map(width=>({width,height:900}));
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){
            const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;
            for(let i=0;i<lines.length;i++){
              const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;
              if(!sel){
                if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}
                else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}
                else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}
                else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}
              }
              if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context});}}
              depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}
            }
            const last=new Map(),dead=[];
            for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winnerLine:l.line,winnerValue:l.value,winnerImportant:l.important,winnerSelector:l.selector,winnerContext:l.context});if(!l||d.important||!l.important)last.set(k,d);}
            return {declarations:ds,dead};
          }
          const parentSrc=fs.readFileSync(TARGET,'utf8'), parent=parse(parentSrc);
          if(parent.declarations.length!==294||parent.dead.length!==78)throw new Error(`target drift ${parent.declarations.length}/${parent.dead.length}`);
          const selectors=[...new Set(parent.dead.map(d=>d.selector))];
          if(selectors.length!==17)throw new Error(`selector family drift ${selectors.length}`);
          const contexts=[...new Set(parent.dead.map(d=>d.context))].sort();
          const expectedContexts=['@media (max-width: 380px)','@media (max-width: 760px)'];
          if(JSON.stringify(contexts)!==JSON.stringify(expectedContexts))throw new Error(`context drift ${JSON.stringify(contexts)}`);
          if(parent.dead.some(d=>d.important||d.winnerImportant))throw new Error('unexpected !important in dead/winner rows');
          const identical=parent.dead.filter(d=>d.value===d.winnerValue&&d.important===d.winnerImportant).length;
          if(identical!==26)throw new Error(`identical winner drift ${identical}`);
          console.log(`STATIC CASCADE PASS|decl=294|dead=78|families=17|identical=${identical}|changed=${78-identical}|contexts=380,760|important=0`);

          const importer=fs.readFileSync(IMPORTER,'utf8');
          if(!importer.includes('workers-mobile-fullscreen-contract.css'))throw new Error('direct importer missing target');
          const index=fs.readFileSync('index.html','utf8'), results=fs.readFileSync('resultados.html','utf8'), runtime=fs.readFileSync(RUNTIME,'utf8');
          for(const [name,html] of [['index.html',index],['resultados.html',results]]){
            if(!html.includes('data-worker-preview'))throw new Error(`${name} missing real worker preview root`);
            if(!html.includes('worker-preview__stage')||!html.includes('worker-preview__comments')||!html.includes('worker-preview__feed'))throw new Error(`${name} missing preview anatomy`);
          }
          if(!index.includes('data-worker-trigger'))throw new Error('index missing real worker trigger');
          if(results.includes('data-worker-trigger'))throw new Error('results static trigger classification drift');
          for(const token of ["window.DokeHomeWorkers","createFeedItem","worker-preview__item","worker-preview__reel","worker-preview__actions","worker-preview__caption","classList.add('worker-preview-open')","classList.remove('worker-preview-open')"]){if(!runtime.includes(token))throw new Error(`runtime token missing ${token}`);}
          console.log('REACH PASS|pages=index.html,resultados.html|directImporter=before-after-workers-preview.css|realRoots=2|homeRealTrigger=1|resultsRuntimeActivationShim=1|runtime=workers.js');

          const keys=[...new Map(parent.dead.map(d=>[`${d.selector}|||${d.property}`,{selector:d.selector,property:d.property}])).values()].sort((a,b)=>(a.selector+a.property).localeCompare(b.selector+b.property));
          async function capture(label){
            const browser=await chromium.launch({headless:true});const out=[];
            try{
              for(const pageName of pages){for(const vp of viewports){
                const page=await browser.newPage({viewport:vp});
                await page.route('**/*',route=>{const req=route.request(),url=req.url();if(!url.startsWith(BASE))return route.abort();if(req.resourceType()==='script')return route.abort();return route.continue();});
                await page.goto(`${BASE}/${pageName}`,{waitUntil:'domcontentloaded',timeout:30000});
                await page.addScriptTag({content:runtime});
                const activation=await page.evaluate((pageName)=>{
                  const root=document.querySelector('[data-worker-preview]'); if(!root) return {ok:false,why:'root'};
                  let trigger=document.querySelector('[data-worker-trigger]'); let shim=false;
                  if(!trigger){trigger=document.createElement('button');trigger.type='button';trigger.dataset.workerTrigger='';trigger.dataset.workerId='vid-pintura';trigger.hidden=true;document.body.appendChild(trigger);shim=true;}
                  if(!window.DokeHomeWorkers?.create)return {ok:false,why:'runtime'};
                  window.DokeHomeWorkers.create({});trigger.click();return {ok:true,shim,pageName};
                },pageName);
                if(!activation.ok)throw new Error(`${label} ${pageName} activation failed ${JSON.stringify(activation)}`);
                await page.waitForFunction(()=>document.body.classList.contains('worker-preview-open')&&document.querySelector('[data-worker-preview]')?.hidden===false&&document.querySelector('.worker-preview__item'),null,{timeout:10000});
                const snap=await page.evaluate(({keys,pageName,label,activation})=>{
                  const styles={};const rects={};
                  for(const k of keys){const el=document.querySelector(k.selector);if(!el)throw new Error(`missing affected selector: ${k.selector}`);const id=`${k.selector}|||${k.property}`;styles[id]=getComputedStyle(el).getPropertyValue(k.property).trim();if(!(k.selector in rects)){const r=el.getBoundingClientRect();rects[k.selector]=[r.x,r.y,r.width,r.height].map(v=>Math.round(v*1000)/1000);}}
                  const root=document.querySelector('[data-worker-preview]'), rr=root.getBoundingClientRect();
                  return {page:pageName,width:innerWidth,height:innerHeight,activationShim:activation.shim,styles,rects,root:[rr.x,rr.y,rr.width,rr.height].map(v=>Math.round(v*1000)/1000),overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),rootVisible:!root.hidden&&getComputedStyle(root).display!=='none',feedItems:document.querySelectorAll('.worker-preview__item').length,label};
                },{keys,pageName,label,activation});
                if(!snap.rootVisible||snap.feedItems<1)throw new Error(`${label} ${pageName}/${vp.width} preview not materialized`);
                out.push(snap);await page.close();
              }}
            } finally {await browser.close();}
            return out;
          }
          (async()=>{
            const before=await capture('parent');fs.writeFileSync('/tmp/ux058-parent.json',JSON.stringify(before));
            const missingBefore=before.filter(x=>Object.keys(x.styles).length!==keys.length);if(missingBefore.length)throw new Error('parent affected coverage incomplete');
            const lines=parentSrc.split(/\r?\n/), remove=new Set(parent.dead.map(d=>d.line));
            if(remove.size!==78)throw new Error(`remove line cardinality ${remove.size}`);
            const candidateSrc=lines.filter((_,i)=>!remove.has(i+1)).join('\n');fs.writeFileSync(TARGET,candidateSrc);
            const candidate=parse(candidateSrc);if(candidate.declarations.length!==216||candidate.dead.length!==0)throw new Error(`candidate target ${candidate.declarations.length}/${candidate.dead.length}`);
            const hash=crypto.createHash('sha256').update(candidateSrc).digest('hex'),bytes=Buffer.byteLength(candidateSrc);
            const names=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim();if(names!==TARGET)throw new Error(`candidate scope ${names}`);
            const ns=cp.execFileSync('git',['diff','--numstat','--',TARGET],{encoding:'utf8'}).trim().split(/\s+/);if(ns[0]!=='0'||ns[1]!=='78')throw new Error(`candidate numstat ${ns.join('/')}`);
            cp.execFileSync('git',['diff','--check']);
            console.log(`CANDIDATE IDENTITY|sha256=${hash}|bytes=${bytes}|decl=294->216|dead=78->0|files=1|additions=0|deletions=78`);
            const after=await capture('candidate');
            const strip=x=>x.map(({label,...rest})=>rest);const a=JSON.stringify(strip(before)),b=JSON.stringify(strip(after));if(a!==b){fs.writeFileSync('/tmp/ux058-after.json',JSON.stringify(after,null,2));throw new Error('browser parent/candidate parity mismatch');}
            const overflowMax=Math.max(...after.map(x=>x.overflow));
            if(overflowMax!==0)throw new Error(`horizontal overflow ${overflowMax}`);
            console.log(`BROWSER PARITY PASS|pages=2|viewports=${viewports.map(v=>v.width).join(',')}|capturesBefore=${before.length}|capturesAfter=${after.length}|families=17|styleKeys=${keys.length}|runtimeDiffs=0|overflow=0|boundaries=379/380/381+759/760/761|resultsActivationShim=realRoot+realRuntime`);
            fs.writeFileSync('/tmp/ux058-candidate-meta.json',JSON.stringify({hash,bytes,decl:216,dead:0,selectors:17,styleKeys:keys.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/ux058-proof.js

      - name: Responsive contract on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/ux058-responsive.log
          grep -q 'Checks: 893' /tmp/ux058-responsive.log
          grep -q 'Failures: 0' /tmp/ux058-responsive.log
          grep -q 'Skips: 277' /tmp/ux058-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and residual proof
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/ux058-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/ux058-conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/ux058-dup.log
          grep -q 'Duplicate groups: 0' /tmp/ux058-dup.log
          grep -q 'Duplicated files: 0' /tmp/ux058-dup.log
          npm run audit:domain-completion-matrix | tee /tmp/ux058-domain.log
          grep -q 'Domains: 23' /tmp/ux058-domain.log
          grep -q 'Critical flows: 15' /tmp/ux058-domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/ux058-domain.log
          grep -q 'Critical blockers: 12' /tmp/ux058-domain.log
          # Known generated authority docs are parent-stale derived outputs; isolate them from product scope.
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}
          const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push(d);if(!l||d.important||!l.important)last.set(k,d)}return{declarations:ds.length,dead:dead.length}}
          if(active.size!==401||high.length!==37)throw new Error(`active/high drift ${active.size}/${high.length}`);let files=0,total=0,highDead=0;for(const f of active){const p=parse(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++}}
          const target=parse(meta.get(process.env.TARGET_FILE).text),p057=parse(meta.get('assets/css/components/chat-composer.css').text),p056=parse(meta.get('assets/css/components/before-after-workers-preview/mobile-comment-sheets.css').text),p055=parse(meta.get('assets/css/patterns/settings-shell.css').text),p054=parse(meta.get('assets/css/components/before-after-workers-preview/publication-light-modal.css').text);
          if(files!==16||total!==361||highDead!==0)throw new Error(`residual drift ${files}/${total}/${highDead}`);if(target.declarations!==216||target.dead!==0)throw new Error(`target drift ${target.declarations}/${target.dead}`);if(p057.declarations!==125||p057.dead||p056.declarations!==302||p056.dead||p055.declarations!==104||p055.dead||p054.declarations!==75||p054.dead)throw new Error('prior guard drift');
          console.log('RESIDUAL PASS|active=401|high=37|files=16|dead=361|highDead=0|target=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t78\t'"$TARGET_FILE"
          git diff --check
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json >/tmp/ux058-audit.json
          code=$?
          set -e
          node <<'NODE'
          const a=require('/tmp/ux058-audit.json');const v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);
          NODE
          echo "npmAuditExit=$code"

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux058-http.pid; then kill "$(cat /tmp/ux058-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER")" = "$IMPORTER_BLOB"
          test "$(git hash-object "$RUNTIME_JS")" = "$RUNTIME_BLOB"
          test -z "$(git status --porcelain)"
          echo "RESTORE PASS|sha=$TARGET_SHA|productMutation=0|issueCreated=0|prCreated=0"
