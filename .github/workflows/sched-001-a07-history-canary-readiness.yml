name: Doke SCHED-A07 Migration History and Canary Readiness

on:
  pull_request:
    paths:
      - 'config/sched-001-a07-history-canary-readiness.json'
      - 'docs/SCHED-001-A07-MIGRATION-HISTORY-CANARY-READINESS.md'
      - 'docs/validation/SCHED-001-A07-MIGRATION-HISTORY-CANARY-READINESS.json'
      - 'scripts/plan-sched-001-a07-history-canaries.js'
      - 'scripts/test-sched-001-a07-history-canary-readiness.js'
      - 'scripts/audit-sched-001-a07-history-canary-readiness.js'
      - 'scripts/reconcile-sched-001-a07-once.js'
      - 'supabase/tests/020_sched_a07_rolled_back_canaries.sql'
      - 'config/domain-completion-matrix.json'
      - 'package.json'
      - '.github/workflows/sched-001-a07-history-canary-readiness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readiness:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile SCHED-A07 matrix and living gates
        run: node scripts/reconcile-sched-001-a07-once.js
      - name: Restore permanent read-only workflow and remove temporary assets
        run: |
          cat > .github/workflows/sched-001-a07-history-canary-readiness.yml <<'YAML'
          name: Doke SCHED-A07 Migration History and Canary Readiness

          on:
            pull_request:
              paths:
                - 'config/sched-001-a07-history-canary-readiness.json'
                - 'docs/SCHED-001-A07-MIGRATION-HISTORY-CANARY-READINESS.md'
                - 'docs/validation/SCHED-001-A07-MIGRATION-HISTORY-CANARY-READINESS.json'
                - 'scripts/plan-sched-001-a07-history-canaries.js'
                - 'scripts/test-sched-001-a07-history-canary-readiness.js'
                - 'scripts/audit-sched-001-a07-history-canary-readiness.js'
                - 'supabase/tests/020_sched_a07_rolled_back_canaries.sql'
                - 'config/domain-completion-matrix.json'
                - 'package.json'
                - '.github/workflows/sched-001-a07-history-canary-readiness.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            readiness:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                - name: Audit SCHED-A07 migration history and canary readiness
                  run: node scripts/audit-sched-001-a07-history-canary-readiness.js
                - name: Test SCHED-A07 authorization firewall and rollback contract
                  run: node scripts/test-sched-001-a07-history-canary-readiness.js
                - name: Prove SCHED-A07 planner remains dry-run only
                  run: node scripts/plan-sched-001-a07-history-canaries.js
                - name: Preserve SCHED-A05 persistence readiness
                  run: |
                    node scripts/audit-sched-001-a05-persistence-readiness.js
                    node scripts/test-sched-001-a05-postgres-repository-runtime.js
                    node scripts/test-sched-001-a05-staging-readiness.js
                - name: Preserve cumulative scheduling and order contracts
                  run: |
                    node scripts/audit-sched-001-a04-server-command-runtime.js
                    node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
                    node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
                    node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
                    node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
                    node scripts/audit-ord-001-a10-blocker-reconciliation.js
                - name: Audit completion matrix
                  run: node scripts/audit-domain-completion-matrix.js
          YAML
          rm -f .github/workflows/sched-001-a07-reconcile-once.yml
          rm -f scripts/reconcile-sched-001-a07-once.js
          rm -f config/sched-a07-reconcile-trigger.txt
          node scripts/audit-domain-completion-matrix.js --write
      - name: Validate reconciled SCHED-A07 assets
        run: |
          node scripts/test-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-domain-completion-matrix.js
      - name: Commit reconciliation when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js scripts/audit-sched-001-a03-reservation-migration-local-contract.js scripts/audit-sched-001-a04-server-command-runtime.js scripts/audit-sched-001-a05-persistence-readiness.js scripts/audit-sched-001-a07-history-canary-readiness.js scripts/audit-ord-001-a10-blocker-reconciliation.js scripts/audit-ord-001-a11-scheduling-authority-handoff.js .github/workflows/sched-001-a07-history-canary-readiness.yml .github/workflows/sched-001-a07-reconcile-once.yml scripts/reconcile-sched-001-a07-once.js config/sched-a07-reconcile-trigger.txt
          git commit -m 'Reconcile SCHED-A07 migration history readiness'
          git push origin HEAD:ord/ord-001-baseline-audit
