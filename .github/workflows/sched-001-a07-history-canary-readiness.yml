name: SCHED-A09 Documentation and Matrix Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/sched-001-a07-history-canary-readiness.yml'
      - 'scripts/close-sched-001-a09-documentation-matrix.js'
      - 'scripts/patch-sched-001-a09-cumulative-audits.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sched-a09-documentation-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  close-a09:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply SCHED-A09 documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          export SCHED_A09_UPDATED_AT="$(TZ=America/Bahia date -Iseconds)"
          node scripts/patch-sched-001-a09-cumulative-audits.js
          node scripts/close-sched-001-a09-documentation-matrix.js

      - name: Regenerate and validate canonical matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          npm run audit:sched-001-a02-command-event-timezone-conflict-contract
          npm run audit:sched-001-a03-reservation-migration-local-contract
          npm run audit:sched-001-a04-server-command-runtime
          npm run test:sched-001-a04-scheduling-service-runtime
          npm run audit:sched-001-a05-persistence-readiness
          npm run test:sched-001-a05-postgres-repository-runtime
          npm run audit:ord-001-a10-blocker-reconciliation
          npm run audit:ord-001-a11-scheduling-authority-handoff
          npm run audit:sched-001-a07-history-canary-readiness

      - name: Remove temporary scripts only
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/close-sched-001-a09-documentation-matrix.js
          rm -f scripts/patch-sched-001-a09-cumulative-audits.js

      - name: Commit and push validated non-workflow closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            config/domain-completion-matrix.json \
            config/sched-001-a09-staging-reconciliation.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            docs/SCHED-001-A09-STAGING-RECONCILIATION.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/audit-ord-001-a10-blocker-reconciliation.js \
            scripts/audit-ord-001-a11-scheduling-authority-handoff.js \
            scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js \
            scripts/audit-sched-001-a03-reservation-migration-local-contract.js \
            scripts/audit-sched-001-a04-server-command-runtime.js \
            scripts/audit-sched-001-a05-persistence-readiness.js \
            scripts/close-sched-001-a09-documentation-matrix.js \
            scripts/patch-sched-001-a09-cumulative-audits.js

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'SCHED_A09_WORKFLOW_MUTATION_STAGED' >&2
            exit 31
          fi

          git diff --cached --check
          git commit -m "docs(sched): close A09 staging reconciliation evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
