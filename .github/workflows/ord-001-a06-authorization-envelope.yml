name: Doke ORD-A06 Authorization Envelope

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a06-authorization-envelope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-generated-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate matrix derivatives only
        shell: bash
        run: |
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Matrix derivatives already current."
            exit 0
          fi
          git commit -m "Regenerate domain completion matrix derivatives"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
