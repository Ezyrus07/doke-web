name: Doke ORD-A06 Authorization Envelope

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a06-authorization-envelope.yml'
      - 'scripts/reconcile-ord-a07-request-freshness-once.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-ord-a07:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and validate ORD-A07
        shell: bash
        run: |
          python scripts/reconcile-ord-a07-request-freshness-once.py
          node scripts/test-order-request-freshness-runtime.js
          node scripts/audit-ord-001-a07-request-freshness.js
          node scripts/audit-ord-001-a03-command-boundary.js
          node scripts/audit-ord-001-a05-command-activation.js
          node scripts/audit-ord-001-a06-playwright-executor.js
          node scripts/audit-ord-001-a06-authorization-envelope.js
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add backend/shared/security/request-freshness-contract.js backend/shared/security/persistent-idempotency-store.js backend/shared/http/create-action-handler.js backend/shared/http/route-registry.js backend/runtime/staging/node-http-server.js assets/js/services/orders-service.js scripts/test-order-request-freshness-runtime.js scripts/audit-ord-001-a07-request-freshness.js docs/ORD-001-A07-REQUEST-FRESHNESS.md docs/validation/ORD-001-A07-REQUEST-FRESHNESS.json package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md scripts/reconcile-ord-a07-request-freshness-once.py
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden ORD-A07 request freshness and replay resistance'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
