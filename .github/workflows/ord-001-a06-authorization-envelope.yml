name: Doke ORD-A06 Authorization Envelope

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a06-authorization-envelope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish non-workflow authorization integration
        shell: bash
        run: |
          node scripts/reconcile-ord-a06-authorization-envelope-once.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/prepare-ord-001-a06-authorization-envelope.js --dry-run
          node scripts/audit-ord-001-a06-playwright-executor.js
          node scripts/execute-ord-001-a06-visual-settlement-playwright.js --dry-run
          node scripts/audit-ord-001-a06-execution-readiness.js
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-domain-completion-matrix.js
          git add scripts/execute-ord-001-a06-visual-settlement-playwright.js package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md docs/ORD-001-A06-PLAYWRIGHT-EXECUTOR.md docs/validation/ORD-001-A06-PLAYWRIGHT-EXECUTOR.json
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce ORD-A06 authorization envelope"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
