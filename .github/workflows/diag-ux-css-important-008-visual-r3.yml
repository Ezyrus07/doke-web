        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: visual
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/visual.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8'),removed=0;if((s.match(/!important\b/g)||[]).length!==43)throw Error('parent');function strip(selector,expected){const key=selector+' {';const i=s.indexOf(key);if(i<0||s.indexOf(key,i+1)>=0)throw Error('selector '+selector);const b=s.indexOf('{',i),e=s.indexOf('}',b);let block=s.slice(b+1,e);const before=(block.match(/!important\b/g)||[]).length;if(before!==expected)throw Error(`count ${selector}`);block=block.replace(/\s*!important\b/g,'');removed+=before;s=s.slice(0,b+1)+block+s.slice(e)}strip(':is(.service-card, .service-card--feed, .service-card--result, .comparison-card, .pro-card)',1);strip(':is(.service-card, .service-card--feed, .service-card--result)',1);strip(':is(.service-card, .service-card--feed, .service-card--result) .service-card__media',4);strip(':is(.service-card, .service-card--feed, .service-card--result) .service-card__body',2);strip(':is(.service-card, .service-card--feed, .service-card--result) .service-card__footer',2);strip(':is(.service-card, .service-card--feed, .service-card--result) .service-card__cta',2);strip(':is(.service-card, .service-card--feed, .service-card--result) .service-card__tags span',2);strip(':is(.service-card, .service-card--feed, .service-card--result) .service-card__tags span:nth-child(n + 3)',1);strip(':is(.comparison-card__body, .profile-posts-stack .comparison-card__body)',1);strip('body.home-index-shell :is(.featured-services, .more-services) .service-card--feed .service-card__media,\n  body.search-results-body .results-layout :is(.results-grid, .results-empty__grid) .service-card--result .service-card__media,\n  body.profile-page-shell .profile-services-results .service-card--feed .service-card__media',3);strip('body.home-index-shell :is(.featured-services, .more-services) .service-card--feed,\n  body.search-results-body .results-layout :is(.results-grid, .results-empty__grid) .service-card--result,\n  body.profile-page-shell .profile-services-results .service-card--feed,\n  body.profile-page-shell .profile-services-results .service-card',1);strip('body.home-index-shell .comparison-grid > .comparison-card .comparison-card__visual,\n  body.search-results-body .results-layout :is(.results-grid, .results-before-after-grid) > .comparison-card .comparison-card__visual,\n  body.profile-page-shell .profile-posts-stack .comparison-grid > .comparison-card .comparison-card__visual',3);const z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex');if(removed!==23||(s.match(/!important\b/g)||[]).length!==20||h!==process.env.CANDIDATE_SHA256)throw Error('identity');fs.writeFileSync('/tmp/candidate.css',s);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=43->20|priorityMarkersRemoved=23`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/candidate.css','utf8'),browser=await chromium.launch({headless:true}),widths=[359,379,380,381,430,560,561],railWidths=new Set([359,380,560]),modalWidths=new Set([359,380,560]),hash=b=>crypto.createHash('sha256').update(b).digest('hex'),items=Array.from({length:8},(_,i)=>({id:`i008-${i}`,serviceId:`i008-${i}`,status:'active',title:`Serviço ${i}`,category:'Reformas',providerName:`Profissional ${i}`,providerHandle:`prof${i}`,rating:4.9,reviewsCount:20+i,price:120+i*10,location:'Salvador, BA',tags:['seguro','rapido']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));await p.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));await p.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:200,contentType:'font/woff2',body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.route('https://unpkg.com/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.goto(`http://127.0.0.1:4173/index.html?i008=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(450);await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:6000});await p.evaluate(items=>{const featured=document.querySelector('#featured-services-track'),more=document.querySelector('[data-more-services-grid]');if(!featured||!more)throw Error('grids');featured.textContent='';more.textContent='';items.slice(0,6).forEach(x=>featured.appendChild(window.Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>more.appendChild(window.Doke.publicServiceCard.create(x,{results:true})));},items);if(state==='rail'){await p.evaluate(()=>{const e=document.querySelector('#featured-services-track');e.scrollLeft=Math.max(1,e.scrollWidth-e.clientWidth)});await p.waitForTimeout(120)}if(state==='modal'){await p.waitForFunction(()=>Boolean(window.DokeHomeBeforeAfter?.create),null,{timeout:6000});await p.evaluate(()=>window.DokeHomeBeforeAfter.create());await p.locator('[data-before-after-id="case-bathroom"]').click();await p.waitForFunction(()=>{const e=document.querySelector('[data-before-after-preview]');return Boolean(e&&!e.hidden&&e.getAttribute('aria-hidden')!=='true')},null,{timeout:3000});await p.waitForTimeout(120)}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(()=>{const legacy=document.querySelectorAll('.service-card,.service-card--feed,.service-card--result,.comparison-card,.pro-card,.comparison-card__body').length,ads=document.querySelectorAll('.doke-ad-card').length,grids=document.querySelectorAll('.service-grid').length,videos=document.querySelectorAll('.video-card').length,visuals=document.querySelectorAll('.comparison-card__visual').length;const get=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{display:c.display,position:c.position,overflow:c.overflow,width:c.width,height:c.height,grid:c.gridTemplateColumns,rect:[Math.round(r.x*1000)/1000,Math.round(r.y*1000)/1000,Math.round(r.width*1000)/1000,Math.round(r.height*1000)/1000]}};return{legacy,ads,grids,videos,visuals,featured:get('#featured-services-track'),more:get('[data-more-services-grid]'),video:get('.video-card'),comparison:get('.comparison-card__visual')}});if(data.legacy!==0||data.ads!==8||data.grids<2||data.videos<6)throw Error('runtime anatomy '+JSON.stringify(data));if(state==='modal'&&data.visuals<1)throw Error('modal visual missing');const png=hash(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
          const states=[];for(const w of widths){states.push([w,'default']);if(railWidths.has(w))states.push([w,'rail']);if(modalWidths.has(w))states.push([w,'modal'])}const A={},B={};fs.writeFileSync(f,P);for(const [w,s] of states)A[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,C);for(const [w,s] of states)B[`${w}-${s}`]=await cap(w,s,'candidate');let md=0,sd=0,pe=0;const keys=[];for(const k of Object.keys(A)){pe+=A[k].errs.length+B[k].errs.length;if(JSON.stringify(A[k].data)!==JSON.stringify(B[k].data)){md++;keys.push(k)}if(A[k].png!==B[k].png){sd++;if(!keys.includes(k))keys.push(k)}}console.log(`VISUAL PASS|states=${states.length}|viewports=${widths.join(',')}|railStates=${railWidths.size}|modalStates=${modalWidths.size}|screenshots=${states.length}|metadataDiffs=${md}|screenshotDiffs=${sd}|pageErrors=${pe}|legacyNodes=0|featuredCards=6|moreCards=2|workerCards=6|productRenderer=1|syntheticDOM=0|criteriaRelaxed=0`);if(md||sd||pe)throw Error('diff '+keys.join(','));await browser.close();fs.writeFileSync(f,P)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"
          git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA" >/dev/null
          git clean -fdx >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if test '${{ steps.visual.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "VISUAL=${{ steps.visual.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|VISUAL PASS)\|' /tmp/visual.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 260 /tmp/visual.log || true; fi; } >/tmp/out.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 008 visual proof r3 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
