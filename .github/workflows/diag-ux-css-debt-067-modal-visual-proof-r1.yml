name: Doke UX-CSS-DEBT-067 Modal Visual Proof R1

on:
  push:
    branches:
      - diag/ux-css-debt-067-modal-visual-proof-r1

permissions:
  contents: read

jobs:
  proof-r1:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 460120dbda36a407a143cfeb1471d46859be62ed
      PARENT_SHA: 2937218b2ecfa9b59586d4fd1c2f6361c103e786
      TARGET_FILE: assets/css/components/overlays/modal-visual-contract.css
      TARGET_BLOB: 2fd0b2fc22c9437052e00442848c0ed93966021a
      CARTEIRA_HTML_BLOB: 6482a94c5e1386ce30634f4e6b453875c4af8645
      COMUNIDADE_HTML_BLOB: aeb03acca897a4949e02699c55af5c24a9f8d6f5
      COMUNIDADE_INTERNA_HTML_BLOB: ba3923026a532fa86f0784f34c3db71a2759ee11
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-066 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object carteira.html)" = "$CARTEIRA_HTML_BLOB"
          test "$(git hash-object comunidade.html)" = "$COMUNIDADE_HTML_BLOB"
          test "$(git hash-object comunidade-interna.html)" = "$COMUNIDADE_INTERNA_HTML_BLOB"
          test -z "$(git status --porcelain)"
          echo "R1 INPUT PASS|sha=$TARGET_SHA|targetBlob=$TARGET_BLOB|pages=3|realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          python3 -m http.server 4175 >/tmp/ux067-r1-http.log 2>&1 &
          echo $! >/tmp/ux067-r1-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4175/carteira.html >/dev/null
          curl -fsS http://127.0.0.1:4175/comunidade.html >/dev/null
          curl -fsS http://127.0.0.1:4175/comunidade-interna.html >/dev/null

      - name: Browser parity on real modal surfaces
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ux067-r1.js <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const target=process.env.TARGET_FILE,original=fs.readFileSync(target,'utf8'),lines=original.split('\n');
          const expected='  display: grid;';if((lines[81]||'').replace(/\r$/,'')!==expected)throw new Error(`row 82 drift ${JSON.stringify(lines[81])}`);
          const candidate=lines.filter((_,i)=>i!==81).join('\n');
          const hash=crypto.createHash('sha256').update(Buffer.from(candidate)).digest('hex'),bytes=Buffer.byteLength(candidate);
          const pages=['carteira.html','comunidade.html','comunidade-interna.html'],widths=[359,430,759,760,761,1024,1280];
          const arms={overlay:'.doke-modal-surface.doke-overlay__surface',modal:'.doke-modal-surface.doke-modal__surface',action:'.doke-modal-surface.doke-action-modal__surface',financial:'.doke-modal-surface.doke-financial-modal__surface'};
          const selector=Object.values(arms).join(',');
          const props=['display','position','width','max-width','height','max-height','overflow-x','overflow-y','grid-template-rows','padding-top','padding-right','padding-bottom','padding-left','border-top-left-radius','border-top-right-radius','border-bottom-right-radius','border-bottom-left-radius','background-color','box-shadow','box-sizing'];
          async function capture(tag){const browser=await chromium.launch({headless:true});const out=[];const coverage=new Map(Object.keys(arms).map(k=>[k,0])),visible=new Map(Object.keys(arms).map(k=>[k,0]));try{for(const pageName of pages){for(const width of widths){const ctx=await browser.newContext({viewport:{width,height:900},javaScriptEnabled:false});const page=await ctx.newPage();await page.route('**/*',r=>{const u=new URL(r.request().url());if(!['127.0.0.1','localhost'].includes(u.hostname)||u.pathname.endsWith('.js'))return r.abort();return r.continue()});await page.goto(`http://127.0.0.1:4175/${pageName}?ux067=${tag}-${width}`,{waitUntil:'domcontentloaded'});await page.evaluate(sel=>{for(const surface of document.querySelectorAll(sel)){for(let el=surface;el;el=el.parentElement){if(el.hasAttribute('hidden'))el.removeAttribute('hidden');if(el.getAttribute('aria-hidden')==='true')el.setAttribute('aria-hidden','false');if(el.tagName==='DIALOG')el.setAttribute('open','')}}},selector);await page.waitForTimeout(120);const snap=await page.evaluate(({arms,props})=>{const result={};for(const [k,s] of Object.entries(arms)){result[k]=[...document.querySelectorAll(s)].map((el,i)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return{i,id:el.id||'',cls:typeof el.className==='string'?el.className:'',props:Object.fromEntries(props.map(p=>[p,cs.getPropertyValue(p)])),rect:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*1000)/1000),visible:r.width>0&&r.height>0&&cs.display!=='none'}})}return{result,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}},{arms,props});for(const [k,v] of Object.entries(snap.result)){coverage.set(k,coverage.get(k)+v.length);visible.set(k,visible.get(k)+v.filter(x=>x.visible).length)}out.push({page:pageName,width,snap});await ctx.close()}}}finally{await browser.close()}for(const k of Object.keys(arms)){if(!coverage.get(k))throw new Error(`missing arm ${k}`);if(!visible.get(k))throw new Error(`no visible real DOM state for arm ${k}`)}console.log(`COVERAGE|${tag}|arms=4/4|pages=3|viewports=7|samples=${[...coverage.values()].reduce((a,b)=>a+b,0)}|visibleSamples=${[...visible.values()].reduce((a,b)=>a+b,0)}|overlay=${coverage.get('overlay')}/${visible.get('overlay')}|modal=${coverage.get('modal')}/${visible.get('modal')}|action=${coverage.get('action')}/${visible.get('action')}|financial=${coverage.get('financial')}/${visible.get('financial')}|boundary=759/760/761`);return out}
          (async()=>{try{fs.writeFileSync(target,original);const parent=await capture('parent');fs.writeFileSync(target,candidate);const cand=await capture('candidate');const a=JSON.stringify(parent),b=JSON.stringify(cand);if(a!==b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;throw new Error(`runtime drift idx=${i} parent=${a.slice(i,i+900)} candidate=${b.slice(i,i+900)}`)}const maxOverflow=Math.max(...parent.map(x=>x.snap.overflow));console.log(`BROWSER PARITY PASS|pages=3|arms=4/4|viewports=7|snapshots=${parent.length}|computedStyleDiffs=0|geometryDiffs=0|runtimeDiffs=0|maxOverflow=${maxOverflow}|boundary=759/760/761|realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0`);console.log(`CANDIDATE IDENTITY|sha256=${hash}|bytes=${bytes}|declarations=475|superseded=0|files=1|additions=0|deletions=1`);fs.writeFileSync(target,candidate)}catch(e){fs.writeFileSync(target,original);throw e}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node --check /tmp/ux067-r1.js
          node /tmp/ux067-r1.js | tee /tmp/ux067-r1.log
          grep -q 'COVERAGE|parent|arms=4/4|pages=3|viewports=7' /tmp/ux067-r1.log
          grep -q 'COVERAGE|candidate|arms=4/4|pages=3|viewports=7' /tmp/ux067-r1.log
          grep -q 'BROWSER PARITY PASS|pages=3|arms=4/4|viewports=7|snapshots=21|computedStyleDiffs=0|geometryDiffs=0|runtimeDiffs=0' /tmp/ux067-r1.log
          grep -q 'realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0' /tmp/ux067-r1.log
          grep -q 'CANDIDATE IDENTITY' /tmp/ux067-r1.log
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          git diff --check
          echo 'R1 PROOF PASS|browserRequired=1|realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0|candidateLeftForDiff=1'

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux067-r1-http.pid; then kill "$(cat /tmp/ux067-r1-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo "R1 RESTORE PASS|sha=$TARGET_SHA|productMutation=0|permanentBranchMutation=0"
