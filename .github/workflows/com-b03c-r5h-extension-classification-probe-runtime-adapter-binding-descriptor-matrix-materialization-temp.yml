name: COM-B03C R5H Runtime Adapter Binding Descriptor Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "464da427e58a4c957958419b6ec82f9e240d1c63"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed runtime adapter binding descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-boundary.json)" = "264b19934567a62f49d95fb266e4655979b89629"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-boundary.yml)" = "5ac920eaf58efe33847776f6eb017936d7be8a8e"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js)" = "6fc34e1b365ec801665fdab0c7d0c6761a8013e6"
          node - <<'NODE'
          const descriptor = require('./config/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-boundary.json');
          const binding = descriptor.runtimeAdapterBindingDescriptor;
          if (descriptor.contractId !== 'com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-boundary-v1') throw new Error('DESCRIPTOR_CONTRACT_DRIFT');
          if (descriptor.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || descriptor.functionalCheckpoint.r5iCreated !== false || descriptor.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (binding.runtimeAdapterBindingDescriptorDefined !== true || binding.runtimeAdapterBindingDefined !== false || binding.runtimeAdapterBound !== false || binding.transportBound !== false || binding.bindingBoundaryHead !== null) throw new Error('DESCRIPTOR_STATE_DRIFT');
          if (binding.adapterModuleBlob !== '6fc34e1b365ec801665fdab0c7d0c6761a8013e6') throw new Error('ADAPTER_BLOB_DRIFT');
          if (Object.values(descriptor.concreteBindingState).some(value => value !== null)) throw new Error('CONCRETE_BINDING_STATE_MUST_REMAIN_NULL');
          if (descriptor.governance.remoteExecutionAuthority !== false || descriptor.governance.networkAuthority !== false || descriptor.governance.stagingReadAuthority !== false || descriptor.governance.stagingMutationAuthority !== false) throw new Error('REMOTE_AUTHORITY_FORBIDDEN');
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-descriptor-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for runtime adapter binding descriptor" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
