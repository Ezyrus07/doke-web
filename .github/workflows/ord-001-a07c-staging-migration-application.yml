name: Doke ORD-A07C Staging Migration Application

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260730153500_ord_a07c_worker_invocation_headers.sql'
      - 'config/ord-001-a07c-staging-migration-application.json'
      - 'docs/ORD-001-A07C-STAGING-MIGRATION-APPLICATION.md'
      - 'docs/validation/ORD-001-A07C-STAGING-MIGRATION-APPLICATION.json'
      - 'scripts/audit-ord-001-a07c-staging-migration-application.js'
      - '.github/workflows/ord-001-a07c-staging-migration-application.yml'
      - 'config/domain-completion-matrix.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit staging migration application evidence
        run: node scripts/audit-ord-001-a07c-staging-migration-application.js
      - name: Preserve A07C readiness contract
        run: |
          node scripts/test-ord-001-a07c-staging-migration-readiness.js
          node scripts/audit-ord-001-a07c-staging-migration-readiness.js
      - name: Preserve worker header issuance contract
        run: |
          node scripts/test-ord-001-a07c-worker-invocation-headers.mjs
          node scripts/audit-ord-001-a07c-worker-invocation-headers.js
      - name: Preserve A07B application and freshness contracts
        run: |
          node scripts/audit-ord-001-a07b-staging-migration-application.js
          node scripts/test-order-event-worker-invocation-freshness.js
          node scripts/audit-ord-001-a07b-worker-invocation-freshness.js
      - name: Preserve Edge freshness and replay gates
        run: |
          node scripts/audit-ord-001-a07d-edge-function-freshness-wiring.js
          node scripts/audit-ord-001-a07e-concurrent-replay-canary.js
      - name: Audit completion matrix
        run: node scripts/audit-domain-completion-matrix.js
