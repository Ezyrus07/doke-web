name: UX-FILTERS-001 Sonar Inspect

on:
  push:
    branches:
      - ux/ux-filters-001-applied-draft
    paths:
      - '.github/workflows/ux-filters-001-sonar-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Sonar pull request findings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            --data-urlencode 'componentKeys=Ezyrus07_doke-web' \
            --data-urlencode 'pullRequest=70' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' \
            'https://sonarcloud.io/api/issues/search' \
            | jq -r '.issues[] | [.type, .severity, .rule, .component, (.line // .textRange.startLine // 0), .message] | @tsv'
