name: TEMP UX-CSS-IMPORTANT-052 G7 Permanent Certifier
on:
  push:
    branches:
      - diag/ux-css-important-052-g7-permanent-certifier
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      PARENT: f49f53eca5a742418fbf58c63e16cb94ac040d63
      PARENT_TREE: 2948d69d17c0464edf0e77e6b65e581ecb6ada91
      PERM: 4f861d705eaf288eb3ea7a81ba8df2802464d2b1
      PERM_TREE: a302b917d63f9caa9212765ec6a02c4a807411b0
      TARGET: assets/css/pages/home/mobile-hero-feed.css
      PARENT_BLOB: d323fb51b817ce47bc316d04207853934a72b835
      PERM_BLOB: 88423184a186ca12c7faf365df84543fd3e3a73a
      PERM_SHA256: c7dd56f5e0e90c2becb11f15059c35ed3bd189c0514ef0bb8b714f519c91084c
      MATERIAL_BRANCH: diag/ux-css-important-052-g7-materialize-r4b
      MATERIAL_RECEIPT: .diagnostics/ux-css-important-052-g7-materialization.json
      MATERIAL_RECEIPT_BLOB: f143c1df4190b791f1d39104532f42f3b13dcca7
      PR_NUMBER: '394'
      ISSUE_NUMBER: '392'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify permanent lineage PR evidence and exact G7 transformation
        shell: bash
        run: |
          set -euo pipefail
          DIAG_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$DIAG_HEAD" | awk '{print $2}')" = "$PERM"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PERM^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PARENT:$TARGET")" = "$PARENT_BLOB"
          test "$(git rev-parse "$PERM:$TARGET")" = "$PERM_BLOB"
          test "$(git rev-list --parents -n1 "$PERM")" = "$PERM $PARENT"
          test "$(git merge-base "$PARENT" "$PERM")" = "$PARENT"
          test "$(git rev-list --count "$PARENT..$PERM")" = 1
          test "$(git rev-list --count "$PERM..$PARENT")" = 0
          test "$(git diff --name-only "$PARENT" "$PERM")" = "$TARGET"
          test "$(git diff --numstat "$PARENT" "$PERM" -- "$TARGET")" = $'26\t26\tassets/css/pages/home/mobile-hero-feed.css'
          test "$(git rev-parse "origin/$MATERIAL_BRANCH:$MATERIAL_RECEIPT")" = "$MATERIAL_RECEIPT_BLOB"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" >/tmp/pr.json
          for id in 32968648941 32968754085 32969208922 32969601368; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$id" >"/tmp/run-$id.json"
          done
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
          const pr=JSON.parse(fs.readFileSync('/tmp/pr.json'));
          if(pr.state!=='open'||pr.draft!==true||pr.merged_at!==null||pr.mergeable!==true)throw Error(`pr ${pr.state}/${pr.draft}/${pr.merged_at}/${pr.mergeable}`);
          if(pr.base.sha!==process.env.PARENT||pr.head.sha!==process.env.PERM||pr.commits!==1||pr.changed_files!==1||pr.additions!==26||pr.deletions!==26)throw Error('pr identity drift');
          for(const id of [32968648941,32968754085,32969208922,32969601368]){const r=JSON.parse(fs.readFileSync(`/tmp/run-${id}.json`));if(r.status!=='completed'||r.conclusion!=='success')throw Error(`evidence ${id}: ${r.status}/${r.conclusion}`)}
          const show=(rev,f)=>cp.execFileSync('git',['show',`${rev}:${f}`],{encoding:'utf8'}),f=process.env.TARGET,p=show(process.env.PARENT,f),q=show(process.env.PERM,f),count=s=>(s.match(/!important\b/gi)||[]).length;
          if(count(p)!==27||count(q)!==1)throw Error(`marker count ${count(p)}/${count(q)}`);
          const set=new Set(Array.from({length:26},(_,i)=>i+2));let n=0,r=0;const c=p.replace(/\s*!important\b/gi,m=>{n++;if(set.has(n)){r++;return ''}return m});
          if(n!==27||r!==26||c!==q)throw Error(`ordinal reconstruction ${n}/${r}`);
          if(p.replace(/\s*!important\b/gi,'')!==q.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');
          if(!/\.featured-services\s+\.content-rail\s*\{[\s\S]*?overflow:\s*visible\s*!important\s*;/m.test(q))throw Error('G3 guard lost');
          const sha=crypto.createHash('sha256').update(q).digest('hex'),bytes=Buffer.byteLength(q);if(sha!==process.env.PERM_SHA256||bytes!==35811)throw Error(`sha/bytes ${sha}/${bytes}`);
          const receipt=JSON.parse(show('origin/'+process.env.MATERIAL_BRANCH,process.env.MATERIAL_RECEIPT));
          if(receipt.result!=='PASS'||receipt.issue!==392||receipt.postBoundary!==true||receipt.candidateBlob!==process.env.PERM_BLOB||receipt.metadataDiffs!==0||receipt.screenshotDiffs!==0||receipt.loadDiffs!==0||receipt.pageErrors!==0)throw Error('material receipt drift');
          fs.writeFileSync('/tmp/parent.css',p);fs.writeFileSync('/tmp/permanent.css',q);console.log('PERMANENT_IDENTITY=PASS');
          NODE
          git checkout --detach "$PARENT" >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');const a=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?w(p):p.endsWith('.css')&&a.push(p)}})('assets/css');const n=a.reduce((s,p)=>s+(fs.readFileSync(p,'utf8').match(/!important\b/gi)||[]).length,0);if(n!==69)throw Error(`parent global ${n}`);console.log('PARENT_GLOBAL=69');
          NODE
          git checkout --detach "$PERM" >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');const a=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?w(p):p.endsWith('.css')&&a.push(p)}})('assets/css');const n=a.reduce((s,p)=>s+(fs.readFileSync(p,'utf8').match(/!important\b/gi)||[]).length,0);if(n!==43)throw Error(`perm global ${n}`);console.log('PERM_GLOBAL=43');
          NODE
      - name: Install frozen dependencies
        shell: bash
        run: npm ci --ignore-scripts >/dev/null
      - name: Independently rerun and reconcile 14 static gates
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/matrix.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1"; candidate="$2"; : >"/tmp/$phase.tsv"
          restore(){ git checkout "$PARENT" -- . >/dev/null 2>&1 || exit 90; if [ "$candidate" = 1 ]; then cp /tmp/permanent.css "$TARGET"; fi; }
          gate(){ label="$1"; shift; restore; log="/tmp/$phase-$label.log"; set +e; "$@" >"$log" 2>&1; rc=$?; set -e; sed -E 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$log" >"$log.n"; h=$(sha256sum "$log.n"|awk '{print $1}'); printf '%s\t%s\t%s\n' "$label" "$rc" "$h" >>"/tmp/$phase.tsv"; echo "$phase|$label|rc=$rc|hash=$h"; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/matrix.sh
          git checkout --detach "$PARENT" >/dev/null
          /tmp/matrix.sh parent 0
          /tmp/matrix.sh permanent 1
          node <<'NODE'
          const fs=require('fs'),read=f=>Object.fromEntries(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [k,rc,h]=x.split('\t');return[k,{rc:+rc,h}]}));const p=read('/tmp/parent.tsv'),c=read('/tmp/permanent.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'],debt=['important_reduction_plan','global_css_design_system'];
          for(const k of exact){const a=p[k],b=c[k];if(!a||!b||a.rc!==b.rc||(a.rc!==0&&a.h!==b.h))throw Error(`static regression ${k}`)}
          for(const k of debt){const a=p[k],b=c[k];if(!a||!b||b.rc>a.rc)throw Error(`debt regression ${k}`)}
          if(p.frontend_strict.rc!==c.frontend_strict.rc)throw Error('frontend rc drift');
          const sig=f=>fs.readFileSync(f,'utf8').split('\n').filter(x=>x.includes('**CRITICAL**')||x.includes('**WARNING**')).sort();if(JSON.stringify(sig('/tmp/parent-frontend_strict.log'))!==JSON.stringify(sig('/tmp/permanent-frontend_strict.log')))throw Error('frontend warning drift');
          console.log('STATIC_RESULT=PASS');console.log('INTRODUCED_REGRESSIONS=0');console.log('CRITERIA_RELAXED=0');
          NODE
      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Fresh permanent browser A B with G7 pane-state coverage
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT" >/dev/null
          cp /tmp/parent.css "$TARGET"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true; cp /tmp/parent.css "$TARGET" 2>/dev/null || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/permanent.css','utf8'),widths=[359,379,380,381,390,430,560,561],filters=new Set([359,380,390,560]),states=[];for(const w of widths){states.push([w,'default']);if(filters.has(w))states.push([w,'filters'])}
          const H=b=>crypto.createHash('sha256').update(b).digest('hex'),tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64'),items=Array.from({length:8},(_,i)=>({id:'c52p-'+i,serviceId:'c52p-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'p'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro']}));
          const sels=['[data-more-filters-panel]','[data-more-filters-panel] .home-filter-panel__card','.more-filters__split-body','.more-filters__split-body::after','.more-filters__split-nav','.more-filters__nav-button','.more-filters__split-content','.more-filters__pane','.more-filters__pane[hidden]','.more-filters__quick-toggles','.filter-chip','.filter-field--compact','.more-filters__actions','.filter-action','.featured-services .content-rail'];const browser=await chromium.launch({headless:true});
          async function cap(w,state,phase){const ctx=await browser.newContext({viewport:{width:w,height:1050},reducedMotion:'reduce'}),p=await ctx.newPage(),errs=[];let loaded=false;p.on('pageerror',e=>errs.push(e.message));p.on('request',r=>{try{if(new URL(r.url()).pathname==='/'+f)loaded=true}catch{}});await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:4173/'))return r.continue();if(u.startsWith('https://images.pexels.com/'))return r.fulfill({status:200,contentType:'image/png',body:tiny});return r.abort()});await p.goto(`http://127.0.0.1:4173/index.html?c52p=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded',timeout:15000});await p.waitForLoadState('networkidle',{timeout:7000}).catch(()=>{});await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');if(!a||!b)throw Error('grids');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(window.Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(window.Doke.publicServiceCard.create(x,{results:true})))},items);if(state==='filters'){await p.waitForFunction(()=>Boolean(window.DokeHomeFiltersApi?.open),null,{timeout:7000});await p.evaluate(()=>window.DokeHomeFiltersApi.open('tabs'));await p.waitForFunction(()=>{const x=document.querySelector('[data-more-filters-panel]');return document.body.classList.contains('home-filter-sheet-open')&&Boolean(x&&!x.hidden&&x.getAttribute('aria-hidden')!=='true')},null,{timeout:4000})}await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;}'});await p.waitForTimeout(120);
          async function snap(label){const data=await p.evaluate(sels=>{const one=(e,pseudo)=>{const c=getComputedStyle(e,pseudo),r=e.getBoundingClientRect();return{hidden:e.hidden,aria:e.getAttribute('aria-hidden'),selected:e.getAttribute('aria-selected'),cls:e.className,d:c.display,p:c.position,v:c.visibility,o:c.opacity,z:c.zIndex,w:c.width,h:c.height,minh:c.minHeight,maxh:c.maxHeight,t:c.top,l:c.left,ri:c.right,tr:c.transform,m:c.margin,pad:c.padding,bd:c.border,br:c.borderRadius,bg:c.backgroundColor,bs:c.boxShadow,ov:c.overflow,ovx:c.overflowX,ovy:c.overflowY,gtc:c.gridTemplateColumns,flex:c.flex,r:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*100)/100),sw:e.scrollWidth,sh:e.scrollHeight,cw:e.clientWidth,ch:e.clientHeight}};const pick=s=>{let pseudo=null,base=s;if(s.endsWith('::after')){pseudo='::after';base=s.slice(0,-7)}else if(s.endsWith('::before')){pseudo='::before';base=s.slice(0,-8)}return[...document.querySelectorAll(base)].map(e=>one(e,pseudo))};return{body:document.body.className,root:document.documentElement.className,dw:document.documentElement.scrollWidth,dh:document.documentElement.scrollHeight,styles:sels.map(s=>[s,pick(s)])}},sels);return{label,data,png:H(await p.screenshot({fullPage:true,animations:'disabled'}))}}
          const views=[await snap('initial')];if(state==='filters'){const nav=await p.evaluate(()=>[...document.querySelectorAll('.more-filters__nav-button')].map((b,i)=>({i,key:b.getAttribute('data-more-filters-nav')})));if(nav.length<3)throw Error(`nav ${JSON.stringify(nav)}`);for(const item of nav){await p.evaluate(i=>{const b=document.querySelectorAll('.more-filters__nav-button')[i];if(!b)throw Error('nav missing');b.click()},item.i);await p.waitForTimeout(80);views.push(await snap('nav-'+item.i+'-'+String(item.key||'')))}}await ctx.close();return{views,errs,loaded}}
          fs.writeFileSync(f,P);const base={};for(const [w,s] of states)base[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,C);let md=0,sd=0,ld=0,pe=0;const diffs=[];for(const [w,s] of states){const k=`${w}-${s}`,a=base[k],b=await cap(w,s,'permanent');pe+=a.errs.length+b.errs.length;const ad=a.views.map(x=>({label:x.label,data:x.data})),bd=b.views.map(x=>({label:x.label,data:x.data})),ap=a.views.map(x=>x.png),bp=b.views.map(x=>x.png);if(JSON.stringify(ad)!==JSON.stringify(bd)){md++;diffs.push('meta:'+k)}if(JSON.stringify(ap)!==JSON.stringify(bp)){sd++;diffs.push('png:'+k)}if(a.loaded!==b.loaded){ld++;diffs.push('load:'+k)}}fs.writeFileSync(f,P);await browser.close();const result={result:!md&&!sd&&!ld&&!pe?'PASS':'FAIL',states:states.length,filterStates:filters.size,metadataDiffs:md,screenshotDiffs:sd,loadDiffs:ld,pageErrors:pe,diffKeys:diffs};console.log('PERMANENT_BROWSER='+JSON.stringify(result));if(result.result!=='PASS')process.exit(2)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
