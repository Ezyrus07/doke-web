name: Doke SEARCH Domain Matrix Sync

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-domain-matrix-sync.yml'
      - 'scripts/search-a05-reconcile-once.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-search-domain-matrix-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-domain-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Reconcile SEARCH-A05 and regenerate matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile validated SEARCH-A05
        run: node scripts/search-a05-reconcile-once.js

      - name: Remove one-time reconciler before matrix generation
        run: rm scripts/search-a05-reconcile-once.js

      - name: Regenerate canonical matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Audit cumulative SEARCH authority
        run: |
          node scripts/audit-search-authority-baseline.js
          node scripts/audit-favorites-authority-retirement.js
          node scripts/test-favorites-authority-retirement-runtime.js
          node scripts/audit-service-favorites-surfaces.js
          node scripts/test-service-favorites-controller-runtime.js
          node scripts/audit-search-server-contract.js
          node scripts/audit-search-approved-snapshot-authority.js
          node scripts/test-search-server-contract-runtime.js
          node scripts/audit-search-results-server-activation.js
          node scripts/test-search-results-server-surface-runtime.js

      - name: Audit regenerated matrix
        run: npm run audit:domain-completion-matrix

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit controlled SEARCH-A05 reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md docs/validation/SEARCH-001-A04-SERVER-SEARCH-CONTRACT.json docs/validation/SEARCH-001-A05-SERVER-RESULTS-ACTIVATION.json scripts/audit-search-authority-baseline.js scripts/audit-search-server-contract.js
          git add -u scripts/search-a05-reconcile-once.js
          git commit -m "Reconcile SEARCH-B02 after server search activation"
          git push origin HEAD:${TARGET_BRANCH}
