name: Doke SEARCH Domain Matrix Sync

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-domain-matrix-sync.yml'
      - 'supabase/migrations/160_service_search_ranking_v1.sql'
      - 'supabase/tests/024_service_search_ranking_v1_validation.sql'
      - 'scripts/audit-search-ranking-v1.js'
      - 'scripts/test-search-ranking-v1-runtime.js'
      - 'docs/validation/SEARCH-001-A07-RANKING-V1.json'
      - '.github/workflows/search-ranking-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-search-domain-matrix-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-domain-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Regenerate deterministic domain matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Audit regenerated matrix
        run: npm run audit:domain-completion-matrix

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit deterministic artifact when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          if git diff --cached --quiet; then
            echo "Domain matrix artifact already synchronized."
            exit 0
          fi
          git commit -m "Synchronize SEARCH domain matrix artifact"
          git push origin HEAD:${TARGET_BRANCH}
