name: Doke SEARCH Domain Matrix Sync

# SEARCH-A04 deterministic artifact refresh.
on:
  push:
    branches:
      - 'search/**'
    paths:
      - '.github/workflows/search-domain-matrix-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-search-domain-matrix-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-domain-matrix:
    name: Regenerate deterministic domain matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Audit regenerated matrix
        run: npm run audit:domain-completion-matrix

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit deterministic artifact when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          if git diff --cached --quiet; then
            echo "Domain matrix artifact already synchronized."
            exit 0
          fi
          git commit -m "Synchronize SEARCH domain matrix artifact"
          git push origin HEAD:${{ github.ref_name }}
