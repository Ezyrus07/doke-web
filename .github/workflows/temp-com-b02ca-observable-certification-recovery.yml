# retrigger R2 after workflow installation
name: TEMP COM-B02CA Observable Certification Recovery

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02ca-observable-certification-recovery.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: 199f7164f5d53c6c25f25240af1d71abdf1796ae
      PREDECESSOR_HEAD: 596ca5c12d2ea517ab3e09a3af4329b41d3854dc
      B02CA_MODULE_BLOB: ecd88f35ef281aafcd19109f0924787323c3346e
      B02CA_CONFIG_BLOB: 1b564562fe48031448ec07a5f8ba736e0bb7c8fd
      B02CA_TEST_BLOB: ccb3bf9694f3f87cdd9d1554f52b0eb9963bf2b1
      B02CA_WORKFLOW_BLOB: 8ec27e8f6d80bea6491c7dd59030e56ffe651af7
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TEMP_PATH: .github/workflows/temp-com-b02ca-observable-certification-recovery.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-invocation-readiness.js
      CONFIG: config/com-b02ca-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-invocation-readiness.json
      TEST: scripts/test-com-b02ca-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-invocation-readiness.js
      WORKFLOW: .github/workflows/com-b02ca-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-invocation-readiness.yml
      TEMP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEMP_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02CA corrected candidate and TEMP-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEMP_HEAD_SHA"
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          expected6="$(printf '%s\n' "$WORKFLOW" "$TARGET" "$CONFIG" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json "$TEST" | sort)"
          test "$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)" = "$expected6"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02CA_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02CA_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02CA_TEST_BLOB"
          test "$(git rev-parse HEAD:$WORKFLOW)" = "$B02CA_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Certify B02CA semantics authority provenance and strict non-invocation
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -F 'Object.defineProperty(' "$TARGET" "$TEST"
          ! grep -E '(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)[[:space:]]*\(' "$TARGET" "$TEST"
          ! grep -E '\.(call|apply)[[:space:]]*\(|Reflect\.apply[[:space:]]*\(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"
          grep -F '"kind": "single_use_repository_only_invocation_readiness_derivation"' "$CONFIG"
          grep -F '"source": "user_explicit_authorization_com_001_post_b02bz_repository_only_invocation_readiness_derivation"' "$CONFIG"
          grep -F '"singleUse": true' "$CONFIG"
          grep -F '"reusable": false' "$CONFIG"
          ! grep -F 'reusableWithinRepositoryOnlySequence' "$CONFIG"
          ! grep -F 'standing_general_repository_only_invocation_readiness_subset' "$CONFIG" "$TARGET"
          expected_next='stop_and_require_fresh_explicit_authorization_before_any_deterministic_repository_only_synthetic_invocation_harness_boundary_or_operation_method_invocation_state_storage_registry_execution_or_sensitive_scope'
          test "$(grep -Fh "$expected_next" "$TARGET" "$CONFIG" | wc -l | tr -d ' ')" -eq 2
          ! grep -E 'executableOperationMethodsInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Matrix governance and frozen repository surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
