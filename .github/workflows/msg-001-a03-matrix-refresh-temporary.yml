name: Doke Temporary MSG-A03 Matrix Refresh

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a03-matrix-refresh-temporary.yml'

permissions:
  contents: write

concurrency:
  group: msg-001-a03-matrix-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.run_number == 1 && github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 10
      - name: Require immutable clean A03 ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 23cef66688ce9c2d8c86127779182e7754a99bf0 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh generated matrix artifacts
        run: |
          npm run write:domain-completion-matrix
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run audit:msg-001-a03-server-command-boundary
          npm run test:msg-001-a03-server-command-boundary
          npm run audit:messages-api-contract
          npm run test:messages-supabase-repository-contract
          npm run test:attachments-supabase-repository-contract
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Stage generated matrix artifacts only
        run: |
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check
      - name: Publish refreshed generated artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(msg): refresh A03 matrix artifacts"
          git push origin HEAD:msg/msg-001-baseline-audit
