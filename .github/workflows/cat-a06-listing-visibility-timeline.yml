name: CAT-A06 Listing Visibility Timeline Contract

on:
  pull_request:
    paths:
      - 'config/cat-a06-listing-visibility-timeline.json'
      - 'docs/CAT-A06-LISTING-VISIBILITY-TIMELINE.md'
      - 'scripts/audit-cat-a06-listing-visibility-timeline.js'
      - 'scripts/test-cat-a06-listing-visibility-timeline.js'
      - 'supabase/migrations/044_expand_service_moderation_audit_history.sql'
      - 'supabase/migrations/149_service_lifecycle_authority.sql'
      - 'supabase/migrations/159_service_search_approved_snapshot_authority.sql'
      - 'config/ana-a04-marketplace-funnel-health-projections.json'
      - 'config/domain-completion-matrix.json'
      - 'package.json'
      - '.github/workflows/cat-a06-listing-visibility-timeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check scripts/audit-cat-a06-listing-visibility-timeline.js
          node --check scripts/test-cat-a06-listing-visibility-timeline.js
          node --check scripts/audit-service-lifecycle-authority.js
          node --check scripts/test-service-lifecycle-authority-runtime.js
      - name: CAT-A06 audit
        run: npm run audit:cat-a06-listing-visibility-timeline
      - name: CAT-A06 replay conformance
        run: npm run test:cat-a06-listing-visibility-timeline
      - name: CAT-A03 lifecycle regression
        run: |
          node scripts/audit-service-lifecycle-authority.js
          node scripts/test-service-lifecycle-authority-runtime.js
      - name: ANA-A04 ownership regression
        run: |
          npm run audit:ana-a04-marketplace-funnel-health-projections
          npm run test:ana-a04-marketplace-funnel-health-projections
      - name: Domain matrix regression
        run: npm run audit:domain-completion-matrix
      - name: Agent governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check
