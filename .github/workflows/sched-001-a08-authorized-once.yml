name: SCHED-A08 Authorized Staging Repair and Rolled-Back Canaries

on:
  pull_request:
    paths:
      - '.github/workflows/sched-001-a08-authorized-once.yml'
      - 'supabase/tests/020_sched_a07_rolled_back_canaries.sql'
      - 'config/sched-001-a07-history-canary-readiness.json'

permissions:
  contents: read

concurrency:
  group: sched-a08-authorized-staging-once
  cancel-in-progress: false

jobs:
  authorized-staging-execution:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DOKE_SUPABASE_DB_PASSWORD: ${{ secrets.DOKE_SUPABASE_DB_PASSWORD }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      PROJECT_REF: zwkczgewzbsorbrjuzpb
      POOLER_URL: postgresql://postgres.zwkczgewzbsorbrjuzpb@aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
    steps:
      - uses: actions/checkout@v4

      - name: Resolve authorized credentials without disclosure
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="${SUPABASE_DB_PASSWORD:-${DOKE_SUPABASE_DB_PASSWORD:-${SUPABASE_STAGING_DB_PASSWORD:-}}}"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SCHED_A08_SUPABASE_ACCESS_TOKEN_MISSING' >&2
            exit 10
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo 'SCHED_A08_DATABASE_PASSWORD_MISSING' >&2
            exit 11
          fi
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Install PostgreSQL client when absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Verify CLI and frozen target
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          test "$(cat supabase/.temp/project-ref)" = "$PROJECT_REF"
          test -f supabase/migrations/20260731123000_sched_a03_reservation_authority.sql
          test -f supabase/migrations/20260731151000_sched_a04_dst_local_projection_compatibility.sql
          test -f supabase/tests/020_sched_a07_rolled_back_canaries.sql

      - name: Read-only pre-repair schema and aggregate verification
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASSWORD"
          psql "$POOLER_URL" -X -v ON_ERROR_STOP=1 -Atc "
            select json_build_object(
              'rules', (select count(*) from public.schedule_availability_rules),
              'reservations', (select count(*) from public.schedule_reservations),
              'idempotency', (select count(*) from private.schedule_command_idempotency),
              'events', (select count(*) from private.schedule_domain_events),
              'orders_with_reservation', (select count(*) from public.orders where schedule_reservation_id is not null),
              'generated_a03', exists(select 1 from supabase_migrations.schema_migrations where version = '20260731141315'),
              'generated_a04', exists(select 1 from supabase_migrations.schema_migrations where version = '20260731141349'),
              'canonical_a03', exists(select 1 from supabase_migrations.schema_migrations where version = '20260731123000'),
              'canonical_a04', exists(select 1 from supabase_migrations.schema_migrations where version = '20260731151000')
            );"

      - name: Show pre-repair migration alignment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked -p "$DB_PASSWORD"

      - name: Repair only the four frozen migration-history versions
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair 20260731141315 20260731141349 --status reverted --linked -p "$DB_PASSWORD"
          supabase migration repair 20260731123000 20260731151000 --status applied --linked -p "$DB_PASSWORD"

      - name: Require exact local and remote migration alignment
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASSWORD"
          supabase migration list --linked -p "$DB_PASSWORD"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' \
            | sed -nE 's/^([0-9]+)_.*/\1/p' \
            | sort -u > /tmp/sched-a08-local.txt
          psql "$POOLER_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations order by version" \
            | sort -u > /tmp/sched-a08-remote.txt
          if ! diff -u /tmp/sched-a08-local.txt /tmp/sched-a08-remote.txt; then
            echo 'SCHED_A08_MIGRATION_HISTORY_NOT_EXACTLY_ALIGNED' >&2
            exit 20
          fi
          grep -qx '20260731123000' /tmp/sched-a08-remote.txt
          grep -qx '20260731151000' /tmp/sched-a08-remote.txt
          ! grep -qx '20260731141315' /tmp/sched-a08-remote.txt
          ! grep -qx '20260731141349' /tmp/sched-a08-remote.txt

      - name: Execute SCHED-A07 canary in one rolled-back transaction
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASSWORD"
          test "$(tail -n 1 supabase/tests/020_sched_a07_rolled_back_canaries.sql | tr -d '\r[:space:]')" = 'rollback;'
          psql "$POOLER_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/020_sched_a07_rolled_back_canaries.sql

      - name: Read-only post-canary verification
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASSWORD"
          RESULT="$(psql "$POOLER_URL" -X -v ON_ERROR_STOP=1 -Atc "
            select concat_ws(',',
              (select count(*) from public.schedule_availability_rules),
              (select count(*) from public.schedule_reservations),
              (select count(*) from private.schedule_command_idempotency),
              (select count(*) from private.schedule_domain_events),
              (select count(*) from public.orders where schedule_reservation_id is not null),
              (select count(*) from public.orders where metadata ->> 'canary' = 'SCHED-A07')
            );")"
          echo "SCHED_A08_POST_CANARY_COUNTS=$RESULT"
          test "$RESULT" = '0,0,0,0,0,0'
