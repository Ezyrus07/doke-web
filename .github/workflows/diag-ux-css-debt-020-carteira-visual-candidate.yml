name: Doke UX-CSS-DEBT-020 Carteira Visual Candidate
on:
  push:
    branches: [diag/ux-css-debt-020-carteira-visual-candidate]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: daadc8dbbb91f0ddb75591251fce4ea176b66d95
      TARGET_FILE: assets/css/pages/carteira/visual-hierarchy.css
      TARGET_SELECTOR: 'body[data-page="carteira"] :is( .wallet-hero, .wallet-panel, .wallet-analytics, .wallet-bank-panel, .wallet-transaction-detail-panel, .wallet-receivables-panel, .wallet-empty-state )'
      PARENT_HASH: d2139c19e4aac8ef0793bd7a97a9c3bfb6d44edf58cde30e0b862c42003d1655
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.PARENT_SHA }}', fetch-depth: 2}
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(sha256sum "$TARGET_FILE"|awk '{print $1}')" = "$PARENT_HASH"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - name: Install browser
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build deterministic one-line candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),file=process.env.TARGET_FILE,selector=process.env.TARGET_SELECTOR;
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,n=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:n(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:n([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim();ds.push({lineIndex:i,line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important:/\s*!important\s*$/i.test(raw),context:stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ')});}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winnerLine:l.line,winnerValue:l.value,winnerImportant:l.important});if(!l||d.important||!l.important)last.set(k,d);}return{lines,decl:ds.length,dead};}
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex'),src=fs.readFileSync(file,'utf8'),p=parse(src);if(sha(src)!==process.env.PARENT_HASH||p.decl!==56||p.dead.length!==1)throw new Error('parent drift');const d=p.dead[0];if(d.line!==26||d.selector!==selector||d.property!=='box-shadow'||d.value!=='var(--doke-surface-shadow)'||d.context||d.important||d.winnerLine!==282||d.winnerValue!=='var(--doke-shadow-nested-soft)'||d.winnerImportant)throw new Error('row drift '+JSON.stringify(d));const out=p.lines.filter((_l,i)=>i!==d.lineIndex).join('\n'),q=parse(out);if(q.decl!==55||q.dead.length!==0)throw new Error(`candidate ${q.decl}/${q.dead.length}`);fs.writeFileSync(file,out);fs.writeFileSync('/tmp/candidate.css',out);console.log(`CANDIDATE_BUILD_PASS|parentHash=${sha(src)}|candidateHash=${sha(out)}|bytes=${Buffer.byteLength(src)}->${Buffer.byteLength(out)}|decl=56->55|dead=1->0|deletedLine=${d.line}`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE"|awk '{print $1}')" = 0
          test "$(git diff --numstat -- "$TARGET_FILE"|awk '{print $2}')" = 1
          git diff --check
      - name: Write runtime capture
        shell: bash
        run: |
          cat >/tmp/capture.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');const out=process.argv[2],hitsExpected=+process.argv[3],selector=process.env.TARGET_SELECTOR,vps=[['1600',1600,1000],['1280',1280,802],['1024',1024,900],['901',901,900],['900',900,900],['820',820,1180],['608',608,926],['390',390,844]],sleep=ms=>new Promise(r=>setTimeout(r,ms)),srv=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});(async()=>{await sleep(500);const b=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const result={};for(const [name,w,h] of vps){const c=await b.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'}),p=await c.newPage();await p.route('**/*',r=>{const u=new URL(r.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return r.abort();if(local||['data:','blob:'].includes(u.protocol))return r.continue();return r.abort();});await p.goto('http://127.0.0.1:5500/carteira.html',{waitUntil:'domcontentloaded',timeout:15000});await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});const s=await p.evaluate(selector=>{const canon=s=>(s||'').replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s*,\s*/g,',').trim(),nodes=[...document.querySelectorAll(selector)],hits=[];function walk(rs,href){for(const r of [...rs]){if(r.constructor?.name==='CSSImportRule'&&r.styleSheet){try{walk(r.styleSheet.cssRules,r.styleSheet.href||href)}catch{}}else if(r.constructor?.name==='CSSMediaRule')walk(r.cssRules,href);else if(canon(r.selectorText)===canon(selector)&&r.style?.getPropertyValue('box-shadow'))hits.push({href,value:r.style.getPropertyValue('box-shadow').trim(),priority:r.style.getPropertyPriority('box-shadow')});}}for(const st of [...document.styleSheets])try{walk(st.cssRules,st.href||'inline')}catch{}const de=document.documentElement,body=document.body;return{nodes:nodes.map(n=>{const r=n.getBoundingClientRect(),cs=getComputedStyle(n);return{className:n.className,shadow:cs.boxShadow,rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]}}),doc:[de.scrollWidth,de.scrollHeight,de.clientWidth,de.clientHeight],body:[body.scrollWidth,body.scrollHeight,body.clientWidth,body.clientHeight],hits:hits.filter(x=>String(x.href).includes('/assets/css/pages/carteira/visual-hierarchy.css'))};},selector);if(!s.nodes.length||s.hits.length!==hitsExpected)throw new Error(`${name} nodes=${s.nodes.length} hits=${s.hits.length}`);const {hits,...stable}=s;result[name]=stable;await c.close();}await b.close();srv.kill('SIGTERM');fs.writeFileSync(out,JSON.stringify(result));console.log(`CAPTURE_PASS|hits=${hitsExpected}|viewports=8`);})().catch(e=>{srv.kill('SIGTERM');console.error(e);process.exit(1)});
          NODE
      - name: Capture parent and baseline
        shell: bash
        run: |
          cp /tmp/parent.css "$TARGET_FILE"
          node /tmp/capture.js /tmp/parent.json 2
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/responsive.json
      - name: Restore candidate and prove exact parity
        shell: bash
        run: |
          cp /tmp/candidate.css "$TARGET_FILE"
          node /tmp/capture.js /tmp/candidate.json 1
          node - <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent.json')),b=JSON.parse(fs.readFileSync('/tmp/candidate.json'));if(JSON.stringify(a)!==JSON.stringify(b)){console.error('runtime mismatch');process.exit(1)}console.log('RUNTIME_PARITY_PASS|diffs=0');
          NODE
          cp /tmp/responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/r
          grep -q 'Checks: 893' /tmp/r
          grep -q 'Failures: 0' /tmp/r
          grep -q 'Skips: 277' /tmp/r
      - name: Candidate governance and residual
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/c
          grep -q 'Conflicting class/property pairs: 339' /tmp/c
          npm run audit:agent-governance
          npm run audit:active-legacy-structures | tee /tmp/l
          grep -q 'css files: 533 (55 direct, 401 active/imported)' /tmp/l
          grep -q 'high risk active css: 37' /tmp/l
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/d
          grep -q 'Duplicate groups: 0' /tmp/d
          grep -q 'Duplicated files: 0' /tmp/d
          npm run audit:domain-completion-matrix | tee /tmp/m
          grep -q 'Domains: 23' /tmp/m
          grep -q 'Critical flows: 15' /tmp/m
          grep -q 'Average maturity: 2.91/6' /tmp/m
          grep -q 'Critical blockers: 12' /tmp/m
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css')),ir=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));},meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;ir.lastIndex=0;while((m=ir.exec(text)))imports.push(norm(m[1],f));meta.set(f,{text,imports});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n);}function dead(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null,ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,n=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(const line of lines){const t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:n(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:n([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m)ds.push({sel,prop:m[1].toLowerCase(),imp:/!important\s*$/i.test(m[2]),ctx:stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ')});}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}const last=new Map();let d=0;for(let i=ds.length-1;i>=0;i--){const x=ds[i],k=`${x.ctx}>${x.sel}>${x.prop}`,l=last.get(k);if(l&&(!x.imp||l.imp))d++;if(!l||x.imp||!l.imp)last.set(k,x);}return d;}const vals=[...active].map(f=>dead(meta.get(f).text)),files=vals.filter(Boolean).length,total=vals.reduce((a,b)=>a+b,0);if(files!==54||total!==1308)throw new Error(`residual ${files}/${total}`);console.log('CANDIDATE_RESIDUAL_PASS|files=54|dead=1308');
          NODE
      - name: Final exact product-only delta and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PARENT_SHA"
          git clean -fd
          cp /tmp/candidate.css "$TARGET_FILE"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE"|awk '{print $1}')" = 0
          test "$(git diff --numstat -- "$TARGET_FILE"|awk '{print $2}')" = 1
          git diff --check
          git reset --hard "$PARENT_SHA"
          git clean -fd
          test -z "$(git status --porcelain)"
