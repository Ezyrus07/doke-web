name: WAL-A05 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/wal-a05-matrix-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh-derived-matrix:
    if: github.event.pull_request.head.ref == 'wal/wal-001-baseline-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout WAL branch
        uses: actions/checkout@v4
        with:
          ref: wal/wal-001-baseline-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate derived matrix artifacts
        run: npm run write:domain-completion-matrix
      - name: Stage strict allowlist and remove temporary workflow
        run: |
          rm .github/workflows/wal-a05-matrix-refresh-temp.yml
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -u .github/workflows/wal-a05-matrix-refresh-temp.yml
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/wal-a05-matrix-refresh-temp.yml'
      - name: Commit canonical generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh WAL-A05 canonical matrix derivatives'
          git push origin HEAD:wal/wal-001-baseline-audit
