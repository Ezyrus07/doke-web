name: Temporary results skeleton route fix

on:
  pull_request:
    branches:
      - search/search-001-baseline-audit
    paths:
      - '.github/workflows/tmp-fix-results-skeleton-route.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ux/search-results-skeleton'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ux/search-results-skeleton
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move resultados to skeleton-first route commit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/core/stable-shell-router.js')
          text = path.read_text(encoding='utf-8')
          old = """  var INTERNAL_DIRECT_HYDRATION_ROUTES = new Set([\n    '/index.html',\n    '/mensagens.html',\n    '/notificacoes.html',\n    '/pedidos.html',\n    '/carteira.html',\n    '/resultados.html',\n    '/detalhe-anuncio.html',"""
          new = """  var INTERNAL_DIRECT_HYDRATION_ROUTES = new Set([\n    '/index.html',\n    '/mensagens.html',\n    '/notificacoes.html',\n    '/pedidos.html',\n    '/carteira.html',\n    '/detalhe-anuncio.html',"""
          if old not in text:
              raise SystemExit('Expected direct hydration route block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('scripts/test-results-hydration-state-authority-contract.js')
          test_text = test.read_text(encoding='utf-8')
          marker = "assertIncludes(routerSource, \"'/resultados.html'\", 'stable router must register resultados route');"
          addition = marker + "\nassertNotIncludes(getBlock(routerSource, 'INTERNAL_DIRECT_HYDRATION_ROUTES'), \"'/resultados.html'\", 'resultados must commit its structural skeleton before route scripts settle');"
          if marker in test_text and addition not in test_text:
              test_text = test_text.replace(marker, addition, 1)
              test.write_text(test_text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-fix-results-skeleton-route.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/core/stable-shell-router.js scripts/test-results-hydration-state-authority-contract.js
          git commit -m 'Show search skeleton during stable route entry'
          git push origin HEAD:ux/search-results-skeleton
