name: Doke UX-HOME-003 Rail Scroll

on:
  push:
    branches:
      - ux/ux-home-003-rail-scroll
    paths:
      - 'assets/js/pages/home/rail-scroll-state.js'
      - 'assets/js/pages/home/rail-scroll-surface.js'
      - 'assets/js/pages/home.js'
      - 'index.html'
      - 'scripts/test-ux-home-003-rail-scroll-state.js'
      - 'scripts/test-ux-home-003-rail-scroll-surface.js'
      - 'scripts/test-ux-home-003-browser-contract.js'
      - 'docs/ux/UX-HOME-003.md'
      - '.github/workflows/ux-home-003-rail-scroll.yml'
  pull_request:
    paths:
      - 'assets/js/pages/home/rail-scroll-state.js'
      - 'assets/js/pages/home/rail-scroll-surface.js'
      - 'assets/js/pages/home.js'
      - 'index.html'
      - 'scripts/test-ux-home-003-rail-scroll-state.js'
      - 'scripts/test-ux-home-003-rail-scroll-surface.js'
      - 'scripts/test-ux-home-003-browser-contract.js'
      - 'docs/ux/UX-HOME-003.md'
      - '.github/workflows/ux-home-003-rail-scroll.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ux-home-003-rail-scroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/pages/home/rail-scroll-state.js
          node --check assets/js/pages/home/rail-scroll-surface.js
          node --check scripts/test-ux-home-003-rail-scroll-state.js
          node --check scripts/test-ux-home-003-rail-scroll-surface.js

      - name: Validate rail scroll state behavior
        run: node scripts/test-ux-home-003-rail-scroll-state.js

      - name: Validate rail scroll surface behavior
        run: node scripts/test-ux-home-003-rail-scroll-surface.js

      - name: Preserve inherited Home More-services contracts
        run: |
          node scripts/test-ux-home-002-more-services-state.js
          node scripts/test-ux-home-002-more-services-surface.js
          node scripts/test-ux-home-001-rail-state.js

      - name: Generate executable LCOV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage/ux-home-003
          mkdir -p coverage/ux-home-003
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='assets/js/pages/home/rail-scroll-state.js' \
            --test-coverage-include='assets/js/pages/home/rail-scroll-surface.js' \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/ux-home-003/lcov.info \
            scripts/test-ux-home-003-rail-scroll-state.js \
            scripts/test-ux-home-003-rail-scroll-surface.js

      - name: Validate LCOV evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT='coverage/ux-home-003/lcov.info'
          test -s "${REPORT}"
          grep -Fq 'SF:assets/js/pages/home/rail-scroll-state.js' "${REPORT}"
          grep -Fq 'SF:assets/js/pages/home/rail-scroll-surface.js' "${REPORT}"

      - name: Require SonarQube Cloud credential
        if: github.event_name == 'push'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo '::error::SONAR_TOKEN is unavailable to the trusted branch workflow.'
            exit 1
          fi

      - name: Upload LCOV evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-home-003-lcov-${{ github.event_name }}-${{ github.run_id }}
          path: coverage/ux-home-003/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Validate patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff --check HEAD^
          fi

      - name: Analyze PR and enforce SonarQube Cloud Quality Gate
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=92
            -Dsonar.pullrequest.branch=ux/ux-home-003-rail-scroll
            -Dsonar.pullrequest.base=ux/ux-home-002-more-services-filters
            -Dsonar.javascript.lcov.reportPaths=coverage/ux-home-003/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
