name: Doke SCHED-C01B Implementation Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01b-implementation-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-c01b-implementation-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Apply deterministic C01B implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')
              file.write_text(source.replace(old, new, 1))

          repo = 'assets/js/repositories/orders-repository.js'
          replace_once(
              repo,
              "      accepted: 'Pedido aceito',\n      in_progress: 'Em andamento',",
              "      accepted: 'Pedido aceito',\n      scheduled: 'Agendado',\n      in_progress: 'Em andamento',"
          )
          replace_once(
              repo,
              "\n  function makeId() {",
              """

  function deriveScheduleAuthority(raw, normalizedStatus) {
    raw = raw || {};
    var scheduleReservationId = normalizeText(raw.scheduleReservationId || raw.schedule_reservation_id || '');
    var scheduledAt = normalizeText(raw.scheduledAt || raw.scheduled_at || '');
    var status = normalizeStatus(normalizedStatus || raw.status || '');
    var desiredDate = normalizeText(raw.desiredDate || raw.date || raw.daté || '');
    var hasReservation = Boolean(scheduleReservationId);
    var hasScheduledAt = Boolean(scheduledAt);
    var isScheduled = status === 'scheduled';
    var authority = 'none';

    if (hasReservation && hasScheduledAt && isScheduled) authority = 'canonical_confirmed';
    else if (hasReservation || hasScheduledAt || isScheduled) authority = 'incomplete_projection';
    else if (desiredDate) authority = 'client_intent';

    return Object.freeze({
      scheduleReservationId: scheduleReservationId,
      scheduledAt: scheduledAt,
      scheduleAuthority: authority,
      hasCanonicalSchedule: authority === 'canonical_confirmed'
    });
  }

  function makeId() {"""
          )
          replace_once(
              repo,
              """    var serviceAvailabilitySchedule = Array.isArray(raw.serviceAvailabilitySchedule)
      ? raw.serviceAvailabilitySchedule
      : (serviceSnapshot && Array.isArray(serviceSnapshot.availabilitySchedule) ? serviceSnapshot.availabilitySchedule : []);

    return Object.assign({}, raw, {""",
              """    var serviceAvailabilitySchedule = Array.isArray(raw.serviceAvailabilitySchedule)
      ? raw.serviceAvailabilitySchedule
      : (serviceSnapshot && Array.isArray(serviceSnapshot.availabilitySchedule) ? serviceSnapshot.availabilitySchedule : []);
    var scheduleProjection = deriveScheduleAuthority(raw, status);

    return Object.assign({}, raw, {"""
          )
          replace_once(
              repo,
              """      status: status,
      backendStatus: raw.backendStatus || rawStatus,
      statusLabel: statusLabel,""",
              """      status: status,
      backendStatus: raw.backendStatus || rawStatus,
      statusLabel: status === 'scheduled' ? 'Agendado' : statusLabel,
      scheduleReservationId: scheduleProjection.scheduleReservationId,
      scheduledAt: scheduleProjection.scheduledAt,
      scheduleAuthority: scheduleProjection.scheduleAuthority,
      hasCanonicalSchedule: scheduleProjection.hasCanonicalSchedule,"""
          )
          replace_once(
              repo,
              "      scheduledAt: row.scheduled_at || metadata.scheduledAt,",
              "      scheduleReservationId: row.schedule_reservation_id || '',\n      scheduledAt: row.scheduled_at || '',"
          )
          replace_once(
              repo,
              """    normalize: normalizeOrder,
    normalizeStatus: normalizeStatus,""",
              """    normalize: normalizeOrder,
    normalizeStatus: normalizeStatus,
    deriveScheduleAuthority: deriveScheduleAuthority,"""
          )

          service = 'assets/js/services/orders-service.js'
          replace_once(
              service,
              """    in_progress: {
      label: 'Em andamento',""",
              """    scheduled: {
      label: 'Agendado',
      nextAction: 'Acompanhar agendamento',
      flow: 'O horário foi confirmado pela autoridade canônica de agenda.'
    },
    in_progress: {
      label: 'Em andamento',"""
          )

          surface = 'assets/js/pages/pedidos-local-orders.js'
          replace_once(
              surface,
              "    if (status === 'conversation' || status === 'accepted' || status === 'in_progress') return 'conversation';",
              "    if (status === 'conversation' || status === 'accepted' || status === 'scheduled' || status === 'in_progress') return 'conversation';"
          )
          replace_once(
              surface,
              "\n  function getAttachmentsCount(order) {",
              """

  function formatIntentDate(value) {
    var normalized = String(value || '').trim();
    if (!normalized) return '';
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(normalized);
    var date = match
      ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12, 0, 0)
      : new Date(normalized);
    if (Number.isNaN(date.getTime())) return normalized;
    return new Intl.DateTimeFormat('pt-BR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    }).format(date);
  }

  function formatCanonicalSchedule(value) {
    var date = new Date(value || '');
    if (Number.isNaN(date.getTime())) return null;
    var timeZone = '';
    try { timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
    catch (error) { timeZone = ''; }
    var options = { dateStyle: 'medium', timeStyle: 'short' };
    if (timeZone) options.timeZone = timeZone;
    return {
      label: new Intl.DateTimeFormat('pt-BR', options).format(date),
      timeZone: timeZone
    };
  }

  function getSchedulePresentation(order) {
    order = order || {};
    var authority = String(order.scheduleAuthority || 'none');
    if (authority === 'canonical_confirmed' && order.hasCanonicalSchedule === true) {
      var canonical = formatCanonicalSchedule(order.scheduledAt);
      if (canonical) {
        return {
          authority: 'canonical_confirmed',
          label: 'Agendado: ' + canonical.label,
          detail: 'Agendamento confirmado para ' + canonical.label + (canonical.timeZone ? ' (' + canonical.timeZone + ')' : '')
        };
      }
      authority = 'incomplete_projection';
    }
    if (authority === 'incomplete_projection') {
      return {
        authority: 'incomplete_projection',
        label: 'Agenda indisponível: atualize o pedido',
        detail: 'A projeção de agenda está incompleta. Nenhum horário deve ser tratado como confirmado.'
      };
    }
    if (authority === 'client_intent') {
      var intent = formatIntentDate(order.desiredDate || order.date || order.daté || '');
      return {
        authority: 'client_intent',
        label: 'Data desejada: ' + (intent || 'a combinar'),
        detail: 'Data desejada pelo cliente. O horário ainda não foi confirmado.'
      };
    }
    return {
      authority: 'none',
      label: 'Disponibilidade do anúncio: ' + formatServiceSchedule(order),
      detail: 'Nenhum agendamento foi confirmado para este pedido.'
    };
  }

  function getAttachmentsCount(order) {"""
          )
          replace_once(
              surface,
              """    if (order && order.smartBadge) return order.smartBadge;
    if (status === 'completed') return 'Pós-serviço';""",
              """    if (order && order.smartBadge) return order.smartBadge;
    if (order && order.scheduleAuthority === 'incomplete_projection') return 'Agenda indisponível';
    if (order && order.scheduleAuthority === 'canonical_confirmed' && order.hasCanonicalSchedule === true) return 'Agendado';
    if (status === 'completed') return 'Pós-serviço';"""
          )
          replace_once(
              surface,
              """  function getDetailFlow(order, professionalView) {
    var status = order.status || 'pending';
    if (status === 'accepted'""",
              """  function getDetailFlow(order, professionalView) {
    var status = order.status || 'pending';
    if (order.scheduleAuthority === 'incomplete_projection') return 'A projeção de agenda está incompleta. Atualize o pedido antes de considerar qualquer horário confirmado.';
    if (order.scheduleAuthority === 'canonical_confirmed' && order.hasCanonicalSchedule === true) return 'O horário foi confirmado pela autoridade canônica de agenda.';
    if (status === 'accepted'"""
          )
          replace_once(
              surface,
              "    var serviceSchedule = escapeHtml(formatServiceSchedule(order));",
              "    var schedulePresentation = getSchedulePresentation(order);\n    var serviceSchedule = escapeHtml(schedulePresentation.label);"
          )
          replace_once(
              surface,
              "    var timeline = escapeHtml(order.urgency || order.desiredDate || 'Aguardando retorno do profissional');",
              "    var timeline = escapeHtml(schedulePresentation.detail || order.urgency || order.desiredDate || 'Aguardando retorno do profissional');"
          )
          replace_once(
              surface,
              """    article.dataset.serviceSchedule = JSON.stringify(getServiceSchedule(order));
    article.dataset.professionalId""",
              """    article.dataset.serviceSchedule = JSON.stringify(getServiceSchedule(order));
    article.dataset.scheduleAuthority = schedulePresentation.authority;
    article.dataset.scheduleReservationId = order.scheduleReservationId || '';
    article.dataset.scheduledAt = order.scheduledAt || '';
    article.dataset.hasCanonicalSchedule = order.hasCanonicalSchedule === true ? 'true' : 'false';
    article.dataset.professionalId"""
          )
          replace_once(
              surface,
              "              <span>${serviceSchedule}</span>",
              "              <span data-order-schedule-authority=\"${escapeHtml(schedulePresentation.authority)}\">${serviceSchedule}</span>"
          )
          replace_once(
              surface,
              """          order && order.updatedAt,
          order && order.disputeStatus,""",
              """          order && order.updatedAt,
          order && order.scheduleReservationId,
          order && order.scheduledAt,
          order && order.scheduleAuthority,
          order && order.disputeStatus,"""
          )

          c01a_audit = 'scripts/audit-sched-001-c01a-frontend-canonical-authority-readiness.js'
          replace_once(
              c01a_audit,
              """assert(ordersRepository.includes('scheduledAt: row.scheduled_at || metadata.scheduledAt'));
assert(!ordersRepository.includes('scheduleReservationId: row.schedule_reservation_id'));
assert(!ordersRepository.includes("scheduleAuthority: 'canonical_confirmed'"));
assert(!ordersRepository.includes('hasCanonicalSchedule: true'));
assert(!/\\bscheduled\\s*:\\s*['\\\"]Agendado/.test(ordersRepository));""",
              """assert(ordersRepository.includes("scheduleReservationId: row.schedule_reservation_id || ''"));
assert(ordersRepository.includes("scheduledAt: row.scheduled_at || ''"));
assert(ordersRepository.includes('function deriveScheduleAuthority(raw, normalizedStatus)'));
assert(ordersRepository.includes('hasCanonicalSchedule: scheduleProjection.hasCanonicalSchedule'));
assert(/\\bscheduled\\s*:\\s*['\\\"]Agendado/.test(ordersRepository));"""
          )
          replace_once(
              c01a_audit,
              """assert(ordersService.includes('var ORDER_TRANSITIONS = Object.freeze({'));
assert(!ordersService.includes("scheduled: Object.freeze({"));""",
              """assert(ordersService.includes('var ORDER_TRANSITIONS = Object.freeze({'));
assert(ordersService.includes("scheduled: {\\n      label: 'Agendado'"));
assert(!ordersService.includes("scheduled: Object.freeze({"));"""
          )
          replace_once(
              c01a_audit,
              """assert(ordersSurface.includes('serviceAvailabilitySchedule'));
assert(ordersSurface.includes("return 'Agenda a combinar'"));
assert(!ordersSurface.includes('scheduleReservationId'));
assert(!ordersSurface.includes('hasCanonicalSchedule'));""",
              """assert(ordersSurface.includes('serviceAvailabilitySchedule'));
assert(ordersSurface.includes("return 'Agenda a combinar'"));
assert(ordersSurface.includes('scheduleReservationId'));
assert(ordersSurface.includes('hasCanonicalSchedule'));
assert(ordersSurface.includes('Agenda indisponível: atualize o pedido'));"""
          )
          replace_once(
              c01a_audit,
              "assert.strictEqual(matrix.version, '1.3.71');",
              "const matrixParts = String(matrix.version).split('.').map(Number);\nassert.strictEqual(matrixParts[0], 1);\nassert.strictEqual(matrixParts[1], 3);\nassert(matrixParts[2] >= 71, 'C01A requires matrix 1.3.71 or later');"
          )
          replace_once(
              c01a_audit,
              "assert(sched.nextActions[0].includes('SCHED-C01B'));",
              "assert(Array.isArray(sched.nextActions) && sched.nextActions.length > 0);"
          )

          c01a_test = 'scripts/test-sched-001-c01a-frontend-canonical-authority-readiness.js'
          replace_once(
              c01a_test,
              """assert(repositorySource.includes('scheduledAt: row.scheduled_at || metadata.scheduledAt'));
assert(!repositorySource.includes('scheduleReservationId: row.schedule_reservation_id'));
assert(!serviceSource.includes("scheduled: Object.freeze({"));
assert(quoteSource.includes('desiredDate: data.get("data") || ""'));
assert(!quoteSource.includes('scheduledAt:'));
assert(ordersSurfaceSource.includes('serviceAvailabilitySchedule'));
assert(!ordersSurfaceSource.includes('hasCanonicalSchedule'));""",
              """assert(repositorySource.includes("scheduleReservationId: row.schedule_reservation_id || ''"));
assert(repositorySource.includes("scheduledAt: row.scheduled_at || ''"));
assert(repositorySource.includes('function deriveScheduleAuthority(raw, normalizedStatus)'));
assert(!serviceSource.includes("scheduled: Object.freeze({"));
assert(serviceSource.includes("scheduled: {\\n      label: 'Agendado'"));
assert(quoteSource.includes('desiredDate: data.get("data") || ""'));
assert(!quoteSource.includes('scheduledAt:'));
assert(ordersSurfaceSource.includes('serviceAvailabilitySchedule'));
assert(ordersSurfaceSource.includes('hasCanonicalSchedule'));
assert(ordersSurfaceSource.includes('Agenda indisponível: atualize o pedido'));"""
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['audit:sched-001-c01b-frontend-canonical-schedule-read-model'] = 'node scripts/audit-sched-001-c01b-frontend-canonical-schedule-read-model.js'
          package['scripts']['test:sched-001-c01b-frontend-canonical-schedule-read-model'] = 'node scripts/test-sched-001-c01b-frontend-canonical-schedule-read-model.js'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text())
          if matrix.get('version') != '1.3.71':
              raise SystemExit(f"Unexpected matrix version: {matrix.get('version')}")
          matrix['version'] = '1.3.72'
          matrix['updatedAt'] = '2026-08-01T20:07:00-03:00'
          domains = {item['id']: item for item in matrix['domains']}
          sched = domains['SCHED-001']
          order = domains['ORD-001']
          required = [
              'config/sched-001-c01b-frontend-canonical-schedule-read-model.json',
              'docs/SCHED-001-C01B-FRONTEND-CANONICAL-SCHEDULE-READ-MODEL.md',
              'docs/validation/SCHED-001-C01B-FRONTEND-CANONICAL-SCHEDULE-READ-MODEL.json',
              'scripts/audit-sched-001-c01b-frontend-canonical-schedule-read-model.js',
              'scripts/test-sched-001-c01b-frontend-canonical-schedule-read-model.js',
              '.github/workflows/sched-001-c01b-frontend-canonical-schedule-read-model.yml',
              'assets/js/repositories/orders-repository.js',
              'assets/js/services/orders-service.js',
              'assets/js/pages/orcamento.js',
              'assets/js/pages/pedidos-local-orders.js'
          ]
          tests = [
              'audit:sched-001-c01b-frontend-canonical-schedule-read-model',
              'test:sched-001-c01b-frontend-canonical-schedule-read-model'
          ]
          for domain in (sched, order):
              for item in required:
                  if item not in domain['requiredPaths']:
                      domain['requiredPaths'].append(item)
              for item in tests:
                  if item not in domain['tests']:
                      domain['tests'].append(item)

          sched_evidence = [
              'SCHED-C01B implemented a repository-only canonical schedule read model: schedule_reservation_id, scheduled_at and scheduled status now derive fail-closed scheduleAuthority and hasCanonicalSchedule.',
              'The orders surface now distinguishes canonical confirmed booking, client date intent, incomplete projection and advertised service availability without activating any scheduling command.',
              'C01B changed frontend read presentation only; staging reads and mutations, migrations, deploys, Cron, workers, production and merge remained zero.'
          ]
          ord_evidence = [
              'SCHED-C01B maps the canonical scheduling projection into the ORD browser DTO and exposes it read-only to order cards.',
              'Generic scheduled transitions remain absent, quote dates remain client intent and incomplete schedule projections fail closed in presentation.',
              'C01B does not close ORD-B02, ORD-B03 or ORD-B05 and does not activate staging or production writes.'
          ]
          for item in sched_evidence:
              if item not in sched['evidence']:
                  sched['evidence'].append(item)
          for item in ord_evidence:
              if item not in order['evidence']:
                  order['evidence'].append(item)
          sched['nextActions'] = [
              'Implement SCHED-C01C deterministic frontend presentation coverage for canonical_confirmed, client_intent and incomplete_projection without remote scheduling commands.',
              'Verify order detail and message summaries consume the same canonical schedule read model before any authenticated browser canary.',
              'Keep staging browser activation, scheduling commands, Cron or workers, production release and pull-request merge under independent authorization.'
          ]
          if sched.get('maturity') != 3 or sched.get('serverAuthority') != 'partial':
              raise SystemExit('C01B must not promote SCHED maturity or authority')
          if sched.get('blockers') != []:
              raise SystemExit('C01B must not reopen SCHED blockers')
          if [item['id'] for item in order.get('blockers', [])] != ['ORD-B02', 'ORD-B03', 'ORD-B05']:
              raise SystemExit('C01B must preserve ORD blockers')
          matrix_path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Regenerate deterministic matrix
        run: npm run write:domain-completion-matrix
      - name: Validate implementation and cumulative contracts
        run: |
          set -euo pipefail
          node --check assets/js/repositories/orders-repository.js
          node --check assets/js/services/orders-service.js
          node --check assets/js/pages/pedidos-local-orders.js
          npm run audit:sched-001-c01b-frontend-canonical-schedule-read-model
          npm run test:sched-001-c01b-frontend-canonical-schedule-read-model
          npm run audit:sched-001-c01a-frontend-canonical-authority-readiness
          npm run test:sched-001-c01a-frontend-canonical-authority-readiness
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Publish C01B implementation
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add assets/js/repositories/orders-repository.js
          git add assets/js/services/orders-service.js
          git add assets/js/pages/pedidos-local-orders.js
          git add scripts/audit-sched-001-c01a-frontend-canonical-authority-readiness.js
          git add scripts/test-sched-001-c01a-frontend-canonical-authority-readiness.js
          git add package.json
          git add config/domain-completion-matrix.json
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git diff --cached --check
          git commit -m "feat(sched): implement C01B canonical schedule read model"
          git push origin HEAD:ord/ord-001-baseline-audit
