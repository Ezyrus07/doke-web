name: ORD-A07C Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07c-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07C registry and matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(packageJson.scripts, {
            'test:ord-001-a07c-worker-invocation-headers': 'node scripts/test-ord-001-a07c-worker-invocation-headers.mjs',
            'audit:ord-001-a07c-worker-invocation-headers': 'node scripts/audit-ord-001-a07c-worker-invocation-headers.js'
          });
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.31';
          matrix.updatedAt = '2026-07-30T12:40:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'supabase/functions/order-event-worker/invocation-headers.mjs',
            'supabase/migrations/20260730153500_ord_a07c_worker_invocation_headers.sql',
            'config/ord-001-a07c-worker-invocation-headers.json',
            'scripts/test-ord-001-a07c-worker-invocation-headers.mjs',
            'scripts/audit-ord-001-a07c-worker-invocation-headers.js',
            'docs/ORD-001-A07C-WORKER-INVOCATION-HEADERS.md',
            'docs/validation/ORD-001-A07C-WORKER-INVOCATION-HEADERS.json',
            '.github/workflows/ord-001-a07c-worker-invocation-headers.yml'
          ]);
          appendUnique(ord.tests, [
            'test:ord-001-a07c-worker-invocation-headers',
            'audit:ord-001-a07c-worker-invocation-headers'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07C defines canonical issued-at, nonce and source headers for internal order-event worker calls without carrying the worker token in the runtime-neutral builder.',
            'The Cron patch generates a 13-digit millisecond timestamp and a 32-character base64url nonce from 24 cryptographically random bytes while preserving Vault-backed URL and token boundaries.',
            'Postgres 17 validation captures two stubbed Cron invocations, proves distinct nonces and preserves source, payload, URL, token and timeout behavior.',
            'The repository migration does not create secrets, reschedule Cron, hardcode a project URL or activate the Edge Function.',
            'ORD-A07C remains inactive until the ORD-A07B nonce ledger is applied and separate Cron and Edge Function release gates are authorized.'
          ]);
          appendUnique(ord.nextActions, [
            'After the ORD-A07B ledger is applied and verified in staging, authorize the ORD-A07C Cron header migration separately, then wire Edge Function header reading and atomic nonce consumption before the worker run begins.'
          ]);
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/test-ord-001-a07c-worker-invocation-headers.mjs
          node scripts/audit-ord-001-a07c-worker-invocation-headers.js
          node scripts/test-order-event-worker-invocation-freshness.js
          node scripts/audit-ord-001-a07b-worker-invocation-freshness.js
          node scripts/test-ord-001-a07b-staging-migration-readiness.js
          node scripts/audit-ord-001-a07b-staging-migration-readiness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07C worker invocation headers' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

# Retry after case-insensitive documentation audit.
