          test "$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          git checkout --detach "$PARENT" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT"
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Construct candidate A in workspace only
        shell: bash
        run: |
          set -euo pipefail
