          fs.writeFileSync('scripts/audit-main-support-state-contracts.js',support);
          NODE

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'CANDIDATE_FILES=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "assets/js/pages/comunidade.js"
          test "${changed[1]}" = "scripts/audit-main-marketplace-state-contracts.js"
          test "${changed[2]}" = "scripts/audit-main-support-state-contracts.js"
          test -z "$(git diff --name-only -- '*.html' '*.css')"
          git diff --check

          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const files=['assets/js/pages/comunidade.js','scripts/audit-main-marketplace-state-contracts.js','scripts/audit-main-support-state-contracts.js'];
          const rows=files.map((file)=>{
            const b=fs.readFileSync(file);
            return {file,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex'),blob:cp.execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim()};
          });
          const community=fs.readFileSync('assets/js/pages/comunidade.js','utf8');
          const mapping="page.dataset.viewState = nextState === 'hydrated' ? 'ready' : nextState;";
          if((community.split(mapping).length-1)!==1) throw new Error('candidate public mapping must occur exactly once');
          if(!community.includes("page.dataset.state = nextState;")) throw new Error('internal state lifecycle changed');
          if(!community.includes("document.body.dataset.dataState = nextState;")) throw new Error('body lifecycle changed');
          if(!community.includes("setCommunityPageState('hydrated')")) throw new Error('internal hydrated terminal call changed');
          if(!community.includes("page.dataset.communityHydrated = 'true'")) throw new Error('communityHydrated flag changed');
          console.log('CANDIDATE_IDENTITY='+JSON.stringify({files:rows,productFile:'assets/js/pages/comunidade.js',productChange:'public data-view-state maps internal hydrated to canonical ready',internalHydratedPreserved:true,htmlChanged:false,cssChanged:false,productMutationPersisted:false}));
