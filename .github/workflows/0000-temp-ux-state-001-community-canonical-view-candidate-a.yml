  const completionCanonical=hasCanonicalCompletion(config,hydrationRuntime);
  if(!completionCanonical) missing.push('canonical ready completion');
  return {file,scope:config.scope,initialState,completionCanonical,status:missing.length?'failed':'passed',visualContract:'provisional-layout-preserved',missing};
});
const failed=pages.filter((page)=>page.status!=='passed');
const report={cycle:136,scope:'main-marketplace-state-contracts',status:failed.length?'failed':'passed',checkedPages:pages.length,failedPages:failed.length,pages,contract:'ready/false OR loading/true with real canonical hydration completion',criteriaRelaxed:0};
fs.mkdirSync(path.dirname(REPORT),{recursive:true});
fs.writeFileSync(REPORT,JSON.stringify(report,null,2)+'\\n');
if(report.status!=='passed') { console.error('[audit:main-marketplace-state-contracts] failed'); console.error(JSON.stringify(report,null,2)); process.exit(1); }
console.log('[audit:main-marketplace-state-contracts] passed');
console.log(JSON.stringify({checkedPages:report.checkedPages,failedPages:report.failedPages,criteriaRelaxed:0},null,2));
