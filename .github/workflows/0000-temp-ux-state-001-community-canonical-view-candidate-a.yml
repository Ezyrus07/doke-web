  'notificacoes.html': { scope: 'notificacoes', skeleton: 'data-notifications-hydration-skeleton', ready: 'data-notifications-hydration-ready', completion: { type: 'controller', file: 'assets/js/pages/notificacoes.js', tokens: ["page: 'notificacoes'", "waitFor: ['dom', 'auth', 'local-notifications']", "hydration?.mark('local-notifications')"] } },
