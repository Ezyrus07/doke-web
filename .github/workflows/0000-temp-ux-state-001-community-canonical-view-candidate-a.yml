          const fs=require('fs');

          const product='assets/js/pages/comunidade.js';
          let source=fs.readFileSync(product,'utf8');
          const before='page.dataset.viewState = nextState;';
          const after="page.dataset.viewState = nextState === 'hydrated' ? 'ready' : nextState;";
          const count=source.split(before).length-1;
          if(count!==1) throw new Error(`expected exactly one public view-state assignment, found ${count}`);
          source=source.replace(before,after);
          fs.writeFileSync(product,source);

