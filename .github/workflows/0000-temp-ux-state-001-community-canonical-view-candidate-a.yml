            && c140.visualChange===false;
          const out={result:pass?'PASS':'FAIL',critical:{status:cCritical.status,checked:cCritical.checkedPages,failed:cCritical.failedPages},c136:{status:c136.status,checked:c136.checkedPages,failed:c136.failedPages,criteriaRelaxed:c136.criteriaRelaxed},c137:{status:c137.status,checked:c137.checkedPages,failed:c137.failedPages,criteriaRelaxed:c137.criteriaRelaxed},c138:{status:c138.status,reviewPages:actualReview,totalActionStates:c138.totalActionStates,totalCriticalSubmitButtons:c138.totalCriticalSubmitButtons},c139:{status:c139.status,checked:c139.checkedPages,failed:c139.failedPages},c140:{status:c140.status,failedReports:c140.failedReports,followUpReports:c140.followUpReports,nextPhaseConstraint:c140.nextPhaseConstraint,visualChange:c140.visualChange},criteriaRelaxed:0,productMutationPersisted:false};
