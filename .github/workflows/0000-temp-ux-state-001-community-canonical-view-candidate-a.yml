};

function read(file) { return fs.readFileSync(path.join(ROOT, file), 'utf8'); }
function hasReadyInitialState(content) {
  return /data-view-state=["']ready["']/.test(content) && /aria-busy=["']false["']/.test(content);
}
function hasLoadingInitialState(content, config) {
  return /data-view-state=["']loading["']/.test(content)
    && /aria-busy=["']true["']/.test(content)
    && content.includes(config.skeleton)
    && content.includes(config.ready)
    && content.includes('assets/js/core/page-hydration.js');
}
function hasCanonicalCompletion(config, hydrationRuntime) {
  if (config.completion.type === 'route') return hydrationRuntime.includes(config.completion.token);
  const controller = read(config.completion.file);
  return config.completion.tokens.every((token) => controller.includes(token));
}

const hydrationRuntime=read('assets/js/core/page-hydration.js');
const pages=Object.entries(PAGES).map(([file,config])=>{
