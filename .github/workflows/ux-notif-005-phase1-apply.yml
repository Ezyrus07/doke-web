name: UX-NOTIF-005 Phase 1 Apply

on:
  push:
    branches:
      - ux/ux-notif-005-inbox-reconciliation
    paths:
      - '.github/workflows/ux-notif-005-phase1-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard exact H05 parent chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2b724e7cbbd58ecaae5a9b4dc22ae434f7349af0"
          test "$(git rev-parse HEAD^^)" = "ef25990ef2047a9dc677c947b1e9203caf96e51f"
          test "$(git rev-parse HEAD^^^)" = "142602a8cdfc202b10583ca209b68909c70b3ccd"
          test "$(git rev-parse HEAD^^^^)" = "18a244d0f55a05f97a9ca6c321dc0a7b12352f9c"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply H05 reconciliation patch
        run: python scripts/tmp-ux-notif-005-phase1.py

      - name: Correct dismissed reconciliation harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-ux-notif-005-inbox-reconciliation.js')
          source = path.read_text(encoding='utf-8')
          old = """center.dismiss('remote-a', { pendingSync: true });
          item = center.getSnapshot().items.find((entry) => entry.id === 'remote-a');
          assert.equal(item.dismissed, true);
          assert.equal(item.dismissSyncState, 'PENDING_SYNC');
          center.reconcile([
            { id: 'remote-new-id', eventId: 'evt-shared', eventAccepted: true, eventCategory: 'MESSAGES', read: true, dismissed: false }
          ], { completeSnapshot: true, freshness: 'STALE', sourceAuthority: 'CANONICAL_REMOTE' });
          item = center.getSnapshot().items.find((entry) => entry.id === 'remote-a');
          assert.equal(item.dismissed, true, 'stale remote snapshot must not undo optimistic dismiss');
          assert.equal(item.dismissSyncState, 'PENDING_SYNC');
          center.resolveMutation('remote-a', 'dismiss', { status: 'SYNCED', item: { dismissed: true } });
          item = center.getSnapshot().items.find((entry) => entry.id === 'remote-a');
          assert.equal(item.dismissSyncState, 'SYNCED');
          """
          new = """center.dismiss('remote-a', { pendingSync: true });
          assert.equal(center.getSnapshot().items.some((entry) => entry.id === 'remote-a'), false,
            'optimistically dismissed item must leave the active public snapshot');
          center.reconcile([
            { id: 'remote-new-id', eventId: 'evt-shared', eventAccepted: true, eventCategory: 'MESSAGES', read: true, dismissed: false }
          ], { completeSnapshot: true, freshness: 'STALE', sourceAuthority: 'CANONICAL_REMOTE' });
          assert.equal(center.getSnapshot().items.some((entry) => entry.id === 'remote-a'), false,
            'stale remote snapshot must not resurrect an optimistic dismiss');
          center.resolveMutation('remote-a', 'dismiss', { status: 'SYNCED', item: { dismissed: true } });
          assert.equal(center.getSnapshot().items.some((entry) => entry.id === 'remote-a'), false,
            'remote dismiss confirmation must preserve the item outside the active snapshot');
          """
          if old not in source:
              raise SystemExit('dismiss harness anchor missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Migrate H01 sync surface contract to H05 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-ux-notif-001-surface-contract.js')
          source = path.read_text(encoding='utf-8')
          old = "assert(repository.includes(\"dispatchSynced(scoped, source || 'repository')\"));"
          new = """assert(repository.includes(\"dispatchSynced(scoped, source || 'repository', metadata || {})\"));
          assert(repository.includes(\"accountId: normalizeText(user.id || user.userId || user.uid || '')\"));
          assert(repository.includes(\"freshness: normalizeText(metadata.freshness || 'UNKNOWN').toUpperCase()\"));
          assert(repository.includes('completeSnapshot: metadata.completeSnapshot !== false'));"""
          if old not in source:
              raise SystemExit('H01 sync surface anchor missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate H05 syntax and behavior
        run: |
          node --check assets/js/core/notification-center.js
          node --check assets/js/repositories/notifications-repository.js
          node --check assets/js/features/in-app-notifications.js
          node --check scripts/test-ux-notif-005-inbox-reconciliation.js
          node --check scripts/test-ux-notif-005-adapter-repository-contract.js
          node --check scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-005-inbox-reconciliation.js
          node scripts/test-ux-notif-005-adapter-repository-contract.js

      - name: Preserve UX-NOTIF-001 through UX-NOTIF-004
        run: |
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-002-notification-event.js
          node scripts/test-ux-notif-002-repository-adapter.js
          node scripts/test-ux-notif-002-producer-envelopes.js
          node scripts/test-ux-notif-002-financial-producer-handoff.js
          node scripts/test-ux-notif-003-toast-manager.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-in-app-delegation.js
          node scripts/test-ux-notif-004-badge-snapshot.js

      - name: Preserve notification and account authorities
        run: |
          node scripts/test-notification-authority-contract.js
          node scripts/test-notifications-supabase-repository-contract.js
          node scripts/audit-notifications-api-contract.js
          node scripts/test-ux-priv-001-account-storage.js
          node scripts/audit-auth-session-contracts.js

      - name: Regenerate and audit canonical matrix
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix

      - name: Validate canonical agent governance
        run: npm run audit:agent-governance

      - name: Validate patch and publish functional H05 commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add assets/js/core/notification-center.js \
            assets/js/repositories/notifications-repository.js \
            assets/js/features/in-app-notifications.js \
            scripts/test-ux-notif-001-surface-contract.js \
            scripts/test-ux-notif-005-inbox-reconciliation.js \
            scripts/test-ux-notif-005-adapter-repository-contract.js \
            docs/ux/UX-NOTIF-005.md \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No functional H05 changes to commit.'; exit 1; }
          git commit -m 'feat(ux-notif-005): reconcile inbox mutations offline'
          git push origin HEAD:ux/ux-notif-005-inbox-reconciliation
