name: Doke UX-RESP-DEBT-005 Residual Cluster Diagnostic

on:
  push:
    branches:
      - diag/ux-resp-debt-005-residual-clusters

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-004 ancestry
        run: test "$(git merge-base HEAD ecb54eef031754cf91b9ec4340f382768f11f027)" = "ecb54eef031754cf91b9ec4340f382768f11f027"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply workspace-only canonical tablet header candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/components/shell/tablet-internal-rail-contract.css')
          s=p.read_text()
          reps={
            '--doke-internal-tablet-header-height: 96px;':'--doke-internal-tablet-header-height: var(--doke-header-height, 70px);',
            '--doke-internal-tablet-header-pad-top: 20px;':'--doke-internal-tablet-header-pad-top: 12px;',
            '--doke-internal-tablet-header-pad-bottom: 10px;':'--doke-internal-tablet-header-pad-bottom: 8px;',
            '--doke-internal-tablet-gap: 12px;':'--doke-internal-tablet-gap: var(--doke-header-gap, 8px);',
            'border-radius: 50% !important;':'border-radius: var(--radius-pill) !important;',
          }
          for old,new in reps.items():
            n=s.count(old)
            print(old,'count=',n)
            if n != 1: raise SystemExit(f'expected exactly one match for {old!r}, got {n}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff -- assets/css/components/shell/tablet-internal-rail-contract.css

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run full responsive contract against candidate
        shell: bash
        run: |
          node scripts/generate-responsive-index-baseline.js
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 1
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json','utf8'));
          console.log('PROBE_SUMMARY',JSON.stringify(r.summary));
          console.log('PROBE_FAILURES',JSON.stringify((r.failures||[]).map(f=>({page:f.page,breakpoint:f.breakpoint,component:f.component,property:f.property,expected:f.expected,actual:f.actual,selector:f.selector}))));
          if(r.summary.checks!==897) throw new Error('checks drift');
          if(r.summary.skips!==276) throw new Error('skips drift');
          if(r.summary.failures>=25) throw new Error('candidate did not reduce debt');
          NODE

      - name: Run shared header and responsive boundaries audits
        run: |
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
