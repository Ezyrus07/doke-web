name: REP-A03 Review Moderation Lifecycle

on:
  pull_request:
    paths:
      - 'backend/modules/reputation/review-moderation-lifecycle.js'
      - 'config/rep-a03-review-moderation-lifecycle.json'
      - 'tests/fixtures/rep-a03-review-moderation-cases.json'
      - 'docs/REP-A03-REVIEW-MODERATION-LIFECYCLE.md'
      - 'scripts/audit-rep-a03-review-moderation-lifecycle.js'
      - 'scripts/test-rep-a03-review-moderation-lifecycle.js'
      - '.github/workflows/rep-a03-review-moderation-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rep-a03-review-moderation-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax
        run: |
          node --check backend/modules/reputation/review-moderation-lifecycle.js
          node --check scripts/audit-rep-a03-review-moderation-lifecycle.js
          node --check scripts/test-rep-a03-review-moderation-lifecycle.js

      - name: Audit moderation lifecycle
        run: node scripts/audit-rep-a03-review-moderation-lifecycle.js

      - name: Moderation lifecycle conformance
        run: node scripts/test-rep-a03-review-moderation-lifecycle.js

      - name: REP-A02 regression
        run: |
          node scripts/audit-rep-a02-review-command-authority.js
          node scripts/test-rep-a02-review-command-authority.js

      - name: REP-A01 regression
        run: |
          node scripts/audit-rep-a01-authority-baseline.js
          node scripts/test-rep-a01-authority-baseline.js

      - name: DSP-A05 predecessor regression
        run: |
          node scripts/audit-dsp-a05-operator-case-dual-control-readiness.js
          node scripts/test-dsp-a05-operator-case-dual-control-readiness.js

      - name: Diff hygiene
        run: git diff --check
