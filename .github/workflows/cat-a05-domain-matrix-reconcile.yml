name: CAT-A05 Domain Matrix Reconcile

on:
  push:
    branches:
      - 'cat/cat-001-baseline-audit'
    paths:
      - '.github/workflows/cat-a05-domain-matrix-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a05-domain-matrix-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Regenerate deterministic domain matrix artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate deterministic matrix
        run: npm run write:domain-completion-matrix

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "No generated drift remains."
            exit 0
          fi
          git commit -m "Regenerate CAT domain matrix evidence"
          git push origin HEAD:cat/cat-001-baseline-audit
