name: AUTH-A02 Canonical Session Apply

on:
  push:
    branches:
      - auth/auth-001-baseline-audit
    paths:
      - '.github/workflows/auth-a02-apply.yml'
      - 'scripts/apply-auth-a02.mjs'

permissions:
  contents: write

concurrency:
  group: auth-a02-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-auth-a02:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AUTH branch
        uses: actions/checkout@v4
        with:
          ref: auth/auth-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply AUTH-A02 transformation
        run: node scripts/apply-auth-a02.mjs

      - name: Remove temporary applicator
        run: git rm .github/workflows/auth-a02-apply.yml scripts/apply-auth-a02.mjs

      - name: Regenerate governed matrix
        run: npm run write:domain-completion-matrix

      - name: Validate canonical auth session
        run: |
          npm run audit:auth-session
          npm run audit:auth-real-contract
          npm run test:real-auth-only-contract
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Commit AUTH-A02 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "AUTH-A02 tree already current."
            exit 0
          fi
          git commit -m "Implement AUTH-A02 canonical Supabase session"
          git push origin HEAD:auth/auth-001-baseline-audit
