name: COM-B03C-R5C Single-Use Corrected Terminal Observation Trigger Readiness

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r5c.js'
      - 'config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.json'
      - 'scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js'
      - 'docs/validation/COM-B03C-R5C-SINGLE-USE-CORRECTED-TERMINAL-OBSERVATION-TRIGGER-READINESS.json'
      - '.github/workflows/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r5c.js
          node --check scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
      - name: R5C repository trigger readiness
        run: node scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
      - name: Consumed authorization and corrected bridge preserved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5b-r5a-fresh-authorization-consumption.json)" = "a2ed29dc6a44f9d62f5159dfeabd2c769f677b50"
          test "$(git rev-parse HEAD:scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js)" = "ff083f29e43b2f85045b23bf8f12a4b354fb0005"
          test ! -e config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
      - name: Remote execution hard block
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const r5c = require('./backend/modules/communities/community-realtime-private-auth-r5c');
          try {
            r5c.assertRemoteExecutionBoundaryAbsent();
            process.exit(1);
          } catch (error) {
            if (error?.code !== r5c.REMOTE_EXECUTION_BLOCK_CODE) throw error;
          }
          NODE
      - name: Repository-only workflow surface
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.yml
          test ! -e config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
          ! grep -Eq '^[[:space:]]*push:' "$workflow"
          ! grep -Eq '^[[:space:]]*environment:' "$workflow"
          ! grep -Eq 'secrets\.' "$workflow"
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check
