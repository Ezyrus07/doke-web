name: TEMP COM-B02BQ Observable Certification and Matrix Reconciliation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02bq-observable-certification-and-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  certify-reconcile-and-finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: dc1c5ed3c08af4172a578296a4a699a648ffff50
      CANDIDATE_TREE: 5977ee6a87737159b25afbf88e4a05735483c359
      PREDECESSOR_HEAD: d74e58d6cf2612e370dc10e8fdc115f8375016cf
      PREDECESSOR_TREE: 58453ab8c59a534343efe2a50085169521c804d9
      B02BQ_MODULE_BLOB: d6bc5dc59ff56487888a46b4a63c10729c1c040e
      B02BQ_CONFIG_BLOB: 2722f04cb98bf0bd05be4273c2672c8f8d3cc4b1
      B02BQ_TEST_BLOB: 0e794c8747087fbc89ac0bdc013a3facdd4b76c1
      B02BQ_WORKFLOW_BLOB: b661a8f9e3efea225376d113672f15ca9ebc3a8f
      B02BP_READINESS_BLOB: 66917b82fd519524db6ea539da99f80ee6fd9ad0
      B02AZ_INSTANCE_BLOB: 35e2bbe0b983d6a249bc7f8cb4ee157d3b85d654
      B02BO_BINDING_BLOB: 16da9ada3a308535e5515a242ac381c54c7c2fc4
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02bq-observable-certification-and-matrix-reconciliation.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization-readiness.js
      CONFIG: config/com-b02bq-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization-readiness.json
      TEST: scripts/test-com-b02bq-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization-readiness.js
      CANONICAL_WORKFLOW: .github/workflows/com-b02bq-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization-readiness.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze candidate lineage and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          for commit in $(git rev-list --first-parent "$CANDIDATE_HEAD"..HEAD); do
            test "$(git diff-tree --no-commit-id --name-only -r "$commit" | sort -u)" = "$TEMP_PATH"
          done
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$CANDIDATE_HEAD^")" = "$PREDECESSOR_HEAD"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          expected="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02BQ_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02BQ_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02BQ_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02BQ_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment-readiness-after-executable-reference-binding.js)" = "$B02BP_READINESS_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js)" = "$B02AZ_INSTANCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-method-references-binding.js)" = "$B02BO_BINDING_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02BQ candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'Object\.definePropert(y|ies)\(' "$TARGET"
          ! grep -E '\.(call|apply)[[:space:]]*\(|Reflect\.apply[[:space:]]*\(' "$TARGET"
          ! grep -E 'attachmentCapableTargetMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|attachmentAppliedToEntryContainerInstance[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableOperationMethodsInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Reconcile Matrix only for the exact stale-derived blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npm run audit:domain-completion-matrix 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output"
            stale='- docs/DOMAIN-COMPLETION-MATRIX.md is stale; run npm run write:domain-completion-matrix'
            test "$(printf '%s\n' "$output" | grep -Fxc -- "$stale")" -eq 1
            unexpected="$(printf '%s\n' "$output" | grep '^- ' | grep -Fvx -- "$stale" || true)"
            test -z "$unexpected"
            npm run write:domain-completion-matrix
          fi
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          changed="$(git diff --name-only | sort)"
          if [ -n "$changed" ]; then
            expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
            test "$changed" = "$expected"
          fi

      - name: Matrix governance and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node "$TEST"
          git diff --check "$PREDECESSOR_HEAD" HEAD
          git diff --check
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Commit permanent derived state and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- reports/generated/domain-completion-matrix-report.json
          git rm -- "$TEMP_PATH"
          git commit -m "ci(com): finalize B02BQ repository-only certification [run ${GITHUB_RUN_ID}]"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02bq-'
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Certify permanent B02BQ tree
        shell: bash
        run: |
          set -euo pipefail
          expected4="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          expected6="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json "$TEST" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected4" || test "$actual" = "$expected6"
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02BQ_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02BQ_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02BQ_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02BQ_WORKFLOW_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02bq-'

      - name: Fast-forward branch only if TEMP head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
