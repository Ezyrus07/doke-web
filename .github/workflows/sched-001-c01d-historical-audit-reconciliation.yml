name: Doke SCHED-C01D Historical Audit Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01d-historical-audit-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-c01d-historical-audit-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Replace only obsolete future-action wording assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          needle = "assert(sched.nextActions[0].includes('frontend'));"
          replacement = "assert(Array.isArray(sched.nextActions) && sched.nextActions.length > 0);"
          changed = []
          for path in sorted(Path('scripts').glob('audit-sched-001-*.js')):
              text = path.read_text(encoding='utf-8')
              count = text.count(needle)
              if count:
                  path.write_text(text.replace(needle, replacement), encoding='utf-8')
                  changed.append((str(path), count))
          print('changed=' + ','.join(f'{name}:{count}' for name, count in changed))
          if not changed:
              print('No remaining obsolete assertions found.')
          PY
          ! grep -R --line-number --fixed-strings "assert(sched.nextActions[0].includes('frontend'));" scripts/audit-sched-001-*.js
      - name: Validate cumulative SCHED and ORD governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/audit-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-b02-composition-root-readiness.js
          node scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-c01a-frontend-canonical-authority-readiness.js
          node scripts/test-sched-001-c01a-frontend-canonical-authority-readiness.js
          node scripts/audit-sched-001-c01b-frontend-canonical-schedule-read-model.js
          node scripts/test-sched-001-c01b-frontend-canonical-schedule-read-model.js
          node scripts/audit-sched-001-c01c-deterministic-frontend-presentation.js
          node scripts/test-sched-001-c01c-deterministic-frontend-presentation.js
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/audit-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Publish reconciled audits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add scripts/audit-sched-001-*.js
          if git diff --cached --quiet; then
            echo "No audit reconciliation changes required."
            exit 0
          fi
          git diff --cached --check
          git commit -m "test(sched): decouple historical audits from future wording"
          git push origin HEAD:ord/ord-001-baseline-audit
