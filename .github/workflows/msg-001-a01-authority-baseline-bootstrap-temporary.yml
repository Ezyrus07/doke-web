name: Doke Temporary MSG-A01 Authority Baseline Bootstrap

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a01-authority-baseline-bootstrap-temporary.yml'

permissions:
  contents: write

concurrency:
  group: msg-001-a01-authority-baseline-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 20

      - name: Require stacked immutable ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 749a15a14cb7282a04b834ec88240dcbc65e0eae HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Generate canonical MSG-A01 baseline
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');

          const write = (file, content) => {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content.endsWith('\n') ? content : content + '\n');
          };
          const addUnique = (items, value) => {
            if (!items.includes(value)) items.push(value);
          };

          const config = {
            contractVersion: 'msg-a01-authority-baseline-v1',
            status: 'repository_only_baseline_frozen',
            domain: 'MSG-001',
            scope: 'browser_backend_realtime_and_attachment_authority_inventory',
            observedAt: '2026-08-02T16:12:00-03:00',
            repository: {
              name: 'Ezyrus07/doke-web',
              branch: 'msg/msg-001-baseline-audit',
              baseBranch: 'ord/ord-001-baseline-audit',
              baseHead: '749a15a14cb7282a04b834ec88240dcbc65e0eae'
            },
            authorityBoundary: {
              environmentAccess: 'none',
              stagingReadsAuthorized: false,
              stagingMutationsAuthorized: false,
              migrationApplicationAuthorized: false,
              realtimePublicationChangeAuthorized: false,
              storagePolicyChangeAuthorized: false,
              deploymentAuthorized: false,
              productionAuthorized: false,
              mergeAuthorized: false
            },
            browserFindings: {
              repositoryDeclaresLocalMockPersistenceBoundary: true,
              conversationStorageKey: 'doke.conversations.local.v1',
              legacyMessageStorageKey: 'doke.messages.local.v1',
              remoteReadFailureFallsBackToLocal: true,
              remoteWriteFailurePersistsPendingLocalState: true,
              pendingLocalSynchronizationExists: true,
              realAndFixtureAuthorityAreNotSeparated: true,
              sessionFallbackReadsBrowserStorage: true
            },
            presenceFindings: {
              transport: 'localStorage',
              presenceKey: 'doke.chat.presence.v1',
              typingKey: 'doke.chat.typing.v1',
              readReceiptKey: 'doke.chat.reads.v1',
              crossDeviceAuthoritative: false,
              fallbackIdentity: 'local-user'
            },
            backendFindings: {
              messagingServiceExists: true,
              supabaseRequiredForRuntimeHandlers: true,
              participantScopeValidated: true,
              internalOperationsRequireServiceRoleClient: true,
              createConversationForOrderExists: true,
              sendMessageExists: true,
              markConversationReadExists: true
            },
            databaseFindings: {
              conversationsRlsDeclared: true,
              messagesRlsDeclared: true,
              participantSelectPoliciesDeclared: true,
              browserConversationInsertDeclared: true,
              browserConversationUpdateDeclared: true,
              browserMessageInsertDeclared: true,
              browserMessageUpdateDeclared: true,
              conversationsRealtimePublicationDeclared: false,
              messagesRealtimePublicationDeclared: false
            },
            attachmentFindings: {
              bucket: 'transaction-attachments',
              signedUrlTtlSeconds: 900,
              localFallbackEnabled: true,
              pendingInlinePreviewEnabled: true,
              repositoryStoragePolicyMapComplete: false
            },
            blockerDisposition: {
              'MSG-B02': {
                status: 'confirmed',
                reason: 'No repository migration publishes conversations or messages to Supabase Realtime.'
              },
              'MSG-B03': {
                status: 'confirmed',
                reason: 'Persistent local conversations, messages, presence, typing and read receipts can diverge across devices.'
              },
              'MSG-B04': {
                status: 'confirmed_repository_mapping_incomplete',
                reason: 'The attachment repository targets transaction-attachments, but a complete canonical bucket-policy and lifecycle map is not frozen in MSG-001.'
              }
            },
            orderedNextActions: [
              'MSG-A02: freeze canonical conversation and message authority so authenticated UUID sessions are remote-only and non-UUID fixtures are memory-only.',
              'MSG-A03: introduce a server-owned command and read-state boundary; retire silent browser DML success and persistent pending fallback for real sessions.',
              'MSG-A04: prepare participant-scoped Realtime publication and subscription contracts without applying staging changes.',
              'MSG-A05: map and harden transaction-attachments ownership, signed URL, cleanup and retention boundaries.'
            ],
            effects: {
              stagingReads: 0,
              stagingMutations: 0,
              migrationsApplied: 0,
              realtimePublicationChanges: 0,
              storagePolicyChanges: 0,
              deployments: 0,
              productionChanged: false,
              accountsChanged: 0,
              messagesChanged: 0,
              pullRequestsMerged: 0
            }
          };

          const configJson = JSON.stringify(config, null, 2) + '\n';
          write('config/msg-001-a01-authority-baseline.json', configJson);
          write('docs/validation/MSG-001-A01-AUTHORITY-BASELINE.json', configJson);

          const docs = `# MSG-001 / A01 — Authority baseline\n\n## Outcome\n\nMSG-A01 freezes the current repository authority split without accessing staging. The browser has a Supabase-capable repository and the backend has a messaging service, but persistent local authority and silent fallback remain active.\n\n## Confirmed browser authority gaps\n\n- Conversations persist under \`doke.conversations.local.v1\` and the legacy \`doke.messages.local.v1\` key.\n- A failed remote read returns local data.\n- A failed remote write is retained as pending local success and may synchronize later.\n- Authenticated real identities and non-UUID fixtures are not yet separated into remote-only versus memory-only authority.\n- Presence, typing and read receipts use \`localStorage\`, so they are same-browser coordination rather than cross-device realtime.\n\n## Backend and database state\n\nThe server messaging module already requires Supabase, validates participant scope and exposes conversation creation, message sending and read-state operations. Repository migrations enable RLS for \`conversations\` and \`messages\`, but still declare authenticated browser insert/update policies. No migration publishes either table to Supabase Realtime.\n\n## Attachments\n\nThe attachment repository targets the private \`transaction-attachments\` bucket and creates short-lived signed URLs, but failed uploads become local pending previews. The canonical bucket-policy, cleanup and retention map remains incomplete under MSG-B04.\n\n## Blockers\n\n- **MSG-B02 confirmed:** \`conversations\` and \`messages\` are not declared in the Realtime publication.\n- **MSG-B03 confirmed:** local and remote authorities can diverge across devices.\n- **MSG-B04 confirmed:** the transaction attachment storage lifecycle is not fully mapped and frozen.\n\n## Ordered next work\n\n1. MSG-A02 — remote-only authority for authenticated UUID sessions; non-UUID fixtures memory-only.\n2. MSG-A03 — server-owned command/read-state boundary and fail-closed real-session behavior.\n3. MSG-A04 — participant-scoped Realtime publication and subscription readiness.\n4. MSG-A05 — attachment policy, signed URL, cleanup and retention hardening.\n\n## Safety\n\n- staging reads: 0\n- staging mutations: 0\n- migrations applied: 0\n- realtime publication changes: 0\n- storage policy changes: 0\n- deployments: 0\n- production changes: 0\n- accounts or real messages changed: 0\n- merge: 0\n`;
          write('docs/MSG-001-A01-AUTHORITY-BASELINE.md', docs);

          const audit = `#!/usr/bin/env node\n'use strict';\n\nconst assert = require('assert');\nconst fs = require('fs');\nconst path = require('path');\n\nconst paths = {\n  config: 'config/msg-001-a01-authority-baseline.json',\n  evidence: 'docs/validation/MSG-001-A01-AUTHORITY-BASELINE.json',\n  docs: 'docs/MSG-001-A01-AUTHORITY-BASELINE.md',\n  messagesRepository: 'assets/js/repositories/messages-repository.js',\n  presence: 'assets/js/features/chat-realtime-presence.js',\n  backend: 'backend/modules/messaging/messaging-service.js',\n  migration: 'supabase/migrations/011_messages_shared_runtime.sql',\n  attachments: 'assets/js/repositories/attachments-repository.js',\n  matrix: 'config/domain-completion-matrix.json',\n  package: 'package.json',\n  workflow: '.github/workflows/msg-001-a01-authority-baseline.yml'\n};\n\nObject.values(paths).forEach((file) => assert(fs.existsSync(file), 'Missing MSG-A01 asset: ' + file));\n\nconst config = JSON.parse(fs.readFileSync(paths.config, 'utf8'));\nconst evidence = JSON.parse(fs.readFileSync(paths.evidence, 'utf8'));\nconst docs = fs.readFileSync(paths.docs, 'utf8');\nconst messagesRepository = fs.readFileSync(paths.messagesRepository, 'utf8');\nconst presence = fs.readFileSync(paths.presence, 'utf8');\nconst backend = fs.readFileSync(paths.backend, 'utf8');\nconst migration = fs.readFileSync(paths.migration, 'utf8');\nconst attachments = fs.readFileSync(paths.attachments, 'utf8');\nconst matrix = JSON.parse(fs.readFileSync(paths.matrix, 'utf8'));\nconst pkg = JSON.parse(fs.readFileSync(paths.package, 'utf8'));\nconst workflow = fs.readFileSync(paths.workflow, 'utf8');\n\nassert.deepStrictEqual(evidence, config);\nassert.strictEqual(config.contractVersion, 'msg-a01-authority-baseline-v1');\nassert.strictEqual(config.status, 'repository_only_baseline_frozen');\nassert.strictEqual(config.authorityBoundary.environmentAccess, 'none');\nObject.values(config.effects).forEach((value) => assert(value === 0 || value === false));\n\n[\n  \"var STORAGE_KEY = 'doke.conversations.local.v1'\",\n  \"var LEGACY_STORAGE_KEY = 'doke.messages.local.v1'\",\n  \"setProviderState('local-fallback')\",\n  \"return loadLocal(options)\",\n  \"saveLocal(normalized, 'pending')\",\n  \"syncStatus: 'pending'\"\n].forEach((fragment) => assert(messagesRepository.includes(fragment), 'Messages repository missing baseline fragment: ' + fragment));\n\n[\n  \"var STORAGE_KEY = 'doke.chat.presence.v1'\",\n  \"var TYPING_KEY = 'doke.chat.typing.v1'\",\n  \"var READ_KEY = 'doke.chat.reads.v1'\",\n  \"return { id: 'local-user', name: 'Você' }\",\n  'localStorage.getItem',\n  'localStorage.setItem'\n].forEach((fragment) => assert(presence.includes(fragment), 'Presence baseline missing fragment: ' + fragment));\n\n[\n  'Supabase user client is required for messaging runtime handlers.',\n  'Internal messaging operations require a configured server-side service-role client.',\n  'async function createConversationForOrder',\n  'async function sendMessage',\n  'async function markConversationRead',\n  'assertConversationAccess'\n].forEach((fragment) => assert(backend.includes(fragment), 'Backend baseline missing fragment: ' + fragment));\n\n[\n  'alter table public.conversations enable row level security',\n  'alter table public.messages enable row level security',\n  'conversation_participants_insert',\n  'conversation_participants_update',\n  'message_sender_insert',\n  'message_participants_update'\n].forEach((fragment) => assert(migration.includes(fragment), 'Migration baseline missing fragment: ' + fragment));\n\n[\n  \"var BUCKET = 'transaction-attachments'\",\n  'var SIGNED_URL_TTL = 900',\n  \"setProviderState('local-fallback')\",\n  \"syncStatus: 'pending'\"\n].forEach((fragment) => assert(attachments.includes(fragment), 'Attachment baseline missing fragment: ' + fragment));\n\nconst migrationText = fs.readdirSync('supabase/migrations')\n  .filter((file) => file.endsWith('.sql'))\n  .map((file) => fs.readFileSync(path.join('supabase/migrations', file), 'utf8'))\n  .join('\\n');\nassert(!/alter\\s+publication\\s+supabase_realtime[\\s\\S]{0,300}add\\s+table[\\s\\S]{0,100}public\\.(conversations|messages)/i.test(migrationText));\n\nconst version = String(matrix.version).split('.').map(Number);\nassert.strictEqual(version[0], 1);\nassert.strictEqual(version[1], 3);\nassert(version[2] >= 78, 'MSG-A01 requires matrix 1.3.78 or later');\nconst msg = matrix.domains.find((domain) => domain.id === 'MSG-001');\nassert(msg);\nassert.strictEqual(msg.maturity, 3);\nassert.strictEqual(msg.userFacingAuthority, 'hybrid');\nassert.strictEqual(msg.serverAuthority, 'partial');\nassert.deepStrictEqual(msg.blockers.map((item) => item.id), ['MSG-B02', 'MSG-B03', 'MSG-B04']);\nassert(msg.evidence.some((item) => item.includes('MSG-A01')));\nassert(msg.nextActions.some((item) => item.includes('MSG-A02')));\nObject.values(paths).filter((file) => ![paths.matrix, paths.package].includes(file)).forEach((file) => {\n  assert(msg.requiredPaths.includes(file), 'MSG requiredPaths missing ' + file);\n});\nassert(msg.tests.includes('audit:msg-001-a01-authority-baseline'));\nassert.strictEqual(pkg.scripts['audit:msg-001-a01-authority-baseline'], 'node scripts/audit-msg-001-a01-authority-baseline.js');\n\n[\n  'persistent local authority',\n  'MSG-B02 confirmed',\n  'MSG-B03 confirmed',\n  'MSG-B04 confirmed',\n  'staging reads: 0',\n  'production changes: 0'\n].forEach((fragment) => assert(docs.includes(fragment), 'MSG-A01 docs missing ' + fragment));\n\nassert(workflow.includes('permissions:\\n  contents: read'));\nassert(workflow.includes('npm run audit:msg-001-a01-authority-baseline'));\n[\n  'contents: write',\n  'secrets.',\n  'SUPABASE_ACCESS_TOKEN',\n  'SUPABASE_DB_PASSWORD',\n  'psql ',\n  'curl ',\n  'git push'\n].forEach((fragment) => assert(!workflow.includes(fragment), 'MSG-A01 workflow contains prohibited fragment: ' + fragment));\n\nconsole.log('MSG-A01 authority baseline audit passed.');\n`;
          write('scripts/audit-msg-001-a01-authority-baseline.js', audit);

          const permanentWorkflow = [
            'name: Doke MSG-A01 Authority Baseline',
            '',
            'on:',
            '  pull_request:',
            '    branches:',
            '      - ord/ord-001-baseline-audit',
            '    paths:',
            "      - 'config/msg-001-a01-authority-baseline.json'",
            "      - 'docs/MSG-001-A01-AUTHORITY-BASELINE.md'",
            "      - 'docs/validation/MSG-001-A01-AUTHORITY-BASELINE.json'",
            "      - 'scripts/audit-msg-001-a01-authority-baseline.js'",
            "      - 'assets/js/repositories/messages-repository.js'",
            "      - 'assets/js/features/chat-realtime-presence.js'",
            "      - 'backend/modules/messaging/messaging-service.js'",
            "      - 'assets/js/repositories/attachments-repository.js'",
            "      - 'supabase/migrations/**'",
            "      - 'config/domain-completion-matrix.json'",
            "      - 'package.json'",
            "      - '.github/workflows/msg-001-a01-authority-baseline.yml'",
            '',
            'permissions:',
            '  contents: read',
            '',
            'jobs:',
            '  baseline:',
            '    runs-on: ubuntu-24.04',
            '    timeout-minutes: 10',
            '    steps:',
            '      - uses: actions/checkout@v4',
            '      - uses: actions/setup-node@v4',
            '        with:',
            '          node-version: 24',
            '          cache: npm',
            '      - name: Install pinned dependencies',
            '        run: npm ci --ignore-scripts',
            '      - name: Validate MSG-A01 authority baseline',
            '        run: |',
            '          node --check scripts/audit-msg-001-a01-authority-baseline.js',
            '          npm run audit:msg-001-a01-authority-baseline',
            '          npm run test:messages-supabase-repository-contract',
            '          npm run test:attachments-supabase-repository-contract',
            '          npm run audit:domain-completion-matrix',
            '          git diff --check',
            ''
          ].join('\n');
          write('.github/workflows/msg-001-a01-authority-baseline.yml', permanentWorkflow);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['audit:msg-001-a01-authority-baseline'] = 'node scripts/audit-msg-001-a01-authority-baseline.js';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const matrix = JSON.parse(fs.readFileSync('config/domain-completion-matrix.json', 'utf8'));
          if (matrix.version !== '1.3.77') throw new Error('Unexpected matrix version ' + matrix.version);
          const msg = matrix.domains.find((domain) => domain.id === 'MSG-001');
          if (!msg) throw new Error('MSG-001 missing from matrix');
          [
            'config/msg-001-a01-authority-baseline.json',
            'docs/MSG-001-A01-AUTHORITY-BASELINE.md',
            'docs/validation/MSG-001-A01-AUTHORITY-BASELINE.json',
            'scripts/audit-msg-001-a01-authority-baseline.js',
            '.github/workflows/msg-001-a01-authority-baseline.yml'
          ].forEach((file) => addUnique(msg.requiredPaths, file));
          addUnique(msg.tests, 'audit:msg-001-a01-authority-baseline');
          addUnique(msg.evidence, 'MSG-A01 froze the repository-only authority baseline: the browser retains persistent local conversation/message fallback and localStorage presence, typing and read receipts; the backend Supabase service and participant RLS exist; authenticated browser DML policies remain; conversations and messages are not declared in Supabase Realtime; transaction-attachments retains local pending fallback.');
          msg.nextActions = config.orderedNextActions.slice();
          matrix.version = '1.3.78';
          matrix.updatedAt = '2026-08-02T16:12:00-03:00';
          fs.writeFileSync('config/domain-completion-matrix.json', JSON.stringify(matrix, null, 2) + '\n');
          NODE

          npm run write:domain-completion-matrix

      - name: Validate baseline and cumulative governance
        run: |
          node --check scripts/audit-msg-001-a01-authority-baseline.js
          npm run audit:msg-001-a01-authority-baseline
          npm run test:messages-supabase-repository-contract
          npm run test:attachments-supabase-repository-contract
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage only canonical MSG-A01 artifacts
        run: |
          git add \
            config/msg-001-a01-authority-baseline.json \
            docs/MSG-001-A01-AUTHORITY-BASELINE.md \
            docs/validation/MSG-001-A01-AUTHORITY-BASELINE.json \
            scripts/audit-msg-001-a01-authority-baseline.js \
            .github/workflows/msg-001-a01-authority-baseline.yml \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              config/msg-001-a01-authority-baseline.json|docs/MSG-001-A01-AUTHORITY-BASELINE.md|docs/validation/MSG-001-A01-AUTHORITY-BASELINE.json|scripts/audit-msg-001-a01-authority-baseline.js|.github/workflows/msg-001-a01-authority-baseline.yml|package.json|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish MSG-A01 baseline
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(msg): freeze MSG-A01 authority baseline"
          git push origin HEAD:msg/msg-001-baseline-audit
