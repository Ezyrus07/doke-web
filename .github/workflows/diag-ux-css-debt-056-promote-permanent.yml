name: Doke UX-CSS-DEBT-056 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-056-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: c03cc9a3c6aef88a83a04e11eda4e9cc0c14d931
      PARENT_PARENT_SHA: a0d9a44014a172789c0389eccf6c17781c6c27f8
      TARGET_FILE: assets/css/components/before-after-workers-preview/mobile-comment-sheets.css
      PARENT_BLOB: c173db95663e2868f75fb883a003bd44fc1e8981
      TARGET_HASH: 94f4d0115f2684b709fd9cdbf4bd0f43c5e7a917020189edd632f66163950205
      TARGET_BYTES: 13923
      PERM_BRANCH: ux/ux-css-debt-056-mobile-comment-sheets-compaction
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-055 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2

      - name: Guard parent and seeded permanent namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_BLOB"
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PROMOTION GUARD PASS|parent=$PARENT_SHA|permanentSeed=$REMOTE"

      - name: Build exact certified candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const f=process.env.TARGET_FILE,lines=fs.readFileSync(f,'utf8').split(/\r?\n/);
          const remove=new Set([146,161,264,265]);
          const expected=new Map([[146,'    background: #07121f;'],[161,'    background: #07121f;'],[264,'    border-radius: var(--radius-lg) var(--radius-lg) 0 0;'],[265,'    box-shadow: 0 -16px 34px rgba(7, 20, 34, 0.18);']]);
          for(const [n,text] of expected)if(lines[n-1]!==text)throw new Error(`line ${n} drift: ${lines[n-1]}`);
          const s=lines.filter((_,i)=>!remove.has(i+1)).join('\n');
          fs.writeFileSync(f,s);
          const hash=crypto.createHash('sha256').update(s).digest('hex'),bytes=Buffer.byteLength(s);
          if(hash!==process.env.TARGET_HASH||String(bytes)!==process.env.TARGET_BYTES)throw new Error(`identity drift ${hash}/${bytes}`);
          console.log(`PROMOTION CANDIDATE PASS|sha256=${hash}|bytes=${bytes}`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t4\t'"$TARGET_FILE"
          git diff --check

      - name: Commit exact permanent product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -- "$TARGET_FILE"
          git commit -m 'UX-CSS-DEBT-056: compact superseded mobile preview sheet declarations'
          NEW_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"...HEAD -- "$TARGET_FILE")" = $'0\t4\t'"$TARGET_FILE"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          echo "PERMANENT COMMIT BUILT|sha=$NEW_SHA|parent=$PARENT_SHA|files=1|additions=0|deletions=4"

      - name: Atomic fast-forward permanent branch
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERM_BRANCH"
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$NEW_SHA"
          echo "PERMANENT PROMOTION PASS|branch=$PERM_BRANCH|sha=$REMOTE|parent=$PARENT_SHA"
