name: Doke UX-CSS-DEBT-037 Permanent Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-037-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 2c2b87e287a2df5f261be5cc9f94439ed9719145
      PARENT_SHA: 10e1f40f56717f8384c712cd2a07ec5acf4b645e
      TARGET_TREE: b1c2a941eb5619c94e23283dff20d4a70e5dbdeb
      TARGET_CSS: assets/css/pages/settings-workspace-contract.css
      PARENT_BLOB: 8913f5584384502383ae7893da24c40848fe2927
      TARGET_BLOB: aca38e15f30cad0542fe5011dc333ca1ca9b70cf
      TARGET_HASH: 83c0e786f553e35e542790e3e4d21e1fc57dd66665047d10e23e874274578a33
      TARGET_BYTES: '33320'
      PERM_BRANCH: ux/ux-css-debt-037-settings-workspace-contract-compaction
      PAGE: configuracoes.html
      PAGE_FOUNDATION: assets/css/pages/configuracoes-foundation.css
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Preserve exact-cert helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-037-cert-residual.cjs /tmp/ux-css-debt-037-cert-residual.cjs
          node --check /tmp/ux-css-debt-037-cert-residual.cjs

      - name: Checkout exact certified UX-CSS-DEBT-036 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2
          clean: true

      - name: Guard parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_CSS")" = "$PARENT_BLOB"
          test "$(wc -c < "$TARGET_CSS" | tr -d ' ')" = "35773"
          test -z "$(git status --porcelain)"
          echo "PARENT IDENTITY PASS|sha=$PARENT_SHA|blob=$PARENT_BLOB|bytes=35773"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate parent responsive baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          echo "PARENT RESPONSIVE BASELINE PASS|parent=$PARENT_SHA"

      - name: Checkout exact permanent SHA without product mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA" --depth=2
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "PERMANENT CHECKOUT PASS|sha=$TARGET_SHA"

      - name: Exact permanent identity scope and reach guard
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$TARGET_CSS"
          read -r add del file < <(git diff --numstat "$PARENT_SHA"...HEAD -- "$TARGET_CSS")
          test "$add" = "0" && test "$del" = "73" && test "$file" = "$TARGET_CSS"
          test "$(git hash-object "$TARGET_CSS")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_CSS" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_CSS" | tr -d ' ')" = "$TARGET_BYTES"
          test -z "$(git diff --name-only "$PARENT_SHA"...HEAD -- '*.js' '*.html' 'package.json' 'package-lock.json')"
          git diff --check "$PARENT_SHA"...HEAD
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const page=process.env.PAGE,foundation=process.env.PAGE_FOUNDATION,target=process.env.TARGET_CSS;
          const h=fs.readFileSync(page,'utf8'),f=fs.readFileSync(foundation,'utf8');
          const assert=(x,msg)=>{if(!x)throw new Error(msg)};
          assert((h.match(/assets\/css\/pages\/configuracoes-foundation\.css\?/g)||[]).length===1,'configuracoes foundation link cardinality drift');
          assert((f.match(/\.\/settings-workspace-contract\.css\?/g)||[]).length===1,'target import cardinality drift');
          const targetImporters=cp.execSync("git grep -l -F 'settings-workspace-contract.css?v=' -- assets/css || true",{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          assert(JSON.stringify(targetImporters)===JSON.stringify([foundation]),'target importer drift '+JSON.stringify(targetImporters));
          assert(!new RegExp('href=[\\"\\\'][^\\"\\\']*/settings-workspace-contract\\.css\\?','i').test(h),'target became direct page stylesheet');
          console.log(`REACH AUTHORITY PASS|chain=${page}->${foundation}->${target}|pages=1`);
          NODE
          echo "EXACT IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=73"

      - name: Responsive and governance gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Responsive contract test: PASS' /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:agent-governance
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo 'GOVERNANCE PASS|responsive=893/0/277|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Recalculate permanent CSS residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          node /tmp/ux-css-debt-037-cert-residual.cjs

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log(`NPM AUDIT SNAPSHOT|total=${v.total??'n/a'}|critical=${v.critical??'n/a'}|high=${v.high??'n/a'}|moderate=${v.moderate??'n/a'}|low=${v.low??'n/a'}`);
          NODE

      - name: Final exact-SHA certification marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_CSS")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_CSS" | awk '{print $1}')" = "$TARGET_HASH"
          echo "PERMANENT EXACT CERT PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=73|residual=37/922/0|conflicts=339|responsive=893/0/277|runtimeProof=transferred-by-byte-identity|prCreated=0"

      - name: Clean generated artifacts and restore exact permanent checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_CSS")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_CSS" | awk '{print $1}')" = "$TARGET_HASH"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0|prCreated=0|generatedArtifactsCleaned=1"
