name: ORD-A05 Legacy Write Auditor Reconcile Once

on:
  pull_request:
    paths:
      - .github/workflows/ord-a05-legacy-write-auditor-reconcile-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile legacy write-canary auditor with ORD-A04 read authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-orders-write-frontend-activation-runtime.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
            "objective: 'Validate manual frontend orders write activation with dataProvider locked to mock, idempotency headers and orders-domain isolation without external network.',": "objective: 'Validate manual frontend orders write activation while canonical reads remain on supabase-read, submitted writes stay disabled by default, and the canary preserves idempotency and domain isolation without external network.',",
            "assertEqual(config.ordersProvider, 'mock', 'Default ordersProvider must remain mock.');": "assertEqual(config.ordersProvider, 'supabase-read', 'Default ordersProvider must preserve ORD-A04 canonical remote reads.');",
            "record('default_state.mock_locked');": "record('default_state.remote_read_write_locked');",
            "'doke.ordersProvider': 'mock',": "'doke.ordersProvider': 'supabase-read',"
          }
          for old, new in replacements.items():
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one legacy auditor fragment, found {count}: {old}')
            source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          node scripts/validate-orders-write-frontend-activation-runtime.js
          node scripts/validate-orders-write-frontend-rollback-gate.js
          node scripts/audit-ord-001-a04-read-authority.js
          node scripts/audit-ord-001-a05-command-activation.js
          node scripts/test-order-command-activation-runtime.js
          git rm .github/workflows/ord-a05-legacy-write-auditor-reconcile-once.yml
          git add scripts/validate-orders-write-frontend-activation-runtime.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile ORD write auditor with canonical read authority"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

# One-shot applicator. It patches only the stale legacy auditor and removes itself.
