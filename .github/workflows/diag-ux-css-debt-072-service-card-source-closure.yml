name: Doke UX-CSS-DEBT-072 Service Card Source Closure

on:
  push:
    branches:
      - diag/ux-css-debt-072-service-card-source-closure
    paths:
      - .github/workflows/diag-ux-css-debt-072-service-card-source-closure.yml

permissions:
  contents: write

jobs:
  source-closure:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5c888a5ec84329062fac2de6ccf7ff3061fd07fd
      PARENT_SHA: 149bfa8cdb931543aabd1afb0a5453379f565ae8
      TARGET_TREE: 35fc95bdf180cea84723d70afed49a34e8a24489
      TARGET_FILE: assets/css/components/cards/service-card.css
      TARGET_BLOB: 0847b48ee62e3d09c737a35a46f6ce5271aac143
      RENDERER_FILE: assets/js/renderers/service-card-renderer.js
      RENDERER_BLOB: d527c6f6302af29a39ec3a3f737a81868d7af666
      RANKING_RUN: 32088325062
      DIAG_BRANCH: diag/ux-css-debt-072-service-card-source-closure
      RESULT_FILE: .diagnostics/ux-css-debt-072-source-closure.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
      - name: Guard exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$RENDERER_FILE")" = "$RENDERER_BLOB"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install and generate active graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/audit-service-card-baseline.js
      - name: Prove cascade importers reach renderer and candidate identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee /tmp/ux072-source.log
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');
          const f=process.env.TARGET_FILE,text=fs.readFileSync(f,'utf8');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(x=>x.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;
          const normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const x of tracked){const src=fs.readFileSync(x,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(src)))imports.push(normImport(m[1],x));meta.set(x,{src,imports})}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(x=>meta.has(x));while(todo.length){const x=todo.pop();if(active.has(x)||!meta.has(x))continue;active.add(x);for(const n of meta.get(x).imports)if(meta.has(n))todo.push(n)}if(active.size!==401)throw new Error(`active drift ${active.size}`);
          const importers=[...meta].filter(([x,m])=>x!==f&&m.imports.includes(f)).map(([x])=>x).sort();const activeImporters=importers.filter(x=>active.has(x));const expImporters=['assets/css/core/components.css','assets/css/pages/search-results-runtime-page.css'];if(JSON.stringify(importers)!==JSON.stringify(expImporters)||JSON.stringify(activeImporters)!==JSON.stringify(expImporters))throw new Error(`importers ${importers}/${activeImporters}`);
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function parse(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winnerLine:l.line,winnerValue:l.value,winnerImportant:l.important});if(!l||d.important||!l.important)last.set(k,d)}return{ds,dead}}
          const p=parse(text);if(p.ds.length!==289||p.dead.length!==10)throw new Error(`target metrics ${p.ds.length}/${p.dead.length}`);const got=p.dead.sort((a,b)=>a.line-b.line).map(d=>[d.line,d.selector,d.property,d.value,d.context,d.winnerLine,d.winnerValue,d.important,d.winnerImportant]);const exp=[[339,'body.home-index-shell .service-card:hover, body.home-index-shell .service-card:focus-within','transform','var(--doke-interaction-lift-card)','@media (min-width: 1025px)',375,'var(--doke-interaction-lift-card)',false,false],[340,'body.home-index-shell .service-card:hover, body.home-index-shell .service-card:focus-within','box-shadow','none','@media (min-width: 1025px)',376,'var(--doke-interaction-shadow-card)',false,false],[341,'body.home-index-shell .service-card:hover, body.home-index-shell .service-card:focus-within','border-color','rgba(82, 137, 198, 0.22)','@media (min-width: 1025px)',377,'var(--doke-interaction-border)',false,false],[346,'body.home-index-shell .service-card:hover .service-card__media, body.home-index-shell .service-card:focus-within .service-card__media','opacity','0.98','@media (min-width: 1025px)',414,'0.99',false,false],[471,':is(.service-card, .service-card--feed, .service-card--result)','border-radius','var(--doke-mobile-card-radius, var(--radius-surface))','@media (max-width: 760px)',574,'var(--radius-md)',false,false],[475,':is(.service-card, .service-card--feed, .service-card--result) .service-card__media','min-height','var(--doke-mobile-card-media, clamp(168px, 49vw, 206px))','@media (max-width: 760px)',578,'132px',false,false],[477,':is(.service-card, .service-card--feed, .service-card--result) .service-card__media','padding','var(--doke-mobile-card-padding, 14px)','@media (max-width: 760px)',580,'10px',false,false],[481,':is(.service-card, .service-card--feed, .service-card--result) .service-card__body','padding','var(--doke-mobile-card-padding, 14px)','@media (max-width: 760px)',595,'10px 10px 10px 12px',false,false],[482,':is(.service-card, .service-card--feed, .service-card--result) .service-card__body','gap','10px','@media (max-width: 760px)',594,'7px',false,false],[483,':is(.service-card, .service-card--feed, .service-card--result) .service-card__body','grid-template-columns','minmax(0, 1fr) auto','@media (max-width: 760px)',587,'minmax(0, 1fr)',false,false]];if(JSON.stringify(got)!==JSON.stringify(exp))throw new Error(`dead identity drift ${JSON.stringify(got)}`);
          const families=[...new Set(p.dead.map(d=>d.selector))];if(families.length!==5)throw new Error(`families ${families.length}`);const identical=p.dead.filter(d=>d.value===d.winnerValue&&d.important===d.winnerImportant).length;if(identical!==1)throw new Error(`identical ${identical}`);
          const reach=[];for(const pg of report.pageAssets){const seen=new Set(),stack=[...pg.css.filter(x=>meta.has(x))];while(stack.length){const x=stack.pop();if(seen.has(x)||!meta.has(x))continue;seen.add(x);if(x===f){reach.push(pg.page);break}for(const n of meta.get(x).imports)if(meta.has(n))stack.push(n)}}reach.sort();if(reach.length!==26)throw new Error(`reach ${reach.length}`);
          const renderer=fs.readFileSync(process.env.RENDERER_FILE,'utf8');for(const needle of ['service-card service-card--result','service-card__media','service-card__body'])if(!renderer.includes(needle))throw new Error(`renderer missing ${needle}`);const audit=JSON.parse(fs.readFileSync('docs/validation/global-cycle-25-service-card-baseline-report.json','utf8'));if(JSON.stringify(audit.stablePages)!==JSON.stringify(['index.html','resultados.html','perfil.html'])||audit.errors.length)throw new Error('service card baseline drift');
          const rows=new Set([338,339,340,345,470,474,476,480,481,482]);const candidate=text.split('\n').filter((_,i)=>!rows.has(i)).join('\n');const c=parse(candidate);if(c.ds.length!==279||c.dead.length!==0)throw new Error(`candidate metrics ${c.ds.length}/${c.dead.length}`);const b=Buffer.from(candidate),hash=crypto.createHash('sha256').update(b).digest('hex');
          console.log(`IMPORTER PASS|all=2|active=2|list=${activeImporters.join(',')}`);console.log('CASCADE PASS|target=289/10|families=5|identical=1|changed=9|important=0|browserRequired=1');console.log(`ACTIVE REACH|pages=${reach.length}|pageList=${reach.join(',')}`);console.log('REAL DOM AUTHORITY|renderer=1|stablePages=index.html,resultados.html,perfil.html|families=5/5');console.log(`CANDIDATE IDENTITY|candidate=279/0|sha256=${hash}|bytes=${b.length}|files=1|additions=0|deletions=10`);console.log(`SOURCE CLOSURE PASS|target=${f}|targetBlob=${process.env.TARGET_BLOB}|ranking=${process.env.RANKING_RUN}|browserRequired=1`);
          NODE
      - name: Restore exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA" && git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
      - name: Publish source closure evidence
        shell: bash
        run: |
          set -euo pipefail
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TARGET_SHA=$TARGET_SHA"; echo "TARGET_BLOB=$TARGET_BLOB"; grep '^IMPORTER PASS|' /tmp/ux072-source.log; grep '^CASCADE PASS|' /tmp/ux072-source.log; grep '^ACTIVE REACH|' /tmp/ux072-source.log; grep '^REAL DOM AUTHORITY|' /tmp/ux072-source.log; grep '^CANDIDATE IDENTITY|' /tmp/ux072-source.log; grep '^SOURCE CLOSURE PASS|' /tmp/ux072-source.log; echo 'RESULT=PASS'; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH"
          git checkout -B diag-output "origin/$DIAG_BRANCH"
          mkdir -p "$(dirname "$RESULT_FILE")" && cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE" && git commit -m "diag: record UX-CSS-DEBT-072 source closure [skip ci]"
          git push origin "HEAD:refs/heads/$DIAG_BRANCH"
