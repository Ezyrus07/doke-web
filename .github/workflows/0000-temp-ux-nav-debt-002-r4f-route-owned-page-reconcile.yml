name: TEMP UX-NAV-DEBT-002 R4f Route-Owned Page Reconcile

on:
  push:
    branches:
      - diag/ux-nav-debt-002-r4f-route-owned-page-reconcile-run

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      PARENT: 62ef65be4584da138fe7bbdbbd0d958895535c3a
      PARENT_TREE: 9e5e8cf0e9f4515a58420fea61eeb4a36eaffe7f
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-nav-debt-002-r4f-route-owned-page-reconcile.yml
      ROUTER_PATH: assets/js/core/stable-shell-router.js
      SEARCH_PATH: assets/js/pages/search-data.js
      ROUTER_PREIMAGE: f3b4d3f303967055173e418244dc0d4b3a1b0e55
      SEARCH_BLOB: b42704c5df2f039bd6b68b3ead8153c92aa3de7c
      FILTER_AUTHORITY: 20260805-ux-filters-001-v1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Freeze lineage and materialize R4f candidate runner-only
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nav002-r4f-evidence"
          mkdir -p "$evidence"
          head="$(git rev-parse HEAD)"
          read -ra lineage <<< "$(git rev-list --parents -n1 "$head")"
          [[ ${#lineage[@]} -eq 2 && "${lineage[1]}" == "$PARENT" ]] || { echo 'TEMP lineage mismatch'; exit 1; }
          [[ "$(git rev-parse "$PARENT^{tree}")" == "$PARENT_TREE" ]] || { echo 'Parent TREE mismatch'; exit 1; }
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$head")
          [[ ${#changed[@]} -eq 1 && "${changed[0]}" == "$WORKFLOW_PATH" ]] || { printf 'TEMP scope mismatch: %s\n' "${changed[*]}"; exit 1; }
          [[ "$(git rev-parse "$PARENT:$ROUTER_PATH")" == "$ROUTER_PREIMAGE" ]] || { echo 'Router preimage drift'; exit 1; }
          [[ "$(git rev-parse "$PARENT:$SEARCH_PATH")" == "$SEARCH_BLOB" ]] || { echo 'Search-data preimage drift'; exit 1; }
          [[ "$(git show "$PARENT:$ROUTER_PATH" | grep -F "'/resultados.html': ['DokeInitSearchFilterState', 'DokeInitSearchResults']" | wc -l | tr -d ' ')" == '1' ]] || { echo 'NAV003 initializer contract drift'; exit 1; }

          git worktree add --detach ../nav002-r4f-parent "$PARENT"
          git worktree add --detach ../nav002-r4f-candidate "$PARENT"

          python - <<'PY'
          from pathlib import Path
          path = Path('../nav002-r4f-candidate/assets/js/core/stable-shell-router.js')
          text = path.read_text(encoding='utf-8')
          nav003 = "    '/resultados.html': ['DokeInitSearchFilterState', 'DokeInitSearchResults'],"
          if text.count(nav003) != 1:
              raise SystemExit('NAV003 initializer missing before R4f materialization')

          anchor = """  function replaceShell(nextDoc, path) {
          """
          helper = """  function isPersistentPageChromeNode(node) {
            if (!node || node.nodeType !== 1 || typeof node.matches !== 'function') return false;
            return node.matches('nav, [role="navigation"]');
          }

          function replaceShell(nextDoc, path) {
          """
          if text.count(anchor) != 1:
              raise SystemExit(f'replaceShell anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          old = """      syncElementContract(currentHeader, nextHeader);
                currentHeader.replaceChildren.apply(currentHeader, Array.prototype.map.call(nextHeader.childNodes, function (node) {
                  return node.cloneNode(true);
                }));
                currentContent.replaceWith(nextContent.cloneNode(true));
                Array.prototype.slice.call(currentShell.children).forEach(function (node) {
          """
          new = """      syncElementContract(currentHeader, nextHeader);
                currentHeader.replaceChildren.apply(currentHeader, Array.prototype.map.call(nextHeader.childNodes, function (node) {
                  return node.cloneNode(true);
                }));
                var replacementContent = nextContent.cloneNode(true);
                currentContent.replaceWith(replacementContent);
                var persistentPageChrome = Array.prototype.filter.call(currentPage.children, function (node) {
                  return node !== currentHeader && node !== replacementContent && isPersistentPageChromeNode(node);
                });
                var replacementPageNodes = Array.prototype.reduce.call(nextPage.childNodes, function (nodes, node) {
                  if (node === nextHeader) {
                    nodes.push(currentHeader);
                    return nodes;
                  }
                  if (node === nextContent) {
                    nodes.push(replacementContent);
                    return nodes;
                  }
                  if (isPersistentPageChromeNode(node)) return nodes;
                  nodes.push(node.cloneNode(true));
                  return nodes;
                }, []);
                persistentPageChrome.forEach(function (node) { replacementPageNodes.push(node); });
                currentPage.replaceChildren.apply(currentPage, replacementPageNodes);
                Array.prototype.slice.call(currentShell.children).forEach(function (node) {
          """
          if text.count(old) != 1:
              raise SystemExit(f'R4f replaceShell preimage count={text.count(old)}; stop without adaptation')
          updated = text.replace(old, new, 1)
          if updated.count(nav003) != 1:
              raise SystemExit('NAV003 initializer changed by R4f materialization')
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY

          mapfile -t product_changed < <(git -C ../nav002-r4f-candidate diff --name-only "$PARENT")
          [[ ${#product_changed[@]} -eq 1 && "${product_changed[0]}" == "$ROUTER_PATH" ]] || { printf 'Candidate scope mismatch: %s\n' "${product_changed[*]}"; exit 1; }
          if git -C ../nav002-r4f-candidate diff -U0 "$PARENT" -- "$ROUTER_PATH" | grep '^+' | grep -Eiq 'resultados|doke-public-footer'; then
            echo 'Candidate contains route/footer hardcoding in added lines'; exit 1
          fi
          [[ -z "$(git -C ../nav002-r4f-candidate diff --name-only "$PARENT" -- "$SEARCH_PATH" resultados.html assets/css config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md docs/validation tests/visual)" ]] || { echo 'Forbidden candidate scope mutation'; exit 1; }
          git -C ../nav002-r4f-candidate diff --check "$PARENT"
          node --check ../nav002-r4f-candidate/$ROUTER_PATH

          git -C ../nav002-r4f-candidate config user.name doke-diagnostic
          git -C ../nav002-r4f-candidate config user.email doke-diagnostic@users.noreply.github.com
          git -C ../nav002-r4f-candidate add "$ROUTER_PATH"
          git -C ../nav002-r4f-candidate commit -m 'test(ux): materialize R4f route-owned page reconciliation candidate'

          candidate_sha="$(git -C ../nav002-r4f-candidate rev-parse HEAD)"
          candidate_tree="$(git -C ../nav002-r4f-candidate rev-parse HEAD^{tree})"
          router_blob="$(git -C ../nav002-r4f-candidate rev-parse HEAD:$ROUTER_PATH)"
          search_blob="$(git -C ../nav002-r4f-candidate rev-parse HEAD:$SEARCH_PATH)"
          patch_sha="$(git -C ../nav002-r4f-candidate diff "$PARENT" HEAD --binary | sha256sum | awk '{print $1}')"
          [[ "$search_blob" == "$SEARCH_BLOB" ]] || { echo 'Search-data blob drift in candidate'; exit 1; }

          cat > "$evidence/identity.json" <<EOF
          {"controllerSha":"$head","parent":"$PARENT","parentTree":"$PARENT_TREE","candidateSha":"$candidate_sha","candidateTree":"$candidate_tree","routerPreimage":"$ROUTER_PREIMAGE","routerBlob":"$router_blob","searchBlob":"$search_blob","patchSha256":"$patch_sha","candidateScope":["$ROUTER_PATH"],"rule":"direct page navigation landmarks are persistent chrome; remaining non-header/non-content siblings are route-owned","criteriaRelaxed":0,"repositoryOnly":true,"candidateRunnerOnly":true,"productRemoteMutation":false,"matrixMutation":false,"snapshotMutation":false,"issueMutation":false,"prMutation":false,"merge":false,"supabaseMutation":false,"stagingMutation":false,"productionMutation":false}
          EOF
          echo "CANDIDATE_SHA=$candidate_sha"
          echo "CANDIDATE_TREE=$candidate_tree"
          echo "ROUTER_BLOB=$router_blob"
          echo "PATCH_SHA256=$patch_sha"
          echo 'TEMP_SCOPE=PASS'
          echo 'R4F_CANDIDATE_SCOPE=ONE_ROUTER_FILE'
          echo 'HARDCODED_ROUTE_OR_FOOTER=false'

      - name: Install dependencies and Chromium once
        run: |
          set -euo pipefail
          cd ../nav002-r4f-candidate
          npm ci
          npx playwright install chromium
          cd ..
          cp -a nav002-r4f-candidate/node_modules nav002-r4f-parent/node_modules

      - name: Run minimum governance and syntax gates
        run: |
          set -euo pipefail
          cd ../nav002-r4f-candidate
          node --check "$ROUTER_PATH"
          node --check "$SEARCH_PATH"
          git diff --check "$PARENT" HEAD
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git reset --hard HEAD
          [[ "$(git rev-parse HEAD:$SEARCH_PATH)" == "$SEARCH_BLOB" ]] || { echo 'Search-data drift after audits'; exit 1; }
          [[ "$(git show HEAD:$ROUTER_PATH | grep -F "'/resultados.html': ['DokeInitSearchFilterState', 'DokeInitSearchResults']" | wc -l | tr -d ' ')" == '1' ]] || { echo 'NAV003 initializer contract lost after audits'; exit 1; }
          echo 'MINIMUM_GOVERNANCE_GATES=PASS'

      - name: Prove geometry and lifecycle convergence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nav002-r4f-evidence"
          python -m http.server 4174 --directory ../nav002-r4f-candidate > "$evidence/candidate-server.log" 2>&1 &
          server=$!
          cleanup() { kill "$server" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4174/index.html" >/dev/null; then ok=1; break; fi
            sleep 1
          done
          [[ "$ok" == 1 ]] || { echo 'Candidate server did not become ready'; exit 1; }

          cd ../nav002-r4f-candidate
          node - "$evidence" <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const evidence = process.argv[2];
          const base = 'http://127.0.0.1:4174';
          const authority = process.env.FILTER_AUTHORITY;
          const viewports = [
            { name: 'desktop', width: 1366, height: 768 },
            { name: 'tablet', width: 820, height: 1180 },
            { name: 'mobile', width: 390, height: 844 }
          ];
          const r3 = n => Math.round(Number(n || 0) * 1000) / 1000;
          const delta = (a, b) => r3(Math.abs(Number(a || 0) - Number(b || 0)));

          async function waitStable(page) {
            await page.waitForLoadState('domcontentloaded');
            if (page.url().includes('/resultados.html')) {
              await page.waitForFunction((expectedAuthority) => {
                const form = document.querySelector('[data-results-filters-form]');
                const boundary = document.querySelector('[data-state-boundary="resultados"]');
                return Boolean(form && boundary &&
                  form.getAttribute('data-filter-authority') === expectedAuthority &&
                  document.querySelectorAll('[data-results-filter-status]').length === 1 &&
                  boundary.dataset.resultsUiReady === 'true' &&
                  boundary.getAttribute('aria-busy') === 'false');
              }, authority, { timeout: 10000 });
            }
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.waitForFunction(() => !document.fonts || document.fonts.status === 'loaded', null, { timeout: 10000 });
            await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
          }

          async function snapshot(page) {
            return page.evaluate(() => {
              const pageNode = document.querySelector('.page');
              const footer = pageNode && pageNode.querySelector(':scope > .doke-public-footer');
              const pageRect = pageNode && pageNode.getBoundingClientRect();
              const footerRect = footer && footer.getBoundingClientRect();
              const form = document.querySelector('[data-results-filters-form]');
              const boundary = document.querySelector('[data-state-boundary="resultados"]');
              const keyFor = node => {
                const id = node.id ? '#' + node.id : '';
                const cls = typeof node.className === 'string' && node.className.trim() ? '.' + node.className.trim().split(/\s+/).sort().join('.') : '';
                return `${node.tagName}${id}${cls}`;
              };
              return {
                path: location.pathname,
                pageChildren: pageNode ? Array.from(pageNode.children).map(keyFor) : [],
                footer: footerRect ? { present: true, left: footerRect.left, top: footerRect.top, width: footerRect.width, height: footerRect.height } : { present: false },
                pageHeight: pageRect ? pageRect.height : 0,
                scrollY: window.scrollY,
                noOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth,
                statusCount: document.querySelectorAll('[data-results-filter-status]').length,
                authority: form ? form.getAttribute('data-filter-authority') : null,
                resultsUiReady: boundary ? boundary.dataset.resultsUiReady || null : null,
                ariaBusy: boundary ? boundary.getAttribute('aria-busy') : null,
                bodyPage: document.body && document.body.dataset.page || null
              };
            });
          }

          async function direct(browser, route, viewport) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error && error.message || error)));
            await page.goto(base + route);
            await waitStable(page);
            const state = await snapshot(page);
            await context.close();
            return { state, errors };
          }

          async function navigate(page, route) {
            await page.evaluate(async target => {
              const result = window.DokeNavigate(target);
              if (result && typeof result.then === 'function') await result;
            }, route);
            await page.waitForURL(new RegExp(route.replace('.', '\\.')));
            await waitStable(page);
          }

          async function roundTrip(browser, viewport) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error && error.message || error)));
            await page.goto(base + '/index.html');
            await waitStable(page);
            await page.evaluate(() => {
              window.__r4fStableNodes = {
                header: document.querySelector('[data-app-header]'),
                sidebar: document.querySelector('.sidebar'),
                bottomNavigation: document.querySelector('[data-doke-mobile-bottom-nav], [data-bottom-nav], .bottom-nav, .doke-bottom-nav')
              };
              window.scrollTo(0, Math.min(500, Math.max(0, document.documentElement.scrollHeight - innerHeight)));
            });
            const homeBefore = await snapshot(page);
            await navigate(page, '/resultados.html');
            const results = await snapshot(page);
            const identityResults = await page.evaluate(() => ({
              header: window.__r4fStableNodes.header === document.querySelector('[data-app-header]'),
              sidebar: window.__r4fStableNodes.sidebar === document.querySelector('.sidebar')
            }));
            await page.evaluate(() => { window.__r4fFirstInstallation = window.Doke && window.Doke.searchFilterStateInstallation; });
            await navigate(page, '/index.html');
            const homeAfter = await snapshot(page);
            const identityHome = await page.evaluate(() => ({
              header: window.__r4fStableNodes.header === document.querySelector('[data-app-header]'),
              sidebar: window.__r4fStableNodes.sidebar === document.querySelector('.sidebar')
            }));
            const homeLeak = await page.evaluate(() => document.querySelectorAll('[data-results-filter-status]').length);
            await navigate(page, '/resultados.html');
            const secondResults = await snapshot(page);
            const freshInstallation = await page.evaluate(() => Boolean(window.__r4fFirstInstallation) && window.__r4fFirstInstallation !== (window.Doke && window.Doke.searchFilterStateInstallation));
            await context.close();
            return { homeBefore, results, homeAfter, secondResults, identityResults, identityHome, homeLeak, freshInstallation, errors };
          }

          async function pedidosIdentityProbe(browser) {
            const context = await browser.newContext({ viewport: { width: 1366, height: 768 } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error && error.message || error)));
            await page.goto(base + '/index.html');
            await waitStable(page);
            await page.evaluate(() => {
              window.__r4fPedidoNodes = {
                header: document.querySelector('[data-app-header]'),
                sidebar: document.querySelector('.sidebar'),
                bottomNavigation: document.querySelector('[data-doke-mobile-bottom-nav], [data-bottom-nav], .bottom-nav, .doke-bottom-nav')
              };
            });
            const initial = await page.evaluate(() => ({ bottomPresent: Boolean(window.__r4fPedidoNodes.bottomNavigation) }));
            await navigate(page, '/pedidos.html');
            const state = await page.evaluate(() => ({
              header: window.__r4fPedidoNodes.header === document.querySelector('[data-app-header]'),
              sidebar: window.__r4fPedidoNodes.sidebar === document.querySelector('.sidebar'),
              bottomNavigation: window.__r4fPedidoNodes.bottomNavigation === document.querySelector('[data-doke-mobile-bottom-nav], [data-bottom-nav], .bottom-nav, .doke-bottom-nav'),
              bottomPresentAfter: Boolean(document.querySelector('[data-doke-mobile-bottom-nav], [data-bottom-nav], .bottom-nav, .doke-bottom-nav'))
            }));
            await context.close();
            return { initial, state, errors };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const rows = [];
            try {
              for (const viewport of viewports) {
                const directResults = await direct(browser, '/resultados.html', viewport);
                const directHome = await direct(browser, '/index.html', viewport);
                const routed = await roundTrip(browser, viewport);
                const d = directResults.state;
                const n = routed.results;
                const geometry = {
                  leftDelta: delta(d.footer.left, n.footer.left),
                  topDelta: delta(d.footer.top, n.footer.top),
                  widthDelta: delta(d.footer.width, n.footer.width),
                  heightDelta: delta(d.footer.height, n.footer.height),
                  pageHeightDelta: delta(d.pageHeight, n.pageHeight)
                };
                assert.deepEqual(d.pageChildren, n.pageChildren, `${viewport.name}: Resultados child set/order must converge`);
                assert.deepEqual(directHome.state.pageChildren, routed.homeBefore.pageChildren, `${viewport.name}: Home pre-navigation child set/order must converge`);
                assert.deepEqual(directHome.state.pageChildren, routed.homeAfter.pageChildren, `${viewport.name}: Home return child set/order must converge`);
                assert.equal(routed.identityResults.header, true, `${viewport.name}: header identity into Resultados`);
                assert.equal(routed.identityResults.sidebar, true, `${viewport.name}: sidebar identity into Resultados`);
                assert.equal(routed.identityHome.header, true, `${viewport.name}: header identity on Home return`);
                assert.equal(routed.identityHome.sidebar, true, `${viewport.name}: sidebar identity on Home return`);
                assert.equal(d.footer.present, true, `${viewport.name}: direct footer present`);
                assert.equal(n.footer.present, true, `${viewport.name}: routed footer present`);
                Object.entries(geometry).forEach(([key, value]) => assert.equal(value, 0, `${viewport.name}: ${key} must be zero`));
                assert.equal(n.statusCount, 1, `${viewport.name}: canonical filter status count`);
                assert.equal(n.authority, authority, `${viewport.name}: canonical filter authority`);
                assert.equal(n.resultsUiReady, 'true', `${viewport.name}: results terminality`);
                assert.equal(n.ariaBusy, 'false', `${viewport.name}: Resultados aria-busy false`);
                assert.equal(routed.homeLeak, 0, `${viewport.name}: no Resultados filter status leak on Home`);
                assert.equal(routed.freshInstallation, true, `${viewport.name}: second Resultados entry uses fresh filter installation`);
                assert.equal(n.scrollY, 0, `${viewport.name}: route scroll reset`);
                assert.equal(n.noOverflow, true, `${viewport.name}: routed Resultados no horizontal overflow`);
                assert.equal(d.noOverflow, true, `${viewport.name}: direct Resultados no horizontal overflow`);
                assert.deepEqual(routed.errors, [], `${viewport.name}: no routed page errors`);
                assert.deepEqual(directResults.errors, [], `${viewport.name}: no direct Resultados page errors`);
                rows.push({ viewport, geometry, directChildren: d.pageChildren, routedChildren: n.pageChildren, homeChildren: routed.homeAfter.pageChildren, freshInstallation: routed.freshInstallation });
              }
              const pedidos = await pedidosIdentityProbe(browser);
              assert.equal(pedidos.state.header, true, 'desktop index->pedidos header identity');
              assert.equal(pedidos.state.sidebar, true, 'desktop index->pedidos sidebar identity');
              assert.equal(pedidos.state.bottomNavigation, true, 'desktop index->pedidos bottom navigation identity');
              assert.deepEqual(pedidos.errors, [], 'desktop index->pedidos no page errors');
              const receipt = {
                result: 'PASS',
                criteriaRelaxed: 0,
                semanticFence: { resultsUiReady: true, ariaBusyFalse: true, fontsTerminal: true, layoutFlush: 'two-animation-frames', arbitrarySleepMs: 0 },
                viewports: rows,
                pedidosIdentityProbe: pedidos,
                childSetOrder: 'PASS',
                headerSidebarIdentity: 'PASS',
                bottomNavigationIdentityDesktop: 'PASS',
                footerGeometryExactZero: 'PASS',
                nav003Lifecycle: 'PASS'
              };
              fs.writeFileSync(path.join(evidence, 'geometry-lifecycle.json'), JSON.stringify(receipt, null, 2));
              console.log('R4F_GEOMETRY_LIFECYCLE=' + JSON.stringify(receipt));
            } catch (error) {
              const receipt = { result: 'FAIL', criteriaRelaxed: 0, error: String(error && error.stack || error), viewports: rows };
              fs.writeFileSync(path.join(evidence, 'geometry-lifecycle.json'), JSON.stringify(receipt, null, 2));
              console.log('R4F_GEOMETRY_LIFECYCLE=' + JSON.stringify(receipt));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            const receipt = { result: 'FAIL', criteriaRelaxed: 0, error: String(error && error.stack || error) };
            fs.writeFileSync(path.join(evidence, 'geometry-lifecycle.json'), JSON.stringify(receipt, null, 2));
            console.log('R4F_GEOMETRY_LIFECYCLE=' + JSON.stringify(receipt));
          });
          NODE

      - name: Execute exact requirement 12 suites once per side
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nav002-r4f-evidence"
          specs=(
            tests/e2e/results-entry-lifecycle.spec.js
            tests/e2e/ux-results-001-browser-acceptance.spec.js
            tests/e2e/search-flow.spec.js
            tests/e2e/stable-shell-transition-contract.spec.js
            tests/e2e/stable-shell-transition-matrix.spec.js
            tests/e2e/stable-shell-scroll-contract.spec.js
            tests/e2e/global-layout-contract.spec.js
          )
          for spec in "${specs[@]}"; do
            [[ -f "../nav002-r4f-parent/$spec" && -f "../nav002-r4f-candidate/$spec" ]] || { echo "Missing required spec: $spec"; exit 1; }
          done
          printf '%s\n' "${specs[@]}" > "$evidence/specs.txt"
          set +e
          (cd ../nav002-r4f-parent && node node_modules/@playwright/test/cli.js test "${specs[@]}" --reporter=json --workers=1 --retries=0 > "$evidence/parent-playwright.json")
          parent_rc=$?
          (cd ../nav002-r4f-candidate && node node_modules/@playwright/test/cli.js test "${specs[@]}" --reporter=json --workers=1 --retries=0 > "$evidence/candidate-playwright.json")
          candidate_rc=$?
          set -e
          printf '%s\n' "$parent_rc" > "$evidence/parent-rc.txt"
          printf '%s\n' "$candidate_rc" > "$evidence/candidate-rc.txt"
          echo "PARENT_RC=$parent_rc"
          echo "CANDIDATE_RC=$candidate_rc"

      - name: Classify R4f diagnostic
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nav002-r4f-evidence"
          node - "$evidence" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const dir = process.argv[2];
          const read = name => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
          const normalize = value => String(value || '')
            .replace(/\x1b\[[0-9;]*m/g, '')
            .replace(/nav002-r4f-(?:parent|candidate)/g, '<WORKTREE>')
            .replace(/[A-Z]:\\[^\n:]+/g, '<PATH>')
            .replace(/\\/g, '/');
          function collect(report) {
            const rows = [];
            function walk(suite, parents) {
              const prefix = [...parents, suite.title || ''].filter(Boolean);
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  const results = test.results || [];
                  const last = results.at(-1) || {};
                  let status = test.status;
                  if (!['expected','unexpected','flaky','skipped'].includes(status)) {
                    const actual = last.status || 'unknown';
                    if (actual === 'skipped') status = 'skipped';
                    else if (actual === 'passed' && (test.expectedStatus || 'passed') === 'passed') status = 'expected';
                    else status = 'unexpected';
                  }
                  const key = [spec.file || '', ...prefix, spec.title || '', test.projectName || ''].filter(Boolean).join(' :: ');
                  const errorItems = [];
                  for (const e of (last.errors || [])) errorItems.push(e?.message || e?.stack || e?.value || JSON.stringify(e));
                  if (last.error) errorItems.push(last.error?.message || last.error?.stack || last.error?.value || JSON.stringify(last.error));
                  const errors = normalize(errorItems.filter(Boolean).join('\n'));
                  const signature = crypto.createHash('sha256').update(errors).digest('hex');
                  rows.push({ key, status, errors: errors.slice(0, 5000), signature });
                }
              }
              for (const child of suite.suites || []) walk(child, prefix);
            }
            for (const suite of report.suites || []) walk(suite, []);
            return rows;
          }
          const identity = fs.existsSync(path.join(dir, 'identity.json')) ? read('identity.json') : null;
          const geometry = fs.existsSync(path.join(dir, 'geometry-lifecycle.json')) ? read('geometry-lifecycle.json') : { result: 'MISSING' };
          if (!fs.existsSync(path.join(dir, 'parent-playwright.json')) || !fs.existsSync(path.join(dir, 'candidate-playwright.json'))) {
            const receipt = { result: 'INCOMPLETE', classification: 'REPORT_MISSING', identity, geometry, qualificationSignal: false, permanentPromotionAuthorized: false };
            fs.writeFileSync(path.join(dir, 'classification.json'), JSON.stringify(receipt, null, 2));
            console.log('R4F_CLASSIFICATION=' + JSON.stringify(receipt));
            process.exit(0);
          }
          const parent = collect(read('parent-playwright.json'));
          const candidate = collect(read('candidate-playwright.json'));
          const count = (rows, status) => rows.filter(r => r.status === status).length;
          const pu = new Map(parent.filter(r => r.status === 'unexpected').map(r => [r.key, r]));
          const cu = new Map(candidate.filter(r => r.status === 'unexpected').map(r => [r.key, r]));
          const candidateOnlyFailures = [...cu.keys()].filter(key => !pu.has(key)).map(key => cu.get(key));
          const parentOnlyFailures = [...pu.keys()].filter(key => !cu.has(key)).map(key => pu.get(key));
          const sharedFailures = [...cu.keys()].filter(key => pu.has(key)).map(key => ({ key, parent: pu.get(key), candidate: cu.get(key) }));
          const summary = {
            parent: { total: parent.length, expected: count(parent, 'expected'), unexpected: count(parent, 'unexpected'), flaky: count(parent, 'flaky'), skipped: count(parent, 'skipped') },
            candidate: { total: candidate.length, expected: count(candidate, 'expected'), unexpected: count(candidate, 'unexpected'), flaky: count(candidate, 'flaky'), skipped: count(candidate, 'skipped') }
          };
          let classification = 'UNCLASSIFIED';
          if (geometry.result !== 'PASS') classification = 'GEOMETRY_OR_LIFECYCLE_FAIL';
          else if (summary.parent.total !== 75 || summary.candidate.total !== 75) classification = 'TEST_COUNT_DRIFT';
          else if (candidateOnlyFailures.length) classification = 'CANDIDATE_ONLY_FAILURE';
          else if (sharedFailures.length) classification = 'SHARED_FAILURE';
          else if (parentOnlyFailures.length) classification = 'PARENT_ONLY_FAILURE';
          else if (summary.parent.expected === 75 && summary.candidate.expected === 75 && summary.parent.unexpected === 0 && summary.candidate.unexpected === 0 && summary.parent.flaky === 0 && summary.candidate.flaky === 0 && summary.parent.skipped === 0 && summary.candidate.skipped === 0) classification = 'R4F_DIAGNOSTIC_GREEN';
          const qualificationSignal = classification === 'R4F_DIAGNOSTIC_GREEN';
          const receipt = {
            result: 'PASS', classification, identity, geometry, summary,
            candidateOnlyFailures, parentOnlyFailures, sharedFailures,
            criteriaRelaxed: 0,
            qualificationSignal,
            permanentPromotionAuthorized: false,
            productRemoteMutation: false,
            matrixMutation: false,
            snapshotMutation: false,
            issueMutation: false,
            prMutation: false,
            merge: false,
            supabaseMutation: false,
            stagingMutation: false,
            productionMutation: false
          };
          fs.writeFileSync(path.join(dir, 'outcome-map.json'), JSON.stringify({ parent, candidate }, null, 2));
          fs.writeFileSync(path.join(dir, 'classification.json'), JSON.stringify(receipt, null, 2));
          console.log('R4F_OUTCOME_SUMMARY=' + JSON.stringify(summary));
          console.log('R4F_CANDIDATE_ONLY=' + JSON.stringify(candidateOnlyFailures));
          console.log('R4F_SHARED=' + JSON.stringify(sharedFailures));
          console.log('R4F_CLASSIFICATION=' + JSON.stringify(receipt));
          NODE

      - name: Upload R4f diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav002-r4f-route-owned-page-reconcile
          path: ${{ runner.temp }}/nav002-r4f-evidence
          if-no-files-found: warn
          retention-days: 7
