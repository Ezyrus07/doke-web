name: Doke ORD-A07 Request Freshness

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07-request-freshness.yml'
      - 'scripts/reconcile-ord-a08-staging-release-once.py'
      - 'scripts/ord-a08-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-ord-a08:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and validate ORD-A08
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          helper = Path('scripts/reconcile-ord-a08-staging-release-once.py')
          source = helper.read_text(encoding='utf-8')
          replacements = [
              (
                  r"  fs.writeFileSync(destination, JSON.stringify(report, null, 2) + '\n', 'utf8');",
                  r"  fs.writeFileSync(destination, JSON.stringify(report, null, 2) + '\\n', 'utf8');"
              ),
              (
                  r"  'permissions:\n  contents: read',",
                  r"  'permissions:\\n  contents: read',"
              )
          ]
          for old, new in replacements:
              if new not in source:
                  if old not in source:
                      raise SystemExit(f'ORD-A08 escape anchor missing: {old}')
                  source = source.replace(old, new, 1)
          helper.write_text(source, encoding='utf-8')
          PY
          python scripts/reconcile-ord-a08-staging-release-once.py
          rm -f scripts/ord-a08-trigger.txt
          node scripts/test-ord-001-a08-staging-release-runtime.js
          node scripts/audit-ord-001-a08-staging-release-readiness.js
          node scripts/execute-ord-001-a08-staging-release-preflight.js --dry-run
          node scripts/test-order-request-freshness-runtime.js
          node scripts/audit-ord-001-a03-command-boundary.js
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add -A
          git add -f docs/validation/ORD-001-A08-STAGING-RELEASE-READINESS.json reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Establish ORD-A08 staging release readiness boundary'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
