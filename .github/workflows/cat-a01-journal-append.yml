name: CAT-A01 Journal Append

on:
  push:
    branches:
      - cat/cat-001-baseline-audit

permissions:
  contents: write

concurrency:
  group: cat-a01-journal-append
  cancel-in-progress: false

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CAT candidate
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Append journal and remove temporary files
        shell: bash
        run: |
          if grep -Fq '# 2026-07-27 — CAT-A01 / baseline de autoridade do catálogo' docs/DOKE-ENGINEERING-JOURNAL.md; then
            echo 'CAT-A01 journal entry already exists' >&2
            exit 1
          fi
          cat docs/validation/CAT-001-A01-JOURNAL-ENTRY.tmp.md >> docs/DOKE-ENGINEERING-JOURNAL.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cat-a01-journal-append.yml
          git rm docs/validation/CAT-001-A01-JOURNAL-ENTRY.tmp.md
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git commit -m "Record CAT-A01 engineering journal"
          git push origin "HEAD:cat/cat-001-baseline-audit"
