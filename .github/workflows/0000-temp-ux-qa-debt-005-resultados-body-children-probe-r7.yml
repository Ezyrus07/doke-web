name: TEMP UX-QA-DEBT-005 Resultados Body Children Probe R7

on:
  push:
    branches:
      - diag/ux-qa-debt-005-resultados-body-children-probe-r7

permissions:
  contents: read

env:
  PARENT: 14bdb1af9cfefff4dfd27a78b937443975266001
  PARENT_TREE: 32f449b165b8cb119600c702c0625cc7199f3416
  WORKFLOW_PATH: .github/workflows/0000-temp-ux-qa-debt-005-resultados-body-children-probe-r7.yml
  CANDIDATE_BRANCH: diag/ux-qa-debt-005-resultados-win32-baseline-candidate
  DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Freeze lineage and read-only scope
        shell: bash
        run: |
          set -euo pipefail
          H="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$H" | awk '{print $2}')" = "$PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$H")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then exit 1; fi
          echo LINEAGE=PASS
          echo CANDIDATE_ABSENT=PASS
          echo PRODUCT_MUTATION=false
          echo MATRIX_MUTATION=false

      - name: Prepare exact parent browser worktree
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/qa005-parent-r7"
          git worktree add --detach "$d" "$PARENT" >/dev/null
          cd "$d"
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          test -z "$(git status --porcelain)"

      - name: Print compact direct versus nav body-flow inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r7"
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const { spawn } = require('child_process');
          const http = require('http');
          const server = spawn(process.execPath, ['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'], { env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}, stdio:'ignore' });
          const waitServer=()=>new Promise((resolve,reject)=>{let n=0;const p=()=>{n++;const r=http.get('http://127.0.0.1:5500/index.html',res=>{res.resume();if(res.statusCode===200)return resolve();n>60?reject(new Error('server')):setTimeout(p,250)});r.on('error',()=>n>60?reject(new Error('server')):setTimeout(p,250));};p();});
          const route=async p=>{await p.route('https://unpkg.com/**',r=>r.fulfill({contentType:'application/javascript',body:''}));await p.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({contentType:'application/javascript',body:''}));await p.route('https://fonts.googleapis.com/**',r=>r.fulfill({contentType:'text/css',body:''}));await p.route('https://fonts.gstatic.com/**',r=>r.abort());};
          const session={provider:'mock',sessionStatus:'active',accountStatus:'active',user:{id:'qa005-client',role:'client',name:'QA005',email:'qa005@example.test',accountStatus:'active'}};
          const init=p=>p.addInitScript(v=>localStorage.setItem('doke.auth.session.v1',JSON.stringify(v)),session);
          const stable=async p=>{await p.waitForLoadState('domcontentloaded');await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(700);};
          const inventory=(p,label)=>p.evaluate(label=>{
            const q=n=>Math.round(Number(n||0)*10)/10;
            const item=(e,i)=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{i,tag:e.tagName,id:e.id||'',cls:typeof e.className==='string'?e.className:'',hidden:Boolean(e.hidden),ariaHidden:e.getAttribute('aria-hidden'),display:s.display,position:s.position,top:q(r.top),bottom:q(r.bottom),height:q(r.height),marginTop:s.marginTop,marginBottom:s.marginBottom,paddingTop:s.paddingTop,paddingBottom:s.paddingBottom,dataPreloader:e.hasAttribute('data-doke-document-preloader'),dataDrawer:e.getAttribute('data-mobile-drawer-authority')||'',text:(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,80)}};
            const page=document.querySelector('.page');
            const shell=document.querySelector('.app-shell');
            return {label,scrollY:q(scrollY),bodyDisplay:getComputedStyle(document.body).display,bodyChildren:Array.from(document.body.children).map(item),shellTop:shell?q(shell.getBoundingClientRect().top):null,pageTop:page?q(page.getBoundingClientRect().top):null,active:{tag:document.activeElement?.tagName||'',cls:document.activeElement?.className||'',temp:document.activeElement?.getAttribute?.('data-doke-route-focus-temporary')||null}};
          },label);
          (async()=>{let b;try{await waitServer();b=await chromium.launch();const c=await b.newContext({viewport:{width:1366,height:768}});
            const d=await c.newPage();await route(d);await init(d);await d.goto('http://127.0.0.1:5500/resultados.html');await stable(d);const direct=await inventory(d,'direct');
            const n=await c.newPage();await route(n);await init(n);await n.goto('http://127.0.0.1:5500/index.html');await stable(n);await n.waitForFunction(()=>typeof window.DokeNavigate==='function');await n.evaluate(async()=>{const x=window.DokeNavigate('/resultados.html');if(x&&typeof x.then==='function')await x;});await n.waitForURL(/\/resultados\.html/);await stable(n);const nav=await inventory(n,'nav');
            console.log('DIRECT_BODY='+JSON.stringify(direct));
            console.log('NAV_BODY='+JSON.stringify(nav));
            const flowDirect=direct.bodyChildren.filter(x=>x.display!=='none'&&x.position!=='fixed'&&x.position!=='absolute'&&x.height>0);
            const flowNav=nav.bodyChildren.filter(x=>x.display!=='none'&&x.position!=='fixed'&&x.position!=='absolute'&&x.height>0);
            console.log('DIRECT_FLOW='+JSON.stringify(flowDirect));
            console.log('NAV_FLOW='+JSON.stringify(flowNav));
            console.log('R7_PROBE=PASS');
          }finally{if(b)await b.close().catch(()=>{});server.kill();}})().catch(e=>{console.error(e);server.kill();process.exit(1)});
          NODE

      - name: Prove no repository mutation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa005-parent-r7"
          test -z "$(git status --porcelain)"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then exit 1; fi
          echo READ_ONLY_PROBE=PASS
          echo CANDIDATE_ABSENT=PASS
