name: Doke SCHED-B02B Authenticated Staging Composition Canary

on:
  push:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - 'config/sched-001-b02b-authenticated-composition-canary-execution.json'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.one_shot.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: one_shot
        name: Require one-shot authorization envelope addition
        shell: bash
        run: |
          target='config/sched-001-b02b-authenticated-composition-canary-execution.json'
          if git diff-tree --no-commit-id --name-only --diff-filter=A -r "${{ github.event.before }}" "${{ github.sha }}" | grep -Fxq "$target"; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi

  authenticated-composition-canary:
    needs: authorize
    if: needs.authorize.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DOKE_SCHEDULING_RUNTIME_ENABLED: 'true'
      DOKE_RUNTIME_ENVIRONMENT: staging
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SCHED_B02B_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_B02B_AUTHENTICATED_COMPOSITION_CANARIES_ON_DOKE_STAGING
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SCHED_B02B_REPORT_PATH: reports/generated/sched-001-b02b-authenticated-composition-canary-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Preserve fail-closed repository contracts
        run: |
          node scripts/audit-sched-001-b02b-authenticated-composition-canary.js
          node scripts/test-sched-001-b02b-authenticated-composition-canary.js
          node scripts/audit-sched-001-b02b-authenticated-canary-readiness.js
          node scripts/test-sched-001-b02b-authenticated-canary-readiness.js
          node scripts/audit-sched-001-b02-composition-root-readiness.js
          node scripts/test-sched-001-b02-composition-root-runtime.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/test-sched-001-a04-scheduling-service-runtime.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
      - name: Read-only staging and pull request preflight
        run: node scripts/execute-sched-001-b02b-authenticated-composition-canary.js --preflight
      - name: Execute controlled canary ending in rollback
        run: node scripts/execute-sched-001-b02b-authenticated-composition-canary.js --execute
      - name: Upload sanitized canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-001-b02b-authenticated-composition-canary-${{ github.run_id }}
          path: reports/generated/sched-001-b02b-authenticated-composition-canary-report.json
          if-no-files-found: warn
          retention-days: 14
