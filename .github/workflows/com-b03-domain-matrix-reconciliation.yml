name: COM-B03 Domain Matrix Reconciliation

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'config/com-b03-domain-matrix-reconciliation.json'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: com/com-001-baseline-audit
          fetch-depth: 2
      - name: Require one-shot envelope addition
        shell: bash
        run: |
          git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD \
            | grep -Fxq 'config/com-b03-domain-matrix-reconciliation.json'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Reconcile canonical matrix source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'config/domain-completion-matrix.json';
          const envelope = JSON.parse(fs.readFileSync('config/com-b03-domain-matrix-reconciliation.json', 'utf8'));
          if (envelope.contractId !== 'com-b03-domain-matrix-reconciliation-v1') throw new Error('INVALID_ENVELOPE');
          if (envelope.status !== 'authorized_repository_only_reconciliation') throw new Error('INVALID_STATUS');
          if (envelope.expectedParentHead !== 'cd4b3082ac13f31f8aa8eaef6cbf60bd6cdeb498') throw new Error('PARENT_HEAD_MISMATCH');
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const domain = matrix.domains.find((item) => item.id === 'COM-001');
          if (!domain) throw new Error('COM_DOMAIN_MISSING');
          if (domain.maturity !== 3 || domain.serverAuthority !== 'partial') throw new Error('UNEXPECTED_COM_MATURITY');

          matrix.version = '1.3.106';
          matrix.updatedAt = '2026-08-05T19:45:00-03:00';

          const addUnique = (array, values) => {
            const target = Array.isArray(array) ? array : [];
            for (const value of values) if (!target.includes(value)) target.push(value);
            return target;
          };

          domain.requiredPaths = addUnique(domain.requiredPaths, [
            'backend/modules/communities/community-server-authority-contract.js',
            'backend/modules/communities/community-supabase-repository-adapter.js',
            'backend/runtime/staging/community-composition-root.js',
            'backend/modules/communities/community-realtime-channel-scale-policy.js',
            'config/com-b03-realtime-channel-scale-policy.json',
            'scripts/test-com-b03-community-realtime-channel-scale-policy.js',
            'scripts/audit-com-b03-community-realtime-channel-scale-policy.js',
            'docs/validation/COM-B03-COMMUNITY-REALTIME-CHANNEL-SCALE-POLICY.json'
          ]);
          domain.tests = addUnique(domain.tests, [
            'test:com-b02-server-authority-contract',
            'audit:com-b02d-community-composition-root-canary-readiness',
            'test:com-b03-community-realtime-channel-scale-policy',
            'audit:com-b03-community-realtime-channel-scale-policy'
          ]);

          domain.evidence = (domain.evidence || []).filter((item) =>
            item !== 'Backend communities module is empty and all three core community tables have RLS disabled.'
          );
          domain.evidence = addUnique(domain.evidence, [
            'The communities backend now has a server-authority contract, Supabase repository adapter and private persistence foundation applied and structurally verified in staging.',
            'An authenticated read-only composition-root canary passed against staging with an existing aal1 session, rollback and unchanged 0/0/0 domain row counts.',
            'COM-B03 scalable realtime channel policy is repository-certified with bounded leases, privacy gates, channel caps, event deduplication, backpressure, resume cursors and deterministic reconnect.',
            'No community Realtime publication, authenticated subscription, route or runtime integration is active yet.'
          ]);

          const b02 = (domain.blockers || []).find((item) => item.id === 'COM-B02');
          if (b02) {
            b02.category = 'server_runtime_activation';
            b02.description = 'Server-authority contracts, persistence foundation and a read-only canary are certified, but membership, roles, invitations, bans and content commands are not integrated into the canonical runtime.';
          }
          const b03 = (domain.blockers || []).find((item) => item.id === 'COM-B03');
          if (!b03) throw new Error('COM_B03_BLOCKER_MISSING');
          b03.category = 'realtime_activation';
          b03.description = 'Scalable channel policy is repository-certified, but no community Realtime publication or authenticated subscription is active.';

          domain.nextActions = (domain.nextActions || []).map((item) => {
            if (item === 'Implement server-canonical invitations, join requests, bans and appeals.') {
              return 'Integrate the certified server-authority repository into the main runtime for invitations, join requests, roles, bans and content commands.';
            }
            if (item === 'Add scoped realtime and scalable channel policy.') {
              return 'Prepare scoped Realtime publication and an authenticated subscription canary under separate explicit staging authorization.';
            }
            return item;
          });

          fs.writeFileSync(path, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE
      - name: Regenerate deterministic matrix artifacts
        run: npm run write:domain-completion-matrix
      - name: Audit matrix drift
        run: npm run audit:domain-completion-matrix
      - name: Diff hygiene
        run: git diff --check
      - name: Commit canonical source and generated artifacts
        shell: bash
        run: |
          git config user.name 'doke-matrix-bot'
          git config user.email 'doke-matrix-bot@users.noreply.github.com'
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git diff --cached --quiet && { echo 'No matrix changes produced'; exit 1; }
          git commit -m 'docs(com): reconcile COM-B03 domain completion matrix'
          git push origin HEAD:com/com-001-baseline-audit
