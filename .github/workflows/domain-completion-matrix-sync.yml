name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

permissions: { contents: write }

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R4C repository-only gates
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4c.js
          node --check scripts/test-com-b03c-r4c-pg-int8-counter-codec-compatibility-readiness.js
          node scripts/test-com-b03c-r4c-pg-int8-counter-codec-compatibility-readiness.js
          test ! -e config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json
          node - <<'NODE'
          const s=require('./docs/validation/COM-B03C-R4B-SINGLE-USE-PHASE-ATTRIBUTED-RETRY-STAGING-SUMMARY.json');
          if(s.workflow.run!==31487894136||s.observation.executionFailure.failurePhase!=='baseline_counter_read')process.exit(1);
          if(s.observation.identityCleanupSucceeded!==true||s.observation.instrumentationInstalled!==false)process.exit(1);
          if(s.cleanup.secondStagingExecutionOccurred!==false||s.authority.r4bAuthorizationReusable!==false)process.exit(1);
          NODE
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Restrict canonical writer outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R4C repository guards
        run: |
          node scripts/test-com-b03c-r4c-pg-int8-counter-codec-compatibility-readiness.js
          test ! -e config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json
          node - <<'NODE'
          const e=require('./docs/validation/COM-B03C-R4C-PG-INT8-COUNTER-CODEC-COMPATIBILITY-READINESS.json');
          if(e.authority?.remoteExecution!==false||e.authority?.stagingRead!==false||e.authority?.stagingMutation!==false)process.exit(1);
          for(const v of Object.values(e.effects||{}))if(v!==false)process.exit(1);
          if(e.finding?.exactRootCauseProven!==false||e.finding?.causalPromotionAllowed!==false)process.exit(1);
          NODE
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain governance-generated side effects
        shell: bash
        run: |
          mkdir -p /tmp/r4c-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/r4c-matrix/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/r4c-matrix/domain-completion-matrix-report.json
          git reset --hard HEAD
          git clean -fd
          cp /tmp/r4c-matrix/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md
          mkdir -p reports/generated
          cp /tmp/r4c-matrix/domain-completion-matrix-report.json reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          mapfile -t staged < <(git diff --name-only --cached)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${staged[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Commit canonical R4C-derived outputs
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git commit -m 'docs(com): reconcile domain matrix after R4C codec readiness'
          git push origin HEAD:com/com-001-baseline-audit
