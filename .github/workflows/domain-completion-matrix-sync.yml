name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

permissions: { contents: write }

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R3X repository-only gates
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3x.js
          node --check scripts/test-com-b03c-r3x-authorized-single-file-trigger-creation-readiness.js
          node scripts/test-com-b03c-r3x-authorized-single-file-trigger-creation-readiness.js
          test ! -e config/com-b03c-r3w-single-use-staging-authorization-trigger.json
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Restrict canonical writer outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R3X repository guards
        run: |
          node scripts/test-com-b03c-r3x-authorized-single-file-trigger-creation-readiness.js
          test ! -e config/com-b03c-r3w-single-use-staging-authorization-trigger.json
          node - <<'NODE'
          const c = require('./config/com-b03c-r3x-authorized-single-file-trigger-creation-readiness.json');
          const e = require('./docs/validation/COM-B03C-R3X-AUTHORIZED-SINGLE-FILE-TRIGGER-CREATION-READINESS.json');
          for (const value of Object.values(c.prohibitedPreparation)) if (value !== false) process.exit(1);
          if (e.authorizationReceipt?.plaintextPersisted !== false) process.exit(1);
          if (e.trigger?.exists !== false) process.exit(1);
          if (e.authority?.remoteExecution !== false || e.authority?.stagingRead !== false || e.authority?.stagingMutation !== false || e.authority?.network !== false) process.exit(1);
          if (e.effects?.triggerCreated !== false || e.effects?.stagingAccessExecuted !== false || e.effects?.remoteCredentialReadExecuted !== false || e.effects?.remoteDependencyLoadExecuted !== false || e.effects?.networkAccessExecuted !== false) process.exit(1);
          if (e.exactRootCauseProven !== false || e.causalPromotionAllowed !== false) process.exit(1);
          NODE
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain governance-generated side effects
        shell: bash
        run: |
          mkdir -p /tmp/r3x-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/r3x-matrix/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/r3x-matrix/domain-completion-matrix-report.json
          git reset --hard HEAD
          git clean -fd
          cp /tmp/r3x-matrix/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md
          mkdir -p reports/generated
          cp /tmp/r3x-matrix/domain-completion-matrix-report.json reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          mapfile -t staged < <(git diff --name-only --cached)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${staged[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Commit canonical R3X-derived outputs
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git commit -m 'docs(com): reconcile domain matrix after R3X trigger readiness'
          git push origin HEAD:com/com-001-baseline-audit
