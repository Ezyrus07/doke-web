name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

permissions: { contents: write }

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R4J repository-only gates
        shell: bash
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4j.js
          node --check scripts/test-com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.js
          node --check scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js
          node scripts/test-com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.js
          node scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js --repository-self-test
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
          R4I_HEAD=1f134f087a5f6645f4c3ca86dd56e93da1c164ee
          test -z "$(git diff --name-only "$R4I_HEAD" HEAD -- \
            backend/modules/communities/community-realtime-private-auth-r4i.js \
            config/com-b03c-r4i-r4h-terminal-observation-authorization-consumption.json \
            docs/validation/COM-B03C-R4I-R4H-TERMINAL-OBSERVATION-AUTHORIZATION-CONSUMPTION.json \
            backend/modules/communities/community-realtime-private-auth-r4h.js \
            backend/modules/communities/community-realtime-private-auth-r4g.js \
            scripts/execute-com-b03c-r4g-presence-only-terminal-observation-envelope.js \
            scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js \
            scripts/execute-com-b03c-r3v-single-use-remote-execution-envelope.js)"
          ! grep -Eq '^[[:space:]]*push:' .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml
          ! grep -Eq '^[[:space:]]*environment:' .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml
          ! grep -Eq 'secrets\.' .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Restrict canonical writer outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R4J repository guards
        shell: bash
        run: |
          node scripts/test-com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.js
          node scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js --repository-self-test
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
          node - <<'NODE'
          const r4j = require('./backend/modules/communities/community-realtime-private-auth-r4j');
          const config = require('./config/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.json');
          const result = r4j.evaluateRepositoryReadiness(config.readinessInput);
          if (result.executionEnvelopeReady !== true || result.authorizationConsumed !== true || result.authorizationReusable !== false) process.exit(1);
          if (result.triggerCreationAuthority !== false || result.remoteExecutionAuthority !== false || result.stagingReadAuthority !== false || result.stagingMutationAuthority !== false) process.exit(1);
          if (result.productionAuthority !== false || result.pullRequestMergeAuthority !== false) process.exit(1);
          if (result.exactRootCauseProven !== false || result.causalPromotionAllowed !== false) process.exit(1);
          NODE
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain governance-generated side effects
        shell: bash
        run: |
          mkdir -p /tmp/r4j-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/r4j-matrix/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/r4j-matrix/domain-completion-matrix-report.json
          git reset --hard HEAD
          git clean -fd
          cp /tmp/r4j-matrix/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md
          mkdir -p reports/generated
          cp /tmp/r4j-matrix/domain-completion-matrix-report.json reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          mapfile -t staged < <(git diff --name-only --cached)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${staged[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Commit canonical R4J-derived outputs
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git commit -m 'docs(com): reconcile domain matrix after R4J execution envelope'
          git push origin HEAD:com/com-001-baseline-audit
