name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

permissions: { contents: write }

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R3R repository-only gate
        run: node scripts/test-com-b03c-r3r-r3q-remote-adapter-binding-readiness.js
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Restrict canonical writer outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R3R repository guards
        run: |
          node scripts/test-com-b03c-r3r-r3q-remote-adapter-binding-readiness.js
          test ! -e config/com-b03c-r3r-r3q-remote-adapter-binding-staging-trigger.json
          node - <<'NODE'
          const c=require('./config/com-b03c-r3r-r3q-remote-adapter-binding-readiness.json');
          const e=require('./docs/validation/COM-B03C-R3R-R3Q-REMOTE-ADAPTER-BINDING-READINESS.json');
          for(const value of Object.values(c.prohibitedPreparation)) if(value !== false) process.exit(1);
          if(c.binding?.fullyBound !== false || c.binding?.missingCapabilities?.length !== 2) process.exit(1);
          if(e.authority?.remoteAdapterActivation !== false || e.authority?.remoteExecution !== false || e.authority?.stagingRead !== false || e.authority?.stagingMutation !== false) process.exit(1);
          if(e.effects?.stagingAccessExecuted !== false || e.effects?.remoteCredentialReadExecuted !== false || e.effects?.remoteDependencyLoadExecuted !== false || e.effects?.remoteClientInstantiated !== false) process.exit(1);
          NODE
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain governance-generated side effects
        shell: bash
        run: |
          mkdir -p /tmp/r3r-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/r3r-matrix/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/r3r-matrix/domain-completion-matrix-report.json
          git reset --hard HEAD
          git clean -fd
          cp /tmp/r3r-matrix/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md
          cp /tmp/r3r-matrix/domain-completion-matrix-report.json reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          git add docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          test -z "$(git diff --name-only --cached | grep -v -E '^(docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$')"
      - name: Commit canonical R3R-derived outputs
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git commit -m 'docs(com): reconcile domain matrix after R3R binding contract'
          git push origin HEAD:com/com-001-baseline-audit
