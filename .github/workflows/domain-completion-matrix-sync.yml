name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'config/domain-completion-matrix-refresh.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: com/com-001-baseline-audit
          fetch-depth: 2
      - name: Validate refresh manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('config/domain-completion-matrix-refresh.json', 'utf8'));
          if (manifest.contractId !== 'domain-completion-matrix-refresh-v1') throw new Error('INVALID_REFRESH_CONTRACT');
          if (manifest.status !== 'refresh_requested') throw new Error('INVALID_REFRESH_STATUS');
          if (manifest.matrixVersion !== '1.3.112') throw new Error('MATRIX_VERSION_MISMATCH');
          if (manifest.domain !== 'COM-001' || manifest.boundary !== 'COM-B04H') throw new Error('REFRESH_SCOPE_MISMATCH');
          if (manifest.effects.repositorySourceAndDerivedArtifacts !== true) throw new Error('INVALID_REPOSITORY_EFFECT_SCOPE');
          if (manifest.effects.databaseAccessed || manifest.effects.migrationApplied || manifest.effects.stagingChanged ||
              manifest.effects.runtimeActivated || manifest.effects.stagingDeploymentExecuted ||
              manifest.effects.stagingTrafficEnabled || manifest.effects.realModerationExecuted ||
              manifest.effects.productionChanged || manifest.effects.pullRequestMerged) {
            throw new Error('OPERATIONAL_EFFECT_PROHIBITED');
          }
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Integrate COM-B04H into canonical source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('config/domain-completion-matrix-refresh.json', 'utf8'));
          const packagePath = 'package.json';
          const matrixPath = 'config/domain-completion-matrix.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['test:com-b04h-live-composition-activation-readiness'] = 'node scripts/test-com-b04h-live-composition-activation-readiness.js';
          pkg.scripts['audit:com-b04h-live-composition-activation-readiness'] = 'node scripts/audit-com-b04h-live-composition-activation-readiness.js';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          if (!['1.3.111', '1.3.112'].includes(matrix.version)) throw new Error('UNEXPECTED_MATRIX_VERSION');
          const domain = matrix.domains.find((item) => item.id === 'COM-001');
          if (!domain) throw new Error('COM_DOMAIN_MISSING');
          if (domain.maturity !== 3 || domain.serverAuthority !== 'partial' ||
              domain.stagingEvidence !== 'staging_canary' || domain.productionGate !== 'blocked') {
            throw new Error('UNEXPECTED_COM_AUTHORITY_STATE');
          }
          matrix.version = manifest.matrixVersion;
          matrix.updatedAt = manifest.updatedAt;

          const addUnique = (array, values) => {
            const target = Array.isArray(array) ? array : [];
            for (const value of values) if (!target.includes(value)) target.push(value);
            return target;
          };

          domain.requiredPaths = addUnique(domain.requiredPaths, [
            'backend/modules/communities/community-moderation-live-composition-activation-readiness.js',
            'config/com-b04h-live-composition-activation-readiness.json',
            'scripts/test-com-b04h-live-composition-activation-readiness.js',
            'scripts/audit-com-b04h-live-composition-activation-readiness.js',
            'docs/COM-B04H-LIVE-COMPOSITION-ACTIVATION-READINESS.md',
            'docs/validation/COM-B04H-LIVE-COMPOSITION-ACTIVATION-READINESS.json',
            '.github/workflows/com-b04h-live-composition-activation-readiness.yml'
          ]);
          domain.tests = addUnique(domain.tests, [
            'test:com-b04h-live-composition-activation-readiness',
            'audit:com-b04h-live-composition-activation-readiness'
          ]);
          domain.evidence = addUnique(domain.evidence, [
            'COM-B04H repository-certified the exact live composition activation proof package for server-verified session, canonical context, server UTC clock, service-role RPC allowlist, immutable audit storage, approved policy and request-security boundaries.',
            'The COM-B04G route handler remains fail-closed as HTTP 503 COM_B04G_ROUTE_NOT_DEPLOYED_OR_ACTIVATED and the COM-B04D composition remains limited to disabled and local_test_double modes.',
            'COM-B04H grants repository readiness only; staging access, deployment, traffic, real moderation, production and pull-request merge remain blocked.'
          ]);

          const blocker = (domain.blockers || []).find((item) => item.id === 'COM-B04');
          if (!blocker) throw new Error('COM_B04_BLOCKER_MISSING');
          blocker.category = 'moderation_staging_live_activation_authorization';
          blocker.description = 'COM-B04H repository-certified the live composition activation proof package, but the route handler remains HTTP 503, the composition remains disabled and staging activation, traffic and real moderation require separate COM-B04I authorization.';

          const next = 'Authorize and execute COM-B04I staging live composition activation and rollback-only route canary only after the exact separate authorization phrase.';
          domain.nextActions = (domain.nextActions || []).filter((item) =>
            !item.includes('COM-B04H') && !item.includes('COM-B04I'));
          domain.nextActions.push(next);

          fs.writeFileSync(matrixPath, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE
      - name: Regenerate deterministic artifacts
        run: npm run write:domain-completion-matrix
      - name: Audit generated matrix
        run: npm run audit:domain-completion-matrix
      - name: Audit COM-B04 continuity
        run: node scripts/audit-com-b04-domain-matrix-reconciliation.js
      - name: Audit COM-B04B continuity
        run: |
          node scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js
          node scripts/test-com-b04b-immutable-moderation-persistence-readiness.js
          node scripts/audit-com-b04b-domain-matrix-reconciliation.js
      - name: Audit COM-B04C continuity
        run: |
          node scripts/audit-com-b04c-moderation-persistence-staging-verification.js
          node scripts/audit-com-b04c-domain-matrix-reconciliation.js
      - name: Audit COM-B04D continuity
        run: |
          node scripts/test-com-b04d-moderation-runtime-composition-readiness.js
          node scripts/audit-com-b04d-moderation-runtime-composition-readiness.js
          node scripts/audit-com-b04d-domain-matrix-reconciliation.js
      - name: Audit COM-B04G continuity
        run: |
          node scripts/test-com-b04g-route-runtime-wiring-execution.js
          node scripts/audit-com-b04g-route-runtime-wiring-execution.js
      - name: Audit COM-B04H readiness
        run: |
          node scripts/test-com-b04h-live-composition-activation-readiness.js
          node scripts/audit-com-b04h-live-composition-activation-readiness.js
      - name: Restrict repository diff
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' \
            | grep -v -E '^(package\.json|config/domain-completion-matrix\.json|docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          git diff --check
      - name: Commit canonical and generated artifacts
        shell: bash
        run: |
          git config user.name 'doke-matrix-bot'
          git config user.email 'doke-matrix-bot@users.noreply.github.com'
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo 'Canonical and generated artifacts already synchronized.'
            exit 0
          fi
          git commit -m 'docs(com): integrate COM-B04H domain completion matrix'
          git push origin HEAD:com/com-001-baseline-audit
