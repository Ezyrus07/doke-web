name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'config/domain-completion-matrix-refresh.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: com/com-001-baseline-audit
          fetch-depth: 2
      - name: Validate refresh manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('config/domain-completion-matrix-refresh.json', 'utf8'));
          if (manifest.contractId !== 'domain-completion-matrix-refresh-v1') throw new Error('INVALID_REFRESH_CONTRACT');
          if (manifest.status !== 'refresh_requested') throw new Error('INVALID_REFRESH_STATUS');
          if (manifest.matrixVersion !== '1.3.108') throw new Error('MATRIX_VERSION_MISMATCH');
          if (manifest.domain !== 'COM-001' || manifest.boundary !== 'COM-B04B') throw new Error('REFRESH_SCOPE_MISMATCH');
          if (manifest.effects.repositorySourceAndDerivedArtifacts !== true) throw new Error('INVALID_EFFECT_SCOPE');
          if (manifest.effects.databaseAccessed || manifest.effects.migrationApplied || manifest.effects.stagingChanged || manifest.effects.runtimeIntegrated || manifest.effects.productionChanged || manifest.effects.pullRequestMerged) throw new Error('OPERATIONAL_EFFECT_PROHIBITED');
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Integrate COM-B04B into canonical source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('config/domain-completion-matrix-refresh.json', 'utf8'));
          const packagePath = 'package.json';
          const matrixPath = 'config/domain-completion-matrix.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['audit:com-b04b-immutable-moderation-persistence-readiness'] = 'node scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js';
          pkg.scripts['test:com-b04b-immutable-moderation-persistence-readiness'] = 'node scripts/test-com-b04b-immutable-moderation-persistence-readiness.js';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          if (!['1.3.107', '1.3.108'].includes(matrix.version)) throw new Error('UNEXPECTED_MATRIX_VERSION');
          const domain = matrix.domains.find((item) => item.id === 'COM-001');
          if (!domain) throw new Error('COM_DOMAIN_MISSING');
          if (domain.maturity !== 3 || domain.serverAuthority !== 'partial') throw new Error('UNEXPECTED_COM_MATURITY');
          matrix.version = manifest.matrixVersion;
          matrix.updatedAt = manifest.updatedAt;

          const addUnique = (array, values) => {
            const target = Array.isArray(array) ? array : [];
            for (const value of values) if (!target.includes(value)) target.push(value);
            return target;
          };
          domain.requiredPaths = addUnique(domain.requiredPaths, [
            'backend/modules/communities/community-moderation-supabase-repository-adapter.js',
            'config/com-b04b-immutable-moderation-persistence-readiness.json',
            'supabase/migrations/20260805205800_com_b04b_moderation_persistence.sql',
            'scripts/test-com-b04b-immutable-moderation-persistence-readiness.js',
            'scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js',
            'scripts/audit-com-b04b-domain-matrix-reconciliation.js',
            'docs/COM-B04B-IMMUTABLE-MODERATION-PERSISTENCE-READINESS.md',
            'docs/validation/COM-B04B-IMMUTABLE-MODERATION-PERSISTENCE-READINESS.json',
            '.github/workflows/com-b04b-immutable-moderation-persistence-readiness.yml'
          ]);
          domain.tests = addUnique(domain.tests, [
            'audit:com-b04b-immutable-moderation-persistence-readiness',
            'test:com-b04b-immutable-moderation-persistence-readiness'
          ]);
          domain.evidence = (domain.evidence || []).filter((item) =>
            item !== 'No moderation case persistence, sanction executor, appeal queue, media disposition runtime, migration or staging mutation is active yet.'
          );
          domain.evidence = addUnique(domain.evidence, [
            'COM-B04B immutable moderation persistence readiness is repository-certified with private RLS-forced tables, append-only ledgers, service-role-only SECURITY DEFINER RPCs, expected-revision CAS, hash-chain validation and atomic idempotency.',
            'No COM-B04B migration has been applied; runtime, staging writes, real moderation actions and production remain blocked.'
          ]);
          const blocker = (domain.blockers || []).find((item) => item.id === 'COM-B04');
          if (!blocker) throw new Error('COM_B04_BLOCKER_MISSING');
          blocker.category = 'moderation_persistence_application';
          blocker.description = 'Immutable moderation persistence adapter and migration are repository-certified, but migration application, structural staging verification, runtime integration and real moderation execution are not active.';
          const previous = 'Prepare immutable moderation case persistence and migration readiness under COM-B04B; any staging application requires separate explicit authorization.';
          const next = 'Apply the COM-B04B migration and verify immutable moderation structure in staging under COM-B04C only after separate explicit authorization.';
          domain.nextActions = (domain.nextActions || []).map((item) => item === previous ? next : item);
          if (!domain.nextActions.includes(next)) domain.nextActions.push(next);
          fs.writeFileSync(matrixPath, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE
      - name: Regenerate deterministic artifacts
        run: npm run write:domain-completion-matrix
      - name: Audit generated matrix
        run: npm run audit:domain-completion-matrix
      - name: Audit COM-B04 continuity
        run: node scripts/audit-com-b04-domain-matrix-reconciliation.js
      - name: Audit COM-B04B contract
        run: |
          node scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js
          node scripts/test-com-b04b-immutable-moderation-persistence-readiness.js
      - name: Audit COM-B04B matrix reconciliation
        run: node scripts/audit-com-b04b-domain-matrix-reconciliation.js
      - name: Restrict repository diff
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' \
            | grep -v -E '^(package\.json|config/domain-completion-matrix\.json|docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          git diff --check
      - name: Commit canonical and generated artifacts
        shell: bash
        run: |
          git config user.name 'doke-matrix-bot'
          git config user.email 'doke-matrix-bot@users.noreply.github.com'
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo 'Canonical and generated artifacts already synchronized.'
            exit 0
          fi
          git commit -m 'docs(com): integrate COM-B04B domain completion matrix'
          git push origin HEAD:com/com-001-baseline-audit
