name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'config/domain-completion-matrix-refresh.json'

# TEMPORARY one-shot writer authority for R3M inventory reconciliation.
# Restore to contents: read immediately after this run.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: com/com-001-baseline-audit
          fetch-depth: 2

      - name: Validate refresh manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('config/domain-completion-matrix-refresh.json','utf8'));
          if(m.contractId!=='domain-completion-matrix-refresh-v1'||m.status!=='refresh_requested')throw new Error('INVALID_REFRESH_CONTRACT');
          if(m.matrixVersion!=='1.3.113'||m.domain!=='COM-001'||m.boundary!=='COM-B03C-R3M-CANONICAL-MATRIX-RECONCILIATION'||m.attempt!==1)throw new Error('REFRESH_SCOPE_MISMATCH');
          if(m.effects?.repositorySourceAndDerivedArtifacts!==true)throw new Error('INVALID_REPOSITORY_EFFECT_SCOPE');
          for(const k of ['databaseAccessed','migrationApplied','stagingChanged','runtimeActivated','stagingDeploymentExecuted','stagingTrafficEnabled','realModerationExecuted','productionChanged','pullRequestMerged'])if(m.effects?.[k]!==false)throw new Error(`OPERATIONAL_EFFECT_PROHIBITED:${k}`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Pre-writer R3M syntax and executable-envelope gate
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3m.js
          node --check scripts/test-com-b03c-r3m-r3l-executable-staging-envelope-readiness.js
          node scripts/test-com-b03c-r3m-r3l-executable-staging-envelope-readiness.js
          node scripts/test-com-b03c-r3l-evaluation-context-differential-presence-diagnostic-readiness.js

      - name: Reconcile R3M inventory into canonical matrix source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('config/domain-completion-matrix-refresh.json','utf8'));
          const p='config/domain-completion-matrix.json';
          const matrix=JSON.parse(fs.readFileSync(p,'utf8'));
          if(matrix.version!=='1.3.113')throw new Error('UNEXPECTED_MATRIX_VERSION');
          const d=matrix.domains.find((x)=>x.id==='COM-001');
          if(!d||d.maturity!==3||d.userFacingAuthority!=='hybrid'||d.serverAuthority!=='partial'||d.stagingEvidence!=='staging_canary'||d.productionGate!=='blocked')throw new Error('UNEXPECTED_COM_AUTHORITY_STATE');
          matrix.updatedAt=m.updatedAt;
          const add=(a,v)=>{a=Array.isArray(a)?a:[];for(const x of v)if(!a.includes(x))a.push(x);return a;};
          d.requiredPaths=add(d.requiredPaths,[
            'backend/modules/communities/community-realtime-private-auth-r3m.js',
            'config/com-b03c-r3m-r3l-executable-staging-envelope-readiness.json',
            'scripts/test-com-b03c-r3m-r3l-executable-staging-envelope-readiness.js',
            '.github/workflows/com-b03c-r3m-r3l-executable-staging-envelope-readiness.yml',
            'docs/validation/COM-B03C-R3M-R3L-EXECUTABLE-STAGING-ENVELOPE-READINESS.json'
          ]);
          d.evidence=(d.evidence||[]).filter((x)=>!x.startsWith('COM-B03C-R3M defines the separately governed executable envelope'));
          d.evidence.push('COM-B03C-R3M defines the separately governed executable envelope for the R3L 17-case diagnostic: future push-only secret wiring, canary-only dependencies, R3L executor invocation, independent sanitized-report verification, artifact upload and single-use trigger enforcement are repository-prepared while the trigger remains absent and all staging/production authority remains false.');
          d.nextActions=(d.nextActions||[]).filter((x)=>!x.includes('Prepare and separately certify the repository-only executable staging envelope for the 17 R3L differential cases')&&!x.includes('Certify R3M repository-only'));
          d.nextActions.push('Certify R3M repository-only on an immutable head, restore any temporary matrix writer to contents: read, and recertify the final evidence head before the existing R3L single-use staging authorization may be requested or consumed.');
          fs.writeFileSync(p,`${JSON.stringify(matrix,null,2)}\n`);
          NODE

      - name: Regenerate deterministic official outputs
        run: npm run write:domain-completion-matrix
      - name: Audit generated matrix
        run: npm run audit:domain-completion-matrix
      - name: Preserve R3L and R3M continuity after writer
        run: |
          node scripts/test-com-b03c-r3m-r3l-executable-staging-envelope-readiness.js
          node scripts/test-com-b03c-r3l-evaluation-context-differential-presence-diagnostic-readiness.js

      - name: Restrict intended writer diff before global audits
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -E '^(config/domain-completion-matrix\.json|docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          git diff --check -- config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json

      - name: Agent governance audit
        run: npm run audit:agent-governance

      - name: Stage only canonical source and two official generated outputs
        shell: bash
        run: |
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$staged" = "$expected" || { printf 'Unexpected staged diff:\n%s\n' "$staged"; exit 1; }
          git diff --cached --check

      - name: Commit canonical source and two official generated outputs
        shell: bash
        run: |
          git config user.name 'doke-matrix-bot'
          git config user.email 'doke-matrix-bot@users.noreply.github.com'
          git commit -m 'docs(com): reconcile R3M domain completion matrix'
          git push origin HEAD:com/com-001-baseline-audit
