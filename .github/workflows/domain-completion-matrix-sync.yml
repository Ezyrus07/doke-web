name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

permissions: { contents: write }

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R4N repository-only gates
        shell: bash
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4n.js
          node --check scripts/test-com-b03c-r4n-r4l-failure-phase-attribution-readiness.js
          node --check scripts/execute-com-b03c-r4n-phase-attributed-hosted-terminal-observation.js
          node scripts/test-com-b03c-r4n-r4l-failure-phase-attribution-readiness.js
          node scripts/execute-com-b03c-r4n-phase-attributed-hosted-terminal-observation.js --repository-self-test
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
          ! grep -Eq '^[[:space:]]*push:' .github/workflows/com-b03c-r4n-r4l-failure-phase-attribution-readiness.yml
          ! grep -Eq '^[[:space:]]*environment:' .github/workflows/com-b03c-r4n-r4l-failure-phase-attribution-readiness.yml
          ! grep -Eq 'secrets\.' .github/workflows/com-b03c-r4n-r4l-failure-phase-attribution-readiness.yml
          grep -Fq 'permissions: { contents: read }' .github/workflows/com-b03c-r4n-r4l-failure-phase-attribution-readiness.yml
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Restrict canonical writer outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R4N repository guards
        shell: bash
        run: |
          node scripts/test-com-b03c-r4n-r4l-failure-phase-attribution-readiness.js
          node scripts/execute-com-b03c-r4n-phase-attributed-hosted-terminal-observation.js --repository-self-test
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
          node - <<'NODE'
          const r4n = require('./backend/modules/communities/community-realtime-private-auth-r4n');
          const config = require('./config/com-b03c-r4n-r4l-failure-phase-attribution-readiness.json');
          const result = r4n.evaluateRepositoryReadiness(config.readinessInput);
          if (result.decision !== r4n.STATUS || result.phaseAttributionReady !== true) process.exit(1);
          if (result.authorizationConsumed !== true || result.authorizationReusable !== false || result.retryAllowed !== false) process.exit(1);
          if (result.remoteExecutionAuthority !== false || result.stagingReadAuthority !== false || result.stagingMutationAuthority !== false) process.exit(1);
          if (result.productionAuthority !== false || result.pullRequestMergeAuthority !== false) process.exit(1);
          if (result.exactRootCauseProven !== false || result.causalPromotionAllowed !== false) process.exit(1);
          NODE
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain governance-generated side effects
        shell: bash
        run: |
          mkdir -p /tmp/r4n-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/r4n-matrix/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/r4n-matrix/domain-completion-matrix-report.json
          git reset --hard HEAD
          git clean -fd
          cp /tmp/r4n-matrix/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md
          mkdir -p reports/generated
          cp /tmp/r4n-matrix/domain-completion-matrix-report.json reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          mapfile -t staged < <(git diff --name-only --cached)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${staged[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Commit canonical R4N-derived outputs
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git commit -m 'docs(com): reconcile domain matrix after R4N phase attribution readiness'
          git push origin HEAD:com/com-001-baseline-audit
