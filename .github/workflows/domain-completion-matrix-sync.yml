name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

# TEMPORARY one-shot writer authority for R3P-derived artifact reconciliation.
# Scope is limited to the two canonical writer outputs and must be restored to contents: read immediately after success.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: com/com-001-baseline-audit
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R3P repository-only gate
        run: |
          test ! -e config/com-b03c-r3p-hosted-runtime-observation-staging-trigger.json
          node - <<'NODE'
          const c=require('./config/com-b03c-r3p-hosted-runtime-observation-harness-readiness.json');
          const e=require('./docs/validation/COM-B03C-R3P-HOSTED-RUNTIME-OBSERVATION-HARNESS-READINESS.json');
          const m=require('./config/domain-completion-matrix.json');
          const d=m.domains.find((x)=>x.id==='COM-001');
          if(c.status!=='repository_synthetic_two_probe_harness_ready_no_remote_authority')process.exit(1);
          if(e.status!=='repository_synthetic_two_probe_harness_prepared_no_remote_authority')process.exit(1);
          if(e.exactRootCauseProven!==false||e.causalPromotionAllowed!==false)process.exit(1);
          if(e.authority?.remoteExecution!==false||e.authority?.stagingRead!==false||e.authority?.stagingMutation!==false)process.exit(1);
          if(e.harness?.remoteDependencies!==false||e.harness?.executableSqlPrepared!==false||e.harness?.supabaseClientPrepared!==false||e.harness?.remoteExecutorPrepared!==false)process.exit(1);
          if(m.version!=='1.3.113'||!d||d.maturity!==3||d.productionGate!=='blocked')process.exit(1);
          NODE
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R3P repository guards
        run: node scripts/test-com-b03c-r3p-hosted-runtime-observation-harness-readiness.js
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain known governance-generated side effects
        run: |
          git restore --worktree -- docs/HOME-AUTHORITY-CLASSIFICATION.md docs/PAGE-ASSET-AUTHORITY-MATRIX.md
      - name: Restrict writer outputs
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -E '^(docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          git diff --check -- docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        run: |
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
      - name: Commit canonical R3P-derived outputs
        run: |
          git config user.name 'doke-matrix-bot'
          git config user.email 'doke-matrix-bot@users.noreply.github.com'
          git commit -m 'docs(com): regenerate matrix outputs after R3P inventory'
          git push origin HEAD:com/com-001-baseline-audit
