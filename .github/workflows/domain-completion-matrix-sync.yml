name: Domain Completion Matrix Artifact Sync

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/domain-completion-matrix-sync.yml'

permissions: { contents: write }

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pre-writer R4E repository-only gates
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4e.js
          node --check scripts/test-com-b03c-r4e-r4c-bridged-retry-execution-authorization-lifecycle-readiness.js
          node --check scripts/execute-com-b03c-r4e-single-use-r4c-bridged-retry.js
          node --check scripts/verify-com-b03c-r4e-single-use-r4c-bridged-retry-report.js
          node scripts/test-com-b03c-r4e-r4c-bridged-retry-execution-authorization-lifecycle-readiness.js
          node scripts/execute-com-b03c-r4e-single-use-r4c-bridged-retry.js --repository-self-test
          test -f config/com-b03c-r4d-single-use-r4c-bridged-retry-trigger.json
          test ! -e config/com-b03c-r4e-single-use-r4c-bridged-retry-execution-trigger.json
      - name: Canonical writer
        run: npm run write:domain-completion-matrix
      - name: Restrict canonical writer outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Canonical matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Preserve R4E repository guards
        run: |
          node scripts/test-com-b03c-r4e-r4c-bridged-retry-execution-authorization-lifecycle-readiness.js
          node scripts/execute-com-b03c-r4e-single-use-r4c-bridged-retry.js --repository-self-test
          test -f config/com-b03c-r4d-single-use-r4c-bridged-retry-trigger.json
          test ! -e config/com-b03c-r4e-single-use-r4c-bridged-retry-execution-trigger.json
          node - <<'NODE'
          const r4e = require('./backend/modules/communities/community-realtime-private-auth-r4e');
          const c = require('./config/com-b03c-r4e-r4c-bridged-retry-execution-authorization-lifecycle-readiness.json');
          const ready = r4e.evaluateRepositoryReadiness(c.readinessInput);
          if (ready.remoteExecutionAuthority !== false || ready.stagingReadAuthority !== false || ready.stagingMutationAuthority !== false) process.exit(1);
          if (ready.productionAuthority !== false || ready.pullRequestMergeAuthority !== false) process.exit(1);
          if (ready.exactRootCauseProven !== false || ready.causalPromotionAllowed !== false) process.exit(1);
          NODE
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Contain governance-generated side effects
        shell: bash
        run: |
          mkdir -p /tmp/r4e-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/r4e-matrix/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/r4e-matrix/domain-completion-matrix-report.json
          git reset --hard HEAD
          git clean -fd
          cp /tmp/r4e-matrix/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md
          mkdir -p reports/generated
          cp /tmp/r4e-matrix/domain-completion-matrix-report.json reports/generated/domain-completion-matrix-report.json
      - name: Stage exactly two canonical outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          mapfile -t staged < <(git diff --name-only --cached)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${staged[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Commit canonical R4E-derived outputs
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git commit -m 'docs(com): reconcile domain matrix after R4E execution boundary'
          git push origin HEAD:com/com-001-baseline-audit
