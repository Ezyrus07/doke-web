name: Doke PAY-A04 Repository Publisher

on:
  push:
    branches:
      - pay/pay-001-baseline-audit
    paths:
      - '.github/tmp/pay-a04-finalize.js'
      - '.github/workflows/pay-001-a04-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Finalize PAY-A04 repository contract
        run: |
          node .github/tmp/pay-a04-finalize.js
          node scripts/audit-domain-completion-matrix.js --write
      - name: Validate PAY-A01 through PAY-A04
        run: |
          node --check backend/modules/payments/payment-reconciliation-contract.js
          node --check backend/modules/payments/payment-reconciliation-queue.js
          node --check scripts/audit-pay-001-a04-reconciliation-queue.js
          node --check scripts/test-pay-001-a04-reconciliation-queue.js
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Commit PAY-A04 canonical updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add scripts/audit-pay-001-a02-authenticated-authority-boundary.js
          git add scripts/audit-pay-001-a03-psp-neutral-intent-webhook.js
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "PAY-A04 canonical updates already current."
            exit 0
          fi
          git commit -m "Finalize PAY-A04 reconciliation contract"
          git pull --rebase --autostash origin pay/pay-001-baseline-audit
          git push origin HEAD:pay/pay-001-baseline-audit
