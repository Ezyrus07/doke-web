name: Doke UX-NOTIF-002 Phase 2A Executor Fix

on:
  push:
    branches:
      - ux/ux-notif-002-event-schema
    paths:
      - '.github/workflows/ux-notif-002-phase2a-fix-executor.yml'

permissions:
  contents: write

jobs:
  fix-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Harden repository script dependency insertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ux-notif-002-phase2a-apply.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          repo_re = re.compile(r'(?m)^([ \\t]*)(<script src="assets/js/repositories/notifications-repository\\.js[^>]*></script>)$')
          consumers = []
          for html_path in sorted(root.glob('*.html')):
            html = html_path.read_text(encoding='utf-8')
            if repo_token not in html:
              continue
            consumers.append(html_path.name)
            if event_src not in html:
              html, inserted = repo_re.subn(
                lambda m: f'{m.group(1)}<script src="{event_src}" defer></script>\\n{m.group(1)}{m.group(2)}',
                html,
                count=1
              )
              if inserted != 1:
                raise SystemExit(f'could not insert notification-event dependency in {html_path.name}')
              html_path.write_text(html, encoding='utf-8')
            if html.index('assets/js/core/notification-event.js') > html.index(repo_token):
              raise SystemExit(f'notification-event loads after repository in {html_path.name}')
'''
          new = '''          consumers = []
          for html_path in sorted(root.glob('*.html')):
            html = html_path.read_text(encoding='utf-8')
            if repo_token not in html:
              continue
            consumers.append(html_path.name)
            if event_src not in html:
              lines = html.splitlines(keepends=True)
              matches = [index for index, line in enumerate(lines) if repo_token in line and '<script' in line and '</script>' in line]
              if len(matches) != 1:
                raise SystemExit(f'expected one repository script line in {html_path.name}, found {len(matches)}')
              index = matches[0]
              line = lines[index]
              indent = line[:len(line) - len(line.lstrip())]
              newline = '\\r\\n' if line.endswith('\\r\\n') else '\\n'
              lines.insert(index, f'{indent}<script src="{event_src}" defer></script>{newline}')
              html = ''.join(lines)
              html_path.write_text(html, encoding='utf-8')
            if html.index('assets/js/core/notification-event.js') > html.index(repo_token):
              raise SystemExit(f'notification-event loads after repository in {html_path.name}')
'''
          if text.count(old) != 1:
            raise SystemExit(f'expected one legacy insertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check -- .github/workflows/ux-notif-002-phase2a-apply.yml

      - name: Publish executor correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doke-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/ux-notif-002-phase2a-apply.yml
          git commit -m 'chore(ux-notif-002): harden phase2a dependency insertion'
          git push origin HEAD:ux/ux-notif-002-event-schema
