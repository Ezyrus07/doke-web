name: TEMP UX-QA-DEBT-005 Nav Requalification R9

on:
  push:
    branches:
      - diag/ux-qa-debt-005-nav-requalification-r9

permissions:
  contents: read

jobs:
  win32-direct-nav:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PARENT: 00a034f90f7940e820fab1f74c27ade9a32d16d1
      PARENT_TREE: d982dc7c0c7cd9b227f1543a83243dc76de08b9a
      SNAPSHOT: tests/visual/doke-visual-regression.spec.js-snapshots/resultados-desktop-1366x768-win32.png
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-qa-debt-005-nav-requalification-r9.yml
      DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Freeze lineage and immutable snapshot identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $parents = ((git rev-list --parents -n1 $head).Trim() -split ' ')
          if ($parents.Count -ne 2 -or $parents[1] -ne $env:PARENT) { throw 'TEMP lineage mismatch' }
          $changed = @(git diff-tree --no-commit-id --name-only -r $head)
          if ($changed.Count -ne 1 -or $changed[0] -ne $env:WORKFLOW_PATH) { throw "TEMP scope mismatch: $($changed -join ',')" }
          if ((git rev-parse "$env:PARENT^{tree}").Trim() -ne $env:PARENT_TREE) { throw 'Parent TREE mismatch' }
          $snapshotBlob = ((git ls-tree $env:PARENT -- $env:SNAPSHOT) -split '\s+')[2]
          if (-not $snapshotBlob) { throw 'Snapshot blob missing' }
          $snapshotHash = (Get-FileHash -Algorithm SHA256 $env:SNAPSHOT).Hash.ToLowerInvariant()
          "SNAPSHOT_BLOB=$snapshotBlob" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SNAPSHOT_SHA256=$snapshotHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'LINEAGE=PASS'
          Write-Host 'TEMP_SCOPE=PASS'
          Write-Host 'PARENT_TREE=PASS'
          Write-Host "SNAPSHOT_BLOB=$snapshotBlob"
          Write-Host "SNAPSHOT_SHA256=$snapshotHash"
          Write-Host 'SNAPSHOT_MUTATION=false'

      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: Prove Resultados direct-load vs DokeNavigate parity
        shell: pwsh
        run: |
          @'
          const { spawn } = require('child_process');
          const http = require('http');
          const path = require('path');
          const pw = require.resolve('@playwright/test', { paths: [process.cwd()] });
          const { chromium } = require(pw);
          const port = 4331;
          const base = `http://127.0.0.1:${port}`;
          const session = {provider:'mock',sessionStatus:'active',accountStatus:'active',user:{id:'qa005-r9',role:'client',name:'QA005 R9',email:'qa005-r9@example.test',accountStatus:'active'}};
          const globalCaps = ['card-experience-style','accessibility-experience-style','responsive-experience-style'];
          const selectors = {shell:'.app-shell',page:'.page',header:'[data-app-header], .app-header',content:'.page__content',workspace:'.search-results-workspace',searchbar:'.results-searchbar',layout:'.results-layout'};
          const styleKeys = ['display','position','boxSizing','width','maxWidth','paddingLeft','paddingRight','marginLeft','marginRight'];
          const waitServer = () => new Promise((resolve,reject)=>{let n=0;const ping=()=>{n++;const req=http.get(base+'/index.html',res=>{res.resume();if(res.statusCode===200)return resolve();if(n>100)return reject(new Error('server timeout'));setTimeout(ping,200)});req.on('error',()=>n>100?reject(new Error('server timeout')):setTimeout(ping,200));};ping();});
          async function intercept(p){await p.route('https://unpkg.com/**',r=>r.fulfill({contentType:'application/javascript',body:''}));await p.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({contentType:'application/javascript',body:''}));await p.route('https://fonts.googleapis.com/**',r=>r.fulfill({contentType:'text/css',body:''}));await p.route('https://fonts.gstatic.com/**',r=>r.abort());}
          async function init(p){await p.addInitScript(v=>localStorage.setItem('doke.auth.session.v1',JSON.stringify(v)),session);}
          async function settle(p){await p.waitForLoadState('domcontentloaded');await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(1000);}
          async function snap(p,label){return p.evaluate(({label,selectors,styleKeys,globalCaps})=>{const q=n=>Math.round(Number(n||0)*10)/10;const nodes={};for(const [name,sel] of Object.entries(selectors)){const el=document.querySelector(sel);if(!el){nodes[name]=null;continue;}const r=el.getBoundingClientRect(),cs=getComputedStyle(el),styles={};for(const k of styleKeys)styles[k]=cs[k];nodes[name]={rect:{top:q(r.top),left:q(r.left),width:q(r.width),height:q(r.height)},styles};}const skip=document.querySelector('[data-doke-skip-link]'),ss=skip?getComputedStyle(skip):null;const links=Array.from(document.querySelectorAll('link[rel="stylesheet"][href]')).map(link=>({cap:link.getAttribute('data-doke-auth-capability')||'',media:link.media||'all',inactive:link.getAttribute('data-doke-route-style-inactive')==='true'}));const active=document.activeElement;return{label,url:location.pathname,scrollY:q(scrollY),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,skip:skip?{display:ss.display,position:ss.position}:null,skipCount:document.querySelectorAll('[data-doke-skip-link]').length,mainCount:document.querySelectorAll('main,[role="main"]').length,activeMain:Boolean(active&&(active.matches?.('main,[role="main"]')||active.closest?.('main,[role="main"]'))),nodes,globalStyles:globalCaps.map(cap=>{const x=links.find(v=>v.cap===cap);return{cap,active:Boolean(x&&!x.inactive&&x.media!=='not all'),media:x?.media||null,inactive:x?.inactive??null};})};},{label,selectors,styleKeys,globalCaps});}
          function common(s){if(s.scrollY!==0)throw new Error(`${s.label}: scrollY=${s.scrollY}`);if(s.overflow)throw new Error(`${s.label}: horizontal overflow`);if(s.skipCount!==1||s.mainCount!==1)throw new Error(`${s.label}: landmarks skip=${s.skipCount} main=${s.mainCount}`);if(!s.skip||s.skip.position!=='fixed')throw new Error(`${s.label}: skip-link not fixed`);for(const g of s.globalStyles)if(!g.active)throw new Error(`${s.label}: ${g.cap} inactive`);for(const [name,node] of Object.entries(s.nodes))if(!node)throw new Error(`${s.label}: missing ${name}`);}
          function diffs(a,b){const out=[];for(const name of Object.keys(selectors)){const x=a.nodes[name],y=b.nodes[name];for(const k of ['top','left','width','height'])if(Math.abs(x.rect[k]-y.rect[k])>0.6)out.push(`${name}.rect.${k}:${x.rect[k]}!=${y.rect[k]}`);for(const k of styleKeys)if(x.styles[k]!==y.styles[k])out.push(`${name}.style.${k}:${x.styles[k]}!=${y.styles[k]}`);}if(a.skip.display!==b.skip.display||a.skip.position!==b.skip.position)out.push(`skip:${JSON.stringify(a.skip)}!=${JSON.stringify(b.skip)}`);return out;}
          (async()=>{let browser;const server=spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port='+port],{cwd:process.cwd(),env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'},stdio:'ignore'});try{await waitServer();browser=await chromium.launch();const dc=await browser.newContext({viewport:{width:1366,height:768}}),d=await dc.newPage();await intercept(d);await init(d);await d.goto(base+'/resultados.html');await settle(d);const direct=await snap(d,'direct');const nc=await browser.newContext({viewport:{width:1366,height:768}}),n=await nc.newPage();await intercept(n);await init(n);await n.goto(base+'/index.html');await settle(n);await n.waitForFunction(()=>typeof window.DokeNavigate==='function');await n.evaluate(async()=>{const x=window.DokeNavigate('/resultados.html');if(x&&typeof x.then==='function')await x;});await n.waitForURL(/\/resultados\.html/);await settle(n);const nav=await snap(n,'via-nav');console.log('QA005_R9_DIRECT='+JSON.stringify(direct));console.log('QA005_R9_NAV='+JSON.stringify(nav));common(direct);common(nav);if(!nav.activeMain)throw new Error('via-nav: main focus handoff failed');const delta=diffs(direct,nav);console.log('QA005_R9_DIFFS='+JSON.stringify(delta));if(delta.length)throw new Error('direct/nav parity drift: '+delta.join(' | '));console.log('DIRECT_NAV_GEOMETRY_PARITY=PASS');console.log('DIRECT_NAV_COMPUTED_STYLE_PARITY=PASS');console.log('GLOBAL_RUNTIME_STYLES_ACTIVE=3');console.log('A11Y_LANDMARK_FOCUS=PASS');console.log('HORIZONTAL_OVERFLOW=false');console.log('UX_QA_DEBT_005_R9_NAV_REQUALIFICATION='+JSON.stringify({result:'PASS',checkpoint:'UX-QA-DEBT-005-R9',parent:process.env.PARENT,viewport:'1366x768',platform:'windows-latest',directNavGeometryParity:true,directNavComputedStyleParity:true,persistentRuntimeStyles:3,skipLinkFixed:true,routeFocusMain:true,horizontalOverflow:false,criteriaRelaxed:0,productMutation:false,snapshotMutation:false,matrixMutation:false,repositoryOnly:true}));await dc.close();await nc.close();}finally{if(browser)await browser.close().catch(()=>{});server.kill();}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\qa005-r9.js
          node $env:RUNNER_TEMP\qa005-r9.js

      - name: Freeze no-mutation receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $currentHash = (Get-FileHash -Algorithm SHA256 $env:SNAPSHOT).Hash.ToLowerInvariant()
          if ($currentHash -ne $env:SNAPSHOT_SHA256) { throw 'Snapshot bytes changed' }
          git restore --worktree -- reports/generated docs/validation 2>$null
          git clean -fd -- test-results playwright-report reports/generated docs/validation 2>$null
          $status = @(git status --porcelain)
          if ($status.Count -ne 0) { throw "Worktree dirty: $($status -join '; ')" }
          Write-Host 'SNAPSHOT_IDENTITY=PASS'
          Write-Host 'SNAPSHOT_MUTATION=false'
          Write-Host 'PRODUCT_MUTATION=false'
          Write-Host 'MATRIX_MUTATION=false'
          Write-Host 'CRITERIA_RELAXED=0'
          Write-Host 'REPOSITORY_ONLY=true'
