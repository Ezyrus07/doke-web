name: COM-B02BG Repository-Only Inert Attachment-to-Instance Binding Descriptor

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.js'
      - 'config/com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.json'
      - 'scripts/test-com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.js'
      - '.github/workflows/com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: 33500aa95f425bf14993ee6473986325ca99338e
      PREDECESSOR_TREE: b8e12782c04ea37d41f2a02656b40688ced497af
      B02BF_MODULE_BLOB: dd22e03689f562d36a9e5a6e40159ae958defcd3
      B02BF_CONFIG_BLOB: c055d4e5f7918ed09d31d6b8684559ee11c88444
      B02BE_MODULE_BLOB: 116aceb2f6ca3f728d39f81e5e5fb4de371a71db
      B02AZ_MODULE_BLOB: 35e2bbe0b983d6a249bc7f8cb4ee157d3b85d654
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.js
      TEST: scripts/test-com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.js
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze predecessor lineage and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR_HEAD"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.js \
            config/com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.json \
            scripts/test-com-b02bg-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-descriptor.js | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-readiness.js)" = "$B02BF_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bf-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding-readiness.json)" = "$B02BF_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js)" = "$B02BE_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js)" = "$B02AZ_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic B02BG and hard blocks
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'inertAttachmentBoundToEntryContainerInstance[[:space:]]*:[[:space:]]*true|attachmentAppliedToEntryContainerInstance[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|executableMethodReferenceMaterialized[[:space:]]*:[[:space:]]*true|executableMethodReferencesCaptured[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'entryContainerMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
