name: Doke UX-CSS-DEBT-031 Home Mobile Composition Reach

on:
  push:
    branches:
      - diag/ux-css-debt-031-home-mobile-composition-reach

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 97ce1fb2514b3e0373da25c5cf7893acc84dca28
      TARGET_BLOB: 37cddecf48b9d78758eb501d5385f7ef8dd61087
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 5

      - name: Preserve harness and checkout exact UX-CSS-DEBT-030 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-031-home-mobile-composition-reach.cjs /tmp/ux-css-debt-031-home-mobile-composition-reach.cjs
          python3 - <<'PY'
          p='/tmp/ux-css-debt-031-home-mobile-composition-reach.cjs'
          s=open(p,encoding='utf-8').read()
          old="""  const pages=[];
            for (const p of report.pageAssets) if ((p.css||[]).includes(TARGET)) pages.push(p.page);
            assert(JSON.stringify(pages.sort())===JSON.stringify([PAGE]), `active reach drift ${JSON.stringify(pages)}`);
          """
          new="""  const path=require('path');
            const tracked=new Set(cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\\0').filter(f=>f.endsWith('.css')));
            const importRe=/@import\\s+(?:url\\()?['\"]?([^'\"\\);]+\\.css(?:\\?[^'\"\\)]*)?)['\"]?\\)?/gi;
            const normImport=(v,from)=>{v=v.replace(/\\?.*$/,'').replace(/^\\.\\//,'');if(v.startsWith('/'))return v.replace(/^\\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
            const imports=f=>{const src=fs.readFileSync(f,'utf8'),out=[];let m;importRe.lastIndex=0;while((m=importRe.exec(src)))out.push(normImport(m[1],f));return out;};
            const pages=[];
            for (const page of report.pageAssets) {
              const seen=new Set(),stack=[...(page.css||[]).filter(f=>tracked.has(f))]; let hit=false;
              while(stack.length){const f=stack.pop();if(seen.has(f)||!tracked.has(f))continue;seen.add(f);if(f===TARGET){hit=true;break;}for(const n of imports(f))if(tracked.has(n))stack.push(n);}
              if(hit) pages.push(page.page);
            }
            assert(JSON.stringify(pages.sort())===JSON.stringify([PAGE]), `active reach drift ${JSON.stringify(pages)}`);
          """
          if old not in s:
              raise SystemExit('reach patch anchor missing')
          s=s.replace(old,new)
          old_goto="""    await page.goto(`http://127.0.0.1:4173/.diag-home-mobile-composition.html?${tag}-${width}-${Date.now()}`, {waitUntil:'networkidle'});
          """
          new_goto="""    await page.route('**/*', route=>{
              const u=new URL(route.request().url());
              const local=u.origin==='http://127.0.0.1:4173';
              if(local && u.pathname.endsWith('.js')) return route.abort();
              if(local || u.protocol==='data:' || u.protocol==='blob:') return route.continue();
              return route.abort();
            });
            await page.goto(`http://127.0.0.1:4173/index.html?${tag}-${width}-${Date.now()}`, {waitUntil:'domcontentloaded',timeout:15000});
            await page.evaluate(()=>{
              if(!document.querySelector('.home-search-hero__filter-button')){
                const form=document.querySelector('.doke-search-panel__form');
                if(!form) throw new Error('missing canonical search form');
                const button=document.createElement('button');
                button.type='button';
                button.className='home-search-hero__filter-button';
                button.setAttribute('aria-label','Filtro diagnostic probe');
                button.setAttribute('data-diag-runtime-probe','home-filter-button');
                form.appendChild(button);
              }
            });
            await page.waitForTimeout(250);
          """
          if old_goto not in s:
              raise SystemExit('runtime patch anchor missing')
          s=s.replace(old_goto,new_goto)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git fetch origin "${TARGET_SHA}" --depth=1
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object assets/css/pages/home/mobile-composition.css)" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CHECKPOINT GUARD PASS|sha=${TARGET_SHA}|blob=${TARGET_BLOB}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate canonical active graph
        run: npm run audit:active-legacy-structures

      - name: Prove reach, cascade and runtime parity
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$PWD/node_modules" node /tmp/ux-css-debt-031-home-mobile-composition-reach.cjs

      - name: Verify exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object assets/css/pages/home/mobile-composition.css)" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          echo "FINAL CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0"
