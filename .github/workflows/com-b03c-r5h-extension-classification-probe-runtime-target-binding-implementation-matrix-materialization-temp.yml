name: COM-B03C R5H Runtime Target Binding Implementation Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "76ce194cd05f03a531fadb740057dd446757df3f"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed runtime target binding implementation assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json)" = "9ad9c4ac7a8863ff54cde18bd898483685346906"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-boundary.json)" = "a2e7e516c0ca57239dfa584095d6d6349b810e32"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-boundary.yml)" = "2b15b11c9a2fb62874c6f92113c21e17050d4cce"
          node - <<'NODE'
          const boundary = require('./config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-boundary.json');
          const binding = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js');
          if (boundary.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || boundary.functionalCheckpoint.r5iCreated !== false || boundary.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (boundary.implementation.runtimeTargetBindingImplementationBoundaryDefined !== true || boundary.implementation.descriptorValidatorImplementationPresent !== true || boundary.implementation.bindingPlanBuilderImplementationPresent !== true) throw new Error('IMPLEMENTATION_STATE_DRIFT');
          for (const key of ['runtimeTargetBindingDefined','runtimeTargetBindingImplemented','concreteBindingPresent','transportBound','executionEntryPointExported','runtimeAdapterBound','targetEnvironmentBound','targetResourceBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (boundary.governance[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          for (const value of Object.values(boundary.concreteBindingState)) {
            if (value !== null) throw new Error('CONCRETE_BINDING_STATE_MUST_REMAIN_NULL');
          }
          const descriptor = binding.repositoryDescriptor();
          if (descriptor.runtimeTargetBindingDefined !== false || descriptor.runtimeTargetBindingImplemented !== false || descriptor.concreteBindingPresent !== false || descriptor.remoteExecutionAuthority !== false || descriptor.networkAuthority !== false) throw new Error('MODULE_FAIL_CLOSED_STATE_DRIFT');
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for runtime target binding implementation" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
