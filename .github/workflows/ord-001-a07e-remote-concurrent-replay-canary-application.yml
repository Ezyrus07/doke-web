name: Doke ORD-A07E Remote Concurrent Replay Canary Application

on:
  pull_request:
    paths:
      - 'config/ord-001-a07e-remote-concurrent-replay-canary-application.json'
      - 'docs/ORD-001-A07E-REMOTE-CONCURRENT-REPLAY-CANARY-APPLICATION.md'
      - 'docs/validation/ORD-001-A07E-REMOTE-CONCURRENT-REPLAY-CANARY-APPLICATION.json'
      - 'scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-application.js'
      - '.github/workflows/ord-001-a07e-remote-concurrent-replay-canary-application.yml'
      - 'config/ord-001-a07e-remote-concurrent-replay-canary-readiness.json'
      - 'config/ord-001-a07d-edge-function-staging-deploy-application.json'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit remote concurrent replay canary application
        run: node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-application.js
      - name: Preserve remote canary readiness contract
        run: node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-readiness.js
      - name: Preserve local concurrent replay proof
        run: node scripts/audit-ord-001-a07e-concurrent-replay-canary.js
      - name: Preserve A07D staging deployment evidence
        run: node scripts/audit-ord-001-a07d-edge-function-staging-deploy-application.js
      - name: Audit completion matrix
        run: node scripts/audit-domain-completion-matrix.js
