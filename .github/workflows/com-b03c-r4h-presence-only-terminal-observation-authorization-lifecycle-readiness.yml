name: COM-B03C-R4H Hosted Terminal Observation Authorization Lifecycle Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4h.js'
      - 'scripts/test-com-b03c-r4h-presence-only-terminal-observation-authorization-lifecycle-readiness.js'
      - 'config/com-b03c-r4h-presence-only-terminal-observation-authorization-lifecycle-readiness.json'
      - 'docs/validation/COM-B03C-R4H-HOSTED-TERMINAL-OBSERVATION-AUTHORIZATION-LIFECYCLE-READINESS.json'
      - 'docs/validation/COM-B03C-R4G-PRESENCE-ONLY-TERMINAL-OBSERVATION-ENVELOPE-READINESS.json'
      - '.github/workflows/com-b03c-r4h-presence-only-terminal-observation-authorization-lifecycle-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

concurrency:
  group: com-b03c-r4h-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4h.js
          node --check scripts/test-com-b03c-r4h-presence-only-terminal-observation-authorization-lifecycle-readiness.js
      - name: R4H repository authorization lifecycle
        run: node scripts/test-com-b03c-r4h-presence-only-terminal-observation-authorization-lifecycle-readiness.js
      - name: No trigger or remote authority
        shell: bash
        run: |
          test ! -e config/com-b03c-r4h-single-use-hosted-terminal-status-observation-authorization-trigger.json
          node - <<'NODE'
          const r4h = require('./backend/modules/communities/community-realtime-private-auth-r4h');
          const config = require('./config/com-b03c-r4h-presence-only-terminal-observation-authorization-lifecycle-readiness.json');
          const result = r4h.evaluateRepositoryReadiness(config.readinessInput);
          for (const field of [
            'triggerCreationAuthority','remoteExecutionAuthority','remoteCredentialReadAuthority',
            'remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority',
            'stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority',
            'runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority'
          ]) if (result[field] !== false) process.exit(1);
          if (result.authorizationReceived !== false || result.authorizationConsumed !== false) process.exit(1);
          NODE
      - name: Historical observation adapters unchanged in R4H delta
        shell: bash
        run: |
          R4G_HEAD=16b7da14ea41e8f994a045b59493fc2e13ad65b6
          test -z "$(git diff --name-only "$R4G_HEAD" "${{ github.event.pull_request.head.sha }}" -- \
            backend/modules/communities/community-realtime-private-auth-r4g.js \
            scripts/execute-com-b03c-r4g-presence-only-terminal-observation-envelope.js \
            scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js \
            scripts/execute-com-b03c-r3v-single-use-remote-execution-envelope.js)"
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
