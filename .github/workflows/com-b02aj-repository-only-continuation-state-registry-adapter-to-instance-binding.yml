name: COM-B02AJ Repository-Only Continuation State Registry Adapter-to-Instance Binding

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-adapter-to-instance-binding.js'
      - 'config/com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.json'
      - 'scripts/test-com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.js'
      - '.github/workflows/com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02AI predecessor B02AG B02AE dependencies and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=52ca9648cce2368999b558e273aafd692a2c6dc3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD

          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-adapter-to-instance-binding.js \
            config/com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.json \
            scripts/test-com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.js | sort)"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-adapter-to-instance-binding.js \
            config/com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected_candidate" || test "$actual" = "$expected_final"
          ! printf '%s\n' "$actual" | grep '^supabase/migrations/'
          ! printf '%s\n' "$actual" | grep '^\.github/workflows/temp-'

          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-adapter-to-instance-binding-descriptor.js)" = "22840e8d9688b6e127cad396f9c6ccfa97576321"
          test "$(git rev-parse HEAD:config/com-b02ai-repository-only-continuation-state-registry-adapter-to-instance-binding-descriptor.json)" = "2e7cbedfbc3f901ca63fcd87aaffa79a47197127"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-instance.js)" = "f51c31d5cdf049f762663151661cecb4adca33a2"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-adapter-implementation.js)" = "cff5c53dd5aea9af7c1fda6a4f8665ce19a9d40a"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"

      - name: Syntax and semantic B02AJ binding conformance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-adapter-to-instance-binding.js
          node --check scripts/test-com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.js
          node scripts/test-com-b02aj-repository-only-continuation-state-registry-adapter-to-instance-binding.js

      - name: Binding remains storage-free operation-free and side-effect-free
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-adapter-to-instance-binding.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'registryInstanceReference\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)[[:space:]]*=' "$TARGET"
          ! grep -E 'storageBackend[[:space:]]*:[[:space:]]*true|entryContainer[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check 52ca9648cce2368999b558e273aafd692a2c6dc3 HEAD
