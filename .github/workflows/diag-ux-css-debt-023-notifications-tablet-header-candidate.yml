name: Doke UX-CSS-DEBT-023 Notifications Tablet Header Candidate

on:
  push:
    branches:
      - diag/ux-css-debt-023-notifications-tablet-header-candidate

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c72fdba37031001c0d503af7b61babbeb46e1c96
      TARGET_FILE: assets/css/pages/notificacoes/tablet-header-rail.css
      PARENT_SHA256: 340f0ffe86085931dd1f79440eea640837b0136eff33c848a89a399ee366e028
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
      - name: Guard exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain)"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${PARENT_SHA256}"
      - name: Setup Node and Chromium
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build deterministic deletion-only candidate
        run: |
          set -euo pipefail
          cp "${TARGET_FILE}" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;
          const p=fs.readFileSync(f,'utf8'),lines=p.split(/\r?\n/),sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          if(sha(p)!==process.env.PARENT_SHA256||Buffer.byteLength(p)!==6085)throw new Error('parent drift');
          const exact=[[158,'flex: 0 0 auto;'],[159,'inline-size: max-content;'],[160,'min-inline-size: max-content;'],[161,'overflow: visible;']];
          for(const [i,v] of exact)if(lines[i].trim()!==v)throw new Error(`line ${i+1} drift`);
          const c=lines.filter((_l,i)=>![158,159,160,161].includes(i)).join('\n');fs.writeFileSync('/tmp/candidate.css',c);fs.writeFileSync(f,c);
          const decl=s=>(s.match(/^\s*[\w-]+\s*:\s*.*;\s*$/gm)||[]).length;
          if(decl(p)!==119||decl(c)!==115)throw new Error(`decl ${decl(p)}>${decl(c)}`);
          console.log(`CANDIDATE BUILD PASS|hash=${sha(c)}|bytes=${Buffer.byteLength(p)}->${Buffer.byteLength(c)}|decl=119->115|deleted=159,160,161,162`);
          NODE
          git diff --check
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "4"
      - name: Write runtime capture
        run: |
          cat >/tmp/capture.js <<'NODE'
          const fs=require('fs'),cp=require('child_process');const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const viewports=[[760,900],[761,900],[820,1180],[1024,900],[1179,900],[1180,900],[1181,900],[390,844]];
          const fileNeedle='/assets/css/pages/notificacoes/tablet-header-rail.css';
          const selector='body[data-page="notificacoes"].has-global-header .app-header--notifications .notifications-header-context';
          const canon=s=>(s||'').replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s*,\s*/g,',').trim(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function capture(out,expected){const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});try{await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}),result={};let active=0;for(const [w,h] of viewports){const ctx=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto('http://127.0.0.1:5500/notificacoes.html',{waitUntil:'domcontentloaded',timeout:15000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});const x=await page.evaluate(({selector,fileNeedle})=>{const canon=s=>(s||'').replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s*,\s*/g,',').trim(),hits=[];function walk(rules,ctx,href){for(const r of [...rules]){if(r.constructor?.name==='CSSImportRule'&&r.styleSheet){try{walk(r.styleSheet.cssRules,ctx,r.styleSheet.href||href)}catch{}}else if(r.constructor?.name==='CSSMediaRule')walk(r.cssRules,[...ctx,`@media ${r.conditionText}`],href);else if(canon(r.selectorText)===canon(selector)){for(const p of ['flex','inline-size','min-inline-size','overflow']){const v=r.style?.getPropertyValue(p);if(v)hits.push({prop:p,value:v.trim(),priority:r.style.getPropertyPriority(p),ctx:ctx.join(' || '),href});}}}}for(const sh of [...document.styleSheets]){try{walk(sh.cssRules,[],sh.href||'inline')}catch{}}const n=document.querySelector(selector);if(!n)return{count:0};const c=getComputedStyle(n),r=n.getBoundingClientRect(),de=document.documentElement,b=document.body;return{count:document.querySelectorAll(selector).length,media:matchMedia('(min-width: 761px) and (max-width: 1180px)').matches,computed:{display:c.display,alignItems:c.alignItems,justifyContent:c.justifyContent,flexGrow:c.flexGrow,flexShrink:c.flexShrink,flexBasis:c.flexBasis,inlineSize:c.inlineSize,width:c.width,minInlineSize:c.minInlineSize,minWidth:c.minWidth,maxInlineSize:c.maxInlineSize,maxWidth:c.maxWidth,overflow:c.overflow,boxSizing:c.boxSizing,rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]},doc:[de.scrollWidth,de.scrollHeight,de.clientWidth,de.clientHeight],body:[b.scrollWidth,b.scrollHeight,b.clientWidth,b.clientHeight],hits:hits.filter(z=>String(z.href).includes(fileNeedle))};},{selector,fileNeedle});if(x.count!==1)throw new Error(`DOM ${w}`);const mh=x.hits.filter(z=>z.ctx==='@media (min-width: 761px) and (max-width: 1180px)');for(const p of ['flex','inline-size','min-inline-size','overflow']){const a=mh.filter(z=>z.prop===p);if(a.length!==expected)throw new Error(`CSSOM ${p} ${w}: ${a.length}/${expected}`);if(a.some(z=>z.priority!==''))throw new Error(`priority ${p} ${w}`);}if(expected===2){const inline=mh.filter(z=>z.prop==='inline-size').map(z=>z.value);if(JSON.stringify(inline)!==JSON.stringify(['max-content','auto']))throw new Error(`parent inline ${w}`);}else{const vals=Object.fromEntries(['flex','inline-size','min-inline-size','overflow'].map(p=>[p,mh.filter(z=>z.prop===p).map(z=>z.value)]));if(vals.flex[0]!=='0 0 auto'||vals['inline-size'][0]!=='auto'||vals['min-inline-size'][0]!=='max-content'||vals.overflow[0]!=='visible')throw new Error(`candidate values ${w}`);}if(x.media)active++;delete x.hits;result[w]=x;await ctx.close();}await browser.close();if(active!==5)throw new Error(`boundary ${active}`);fs.writeFileSync(out,JSON.stringify(result));console.log(`CAPTURE PASS|expected=${expected}|viewports=8|tablet=5`);}finally{server.kill('SIGTERM')}}capture(process.argv[2],Number(process.argv[3])).catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check /tmp/capture.js
      - name: Capture exact parent and responsive baseline
        run: |
          set -euo pipefail
          cp /tmp/parent.css "${TARGET_FILE}"
          node /tmp/capture.js /tmp/parent.json 2
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/parent-responsive.json
      - name: Restore candidate and require runtime parity
        run: |
          set -euo pipefail
          cp /tmp/candidate.css "${TARGET_FILE}"
          node /tmp/capture.js /tmp/candidate.json 1
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent.json')),b=JSON.parse(fs.readFileSync('/tmp/candidate.json'));if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('runtime mismatch');console.log('RUNTIME PARITY PASS|computed+rect+doc/body=0-diffs');
          NODE
      - name: Preserve responsive contract without rebaseline
        run: |
          cp /tmp/parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
      - name: Validate candidate governance and tracked residual
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:agent-governance
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),target=process.env.TARGET_FILE;const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json'));const files=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const ir=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));},meta=new Map();for(const f of files){const text=fs.readFileSync(f,'utf8'),imports=[];let m;ir.lastIndex=0;while((m=ir.exec(text)))imports.push(norm(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n);}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10;});function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null,ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,n=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(const line of lines){const t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:n(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:n([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim();ds.push({sel,prop:m[1].toLowerCase(),imp:/\s*!important\s*$/i.test(raw),ctx:stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ')});}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.ctx}>${d.sel}>${d.prop}`,l=last.get(k);if(l&&(!d.imp||l.imp))dead++;if(!l||d.imp||!l.imp)last.set(k,d);}return{decl:ds.length,dead};}const rows=[...active].map(f=>({f,...parse(meta.get(f).text)})).filter(r=>r.dead),total=rows.reduce((n,r)=>n+r.dead,0),hr=rows.filter(r=>high.includes(r.f)),t=parse(meta.get(target).text);if(active.size!==401||high.length!==37||rows.length!==51||total!==1299||hr.length!==0||t.decl!==115||t.dead!==0)throw new Error(`residual ${active.size}/${high.length}/${rows.length}/${total}/${hr.length}/${t.decl}/${t.dead}`);console.log('CANDIDATE RESIDUAL PASS|active=401|high=37|files=51|dead=1299|highDead=0|target=115/dead0');
          NODE
      - name: Prove clean product-only delta after generated audits
        run: |
          set -euo pipefail
          CAND_HASH=$(sha256sum /tmp/candidate.css | awk '{print $1}')
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          cp /tmp/candidate.css "${TARGET_FILE}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${CAND_HASH}"
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "4"
          echo "PRODUCT-ONLY PASS|candidateHash=${CAND_HASH}|+0/-4"
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test -z "$(git status --porcelain)"
