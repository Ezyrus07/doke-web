name: TEMP COM-B02CN Recovery Single-Use Dispatcher Registry Lookup Integration Proof

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cn-recovery-lookup-proof.yml'

permissions:
  contents: read

jobs:
  recover-authorized-single-use-dispatcher-registry-lookup-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECOVERY_PARENT_HEAD: 90fb1697f3ea3439b56f382a3f0dd9e9ce28a2e4
      RECOVERY_PARENT_TREE: 5f0b68bfc07b3ce4f3c03f7708f915c901bd170b
      B02CM_HEAD: dcf5618b5cffd4d6484b3141aaea9d23253815b2
      B02CM_TREE: 09757b983d9dee7657e1fb51f767bde6d101ca3e
      B02CM_RUN: '33092628509'
      B02CM_JOB: '98589217618'
      FAILED_RECOVERY_PREDECESSOR_RUN: '33119845982'
      FAILED_RECOVERY_PREDECESSOR_JOB: '98683702872'
      TARGET: backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration.js
      TARGET_BLOB: 43ba780f17ef23790d03224955cafe49c454ac6c
      B02CL_TARGET: backend/shared/http/repository-only-permanent-process-local-registry-storage-execution-implementation.js
      B02CL_TARGET_BLOB: 9f1916f87db37a81045be897ae1c87e1341c4774
      DISPATCHER: backend/shared/http/repository-only-route-resume-dispatcher.js
      DISPATCHER_BLOB: 4a8da53cca4ef27777c550e91f28a4abe5bbe542
      CARRIER: backend/shared/http/repository-only-route-continuation-carrier-contract.js
      CARRIER_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TEMP_WORKFLOW: .github/workflows/0000-temp-com-b02cn-recovery-lookup-proof.yml
      CONSUMED_TEMP_WORKFLOW: .github/workflows/0000-temp-com-b02cn-dispatcher-registry-lookup-integration-proof.yml
    steps:
      - name: Checkout exact recovery TEMP head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze recovery parent and exact authorized installation scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$RECOVERY_PARENT_HEAD"
          test "$(git rev-parse "$RECOVERY_PARENT_HEAD^{tree}")" = "$RECOVERY_PARENT_TREE"
          actual="$(git diff --name-only "$RECOVERY_PARENT_HEAD" HEAD)"
          test "$actual" = "$TEMP_WORKFLOW"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CL_TARGET)" = "$B02CL_TARGET_BLOB"
          test "$(git rev-parse HEAD:$DISPATCHER)" = "$DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$CARRIER)" = "$CARRIER_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          ! git cat-file -e "HEAD:$CONSUMED_TEMP_WORKFLOW"
          git diff --check "$RECOVERY_PARENT_HEAD" HEAD

      - name: Preflight canonical recovery fixture without invoking registry factory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const carrier = require('./backend/shared/http/repository-only-route-continuation-carrier-contract');
          const integration = require('./backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration');
          const handle = 'repo-only-cont:COMB02CN_LOOKUP_PROOF_000001';
          const opaquePart = handle.slice('repo-only-cont:'.length);
          assert.equal(opaquePart.length, 28);
          assert.ok(opaquePart.length >= 24 && opaquePart.length <= 96);
          assert.equal(carrier.OPAQUE_HANDLE_PATTERN.test(handle), true);
          assert.equal(carrier.ROUTE_NAMES.includes('communities.membership.command'), true);
          const inspection = integration.inspectRepositoryOnlyDispatcherRegistryLookupIntegration();
          assert.equal(inspection.dispatcherRegistryLookupIntegrationImplemented, true);
          assert.equal(inspection.registryExecutionInstanceInjectionImplemented, true);
          assert.equal(inspection.sameRegistryExecutionInstanceRequired, true);
          assert.equal(inspection.factoryInvokedByInspection, false);
          assert.equal(inspection.registryLookupExecutedByInspection, false);
          assert.equal(inspection.resumeSurfaceInvoked, false);
          console.log('COM_B02CN_RECOVERY_PREFLIGHT=canonical_handle_and_static_integration_verified');
          NODE

      - name: Execute exactly one authorized recovery same-instance lookup cycle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const integrationModule = require('./backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration');
          const registryImplementation = require('./backend/shared/http/repository-only-permanent-process-local-registry-storage-execution-implementation');
          const dispatcher = require('./backend/shared/http/repository-only-route-resume-dispatcher');
          const carrier = require('./backend/shared/http/repository-only-route-continuation-carrier-contract');
          const orchestration = require('./backend/modules/communities/community-command-handler-repository-orchestration');

          const routeName = 'communities.membership.command';
          const opaqueStateHandle = 'repo-only-cont:COMB02CN_LOOKUP_PROOF_000001';
          assert.equal(carrier.OPAQUE_HANDLE_PATTERN.test(opaqueStateHandle), true);

          const continuationState = Object.freeze({
            contractId: orchestration.CONTRACT_ID,
            boundaryId: orchestration.BOUNDARY_ID,
            decision: 'repository_only_command_handler_repository_orchestration_awaiting_external_result',
            routeName,
            b02sSurface: Object.freeze({ synthetic: true, boundaryId: 'COM-B02CN', recovery: true }),
            awaitingExternalRepositoryResult: true,
            repositoryOperationInvoked: false,
            rpcExecuted: false,
            networkExecuted: false,
            stagingReadExecuted: false,
            stagingMutationExecuted: false,
            migrationApplied: false,
            runtimeActivated: false,
            productionChanged: false
          });

          assert.equal(integrationModule.CONTRACT_ID,
            'com-b02cn-repository-only-dispatcher-registry-lookup-integration-v1');
          assert.equal(integrationModule.BOUNDARY_ID, 'COM-B02CN');

          const registry = registryImplementation.createRepositoryOnlyPermanentProcessLocalRegistryStorageExecution();
          const integration = integrationModule.createRepositoryOnlyDispatcherRegistryLookupIntegration(registry);
          const inspection = integration.inspectIntegration();
          assert.equal(inspection.registryExecutionInstanceValid, true);
          assert.equal(inspection.dispatcherContractReady, true);
          assert.equal(inspection.dispatcherRegistryLookupIntegrationImplemented, true);
          assert.equal(inspection.registryExecutionInstanceInjectionImplemented, true);
          assert.equal(inspection.sameRegistryExecutionInstanceRequired, true);
          assert.equal(inspection.registryLookupExecutedByInspection, false);
          assert.equal(inspection.resumeSurfaceInvoked, false);

          let registered = false;
          let released = false;
          let register;
          let lookup;
          let dispatcherProbe;
          let release;

          try {
            register = registry.registerOpaqueContinuationState({
              routeName,
              opaqueStateHandle,
              continuationState
            });
            assert.equal(register.continuationStateStored, true);
            assert.equal(register.registryRegisterExecuted, true);
            assert.equal(register.entryCount, 1);
            registered = true;

            lookup = integration.resolveContinuationForDispatcher(routeName, opaqueStateHandle);
            assert.equal(lookup.decision, 'repository_only_dispatcher_registry_lookup_resolved');
            assert.equal(lookup.dispatcherRegistryLookupIntegrationImplemented, true);
            assert.equal(lookup.sameRegistryExecutionInstanceInjected, true);
            assert.equal(lookup.registryOperationInvoked, true);
            assert.equal(lookup.registryLookupExecuted, true);
            assert.equal(lookup.registryResolveExecuted, true);
            assert.equal(lookup.dispatcherContinuationPrepared, true);
            assert.equal(lookup.resumeSurfaceInvoked, false);
            assert.equal(lookup.repositoryOperationInvoked, false);
            assert.equal(lookup.networkExecuted, false);
            assert.deepEqual(lookup.resolvedContinuation.orchestrationState, continuationState);
            assert.notEqual(lookup.resolvedContinuation.orchestrationState, continuationState);

            dispatcherProbe = dispatcher.dispatchRepositoryOnlyRouteResume(
              routeName,
              lookup.resolvedContinuation,
              null,
              { resumeSurfaceInvocationAuthority: false }
            );
            assert.equal(dispatcherProbe.decision, 'blocked_repository_only_route_resume_dispatch');
            assert.equal(dispatcherProbe.reason, 'FRESH_RESUME_SURFACE_INVOCATION_AUTHORITY_REQUIRED');
            assert.equal(dispatcherProbe.resumeSurfaceInvoked, false);
            assert.equal(dispatcherProbe.registryOperationInvoked, false);
            assert.equal(dispatcherProbe.repositoryOperationInvoked, false);
            assert.equal(dispatcherProbe.rpcExecuted, false);
            assert.equal(dispatcherProbe.networkExecuted, false);
            assert.equal(dispatcherProbe.runtimeActivated, false);
            assert.equal(dispatcherProbe.productionChanged, false);
          } finally {
            if (registered) {
              release = registry.releaseOpaqueContinuationState({ routeName, opaqueStateHandle });
              assert.equal(release.registryReleaseExecuted, true);
              assert.equal(release.entryCount, 0);
              released = true;
            }
          }

          assert.equal(released, true);
          const finalInspection = registry.inspectProcessLocalRegistry();
          assert.equal(finalInspection.entryCount, 0);

          const receipt = {
            contractId: integrationModule.CONTRACT_ID,
            boundaryId: integrationModule.BOUNDARY_ID,
            predecessorHead: integrationModule.PREDECESSOR_HEAD,
            recoveryAuthorizationConsumed: true,
            priorFailedRunId: 33119845982,
            priorFailedJobId: 98683702872,
            synthetic: true,
            deterministic: true,
            routeName,
            opaqueStateHandle,
            opaqueHandleCanonical: true,
            opaqueHandleLength: 28,
            sameRegistryExecutionInstanceInjected: true,
            registryRegisterExecuted: register.registryRegisterExecuted === true,
            dispatcherRegistryLookupIntegrationPerformed: true,
            registryLookupExecuted: lookup.registryLookupExecuted === true,
            registryResolveExecuted: lookup.registryResolveExecuted === true,
            dispatcherContinuationPrepared: lookup.dispatcherContinuationPrepared === true,
            dispatcherAcceptanceProbePerformed: true,
            dispatcherAcceptedLookupResolvedContinuation: true,
            dispatcherStoppedAtFreshResumeAuthorityGate:
              dispatcherProbe.reason === 'FRESH_RESUME_SURFACE_INVOCATION_AUTHORITY_REQUIRED',
            registryReleaseExecuted: release.registryReleaseExecuted === true,
            entryCountAfterRelease: finalInspection.entryCount,
            processLocalOnly: true,
            ephemeralRegistry: true,
            stateEscapesExecutionProcess: false,
            resumeSurfaceInvoked: false,
            activeExecuteHandlerInvoked: false,
            repositoryOperationInvoked: false,
            credentialReadExecuted: false,
            rpcExecuted: false,
            networkExecuted: false,
            stagingReadExecuted: false,
            stagingMutationExecuted: false,
            migrationApplied: false,
            runtimeActivated: false,
            realtimeActivated: false,
            productionChanged: false,
            routeRegistryChanged: false,
            moduleRouteLoaderChanged: false,
            routeHandlersChanged: false
          };
          console.log('COM_B02CN_RECOVERY_EXECUTION_RECEIPT=' + JSON.stringify(receipt));
          NODE

      - name: Re-freeze repository-only scope after recovery execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$RECOVERY_PARENT_HEAD"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CL_TARGET)" = "$B02CL_TARGET_BLOB"
          test "$(git rev-parse HEAD:$DISPATCHER)" = "$DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$CARRIER)" = "$CARRIER_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          ! git cat-file -e "HEAD:$CONSUMED_TEMP_WORKFLOW"
          git diff --check "$RECOVERY_PARENT_HEAD" HEAD
