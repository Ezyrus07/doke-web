name: Doke PAY-A08 Controlled Publisher Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/pay-001-a08-bootstrap-temp.yml'
      - '.pay-a08-bootstrap/payload.b64'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Inspect and extract closed PAY-A08 payload
        run: |
          test -s .pay-a08-bootstrap/payload.b64
          base64 --decode .pay-a08-bootstrap/payload.b64 > /tmp/pay-a08.tar.gz
          gzip -t /tmp/pay-a08.tar.gz
          tar -tzf /tmp/pay-a08.tar.gz > /tmp/pay-a08-files.txt
          test -s /tmp/pay-a08-files.txt
          if grep -E '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$))' /tmp/pay-a08-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              backend/modules/payments/*|\
              config/pay-001-a08-*|\
              docs/PAY-001-A08-*|\
              docs/validation/PAY-001-A08-*|\
              scripts/audit-pay-001-a08-*|\
              scripts/test-pay-001-a08-*|\
              supabase/migrations/*|\
              .github/workflows/pay-001-a08-*|\
              package.json|\
              config/domain-completion-matrix.json|\
              scripts/audit-pay-001-a07-reconciliation-operations-readiness.js) ;;
              *) echo "Unexpected archive entry: $file" >&2; exit 1 ;;
            esac
          done < /tmp/pay-a08-files.txt
          tar -xzf /tmp/pay-a08.tar.gz -C .
          rm -rf .pay-a08-bootstrap
          rm -f .github/workflows/pay-001-a08-bootstrap-temp.yml
      - run: npm ci --ignore-scripts
      - name: Generate canonical matrix derivatives
        run: npm run write:domain-completion-matrix
      - name: Validate PAY-A08 and cumulative contracts
        run: |
          A08_AUDIT="$(node -e "const s=require('./package.json').scripts; const k=Object.keys(s).find(x=>x.startsWith('audit:pay-001-a08')); if(k) process.stdout.write(k)")"
          A08_TEST="$(node -e "const s=require('./package.json').scripts; const k=Object.keys(s).find(x=>x.startsWith('test:pay-001-a08')); if(k) process.stdout.write(k)")"
          test -n "$A08_AUDIT"
          test -n "$A08_TEST"
          find backend/modules/payments scripts -maxdepth 2 -type f \( -iname '*a08*.js' -o -iname '*migration*canary*.js' \) -print0 | xargs -0 -r -n1 node --check
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run audit:pay-001-a05-adapter-conformance-readiness
          npm run test:pay-001-a05-adapter-conformance-readiness
          node scripts/audit-pay-001-a05-adapter-contract.js
          node scripts/test-pay-001-a05-adapter-contract.js
          npm run audit:pay-001-a06-provider-selection-legal-handoff
          npm run test:pay-001-a06-provider-selection-legal-handoff
          npm run audit:pay-001-a07-reconciliation-operations-readiness
          npm run test:pay-001-a07-reconciliation-operations-readiness
          npm run "$A08_AUDIT"
          npm run "$A08_TEST"
          node scripts/test-semantic-version.js
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          node -e "const m=require('./config/domain-completion-matrix.json'); if(m.version!=='1.3.93') throw new Error('PAY-A08 matrix must be 1.3.93')"
          git diff --check
      - name: Verify repository-only safety boundary
        run: |
          test ! -e .pay-a08-bootstrap/payload.b64
          test ! -e .github/workflows/pay-001-a08-bootstrap-temp.yml
          test "$(find supabase/migrations -maxdepth 1 -type f -newer .git/HEAD 2>/dev/null | wc -l)" -ge 0
          for workflow in .github/workflows/pay-001-a08-*.yml; do
            test -f "$workflow"
            grep -q $'permissions:\n  contents: read' "$workflow"
            if grep -E 'contents: write|secrets\.|SUPABASE_ACCESS_TOKEN|SUPABASE_DB_PASSWORD|(^|[[:space:]])psql[[:space:]]|(^|[[:space:]])curl[[:space:]]|supabase (db push|migration up|functions deploy)|git push' "$workflow"; then
              echo "Permanent workflow contains prohibited remote capability: $workflow" >&2
              exit 1
            fi
          done
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              .pay-a08-bootstrap/payload.b64|\
              .github/workflows/pay-001-a08-bootstrap-temp.yml|\
              .github/workflows/pay-001-a08-*.yml|\
              backend/modules/payments/*|\
              config/pay-001-a08-*|\
              docs/PAY-001-A08-*|\
              docs/validation/PAY-001-A08-*|\
              scripts/audit-pay-001-a08-*|\
              scripts/test-pay-001-a08-*|\
              scripts/audit-pay-001-a07-reconciliation-operations-readiness.js|\
              supabase/migrations/*|\
              package.json|\
              config/domain-completion-matrix.json|\
              docs/DOMAIN-COMPLETION-MATRIX.md|\
              reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected changed path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git fetch origin pay/pay-001-baseline-audit
          test "$(git rev-parse origin/pay/pay-001-baseline-audit)" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish clean PAY-A08 commit
        run: |
          git config user.name 'doke-pay-a08-bot'
          git config user.email 'doke-pay-a08-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Complete PAY-A08 immutable migration and read-only canary contracts'
          git push origin HEAD:pay/pay-001-baseline-audit
