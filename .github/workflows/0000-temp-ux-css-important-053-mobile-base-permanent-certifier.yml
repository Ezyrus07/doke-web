          const media=[...q.matchAll(/@media\s*\(([^)]*)\)/gi)].map(m=>m[0].replace(/\s+/g,' ').trim());if(media.length!==1||media[0]!=='@media (max-width: 760px)')throw Error(`media ${JSON.stringify(media)}`);
