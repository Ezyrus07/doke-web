          const expected=[1,2,5,6,7,9,10,11,12,13,15,16,17,18,19,24];
          if(n!==28||JSON.stringify(removed)!==JSON.stringify(expected)||c!==q)throw Error(`ordinal reconstruction ${n}/${JSON.stringify(removed)}`);
          if(p.replace(/\s*!important\b/gi,'')!==q.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');
          const sha=crypto.createHash('sha256').update(q).digest('hex'),bytes=Buffer.byteLength(q),blob=cp.execFileSync('git',['hash-object','--stdin'],{input:q,encoding:'utf8'}).trim();
