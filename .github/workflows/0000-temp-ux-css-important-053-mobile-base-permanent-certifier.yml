      - name: Install frozen dependencies
        shell: bash
        run: npm ci --ignore-scripts >/dev/null
      - name: Independently prove dedicated mobile base contract
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT" >/dev/null
