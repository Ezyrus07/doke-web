name: TEMP UX-CSS-IMPORTANT-053 Mobile Base Permanent Certifier

on:
  pull_request:
    types: [reopened]
    branches:
      - diag/ux-css-important-053-mobile-base-permanent-certifier

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      PARENT: 4f861d705eaf288eb3ea7a81ba8df2802464d2b1
      PARENT_TREE: a302b917d63f9caa9212765ec6a02c4a807411b0
      PERM: 84dc170e5bcf8b04aaf7eaba6f46c1ae67b730af
      PERM_TREE: 9c2545f50d34ebf81e3976fb5c421e6f5f616b32
      TARGET: assets/css/components/shell/mobile-base-stability.css
      PARENT_BLOB: fe3efc820ef1bbbdbad1b40b99513d156243e04e
      PERM_BLOB: e077a0a7f8217972e2d87da7462cadf0859b3a11
      PERM_SHA256: 00aa34c833122d20b395808e18d9f046e88f57d90c82067a04e52f0cd9c58183
      MATERIAL_BRANCH: diag/ux-css-important-053-mobile-base-materialize-r4
