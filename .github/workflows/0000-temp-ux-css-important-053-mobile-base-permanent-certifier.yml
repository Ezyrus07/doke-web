          node <<'NODE'
          const fs=require('fs'),path=require('path');const a=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?w(p):p.endsWith('.css')&&a.push(p)}})('assets/css');const n=a.reduce((s,p)=>s+(fs.readFileSync(p,'utf8').match(/!important\b/gi)||[]).length,0);if(n!==43)throw Error(`parent global ${n}`);console.log('PARENT_GLOBAL=43');
          NODE
          git checkout --detach "$PERM" >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');const a=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?w(p):p.endsWith('.css')&&a.push(p)}})('assets/css');const n=a.reduce((s,p)=>s+(fs.readFileSync(p,'utf8').match(/!important\b/gi)||[]).length,0);if(n!==27)throw Error(`perm global ${n}`);console.log('PERM_GLOBAL=27');
