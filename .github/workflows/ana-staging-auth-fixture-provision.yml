name: ANA staging auth fixture provision

on:
  push:
    branches:
      - ana/ana-001-foundation
    paths:
      - '.github/workflows/ana-staging-auth-fixture-provision.yml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOKE_ENVIRONMENT: staging
      DOKE_SUPABASE_URL: https://zwkczgewzbsorbrjuzpb.supabase.co
      DOKE_SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      DOKE_STAGING_CLIENT_EMAIL: cliente@doke.local
      DOKE_STAGING_PROFESSIONAL_EMAIL: profissional@doke.local
      DOKE_STAGING_SUPPORT_EMAIL: suporte@doke.local
      DOKE_STAGING_ADMIN_EMAIL: admin@doke.local
      DOKE_STAGING_AUTH_PROVISION_CONFIRM: provision-staging-auth-canaries
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DOKE_STAGING_CLIENT_PASSWORD: ${{ secrets.DOKE_STAGING_CLIENT_PASSWORD }}
      DOKE_STAGING_PROFESSIONAL_PASSWORD: ${{ secrets.DOKE_STAGING_PROFESSIONAL_PASSWORD }}
      DOKE_STAGING_SUPPORT_PASSWORD: ${{ secrets.DOKE_STAGING_SUPPORT_PASSWORD }}
      DOKE_STAGING_ADMIN_PASSWORD: ${{ secrets.DOKE_STAGING_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate staging Auth canary environment
        run: node scripts/provision-staging-auth-canaries.js --check-env

      - name: Provision staging Auth canaries
        run: node scripts/provision-staging-auth-canaries.js --execute
