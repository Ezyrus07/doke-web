name: TEMP COM-B02I Matrix Sync Materializer R2

on:
  push:
    branches:
      - 'tmp/com-b02i-matrix-sync-r2-20260816'

permissions:
  contents: write

concurrency:
  group: tmp-com-b02i-matrix-sync-materializer-r2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/com-b02i-matrix-sync-r2-20260816
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Assert install scope and frozen sources
        shell: bash
        run: |
          set -euo pipefail
          AUTHORIZED=4edf21b5374c54c1cf4995c7c44d7df0332c9bbe
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED"
          expected=".github/workflows/tmp-com-b02i-matrix-sync-materializer-r2.yml"
          actual="$(git diff --name-only "$AUTHORIZED" HEAD)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-providers.js)" = "b919a29337edf40d69109fb2f338616c75b3911b"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git rev-parse HEAD:backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          test "$(git rev-parse HEAD:config/com-b02i-canonical-command-source-providers.json)" = "4817bf608943a435c999f77badde57c9aa9a1764"
          test "$(git rev-parse HEAD:scripts/test-com-b02i-canonical-command-source-providers.js)" = "eee15fecfc12e231113922ca6eb337632160eddc"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "332da22f604806ba06a0687c69d3d89903c4222c"
          test "$(git rev-parse HEAD:backend/modules/communities/community-supabase-repository-adapter.js)" = "94bc05d9797bc2b5673e440d0b25f09485d8215d"
          test "$(git rev-parse HEAD:supabase/migrations/20260805121500_com_b02b_server_authority.sql)" = "fd74f6abc029023c4e0972b32b35daca975c3d57"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate canonical Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git hash-object config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-com-b02i-matrix-sync-materializer-r2.yml \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | sort)"
          test "$actual" = "$expected"

      - name: Reconcile B02I certifier structurally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/com-b02i-canonical-command-source-providers.yml')
          lines = path.read_text().splitlines()
          out = []
          parent_hits = 0
          matrix_hits = 0
          scope_hits = 0

          semantic_freezes = [
              ('backend/modules/communities/community-command-source-providers.js', 'b919a29337edf40d69109fb2f338616c75b3911b'),
              ('backend/modules/communities/community-command-source-repository-contract.js', '38cd77fd6d3cf0c9f13d4c35ed000b9831481840'),
              ('backend/modules/communities/sql/com-b02i-command-sources.sql', '1ff7621973be5ef38aa5e033b91f5b75216b9ec1'),
              ('config/com-b02i-canonical-command-source-providers.json', '4817bf608943a435c999f77badde57c9aa9a1764'),
              ('scripts/test-com-b02i-canonical-command-source-providers.js', 'eee15fecfc12e231113922ca6eb337632160eddc'),
          ]

          for line in lines:
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]

              if stripped == 'test "$(git rev-parse HEAD^)" = "$BASE"':
                  parent_hits += 1
                  out.append(indent + 'MATERIALIZED=4edf21b5374c54c1cf4995c7c44d7df0332c9bbe')
                  out.append(indent + 'test "$(git rev-parse "$MATERIALIZED^")" = "$BASE"')
                  out.append(indent + 'git merge-base --is-ancestor "$BASE" "$MATERIALIZED"')
                  out.append(indent + 'git merge-base --is-ancestor "$MATERIALIZED" HEAD')
                  continue

              out.append(line)

              if stripped == 'test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"':
                  matrix_hits += 1
                  for file_path, blob in semantic_freezes:
                      out.append(indent + f'test "$(git rev-parse HEAD:{file_path})" = "{blob}"')

              if stripped == 'scripts/test-com-b02i-canonical-command-source-providers.js | sort)"':
                  scope_hits += 1
                  current = out.pop()
                  out.append(indent + 'docs/DOMAIN-COMPLETION-MATRIX.md \\')
                  out.append(indent + 'reports/generated/domain-completion-matrix-report.json \\')
                  out.append(current)

          if parent_hits != 1:
              raise SystemExit(f'B02I_PARENT_ASSERTION_HITS:{parent_hits}')
          if matrix_hits != 1:
              raise SystemExit(f'B02I_MATRIX_ASSERTION_HITS:{matrix_hits}')
          if scope_hits != 1:
              raise SystemExit(f'B02I_SCOPE_ASSERTION_HITS:{scope_hits}')

          path.write_text('\n'.join(out) + '\n')
          PY
          ! grep -F 'test "$(git rev-parse HEAD^)" = "$BASE"' .github/workflows/com-b02i-canonical-command-source-providers.yml
          grep -F 'MATERIALIZED=4edf21b5374c54c1cf4995c7c44d7df0332c9bbe' .github/workflows/com-b02i-canonical-command-source-providers.yml
          grep -F 'git merge-base --is-ancestor "$MATERIALIZED" HEAD' .github/workflows/com-b02i-canonical-command-source-providers.yml
          grep -F 'docs/DOMAIN-COMPLETION-MATRIX.md' .github/workflows/com-b02i-canonical-command-source-providers.yml
          grep -F 'reports/generated/domain-completion-matrix-report.json' .github/workflows/com-b02i-canonical-command-source-providers.yml

      - name: B02I semantic conformance
        run: |
          node --check backend/modules/communities/community-command-source-providers.js
          node --check backend/modules/communities/community-command-source-repository-contract.js
          node --check scripts/test-com-b02i-canonical-command-source-providers.js
          node scripts/test-com-b02i-canonical-command-source-providers.js

      - name: Fail-closed remote and migration hard blocks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/modules/communities/community-command-source-providers.js
          ! grep -E 'createClient\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/modules/communities/community-command-source-repository-contract.js
          grep -F "authority!=='server_service_role'" backend/modules/communities/community-command-source-repository-contract.js
          grep -F 'intentionally outside supabase/migrations' backend/modules/communities/sql/com-b02i-command-sources.sql
          grep -F "'claimState'" backend/modules/communities/sql/com-b02i-command-sources.sql
          grep -F 'outcome jsonb' backend/modules/communities/sql/com-b02i-command-sources.sql
          grep -F 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          ! git diff --name-only 4edf21b5374c54c1cf4995c7c44d7df0332c9bbe HEAD -- supabase/migrations/ | grep .
          test "$(git hash-object backend/modules/communities/community-command-source-providers.js)" = "b919a29337edf40d69109fb2f338616c75b3911b"
          test "$(git hash-object backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git hash-object backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          test "$(git hash-object config/com-b02i-canonical-command-source-providers.json)" = "4817bf608943a435c999f77badde57c9aa9a1764"
          test "$(git hash-object scripts/test-com-b02i-canonical-command-source-providers.js)" = "eee15fecfc12e231113922ca6eb337632160eddc"
          test "$(git hash-object config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          node - <<'NODE'
          const b=require('./config/com-b02i-canonical-command-source-providers.json');
          if(b.repositoryEvolution.sqlDefinitionOutsideMigrationDirectory!==true||b.repositoryEvolution.migrationArtifactCreated!==false||b.repositoryEvolution.migrationApplied!==false||b.repositoryEvolution.rpcExecuted!==false||b.repositoryEvolution.networkExecuted!==false||b.repositoryEvolution.credentialReadExecuted!==false)throw new Error('B02I_REPOSITORY_EVOLUTION_DRIFT');
          for(const k of ['handlerMutationAuthority','runtimeActivationAuthority','repositoryRemoteExecutionAuthority','stagingDeploymentAuthority','stagingTrafficAuthority','rpcExecutionAuthority','networkAuthority','credentialReadAuthority','identityLifecycleRemoteAuthority','realCommunityMutationAuthority','migrationApplicationAuthority','triggerCreationAuthority','receiptCreationAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','r5iCreationAuthority'])if(b.authority[k]!==false)throw new Error(`B02I_FORBIDDEN_AUTHORITY:${k}`);
          for(const k of ['existingB02hArtifactsChanged','membershipEvaluatorChanged','governanceEvaluatorChanged','contentEvaluatorChanged','existingRouteRegistryChanged','existingModuleRouteLoaderChanged','existingCommunityRouteHandlersChanged','existingB02bRepositoryAdapterChanged','existingB02bMigrationChanged','runtimeActivated','stagingDeploymentExecuted','stagingTrafficEnabled','rpcExecuted','networkRequestExecuted','realtimeSubscriptionExecuted','credentialReadExecuted','remoteIdentityMutationExecuted','realCommunityMutationExecuted','migrationApplied','triggerCreated','receiptCreated','productionChanged','pullRequestMerged','readyForReviewChanged'])if(b.effects[k]!==false)throw new Error(`B02I_FORBIDDEN_EFFECT:${k}`);
          if(b.functionalCheckpoint.lastFunctionalCheckpoint!=='COM-B03C-R5H'||b.functionalCheckpoint.exactRootCauseProven!==false||b.functionalCheckpoint.causalPromotionAllowed!==false||b.functionalCheckpoint.privatePresencePromotionAllowed!==false||b.functionalCheckpoint.r5iCreated!==false||b.functionalCheckpoint.r5iInferred!==false)throw new Error('B02I_FUNCTIONAL_CHECKPOINT_DRIFT');
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --check 4edf21b5374c54c1cf4995c7c44d7df0332c9bbe

      - name: Prepare final self-removing commit on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          AUTHORIZED=4edf21b5374c54c1cf4995c7c44d7df0332c9bbe
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add .github/workflows/com-b02i-canonical-command-source-providers.yml
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git rm .github/workflows/tmp-com-b02i-matrix-sync-materializer-r2.yml
          git diff --cached --check
          git commit -m 'ci(com): synchronize B02I Matrix and certifier'
          expected="$(printf '%s\n' \
            .github/workflows/com-b02i-canonical-command-source-providers.yml \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only "$AUTHORIZED" HEAD | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-providers.js)" = "b919a29337edf40d69109fb2f338616c75b3911b"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git rev-parse HEAD:backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          test "$(git rev-parse HEAD:config/com-b02i-canonical-command-source-providers.json)" = "4817bf608943a435c999f77badde57c9aa9a1764"
          test "$(git rev-parse HEAD:scripts/test-com-b02i-canonical-command-source-providers.js)" = "eee15fecfc12e231113922ca6eb337632160eddc"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          test ! -e .github/workflows/tmp-com-b02i-matrix-sync-materializer-r2.yml
          git status --porcelain | test ! -s /dev/stdin
          git push origin HEAD:refs/heads/tmp/com-b02i-matrix-sync-r2-20260816
