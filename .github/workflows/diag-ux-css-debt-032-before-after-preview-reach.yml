name: Doke UX-CSS-DEBT-032 Before After Preview Reach

on:
  push:
    branches:
      - diag/ux-css-debt-032-before-after-preview-reach

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5b0dbde506b210d5a4a25897abdb55ae9432cea7
      TARGET_BLOB: b018b549acddef4e56937f6867ce2189daf7ee79
      TARGET_FILE: assets/css/pages/home-overlays/before-after-preview.css
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 5

      - name: Preserve harness and checkout exact UX-CSS-DEBT-031 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-032-before-after-preview-reach.cjs /tmp/ux-css-debt-032-before-after-preview-reach.cjs
          git fetch origin "${TARGET_SHA}" --depth=1
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CHECKPOINT GUARD PASS|sha=${TARGET_SHA}|blob=${TARGET_BLOB}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate canonical active graph
        run: npm run audit:active-legacy-structures

      - name: Prove reach cascade and runtime parity
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$PWD/node_modules" node /tmp/ux-css-debt-032-before-after-preview-reach.cjs

      - name: Verify exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          echo "FINAL CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0"
