name: ANA-A11 Liquidity Freshness Policy Derivation
on:
  pull_request:
    paths:
      - 'config/ana-a11-liquidity-freshness-policy-derivation.json'
      - 'docs/ANA-A11-LIQUIDITY-FRESHNESS-POLICY-DERIVATION.md'
      - 'scripts/audit-ana-a11-liquidity-freshness-policy-derivation.js'
      - 'scripts/test-ana-a11-liquidity-freshness-policy-derivation.js'
      - 'config/cat-a07-supply-coverage-baseline.json'
      - 'scripts/audit-cat-a07-supply-coverage-baseline.js'
      - 'scripts/test-cat-a07-supply-coverage-baseline.js'
      - 'config/ana-a07-freshness-window-authority.json'
      - 'config/ana-a10-cat-liquidity-projection.json'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - 'package.json'
      - '.github/workflows/ana-a11-liquidity-freshness-policy-derivation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          node --check scripts/audit-ana-a11-liquidity-freshness-policy-derivation.js
          node --check scripts/test-ana-a11-liquidity-freshness-policy-derivation.js
          node --check scripts/audit-cat-a07-supply-coverage-baseline.js
          node --check scripts/test-cat-a07-supply-coverage-baseline.js
      - run: |
          npm run audit:ana-a11-liquidity-freshness-policy-derivation
          npm run test:ana-a11-liquidity-freshness-policy-derivation
          npm run audit:cat-a07-supply-coverage-baseline
          npm run test:cat-a07-supply-coverage-baseline
      - run: |
          npm run audit:ana-a07-freshness-window-authority
          npm run test:ana-a07-freshness-window-authority
          npm run audit:ana-a10-cat-liquidity-projection
          npm run test:ana-a10-cat-liquidity-projection
          npm run audit:cat-a06-listing-visibility-timeline
          npm run test:cat-a06-listing-visibility-timeline
      - run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
      - run: git diff --check
