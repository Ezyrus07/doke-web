      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/proof.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"; git checkout "$TARGET_SHA" -- .; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts; npx playwright install --with-deps chromium >/tmp/pw.log 2>&1; cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),f=process.env.TARGET_FILE;const parent=fs.readFileSync(f,'utf8');if((parent.match(/!important\b/g)||[]).length!==23)throw Error('parent drift');let s=parent.replace(/\s*!important\b/g,'');const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          function restore(selector,props){const re=new RegExp(esc(selector)+'\\s*\\{','g'),all=[...s.matchAll(re)].map(m=>{const b=s.indexOf('{',m.index),e=s.indexOf('}',b);return{b,e,block:s.slice(b+1,e)}}),hits=all.filter(x=>props.every(p=>new RegExp(`(^|\\n)\\s*${esc(p)}\\s*:`,'m').test(x.block)));if(hits.length!==1)throw Error(`selector ${selector} matchingBlocks=${hits.length}`);let block=hits[0].block;for(const p of props){const pr=new RegExp(`(^|\\n)(\\s*${esc(p)}\\s*:[^;]+);`,'m');block=block.replace(pr,'$1$2 !important;')}s=s.slice(0,hits[0].b+1)+block+s.slice(hits[0].e)}
          restore('body.home-index-shell .doke-search-panel__form',['position','overflow']);restore('body.home-index-shell .home-search-hero__field::before,\n  body.home-index-shell .home-search-hero__field::after',['display']);restore('body.home-index-shell .featured-services .content-rail',['overflow']);if((s.match(/!important\b/g)||[]).length!==4)throw Error('candidate count');fs.writeFileSync('/tmp/candidate.css',s);const z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex');let stat='';try{stat=cp.execFileSync('git',['diff','--no-index','--numstat','/tmp/parent.css','/tmp/candidate.css'],{encoding:'utf8'}).trim()}catch(e){stat=String(e.stdout||'').trim()}const [a,d]=stat.split(/\s+/).map(Number);if(a!==19||d!==19)throw Error(`diff ${stat}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=23->4|files=1|additions=${a}|deletions=${d}|priorityMarkersRemoved=19|searchMarkersPreserved=3|featuredOverflowGuardPreserved=1`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');(async()=>{const f=process.env.TARGET_FILE,parent=fs.readFileSync('/tmp/parent.css','utf8'),candidate=fs.readFileSync('/tmp/candidate.css','utf8'),browser=await chromium.launch({headless:true}),widths=[359,379,380,381,390,430,560,561],railWidths=new Set([359,380,560]),hash=b=>crypto.createHash('sha256').update(b).digest('hex');const targets=[['.featured-services',['display','visibility','overflow','overflow-x','overflow-y','width','max-width']],['.short-videos',['display','visibility','overflow','overflow-x','overflow-y','width','max-width']],['.featured-services .content-rail',['display','visibility','overflow','overflow-x','overflow-y','width','max-width','margin-left','margin-right','padding-left','padding-right']],['#featured-services-track',['display','visibility','flex-direction','flex-wrap','grid-template-columns','grid-auto-flow','overflow-x','overflow-y','overscroll-behavior-x','scroll-snap-type','width','min-width','max-width','padding-left','padding-right','scroll-padding-left']],['.short-videos .content-rail',['display','visibility','overflow','overflow-x','overflow-y','padding-left','padding-right']],['#short-videos-track',['display','visibility','grid-template-columns','grid-auto-flow','grid-auto-columns','overflow','overflow-x','overflow-y','width','min-width','max-width']]];const items=Array.from({length:6},(_,i)=>({id:`diag-${i}`,serviceId:`diag-${i}`,status:'active',title:`Serviço ${i}`,category:'Reformas',providerName:`Profissional ${i}`,providerHandle:`prof${i}`,rating:4.9,reviewsCount:20+i,price:120+i*10,location:'Salvador, BA',tags:['seguro','rapido']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));await p.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));await p.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:200,contentType:'font/woff2',body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.route('https://unpkg.com/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.goto(`http://127.0.0.1:4173/index.html?cssimp006r6=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(900);await p.waitForFunction(()=>window.Doke?.homePublicServices?.render&&window.Doke?.publicServiceCard?.create,{timeout:6000});if(await p.evaluate(items=>window.Doke.homePublicServices.render(items),items)!==6)throw Error('renderer');await p.waitForFunction(()=>document.querySelector('#featured-services-track')?.children.length===6,{timeout:3000});await p.waitForTimeout(200);const ready=await p.evaluate(()=>{const vis=s=>{const e=document.querySelector(s);if(!e)return false;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0};return{fc:document.querySelector('#featured-services-track')?.children.length||0,sc:document.querySelector('#short-videos-track')?.children.length||0,vis:['.featured-services','.short-videos','.featured-services .content-rail','#featured-services-track','.short-videos .content-rail','#short-videos-track'].every(vis)}});if(ready.fc!==6||ready.sc<1||!ready.vis)throw Error(`runtime ${JSON.stringify(ready)}`);if(state==='rail'){const m=await p.evaluate(()=>{const e=document.querySelector('#featured-services-track'),max=Math.max(0,e.scrollWidth-e.clientWidth);e.scrollLeft=Math.min(120,max);return{max,left:e.scrollLeft}});if(m.max<=0||m.left<=0)throw Error(`rail ${JSON.stringify(m)}`)}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(ts=>{const R=n=>Math.round(n*1000)/1000,o={};for(const [s,ps] of ts)o[s]=[...document.querySelectorAll(s)].map(e=>{const c=getComputedStyle(e),r=e.getBoundingClientRect(),style={};for(const x of ps)style[x]=c.getPropertyValue(x).trim();return{style,rect:[R(r.x),R(r.y),R(r.width),R(r.height)],scroll:[e.clientWidth,e.clientHeight,e.scrollWidth,e.scrollHeight,R(e.scrollLeft),R(e.scrollTop)],children:e.children.length}});o.__scrollbar=getComputedStyle(document.querySelector('#featured-services-track'),'::-webkit-scrollbar').display;return o},targets);const png=hash(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
          const states=[];for(const w of widths){states.push([w,'default']);if(railWidths.has(w))states.push([w,'rail'])}const A={},B={};fs.writeFileSync(f,parent);for(const [w,s] of states)A[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,candidate);for(const [w,s] of states)B[`${w}-${s}`]=await cap(w,s,'candidate');let dd=0,sd=0,pe=0;const keys=[];for(const k of Object.keys(A)){pe+=A[k].errs.length+B[k].errs.length;if(JSON.stringify(A[k].data)!==JSON.stringify(B[k].data)){dd++;keys.push(k)}if(A[k].png!==B[k].png){sd++;if(!keys.includes(k))keys.push(k)}}console.log(`RENDERER PARITY|states=${states.length}|viewports=${widths.join(',')}|railStates=3|featuredCards=6|shortCards=6|dataDiffs=${dd}|screenshotDiffs=${sd}|pageErrors=${pe}|diffKeys=${keys.join(',')||'-'}|productRenderer=1|syntheticDOM=0|criteriaRelaxed=0`);if(dd||sd||pe)throw Error(`unsafe ${keys.join(',')}`);console.log('DECISION|candidateSafe=1|candidate=23->4|searchMarkersPreserved=3|featuredOverflowGuardPreserved=1|reason=real-renderer-visible-runtime-parity');await browser.close();fs.writeFileSync(f,parent)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PROOF=${{ steps.proof.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|RENDERER PARITY|DECISION)\|' /tmp/proof.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 300 /tmp/proof.log || true; fi; } >/tmp/evidence.txt; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 006 renderer r6 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
