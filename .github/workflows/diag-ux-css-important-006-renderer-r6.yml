    branches: [diag/ux-css-important-006-renderer-r6]
    paths: [.github/workflows/diag-ux-css-important-006-renderer-r6.yml]
permissions: {contents: write}
jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 24b49e5693f24621a1024b94c33c8ba6e18b12c0
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
