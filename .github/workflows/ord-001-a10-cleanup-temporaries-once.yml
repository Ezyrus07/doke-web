name: ORD-A10 Cleanup Temporary Workflows Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a10-cleanup-temporaries-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Remove ORD-A10 temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/ord-001-a10-cumulative-contract-reconcile-once.yml \
            .github/workflows/ord-001-a10-cleanup-temporaries-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove ORD-A10 temporary workflows' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
