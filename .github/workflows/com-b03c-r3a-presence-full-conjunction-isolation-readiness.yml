name: COM-B03C-R3A Presence Full-Conjunction Isolation Readiness

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - backend/modules/communities/community-realtime-private-auth-r3a.js
      - config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json
      - scripts/test-com-b03c-r3a-presence-full-conjunction-isolation-readiness.js
      - scripts/execute-com-b03c-r3a-presence-full-conjunction-isolation-staging-canary.js
      - scripts/verify-com-b03c-r3a-presence-full-conjunction-isolation-staging-canary-evidence.js
      - docs/validation/COM-B03C-R3A-PRESENCE-FULL-CONJUNCTION-ISOLATION-READINESS.json
      - docs/validation/COM-B03C-R3A-PRESENCE-FULL-CONJUNCTION-ISOLATION-IMPLEMENTATION.json
      - .github/workflows/com-b03c-r3a-presence-full-conjunction-isolation-readiness.yml

permissions:
  contents: read

concurrency:
  group: com-b03c-r3a-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3a.js
          node --check scripts/test-com-b03c-r3a-presence-full-conjunction-isolation-readiness.js
          node --check scripts/execute-com-b03c-r3a-presence-full-conjunction-isolation-staging-canary.js
          node --check scripts/verify-com-b03c-r3a-presence-full-conjunction-isolation-staging-canary-evidence.js
      - name: COM-B03C-R3A implementation readiness
        run: node scripts/test-com-b03c-r3a-presence-full-conjunction-isolation-readiness.js
      - name: Predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/validation/COM-B03C-R3-CORRECTED-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
          grep -q '"zeroResidueProven": true' docs/validation/COM-B03C-R3-CORRECTED-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
          grep -q '"presenceFullConjunctionReadProven": false' docs/validation/COM-B03C-R3-CORRECTED-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
          grep -q '"typingFullConjunctionReadProven": true' docs/validation/COM-B03C-R3-CORRECTED-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
      - name: Repository-only execution boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/execute-com-b03c-r3a-presence-full-conjunction-isolation-staging-canary.js 2> /tmp/r3a-executor.err
          executor_status="$?"
          set -e
          test "${executor_status}" = "2"
          grep -q 'DOKE_COM_B03C_R3A_STAGING_AUTHORIZATION_NOT_DEFINED' /tmp/r3a-executor.err
          test "$(node -p "require('./config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json').authorization.futureStagingAuthorizationDefined")" = "false"
          test "$(node -p "require('./config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json').authorization.triggerExists")" = "false"
          test "$(node -p "require('./config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json').authorization.pushTriggerExists")" = "false"
          workflow='.github/workflows/com-b03c-r3a-presence-full-conjunction-isolation-readiness.yml'
          forbidden_secrets_pattern='secrets[.]'
          forbidden_environment_pattern='environment:[[:space:]]*doke-staging'
          ! grep -qE '^[[:space:]]*push:' "${workflow}"
          ! grep -qE "${forbidden_secrets_pattern}" "${workflow}"
          ! grep -qE "${forbidden_environment_pattern}" "${workflow}"
      - name: Governance invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"matrixVersion": "1.3.113"' config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json
          grep -q '"maturity": 3' config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json
          grep -q '"productionGate": "blocked"' config/com-b03c-r3a-presence-full-conjunction-isolation-readiness.json
          grep -q '"productionAuthority": false' docs/validation/COM-B03C-R3A-PRESENCE-FULL-CONJUNCTION-ISOLATION-IMPLEMENTATION.json
          grep -q '"mergeAuthority": false' docs/validation/COM-B03C-R3A-PRESENCE-FULL-CONJUNCTION-ISOLATION-IMPLEMENTATION.json
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=2 origin "${TARGET_SHA}"
          git diff --check "${TARGET_SHA}^" "${TARGET_SHA}"
