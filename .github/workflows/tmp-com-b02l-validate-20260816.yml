name: TEMP COM-B02L Validate and Matrix Materializer

on:
  push:
    branches:
      - tmp/com-b02l-validate-20260816

permissions:
  contents: write

concurrency:
  group: tmp-com-b02l-validate-20260816
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/com-b02l-validate-20260816
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze candidate lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=b643d81a88c39f1dc3d4e23d88b969a407d4e8e0
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(git rev-parse "$CANDIDATE":backend/modules/communities/community-command-runtime-binding-adapter-contract.js)" = "c48eabab7bb5b37b6a1663a051b3a8a6223cd0c9"
          test "$(git rev-parse "$CANDIDATE":config/com-b02l-command-runtime-binding-adapter-contract.json)" = "31f234b9724d44047031f0dca4f9d3f32518f4b9"
          test "$(git rev-parse "$CANDIDATE":scripts/test-com-b02l-command-runtime-binding-adapter-contract.js)" = "dacb6079809784fec95aeb1672c2411332767313"
          test "$(git rev-parse "$CANDIDATE":.github/workflows/com-b02l-command-runtime-binding-adapter-contract.yml)" = "9268fbb2919ab502bce13ec5f33d26ad962a8f4a"
          test "$(git rev-parse "$CANDIDATE":config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          expected=".github/workflows/tmp-com-b02l-validate-20260816.yml"
          actual="$(git diff --name-only "$CANDIDATE" HEAD)"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Semantic and fail-closed validation
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-command-runtime-binding-adapter-contract.js
          node --check scripts/test-com-b02l-command-runtime-binding-adapter-contract.js
          node scripts/test-com-b02l-command-runtime-binding-adapter-contract.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/modules/communities/community-command-runtime-binding-adapter-contract.js
          grep -F 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          node - <<'NODE'
          const handlers=require('./backend/modules/communities/route-handlers');
          const loader=require('./backend/shared/http/module-route-loader');
          for(const name of ['executeMembershipCommand','executeGovernanceCommand','executeContentCommand']){
            if(handlers.handlers[name]!==handlers[name])throw new Error(`B02L_EXECUTE_HANDLER_DRIFT:${name}`);
            if(loader.getHandler('communities',name)!==handlers[name])throw new Error(`B02L_LOADER_HANDLER_DRIFT:${name}`);
          }
          for(const name of ['composeMembershipCommandRepositoryOnly','composeGovernanceCommandRepositoryOnly','composeContentCommandRepositoryOnly']){
            if(Object.prototype.hasOwnProperty.call(handlers.handlers,name))throw new Error(`B02L_COMPOSER_RUNTIME_BOUND:${name}`);
            if(loader.getHandler('communities',name)!==null)throw new Error(`B02L_LOADER_EXPOSES_COMPOSER:${name}`);
          }
          NODE

      - name: Generate exact Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          npm run write:domain-completion-matrix
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --quiet -- config/domain-completion-matrix.json

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check

      - name: Persist only Matrix derivatives and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "ci(com): sync B02L Matrix derivatives"
          git rm .github/workflows/tmp-com-b02l-validate-20260816.yml
          git commit -m "ci(com): remove B02L temp materializer"
          git push origin HEAD:refs/heads/tmp/com-b02l-validate-20260816
