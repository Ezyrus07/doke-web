      - name: Validate and commit capability alignment
        run: |
          node --check assets/js/repositories/orders-repository.js
          node --check assets/js/services/orders-service.js
          node --check backend/modules/orders/orders-service.js
          grep -q "resolveOrderCapability" assets/js/services/orders-service.js
          grep -q "resolveOrderCapability" backend/modules/orders/orders-service.js
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/repositories/orders-repository.js assets/js/services/orders-service.js backend/modules/orders/orders-service.js
          git commit -m "Align ORD-A03 capabilities with order relationships"
          git push origin HEAD:ord/ord-001-baseline-audit
