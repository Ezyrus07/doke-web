""", 'frontend transition error capability')
          source = replace_once(source, """  function canActorTransition(actor, order, nextStatus) {
    if (!actor || !actor.id) return false;
    if (actor.role === 'professional') {
      if (!canProfessionalActOnOrder(actor, order)) return false;
