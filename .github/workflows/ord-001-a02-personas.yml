name: Doke ORD-A02 Personas and Grants

on:
  pull_request:
    paths:
      - docs/ORD-001-AUTHORITY-BASELINE.md
      - docs/ORD-001-PERSONAS-AND-GRANTS.md
      - docs/validation/ORD-001-A01-BASELINE.json
      - docs/validation/ORD-001-A02-PERSONAS.json
      - scripts/audit-ord-001-a01-baseline.js
      - scripts/audit-ord-001-a02-personas.js
      - scripts/test-order-state-machine-contract.js
      - scripts/test-order-state-machine-runtime.js
      - scripts/test-order-transaction-events-contract.js
      - scripts/test-order-event-worker-contract.js
      - scripts/test-order-event-worker-runtime.mjs
      - scripts/test-order-incident-escalation-contract.js
      - scripts/test-order-operational-postmortems-contract.js
      - supabase/functions/order-event-worker/**
      - supabase/migrations/010_orders_shared_runtime.sql
      - supabase/migrations/066_order_operational_incident_schema.sql
      - supabase/migrations/076_order_operational_postmortems_slos.sql
      - supabase/migrations/20260729190500_ord_a02_trigger_only_grants.sql
      - .github/workflows/ord-a03-applicator.yml
      - .github/workflows/ord-001-a02-personas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ord-a03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract and run temporary applicator
        run: |
          if grep -q "supabase.rpc('create_order_command'" backend/modules/orders/orders-service.js; then
            echo "ORD-A03 transformations already present"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ord-a03-applicator.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          code = code.replace(
              "source = replace_once(source, old_load, new_load, 'repository load')",
              "load_start = source.index('    var local = readLocal();', source.index('  function load(options) {'))\nload_end = source.index('  function save(order) {', load_start)\nsource = source[:load_start] + new_load + source[load_end:]"
          )
          Path('/tmp/apply-ord-a03.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/apply-ord-a03.py
      - name: Validate and commit transformed sources
        run: |
          node --check assets/js/repositories/orders-repository.js
          node --check assets/js/services/orders-service.js
          node --check backend/modules/orders/orders-service.js
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/repositories/orders-repository.js assets/js/services/orders-service.js backend/modules/orders/orders-service.js scripts/audit-ord-001-a01-baseline.js scripts/audit-ord-001-a02-personas.js
          git commit -m "Establish canonical ORD-A03 command boundary"
          git push origin HEAD:ord/ord-001-baseline-audit
