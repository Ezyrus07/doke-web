name: Doke PAY-A07 Matrix Publisher Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/pay-001-a07-matrix-publisher-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Register PAY-A07 package and matrix contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['audit:pay-001-a07-reconciliation-operations-readiness'] = 'node scripts/audit-pay-001-a07-reconciliation-operations-readiness.js';
          packageJson.scripts['test:pay-001-a07-reconciliation-operations-readiness'] = 'node scripts/test-pay-001-a07-reconciliation-operations-readiness.js';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const testPath = 'scripts/test-pay-001-a07-reconciliation-operations-readiness.js';
          let testSource = fs.readFileSync(testPath, 'utf8');
          const oldMetricSensitive = "metadata: { email: 'forbidden@example.test' }";
          const newMetricSensitive = "metadata: { rawCardNumber: '4111111111111111' }";
          const oldAlertSensitive = "context: { environment: 'staging', email: 'forbidden@example.test' }";
          const newAlertSensitive = "context: { environment: 'staging', rawCardNumber: '4111111111111111' }";
          if (!testSource.includes(oldMetricSensitive) || !testSource.includes(oldAlertSensitive)) {
            throw new Error('PAY-A07 sensitive data assertions not found');
          }
          testSource = testSource
            .replace(oldMetricSensitive, newMetricSensitive)
            .replace(oldAlertSensitive, newAlertSensitive);
          fs.writeFileSync(testPath, testSource);

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          if (matrix.version !== '1.3.91') throw new Error(`Unexpected matrix version: ${matrix.version}`);
          matrix.version = '1.3.92';
          matrix.updatedAt = '2026-08-03T14:20:00-03:00';
          const pay = matrix.domains.find((domain) => domain.id === 'PAY-001');
          if (!pay) throw new Error('PAY-001 domain missing');

          const requiredPaths = [
            'backend/modules/payments/payment-reconciliation-operations-contract.js',
            'config/pay-001-a07-reconciliation-operations-readiness.json',
            'docs/PAY-001-A07-RECONCILIATION-OPERATIONS-READINESS.md',
            'docs/validation/PAY-001-A07-RECONCILIATION-OPERATIONS-READINESS.json',
            'scripts/audit-pay-001-a07-reconciliation-operations-readiness.js',
            'scripts/test-pay-001-a07-reconciliation-operations-readiness.js',
            '.github/workflows/pay-001-a07-reconciliation-operations-readiness.yml'
          ];
          requiredPaths.forEach((item) => {
            if (!pay.requiredPaths.includes(item)) pay.requiredPaths.push(item);
          });
          [
            'audit:pay-001-a07-reconciliation-operations-readiness',
            'test:pay-001-a07-reconciliation-operations-readiness'
          ].forEach((item) => {
            if (!pay.tests.includes(item)) pay.tests.push(item);
          });
          const evidence = 'PAY-A07 defines the repository-only provider-neutral reconciliation operations contract: server-only persistence, optimistic concurrency, database leases, disabled idempotent scheduler, low-cardinality metrics, atomic sanitized alert outbox, incident runbook and resource-bound one-shot staging authorization; no remote infrastructure or money authority was activated.';
          if (!pay.evidence.includes(evidence)) pay.evidence.push(evidence);
          const blocker = pay.blockers.find((item) => item.id === 'PAY-B04');
          if (!blocker) throw new Error('PAY-B04 missing');
          blocker.description = 'Remote operational reconciliation infrastructure remains absent: no canonical store, database leases, scheduler, metrics sink, alert delivery, on-call ownership or staging rehearsal exists. PAY-A07 defines the repository-only contract but does not deploy or activate those resources.';
          pay.nextActions = [
            'PAY-A08 — design immutable provider-neutral migrations and a read-only staging canary plan for the A07 store, lease, outbox and observability contracts without applying anything until a separate explicit authorization.',
            ...pay.nextActions.filter((item) => !item.includes('PAY-A07') && !item.includes('PAY-A08'))
          ];
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');

          const a06Path = 'scripts/audit-pay-001-a06-provider-selection-legal-handoff.js';
          let a06 = fs.readFileSync(a06Path, 'utf8');
          const oldAssertion = "assert(pay.nextActions[0].includes('PAY-A07'), 'PAY-A07 must be the first next action');";
          const newAssertions = [
            "assert(pay.requiredPaths.includes('backend/modules/payments/payment-reconciliation-operations-contract.js'), 'PAY-A07 must remain completed after the handoff');",
            "assert(pay.nextActions[0].includes('PAY-A08'), 'PAY-A08 must follow completed PAY-A07');"
          ].join('\n');
          if (!a06.includes(oldAssertion)) throw new Error('PAY-A06 next-action assertion not found');
          a06 = a06.replace(oldAssertion, newAssertions);
          fs.writeFileSync(a06Path, a06);
          NODE
      - name: Generate canonical derivatives
        run: npm run write:domain-completion-matrix
      - name: Validate cumulative PAY and stacked MSG contracts
        run: |
          node --check backend/modules/payments/payment-reconciliation-operations-contract.js
          node --check scripts/audit-pay-001-a07-reconciliation-operations-readiness.js
          node --check scripts/test-pay-001-a07-reconciliation-operations-readiness.js
          node --check scripts/audit-pay-001-a06-provider-selection-legal-handoff.js
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run audit:pay-001-a05-adapter-conformance-readiness
          npm run test:pay-001-a05-adapter-conformance-readiness
          node scripts/audit-pay-001-a05-adapter-contract.js
          node scripts/test-pay-001-a05-adapter-contract.js
          npm run audit:pay-001-a06-provider-selection-legal-handoff
          npm run test:pay-001-a06-provider-selection-legal-handoff
          npm run audit:pay-001-a07-reconciliation-operations-readiness
          npm run test:pay-001-a07-reconciliation-operations-readiness
          node scripts/test-semantic-version.js
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Verify closed publisher boundary
        run: |
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              config/domain-completion-matrix.json|\
              docs/DOMAIN-COMPLETION-MATRIX.md|\
              package.json|\
              reports/generated/domain-completion-matrix-report.json|\
              scripts/audit-pay-001-a06-provider-selection-legal-handoff.js|\
              scripts/test-pay-001-a07-reconciliation-operations-readiness.js) ;;
              *) echo "Unexpected changed path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          node -e "const m=require('./config/domain-completion-matrix.json'); if(m.version!=='1.3.92') process.exit(1)"
          git fetch origin pay/pay-001-baseline-audit
          test "$(git rev-parse origin/pay/pay-001-baseline-audit)" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish PAY-A07 matrix integration
        run: |
          git config user.name 'doke-pay-a07-bot'
          git config user.email 'doke-pay-a07-bot@users.noreply.github.com'
          git add -- \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            scripts/audit-pay-001-a06-provider-selection-legal-handoff.js \
            scripts/test-pay-001-a07-reconciliation-operations-readiness.js
          git add -f -- reports/generated/domain-completion-matrix-report.json
          git commit -m 'Integrate PAY-A07 operations readiness matrix'
          git push origin HEAD:pay/pay-001-baseline-audit
