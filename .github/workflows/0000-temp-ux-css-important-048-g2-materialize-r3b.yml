name: TEMP UX-CSS-IMPORTANT-048 G2 Materialize R3B
on:
  push:
    branches: [diag/ux-css-important-048-g2-materialize-r3b]
permissions:
  contents: write
jobs:
  materialize:
    if: "${{ github.event.head_commit.message != 'diagnostic(ux-css-important-048): materialize exact G2 candidate r3b' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PARENT: bb8644a4dcf6ebfbe4fd0de010f637b6b4d43cdc
      PARENT_TREE: c59180ef5d6e93b894a387d3efad85dff00c9b59
      TARGET: assets/css/pages/home/mobile-hero-feed.css
      PARENT_BLOB: 2f88bd5963ad0157283d322bc9bdb4d8f367e4ba
      EXPECTED_BLOB: 5de77463e9ff079de16f15f42c59600eed95e1cc
      EXPECTED_SHA256: 105cf83d9880187c240f484dfc3aa7fd171362118bb88ff1635f595a676fea60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct exact certified G2 candidate
        shell: bash
        run: |
          set -euo pipefail
          DIAG_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT:$TARGET")" = "$PARENT_BLOB"
          test "$(git rev-list --parents -n1 "$DIAG_HEAD" | awk '{print $2}')" = "$PARENT"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),path=require('path');
          const f=process.env.TARGET;
          const p=cp.execFileSync('git',['show',`${process.env.PARENT}:${f}`],{encoding:'utf8'});
          let n=0,r=0;
          const c=p.replace(/\s*!important\b/gi,m=>{n++;if(n>=1&&n<=22){r++;return ''}return m});
          if(n!==99||r!==22||(c.match(/!important\b/gi)||[]).length!==77)throw Error(`ordinal ${n}/${r}`);
          if(p.replace(/\s*!important\b/gi,'')!==c.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');
          const blob=cp.execFileSync('git',['hash-object','--stdin'],{input:c,encoding:'utf8'}).trim();
          const sha256=crypto.createHash('sha256').update(c).digest('hex'),bytes=Buffer.byteLength(c);
          if(blob!==process.env.EXPECTED_BLOB||sha256!==process.env.EXPECTED_SHA256||bytes!==36647)throw Error(`identity ${blob}/${sha256}/${bytes}`);
          fs.writeFileSync(f,c);
          const css=[];(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,e.name);e.isDirectory()?walk(q):q.endsWith('.css')&&css.push(q)}})('assets/css');
          const global=css.reduce((s,q)=>s+(fs.readFileSync(q,'utf8').match(/!important\b/gi)||[]).length,0);if(global!==119)throw Error(`global ${global}`);
          const receipt={result:'PASS',checkpoint:'UX-CSS-IMPORTANT-048',phase:'R3_EXACT_MATERIALIZATION',issue:384,parentSha:process.env.PARENT,parentTree:process.env.PARENT_TREE,target:f,parentBlob:process.env.PARENT_BLOB,candidateBlob:blob,sha256,bytes,importantBefore:99,importantAfter:77,parentGlobal:141,candidateGlobal:119,globalDelta:-22,removedOrdinals:Array.from({length:22},(_,i)=>i+1),markerOnly:true,selectorsRemoved:0,declarationsRemoved:0,propertiesChanged:0,valuesChanged:0,importsPreserved:true,successorRun:32918700723,successorJob:98027712397,staticRun:32918948120,staticJob:98028427639,initialBrowserRun:32918948120,initialBrowserJobs:[98028427564,98028427547,98028427385],initialBrowserFailureClassification:'HARNESS_ONLY_INVALID_FOCUS_STATE',browserRun:32919160215,browserJobs:[98029054027,98029054152,98029054236],browserRepetitions:3,browserStatesPerRepeat:12,filterStatesPerRepeat:4,metadataDiffs:0,screenshotDiffs:0,loadDiffs:0,pageErrors:0,introducedRegressions:0,criteriaRelaxed:0,firstMaterializerRun:32919477763,firstMaterializerJob:98029997588,firstMaterializerFailureClassification:'HARNESS_ONLY_PARENT_DIFF_INCLUDED_WORKFLOW',repositoryOnly:true};
          fs.mkdirSync('.diagnostics',{recursive:true});fs.writeFileSync('.diagnostics/ux-css-important-048-g2-materialization.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('MATERIALIZATION_R3B='+JSON.stringify({result:'PASS',blob,sha256,bytes,target:'99->77',global:'141->119'}));
          NODE
          git add -N .diagnostics/ux-css-important-048-g2-materialization.json
          mapfile -t changed < <(git diff --name-only -- | sort)
          printf 'WORKTREE_CHANGED=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.diagnostics/ux-css-important-048-g2-materialization.json'
          test "${changed[1]}" = "$TARGET"
          test "$(git diff --name-only "$PARENT" -- "$TARGET")" = "$TARGET"
          git diff --check "$PARENT" -- "$TARGET"
          git diff --check -- .diagnostics/ux-css-important-048-g2-materialization.json
      - name: Commit diagnostic materialization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'diag/ux-css-important-048-g2-materialize-r3b'
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "$TARGET" .diagnostics/ux-css-important-048-g2-materialization.json
          git commit -m 'diagnostic(ux-css-important-048): materialize exact G2 candidate r3b'
          git push origin HEAD:diag/ux-css-important-048-g2-materialize-r3b
