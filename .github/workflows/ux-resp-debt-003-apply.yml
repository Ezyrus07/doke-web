name: Apply UX-RESP-DEBT-003 shared location width

on:
  push:
    branches:
      - ux/ux-resp-debt-003-shared-location-pill

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'ux-resp-debt-003 apply complete' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-resp-debt-003-shared-location-pill
          fetch-depth: 1

      - name: Apply exact authority promotion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/css/layout/header.css')
          text = path.read_text()
          start_marker = '@media (min-width: 561px) and (max-width: 760px) {\n'
          end_marker = '\n\n/* Tablet drawer trigger boundary.'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('expected 561-760 authority block not found')

          current = text[start:end]
          required = [
              'body[data-page="home"].has-global-header',
              '--doke-header-location-width-tablet: min(176px, 34vw);',
              'body[data-page="home"].has-global-header .app-header .home-side-meta__location',
              'body[data-page="home"].has-global-header .app-header .home-side-meta__identity span',
          ]
          for needle in required:
              if needle not in current:
                  raise SystemExit(f'expected authority anchor missing: {needle}')

          replacement = '''@media (min-width: 561px) and (max-width: 760px) {
            body[data-page].has-global-header {
              --doke-header-location-width-tablet: min(176px, 34vw);
            }

            body[data-page="home"].has-global-header {
              --doke-header-height: 66px;
              --doke-header-control-size: 42px;
              --doke-header-profile-height: 46px;
              --doke-header-avatar-size: 36px;
              --doke-header-gap: 8px;
            }

            body[data-page].has-global-header .app-header .home-side-meta__location {
              box-sizing: border-box;
              inline-size: var(--doke-header-location-width-tablet);
              width: var(--doke-header-location-width-tablet);
              min-inline-size: var(--doke-header-location-width-tablet);
              max-inline-size: var(--doke-header-location-width-tablet);
              flex: 0 1 var(--doke-header-location-width-tablet);
            }

            body[data-page="home"].has-global-header .app-header .home-side-meta__location {
              display: inline-flex;
              justify-content: center;
              overflow: hidden;
            }

            body[data-page="home"].has-global-header .app-header .home-side-meta__identity span {
              display: none;
            }
          }'''.replace('          ', '')

          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
          git diff -- assets/css/layout/header.css

      - name: Commit product delta
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add assets/css/layout/header.css
          git commit -m 'ux-resp-debt-003 apply complete'
          git push origin HEAD:ux/ux-resp-debt-003-shared-location-pill
