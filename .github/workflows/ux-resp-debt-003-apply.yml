name: Apply UX-RESP-DEBT-003 shared location width

on:
  push:
    branches:
      - ux/ux-resp-debt-003-shared-location-pill

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'fix(ux-resp-debt-003): promote shared tablet location width' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-resp-debt-003-shared-location-pill
          fetch-depth: 1

      - name: Apply exact authority promotion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/layout/header.css')
          text = path.read_text()
          marker = '@media (min-width: 561px) and (max-width: 760px) {\n'
          if marker not in text:
              raise SystemExit('expected 561-760 media anchor missing')
          probe = '''  body[data-page].has-global-header {\n    --doke-header-location-width-tablet: min(176px, 34vw);\n  }\n\n  body[data-page].has-global-header .app-header .home-side-meta__location {\n    box-sizing: border-box;\n    inline-size: var(--doke-header-location-width-tablet);\n    width: var(--doke-header-location-width-tablet);\n    min-inline-size: var(--doke-header-location-width-tablet);\n    max-inline-size: var(--doke-header-location-width-tablet);\n    flex: 0 1 var(--doke-header-location-width-tablet);\n  }\n\n'''
          if probe in text:
              raise SystemExit('authority promotion already present')
          text = text.replace(marker, marker + probe, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- assets/css/layout/header.css

      - name: Commit product delta
        shell: bash
        run: |
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add assets/css/layout/header.css
          git commit -m 'fix(ux-resp-debt-003): promote shared tablet location width'
          git push origin HEAD:ux/ux-resp-debt-003-shared-location-pill
