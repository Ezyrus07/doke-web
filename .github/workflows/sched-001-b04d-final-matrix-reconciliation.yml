name: Doke SCHED-B04D Final Matrix Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04d-final-matrix-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04d-final-matrix-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Preserve canonical ORD action queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(path.read_text())
          if matrix['version'] != '1.3.69':
              raise SystemExit(f"Unexpected matrix version: {matrix['version']}")
          domains = {domain['id']: domain for domain in matrix['domains']}
          order = domains['ORD-001']
          order['nextActions'] = [
            'Keep ORD-B04 handed to SCHED-001; B04D is applied and verified on staging, and closure remains blocked on a separately authorized B04C retry.',
            'Retry the authenticated ORD/SCHED composition canary separately and require confirmation, reschedule, cancellation, rollback and zero-residue evidence.',
            'Keep generic scheduled transitions and direct schedule projection writes prohibited.',
            'Keep deployment, production and merge blocked pending independent release authorization.'
          ]
          path.write_text(json.dumps(matrix, indent=2) + '\n')
          PY

      - name: Regenerate deterministic matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Validate final matrix state
        run: |
          set -euo pipefail
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish final matrix state
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add config/domain-completion-matrix.json
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "Matrix already reconciled."
            exit 0
          fi
          git commit -m "docs(sched): preserve final ORD action queue after B04D"
          git push origin HEAD:ord/ord-001-baseline-audit
