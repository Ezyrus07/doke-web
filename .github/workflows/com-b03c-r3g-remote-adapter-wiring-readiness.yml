name: COM-B03C-R3G Remote Adapter Wiring Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - backend/modules/communities/community-realtime-private-auth-r3g.js
      - config/com-b03c-r3g-remote-adapter-wiring-readiness.json
      - scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js
      - scripts/verify-com-b03c-r3g-remote-adapter-readiness.js
      - scripts/test-com-b03c-r3g-remote-adapter-wiring-readiness.js
      - docs/validation/COM-B03C-R3G-REMOTE-ADAPTER-WIRING-READINESS.json
      - .github/workflows/com-b03c-r3g-remote-adapter-wiring-readiness.yml
      - docs/validation/COM-B03C-R3F-CASE-TIME-POLICY-SNAPSHOT-DIAGNOSTIC-READINESS.json

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3g.js
          node --check scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js
          node --check scripts/verify-com-b03c-r3g-remote-adapter-readiness.js
          node --check scripts/test-com-b03c-r3g-remote-adapter-wiring-readiness.js
      - name: COM-B03C-R3G repository remote adapter wiring readiness
        run: node scripts/test-com-b03c-r3g-remote-adapter-wiring-readiness.js
      - name: Repository-only remote adapter self-test
        shell: bash
        run: |
          mkdir -p reports/generated
          node scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js --repository-self-test > reports/generated/COM-B03C-R3G-REMOTE-ADAPTER-REPOSITORY-SELF-TEST.json
          node scripts/verify-com-b03c-r3g-remote-adapter-readiness.js reports/generated/COM-B03C-R3G-REMOTE-ADAPTER-REPOSITORY-SELF-TEST.json
      - name: Pre-authorization credential and dependency hard-block
        shell: bash
        run: |
          set +e
          output="$(node scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js 2>&1)"
          code=$?
          set -e
          test "$code" -ne 0
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R3G_REMOTE_AUTHORIZATION_BOUNDARY_REQUIRED'
      - name: Repository safety guards
        shell: bash
        run: |
          test ! -e config/com-b03c-r3g-case-time-policy-snapshot-staging-trigger.json
          ! grep -q 'secrets\.' .github/workflows/com-b03c-r3g-remote-adapter-wiring-readiness.yml
          ! grep -Eq '^\s*environment:\s*doke-staging' .github/workflows/com-b03c-r3g-remote-adapter-wiring-readiness.yml
          grep -q '"authorizationPhraseDefined": false' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
          grep -q '"remoteExecutionJobCreated": false' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
      - name: Domain completion matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Agent governance audit
        run: npm run audit:agent-governance
      - name: Governance invariants
        run: |
          grep -q '"matrixVersion": "1.3.113"' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
          grep -q '"maturity": 3' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
          grep -q '"productionGate": "blocked"' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
          grep -q '"stagingReadAuthority": false' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
          grep -q '"stagingMutationAuthority": false' config/com-b03c-r3g-remote-adapter-wiring-readiness.json
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
