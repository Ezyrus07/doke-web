name: Synchronize ORD-A04 Matrix

on:
  pull_request:
    paths:
      - .github/workflows/ord-a04-matrix-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate matrix artifacts
        run: |
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
      - name: Remove synchronizer and commit
        run: |
          git rm .github/workflows/ord-a04-matrix-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize ORD-A04 matrix evidence"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
