name: COM-B03C R5H Cleanup Verifier Binding Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=8c1d16c1de70a0a2e72d8341dbfced845c96aeea
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-cleanup-verifier.js)" = "839c074277545de69a45872c4728b627e79d9a06"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-boundary.json)" = "d2ea343424637fc438a4384dae3ec835ee974ab4"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-boundary.yml)" = "557efe14ce3559cb4f7117ec71a037383b2c5730"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.json)" = "b76b4ecb846a71d01708bb686d3f9b9d340368b0"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-descriptor-boundary.yml)" = "95bc1da2932cd106afae02f8c59df4ba8d95ff9e"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.json)" = "11ca808f80e3cae310b966b39e20d86e1dba113b"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-sanitized-evidence-recorder.js)" = "11c61cd8666a7929819dc02ea3d367ff4834c85d"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-harness-specification.json)" = "8611bc7cffd54d813248988b3b4fcf9bd894384c"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js)" = "723d33aea011a28766b819fa823aad82f341aba3"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed cleanup-verifier binding assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-cleanup-verifier.js)" = "839c074277545de69a45872c4728b627e79d9a06"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-boundary.json)" = "d2ea343424637fc438a4384dae3ec835ee974ab4"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-boundary.yml)" = "557efe14ce3559cb4f7117ec71a037383b2c5730"
          node - <<'NODE'
          const b=require('./config/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-boundary.json');
          const v=require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-cleanup-verifier.js');
          const fields=['caseId','predicate','expectedClassification','joinSubscribed','terminalStatusClassification','extensionValueClassification','cleanupCompleted','zeroResidue','rawErrorCaptured'];
          if(b.contractId!=='com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-boundary-v1')throw new Error('BOUNDARY_CONTRACT_DRIFT');
          if(b.repositoryContext.parentCertifiedCleanupVerifierDescriptorHead!=='1604601426d776f99ce15da0d71f58da7ad5baf1')throw new Error('PARENT_DRIFT');
          if(b.repositoryContext.cleanupVerifierModuleBlob!=='839c074277545de69a45872c4728b627e79d9a06')throw new Error('VERIFIER_BLOB_DRIFT');
          if(v.CONTRACT_ID!=='com-b03c-r5h-extension-classification-probe-cleanup-verifier-repository-implementation-v1'||v.EVIDENCE_FIELDS.join('|')!==fields.join('|'))throw new Error('VERIFIER_CONTRACT_DRIFT');
          const bind=b.cleanupVerifierBinding;
          if(bind.cleanupVerifierBindingDescriptorDefined!==true||bind.cleanupVerifierImplementationPresent!==true||bind.cleanupVerifierBindingDefined!==true||bind.cleanupVerifierBound!==true||bind.bindingKind!=='repository_owned_immutable_inert_module'||bind.localRepositoryBindingOnly!==true)throw new Error('BINDING_STATE_DRIFT');
          if(bind.verifierModuleBlob!=='839c074277545de69a45872c4728b627e79d9a06'||bind.verifierModulePath!=='backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-cleanup-verifier.js')throw new Error('BINDING_IDENTITY_DRIFT');
          for(const k of ['evidenceMutationImplemented','evidencePersistenceImplemented','verificationResultPersistenceImplemented','transportBound','remoteClientInstantiationImplemented','remoteDependencyLoadImplemented'])if(bind[k]!==false)throw new Error(`BINDING_CAPABILITY:${k}`);
          for(const k of ['cleanupVerifier','evidenceSink','verificationSink','evidencePersistenceTarget','verificationResultPersistenceTarget','networkEndpoint','executionEntrypoint','executionCommand','executionWorkflow'])if(bind[k]!==null)throw new Error(`RUNTIME_VALUE_FORBIDDEN:${k}`);
          if(b.remainingDependentPortState.length!==0||b.bindingCompleteness.allDependentPortsBound!==true||b.bindingCompleteness.transportBound!==false||b.bindingCompleteness.executionReady!==false)throw new Error('COMPLETENESS_DRIFT');
          const input=Object.freeze({caseId:'extension_is_null',predicate:'extension IS NULL',expectedClassification:'extension_unavailable_or_null',joinSubscribed:false,terminalStatusClassification:'channel_error',extensionValueClassification:'extension_unavailable_or_null',cleanupCompleted:true,zeroResidue:true,rawErrorCaptured:false});
          const before=JSON.stringify(input); const good=v.verifySanitizedEvidenceRecord(input);
          if(JSON.stringify(input)!==before||good.decision!=='cleanup_verification_passed_repository_only_ephemeral')throw new Error('VERIFIER_ACCEPTANCE_DRIFT');
          if(v.verifySanitizedEvidenceRecord({...input,rawRemoteError:'forbidden'}).decision!=='blocked_repository_only')throw new Error('RAW_MATERIAL_NOT_BLOCKED');
          let hard=false; try{v.assertVerificationPersistenceDisabled()}catch(e){hard=e&&e.code==='DOKE_COM_B03C_R5H_CLEANUP_VERIFIER_PERSISTENCE_DISABLED'} if(!hard)throw new Error('PERSISTENCE_NOT_BLOCKED');
          const g=b.governance;
          for(const k of ['evidenceMutationImplemented','evidencePersistenceImplemented','verificationResultPersistenceImplemented','transportBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'])if(g[k]!==false)throw new Error(`GOVERNANCE_DRIFT:${k}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-cleanup-verifier-binding-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for cleanup verifier binding" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
