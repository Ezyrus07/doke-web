name: COM-B03C R5H Extension Classification Probe Harness Implementation Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.json'
      - 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.json'
      - 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b03c-r5h-extension-classification-harness-implementation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified harness specification lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-harness-specification.json)" = "8611bc7cffd54d813248988b3b4fcf9bd894384c"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-execution-boundary.json)" = "91bd2165cd2023ee6d873f3c6ccd0c696d3c7723"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js)" = "723d33aea011a28766b819fa823aad82f341aba3"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.json)" = "b046c20c7ec572bf38af1780b64a703fe4ce4880"

      - name: Exact repository-only push scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          boundary=config/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.json
          module=backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js
          workflow=.github/workflows/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.yml
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-harness-implementation-matrix-materialization-temp.yml
          installation_scope="$(printf '%s\n' "$boundary" "$module" "$workflow" | sort)"
          maintenance_scope="$workflow"
          materialization_scope="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          if [ "$actual" = "$installation_scope" ]; then
            test "$(git rev-parse HEAD^)" = "a74072bc5e7c7063aeb7b667b8ddc7130b06d939"
          elif [ "$actual" != "$maintenance_scope" ] && [ "$actual" != "$materialization_scope" ]; then
            printf 'Unexpected repository-only push scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Syntax and transport-unbound static boundary
        shell: bash
        run: |
          set -euo pipefail
          module=backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js
          node --check "$module"
          ! grep -Eq 'process\.env|createClient|@supabase|\.channel\(|\.subscribe\(|fetch\(|https?://' "$module"

      - name: Certify transport-unbound harness implementation repository-only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const boundary = require('./config/com-b03c-r5h-extension-classification-probe-harness-implementation-boundary.json');
          const spec = require('./config/com-b03c-r5h-extension-classification-probe-harness-specification.json');
          const harness = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js');

          if (boundary.contractId !== 'com-b03c-r5h-extension-classification-probe-harness-implementation-boundary-v1') throw new Error('IMPLEMENTATION_BOUNDARY_CONTRACT_DRIFT');
          if (boundary.repositoryContext.parentCertifiedSpecificationHead !== 'a74072bc5e7c7063aeb7b667b8ddc7130b06d939') throw new Error('PARENT_SPEC_HEAD_DRIFT');
          if (boundary.repositoryContext.parentCertifiedSpecificationTree !== 'f5773b34b42d357e2cafe2b53dbd6aa8e54afa42') throw new Error('PARENT_SPEC_TREE_DRIFT');
          if (boundary.repositoryContext.parentSpecificationCertificationRun !== 31921526984 || boundary.repositoryContext.parentSpecificationCertificationJob !== 95102019697) throw new Error('PARENT_SPEC_CERTIFICATION_DRIFT');
          if (boundary.repositoryContext.parentSpecificationBlob !== '8611bc7cffd54d813248988b3b4fcf9bd894384c') throw new Error('PARENT_SPEC_BLOB_DRIFT');
          if (boundary.repositoryContext.matrixVersion !== '1.3.113' || boundary.repositoryContext.maturity !== 3 || boundary.repositoryContext.productionGate !== 'blocked') throw new Error('MATRIX_STATE_DRIFT');
          if (boundary.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || boundary.functionalCheckpoint.r5iCreated !== false || boundary.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          if (spec.contractId !== 'com-b03c-r5h-extension-classification-probe-harness-specification-v1') throw new Error('PARENT_SPEC_CONTRACT_DRIFT');
          if (spec.governance.executionHarnessSpecificationDefined !== true || spec.governance.executionHarnessDefined !== false || spec.governance.executableHarnessPresent !== false) throw new Error('PARENT_SPEC_STATE_DRIFT');

          const impl = boundary.implementationBoundary;
          if (impl.repositoryOnlyImplementation !== true || impl.implementationPresent !== true || impl.executionHarnessSpecificationDefined !== true || impl.executionHarnessDefined !== true || impl.executableHarnessPresent !== true) throw new Error('IMPLEMENTATION_STATE_INVALID');
          if (impl.transportBound !== false || impl.modulePathSpecified !== true || impl.moduleBlob !== '723d33aea011a28766b819fa823aad82f341aba3') throw new Error('IMPLEMENTATION_MODULE_BINDING_DRIFT');
          for (const key of ['executionEntryPointExported','executionCommandSpecified','workflowExecutionJobSpecified','runtimeAdapterBound','concreteTargetResourceSpecified','credentialMaterialSpecified','syntheticIdentityMaterialSpecified','networkEndpointSpecified','processEnvironmentReadPresent','remoteClientImportPresent','networkCallPresent','realtimeSubscriptionCallPresent','authIdentityLifecycleCallPresent','runtimeMutationCallPresent']) {
            if (impl[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          if (impl.repositorySelfTestMayExercisePureFunctionsOnly !== true) throw new Error('PURE_SELF_TEST_CONTRACT_REQUIRED');

          const expectedCases = [
            ['extension_is_null', 'extension IS NULL', 'extension_unavailable_or_null'],
            ['extension_equals_presence', "extension = 'presence'", 'extension_expected_presence_value'],
            ['extension_non_null_not_presence', "extension IS NOT NULL AND extension <> 'presence'", 'extension_unexpected_non_null_value']
          ];
          const actualCases = boundary.implementedPureSurface.cases.map(({id,predicate,expectedClassification}) => [id,predicate,expectedClassification]);
          if (JSON.stringify(actualCases) !== JSON.stringify(expectedCases)) throw new Error('IMPLEMENTED_CASES_DRIFT');
          for (const key of ['observationPlannerImplemented','extensionClassifierImplemented','sanitizedObservationValidatorImplemented','crossCaseComparatorImplemented','executionDisabledAssertionImplemented']) {
            if (boundary.implementedPureSurface[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          for (const key of ['exactlyOneObservationPerCase','sameSyntheticIdentityEnvelopeAcrossCases','sameUniqueTopicEnvelopeAcrossCases','freshRealtimeClientPerObservation','privatePresenceOnlyChannel','singleSyntheticIdentity','identityCleanupRequired','zeroResidueRequired','sanitizedEvidenceOnly','rawRemoteErrorCaptureForbidden','terminalStatusAloneCannotProveCause','crossCaseComparisonRequiredForCausalConclusion']) {
            if (boundary.implementedPureSurface.observationProtocol[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          for (const key of ['exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed']) {
            if (boundary.implementedPureSurface.causalState[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }

          const wiring = boundary.executionWiringBoundary;
          for (const key of ['defined','runtimeAdapterBound','targetEnvironmentBound','targetResourceBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','executionEntrypointEnabled','executionWorkflowDefined','authorizationEvaluatorDefined','executionAuthorizationReceiptPathDefined','triggerPathDefined']) {
            if (wiring[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }

          for (const key of ['implementationMustBeRepositoryCertifiedBeforeExecutionWiring','executionWiringMustBeSeparateRepositoryBoundary','futureAuthorizationMustBeFresh','futureAuthorizationMustBeExplicit','futureAuthorizationMustBeSingleUse','futureAuthorizationMustBindExactCertifiedHarnessHead','futureAuthorizationMustBindExactStagingResource','futureReceiptMustBeSeparateSingleFileCommit','receiptParentMustEqualAuthorizedHarnessHead','runAttemptOneRequired','priorR5dAuthorizationReuseForbidden','priorR5dReceiptReuseForbidden','priorR5dTriggerReuseForbidden']) {
            if (boundary.authorizationModel[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          if (boundary.authorizationModel.genericContinuationGrantsRemoteAuthority !== false) throw new Error('GENERIC_CONTINUATION_MUST_NOT_AUTHORIZE_REMOTE');

          const gov = boundary.governance;
          if (gov.repositoryOnlyDefinition !== true || gov.executionBoundaryDefined !== true || gov.executionHarnessSpecificationDefined !== true || gov.executionHarnessDefined !== true || gov.executableHarnessPresent !== true || gov.transportBound !== false || gov.executionEntryPointExported !== false || gov.executionWiringDefined !== false) throw new Error('GOVERNANCE_IMPLEMENTATION_STATE_INVALID');
          for (const key of ['triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (gov[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }

          if (harness.CONTRACT_ID !== 'com-b03c-r5h-extension-classification-probe-harness-implementation-v1') throw new Error('HARNESS_MODULE_CONTRACT_DRIFT');
          if (harness.SPEC_BLOB !== '8611bc7cffd54d813248988b3b4fcf9bd894384c' || harness.SPEC_CERTIFIED_HEAD !== 'a74072bc5e7c7063aeb7b667b8ddc7130b06d939') throw new Error('HARNESS_SPEC_BINDING_DRIFT');
          for (const forbiddenExport of ['execute','run','subscribe','createClient','bindRuntime','authorize']) {
            if (Object.prototype.hasOwnProperty.call(harness, forbiddenExport)) throw new Error(`REMOTE_ENTRYPOINT_EXPORT_FORBIDDEN:${forbiddenExport}`);
          }
          const descriptor = harness.repositoryDescriptor();
          if (descriptor.executionEntryPointExported !== false || descriptor.transportBound !== false || descriptor.executionAttempted !== false || descriptor.networkAuthority !== false || descriptor.stagingReadAuthority !== false || descriptor.stagingMutationAuthority !== false || descriptor.realtimeSubscriptionAuthority !== false) throw new Error('HARNESS_DESCRIPTOR_REMOTE_SCOPE_FORBIDDEN');
          if (harness.classifyExtensionValue(null) !== 'extension_unavailable_or_null') throw new Error('NULL_CLASSIFIER_DRIFT');
          if (harness.classifyExtensionValue('presence') !== 'extension_expected_presence_value') throw new Error('PRESENCE_CLASSIFIER_DRIFT');
          if (harness.classifyExtensionValue('broadcast') !== 'extension_unexpected_non_null_value') throw new Error('NON_PRESENCE_CLASSIFIER_DRIFT');
          const plan = harness.buildObservationPlan({identityEnvelopeId:'identity_envelope_1',topicEnvelopeId:'topic_envelope_001'});
          if (plan.length !== 3 || new Set(plan.map((item) => item.identityEnvelopeId)).size !== 1 || new Set(plan.map((item) => item.topicEnvelopeId)).size !== 1) throw new Error('PURE_OBSERVATION_PLAN_DRIFT');
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
