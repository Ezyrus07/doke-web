name: 0000 TEMP COM-B02CE Matrix Derivatives Promote

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02ce-matrix-derivatives-promote.yml'

permissions:
  contents: write

jobs:
  promote-exact-matrix-derivatives:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 5bc0713c1a1f9ce4443ed5c80640b108c0e65c51
      EXPECTED_PARENT_TREE: b08e4f395b13a3878c55d588a589c0a865e70941
      HELPER_PATH: .github/workflows/0000-temp-com-b02ce-matrix-derivatives-promote.yml
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_MD_BLOB: 385eb41e7f07a7e9b6ef1fbce07d7e2d1537bc50
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      MATRIX_REPORT_BLOB: d802aa7ed6a37c883a7c1222e4794cbc807385bb
      EXECUTION_RUN_ID: '32721876143'
      EXECUTION_JOB_ID: '97414818662'
      EXPORT_RUN_ID: '32722102773'
      EXPORT_JOB_ID: '97415506654'
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      EXECUTION_TARGET_BLOB: c1fe633bfbe4db36099c98180d1c630fedd6c616
      EXECUTOR: .github/workflows/0000-temp-com-b02ce-authorized-single-use-register-execution.yml
      EXECUTOR_BLOB: c5cfb391a1793243d524da7988d8e279059437c9
      EXPORTER: .github/workflows/0000-temp-com-b02ce-matrix-derivatives-export.yml
      EXPORTER_BLOB: ae42cbbb48fac4f62b806a78bc0092553821e6b1

    steps:
      - name: Checkout exact promotion head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze consumed execution and exact promotion scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_PARENT_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          actual="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$actual" = "$HELPER_PATH"
          test "$EXECUTION_RUN_ID" = '32721876143'
          test "$EXECUTION_JOB_ID" = '97414818662'
          test "$EXPORT_RUN_ID" = '32722102773'
          test "$EXPORT_JOB_ID" = '97415506654'
          test "$(git rev-parse HEAD:$TARGET)" = "$EXECUTION_TARGET_BLOB"
          test "$(git rev-parse HEAD:$EXECUTOR)" = "$EXECUTOR_BLOB"
          test "$(git rev-parse HEAD:$EXPORTER)" = "$EXPORTER_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate and verify exact exported Matrix bytes
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- "$MATRIX_SOURCE"
          test "$(git hash-object "$MATRIX_MD")" = "$MATRIX_MD_BLOB"
          test "$(git hash-object "$MATRIX_REPORT")" = "$MATRIX_REPORT_BLOB"
          expected="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Commit exact derivatives and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/com/com-001-baseline-audit)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MATRIX_MD"
          git add -f "$MATRIX_REPORT"
          git rm "$HELPER_PATH"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "$HELPER_PATH" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          test "$staged" = "$expected"
          git commit -m 'fix(com): materialize B02CE Matrix derivatives'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT" || test "$(git rev-parse HEAD^^)" = "$EXPECTED_PARENT"
          git push origin "HEAD:refs/heads/com/com-001-baseline-audit"
