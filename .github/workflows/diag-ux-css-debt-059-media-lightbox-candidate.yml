name: Doke UX-CSS-DEBT-059 Media Lightbox Candidate

on:
  push:
    branches:
      - diag/ux-css-debt-059-media-lightbox-candidate

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 025ee39a521d8297dd68db58749b2f46a42bcdbe
      PARENT_SHA: d6daeaa876111dbfa3ed27cc5307936084292962
      TARGET_FILE: assets/css/components/media-lightbox.css
      TARGET_BLOB: c33b7b81f4e548f3206f889633f946c4daa5e5ec
      EXPECTED_SHA256: 1fa9362a0562af0523f258a3c05f7bd1e52bac8964889b8c2512a957a5f399d1
      EXPECTED_BYTES: 14301
      R2_RUN: 31982937022
      R2_JOB: 95252841151
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-058 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo "INPUT GUARD PASS|sha=$TARGET_SHA|targetBlob=$TARGET_BLOB|r2=$R2_RUN/$R2_JOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install and generate parent responsive baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          echo 'PARENT BASELINE PASS|active=401|high=37|responsiveBaseline=1'

      - name: Build exact certified candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file=process.env.TARGET_FILE;
          const src=fs.readFileSync(file,'utf8');
          const stripComments=s=>s.replace(/\/\*[\s\S]*?\*\//g,m=>m.replace(/[^\n]/g,' '));
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){
            const lines=stripComments(src).split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;
            for(let i=0;i<lines.length;i++){
              const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;
              if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}
              if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context});}}
              depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}
            }
            const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d);}return{declarations:ds,dead};
          }
          const p=parse(src);if(p.declarations.length!==359||p.dead.length!==79)throw new Error(`parent drift ${p.declarations.length}/${p.dead.length}`);
          const families=new Set(p.dead.map(x=>x.selector));if(families.size!==12)throw new Error(`families ${families.size}`);
          const contexts=[...new Set(p.dead.map(x=>x.context))];if(contexts.length!==1||contexts[0]!=='@media (max-width: 760px)')throw new Error(`context ${contexts}`);
          const identical=p.dead.filter(x=>x.value===x.winner.value&&x.important===x.winner.important).length;if(identical!==45)throw new Error(`identical ${identical}`);
          if(p.dead.some(x=>x.important||x.winner.important))throw new Error('unexpected important');
          if(p.dead.some(x=>!x.selector.includes('body[data-page="detalhe-anuncio"]')))throw new Error('scope escape');
          const remove=new Set(p.dead.map(x=>x.line));const candidate=src.split(/\r?\n/).filter((_,i)=>!remove.has(i+1)).join('\n');fs.writeFileSync(file,candidate);
          const q=parse(candidate);if(q.declarations.length!==280||q.dead.length!==0)throw new Error(`candidate drift ${q.declarations.length}/${q.dead.length}`);
          console.log('DETERMINISTIC CANDIDATE PASS|parent=359/79|candidate=280/0|families=12|identical=45|changed=34|context=max760|commentNormalized=1');
          NODE
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t79\t'"$TARGET_FILE"
          git diff --check
          echo "CANDIDATE IDENTITY PASS|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|files=1|additions=0|deletions=79"

      - name: Responsive contract on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-responsive-contract.js | tee /tmp/ux059-responsive.log
          grep -q 'Checks: 893' /tmp/ux059-responsive.log
          grep -q 'Failures: 0' /tmp/ux059-responsive.log
          grep -q 'Skips: 277' /tmp/ux059-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and residual proof
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/ux059-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/ux059-conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/ux059-dup.log
          grep -q 'Duplicate groups: 0' /tmp/ux059-dup.log
          grep -q 'Duplicated files: 0' /tmp/ux059-dup.log
          npm run audit:domain-completion-matrix | tee /tmp/ux059-domain.log
          grep -q 'Domains: 23' /tmp/ux059-domain.log
          grep -q 'Critical flows: 15' /tmp/ux059-domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/ux059-domain.log
          grep -q 'Critical blockers: 12' /tmp/ux059-domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}
          const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});
          function deadCount(src){const clean=src.replace(/\/\*[\s\S]*?\*\//g,m=>m.replace(/[^\n]/g,' ')),lines=clean.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0;for(const f of active){const p=deadCount(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++}}
          const target=deadCount(meta.get(process.env.TARGET_FILE).text),p058=deadCount(meta.get('assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css').text),p057=deadCount(meta.get('assets/css/components/chat-composer.css').text),p056=deadCount(meta.get('assets/css/components/before-after-workers-preview/mobile-comment-sheets.css').text),p055=deadCount(meta.get('assets/css/patterns/settings-shell.css').text),p054=deadCount(meta.get('assets/css/components/before-after-workers-preview/publication-light-modal.css').text);
          if(files!==15||total!==282||highDead!==0)throw new Error(`residual ${files}/${total}/${highDead}`);if(target.decl!==280||target.dead!==0)throw new Error(`target ${target.decl}/${target.dead}`);if(p058.decl!==216||p058.dead||p057.decl!==125||p057.dead||p056.decl!==302||p056.dead||p055.decl!==104||p055.dead||p054.decl!==75||p054.dead)throw new Error('prior guard drift');
          console.log('RESIDUAL PASS|active=401|high=37|files=15|dead=282|highDead=0|target=280/0|058=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t79\t'"$TARGET_FILE"
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json >/tmp/ux059-audit.json
          code=$?
          set -e
          node <<'NODE'
          const a=require('/tmp/ux059-audit.json');const v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);
          NODE
          echo "npmAuditExit=$code"

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE RESTORE PASS|sha=$TARGET_SHA|productMutation=0|permanentBranchMutation=0"
