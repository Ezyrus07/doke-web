          fs.writeFileSync(paths.workflow, workflow);

          const matrix = JSON.parse(fs.readFileSync(paths.matrix, 'utf8'));
          const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
          if (!sched) throw new Error('SCHED-001 domain missing from matrix.');
          const removed = new Set([paths.loginPreparer, paths.bootstrapPreparer]);
