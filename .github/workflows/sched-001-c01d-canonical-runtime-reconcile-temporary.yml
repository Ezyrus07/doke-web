console.log('SCHED-C01D canonical browser bootstrap tests passed.');
`;
          fs.writeFileSync(paths.bootstrapTest, bootstrapTest, { mode: 0o755 });

          fs.rmSync(paths.loginPreparer, { force: true });
          fs.rmSync(paths.bootstrapPreparer, { force: true });

          const config = JSON.parse(fs.readFileSync(paths.config, 'utf8'));
          Object.assign(config.runtimeGate, {
            canonicalExecutorRequired: true,
            runtimeSourceRewritingForbidden: true,
            bootstrapWatchdogsRequired: true,
            initializerPromiseMustBeAwaited: true,
            remoteHydrationTerminalStateRequired: true
          });
          config.canonicalRuntime = {
            executorOwnsLoginSynchronization: true,
            executorOwnsSupabaseDeferFulfillment: true,
            executorOwnsBootstrapDiagnostics: true,
            executorOwnsPhaseTimeouts: true,
            executorOwnsBoundedCleanup: true,
            runnerMayOnlySuperviseProcessWatchdog: true,
            legacyRuntimePreparersRemoved: true
          };
          fs.writeFileSync(paths.config, JSON.stringify(config, null, 2) + '\n');
          fs.writeFileSync(paths.evidence, JSON.stringify(config, null, 2) + '\n');

          let docs = fs.readFileSync(paths.docs, 'utf8');
          const canonicalSection = `\n## Canonical runtime consolidation\n\nThe authenticated browser executor now owns login synchronization, local fulfillment of the pinned Supabase defer script, DOM and dependency watchdogs, awaited order initialization, terminal remote hydration validation, phase timeouts, sanitized checkpoints and bounded cleanup. The runner is limited to the outer process watchdog. Runtime source rewriting and the two legacy preparer scripts were removed.\n\nThis consolidation is repository-only. It performs no browser execution, credential resolution, staging read, staging mutation, migration, deployment, production access or merge. SCHED-C01D remains blocked until a fresh exact authorization is supplied together with the independently authorized SCHED-C01E lifecycle.\n`;
          if (!docs.includes('## Canonical runtime consolidation')) docs += canonicalSection;
          fs.writeFileSync(paths.docs, docs);

          let audit = fs.readFileSync(paths.audit, 'utf8');
          audit = replaceOnce(
            audit,
            `  matrix: 'config/domain-completion-matrix.json'\n});`,
            `  matrix: 'config/domain-completion-matrix.json',\n  executor: 'scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js',\n  runner: 'scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js',\n  runnerTest: 'scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js',\n  bootstrapTest: 'scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js'\n});`,
            'C01D audit PATHS extension'
          );
          audit = replaceOnce(
