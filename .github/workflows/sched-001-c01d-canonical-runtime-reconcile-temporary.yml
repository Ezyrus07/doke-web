            `const matrix = JSON.parse(fs.readFileSync(PATHS.matrix, 'utf8'));`,
            `const matrix = JSON.parse(fs.readFileSync(PATHS.matrix, 'utf8'));\nconst executor = fs.readFileSync(PATHS.executor, 'utf8');\nconst runner = fs.readFileSync(PATHS.runner, 'utf8');\nconst runnerTest = fs.readFileSync(PATHS.runnerTest, 'utf8');\nconst bootstrapTest = fs.readFileSync(PATHS.bootstrapTest, 'utf8');`,
            'C01D audit source reads'
          );
          audit = replaceOnce(
