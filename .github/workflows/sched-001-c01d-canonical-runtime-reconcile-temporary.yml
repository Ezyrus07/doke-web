          const evidenceLine = 'SCHED-C01D canonicalized the authenticated browser runtime: login synchronization, Supabase defer fulfillment, bootstrap watchdogs, awaited initialization, terminal hydration checks, phase timeouts and bounded cleanup now live in the canonical executor; runtime source rewriting and both preparer scripts were removed without staging access.';
          if (!sched.evidence.includes(evidenceLine)) sched.evidence.push(evidenceLine);
          const versionParts = String(matrix.version).split('.').map(Number);
          if (versionParts.length !== 3 || versionParts.some(Number.isNaN)) throw new Error('Invalid matrix version.');
          versionParts[2] += 1;
          matrix.version = versionParts.join('.');
          matrix.updatedAt = '2026-08-02T14:50:00-03:00';
