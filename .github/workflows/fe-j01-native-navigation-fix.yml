name: FE-J01 Native Navigation Fix

on:
  pull_request:
    paths:
      - ".github/workflows/fe-j01-native-navigation-fix.yml"
      - "assets/js/dev/fe-j01-native-navigation-fix-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deferred document navigation contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle_path = Path('assets/js/core/navigation-lifecycle.js')
          lifecycle = lifecycle_path.read_text()
          old = """    routeCommit(id, { adapter: 'document' });
              if (options.replace === true) window.location.replace(url.href);
              else window.location.assign(url.href);
              return Promise.resolve(true);
            }"""
          new = """    routeCommit(id, { adapter: 'document' });
              return new Promise(function (resolve) {
                resolve(true);
                window.setTimeout(function () {
                  if (options.replace === true) window.location.replace(url.href);
                  else window.location.assign(url.href);
                }, 0);
              });
            }"""
          if old not in lifecycle:
              raise SystemExit('documentNavigate contract not found')
          lifecycle_path.write_text(lifecycle.replace(old, new, 1))

          test_path = Path('scripts/test-navigation-lifecycle-core-contract.js')
          test = test_path.read_text()
          anchor = """  assert.strictEqual(storage.has('doke.internalRouteNavigation'), false, 'legacy internal marker must be cleared after successful settlement');
            assert.strictEqual(storage.has('doke.navigationIntent'), false, 'structured intent must be cleared after successful settlement');


            await api.navigation.back('https://doke.test/index.html', { source: 'test-back' });"""
          replacement = """  assert.strictEqual(storage.has('doke.internalRouteNavigation'), false, 'legacy internal marker must be cleared after successful settlement');
            assert.strictEqual(storage.has('doke.navigationIntent'), false, 'structured intent must be cleared after successful settlement');

            const documentNavigation = api.navigation.go('https://doke.test/pagamento-profissional.html', {
              source: 'test-document-navigation',
              forceDocument: true
            });
            assert.strictEqual(assigned.length, 0, 'document navigation must not destroy the caller context synchronously');
            await documentNavigation;
            assert.strictEqual(assigned.length, 0, 'document navigation must settle before the hard navigation task');
            await new Promise((resolve) => setTimeout(resolve, 0));
            assert.deepStrictEqual(assigned.at(-1), {
              method: 'assign',
              value: 'https://doke.test/pagamento-profissional.html'
            });

            await api.navigation.back('https://doke.test/index.html', { source: 'test-back' });"""
          if anchor not in test:
              raise SystemExit('navigation lifecycle test anchor not found')
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY

      - name: Validate focused contracts
        run: |
          node --check assets/js/core/navigation-lifecycle.js
          node scripts/test-navigation-lifecycle-core-contract.js
          node scripts/audit-navigation-registry-ownership.js

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/core/navigation-lifecycle.js scripts/test-navigation-lifecycle-core-contract.js
          if git diff --cached --quiet; then
            echo "No focused changes to commit."
            exit 0
          fi
          git commit -m "FE-J01: defer native document navigation"
          git push origin HEAD:${GITHUB_HEAD_REF}
