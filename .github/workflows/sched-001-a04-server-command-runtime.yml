name: Doke SCHED-A04 Server Scheduling Command Runtime

on:
  push:
    branches:
      - ord/ord-001-baseline-audit
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'backend/modules/scheduling/**'
      - 'supabase/migrations/20260731151000_sched_a04_dst_local_projection_compatibility.sql'
      - 'config/sched-001-a04-server-command-runtime.json'
      - 'docs/SCHED-001-A04-SERVER-COMMAND-RUNTIME.md'
      - 'docs/validation/SCHED-001-A04-SERVER-COMMAND-RUNTIME.json'
      - 'scripts/audit-sched-001-a04-server-command-runtime.js'
      - 'scripts/test-sched-001-a04-scheduling-service-runtime.js'
      - '.github/workflows/sched-001-a04-server-command-runtime.yml'
      - 'config/domain-completion-matrix.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit SCHED-A04 server command runtime
        run: node scripts/audit-sched-001-a04-server-command-runtime.js
      - name: Test deterministic SCHED-A04 runtime
        run: node scripts/test-sched-001-a04-scheduling-service-runtime.js
      - name: Preserve SCHED-A03 migration contract
        run: |
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/test-sched-001-a03-reservation-migration-static.js
      - name: Preserve SCHED-A02 frozen semantics
        run: |
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/test-sched-001-a02-contract-runtime.js
      - name: Preserve SCHED-A01 staging baseline
        run: node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
      - name: Preserve ORD-A11 scheduling handoff
        run: node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
      - name: Audit completion matrix
        run: node scripts/audit-domain-completion-matrix.js
