name: COM-B03C-R4K R4J Lineage Reconciliation Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4k.js'
      - 'scripts/test-com-b03c-r4k-r4j-lineage-reconciliation-readiness.js'
      - 'config/com-b03c-r4k-r4j-lineage-reconciliation-readiness.json'
      - 'docs/validation/COM-B03C-R4K-R4J-LINEAGE-RECONCILIATION-READINESS.json'
      - '.github/workflows/com-b03c-r4k-r4j-lineage-reconciliation-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4k.js
          node --check scripts/test-com-b03c-r4k-r4j-lineage-reconciliation-readiness.js
      - name: R4K repository lineage reconciliation readiness
        run: node scripts/test-com-b03c-r4k-r4j-lineage-reconciliation-readiness.js
      - name: Historical R4J and R4I authorization lineage unchanged in R4K delta
        shell: bash
        run: |
          R4J_HEAD=66e8b1fefdbf7fa70be3093bdcad50880a5cdf70
          test -z "$(git diff --name-only "$R4J_HEAD" "${{ github.event.pull_request.head.sha }}" -- \
            backend/modules/communities/community-realtime-private-auth-r4j.js \
            scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js \
            config/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.json \
            docs/validation/COM-B03C-R4J-HOSTED-TERMINAL-STATUS-OBSERVATION-EXECUTION-ENVELOPE-READINESS.json \
            .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml \
            backend/modules/communities/community-realtime-private-auth-r4i.js \
            config/com-b03c-r4i-r4h-terminal-observation-authorization-consumption.json \
            docs/validation/COM-B03C-R4I-R4H-TERMINAL-OBSERVATION-AUTHORIZATION-CONSUMPTION.json)"
      - name: No trigger hosted workflow or remote authority surface
        shell: bash
        run: |
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
          ! grep -Eq '^[[:space:]]*push:' .github/workflows/com-b03c-r4k-r4j-lineage-reconciliation-readiness.yml
          ! grep -Eq '^[[:space:]]*environment:' .github/workflows/com-b03c-r4k-r4j-lineage-reconciliation-readiness.yml
          ! grep -Eq 'secrets\.' .github/workflows/com-b03c-r4k-r4j-lineage-reconciliation-readiness.yml
          node -e 'const r=require("./backend/modules/communities/community-realtime-private-auth-r4k"); let blocked=false; try { r.assertRemoteExecutionBoundaryAbsent(); } catch (e) { blocked=e && e.code===r.REMOTE_EXECUTION_BLOCK_CODE; } if (!blocked) process.exit(1);'
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
