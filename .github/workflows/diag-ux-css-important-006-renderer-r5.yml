name: Doke UX CSS Important 006 Renderer R5
on:
  push:
    branches: [diag/ux-css-important-006-renderer-r5]
    paths: [.github/workflows/diag-ux-css-important-006-renderer-r5.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 24b49e5693f24621a1024b94c33c8ba6e18b12c0
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      TARGET_BLOB: 896730319ae0852caca8a0f93cd1507608dd9894
      DIAG_BRANCH: diag/ux-css-important-006-renderer-r5
      RESULT_FILE: .diagnostics/ux-css-important-006-renderer-r5.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/proof.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA"..HEAD)" = '.github/workflows/diag-ux-css-important-006-renderer-r5.yml'
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),f=process.env.TARGET_FILE;const parent=fs.readFileSync(f,'utf8');if((parent.match(/!important\b/g)||[]).length!==23)throw Error('parent drift');let s=parent.replace(/\s*!important\b/g,'');
          const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          function restore(selector,props){const re=new RegExp(esc(selector)+'\\s*\\{','g');const ms=[...s.matchAll(re)];if(ms.length!==1)throw Error(`selector ${selector} matches=${ms.length}`);const b=s.indexOf('{',ms[0].index),e=s.indexOf('}',b);let block=s.slice(b+1,e);for(const p of props){const pr=new RegExp(`(^|\\n)(\\s*${esc(p)}\\s*:[^;]+);`,'m');if(!pr.test(block))throw Error(`prop ${selector} ${p}`);block=block.replace(pr,'$1$2 !important;')}s=s.slice(0,b+1)+block+s.slice(e)}
          restore('body.home-index-shell .doke-search-panel__form',['position','overflow']);restore('body.home-index-shell .home-search-hero__field::before,\n  body.home-index-shell .home-search-hero__field::after',['display']);restore('body.home-index-shell .featured-services .content-rail',['overflow']);
          if((s.match(/!important\b/g)||[]).length!==4)throw Error(`candidate count ${(s.match(/!important\b/g)||[]).length}`);fs.writeFileSync('/tmp/candidate.css',s);const z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex');let stat='';try{stat=cp.execFileSync('git',['diff','--no-index','--numstat','/tmp/parent.css','/tmp/candidate.css'],{encoding:'utf8'}).trim()}catch(e){stat=String(e.stdout||'').trim()}const [a,d]=stat.split(/\s+/).map(Number);if(a!==19||d!==19)throw Error(`diff ${stat}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=23->4|files=1|additions=${a}|deletions=${d}|priorityMarkersRemoved=19|searchMarkersPreserved=3|featuredOverflowGuardPreserved=1`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,parent=fs.readFileSync('/tmp/parent.css','utf8'),candidate=fs.readFileSync('/tmp/candidate.css','utf8');const browser=await chromium.launch({headless:true});const widths=[359,379,380,381,390,430,560,561],railWidths=new Set([359,380,560]),hash=b=>crypto.createHash('sha256').update(b).digest('hex');const targets=[{s:'.featured-services',p:['display','visibility','overflow','overflow-x','overflow-y','width','max-width']},{s:'.short-videos',p:['display','visibility','overflow','overflow-x','overflow-y','width','max-width']},{s:'.featured-services .content-rail',p:['display','visibility','overflow','overflow-x','overflow-y','width','max-width','margin-left','margin-right','padding-left','padding-right']},{s:'#featured-services-track',p:['display','visibility','flex-direction','flex-wrap','grid-template-columns','grid-auto-flow','overflow-x','overflow-y','overscroll-behavior-x','scroll-snap-type','-webkit-overflow-scrolling','width','min-width','max-width','padding-left','padding-right','scroll-padding-left']},{s:'.short-videos .content-rail',p:['display','visibility','overflow','overflow-x','overflow-y','padding-left','padding-right']},{s:'#short-videos-track',p:['display','visibility','grid-template-columns','grid-auto-flow','grid-auto-columns','overflow','overflow-x','overflow-y','width','min-width','max-width']}];
          const items=Array.from({length:6},(_,i)=>({id:`diag-${i+1}`,serviceId:`diag-${i+1}`,status:'active',title:`Serviço diagnóstico ${i+1}`,category:'Reformas',providerName:`Profissional ${i+1}`,providerHandle:`profissional${i+1}`,rating:4.9,reviewsCount:20+i,price:120+i*10,city:'Salvador',state:'BA',location:'Salvador, BA',tags:['seguro','rapido']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));for(const host of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**','https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(host,r=>r.fulfill({status:200,contentType:host.includes('fonts.gstatic')?'font/woff2':host.includes('fonts.googleapis')?'text/css':'application/javascript',body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.goto(`http://127.0.0.1:4173/index.html?cssimp006r5=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(1000);await p.waitForFunction(()=>window.Doke?.homePublicServices?.render&&window.Doke?.publicServiceCard?.create,{timeout:6000});const rendered=await p.evaluate(items=>window.Doke.homePublicServices.render(items),items);if(rendered!==6)throw Error(`renderer count ${rendered}`);await p.waitForFunction(()=>document.querySelector('#featured-services-track')?.children.length===6,{timeout:3000});await p.waitForTimeout(250);
            const ready=await p.evaluate(()=>{const q=s=>document.querySelector(s),vis=el=>{if(!el)return false;const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0};return{featuredChildren:q('#featured-services-track')?.children.length||0,shortChildren:q('#short-videos-track')?.children.length||0,visible:['.featured-services','.short-videos','.featured-services .content-rail','#featured-services-track','.short-videos .content-rail','#short-videos-track'].every(s=>vis(q(s)))}});if(ready.featuredChildren!==6||ready.shortChildren<1||!ready.visible)throw Error(`runtime ${JSON.stringify(ready)} w=${w}`);if(state==='rail'){const m=await p.evaluate(()=>{const el=document.querySelector('#featured-services-track'),max=Math.max(0,el.scrollWidth-el.clientWidth);el.scrollLeft=Math.min(120,max);return{max,left:el.scrollLeft}});if(!m||m.max<=0||m.left<=0)throw Error(`rail ${JSON.stringify(m)} w=${w}`);await p.waitForTimeout(150)}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate((targets)=>{const round=n=>Math.round(n*1000)/1000,out={};for(const t of targets){out[t.s]=[...document.querySelectorAll(t.s)].map(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(const x of t.p)style[x]=cs.getPropertyValue(x).trim();return{style,rect:{x:round(r.x),y:round(r.y),w:round(r.width),h:round(r.height)},scroll:{cw:el.clientWidth,ch:el.clientHeight,sw:el.scrollWidth,sh:el.scrollHeight,sx:round(el.scrollLeft),sy:round(el.scrollTop)},children:el.children.length}})}const track=document.querySelector('#featured-services-track');out.__scrollbar=track?getComputedStyle(track,'::-webkit-scrollbar').display:null;return out},targets);const png=hash(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
          const states=[];for(const w of widths){states.push([w,'default']);if(railWidths.has(w))states.push([w,'rail'])}const par={},can={};fs.writeFileSync(f,parent);for(const [w,s] of states)par[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,candidate);for(const [w,s] of states)can[`${w}-${s}`]=await cap(w,s,'candidate');let dataDiffs=0,screenshotDiffs=0,pageErrors=0;const diffKeys=[];for(const k of Object.keys(par)){pageErrors+=par[k].errs.length+can[k].errs.length;if(JSON.stringify(par[k].data)!==JSON.stringify(can[k].data)){dataDiffs++;diffKeys.push(k)}if(par[k].png!==can[k].png){screenshotDiffs++;if(!diffKeys.includes(k))diffKeys.push(k)}}console.log(`RENDERER PARITY|states=${states.length}|viewports=${widths.join(',')}|railStates=3|featuredCards=6|shortCards=6|dataDiffs=${dataDiffs}|screenshotDiffs=${screenshotDiffs}|pageErrors=${pageErrors}|diffKeys=${diffKeys.join(',')||'-'}|productRenderer=1|syntheticDOM=0|criteriaRelaxed=0`);if(dataDiffs||screenshotDiffs||pageErrors)throw Error(`unsafe ${diffKeys.join(',')}`);console.log('DECISION|candidateSafe=1|candidate=23->4|searchMarkersPreserved=3|featuredOverflowGuardPreserved=1|reason=real-renderer-visible-runtime-parity');await browser.close();fs.writeFileSync(f,parent)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PROOF=${{ steps.proof.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|RENDERER PARITY|DECISION)\|' /tmp/proof.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 300 /tmp/proof.log || true; fi; } >/tmp/evidence.txt; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 006 renderer r5 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
