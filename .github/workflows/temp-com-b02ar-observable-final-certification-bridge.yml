name: TEMP COM-B02AR Observable Final Certification Bridge

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02ar-observable-final-certification-bridge.yml'

permissions:
  contents: write

jobs:
  certify-final-tree:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 2aedca59db41a54c20ec7bc49f6f8d73da6cc369
      FINAL_HEAD: 8535834a60131a62edfbae510d76c2a550a64960
      FINAL_TREE: 28598d84059571cffc3927890c35f52f377ef5c7
      BRANCH: com/com-001-baseline-audit
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      TEMP_PATH: .github/workflows/temp-com-b02ar-observable-final-certification-bridge.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary certification head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze final B02AR tree and bridge-only lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$FINAL_HEAD"
          test "$(git rev-parse "$FINAL_HEAD^{tree}")" = "$FINAL_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          actual="$(git diff --name-only "$FINAL_HEAD" HEAD | sort)"
          test "$actual" = "$TEMP_PATH"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02ar-repository-only-continuation-state-registry-storage-backend-instance.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance.js \
            config/com-b02ar-repository-only-continuation-state-registry-storage-backend-instance.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ar-repository-only-continuation-state-registry-storage-backend-instance.js | sort)"
          actual_final="$(git diff --name-only "$BASE" "$FINAL_HEAD" | sort)"
          test "$actual_final" = "$expected_final"
          ! git ls-tree -r --name-only "$FINAL_HEAD" | grep '^.github/workflows/temp-com-b02ar-'
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance.js)" = "762b0c5ed4ffaee24f2375a780e6c1bea7fb65d9"
          test "$(git rev-parse HEAD:config/com-b02ar-repository-only-continuation-state-registry-storage-backend-instance.json)" = "e9ac5e4725e4b4bce38478bbd2d4365e5cc12478"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-materialization-readiness.js)" = "18536ad1d24a31e65973470301535922ec12e158"
          test "$(git rev-parse HEAD:config/com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.json)" = "d24a27cf1073f4870aa99a3e4dcd1f0653c768b1"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02AR certification
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance.js
          node --check scripts/test-com-b02ar-repository-only-continuation-state-registry-storage-backend-instance.js
          node scripts/test-com-b02ar-repository-only-continuation-state-registry-storage-backend-instance.js
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'storageBackendMaterialized[[:space:]]*:[[:space:]]*true|entryContainerMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true|opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'rawStateSerialized[[:space:]]*:[[:space:]]*true|rawStateExported[[:space:]]*:[[:space:]]*true|executableReferencesExported[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Domain Completion Matrix Agent Governance and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$BASE" "$FINAL_HEAD"

      - name: Self-remove bridge and stamp observable run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- "$TEMP_PATH"
          test "$(git write-tree)" = "$FINAL_TREE"
          git commit -m "ci(com): certify B02AR final tree [run ${GITHUB_RUN_ID}]"
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02ar-'

      - name: Fast-forward branch only if bridge head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
