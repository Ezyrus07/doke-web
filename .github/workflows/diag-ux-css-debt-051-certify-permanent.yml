name: Doke UX-CSS-DEBT-051 Permanent Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-051-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: e8176fc05c9ac47745cf70e9ac560ffe0036fbec
      PARENT_SHA: 62dcfa29b7a4a21e07d5fefe2c336c4c76a0eb05
      PARENT_PARENT_SHA: 927b4d24e26d1684864cc3a4222540bb7c9f9667
      TARGET_TREE: 478b1acfce531cd9e88b550e042969485f63399d
      TARGET_FILE: assets/css/components/cards/service-card-home-feed.css
      PARENT_BLOB: 95f4b03a325a5fd62dae8b89bfe89b94b1290027
      TARGET_BLOB: cfc31d2261a8e630ae6147dc410cea2c75a14384
      TARGET_HASH: 2db6992d12aa5d92bef793f06472076bd7507a2a64a1fa44df72011a376ac18d
      TARGET_BYTES: '10140'
      IMPORTER_A: assets/css/pages/home-refresh.css
      IMPORTER_A_BLOB: 595588303bb372e753e2ff3901e31dad1d4a38ce
      IMPORTER_B: assets/css/pages/home/mobile/index.css
      IMPORTER_B_BLOB: 43265a98e654aa25989272489a7d87dc3a667e1f
      PAGE_FILE: index.html
      PAGE_BLOB: a3b2bffb4fd6bc4208b40930b621a9c54ce22cea
      FEED_RUNTIME: assets/js/pages/home/public-services.js
      FEED_BLOB: f0ff25d7552b5195611435dd62ea96d8e20eba6f
      CARD_RUNTIME: assets/js/components/public-service-card.js
      CARD_BLOB: f8575282a436a10da632c137ca066476877bc039
      PERM_BRANCH: ux/ux-css-debt-051-service-card-home-feed-compaction
      AUTHORITY_DOC_A: docs/PAGE-ASSET-AUTHORITY-MATRIX.md
      AUTHORITY_DOC_B: docs/HOME-AUTHORITY-CLASSIFICATION.md
      AUTHORITY_DOC_A_REGEN_HASH: 345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6
      AUTHORITY_DOC_B_REGEN_HASH: b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
      - name: Preserve exact-cert helpers
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-051-cert-identity.cjs /tmp/ux051-cert-identity.cjs
          cp .github/diagnostics/ux-css-debt-051-cert-residual.cjs /tmp/ux051-cert-residual.cjs
          node --check /tmp/ux051-cert-identity.cjs
          node --check /tmp/ux051-cert-residual.cjs
      - name: Checkout exact certified UX-CSS-DEBT-050 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2
          clean: true
      - name: Guard parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git hash-object "$IMPORTER_A")" = "$IMPORTER_A_BLOB"
          test "$(git hash-object "$IMPORTER_B")" = "$IMPORTER_B_BLOB"
          test "$(git hash-object "$PAGE_FILE")" = "$PAGE_BLOB"
          test "$(git hash-object "$FEED_RUNTIME")" = "$FEED_BLOB"
          test "$(git hash-object "$CARD_RUNTIME")" = "$CARD_BLOB"
          test -z "$(git status --porcelain)"
          echo "PARENT IDENTITY PASS|sha=$PARENT_SHA|parent=$PARENT_PARENT_SHA|blob=$PARENT_BLOB|importers=$IMPORTER_A_BLOB/$IMPORTER_B_BLOB|runtime=$FEED_BLOB/$CARD_BLOB"
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and generate parent governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          npm run audit:page-asset-authority-matrix
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$PARENT_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          echo "PARENT BASELINES PASS|responsive=generated|authorityHashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH"
      - name: Checkout exact permanent SHA without removing generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA" --depth=2
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -s reports/responsive-index-baseline.json
          echo "PERMANENT CHECKOUT PASS|sha=$TARGET_SHA"
      - name: Exact permanent identity reach and runtime-proof transfer
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER_A")" = "$IMPORTER_A_BLOB"
          test "$(git hash-object "$IMPORTER_B")" = "$IMPORTER_B_BLOB"
          test "$(git hash-object "$PAGE_FILE")" = "$PAGE_BLOB"
          test "$(git hash-object "$FEED_RUNTIME")" = "$FEED_BLOB"
          test "$(git hash-object "$CARD_RUNTIME")" = "$CARD_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"...HEAD -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          test -z "$(git diff --name-only "$PARENT_SHA"...HEAD -- '*.js' '*.html' 'package.json' 'package-lock.json' 'docs/**')"
          git diff --check "$PARENT_SHA"...HEAD
          node /tmp/ux051-cert-identity.cjs
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const target=process.env.TARGET_FILE,a=process.env.IMPORTER_A,b=process.env.IMPORTER_B,feed=process.env.FEED_RUNTIME,card=process.env.CARD_RUNTIME;
          const tracked=new Set(cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(Boolean));
          function importsFor(file){const src=fs.readFileSync(file,'utf8'),out=[],re=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;let m;while((m=re.exec(src))){let v=m[1].replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))v=v.replace(/^\/+/, '');else if(!v.startsWith('assets/'))v=path.posix.normalize(path.posix.join(path.posix.dirname(file),v));if(tracked.has(v))out.push(v)}return out}
          const direct=[...tracked].filter(f=>importsFor(f).includes(target)).sort();const expected=[a,b].sort();if(JSON.stringify(direct)!==JSON.stringify(expected))throw new Error('direct importer drift '+JSON.stringify(direct));
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),reached=[];for(const p of report.pageAssets){const seen=new Set(),todo=[...(p.css||[]).filter(f=>tracked.has(f))];let hit=false;while(todo.length){const f=todo.pop();if(seen.has(f)||!tracked.has(f))continue;seen.add(f);if(f===target){hit=true;break}for(const n of importsFor(f))todo.push(n)}if(hit)reached.push(p.page)}reached.sort();if(JSON.stringify(reached)!==JSON.stringify(['index.html']))throw new Error('active reach drift '+JSON.stringify(reached));
          const grep=cp.spawnSync('git',['grep','-l','-F','service-card--feed','--','*.html','assets/js/**/*.js'],{encoding:'utf8'});if(grep.status!==0&&grep.status!==1)throw new Error('git grep failed '+grep.status);const emitters=(grep.stdout||'').trim().split(/\r?\n/).filter(f=>f&&(f.endsWith('.html')||f.startsWith('assets/js/')));if(emitters.length)throw new Error('legacy runtime emitter returned '+emitters.join(','));
          const feedSrc=fs.readFileSync(feed,'utf8'),cardSrc=fs.readFileSync(card,'utf8');if(!feedSrc.includes('Doke.publicServiceCard.create(item)'))throw new Error('feed authority drift');if(!cardSrc.includes("article.className = 'doke-ad-card doke-ad-card--featured'")||!cardSrc.includes("body.className='doke-ad-card__body'")||!cardSrc.includes("title.className='doke-ad-card__title'"))throw new Error('current renderer authority drift');
          console.log(`REACH AUTHORITY PASS|page=index.html|directImporters=${direct.join(',')}|feedRuntime=${feed}|cardRuntime=${card}|target=${target}|affectedFamilies=2|legacyRuntimeEmitters=0|currentRenderer=doke-ad-card`);
          NODE
          echo "EXACT IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=3"
          echo 'RUNTIME PROOF TRANSFER PASS|R1run=31967737462|R1job=95215370932|R1page=index.html|R1viewports=9|R1before=9|R1after=9|R1runtimeDiffs=0|R1legacyMatches=0|R1overflow=0->0|R1boundary=419/420/421|R2run=31967866134|R2job=95215669432|R2families=2/2|R2viewports=9|R2before=9|R2after=9|R2runtimeDiffs=0|R2fixtureOverflow=7->7|R2boundaries=419/420/421+559/560/561|transport=independent-byte-reconstruction'
      - name: Responsive contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Responsive contract test: PASS' /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PERMANENT PASS|checks=893|failures=0|skips=277'
      - name: Governance contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo 'GOVERNANCE PERMANENT PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'
      - name: Isolate parent-stale authority-doc regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$TARGET_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          test -z "$(git diff --name-only)"
          echo "AUTHORITY DOC BASELINE ISOLATION PASS|candidateSemanticDocDelta=0|hashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH|workingTreeTrackedClean=1"
      - name: Permanent residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          node /tmp/ux051-cert-residual.cjs
      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));const v=a.metadata?.vulnerabilities||{};console.log(`NPM AUDIT SNAPSHOT|total=${v.total??'n/a'}|critical=${v.critical??'n/a'}|high=${v.high??'n/a'}|moderate=${v.moderate??'n/a'}|low=${v.low??'n/a'}`);
          NODE
      - name: Final exact-SHA certification marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER_A")" = "$IMPORTER_A_BLOB"
          test "$(git hash-object "$IMPORTER_B")" = "$IMPORTER_B_BLOB"
          test "$(git hash-object "$PAGE_FILE")" = "$PAGE_BLOB"
          test "$(git hash-object "$FEED_RUNTIME")" = "$FEED_BLOB"
          test "$(git hash-object "$CARD_RUNTIME")" = "$CARD_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test -z "$(git diff --name-only)"
          echo "PERMANENT EXACT CERT PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=3|responsive=893/0/277|residual=23/469/0|runtimeProof=R1+R2-transferred-by-independent-byte-reconstruction|prCreated=0"
      - name: Clean generated artifacts and restore exact permanent checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0|prCreated=0|generatedArtifactsCleaned=1"
