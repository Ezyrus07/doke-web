name: Doke SCHED-C01C Push Application

on:
  push:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/sched-001-c01c-push-application.yml'

permissions:
  contents: write

concurrency:
  group: sched-c01c-push-application
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Apply deterministic C01C repository changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path
          
          def write_b64(path, payload):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(payload))
          
          def replace_once(path, old, new):
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              target.write_text(source.replace(old, new, 1))
          
          def replace_regex(path, pattern, replacement):
              target = Path(path)
              source = target.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex replacement, found {count}: {pattern[:120]!r}')
              target.write_text(updated)
          
          write_b64('assets/js/patterns/order-schedule-presentation.js', '')
          write_b64('config/sched-001-c01c-deterministic-frontend-presentation.json', '')
          write_b64('docs/validation/SCHED-001-C01C-DETERMINISTIC-FRONTEND-PRESENTATION.json', '')
          write_b64('docs/SCHED-001-C01C-DETERMINISTIC-FRONTEND-PRESENTATION.md', ' BtdXN0IHJlbWFpbiBpbmRlcGVuZGVudGx5IGF1dGhvcml6ZWQgYW5kIHJlYWQtb25seTogYW4gYXV0aGVudGljYXRlZCBicm93c2VyIGNhbmFyeSBtYXkgdmVyaWZ5IHByZXNlbnRhdGlvbiwgYnV0IGNhbm5vdCBjb25maXJtLCByZXNjaGVkdWxlIG9yIGNhbmNlbCBhIHJlc2VydmF0aW9uLgo=')
          write_b64('scripts/test-sched-001-c01c-deterministic-frontend-presentation.js', '')
          write_b64('scripts/audit-sched-001-c01c-deterministic-frontend-presentation.js', '... (truncated due to payload size)