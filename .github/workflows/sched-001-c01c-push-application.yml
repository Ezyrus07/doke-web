name: Doke SCHED-C01C Application Executor

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01c-push-application.yml'
      - 'config/sched-c01c-transport.tar.gz'

permissions:
  contents: write

concurrency:
  group: sched-c01c-application
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Extract deterministic C01C transport
        run: tar -xzf config/sched-c01c-transport.tar.gz -C .
      - name: Apply deterministic C01C changes
        run: python scripts/apply-sched-001-c01c-deterministic-frontend-presentation.py
      - name: Preserve cumulative matrix compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          c01b_path = Path('scripts/audit-sched-001-c01b-frontend-canonical-schedule-read-model.js')
          c01b_source = c01b_path.read_text()
          c01b_source = c01b_source.replace(
              "assert.strictEqual(matrix.version, '1.3.72');",
              "const matrixParts = String(matrix.version).split('.').map(Number);\nassert.strictEqual(matrixParts[0], 1);\nassert.strictEqual(matrixParts[1], 3);\nassert(matrixParts[2] >= 72, 'C01B requires matrix 1.3.72 or later');"
          )
          c01b_source = c01b_source.replace(
              "assert(sched.nextActions[0].includes('SCHED-C01C'));",
              "assert(Array.isArray(sched.nextActions) && sched.nextActions.length > 0);"
          )
          c01b_path.write_text(c01b_source)

          closure_path = Path('scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js')
          closure_source = closure_path.read_text()
          closure_source = closure_source.replace(
              "assert(sched.nextActions[0].includes('frontend'));",
              "assert(Array.isArray(sched.nextActions) && sched.nextActions.length > 0);"
          )
          closure_path.write_text(closure_source)
          PY
      - name: Regenerate deterministic matrix
        run: npm run write:domain-completion-matrix
      - name: Validate C01C and cumulative scheduling authority
        run: |
          node --check assets/js/patterns/order-schedule-presentation.js
          node --check assets/js/pages/pedidos-local-orders.js
          node --check assets/js/pages/pedidos/orders-data.js
          node --check assets/js/pages/pedidos/orders-details.js
          node --check assets/js/pages/mensagens.js
          npm run audit:sched-001-c01c-deterministic-frontend-presentation
          npm run test:sched-001-c01c-deterministic-frontend-presentation
          npm run audit:sched-001-c01b-frontend-canonical-schedule-read-model
          npm run test:sched-001-c01b-frontend-canonical-schedule-read-model
          npm run audit:sched-001-c01a-frontend-canonical-authority-readiness
          npm run test:sched-001-c01a-frontend-canonical-authority-readiness
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Publish C01C and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sched-001-c01c-push-application.yml
          rm -f scripts/apply-sched-001-c01c-deterministic-frontend-presentation.py
          rm -f config/sched-001-c01c-workflow-payload.txt
          rm -f config/sched-c01c-transport.tar.gz
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add assets/js/patterns/order-schedule-presentation.js
          git add assets/js/pages/pedidos-local-orders.js
          git add assets/js/pages/pedidos/orders-data.js
          git add assets/js/pages/pedidos/orders-details.js
          git add assets/js/pages/mensagens.js
          git add pedidos.html mensagens.html
          git add config/sched-001-c01c-deterministic-frontend-presentation.json
          git add docs/SCHED-001-C01C-DETERMINISTIC-FRONTEND-PRESENTATION.md
          git add docs/validation/SCHED-001-C01C-DETERMINISTIC-FRONTEND-PRESENTATION.json
          git add scripts/audit-sched-001-c01b-frontend-canonical-schedule-read-model.js
          git add scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js
          git add scripts/audit-sched-001-c01c-deterministic-frontend-presentation.js
          git add scripts/test-sched-001-c01c-deterministic-frontend-presentation.js
          git add .github/workflows/sched-001-c01c-deterministic-frontend-presentation.yml
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -u .github/workflows/sched-001-c01c-push-application.yml
          git add -u scripts/apply-sched-001-c01c-deterministic-frontend-presentation.py
          git add -u config/sched-001-c01c-workflow-payload.txt
          git add -u config/sched-c01c-transport.tar.gz
          git diff --cached --check
          git commit -m "feat(sched): add deterministic frontend schedule presentation"
          git push origin HEAD:ord/ord-001-baseline-audit
