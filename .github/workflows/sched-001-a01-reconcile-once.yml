name: SCHED-A01 Preflight Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/sched-001-a01-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile SCHED-A01 preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const schedA01Path = 'config/sched-001-a01-repository-baseline-staging-security-preflight.json';
          const schedA01 = JSON.parse(fs.readFileSync(schedA01Path, 'utf8'));

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['audit:sched-001-a01-repository-baseline-staging-security-preflight'] =
            'node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const a10ConfigPath = 'config/ord-001-a10-blocker-reconciliation.json';
          const a10Config = JSON.parse(fs.readFileSync(a10ConfigPath, 'utf8'));
          a10Config.orderedNextActions[0] = 'Execute SCHED-A02 command, event, timezone, idempotency, status-authority and conflict contract freeze; generic continuation must not mutate staging.';
          fs.writeFileSync(a10ConfigPath, JSON.stringify(a10Config, null, 2) + '\n');

          const a10DocPath = 'docs/ORD-001-A10-BLOCKER-RECONCILIATION.md';
          let a10Doc = fs.readFileSync(a10DocPath, 'utf8');
          a10Doc = a10Doc.replace(
            '1. execute the `SCHED-001` repository baseline and read-only staging security preflight defined by `ORD-A11`;',
            '1. execute `SCHED-A02` to freeze command, event, timezone, idempotency, status-authority and conflict contracts;'
          );
          if (!a10Doc.includes('SCHED-A01 completed the read-only staging security preflight')) {
            a10Doc = a10Doc.replace(
              '## Cumulative contract compatibility',
              '## Scheduling handoff progression\n\n`ORD-A11` completed the ownership handoff and `SCHED-A01` completed the read-only staging security preflight. `SCHED-B01` is closed, while `ORD-B04` remains open through the implementation blockers owned by `SCHED-001`.\n\n## Cumulative contract compatibility'
            );
          }
          fs.writeFileSync(a10DocPath, a10Doc);

          const a11ConfigPath = 'config/ord-001-a11-scheduling-authority-handoff.json';
          const a11Config = JSON.parse(fs.readFileSync(a11ConfigPath, 'utf8'));
          a11Config.observedRepositoryState.stagingRlsVerificationRecordedForSched = true;
          a11Config.orderedNextActions = [...schedA01.orderedNextActions];
          fs.writeFileSync(a11ConfigPath, JSON.stringify(a11Config, null, 2) + '\n');

          const a11DocPath = 'docs/ORD-001-A11-SCHEDULING-AUTHORITY-HANDOFF.md';
          let a11Doc = fs.readFileSync(a11DocPath, 'utf8');
          a11Doc = a11Doc
            .replace(
              '- no SCHED-specific staging verification currently proves the deployed policies and grants;',
              '- `SCHED-A01` now proves the deployed schema, RLS, policies, grants and migration versions through read-only staging inspection;'
            )
            .replace(
              'Therefore, the security blocker remains open as a staging-verification problem, while the server-authority and concurrency blockers remain implementation problems.',
              'Therefore, `SCHED-B01` is closed. The server-authority, concurrency, order-integration and reservation-status boundaries remain open implementation problems.'
            )
            .replace(
              '1. perform a read-only staging preflight of `availability_slots` schema, RLS, policies and grants;\n2. freeze the SCHED command, event, timezone and conflict contracts;\n3. generate and test a migration locally without applying it;\n4. implement the server scheduling module;\n5. wire accepted proposals and orders to canonical reservation references;\n6. only then run authorized staging application and concurrency canaries.',
              '1. freeze the SCHED command, event, timezone, idempotency, status-authority and conflict contracts;\n2. generate and test a migration locally without applying it;\n3. implement the server scheduling module;\n4. wire accepted proposals and orders to canonical reservation references;\n5. only then run separately authorized staging application and concurrency canaries.'
            );
          if (!a11Doc.includes('A professional can currently update their own slot to `booked`')) {
            a11Doc = a11Doc.replace(
              '## Canonical ownership',
              '## SCHED-A01 security finding\n\nRLS is correctly deployed, but the owner update policy does not constrain the new status. A professional can currently update their own slot to `booked` without a canonical reservation command. `SCHED-B05` records this authority-conflation defect.\n\n## Canonical ownership'
            );
          }
          fs.writeFileSync(a11DocPath, a11Doc);

          const a11AuditPath = 'scripts/audit-ord-001-a11-scheduling-authority-handoff.js';
          let a11Audit = fs.readFileSync(a11AuditPath, 'utf8');
          a11Audit = a11Audit
            .replace(
              "assert.strictEqual(config.observedRepositoryState.roleSeparatedAvailabilityReadPoliciesExist, true);",
              "assert.strictEqual(config.observedRepositoryState.roleSeparatedAvailabilityReadPoliciesExist, true);\nassert.strictEqual(config.observedRepositoryState.stagingRlsVerificationRecordedForSched, true);"
            )
            .replace(
              "assert.strictEqual(matrix.version, '1.3.43');",
              "const compareVersions = (left, right) => {\n  const a = String(left).split('.').map(Number);\n  const b = String(right).split('.').map(Number);\n  for (let index = 0; index < Math.max(a.length, b.length); index += 1) {\n    const delta = (a[index] || 0) - (b[index] || 0);\n    if (delta !== 0) return delta;\n  }\n  return 0;\n};\nassert(compareVersions(matrix.version, '1.3.44') >= 0, `Matrix version ${matrix.version} predates SCHED-A01.`);"
            )
            .replace(
              "assert(sched.blockers.some((blocker) => blocker.id === 'SCHED-B01' && blocker.description.includes('staging verification')));",
              "assert(!sched.blockers.some((blocker) => blocker.id === 'SCHED-B01'));\nassert(sched.blockers.some((blocker) => blocker.id === 'SCHED-B05' && blocker.category === 'reservation_status_authority'));"
            );
          fs.writeFileSync(a11AuditPath, a11Audit);

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.44';
          matrix.updatedAt = '2026-07-31T08:20:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
          if (!ord || !sched) throw new Error('ORD-001 or SCHED-001 domain missing');

          const paths = [
            schedA01Path,
            'docs/SCHED-001-A01-REPOSITORY-BASELINE-STAGING-SECURITY-PREFLIGHT.md',
            'docs/validation/SCHED-001-A01-REPOSITORY-BASELINE-STAGING-SECURITY-PREFLIGHT.json',
            'scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js',
            '.github/workflows/sched-001-a01-repository-baseline-staging-security-preflight.yml'
          ];
          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };
          appendUnique(ord.requiredPaths, paths);
          appendUnique(sched.requiredPaths, paths);
          appendUnique(ord.tests, ['audit:sched-001-a01-repository-baseline-staging-security-preflight']);
          appendUnique(sched.tests, ['audit:sched-001-a01-repository-baseline-staging-security-preflight']);

          appendUnique(ord.evidence, [
            'SCHED-A01 verified availability_slots RLS, five policies, role grants, applied migration versions and zero-row baseline directly in staging without mutation.',
            'The preflight closed SCHED-B01 but found that professionals can set their own availability row to booked, while no reservation command, hold lifecycle, exclusion constraint or order reservation reference exists.'
          ]);
          ord.nextActions = ord.nextActions.filter((action) => !/SCHED-001 repository baseline|read-only staging security preflight|SCHED-A02/i.test(action));
          ord.nextActions.unshift(a10Config.orderedNextActions[0]);

          sched.stagingEvidence = 'staging_canary';
          sched.securityGate = 'partial';
          sched.evidence = sched.evidence.filter((entry) => !/No SCHED-specific staging preflight|staging verification remains open/i.test(entry));
          appendUnique(sched.evidence, [
            'SCHED-A01 read-only staging inspection verified availability_slots RLS enabled, FORCE RLS disabled, five expected policies, role-separated grants, the two authority migrations and a zero-row baseline.',
            'The deployed owner update policy allows a professional to set their own availability row to booked because no status-transition boundary exists.',
            'No hold or reservation table, timezone, order link, expiration, idempotency key, optimistic version, exclusion constraint or schedule_reservation_id exists; btree_gist is not installed.',
            'SCHED-A01 executed two read-only SQL queries and performed zero mutations, migrations, deployments, production changes or merge.'
          ]);
          sched.blockers = sched.blockers.filter((blocker) => blocker.id !== 'SCHED-B01');
          sched.blockers = sched.blockers.map((blocker) => blocker.id === 'SCHED-B02'
            ? {
                ...blocker,
                description: 'No canonical scheduling service owns availability rules, holds, confirmed reservations, expiration, rescheduling, cancellation, timezone or protected status transitions; the current owner policy can set booked directly.'
              }
            : blocker);
          if (!sched.blockers.some((blocker) => blocker.id === 'SCHED-B05')) {
            sched.blockers.push({
              id: 'SCHED-B05',
              severity: 'high',
              category: 'reservation_status_authority',
              description: 'The professional owner update policy can set availability_slots.status to booked without a canonical reservation command, order binding or protected status-transition boundary.',
              targetPhase: 'Fase 6'
            });
          }
          sched.nextActions = [...schedA01.orderedNextActions];

          for (const flow of matrix.criticalFlows || []) {
            if (!Array.isArray(flow.blockers) || !flow.blockers.includes('SCHED-B01')) continue;
            flow.blockers = flow.blockers.map((id) => id === 'SCHED-B01' ? 'SCHED-B05' : id);
          }

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/test-public-data-authority-contract.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add config/ord-001-a10-blocker-reconciliation.json docs/ORD-001-A10-BLOCKER-RECONCILIATION.md
          git add config/ord-001-a11-scheduling-authority-handoff.json docs/ORD-001-A11-SCHEDULING-AUTHORITY-HANDOFF.md scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile SCHED-A01 staging security preflight' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
