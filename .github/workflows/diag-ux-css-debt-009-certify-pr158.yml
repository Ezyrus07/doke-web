name: Doke UX-CSS-DEBT-009 PR158 Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-009-certify-pr158

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 4d96f04758ba0e33b7b1490a95a5c1e6e2f3e819
      PARENT_SHA: a07f548b1cabc924b8814a6c980be29f2fd71ad4
      TARGET_FILE: assets/css/pages/comunidade-interna-settings.css
      EXPECTED_PARENT_SHA256: 81d738d73d836f51d65e3e3e2b8064685a471ab527ff851505c3fb0703a52744
      EXPECTED_CANDIDATE_SHA256: 9d165664d02007b08409ca8fa6f71d7ff635937726cc5cfa7b9f36719a013e73
      PR_NUMBER: '158'
    steps:
      - name: Checkout exact permanent SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact one-commit product-only tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git rev-list --count "${PARENT_SHA}"..HEAD)" = "1"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $2}')" = "36"
          git diff --check "${PARENT_SHA}"...HEAD
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Prove permanent CSS equals deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${PARENT_SHA}:${TARGET_FILE}" > /tmp/community-settings-parent.css
          cp "${TARGET_FILE}" /tmp/community-settings-permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const parent=fs.readFileSync('/tmp/community-settings-parent.css','utf8'),permanent=fs.readFileSync('/tmp/community-settings-permanent.css','utf8'),lines=parent.split(/\r?\n/);
          let depth=0,selectorParts=[],atRuleParts=[],selector=null;
          const declarations=[],stack=[];
          const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;
          const norm=parts=>parts.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          for(let i=0;i<lines.length;i++){
            const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector){
              if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}
              else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}
              else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
              else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
            }
            if(selector){const m=line.match(declRe);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1].toLowerCase(),important,context});}}
            depth+=opens-closes;
            while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}
          }
          if(atRuleParts.length)throw new Error('unterminated multiline at-rule');
          const last=new Map(),dead=[];
          for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push(d);if(!later||d.important||!later.important)last.set(key,d);}
          const deadSet=new Set(dead.map(d=>d.lineIndex)),rebuilt=lines.filter((_l,i)=>!deadSet.has(i)).join('\n'),selectors=[...new Set(dead.map(d=>d.selector))].sort(),sha=v=>crypto.createHash('sha256').update(v).digest('hex');
          if(sha(parent)!==process.env.EXPECTED_PARENT_SHA256)throw new Error('parent hash drift');
          if(sha(permanent)!==process.env.EXPECTED_CANDIDATE_SHA256)throw new Error('permanent hash drift');
          if(rebuilt!==permanent)throw new Error('permanent differs from deterministic candidate');
          if(declarations.length!==1004||dead.length!==36||selectors.length!==15)throw new Error(`metric drift ${declarations.length}/${dead.length}/${selectors.length}`);
          if(Buffer.byteLength(parent)!==75377||Buffer.byteLength(permanent)!==73838)throw new Error('byte drift');
          if((parent.match(/!important/gi)||[]).length||(permanent.match(/!important/gi)||[]).length)throw new Error('unexpected important');
          fs.writeFileSync('/tmp/community-settings-selectors.json',JSON.stringify(selectors));
          console.log('Exact deletion-only proof: PASS');
          console.log('- declarations: 1004 -> 968');
          console.log('- deleted: 36');
          console.log('- affected selectors: 15');
          console.log('- bytes: 75377 -> 73838');
          NODE

      - name: Write precise Community settings runtime harness
        shell: bash
        run: |
          cat > /tmp/community-settings-pr158-capture.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2],selectors=JSON.parse(fs.readFileSync('/tmp/community-settings-selectors.json','utf8'));
          const vps=[['1600x1000',1600,1000],['1366x768',1366,768],['1280x802',1280,802],['1024x900',1024,900],['820x1180',820,1180],['608x926',608,926],['390x844',390,844]];
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            await sleep(500);
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}),result={};
            for(const [name,width,height] of vps){
              const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();
              await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});
              await page.goto('http://127.0.0.1:5500/comunidade-interna.html',{waitUntil:'domcontentloaded'});
              await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});
              await page.evaluate(()=>{
                document.documentElement.removeAttribute('data-auth-guard');
                document.body.setAttribute('data-page','comunidade-interna');
                document.body.setAttribute('data-data-state','ready');
                const room=document.querySelector('[data-community-room]');
                if(!room)throw new Error('community room missing');
                room.hidden=false;room.classList.add('is-settings-mode');
                for(const e of room.querySelectorAll('[hidden]'))e.hidden=false;
                for(const p of room.querySelectorAll('.community-settings-panel'))p.setAttribute('aria-hidden','false');
              });
              const returnButton=page.locator('.community-room-return--settings').first();
              if(await returnButton.count())await returnButton.hover({force:true});
              await page.evaluate(()=>document.fonts&&document.fonts.ready);await sleep(80);
              result[name]=await page.evaluate(selectors=>{
                const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
                const capture=el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(let i=0;i<cs.length;i++){const p=cs[i];style[p]=clean(cs.getPropertyValue(p));}return{tag:el.tagName,id:el.id||'',className:typeof el.className==='string'?clean(el.className):'',rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)],style};};
                const samples={},missing=[];
                for(const s of selectors){let nodes=[];try{nodes=[...document.querySelectorAll(s)];}catch(e){missing.push(`${s} [invalid:${e.message}]`);continue;}if(!nodes.length)missing.push(s);else samples[s]=nodes.map(capture);}
                return{samples,missing};
              },selectors);
              console.log(`${name}: coverage ${selectors.length-result[name].missing.length}/${selectors.length}`);
              if(result[name].missing.length)console.log(`MISSING ${name}: ${result[name].missing.join(' || ')}`);
              await ctx.close();
            }
            await browser.close();fs.writeFileSync(out,JSON.stringify(result));
            const missing=[...new Set(Object.values(result).flatMap(x=>x.missing))];
            if(missing.length)throw new Error(`affected-selector coverage incomplete: unique missing=${missing.length}`);
            console.log(`affected-selector coverage: ${selectors.length}/${selectors.length} across ${vps.length} viewports`);
          }
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Capture parent runtime, responsive and conflict baselines
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/community-settings-parent.css "${TARGET_FILE}"
          node /tmp/community-settings-pr158-capture.js /tmp/community-settings-parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/community-settings-parent-responsive.json
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/community-settings-parent-conflicts.log
          grep 'Conflicting class/property pairs:' /tmp/community-settings-parent-conflicts.log | tail -1 | awk '{print $4}' > /tmp/community-settings-parent-conflicts.count
          test "$(cat /tmp/community-settings-parent-conflicts.count)" = "339"

      - name: Restore exact permanent candidate and preserve responsive contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/community-settings-permanent.css "${TARGET_FILE}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          cp /tmp/community-settings-parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log

      - name: Require exact parent-to-permanent affected-selector parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/community-settings-pr158-capture.js /tmp/community-settings-permanent-runtime.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/community-settings-parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/community-settings-permanent-runtime.json')),diffs=[];
          function walk(x,y,p){if(typeof x!==typeof y||x===null||y===null||typeof x!=='object'){if(x!==y)diffs.push({path:p,parent:x,candidate:y});return;}if(Array.isArray(x)!==Array.isArray(y)){diffs.push({path:p,parent:x,candidate:y});return;}for(const k of [...new Set([...Object.keys(x),...Object.keys(y)])].sort())walk(x[k],y[k],p?`${p}.${k}`:k);}
          walk(a,b,'');if(diffs.length){console.error(JSON.stringify(diffs.slice(0,80),null,2));throw new Error(`runtime differences ${diffs.length}`);}console.log('Affected-selector computed-style + rect parity: PASS (0 diffs)');
          NODE

      - name: Validate structural and governance contracts on permanent candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/community-settings-permanent-conflicts.log
          permanent_conflicts="$(grep 'Conflicting class/property pairs:' /tmp/community-settings-permanent-conflicts.log | tail -1 | awk '{print $4}')"
          test "${permanent_conflicts}" = "339"
          echo "CSS conflicts: 339 -> ${permanent_conflicts}"
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:duplicate-assets
          grep -q 'active legacy/remediation css: 0' /tmp/legacy.log
          grep -q 'active legacy/remediation js: 0' /tmp/legacy.log
          grep -q 'high risk active css: 38' /tmp/legacy.log
          echo '--- final metrics ---'
          grep -E 'CSS files scanned|Definitions|Conflicting class/property pairs' /tmp/community-settings-permanent-conflicts.log || true
          grep -Ei 'active legacy/remediation css|active legacy/remediation js|high risk active css' /tmp/legacy.log || true

      - name: Restore tracked workspace to exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          git diff --exit-code

      - name: Require SonarQube Cloud credential
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}"

      - name: Analyze PR 158 exact SHA and enforce SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=158
            -Dsonar.pullrequest.branch=ux/ux-css-debt-009-community-settings-compaction
            -Dsonar.pullrequest.base=ux/ux-css-debt-008-profile-service-owner-card-compaction
            -Dsonar.scm.revision=4d96f04758ba0e33b7b1490a95a5c1e6e2f3e819
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
