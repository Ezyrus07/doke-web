name: COM-B02CO Repository-Only Registry-Backed Resume Surface Controlled Invocation

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - 'config/com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.json'
      - 'scripts/test-com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.js'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - '.github/workflows/com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.yml'
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'config/com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.json'
      - 'scripts/test-com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.js'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - '.github/workflows/com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.yml'

permissions:
  contents: read

jobs:
  certify-registry-backed-resume-surface-controlled-invocation:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: f6dc1dd76e29bc92d666e40a8f3ccf107b0da65d
      PREDECESSOR_TREE: 8dc1329c99fa5b82a88e35b7f53af9fc54faf8e9
      PREDECESSOR_RUN: '33123020226'
      PREDECESSOR_JOB: '98694359383'
      PREDECESSOR_WORKFLOW_ID: '344155150'
      EXECUTION_HEAD: 34e9720ee7b8249f8009a91a0aabdb804ebf5757
      EXECUTION_TREE: 4ae6b0aab764e52fc860fd59b63968359cb5aded
      EXECUTION_RUN: '33125150231'
      EXECUTION_JOB: '98701381842'
      EXECUTION_WORKFLOW_ID: '344185918'
      TEMP_PATH: .github/workflows/0000-temp-com-b02co-authorized-single-use-registry-backed-resume-proof.yml
      TEMP_BLOB: 4ca10b41e60c28c338cffc43786886968daf9858
      CONFIG: config/com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.json
      CONFIG_BLOB: fdf4a5067f01291df738c5419539555c20c2d78c
      TEST: scripts/test-com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.js
      TEST_BLOB: 83154df8df805541d23420e821ad938f1e4f734d
      PERMANENT_WORKFLOW: .github/workflows/com-b02co-repository-only-registry-backed-resume-surface-controlled-invocation.yml
      B02CL_TARGET: backend/shared/http/repository-only-permanent-process-local-registry-storage-execution-implementation.js
      B02CL_TARGET_BLOB: 9f1916f87db37a81045be897ae1c87e1341c4774
      B02CN_TARGET: backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration.js
      B02CN_TARGET_BLOB: 43ba780f17ef23790d03224955cafe49c454ac6c
      B02CN_CONFIG: config/com-b02cn-repository-only-dispatcher-registry-lookup-integration.json
      B02CN_CONFIG_BLOB: fb3de05bd8b2542cf5bf92cccb69f6824d80a294
      DISPATCHER: backend/shared/http/repository-only-route-resume-dispatcher.js
      DISPATCHER_BLOB: 4a8da53cca4ef27777c550e91f28a4abe5bbe542
      CARRIER: backend/shared/http/repository-only-route-continuation-carrier-contract.js
      CARRIER_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact certification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02CN certification, historical B02CO execution, and exact final scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD

          test "$(git rev-parse "$EXECUTION_HEAD^")" = "$PREDECESSOR_HEAD"
          test "$(git rev-parse "$EXECUTION_HEAD^{tree}")" = "$EXECUTION_TREE"
          git merge-base --is-ancestor "$EXECUTION_HEAD" HEAD
          test "$(git rev-parse "$EXECUTION_HEAD:$TEMP_PATH")" = "$TEMP_BLOB"
          test ! -e "$TEMP_PATH"

          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$B02CL_TARGET)" = "$B02CL_TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CN_TARGET)" = "$B02CN_TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CN_CONFIG)" = "$B02CN_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$DISPATCHER)" = "$DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$CARRIER)" = "$CARRIER_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          for path in $actual; do
            case "$path" in
              "$CONFIG"|"$TEST"|"$PERMANENT_WORKFLOW"|"$MATRIX_MD"|"$MATRIX_REPORT") ;;
              *) echo "Unexpected B02CO final-scope path: $path" >&2; exit 1 ;;
            esac
          done
          for required in "$CONFIG" "$TEST" "$PERMANENT_WORKFLOW"; do
            printf '%s\n' "$actual" | grep -Fx "$required" >/dev/null
          done
          git diff --check "$PREDECESSOR_HEAD" HEAD

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Certify historical registry-backed resume proof without re-execution
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TEST"

          registry_factory_a='createRepositoryOnlyPermanentProcessLocalRegistryStorage'
          registry_factory_b='Execution'
          integration_factory_a='createRepositoryOnlyDispatcherRegistryLookup'
          integration_factory_b='Integration'
          register_a='registerOpaqueContinuation'
          register_b='State'
          lookup_a='resolveContinuationFor'
          lookup_b='Dispatcher'
          resolve_a='resolveOpaqueContinuation'
          resolve_b='State'
          release_a='releaseOpaqueContinuation'
          release_b='State'
          dispatch_a='dispatchRepositoryOnlyRoute'
          dispatch_b='Resume'

          registry_factory="${registry_factory_a}${registry_factory_b}"
          integration_factory="${integration_factory_a}${integration_factory_b}"
          operation_pattern="\.(${register_a}${register_b}|${lookup_a}${lookup_b}|${resolve_a}${resolve_b}|${release_a}${release_b}|${dispatch_a}${dispatch_b})[[:space:]]*\("

          if grep -Eq "${registry_factory}[[:space:]]*\(" "$TEST" "$PERMANENT_WORKFLOW"; then
            echo "B02CO permanent certification must not invoke the process-local registry factory" >&2
            exit 1
          fi
          if grep -Eq "${integration_factory}[[:space:]]*\(" "$TEST" "$PERMANENT_WORKFLOW"; then
            echo "B02CO permanent certification must not instantiate the registry lookup integration" >&2
            exit 1
          fi
          if grep -Eq "$operation_pattern" "$TEST" "$PERMANENT_WORKFLOW"; then
            echo "B02CO permanent certification must not re-execute register, lookup, resolve, release, or dispatcher resume" >&2
            exit 1
          fi

          node "$TEST"

          grep -F '"authorizationConsumed": true' "$CONFIG" >/dev/null
          grep -F '"reusable": false' "$CONFIG" >/dev/null
          grep -F '"singleUseExecution": true' "$CONFIG" >/dev/null
          grep -F '"sameRegistryExecutionInstanceInjected": true' "$CONFIG" >/dev/null
          grep -F '"registryFactoryInvocationCount": 1' "$CONFIG" >/dev/null
          grep -F '"registryRegisterExecuted": true' "$CONFIG" >/dev/null
          grep -F '"registryLookupExecuted": true' "$CONFIG" >/dev/null
          grep -F '"registryResolveExecuted": true' "$CONFIG" >/dev/null
          grep -F '"resumeSurfaceInvoked": true' "$CONFIG" >/dev/null
          grep -F '"resumedOrchestrationDecision": "blocked_repository_only"' "$CONFIG" >/dev/null
          grep -F '"registryReleaseExecuted": true' "$CONFIG" >/dev/null
          grep -F '"entryCountAfterRelease": 0' "$CONFIG" >/dev/null
          grep -F '"singleUseExecutorRemoved": true' "$CONFIG" >/dev/null
          grep -F '"reexecutionAllowed": false' "$CONFIG" >/dev/null
          grep -F '"activeExecuteHandlerInvoked": false' "$CONFIG" >/dev/null
          grep -F '"repositoryOperationInvoked": false' "$CONFIG" >/dev/null
          grep -F '"credentialReadExecuted": false' "$CONFIG" >/dev/null
          grep -F '"networkExecuted": false' "$CONFIG" >/dev/null
          grep -F '"runtimeActivated": false' "$CONFIG" >/dev/null
          grep -F '"realtimeActivated": false' "$CONFIG" >/dev/null
          grep -F '"productionChanged": false' "$CONFIG" >/dev/null

      - name: Matrix governance and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
