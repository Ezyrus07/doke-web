name: Doke UX-CSS-DEBT-069 Ranking Reporter

on:
  push:
    branches:
      - diag/ux-css-debt-069-tracked-residual-ranking

permissions:
  contents: write

jobs:
  ranking-reporter:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 23cc5c7496897f0d9b742039598574ffb2b93dfb
      PARENT_SHA: c7f8397821698f4445dad3b20e5aea2ff3d57cf3
      PRIOR_068_FILE: assets/css/components/internal/list-page-toolbar.css
      PRIOR_068_BLOB: 38ac675769070b5f5dae6eaa7b3bdb1bfd7e4c82
      SOURCE_SHA: 84e16e9a4880b6a24ce6a101223ec53cbbe2b8d7
      SOURCE_BLOB: 44986bf97ecd73ee962326376eb52968dfa85d40
      DIAG_BRANCH: diag/ux-css-debt-069-tracked-residual-ranking
      RESULT_FILE: .diagnostics/ux-css-debt-069-ranking.txt
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-068 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact checkpoint and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$PRIOR_068_FILE")" = "$PRIOR_068_BLOB"
          git fetch origin "$SOURCE_SHA" --depth=1
          test "$(git rev-parse "$SOURCE_SHA:.github/workflows/diag-ux-css-debt-039-tracked-residual-ranking.yml")" = "$SOURCE_BLOB"
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install and generate canonical active graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures

      - name: Rank and record evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node <<'NODE' > /tmp/ranking-body.log 2>&1
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;
          const normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}
          const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winnerLine:l.line,winnerValue:l.value,winnerImportant:l.important});if(!l||d.important||!l.important)last.set(k,d)}return{declarations:ds,dead}}
          if(active.size!==401||high.length!==37)throw new Error(`baseline drift ${active.size}/${high.length}`);
          const guards=[['assets/css/components/before-after-workers-preview/publication-light-modal.css',75,0,'054'],['assets/css/patterns/settings-shell.css',104,0,'055'],['assets/css/components/before-after-workers-preview/mobile-comment-sheets.css',302,0,'056'],['assets/css/components/chat-composer.css',125,0,'057'],['assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css',216,0,'058'],['assets/css/components/media-lightbox.css',280,0,'059'],['assets/css/components/overlays/financial-modal-system.css',645,0,'060'],['assets/css/components/overlays/action-modal-system.css',264,0,'061'],['assets/css/components/forms/form-flow-comfort.css',113,0,'062'],['assets/css/components/panels/mobile-panel.css',94,0,'063'],['assets/css/components/layout/doke-layout-system.css',108,0,'064'],['assets/css/components/ui-surface/buttons-close.css',110,0,'065'],['assets/css/components/internal/filter-select-standard.css',404,0,'066'],['assets/css/components/overlays/modal-visual-contract.css',475,0,'067'],['assets/css/components/internal/list-page-toolbar.css',269,0,'068']];for(const [f,d,dead,l] of guards){const x=meta.get(f);if(!x)throw new Error(`${l} missing`);const p=parse(x.text);if(p.declarations.length!==d||p.dead.length!==dead)throw new Error(`${l} drift ${p.declarations.length}/${p.dead.length}`)}
          const pagesFor=target=>{const out=[];for(const p of report.pageAssets){const seen=new Set(),stack=[...p.css.filter(f=>meta.has(f))];let hit=false;while(stack.length){const f=stack.pop();if(seen.has(f)||!meta.has(f))continue;seen.add(f);if(f===target){hit=true;break}for(const n of meta.get(f).imports)if(meta.has(n))stack.push(n)}if(hit)out.push(p.page)}return out.sort()};
          const parents=new Map([...active].map(f=>[f,[]]));for(const [p,x] of meta)if(active.has(p))for(const c of x.imports)if(parents.has(c))parents.get(c).push(p);
          const parsed=new Map([...active].map(f=>[f,parse(meta.get(f).text)]));
          const candidates=[...active].map(file=>{const x=meta.get(file),p=parsed.get(file),pages=pagesFor(file),sels=[...new Set(p.dead.map(d=>d.selector))],identical=p.dead.filter(d=>d.value===d.winnerValue&&d.important===d.winnerImportant).length;return{file,decl:p.declarations.length,dead:p.dead.length,selectors:sels.length,selectorList:sels,pages:pages.length,pageList:pages,important:x.important,bytes:x.size,parents:(parents.get(file)||[]).sort(),identical,changed:p.dead.length-identical,highRisk:high.includes(file),rows:p.dead.sort((a,b)=>a.line-b.line)}}).filter(r=>r.dead);
          const pageCandidates=candidates.filter(r=>r.file.includes('/pages/'));const total=candidates.reduce((a,r)=>a+r.dead,0),files=candidates.length,highDead=candidates.filter(r=>r.highRisk).length;
          if(files!==6||total!==41||highDead!==0)throw new Error(`residual drift ${files}/${total}/${highDead}`);if(pageCandidates.length!==0)throw new Error(`page residual returned ${pageCandidates.map(r=>r.file).join(',')}`);
          candidates.sort((a,b)=>(a.pages-b.pages)||(a.dead-b.dead)||(a.selectors-b.selectors)||(a.important-b.important)||(a.changed-b.changed)||(a.bytes-b.bytes)||a.file.localeCompare(b.file));
          console.log('BASE|active=401|high=37|files=6|dead=41|highDead=0|pageResidual=0|eligibility=all-active-after-pages-exhausted');candidates.forEach((r,i)=>console.log(`TOP${i}|file=${r.file}|decl=${r.decl}|dead=${r.dead}|selectors=${r.selectors}|pages=${r.pages}|important=${r.important}|bytes=${r.bytes}|highRisk=${r.highRisk}|parents=${r.parents.join(',')||'-'}|pageList=${r.pageList.join(',')||'-'}|selectorList=${r.selectorList.join(' <OR> ')}|identical=${r.identical}|changed=${r.changed}`));
          const r=candidates[0];if(!r)throw new Error('no residual candidate');if(r.highRisk)throw new Error('TOP0 high risk');for(const d of r.rows)console.log(`ROW|line=${d.line}|selector=${d.selector}|prop=${d.property}|value=${d.value}|imp=${d.important}|ctx=${d.context||'<global>'}|winnerLine=${d.winnerLine}|winnerValue=${d.winnerValue}|winnerImp=${d.winnerImportant}`);console.log(`RANKING PASS|top0=${r.file}|dead=${r.dead}|highRisk=${r.highRisk}|pageResidual=0|residual=6/41/0`);
          NODE
          code=$?
          set -e
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "WORKFLOW_SHA=$GITHUB_SHA"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "EXIT_CODE=$code"
            cat /tmp/ranking-body.log
          } > /tmp/ranking.log
          cat /tmp/ranking.log

          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$PRIOR_068_FILE")" = "$PRIOR_068_BLOB"

          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH"
          git checkout -B diag-output "origin/$DIAG_BRANCH"
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/ranking.log "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "diag: record UX-CSS-DEBT-069 ranking [skip ci]"
            git push origin "HEAD:refs/heads/$DIAG_BRANCH"
          fi
          exit "$code"
