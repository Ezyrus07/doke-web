name: DSP-A04 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/dsp-a04-matrix-refresh-temporary.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Regenerate matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Enforce allowlist
        run: |
          mapfile -t changed < <(git status --short | sed 's/^...//')
          for path in "${changed[@]}"; do
            case "$path" in
              docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json|.github/workflows/dsp-a04-matrix-refresh-temporary.yml) ;;
              *) echo "Unexpected matrix refresh change: $path" >&2; exit 1 ;;
            esac
          done

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git rm .github/workflows/dsp-a04-matrix-refresh-temporary.yml
          git commit -m "docs(matrix): refresh after DSP-A04 boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
