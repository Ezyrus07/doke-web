name: Doke UX CSS Important 010 Four Marker Runtime R1
on: [push]
permissions: {contents: write}
jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 839d20efdaf28d99508397722fb61cedafcdb556
      TARGET_FILE: assets/css/components/cards/mobile-card-contract.css
      TARGET_BLOB: 46ede4f081a686155ab4035581cbd8a796a831c9
      DIAG_BRANCH: diag/ux-css-important-010-four-marker-runtime-r1
      RESULT_FILE: .diagnostics/ux-css-important-010-four-marker-runtime-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/proof.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;
          const P=fs.readFileSync(f,'utf8'); if((P.match(/!important\b/g)||[]).length!==4) throw Error('parent important !=4');
          function removeProps(src,selector,props){const key=selector+' {';const i=src.indexOf(key);if(i<0||src.indexOf(key,i+1)>=0)throw Error('selector '+selector);const b=src.indexOf('{',i),e=src.indexOf('}',b);let block=src.slice(b+1,e);for(const prop of props){const re=new RegExp('('+prop.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*:[^;]+?)\\s*!important\\b');if(!re.test(block))throw Error('prop '+prop);block=block.replace(re,'$1')}return src.slice(0,b+1)+block+src.slice(e)}
          const sGap=':is(.service-grid, .service-grid--compact, .service-cards-grid, .results-grid, .results-empty__grid, .profile-services-results)';
          const sCols=':is(.service-grid, .service-grid--compact, .service-cards-grid, .profile-services-results):not([data-more-services-grid])';
          const sCmp=':is(.comparison-card__visual, .profile-posts-stack .comparison-card__visual, body.home-index-shell .comparison-card__visual)';
          let safe=removeProps(P,sCols,['grid-template-columns']);safe=removeProps(safe,sCmp,['min-height','aspect-ratio']);
          let all=removeProps(safe,sGap,['gap']);
          const H=s=>crypto.createHash('sha256').update(Buffer.from(s)).digest('hex');
          if((safe.match(/!important\b/g)||[]).length!==1||(all.match(/!important\b/g)||[]).length!==0)throw Error('candidate counts');
          fs.writeFileSync('/tmp/safe.css',safe);fs.writeFileSync('/tmp/all.css',all);
          console.log(`CANDIDATE SAFE|sha256=${H(safe)}|bytes=${Buffer.byteLength(safe)}|important=4->1|removed=3|preserved=gap`);
          console.log(`NEGATIVE ALL4|sha256=${H(all)}|bytes=${Buffer.byteLength(all)}|important=4->0|removed=4`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,variants={parent:fs.readFileSync('/tmp/parent.css','utf8'),safe:fs.readFileSync('/tmp/safe.css','utf8'),all4:fs.readFileSync('/tmp/all.css','utf8')},browser=await chromium.launch({headless:true}),widths=[359,379,380,381,430,560,561],modalWidths=new Set([359,380,560]),H=b=>crypto.createHash('sha256').update(b).digest('hex');
          const items=Array.from({length:8},(_,i)=>({id:'i10-'+i,serviceId:'i10-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'prof'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro','rapido']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));await p.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,body:''}));await p.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:200,body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,body:''}));await p.route('https://unpkg.com/**',r=>r.fulfill({status:200,body:''}));await p.goto(`http://127.0.0.1:4173/index.html?i010=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');if(!a||!b)throw Error('grids missing');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(Doke.publicServiceCard.create(x,{results:true})))},items);if(state==='modal'){await p.waitForFunction(()=>Boolean(window.DokeHomeBeforeAfter?.create),null,{timeout:6000});await p.evaluate(()=>window.DokeHomeBeforeAfter.create());await p.locator('[data-before-after-id="case-bathroom"]').click();await p.waitForFunction(()=>{const e=document.querySelector('[data-before-after-preview]');return Boolean(e&&!e.hidden&&e.getAttribute('aria-hidden')!=='true')},null,{timeout:3000})}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(()=>{const g=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{display:c.display,gap:c.gap,grid:c.gridTemplateColumns,minHeight:c.minHeight,aspect:c.aspectRatio,rect:[Math.round(r.x*1000)/1000,Math.round(r.y*1000)/1000,Math.round(r.width*1000)/1000,Math.round(r.height*1000)/1000]}};return{featured:g('#featured-services-track'),more:g('[data-more-services-grid]'),cmp:g('.comparison-card__visual'),cards:document.querySelectorAll('.doke-ad-card').length,workers:document.querySelectorAll('.video-card').length}});if(data.cards<8||data.workers<6||(state==='modal'&&!data.cmp))throw Error('anatomy '+JSON.stringify(data));const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
          const states=[];for(const w of widths){states.push([w,'default']);if(modalWidths.has(w))states.push([w,'modal'])}const out={};for(const [name,css] of Object.entries(variants)){fs.writeFileSync(f,css);out[name]={};for(const [w,s] of states)out[name][`${w}-${s}`]=await cap(w,s,name)}
          function diff(a,b){let meta=0,shots=0,errors=0,keys=[];for(const k of Object.keys(a)){errors+=a[k].errs.length+b[k].errs.length;if(JSON.stringify(a[k].data)!==JSON.stringify(b[k].data)){meta++;keys.push(k)}if(a[k].png!==b[k].png){shots++;if(!keys.includes(k))keys.push(k)}}return{meta,shots,errors,keys}}
          const safe=diff(out.parent,out.safe),neg=diff(out.parent,out.all4);const parentGap=out.parent['380-default'].data.featured?.gap,safeGap=out.safe['380-default'].data.featured?.gap,allGap=out.all4['380-default'].data.featured?.gap;console.log(`SAFE PARITY|states=${states.length}|metadataDiffs=${safe.meta}|screenshotDiffs=${safe.shots}|pageErrors=${safe.errors}|featuredGapParent=${parentGap}|featuredGapSafe=${safeGap}`);console.log(`NEGATIVE CONTROL|states=${states.length}|metadataDiffs=${neg.meta}|screenshotDiffs=${neg.shots}|pageErrors=${neg.errors}|featuredGapParent=${parentGap}|featuredGapAll4=${allGap}|diffKeys=${neg.keys.join(',')}`);if(safe.meta||safe.shots||safe.errors)throw Error('safe parity failed');if(neg.meta===0&&neg.shots===0)throw Error('negative control did not diverge');if(parentGap!==safeGap)throw Error('safe gap drift');if(parentGap===allGap)throw Error('negative gap did not diverge');await browser.close();fs.writeFileSync(f,variants.parent)})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PROOF=${{ steps.proof.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE SAFE|NEGATIVE ALL4|SAFE PARITY|NEGATIVE CONTROL)\|' /tmp/proof.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 220 /tmp/proof.log || true; fi; } >/tmp/out.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 010 four-marker runtime r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS