name: Doke Temporary MSG-A03 Server Command Applicator

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a03-apply-temporary.yml'

permissions:
  contents: write

concurrency:
  group: msg-001-a03-server-command-applicator
  cancel-in-progress: false

jobs:
