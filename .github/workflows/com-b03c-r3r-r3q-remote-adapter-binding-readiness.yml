name: COM-B03C-R3R R3Q Remote Adapter Binding Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r3r.js'
      - 'config/com-b03c-r3r-r3q-remote-adapter-binding-readiness.json'
      - 'scripts/test-com-b03c-r3r-r3q-remote-adapter-binding-readiness.js'
      - 'docs/validation/COM-B03C-R3R-R3Q-REMOTE-ADAPTER-BINDING-READINESS.json'
      - '.github/workflows/com-b03c-r3r-r3q-remote-adapter-binding-readiness.yml'

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3r.js
          node --check scripts/test-com-b03c-r3r-r3q-remote-adapter-binding-readiness.js
      - name: R3R repository binding contract
        run: node scripts/test-com-b03c-r3r-r3q-remote-adapter-binding-readiness.js
      - name: Pre-remote hard block
        run: |
          test ! -e config/com-b03c-r3r-r3q-remote-adapter-binding-staging-trigger.json
          ! grep -Eq 'secrets\.|environment:' .github/workflows/com-b03c-r3r-r3q-remote-adapter-binding-readiness.yml
          node - <<'NODE'
          const c=require('./config/com-b03c-r3r-r3q-remote-adapter-binding-readiness.json');
          const e=require('./docs/validation/COM-B03C-R3R-R3Q-REMOTE-ADAPTER-BINDING-READINESS.json');
          for(const value of Object.values(c.prohibitedPreparation)) if(value !== false) process.exit(1);
          if(c.binding?.fullyBound !== false || c.binding?.missingCapabilities?.length !== 2) process.exit(1);
          if(e.authority?.remoteAdapterActivation !== false || e.authority?.remoteExecution !== false || e.authority?.stagingRead !== false || e.authority?.stagingMutation !== false) process.exit(1);
          if(e.effects?.remoteCredentialReadExecuted !== false || e.effects?.remoteDependencyLoadExecuted !== false || e.effects?.remoteClientInstantiated !== false || e.effects?.stagingAccessExecuted !== false) process.exit(1);
          if(e.binding?.executableSqlPrepared !== false || e.exactRootCauseProven !== false || e.causalPromotionAllowed !== false) process.exit(1);
          NODE
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
