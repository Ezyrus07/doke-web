name: UX-CSS-IMPORTANT-035 Residual Ranking Diagnostic R1

on:
  push:
    branches:
      - diag/ux-css-important-035-ranking-r1
    paths:
      - .github/workflows/0000-temp-ux-css-important-035-ranking-r1.yml

permissions:
  contents: write

jobs:
  rank035r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CERTIFIED_034_HEAD: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      DIAG_WORKFLOW: .github/workflows/0000-temp-ux-css-important-035-ranking-r1.yml
      RESULT: .diagnostics/ux-css-important-035-ranking-r1.json
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diag/ux-css-important-035-ranking-r1
          fetch-depth: 0

      - name: Freeze certified 034 lineage and diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CERTIFIED_034_HEAD" HEAD
          actual="$(git diff --name-only "$CERTIFIED_034_HEAD" HEAD | sort)"
          expected1="$DIAG_WORKFLOW"
          expected2="$(printf '%s\n' "$DIAG_WORKFLOW" "$RESULT" | sort)"
          test "$actual" = "$expected1" || test "$actual" = "$expected2"
          test -z "$(git diff --name-only "$CERTIFIED_034_HEAD" HEAD -- 'assets/css/**')"

      - name: Compute exact post-034 residual ranking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESULT")"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ROOT = process.cwd();
          const CSS_ROOT = path.join(ROOT, 'assets', 'css');
          const RESULT = process.env.RESULT;
          const protectedFiles = new Map([
            ['assets/css/pages/home/mobile-composition.css', 'UX-CSS-IMPORTANT-006'],
            ['assets/css/components/cards/mobile-card-contract.css', 'UX-CSS-IMPORTANT-010'],
            ['assets/css/components/shell/mobile-base-stability.css', 'UX-CSS-IMPORTANT-020'],
            ['assets/css/pages/home/mobile-hero-feed.css', 'UX-CSS-IMPORTANT-021'],
          ]);
          function walk(dir) {
            return fs.readdirSync(dir, {withFileTypes:true}).flatMap(e => {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) return walk(full);
              return e.isFile() && e.name.endsWith('.css') ? [full] : [];
            });
          }
          function rel(file) { return path.relative(ROOT, file).replace(/\\/g, '/'); }
          function risk(file, count) {
            const r = rel(file);
            if (r.includes('service-card')) return 'excluded-service-card';
            if (r.includes('/core/') || r.includes('/layout/') || r.includes('shell') || r.includes('sidebar') || r.includes('header')) return 'high-baseline-required';
            if (count >= 25) return 'high-baseline-required';
            if (count >= 5) return 'medium-baseline-required';
            return 'low-review-candidate';
          }
          const residuals = walk(CSS_ROOT).map(file => {
            const content = fs.readFileSync(file, 'utf8');
            const importantCount = (content.match(/!important\b/g) || []).length;
            const filePath = rel(file);
            return {file:filePath, importantCount, risk:risk(file, importantCount), protectedBy:protectedFiles.get(filePath)||null};
          }).filter(x => x.importantCount > 0 && x.risk !== 'excluded-service-card');
          const riskOrder = {'low-review-candidate':0,'medium-baseline-required':1,'high-baseline-required':2};
          const sortQueue = (a,b) => riskOrder[a.risk]-riskOrder[b.risk] || a.importantCount-b.importantCount || a.file.localeCompare(b.file);
          const lowAll = residuals.filter(x=>x.risk==='low-review-candidate').sort(sortQueue);
          const protectedResiduals = residuals.filter(x=>x.protectedBy).sort(sortQueue);
          const eligibleQueue = residuals.filter(x=>!x.protectedBy).sort(sortQueue);
          const out = {
            certified034Head: process.env.CERTIFIED_034_HEAD,
            totalResidualImportant: residuals.reduce((n,x)=>n+x.importantCount,0),
            residualFileCount: residuals.length,
            lowAllImportant: lowAll.reduce((n,x)=>n+x.importantCount,0),
            lowAll,
            protectedResiduals,
            eligibleQueue,
            nextEligible: eligibleQueue[0] || null,
          };
          if (out.lowAllImportant !== 2) throw new Error(`Expected low-review total=2, got ${out.lowAllImportant}`);
          if (eligibleQueue.some(x=>x.risk==='low-review-candidate')) throw new Error('Unexpected unprotected low candidate');
          if (!out.nextEligible) throw new Error('No eligible residual candidate');
          fs.writeFileSync(RESULT, JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Publish diagnostic evidence only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short -- 'assets/css/**')"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          if git diff --cached --quiet; then
            echo 'ranking evidence already current'
            exit 0
          fi
          git commit -m 'test(ux): publish 035 residual ranking R1 evidence'
          git push origin HEAD:diag/ux-css-important-035-ranking-r1
