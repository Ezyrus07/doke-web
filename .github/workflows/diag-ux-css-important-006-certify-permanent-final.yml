name: Doke UX CSS Important 006 Certify Permanent Final
on:
  push:
    branches: [diag/ux-css-important-006-certify-permanent-final]
    paths: [.github/workflows/diag-ux-css-important-006-certify-permanent-final.yml]
permissions: {contents: write}
jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c84dd3fcacae7db5c616d2eeab745a864f31ae6b
      PARENT_SHA: 24b49e5693f24621a1024b94c33c8ba6e18b12c0
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      TARGET_BLOB: 2830b6a99e95fa30197341e718935edd5afd1c45
      PARENT_BLOB: 896730319ae0852caca8a0f93cd1507608dd9894
      EXPECTED_SHA256: 2638bc50d228a872d81e9da91ebd76e07d084232d70593f06e9e05e1444717ed
      EXPECTED_BYTES: '9136'
      PERMANENT: ux/ux-css-important-006-home-mobile-composition-cascade
      DIAG_BRANCH: diag/ux-css-important-006-certify-permanent-final
      RESULT_FILE: .diagnostics/ux-css-important-006-certification-final.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: certify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/cert.log) 2>&1
          WORKFLOW_SHA="$(git rev-parse HEAD)"; export WORKFLOW_SHA
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          TARGET_TREE="$(git rev-parse HEAD^{tree})"; ACTUAL_BLOB="$(git hash-object "$TARGET_FILE")"; test "$ACTUAL_BLOB" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),f=process.env.TARGET_FILE;
          const z=fs.readFileSync(f),h=crypto.createHash('sha256').update(z).digest('hex');if(h!==process.env.EXPECTED_SHA256||String(z.length)!==process.env.EXPECTED_BYTES||(z.toString().match(/!important\b/g)||[]).length!==6)throw Error(`target identity ${h}/${z.length}`);
          const stat=cp.execFileSync('git',['diff','--numstat',`${process.env.PARENT_SHA}..${process.env.TARGET_SHA}`,'--',f],{encoding:'utf8'}).trim().split(/\s+/);if(stat[0]!=='17'||stat[1]!=='17'||stat[2]!==f)throw Error(`target diff ${stat}`);const names=cp.execFileSync('git',['diff','--name-only',`${process.env.PARENT_SHA}..${process.env.TARGET_SHA}`],{encoding:'utf8'}).trim();if(names!==f)throw Error(`files ${names}`);console.log(`IDENTITY PASS|sha=${process.env.TARGET_SHA}|parent=${process.env.PARENT_SHA}|tree=${process.env.TARGET_TREE||''}|targetBlob=${process.env.TARGET_BLOB}|sha256=${h}|bytes=${z.length}|fullHistory=1|files=1|additions=17|deletions=17|important=6`);
          NODE
          # Independent byte reconstruction from exact parent.
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f='/tmp/parent.css',esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const parent=fs.readFileSync(f,'utf8');if((parent.match(/!important\b/g)||[]).length!==23)throw Error('parent count');let s=parent.replace(/\s*!important\b/g,'');function restore(sel,ps){const re=new RegExp(esc(sel)+'\\s*\\{','g'),all=[...s.matchAll(re)].map(m=>{const b=s.indexOf('{',m.index),e=s.indexOf('}',b);return{b,e,block:s.slice(b+1,e)}}),hits=all.filter(x=>ps.every(p=>new RegExp(`(^|\\n)\\s*${esc(p)}\\s*:`,'m').test(x.block)));if(hits.length!==1)throw Error(`restore ${sel} ${hits.length}`);let block=hits[0].block;for(const p of ps)block=block.replace(new RegExp(`(^|\\n)(\\s*${esc(p)}\\s*:[^;]+);`,'m'),'$1$2 !important;');s=s.slice(0,hits[0].b+1)+block+s.slice(hits[0].e)}restore('body.home-index-shell .featured-services,\n  body.home-index-shell .before-after,\n  body.home-index-shell .short-videos',['overflow']);restore('body.home-index-shell .doke-search-panel__form',['position','overflow']);restore('body.home-index-shell .home-search-hero__field::before,\n  body.home-index-shell .home-search-hero__field::after',['display']);restore('body.home-index-shell .featured-services .content-rail',['overflow']);restore('body.home-index-shell #featured-services-track,\n  body.home-index-shell #before-after-track',['grid-template-columns']);const target=fs.readFileSync(process.env.TARGET_FILE,'utf8');if(s!==target)throw Error('reconstruction mismatch');const h=crypto.createHash('sha256').update(Buffer.from(s)).digest('hex');if(h!==process.env.EXPECTED_SHA256||(s.match(/!important\b/g)||[]).length!==6)throw Error('reconstruction identity');console.log('RECONSTRUCTION PASS|byteIdentical=1|important=23->6|priorityMarkersRemoved=17|declarationsRemoved=0');
          NODE
          npm ci --ignore-scripts
          # Responsive baseline from exact parent, validation on target.
          git checkout --detach "$PARENT_SHA" >/dev/null; node scripts/generate-responsive-index-baseline.js; cp reports/responsive-index-baseline.json /tmp/responsive-index-baseline.json
          git checkout --detach "$TARGET_SHA" >/dev/null; mkdir -p reports; cp /tmp/responsive-index-baseline.json reports/responsive-index-baseline.json
          npm run test:responsive-contract | tee /tmp/responsive.log; grep -q 'Checks: 893' /tmp/responsive.log; grep -q 'Failures: 0' /tmp/responsive.log; grep -q 'Skips: 277' /tmp/responsive.log; echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|baselineSource=exact-parent'
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflicts');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`)
          NODE
          npm run audit:shared-app-header-contract; npm run audit:mobile-shell-location-contract; npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log; grep -q 'Duplicate groups: 0' /tmp/dup.log; grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log; grep -q 'Domains: 23' /tmp/domain.log; grep -q 'Critical flows: 15' /tmp/domain.log; grep -q 'Average maturity: 2.91/6' /tmp/domain.log; grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures; npm run audit:important-reduction-plan; npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8')),s=b.summary;if(s.totalImportant!==11198||s.outsideServiceCardImportant!==11136||s.filesWithImportant!==34)throw Error(`important ${JSON.stringify(s)}`);if(p.summary.affectedFiles!==33||p.summary.totalImportantOutsideServiceCard!==11136||p.summary.lowRiskFileCount!==0||p.summary.byRisk?.['high-baseline-required']!==11130||p.summary.byRisk?.['medium-baseline-required']!==6)throw Error(`plan ${JSON.stringify(p.summary)}`);console.log('IMPORTANT BASELINE PASS|total=11198|outsideServiceCard=11136|files=34|targetImportant=6|delta=-17');console.log('QUEUE PASS|affectedFiles=33|lowRiskFiles=0|highBaselineRequired=11130|mediumBaselineRequired=6');
          NODE
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`)
          NODE
          echo "PROOF TRANSFER PASS|ranking=32147092848|delta=32151811081|runtime=32152326279|governance=32152378720|candidateSha256=$EXPECTED_SHA256|dataDiffs=0|screenshotDiffs=0|productRenderer=1|syntheticDOM=0"
          echo 'GOVERNANCE PASS|duplicates=0/0|domain=23/15/2.91/12'
          test "$(git ls-remote origin "refs/heads/$PERMANENT" | awk '{print $1}')" = "$TARGET_SHA"
          echo "TARGET_TREE=$TARGET_TREE"; echo "AUDIT_EXIT=$code"; echo 'RESULT=PASS'
      - id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail; git checkout -B workflow-restore "$GITHUB_SHA" >/dev/null; git reset --hard "$GITHUB_SHA" >/dev/null; git clean -fdx >/dev/null
      - name: Publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.certify.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "CERTIFY=${{ steps.certify.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(IDENTITY PASS|RECONSTRUCTION PASS|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT BASELINE PASS|QUEUE PASS|DEPENDENCY PASS|PROOF TRANSFER PASS|GOVERNANCE PASS|TARGET_TREE=|AUDIT_EXIT=|RESULT=)' /tmp/cert.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 320 /tmp/cert.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 006 final certification [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
