name: TEMP UX-CSS-IMPORTANT-044 Permanent Certification

on:
  push:
    branches: [diag/ux-css-important-044-doke-shell-contract-permanent-certifier]
    paths: [.github/workflows/0000-temp-ux-css-important-044-doke-shell-contract-permanent-certifier.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  permanent-certifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DIAG_SHA: ${{ github.sha }}
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-044-doke-shell-contract-permanent-certifier.yml
      RECEIPT_FILE: .diagnostics/ux-css-important-044-doke-shell-contract-permanent-certification.json
      OUTPUT_BRANCH: diag/ux-css-important-044-doke-shell-contract-permanent-certifier
      PARENT_SHA: 69d7aa33b199ff6908c5f6244526d2fae31374ce
      PARENT_TREE: 72119fd05d33a116ff342393f1711adf648e4b7c
      PERM_SHA: 03350507015579bfc60e413f1b3dfa97f4371f68
      PERM_TREE: fb684d8ec8e96cf1a2d0ada42f7415259e084650
      TARGET_FILE: assets/css/components/shell/doke-shell-contract.css
      PARENT_BLOB: c167c0b747dbb4465cdaf096b5a9225fa3d69059
      PERM_BLOB: 5000b0aa60f6d93e123bc17811887e57668d4988
      PERM_SHA256: fa114edbfe30797719983d9f599b4efb589dd89f57cd332ecb779bbe9b1b9845
      PERM_BYTES: '205262'
      PARENT_GLOBAL: '2783'
      PERM_GLOBAL: '231'
      PR_NUMBER: '374'
      BASE_BRANCH: ux/ux-css-important-043-home-tablet-v2-dormant-priority
      PERM_BRANCH: ux/ux-css-important-044-doke-shell-contract-dormant-priority
      R1_BRANCH: diag/ux-css-important-044-doke-shell-contract-r1b
      R1_FILE: .diagnostics/ux-css-important-044-doke-shell-contract-r1b.json
      R1_BLOB: 136dd31e71633dbe0213f268ca5ea3c8a15e6828
      R2_BRANCH: diag/ux-css-important-044-doke-shell-contract-candidate-r2
      R2_FILE: .diagnostics/ux-css-important-044-doke-shell-contract-candidate-r2.json
      R2_BLOB: df0dae7d9bd0a9bdd13a14808c3fa0b4364f138c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}

      - name: Freeze permanent identity lineage and PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PERM_SHA^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PERM_SHA^")" = "$PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git merge-base "$PARENT_SHA" "$PERM_SHA")" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..$PERM_SHA")" = 1
          test "$(git merge-base "$PERM_SHA" "$DIAG_SHA")" = "$PERM_SHA"
          test "$(git rev-list --count "$PERM_SHA..$DIAG_SHA")" = 1
          test "$(git diff --name-only "$PERM_SHA"..."$DIAG_SHA")" = "$WORKFLOW_FILE"
          test "$(git diff --name-only "$PARENT_SHA"..."$PERM_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"..."$PERM_SHA")" = $'2552\t2552\t'"$TARGET_FILE"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >/tmp/pr.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/pr.json','utf8'));
          if(!(p.state==='open'&&p.draft===true&&p.merged_at===null&&p.mergeable===true&&p.head?.ref===process.env.PERM_BRANCH&&p.head?.sha===process.env.PERM_SHA&&p.base?.ref===process.env.BASE_BRANCH&&p.base?.sha===process.env.PARENT_SHA))throw Error(`PR mismatch ${p.state}/${p.draft}/${p.mergeable}/${p.head?.sha}/${p.base?.sha}`);
          fs.writeFileSync('/tmp/pr-facts.json',JSON.stringify({number:p.number,state:p.state,draft:p.draft,merged:false,mergeable:p.mergeable,head:p.head.sha,base:p.base.sha},null,2)+'\n');
          NODE

      - name: Transfer exact R1b and R2 receipts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$R1_BRANCH:refs/remotes/origin/$R1_BRANCH" "refs/heads/$R2_BRANCH:refs/remotes/origin/$R2_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R1_BRANCH:$R1_FILE")" = "$R1_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R2_BRANCH:$R2_FILE")" = "$R2_BLOB"
          git show "refs/remotes/origin/$R1_BRANCH:$R1_FILE" >/tmp/r1.json
          git show "refs/remotes/origin/$R2_BRANCH:$R2_FILE" >/tmp/r2.json
          node <<'NODE'
          const fs=require('fs'),r1=JSON.parse(fs.readFileSync('/tmp/r1.json')),r2=JSON.parse(fs.readFileSync('/tmp/r2.json'));
          if(r1.result!=='PASS_WHOLE_FILE_DORMANT'||r1.product.sha!==process.env.PARENT_SHA||r1.product.tree!==process.env.PARENT_TREE||r1.product.globalImportant!==2783||r1.product.globalScope!=='assets/css/**'||r1.target.blob!==process.env.PARENT_BLOB||r1.target.important!==2552||r1.target.importantSites!==2552||r1.target.unresolvedImportantSites!==0||r1.reach.wholeFileDormant!==true||r1.reach.browserReconciliationRequired!==false||r1.cascade.exactSelectorPropertyCollisionKeys!==0)throw Error('R1b mismatch');
          if(r2.result!=='PASS'||r2.parent.sha!==process.env.PARENT_SHA||r2.candidate.gitBlob!==process.env.PERM_BLOB||r2.candidate.sha256!==process.env.PERM_SHA256||r2.candidate.importantBefore!==2552||r2.candidate.importantAfter!==0||r2.candidate.candidateGlobal!==231||r2.staticMatrix.introducedRegressions!==0||r2.staticMatrix.criteriaRelaxed!==0||r2.browserRequired!==false)throw Error('R2 mismatch');
          NODE

      - name: Independently reconstruct candidate and canonical global debt
        shell: bash
        run: |
          set -euo pipefail
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent.css
          git show "$PERM_SHA:$TARGET_FILE" >/tmp/permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const p=fs.readFileSync('/tmp/parent.css','utf8'),c=fs.readFileSync('/tmp/permanent.css','utf8'),rebuilt=p.replace(/\s*!important\b/gi,'');
          const before=(p.match(/!important\b/gi)||[]).length,after=(c.match(/!important\b/gi)||[]).length;
          if(before!==2552||after!==0||rebuilt!==c)throw Error(`reconstruction ${before}->${after} eq=${rebuilt===c}`);
          const sha256=crypto.createHash('sha256').update(c).digest('hex');if(sha256!==process.env.PERM_SHA256||Buffer.byteLength(c)!==Number(process.env.PERM_BYTES))throw Error('hash/bytes');
          const css=cp.execFileSync('git',['ls-tree','-r','--name-only',process.env.PARENT_SHA,'assets/css'],{encoding:'utf8'}).trim().split('\n').filter(x=>x.endsWith('.css'));
          const count=sha=>css.reduce((n,f)=>n+(cp.execFileSync('git',['show',`${sha}:${f}`],{encoding:'utf8',maxBuffer:40*1024*1024}).match(/!important\b/gi)||[]).length,0);
          const pg=count(process.env.PARENT_SHA),cg=count(process.env.PERM_SHA);if(pg!==Number(process.env.PARENT_GLOBAL)||cg!==Number(process.env.PERM_GLOBAL))throw Error(`global ${pg}->${cg}`);
          fs.writeFileSync('/tmp/comparison.json',JSON.stringify({parent:process.env.PARENT_SHA,parentTree:process.env.PARENT_TREE,permanent:process.env.PERM_SHA,permanentTree:process.env.PERM_TREE,parentBlob:process.env.PARENT_BLOB,permanentBlob:process.env.PERM_BLOB,importantBefore:before,importantAfter:after,globalScope:'assets/css/**',globalBefore:pg,globalAfter:cg,globalDelta:cg-pg,markerOnly:true,selectorsRemoved:0,declarationsRemoved:0,propertiesChanged:0,valuesChanged:0,sha256,bytes:Buffer.byteLength(c),additions:2552,deletions:2552,changedFiles:1,ahead:1,behind:0,mergeBase:process.env.PARENT_SHA},null,2)+'\n');
          NODE

      - name: Independently reprove permanent whole-file dormancy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const cp=require('child_process'),path=require('path'),posix=path.posix,fs=require('fs');
          const SHA=process.env.PERM_SHA,TARGET=process.env.TARGET_FILE;
          const files=cp.execFileSync('git',['ls-tree','-r','--name-only',SHA],{encoding:'utf8'}).trim().split('\n').filter(Boolean),S=new Set(files);
          const read=p=>cp.execFileSync('git',['show',`${SHA}:${p}`],{encoding:'utf8',maxBuffer:40*1024*1024});
          const mask=s=>{let a=[...s],state='code',q='';for(let i=0;i<s.length;i++){if(state==='comment'){a[i]=' ';if(s[i]==='*'&&s[i+1]==='/'){a[i+1]=' ';i++;state='code'}continue}if(state==='string'){a[i]=' ';if(s[i]==='\\'){if(i+1<s.length){a[i+1]=' ';i++}continue}if(s[i]===q)state='code';continue}if(s[i]==='/'&&s[i+1]==='*'){a[i]=a[i+1]=' ';i++;state='comment';continue}if(s[i]==='"'||s[i]==="'"){q=s[i];a[i]=' ';state='string'}}return a.join('')};
          const imports=p=>{const src=mask(read(p)),out=[],rx=/@import\s+(?:url\(\s*)?['"]?([^'"\)\s;]+\.css(?:\?[^'"\)\s;]*)?)['"]?\s*\)?[^;]*;/gi;for(const m of src.matchAll(rx)){let x=m[1].split('?',1)[0].split('#',1)[0];if(/^[a-z]+:\/\//i.test(x))continue;out.push(x.startsWith('/')?x.slice(1):posix.normalize(posix.join(posix.dirname(p),x)))}return out};
          const css=files.filter(p=>p.endsWith('.css')),im=new Map(css.map(p=>[p,imports(p)])),direct=css.filter(p=>(im.get(p)||[]).includes(TARGET)).sort();
          const html=files.filter(p=>p.endsWith('.html')&&!/^(archive|reports|tools|test-results)\//.test(p)),lr=/<link\b[^>]*?href\s*=\s*['"]([^'"]+)['"][^>]*>/gis,starts=new Map(),directHtml=[];
          for(const h of html){const arr=[];for(const m of read(h).matchAll(lr)){let x=m[1].split('?',1)[0].split('#',1)[0];if(!x.endsWith('.css')||/^[a-z]+:\/\//i.test(x))continue;x=x.startsWith('/')?x.slice(1):posix.normalize(posix.join(posix.dirname(h),x));arr.push(x);if(x===TARGET)directHtml.push(h)}starts.set(h,arr)}
          const closure=xs=>{const seen=new Set(),st=[...xs];while(st.length){const p=st.pop();if(seen.has(p)||!S.has(p)||!p.endsWith('.css'))continue;seen.add(p);for(const q of im.get(p)||[])st.push(q)}return seen};const pages=[],loaded=new Set();for(const [h,xs] of starts){const c=closure(xs);for(const x of c)loaded.add(x);if(c.has(TARGET))pages.push(h)}
          const runtime=[];for(const p of files.filter(x=>x.startsWith('assets/js/')&&/\.(?:js|mjs|cjs)$/.test(x))){const t=read(p);if(t.includes(TARGET)||t.includes(posix.basename(TARGET)))runtime.push(p)}
          const d={rootHtmlCount:html.length,loadedCssCount:loaded.size,canonicalLoaded:loaded.has(TARGET),wholeFileDormant:!loaded.has(TARGET)&&!direct.length&&!directHtml.length&&!runtime.length,targetPages:pages.sort(),directImporters:direct,directHtmlRefs:[...new Set(directHtml)].sort(),runtimeJsRefs:runtime.sort(),browserRequired:false,criteriaRelaxed:0};
          if(!d.wholeFileDormant||d.canonicalLoaded||d.targetPages.length||d.directImporters.length||d.directHtmlRefs.length||d.runtimeJsRefs.length)throw Error(JSON.stringify(d));
          fs.writeFileSync('/tmp/dormancy.json',JSON.stringify(d,null,2)+'\n');
          NODE

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PERM_SHA" >/dev/null;git clean -fd >/dev/null;npm ci --ignore-scripts >/dev/null

      - name: Reexecute parent permanent static governance matrix
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/gates.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1";sha="$2";: >"/tmp/${phase}.tsv"
          restore(){ git reset --hard "$sha" >/dev/null 2>&1||exit 90;git clean -fd >/dev/null 2>&1||exit 91; }
          norm(){ sed -E -e 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+-]+Z?/<TIME>/g' -e 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$1"; }
          gate(){ l="$1";shift;restore;log="/tmp/${phase}-${l}.log";set +e;"$@">"$log" 2>&1;rc=$?;set -e;norm "$log">"${log}.norm";h="$(sha256sum "${log}.norm"|awk '{print $1}')";printf '%s\t%s\t%s\n' "$l" "$rc" "$h">>"/tmp/${phase}.tsv";echo "$phase|$l|rc=$rc|hash=$h"; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/gates.sh;/tmp/gates.sh parent "$PARENT_SHA";/tmp/gates.sh permanent "$PERM_SHA"

      - name: Reconcile unchanged criteria
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),parse=f=>new Map(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [l,r,h]=x.split('\t');return[l,{rc:+r,hash:h}]})),p=parse('/tmp/parent.tsv'),c=parse('/tmp/permanent.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'],debt=['important_reduction_plan','global_css_design_system'],rows=[];let introduced=0,relaxed=0;
          for(const l of exact){const a=p.get(l),b=c.get(l);if(!a||!b)throw Error('missing '+l);if(a.rc===0&&b.rc===0&&a.hash===b.hash)rows.push({label:l,classification:'PASS_BOTH_IDENTICAL',parent:a,permanent:b});else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash)rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,permanent:b});else{introduced++;throw Error(`${l} divergence`)}}
          for(const l of debt){const a=p.get(l),b=c.get(l);if(!a||!b)throw Error('missing '+l);if(a.rc===0&&b.rc===0)rows.push({label:l,classification:'PASS_BOTH_EXPECTED_DEBT_DELTA',parent:a,permanent:b});else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash)rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,permanent:b});else if(a.rc!==0&&b.rc===0)rows.push({label:l,classification:'CANDIDATE_IMPROVES_BASELINE',parent:a,permanent:b});else{introduced++;throw Error(`${l} regression`)}}
          const a=p.get('frontend_strict'),b=c.get('frontend_strict');if(!a||!b||a.rc!==b.rc)throw Error('frontend rc');const pl=fs.readFileSync('/tmp/parent-frontend_strict.log','utf8'),cl=fs.readFileSync('/tmp/permanent-frontend_strict.log','utf8'),sig=s=>s.split('\n').filter(x=>x.includes('**CRITICAL**')||x.includes('**WARNING**')).sort();if(JSON.stringify(sig(pl))!==JSON.stringify(sig(cl)))throw Error('frontend critical/warning set changed');rows.push({label:'frontend_strict',classification:a.rc===0?'PASS_BOTH_EXPECTED_DEBT_DELTA':'BASELINE_EQUIVALENT_EXPECTED_DEBT_DELTA',parent:a,permanent:b});
          fs.writeFileSync('/tmp/matrix.json',JSON.stringify({rows,introducedRegressions:introduced,criteriaRelaxed:relaxed},null,2)+'\n');
          NODE

      - name: Restore permanent and publish certification receipt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),r1=JSON.parse(fs.readFileSync('/tmp/r1.json')),out={proof:'UX-CSS-IMPORTANT-044 Permanent Repository Certification',result:'PASS',checkpoint:'UX-CSS-IMPORTANT-044',pr:JSON.parse(fs.readFileSync('/tmp/pr-facts.json')),comparison:JSON.parse(fs.readFileSync('/tmp/comparison.json')),r1:{branch:process.env.R1_BRANCH,receiptBlob:process.env.R1_BLOB,harnessHistory:r1.harnessHistory},r2:{branch:process.env.R2_BRANCH,receiptBlob:process.env.R2_BLOB},dormancy:JSON.parse(fs.readFileSync('/tmp/dormancy.json')),staticMatrix:JSON.parse(fs.readFileSync('/tmp/matrix.json')),browserRequired:false,permanentCandidateAltered:false,restore:{headExact:true,treeExact:true,targetBlobExact:true,workspaceClean:true,head:process.env.PERM_SHA,tree:process.env.PERM_TREE,targetBlob:process.env.PERM_BLOB},scope:{repositoryOnly:true,staging:false,production:false,backend:false,supabase:false,rpc:false,migrations:false,credentials:false,runtimeRealtime:false,merge:false,readyForReview:false,forcePush:false,historyRewrite:false}};fs.writeFileSync('/tmp/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out));
          NODE
          git reset --hard "$PERM_SHA" >/dev/null;git clean -fd >/dev/null
          test "$(git rev-parse HEAD)" = "$PERM_SHA";test "$(git rev-parse HEAD^{tree})" = "$PERM_TREE";test "$(git rev-parse HEAD:$TARGET_FILE)" = "$PERM_BLOB";test "$(git status --porcelain)" = ""
          git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RECEIPT_FILE")";cp /tmp/result.json "$RECEIPT_FILE"
          git config user.name doke;git config user.email bielantoniomma@gmail.com;git add "$RECEIPT_FILE";test "$(git diff --cached --name-only)" = "$RECEIPT_FILE";git commit -m 'diagnostic(ux-css-important-044): record permanent certification' >/dev/null;git push origin HEAD:"$OUTPUT_BRANCH" >/dev/null

      - name: Verify permanent remained frozen
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PERM_BRANCH" >/dev/null
          test "$(git rev-parse FETCH_HEAD)" = "$PERM_SHA"
          test "$(git rev-parse "$PERM_SHA^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
