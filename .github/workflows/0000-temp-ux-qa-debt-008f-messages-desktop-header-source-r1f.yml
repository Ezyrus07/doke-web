          test "$(git rev-parse "$PARENT:tests/e2e/global-layout-contract.spec.js")" = "$GLOBAL_LAYOUT_TEST_BLOB"
          git diff --quiet HEAD --
          git diff --cached --quiet

      - name: Upload R1f evidence
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-debt-008f-r1f-${{ github.sha }}
          path: |
