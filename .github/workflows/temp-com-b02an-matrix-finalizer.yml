name: TEMP COM-B02AN Matrix Finalizer

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02an-matrix-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 47def929237e0526d54b6bcab02d495529c96810
      CANDIDATE: d430f8dd13f5244ffcba0ec5478f12453c383296
      BRANCH: com/com-001-baseline-audit
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      TEMP_PATH: .github/workflows/temp-com-b02an-matrix-finalizer.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze candidate lineage and Matrix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          actual="$(git diff --name-only "$CANDIDATE" HEAD | sort)"
          test "$actual" = "$TEMP_PATH"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate only canonical Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git hash-object config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Revalidate B02AN and repository governance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-readiness.js
          node --check scripts/test-com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.js
          node scripts/test-com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.js
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Commit derivatives and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- "$TEMP_PATH"
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- reports/generated/domain-completion-matrix-report.json
          expected_cached="$(printf '%s\n' "$TEMP_PATH" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual_cached="$(git diff --cached --name-only | sort)"
          test "$actual_cached" = "$expected_cached"
          test -z "$(git diff --name-only)"
          git commit -m "docs(com): reconcile B02AN Domain Completion Matrix derivatives"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-readiness.js \
            config/com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.js | sort)"
          actual_final="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual_final" = "$expected_final"
          ! git ls-tree -r --name-only HEAD | grep -Fx "$TEMP_PATH"

      - name: Fast-forward branch only if temporary head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
