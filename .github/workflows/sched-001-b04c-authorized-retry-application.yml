name: Doke SCHED-B04C Authorized Staging Retry

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-authorized-retry-application.yml'

permissions:
  contents: read

concurrency:
  group: sched-b04c-authorized-staging-retry
  cancel-in-progress: false

jobs:
  authenticated-ord-sched-composition-canary:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DOKE_SCHEDULING_RUNTIME_ENABLED: 'true'
      DOKE_RUNTIME_ENVIRONMENT: staging
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SCHED_B04C_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_B04C_AUTHENTICATED_ORD_SCHED_COMPOSITION_CANARIES_ON_DOKE_STAGING
      SCHED_B04C_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SCHED_B04C_REPORT_PATH: reports/generated/sched-001-b04c-authenticated-ord-sched-composition-canary-report.json
    steps:
      - name: Require exact authorization and immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$SCHED_B04C_AUTHORIZATION" = "I_EXPLICITLY_AUTHORIZE_SCHED_B04C_AUTHENTICATED_ORD_SCHED_COMPOSITION_CANARIES_ON_DOKE_STAGING"
          test -n "$SCHED_B04C_EXPECTED_HEAD_SHA"
          test "$SCHED_B04C_EXPECTED_HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = "ord/ord-001-baseline-audit"
          test "${{ github.event.pull_request.draft }}" = "true"

      - name: Checkout exact authorized head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Preserve fail-closed repository contracts
        run: |
          set -euo pipefail
          node --check scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix

      - name: Read-only staging and pull request preflight
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_SHA
          node scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js --preflight

      - name: Execute controlled ORD SCHED canary ending in rollback
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_SHA
          node scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js --execute

      - name: Upload sanitized canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-001-b04c-authorized-staging-retry-${{ github.run_id }}
          path: reports/generated/sched-001-b04c-authenticated-ord-sched-composition-canary-report.json
          if-no-files-found: warn
          retention-days: 14
