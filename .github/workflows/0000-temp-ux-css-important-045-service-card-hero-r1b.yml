  reach-source-cascade-r1b:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 03350507015579bfc60e413f1b3dfa97f4371f68
      PARENT_TREE: fb684d8ec8e96cf1a2d0ada42f7415259e084650
      TARGET_FILE: assets/css/components/cards/service-card-home-hero-feed.css
      TARGET_BLOB: 5f1f57692ca30fdca1fc10c5f89418343f3c4d8d
      TARGET_IMPORTANT: '62'
      TARGET_BYTES: '8812'
      PARENT_GLOBAL: '231'
      OUTPUT_BRANCH: diag/ux-css-important-045-service-card-hero-r1b
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-045-service-card-hero-r1b.yml
      RESULT_FILE: .diagnostics/ux-css-important-045-service-card-home-hero-feed-r1.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Freeze certified 044 parent and diagnostic isolation verbosely
        shell: bash
        run: |
          set -euo pipefail
          actual_tree="$(git rev-parse "$PARENT_SHA^{tree}")"
          actual_blob="$(git rev-parse "$PARENT_SHA:$TARGET_FILE")"
          merge_base="$(git merge-base "$PARENT_SHA" HEAD)"
          ahead="$(git rev-list --count "$PARENT_SHA..HEAD")"
          diff_names="$(git diff --name-only "$PARENT_SHA"...HEAD)"
          printf 'parent_tree=%s\ntarget_blob=%s\nmerge_base=%s\nahead=%s\ndiff_names=%s\n' "$actual_tree" "$actual_blob" "$merge_base" "$ahead" "$diff_names"
          test "$actual_tree" = "$PARENT_TREE"
          test "$actual_blob" = "$TARGET_BLOB"
          test "$merge_base" = "$PARENT_SHA"
          test "$ahead" = 1
          test "$diff_names" = "$WORKFLOW_FILE"
      - name: Resolve all priority sites and prove reach source cascade
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA" >/dev/null
          node <<'NODE'
