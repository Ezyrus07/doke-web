          if(unresolved.length||sites.length!==raw.length) throw Error(`unresolved ${unresolved.length} ${JSON.stringify(unresolved.slice(0,10))}`);
          const css=files.filter(p=>p.startsWith('assets/css/')&&p.endsWith('.css'));
          function imports(p){const src=maskCommentsStrings(read(p)),out=[],rx=/@import\s+(?:url\(\s*)?['"]?([^'"\)\s;]+\.css(?:\?[^'"\)\s;]*)?)['"]?\s*\)?[^;]*;/gi;for(const m of src.matchAll(rx)){let x=m[1].split('?',1)[0].split('#',1)[0];if(/^[a-z]+:\/\//i.test(x))continue;out.push(x.startsWith('/')?x.slice(1):posix.normalize(posix.join(posix.dirname(p),x)))}return out}
          const im=new Map(css.map(p=>[p,imports(p)])),directImporters=css.filter(p=>(im.get(p)||[]).includes(TARGET)).sort();
          const html=files.filter(p=>p.endsWith('.html')&&!/^(archive|reports|tools|test-results)\//.test(p)),linkRx=/<link\b[^>]*?href\s*=\s*['"]([^'"]+)['"][^>]*>/gis,starts=new Map(),directHtmlRefs=[];
          for(const h of html){const arr=[];for(const m of read(h).matchAll(linkRx)){let x=m[1].split('?',1)[0].split('#',1)[0];if(!x.endsWith('.css')||/^[a-z]+:\/\//i.test(x))continue;x=x.startsWith('/')?x.slice(1):posix.normalize(posix.join(posix.dirname(h),x));arr.push(x);if(x===TARGET)directHtmlRefs.push(h)}starts.set(h,arr)}
          function closure(xs){const seen=new Set(),out=[];function visit(p){if(seen.has(p)||!S.has(p)||!p.endsWith('.css'))return;seen.add(p);out.push(p);for(const q of im.get(p)||[])visit(q)}for(const x of xs)visit(x);return out}
          const targetPages=[],loaded=new Set();for(const [h,xs] of starts){const c=closure(xs);for(const x of c)loaded.add(x);if(c.includes(TARGET))targetPages.push(h)}
          const runtimeJsRefs=[];for(const p of files.filter(x=>x.startsWith('assets/js/')&&/\.(?:js|mjs|cjs)$/.test(x))){const t=read(p);if(t.includes(TARGET)||t.includes(posix.basename(TARGET)))runtimeJsRefs.push(p)}
          const canonicalLoaded=loaded.has(TARGET),wholeFileDormant=!canonicalLoaded&&!directImporters.length&&!directHtmlRefs.length&&!runtimeJsRefs.length;
          function declarationKeys(src){const clean=maskCommentsStrings(src),keys=new Set();let i=0;while(i<clean.length){const open=clean.indexOf('{',i);if(open<0)break;let j=open-1;while(j>=0&&clean[j]!=='}'&&clean[j]!=='{'&&clean[j]!==';')j--;const sel=clean.slice(j+1,open).trim().replace(/\s+/g,' ');let depth=1,k=open+1;for(;k<clean.length&&depth;k++){if(clean[k]==='{')depth++;else if(clean[k]==='}')depth--}if(depth){i=open+1;continue}const body=clean.slice(open+1,k-1);if(!sel.startsWith('@'))for(const part of body.split(';')){const c=part.indexOf(':');if(c>0){const prop=part.slice(0,c).trim();if(/^(?:--[A-Za-z0-9_-]+|-?[A-Za-z][A-Za-z0-9_-]*)$/.test(prop))keys.add(`${sel}\u0000${prop}`)}}i=k}return keys}
          const targetKeys=new Set(sites.filter(s=>s.selector).map(s=>`${s.selector}\u0000${s.property}`));
          const collisionByFile={},collisionKeys=new Set();for(const p of [...loaded].filter(p=>p!==TARGET)){const ks=declarationKeys(read(p)),hits=[...targetKeys].filter(k=>ks.has(k));if(hits.length){collisionByFile[p]=hits.length;for(const k of hits)collisionKeys.add(k)}}
          const siteCollisionCount=sites.filter(s=>collisionKeys.has(`${s.selector}\u0000${s.property}`)).length;
          const global=css.reduce((n,p)=>n+(read(p).match(/!important\b/gi)||[]).length,0);if(global!==Number(process.env.PARENT_GLOBAL))throw Error(`global ${global}`);
          const docs=['AGENTS.md','PROJECT-RULES.md','ARCHITECTURE.md','docs/DOKE_AGENT_CONSTITUTION.md','docs/BASELINE-VISUAL-APPROVED.md','docs/CSS_AUTHORITY_MAP.md','docs/DESIGN-SYSTEM-GUIDE.md','docs/DOKE-PLANO-MESTRE-CONCLUSAO-PLATAFORMA.md','docs/DOMAIN-COMPLETION-MATRIX.md','docs/GLOBAL-LAYOUT-CONTRACT.md','docs/PAGE-ASSET-AUTHORITY-MATRIX.md'];
          const authorityDocs={};for(const p of docs.filter(x=>S.has(x))) authorityDocs[p]=cp.execFileSync('git',['rev-parse',`${SHA}:${p}`],{encoding:'utf8'}).trim();
          const adjacent=['assets/css/components/domain/doke-domain-cards.css','assets/css/components/cards/mobile-card-contract.css','assets/css/components/cards/shared-index-card-contract.css','assets/css/components/cards/service-card-home-feed.css','assets/css/pages/home-foundation.css'].filter(p=>S.has(p));
          const authorityRelations={};for(const p of adjacent)authorityRelations[p]={blob:cp.execFileSync('git',['rev-parse',`${SHA}:${p}`],{encoding:'utf8'}).trim(),important:(read(p).match(/!important\b/gi)||[]).length,loaded:loaded.has(p),importsTarget:(im.get(p)||[]).includes(TARGET),targetImports:(im.get(TARGET)||[]).includes(p),exactSelectorPropertyCollisions:collisionByFile[p]||0};
          const out={proof:'UX-CSS-IMPORTANT-045 Reach / Source / Cascade R1b',result:wholeFileDormant?'PASS_WHOLE_FILE_DORMANT':'PASS_ACTIVE_REACH_CONFIRMED',checkpoint:'UX-CSS-IMPORTANT-045',harnessHistory:[{run:32913530458,job:98012274349,classification:'DIAGNOSTIC_HARNESS_STALE_TARGET_IDENTITY',staleBlob:'0dd5df9076eadab46e4aa41bfa85d576586421f1',exactBlob:process.env.TARGET_BLOB,criteriaRelaxed:false}],product:{sha:SHA,tree:process.env.PARENT_TREE,globalImportant:global,globalScope:'assets/css/**'},target:{path:TARGET,blob:process.env.TARGET_BLOB,bytes:Buffer.byteLength(target),sha256:crypto.createHash('sha256').update(target).digest('hex'),important:raw.length,importantSites:sites.length,unresolvedImportantSites:unresolved.length,uniquePrioritySelectorPropertyKeys:targetKeys.size,imports:im.get(TARGET)||[],siteSamples:sites.slice(0,20)},reach:{rootHtmlCount:html.length,loadedCssCount:loaded.size,canonicalLoaded,wholeFileDormant,targetPages:targetPages.sort(),directHtmlRefs:[...new Set(directHtmlRefs)].sort(),directImporters,runtimeJsRefs:runtimeJsRefs.sort(),browserReconciliationRequired:!wholeFileDormant},cascade:{exactSelectorPropertyCollisionKeys:collisionKeys.size,prioritySitesWithExactCollision:siteCollisionCount,collisionByFile:Object.fromEntries(Object.entries(collisionByFile).sort((a,b)=>b[1]-a[1]))},authorityDocs,authorityRelations,criteria:{allPrioritySitesResolved:true,criteriaRelaxed:0,broadMarkerRemovalAuthorized:wholeFileDormant,productMutation:false,repositoryOnly:true,staging:false,production:false,backend:false,supabase:false,rpc:false,migrations:false,credentials:false,runtimeRealtime:false,merge:false,readyForReview:false,forcePush:false,historyRewrite:false}};
