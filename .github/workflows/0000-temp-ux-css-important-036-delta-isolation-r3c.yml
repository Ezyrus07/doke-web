name: UX-CSS-IMPORTANT-036 Delta Isolation R3C

on:
  push:
    branches:
      - diag/ux-css-important-036-delta-isolation-r3c
    paths:
      - .github/workflows/0000-temp-ux-css-important-036-delta-isolation-r3c.yml
      - .diagnostics/ux-css-important-036-delta-isolation-r3c.js

permissions:
  contents: write

jobs:
  isolate036r3c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PARENT: 483d49d5f59c2eb24be0169f3d7ed6aec9703679
      SCRIPT: .diagnostics/ux-css-important-036-delta-isolation-r3c.js
      RESULT: .diagnostics/ux-css-important-036-delta-isolation-r3c.json
      WORKFLOW: .github/workflows/0000-temp-ux-css-important-036-delta-isolation-r3c.yml
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diag/ux-css-important-036-delta-isolation-r3c
          fetch-depth: 0

      - name: Freeze predecessor and diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT" HEAD
          actual="$(git diff --name-only "$PARENT" HEAD | sort)"
          expected2="$(printf '%s\n' "$SCRIPT" "$WORKFLOW" | sort)"
          expected3="$(printf '%s\n' "$RESULT" "$SCRIPT" "$WORKFLOW" | sort)"
          test "$actual" = "$expected2" || test "$actual" = "$expected3"
          test -z "$(git diff --name-only "$PARENT" HEAD -- 'assets/css/**' '*.html' 'assets/js/**')"

      - name: Install harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run observable blocker isolation
        shell: bash
        run: |
          set -euo pipefail
          node "$SCRIPT"
          node -e 'const x=require("./.diagnostics/ux-css-important-036-delta-isolation-r3c.json");if(x.status!=="PASS"||x.phase!=="complete"||x.importantInventoryCount!==314||x.blockerDeclarationCount<1||x.nonBlockingDeclarationCount<1||x.mutationAuthorityGranted!==false)process.exit(1)'
          git diff --check
          test -z "$(git status --short -- 'assets/css/**' '*.html' 'assets/js/**')"

      - name: Publish R3C receipt only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT" || { echo '{"boundary":"UX-CSS-IMPORTANT-036","proof":"delta-isolation-r3c","status":"FAIL","phase":"workflow","error":"receipt missing"}' > "$RESULT"; }
          git checkout -- 'assets/css/components/shell/mobile-app-shell.css' 2>/dev/null || true
          test -z "$(git status --short -- 'assets/css/**' '*.html' 'assets/js/**')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(ux): publish 036 delta isolation R3C receipt'
          git push origin HEAD:diag/ux-css-important-036-delta-isolation-r3c
