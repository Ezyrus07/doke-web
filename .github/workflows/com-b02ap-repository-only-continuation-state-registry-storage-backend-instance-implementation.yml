name: COM-B02AP Repository-Only Continuation State Registry Storage Backend Instance Implementation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-implementation.js'
      - 'config/com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.json'
      - 'scripts/test-com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.js'
      - '.github/workflows/com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02AO predecessor and exact repository-only implementation scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=030605606a377cbd2468d6753305abebec9f9183
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse "$BASE^{tree}")" = "d1471f8f228c2f75a55838e993b28bf0a703f272"
          git merge-base --is-ancestor "$BASE" HEAD

          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-implementation.js \
            config/com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.json \
            scripts/test-com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.js | sort)"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-implementation.js \
            config/com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected_candidate" || test "$actual" = "$expected_final"
          ! printf '%s\n' "$actual" | grep '^supabase/migrations/'
          ! printf '%s\n' "$actual" | grep '^\.github/workflows/temp-'

          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js)" = "b231a49df29d1cc31850f196626f9ab4ca2f6994"
          test "$(git rev-parse HEAD:config/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.json)" = "8cdf2f3a9a00dcf1118f2added2203d68a2f07b6"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Syntax and semantic B02AP instance implementation conformance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-implementation.js
          node --check scripts/test-com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.js
          node scripts/test-com-b02ap-repository-only-continuation-state-registry-storage-backend-instance-implementation.js

      - name: Implementation remains instance-free containerless operation-free and side-effect-free
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-implementation.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'storageBackendInstanceMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'entryContainerMaterialized[[:space:]]*:[[:space:]]*true|operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true|rawStateSerialized[[:space:]]*:[[:space:]]*true|rawStateExported[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check 030605606a377cbd2468d6753305abebec9f9183 HEAD
