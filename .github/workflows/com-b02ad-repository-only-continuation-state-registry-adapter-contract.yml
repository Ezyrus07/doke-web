# Certification refresh after canonical Matrix reconciliation; no scope or authority change.
name: COM-B02AD Repository-Only Continuation State Registry Adapter Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js'
      - 'config/com-b02ad-repository-only-continuation-state-registry-adapter-contract.json'
      - 'scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js'
      - '.github/workflows/com-b02ad-repository-only-continuation-state-registry-adapter-contract.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02ad-repository-only-continuation-state-registry-adapter-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02AC predecessor and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=139678acfb1188729634dcbd0c2a0634a73a51e6
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-adapter-readiness.js)" = "f194e8c044d6d2ebf0928a0d8c5fd2c3e8f6c50d"
          test "$(git rev-parse HEAD:config/com-b02ac-repository-only-continuation-state-registry-adapter-readiness.json)" = "3ec5790d66900d8deedcf53dcc419d756f8fc0e8"
          test "$(git rev-parse HEAD:scripts/test-com-b02ac-repository-only-continuation-state-registry-adapter-readiness.js)" = "6e3a1706eab2f37b3461a23de5aaa6c0df7b63b2"
          test "$(git rev-parse HEAD:.github/workflows/com-b02ac-repository-only-continuation-state-registry-adapter-readiness.yml)" = "dda2bd356357990f722c28a7165295c27deb9790"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:backend/runtime/staging/staging-api-runtime.js)" = "69de100fe3a269507a0da7847ae8e9887f831ceb"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02ad-repository-only-continuation-state-registry-adapter-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js \
            config/com-b02ad-repository-only-continuation-state-registry-adapter-contract.json \
            scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js | sort)"
          expected_reconciled="$(printf '%s\n' \
            .github/workflows/com-b02ad-repository-only-continuation-state-registry-adapter-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js \
            config/com-b02ad-repository-only-continuation-state-registry-adapter-contract.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected" || test "$actual" = "$expected_reconciled"

      - name: Syntax and semantic B02AD contract conformance
        run: |
          node --check backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js
          node --check scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js
          node scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js

      - name: Adapter remains contract-only and remote effects remain blocked
        shell: bash
        run: |
          set -euo pipefail
          FILE=backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$FILE"
          ! grep -E 'registerOpaqueContinuationState\(|resolveOpaqueContinuationState\(|releaseOpaqueContinuationState\(' "$FILE"
          ! grep -E 'resumeRepositoryOnlyCommandHandlerOrchestration\(|\.resumeSurface\(|resolution\.resumeSurface\(' "$FILE"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$FILE"
          ! grep -F 'repository-only-route-continuation-state-registry-adapter-contract' backend/runtime/staging/staging-api-runtime.js
          ! grep -F 'repository-only-route-continuation-state-registry-adapter-contract' backend/shared/http/route-registry.js
          ! grep -F 'repository-only-route-continuation-state-registry-adapter-contract' backend/shared/http/module-route-loader.js
          ! grep -F 'repository-only-route-continuation-state-registry-adapter-contract' backend/modules/communities/route-handlers.js

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=139678acfb1188729634dcbd0c2a0634a73a51e6
          git diff --check "$BASE" HEAD
