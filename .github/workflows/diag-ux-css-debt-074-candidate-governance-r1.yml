name: Doke UX-CSS-DEBT-074 Candidate Governance R1

on:
  push:
    branches: [diag/ux-css-debt-074-candidate-governance-r1]
    paths: [.github/workflows/diag-ux-css-debt-074-candidate-governance-r1.yml]

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 3a2f10f67fcf7452114959d9c3a217852a765c55
      PARENT_SHA: c79ccdced5ed83b77ef050a66cbc2284e6fc9ca8
      TARGET_TREE: c847008cab6841b7291f8b1f1c03091e5e6cb8f9
      TARGET_FILE: assets/css/core/tokens.css
      TARGET_BLOB: 3c2a22b31ad8a73740b1491398a3c6e82acc6a65
      EXPECTED_SHA256: ffd7ec44d056de5b777e1cbda9743936bae465ba9dfea6c0a587b4c19d1e20a8
      EXPECTED_BYTES: 47667
      DIAG_BRANCH: diag/ux-css-debt-074-candidate-governance-r1
      RESULT_FILE: .diagnostics/ux-css-debt-074-candidate-governance-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 2}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/gov.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE,ls=fs.readFileSync(f,'utf8').split('\n'),rows=new Map([[40,'  --doke-type-tracking-display: -0.035em;'],[41,'  --doke-type-tracking-label: 0.08em;'],[261,'  --doke-overlay-border: 0;'],[262,'  --doke-overlay-shadow: 0 18px 48px rgba(20, 50, 80, 0.14);'],[434,'  --doke-close-button-size: var(--close-button-size);']]);for(const [i,v] of rows)if((ls[i]||'').replace(/\r$/,'')!==v)throw Error(`row drift ${i+1}`);const out=ls.filter((_,i)=>!rows.has(i)).join('\n');fs.writeFileSync(f,out);const b=fs.readFileSync(f),h=crypto.createHash('sha256').update(b).digest('hex');if(h!==process.env.EXPECTED_SHA256||b.length!==+process.env.EXPECTED_BYTES)throw Error(`identity ${h}/${b.length}`);console.log(`IDENTITY PASS|sha256=${h}|bytes=${b.length}|parent=855/5|candidate=850/0`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t5\t'"$TARGET_FILE"; git diff --quiet "$TARGET_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs; git diff --check
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('/tmp/conflicts.log','utf8'),m=s.match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m)throw Error('conflict count missing');const n=+m[1];if(n>339)throw Error(`conflicts regression ${n}`);console.log(`CONFLICTS PASS|count=${n}|maxBaseline=339|regression=0`);
          NODE
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log; grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log; grep -q 'Critical flows: 15' /tmp/domain.log; grep -q 'Average maturity: 2.91/6' /tmp/domain.log; grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css')),re=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v))};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;re.lastIndex=0;while((m=re.exec(text)))imports.push(norm(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length})}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});const norm2=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function dc(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],rx=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm2(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm2([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm2(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm2(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(rx);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          if(active.size!==401||high.length!==37)throw Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0,pageResidual=0;for(const f of active){const p=dc(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++;if(f.includes('/pages/'))pageResidual++}}if(files!==0||total!==0||highDead!==0||pageResidual!==0)throw Error(`residual ${files}/${total}/${highDead}/${pageResidual}`);const g=dc(meta.get('assets/css/core/tokens.css').text);if(g.decl!==850||g.dead!==0)throw Error(`074 guard ${g.decl}/${g.dead}`);console.log('RESIDUAL PASS|active=401|high=37|files=0|dead=0|highDead=0|pageResidual=0|074=850/0|073=252/0|072=279/0|071=923/0|070=369/0|069=76/0');
          NODE
          set +e; npm audit --json >/tmp/audit.json; auditCode=$?; set -e
          node <<'NODE'
          const a=require('/tmp/audit.json'),v=a.metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`dependency drift ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`);
          NODE
          echo "AUDIT_EXIT=$auditCode"; echo 'GOVERNANCE PASS|duplicates=0/0|domain=23/15/2.91/12|activeCss=401|highRiskActiveCss=37'
      - id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.validate.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TARGET_SHA=$TARGET_SHA"; echo "VALIDATE=${{ steps.validate.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep '^IDENTITY PASS|' /tmp/gov.log || true; grep '^CONFLICTS PASS|' /tmp/gov.log || true; grep '^RESIDUAL PASS|' /tmp/gov.log || true; grep '^DEPENDENCY PASS|' /tmp/gov.log || true; grep '^AUDIT_EXIT=' /tmp/gov.log || true; grep '^GOVERNANCE PASS|' /tmp/gov.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 140 /tmp/gov.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record UX-CSS-DEBT-074 candidate governance [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
