name: SCHED-A07 Reconcile Once

on:
  push:
    branches:
      - ord/ord-001-baseline-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile SCHED-A07 matrix, package and living gates
        run: node scripts/reconcile-sched-001-a07-once.js
      - name: Regenerate living matrix documents
        run: node scripts/audit-domain-completion-matrix.js --write
      - name: Validate reconciled SCHED-A07 assets
        run: |
          node scripts/test-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-domain-completion-matrix.js
      - name: Commit reconciliation when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js scripts/audit-sched-001-a03-reservation-migration-local-contract.js scripts/audit-sched-001-a04-server-command-runtime.js scripts/audit-sched-001-a05-persistence-readiness.js scripts/audit-sched-001-a07-history-canary-readiness.js scripts/audit-ord-001-a10-blocker-reconciliation.js scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          git commit -m 'Reconcile SCHED-A07 migration history readiness'
          git push origin HEAD:ord/ord-001-baseline-audit
