name: COM-B02G Server Authority Runtime Composition Readiness

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-server-authority-runtime-composition-readiness.js'
      - 'config/com-b02g-server-authority-runtime-composition-readiness.json'
      - 'scripts/test-com-b02g-server-authority-runtime-composition-readiness.js'
      - '.github/workflows/com-b02g-server-authority-runtime-composition-readiness.yml'
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-server-authority-runtime-composition-readiness.js'
      - 'config/com-b02g-server-authority-runtime-composition-readiness.json'
      - 'scripts/test-com-b02g-server-authority-runtime-composition-readiness.js'
      - '.github/workflows/com-b02g-server-authority-runtime-composition-readiness.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02g-runtime-composition-readiness-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02F lineage and exact single-use repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=e834f28db83949fe852a96cde89499ba928b26fc
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:config/com-b02f-server-authority-main-runtime-wiring-authorization.json)" = "a1905e3cba0182edbda0741c96853a2e7bfacc53"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "332da22f604806ba06a0687c69d3d89903c4222c"
          test "$(git rev-parse HEAD:backend/modules/communities/community-server-authority-contract.js)" = "792893c57d8ccc0194f4dc22f16475ae361ebf89"
          test "$(git rev-parse HEAD:backend/modules/communities/community-supabase-repository-adapter.js)" = "94bc05d9797bc2b5673e440d0b25f09485d8215d"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02g-server-authority-runtime-composition-readiness.yml \
            backend/modules/communities/community-server-authority-runtime-composition-readiness.js \
            config/com-b02g-server-authority-runtime-composition-readiness.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02g-server-authority-runtime-composition-readiness.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected"

      - name: Syntax and B02G static composition binding conformance
        run: |
          node --check backend/modules/communities/community-server-authority-runtime-composition-readiness.js
          node --check scripts/test-com-b02g-server-authority-runtime-composition-readiness.js
          node scripts/test-com-b02g-server-authority-runtime-composition-readiness.js

      - name: Fail-closed hard blocks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/modules/communities/community-server-authority-runtime-composition-readiness.js
          node - <<'NODE'
          const b=require('./config/com-b02g-server-authority-runtime-composition-readiness.json');
          if(b.authorization.received!==true||b.authorization.consumed!==true||b.authorization.consumedFromHead!=='e834f28db83949fe852a96cde89499ba928b26fc'||b.authorization.singleExecutionOnly!==true||b.authorization.workflowRerunAllowedAfterAttempt!==false)throw new Error('B02G_AUTHORIZATION_DRIFT');
          for(const k of ['commandContextHydrationAuthority','projectionAssemblyAuthority','handlerMutationAuthority','runtimeActivationAuthority','stagingDeploymentAuthority','stagingTrafficAuthority','realCommunityMutationAuthority','realtimeActivationAuthority','remoteExecutionAuthority','networkAuthority','credentialReadAuthority','identityLifecycleAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','triggerCreationAuthority','receiptCreationAuthority','r5iCreationAuthority'])if(b.authority[k]!==false)throw new Error(`B02G_FORBIDDEN_AUTHORITY:${k}`);
          for(const k of ['existingRouteRegistryChanged','existingModuleRouteLoaderChanged','existingCommunityRouteHandlersChanged','commandContextHydratorCreated','projectionAssemblerCreated','handlerCompositionCreated','runtimeActivated','stagingDeploymentExecuted','stagingTrafficEnabled','networkRequestExecuted','realtimeSubscriptionExecuted','credentialReadExecuted','identityMutationExecuted','realCommunityMutationExecuted','triggerCreated','receiptCreated','productionChanged','pullRequestMerged','readyForReviewChanged'])if(b.effects[k]!==false)throw new Error(`B02G_FORBIDDEN_EFFECT:${k}`);
          if(b.functionalCheckpoint.lastFunctionalCheckpoint!=='COM-B03C-R5H'||b.functionalCheckpoint.exactRootCauseProven!==false||b.functionalCheckpoint.causalPromotionAllowed!==false||b.functionalCheckpoint.privatePresencePromotionAllowed!==false||b.functionalCheckpoint.r5iCreated!==false||b.functionalCheckpoint.r5iInferred!==false)throw new Error('B02G_FUNCTIONAL_CHECKPOINT_DRIFT');
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=e834f28db83949fe852a96cde89499ba928b26fc
          git diff --check "$BASE" HEAD
