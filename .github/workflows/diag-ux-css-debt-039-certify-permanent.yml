name: Doke UX-CSS-DEBT-039 Permanent Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-039-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 275b9fe2fed70885b9af7215073fc284dd3be7fc
      PARENT_SHA: 721c8036a7f1a23208f512ce5a6f4b532209595a
      PARENT_PARENT_SHA: 2c2b87e287a2df5f261be5cc9f94439ed9719145
      TARGET_TREE: 17336532c8255e17221db8555d8a04374d219914
      TARGET_FILE: assets/css/pages/comunidade/entry-create-modals.css
      PARENT_BLOB: 9dea353aa056080433035b044d9c92fb83f80062
      TARGET_BLOB: 3307a97e05474a9f4f3bfee769a21ea3b06848f0
      TARGET_HASH: 2a00446c049d4095400c0e696236b2ee88c91015b23a5bc2bf9936fd983ea81c
      TARGET_BYTES: '44057'
      PERM_BRANCH: ux/ux-css-debt-039-comunidade-entry-create-modals-compaction
      PAGE: comunidade.html
      FOUNDATION: assets/css/pages/comunidade-foundation.css
      MANIFEST: assets/css/pages/comunidade.css
      AUTHORITY_DOC_A: docs/PAGE-ASSET-AUTHORITY-MATRIX.md
      AUTHORITY_DOC_B: docs/HOME-AUTHORITY-CLASSIFICATION.md
      AUTHORITY_DOC_A_REGEN_HASH: 345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6
      AUTHORITY_DOC_B_REGEN_HASH: b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Preserve exact-cert helpers
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-039-cert-identity.cjs /tmp/ux-css-debt-039-cert-identity.cjs
          cp .github/diagnostics/ux-css-debt-039-cert-residual.cjs /tmp/ux-css-debt-039-cert-residual.cjs
          node --check /tmp/ux-css-debt-039-cert-identity.cjs
          node --check /tmp/ux-css-debt-039-cert-residual.cjs

      - name: Checkout exact certified UX-CSS-DEBT-038 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2
          clean: true

      - name: Guard parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_BLOB"
          test -z "$(git status --porcelain)"
          echo "PARENT IDENTITY PASS|sha=$PARENT_SHA|parent=$PARENT_PARENT_SHA|blob=$PARENT_BLOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate parent governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          npm run audit:page-asset-authority-matrix
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$PARENT_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_BLOB"
          echo "PARENT BASELINES PASS|responsive=generated|authorityDocHashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH"

      - name: Checkout exact permanent SHA without removing generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA" --depth=2
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -s reports/responsive-index-baseline.json
          echo "PERMANENT CHECKOUT PASS|sha=$TARGET_SHA"

      - name: Exact permanent identity scope reach and candidate-byte guard
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$TARGET_FILE"
          read -r add del file < <(git diff --numstat "$PARENT_SHA"...HEAD -- "$TARGET_FILE")
          test "$add" = "0" && test "$del" = "192" && test "$file" = "$TARGET_FILE"
          test -z "$(git diff --name-only "$PARENT_SHA"...HEAD -- '*.js' '*.html' 'package.json' 'package-lock.json' 'docs/**')"
          git diff --check "$PARENT_SHA"...HEAD
          node /tmp/ux-css-debt-039-cert-identity.cjs
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const page=process.env.PAGE,foundation=process.env.FOUNDATION,manifest=process.env.MANIFEST,target=process.env.TARGET_FILE;
          const h=fs.readFileSync(page,'utf8'),f=fs.readFileSync(foundation,'utf8'),m=fs.readFileSync(manifest,'utf8');
          const assert=(x,msg)=>{if(!x)throw new Error(msg)};
          assert((h.match(/assets\/css\/pages\/comunidade-foundation\.css\?v=/g)||[]).length===1,'foundation link cardinality drift');
          assert((f.match(/\.\/comunidade\.css\?v=/g)||[]).length===1,'manifest import cardinality drift');
          assert((m.match(/\.\/comunidade\/entry-create-modals\.css\?v=/g)||[]).length===1,'target import cardinality drift');
          const importers=cp.execSync("git grep -l -F 'comunidade/entry-create-modals.css?v=' -- assets/css || true",{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          assert(JSON.stringify(importers)===JSON.stringify([manifest]),'target importer drift '+JSON.stringify(importers));
          assert(!new RegExp('href=[\\"\\\'][^\\"\\\']*/comunidade/entry-create-modals\\.css\\?','i').test(h),'target became direct page stylesheet');
          console.log(`REACH AUTHORITY PASS|chain=${page}->${foundation}->${manifest}->${target}|pages=1`);
          NODE
          echo "EXACT IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=192"

      - name: Responsive contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Responsive contract test: PASS' /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PERMANENT PASS|checks=893|failures=0|skips=277'

      - name: Governance contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          conflicts="$(sed -n 's/.*Conflicting class\/property pairs: \([0-9][0-9]*\).*/\1/p' /tmp/conflicts.log | tail -1)"
          test -n "$conflicts"
          test "$conflicts" -le 339
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo "GOVERNANCE PERMANENT PASS|conflicts=$conflicts|domain=23/15/2.91/12|duplicates=0/0"

      - name: Isolate parent-stale authority-doc regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$TARGET_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          test -z "$(git diff --name-only)"
          echo "AUTHORITY DOC BASELINE ISOLATION PASS|candidateSemanticDocDelta=0|hashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH|workingTreeTrackedClean=1"

      - name: Permanent residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          node /tmp/ux-css-debt-039-cert-residual.cjs

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));const v=a.metadata?.vulnerabilities||{};
          console.log(`NPM AUDIT SNAPSHOT|total=${v.total??'n/a'}|critical=${v.critical??'n/a'}|high=${v.high??'n/a'}|moderate=${v.moderate??'n/a'}|low=${v.low??'n/a'}`);
          NODE

      - name: Final exact-SHA certification marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test -z "$(git diff --name-only)"
          echo "PERMANENT EXACT CERT PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=192|responsive=893/0/277|residual=35/657/0|runtimeProof=transferred-by-independent-byte-reconstruction|prCreated=0"

      - name: Clean generated artifacts and restore exact permanent checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0|prCreated=0|generatedArtifactsCleaned=1"
