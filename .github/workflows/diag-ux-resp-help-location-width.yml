name: Doke diagnostic — ajuda location width

on:
  push:
    branches:
      - diag/ux-resp-help-remaining-debt

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Inspect index/help location cascade
        run: node scripts/diag-ux-resp-help-location-width.js
