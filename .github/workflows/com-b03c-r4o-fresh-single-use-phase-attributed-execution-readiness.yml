name: COM-B03C-R4O Fresh Single-Use Phase-Attributed Execution Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4o.js'
      - 'config/com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.json'
      - 'scripts/test-com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.js'
      - 'scripts/execute-com-b03c-r4o-phase-attributed-hosted-terminal-observation.js'
      - 'scripts/verify-com-b03c-r4o-phase-attributed-hosted-terminal-observation-report.js'
      - 'docs/validation/COM-B03C-R4O-FRESH-SINGLE-USE-PHASE-ATTRIBUTED-EXECUTION-READINESS.json'
      - '.github/workflows/com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

concurrency:
  group: com-b03c-r4o-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4o.js
          node --check scripts/test-com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.js
          node --check scripts/execute-com-b03c-r4o-phase-attributed-hosted-terminal-observation.js
          node --check scripts/verify-com-b03c-r4o-phase-attributed-hosted-terminal-observation-report.js
      - name: R4O repository readiness
        run: node scripts/test-com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.js
      - name: R4O phase-attributed executor repository self-test
        run: node scripts/execute-com-b03c-r4o-phase-attributed-hosted-terminal-observation.js --repository-self-test
      - name: R4O sanitized report verifier repository self-test
        run: node scripts/verify-com-b03c-r4o-phase-attributed-hosted-terminal-observation-report.js --repository-self-test
      - name: Remote execution hard block
        shell: bash
        run: |
          set +e
          output="$(node scripts/execute-com-b03c-r4o-phase-attributed-hosted-terminal-observation.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R4O_REMOTE_EXECUTION_NOT_AUTHORIZED'
      - name: Fresh authorization and trigger are not materialized
        shell: bash
        run: |
          test ! -e config/com-b03c-r4p-r4o-fresh-authorization-consumption.json
          test ! -e config/com-b03c-r4o-single-use-phase-attributed-hosted-terminal-observation-trigger.json
      - name: Historical R4L R4M and R4N boundaries unchanged
        shell: bash
        run: |
          R4N_FINAL_HEAD=125791a4de79b2e740e9b73c3b18777a5a5168e2
          test -z "$(git diff --name-only "$R4N_FINAL_HEAD" "${{ github.event.pull_request.head.sha }}" -- \
            backend/modules/communities/community-realtime-private-auth-r4l.js \
            scripts/execute-com-b03c-r4l-single-use-hosted-terminal-status-observation.js \
            scripts/verify-com-b03c-r4l-single-use-hosted-terminal-status-observation-report.js \
            config/com-b03c-r4l-hosted-terminal-status-observation-workflow-installation-readiness.json \
            docs/validation/COM-B03C-R4L-HOSTED-TERMINAL-STATUS-OBSERVATION-WORKFLOW-INSTALLATION-READINESS.json \
            .github/workflows/com-b03c-r4l-hosted-terminal-status-observation-execution.yml \
            backend/modules/communities/community-realtime-private-auth-r4n.js \
            config/com-b03c-r4n-r4l-failure-phase-attribution-readiness.json \
            scripts/test-com-b03c-r4n-r4l-failure-phase-attribution-readiness.js \
            scripts/execute-com-b03c-r4n-phase-attributed-hosted-terminal-observation.js \
            docs/validation/COM-B03C-R4N-R4L-FAILURE-PHASE-ATTRIBUTION-READINESS.json \
            .github/workflows/com-b03c-r4n-r4l-failure-phase-attribution-readiness.yml)"
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
      - name: Repository-only workflow surface
        shell: bash
        run: |
          ! grep -Eq '^[[:space:]]*push:' .github/workflows/com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.yml
          ! grep -Eq '^[[:space:]]*environment:' .github/workflows/com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.yml
          ! grep -Eq 'secrets\.' .github/workflows/com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.yml
          grep -Fq 'permissions: { contents: read }' .github/workflows/com-b03c-r4o-fresh-single-use-phase-attributed-execution-readiness.yml
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
