name: COM-B03C-R5B Post-Consumption Domain Matrix Reconciler

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5b-post-consumption-domain-matrix-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r5b-post-consumption-domain-matrix-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: fbb4256747aa22034bd9c7b4c73510dc835d033f
  R5B_CERTIFIED_ISSUER_HEAD: 6a16670f666f639099412b6531bd3c311ac571fa
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r5b-post-consumption-domain-matrix-writer-temp.yml
  RECEIPT_PATH: config/com-b03c-r5b-r5a-fresh-authorization-consumption.json
  TRIGGER_PATH: config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fail-closed writer installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate consumed R5B receipt and no remote authority
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RECEIPT_PATH}"
          test ! -e "${TRIGGER_PATH}"
          node --check backend/modules/communities/community-realtime-private-auth-r5b.js
          node - <<'NODE'
          const r5b = require('./backend/modules/communities/community-realtime-private-auth-r5b');
          const receipt = require('./config/com-b03c-r5b-r5a-fresh-authorization-consumption.json');
          const issuerEvidenceHead = process.env.R5B_CERTIFIED_ISSUER_HEAD;
          const result = r5b.validateConsumedReceiptDescriptor({ receipt, issuerEvidenceHead });
          if (result.decision !== 'consumed_r5a_bound_authorization_receipt_valid_repository_only') process.exit(1);
          if (result.authorizationConsumed !== true || result.authorizationReusable !== false ||
              result.reusableAfterFailure !== false || result.triggerCreationAuthority !== false ||
              result.remoteExecutionAuthority !== false || result.exactRootCauseProven !== false ||
              result.causalPromotionAllowed !== false) process.exit(1);
          try {
            r5b.assertRemoteExecutionBoundaryAbsent();
            process.exit(1);
          } catch (error) {
            if (error?.code !== r5b.REMOTE_EXECUTION_BLOCK_CODE) throw error;
          }
          NODE
      - name: Preserve certified R4Z R5A R5B lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "${R5B_CERTIFIED_ISSUER_HEAD}" HEAD -- \
            backend/modules/communities/community-realtime-private-auth-r4z.js \
            scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js \
            docs/validation/COM-B03C-R4Z-CORRECTED-TERMINAL-BRIDGE-READINESS.json \
            backend/modules/communities/community-realtime-private-auth-r5a.js \
            config/com-b03c-r5a-fresh-head-bound-corrected-terminal-observation-authorization-lifecycle-readiness.json \
            docs/validation/COM-B03C-R5A-FRESH-HEAD-BOUND-CORRECTED-TERMINAL-OBSERVATION-AUTHORIZATION-LIFECYCLE-READINESS.json \
            backend/modules/communities/community-realtime-private-auth-r5b.js \
            config/com-b03c-r5b-r5a-bound-corrected-terminal-observation-authorization-issuance-consumption-readiness.json \
            docs/validation/COM-B03C-R5B-R5A-BOUND-CORRECTED-TERMINAL-OBSERVATION-AUTHORIZATION-ISSUANCE-CONSUMPTION-READINESS.json)"
      - name: Remove writer before canonical generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"
      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix
      - name: Enforce final reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff HEAD --name-only | sort)"
          printf '%s\n' "${actual}" | grep -qx "${WRITER_PATH}"
          printf '%s\n' "${actual}" | grep -qx "${MATRIX_MD}"
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}"|"${MATRIX_MD}"|"${MATRIX_JSON}") ;;
              *) echo "unauthorized final path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${actual}"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Stage and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${MATRIX_MD}"
          git add -f -- "${MATRIX_JSON}"
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "${staged}" | grep -qx "${WRITER_PATH}"
          printf '%s\n' "${staged}" | grep -qx "${MATRIX_MD}"
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}"|"${MATRIX_MD}"|"${MATRIX_JSON}") ;;
              *) echo "unauthorized staged path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${staged}"
          git diff --cached --check
      - name: Commit clean reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): reconcile matrix after R5B authorization consumption'
          git push origin "HEAD:${TARGET_BRANCH}"
