name: COM-B03C R5H Target Resource Binding Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified target-resource descriptor lineage
        shell: bash
        run: |
          set -euo pipefail
          parent=3a304c4557e746b06e2161b535b293d69347fbb5
          certified=e297b7f921c72864471e123a3d628a7f3e2dd3fd
          git merge-base --is-ancestor "$parent" HEAD
          git merge-base --is-ancestor "$certified" HEAD
          test "$(git rev-parse "$parent^{tree}")" = "b7d428d022c7bca5c561ef5a2503f5f9b96d8359"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.json)" = "cba91836e751bbd3225fa8992551d7953869cf01"
          test "$(git rev-parse "$parent:.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.yml")" = "b50e389d567913fcf1dc398d79a6b3bf6a5f13d3"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-environment-binding-boundary.json)" = "34d3d179090ccca8c51aaaf12a2ba1bb673ef495"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-boundary.json)" = "8d3003477e7c8728b453ea250aa464ad66b76f33"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js)" = "6fc34e1b365ec801665fdab0c7d0c6761a8013e6"

      - name: Exact repository-only materialization scope
        shell: bash
        run: |
          set -euo pipefail
          parent=3a304c4557e746b06e2161b535b293d69347fbb5
          certified=e297b7f921c72864471e123a3d628a7f3e2dd3fd
          boundary=config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json
          certifier=.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.yml
          initial="$(printf '%s\n' "$certifier" "$boundary" | sort)"
          final="$(printf '%s\n' "$certifier" "$boundary" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only "$parent" "$certified" | sort)"
          if [ "$actual" != "$initial" ] && [ "$actual" != "$final" ]; then
            printf 'Unexpected scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Static logical-resource no-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          boundary=config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json
          if grep -En 'https?://|process\.env|secrets\.|@supabase|createClient|\.channel\(|\.subscribe\(|fetch\(|projectRef|projectUrl|apiKey|service_role|anonKey|SUPABASE_' "$boundary"; then
            echo 'Remote target/runtime material is forbidden in target-resource binding boundary' >&2
            exit 1
          fi

      - name: Semantic target-resource binding assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto = require('crypto');
          const boundary = require('./config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json');
          const descriptor = require('./config/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.json');
          const environment = require('./config/com-b03c-r5h-extension-classification-probe-target-environment-binding-boundary.json');
          const adapter = require('./config/com-b03c-r5h-extension-classification-probe-runtime-adapter-binding-boundary.json');

          const expectedContract = 'com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary-v1';
          const expectedResource = 'doke-web-staging-realtime-messages-extension-classification-probe';
          const expectedEnvironment = 'doke-web-staging';
          const expectedFingerprint = 'sha256:2ab84b52b269ef4c9556c9818f4355d466bce9f735878213b49d9840cdd00fbf';
          const expectedFields = ['stableResourceIdentifier','targetEnvironmentStableIdentifier','resourceScopeFingerprint'];

          const stable = value => {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') {
              return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          };

          if (boundary.contractId !== expectedContract) throw new Error('BOUNDARY_CONTRACT_DRIFT');
          if (boundary.repositoryContext.parentCertifiedTargetResourceDescriptorHead !== '3a304c4557e746b06e2161b535b293d69347fbb5') throw new Error('PARENT_HEAD_DRIFT');
          if (boundary.repositoryContext.parentCertifiedTargetResourceDescriptorTree !== 'b7d428d022c7bca5c561ef5a2503f5f9b96d8359') throw new Error('PARENT_TREE_DRIFT');
          if (boundary.repositoryContext.parentTargetResourceDescriptorCertificationRun !== 31956204533 || boundary.repositoryContext.parentTargetResourceDescriptorCertificationJob !== 95187111733) throw new Error('PARENT_CERTIFICATION_DRIFT');
          if (boundary.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || boundary.functionalCheckpoint.r5iCreated !== false || boundary.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          const parentBinding = descriptor.targetResourceBindingDescriptor;
          if (descriptor.contractId !== 'com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary-v1') throw new Error('PARENT_DESCRIPTOR_CONTRACT_DRIFT');
          if (parentBinding.targetResourceBindingDescriptorDefined !== true || parentBinding.targetResourceBindingDefined !== false || parentBinding.targetResourceBound !== false || parentBinding.schemaOnly !== true) throw new Error('PARENT_DESCRIPTOR_STATE_DRIFT');
          if (parentBinding.requiredFields.join('|') !== expectedFields.join('|') || parentBinding.requiredTargetEnvironmentStableIdentifier !== expectedEnvironment) throw new Error('PARENT_DESCRIPTOR_SCHEMA_DRIFT');

          const env = environment.targetEnvironmentBinding;
          if (env.targetEnvironmentBindingDefined !== true || env.targetEnvironmentBound !== true || env.environmentClass !== 'non_production_staging' || env.stableEnvironmentIdentifier !== expectedEnvironment || env.production !== false) throw new Error('TARGET_ENVIRONMENT_BINDING_DRIFT');
          if (env.targetResourceBound !== false || env.transportBound !== false || env.stagingReadAuthority !== false || env.stagingMutationAuthority !== false || env.networkAuthority !== false || env.remoteExecutionAuthority !== false) throw new Error('TARGET_ENVIRONMENT_REMOTE_AUTHORITY_DRIFT');

          const runtime = adapter.runtimeAdapterBinding;
          if (runtime.runtimeAdapterBindingDefined !== true || runtime.runtimeAdapterBound !== true || runtime.bindingKind !== 'repository_owned_immutable_module' || runtime.adapterModuleBlob !== '6fc34e1b365ec801665fdab0c7d0c6761a8013e6' || runtime.transportBound !== false || runtime.remoteExecutionAuthority !== false) throw new Error('RUNTIME_ADAPTER_BINDING_DRIFT');

          const basis = boundary.resourceIdentifierBasis;
          if (basis.repositoryOwned !== true || basis.logicalResourceOnly !== true || basis.remoteResourceIdentity !== false || basis.remoteProjectIdentity !== false || basis.remoteDatabaseIdentity !== false || basis.remoteEndpointIdentity !== false) throw new Error('RESOURCE_IDENTIFIER_BASIS_DRIFT');
          if (basis.stableResourceIdentifier !== expectedResource || basis.targetEnvironmentStableIdentifier !== expectedEnvironment || basis.identifierDoesNotGrantEnvironmentAccess !== true || basis.identifierDoesNotGrantResourceAccess !== true) throw new Error('RESOURCE_IDENTIFIER_DRIFT');

          const fp = boundary.resourceScopeFingerprintContract;
          const computed = `sha256:${crypto.createHash('sha256').update(stable(boundary.targetResourceBinding.resourceScope), 'utf8').digest('hex')}`;
          if (fp.algorithm !== 'sha256' || fp.canonicalization !== 'utf8_json_sorted_keys_compact' || fp.canonicalInput !== stable(boundary.targetResourceBinding.resourceScope) || fp.fingerprint !== expectedFingerprint || computed !== expectedFingerprint) throw new Error('RESOURCE_SCOPE_FINGERPRINT_DRIFT');
          if (fp.fingerprintBindsOnlyRepositoryLogicalScope !== true || fp.fingerprintIsNotRemoteResourceIdentifier !== true || fp.fingerprintDoesNotGrantAccess !== true) throw new Error('RESOURCE_SCOPE_FINGERPRINT_AUTHORITY_DRIFT');

          const binding = boundary.targetResourceBinding;
          if (binding.slotId !== 'target_resource' || binding.targetResourceBindingDescriptorDefined !== true || binding.targetResourceBindingDefined !== true || binding.targetResourceBound !== true) throw new Error('TARGET_RESOURCE_NOT_BOUND');
          if (binding.bindingKind !== 'repository_owned_logical_resource_scope' || binding.localRepositoryBindingOnly !== true || binding.remoteResourceIdentity !== false) throw new Error('TARGET_RESOURCE_BINDING_KIND_DRIFT');
          if (binding.stableResourceIdentifier !== expectedResource || binding.targetEnvironmentStableIdentifier !== expectedEnvironment || binding.resourceScopeFingerprint !== expectedFingerprint) throw new Error('TARGET_RESOURCE_VALUE_DRIFT');
          if (binding.bindingBoundaryHeadEmbedded !== null || binding.subjectHeadIsBindingAuthority !== true || binding.transportBound !== false || binding.credentialProviderBound !== false) throw new Error('TARGET_RESOURCE_BINDING_AUTHORITY_DRIFT');
          if (binding.stagingReadAuthority !== false || binding.stagingMutationAuthority !== false || binding.networkAuthority !== false || binding.remoteExecutionAuthority !== false) throw new Error('REMOTE_AUTHORITY_FORBIDDEN');

          if (boundary.bindingHeadEvidenceContract.exactBindingBoundaryHeadRequired !== true || boundary.bindingHeadEvidenceContract.embeddedSelfHead !== null || boundary.bindingHeadEvidenceContract.selfReferentialCommitEmbeddingForbidden !== true || boundary.bindingHeadEvidenceContract.certifierMustRecordExactSubjectHead !== true) throw new Error('HEAD_EVIDENCE_CONTRACT_DRIFT');

          const expectedBoundSlots = ['runtime_adapter','target_environment','target_resource'];
          if (boundary.boundPortState.map(x => x.slotId).join('|') !== expectedBoundSlots.join('|')) throw new Error('BOUND_PORT_SET_DRIFT');
          for (const slot of boundary.boundPortState) if (slot.bound !== true) throw new Error(`BOUND_PORT_FALSE:${slot.slotId}`);

          const expectedDelegated = ['credential_provider','synthetic_identity_lifecycle','realtime_client_factory','sanitized_evidence_recorder','cleanup_verifier'];
          if (boundary.delegatedPortState.map(x => x.slotId).join('|') !== expectedDelegated.join('|')) throw new Error('DELEGATED_PORT_SET_DRIFT');
          for (const slot of boundary.delegatedPortState) {
            if (slot.bound !== false || slot.concreteValuePresent !== false || slot.separateCertifiedBindingBoundaryRequired !== true) throw new Error(`DELEGATED_PORT_BOUND:${slot.slotId}`);
          }

          const concrete = boundary.concreteBindingState;
          if (!concrete.runtimeAdapter || !concrete.targetEnvironment || !concrete.targetResource) throw new Error('PRIMARY_BINDINGS_MISSING');
          if (concrete.targetResourceStableIdentifier !== expectedResource || concrete.targetResourceEnvironmentIdentifier !== expectedEnvironment || concrete.targetResourceScopeFingerprint !== expectedFingerprint) throw new Error('CONCRETE_TARGET_RESOURCE_DRIFT');
          const nullKeys = ['credentialProvider','credentialMaterial','syntheticIdentity','realtimeClientFactory','sanitizedEvidenceRecorder','cleanupVerifier','networkEndpoint','executionCommand','executionWorkflow','executionEntrypoint'];
          for (const key of nullKeys) if (concrete[key] !== null) throw new Error(`FORBIDDEN_CONCRETE_BINDING:${key}`);

          const complete = boundary.bindingCompleteness;
          if (complete.runtimeAdapterSlotBound !== true || complete.targetEnvironmentSlotBound !== true || complete.targetResourceSlotBound !== true || complete.primaryRuntimeTargetSlotsBound !== true || complete.allDependentPortsBound !== false || complete.transportBound !== false || complete.executionReady !== false) throw new Error('BINDING_COMPLETENESS_DRIFT');

          const auth = boundary.authorizationState;
          if (auth.genericContinuationGrantsRemoteAuthority !== false || auth.priorR5dAuthorizationReusable !== false || auth.priorR5dReceiptReusable !== false || auth.priorR5dTriggerReusable !== false) throw new Error('AUTHORIZATION_REUSE_DRIFT');
          if (auth.futureAuthorizationMustBindExactEnvironmentIdentifier !== true || auth.futureAuthorizationMustBindExactResourceIdentifier !== true || auth.futureAuthorizationMustBindExactResourceScopeFingerprint !== true) throw new Error('FUTURE_AUTHORIZATION_BINDING_DRIFT');

          const causal = boundary.causalState;
          if (causal.exactRootCauseProven !== false || causal.causalPromotionAllowed !== false || causal.privatePresencePromotionAllowed !== false || causal.privateTypingBroadcastProven !== false || causal.channelMessagesCanonicalRemoteAuthority !== false) throw new Error('CAUSAL_STATE_DRIFT');

          const g = boundary.governance;
          const trueKeys = ['repositoryOnlyDefinition','repositoryOnlyBinding','runtimeAdapterBindingDefined','runtimeAdapterBound','targetEnvironmentBindingDescriptorDefined','targetEnvironmentBindingDefined','targetEnvironmentBound','targetResourceBindingDescriptorDefined','targetResourceBindingDefined','targetResourceBound'];
          for (const key of trueKeys) if (g[key] !== true) throw new Error(`GOVERNANCE_MUST_BE_TRUE:${key}`);
          const falseKeys = ['transportBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority'];
          for (const key of falseKeys) if (g[key] !== false) throw new Error(`GOVERNANCE_MUST_REMAIN_FALSE:${key}`);
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check 3a304c4557e746b06e2161b535b293d69347fbb5 HEAD
