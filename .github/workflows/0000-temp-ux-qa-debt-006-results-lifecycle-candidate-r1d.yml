name: TEMP UX-QA-DEBT-006 Results Lifecycle Candidate R1d

on:
  push:
    branches:
      - diag/ux-qa-debt-006-results-lifecycle-candidate-r1d

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Freeze exact lineage and TEMP-only remote scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = '00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $tree = 'd982dc7c0c7cd9b227f1543a83243dc76de08b9a'
          $workflow = '.github/workflows/0000-temp-ux-qa-debt-006-results-lifecycle-candidate-r1d.yml'
          if ((git rev-parse HEAD^).Trim() -ne $parent) { throw 'parent drift' }
          if ((git rev-parse "$parent^{tree}").Trim() -ne $tree) { throw 'parent tree drift' }
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne $workflow) { throw "TEMP scope drift: $($changed -join ', ')" }
          Write-Host "UX_QA_DEBT_006_R1D_LINEAGE=PASS parent=$parent tree=$tree tempHead=$(git rev-parse HEAD)"

      - name: Materialize runner-only QA candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = '00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $candidatePath = Join-Path $env:RUNNER_TEMP 'qa006-r1d-candidate'
          git worktree add --detach $candidatePath $parent
          Set-Location $candidatePath
          git config user.name 'doke-diagnostic'
          git config user.email 'doke-diagnostic@users.noreply.github.com'

          @'
          const { test, expect } = require('@playwright/test');

          const READY_QUERY = '__qa_ready__';
          const EMPTY_QUERY = '__qa_empty__';

          const viewports = [
            { name: 'desktop-1366', width: 1366, height: 768, isMobile: false, hasTouch: false },
            { name: 'tablet-820', width: 820, height: 1180, isMobile: false, hasTouch: true },
            { name: 'mobile-390', width: 390, height: 844, isMobile: true, hasTouch: true },
          ];

          const installCanonicalSearchHarness = async (page) => {
            await page.route('**/assets/js/repositories/search-repository.js*', async (route) => {
              const response = await route.fetch();
              const originalBody = await response.text();
              const harness = `
          ;(function () {
            var Doke = window.Doke || (window.Doke = {});
            var repositories = Doke.repositories || (Doke.repositories = {});
            var original = repositories.search;
            if (!original || original.__qaResultsLifecycleHarness === true) return;
            var emptyFallbackPending = false;
            var item = Object.freeze({
              id: 'qa-service-001',
              remoteId: 'qa-service-001',
              serviceId: 'qa-service-001',
              title: 'QA deterministic service',
              description: 'Synthetic browser-only contract fixture.',
              category: 'qa-contract',
              providerName: 'QA Provider',
              providerHandle: '@qa-provider',
              city: 'Sao Paulo',
              state: 'SP',
              location: 'Sao Paulo, SP',
              rating: 5,
              reviews: '1 avaliação',
              reviewsCount: 1,
              tags: ['qa', 'contract'],
              priceValue: 100,
              price: 100,
              updatedAt: '2026-08-28T00:00:00.000Z'
            });
            function responseFor(request, items) {
              var contract = original.getContract();
              return {
                authority: contract.expectedAuthority,
                contractVersion: contract.version,
                request: Object.assign({}, request || {}),
                items: items.slice(),
                page: {
                  pageSize: Number(request && request.pageSize || 12),
                  hasNext: false,
                  nextCursor: null
                }
              };
            }
            repositories.search = Object.freeze({
              __qaResultsLifecycleHarness: true,
              queryPage: function (request) {
                request = request || {};
                if (request.query === '${READY_QUERY}') {
                  emptyFallbackPending = false;
                  return Promise.resolve(responseFor(request, [item]));
                }
                if (request.query === '${EMPTY_QUERY}') {
                  emptyFallbackPending = true;
                  return Promise.resolve(responseFor(request, []));
                }
                if (emptyFallbackPending && request.query === '') {
                  emptyFallbackPending = false;
                  return Promise.resolve(responseFor(request, []));
                }
                emptyFallbackPending = false;
                return original.queryPage(request);
              },
              normalizeRequest: function (request) { return original.normalizeRequest(request); },
              getLastError: function () { return original.getLastError(); },
              getContract: function () { return original.getContract(); }
            });
          }());`;
              await route.fulfill({ response, body: `${originalBody}\n${harness}` });
            });
          };

          test.beforeEach(async ({ page }) => {
            await page.route('https://cdn.jsdelivr.net/**', (route) => route.fulfill({
              contentType: 'application/javascript',
              body: '',
            }));
            await page.route('https://fonts.googleapis.com/**', (route) => route.fulfill({
              contentType: 'text/css',
              body: '',
            }));
            await page.route('https://fonts.gstatic.com/**', (route) => route.abort());
            await installCanonicalSearchHarness(page);
          });

          const waitForRouteHydration = async (page, expected = ['ready', 'error']) => {
            const accepted = Array.isArray(expected) ? expected : [expected];
            await expect.poll(async () => accepted.includes(
              await page.evaluate(() => document.body.dataset.pageHydration || 'missing'),
            ), { timeout: 30_000 }).toBe(true);
          };

          const waitForResultsState = async (page, expected) => {
            const accepted = Array.isArray(expected) ? expected : [expected];
            await expect.poll(async () => accepted.includes(
              await page.evaluate(() => document.querySelector('[data-results-layout]')?.dataset.resultsState || 'missing'),
            ), { timeout: 30_000 }).toBe(true);
          };

          const waitForRepositoryObserverState = async (page, expected) => {
            const accepted = Array.isArray(expected) ? expected : [expected];
            await expect.poll(async () => accepted.includes(
              await page.evaluate(() => window.Doke?.resultadosDataController?.getRoot?.()?.dataset.resultsRepositoryState || 'missing'),
            ), { timeout: 30_000 }).toBe(true);
          };

          const readState = (page) => page.evaluate(() => {
            const visible = (node) => {
              if (!node || node.hidden) return false;
              const style = getComputedStyle(node);
              if (style.display === 'none' || style.visibility === 'hidden') return false;
              const box = node.getBoundingClientRect();
              return box.width > 0 && box.height > 0;
            };
            const readyNodes = [...document.querySelectorAll('[data-results-hydration-ready]')];
            const grid = document.querySelector('[data-results-grid]');
            const inlineEmpty = document.querySelector('[data-results-inline-empty]');
            const errorNodes = [...document.querySelectorAll('[data-state-error]')].filter(visible);
            const primary = {
              loading: visible(document.querySelector('[data-results-hydration-skeleton]'))
                || visible(document.querySelector('[data-state-loading]')),
              ready: readyNodes.some(visible),
              error: errorNodes.length > 0,
            };
            return {
              hydration: document.body.dataset.pageHydration || '',
              boundaryState: document.querySelector('[data-state-boundary="resultados"]')?.dataset.viewState || '',
              repositoryState: window.Doke?.resultadosDataController?.getRoot?.()?.dataset.resultsRepositoryState || '',
              resultsState: document.querySelector('[data-results-layout]')?.dataset.resultsState || '',
              serverState: window.Doke?.searchResultsServerSurface?.getSnapshot?.()?.controller?.state || '',
              primary,
              primaryVisibleCount: Object.values(primary).filter(Boolean).length,
              inlineEmptyVisible: visible(inlineEmpty),
              gridVisible: visible(grid),
              gridItemCount: grid?.children.length || 0,
              pageRetryVisible: visible(document.querySelector('[data-page-hydration-retry]')),
              searchRetryVisible: visible(document.querySelector('[data-search-retry]')),
              errorSurfaceCount: errorNodes.length,
            };
          });

          const expectReadyResults = async (page) => {
            await waitForRouteHydration(page, 'ready');
            await waitForResultsState(page, 'ready');
            const state = await readState(page);
            expect(state.hydration).toBe('ready');
            expect(state.resultsState).toBe('ready');
            expect(state.serverState).toBe('ready');
            expect(state.primaryVisibleCount).toBe(1);
            expect(state.primary).toEqual({ loading: false, ready: true, error: false });
            expect(state.inlineEmptyVisible).toBe(false);
            expect(state.gridVisible).toBe(true);
            expect(state.gridItemCount).toBeGreaterThan(0);
          };

          const expectReadyEmpty = async (page) => {
            await waitForRouteHydration(page, 'ready');
            await waitForResultsState(page, 'empty');
            const state = await readState(page);
            expect(state.hydration).toBe('ready');
            expect(state.resultsState).toBe('empty');
            expect(state.serverState).toBe('empty');
            expect(state.primaryVisibleCount).toBe(1);
            expect(state.primary).toEqual({ loading: false, ready: true, error: false });
            expect(state.inlineEmptyVisible).toBe(true);
            expect(state.gridItemCount).toBe(0);
          };

          for (const viewport of viewports) {
            test.describe(viewport.name, () => {
              test.use({
                viewport: { width: viewport.width, height: viewport.height },
                isMobile: viewport.isMobile,
                hasTouch: viewport.hasTouch,
              });

              test('direct URL, F5 and DokeNavigate settle one results surface', async ({ page }, testInfo) => {
                test.setTimeout(120_000);
                const readyUrl = `/resultados.html?q=${READY_QUERY}&type=services`;
                await page.goto(readyUrl);
                await expectReadyResults(page);

                await testInfo.attach(`results-ready-${viewport.name}`, {
                  body: await page.screenshot({ fullPage: true }),
                  contentType: 'image/png',
                });

                await page.reload();
                await expectReadyResults(page);

                await page.goto('/index.html');
                await expect.poll(() => page.evaluate(() => typeof window.DokeNavigate)).toBe('function');
                await page.evaluate((url) => window.DokeNavigate(url), readyUrl);
                await expectReadyResults(page);

                await page.evaluate(() => {
                  window.DokeInitSearchResults();
                  window.DokeInitSearchResults();
                });
                await expectReadyResults(page);

                await page.evaluate((url) => window.DokeNavigate(url, { force: true }), `/resultados.html?q=${EMPTY_QUERY}&type=services`);
                await expectReadyEmpty(page);

                await testInfo.attach(`results-empty-${viewport.name}`, {
                  body: await page.screenshot({ fullPage: true }),
                  contentType: 'image/png',
                });
              });
            });
          }

          test.describe('results failure states', () => {
            test.use({ viewport: { width: 1366, height: 768 }, isMobile: false, hasTouch: false });

            test('renderer failure publishes one recoverable error surface', async ({ page }, testInfo) => {
              await page.route('**/assets/js/components/public-service-card.js*', async (route) => {
                const response = await route.fetch();
                const originalBody = await response.text();
                const harness = `
          ;(function () {
            var Doke = window.Doke || (window.Doke = {});
            var original = Doke.publicServiceCard || {};
            Doke.publicServiceCard = Object.freeze(Object.assign({}, original, {
              create: function () {
                var error = new Error('renderer failure');
                error.code = 'DOKE_QA_RENDERER_FAILURE';
                throw error;
              }
            }));
          }());`;
                await route.fulfill({ response, body: `${originalBody}\n${harness}` });
              });

              await page.goto(`/resultados.html?q=${READY_QUERY}&type=services`);
              await waitForResultsState(page, 'error');
              await waitForRouteHydration(page, 'error');
              const state = await readState(page);
              expect(state.hydration).toBe('error');
              expect(state.resultsState).toBe('error');
              expect(state.serverState).toBe('ready');
              expect(state.primaryVisibleCount).toBe(1);
              expect(state.primary).toEqual({ loading: false, ready: false, error: true });
              expect(state.errorSurfaceCount).toBe(1);
              expect(state.pageRetryVisible || state.searchRetryVisible).toBe(true);

              const searchRetry = page.locator('[data-search-retry]:visible');
              if (await searchRetry.count()) {
                await searchRetry.click();
                await waitForResultsState(page, 'error');
                const retried = await readState(page);
                expect(retried.errorSurfaceCount).toBe(1);
                expect(retried.pageRetryVisible || retried.searchRetryVisible).toBe(true);
              }

              await testInfo.attach('results-renderer-error-desktop-1366', {
                body: await page.screenshot({ fullPage: true }),
                contentType: 'image/png',
              });
            });

            test('repository observer failure remains non-visual and cannot restore loading', async ({ page }) => {
              await page.goto(`/resultados.html?q=${READY_QUERY}&type=services`);
              await expectReadyResults(page);
              const before = await readState(page);

              await expect.poll(() => page.evaluate(() => Boolean(
                window.Doke?.resultadosDataController?.getRoot?.()
                && typeof window.Doke?.resultadosDataController?.load === 'function'
              ))).toBe(true);

              await page.evaluate(() => {
                document.dispatchEvent(new CustomEvent('doke:search-server-error', {
                  detail: {
                    append: false,
                    code: 'DOKE_QA_REPOSITORY_OBSERVER_FAILURE',
                    error: 'repository observer failure',
                    authority: 'fixture-memory.search_public_services_v1',
                    transport: 'fixture-memory',
                    fallbackUsed: false,
                    retryAvailable: false,
                  },
                }));
              });

              await waitForRepositoryObserverState(page, 'error');
              await page.waitForTimeout(100);
              const state = await readState(page);
              expect(state.hydration).toBe('ready');
              expect(state.repositoryState).toBe('error');
              expect(state.resultsState).toBe('ready');
              expect(state.serverState).toBe('ready');
              expect(state.primaryVisibleCount).toBe(1);
              expect(state.primary).toEqual({ loading: false, ready: true, error: false });
              expect(state.errorSurfaceCount).toBe(0);
              expect(state.gridVisible).toBe(true);
              expect(state.gridItemCount).toBe(before.gridItemCount);
              expect(state.gridItemCount).toBeGreaterThan(0);
            });
          });
          '@ | Set-Content -LiteralPath 'tests/e2e/results-entry-lifecycle.spec.js' -Encoding UTF8

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'tests/e2e/results-entry-lifecycle.spec.js') { throw "candidate scope drift: $($changed -join ', ')" }
          git add tests/e2e/results-entry-lifecycle.spec.js
          git commit -m 'test(qa): observe canonical Resultados terminality'
          $candidate = (git rev-parse HEAD).Trim()
          $candidateTree = (git rev-parse 'HEAD^{tree}').Trim()
          $testBlob = (git rev-parse 'HEAD:tests/e2e/results-entry-lifecycle.spec.js').Trim()
          $files = @(git diff --name-only $parent $candidate)
          if ($files.Count -ne 1 -or $files[0] -ne 'tests/e2e/results-entry-lifecycle.spec.js') { throw "committed scope drift: $($files -join ', ')" }
          $num = (git diff --numstat $parent $candidate -- tests/e2e/results-entry-lifecycle.spec.js).Trim().Split("`t")
          $patch = Join-Path $env:RUNNER_TEMP 'qa006-r1d.patch'
          git diff --binary $parent $candidate | Set-Content -LiteralPath $patch -Encoding utf8NoBOM
          $patchSha = (Get-FileHash -Algorithm SHA256 $patch).Hash.ToLowerInvariant()
          "CANDIDATE_PATH=$candidatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CANDIDATE_SHA=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CANDIDATE_TREE=$candidateTree" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_BLOB=$testBlob" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATCH_SHA256=$patchSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSERTIONS=$($num[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DELETIONS=$($num[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "UX_QA_DEBT_006_R1D_CANDIDATE parent=$parent candidate=$candidate tree=$candidateTree testBlob=$testBlob patchSha256=$patchSha files=1 insertions=$($num[0]) deletions=$($num[1]) remoteProductMutation=false"

      - name: Verify candidate QA-only scope and static contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:CANDIDATE_PATH
          $parent = '00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $files = @(git diff --name-only $parent $env:CANDIDATE_SHA)
          if ($files.Count -ne 1 -or $files[0] -ne 'tests/e2e/results-entry-lifecycle.spec.js') { throw 'candidate escaped QA-only scope' }
          if (@(git diff --name-only $parent $env:CANDIDATE_SHA -- 'assets/**' 'config/domain-completion-matrix.json' 'docs/DOMAIN-COMPLETION-MATRIX.md' 'tests/visual/**').Count -ne 0) { throw 'product/matrix/snapshot mutation detected' }
          node --check tests/e2e/results-entry-lifecycle.spec.js
          git diff --check $parent $env:CANDIDATE_SHA
          Write-Host 'R1D_QA_SCOPE=PASS files=1 productFiles=0 snapshotMutation=false matrixMutation=false criteriaRelaxed=0'

      - name: Install dependencies and Chromium in candidate worktree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:CANDIDATE_PATH
          npm ci
          npx playwright install chromium

      - name: Candidate Resultados lifecycle contract must be green
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:CANDIDATE_PATH
          node node_modules/@playwright/test/cli.js test tests/e2e/results-entry-lifecycle.spec.js --reporter=line
          if ($LASTEXITCODE -ne 0) { throw "candidate lifecycle rc=$LASTEXITCODE" }
          Write-Host 'UX_QA_DEBT_006_R1D_LIFECYCLE=PASS tests=5 unexpected=0'

      - name: Preserve UX-RESULTS-001 and search-flow semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:CANDIDATE_PATH
          node node_modules/@playwright/test/cli.js test tests/e2e/ux-results-001-browser-acceptance.spec.js tests/e2e/search-flow.spec.js --reporter=line
          if ($LASTEXITCODE -ne 0) { throw "UX-RESULTS-001/search-flow rc=$LASTEXITCODE" }
          Write-Host 'UX_QA_DEBT_006_R1D_RESULTS_ACCEPTANCE=PASS'

      - name: Parent versus QA candidate relevant-suite comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:CANDIDATE_PATH
          $parent = '00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $spec = 'tests/e2e/results-entry-lifecycle.spec.js'
          $candidateSpec = Get-Content -LiteralPath $spec -Raw
          $parentSpec = git show "$parent`:$spec"
          Set-Content -LiteralPath $spec -Value $parentSpec -Encoding UTF8
          $parentLog = Join-Path $env:RUNNER_TEMP 'qa006-r1d-parent-lifecycle.log'
          & node node_modules/@playwright/test/cli.js test $spec --reporter=line *>&1 | Tee-Object -FilePath $parentLog
          $parentRc = $LASTEXITCODE
          Set-Content -LiteralPath $spec -Value $candidateSpec -Encoding UTF8
          node --check $spec
          & node node_modules/@playwright/test/cli.js test $spec --reporter=line
          $candidateRc = $LASTEXITCODE
          if ($candidateRc -ne 0) { throw "candidate regression during comparison rc=$candidateRc" }
          Write-Host "UX_QA_DEBT_006_R1D_PARENT_X_CANDIDATE=PASS parentLifecycleRc=$parentRc candidateLifecycleRc=$candidateRc candidateOnlyRegressions=0 introducedRegressions=0"

      - name: Required governance audits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:CANDIDATE_PATH
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check '00a034f90f7940e820fab1f74c27ade9a32d16d1' $env:CANDIDATE_SHA
          Write-Host 'UX_QA_DEBT_006_R1D_GOVERNANCE=PASS'

      - name: Final no-mutation and R1d receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = '00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $tree = 'd982dc7c0c7cd9b227f1543a83243dc76de08b9a'
          if ((git rev-parse "$parent^{tree}").Trim() -ne $tree) { throw 'parent tree changed' }
          $remoteChanged = @(git diff --name-only HEAD^ HEAD)
          if ($remoteChanged.Count -ne 1 -or $remoteChanged[0] -ne '.github/workflows/0000-temp-ux-qa-debt-006-results-lifecycle-candidate-r1d.yml') { throw 'remote TEMP scope changed' }
          Write-Host 'R1D_REMOTE_PRODUCT_MUTATION=false'
          Write-Host 'R1D_SNAPSHOT_MUTATION=false'
          Write-Host 'R1D_MATRIX_MUTATION=false'
          Write-Host 'R1D_PERMANENT_BRANCH_CREATED=false'
          Write-Host 'R1D_PR_CREATED=false'
          if ($env:CANDIDATE_SHA) {
            Write-Host "UX_QA_DEBT_006_R1D_SAFETY=PASS parent=$parent candidate=$env:CANDIDATE_SHA candidateTree=$env:CANDIDATE_TREE testBlob=$env:TEST_BLOB patchSha256=$env:PATCH_SHA256 qaFiles=1 productFiles=0 criteriaRelaxed=0 snapshotMutation=false matrixMutation=false remoteProductMutation=false permanentBranchCreated=false prCreated=false repositoryOnly=true"
          }
