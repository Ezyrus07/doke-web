name: Doke SCHED-B04C Attempt 5 Sanitized Diagnostic Preservation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-attempt2-fixture-fix.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-attempt5-sanitized-diagnostics
  cancel-in-progress: false

jobs:
  publish-sanitized-diagnostics:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Preserve only sanitized expected and actual denial codes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js')
          source = path.read_text()
          marker = "const safeDetails = error && error.details && typeof error.details === 'object'"
          if marker in source:
              print('Sanitized diagnostic preservation already present.')
              raise SystemExit(0)

          old = """  const code = String(error && error.code || 'DOKE_SCHED_B04C_UNEXPECTED_FAILURE');
            const message = String(error && error.message || '');
            if (/^DOKE_[A-Z0-9_]+$/.test(message)) return { code: message, message };
            if (code.startsWith('DOKE_')) return { code, message: code };
          """
          new = """  const code = String(error && error.code || 'DOKE_SCHED_B04C_UNEXPECTED_FAILURE');
            const message = String(error && error.message || '');
            const safeDetails = error && error.details && typeof error.details === 'object'
              ? Object.freeze({
                  expectedCode: String(error.details.expectedCode || ''),
                  actualCode: error.details.actualCode == null ? null : String(error.details.actualCode)
                })
              : null;
            if (/^DOKE_[A-Z0-9_]+$/.test(message)) {
              return safeDetails ? { code: message, message, details: safeDetails } : { code: message, message };
            }
            if (code.startsWith('DOKE_')) {
              return safeDetails ? { code, message: code, details: safeDetails } : { code, message: code };
            }
          """
          if old not in source:
              raise SystemExit('safeError structural block not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Validate diagnostic-only change
        run: |
          set -euo pipefail
          node --check scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish sanitized diagnostic support
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js; then
            echo "Diagnostic support already present; nothing to publish."
            exit 0
          fi
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          git commit -m "chore(sched): preserve sanitized B04C denial diagnostics"
          git push origin HEAD:ord/ord-001-baseline-audit
