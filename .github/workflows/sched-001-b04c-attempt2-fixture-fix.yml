name: Doke SCHED-B04C Attempt 3 Structural Fixture Fix

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-attempt2-fixture-fix.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-attempt3-structural-fixture-fix
  cancel-in-progress: false

jobs:
  fix-and-authorize-attempt-3:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Replace invalid fixture by structural markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          executor_path = Path('scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js')
          source = executor_path.read_text()

          import_marker = "const { assertTransition } = require('../backend/modules/orders/order-state-machine');\n"
          repository_import = "const { createTransactionPort } = require('../backend/modules/scheduling/scheduling-postgres-repository');\n"
          if repository_import not in source:
              if import_marker not in source:
                  raise SystemExit('executor import marker missing')
              source = source.replace(import_marker, import_marker + repository_import, 1)

          start_marker = "  const replacementA = await root.createScheduleHold(commandContext(actors.support, 'replacement-a-hold', {"
          end_marker = "  const partialHold = await root.createScheduleHold(commandContext(actors.client, 'partial-hold', {"
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('replacement fixture structural markers missing')

          new_block = """  const replacementA = await root.createScheduleHold(commandContext(actors.support, 'replacement-a-hold', {
            orderId: fixtures.orders.replacement,
            professionalId: fixtures.personas.professional.id,
            ...range(12, 13)
          }, correlationId));
          const replacementAConfirmed = await root.confirmScheduleReservation(commandContext(actors.support, 'replacement-a-confirm', {
            reservationId: replacementA.reservation.id,
            expectedVersion: 1
          }, correlationId));
          const replacementOrderBeforeGuard = await readOrder(client, fixtures.orders.replacement);
          assertOrderProjection(replacementOrderBeforeGuard, replacementAConfirmed.reservation, 'scheduled');
          const directTransactionPort = createTransactionPort(client);
          await expectCode(
            () => directTransactionPort.projectOrderSchedule(
              fixtures.orders.replacement,
              mainHold.reservation.id,
              mainHold.reservation.startsAt
            ),
            'DOKE_SCHEDULE_ORDER_PROJECTION_FAILED'
          );
          const replacementOrder = await readOrder(client, fixtures.orders.replacement);
          requireExact(replacementOrder.schedule_reservation_id, replacementA.reservation.id, 'DOKE_SCHED_B04C_REPLACEMENT_OVERWROTE_REFERENCE');
          requireExact(
            new Date(replacementOrder.scheduled_at).toISOString(),
            new Date(replacementAConfirmed.reservation.startsAt).toISOString(),
            'DOKE_SCHED_B04C_REPLACEMENT_CHANGED_TIME'
          );

          """
          source = source[:start] + new_block + source[end:]
          executor_path.write_text(source)

          bridge_path = Path('.github/workflows/sched-001-b04c-authorized-one-shot-bridge.yml')
          bridge_lines = bridge_path.read_text().splitlines()
          if not bridge_lines or not bridge_lines[0].startswith('name: Doke SCHED-B04C Authorized One-Shot Bridge'):
              raise SystemExit('one-shot bridge name marker missing')
          bridge_lines[0] = 'name: Doke SCHED-B04C Authorized One-Shot Bridge Attempt 3'
          bridge_path.write_text('\n'.join(bridge_lines) + '\n')

          Path('.github/workflows/sched-001-b04c-attempt2-fixture-fix.yml').unlink()
          PY

      - name: Validate corrected canary package
        run: |
          set -euo pipefail
          node --check scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish corrected attempt 3 package
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix(sched): respect one active reservation in B04C canary"
          git push origin HEAD:ord/ord-001-baseline-audit
