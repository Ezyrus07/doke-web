name: WAL-B03 A01 Bank Data Protection Authority

on:
  push:
    branches:
      - 'sec/wal-b03-a01-bank-data-protection-authority'
  pull_request:
    paths:
      - '.github/workflows/wal-b03-a01-bank-data-protection-authority.yml'
      - 'scripts/lib/wal-b03-bank-data-protection-authority.js'
      - 'config/wal-b03-a01-bank-data-protection-authority.json'
      - 'docs/WAL-B03-A01-BANK-DATA-PROTECTION-AUTHORITY.md'
      - 'scripts/audit-wal-b03-a01-bank-data-protection-authority.js'
      - 'scripts/test-wal-b03-a01-bank-data-protection-authority.js'
      - 'tests/fixtures/wal-b03-a01-bank-data-protection-cases.json'

permissions:
  contents: read

jobs:
  wal-b03-a01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce exact repository-only diff
        shell: bash
        run: |
          set -euo pipefail
          base='6eb8e55317a20f88f8ecb0f083c00c101b2afc59'
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed='^(.github/workflows/wal-b03-a01-bank-data-protection-authority.yml|scripts/lib/wal-b03-bank-data-protection-authority.js|config/wal-b03-a01-bank-data-protection-authority.json|docs/WAL-B03-A01-BANK-DATA-PROTECTION-AUTHORITY.md|scripts/audit-wal-b03-a01-bank-data-protection-authority.js|scripts/test-wal-b03-a01-bank-data-protection-authority.js|tests/fixtures/wal-b03-a01-bank-data-protection-cases.json)$'
          unexpected="$(printf '%s\n' "${changed[@]}" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected file outside WAL-B03-A01 scope:"
            echo "$unexpected"
            exit 1
          fi
          if printf '%s\n' "${changed[@]}" | grep -Eq '^supabase/migrations/'; then
            echo 'Migration changes are forbidden in WAL-B03-A01.'
            exit 1
          fi

      - name: Syntax
        run: |
          node --check scripts/lib/wal-b03-bank-data-protection-authority.js
          node --check scripts/audit-wal-b03-a01-bank-data-protection-authority.js
          node --check scripts/test-wal-b03-a01-bank-data-protection-authority.js

      - name: WAL-B03 A01 audit
        run: node scripts/audit-wal-b03-a01-bank-data-protection-authority.js

      - name: WAL-B03 A01 conformance
        run: node scripts/test-wal-b03-a01-bank-data-protection-authority.js

      - name: WAL-A02 regression
        run: |
          node scripts/audit-wal-a02-bank-account-sensitive-data-boundary.js
          node scripts/test-wal-a02-bank-account-sensitive-data-boundary.js

      - name: Financial authority regression
        run: node scripts/test-financial-rpc-authority-contract.js

      - name: Domain matrix remains canonical
        run: node scripts/audit-domain-completion-matrix.js

      - name: Diff hygiene
        run: git diff --check 6eb8e55317a20f88f8ecb0f083c00c101b2afc59...HEAD
