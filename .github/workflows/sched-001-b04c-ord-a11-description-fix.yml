name: Doke SCHED-B04C ORD-A11 Description Fix

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-ord-a11-description-fix.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-ord-a11-description-fix
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Restore ORD-A11 literal handoff markers
        run: node scripts/apply-sched-001-b04c-ord-a11-description-fix.js
      - name: Regenerate deterministic matrix derivatives
        run: npm run write:domain-completion-matrix
      - name: Validate governance and execution package
        run: |
          set -euo pipefail
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-execution
          npm run test:sched-001-b04c-authenticated-ord-sched-composition-canary-execution
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Publish reconciled governance state
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add -A
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "chore(ord): preserve SCHED-001 handoff markers"
          git push origin HEAD:ord/ord-001-baseline-audit
