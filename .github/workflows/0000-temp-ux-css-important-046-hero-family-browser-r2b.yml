name: TEMP UX-CSS-IMPORTANT-046 Hero Family Browser R2B
on:
  push:
    branches: [diag/ux-css-important-046-hero-family-browser-r2b]
permissions: {contents: read}
jobs:
  family:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: G1_HERO_CATEGORY_PROFILE, lo: 1, hi: 18}
          - {group: G2_SEARCH_CONTROLS, lo: 19, hi: 40}
          - {group: G3_RAIL_SECTION_EDGE, lo: 41, hi: 55}
          - {group: G4_FILTER_STATE_GUARDS, lo: 56, hi: 65}
          - {group: G5_FILTER_PANEL_SHELL, lo: 66, hi: 81}
          - {group: G6_FILTER_HEADER_DISMISS, lo: 82, hi: 101}
          - {group: G7_FILTER_CONTENT_ACTIONS, lo: 102, hi: 127}
    env:
      PARENT_SHA: 53e5733a4fb7cd293cc2ab17bd53f64338a72b8d
      PARENT_TREE: 4958068fa2e44aee05e390fae0af5ad18c633947
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: e3547c5ebeb6ddbcd5a934244c2d372eabcef9ba
      GROUP: ${{ matrix.group }}
      LO: ${{ matrix.lo }}
      HI: ${{ matrix.hi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - name: Build exact family candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git checkout --detach "$PARENT_SHA" >/dev/null
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p=fs.readFileSync('/tmp/parent.css','utf8'),lo=+process.env.LO,hi=+process.env.HI;
          if((p.match(/!important\b/gi)||[]).length!==127)throw Error('parent count');
          let n=0,removed=0;
          const c=p.replace(/\s*!important\b/gi,m=>{n++;if(n>=lo&&n<=hi){removed++;return ''}return m});
          if(n!==127||removed!==hi-lo+1)throw Error(`identity ${n}/${removed}`);
          const remain=(c.match(/!important\b/gi)||[]).length,sha=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',c);
          console.log(`CANDIDATE|group=${process.env.GROUP}|indices=${lo}-${hi}|removed=${removed}|important=127->${remain}|sha256=${sha}|bytes=${Buffer.byteLength(c)}|markerOnly=1`);
          NODE
          git diff --exit-code -- "$TARGET_FILE"
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true; cp /tmp/parent.css "$TARGET_FILE" 2>/dev/null || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{
            const f=process.env.TARGET_FILE,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/candidate.css','utf8');
            const widths=[359,379,380,381,390,430,560,561],filterWidths=new Set([359,380,390,560]);
            const states=[];for(const w of widths){states.push([w,'default']);if(filterWidths.has(w))states.push([w,'filters'])}
            const H=b=>crypto.createHash('sha256').update(b).digest('hex');
            const tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
            const items=Array.from({length:8},(_,i)=>({id:'c46-'+i,serviceId:'c46-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'p'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro']}));
            const sels=['.home-mobile-hero__location','.home-catégory','.home-catégory__icon','.home-mobile-hero__profile','.doke-search-panel__form','.home-search-hero__field','.doke-search-panel__input','.home-search-hero__mobile-submit','.home-search-hero__audio-button','#featured-services-track','.featured-services .home-section-header','.featured-services .home-section-title','[data-more-filters-panel]','.more-filters__header','.more-filters__dismiss','.more-filters__split-body','.more-filters__split-nav','.more-filters__split-content','.more-filters__pane:not([hidden])','.more-filters__actions'];
            const browser=await chromium.launch({headless:true});
            async function cap(w,state,phase){
              const c=await browser.newContext({viewport:{width:w,height:1050},reducedMotion:'reduce'}),p=await c.newPage(),errs=[];let loaded=false;
              p.on('pageerror',e=>errs.push(e.message));p.on('request',r=>{try{if(new URL(r.url()).pathname==='/'+f)loaded=true}catch{}});
              await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:4173/'))return r.continue();if(u.startsWith('https://images.pexels.com/'))return r.fulfill({status:200,contentType:'image/png',body:tiny});return r.abort()});
              await p.goto(`http://127.0.0.1:4173/index.html?c46=${process.env.GROUP}-${phase}-${w}-${state}`,{waitUntil:'domcontentloaded',timeout:15000});
              await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});
              await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');if(!a||!b)throw Error('grids');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(window.Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(window.Doke.publicServiceCard.create(x,{results:true})))},items);
              if(state==='filters'){await p.waitForFunction(()=>Boolean(window.DokeHomeFiltersApi?.open),null,{timeout:7000});await p.evaluate(()=>window.DokeHomeFiltersApi.open('tabs'));await p.waitForFunction(()=>{const x=document.querySelector('[data-more-filters-panel]');return document.body.classList.contains('home-filter-sheet-open')&&Boolean(x&&!x.hidden&&x.getAttribute('aria-hidden')!=='true')},null,{timeout:4000})}
              await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;}'});await p.waitForTimeout(80);
              const data=await p.evaluate(sels=>{const pick=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{d:c.display,p:c.position,v:c.visibility,o:c.opacity,ov:c.overflow,ox:c.overflowX,oy:c.overflowY,w:c.width,h:c.height,minh:c.minHeight,maxh:c.maxHeight,maxw:c.maxWidth,f:c.flex,g:c.gridTemplateColumns,gap:c.gap,i:c.inset,t:c.top,ri:c.right,b:c.bottom,l:c.left,tr:c.transform,z:c.zIndex,r:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*100)/100)}};return{body:document.body.className,root:document.documentElement.className,dw:document.documentElement.scrollWidth,dh:document.documentElement.scrollHeight,filterOpen:document.body.classList.contains('home-filter-sheet-open'),styles:sels.map(pick)}} ,sels);
              const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs,loaded};
            }
            fs.writeFileSync(f,P);const A={};for(const [w,s] of states)A[`${w}-${s}`]=await cap(w,s,'parent');
            fs.writeFileSync(f,C);let md=0,sd=0,ld=0,pe=0;const diffs=[];
            for(const [w,s] of states){const k=`${w}-${s}`,a=A[k],b=await cap(w,s,'candidate');pe+=a.errs.length+b.errs.length;if(JSON.stringify(a.data)!==JSON.stringify(b.data)){md++;diffs.push('meta:'+k)}if(a.png!==b.png){sd++;diffs.push('png:'+k)}if(a.loaded!==b.loaded){ld++;diffs.push('load:'+k)}}
            fs.writeFileSync(f,P);await browser.close();const pass=!md&&!sd&&!ld&&!pe;
            console.log(`FAMILY_RESULT|group=${process.env.GROUP}|indices=${process.env.LO}-${process.env.HI}|states=${states.length}|realFilterStates=${filterWidths.size}|metadataDiffs=${md}|screenshotDiffs=${sd}|loadDiffs=${ld}|pageErrors=${pe}|pass=${pass?1:0}|diffKeys=${diffs.join(',')}`);
            if(!pass)process.exitCode=2;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cp /tmp/parent.css "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
