name: Doke SCHED-C01B Diagnostic Reconciler

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01b-diagnostic-reconciler.yml'

permissions:
  contents: write

concurrency:
  group: sched-c01b-implementation-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Reconcile with persistent diagnostics
        shell: bash
        run: |
          set +e
          LOG=/tmp/sched-c01b-reconcile.log
          : > "$LOG"

          if grep -q "function deriveScheduleAuthority(raw, normalizedStatus)" assets/js/repositories/orders-repository.js \
            && grep -q '"version": "1.3.72"' config/domain-completion-matrix.json; then
            echo "C01B implementation already present; validating only." >> "$LOG"
            APPLY_STATUS=0
          else
            python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path

          source = Path('.github/workflows/sched-001-c01b-implementation-reconciliation.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Regenerate deterministic matrix"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Unable to locate canonical C01B codemod block')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          Path('/tmp/apply-c01b.py').write_text(normalized)
          PY
            EXTRACT_STATUS=$?
            if [ "$EXTRACT_STATUS" -eq 0 ]; then
              python /tmp/apply-c01b.py >> "$LOG" 2>&1
              APPLY_STATUS=$?
            else
              APPLY_STATUS=$EXTRACT_STATUS
            fi
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            npm run write:domain-completion-matrix >> "$LOG" 2>&1
            APPLY_STATUS=$?
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            {
              node --check assets/js/repositories/orders-repository.js &&
              node --check assets/js/services/orders-service.js &&
              node --check assets/js/pages/pedidos-local-orders.js &&
              npm run audit:sched-001-c01b-frontend-canonical-schedule-read-model &&
              npm run test:sched-001-c01b-frontend-canonical-schedule-read-model &&
              npm run audit:sched-001-c01a-frontend-canonical-authority-readiness &&
              npm run test:sched-001-c01a-frontend-canonical-authority-readiness &&
              npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure &&
              node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js &&
              node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js &&
              node scripts/audit-ord-001-a11-scheduling-authority-handoff.js &&
              node scripts/audit-ord-001-a10-blocker-reconciliation.js &&
              npm run audit:domain-completion-matrix &&
              git diff --check
            } >> "$LOG" 2>&1
            APPLY_STATUS=$?
          fi

          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"

          if [ "$APPLY_STATUS" -eq 0 ]; then
            rm -f config/sched-001-c01b-reconciliation-diagnostic.txt
            git add assets/js/repositories/orders-repository.js
            git add assets/js/services/orders-service.js
            git add assets/js/pages/pedidos-local-orders.js
            git add scripts/audit-sched-001-c01a-frontend-canonical-authority-readiness.js
            git add scripts/test-sched-001-c01a-frontend-canonical-authority-readiness.js
            git add package.json
            git add config/domain-completion-matrix.json
            git add docs/DOMAIN-COMPLETION-MATRIX.md
            git add -f reports/generated/domain-completion-matrix-report.json
            git add -u config/sched-001-c01b-reconciliation-diagnostic.txt
            if git diff --cached --quiet; then
              echo "C01B already published and valid."
              exit 0
            fi
            git diff --cached --check
            git commit -m "feat(sched): implement C01B canonical schedule read model"
            git push origin HEAD:ord/ord-001-baseline-audit
            exit $?
          fi

          ERROR_TAIL=$(tail -n 120 "$LOG")
          git reset --hard HEAD
          {
            echo "SCHED-C01B reconciliation failed closed."
            echo "head=$(git rev-parse HEAD)"
            echo "status=$APPLY_STATUS"
            echo ""
            echo "$ERROR_TAIL"
          } > config/sched-001-c01b-reconciliation-diagnostic.txt
          git add config/sched-001-c01b-reconciliation-diagnostic.txt
          git commit -m "test(sched): record C01B reconciliation diagnostic"
          git push origin HEAD:ord/ord-001-baseline-audit
          exit 1
