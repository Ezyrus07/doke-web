name: ORD-A06 Runtime Reconcile Once

on:
  pull_request:
    paths:
      - .github/workflows/ord-a06-runtime-reconcile-once.yml
      - scripts/ord-a06-runtime-reconcile-once.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply provider separation and self-remove
        shell: bash
        run: |
          python scripts/ord-a06-runtime-reconcile-once.py
          git rm .github/workflows/ord-a06-runtime-reconcile-once.yml scripts/ord-a06-runtime-reconcile-once.py
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-ord-001-a06-visual-settlement.js
          node scripts/test-order-visual-settlement-runtime.js
          node scripts/audit-ord-001-a05-command-activation.js
          node scripts/test-order-command-activation-runtime.js
          node scripts/audit-ord-001-a04-read-authority.js
          node scripts/test-order-read-authority-runtime.js
          node scripts/audit-ord-001-a03-command-boundary.js
          node scripts/test-order-command-boundary-runtime.js
          node scripts/test-order-state-machine-runtime.js
          node scripts/audit-domain-completion-matrix.js
          git add assets/js/core/runtime-config.js assets/js/repositories/orders-repository.js assets/js/services/orders-service.js package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Separate ORD-A06 read and command providers"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

# One-shot applicator. It removes itself and its helper before matrix generation.
