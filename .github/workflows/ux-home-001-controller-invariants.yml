name: Apply UX-HOME-001 Controller Invariants

on:
  push:
    branches:
      - ux/ux-home-001-rail-states
    paths:
      - 'scripts/apply-ux-home-001-controller-invariants.py'
      - '.github/workflows/ux-home-001-controller-invariants.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-home-001-rail-states
          fetch-depth: 0

      - name: Apply controller invariants and gate coverage
        run: python3 scripts/apply-ux-home-001-controller-invariants.py

      - name: Remove operational files
        run: |
          rm scripts/apply-ux-home-001-controller-invariants.py
          rm .github/workflows/ux-home-001-controller-invariants.yml

      - name: Validate syntax and deterministic behavior
        run: |
          node --check assets/js/pages/home/rail-state.js
          node --check assets/js/pages/index-data-controller.js
          node --check scripts/test-ux-home-001-rail-state.js
          node --check scripts/test-ux-home-001-index-controller.js
          node scripts/test-ux-home-001-rail-state.js
          node scripts/test-ux-home-001-index-controller.js
          node scripts/audit-index-data-controller.js
          node scripts/test-public-service-catalog-contract.js
          node scripts/audit-action-favorite-ownership.js
          git diff --check

      - name: Commit canonical controller increment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -A
          git commit -m 'UX-HOME-001 validate Home rail integration behavior'
          git push origin HEAD:ux/ux-home-001-rail-states
