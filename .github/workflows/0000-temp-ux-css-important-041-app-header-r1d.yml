name: TEMP UX-CSS-IMPORTANT-041 App Header R1d

on:
  push:
    branches:
      - diag/ux-css-important-041-app-header-r1d
    paths:
      - .github/workflows/0000-temp-ux-css-important-041-app-header-r1d.yml

permissions:
  contents: write

jobs:
  reach-source-cascade-r1d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SHA: d23744276157a2ea28ac8fa4e44a8d5095103260
      PRODUCT_TREE: 40972482f565e3e9fac1b26291937c21c0b17f3c
      TARGET: assets/css/components/shell/app-header.css
      EXPECTED_IMPORTANT: '581'
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-css-important-041-app-header-r1d.yml
      RECEIPT_PATH: .diagnostics/ux-css-important-041-app-header-r1d.json
    steps:
      - name: Checkout diagnostic branch with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Freeze diagnostic isolation and certified predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$PRODUCT_TREE"
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-list --count "$PRODUCT_SHA..HEAD")" = 1
          test "$(git diff --name-only "$PRODUCT_SHA" HEAD)" = "$WORKFLOW_PATH"
          test "$(git status --porcelain)" = ""

      - name: Prove exact priority sites reach ownership and cascade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, posixpath, re, subprocess

          SHA=os.environ['PRODUCT_SHA']; TREE=os.environ['PRODUCT_TREE']; TARGET=os.environ['TARGET']; EXPECTED=int(os.environ['EXPECTED_IMPORTANT']); RECEIPT=os.environ['RECEIPT_PATH']
          REL=[
            'assets/css/components/layout/responsive-priority-contract.css',
            'assets/css/components/navigation/app-mobile-header-contract.css',
            'assets/css/components/shell/doke-shell-contract.css',
            'assets/css/components/navigation/mobile-search-header-shared.css',
          ]
          DOCS=['AGENTS.md','docs/CSS_AUTHORITY_MAP.md','docs/GLOBAL-LAYOUT-CONTRACT.md','docs/DESIGN-SYSTEM-GUIDE.md','docs/BASELINE-VISUAL-APPROVED.md','docs/DOKE-PLANO-MESTRE-CONCLUSAO-PLATAFORMA.md','docs/DOMAIN-COMPLETION-MATRIX.md']

          def sh(*a): return subprocess.check_output(a,text=True).rstrip('\n')
          files=sh('git','ls-tree','-r','--name-only',SHA).splitlines(); fset=set(files)
          def read(p): return subprocess.check_output(['git','show',f'{SHA}:{p}']).decode('utf8','replace')
          def blob(p): return sh('git','rev-parse',f'{SHA}:{p}')

          target=read(TARGET)
          raw_positions=[m.start() for m in re.finditer(r'!important\b',target,re.I)]
          assert len(raw_positions)==EXPECTED,(len(raw_positions),EXPECTED)

          def split_selectors(header):
              out=[]; start=0; par=br=0; quote=None; esc=False; comment=False; i=0
              while i<len(header):
                  c=header[i]; n=header[i+1] if i+1<len(header) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c=='/' and n=='*': comment=True; i+=2; continue
                  if c in "'\"": quote=c
                  elif c=='(': par+=1
                  elif c==')': par=max(0,par-1)
                  elif c=='[': br+=1
                  elif c==']': br=max(0,br-1)
                  elif c==',' and par==0 and br==0:
                      x=' '.join(header[start:i].split())
                      if x: out.append(x)
                      start=i+1
                  i+=1
              x=' '.join(header[start:].split())
              if x: out.append(x)
              return out

          def parse_css(text):
              # Dependency-free lexical CSS scanner. It resolves every declaration and every !important site;
              # any unmatched brace/comment/string or unresolved priority site fails closed.
              stack=[]
              rules=[]
              priority_sites=[]
              all_keys=set()
              i=0; n=len(text); quote=None; esc=False; comment=False; par=br=0; segment_start=0

              def active_rule_frame():
                  for fr in reversed(stack):
                      if not fr['header'].lstrip().startswith('@'):
                          return fr
                  return None

              def parse_declaration(seg, abs_start, important_offsets=None):
                  # Find first top-level ':' in this declaration segment.
                  q=None; e=False; com=False; p=b=0; colon=None; j=0
                  while j<len(seg):
                      c=seg[j]; nn=seg[j+1] if j+1<len(seg) else ''
                      if com:
                          if c=='*' and nn=='/': com=False; j+=2; continue
                          j+=1; continue
                      if q:
                          if e:e=False
                          elif c=='\\':e=True
                          elif c==q:q=None
                          j+=1; continue
                      if c=='/' and nn=='*': com=True; j+=2; continue
                      if c in "'\"": q=c
                      elif c=='(': p+=1
                      elif c==')': p=max(0,p-1)
                      elif c=='[': b+=1
                      elif c==']': b=max(0,b-1)
                      elif c==':' and p==0 and b==0:
                          colon=j; break
                      j+=1
                  if colon is None: return None
                  prop=re.sub(r'/\*.*?\*/','',seg[:colon],flags=re.S).strip().lower()
                  if not re.match(r'^(?:--)?[a-zA-Z_][-\w]*$',prop): return None
                  value=seg[colon+1:].strip()
                  fr=active_rule_frame()
                  if fr is None: return None
                  selectors=split_selectors(fr['header'])
                  if not selectors: return None
                  rec={'property':prop,'value':value,'selectors':selectors,'context':[x['header'] for x in stack if x['header'].lstrip().startswith('@')], 'start':abs_start}
                  for s in selectors: all_keys.add((s,prop))
                  return rec

              while i<n:
                  c=text[i]; nn=text[i+1] if i+1<n else ''
                  if comment:
                      if c=='*' and nn=='/': comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c=='/' and nn=='*': comment=True; i+=2; continue
                  if c in "'\"": quote=c; i+=1; continue
                  if c=='(': par+=1; i+=1; continue
                  if c==')': par=max(0,par-1); i+=1; continue
                  if c=='[': br+=1; i+=1; continue
                  if c==']': br=max(0,br-1); i+=1; continue
                  if par==0 and br==0 and c=='{':
                      header=text[segment_start:i].strip()
                      if not header: raise AssertionError(f'empty block header at {i}')
                      stack.append({'header':header,'open':i,'segment_start':i+1})
                      segment_start=i+1; i+=1; continue
                  if par==0 and br==0 and c==';':
                      if stack:
                          seg=text[segment_start:i]
                          dec=parse_declaration(seg,segment_start)
                          if dec: rules.append(dec)
                      segment_start=i+1; i+=1; continue
                  if par==0 and br==0 and c=='}':
                      if not stack: raise AssertionError(f'unmatched close brace at {i}')
                      seg=text[segment_start:i]
                      dec=parse_declaration(seg,segment_start)
                      if dec: rules.append(dec)
                      stack.pop()
                      segment_start=i+1; i+=1; continue
                  i+=1

              if comment or quote or stack or par or br:
                  raise AssertionError({'comment':comment,'quote':quote,'stack':len(stack),'par':par,'br':br})

              # Resolve each literal priority marker to the declaration record that contains it.
              unresolved=[]
              for pos in [m.start() for m in re.finditer(r'!important\b',text,re.I)]:
                  hit=None
                  for rec in rules:
                      start=rec['start']; end=start+len(rec['property'])+1+len(rec['value'])+256
                      # Exact containment is recomputed from source statement boundaries below.
                      if start<=pos:
                          # choose latest declaration start before marker; validate property/value marker presence later
                          if hit is None or start>hit['start']: hit=rec
                  if hit is None or not re.search(r'!important\b',hit['value'],re.I):
                      unresolved.append(pos); continue
                  priority_sites.append({'offset':pos,'property':hit['property'],'selectors':hit['selectors'],'context':hit['context']})
              # Deduplicate marker-to-declaration ambiguity by offset; every raw marker must resolve once.
              priority_sites.sort(key=lambda x:x['offset'])
              return {'declarations':rules,'keys':all_keys,'prioritySites':priority_sites,'unresolved':unresolved}

          parsed=parse_css(target)
          assert len(parsed['prioritySites'])==EXPECTED,(len(parsed['prioritySites']),EXPECTED)
          assert len(parsed['unresolved'])==0,parsed['unresolved'][:20]
          priority_keys={(s,site['property']) for site in parsed['prioritySites'] for s in site['selectors']}

          # Reach/import graph from canonical root HTML pages.
          def strip_comments(s): return re.sub(r'/\*.*?\*/','',s,flags=re.S)
          def imports(p):
              out=[]; src=strip_comments(read(p)); rx=r'@import\s+(?:url\(\s*)?[\'\"]?([^\'\"\)\s;]+\.css(?:\?[^\'\"\)\s;]*)?)[\'\"]?\s*\)?[^;]*;'
              for m in re.finditer(rx,src,re.I):
                  raw=m.group(1); x=raw.split('?',1)[0].split('#',1)[0]
                  if re.match(r'^[a-z]+://',x,re.I): resolved=None
                  elif x.startswith('/'): resolved=x.lstrip('/')
                  else: resolved=posixpath.normpath(posixpath.join(posixpath.dirname(p),x))
                  out.append({'raw':raw,'resolved':resolved})
              return out
          css=[p for p in files if p.endswith('.css')]; im={p:imports(p) for p in css}
          direct_importers=sorted(p for p in css if any(x['resolved']==TARGET for x in im[p]))
          html=sorted(p for p in files if p.endswith('.html') and '/' not in p)
          lr=re.compile(r'<link\b[^>]*?href\s*=\s*[\'\"]([^\'\"]+)[\'\"][^>]*>',re.I|re.S)
          def starts(h):
              out=[]
              for x in lr.findall(read(h)):
                  x=x.split('?',1)[0].split('#',1)[0]
                  if x.endswith('.css') and not re.match(r'^[a-z]+://',x,re.I): out.append(posixpath.normpath(x.lstrip('/')))
              return out
          hd={h:starts(h) for h in html}; direct_html=sorted(h for h in html if TARGET in hd[h])
          def closure(xs):
              seen=set(); st=list(xs)
              while st:
                  p=st.pop()
                  if p in seen or p not in fset or not p.endswith('.css'): continue
                  seen.add(p); st.extend(x['resolved'] for x in im.get(p,[]) if x['resolved'])
              return seen
          reach={h:closure(hd[h]) for h in html}; pages=sorted(h for h in html if TARGET in reach[h]); loaded=set().union(*reach.values()) if reach else set()

          needle=posixpath.basename(TARGET); runtime=[]; tooling=[]; other=[]
          for p in files:
              if p==TARGET or not re.search(r'\.(?:js|mjs|cjs|json|md|yml|yaml|html|css)$',p): continue
              try: t=read(p)
              except Exception: continue
              if TARGET not in t and needle not in t: continue
              if p.startswith('assets/js/'): runtime.append(p)
              elif p.startswith(('scripts/','tests/','.github/','docs/','config/')): tooling.append(p)
              else: other.append(p)
          runtime.sort(); tooling.sort(); other.sort()

          relations={}
          for p in REL:
              if p not in fset: continue
              rp=parse_css(read(p)); collisions=sorted(priority_keys & rp['keys'])
              relations[p]={
                'blob':blob(p),
                'importantMarkers':len(rp['prioritySites']),
                'unresolvedImportantSites':len(rp['unresolved']),
                'exactTargetPrioritySelectorPropertyCollisions':len(collisions),
                'collisionSamples':[{'selector':s,'property':prop} for s,prop in collisions[:50]],
                'targetImportsRelation':any(x['resolved']==p for x in im[TARGET]),
                'relationImportsTarget':any(x['resolved']==TARGET for x in im[p]),
              }

          whole=(TARGET not in loaded and not direct_html and not direct_importers and not runtime)
          receipt={
            'proof':'UX-CSS-IMPORTANT-041 Reach / Source / Cascade R1d','result':'PASS','checkpoint':'UX-CSS-IMPORTANT-041',
            'historicalDiagnosticFailures':[
              {'run':32857025592,'job':97831394473,'classification':'DIAGNOSTIC_HARNESS_DECLARATION_DOUBLE_COUNT','productMutation':False,'criteriaRelaxed':False},
              {'run':32857252380,'job':97832143791,'classification':'DIAGNOSTIC_HARNESS_HAND_PARSER_INCOMPLETE_579_OF_581','productMutation':False,'criteriaRelaxed':False},
              {'run':32857492002,'job':97832938727,'classification':'DIAGNOSTIC_HARNESS_MISSING_POSTCSS_DEPENDENCY','productMutation':False,'criteriaRelaxed':False},
            ],
            'product':{'sha':SHA,'tree':TREE},
            'target':{
              'path':TARGET,'blob':blob(TARGET),'sha256':hashlib.sha256(target.encode()).hexdigest(),'bytes':len(target.encode()),
              'important':len(raw_positions),'importantSites':len(parsed['prioritySites']),'unresolvedImportantSites':len(parsed['unresolved']),
              'prioritySelectorPropertyKeys':len(priority_keys),'declarationsParsed':len(parsed['declarations']),'imports':im[TARGET],
              'prioritySiteSamples':parsed['prioritySites'][:50],
            },
            'reach':{
              'rootHtmlCount':len(html),'loadedCssCount':len(loaded),'canonicalLoaded':TARGET in loaded,'wholeFileDormant':whole,
              'targetPages':pages,'directHtmlRefs':direct_html,'directImporters':direct_importers,'runtimeJsRefs':runtime,
              'toolingRefs':tooling,'otherRefs':other,'browserReconciliationRequired':not whole,
            },
            'authorityDocs':{p:blob(p) for p in DOCS if p in fset},'authorityRelations':relations,
            'criteria':{
              'expectedImportant':EXPECTED,'parserAuthority':'dependency-free-lexical-priority-site-scanner','criteriaRelaxed':0,
              'markerRemovalAttempted':False,'productMutation':False,'staging':False,'production':False,'backend':False,'supabase':False,'rpc':False,'migrations':False,'credentials':False,'runtimeRealtime':False,'merge':False,'readyForReview':False,'forcePush':False,'historyRewrite':False,
            }
          }
          os.makedirs(os.path.dirname(RECEIPT),exist_ok=True); open(RECEIPT,'w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Publish R1d receipt on diagnostic branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RECEIPT_PATH"
          test "$(git diff --cached --name-only)" = "$RECEIPT_PATH"
          git commit -m "diagnostic(ux-css-important-041): publish lexical app header R1d receipt"
          git push origin HEAD:diag/ux-css-important-041-app-header-r1d

      - name: Verify certified predecessor unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$PRODUCT_TREE"
          test "$(git show "$PRODUCT_SHA:$TARGET" | grep -o '!important' | wc -l | tr -d ' ')" = "$EXPECTED_IMPORTANT"
          test "$(git status --porcelain)" = ""
