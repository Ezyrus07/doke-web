name: Doke UX-CSS-DEBT-005 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-005-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PARENT_SHA: b5e569ae0f4827f4981ec436967e59470f6a7404
      TARGET_BRANCH: ux/ux-css-debt-005-community-interna-compaction
      TARGET_FILE: assets/css/pages/comunidade-interna.css
      EXPECTED_PARENT_SHA256: ddee624f00fe72d13b0c8d48b7bb93c4381b3461c7ca384464241178473c8696
      EXPECTED_CANDIDATE_SHA256: af971af4a1b5a907ff317d350afe8b1ae7deeaa1b38143f6732f87b4cba66bc8
    steps:
      - name: Checkout permanent target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard target remains exact certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_PARENT_SHA256}"
          git diff --exit-code

      - name: Build exact deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const source=fs.readFileSync(process.env.TARGET_FILE,'utf8');
          const lines=source.split(/\r?\n/);
          let depth=0,selectorParts=[],selector=null;const declarations=[],stack=[];
          const re=/^\s*([\w-]+)\s*:\s*(.*?)\s*(!important)?\s*;\s*$/;
          for(let i=0;i<lines.length;i++){
            const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector&&t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'){
              if(t.startsWith('@')&&line.includes('{'))stack.push({type:'at',header:t.replace(/\{\s*$/,'').replace(/\s+/g,' ').trim(),depthBefore:depth});
              else if(!t.startsWith('@')&&!line.includes(';')){selectorParts.push(t.replace(/\{\s*$/,'').trim());if(line.includes('{')){selector=selectorParts.join(' ').replace(/\s+/g,' ').trim();selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
            }
            if(selector){const m=line.match(re);if(m){const context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1],important:Boolean(m[3]),context});}}
            depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}
          }
          const last=new Map(),dead=[];
          for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push(d);if(!later||d.important||!later.important)last.set(key,d);}
          const deadSet=new Set(dead.map(d=>d.lineIndex));const candidate=lines.filter((_l,i)=>!deadSet.has(i)).join('\n');
          const sha=v=>crypto.createHash('sha256').update(v).digest('hex');
          if(sha(source)!==process.env.EXPECTED_PARENT_SHA256)throw new Error(`parent hash drift ${sha(source)}`);
          if(sha(candidate)!==process.env.EXPECTED_CANDIDATE_SHA256)throw new Error(`candidate hash drift ${sha(candidate)}`);
          if(declarations.length!==2670||dead.length!==98||new Set(dead.map(d=>d.selector)).size!==25)throw new Error('metric drift');
          if(Buffer.byteLength(source)!==133343||Buffer.byteLength(candidate)!==130867)throw new Error('byte drift');
          if((source.match(/!important/g)||[]).length||(candidate.match(/!important/g)||[]).length)throw new Error('unexpected !important');
          fs.writeFileSync(process.env.TARGET_FILE,candidate);
          NODE

      - name: Guard exact permanent delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "98"
          git diff --check

      - name: Commit and push product-only tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "${TARGET_FILE}"
          test "$(git diff --cached --name-only)" = "${TARGET_FILE}"
          git commit -m "UX-CSS-DEBT-005: compact superseded Community Internal declarations"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $2}')" = "98"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "PERMANENT_SHA=$(git rev-parse HEAD)"
