name: COM-B02CT-R3 Repository-Only Root-Scan-Neutral Contract Recovery

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/com-b02ct-repository-only-active-runtime-route-resolution-to-controlled-external-command-binding-readiness.yml'

permissions:
  contents: read

jobs:
  certify-b02ct-root-scan-neutral-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      B02CS_HEAD: 734395ff2366ee2e31917b9270758f7b7fffaae2
      B02CS_TREE: 8b056f97b70a8cdda7cee791031747882edab790
      R2_HEAD: 632b1b981dd87d298226cff2c1eca9ca7d5558ce
      R2_TREE: 8f7c37f1cdcc38078b5c2cf9f95a4e028d19cf30
      R2_RUN_ID: '33337112811'
      R2_WORKFLOW_BLOB: 9060a73e2f350ce7e365ff6aba807452c7ef0356
      PERSISTENT_CONFIG_BLOB: 02ff5bcf9b7837ac170bbde0da9d414b4664ebc6
      WORKFLOW: .github/workflows/com-b02ct-repository-only-active-runtime-route-resolution-to-controlled-external-command-binding-readiness.yml
      CONFIG: config/com-b02ct-repository-only-active-runtime-route-resolution-to-controlled-external-command-binding-readiness.json
      FAILED_TEST: scripts/test-com-b02ct-repository-only-active-runtime-route-resolution-to-controlled-external-command-binding-readiness.js
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_DERIVATIVE: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_DERIVATIVE_BLOB: 17cfe628187244c79305d3fe3415509e9111265d
      MATRIX_AUDITOR: scripts/audit-domain-completion-matrix.js
      MATRIX_AUDITOR_BLOB: f60d9b9efc8a191822b34d39d4e9137a59b8727e
      ROUTE_REGISTRY: backend/shared/http/route-registry.js
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER: backend/shared/http/module-route-loader.js
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      ROUTE_HANDLERS: backend/modules/communities/route-handlers.js
      ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      SURFACE_DESCRIPTOR: backend/shared/http/repository-only-route-surface-descriptor.js
      SURFACE_DESCRIPTOR_BLOB: c899df5404d9d7f90795f8933dfc44bdd57a1971
      SURFACE_RESOLVER: backend/shared/http/repository-only-route-surface-resolver.js
      SURFACE_RESOLVER_BLOB: 00df5c48a9ac4a72fefde4aa31486fe8ed46ea8c
      BEGIN_DISPATCHER: backend/shared/http/repository-only-route-begin-dispatcher.js
      BEGIN_DISPATCHER_BLOB: 00d8d8e62dfb7c30b70753f83fa172f3953aad83
      RESUME_DISPATCHER: backend/shared/http/repository-only-route-resume-dispatcher.js
      RESUME_DISPATCHER_BLOB: 4a8da53cca4ef27777c550e91f28a4abe5bbe542
      RESUME_REGISTRY_LOOKUP: backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration.js
      RESUME_REGISTRY_LOOKUP_BLOB: 43ba780f17ef23790d03224955cafe49c454ac6c
      COMMAND_ORCHESTRATION: backend/modules/communities/community-command-handler-repository-orchestration.js
      COMMAND_ORCHESTRATION_BLOB: f094ddc01a3f05975794bafb925d64f146a51ea2
      STAGING_API_RUNTIME: backend/runtime/staging/staging-api-runtime.js
      STAGING_API_RUNTIME_BLOB: 69de100fe3a269507a0da7847ae8e9887f831ceb

    steps:
      - name: Checkout exact R3 recovery candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze R2 lineage, root-scan-neutral scope and certified sources
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$R2_HEAD"
          test "$(git rev-parse "$R2_HEAD^{tree}")" = "$R2_TREE"
          test "$(git rev-parse "$R2_HEAD:$WORKFLOW")" = "$R2_WORKFLOW_BLOB"
          test "$(git rev-parse "$R2_HEAD:$CONFIG")" = "$PERSISTENT_CONFIG_BLOB"
          test "$(git rev-parse "$B02CS_HEAD^{tree}")" = "$B02CS_TREE"

          if git cat-file -e "HEAD:$CONFIG" 2>/dev/null; then
            echo 'R3 must remove the persistent B02CT config from the repository tree' >&2
            exit 1
          fi

          if test -e "$CONFIG"; then
            echo 'R3 checkout unexpectedly contains persistent B02CT config' >&2
            exit 1
          fi

          if test -e "$FAILED_TEST"; then
            echo 'R3 must not restore the persistent B02CT proof script' >&2
            exit 1
          fi

          r3_actual="$(git diff --name-status "$R2_HEAD" HEAD)"
          r3_expected="$(printf 'D\t%s\nM\t%s\n' "$CONFIG" "$WORKFLOW" | sort)"
          test "$(printf '%s\n' "$r3_actual" | sort)" = "$r3_expected"

          net_actual="$(git diff --name-only "$B02CS_HEAD" HEAD)"
          test "$net_actual" = "$WORKFLOW"

          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_DERIVATIVE)" = "$MATRIX_DERIVATIVE_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_AUDITOR)" = "$MATRIX_AUDITOR_BLOB"
          test "$(git rev-parse HEAD:$ROUTE_REGISTRY)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:$MODULE_ROUTE_LOADER)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:$ROUTE_HANDLERS)" = "$ROUTE_HANDLERS_BLOB"
          test "$(git rev-parse HEAD:$SURFACE_DESCRIPTOR)" = "$SURFACE_DESCRIPTOR_BLOB"
          test "$(git rev-parse HEAD:$SURFACE_RESOLVER)" = "$SURFACE_RESOLVER_BLOB"
          test "$(git rev-parse HEAD:$BEGIN_DISPATCHER)" = "$BEGIN_DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$RESUME_DISPATCHER)" = "$RESUME_DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$RESUME_REGISTRY_LOOKUP)" = "$RESUME_REGISTRY_LOOKUP_BLOB"
          test "$(git rev-parse HEAD:$COMMAND_ORCHESTRATION)" = "$COMMAND_ORCHESTRATION_BLOB"
          test "$(git rev-parse HEAD:$STAGING_API_RUNTIME)" = "$STAGING_API_RUNTIME_BLOB"

          git diff --check "$R2_HEAD" HEAD
          git diff --check "$B02CS_HEAD" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove Matrix is current before any runner-temp B02CT materialization
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node "$MATRIX_AUDITOR"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize isolated R3 contract and dynamic reference-resolution proof
        shell: bash
        run: |
          set -euo pipefail

          CONTRACT="$RUNNER_TEMP/com-b02ct-r3-contract.json"
          TEST="$RUNNER_TEMP/test-com-b02ct-r3-root-scan-neutral-readiness.js"
          PROOF="$RUNNER_TEMP/com-b02ct-r3-repository-only-readiness-proof.json"

          cat > "$CONTRACT" <<'JSON'
          {
            "contractId": "com-b02ct-repository-only-active-runtime-route-resolution-to-controlled-external-command-binding-readiness-v2",
            "boundaryId": "COM-B02CT",
            "recoveryBoundaryId": "COM-B02CT-R3",
            "domain": "COM-001",
            "mode": "repository-only-readiness",
            "state": "READINESS_ONLY",
            "predecessor": {
              "boundaryId": "COM-B02CS",
              "head": "734395ff2366ee2e31917b9270758f7b7fffaae2",
              "tree": "8b056f97b70a8cdda7cee791031747882edab790",
              "certificationRunId": 33291051581
            },
            "recovery": {
              "diagnosticBoundaryId": "COM-B02CT-R2",
              "diagnosticHead": "632b1b981dd87d298226cff2c1eca9ca7d5558ce",
              "diagnosticTree": "8f7c37f1cdcc38078b5c2cf9f95a4e028d19cf30",
              "diagnosticRunId": 33337112811,
              "rootCause": "APP-001 scanRoots [.] counts persistent text files at repository root scope; the persistent B02CT config JSON changed the scanned universe while the workflow YAML did not.",
              "strategy": "remove-persistent-config-and-materialize-contract-proof-only-under-runner-temp"
            },
            "objective": "Prove the structural seam from active runtime route resolution to the existing controlled external command binding lineage while keeping default active handlers fail-closed and invoking neither path.",
            "routes": [
              {
                "routeName": "communities.membership.command",
                "moduleName": "communities",
                "activeHandlerName": "executeMembershipCommand",
                "beginSurfaceName": "composeMembershipCommandRepositoryOnly",
                "resumeSurfaceName": "resumeCommandRepositoryOnlySurface"
              },
              {
                "routeName": "communities.governance.command",
                "moduleName": "communities",
                "activeHandlerName": "executeGovernanceCommand",
                "beginSurfaceName": "composeGovernanceCommandRepositoryOnly",
                "resumeSurfaceName": "resumeCommandRepositoryOnlySurface"
              },
              {
                "routeName": "communities.content.command",
                "moduleName": "communities",
                "activeHandlerName": "executeContentCommand",
                "beginSurfaceName": "composeContentCommandRepositoryOnly",
                "resumeSurfaceName": "resumeCommandRepositoryOnlySurface"
              }
            ],
            "frozenSources": {
              "routeRegistry": {
                "path": "backend/shared/http/route-registry.js",
                "blob": "04a039c1967ffb59502e05584d05831f7c9a1a41"
              },
              "moduleRouteLoader": {
                "path": "backend/shared/http/module-route-loader.js",
                "blob": "85e061fe36339596ba9558a503b2fa7ce02574ae"
              },
              "routeHandlers": {
                "path": "backend/modules/communities/route-handlers.js",
                "blob": "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
              },
              "surfaceDescriptor": {
                "path": "backend/shared/http/repository-only-route-surface-descriptor.js",
                "blob": "c899df5404d9d7f90795f8933dfc44bdd57a1971"
              },
              "surfaceResolver": {
                "path": "backend/shared/http/repository-only-route-surface-resolver.js",
                "blob": "00df5c48a9ac4a72fefde4aa31486fe8ed46ea8c"
              },
              "beginDispatcher": {
                "path": "backend/shared/http/repository-only-route-begin-dispatcher.js",
                "blob": "00d8d8e62dfb7c30b70753f83fa172f3953aad83"
              },
              "resumeDispatcher": {
                "path": "backend/shared/http/repository-only-route-resume-dispatcher.js",
                "blob": "4a8da53cca4ef27777c550e91f28a4abe5bbe542"
              },
              "resumeRegistryLookupIntegration": {
                "path": "backend/shared/http/repository-only-route-resume-dispatcher-registry-lookup-integration.js",
                "blob": "43ba780f17ef23790d03224955cafe49c454ac6c"
              },
              "commandOrchestration": {
                "path": "backend/modules/communities/community-command-handler-repository-orchestration.js",
                "blob": "f094ddc01a3f05975794bafb925d64f146a51ea2"
              },
              "stagingApiRuntime": {
                "path": "backend/runtime/staging/staging-api-runtime.js",
                "blob": "69de100fe3a269507a0da7847ae8e9887f831ceb"
              }
            },
            "rootCause": {
              "activeRuntimePath": "route-registry -> module-route-loader.getHandler() -> active execute handler",
              "repositoryOnlyPath": "COM-B02W/X -> COM-B02Y -> COM-B02T -> existing continuation/resume lineage through COM-B02CO",
              "gap": "The active runtime resolves the fail-closed execute handler directly; the certified repository-only command lineage remains separate and is not wired into active dispatch.",
              "duplicateMechanismRequired": false
            },
            "persistentScope": {
              "allowedFiles": [
                ".github/workflows/com-b02ct-repository-only-active-runtime-route-resolution-to-controlled-external-command-binding-readiness.yml"
              ],
              "persistentConfigAllowed": false,
              "persistentScriptAllowed": false,
              "matrixSourceWriteAllowed": false,
              "matrixDerivativeWriteAllowed": false
            },
            "authority": {
              "repositoryOnlyReadinessAuthority": true,
              "activeExecuteHandlerInvocationAuthority": false,
              "repositoryOnlySurfaceInvocationAuthority": false,
              "externalCommandBindingInvocationAuthority": false,
              "repositoryOperationInvocationAuthority": false,
              "credentialReadAuthority": false,
              "rpcExecutionAuthority": false,
              "networkAuthority": false,
              "supabaseAuthority": false,
              "stagingDeploymentAuthority": false,
              "stagingTrafficAuthority": false,
              "runtimeWiringAuthority": false,
              "runtimeActivationAuthority": false,
              "realtimeActivationAuthority": false,
              "migrationApplicationAuthority": false,
              "productionAuthority": false,
              "pullRequestMergeAuthority": false,
              "readyForReviewAuthority": false
            },
            "rollback": "Revert the single R3 commit to restore the R2 workflow and persistent diagnostic-era config; no implementation source or Matrix source/derivative is changed by R3."
          }
          JSON

          cat > "$TEST" <<'NODE'
          'use strict';

          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');
          const Module = require('module');
          const { execFileSync } = require('child_process');

          const root = process.cwd();
          const configPath = process.env.B02CT_TEMP_CONFIG;
          const proofPath = process.env.PROOF_PATH;

          assert.ok(configPath);
          assert.ok(proofPath);
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

          function source(relativePath) {
            return fs.readFileSync(path.join(root, relativePath), 'utf8');
          }

          function frozenBlob(relativePath) {
            return execFileSync('git', ['rev-parse', `HEAD:${relativePath}`], { encoding: 'utf8' }).trim();
          }

          for (const entry of Object.values(config.frozenSources)) {
            assert.strictEqual(frozenBlob(entry.path), entry.blob, `frozen blob drift: ${entry.path}`);
          }

          const routeRegistry = require(path.join(root, config.frozenSources.routeRegistry.path));
          const routeHandlers = require(path.join(root, config.frozenSources.routeHandlers.path));

          const loaderPath = path.join(root, config.frozenSources.moduleRouteLoader.path);
          const originalLoad = Module._load;
          const unrelatedRouteHandlerRequests = new Set([
            '../../modules/auth/route-handlers',
            '../../modules/orders/route-handlers',
            '../../modules/messaging/route-handlers',
            '../../modules/notifications/route-handlers',
            '../../modules/wallet/route-handlers',
            '../../modules/admin/route-handlers'
          ]);

          Module._load = function patchedLoad(request, parent, isMain) {
            if (parent && path.resolve(parent.filename) === loaderPath && unrelatedRouteHandlerRequests.has(request)) {
              return Object.freeze({
                routes: Object.freeze([]),
                handlers: Object.freeze({})
              });
            }
            return originalLoad.call(this, request, parent, isMain);
          };

          let moduleRouteLoader;
          try {
            delete require.cache[require.resolve(loaderPath)];
            moduleRouteLoader = require(loaderPath);
          } finally {
            Module._load = originalLoad;
          }

          const surfaceDescriptor = require(path.join(root, config.frozenSources.surfaceDescriptor.path));
          const surfaceResolver = require(path.join(root, config.frozenSources.surfaceResolver.path));

          assert.strictEqual(config.boundaryId, 'COM-B02CT');
          assert.strictEqual(config.recoveryBoundaryId, 'COM-B02CT-R3');
          assert.strictEqual(config.predecessor.boundaryId, 'COM-B02CS');
          assert.strictEqual(config.persistentScope.persistentConfigAllowed, false);
          assert.strictEqual(config.persistentScope.persistentScriptAllowed, false);
          assert.strictEqual(config.authority.activeExecuteHandlerInvocationAuthority, false);
          assert.strictEqual(config.authority.repositoryOnlySurfaceInvocationAuthority, false);
          assert.strictEqual(config.authority.repositoryOperationInvocationAuthority, false);
          assert.strictEqual(config.authority.networkAuthority, false);
          assert.strictEqual(config.authority.runtimeWiringAuthority, false);
          assert.strictEqual(config.authority.runtimeActivationAuthority, false);

          const stagingRuntimeSource = source(config.frozenSources.stagingApiRuntime.path);
          assert.ok(stagingRuntimeSource.includes("const { listRoutes } = require('../../shared/http/route-registry');"));
          assert.ok(stagingRuntimeSource.includes("const { getHandler } = require('../../shared/http/module-route-loader');"));
          assert.ok(stagingRuntimeSource.includes('const handler = getHandler(match.route.module, match.route.handler);'));
          assert.ok(stagingRuntimeSource.includes('const result = await handler({'));
          assert.strictEqual(stagingRuntimeSource.includes('getRepositoryOnlySurface'), false);
          assert.strictEqual(stagingRuntimeSource.includes('repository-only-route-begin-dispatcher'), false);
          assert.strictEqual(stagingRuntimeSource.includes('repository-only-route-resume-dispatcher'), false);

          const routeHandlerSource = source(config.frozenSources.routeHandlers.path);
          assert.ok(routeHandlerSource.includes("const B02F_FAILURE_CODE = 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED';"));
          for (const entry of config.routes) {
            assert.ok(routeHandlerSource.includes(`async function ${entry.activeHandlerName}()`));
            assert.ok(routeHandlerSource.includes(`throw createB02FBlockedRouteError('${entry.routeName}');`));
          }

          const beginSource = source(config.frozenSources.beginDispatcher.path);
          const resumeSource = source(config.frozenSources.resumeDispatcher.path);
          const registryLookupSource = source(config.frozenSources.resumeRegistryLookupIntegration.path);
          const orchestrationSource = source(config.frozenSources.commandOrchestration.path);

          assert.ok(beginSource.includes('function dispatchRepositoryOnlyRouteBegin'));
          assert.ok(beginSource.includes('routeName, packet, options = {}'));
          assert.ok(beginSource.includes('const state = resolution.beginSurface(packet, options);'));
          assert.ok(resumeSource.includes('function dispatchRepositoryOnlyRouteResume'));
          assert.ok(registryLookupSource.includes('repository-only-route-resume-dispatcher'));
          assert.ok(orchestrationSource.includes('function beginRepositoryOnlyCommandHandlerOrchestration(routeName, packet, options = {})'));
          assert.ok(orchestrationSource.includes('function resumeRepositoryOnlyCommandHandlerOrchestration(orchestration, repositoryResult, options = {})'));

          assert.strictEqual(surfaceDescriptor.BOUNDARY_ID, 'COM-B02W');
          assert.strictEqual(surfaceResolver.BOUNDARY_ID, 'COM-B02X');

          const results = [];
          for (const entry of config.routes) {
            const registryRoute = routeRegistry.findRouteByName(entry.routeName);
            assert.ok(registryRoute, `missing active route: ${entry.routeName}`);
            assert.strictEqual(registryRoute.module, entry.moduleName);
            assert.strictEqual(registryRoute.handler, entry.activeHandlerName);

            const activeHandler = moduleRouteLoader.getHandler(entry.moduleName, entry.activeHandlerName);
            const beginSurface = moduleRouteLoader.getRepositoryOnlySurface(entry.moduleName, entry.beginSurfaceName);
            const resumeSurface = moduleRouteLoader.getRepositoryOnlySurface(entry.moduleName, entry.resumeSurfaceName);

            assert.strictEqual(activeHandler, routeHandlers.handlers[entry.activeHandlerName]);
            assert.strictEqual(activeHandler, routeHandlers[entry.activeHandlerName]);
            assert.strictEqual(beginSurface, routeHandlers[entry.beginSurfaceName]);
            assert.strictEqual(resumeSurface, routeHandlers[entry.resumeSurfaceName]);
            assert.notStrictEqual(activeHandler, beginSurface);
            assert.notStrictEqual(activeHandler, resumeSurface);

            const descriptor = surfaceDescriptor.describeRepositoryOnlyRouteSurface(entry.routeName);
            assert.ok(descriptor, `missing descriptor: ${entry.routeName}`);
            assert.strictEqual(descriptor.activeHandlerName, entry.activeHandlerName);
            assert.strictEqual(descriptor.beginSurfaceName, entry.beginSurfaceName);
            assert.strictEqual(descriptor.resumeSurfaceName, entry.resumeSurfaceName);

            const resolution = surfaceResolver.resolveRepositoryOnlyRouteSurface(entry.routeName);
            assert.ok(resolution, `missing resolver result: ${entry.routeName}`);
            assert.strictEqual(resolution.activeHandlerName, entry.activeHandlerName);
            assert.strictEqual(resolution.beginSurfaceName, entry.beginSurfaceName);
            assert.strictEqual(resolution.resumeSurfaceName, entry.resumeSurfaceName);
            assert.strictEqual(resolution.beginSurface, beginSurface);
            assert.strictEqual(resolution.resumeSurface, resumeSurface);
            assert.strictEqual(resolution.executableReferencesResolved, true);
            assert.strictEqual(resolution.executableReferencesInvoked, false);

            results.push(Object.freeze({
              routeName: entry.routeName,
              activeRuntimeRouteResolved: true,
              activeHandlerReferenceResolvedNotInvoked: true,
              repositoryOnlyBeginReferenceResolvedNotInvoked: true,
              repositoryOnlyResumeReferenceResolvedNotInvoked: true,
              descriptorParity: true,
              resolverParity: true,
              activeAndRepositoryOnlyReferencesRemainSeparated: true,
              controlledExternalBindingLineageReusable: true,
              defaultFailClosedPreserved: true
            }));
          }

          assert.strictEqual(results.length, 3);

          const proof = Object.freeze({
            contractId: config.contractId,
            boundaryId: config.boundaryId,
            recoveryBoundaryId: config.recoveryBoundaryId,
            domain: config.domain,
            mode: config.mode,
            state: 'REPOSITORY_READINESS_PASS',
            head: process.env.GITHUB_SHA,
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            predecessor: config.predecessor,
            recovery: config.recovery,
            proofTarget: 'active runtime route resolution -> existing controlled external command binding lineage (references resolved, never invoked)',
            cases: results,
            invariants: Object.freeze({
              persistentConfigPresent: false,
              persistentProofScriptPresent: false,
              matrixSourceChanged: false,
              matrixDerivativeChanged: false,
              activeExecuteHandlerInvoked: false,
              repositoryOnlyBeginSurfaceInvoked: false,
              repositoryOnlyResumeSurfaceInvoked: false,
              beginDispatcherInvoked: false,
              resumeDispatcherInvoked: false,
              externalCommandBindingInvoked: false,
              repositoryOperationInvoked: false,
              credentialReadExecuted: false,
              rpcExecuted: false,
              networkExecuted: false,
              supabaseOperationExecuted: false,
              stagingReadExecuted: false,
              stagingMutationExecuted: false,
              runtimeWiringChanged: false,
              runtimeActivated: false,
              realtimeActivated: false,
              migrationApplied: false,
              productionChanged: false,
              mergeExecuted: false,
              readyForReviewExecuted: false
            })
          });

          fs.writeFileSync(proofPath, `${JSON.stringify(proof, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(proof));
          NODE

          case "$(realpath "$CONTRACT")" in
            "$(realpath "$GITHUB_WORKSPACE")"/*)
              echo 'R3 contract must remain outside GITHUB_WORKSPACE' >&2
              exit 1
              ;;
          esac

          case "$(realpath "$TEST")" in
            "$(realpath "$GITHUB_WORKSPACE")"/*)
              echo 'R3 proof must remain outside GITHUB_WORKSPACE' >&2
              exit 1
              ;;
          esac

          if grep -Eq '\bexecute(Membership|Governance|Content)Command[[:space:]]*\(' "$TEST"; then
            echo 'R3 proof must not invoke active execute handlers' >&2
            exit 1
          fi

          if grep -Eq '\b(composeMembershipCommandRepositoryOnly|composeGovernanceCommandRepositoryOnly|composeContentCommandRepositoryOnly|resumeCommandRepositoryOnlySurface|dispatchRepositoryOnlyRouteBegin|dispatchRepositoryOnlyRouteResume)[[:space:]]*\(' "$TEST"; then
            echo 'R3 proof must not invoke repository-only surfaces or dispatchers' >&2
            exit 1
          fi

          export B02CT_TEMP_CONFIG="$CONTRACT"
          export PROOF_PATH="$PROOF"

          node --check "$TEST"
          node "$TEST"
          test -s "$PROOF"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove runner-temp contract and proof are Matrix-invisible
        shell: bash
        run: |
          set -euo pipefail
          node "$MATRIX_AUDITOR"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_DERIVATIVE)" = "$MATRIX_DERIVATIVE_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run repository governance without dependency installation
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          git diff --check "$R2_HEAD" HEAD
          git diff --check "$B02CS_HEAD" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit R3 repository-only proof evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/com-b02ct-r3-repository-only-readiness-proof.json"
          cat "$RUNNER_TEMP/com-b02ct-r3-repository-only-readiness-proof.json"
          printf '%s\n' 'COM-B02CT-R3 repository-only root-scan-neutral recovery proof passed.'
