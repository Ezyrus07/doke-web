name: Doke UX-CSS-DEBT-028 PR198 Exact Certification

on:
  push:
    branches: [diag/ux-css-debt-028-certify-pr198]

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: baf6adc3dffcb875ff9442be4c808bad589d4cf4
      PARENT_SHA: 2b4fda807a207f3a7c4a93a35a69a5401ee330dc
      BASE_BRANCH: ux/ux-css-debt-028-media-overlay-ownership-prereq
      HEAD_BRANCH: ux/ux-css-debt-028-workers-feed-compaction
      TARGET_FILE: assets/css/pages/home-overlays/workers-feed-base.css
      TARGET_SHA256: 5c41013a124efaf1e9b03912a854f14d033e11be49234b35130bfedbb5406c95
      TARGET_BLOB: a2e77c770ac5720d5d3ba03b1ee987fb5061b2e3
      TARGET_BYTES: '12686'
      PROJECT_KEY: Ezyrus07_doke-web
      PR_NUMBER: '198'
      CANDIDATE_RUN: '31760454664'
      CANDIDATE_JOB: '94645490151'
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Materialize residual helper outside repository
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/diag-ux-css-debt-028-certify-residual.js /tmp/diag-ux-css-debt-028-certify-residual.js
          test -s /tmp/diag-ux-css-debt-028-certify-residual.js
          node --check /tmp/diag-ux-css-debt-028-certify-residual.js

      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          clean: true

      - name: Guard exact permanent tree and candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = 1
          test "$(git diff --name-only "$PARENT_SHA...HEAD")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA...HEAD" -- "$TARGET_FILE" | awk '{print $1}')" = 0
          test "$(git diff --numstat "$PARENT_SHA...HEAD" -- "$TARGET_FILE" | awk '{print $2}')" = 6
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$PARENT_SHA"
          test "$(git merge-base "$TARGET_SHA" "refs/remotes/origin/$BASE_BRANCH")" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA...HEAD"
          test -z "$(git status --porcelain)"
          echo "EXACT TREE PASS|head=$TARGET_SHA|parent=$PARENT_SHA|count=1|files=1|additions=0|deletions=6|merge-base=$PARENT_SHA|blob=$TARGET_BLOB|sha256=$TARGET_SHA256|bytes=$TARGET_BYTES"
          echo "CANDIDATE IDENTITY PASS|run=$CANDIDATE_RUN|job=$CANDIDATE_JOB|sha256=$TARGET_SHA256|runtime=0-diffs|responsive=893/0/277"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Clean governance and canonical residual
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:agent-governance
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          npm run audit:active-legacy-structures
          node /tmp/diag-ux-css-debt-028-certify-residual.js
          echo "CLEAN GOVERNANCE PASS|conflicts=339|residual=46/1274/0|domain=23/15/2.91/12"

      - name: Dependency advisory snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          const v=x.metadata?.vulnerabilities||{};
          console.log(`NPM AUDIT SNAPSHOT|total=${v.total ?? 'na'}|high=${v.high ?? 'na'}|moderate=${v.moderate ?? 'na'}|low=${v.low ?? 'na'}|critical=${v.critical ?? 'na'}`);
          NODE

      - name: Reset exact permanent SHA before Sonar
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$PARENT_SHA"
          test "$(git merge-base "$TARGET_SHA" "refs/remotes/origin/$BASE_BRANCH")" = "$PARENT_SHA"

      - name: Require Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"

      - name: Analyze PR 198 exact SHA and enforce SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=198
            -Dsonar.pullrequest.branch=ux/ux-css-debt-028-workers-feed-compaction
            -Dsonar.pullrequest.base=ux/ux-css-debt-028-media-overlay-ownership-prereq
            -Dsonar.scm.revision=baf6adc3dffcb875ff9442be4c808bad589d4cf4
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

      - name: Verify Sonar API final PR gate
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY&pullRequest=$PR_NUMBER" -o /tmp/sonar-gate.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/sonar-gate.json','utf8'));
          const s=x.projectStatus?.status;
          console.log('SONAR API STATUS='+s);
          if(s!=='OK') throw Error('Sonar gate '+s);
          NODE

      - name: Final exact certification marker and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$PARENT_SHA"
          test "$(git merge-base "$TARGET_SHA" "refs/remotes/origin/$BASE_BRANCH")" = "$PARENT_SHA"
          echo "CERTIFICATION PASS|pr=$PR_NUMBER|sha=$TARGET_SHA|parent=$PARENT_SHA|candidate=$TARGET_SHA256|runtime=candidate-byte-equivalent-0-diffs|responsive=893/0/277|conflicts=339|residual=46/1274/0|domain=23/15/2.91/12|sonar=OK"
