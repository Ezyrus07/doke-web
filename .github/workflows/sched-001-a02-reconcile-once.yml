name: SCHED-A02 Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/sched-001-a02-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile SCHED-A02 contract freeze
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const a02Path = 'config/sched-001-a02-command-event-timezone-conflict-contract.json';
          const a02 = JSON.parse(fs.readFileSync(a02Path, 'utf8'));

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['audit:sched-001-a02-command-event-timezone-conflict-contract'] =
            'node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js';
          pkg.scripts['test:sched-001-a02-contract-runtime'] =
            'node scripts/test-sched-001-a02-contract-runtime.js';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const a01Path = 'config/sched-001-a01-repository-baseline-staging-security-preflight.json';
          const a01 = JSON.parse(fs.readFileSync(a01Path, 'utf8'));
          a01.orderedNextActions = [...a02.orderedNextActions];
          fs.writeFileSync(a01Path, JSON.stringify(a01, null, 2) + '\n');

          const a11Path = 'config/ord-001-a11-scheduling-authority-handoff.json';
          const a11 = JSON.parse(fs.readFileSync(a11Path, 'utf8'));
          a11.orderedNextActions = [...a02.orderedNextActions];
          fs.writeFileSync(a11Path, JSON.stringify(a11, null, 2) + '\n');

          const a10Path = 'config/ord-001-a10-blocker-reconciliation.json';
          const a10 = JSON.parse(fs.readFileSync(a10Path, 'utf8'));
          a10.orderedNextActions[0] = 'Execute SCHED-A03 reservation migration generation and local contract tests without applying any migration or mutating staging.';
          fs.writeFileSync(a10Path, JSON.stringify(a10, null, 2) + '\n');

          const a01AuditPath = 'scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js';
          let a01Audit = fs.readFileSync(a01AuditPath, 'utf8');
          a01Audit = a01Audit.replace(
            "assert.strictEqual(matrix.version, '1.3.44');",
            "assert(Number(String(matrix.version).split('.')[2]) >= 44, `Matrix version ${matrix.version} predates SCHED-A01.`);"
          );
          fs.writeFileSync(a01AuditPath, a01Audit);

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.45';
          matrix.updatedAt = '2026-07-31T08:50:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
          if (!ord || !sched) throw new Error('ORD-001 or SCHED-001 missing from matrix');

          const paths = [
            a02Path,
            'backend/modules/scheduling/scheduling-contract.js',
            'docs/SCHED-001-A02-COMMAND-EVENT-TIMEZONE-CONFLICT-CONTRACT.md',
            'docs/validation/SCHED-001-A02-COMMAND-EVENT-TIMEZONE-CONFLICT-CONTRACT.json',
            'scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js',
            'scripts/test-sched-001-a02-contract-runtime.js',
            '.github/workflows/sched-001-a02-command-event-timezone-conflict-contract.yml'
          ];
          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };
          appendUnique(ord.requiredPaths, paths);
          appendUnique(sched.requiredPaths, paths);
          appendUnique(ord.tests, ['audit:sched-001-a02-command-event-timezone-conflict-contract']);
          appendUnique(sched.tests, [
            'audit:sched-001-a02-command-event-timezone-conflict-contract',
            'test:sched-001-a02-contract-runtime'
          ]);
          appendUnique(ord.evidence, [
            'SCHED-A02 freezes the server-only scheduling command boundary, durable event envelope, IANA timezone policy, optimistic concurrency, idempotency and half-open conflict semantics without changing staging.',
            'ORD-001 remains prohibited from direct schedule mutation or parallel conflict detection and will consume schedule_reservation_id plus durable schedule events.'
          ]);
          appendUnique(sched.evidence, [
            'SCHED-A02 freezes six commands, six durable event types, held/confirmed active occupancy, server-only confirmation, UTC plus IANA timezone interpretation and [start,end) ranges.',
            'The executable pure scheduling contract proves overlap, adjacency, actor, transition, version, idempotency, event-key and hold-expiration semantics without database, network or browser access.',
            'No SCHED blocker closes at A02: migration, server runtime, order reference and policy hardening remain required.'
          ]);

          const descriptions = {
            'SCHED-B02': 'SCHED-A02 freezes the canonical command, transition, actor, idempotency, timezone and durable-event contract, but the server scheduling runtime is not implemented.',
            'SCHED-B03': 'SCHED-A02 freezes held and confirmed active occupancy with [start,end) overlap semantics and a btree_gist GiST exclusion design, but no migration or concurrent database proof exists.',
            'SCHED-B04': 'SCHED-A02 freezes orders.schedule_reservation_id and event-driven scheduled_at projection as the integration contract, but the schema and runtime integration do not exist.',
            'SCHED-B05': 'SCHED-A02 forbids professional direct booking and reserves confirmation for the server command boundary, but availability policy hardening and canonical reservation commands are not implemented.'
          };
          sched.blockers = sched.blockers.map((blocker) => ({
            ...blocker,
            description: descriptions[blocker.id] || blocker.description
          }));
          sched.nextActions = [...a02.orderedNextActions];
          ord.nextActions = [...a10.orderedNextActions];
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');

          const progressNote = '\n\n## Progression after SCHED-A02\n\nSCHED-A02 is complete as a repository-only executable contract. The next safe sublot is SCHED-A03 migration generation and local tests; no migration application or staging mutation is authorized.\n';
          for (const docPath of [
            'docs/SCHED-001-A01-REPOSITORY-BASELINE-STAGING-SECURITY-PREFLIGHT.md',
            'docs/ORD-001-A11-SCHEDULING-AUTHORITY-HANDOFF.md',
            'docs/ORD-001-A10-BLOCKER-RECONCILIATION.md'
          ]) {
            let text = fs.readFileSync(docPath, 'utf8');
            if (!text.includes('## Progression after SCHED-A02')) text += progressNote;
            fs.writeFileSync(docPath, text);
          }
          NODE

          node scripts/test-sched-001-a02-contract-runtime.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/test-public-data-authority-contract.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json
          git add config/sched-001-a01-repository-baseline-staging-security-preflight.json
          git add config/ord-001-a10-blocker-reconciliation.json config/ord-001-a11-scheduling-authority-handoff.json
          git add scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          git add docs/SCHED-001-A01-REPOSITORY-BASELINE-STAGING-SECURITY-PREFLIGHT.md
          git add docs/ORD-001-A10-BLOCKER-RECONCILIATION.md docs/ORD-001-A11-SCHEDULING-AUTHORITY-HANDOFF.md
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile SCHED-A02 contract freeze' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
