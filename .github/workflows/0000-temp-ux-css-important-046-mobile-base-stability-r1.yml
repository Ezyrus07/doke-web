name: TEMP UX-CSS-IMPORTANT-046 Mobile Base Stability R1
on:
  push:
    branches:
      - diag/ux-css-important-046-mobile-base-stability-r1
permissions:
  contents: read
jobs:
  r1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Prove exact site closure and current whole-file dormancy
        shell: bash
        run: |
          set -euo pipefail
          PARENT=53e5733a4fb7cd293cc2ab17bd53f64338a72b8d
          TREE=4958068fa2e44aee05e390fae0af5ad18c633947
          TARGET=assets/css/components/shell/mobile-base-stability.css
          BLOB=fe3efc820ef1bbbdbad1b40b99513d156243e04e
          test "$(git rev-parse "$PARENT^{tree}")" = "$TREE"
          test "$(git rev-parse "$PARENT:$TARGET")" = "$BLOB"
          git checkout --detach "$PARENT" >/dev/null
          python3 - <<'PY'
          import pathlib,re,json,hashlib,subprocess
          target='assets/css/components/shell/mobile-base-stability.css'
          base=pathlib.PurePosixPath(target).name
          data=pathlib.Path(target).read_bytes(); text=data.decode('utf-8')
          markers=[m.start() for m in re.finditer(r'!important\b',text,re.I)]
          assert len(markers)==28, len(markers)
          assert len(data)==5306, len(data)

          sites=[]
          for i,pos in enumerate(markers,1):
              op=text.rfind('{',0,pos); cl=text.rfind('}',0,pos)
              assert op>cl, (i,pos)
              seg=text[op+1:pos]
              semi=seg.rfind(';')
              decl=seg[semi+1:] if semi>=0 else seg
              assert ':' in decl, (i,decl[-160:])
              prop=decl.split(':',1)[0].strip()
              assert re.match(r'^--?[A-Za-z0-9_-]+$|^[A-Za-z][A-Za-z0-9_-]*$',prop), (i,prop)
              sites.append({'n':i,'property':prop,'offset':pos})

          css=[p.as_posix() for p in pathlib.Path('assets/css').rglob('*.css')]
          def imports(p):
              s=pathlib.Path(p).read_text(encoding='utf-8',errors='ignore')
              out=[]
              for m in re.finditer(r'@import\s+(?:url\(\s*)?[\'\"]?([^\'\"\)\s;]+\.css(?:\?[^\'\"\)\s;]*)?)',s,re.I):
                  x=m.group(1).split('?',1)[0].split('#',1)[0]
                  if re.match(r'^[a-z]+://',x,re.I): continue
                  q=(pathlib.PurePosixPath(p).parent/x).as_posix() if not x.startswith('/') else x[1:]
                  out.append(str(pathlib.PurePosixPath(q)))
              return out
          im={p:imports(p) for p in css}

          html=[p for p in pathlib.Path('.').rglob('*.html') if not any(part in {'archive','reports','tools','test-results','node_modules'} for part in p.parts)]
          starts={}; direct=[]
          rx=re.compile(r'<link\b[^>]*?href\s*=\s*[\'\"]([^\'\"]+)[\'\"][^>]*>',re.I|re.S)
          for h in html:
              arr=[]; s=h.read_text(encoding='utf-8',errors='ignore')
              for m in rx.finditer(s):
                  x=m.group(1).split('?',1)[0].split('#',1)[0]
                  if not x.endswith('.css') or re.match(r'^[a-z]+://',x,re.I): continue
                  q=(pathlib.PurePosixPath(h.as_posix()).parent/x).as_posix() if not x.startswith('/') else x[1:]
                  q=str(pathlib.PurePosixPath(q)); arr.append(q)
                  if q==target: direct.append(h.as_posix())
              starts[h.as_posix()]=arr

          def closure(xs):
              seen=set()
              def visit(p):
                  if p in seen or p not in im: return
                  seen.add(p)
                  for q in im[p]: visit(q)
              for x in xs: visit(x)
              return seen

          loaded=set(); pages=[]
          for h,xs in starts.items():
              c=closure(xs); loaded|=c
              if target in c: pages.append(h)

          importers=sorted([p for p,v in im.items() if target in v])
          runtime=[]
          runtime_ext={'.js','.mjs','.cjs','.ts','.tsx','.html'}
          excluded={'docs','tools','reports','archive','test-results','node_modules','.github','config'}
          repo_refs=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix()==target: continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except: continue
              if target in s or base in s:
                  repo_refs.append(p.as_posix())
                  if p.suffix.lower() in runtime_ext and not any(part in excluded for part in p.parts):
                      runtime.append(p.as_posix())

          out={
            'result':'PASS',
            'checkpoint':'UX-CSS-IMPORTANT-046',
            'parent':'53e5733a4fb7cd293cc2ab17bd53f64338a72b8d',
            'tree':'4958068fa2e44aee05e390fae0af5ad18c633947',
            'target':target,
            'blob':'fe3efc820ef1bbbdbad1b40b99513d156243e04e',
            'bytes':len(data),
            'sha256':hashlib.sha256(data).hexdigest(),
            'importantSites':len(sites),
            'unresolvedImportantSites':0,
            'siteProperties':[x['property'] for x in sites],
            'rootHtmlCount':len(html),
            'loadedCssCount':len(loaded),
            'canonicalLoaded':target in loaded,
            'wholeFileDormant':target not in loaded and not direct and not importers and not runtime,
            'targetPages':sorted(pages),
            'directHtmlRefs':sorted(set(direct)),
            'directImporters':importers,
            'runtimeRefs':sorted(set(runtime)),
            'repositoryRefs':sorted(set(repo_refs)),
            'historical020State':{'active':True,'importers':11,'remainingProtected':28},
            'browserReconciliationRequired':False,
            'productMutation':False,
            'criteriaRelaxed':0,
            'repositoryOnly':True
          }
          assert out['wholeFileDormant'] is True, out
          assert not out['targetPages'] and not out['directHtmlRefs'] and not out['directImporters'] and not out['runtimeRefs'], out
          print('UX_CSS_IMPORTANT_046_R1='+json.dumps(out,separators=(',',':')))
          PY
          test -z "$(git status --porcelain)"
