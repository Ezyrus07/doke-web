name: Doke UX-RESP-DEBT-005 Visibility Skip Diff

on:
  push:
    branches:
      - diag/ux-resp-debt-005-visibility-skip-diff

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified parent ancestry
        run: test "$(git merge-base HEAD ecb54eef031754cf91b9ec4340f382768f11f027)" = "ecb54eef031754cf91b9ec4340f382768f11f027"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate parent report
        shell: bash
        run: |
          node scripts/generate-responsive-index-baseline.js
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "$STATUS" -eq 1
          cp reports/responsive-contract-test-report.json /tmp/parent.json

      - name: Apply workspace-only visibility migration
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manifests=['assets/css/pages/pedidos-runtime-page.css','assets/css/pages/notificacoes-foundation.css','assets/css/pages/carteira-runtime-page.css'];
          const legacy=/^@import url\("\.\.\/components\/shell\/tablet-internal-rail-contract\.css\?[^\n]+\);\n/m;
          for(const file of manifests){let s=fs.readFileSync(file,'utf8');if((s.match(new RegExp(legacy.source,'gm'))||[]).length!==1)throw new Error(file);fs.writeFileSync(file,s.replace(legacy,''));}
          fs.appendFileSync('assets/css/layout/header.css',`\n/* DEBT005 diagnostic contextual visibility */\n@media (min-width: 561px) and (max-width: 900px) and (orientation: portrait) {\n  body:is(.orders-page-shell, .notifications-page-shell, .wallet-page-shell).has-global-header > .app-shell > .page > .app-header.home-side-meta {\n    display:flex; visibility:visible; opacity:1; pointer-events:auto;\n  }\n}\n`);
          NODE

      - name: Generate candidate report
        shell: bash
        run: |
          node scripts/generate-responsive-index-baseline.js
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "$STATUS" -eq 1
          cp reports/responsive-contract-test-report.json /tmp/candidate.json

      - name: Print exact skip delta
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/parent.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/candidate.json','utf8'));
          const key=s=>[s.page||'',s.breakpoint||'',s.component||'',s.reason||''].join(' | ');
          const A=new Set(a.skips.map(key)), B=new Set(b.skips.map(key));
          const noLongerSkipped=[...A].filter(x=>!B.has(x)).sort();
          const newlySkipped=[...B].filter(x=>!A.has(x)).sort();
          console.log('PARENT',JSON.stringify(a.summary));
          console.log('CANDIDATE',JSON.stringify(b.summary));
          console.log('NO_LONGER_SKIPPED',JSON.stringify(noLongerSkipped,null,2));
          console.log('NEWLY_SKIPPED',JSON.stringify(newlySkipped,null,2));
          console.log('CANDIDATE_FAILURES',JSON.stringify((b.failures||[]).map(f=>({page:f.page,breakpoint:f.breakpoint,component:f.component,property:f.property,expected:f.expected,actual:f.actual})),null,2));
          NODE
