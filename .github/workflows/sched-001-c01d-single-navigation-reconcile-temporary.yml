name: Doke Temporary SCHED-C01D Single Navigation Reconcile

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01d-single-navigation-reconcile-temporary.yml'
      - 'scripts/patch-sched-001-c01d-single-navigation-temporary.js'
      - 'scripts/patch-sched-001-c01d-single-navigation-governance-temporary.js'
      - 'scripts/patch-sched-001-c01d-bundle-name-temporary.js'

permissions:
  contents: write

concurrency:
  group: sched-001-c01d-single-navigation-reconcile-temporary
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 1
      - name: Require immutable source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Apply focused single-navigation correction
        run: |
          node scripts/patch-sched-001-c01d-single-navigation-temporary.js
          node scripts/patch-sched-001-c01d-bundle-name-temporary.js
          node scripts/patch-sched-001-c01d-single-navigation-governance-temporary.js
          npm run write:domain-completion-matrix
      - name: Validate C01D and cumulative scheduling gates
        run: |
          node --check scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js
          node --check scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js
          node --check scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js
          node scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js
          node scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js --dry-run
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          npm run audit:sched-001-c01c-deterministic-frontend-presentation
          npm run test:sched-001-c01c-deterministic-frontend-presentation
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Stage only canonical correction artifacts
        run: |
          git add \
            scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js \
            scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js \
            config/sched-001-c01d-authenticated-browser-canary-readiness.json \
            docs/validation/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.json \
            docs/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.md \
            scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
      - name: Publish single-navigation correction
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin ord/ord-001-baseline-audit --depth=1
          test "$(git rev-parse origin/ord/ord-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sched): reuse canonical orders login navigation"
          git push origin HEAD:ord/ord-001-baseline-audit
