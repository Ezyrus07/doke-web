name: WAL-A03 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/wal-a03-matrix-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh-derived-matrix:
    if: github.event.pull_request.head.ref == 'wal/wal-001-baseline-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WAL branch
        uses: actions/checkout@v4
        with:
          ref: wal/wal-001-baseline-audit
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate derived matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Enforce generated-file allowlist and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wal-a03-matrix-refresh-temp.yml
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json|.github/workflows/wal-a03-matrix-refresh-temp.yml) ;;
              *) echo "Unexpected generated change: $file" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Commit canonical generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -am 'Refresh domain completion matrix for WAL-A03'
          git push origin HEAD:wal/wal-001-baseline-audit