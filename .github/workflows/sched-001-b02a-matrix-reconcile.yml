name: SCHED-B02A Matrix Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/sched-001-b02a-matrix-reconcile.yml'
      - 'scripts/patch-sched-001-b02a-matrix.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sched-b02a-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile B02A source matrix
        run: |
          set -euo pipefail
          export SCHED_B02A_UPDATED_AT="$(TZ=America/Bahia date -Iseconds)"
          node scripts/patch-sched-001-b02a-matrix.js
          npm run write:domain-completion-matrix
      - name: Validate B02A and cumulative scheduling contracts
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:sched-001-b02-composition-root-readiness
          npm run test:sched-001-b02-composition-root-runtime
          npm run audit:sched-001-a05-persistence-readiness
          npm run test:sched-001-a05-postgres-repository-runtime
          npm run audit:sched-001-a04-server-command-runtime
          npm run test:sched-001-a04-scheduling-service-runtime
          npm run audit:sched-001-a03-reservation-migration-local-contract
          npm run audit:sched-001-a02-command-event-timezone-conflict-contract
          npm run audit:ord-001-a10-blocker-reconciliation
          npm run audit:ord-001-a11-scheduling-authority-handoff
          npm run audit:sched-001-a07-history-canary-readiness
      - name: Remove temporary matrix patcher
        run: rm -f scripts/patch-sched-001-b02a-matrix.js
      - name: Commit validated non-workflow reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            package.json \
            scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js \
            scripts/audit-sched-001-a03-reservation-migration-local-contract.js \
            scripts/audit-sched-001-a04-server-command-runtime.js \
            scripts/audit-sched-001-a07-history-canary-readiness.js \
            scripts/audit-ord-001-a10-blocker-reconciliation.js \
            scripts/audit-ord-001-a11-scheduling-authority-handoff.js \
            scripts/patch-sched-001-b02a-matrix.js
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'SCHED_B02A_WORKFLOW_MUTATION_STAGED' >&2
            exit 31
          fi
          git diff --cached --check
          git commit -m "docs(sched): register B02A composition root readiness"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
