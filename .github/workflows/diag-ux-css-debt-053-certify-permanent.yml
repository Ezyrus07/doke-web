name: Doke UX-CSS-DEBT-053 Permanent Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-053-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 8cf5320e2eb2a8185f777962b7a5d135931a2614
      PARENT_SHA: fbdd853af425ed9249c0a93ac42a1babeded1993
      PARENT_PARENT_SHA: e8176fc05c9ac47745cf70e9ac560ffe0036fbec
      TARGET_TREE: 8c67999a85773cb4e72402609f9568b04500d723
      TARGET_FILE: assets/css/components/cards/professional-showcase-card.css
      PARENT_BLOB: 1566c2da510526dc87a0c8cf135ab8d79b98269e
      TARGET_BLOB: ace1fac9f63738965415e29620e7f4d04f6837ab
      TARGET_HASH: 1311bf3438f42c5e9490d89493baf8286726ae93af883fbd15f9c3b29ac4ccf4
      TARGET_BYTES: '10458'
      HOME_CSS_FILE: assets/css/pages/home.css
      HOME_CSS_BLOB: 9ca81620efb9b16a0705f80bc92fc7020e9f2daf
      RESULTS_CSS_FILE: assets/css/pages/search-results.css
      RESULTS_CSS_BLOB: 6986e380800690d4f6b7e87e6e0780673400e2ed
      HOME_PAGE: index.html
      HOME_PAGE_BLOB: a3b2bffb4fd6bc4208b40930b621a9c54ce22cea
      RESULTS_PAGE: resultados.html
      RESULTS_PAGE_BLOB: 9b4431143ef80dafc70788bfa5c96ebf6460b5d1
      PERM_BRANCH: ux/ux-css-debt-053-professional-showcase-compaction
      AUTHORITY_DOC_A: docs/PAGE-ASSET-AUTHORITY-MATRIX.md
      AUTHORITY_DOC_B: docs/HOME-AUTHORITY-CLASSIFICATION.md
      AUTHORITY_DOC_A_REGEN_HASH: 345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6
      AUTHORITY_DOC_B_REGEN_HASH: b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Preserve exact-cert helpers
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-053-cert-identity.cjs /tmp/ux053-cert-identity.cjs
          cp .github/diagnostics/ux-css-debt-053-cert-residual.cjs /tmp/ux053-cert-residual.cjs
          node --check /tmp/ux053-cert-identity.cjs
          node --check /tmp/ux053-cert-residual.cjs

      - name: Checkout exact certified UX-CSS-DEBT-052 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2
          clean: true

      - name: Guard parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git hash-object "$HOME_CSS_FILE")" = "$HOME_CSS_BLOB"
          test "$(git hash-object "$RESULTS_CSS_FILE")" = "$RESULTS_CSS_BLOB"
          test "$(git hash-object "$HOME_PAGE")" = "$HOME_PAGE_BLOB"
          test "$(git hash-object "$RESULTS_PAGE")" = "$RESULTS_PAGE_BLOB"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "PARENT IDENTITY PASS|sha=$PARENT_SHA|parent=$PARENT_PARENT_SHA|blob=$PARENT_BLOB|importers=$HOME_CSS_BLOB/$RESULTS_CSS_BLOB|pages=$HOME_PAGE_BLOB/$RESULTS_PAGE_BLOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate parent governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          npm run audit:page-asset-authority-matrix
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$PARENT_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          echo "PARENT BASELINES PASS|responsive=generated|authorityHashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH"

      - name: Checkout exact permanent SHA without removing generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA" --depth=2
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -s reports/responsive-index-baseline.json
          echo "PERMANENT CHECKOUT PASS|sha=$TARGET_SHA"

      - name: Exact permanent identity and reach proof transfer
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$HOME_CSS_FILE")" = "$HOME_CSS_BLOB"
          test "$(git hash-object "$RESULTS_CSS_FILE")" = "$RESULTS_CSS_BLOB"
          test "$(git hash-object "$HOME_PAGE")" = "$HOME_PAGE_BLOB"
          test "$(git hash-object "$RESULTS_PAGE")" = "$RESULTS_PAGE_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"...HEAD -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          test -z "$(git diff --name-only "$PARENT_SHA"...HEAD -- '*.js' '*.html' 'package.json' 'package-lock.json' 'docs/**')"
          git diff --check "$PARENT_SHA"...HEAD
          node /tmp/ux053-cert-identity.cjs
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const target=process.env.TARGET_FILE,homeCss=process.env.HOME_CSS_FILE,resultsCss=process.env.RESULTS_CSS_FILE,homePage=process.env.HOME_PAGE,resultsPage=process.env.RESULTS_PAGE;
          const tracked=new Set(cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(Boolean));
          function importsFor(file){const src=fs.readFileSync(file,'utf8'),out=[],re=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;let m;while((m=re.exec(src))){let v=m[1].replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))v=v.replace(/^\/+/, '');else if(!v.startsWith('assets/'))v=path.posix.normalize(path.posix.join(path.posix.dirname(file),v));if(tracked.has(v))out.push(v)}return out}
          const direct=[...tracked].filter(f=>importsFor(f).includes(target)).sort(),expected=[homeCss,resultsCss].sort();if(JSON.stringify(direct)!==JSON.stringify(expected))throw new Error('direct importer drift '+JSON.stringify(direct));
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),reached=[];for(const p of report.pageAssets){const seen=new Set(),todo=[...(p.css||[]).filter(f=>tracked.has(f))];let hit=false;while(todo.length){const f=todo.pop();if(seen.has(f)||!tracked.has(f))continue;seen.add(f);if(f===target){hit=true;break}for(const n of importsFor(f))todo.push(n)}if(hit)reached.push(p.page)}reached.sort();if(JSON.stringify(reached)!==JSON.stringify([homePage,resultsPage].sort()))throw new Error('active reach drift '+JSON.stringify(reached));
          const home=fs.readFileSync(homePage,'utf8'),results=fs.readFileSync(resultsPage,'utf8');if(!home.includes('class="professional-showcase doke-page-section"')||!home.includes('class="professional-showcase__track"')||!/<body[^>]*class="[^"]*home-index-shell/.test(home))throw new Error('home real emitter/scope drift');if(/<body[^>]*class="[^"]*home-index-shell/.test(results))throw new Error('results unexpectedly gained target body scope');
          console.log(`REACH AUTHORITY PASS|activeReach=${reached.join(',')}|directImporters=${direct.join(',')}|homeEmitter=static-real|resultsTargetScopeMatch=0|affectedFamilies=1`);
          NODE
          echo "EXACT IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=1"
          echo 'RUNTIME PROOF TRANSFER PASS|R1run=31970642575|R1job=95222477720|homeSamplesBefore=9|homeSamplesAfter=9|resultsNegativeBefore=9|resultsNegativeAfter=9|homeRuntimeDiffs=0|resultsScopeDiffs=0|overflowHome=0->0|overflowResults=0->0|winnerAt759And760=12px|boundaries=389/390/391+759/760/761|fixtureRequired=0|transport=independent-byte-reconstruction'

      - name: Responsive contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Responsive contract test: PASS' /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PERMANENT PASS|checks=893|failures=0|skips=277'

      - name: Governance contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo 'GOVERNANCE PERMANENT PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Isolate known parent-stale authority-doc regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$TARGET_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          echo "AUTHORITY DOC BASELINE ISOLATION PASS|semanticDocDelta=0|knownHashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH"

      - name: Permanent residual proof
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          node /tmp/ux053-cert-residual.cjs

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));const v=a.metadata?.vulnerabilities||{};const got=[v.total??-1,v.critical??-1,v.high??-1,v.moderate??-1,v.low??-1].join('/');if(got!=='13/0/10/1/2')throw new Error(`dependency snapshot drift ${got}`);console.log(`NPM AUDIT SNAPSHOT|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`);
          NODE

      - name: Final exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test -z "$(git status --porcelain)"
          echo "PERMANENT CERT FINAL PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|residual=21/464/0|productMutation=0|prCreated=0"
