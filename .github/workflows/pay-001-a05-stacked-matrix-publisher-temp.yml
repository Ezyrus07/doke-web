name: Doke PAY-A05 Stacked Matrix Publisher Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/pay-001-a05-stacked-matrix-publisher-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate and validate canonical derivatives
        run: |
          npm run write:domain-completion-matrix
          node --check scripts/lib/semantic-version.js
          node --check scripts/test-semantic-version.js
          node scripts/test-semantic-version.js
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run audit:pay-001-a05-adapter-conformance-readiness
          npm run test:pay-001-a05-adapter-conformance-readiness
          node scripts/audit-pay-001-a05-adapter-contract.js
          node scripts/test-pay-001-a05-adapter-contract.js
          npm run audit:domain-completion-matrix
      - name: Remove temporary publisher
        run: rm -f .github/workflows/pay-001-a05-stacked-matrix-publisher-temp.yml
      - name: Verify closed change boundary
        run: |
          git diff --check
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/pay-001-a05-stacked-matrix-publisher-temp.yml|\
              config/domain-completion-matrix.json|\
              docs/DOMAIN-COMPLETION-MATRIX.md|\
              reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected changed path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test -n "$(git diff --name-only -- docs/DOMAIN-COMPLETION-MATRIX.md)"
          test -n "$(git diff --name-only -- reports/generated/domain-completion-matrix-report.json)"
          test -n "$(git diff --name-only -- .github/workflows/pay-001-a05-stacked-matrix-publisher-temp.yml)"
      - name: Publish derivatives and cleanup
        run: |
          git config user.name 'doke-pay-a05-bot'
          git config user.email 'doke-pay-a05-bot@users.noreply.github.com'
          git add -A -- \
            .github/workflows/pay-001-a05-stacked-matrix-publisher-temp.yml \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- reports/generated/domain-completion-matrix-report.json
          git commit -m 'Regenerate stacked matrix derivatives and remove temporary publisher'
          git push origin HEAD:pay/pay-001-baseline-audit
