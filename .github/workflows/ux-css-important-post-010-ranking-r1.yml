name: UX CSS Important Post 014 Fresh Ranking R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  rank015:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: d0d423a974001e9ffca6bcbe61f70549a0ade6ea
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-post-014-fresh-ranking-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: rank
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/rank.log) 2>&1
          git cat-file -e "$TARGET_SHA^{commit}"
          git checkout --detach "$TARGET_SHA" >/dev/null
          npm ci --ignore-scripts
          npm run audit:important-reduction-plan
          npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8'));
          const ps=p.summary||{}, bs=b.summary||{};
          if(bs.totalImportant!==10966||bs.outsideServiceCardImportant!==10904||bs.filesWithImportant!==33) throw Error('baseline '+JSON.stringify(bs));
          if(ps.affectedFiles!==32||ps.byRisk?.['high-baseline-required']!==10896||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2) throw Error('plan '+JSON.stringify(ps));
          console.log(`PLAN SUMMARY|affectedFiles=${ps.affectedFiles}|outside=${ps.totalImportantOutsideServiceCard}|high=${ps.byRisk?.['high-baseline-required']}|medium=${ps.byRisk?.['medium-baseline-required']}|low=${ps.byRisk?.['low-review-candidate']}`);
          console.log(`BASELINE SUMMARY|total=${bs.totalImportant}|outside=${bs.outsideServiceCardImportant}|files=${bs.filesWithImportant}`);
          const rows=(p.topFiles||[]).map(x=>({file:x.file||x.path,important:x.important||x.count||x.totalImportant||0,risk:x.risk||x.classification||'unknown'})).filter(x=>x.file);
          rows.sort((a,b)=>a.important-b.important||a.file.localeCompare(b.file));
          for(const x of rows) console.log(`PLAN FILE|important=${x.important}|risk=${x.risk}|file=${x.file}`);
          const files=cp.execFileSync('git',['ls-tree','-r','--name-only',process.env.TARGET_SHA],{encoding:'utf8'}).trim().split(/\n/).filter(f=>f.endsWith('.css'));
          let total=0, inv=[];
          for(const f of files){const s=cp.execFileSync('git',['show',`${process.env.TARGET_SHA}:${f}`],{encoding:'utf8',maxBuffer:20*1024*1024});const n=(s.match(/!important\b/g)||[]).length;if(n){inv.push({f,n});total+=n}}
          inv.sort((a,b)=>a.n-b.n||a.f.localeCompare(b.f));
          console.log(`COUNT INVENTORY|files=${inv.length}|total=${total}`);
          for(const x of inv) console.log(`COUNT FILE|important=${x.n}|file=${x.f}`);
          if(total!==10966||inv.length!==33) throw Error(`inventory ${total}/${inv.length}`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.rank.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "RANK=${{ steps.rank.outcome }}"; grep -E '^(PLAN SUMMARY|BASELINE SUMMARY|PLAN FILE|COUNT INVENTORY|COUNT FILE)\|' /tmp/rank.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 300 /tmp/rank.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"; git commit -m 'diag: publish post-014 fresh ranking r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
