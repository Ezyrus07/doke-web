name: UX CSS Important 033 Home Chrome Permanent Cert R4
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  certify033r4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d1b9c19468829248ec7f29d8b4a3d4f304bfdb40
      PERM_SHA: 79b2820ba35e89ea066e90468d801908d5ea56f0
      PERM_TREE: 40eb896f8472e55cb325e418f2268b42a2d757b2
      TARGET_FILE: assets/css/pages/home/chrome.css
      PARENT_BLOB: 638d39a58cd1439da635439fad38edef2d2d5634
      PERM_BLOB: ac64b33f163caf7f97d4fdd43680f34f9a094155
      CANDIDATE_SHA256: 4fb29552890a203769436f5d214ea448dfdc361ecaedc03ff9ba58261fa9ea69
      PERM_BRANCH: ux/ux-css-important-033-home-chrome-dormant-priority
      REACH_FILE: .diagnostics/ux-css-important-033-home-chrome-reach-r1.txt
      REACH_BLOB: d156e9f65338e8eca45efa5c9c973ae682a4e5a8
      BROWSER_FILE: .diagnostics/ux-css-important-033-home-chrome-browser-r2.txt
      BROWSER_BLOB: 12d5b34687f75950c7956a277cbb1a82fa9cfee4
      GOV_FILE: .diagnostics/ux-css-important-033-home-chrome-governance-r3.txt
      GOV_BLOB: c26f2f81d606ab88cadd0c9ba47f8b628d4de6bc
      PROMO_FILE: .diagnostics/ux-css-important-033-home-chrome-promotion.txt
      PROMO_BLOB: aa7109c784f9d3aca8e1ae296108f293801f8f79
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-033-home-chrome-permanent-cert-r4.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: certify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/c.log) 2>&1
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          test "$(git rev-parse "HEAD:$PROMO_FILE")" = "$PROMO_BLOB"
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt; git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt; git show HEAD:"$GOV_FILE" >/tmp/gov.txt; git show HEAD:"$PROMO_FILE" >/tmp/promo.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -q '^RESULT=PASS$' /tmp/promo.txt
          grep -Fq 'CANONICAL REACH PASS|rootHtml=27|loadedCss=402|physicalCss=533|htmlLinks=0|actualImporters=0|runtimeJsRefs=0|toolingJsRefs=0|otherJsRefs=0|cssTextRefs=0|active=0|wholeFileDormant=1' /tmp/reach.txt
          grep -Fq "BROWSER PASS|sha256=$CANDIDATE_SHA256|page=home|states=9|viewports=360,420,421,560,561,760,761,1024,1025|metadataDiffs=0|screenshotDiffs=0|stableStates=9/9|pageErrors=0|targetStylesheetLoads=0/0|pageRoots=9/9|syntheticDOM=0|syntheticAuth=0|credentialsUsed=0|criteriaRelaxed=0|exactPathMatch=1|externalResourcesBlocked=1|animationsDisabled=1|dateFrozen=1|breakpoints=420/421,560/561,760/761,1024/1025" /tmp/browser.txt
          grep -Fq 'IMPORTANT PASS|total=7917|outsideServiceCard=7855|files=16|delta=-317' /tmp/gov.txt
          grep -Fq 'QUEUE PASS|affectedFiles=15|highBaselineRequired=7847|mediumBaselineRequired=6|lowReviewCandidate=2|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127' /tmp/gov.txt
          grep -Fq "PRODUCT COMMIT PASS|head=$PERM_SHA|tree=$PERM_TREE|parent=$PARENT_SHA|blob=$PERM_BLOB|files=1|additions=317|deletions=317|markerDelta=317|markerOnly=1" /tmp/promo.txt
          echo 'PROOF TRANSFER PASS|reach=R1|browser=R2|governance=R3|candidateHash=exact|candidateBlob=exact|wholeFileDormant=1|runtimeJsRefs=0|toolingJsRefs=0|exactPathMatch=1'

          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PERM_SHA"
          git checkout --detach "$PERM_SHA" >/dev/null
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PERM_TREE"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..$PERM_SHA")" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$PERM_SHA" | wc -l)" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$PERM_SHA")" = "$TARGET_FILE"
          num="$(git diff --numstat "$PARENT_SHA" "$PERM_SHA" -- "$TARGET_FILE")"; add="$(printf '%s' "$num"|cut -f1)"; del="$(printf '%s' "$num"|cut -f2)"; test "$add" = 317; test "$del" = 317

          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/source.css; git show "$PERM_SHA:$TARGET_FILE" >/tmp/permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const src=fs.readFileSync('/tmp/source.css','utf8'),perm=fs.readFileSync('/tmp/permanent.css','utf8'),c=src.replace(/\s*!important\b/g,'');
          const before=(src.match(/!important\b/g)||[]).length,after=(perm.match(/!important\b/g)||[]).length;
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync('/tmp/reconstructed.css',c);const blob=cp.execFileSync('git',['hash-object','/tmp/reconstructed.css'],{encoding:'utf8'}).trim();
          if(before!==317||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.PERM_BLOB||c!==perm)throw Error(`reconstruction ${before}/${after}/${h}/${blob}/${c===perm}`);
          console.log(`RECONSTRUCTION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(c)}|important=317->0|removed=317|byteIdentical=1|browserProofTransfer=hash-identical|reachProofTransfer=hash-identical|wholeFileDormant=1`);
          NODE

          npm ci --ignore-scripts >/dev/null
          node scripts/generate-responsive-index-baseline.js >/dev/null
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log; grep -q 'Failures: 0' /tmp/responsive.log; grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|state=permanent'
          npm run audit:agent-governance >/dev/null
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs');const m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflicts');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`);
          NODE
          npm run audit:shared-app-header-contract >/dev/null
          npm run audit:mobile-shell-location-contract >/dev/null
          npm run audit:responsive-boundaries >/dev/null
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log; grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log; grep -q 'Critical flows: 15' /tmp/domain.log; grep -q 'Average maturity: 2.91/6' /tmp/domain.log; grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$PERM_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures >/dev/null
          npm run audit:important-reduction-plan >/dev/null
          npm run audit:global-css-design-system >/dev/null
          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));const s=b.summary,ps=p.summary;if(s.totalImportant!==7917||s.outsideServiceCardImportant!==7855||s.filesWithImportant!==16)throw Error(`important ${JSON.stringify(s)}`);if(ps.affectedFiles!==15||ps.totalImportantOutsideServiceCard!==7855||ps.byRisk?.['high-baseline-required']!==7847||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2)throw Error(`queue ${JSON.stringify(ps)}`);const protectedFiles={protected006:['assets/css/pages/home/mobile-composition.css',6],protected010:['assets/css/components/cards/mobile-card-contract.css',2],protected020:['assets/css/components/shell/mobile-base-stability.css',28],protected021:['assets/css/pages/home/mobile-hero-feed.css',127]};for(const [label,[file,want]] of Object.entries(protectedFiles)){const got=(fs.readFileSync(file,'utf8').match(/!important\b/g)||[]).length;if(got!==want)throw Error(`${label} ${got}/${want}`);}const target=(fs.readFileSync(process.env.TARGET_FILE,'utf8').match(/!important\b/g)||[]).length;if(target!==0)throw Error(`target ${target}`);console.log('IMPORTANT PASS|total=7917|outsideServiceCard=7855|files=16');console.log('QUEUE PASS|affectedFiles=15|highBaselineRequired=7847|mediumBaselineRequired=6|lowReviewCandidate=2|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127');
          NODE
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`);
          NODE
          echo "CERTIFICATION PASS|fullHistory=1|oneCommit=1|oneFile=1|numstat=$add/$del|markerDelta=317|wholeFileDormant=1|runtimeJsRefs=0|toolingJsRefs=0|browserMetadataDiffs=0|browserScreenshotDiffs=0|browserStableStates=9/9|browserPageErrors=0|targetStylesheetLoads=0/0|pageRoots=9/9|exactPathMatch=1|browserProofTransfer=hash-identical|reachProofTransfer=hash-identical|duplicates=0/0|domain=23/15/2.91/12|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127"
          echo "AUDIT_EXIT=$code"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.certify.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PERM_SHA=$PERM_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_TREE=$PERM_TREE"; echo "PERM_BLOB=$PERM_BLOB"; echo "CERTIFY=${{ steps.certify.outcome }}"; grep -E '^(PROOF TRANSFER PASS|RECONSTRUCTION PASS|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT PASS|QUEUE PASS|DEPENDENCY PASS|CERTIFICATION PASS)\|' /tmp/c.log || true; grep '^AUDIT_EXIT=' /tmp/c.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 1200 /tmp/c.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"; git commit -m 'diag: publish 033 home chrome permanent cert r4 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
