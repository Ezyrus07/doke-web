name: UX CSS Important 030 Mobile Chrome Lock Reach R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach030r1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 6d3eed90684a23f895e3fa93fa344b875e94b4e0
      TARGET_FILE: assets/css/components/navigation/mobile-chrome-lock.css
      TARGET_BLOB: aaaff472ae885f14fb97e882ee0ace80ab83ea1a
      EXPECTED_IMPORTANT: '277'
      POLICY_SCRIPT_BLOB: fcade2556f9ed5f1f04e02ca6c4fd7bd249d8318
      REGISTER_BLOB: 63943f80013e0a66cb3f6c6de4e91530bb83daf5
      DEPRECATED_BLOB: 7626d257532d8e91dfa2a76dccced57e5a07b8d7
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-030-mobile-chrome-lock-reach-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r1.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git rev-parse "$PARENT_SHA:scripts/audit-css-dormant-debt-policy.js")" = "$POLICY_SCRIPT_BLOB"
          test "$(git rev-parse "$PARENT_SHA:config/important-debt-register.json")" = "$REGISTER_BLOB"
          test "$(git rev-parse "$PARENT_SHA:docs/DEPRECATED-CSS.md")" = "$DEPRECATED_BLOB"

          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/source.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const src=fs.readFileSync('/tmp/source.css','utf8');
          const before=(src.match(/!important\b/g)||[]).length;
          const out=src.replace(/\s*!important\b/g,'');
          const after=(out.match(/!important\b/g)||[]).length;
          const removed=before-after;
          if(before!==+process.env.EXPECTED_IMPORTANT||after!==0||removed!==+process.env.EXPECTED_IMPORTANT) throw Error(`important ${before}->${after}`);
          fs.writeFileSync('/tmp/candidate.css',out);
          const sha256=crypto.createHash('sha256').update(Buffer.from(out)).digest('hex');
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          console.log(`CANDIDATE PASS|bytes=${Buffer.byteLength(out)}|important=${before}->${after}|removed=${removed}|sha256=${sha256}|blob=${blob}|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE

          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const {getLoadedCssAssets}=require('./scripts/lib/css-assets');
          const root=process.cwd();
          const target=process.env.TARGET_FILE.replace(/\\/g,'/');
          const norm=p=>p.replace(/\\/g,'/').replace(/^\.\//,'').replace(/^\/+/, '').split('?')[0].split('#')[0];
          const rootHtml=fs.readdirSync(root).filter(f=>f.endsWith('.html')).sort();
          const loaded=new Set();
          for(const page of rootHtml){
            const html=fs.readFileSync(page,'utf8');
            for(const asset of getLoadedCssAssets(html,root)) loaded.add(norm(asset));
          }
          function walk(dir,skip=new Set()){
            const out=[];
            if(!fs.existsSync(dir)) return out;
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(ent.isDirectory()&&skip.has(ent.name)) continue;
              const full=path.join(dir,ent.name);
              if(ent.isDirectory()) out.push(...walk(full,skip)); else out.push(norm(path.relative(root,full)));
            }
            return out;
          }
          const cssFiles=walk(path.join(root,'assets','css')).filter(f=>f.endsWith('.css'));
          const allFiles=walk(root,new Set(['node_modules','.git','archive','reports','test-results']));
          const jsFiles=allFiles.filter(f=>/\.(?:js|mjs|cjs)$/.test(f));
          const resolve=(from,raw)=>{
            const clean=String(raw||'').split('?')[0].split('#')[0];
            if(clean.startsWith('/')) return norm(clean);
            if(clean.startsWith('assets/')) return norm(clean);
            return norm(path.posix.normalize(path.posix.join(path.posix.dirname(from),clean)));
          };
          let htmlLinks=0,actualImporters=0,cssTextRefs=0;
          for(const page of rootHtml){
            const html=fs.readFileSync(page,'utf8');
            for(const m of html.matchAll(/<link\b[^>]*>/gi)){
              const tag=m[0];
              const rel=(tag.match(/\brel\s*=\s*(["'])(.*?)\1/i)||[])[2]||'';
              const href=(tag.match(/\bhref\s*=\s*(["'])(.*?)\1/i)||[])[2]||'';
              if(!rel.toLowerCase().split(/\s+/).includes('stylesheet')||!href||/^(?:https?:|data:|\/\/)/i.test(href)) continue;
              if(resolve(page,href)===target) htmlLinks++;
            }
          }
          for(const file of cssFiles){
            const text=fs.readFileSync(file,'utf8');
            for(const m of text.matchAll(/@import\s+(?:url\(\s*)?(?:["']([^"']+)["']|([^\s;)]+))\s*\)?/gi)){
              const raw=m[1]||m[2];
              if(!raw||/^(?:https?:|data:|\/\/)/i.test(raw)) continue;
              if(resolve(file,raw)===target) actualImporters++;
            }
            if(file!==target&&text.includes(target)) cssTextRefs++;
          }
          const runtimeRefs=[],toolingRefs=[],otherRefs=[];
          for(const file of jsFiles){
            const text=fs.readFileSync(file,'utf8');
            if(!text.includes(target)) continue;
            if(file.startsWith('assets/js/')) runtimeRefs.push(file);
            else if(file.startsWith('scripts/')||file.startsWith('tests/')||file.startsWith('test/')||file.startsWith('tools/')) toolingRefs.push(file);
            else otherRefs.push(file);
          }
          const active=loaded.has(target)?1:0;
          const wholeFileDormant=htmlLinks===0&&actualImporters===0&&runtimeRefs.length===0&&otherRefs.length===0&&cssTextRefs===0&&active===0?1:0;
          console.log(`CANONICAL REACH PASS|rootHtml=${rootHtml.length}|loadedCss=${loaded.size}|physicalCss=${cssFiles.length}|htmlLinks=${htmlLinks}|actualImporters=${actualImporters}|runtimeJsRefs=${runtimeRefs.length}|toolingJsRefs=${toolingRefs.length}|otherJsRefs=${otherRefs.length}|cssTextRefs=${cssTextRefs}|active=${active}|wholeFileDormant=${wholeFileDormant}|toolingRefs=${toolingRefs.sort().join(',')||'none'}`);
          if(!wholeFileDormant) throw Error('target is not whole-file dormant under current graph');
          NODE

          node scripts/audit-css-dormant-debt-policy.js >/tmp/policy.log
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/policy.log','utf8');
          const target=process.env.TARGET_FILE;
          const row=`| \`${target}\` | responsive-shell | 277 | high | sim |`;
          if(!text.includes(row)) throw Error('target quarantine row missing or changed');
          const get=(label)=>{const esc=label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const m=text.match(new RegExp(`- ${esc}: (\\d+)`));if(!m)throw Error(`summary missing ${label}`);return +m[1]};
          const reactivated=get('CSS depreciado reativado');
          const missing=get('Arquivos registrados ausentes');
          const unregistered=get('CSS ativo com !important fora do registro');
          fs.writeFileSync('/tmp/policy.env',`REACTIVATED=${reactivated}\nMISSING=${missing}\nUNREGISTERED=${unregistered}\n`);
          console.log(`TARGET POLICY PASS|quarantine=1|documentedDeprecated=1|group=responsive-shell|risk=high|important=277|globalReactivatedDeprecated=${reactivated}|globalRegisteredMissingFiles=${missing}|globalUnregisteredActiveImportant=${unregistered}|strictCoupling=0`);
          NODE
          source /tmp/policy.env
          set +e
          node scripts/audit-css-dormant-debt-policy.js --strict >/tmp/policy-strict.log 2>&1
          strict_code=$?
          set -e
          expected_strict=0
          if test "$REACTIVATED" -gt 0 || test "$MISSING" -gt 0 || test "$UNREGISTERED" -gt 0; then expected_strict=1; fi
          test "$strict_code" -eq "$expected_strict"
          echo "GLOBAL POLICY DIAGNOSTIC PASS|strictExit=$strict_code|expectedExit=$expected_strict|reactivatedDeprecated=$REACTIVATED|registeredMissingFiles=$MISSING|unregisteredActiveImportant=$UNREGISTERED|scope=repo-global|targetBlocking=0"
          grep -Fq "$TARGET_FILE" docs/DEPRECATED-CSS.md
          echo 'GOVERNANCE TARGET PASS|deprecatedCanonical=1|quarantine=1|policyRecomputed=1|repoGlobalStrictSeparated=1'
          echo "PARENT PASS|sha=$PARENT_SHA|target=$TARGET_FILE|blob=$TARGET_BLOB|important=$EXPECTED_IMPORTANT"
          git checkout "$PARENT_SHA" -- docs/validation/css-dormant-debt-policy.md
          git diff --quiet
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "PARENT_SHA=$PARENT_SHA"
            echo "TARGET_FILE=$TARGET_FILE"
            echo "TARGET_BLOB=$TARGET_BLOB"
            echo "REACH_R1=${{ steps.reach.outcome }}"
            grep -E '^(CANDIDATE PASS|CANONICAL REACH PASS|TARGET POLICY PASS|GLOBAL POLICY DIAGNOSTIC PASS|GOVERNANCE TARGET PASS|PARENT PASS)\|' /tmp/r1.log || true
            echo "RESULT=$result"
            if test "$result" = FAIL; then tail -n 1200 /tmp/r1.log || true; fi
          } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 030 mobile chrome lock reach r1 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
