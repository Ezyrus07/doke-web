name: UX CSS Important 027 App Mobile Topbar Reach R2 Corrected
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach027r2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: a8771e5f631c4731afc11b5a07e005de78071ccf
      TARGET_FILE: assets/css/components/navigation/app-mobile-topbar.css
      EXPECTED_BLOB: 603aea29473ce66d31f97a046b70bfb2eb039bf4
      EXPECTED_IMPORTANT: '214'
      EXPECTED_CANDIDATE_SHA256: 336788f462e6309ffefb51389c4366b61edd4f83dd6f6611fb05d2e82a817e02
      EXPECTED_CANDIDATE_BLOB: afdec46c60e07af090c7d77c87329e175e27c1bc
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-027-app-mobile-topbar-reach-r2.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/reach.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          git fetch origin "$PARENT_SHA" >/dev/null 2>&1 || true
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$EXPECTED_BLOB"
          git show "HEAD:$TARGET_FILE" >/tmp/target.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const original=fs.readFileSync('/tmp/target.css','utf8');
          const before=(original.match(/!important\b/g)||[]).length;
          const candidate=original.replace(/\s*!important\b/g,'');
          const after=(candidate.match(/!important\b/g)||[]).length;
          const sha256=crypto.createHash('sha256').update(Buffer.from(candidate)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',candidate);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(before!==Number(process.env.EXPECTED_IMPORTANT)||after!==0) throw Error(`important ${before}->${after}`);
          if(sha256!==process.env.EXPECTED_CANDIDATE_SHA256) throw Error(`candidate sha256 ${sha256}`);
          if(blob!==process.env.EXPECTED_CANDIDATE_BLOB) throw Error(`candidate blob ${blob}`);
          console.log(`CANDIDATE PASS|bytes=${Buffer.byteLength(candidate)}|important=${before}->${after}|removed=${before}|sha256=${sha256}|blob=${blob}|transform=marker-only|r1HashStable=1`);
          NODE
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const target=process.env.TARGET_FILE.replace(/\\/g,'/');
          const targetBase=path.posix.basename(target);
          const excludedTop=new Set(['archive','reports','tools','test-results','node_modules','.git','.diagnostics']);
          function walk(dir='.') {
            const out=[];
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              const rel=path.posix.join(dir==='.'?'':dir,ent.name);
              const top=rel.split('/')[0];
              if(excludedTop.has(top)) continue;
              if(ent.isDirectory()) out.push(...walk(rel)); else out.push(rel);
            }
            return out;
          }
          function hasTarget(f){
            const t=fs.readFileSync(f,'utf8');
            return t.includes(target)||t.includes(targetBase);
          }
          const all=walk('.');
          const html=all.filter(f=>f.endsWith('.html'));
          const css=all.filter(f=>f.startsWith('assets/css/')&&f.endsWith('.css'));
          const runtimeJs=all.filter(f=>f.startsWith('assets/js/')&&f.endsWith('.js'));
          const toolingJs=all.filter(f=>f.startsWith('scripts/')&&f.endsWith('.js'));
          const otherJs=all.filter(f=>f.endsWith('.js')&&!f.startsWith('assets/js/')&&!f.startsWith('scripts/'));
          function cleanRef(s){return s.trim().split(/[?#]/)[0].replace(/^['"]|['"]$/g,'');}
          function resolveRef(from,ref){
            ref=cleanRef(ref);
            if(!ref||/^(?:https?:|data:|\/\/)/i.test(ref)) return null;
            if(ref.startsWith('/')) return path.posix.normalize(ref.slice(1));
            return path.posix.normalize(path.posix.join(path.posix.dirname(from),ref));
          }
          const directEntrypoints=new Set(); let htmlLinks=0;
          for(const f of html){
            const t=fs.readFileSync(f,'utf8');
            const re=/<link\b[^>]*href\s*=\s*["']([^"']+\.css(?:[?#][^"']*)?)["'][^>]*>/gi;
            for(const m of t.matchAll(re)){
              const r=resolveRef(f,m[1]);
              if(r){directEntrypoints.add(r); if(r===target) htmlLinks++;}
            }
          }
          const imports=new Map(); let actualImporters=0; let cssTextRefs=0;
          for(const f of css){
            const t=fs.readFileSync(f,'utf8'); const refs=[];
            const re=/@import\s+(?:url\(\s*)?["']([^"']+\.css(?:[?#][^"']*)?)["']\s*\)?/gi;
            for(const m of t.matchAll(re)){
              const r=resolveRef(f,m[1]);
              if(r){refs.push(r); if(r===target) actualImporters++;}
            }
            imports.set(f,refs);
            if(f!==target){
              const stripped=t.replace(/@import[^;]+;/gi,'');
              if(stripped.includes(target)||stripped.includes(targetBase)) cssTextRefs++;
            }
          }
          const reachable=new Set(),stack=[...directEntrypoints];
          while(stack.length){
            const f=stack.pop(); if(reachable.has(f)) continue;
            reachable.add(f); for(const r of imports.get(f)||[]) stack.push(r);
          }
          const runtimeRefs=runtimeJs.filter(hasTarget).sort();
          const toolingRefs=toolingJs.filter(hasTarget).sort();
          const otherRefs=otherJs.filter(hasTarget).sort();
          const expectedTooling=[
            'scripts/audit-css-dormant-debt-policy.js',
            'scripts/audit-frontend-contracts.js',
            'scripts/audit-responsive-inventory.js'
          ];
          if(runtimeRefs.length!==0) throw Error(`runtime refs: ${runtimeRefs.join(',')}`);
          if(otherRefs.length!==0) throw Error(`unclassified js refs: ${otherRefs.join(',')}`);
          if(JSON.stringify(toolingRefs)!==JSON.stringify(expectedTooling)) throw Error(`tooling refs: ${JSON.stringify(toolingRefs)}`);
          const active=reachable.has(target)?1:0;
          const wholeFileDormant=(htmlLinks===0&&actualImporters===0&&runtimeRefs.length===0&&cssTextRefs===0&&active===0)?1:0;
          console.log(`LOADMAP PASS|activeHtml=${html.length}|physicalCss=${css.length}|directEntrypoints=${directEntrypoints.size}|reachableCss=${reachable.size}`);
          console.log(`CLASSIFICATION PASS|runtimeJsScope=assets/js/**|runtimeJsRefs=${runtimeRefs.length}|toolingJsScope=scripts/**|toolingJsRefs=${toolingRefs.length}|otherJsRefs=${otherRefs.length}|toolingRefs=${toolingRefs.join(',')}`);
          console.log(`REACH ${wholeFileDormant?'PASS':'FAIL'}|htmlLinks=${htmlLinks}|actualImporters=${actualImporters}|runtimeJsRefs=${runtimeRefs.length}|toolingJsRefs=${toolingRefs.length}|cssTextRefs=${cssTextRefs}|active=${active}|wholeFileDormant=${wholeFileDormant}`);
          if(!wholeFileDormant) throw Error('target has active/runtime reach');
          NODE
          grep -Fq "$TARGET_FILE" docs/DEPRECATED-CSS.md
          grep -Fq "$TARGET_FILE" docs/validation/active-css-load-map.md
          echo 'GOVERNANCE CLASSIFICATION PASS|deprecatedDoc=1|trackedDormantMap=1|toolingExcludedFromRuntime=1'
          echo "PARENT PASS|sha=$PARENT_SHA|target=$TARGET_FILE|blob=$EXPECTED_BLOB|important=$EXPECTED_IMPORTANT"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$EXPECTED_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; grep -E '^(PARENT PASS|CANDIDATE PASS|LOADMAP PASS|CLASSIFICATION PASS|REACH (PASS|FAIL)|GOVERNANCE CLASSIFICATION PASS)\|' /tmp/reach.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 700 /tmp/reach.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 027 app mobile topbar reach r2 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
