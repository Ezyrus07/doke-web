name: UX CSS Important 032 App Header Canonical Contract Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote032:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 6cc3d03e5f9bd451f11daff835fecefb08e25216
      TARGET_FILE: assets/css/components/shell/app-header-canonical-contract.css
      TARGET_BLOB: a9de4b3fefe54ded6693ba655524310682de5038
      CANDIDATE_SHA256: 7125451bb620de18b28830df4cfd8559d1ae8bf775806d3f5eb7b737f394c486
      CANDIDATE_BLOB: ed8220a58070aad2fd533c60396441a2ebd7420f
      REACH_FILE: .diagnostics/ux-css-important-032-app-header-canonical-contract-reach-r1.txt
      REACH_BLOB: 3507e417499f56d880a9f14572b36fcf3d9465f5
      BROWSER_FILE: .diagnostics/ux-css-important-032-app-header-canonical-contract-browser-r2.txt
      BROWSER_BLOB: e460d3d065321a36439e6c3e45406a186dcfb6fc
      GOV_FILE: .diagnostics/ux-css-important-032-app-header-canonical-contract-governance-r3.txt
      GOV_BLOB: db662f4ed353a7519033ea60ff10915e1697c234
      PERM_BRANCH: ux/ux-css-important-032-app-header-canonical-contract-dormant-priority-clean
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-032-app-header-canonical-contract-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt
          git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt
          git show HEAD:"$GOV_FILE" >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt
          grep -Fq 'wholeFileDormant=1' /tmp/reach.txt
          grep -Fq 'targetStylesheetLoads=0/0|pageRoots=24/24' /tmp/browser.txt
          grep -Fq 'IMPORTANT PASS|total=8234|outsideServiceCard=8172|files=17|delta=-304' /tmp/gov.txt
          grep -Fq 'PRODUCT DIFF PASS|files=1|additions=304|deletions=304|file=assets/css/components/shell/app-header-canonical-contract.css|markerDelta=304' /tmp/gov.txt

          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout -B product "refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test ! -e __noop__
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          git show "HEAD:$TARGET_FILE" >/tmp/source.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const src=fs.readFileSync('/tmp/source.css','utf8');
          const before=(src.match(/!important\b/g)||[]).length;
          const out=src.replace(/\s*!important\b/g,'');
          const after=(out.match(/!important\b/g)||[]).length;
          const h=crypto.createHash('sha256').update(Buffer.from(out)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',out);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(before!==304||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          fs.writeFileSync(process.env.TARGET_FILE,out);
          console.log(`CANDIDATE MATERIALIZATION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(out)}|important=304->0|markerOnly=1|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$CANDIDATE_BLOB"
          num="$(git diff --numstat -- "$TARGET_FILE")"; add="$(printf '%s' "$num"|cut -f1)"; del="$(printf '%s' "$num"|cut -f2)"; test "$add" = 304; test "$del" = 304
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -- "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-032: remove dormant app header canonical priorities' >/dev/null
          head="$(git rev-parse HEAD)"; tree="$(git rev-parse HEAD^{tree})"; parent="$(git rev-parse HEAD^)"; blob="$(git rev-parse "HEAD:$TARGET_FILE")"
          test "$parent" = "$PARENT_SHA"; test "$blob" = "$CANDIDATE_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..$head")" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$head" | wc -l)" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$head")" = "$TARGET_FILE"
          echo "PRODUCT COMMIT PASS|head=$head|tree=$tree|parent=$parent|blob=$blob|files=1|additions=$add|deletions=$del|markerDelta=304|markerOnly=1"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          remote="$(git ls-remote origin "refs/heads/$PERM_BRANCH" | cut -f1)"; test "$remote" = "$head"
          echo "PRODUCT PUSH PASS|branch=$PERM_BRANCH|head=$head|force=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { grep -E '^(CANDIDATE MATERIALIZATION PASS|PRODUCT COMMIT PASS|PRODUCT PUSH PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 800 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 032 app header canonical contract promotion [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
