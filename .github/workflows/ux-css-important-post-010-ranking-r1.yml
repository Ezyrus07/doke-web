name: UX CSS Important Post 017 Fresh Ranking R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  rank018:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: c07f4b62e12dd7e01ede6ade20234ea01180730a
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-post-017-fresh-ranking-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: rank
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          npm ci --ignore-scripts >/dev/null
          npm run audit:important-reduction-plan >/dev/null
          npm run audit:global-css-design-system >/dev/null
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8'));
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const s=b.summary,ps=p.summary;
          if(s.totalImportant!==10707||s.outsideServiceCardImportant!==10645||s.filesWithImportant!==30)throw Error('baseline '+JSON.stringify(s));
          if(ps.affectedFiles!==29||ps.totalImportantOutsideServiceCard!==10645||ps.byRisk?.['high-baseline-required']!==10637||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2)throw Error('plan '+JSON.stringify(ps));
          console.log(`PLAN SUMMARY|affectedFiles=${ps.affectedFiles}|outside=${ps.totalImportantOutsideServiceCard}|high=${ps.byRisk['high-baseline-required']}|medium=${ps.byRisk['medium-baseline-required']}|low=${ps.byRisk['low-review-candidate']}`);
          console.log(`BASELINE SUMMARY|total=${s.totalImportant}|outside=${s.outsideServiceCardImportant}|files=${s.filesWithImportant}`);
          const files=cp.execFileSync('git',['ls-files','assets/css/**/*.css','assets/css/*.css'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const counts=[];let total=0;for(const f of files){const txt=fs.readFileSync(f,'utf8'),n=(txt.match(/!important\b/g)||[]).length;if(n){counts.push([n,f]);total+=n;}}
          counts.sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1]));
          console.log(`COUNT INVENTORY|files=${counts.length}|total=${total}`);if(counts.length!==30||total!==10707)throw Error(`inventory ${counts.length}/${total}`);
          for(const [n,f] of counts)console.log(`COUNT FILE|important=${n}|file=${f}`);
          const arr=p.files||p.items||p.entries||[];const highs=[];
          for(const x of arr){const f=x.file||x.path||x.filePath||x.filename;const risk=x.risk||x.riskClass||x.classification||x.bucket;const n=x.importantCount??x.important??x.count??x.totalImportant;if(f&&risk==='high-baseline-required'){highs.push([Number(n),f]);console.log(`PLAN FILE|important=${n}|risk=${risk}|file=${f}`);}}
          highs.sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1]));if(!highs.length)throw Error('no high files');console.log(`NEXT HIGH|important=${highs[0][0]}|file=${highs[0][1]}`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.rank.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "RANK=${{ steps.rank.outcome }}"; grep -E '^(PLAN SUMMARY|BASELINE SUMMARY|COUNT INVENTORY|COUNT FILE|PLAN FILE|NEXT HIGH)\|' /tmp/r.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 360 /tmp/r.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish post-017 important ranking r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
