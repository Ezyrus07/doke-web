name: UX CSS Important 021 Home Mobile Hero Promotion R9
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote021:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 6aa5b028eb6ec7398ae35315bfffc79396955abd
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: fea7bdfea3f78f77a38385c155e442ca47911bfe
      CANDIDATE_SHA256: c7d6e0c12894c81c4350798a5691e2384036f19864b45b407b5c2eb34c869f55
      PERM_BRANCH: ux/ux-css-important-021-home-mobile-hero-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-021-home-mobile-hero-promotion-r9.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-021-home-mobile-hero-candidate-r6.txt >/tmp/candidate.txt
          git show HEAD:.diagnostics/ux-css-important-021-home-mobile-hero-browser-r7.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-021-home-mobile-hero-governance-r8.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/candidate.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/candidate.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -Fq "candidateHash=$CANDIDATE_SHA256" /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout --detach "$PARENT_SHA" >/dev/null; test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let o=fs.readFileSync(f,'utf8');const re=/html\.home-index-root body\.home-index-shell \.home-mobile-hero\s*\{\s*display:\s*block\s*!important;\s*padding:\s*0;\s*\}/m,m=o.match(re);if(!m)throw Error('rule');const c=o.replace(re,m[0].replace('display: block !important;','display: block;')),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');if((o.match(/!important\b/g)||[]).length!==128||(c.match(/!important\b/g)||[]).length!==127||h!==process.env.CANDIDATE_SHA256)throw Error(h);fs.writeFileSync(f,c);console.log(`CANDIDATE|sha256=${h}|bytes=${Buffer.byteLength(c)}|important=128->127|removed=1|familyImportant=1->0|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=0|familyDormant=1`)
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1; test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'1\t1\t'"$TARGET_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_FILE"; git commit -m 'UX-CSS-IMPORTANT-021 remove dormant Home mobile hero display priority' >/dev/null
          head="$(git rev-parse HEAD)"; parent="$(git rev-parse HEAD^)"; tree="$(git rev-parse HEAD^{tree})"; blob="$(git rev-parse "HEAD:$TARGET_FILE")"
          test "$parent" = "$PARENT_SHA"; test "$(git rev-list --count "$PARENT_SHA..$head")" -eq 1; test "$(git diff --name-only "$PARENT_SHA" "$head" | wc -l)" -eq 1; test "$(git diff --numstat "$PARENT_SHA" "$head" -- "$TARGET_FILE")" = $'1\t1\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null; test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$head"
          echo "PROMOTION PASS|head=$head|parent=$parent|tree=$tree|blob=$blob|files=1|numstat=1/1/$TARGET_FILE|leaseParent=$PARENT_SHA|targetImportant=127"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|PROMOTION PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 480 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 021 home mobile hero promotion r9 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
