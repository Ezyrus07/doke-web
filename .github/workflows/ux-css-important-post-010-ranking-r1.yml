name: UX CSS Important Post-010 Ranking R1

on:
  push:
    branches:
      - diag/ux-css-important-post-010-ranking-r1

permissions:
  contents: write

jobs:
  rank:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 58df6a9856874d541951430f9eab99e322da3c0f
      RESULT_FILE: .diagnostics/ux-css-important-post-010-ranking-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify parent and rank current importance debt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          node scripts/audit-important-reduction-plan.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const ROOT = process.cwd();
          const parent = process.env.PARENT_SHA;
          const resultFile = process.env.RESULT_FILE;
          const reportPath = path.join(ROOT, 'reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json');
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const norm = (p) => p.replace(/\\/g, '/').replace(/^\.\//, '');
          const rootHtml = fs.readdirSync(ROOT, {withFileTypes:true})
            .filter(e => e.isFile() && e.name.endsWith('.html'))
            .map(e => e.name)
            .sort();

          function localCssLinks(htmlFile) {
            const text = fs.readFileSync(path.join(ROOT, htmlFile), 'utf8');
            const out = [];
            for (const m of text.matchAll(/<link\b[^>]*href=["']([^"']+\.css(?:\?[^"']*)?)["'][^>]*>/gi)) {
              const href = m[1].split('?')[0].split('#')[0];
              if (/^(?:https?:)?\/\//i.test(href) || href.startsWith('data:')) continue;
              out.push(norm(path.posix.normalize(path.posix.join(path.posix.dirname(htmlFile), href))));
            }
            return out;
          }

          function cssImports(cssFile) {
            const abs = path.join(ROOT, cssFile);
            if (!fs.existsSync(abs)) return [];
            const text = fs.readFileSync(abs, 'utf8');
            const out = [];
            for (const m of text.matchAll(/@import\s+(?:url\()?\s*["']([^"']+\.css(?:\?[^"']*)?)["']\s*\)?/gi)) {
              const href = m[1].split('?')[0].split('#')[0];
              if (/^(?:https?:)?\/\//i.test(href) || href.startsWith('data:')) continue;
              out.push(norm(path.posix.normalize(path.posix.join(path.posix.dirname(cssFile), href))));
            }
            return out;
          }

          const pageClosures = new Map();
          for (const html of rootHtml) {
            const seen = new Set();
            const queue = [...localCssLinks(html)];
            while (queue.length) {
              const css = queue.shift();
              if (seen.has(css)) continue;
              seen.add(css);
              for (const imp of cssImports(css)) if (!seen.has(imp)) queue.push(imp);
            }
            pageClosures.set(html, seen);
          }

          function reach(file) {
            const pages = [];
            for (const [html, set] of pageClosures) if (set.has(file)) pages.push(html);
            return pages;
          }

          const all = report.topFiles.concat(
            report.lowRiskFiles
              .filter(f => !report.topFiles.some(x => x.file === f))
              .map(f => {
                const text = fs.readFileSync(path.join(ROOT, f), 'utf8');
                return {file:f, importantCount:(text.match(/!important\b/g)||[]).length, risk:'low-review-candidate', layer:'unknown'};
              })
          );

          const high = report.topFiles
            .filter(x => x.risk === 'high-baseline-required')
            .map(x => ({...x, pages: reach(x.file)}))
            .sort((a,b) => a.pages.length - b.pages.length || b.importantCount - a.importantCount || a.file.localeCompare(b.file));

          const low = report.lowRiskFiles.map(file => {
            const text = fs.readFileSync(path.join(ROOT, file), 'utf8');
            return {file, importantCount:(text.match(/!important\b/g)||[]).length, pages:reach(file)};
          });

          const protected006 = 'assets/css/pages/home/mobile-composition.css';
          const protected006Count = fs.existsSync(path.join(ROOT, protected006))
            ? (fs.readFileSync(path.join(ROOT, protected006),'utf8').match(/!important\b/g)||[]).length : -1;

          const lines = [];
          lines.push(`PARENT_SHA=${parent}`);
          lines.push(`REPORT_STATUS=${report.status}`);
          lines.push(`AFFECTED_FILES=${report.summary.affectedFiles}`);
          lines.push(`TOTAL_OUTSIDE_SERVICE_CARD=${report.summary.totalImportantOutsideServiceCard}`);
          lines.push(`LOW_TOKENS=${report.summary.byRisk?.['low-review-candidate'] || 0}`);
          lines.push(`MEDIUM_TOKENS=${report.summary.byRisk?.['medium-baseline-required'] || 0}`);
          lines.push(`HIGH_TOKENS=${report.summary.byRisk?.['high-baseline-required'] || 0}`);
          lines.push(`LOW_FILES=${report.summary.lowRiskFileCount}`);
          lines.push(`PROTECTED006_FILE=${protected006}`);
          lines.push(`PROTECTED006_COUNT=${protected006Count}`);
          for (const x of low) lines.push(`LOW|file=${x.file}|important=${x.importantCount}|reach=${x.pages.length}|pages=${x.pages.join(',')}`);
          high.slice(0, 12).forEach((x,i) => lines.push(`HIGH${i}|file=${x.file}|important=${x.importantCount}|reach=${x.pages.length}|pages=${x.pages.join(',')}`));
          lines.push(`ROOT_HTML_COUNT=${rootHtml.length}`);
          lines.push('RESULT=PASS');
          fs.mkdirSync(path.dirname(resultFile), {recursive:true});
          fs.writeFileSync(resultFile, lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE
      - name: Publish receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish post-010 important ranking r1 [skip ci]'
          git push origin HEAD:refs/heads/diag/ux-css-important-post-010-ranking-r1
