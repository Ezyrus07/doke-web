name: UX CSS Important 029 Mobile Page Rhythm Contract Permanent Cert R7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  certify029r7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: f33944c9c44bd7bcad50ccd84ac41b2bed4b314d
      PERM_SHA: 6d3eed90684a23f895e3fa93fa344b875e94b4e0
      PERM_TREE: c17a9ee53fcbec11dbe059fa23c6e9a2d9f471ee
      TARGET_FILE: assets/css/components/navigation/mobile-page-rhythm-contract.css
      PARENT_BLOB: 7952fd91dbd24f722350c491f7103c74d4160345
      PERM_BLOB: 9e5f1ee53dad8a6c57238359cb70c49f4d15ac99
      CANDIDATE_SHA256: 841d8a0d6b65497c468da14c010c081e10111930631b3b6952d694870cfdf262
      PERM_BRANCH: ux/ux-css-important-029-mobile-page-rhythm-contract-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      REACH_FILE: .diagnostics/ux-css-important-029-mobile-page-rhythm-contract-reach-r1.txt
      REACH_BLOB: c896e4936b1f5ba89da808feffaf7a46316dc33b
      BROWSER_FILE: .diagnostics/ux-css-important-029-mobile-page-rhythm-contract-browser-r5.txt
      BROWSER_BLOB: a51c074c85934f4df958b95f74f1f80e4654aa08
      GOV_FILE: .diagnostics/ux-css-important-029-mobile-page-rhythm-contract-governance-r6.txt
      GOV_BLOB: d04ff54e2b7d2e022955d2a9c51cdbe4016b5284
      RESULT_FILE: .diagnostics/ux-css-important-029-mobile-page-rhythm-contract-permanent-cert-r7.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: certify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/c.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt
          git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt
          git show HEAD:"$GOV_FILE" >/tmp/gov.txt

          grep -q '^RESULT=PASS$' /tmp/reach.txt
          grep -Fq "CANDIDATE PASS|bytes=12876|important=236->0|removed=236|sha256=$CANDIDATE_SHA256|blob=$PERM_BLOB|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0" /tmp/reach.txt
          grep -Fq 'CANONICAL REACH PASS|rootHtml=27|loadedCss=402|physicalCss=533|htmlLinks=0|actualImporters=0|runtimeJsRefs=0|toolingJsRefs=0|otherJsRefs=0|cssTextRefs=0|active=0|wholeFileDormant=1|toolingRefs=none' /tmp/reach.txt
          grep -Fq 'ALIAS RECONCILIATION PASS|historicalPath=assets/css/components/shell/mobile-page-rhythm-contract.css|oldPhysical=0|oldHtmlLinks=0|oldActualImporters=0|oldRuntimeJsRefs=0|oldToolingJsRefs=2|oldOtherJsRefs=0|oldCssTextRefs=0|oldActive=0|docsOnlyRefs=1|canonicalPath=assets/css/components/navigation/mobile-page-rhythm-contract.css' /tmp/reach.txt

          grep -q '^RESULT=PASS$' /tmp/browser.txt
          grep -Fq "CANDIDATE PASS|sha256=$CANDIDATE_SHA256|blob=$PERM_BLOB|important=236->0|bytes=12876|reachR1HashStable=1|r2HashStable=1|r3HashStable=1|r4HashStable=1" /tmp/browser.txt
          grep -Fq "BROWSER PASS|sha256=$CANDIDATE_SHA256|pages=home,results,profile,community,orders,notifications,messages,settings|states=32|viewports=360p,430p,760p,761p|metadataDiffs=0|screenshotDiffs=0|stableStates=32/32|pageErrors=0|targetStylesheetLoads=0/0|renderedRoots=16/16|authRedirects=16/16|authUnexpected=0/0|syntheticDOM=0|syntheticAuth=0|credentialsUsed=0|criteriaRelaxed=0|authContractMode=explicit|externalResourcesBlocked=1|animationsDisabled=1|dateFrozen=1|breakpoints=760/761" /tmp/browser.txt
          grep -Fq 'R2 TRANSFER PASS|run=32423410184|historicalResult=FAIL|classification=harness-invalid|failure=q-not-defined|preserved=1' /tmp/browser.txt
          grep -Fq 'R3 TRANSFER PASS|run=32423781769|historicalResult=FAIL|classification=auth-scope|materialVisualEquivalence=PASS|metadataDiffs=0|screenshotDiffs=0|stableStates=32/32|renderedRoots=16/16|authRedirectStates=16/16|preserved=1' /tmp/browser.txt
          grep -Fq 'R4 TRANSFER PASS|run=32424943825|historicalResult=FAIL|classification=harness-invalid|failure=duplicated-r3-log-line-count|browserStarted=0|candidateReconstructionStarted=0|preserved=1' /tmp/browser.txt

          grep -q '^RESULT=PASS$' /tmp/gov.txt
          grep -Fq 'IMPORTANT PASS|total=9105|outsideServiceCard=9043|files=20|delta=-236' /tmp/gov.txt
          grep -Fq 'QUEUE PASS|affectedFiles=19|highBaselineRequired=9035|mediumBaselineRequired=6|lowReviewCandidate=2|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127' /tmp/gov.txt
          grep -Fq 'DEPENDENCY PASS|total=13|critical=0|high=10|moderate=1|low=2' /tmp/gov.txt
          grep -Fq 'PRODUCT DIFF PASS|files=1|additions=236|deletions=236|file=assets/css/components/navigation/mobile-page-rhythm-contract.css|markerDelta=236' /tmp/gov.txt
          grep -Fq 'GOVERNANCE PASS|duplicates=0/0|domain=23/15/2.91/12|browserProof=hash-identical|reachProof=hash-identical|wholeFileDormant=1|candidateHash=exact|candidateBlob=exact|repoGlobalStrictSeparated=1' /tmp/gov.txt
          echo 'PROOF TRANSFER PASS|reach=R1|browser=R5|governance=R6|candidateHash=exact|candidateBlob=exact|historicalR2R3R4Preserved=1|wholeFileDormant=1|runtimeJsRefs=0|toolingJsRefs=0|authContractExplicit=1'

          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PERM_SHA"
          git checkout --detach "$PERM_SHA" >/dev/null
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PERM_TREE"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..$PERM_SHA")" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$PERM_SHA" | wc -l)" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$PERM_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$PERM_SHA" -- "$TARGET_FILE")" = $'236\t236\t'"$TARGET_FILE"

          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const o=fs.readFileSync('/tmp/parent.css','utf8'),c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          fs.writeFileSync('/tmp/rebuilt.css',c);
          const blob=cp.execFileSync('git',['hash-object','/tmp/rebuilt.css'],{encoding:'utf8'}).trim();
          if(before!==236||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.PERM_BLOB)throw Error(`rebuild ${before}/${after}/${h}/${blob}`);
          console.log(`RECONSTRUCTION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(c)}|important=236->0|removed=236|byteIdentical=1|browserProofTransfer=hash-identical|reachProofTransfer=hash-identical|wholeFileDormant=1`)
          NODE
          cmp -s /tmp/rebuilt.css "$TARGET_FILE"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l || true)" -eq 0

          npm ci --ignore-scripts >/dev/null
          node scripts/generate-responsive-index-baseline.js >/dev/null
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|state=permanent'

          npm run audit:agent-governance >/dev/null
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflicts');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`)
          NODE
          npm run audit:shared-app-header-contract >/dev/null
          npm run audit:mobile-shell-location-contract >/dev/null
          npm run audit:responsive-boundaries >/dev/null
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$PERM_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures >/dev/null
          npm run audit:important-reduction-plan >/dev/null
          npm run audit:global-css-design-system >/dev/null

          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8')),s=b.summary,ps=p.summary;
          if(s.totalImportant!==9105||s.outsideServiceCardImportant!==9043||s.filesWithImportant!==20)throw Error(`important ${JSON.stringify(s)}`);
          if(ps.affectedFiles!==19||ps.totalImportantOutsideServiceCard!==9043||ps.byRisk?.['high-baseline-required']!==9035||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2)throw Error(`plan ${JSON.stringify(ps)}`);
          const protectedFiles={
            protected006:['assets/css/pages/home/mobile-composition.css',6],
            protected010:['assets/css/components/cards/mobile-card-contract.css',2],
            protected020:['assets/css/components/shell/mobile-base-stability.css',28],
            protected021:['assets/css/pages/home/mobile-hero-feed.css',127]
          };
          for(const [label,[file,want]] of Object.entries(protectedFiles)){const got=(fs.readFileSync(file,'utf8').match(/!important\b/g)||[]).length;if(got!==want)throw Error(`${label} ${file} ${got}/${want}`)}
          const target=(fs.readFileSync(process.env.TARGET_FILE,'utf8').match(/!important\b/g)||[]).length;if(target!==0)throw Error(`target ${target}`);
          console.log('IMPORTANT PASS|total=9105|outsideServiceCard=9043|files=20');
          console.log('QUEUE PASS|affectedFiles=19|highBaselineRequired=9035|mediumBaselineRequired=6|lowReviewCandidate=2|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127')
          NODE

          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};
          if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);
          console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`)
          NODE
          echo "AUDIT_EXIT=$code"
          echo 'CERTIFICATION PASS|fullHistory=1|oneCommit=1|oneFile=1|numstat=236/236|wholeFileDormant=1|runtimeJsRefs=0|toolingJsRefs=0|browserMetadataDiffs=0|browserScreenshotDiffs=0|browserStableStates=32/32|browserPageErrors=0|targetStylesheetLoads=0/0|renderedRoots=16/16|authRedirects=16/16|authUnexpected=0/0|credentialsUsed=0|historicalR2R3R4Preserved=1|browserProofTransfer=hash-identical|reachProofTransfer=hash-identical|duplicates=0/0|domain=23/15/2.91/12|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.certify.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PERM_SHA=$PERM_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_TREE=$PERM_TREE"; echo "PERM_BLOB=$PERM_BLOB"; echo "CERTIFY=${{ steps.certify.outcome }}"; grep -E '^(PROOF TRANSFER PASS|RECONSTRUCTION PASS|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT PASS|QUEUE PASS|DEPENDENCY PASS|CERTIFICATION PASS)\|' /tmp/c.log || true; grep '^AUDIT_EXIT=' /tmp/c.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 900 /tmp/c.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"
          git commit -m 'diag: publish 029 mobile page rhythm contract permanent cert r7 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
