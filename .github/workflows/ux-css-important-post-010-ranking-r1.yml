name: UX CSS Important 035 Render Active Canonical Parity P10
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  probe035p10:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      TARGET_FILE: assets/css/components/shell/doke-shell-contract.css
      TARGET_BLOB: c167c0b747dbb4465cdaf096b5a9225fa3d69059
      CANDIDATE_SHA256: fa114edbfe30797719983d9f599b4efb589dd89f57cd332ecb779bbe9b1b9845
      CANDIDATE_BLOB: 5000b0aa60f6d93e123bc17811887e57668d4988
      P9_FILE: .diagnostics/ux-css-important-035-semantic-oracle-variance-p9.txt
      P9_BLOB: d17ab0dc57adae2b7eda666ed1545644a171c6e7
      RESULT_FILE: .diagnostics/ux-css-important-035-render-active-canonical-parity-p10.txt
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p10.log) 2>&1
          test "$(git rev-parse "HEAD:$P9_FILE")" = "$P9_BLOB"
          git show HEAD:"$P9_FILE" >/tmp/p9.txt
          grep -q '^RUN_ID=32487407442$' /tmp/p9.txt
          grep -q '^RESULT=PASS$' /tmp/p9.txt
          grep -Fq 'COMPARE|scope=P1-P2|rows=808/808|changedRows=0|rootAttrsEqual=1|bodyAttrsEqual=1|sheetsEqual=1' /tmp/p9.txt
          grep -Fq 'COMPARE|scope=C1-C2|rows=808/808|changedRows=0|rootAttrsEqual=1|bodyAttrsEqual=1|sheetsEqual=1' /tmp/p9.txt
          grep -Fq 'COMPARE|scope=P1-C1|rows=808/808|changedRows=23|rootAttrsEqual=1|bodyAttrsEqual=1|sheetsEqual=0' /tmp/p9.txt
          grep -Fq 'ROW DIFF|scope=P1-C1|idx=132|sig=link#.|parts=attrs' /tmp/p9.txt
          grep -Fq 'PROBE RESULT|parentVariantRows=0|candidateVariantRows=0|parentCandidateRows=23|originNormalized=1|targetLoads=0/0|criteriaRelaxed=0|classification=DIFF_COMPONENTS_CAPTURED' /tmp/p9.txt
          echo 'P9 TRANSFER PASS|body-and-style-diffs=0|only-head-link-order=23|parentStable=1|candidateStable=1|targetLoads=0/0'
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          mkdir /tmp/parent-site /tmp/candidate-site
          git archive "$PARENT_SHA" | tar -x -C /tmp/parent-site
          git archive "$PARENT_SHA" | tar -x -C /tmp/candidate-site
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const p='/tmp/candidate-site/'+process.env.TARGET_FILE,s=fs.readFileSync(p,'utf8'),c=s.replace(/\s*!important\b/g,'');
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync(p,c);const blob=cp.execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          const before=(s.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          if(before!==2552||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          console.log(`CANDIDATE PASS|important=${before}->${after}|sha256=${h}|blob=${blob}|transform=marker-only`);
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/parent-site >/tmp/http-parent.log 2>&1 & echo $! >/tmp/http-parent.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/candidate-site >/tmp/http-candidate.log 2>&1 & echo $! >/tmp/http-candidate.pid
          trap 'kill $(cat /tmp/http-parent.pid 2>/dev/null) $(cat /tmp/http-candidate.pid 2>/dev/null) 2>/dev/null || true' EXIT
          for port in 4173 4174; do ok=0; for i in {1..30}; do if curl -fsS "http://127.0.0.1:$port/comunidade.html" >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1; done
          cat >/tmp/p10.js <<'NODE'
          const {chromium}=require('playwright'),crypto=require('crypto');
          const targetPath='/assets/css/components/shell/doke-shell-contract.css';
          async function rgbaHash(page,buf){return page.evaluate(async b64=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const bmp=await createImageBitmap(new Blob([u],{type:'image/png'})),c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0);const p=x.getImageData(0,0,c.width,c.height).data,d=await crypto.subtle.digest('SHA-256',p);return[...new Uint8Array(d)].map(v=>v.toString(16).padStart(2,'0')).join('');},buf.toString('base64'));}
          async function canonical(page){return page.evaluate(async()=>{
            const norm=v=>String(v??'').replace(/https?:\/\/(?:127\.0\.0\.1|localhost):\d+/g,'<ORIGIN>');
            const round=n=>Number.isFinite(n)?+n.toFixed(4):n;
            const sha=async value=>{const b=new TextEncoder().encode(typeof value==='string'?value:JSON.stringify(value)),d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(v=>v.toString(16).padStart(2,'0')).join('')};
            const style=(el,pseudo=null)=>{const cs=getComputedStyle(el,pseudo),a=[];for(const p of [...cs].sort())a.push([p,norm(cs.getPropertyValue(p))]);return a};
            const element=el=>{const r=el.getBoundingClientRect(),bc=getComputedStyle(el,'::before').content,ac=getComputedStyle(el,'::after').content;return{tag:el.tagName.toLowerCase(),attrs:[...el.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0])),ownText:[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>norm(n.nodeValue)).join(''),rect:[round(r.x),round(r.y),round(r.width),round(r.height),round(r.right),round(r.bottom)],client:[el.clientWidth,el.clientHeight,el.clientLeft,el.clientTop],scroll:[el.scrollWidth,el.scrollHeight,el.scrollLeft,el.scrollTop],state:{value:'value'in el?norm(el.value):null,checked:'checked'in el?!!el.checked:null,selected:'selected'in el?!!el.selected:null,disabled:'disabled'in el?!!el.disabled:null},style:style(el),before:bc!=='none'?style(el,'::before'):null,after:ac!=='none'?style(el,'::after'):null}};
            const bodyRows=[document.body,...document.body.querySelectorAll('*')].map(element);
            const bodyHash=await sha(bodyRows);
            const rootAttrs=[...document.documentElement.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0]));
            const bodyAttrs=[...document.body.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0]));
            const allLinks=[...document.head.querySelectorAll('link')];
            const isDynamic=l=>l.hasAttribute('data-doke-route-preload')||l.hasAttribute('data-doke-stable-route-style')||l.hasAttribute('data-doke-route-style-pending');
            const attrs=l=>[...l.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0]));
            const dynamic=allLinks.filter(isDynamic).map(attrs).map(x=>JSON.stringify(x)).sort();
            const staticOrdered=allLinks.filter(l=>!isDynamic(l)).map(attrs);
            const dynamicContract=allLinks.filter(isDynamic).every(l=>l.rel==='preload'||(l.rel==='stylesheet'&&(l.media||'').trim()==='not all'));
            const sheets=[...document.styleSheets].map(s=>{let rules=-1;try{rules=s.cssRules.length}catch{}const media=s.media?.mediaText||'',active=!s.disabled&&(!media||media==='all'||matchMedia(media).matches);return{href:s.href?norm(new URL(s.href,location.href).href):null,media,disabled:s.disabled,rules,active}});
            const activeSheets=sheets.filter(s=>s.active),inactiveSheets=sheets.filter(s=>!s.active).map(x=>JSON.stringify(x)).sort();
            const styleTags=[...document.head.querySelectorAll('style')].map(s=>norm(s.textContent||''));
            return{path:location.pathname,page:document.body?.dataset?.page||'',bodyHash,bodyRows:bodyRows.length,rootAttrs,bodyAttrs,dynamicHash:await sha(dynamic),dynamicCount:dynamic.length,dynamicContract,staticHash:await sha(staticOrdered),staticCount:staticOrdered.length,activeSheetsHash:await sha(activeSheets),activeSheetsCount:activeSheets.length,inactiveSheetsHash:await sha(inactiveSheets),inactiveSheetsCount:inactiveSheets.length,styleTagsHash:await sha(styleTags),styleTagsCount:styleTags.length};
          })}
          async function capture(browser,port,label){const ctx=await browser.newContext({viewport:{width:820,height:1180},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Bahia',reducedMotion:'reduce'});try{await ctx.route('**/*',route=>{const u=new URL(route.request().url());return(u.hostname==='127.0.0.1'||u.hostname==='localhost')?route.continue():route.abort()});await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787263200000,RealDate=Date;class FixedDate extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}}globalThis.Date=FixedDate});const page=await ctx.newPage();page.setDefaultTimeout(60000);let loads=0,errors=0;page.on('request',r=>{if(new URL(r.url()).pathname===targetPath)loads++});page.on('pageerror',()=>errors++);await page.goto(`http://127.0.0.1:${port}/comunidade.html`,{waitUntil:'networkidle',timeout:45000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForFunction(()=>[...document.images].every(i=>i.complete),null,{timeout:15000}).catch(()=>{});await page.evaluate(async()=>{await Promise.allSettled([...document.images].map(i=>typeof i.decode==='function'?i.decode():Promise.resolve()))});await page.waitForTimeout(900);const a=await canonical(page);await page.waitForTimeout(350);const b=await canonical(page);const stable=JSON.stringify(a)===JSON.stringify(b);const shot=await page.screenshot({fullPage:true,timeout:60000,animations:'disabled',caret:'hide'}),pixel=await rgbaHash(page,shot);if(loads||errors||a.path!=='/comunidade.html'||a.page!=='comunidade'||!a.dynamicContract||!stable)throw Error(`${label} contract loads=${loads} errors=${errors} path=${a.path} page=${a.page} dynamic=${a.dynamicContract} stable=${stable}`);return{canon:a,pixel}}finally{await ctx.close().catch(()=>{})}}
          (async()=>{let exact=0,pixelEq=0;const rows=[];for(let i=1;i<=4;i++){const browser=await chromium.launch({headless:true});try{const order=i%2?['P','C']:['C','P'],out={};for(const side of order)out[side]=await capture(browser,side==='P'?4173:4174,side);const fields=['bodyHash','rootAttrs','bodyAttrs','dynamicHash','dynamicCount','staticHash','staticCount','activeSheetsHash','activeSheetsCount','inactiveSheetsHash','inactiveSheetsCount','styleTagsHash','styleTagsCount'];const diffs=fields.filter(f=>JSON.stringify(out.P.canon[f])!==JSON.stringify(out.C.canon[f]));const ok=diffs.length===0;if(ok)exact++;const pe=out.P.pixel===out.C.pixel;if(pe)pixelEq++;rows.push({p:out.P.canon,c:out.C.canon});console.log(`PAIR PASS|iteration=${i}|order=${order.join('')}|renderActiveEqual=${ok?1:0}|diffs=${diffs.join(',')||'none'}|pixelEqual=${pe?1:0}|bodyRows=${out.P.canon.bodyRows}/${out.C.canon.bodyRows}|dynamicLinks=${out.P.canon.dynamicCount}/${out.C.canon.dynamicCount}|activeSheets=${out.P.canon.activeSheetsCount}/${out.C.canon.activeSheetsCount}|inactiveSheets=${out.P.canon.inactiveSheetsCount}/${out.C.canon.inactiveSheetsCount}`)}finally{await browser.close().catch(()=>{})}}const parentBodies=new Set(rows.map(r=>r.p.bodyHash)).size,candidateBodies=new Set(rows.map(r=>r.c.bodyHash)).size;console.log(`CANONICAL SUMMARY|pairs=4|renderActiveEqual=${exact}/4|bodyStableUnique=${parentBodies}/${candidateBodies}|pixelEqual=${pixelEq}/4|dynamicHeadLinksInactive=1|dynamicHeadOrderCanonicalized=1|activeStylesheetOrderPreserved=1|inactiveStylesheetOrderCanonicalized=1|pixelTolerance=0|pixelMask=0`);console.log(`PROBE RESULT|renderActiveExact=${exact===4&&parentBodies===1&&candidateBodies===1?1:0}|renderActiveEqual=${exact}/4|bodyStable=${parentBodies===1&&candidateBodies===1?1:0}|criteriaRelaxed=0|pixelTolerance=0|pixelMask=0|targetLoads=0/0|oracle=body-full-computed-style-plus-active-sheet-order-plus-inactive-head-multiset`);if(exact!==4||parentBodies!==1||candidateBodies!==1)process.exit(2)})().catch(e=>{console.error('PROBE ERROR|'+(e?.stack||e));process.exit(1)})
          NODE
          timeout --signal=TERM --kill-after=20s 1200s env NODE_PATH="$PWD/node_modules" node /tmp/p10.js
          echo 'RESTORE PASS|workspace=parent-untouched|candidate=tmp-only'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.probe.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROBE=${{ steps.probe.outcome }}"; grep -E '^(P9 TRANSFER PASS|CANDIDATE PASS|PAIR PASS|CANONICAL SUMMARY|PROBE RESULT|PROBE ERROR|RESTORE PASS)' /tmp/p10.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 1400 /tmp/p10.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 035 render active canonical parity p10 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
