name: UX CSS Important 035 Body Variance Isolation P12
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  probe035p12:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      TARGET_FILE: assets/css/components/shell/doke-shell-contract.css
      TARGET_BLOB: c167c0b747dbb4465cdaf096b5a9225fa3d69059
      CANDIDATE_SHA256: fa114edbfe30797719983d9f599b4efb589dd89f57cd332ecb779bbe9b1b9845
      CANDIDATE_BLOB: 5000b0aa60f6d93e123bc17811887e57668d4988
      P11_FILE: .diagnostics/ux-css-important-035-dynamic-inactive-variance-p11.txt
      P11_BLOB: 491ce37885c17ac7567fa672a2ae93ce5a69d649
      RESULT_FILE: .diagnostics/ux-css-important-035-body-variance-p12.txt
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p12.log) 2>&1
          test "$(git rev-parse "HEAD:$P11_FILE")" = "$P11_BLOB"
          git show HEAD:"$P11_FILE" >/tmp/p11.txt
          grep -q '^RUN_ID=32503132763$' /tmp/p11.txt; grep -q '^RESULT=FAIL$' /tmp/p11.txt
          grep -Fq 'P11 SUMMARY|pairs=4|renderActiveEqual=3/4|dynamicInactiveEqual=1/4|bodyStableUnique=2/1' /tmp/p11.txt
          grep -Fq 'notification-action.js?v=20260809-ux-notif-009-v1' /tmp/p11.txt
          grep -Fq 'notification-action.js?v=20260810-ux-notif-010-v1' /tmp/p11.txt
          echo 'EVIDENCE TRANSFER PASS|probe=P11|inactiveVariance=notification-action-version|bodyVariance=1pair|criteriaRelaxed=0'
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          rm -rf /tmp/parent-site /tmp/candidate-site; mkdir /tmp/parent-site /tmp/candidate-site
          git archive "$PARENT_SHA" | tar -x -C /tmp/parent-site
          git archive "$PARENT_SHA" | tar -x -C /tmp/candidate-site
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const p='/tmp/candidate-site/'+process.env.TARGET_FILE,s=fs.readFileSync(p,'utf8'),c=s.replace(/\s*!important\b/g,'');
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync(p,c);const blob=cp.execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          if((s.match(/!important\b/g)||[]).length!==2552||(c.match(/!important\b/g)||[]).length!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error('candidate mismatch');
          console.log(`CANDIDATE PASS|important=2552->0|sha256=${h}|blob=${blob}|transform=marker-only`);
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/parent-site >/tmp/http-parent.log 2>&1 & echo $! >/tmp/http-parent.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/candidate-site >/tmp/http-candidate.log 2>&1 & echo $! >/tmp/http-candidate.pid
          trap 'kill $(cat /tmp/http-parent.pid 2>/dev/null) $(cat /tmp/http-candidate.pid 2>/dev/null) 2>/dev/null || true' EXIT
          for port in 4173 4174; do ok=0; for i in {1..30}; do if curl -fsS "http://127.0.0.1:$port/index.html" >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1; done
          cat >/tmp/p12.js <<'NODE'
          const {chromium}=require('playwright'),crypto=require('crypto');
          const H=v=>crypto.createHash('sha256').update(JSON.stringify(v)).digest('hex');
          const target='/assets/css/components/shell/doke-shell-contract.css';
          async function snap(browser,port,side,iter){
            const ctx=await browser.newContext({viewport:{width:1280,height:802},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Bahia',reducedMotion:'reduce'});let loads=0,errors=0;
            try{
              await ctx.route('**/*',route=>{const u=new URL(route.request().url());return(u.hostname==='127.0.0.1'||u.hostname==='localhost')?route.continue():route.abort()});
              await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787263200000,RealDate=Date;class FixedDate extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}}globalThis.Date=FixedDate});
              const page=await ctx.newPage();page.setDefaultTimeout(60000);page.setDefaultNavigationTimeout(45000);page.on('request',r=>{if(new URL(r.url()).pathname===target)loads++});page.on('pageerror',()=>errors++);
              await page.goto(`http://127.0.0.1:${port}/index.html`,{waitUntil:'networkidle',timeout:45000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForTimeout(1000);
              const rows=await page.evaluate(()=>{const norm=v=>String(v??'').replace(/https?:\/\/(?:127\.0\.0\.1|localhost):\d+/g,'<ORIGIN>'),round=n=>Number.isFinite(n)?+n.toFixed(4):n,sty=(el,p=null)=>{const cs=getComputedStyle(el,p),o={};for(const k of [...cs].sort())o[k]=norm(cs.getPropertyValue(k));return o};return [document.body,...document.body.querySelectorAll('*')].map((el,i)=>{const r=el.getBoundingClientRect(),bc=getComputedStyle(el,'::before').content,ac=getComputedStyle(el,'::after').content;return{i,locator:{tag:el.tagName.toLowerCase(),id:el.id||'',class:typeof el.className==='string'?el.className:''},attrs:[...el.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0])),ownText:[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>norm(n.nodeValue)).join(''),rect:[round(r.x),round(r.y),round(r.width),round(r.height),round(r.right),round(r.bottom)],client:[el.clientWidth,el.clientHeight,el.clientLeft,el.clientTop],scroll:[el.scrollWidth,el.scrollHeight,el.scrollLeft,el.scrollTop],state:{value:'value'in el?norm(el.value):null,checked:'checked'in el?!!el.checked:null,selected:'selected'in el?!!el.selected:null,disabled:'disabled'in el?!!el.disabled:null},style:sty(el),before:bc!=='none'?sty(el,'::before'):null,after:ac!=='none'?sty(el,'::after'):null}})});
              console.log(`SNAP|side=${side}|iter=${iter}|rows=${rows.length}|hash=${H(rows)}|loads=${loads}|errors=${errors}`);if(loads||errors)throw Error('runtime contract');return rows;
            }finally{await ctx.close().catch(()=>{})}}
          function diff(a,b,label){let n=0;for(let i=0;i<Math.max(a.length,b.length);i++){const A=a[i],B=b[i];if(H(A)===H(B))continue;n++;const parts=[];for(const k of ['locator','attrs','ownText','rect','client','scroll','state','style','before','after'])if(H(A?.[k])!==H(B?.[k]))parts.push(k);console.log(`ROW DIFF|${label}|index=${i}|locator=${JSON.stringify(A?.locator||B?.locator)}|parts=${parts.join(',')}`);if(parts.includes('style')){const keys=new Set([...Object.keys(A?.style||{}),...Object.keys(B?.style||{})]);const sd=[...keys].filter(k=>(A?.style||{})[k]!==(B?.style||{})[k]);console.log(`STYLE DIFF|${label}|index=${i}|props=${sd.slice(0,30).join(',')}`)}if(n>=20)break}console.log(`DIFF SUMMARY|${label}|changedRows=${n}|rows=${a.length}/${b.length}`);return n}
          (async()=>{const browser=await chromium.launch({headless:true});try{const P1=await snap(browser,4173,'P',1),C1=await snap(browser,4174,'C',1),P2=await snap(browser,4173,'P',2),C2=await snap(browser,4174,'C',2),P3=await snap(browser,4173,'P',3),C3=await snap(browser,4174,'C',3);const pp12=diff(P1,P2,'P1-P2'),pp13=diff(P1,P3,'P1-P3'),cc12=diff(C1,C2,'C1-C2'),cc13=diff(C1,C3,'C1-C3'),pc11=diff(P1,C1,'P1-C1'),pc22=diff(P2,C2,'P2-C2'),pc33=diff(P3,C3,'P3-C3');const intra=(pp12>0||pp13>0||cc12>0||cc13>0)?1:0,cross=[pc11,pc22,pc33];console.log(`P12 SUMMARY|intraSideVariance=${intra}|P1P2=${pp12}|P1P3=${pp13}|C1C2=${cc12}|C1C3=${cc13}|cross=${cross.join(',')}|targetLoads=0/0|criteriaRelaxed=0`);if(intra){console.log('PROBE RESULT|classification=RUNTIME_BODY_VARIANCE|criteriaRelaxed=0');}else if(cross.every(x=>x===0)){console.log('PROBE RESULT|classification=TRANSIENT_NOT_REPRODUCED|criteriaRelaxed=0');}else{console.log('PROBE RESULT|classification=STABLE_CROSS_SIDE_DIFF|criteriaRelaxed=0');process.exitCode=1}}finally{await browser.close()}})().catch(e=>{console.error('P12 ERROR|'+(e.stack||e));process.exit(1)});
          NODE
          set +e; timeout 1500s node /tmp/p12.js; rc=$?; set -e
          echo "P12_EXIT=$rc"; test "$rc" = 0
      - name: Publish receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          { echo "RUN_ID=${{ github.run_id }}"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; if [ "${{ steps.probe.outcome }}" = success ]; then echo 'PROBE=success'; else echo 'PROBE=failure'; fi; cat /tmp/p12.log 2>/dev/null || true; if [ "${{ steps.probe.outcome }}" = success ]; then echo 'RESULT=PASS'; else echo 'RESULT=FAIL'; fi; } > "$RESULT_FILE"
          git checkout "$DIAG_BRANCH"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 035 body variance p12 [skip ci]'; git push origin "$DIAG_BRANCH"
      - name: Require PASS
        if: always()
        run: test "${{ steps.probe.outcome }}" = success