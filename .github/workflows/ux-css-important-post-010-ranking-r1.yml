name: UX CSS Important 019 iPad Safari Visual R3
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  visual019:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 8dc95bcda2d42cd531314d981fadb6263924e69d
      TARGET_FILE: assets/css/components/shell/ipad-safari-scroll.css
      TARGET_BLOB: ea0aa4d31a5ff383b800f233bcc67794e5f30626
      CANDIDATE_SHA256: 46177ce6f08abc0af038a01c7b1abf1289964f2c127e10fb63923ea2764d3dca
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-019-ipad-safari-visual-r3.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/v.log) 2>&1
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test "$(grep -o '!important' "$TARGET_FILE" | wc -l)" -eq 65
          grep -q '^RESULT=PASS$' .diagnostics/ux-css-important-019-ipad-safari-reach-r2.txt
          grep -Fq 'targetReachable=0|jsRefs=0|runtimeTextRefs=0|importers=0' .diagnostics/ux-css-important-019-ipad-safari-reach-r2.txt
          grep -Fq "sha256=$CANDIDATE_SHA256" .diagnostics/ux-css-important-019-ipad-safari-reach-r2.txt
          echo 'PREFLIGHT PASS|parent=018|reach=pass|targetReachable=0|targetImportant=65'
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID >/dev/null 2>&1 || true' EXIT; sleep 1
          cat >/tmp/render.js <<'NODE'
          const {chromium}=require('@playwright/test'),fs=require('fs'),crypto=require('crypto');
          const phase=process.argv[2],out='/tmp/'+phase;fs.mkdirSync(out,{recursive:true});
          const pages=[['home','index.html'],['orders','pedidos.html'],['messages','mensagens.html'],['results','resultados.html']];
          const viewports=[[560,1000],[561,1000],[768,1024],[820,1180],[1024,1366],[1025,1366]];
          const tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
          (async()=>{const browser=await chromium.launch({headless:true});let totalErrors=0,totalLoads=0,states=[];
          for(const [label,file] of pages)for(const [w,h] of viewports){const c=await browser.newContext({viewport:{width:w,height:h}});await c.addInitScript(()=>{Date.now=()=>1760000000000;Math.random=()=>0.314159;});const p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));
            for(const host of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**','https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(host,r=>r.fulfill({status:200,body:''}));
            for(const host of ['https://images.pexels.com/**','https://images.unsplash.com/**'])await p.route(host,r=>r.fulfill({status:200,contentType:'image/png',body:tiny}));
            await p.goto(`http://127.0.0.1:4173/${file}?i19=${phase}-${w}`,{waitUntil:'domcontentloaded'});await p.waitForTimeout(700);
            const meta=await p.evaluate(()=>{const target='ipad-safari-scroll.css',loads=performance.getEntriesByType('resource').filter(x=>x.name.includes(target)).length;const pack=n=>{if(!n)return null;const r=n.getBoundingClientRect(),s=getComputedStyle(n);return{x:+r.x.toFixed(3),y:+r.y.toFixed(3),w:+r.width.toFixed(3),h:+r.height.toFixed(3),display:s.display,position:s.position,overflowX:s.overflowX,overflowY:s.overflowY,opacity:s.opacity,visibility:s.visibility,transform:s.transform};};return{page:document.body.dataset.page||'',bodyClass:document.body.className,targetLoads:loads,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight,body:pack(document.body),shell:pack(document.querySelector('.app-shell')),pageNode:pack(document.querySelector('.page')),content:pack(document.querySelector('.page__content')),sidebar:pack(document.querySelector('.sidebar,[data-shell-sidebar]')),header:pack(document.querySelector('.app-header,.topbar,.internal-page-topbar'))};});
            const shot=await p.screenshot({fullPage:true});const sh=crypto.createHash('sha256').update(shot).digest('hex');fs.writeFileSync(`${out}/${label}-${w}.png`,shot);fs.writeFileSync(`${out}/${label}-${w}.json`,JSON.stringify(meta));totalErrors+=errs.length;totalLoads+=meta.targetLoads;states.push({label,w,h,meta,sh,errs});await c.close();}
          fs.writeFileSync(`${out}/summary.json`,JSON.stringify({states,totalErrors,totalLoads}));console.log(`PHASE|label=${phase}|states=${states.length}|pageErrors=${totalErrors}|targetStylesheetLoads=${totalLoads}`);if(totalErrors||totalLoads)process.exit(2);await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/render.js parent
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');let s=fs.readFileSync(process.env.TARGET_FILE,'utf8'),before=(s.match(/!important\b/g)||[]).length;s=s.replace(/\s*!important\b/g,'');const b=Buffer.from(s),h=crypto.createHash('sha256').update(b).digest('hex'),after=(s.match(/!important\b/g)||[]).length;if(before!==65||after!==0||h!==process.env.CANDIDATE_SHA256)throw Error(`${before}/${after}/${h}`);fs.writeFileSync(process.env.TARGET_FILE,s);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${b.length}|important=65->0|priorityMarkersRemoved=65|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=1`)
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/render.js candidate
          node <<'NODE'
          const fs=require('fs'),pages=['home','orders','messages','results'],widths=[560,561,768,820,1024,1025];let md=0,sd=0;for(const p of pages)for(const w of widths){const a=fs.readFileSync(`/tmp/parent/${p}-${w}.json`,'utf8'),b=fs.readFileSync(`/tmp/candidate/${p}-${w}.json`,'utf8');if(a!==b)md++;const x=fs.readFileSync(`/tmp/parent/${p}-${w}.png`),y=fs.readFileSync(`/tmp/candidate/${p}-${w}.png`);if(!x.equals(y))sd++;}const ps=JSON.parse(fs.readFileSync('/tmp/parent/summary.json')),cs=JSON.parse(fs.readFileSync('/tmp/candidate/summary.json'));console.log(`CANDIDATE PARITY|sha256=${process.env.CANDIDATE_SHA256}|important=65->0|priorityMarkersRemoved=65|states=24|pages=home,orders,messages,results|viewports=560,561,768,820,1024,1025|portraitTabletCoverage=1|metadataDiffs=${md}|screenshotDiffs=${sd}|pageErrors=${ps.totalErrors+cs.totalErrors}|targetStylesheetLoads=${ps.totalLoads+cs.totalLoads}|syntheticDOM=0|criteriaRelaxed=0`);if(md||sd||ps.totalErrors||cs.totalErrors||ps.totalLoads||cs.totalLoads)process.exit(3);
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; echo 'RESTORE PASS|target=parent-exact'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROOF=${{ steps.proof.outcome }}"; grep -E '^(PREFLIGHT PASS|PHASE|CANDIDATE IDENTITY|CANDIDATE PARITY|RESTORE PASS)\|' /tmp/v.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 460 /tmp/v.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 019 ipad safari visual r3 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
