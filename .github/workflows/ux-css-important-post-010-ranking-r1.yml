name: UX CSS Important 023 App Mobile Search Promotion R10
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote023:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: c469ab875b43f37753e660b2ac7c424f7a6f841e
      TARGET_FILE: assets/css/components/navigation/app-mobile-search.css
      TARGET_BLOB: de0178f27e9ad535acf1b00eae0e59382d14061e
      CANDIDATE_SHA256: 2431b9916decc1845f7d837bdb05b64a8f863e3b113aa32471a22571a8d48f85
      PERM_BRANCH: ux/ux-css-important-023-app-mobile-search-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-023-app-mobile-search-promotion-r10.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-023-app-mobile-search-runtime-reach-r3.txt >/tmp/reach.txt
          git show HEAD:.diagnostics/ux-css-important-023-app-mobile-search-token-inventory-r5.txt >/tmp/tokens.txt
          git show HEAD:.diagnostics/ux-css-important-023-app-mobile-search-visual-r7.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-023-app-mobile-search-governance-r9.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/reach.txt; grep -Fq 'runtimeRefs=0|actualImporters=0|htmlLinks=0|runtimeJsRefs=0' /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/tokens.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/tokens.txt; grep -Fq 'runtimeHtmlJsHits=0' /tmp/tokens.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/browser.txt; grep -Fq 'metadataDiffs=0|screenshotDiffs=0|loadedStateDiffs=0|pageErrors=0|targetStylesheetLoads=0/0' /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -Fq "candidateHash=$CANDIDATE_SHA256" /tmp/gov.txt; grep -Fq 'PRODUCT DIFF PASS|files=1|additions=142|deletions=142' /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,o=fs.readFileSync(f,'utf8'),c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');if((o.match(/!important\b/g)||[]).length!==146||(c.match(/!important\b/g)||[]).length!==0||h!==process.env.CANDIDATE_SHA256)throw Error(h);fs.writeFileSync(f,c);console.log(`CANDIDATE|sha256=${h}|bytes=${Buffer.byteLength(c)}|important=146->0|removed=146|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=1`)
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1; test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'142\t142\t'"$TARGET_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_FILE"; git commit -m 'UX-CSS-IMPORTANT-023 remove dormant app mobile search priorities' >/dev/null
          head="$(git rev-parse HEAD)"; parent="$(git rev-parse HEAD^)"; tree="$(git rev-parse HEAD^{tree})"; blob="$(git rev-parse "HEAD:$TARGET_FILE")"
          test "$parent" = "$PARENT_SHA"; test "$(git rev-list --count "$PARENT_SHA..$head")" -eq 1; test "$(git diff --name-only "$PARENT_SHA" "$head" | wc -l)" -eq 1; test "$(git diff --name-only "$PARENT_SHA" "$head")" = "$TARGET_FILE"; test "$(git diff --numstat "$PARENT_SHA" "$head" -- "$TARGET_FILE")" = $'142\t142\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null; test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$head"
          echo "PROMOTION PASS|head=$head|parent=$parent|tree=$tree|blob=$blob|files=1|numstat=142/142/$TARGET_FILE|leaseParent=$PARENT_SHA|targetImportant=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|PROMOTION PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 500 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 023 app mobile search promotion r10 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
