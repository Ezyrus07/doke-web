name: UX CSS Important 018 Professional Responsive Reach R3
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach018:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c07f4b62e12dd7e01ede6ade20234ea01180730a
      TARGET_FILE: assets/css/components/layout/professional-responsive-layout.css
      TARGET_BLOB: f49f61acdd9ecf7325d8b0418c923b850d42c067
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-018-professional-responsive-reach-r3.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/reach.log) 2>&1
          git checkout --detach "$TARGET_SHA" >/dev/null
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l)" -eq 67
          echo 'PREFLIGHT PASS|parent=017|targetBlob=exact|targetImportant=67|productMutation=0|rankingR2=PASS'
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');const target=process.env.TARGET_FILE;
          const all=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean),set=new Set(all),activeHtml=all.filter(f=>f.endsWith('.html')&&!/^(archive|reports|tools|test-results|node_modules)\//.test(f));
          const norm=(base,href)=>{href=href.split(/[?#]/)[0].trim();if(!href||/^(?:https?:)?\/\//.test(href)||href.startsWith('data:'))return null;return path.posix.normalize(path.posix.join(path.posix.dirname(base),href)).replace(/^\/+/, '')};
          const direct=new Set();for(const h of activeHtml){const s=fs.readFileSync(h,'utf8');let m;const re=/<link\b[^>]*\bhref=["']([^"']+\.css(?:[?#][^"']*)?)["'][^>]*>/gi;while((m=re.exec(s))){const r=norm(h,m[1]);if(r&&set.has(r))direct.add(r)}}
          const reachable=new Set(),stack=[...direct],importers=[];while(stack.length){const f=stack.pop();if(reachable.has(f))continue;reachable.add(f);const s=fs.readFileSync(f,'utf8');let m;const re=/@import\s+(?:url\(\s*)?["']([^"']+\.css(?:[?#][^"']*)?)["']/gi;while((m=re.exec(s))){const r=norm(f,m[1]);if(r===target)importers.push(f);if(r&&set.has(r)&&!reachable.has(r))stack.push(r)}}
          const jsRefs=[];for(const f of all.filter(x=>x.startsWith('assets/js/')&&/\.(?:js|mjs|cjs)$/.test(x))){const s=fs.readFileSync(f,'utf8');if(s.includes('professional-responsive-layout')||s.includes(target))jsRefs.push(f)}
          const textRefs=[];for(const f of all.filter(x=>(x.endsWith('.html')||x.startsWith('assets/css/')||x.startsWith('assets/js/'))&&x!==target)){let s=fs.readFileSync(f,'utf8');if(f.endsWith('.css'))s=s.replace(/\/\*[\s\S]*?\*\//g,'');if(s.includes('professional-responsive-layout')||s.includes(target))textRefs.push(f)}
          console.log(`REACH GRAPH|activeHtml=${activeHtml.length}|directCss=${direct.size}|reachableCss=${reachable.size}|targetReachable=${reachable.has(target)?1:0}|jsRefs=${jsRefs.length}|runtimeTextRefs=${textRefs.length}|importers=${importers.length}`);if(importers.length)console.log('IMPORTERS|files='+[...new Set(importers)].join(','));if(jsRefs.length)console.log('JS REFS|files='+jsRefs.join(','));if(textRefs.length)console.log('TEXT REFS|files='+textRefs.join(','));
          if(reachable.has(target)||jsRefs.length||textRefs.length||importers.length)throw Error('target reachable');
          let css=fs.readFileSync(target,'utf8'),before=(css.match(/!important\b/g)||[]).length,db=(css.match(/:[^;{}]+;/g)||[]).length,sb=(css.match(/[^{}]+\{/g)||[]).length;css=css.replace(/\s*!important\b/g,'');const after=(css.match(/!important\b/g)||[]).length,da=(css.match(/:[^;{}]+;/g)||[]).length,sa=(css.match(/[^{}]+\{/g)||[]).length,b=Buffer.from(css),h=crypto.createHash('sha256').update(b).digest('hex');if(before!==67||after!==0||db!==da||sb!==sa)throw Error(`identity ${before}/${after}/${db}/${da}/${sb}/${sa}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${b.length}|important=67->0|priorityMarkersRemoved=67|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0`);console.log('DECISION PASS|wholeFileDormant=1|candidateEligible=1');
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; grep -E '^(PREFLIGHT PASS|REACH GRAPH|IMPORTERS|JS REFS|TEXT REFS|CANDIDATE IDENTITY|DECISION PASS)\|' /tmp/reach.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 320 /tmp/reach.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 018 professional responsive reach r3 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
