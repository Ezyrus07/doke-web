name: UX CSS Important 021 Home Mobile Hero Dormant Family Candidate R6
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  candidate021:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 6aa5b028eb6ec7398ae35315bfffc79396955abd
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: fea7bdfea3f78f77a38385c155e442ca47911bfe
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-021-home-mobile-hero-candidate-r6.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/c.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          git show HEAD:.diagnostics/ux-css-important-021-home-remaining-inventory-r5.txt >/tmp/r5.txt 2>/dev/null || git show origin/$DIAG_BRANCH:.diagnostics/ux-css-important-021-home-remaining-inventory-r5.txt >/tmp/r5.txt
          grep -q '^RESULT=PASS$' /tmp/r5.txt; grep -Fq 'INVENTORY SUMMARY|important=128|rules=53|staticDormantRules=1|staticDormantImportant=1|targetReachable=1' /tmp/r5.txt
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');const target=process.env.TARGET_FILE,token='home-mobile-hero';
          const walk=d=>fs.existsSync(d)?fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const q=path.join(d,e.name);return e.isDirectory()?walk(q):[q]}):[];
          const files=[...fs.readdirSync('.').filter(f=>f.endsWith('.html')),...walk('assets/js').filter(f=>f.endsWith('.js'))];const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),re=new RegExp(`(^|[^A-Za-z0-9_-])${esc(token)}([^A-Za-z0-9_-]|$)`);const refs=files.filter(f=>re.test(fs.readFileSync(f,'utf8').replace(/\/\*[\s\S]*?\*\//g,'')));if(refs.length)throw Error('runtime refs '+refs.join(','));
          let s=fs.readFileSync(target,'utf8');const before=(s.match(/!important\b/g)||[]).length;const rule=/html\.home-index-root body\.home-index-shell \.home-mobile-hero\s*\{\s*display:\s*block\s*!important;\s*padding:\s*0;\s*\}/m;const m=s.match(rule);if(!m)throw Error('exact rule not found');const hits=[...s.matchAll(/\.home-mobile-hero\s*\{\s*display:\s*block\s*!important;/g)].length;if(hits!==1)throw Error('target hits '+hits);const repl=m[0].replace('display: block !important;','display: block;');s=s.replace(rule,repl);const after=(s.match(/!important\b/g)||[]).length,b=Buffer.from(s),h=crypto.createHash('sha256').update(b).digest('hex');if(before!==128||after!==127)throw Error(`${before}->${after}`);fs.writeFileSync('/tmp/candidate.css',s);console.log(`FAMILY PASS|token=${token}|runtimeRefs=0|ruleHits=1|wholeFileReachable=1|familyDormantStatic=1`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${b.length}|important=128->127|priorityMarkersRemoved=1|familyImportant=1->0|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=0|familyDormant=1`)
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.candidate.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "CANDIDATE=${{ steps.candidate.outcome }}"; grep -E '^(FAMILY PASS|CANDIDATE IDENTITY)\|' /tmp/c.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 400 /tmp/c.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 021 home mobile hero candidate r6 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
