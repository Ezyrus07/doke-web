name: UX CSS Important 025 Responsive Priority Cards Reach R2
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach025:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: dc8b84496f57305632f348366c3557d4884a1b15
      TARGET_FILE: assets/css/components/layout/responsive-priority-cards.css
      TARGET_BLOB: d307b7cd8f187b76d424f1016a2607ff8efd423a
      CANDIDATE_SHA256: 5579299d094db809007e73ffc050013a9382350db82ffa7706fec11050cb7d41
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-025-responsive-priority-cards-reach-r2.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const target=process.env.TARGET_FILE, base=path.basename(target), css=fs.readFileSync(target,'utf8');
          const imp=(css.match(/!important\b/g)||[]).length; if(imp!==170) throw Error(`important=${imp}`);
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\//g,'');
          let importers=[],htmlLinks=[],jsRefs=[],cssTextRefs=[];
          function walk(d){if(!fs.existsSync(d))return[];let out=[];for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())out=out.concat(walk(p));else out.push(p.replaceAll('\\','/'));}return out}
          const html=walk('.').filter(f=>/^[^/]+\.html$/.test(f.replace(/^\.\//,'')));
          for(const f of html){const s=fs.readFileSync(f,'utf8');if(s.includes(base)||s.includes(target))htmlLinks.push(f);}
          for(const f of walk('assets/js').filter(f=>f.endsWith('.js'))){const s=fs.readFileSync(f,'utf8');if(s.includes(base)||s.includes(target))jsRefs.push(f);}
          for(const f of walk('assets/css').filter(f=>f.endsWith('.css')&&f!==target)){const s=strip(fs.readFileSync(f,'utf8'));if(s.includes(base)||s.includes(target))cssTextRefs.push(f);const ims=[...s.matchAll(/@import\s+(?:url\()?\s*["']?([^"')\s;]+)["']?/g)].map(m=>m[1]);if(ims.some(x=>x.includes(base)||x.includes(target)))importers.push(f)}
          importers=[...new Set(importers)];htmlLinks=[...new Set(htmlLinks)];jsRefs=[...new Set(jsRefs)];cssTextRefs=[...new Set(cssTextRefs)];
          console.log(`REACH SUMMARY|important=${imp}|htmlLinks=${htmlLinks.length}|actualImporters=${importers.length}|runtimeJsRefs=${jsRefs.length}|cssTextRefs=${cssTextRefs.length}`);
          for(const f of htmlLinks)console.log(`HTML LINK|file=${f}`);for(const f of importers)console.log(`IMPORTER|file=${f}`);for(const f of jsRefs)console.log(`JS REF|file=${f}`);for(const f of cssTextRefs)console.log(`CSS REF|file=${f}`);
          const active=htmlLinks.length+importers.length+jsRefs.length>0; console.log(`TARGET STATE|active=${active?1:0}|wholeFileDormant=${active?0:1}`);
          if(active) throw Error('target-runtime-reachable');
          const c=css.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          const cImp=(c.match(/!important\b/g)||[]).length;
          console.log(`WHOLE FILE CANDIDATE|eligible=1|sha256=${h}|bytes=${Buffer.byteLength(c)}|important=${imp}->${cImp}|removed=${imp-cImp}`);
          if(cImp!==0||h!==process.env.CANDIDATE_SHA256) throw Error(`candidate mismatch ${h}`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; grep -E '^(REACH SUMMARY|HTML LINK|IMPORTER|JS REF|CSS REF|TARGET STATE|WHOLE FILE CANDIDATE)\|' /tmp/r.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 400 /tmp/r.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 025 responsive priority cards reach r2 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
