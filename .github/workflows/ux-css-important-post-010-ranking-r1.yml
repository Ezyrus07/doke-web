name: UX CSS Important 012 Recommendation Promotion R5
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote012:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 57561ae5735f2a9a71c589cf6caea57c0db04488
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: 880134c8303d87133a1b066e27ed9849abaa61ba
      CANDIDATE_SHA256: a319f97dc53e3fc53d7ca569deaef239f074c2ca78a4e8dd908a3d99f208b791
      PERM_BRANCH: ux/ux-css-important-012-home-recommendation-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-012-home-recommendation-promotion-r5.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$(git rev-parse "$TARGET_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git show HEAD:.diagnostics/ux-css-important-012-home-recommendation-r3.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-012-home-recommendation-governance-r4.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -q "sha256=$CANDIDATE_SHA256" /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -q "candidateHash=$CANDIDATE_SHA256" /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          LEASE=$(git rev-parse "refs/remotes/origin/$PERM_BRANCH")
          test "$LEASE" = "$TARGET_SHA"
          git checkout -B promote012 "$TARGET_SHA" >/dev/null
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8'),removed=0,rules=0;
          if((s.match(/!important\b/g)||[]).length!==162)throw Error('parent');
          const S=new Set(['html.home-index-root body.home-index-shell .recommendation-card','html.home-index-root body.home-index-shell .recommendation-card__media','html.home-index-root body.home-index-shell .recommendation-card__aside','html.home-index-root body.home-index-shell .recommendation-card__cta']);
          s=s.replace(/([^{}]+)\{([^{}]*)\}/g,(a,h,b)=>{if(!S.has(h.trim()))return a;const c=(b.match(/!important\b/g)||[]).length;if(!c)return a;removed+=c;rules++;return h+'{'+b.replace(/\s*!important\b/g,'')+'}'});
          const z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex'),count=(s.match(/!important\b/g)||[]).length;
          if(removed!==9||rules!==6||count!==153||h!==process.env.CANDIDATE_SHA256)throw Error(`candidate ${removed}/${rules}/${count}/${h}`);
          fs.writeFileSync(f,s);console.log(`CANDIDATE|sha256=${h}|bytes=${z.length}|important=162->153|removed=9|rules=6|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0`);
          NODE
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'9\t9\t'"$TARGET_FILE"
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-012: remove dormant Home recommendation priorities' >/dev/null
          HEAD_SHA=$(git rev-parse HEAD); PARENT=$(git rev-parse HEAD^); TREE=$(git rev-parse HEAD^{tree}); BLOB=$(git rev-parse "HEAD:$TARGET_FILE")
          test "$PARENT" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA" HEAD | wc -l)" -eq 1
          test "$(git diff --name-only "$TARGET_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$TARGET_SHA" HEAD -- "$TARGET_FILE")" = $'9\t9\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$TARGET_SHA" origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$HEAD_SHA"
          echo "PROMOTION PASS|head=$HEAD_SHA|parent=$PARENT|tree=$TREE|blob=$BLOB|files=1|additions=9|deletions=9|leaseParent=$LEASE"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|PROMOTION PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 220 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"; git commit -m 'diag: publish 012 recommendation promotion r5 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
