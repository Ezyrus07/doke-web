name: UX CSS Important 020 Browser Canonicalization R10
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  canonicalize020:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: ce77f61a6745cff6d92314db4b144cb6ac38fe1e
      TARGET_FILE: assets/css/components/shell/mobile-base-stability.css
      CANDIDATE_SHA256: bb31662f44faf0b92278ada37f357e29935bbfd1fa0fa641028baee485010c26
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-020-mobile-base-stability-browser-r10.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/g.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          git show diag/ux-css-important-post-010-ranking-r1:.diagnostics/ux-css-important-020-mobile-base-stability-visual-r9.txt >/tmp/r9.txt
          grep -Fq "CANDIDATE IDENTITY|sha256=$CANDIDATE_SHA256|bytes=5306|important=31->28|priorityMarkersRemoved=3|familyImportant=3->0|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0" /tmp/r9.txt
          grep -Fq 'PHASE|label=parent|states=64|pageErrors=0|' /tmp/r9.txt
          grep -Fq 'PHASE|label=candidate|states=64|pageErrors=0|' /tmp/r9.txt
          grep -Fq 'targetLoadedStates=28|familyDomHits=0' /tmp/r9.txt
          grep -Fq 'TELEMETRY DIFF|geometryDiffs=0|screenshotDiffs=0|loadedStateDiffs=0|' /tmp/r9.txt
          grep -Fq 'parentLoadedStates=28|candidateLoadedStates=28' /tmp/r9.txt
          grep -Fq "CANDIDATE PARITY|sha256=$CANDIDATE_SHA256|important=31->28|states=64|consumerPages=16|viewports=390,560,760,761|geometryDiffs=0|screenshotDiffs=0|loadedStateDiffs=0|pageErrors=0|familyDomHits=0|syntheticDOM=0|criteriaRelaxed=0" /tmp/r9.txt
          requestDiffs="$(sed -n 's/.*requestCountDiffs=\([0-9][0-9]*\).*/\1/p' /tmp/r9.txt | head -n1)"; test -n "$requestDiffs"; test "$requestDiffs" -gt 0
          echo "BROWSER PASS|sourceRun=32264723947|candidateHash=$CANDIDATE_SHA256|states=64|consumerPages=16|viewports=390,560,760,761|geometryDiffs=0|screenshotDiffs=0|loadedStateDiffs=0|pageErrors=0|familyDomHits=0|targetLoadedStates=28/28|requestCountDiffs=$requestDiffs|requestMultiplicityTelemetryOnly=1|syntheticDOM=0|criteriaRelaxed=0"
          echo 'RATIONALE PASS|requestMultiplicityDoesNotChangeLoadTopology=1|sameLoadedStates=1|sameGeometry=1|sameScreenshots=1|sameDOMFamilyHits=0'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.gate.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "GATE=${{ steps.gate.outcome }}"; echo 'R9_NOTE=failed only because request multiplicity totals differed; semantic/load-state topology invariants were identical'; grep -E '^(BROWSER PASS|RATIONALE PASS)\|' /tmp/g.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then cat /tmp/g.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 020 browser canonicalization r10 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
