name: UX CSS Important Post 015 Fresh Ranking R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  rank016:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5928c25950aa859a79ea6c96144bbc9ddb261777
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-post-015-fresh-ranking-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: rank
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/rank.log) 2>&1
          git cat-file -e "$TARGET_SHA^{commit}"
          git checkout --detach "$TARGET_SHA" >/dev/null
          npm ci --ignore-scripts
          npm run audit:important-reduction-plan
          npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8'));
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const s=b.summary, ps=p.summary;
          if(s.totalImportant!==10870||s.outsideServiceCardImportant!==10808||s.filesWithImportant!==32) throw Error(`baseline ${JSON.stringify(s)}`);
          if(ps.affectedFiles!==31||ps.totalImportantOutsideServiceCard!==10808||ps.byRisk?.['high-baseline-required']!==10800||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2) throw Error(`plan ${JSON.stringify(ps)}`);
          console.log(`PLAN SUMMARY|affectedFiles=${ps.affectedFiles}|outside=${ps.totalImportantOutsideServiceCard}|high=${ps.byRisk['high-baseline-required']}|medium=${ps.byRisk['medium-baseline-required']}|low=${ps.byRisk['low-review-candidate']}`);
          console.log(`BASELINE SUMMARY|total=${s.totalImportant}|outside=${s.outsideServiceCardImportant}|files=${s.filesWithImportant}`);
          const files=cp.execFileSync('git',['ls-tree','-r','--name-only',process.env.TARGET_SHA],{encoding:'utf8'}).trim().split(/\n/).filter(f=>f.startsWith('assets/css/')&&f.endsWith('.css'));
          const inv=[]; let total=0;
          for(const f of files){const t=cp.execFileSync('git',['show',`${process.env.TARGET_SHA}:${f}`],{encoding:'utf8',maxBuffer:20*1024*1024});const n=(t.match(/!important\b/g)||[]).length;if(n){inv.push({file:f,important:n});total+=n;}}
          inv.sort((a,b)=>a.important-b.important||a.file.localeCompare(b.file));
          if(total!==10870||inv.length!==32) throw Error(`inventory ${total}/${inv.length}`);
          console.log(`COUNT INVENTORY|files=${inv.length}|total=${total}`);
          for(const r of inv) console.log(`COUNT FILE|important=${r.important}|file=${r.file}`);
          const top=Array.isArray(p.topFiles)?p.topFiles:[];
          const rows=top.map(r=>({file:r.file||r.path||r.filename,risk:r.risk||r.classification||'',important:0})).filter(r=>r.file);
          const byFile=new Map(inv.map(r=>[r.file,r.important]));
          for(const r of rows){r.important=byFile.get(r.file)||0;console.log(`PLAN FILE|important=${r.important}|risk=${r.risk}|file=${r.file}`);}
          const high=rows.filter(r=>r.risk==='high-baseline-required'&&r.important>0).sort((a,b)=>a.important-b.important||a.file.localeCompare(b.file));
          if(!high.length) throw Error('no high rows');
          console.log(`NEXT HIGH|important=${high[0].important}|file=${high[0].file}`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.rank.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "RANK=${{ steps.rank.outcome }}"; grep -E '^(PLAN SUMMARY|BASELINE SUMMARY|COUNT INVENTORY|COUNT FILE|PLAN FILE|NEXT HIGH)\|' /tmp/rank.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 320 /tmp/rank.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"; git commit -m 'diag: publish post-015 fresh ranking r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
