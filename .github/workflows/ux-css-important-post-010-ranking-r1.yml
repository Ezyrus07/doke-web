name: UX CSS Important 024 Tablet Shell Rail Promotion R7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote024:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d9a831502ace23490f500c0b50f889409353dfb1
      TARGET_FILE: assets/css/pages/home/tablet-shell-rail.css
      TARGET_BLOB: 0154f918cd7946a045126b6b6978f43ab39724b6
      CANDIDATE_SHA256: 593fecb1bfd372d29088ba2726cba3f80ea949b94922fe09ea9003f6d019abf6
      PERM_BRANCH: ux/ux-css-important-024-tablet-shell-rail-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-024-tablet-shell-rail-promotion-r7.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-024-tablet-shell-rail-reach-r3.txt >/tmp/reach.txt
          git show HEAD:.diagnostics/ux-css-important-024-tablet-shell-rail-visual-r5.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-024-tablet-shell-rail-governance-r6.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -Fq "candidateHash=exact" /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout -B "$PERM_BRANCH" "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),o=fs.readFileSync(process.env.TARGET_FILE,'utf8'),c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');if((o.match(/!important\b/g)||[]).length!==154||(c.match(/!important\b/g)||[]).length!==0||h!==process.env.CANDIDATE_SHA256)throw Error(h);fs.writeFileSync(process.env.TARGET_FILE,c);console.log(`CANDIDATE|sha256=${h}|bytes=${Buffer.byteLength(c)}|important=154->0|removed=154|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=1`)
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1; test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'154\t154\t'"$TARGET_FILE"
          git config user.name Ezyrus07; git config user.email 239011076+Ezyrus07@users.noreply.github.com
          git add "$TARGET_FILE"; git commit -m 'UX-CSS-IMPORTANT-024 remove dormant tablet shell rail priorities' >/dev/null
          head="$(git rev-parse HEAD)"; parent="$(git rev-parse HEAD^)"; tree="$(git rev-parse HEAD^{tree})"; blob="$(git rev-parse "HEAD:$TARGET_FILE")"; test "$parent" = "$PARENT_SHA"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          test "$(git ls-remote origin "refs/heads/$PERM_BRANCH" | cut -f1)" = "$head"
          echo "PROMOTION PASS|head=$head|parent=$parent|tree=$tree|blob=$blob|files=1|numstat=154/154/$TARGET_FILE|leaseParent=$PARENT_SHA|targetImportant=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|PROMOTION PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 600 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 024 tablet shell rail promotion r7 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
