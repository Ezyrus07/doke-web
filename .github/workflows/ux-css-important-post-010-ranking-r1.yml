name: UX CSS Important 033 Home Chrome Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote033:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d1b9c19468829248ec7f29d8b4a3d4f304bfdb40
      TARGET_FILE: assets/css/pages/home/chrome.css
      TARGET_BLOB: 638d39a58cd1439da635439fad38edef2d2d5634
      CANDIDATE_SHA256: 4fb29552890a203769436f5d214ea448dfdc361ecaedc03ff9ba58261fa9ea69
      CANDIDATE_BLOB: ac64b33f163caf7f97d4fdd43680f34f9a094155
      REACH_FILE: .diagnostics/ux-css-important-033-home-chrome-reach-r1.txt
      REACH_BLOB: d156e9f65338e8eca45efa5c9c973ae682a4e5a8
      BROWSER_FILE: .diagnostics/ux-css-important-033-home-chrome-browser-r2.txt
      BROWSER_BLOB: 12d5b34687f75950c7956a277cbb1a82fa9cfee4
      GOV_FILE: .diagnostics/ux-css-important-033-home-chrome-governance-r3.txt
      GOV_BLOB: c26f2f81d606ab88cadd0c9ba47f8b628d4de6bc
      PERM_BRANCH: ux/ux-css-important-033-home-chrome-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-033-home-chrome-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt; git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt; git show HEAD:"$GOV_FILE" >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -q '^RESULT=PASS$' /tmp/gov.txt
          grep -Fq "CANDIDATE PASS|bytes=39138|important=317->0|removed=317|sha256=$CANDIDATE_SHA256|blob=$CANDIDATE_BLOB|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0" /tmp/reach.txt
          grep -Fq 'BROWSER PASS|' /tmp/browser.txt; grep -Fq 'GOVERNANCE PASS|' /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout -B product "refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const o=fs.readFileSync(process.env.TARGET_FILE,'utf8'),c=o.replace(/\s*!important\b/g,'');
          const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex'); fs.writeFileSync('/tmp/candidate.css',c);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(before!==317||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB) throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          fs.writeFileSync(process.env.TARGET_FILE,c);
          console.log(`CANDIDATE MATERIALIZATION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(c)}|important=317->0|markerOnly=1|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1; test "$(git diff --name-only)" = "$TARGET_FILE"
          num="$(git diff --numstat -- "$TARGET_FILE")"; add="$(printf '%s' "$num"|cut -f1)"; del="$(printf '%s' "$num"|cut -f2)"; test "$add" = 317; test "$del" = 317
          git config user.name Ezyrus07; git config user.email 239011076+Ezyrus07@users.noreply.github.com
          git add -- "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1; test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-033: remove dormant home chrome priorities' >/dev/null
          head="$(git rev-parse HEAD)"; tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$CANDIDATE_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" HEAD | wc -l)" -eq 1; test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          echo "PRODUCT COMMIT PASS|head=$head|tree=$tree|parent=$PARENT_SHA|blob=$CANDIDATE_BLOB|files=1|additions=$add|deletions=$del|markerDelta=317|markerOnly=1"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          test "$(git ls-remote origin "refs/heads/$PERM_BRANCH" | cut -f1)" = "$head"
          echo "PRODUCT PUSH PASS|branch=$PERM_BRANCH|head=$head|force=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { grep -E '^(CANDIDATE MATERIALIZATION PASS|PRODUCT COMMIT PASS|PRODUCT PUSH PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 800 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"; git commit -m 'diag: publish 033 home chrome promotion [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
