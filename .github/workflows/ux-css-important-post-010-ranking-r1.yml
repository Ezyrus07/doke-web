            await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787263200000,RealDate=Date;class FixedDate extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}}globalThis.Date=FixedDate});
            const page=await ctx.newPage();page.setDefaultTimeout(90000);page.setDefaultNavigationTimeout(45000);let loads=0,errors=0;page.on('request',r=>{if(new URL(r.url()).pathname===targetPath)loads++});page.on('pageerror',e=>{errors++;console.log(`PAGE ERROR|side=${side}|state=${key}|message=${String(e.message||e).slice(0,160)}`)});
            await page.goto(`http://127.0.0.1:${port}/${p}`,{waitUntil:'networkidle',timeout:45000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForFunction(()=>[...document.images].every(i=>i.complete),null,{timeout:15000}).catch(()=>{});await page.evaluate(async()=>{await Promise.allSettled([...document.images].map(i=>typeof i.decode==='function'?i.decode():Promise.resolve()))});await page.waitForTimeout(600);
            const sm=await stableMeta(page),meta=sm.meta;let accepted=0,pageRoot=0,authRedirect=0,rootKind='invalid';if(protectedPages.has(p)){if(meta.path==='/auth/login.html'&&!meta.content){accepted=1;authRedirect=1;rootKind='auth-redirect'}}else if(meta.path===`/${p}`&&!!meta.content){accepted=1;pageRoot=1;rootKind='page-root'}
            const overflow=Math.max(meta.docScrollWidth,meta.bodyScrollWidth)>v.w+1?1:0;if(overflow)console.log(`OVERFLOW|side=${side}|state=${key}|doc=${meta.docScrollWidth}|body=${meta.bodyScrollWidth}|vw=${v.w}`);
            const canon=await canonical(page);const post=await page.evaluate(metaFn),postStable=JSON.stringify(meta)===JSON.stringify(post)?1:0;const stable=sm.stable&&postStable?1:0;
