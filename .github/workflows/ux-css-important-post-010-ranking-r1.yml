name: UX CSS Important 028 Responsive Page Contract Reach R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach028:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 0f63db75ceab50e2b1487e1dc212272da68dfada
      TARGET_FILE: assets/css/components/layout/responsive-page-contract.css
      TARGET_BLOB: 58381e6cbd8b589bed873c7694f41b275fd04790
      EXPECTED_IMPORTANT: '230'
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-028-responsive-page-contract-reach-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/source.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const src=fs.readFileSync('/tmp/source.css','utf8');
          const before=(src.match(/!important\b/g)||[]).length;
          const out=src.replace(/\s*!important\b/g,'');
          const after=(out.match(/!important\b/g)||[]).length;
          const removed=before-after;
          if(before!==+process.env.EXPECTED_IMPORTANT||after!==0||removed!==+process.env.EXPECTED_IMPORTANT) throw Error(`important ${before}->${after}`);
          fs.writeFileSync('/tmp/candidate.css',out);
          const sha256=crypto.createHash('sha256').update(Buffer.from(out)).digest('hex');
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          console.log(`CANDIDATE PASS|bytes=${Buffer.byteLength(out)}|important=${before}->${after}|removed=${removed}|sha256=${sha256}|blob=${blob}|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          git checkout --detach "$PARENT_SHA" >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.cwd(), target=process.env.TARGET_FILE.replace(/\\/g,'/');
          const excluded=new Set(['archive','reports','tools','test-results','.git','node_modules']);
          const norm=p=>p.replace(/\\/g,'/').replace(/^\.\//,'');
          function walk(dir='.') {
            const out=[];
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(ent.isDirectory()&&excluded.has(ent.name)) continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) out.push(...walk(p)); else out.push(norm(p));
            }
            return out;
          }
          const files=walk();
          const htmlFiles=files.filter(f=>f.endsWith('.html'));
          const cssFiles=files.filter(f=>f.startsWith('assets/css/')&&f.endsWith('.css'));
          const jsFiles=files.filter(f=>/\.(?:js|mjs|cjs)$/.test(f));
          const strip=s=>s.split('#')[0].split('?')[0];
          const resolve=(from,raw)=>norm(path.posix.normalize(path.posix.join(path.posix.dirname(from),strip(raw))));
          const directLinks=new Map();
          let htmlLinks=0;
          for(const h of htmlFiles){
            const text=fs.readFileSync(h,'utf8'), links=[];
            for(const m of text.matchAll(/<link\b[^>]*>/gi)){
              const tag=m[0], rel=tag.match(/\brel\s*=\s*["']([^"']+)["']/i)?.[1]||'';
              if(!/\bstylesheet\b/i.test(rel)) continue;
              const href=tag.match(/\bhref\s*=\s*["']([^"']+)["']/i)?.[1];
              if(!href||/^(?:https?:|data:|\/\/)/i.test(href)) continue;
              const r=resolve(h,href); links.push(r); if(r===target) htmlLinks++;
            }
            directLinks.set(h,links);
          }
          const imports=new Map(); let actualImporters=0, cssTextRefs=0;
          for(const c of cssFiles){
            const text=fs.readFileSync(c,'utf8'), arr=[];
            for(const m of text.matchAll(/@import\s+(?:url\(\s*)?(?:["']([^"']+)["']|([^\s;)]+))\s*\)?/gi)){
              const raw=m[1]||m[2]; if(!raw||/^(?:https?:|data:|\/\/)/i.test(raw)) continue;
              const r=resolve(c,raw); arr.push(r); if(r===target) actualImporters++;
            }
            imports.set(c,arr); if(c!==target&&text.includes(target)) cssTextRefs++;
          }
          const reachable=new Set(), q=[];
          for(const links of directLinks.values()) for(const c of links){if(!reachable.has(c)){reachable.add(c);q.push(c)}}
          for(let i=0;i<q.length;i++) for(const x of (imports.get(q[i])||[])){if(!reachable.has(x)){reachable.add(x);q.push(x)}}
          const runtimeRefs=[], toolingRefs=[], otherRefs=[];
          for(const f of jsFiles){
            const text=fs.readFileSync(f,'utf8'); if(!text.includes(target)) continue;
            if(f.startsWith('assets/js/')) runtimeRefs.push(f);
            else if(f.startsWith('scripts/')||f.startsWith('tests/')||f.startsWith('test/')||f.startsWith('tools/')) toolingRefs.push(f);
            else otherRefs.push(f);
          }
          const active=reachable.has(target)?1:0;
          const dormant=htmlLinks===0&&actualImporters===0&&runtimeRefs.length===0&&otherRefs.length===0&&active===0?1:0;
          console.log(`CLASSIFICATION PASS|activeHtml=${htmlFiles.length}|physicalCss=${cssFiles.length}|htmlLinks=${htmlLinks}|actualImporters=${actualImporters}|runtimeJsRefs=${runtimeRefs.length}|toolingJsRefs=${toolingRefs.length}|otherJsRefs=${otherRefs.length}|cssTextRefs=${cssTextRefs}|active=${active}|wholeFileDormant=${dormant}|toolingRefs=${toolingRefs.sort().join(',')||'none'}`);
          console.log(`REACH PASS|htmlLinks=${htmlLinks}|actualImporters=${actualImporters}|runtimeJsRefs=${runtimeRefs.length}|otherJsRefs=${otherRefs.length}|active=${active}|wholeFileDormant=${dormant}`);
          if(!dormant||cssTextRefs!==0) throw Error('target is not whole-file dormant under current graph');
          NODE
          node scripts/audit-css-dormant-debt-policy.js --strict >/tmp/policy.log
          grep -Fq '| `assets/css/components/layout/responsive-page-contract.css` | responsive-shell | 230 | high | sim |' /tmp/policy.log
          grep -Fq 'assets/css/components/layout/responsive-page-contract.css' docs/DEPRECATED-CSS.md
          echo 'GOVERNANCE PASS|policyRecomputed=1|quarantine=1|deprecatedDoc=1|risk=high|group=responsive-shell'
          echo "PARENT PASS|sha=$PARENT_SHA|target=$TARGET_FILE|blob=$TARGET_BLOB|important=$EXPECTED_IMPORTANT"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; grep -E '^(CANDIDATE PASS|CLASSIFICATION PASS|REACH PASS|GOVERNANCE PASS|PARENT PASS)\|' /tmp/r.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 900 /tmp/r.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 028 responsive page contract reach r1 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
