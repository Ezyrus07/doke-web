name: UX CSS Important 017 Shell Normalize Reach R3
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach017r3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5eb97ae50f021639f4b850dabfc5359b883c4879
      TARGET_FILE: assets/css/pages/shell-normalize.css
      TARGET_BLOB: e534ac19a51556476be907b05cc6674702e5e752
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-017-shell-normalize-reach-r3.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5eb97ae50f021639f4b850dabfc5359b883c4879
          fetch-depth: 0
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/reach.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l)" -eq 80
          echo 'PREFLIGHT PASS|parent=016|targetBlob=exact|targetImportant=80|productMutation=0|r2FalseNegative=cssCommentOnly'
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const target=process.env.TARGET_FILE, excluded=/^(archive|reports|tools|test-results|node_modules)\//;
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.posix.join(d,e.name);return e.isDirectory()?walk(p):[p]})}
          const all=walk('.').map(x=>x.replace(/^\.\//,'')),set=new Set(all);
          const activeHtml=all.filter(f=>f.endsWith('.html')&&!excluded.test(f));
          function norm(base,href){href=href.split(/[?#]/)[0].trim();if(!href||/^(?:https?:)?\/\//.test(href)||href.startsWith('data:'))return null;return path.posix.normalize(path.posix.join(path.posix.dirname(base),href)).replace(/^\/+/, '');}
          const direct=new Set();
          for(const h of activeHtml){const s=fs.readFileSync(h,'utf8');let m;const re=/<link\b[^>]*\bhref=["']([^"']+\.css(?:[?#][^"']*)?)["'][^>]*>/gi;while((m=re.exec(s))){const r=norm(h,m[1]);if(r&&set.has(r))direct.add(r);}}
          const reachable=new Set(),stack=[...direct],importers=[];
          while(stack.length){const f=stack.pop();if(reachable.has(f))continue;reachable.add(f);const s=fs.readFileSync(f,'utf8');let m;const re=/@import\s+(?:url\(\s*)?["']([^"']+\.css(?:[?#][^"']*)?)["']/gi;while((m=re.exec(s))){const r=norm(f,m[1]);if(r===target)importers.push(f);if(r&&set.has(r)&&!reachable.has(r))stack.push(r);}}
          const stripCss=s=>s.replace(/\/\*[\s\S]*?\*\//g,'');
          const jsRefs=all.filter(f=>f.startsWith('assets/js/')&&/\.(js|mjs|cjs)$/.test(f)&&fs.readFileSync(f,'utf8').includes('shell-normalize.css'));
          const runtimeTextRefs=[];
          for(const f of all.filter(f=>(f.endsWith('.html')||f.startsWith('assets/css/')||f.startsWith('assets/js/'))&&f!==target)){
            let s=fs.readFileSync(f,'utf8'); if(f.endsWith('.css'))s=stripCss(s); if(s.includes('shell-normalize.css'))runtimeTextRefs.push(f);
          }
          console.log(`REACH GRAPH|activeHtml=${activeHtml.length}|directCss=${direct.size}|reachableCss=${reachable.size}|targetReachable=${reachable.has(target)?1:0}|jsRefs=${jsRefs.length}|runtimeTextRefs=${runtimeTextRefs.length}|importers=${importers.length}`);
          if(importers.length)console.log('IMPORTERS|files='+[...new Set(importers)].join(',')); if(jsRefs.length)console.log('JS REFS|files='+jsRefs.join(',')); if(runtimeTextRefs.length)console.log('TEXT REFS|files='+runtimeTextRefs.join(','));
          if(reachable.has(target)||jsRefs.length||runtimeTextRefs.length||importers.length)throw Error('target reachable');
          let css=fs.readFileSync(target,'utf8');const before=(css.match(/!important\b/g)||[]).length,db=(css.match(/:[^;{}]+;/g)||[]).length,sb=(css.match(/[^{}]+\{/g)||[]).length;css=css.replace(/\s*!important\b/g,'');const after=(css.match(/!important\b/g)||[]).length,da=(css.match(/:[^;{}]+;/g)||[]).length,sa=(css.match(/[^{}]+\{/g)||[]).length,b=Buffer.from(css),h=crypto.createHash('sha256').update(b).digest('hex');if(before!==80||after!==0||db!==da||sb!==sa)throw Error(`identity ${before}/${after}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${b.length}|important=80->0|priorityMarkersRemoved=80|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0`);console.log('DECISION PASS|wholeFileDormant=1|candidateEligible=1|cssCommentRefsIgnored=1');
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; grep -E '^(PREFLIGHT PASS|REACH GRAPH|IMPORTERS|JS REFS|TEXT REFS|CANDIDATE IDENTITY|DECISION PASS)\|' /tmp/reach.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 280 /tmp/reach.log || true; fi; } >/tmp/out
          git fetch origin "$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 017 shell normalize reach r3 [skip ci]' >/dev/null; git push origin "HEAD:$DIAG_BRANCH" >/dev/null; test "$result" = PASS
