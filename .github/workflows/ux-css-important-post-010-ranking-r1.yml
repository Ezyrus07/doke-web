name: UX CSS Important Post 023 Fresh Ranking R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  rank024:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d9a831502ace23490f500c0b50f889409353dfb1
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-post-023-fresh-ranking-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: rank
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          npm ci --ignore-scripts >/dev/null
          npm run audit:active-legacy-structures >/dev/null
          npm run audit:important-reduction-plan >/dev/null
          npm run audit:global-css-design-system >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8'));
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const s=b.summary, ps=p.summary;
          if(s.totalImportant!==10295||s.outsideServiceCardImportant!==10233||s.filesWithImportant!==26) throw Error(`baseline ${JSON.stringify(s)}`);
          if(ps.affectedFiles!==25||ps.totalImportantOutsideServiceCard!==10233||ps.byRisk?.['high-baseline-required']!==10225||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2) throw Error(`plan ${JSON.stringify(ps)}`);
          console.log(`PLAN SUMMARY|affectedFiles=${ps.affectedFiles}|outside=${ps.totalImportantOutsideServiceCard}|high=${ps.byRisk['high-baseline-required']}|medium=${ps.byRisk['medium-baseline-required']}|low=${ps.byRisk['low-review-candidate']}`);
          console.log(`BASELINE SUMMARY|total=${s.totalImportant}|outside=${s.outsideServiceCardImportant}|files=${s.filesWithImportant}`);
          const counts=[]; function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,e.name);if(e.isDirectory())walk(q);else if(e.isFile()&&q.endsWith('.css')){const c=(fs.readFileSync(q,'utf8').match(/!important\b/g)||[]).length;if(c)counts.push([c,q.replaceAll('\\','/')]);}}} walk('assets/css'); counts.sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1]));
          const total=counts.reduce((a,[n])=>a+n,0); if(counts.length!==26||total!==10295) throw Error(`physical ${counts.length}/${total}`);
          console.log(`COUNT INVENTORY|files=${counts.length}|total=${total}`); for(const [n,f] of counts) console.log(`COUNT FILE|important=${n}|file=${f}`);
          const highs=new Set(); const scan=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){for(const x of o)scan(x);return;}const vals=Object.values(o);if(vals.some(v=>typeof v==='string'&&v==='high-baseline-required'))for(const v of vals)if(typeof v==='string'&&v.startsWith('assets/css/')&&v.endsWith('.css'))highs.add(v);for(const v of vals)scan(v)}; scan(p);
          const highRows=counts.filter(([,f])=>highs.has(f)); if(highRows.reduce((a,[n])=>a+n,0)!==10225) throw Error('high total'); for(const [n,f] of highRows) console.log(`PLAN FILE|important=${n}|risk=high-baseline-required|file=${f}`);
          const blocked=new Map([['assets/css/components/shell/mobile-base-stability.css','remaining-28-protected-by-certified-020'],['assets/css/pages/home/mobile-hero-feed.css','remaining-127-protected-by-certified-021']]);
          for(const [f,reason] of blocked){const row=highRows.find(([,x])=>x===f);if(!row)throw Error(`blocked missing ${f}`);console.log(`BLOCKED HIGH|important=${row[0]}|file=${f}|reason=${reason}`)}
          const eligible=highRows.filter(([,f])=>!blocked.has(f)).sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1])); if(!eligible.length)throw Error('no eligible high'); console.log(`NEXT ELIGIBLE HIGH|important=${eligible[0][0]}|file=${eligible[0][1]}`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.rank.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "RANK=${{ steps.rank.outcome }}"; grep -E '^(PLAN SUMMARY|BASELINE SUMMARY|COUNT INVENTORY|COUNT FILE|PLAN FILE|BLOCKED HIGH|NEXT ELIGIBLE HIGH)\|' /tmp/r.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 500 /tmp/r.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish post-023 fresh ranking r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
