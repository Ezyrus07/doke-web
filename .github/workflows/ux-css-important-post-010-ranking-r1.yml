name: UX CSS Important 013 Dormant Home Promotion R5
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote013:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c4b69ea11e1298c91a713f5644943970435c3b08
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: 64b24654608164efb6803f3571259c776fb34ab3
      CANDIDATE_SHA256: 8fb214cc0bb9792a8a26bc646748e1aa5e60211e77f625b9fadc4b6785729fc4
      PERM_BRANCH: ux/ux-css-important-013-home-mobile-dormant-runtime-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-013-dormant-home-promotion-r5.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$(git rev-parse "$TARGET_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git show HEAD:.diagnostics/ux-css-important-013-runtime-inventory-r2.txt >/tmp/inventory.txt
          git show HEAD:.diagnostics/ux-css-important-013-dormant-home-visual-r3.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-013-dormant-home-governance-r4.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/inventory.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -q "sha256=$CANDIDATE_SHA256" /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -q "candidateHash=$CANDIDATE_SHA256" /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$TARGET_SHA"
          git checkout -B promote013 "$TARGET_SHA" >/dev/null
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8'),removed=0,rules=0;
          const selectors=new Set(['html.home-index-root body.home-index-shell .home-mobile-hero__avatar','html.home-index-root body.home-index-shell .home-mobile-hero__location-dot','html.home-index-root body.home-index-shell .home-mobile-hero__notification','html.home-index-root body.home-index-shell .home-search-hero__filter-button','html.home-index-root body.home-index-shell .home-mobile-hero__top','html.home-index-root body.home-index-shell .home-mobile-hero__identity strong','html.home-index-root body.home-index-shell .home-mobile-hero__quick-actions','html.home-index-root body.home-index-shell .home-mobile-hero__location-label']);
          if((s.match(/!important\b/g)||[]).length!==153)throw Error('parent');
          s=s.replace(/([^{}]+)\{([^{}]*)\}/g,(a,h,b)=>{if(!selectors.has(h.trim()))return a;const c=(b.match(/!important\b/g)||[]).length;if(!c)return a;removed+=c;rules++;return h+'{'+b.replace(/\s*!important\b/g,'')+'}'});
          const buf=Buffer.from(s),sha=crypto.createHash('sha256').update(buf).digest('hex'),count=(s.match(/!important\b/g)||[]).length;
          if(removed!==25||rules!==12||count!==128||sha!==process.env.CANDIDATE_SHA256)throw Error(`candidate ${removed}/${rules}/${count}/${sha}`);
          fs.writeFileSync(f,s);console.log(`CANDIDATE|sha256=${sha}|bytes=${buf.length}|important=153->128|removed=25|rules=12|selectors=8|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0`);
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'25\t25\t'"$TARGET_FILE"
          git config user.name 'Doke UX CSS Certifier'
          git config user.email 'doke-ux-css-certifier@users.noreply.github.com'
          git add "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-013: remove dormant Home mobile priorities' >/dev/null
          HEAD_SHA=$(git rev-parse HEAD); TREE=$(git rev-parse HEAD^{tree}); BLOB=$(git rev-parse "HEAD:$TARGET_FILE")
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA" HEAD | wc -l)" -eq 1
          test "$(git diff --name-only "$TARGET_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$TARGET_SHA" HEAD -- "$TARGET_FILE")" = $'25\t25\t'"$TARGET_FILE"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$HEAD_SHA"
          echo "PROMOTION PASS|head=$HEAD_SHA|parent=$TARGET_SHA|tree=$TREE|blob=$BLOB|files=1|additions=25|deletions=25|leaseParent=$TARGET_SHA"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|PROMOTION PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 280 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"; git commit -m 'diag: publish 013 dormant home promotion r5 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
