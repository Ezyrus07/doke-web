name: UX CSS Important Post-034 Residual Reach Ranking R2
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reachranking034r2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PERM_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-post-034-reach-ranking-r2.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/reach-ranking.log) 2>&1
          git fetch origin "refs/heads/ux/ux-css-important-034-tablet-safari-layout-dormant-priority:refs/remotes/origin/ux/ux-css-important-034-tablet-safari-layout-dormant-priority" >/dev/null
          test "$(git rev-parse refs/remotes/origin/ux/ux-css-important-034-tablet-safari-layout-dormant-priority)" = "$PERM_SHA"
          git checkout --detach "$PERM_SHA" >/dev/null
          test "$(git rev-parse HEAD)" = "$PERM_SHA"
          node scripts/audit-important-reduction-plan.js >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const {getLoadedCssAssets}=require('./scripts/lib/css-assets');
          const root=process.cwd();
          const norm=s=>s.replace(/\\/g,'/').replace(/^\.\//,'').split('?')[0];
          const htmls=fs.readdirSync(root).filter(f=>f.endsWith('.html')).sort();
          const loaded=new Set(), pagesByAsset=new Map();
          for(const h of htmls){
            const html=fs.readFileSync(h,'utf8');
            for(const a0 of getLoadedCssAssets(html,root)){
              const a=norm(a0); loaded.add(a);
              if(!pagesByAsset.has(a)) pagesByAsset.set(a,new Set());
              pagesByAsset.get(a).add(h);
            }
          }
          const cssFiles=[];
          const walk=(dir,ext,out)=>{if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p,ext,out);else if(e.isFile()&&p.endsWith(ext))out.push(norm(path.relative(root,p)));}};
          walk(path.join(root,'assets','css'),'.css',cssFiles);
          const importerMap=new Map();
          const importRe=/@import\s+(?:url\()?['"]?([^"')\s]+)['"]?\)?/g;
          for(const f of cssFiles){const src=fs.readFileSync(f,'utf8');let m;while((m=importRe.exec(src))){const resolved=norm(path.join(path.dirname(f),m[1]));if(!importerMap.has(resolved))importerMap.set(resolved,new Set());importerMap.get(resolved).add(f);}}
          const runtimeJs=[]; walk(path.join(root,'assets','js'),'.js',runtimeJs);
          const toolingJs=[]; walk(path.join(root,'scripts'),'.js',toolingJs); walk(path.join(root,'tests'),'.js',toolingJs);
          const refCount=(files,target)=>files.reduce((n,f)=>n+(fs.readFileSync(f,'utf8').includes(target)?1:0),0);
          const directHtmlLinks=(target)=>htmls.reduce((n,h)=>n+(fs.readFileSync(h,'utf8').includes(target)?1:0),0);
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const s=p.summary||{}, risk=s.byRisk||{};
          if(s.affectedFiles!==14||s.totalImportantOutsideServiceCard!==7514||risk['high-baseline-required']!==7506||risk['medium-baseline-required']!==6||risk['low-review-candidate']!==2)throw Error(`summary ${JSON.stringify(s)}`);
          console.log(`GRAPH PASS|rootHtml=${htmls.length}|loadedCss=${loaded.size}|physicalCss=${cssFiles.length}|ranked=${p.topFiles.length}`);
          p.topFiles.forEach((x,i)=>{
            const pages=[...(pagesByAsset.get(x.file)||[])].sort();
            const importers=[...(importerMap.get(x.file)||[])].sort();
            const htmlRefs=directHtmlLinks(x.file), runtimeRefs=refCount(runtimeJs,x.file), toolingRefs=refCount(toolingJs,x.file);
            const active=loaded.has(x.file)?1:0;
            const wholeFileDormant=active===0&&htmlRefs===0&&importers.length===0&&runtimeRefs===0?1:0;
            console.log(`REACH ${String(i+1).padStart(2,'0')}|file=${x.file}|important=${x.importantCount}|risk=${x.risk}|loaded=${active}|pages=${pages.length?pages.join(','):'-'}|htmlLinks=${htmlRefs}|actualImporters=${importers.length}|runtimeJsRefs=${runtimeRefs}|toolingJsRefs=${toolingRefs}|wholeFileDormant=${wholeFileDormant}`);
          });
          NODE
          test -z "$(git status --porcelain -- assets/css)"
          echo "SNAPSHOT PASS|sha=$PERM_SHA|productCssChanged=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PERM_SHA=$PERM_SHA"; echo "REACH_RANKING=${{ steps.reach.outcome }}"; grep -E '^(GRAPH PASS|REACH [0-9][0-9]|SNAPSHOT PASS)\|' /tmp/reach-ranking.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 700 /tmp/reach-ranking.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"; git commit -m 'diag: publish post-034 residual reach ranking r2 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
