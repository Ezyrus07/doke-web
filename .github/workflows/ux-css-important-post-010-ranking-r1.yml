name: UX CSS Important 020 Mobile Base Stability Browser R8
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  visual020:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: ce77f61a6745cff6d92314db4b144cb6ac38fe1e
      TARGET_FILE: assets/css/components/shell/mobile-base-stability.css
      TARGET_BLOB: 85a7df3eaf36ae2cf5835794d7e27cdc6548dda2
      CANDIDATE_SHA256: bb31662f44faf0b92278ada37f357e29935bbfd1fa0fa641028baee485010c26
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-020-mobile-base-stability-visual-r8.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/v.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null; test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          git show diag/ux-css-important-post-010-ranking-r1:.diagnostics/ux-css-important-020-mobile-base-stability-family-r5.txt >/tmp/family.txt
          grep -q '^RESULT=PASS$' /tmp/family.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/family.txt; grep -Fq 'runtimeRefs=0|cssRefsOutsideTarget=0' /tmp/family.txt
          npm ci --ignore-scripts >/dev/null; npx playwright install chromium >/dev/null
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          NODE_PATH="$PWD/node_modules" node --input-type=commonjs <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),{chromium}=require('playwright');
          (async()=>{
          const target=process.env.TARGET_FILE,targetNorm=target.replaceAll('\\','/'),expected=process.env.CANDIDATE_SHA256;
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):[p]});
          const active=walk('.').filter(f=>f.endsWith('.html')&&!f.includes('/node_modules/')&&!f.includes('/archive/')&&!f.includes('/.git/')&&!f.includes('/tests/')&&!f.includes('/fixtures/'));
          function importsFrom(f){const out=[];const s=fs.readFileSync(f,'utf8').replace(/\/\*[\s\S]*?\*\//g,'');for(const m of s.matchAll(/@import\s+(?:url\()?\s*["']([^"']+\.css(?:\?[^"']*)?)["']/gi)){let u=m[1].split('?')[0];if(/^https?:|^\/\//.test(u))continue;let q=path.normalize(path.join(path.dirname(f),u)).replaceAll('\\','/');if(fs.existsSync(q))out.push(q)}return out}
          function pageCss(f){const out=[];const s=fs.readFileSync(f,'utf8');for(const m of s.matchAll(/<link\b[^>]*href=["']([^"']+\.css(?:\?[^"']*)?)["'][^>]*>/gi)){let u=m[1].split('?')[0];if(/^https?:|^\/\//.test(u))continue;u=u.replace(/^\.\//,'');let q=path.normalize(path.join(path.dirname(f),u)).replaceAll('\\','/').replace(/^\.\//,'');if(fs.existsSync(q))out.push(q)}return out}
          function reaches(f){const seen=new Set(pageCss(f)),q=[...seen];while(q.length){for(const x of importsFrom(q.shift()))if(!seen.has(x)){seen.add(x);q.push(x)}}return seen.has(targetNorm)}
          const pages=active.filter(reaches).map(f=>f.replace(/^\.\//,''));if(!pages.length)throw Error('no consumers');console.log(`CONSUMERS|count=${pages.length}|pages=${pages.join(',')}`);
          const original=fs.readFileSync(target,'utf8'),re=/body\.doke-mobile-shell-mounted \.app-frame,\s*body\.doke-mobile-shell-mounted \.page-shell,\s*body\.doke-mobile-shell-mounted \.layout-shell,\s*body\.doke-mobile-shell-mounted \.dashboard-layout \{([\s\S]*?)\n  \}/m,m=original.match(re);if(!m)throw Error('block');const candidate=original.replace(m[0],m[0].replace(/\s*!important\b/g,'')),h=crypto.createHash('sha256').update(Buffer.from(candidate)).digest('hex');if(h!==expected)throw Error(`hash ${h}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${Buffer.byteLength(candidate)}|important=31->28|priorityMarkersRemoved=3|familyImportant=3->0|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0`);
          const browser=await chromium.launch({headless:true}),widths=[390,560,760,761];
          async function phase(label){const res=[];let errors=0,totalLoads=0,loadedStates=0,hits=0;for(const p of pages)for(const w of widths){const page=await browser.newPage({viewport:{width:w,height:900}});let targetLoads=0;page.on('pageerror',()=>errors++);page.on('request',r=>{try{if(new URL(r.url()).pathname.endsWith('/'+path.basename(target)))targetLoads++}catch{}});await page.route('**/*',route=>{const u=route.request().url();if(u.startsWith('http://127.0.0.1:4173/')||u.startsWith('data:')||u.startsWith('blob:'))return route.continue();return route.abort()});await page.goto(`http://127.0.0.1:4173/${encodeURI(p)}`,{waitUntil:'networkidle',timeout:30000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}'});await page.waitForTimeout(80);const dom=await page.evaluate(()=>{const sel='body.doke-mobile-shell-mounted .app-frame,body.doke-mobile-shell-mounted .page-shell,body.doke-mobile-shell-mounted .layout-shell,body.doke-mobile-shell-mounted .dashboard-layout';return {hits:document.querySelectorAll(sel).length,bodyMounted:document.body.classList.contains('doke-mobile-shell-mounted'),docW:document.documentElement.scrollWidth,bodyW:document.body.scrollWidth,docH:document.documentElement.scrollHeight,bodyH:document.body.scrollHeight}});hits+=dom.hits;totalLoads+=targetLoads;if(targetLoads>0)loadedStates++;if(dom.hits!==0)throw Error(`family DOM hit ${p}@${w}:${dom.hits}`);const shot=await page.screenshot({fullPage:true});res.push({key:`${p}@${w}`,meta:{...dom,targetLoads},shot:crypto.createHash('sha256').update(shot).digest('hex')});await page.close()}console.log(`PHASE|label=${label}|states=${res.length}|pageErrors=${errors}|targetStylesheetLoads=${totalLoads}|targetLoadedStates=${loadedStates}|familyDomHits=${hits}`);if(errors||hits||loadedStates<1||totalLoads<1)throw Error(`phase ${label}`);return res}
          const parent=await phase('parent');fs.writeFileSync(target,candidate);const cand=await phase('candidate');let md=0,sd=0;for(let i=0;i<parent.length;i++){if(parent[i].key!==cand[i].key)throw Error('key');if(JSON.stringify(parent[i].meta)!==JSON.stringify(cand[i].meta))md++;if(parent[i].shot!==cand[i].shot)sd++}fs.writeFileSync(target,original);if(fs.readFileSync(target,'utf8')!==original)throw Error('restore');await browser.close();console.log(`CANDIDATE PARITY|sha256=${h}|important=31->28|states=${parent.length}|consumerPages=${pages.length}|viewports=${widths.join(',')}|metadataDiffs=${md}|screenshotDiffs=${sd}|pageErrors=0|familyDomHits=0|targetLoadedStatesPositive=1|syntheticDOM=0|criteriaRelaxed=0`);if(md||sd)throw Error(`diff ${md}/${sd}`);console.log('RESTORE PASS|target=parent-exact');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/http.pid)" 2>/dev/null || true
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROOF=${{ steps.proof.outcome }}"; echo 'R7_NOTE=harness-only per-state stylesheet-load assumption; static reach can overapproximate conditional imports'; grep -E '^(CONSUMERS|CANDIDATE IDENTITY|PHASE|CANDIDATE PARITY|RESTORE PASS)\|' /tmp/v.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 520 /tmp/v.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 020 mobile base stability visual r8 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
