name: UX CSS Important 030 Mobile Chrome Lock Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote030:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 6d3eed90684a23f895e3fa93fa344b875e94b4e0
      TARGET_FILE: assets/css/components/navigation/mobile-chrome-lock.css
      TARGET_BLOB: aaaff472ae885f14fb97e882ee0ace80ab83ea1a
      CANDIDATE_SHA256: 938c4b6d8ef07b50d455c6794a324661e25da9a0de107710d1caee8c0e00203f
      CANDIDATE_BLOB: 173d26db7efc6a888b0962af514ae962aec10c75
      REACH_FILE: .diagnostics/ux-css-important-030-mobile-chrome-lock-reach-r1.txt
      REACH_BLOB: c3f0148527a818dce64f2ade044b10e5996459c5
      BROWSER_FILE: .diagnostics/ux-css-important-030-mobile-chrome-lock-browser-r2.txt
      BROWSER_BLOB: e5322c1d464ed6771db8fb1df40416a6fb76f686
      GOV_FILE: .diagnostics/ux-css-important-030-mobile-chrome-lock-governance-r4.txt
      GOV_BLOB: c92621389c5a4b9489a44f7d73990c4b0b47eb57
      PERM_BRANCH: ux/ux-css-important-030-mobile-chrome-lock-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-030-mobile-chrome-lock-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          git show HEAD:"$REACH_FILE" | grep -q '^RESULT=PASS$'
          git show HEAD:"$BROWSER_FILE" | grep -q '^RESULT=PASS$'
          git show HEAD:"$GOV_FILE" | grep -q '^RESULT=PASS$'

          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout -B permanent-work "refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"

          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const o=fs.readFileSync(process.env.TARGET_FILE,'utf8');
          const c=o.replace(/\s*!important\b/g,'');
          const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',c);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(before!==277||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          fs.writeFileSync(process.env.TARGET_FILE,c);
          console.log(`CANDIDATE MATERIALIZATION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(c)}|important=277->0|markerOnly=1|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'275\t275\t'"$TARGET_FILE"
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -- "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-030: remove dormant mobile chrome lock priorities' >/dev/null
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$CANDIDATE_BLOB"
          test "$(git diff --name-only "$PARENT_SHA" HEAD | wc -l)" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE")" = $'275\t275\t'"$TARGET_FILE"
          echo "PRODUCT COMMIT PASS|head=$head|tree=$tree|parent=$PARENT_SHA|blob=$CANDIDATE_BLOB|files=1|additions=275|deletions=275|markerDelta=277|markerOnly=1"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          test "$(git ls-remote origin "refs/heads/$PERM_BRANCH" | cut -f1)" = "$head"
          echo "PRODUCT PUSH PASS|branch=$PERM_BRANCH|head=$head|force=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          {
            grep -E '^(CANDIDATE MATERIALIZATION PASS|PRODUCT COMMIT PASS|PRODUCT PUSH PASS)\|' /tmp/p.log || true
            echo "RESULT=$result"
            if test "$result" = FAIL; then tail -n 800 /tmp/p.log || true; fi
          } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 030 mobile chrome lock promotion [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
