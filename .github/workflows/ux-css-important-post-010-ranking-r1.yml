          grep -Fq "return new URL('auth/login.html?next='" "$AUTH_GUARD_FILE"; grep -Fq 'root.location.replace(loginHref());' "$AUTH_GUARD_FILE"
          echo 'AUTH ROOT CONTRACT PASS|protected=pedidos.html,mensagens.html,notificacoes.html|anonymousPath=/auth/login.html|sourceBlob=exact|syntheticAuth=0'
