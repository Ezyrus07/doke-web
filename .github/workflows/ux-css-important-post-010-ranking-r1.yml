name: UX CSS Important 031 Home Sections Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote031:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 856361e1728829909daf1546f01d14417eded811
      TARGET_FILE: assets/css/pages/home/sections.css
      TARGET_BLOB: 6bc5eebe08c4ada3395474eea74fde3b9a850d5c
      CANDIDATE_SHA256: 2cf829c60ec4ecd72f3aeab599df3d5b7dcc43640a8d1d0e13ebb3b719f88253
      CANDIDATE_BLOB: f26ea47194a9c814ec9f27b86b9a29ae14519fca
      REACH_FILE: .diagnostics/ux-css-important-031-home-sections-reach-r1.txt
      REACH_BLOB: 716bbb15d9a2b2388c1759980b8cba5144b124d2
      R2_FILE: .diagnostics/ux-css-important-031-home-sections-browser-r2.txt
      R2_BLOB: 954284f50d0ceed6cfdd7a8dc8d4d1ad80f1e99f
      BROWSER_FILE: .diagnostics/ux-css-important-031-home-sections-browser-r3.txt
      BROWSER_BLOB: 61f4a9800a38efdb2acac9087950bbad33341c86
      GOV_FILE: .diagnostics/ux-css-important-031-home-sections-governance-r4.txt
      GOV_BLOB: d564951dc936e8e39f63cd814f337e5ec84e7c4c
      PERM_BRANCH: ux/ux-css-important-031-home-sections-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-031-home-sections-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$R2_FILE")" = "$R2_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt
          git show HEAD:"$R2_FILE" >/tmp/r2.txt
          git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt
          git show HEAD:"$GOV_FILE" >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt
          grep -q '^RESULT=FAIL$' /tmp/r2.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt
          grep -Fq 'wholeFileDormant=1' /tmp/reach.txt
          grep -Fq 'historicalResult=FAIL|classification=harness-invalid' /tmp/browser.txt
          grep -Fq 'targetStylesheetLoads=0/0|liveHomeSectionsLoads=7/7|pageRoots=7/7' /tmp/browser.txt
          grep -Fq 'IMPORTANT PASS|total=8538|outsideServiceCard=8476|files=18|delta=-290' /tmp/gov.txt
          grep -Fq 'PRODUCT DIFF PASS|files=1|additions=290|deletions=290|file=assets/css/pages/home/sections.css|markerDelta=290' /tmp/gov.txt

          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout -B product "refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          git show "HEAD:$TARGET_FILE" >/tmp/source.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const src=fs.readFileSync('/tmp/source.css','utf8');
          const before=(src.match(/!important\b/g)||[]).length;
          const out=src.replace(/\s*!important\b/g,'');
          const after=(out.match(/!important\b/g)||[]).length;
          const h=crypto.createHash('sha256').update(Buffer.from(out)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',out);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(before!==290||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB) throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          fs.writeFileSync(process.env.TARGET_FILE,out);
          console.log(`CANDIDATE MATERIALIZATION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(out)}|important=290->0|markerOnly=1|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$CANDIDATE_BLOB"
          num="$(git diff --numstat -- "$TARGET_FILE")"; add="$(printf '%s' "$num"|cut -f1)"; del="$(printf '%s' "$num"|cut -f2)"
          test "$add" = 290; test "$del" = 290
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -- "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-031: remove dormant home sections priorities' >/dev/null
          head="$(git rev-parse HEAD)"; tree="$(git rev-parse HEAD^{tree})"; parent="$(git rev-parse HEAD^)"; blob="$(git rev-parse "HEAD:$TARGET_FILE")"
          test "$parent" = "$PARENT_SHA"; test "$blob" = "$CANDIDATE_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..$head")" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$head" | wc -l)" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$head")" = "$TARGET_FILE"
          echo "PRODUCT COMMIT PASS|head=$head|tree=$tree|parent=$parent|blob=$blob|files=1|additions=$add|deletions=$del|markerDelta=290|markerOnly=1"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          remote="$(git ls-remote origin "refs/heads/$PERM_BRANCH" | cut -f1)"
          test "$remote" = "$head"
          echo "PRODUCT PUSH PASS|branch=$PERM_BRANCH|head=$head|force=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { grep -E '^(CANDIDATE MATERIALIZATION PASS|PRODUCT COMMIT PASS|PRODUCT PUSH PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 800 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"; git commit -m 'diag: publish 031 home sections promotion [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
