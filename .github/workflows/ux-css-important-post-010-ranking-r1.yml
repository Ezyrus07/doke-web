name: UX CSS Important 022 Index Compact Visual R7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  visual022r7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: f611a1e80e96488ef9841200356253efd4172b63
      TARGET_FILE: assets/css/components/layout/index-compact-card-contract.css
      TARGET_BLOB: 47d3c3a08b9dd081d978483cc863949d7468e525
      CANDIDATE_SHA256: 2ea5cba8e756cbf48dedba803f7a2ecd0ee6a57b5ae9b04e9ea22389020d85a1
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-022-index-compact-visual-r7.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: visual
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/v.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-022-index-compact-dormancy-r5.txt >/tmp/r5.txt
          grep -q '^RESULT=PASS$' /tmp/r5.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/r5.txt
          git show HEAD:.diagnostics/ux-css-important-022-index-compact-visual-r6.txt >/tmp/r6.txt
          grep -Fq 'targetStylesheetLoads=0/0' /tmp/r6.txt; grep -Fq 'metadataDiffs=0' /tmp/r6.txt
          git checkout --detach "$PARENT_SHA" >/dev/null; test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts >/dev/null; npx playwright install chromium --with-deps >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 & echo $! >/tmp/server.pid
          NODE_PATH="$PWD/node_modules" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('playwright');
          (async()=>{const T=process.env.TARGET_FILE,o=fs.readFileSync(T,'utf8'),candidate=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(candidate)).digest('hex');if(h!==process.env.CANDIDATE_SHA256)throw Error('candidate');const pages=['index.html','detalhe-anuncio.html','resultados.html','comunidade.html','carteira.html','perfil-profissional.html'],widths=[560,600,760,761,900,901],browser=await chromium.launch({headless:true});
          async function phase(label){let rows=[],errors=0,loads=0,renderer=0;for(const p of pages)for(const w of widths){const page=await browser.newPage({viewport:{width:w,height:900},deviceScaleFactor:1});await page.addInitScript(()=>{Math.random=()=>0.3141592653;const NativeDate=Date;class FixedDate extends NativeDate{constructor(...a){super(...(a.length?a:[1760000000000]))}static now(){return 1760000000000}}window.Date=FixedDate;});let e=0,l=0;page.on('pageerror',()=>{e++;errors++});page.on('request',r=>{if(r.url().includes('index-compact-card-contract.css')){l++;loads++;}});await page.route('**/*',route=>{const u=new URL(route.request().url());return u.hostname==='127.0.0.1'?route.continue():route.abort();});await page.goto(`http://127.0.0.1:4173/${p}`,{waitUntil:'load',timeout:30000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}html{scrollbar-width:none!important}::-webkit-scrollbar{display:none!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForTimeout(500);const m=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,bw:document.body?.scrollWidth||0,bh:document.body?.scrollHeight||0,cards:document.querySelectorAll('.doke-ad-card,.service-card,.publication-card').length,heads:document.querySelectorAll('.section-heading,.home-section-header,.detail-section__header,.results-related__header,.wallet-section-heading,.profile-section-heading').length,renderer:typeof window.Doke?.publicServiceCard?.create==='function'}));if(p==='index.html'&&m.renderer)renderer++;const buf=await page.screenshot({fullPage:true});rows.push({k:`${p}@${w}`,meta:m,shot:crypto.createHash('sha256').update(buf).digest('hex'),e,l});await page.close();}console.log(`PHASE|label=${label}|states=${rows.length}|pageErrors=${errors}|targetStylesheetLoads=${loads}|indexRendererStates=${renderer}`);return {rows,errors,loads,renderer};}
          const a=await phase('parent');fs.writeFileSync(T,candidate);const b=await phase('candidate');fs.writeFileSync(T,o);await browser.close();let md=0,sd=0,ld=0,keys=[];for(let i=0;i<a.rows.length;i++){if(JSON.stringify(a.rows[i].meta)!==JSON.stringify(b.rows[i].meta))md++;if(a.rows[i].shot!==b.rows[i].shot){sd++;keys.push(a.rows[i].k)}if(a.rows[i].l!==b.rows[i].l)ld++;}console.log(`BROWSER PASS|sha256=${h}|states=${a.rows.length}|pages=${pages.length}|viewports=${widths.join(',')}|metadataDiffs=${md}|screenshotDiffs=${sd}|loadedStateDiffs=${ld}|pageErrors=${a.errors+b.errors}|targetStylesheetLoads=${a.loads}/${b.loads}|indexRendererStates=${a.renderer}/${b.renderer}|syntheticDOM=0|criteriaRelaxed=0|deterministicTimeRandom=1`);if(keys.length)console.log(`SCREENSHOT DIFF KEYS|${keys.join(',')}`);if(md||sd||ld||a.errors||b.errors||a.loads||b.loads||a.renderer!==6||b.renderer!==6)throw Error('browser parity');console.log('RESTORE PASS|target=parent-exact');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; kill "$(cat /tmp/server.pid)" 2>/dev/null || true; result=FAIL; if test '${{ steps.visual.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROOF=${{ steps.visual.outcome }}"; echo 'R6_NOTE=one-screenshot-nondeterminism-with-target-unloaded; R7 strengthens determinism, criteria unchanged'; grep -E '^(PHASE|BROWSER PASS|SCREENSHOT DIFF KEYS|RESTORE PASS)\|' /tmp/v.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 520 /tmp/v.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 022 index compact visual r7 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
