name: UX CSS Important 015 Shared Index Card Promotion R7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote015:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d0d423a974001e9ffca6bcbe61f70549a0ade6ea
      TARGET_FILE: assets/css/components/cards/shared-index-card-contract.css
      PARENT_BLOB: 174004e53db7679d3ce2cbe4190bb56d56a0c160
      CANDIDATE_SHA256: c50e9f0e6360b3ec0ea5350696d2cf7501d40f8b2cf060de9aec3cf941171122
      PERM_BRANCH: ux/ux-css-important-015-shared-index-card-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-015-shared-index-card-promotion-r7.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-015-shared-index-card-reach-r3.txt >/tmp/reach.txt
          git show HEAD:.diagnostics/ux-css-important-015-shared-index-card-visual-r5.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-015-shared-index-card-governance-r6.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -Fq 'targetReachable=0|jsRefs=0|runtimeTextRefs=0|importers=0' /tmp/reach.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/browser.txt; grep -Fq 'metadataDiffs=0|screenshotDiffs=0|pageErrors=0|targetStylesheetLoads=0' /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -Fq "candidateHash=$CANDIDATE_SHA256" /tmp/gov.txt; grep -Fq 'IMPORTANT PASS|total=10870|outsideServiceCard=10808|files=32|delta=-96' /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');let s=fs.readFileSync(process.env.TARGET_FILE,'utf8'),before=(s.match(/!important\b/g)||[]).length;s=s.replace(/\s*!important\b/g,'');const b=Buffer.from(s),h=crypto.createHash('sha256').update(b).digest('hex'),after=(s.match(/!important\b/g)||[]).length;if(before!==96||after!==0||h!==process.env.CANDIDATE_SHA256)throw Error(`${before}/${after}/${h}`);fs.writeFileSync(process.env.TARGET_FILE,s);console.log(`CANDIDATE|sha256=${h}|bytes=${b.length}|important=96->0|removed=96|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=1`)
          NODE
          git config user.name 'Doke CSS Debt Bot'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1; test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-015 remove dormant shared index card priorities' >/dev/null
          NEW_SHA=$(git rev-parse HEAD); test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git diff --name-only "$PARENT_SHA" HEAD | wc -l)" -eq 1; test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          NUM=$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE"); echo "NUMSTAT|$NUM"; test "$NUM" = $'96\t96\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null; test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$NEW_SHA"
          TREE=$(git rev-parse HEAD^{tree}); BLOB=$(git rev-parse "HEAD:$TARGET_FILE"); HASH=$(sha256sum "$TARGET_FILE"|awk '{print $1}'); test "$HASH" = "$CANDIDATE_SHA256"
          echo "PROMOTION PASS|head=$NEW_SHA|parent=$PARENT_SHA|tree=$TREE|blob=$BLOB|files=1|numstat=96/96/$TARGET_FILE|leaseParent=$PARENT_SHA"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|NUMSTAT|PROMOTION PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 320 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 015 shared index card promotion r7 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
