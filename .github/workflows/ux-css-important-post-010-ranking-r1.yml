name: UX CSS Important 035 Paired Visual Probe P7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  probe035p7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      TARGET_FILE: assets/css/components/shell/doke-shell-contract.css
      TARGET_BLOB: c167c0b747dbb4465cdaf096b5a9225fa3d69059
      CANDIDATE_SHA256: fa114edbfe30797719983d9f599b4efb589dd89f57cd332ecb779bbe9b1b9845
      CANDIDATE_BLOB: 5000b0aa60f6d93e123bc17811887e57668d4988
      P6B_FILE: .diagnostics/ux-css-important-035-renderer-determinism-probe-p6b.txt
      P6B_BLOB: ce1aaf62faf63b298315ffdd628fee59c884121f
      RESULT_FILE: .diagnostics/ux-css-important-035-paired-visual-probe-p7.txt
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p7.log) 2>&1
          test "$(git rev-parse "HEAD:$P6B_FILE")" = "$P6B_BLOB"
          git show HEAD:"$P6B_FILE" >/tmp/p6b.txt
          grep -q '^RUN_ID=32485449161$' /tmp/p6b.txt
          grep -Fq 'stableModes=none|selected=none' /tmp/p6b.txt
          echo 'P6B TRANSFER PASS|globalRendererStability=unavailable|next=paired-same-process'
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          rm -rf /tmp/parent-site /tmp/candidate-site
          cp -a . /tmp/parent-site
          cp -a . /tmp/candidate-site
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),p='/tmp/candidate-site/'+process.env.TARGET_FILE;
          const s=fs.readFileSync(p,'utf8'),c=s.replace(/\s*!important\b/g,'');
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          fs.writeFileSync(p,c); const blob=cp.execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          const before=(s.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          if(before!==2552||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          console.log(`CANDIDATE PASS|important=${before}->${after}|sha256=${h}|blob=${blob}|transform=marker-only`);
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/parent-site >/tmp/http-parent.log 2>&1 & echo $! >/tmp/http-parent.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/candidate-site >/tmp/http-candidate.log 2>&1 & echo $! >/tmp/http-candidate.pid
          trap 'kill $(cat /tmp/http-parent.pid 2>/dev/null) $(cat /tmp/http-candidate.pid 2>/dev/null) 2>/dev/null || true' EXIT
          for port in 4173 4174; do ok=0; for i in {1..30}; do if curl -fsS "http://127.0.0.1:$port/comunidade.html" >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1; done
          cat >/tmp/p7.js <<'NODE'
          const {chromium}=require('playwright'),crypto=require('crypto');
          const targetPath='/assets/css/components/shell/doke-shell-contract.css';
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function rgbaHash(page,buf){return page.evaluate(async b64=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const bmp=await createImageBitmap(new Blob([u],{type:'image/png'})),c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0);const p=x.getImageData(0,0,c.width,c.height).data,d=await crypto.subtle.digest('SHA-256',p);return[...new Uint8Array(d)].map(v=>v.toString(16).padStart(2,'0')).join('');},buf.toString('base64'));}
          async function capture(browser,port,label){const ctx=await browser.newContext({viewport:{width:820,height:1180},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Bahia',reducedMotion:'reduce'});try{await ctx.route('**/*',route=>{const u=new URL(route.request().url());return(u.hostname==='127.0.0.1'||u.hostname==='localhost')?route.continue():route.abort();});await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787263200000,RealDate=Date;class FixedDate extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}}globalThis.Date=FixedDate;});const page=await ctx.newPage();let loads=0,errors=0;page.on('request',r=>{if(new URL(r.url()).pathname===targetPath)loads++});page.on('pageerror',()=>errors++);await page.goto(`http://127.0.0.1:${port}/comunidade.html`,{waitUntil:'networkidle',timeout:45000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForTimeout(900);const meta=await page.evaluate(()=>{const q=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return{x:+r.x.toFixed(3),y:+r.y.toFixed(3),w:+r.width.toFixed(3),h:+r.height.toFixed(3),display:c.display,visibility:c.visibility,opacity:c.opacity,transform:c.transform,border:c.border,background:c.backgroundColor}};return{path:location.pathname,page:document.body?.dataset?.page||null,profile:q('.app-header .home-side-meta__profile'),avatar:q('.app-header .home-side-meta__avatar'),content:q('.page__content, main.page__content'),docWidth:document.documentElement.scrollWidth,bodyWidth:document.body?.scrollWidth||0};});await page.screenshot({fullPage:true,timeout:60000,animations:'disabled',caret:'hide'});await page.waitForTimeout(350);const shot=await page.screenshot({fullPage:true,timeout:60000,animations:'disabled',caret:'hide'});if(loads||errors||meta.path!=='/comunidade.html'||meta.page!=='comunidade')throw Error(`${label} contract ${loads}/${errors}/${meta.path}/${meta.page}`);return{pixel:await rgbaHash(page,shot),metaHash:digest(Buffer.from(JSON.stringify(meta))),meta};}finally{await ctx.close().catch(()=>{})}}
          (async()=>{let pixelPass=0,metaPass=0;const rows=[];for(let i=1;i<=8;i++){const browser=await chromium.launch({headless:true});try{const order=i%2?['P','C']:['C','P'],out={};for(const side of order)out[side]=await capture(browser,side==='P'?4173:4174,side);const pe=out.P.pixel===out.C.pixel,me=JSON.stringify(out.P.meta)===JSON.stringify(out.C.meta);if(pe)pixelPass++;if(me)metaPass++;rows.push({p:out.P.pixel,c:out.C.pixel});console.log(`PAIR PASS|iteration=${i}|order=${order.join('')}|pixelEqual=${pe?1:0}|metaEqual=${me?1:0}|parentPixel=${out.P.pixel}|candidatePixel=${out.C.pixel}`);}finally{await browser.close().catch(()=>{})}}const pu=new Set(rows.map(r=>r.p)).size,cu=new Set(rows.map(r=>r.c)).size;console.log(`PAIR SUMMARY|pairs=8|pixelEqual=${pixelPass}/8|metaEqual=${metaPass}/8|parentPixelUnique=${pu}|candidatePixelUnique=${cu}|sameBrowserProcess=1|newContextPerSide=1|separateServers=1|pixelTolerance=0`);console.log(`PROBE RESULT|pairedExact=${pixelPass===8&&metaPass===8?1:0}|pixelEqual=${pixelPass}/8|metaEqual=${metaPass}/8|globalPixelNondeterminism=${pu>1||cu>1?1:0}|criteriaRelaxed=0|pixelTolerance=0|targetLoads=0/0`);if(pixelPass!==8||metaPass!==8)process.exit(2);})().catch(e=>{console.error('PROBE ERROR|'+(e?.stack||e));process.exit(1)});
          NODE
          timeout --signal=TERM --kill-after=20s 900s env NODE_PATH="$PWD/node_modules" node /tmp/p7.js
          echo 'RESTORE PASS|workspace=parent-untouched'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.probe.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROBE=${{ steps.probe.outcome }}"; grep -E '^(P6B TRANSFER PASS|CANDIDATE PASS|PAIR PASS|PAIR SUMMARY|PROBE RESULT|PROBE ERROR|RESTORE PASS)' /tmp/p7.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 1000 /tmp/p7.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 035 paired visual probe p7 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
