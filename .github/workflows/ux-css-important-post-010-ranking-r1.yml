name: UX CSS Important 026 Tablet Shell Contract Permanent Cert R5
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  certify026:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: ef20921036db4590ada19d8a55c6778dbcd9b48d
      PERM_SHA: a8771e5f631c4731afc11b5a07e005de78071ccf
      PERM_TREE: 2b9c105077e5d53cbf13ea466b713aec089e4e3c
      TARGET_FILE: assets/css/components/shell/tablet-shell-contract.css
      PARENT_BLOB: 49ef7f96f515dbbadca3b59690be54288cd0d211
      PERM_BLOB: 2620672b5eb2b64f817d679ccbf432e976f05bb9
      CANDIDATE_SHA256: dae4b097d958cbaa316ac02b49176c722a02d8844a5d2a699450b6122ffb8447
      PERM_BRANCH: ux/ux-css-important-026-tablet-shell-contract-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      REACH_FILE: .diagnostics/ux-css-important-026-tablet-shell-contract-reach-r1.txt
      BROWSER_FILE: .diagnostics/ux-css-important-026-tablet-shell-contract-browser-r3.txt
      GOV_FILE: .diagnostics/ux-css-important-026-tablet-shell-contract-governance-r4.txt
      RESULT_FILE: .diagnostics/ux-css-important-026-tablet-shell-contract-permanent-cert-r5.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: certify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/c.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt
          git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt
          git show HEAD:"$GOV_FILE" >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt
          grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/reach.txt
          grep -Fq 'htmlLinks=0|actualImporters=0|runtimeJsRefs=0|cssTextRefs=0' /tmp/reach.txt
          grep -Fq 'wholeFileDormant=1' /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt
          grep -Fq "sha256=$CANDIDATE_SHA256" /tmp/browser.txt
          grep -Fq 'metadataDiffs=0|screenshotDiffs=0|stableStates=28/28|pageErrors=0|targetStylesheetLoads=0/0' /tmp/browser.txt
          grep -Fq 'pageRoots=28/28|syntheticDOM=0|criteriaRelaxed=0' /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt
          grep -Fq 'IMPORTANT PASS|total=9785|outsideServiceCard=9723|files=23|delta=-186' /tmp/gov.txt
          grep -Fq 'QUEUE PASS|affectedFiles=22|highBaselineRequired=9715|mediumBaselineRequired=6|lowReviewCandidate=2|targetImportant=0' /tmp/gov.txt
          grep -Fq 'candidateHash=exact' /tmp/gov.txt
          echo 'PROOF TRANSFER PASS|reach=R1|browser=R3|governance=R4|candidateHash=exact|runIdCoupling=0|promotionReceiptCoupling=0|wholeFileDormant=1'
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PERM_SHA"
          git checkout --detach "$PERM_SHA" >/dev/null
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PERM_TREE"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..$PERM_SHA")" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$PERM_SHA" | wc -l)" -eq 1
          test "$(git diff --name-only "$PARENT_SHA" "$PERM_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$PERM_SHA" -- "$TARGET_FILE")" = $'186\t186\t'"$TARGET_FILE"
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),o=fs.readFileSync('/tmp/parent.css','utf8'),c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          if(before!==186||after!==0||h!==process.env.CANDIDATE_SHA256)throw Error(`rebuild ${before}/${after}/${h}`);
          fs.writeFileSync('/tmp/rebuilt.css',c);
          console.log(`RECONSTRUCTION PASS|sha256=${h}|bytes=${Buffer.byteLength(c)}|important=186->0|removed=186|byteIdentical=1|browserProofTransfer=hash-identical|wholeFileDormant=1`)
          NODE
          cmp -s /tmp/rebuilt.css "$TARGET_FILE"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l || true)" -eq 0
          npm ci --ignore-scripts >/dev/null
          node scripts/generate-responsive-index-baseline.js >/dev/null
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|state=permanent'
          npm run audit:agent-governance >/dev/null
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflicts');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`)
          NODE
          npm run audit:shared-app-header-contract >/dev/null
          npm run audit:mobile-shell-location-contract >/dev/null
          npm run audit:responsive-boundaries >/dev/null
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$PERM_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures >/dev/null
          npm run audit:important-reduction-plan >/dev/null
          npm run audit:global-css-design-system >/dev/null
          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8')),s=b.summary,ps=p.summary;
          if(s.totalImportant!==9785||s.outsideServiceCardImportant!==9723||s.filesWithImportant!==23)throw Error(`important ${JSON.stringify(s)}`);
          if(ps.affectedFiles!==22||ps.totalImportantOutsideServiceCard!==9723||ps.byRisk?.['high-baseline-required']!==9715||ps.byRisk?.['medium-baseline-required']!==6||ps.byRisk?.['low-review-candidate']!==2)throw Error(`plan ${JSON.stringify(ps)}`);
          console.log('IMPORTANT PASS|total=9785|outsideServiceCard=9723|files=23');
          console.log('QUEUE PASS|affectedFiles=22|highBaselineRequired=9715|mediumBaselineRequired=6|lowReviewCandidate=2|targetImportant=0|protected006=6|protected010=2|protected020=28|protected021=127')
          NODE
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};
          if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);
          console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`)
          NODE
          echo "AUDIT_EXIT=$code"
          echo 'CERTIFICATION PASS|fullHistory=1|oneCommit=1|oneFile=1|numstat=186/186|wholeFileDormant=1|browserMetadataDiffs=0|browserScreenshotDiffs=0|browserStableStates=28/28|browserPageErrors=0|targetStylesheetLoads=0/0|pageRoots=28/28|browserProofTransfer=hash-identical|duplicates=0/0|domain=23/15/2.91/12|targetImportant=0|protected020=28|protected021=127'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.certify.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PERM_SHA=$PERM_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_TREE=$PERM_TREE"; echo "PERM_BLOB=$PERM_BLOB"; echo "CERTIFY=${{ steps.certify.outcome }}"; grep -E '^(PROOF TRANSFER PASS|RECONSTRUCTION PASS|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT PASS|QUEUE PASS|DEPENDENCY PASS|CERTIFICATION PASS)\|' /tmp/c.log || true; grep '^AUDIT_EXIT=' /tmp/c.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 900 /tmp/c.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 026 tablet shell contract permanent cert r5 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
