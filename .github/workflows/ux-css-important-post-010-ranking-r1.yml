name: UX CSS Important 011 Promotion R6

on:
  push:
    branches:
      - diag/ux-css-important-post-010-ranking-r1

permissions:
  contents: write

jobs:
  promote011:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 58df6a9856874d541951430f9eab99e322da3c0f
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: ae438520da448cf6f8e39c1a18eb9e3d41633cc7
      CANDIDATE_SHA256: ecd2250c3c8957f8b0c6c83ec0530fbaa8675ba72b27c54f91be50582c887f48
      PERM_BRANCH: ux/ux-css-important-011-home-featured-pro-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-011-promotion-r6.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/promo.log) 2>&1
          git fetch origin "$PERM_BRANCH" >/dev/null
          remote_sha="$(git rev-parse "origin/$PERM_BRANCH")"
          test "$remote_sha" = "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git checkout -B promote "$TARGET_SHA" >/dev/null
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"

          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;
          let s=fs.readFileSync(f,'utf8'),removed=0;
          if((s.match(/!important\b/g)||[]).length!==179) throw Error('parent important count');
          function strip(sel,n){
            const needle=sel+'{';
            const i=s.indexOf(needle);
            if(i<0 || s.indexOf(needle,i+1)>=0) throw Error('selector '+sel);
            const b=s.indexOf('{',i),e=s.indexOf('}',b);
            let z=s.slice(b+1,e);
            const c=(z.match(/!important\b/g)||[]).length;
            if(c!==n) throw Error(sel+' markers='+c+' expected='+n);
            z=z.replace(/\s*!important\b/g,'');
            removed+=c;
            s=s.slice(0,b+1)+z+s.slice(e);
          }
          strip('html.home-index-root body.home-index-shell .featured-pros__grid .pro-card',2);
          strip('html.home-index-root body.home-index-shell .featured-pros__grid .pro-card__header',2);
          strip('html.home-index-root body.home-index-shell .featured-pros__grid .pro-card__avatar',7);
          strip('html.home-index-root body.home-index-shell .featured-pros__grid .pro-card__identity',3);
          strip('html.home-index-root body.home-index-shell .featured-pros__grid .pro-card__score',3);
          const h=crypto.createHash('sha256').update(Buffer.from(s)).digest('hex');
          if(removed!==17||(s.match(/!important\b/g)||[]).length!==162||Buffer.byteLength(s)!==37582||h!==process.env.CANDIDATE_SHA256) throw Error('candidate identity');
          fs.writeFileSync(f,s);
          console.log(`CANDIDATE|sha256=${h}|bytes=${Buffer.byteLength(s)}|important=179->162|removed=17|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0`);
          NODE

          test "$(git diff --numstat -- "$TARGET_FILE")" = $'17\t17\t'"$TARGET_FILE"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$TARGET_FILE"
          git diff --check
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-011: remove dormant Home featured-pro priorities' >/dev/null
          head_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          blob_sha="$(git rev-parse "HEAD:$TARGET_FILE")"
          test "$parent_sha" = "$TARGET_SHA"
          test "$(git rev-list --count "$TARGET_SHA"..HEAD)" -eq 1
          test "$(git diff --name-only "$TARGET_SHA"..HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$TARGET_SHA"..HEAD -- "$TARGET_FILE")" = $'17\t17\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERM_BRANCH:$TARGET_SHA" origin "HEAD:refs/heads/$PERM_BRANCH"
          echo "PROMOTION PASS|head=$head_sha|parent=$parent_sha|tree=$tree_sha|blob=$blob_sha|files=1|additions=17|deletions=17|leaseParent=$TARGET_SHA"
      - name: Publish receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "PARENT_SHA=$TARGET_SHA"
            echo "PERM_BRANCH=$PERM_BRANCH"
            echo "PROMOTE=${{ steps.promote.outcome }}"
            grep -E '^(CANDIDATE|PROMOTION PASS)\|' /tmp/promo.log || true
            echo "RESULT=$result"
            if test "$result" = FAIL; then tail -n 220 /tmp/promo.log || true; fi
          } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: publish 011 promotion r6 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
