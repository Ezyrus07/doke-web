name: UX CSS Important 023 App Mobile Search Token Inventory R5
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  tokens023:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: c469ab875b43f37753e660b2ac7c424f7a6f841e
      TARGET_FILE: assets/css/components/navigation/app-mobile-search.css
      TARGET_BLOB: de0178f27e9ad535acf1b00eae0e59382d14061e
      CANDIDATE_SHA256: 2431b9916decc1845f7d837bdb05b64a8f863e3b113aa32471a22571a8d48f85
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-023-app-mobile-search-token-inventory-r5.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: tokens
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/t.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null; test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),path=require('path'),crypto=require('crypto');const T=process.env.TARGET_FILE,o=fs.readFileSync(T,'utf8');
          const tokens=[...new Set([...o.matchAll(/\.([A-Za-z0-9_-]*app-mobile-search[A-Za-z0-9_-]*)/g)].map(m=>m[1]))].sort();if(!tokens.length)throw Error('no tokens');
          const tracked=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);const hits=[];
          for(const f of tracked){if(f===T)continue;if(!(f.endsWith('.html')||f.startsWith('assets/js/')))continue;let s;try{s=fs.readFileSync(f,'utf8')}catch{continue}for(const tok of tokens){const re=new RegExp(`(?:class(?:Name)?\\s*=\\s*["'][^"']*\\b${tok}\\b|classList\\.(?:add|remove|toggle|contains)\\([^)]*["']${tok}["']|["']${tok}["'])`);if(re.test(s))hits.push([f,tok]);}}
          console.log(`TOKEN INVENTORY|tokens=${tokens.length}|runtimeHtmlJsHits=${hits.length}`);for(const t of tokens)console.log(`TOKEN|name=${t}`);for(const [f,t] of hits)console.log(`RUNTIME TOKEN HIT|file=${f}|token=${t}`);if(hits.length)throw Error('runtime token hits');
          const c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');if(h!==process.env.CANDIDATE_SHA256)throw Error(h);console.log(`CANDIDATE PASS|sha256=${h}|important=146->0|runtimeTokenHits=0|wholeFileDormant=1`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.tokens.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "TOKENS=${{ steps.tokens.outcome }}"; grep -E '^(TOKEN INVENTORY|TOKEN|RUNTIME TOKEN HIT|CANDIDATE PASS)\|' /tmp/t.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 500 /tmp/t.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 023 app mobile search token inventory r5 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
