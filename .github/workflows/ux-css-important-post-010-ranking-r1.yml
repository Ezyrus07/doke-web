name: UX CSS Important Post-034 Residual Ranking R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  ranking034r1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PERM_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-post-034-ranking-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - id: rank
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/ranking.log) 2>&1
          git fetch origin "refs/heads/ux/ux-css-important-034-tablet-safari-layout-dormant-priority:refs/remotes/origin/ux/ux-css-important-034-tablet-safari-layout-dormant-priority" >/dev/null
          test "$(git rev-parse refs/remotes/origin/ux/ux-css-important-034-tablet-safari-layout-dormant-priority)" = "$PERM_SHA"
          git checkout --detach "$PERM_SHA" >/dev/null
          test "$(git rev-parse HEAD)" = "$PERM_SHA"
          node scripts/audit-important-reduction-plan.js
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const s=p.summary||{};
          if(s.affectedFiles!==14||s.totalImportantOutsideServiceCard!==7514) throw Error(`summary ${JSON.stringify(s)}`);
          const risk=s.byRisk||{};
          if(risk['high-baseline-required']!==7506||risk['medium-baseline-required']!==6||risk['low-review-candidate']!==2) throw Error(`risk ${JSON.stringify(risk)}`);
          if(!Array.isArray(p.topFiles)||p.topFiles.length!==14) throw Error(`topFiles ${p.topFiles?.length}`);
          console.log(`SUMMARY PASS|affectedFiles=${s.affectedFiles}|totalImportantOutsideServiceCard=${s.totalImportantOutsideServiceCard}|highBaselineRequired=${risk['high-baseline-required']}|mediumBaselineRequired=${risk['medium-baseline-required']}|lowReviewCandidate=${risk['low-review-candidate']}|lowRiskFileCount=${s.lowRiskFileCount}`);
          p.topFiles.forEach((x,i)=>console.log(`RANK ${String(i+1).padStart(2,'0')}|file=${x.file}|layer=${x.layer}|important=${x.importantCount}|risk=${x.risk}`));
          console.log(`LOW_RISK_FILES|${(p.lowRiskFiles||[]).join(',')}`);
          console.log(`RECOMMENDATION|${p.recommendation}`);
          NODE
          test -z "$(git status --porcelain -- assets/css)"
          echo "SNAPSHOT PASS|sha=$PERM_SHA|productCssChanged=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.rank.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PERM_SHA=$PERM_SHA"; echo "RANKING=${{ steps.rank.outcome }}"; grep -E '^(SUMMARY PASS|RANK [0-9][0-9]|LOW_RISK_FILES|RECOMMENDATION|SNAPSHOT PASS)\|' /tmp/ranking.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 500 /tmp/ranking.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"; git commit -m 'diag: publish post-034 residual ranking r1 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
