name: UX CSS Important 034 Tablet Safari Layout Reach R1
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach034r1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 79b2820ba35e89ea066e90468d801908d5ea56f0
      TARGET_FILE: assets/css/pages/home/tablet-safari-layout.css
      TARGET_BLOB: 74d2ddc5292edbeaf4629d4f43118c8d5e6f676b
      EXPECTED_IMPORTANT: '341'
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-034-tablet-safari-layout-reach-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          git show "HEAD:$TARGET_FILE" >/tmp/source.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const src=fs.readFileSync('/tmp/source.css','utf8');const before=(src.match(/!important\b/g)||[]).length;const out=src.replace(/\s*!important\b/g,'');const after=(out.match(/!important\b/g)||[]).length;const removed=before-after;if(before!==+process.env.EXPECTED_IMPORTANT||after!==0||removed!==+process.env.EXPECTED_IMPORTANT)throw Error(`important ${before}->${after}`);fs.writeFileSync('/tmp/candidate.css',out);const sha256=crypto.createHash('sha256').update(Buffer.from(out)).digest('hex');const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();console.log(`CANDIDATE PASS|bytes=${Buffer.byteLength(out)}|important=${before}->${after}|removed=${removed}|sha256=${sha256}|blob=${blob}|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          node <<'NODE'
          const fs=require('fs'),path=require('path');const {getLoadedCssAssets}=require('./scripts/lib/css-assets');const root=process.cwd(),target=process.env.TARGET_FILE.replace(/\\/g,'/');const norm=p=>p.replace(/\\/g,'/').replace(/^\.\//,'').replace(/^\/+/, '').split('?')[0].split('#')[0];const rootHtml=fs.readdirSync(root).filter(f=>f.endsWith('.html')).sort(),loaded=new Set();for(const page of rootHtml){const html=fs.readFileSync(page,'utf8');for(const asset of getLoadedCssAssets(html,root))loaded.add(norm(asset));}function walk(dir,skip=new Set()){const out=[];if(!fs.existsSync(dir))return out;for(const ent of fs.readdirSync(dir,{withFileTypes:true})){if(ent.isDirectory()&&skip.has(ent.name))continue;const full=path.join(dir,ent.name);if(ent.isDirectory())out.push(...walk(full,skip));else out.push(norm(path.relative(root,full)));}return out;}const cssFiles=walk(path.join(root,'assets','css')).filter(f=>f.endsWith('.css'));const allFiles=walk(root,new Set(['node_modules','.git','archive','reports','test-results']));const jsFiles=allFiles.filter(f=>/\.(?:js|mjs|cjs)$/.test(f));const resolve=(from,raw)=>{const clean=String(raw||'').split('?')[0].split('#')[0];if(clean.startsWith('/'))return norm(clean);if(clean.startsWith('assets/'))return norm(clean);return norm(path.posix.normalize(path.posix.join(path.posix.dirname(from),clean)));};let htmlLinks=0,actualImporters=0,cssTextRefs=0;for(const page of rootHtml){const html=fs.readFileSync(page,'utf8');for(const m of html.matchAll(/<link\b[^>]*>/gi)){const tag=m[0],rel=(tag.match(/\brel\s*=\s*(["'])(.*?)\1/i)||[])[2]||'',href=(tag.match(/\bhref\s*=\s*(["'])(.*?)\1/i)||[])[2]||'';if(!rel.toLowerCase().split(/\s+/).includes('stylesheet')||!href||/^(?:https?:|data:|\/\/)/i.test(href))continue;if(resolve(page,href)===target)htmlLinks++;}}for(const file of cssFiles){const text=fs.readFileSync(file,'utf8');for(const m of text.matchAll(/@import\s+(?:url\(\s*)?(?:["']([^"']+)["']|([^\s;)]+))\s*\)?/gi)){const raw=m[1]||m[2];if(!raw||/^(?:https?:|data:|\/\/)/i.test(raw))continue;if(resolve(file,raw)===target)actualImporters++;}if(file!==target&&text.includes(target))cssTextRefs++;}const runtimeRefs=[],toolingRefs=[],otherRefs=[];for(const file of jsFiles){const text=fs.readFileSync(file,'utf8');if(!text.includes(target))continue;if(file.startsWith('assets/js/'))runtimeRefs.push(file);else if(file.startsWith('scripts/')||file.startsWith('tests/')||file.startsWith('test/')||file.startsWith('tools/'))toolingRefs.push(file);else otherRefs.push(file);}const active=loaded.has(target)?1:0;const wholeFileDormant=htmlLinks===0&&actualImporters===0&&runtimeRefs.length===0&&otherRefs.length===0&&cssTextRefs===0&&active===0?1:0;console.log(`CANONICAL REACH PASS|rootHtml=${rootHtml.length}|loadedCss=${loaded.size}|physicalCss=${cssFiles.length}|htmlLinks=${htmlLinks}|actualImporters=${actualImporters}|runtimeJsRefs=${runtimeRefs.length}|toolingJsRefs=${toolingRefs.length}|otherJsRefs=${otherRefs.length}|cssTextRefs=${cssTextRefs}|active=${active}|wholeFileDormant=${wholeFileDormant}|toolingRefs=${toolingRefs.sort().join(',')||'none'}`);if(!wholeFileDormant)process.exit(1);
          NODE
          node <<'NODE'
          const fs=require('fs');const target=process.env.TARGET_FILE;const reg=JSON.parse(fs.readFileSync('config/important-debt-register.json','utf8'));const item=reg.items.find(x=>x.file===target);if(!item)throw Error('unregistered target');if(item.importantCount!==341||item.maxAllowed!==341||item.group!=='page-responsive-contract'||item.risk!=='medium')throw Error(`register ${JSON.stringify(item)}`);const dormant=fs.readFileSync('docs/validation/css-dormant-debt-policy.md','utf8').includes('`'+target+'`');const deprecated=fs.readFileSync('docs/DEPRECATED-CSS.md','utf8').includes(target);if(!dormant||!deprecated)throw Error(`policy dormant=${dormant} deprecated=${deprecated}`);console.log(`POLICY PASS|dormantQuarantine=1|deprecatedDocumented=1|registered=1|risk=${item.risk}|group=${item.group}|important=${item.importantCount}`);
          NODE
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; grep -E '^(CANDIDATE PASS|CANONICAL REACH PASS|POLICY PASS)\|' /tmp/r.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 1000 /tmp/r.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 034 tablet safari layout reach r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
