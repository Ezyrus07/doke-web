name: UX CSS Important 035 Semantic Oracle Variance P9
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  probe035p9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      TARGET_FILE: assets/css/components/shell/doke-shell-contract.css
      TARGET_BLOB: c167c0b747dbb4465cdaf096b5a9225fa3d69059
      CANDIDATE_SHA256: fa114edbfe30797719983d9f599b4efb589dd89f57cd332ecb779bbe9b1b9845
      CANDIDATE_BLOB: 5000b0aa60f6d93e123bc17811887e57668d4988
      P8_FILE: .diagnostics/ux-css-important-035-semantic-visual-oracle-probe-p8.txt
      P8_BLOB: b2f652ecc4abcbef240347ea28fbe3677d6862d3
      RESULT_FILE: .diagnostics/ux-css-important-035-semantic-oracle-variance-p9.txt
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p9.log) 2>&1
          test "$(git rev-parse "HEAD:$P8_FILE")" = "$P8_BLOB"
          git show HEAD:"$P8_FILE" >/tmp/p8.txt
          grep -q '^RUN_ID=32486837469$' /tmp/p8.txt
          grep -q '^RESULT=FAIL$' /tmp/p8.txt
          grep -Fq 'SEMANTIC SUMMARY|pairs=6|semanticEqual=0/6|stableSides=12/12|parentSemanticUnique=6|candidateSemanticUnique=5' /tmp/p8.txt
          grep -Fq 'targetLoads=0/0|oracle=dom-layout-computed-style-pseudo' /tmp/p8.txt
          echo 'P8 TRANSFER PASS|within-page-stable=12/12|cross-context-variant=1|targetLoads=0/0|next=component-diff'
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          mkdir /tmp/parent-site /tmp/candidate-site
          git archive "$PARENT_SHA" | tar -x -C /tmp/parent-site
          git archive "$PARENT_SHA" | tar -x -C /tmp/candidate-site
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const p='/tmp/candidate-site/'+process.env.TARGET_FILE,s=fs.readFileSync(p,'utf8'),c=s.replace(/\s*!important\b/g,'');
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync(p,c);const blob=cp.execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          const before=(s.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          if(before!==2552||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          console.log(`CANDIDATE PASS|important=${before}->${after}|sha256=${h}|blob=${blob}|transform=marker-only`);
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/parent-site >/tmp/http-parent.log 2>&1 & echo $! >/tmp/http-parent.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/candidate-site >/tmp/http-candidate.log 2>&1 & echo $! >/tmp/http-candidate.pid
          trap 'kill $(cat /tmp/http-parent.pid 2>/dev/null) $(cat /tmp/http-candidate.pid 2>/dev/null) 2>/dev/null || true' EXIT
          for port in 4173 4174; do ok=0; for i in {1..30}; do if curl -fsS "http://127.0.0.1:$port/comunidade.html" >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1; done
          cat >/tmp/p9.js <<'NODE'
          const {chromium}=require('playwright');
          const targetPath='/assets/css/components/shell/doke-shell-contract.css';
          async function open(browser,port,label){const ctx=await browser.newContext({viewport:{width:820,height:1180},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Bahia',reducedMotion:'reduce'});await ctx.route('**/*',route=>{const u=new URL(route.request().url());return(u.hostname==='127.0.0.1'||u.hostname==='localhost')?route.continue():route.abort()});await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787263200000,RealDate=Date;class FixedDate extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}}globalThis.Date=FixedDate});const page=await ctx.newPage();let loads=0,errors=0;page.on('request',r=>{if(new URL(r.url()).pathname===targetPath)loads++});page.on('pageerror',()=>errors++);await page.goto(`http://127.0.0.1:${port}/comunidade.html`,{waitUntil:'networkidle',timeout:45000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForFunction(()=>[...document.images].every(i=>i.complete),null,{timeout:15000}).catch(()=>{});await page.evaluate(async()=>{await Promise.allSettled([...document.images].map(i=>typeof i.decode==='function'?i.decode():Promise.resolve()))});await page.waitForTimeout(900);if(loads||errors)throw Error(`${label} contract loads=${loads} errors=${errors}`);return{ctx,page,label,loads,errors}}
          async function summary(page){return page.evaluate(()=>{
            const norm=v=>String(v??'').replace(/https?:\/\/(?:127\.0\.0\.1|localhost):\d+/g,'<ORIGIN>');
            const h=s=>{let x=2166136261>>>0;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return x.toString(16).padStart(8,'0')+':'+s.length};
            const round=n=>Number.isFinite(n)?+n.toFixed(4):n;
            const style=(el,pseudo=null)=>{const cs=getComputedStyle(el,pseudo),a=[];for(const p of [...cs].sort())a.push([p,norm(cs.getPropertyValue(p))]);return a};
            const rows=[...document.querySelectorAll('*')].map((el,idx)=>{const r=el.getBoundingClientRect(),attrs=[...el.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0])),base=style(el),bc=getComputedStyle(el,'::before').content,ac=getComputedStyle(el,'::after').content,before=bc!=='none'?style(el,'::before'):null,after=ac!=='none'?style(el,'::after'):null,text=[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>norm(n.nodeValue)).join(''),geom=[round(r.x),round(r.y),round(r.width),round(r.height),round(r.right),round(r.bottom),el.clientWidth,el.clientHeight,el.scrollWidth,el.scrollHeight,el.scrollLeft,el.scrollTop],state={value:'value'in el?norm(el.value):null,checked:'checked'in el?!!el.checked:null,selected:'selected'in el?!!el.selected:null,disabled:'disabled'in el?!!el.disabled:null};return{idx,sig:`${el.tagName.toLowerCase()}#${el.id||''}.${String(el.className||'').replace(/\s+/g,'.').slice(0,180)}`,attrs,text,geom,state,attrsHash:h(JSON.stringify(attrs)),textHash:h(text),geomHash:h(JSON.stringify(geom)),stateHash:h(JSON.stringify(state)),styleHash:h(JSON.stringify(base)),beforeHash:h(JSON.stringify(before)),afterHash:h(JSON.stringify(after))}});
            const rootAttrs=[...document.documentElement.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0])),bodyAttrs=[...document.body.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0])),sheets=[...document.styleSheets].map(s=>{let rules=-1;try{rules=s.cssRules.length}catch{}return{href:s.href?norm(new URL(s.href,location.href).href):null,media:s.media?.mediaText||'',disabled:s.disabled,rules}});return{path:location.pathname,rootAttrs,bodyAttrs,sheets,rows};
          })}
          async function styleDetails(page,indices){return page.evaluate(indices=>{const norm=v=>String(v??'').replace(/https?:\/\/(?:127\.0\.0\.1|localhost):\d+/g,'<ORIGIN>'),all=[...document.querySelectorAll('*')],out={};for(const idx of indices){const el=all[idx];if(!el)continue;const get=pseudo=>{const cs=getComputedStyle(el,pseudo),o={};for(const p of [...cs].sort())o[p]=norm(cs.getPropertyValue(p));return o};out[idx]={base:get(null),before:getComputedStyle(el,'::before').content!=='none'?get('::before'):null,after:getComputedStyle(el,'::after').content!=='none'?get('::after'):null}}return out},indices)}
          function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
          function diffMaps(a,b,limit=30){const out=[];for(const k of [...new Set([...Object.keys(a||{}),...Object.keys(b||{})])].sort()){if((a||{})[k]!== (b||{})[k]){out.push(`${k}:${JSON.stringify((a||{})[k])}=>${JSON.stringify((b||{})[k])}`);if(out.length>=limit)break}}return out}
          function compare(name,a,b){const changed=[];for(let i=0;i<Math.min(a.rows.length,b.rows.length);i++){const x=a.rows[i],y=b.rows[i],parts=[];for(const k of ['attrsHash','textHash','geomHash','stateHash','styleHash','beforeHash','afterHash'])if(x[k]!==y[k])parts.push(k.replace('Hash',''));if(parts.length)changed.push({idx:i,sig:x.sig,parts})}console.log(`COMPARE|scope=${name}|rows=${a.rows.length}/${b.rows.length}|changedRows=${changed.length}|rootAttrsEqual=${eq(a.rootAttrs,b.rootAttrs)?1:0}|bodyAttrsEqual=${eq(a.bodyAttrs,b.bodyAttrs)?1:0}|sheetsEqual=${eq(a.sheets,b.sheets)?1:0}`);for(const d of changed.slice(0,40))console.log(`ROW DIFF|scope=${name}|idx=${d.idx}|sig=${d.sig}|parts=${d.parts.join(',')}`);return changed}
          (async()=>{const browser=await chromium.launch({headless:true});const pages=[];try{for(const [port,label] of [[4173,'P1'],[4173,'P2'],[4174,'C1'],[4174,'C2']])pages.push(await open(browser,port,label));const snaps=[];for(const p of pages)snaps.push(await summary(p.page));const pp=compare('P1-P2',snaps[0],snaps[1]),cc=compare('C1-C2',snaps[2],snaps[3]),pc=compare('P1-C1',snaps[0],snaps[2]);const styleIdx=[...new Set([...pp,...cc,...pc].filter(d=>d.parts.includes('style')||d.parts.includes('before')||d.parts.includes('after')).map(d=>d.idx))].slice(0,12);if(styleIdx.length){const pd=await styleDetails(pages[0].page,styleIdx),cd=await styleDetails(pages[2].page,styleIdx);for(const idx of styleIdx){const base=diffMaps(pd[idx]?.base,cd[idx]?.base,20),before=diffMaps(pd[idx]?.before,cd[idx]?.before,10),after=diffMaps(pd[idx]?.after,cd[idx]?.after,10);console.log(`STYLE DETAIL|idx=${idx}|base=${JSON.stringify(base)}|before=${JSON.stringify(before)}|after=${JSON.stringify(after)}`)}}for(const d of pc.filter(d=>d.parts.includes('attrs')).slice(0,20)){console.log(`ATTR DETAIL|idx=${d.idx}|parent=${JSON.stringify(snaps[0].rows[d.idx].attrs)}|candidate=${JSON.stringify(snaps[2].rows[d.idx].attrs)}`)}for(const d of pp.filter(d=>d.parts.includes('attrs')).slice(0,20)){console.log(`PARENT ATTR VAR|idx=${d.idx}|a=${JSON.stringify(snaps[0].rows[d.idx].attrs)}|b=${JSON.stringify(snaps[1].rows[d.idx].attrs)}`)}console.log(`PROBE RESULT|parentVariantRows=${pp.length}|candidateVariantRows=${cc.length}|parentCandidateRows=${pc.length}|originNormalized=1|targetLoads=0/0|criteriaRelaxed=0|classification=DIFF_COMPONENTS_CAPTURED`)}finally{for(const p of pages)await p.ctx.close().catch(()=>{});await browser.close().catch(()=>{})}})().catch(e=>{console.error('PROBE ERROR|'+(e?.stack||e));process.exit(1)})
          NODE
          timeout --signal=TERM --kill-after=20s 900s env NODE_PATH="$PWD/node_modules" node /tmp/p9.js
          echo 'RESTORE PASS|workspace=parent-untouched|candidate=tmp-only'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.probe.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROBE=${{ steps.probe.outcome }}"; grep -E '^(P8 TRANSFER PASS|CANDIDATE PASS|COMPARE|ROW DIFF|STYLE DETAIL|ATTR DETAIL|PARENT ATTR VAR|PROBE RESULT|PROBE ERROR|RESTORE PASS)' /tmp/p9.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 1600 /tmp/p9.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 035 semantic oracle variance p9 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
