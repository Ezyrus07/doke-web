name: UX CSS Important 022 Index Compact Reach R3
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  reach022:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: f611a1e80e96488ef9841200356253efd4172b63
      TARGET_FILE: assets/css/components/layout/index-compact-card-contract.css
      TARGET_BLOB: 47d3c3a08b9dd081d978483cc863949d7468e525
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-022-index-compact-reach-r3.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: reach
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/r.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-post-021-fresh-ranking-r2.txt >/tmp/rank.txt
          grep -q '^RESULT=PASS$' /tmp/rank.txt
          grep -Fq 'NEXT ELIGIBLE HIGH|important=130|file=assets/css/components/layout/index-compact-card-contract.css' /tmp/rank.txt
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l)" -eq 130
          echo 'TARGET PASS|important=130|blob=exact'
          echo 'TARGET REFERENCES BEGIN'
          git grep -n -F 'index-compact-card-contract.css' -- '*.html' 'assets/css/**/*.css' 'assets/js/**/*.js' || true
          echo 'TARGET REFERENCES END'
          echo 'IMPORTER CHAIN BEGIN'
          git grep -n -F 'marketplace-responsive-stack.css' -- '*.html' 'assets/css/**/*.css' 'assets/js/**/*.js' || true
          echo 'IMPORTER CHAIN END'
          refs="$(git grep -l -F 'index-compact-card-contract.css' -- '*.html' 'assets/css/**/*.css' 'assets/js/**/*.js' 2>/dev/null | wc -l)"
          imports="$(git grep -l -E '@import[^;]*index-compact-card-contract\.css' -- 'assets/css/**/*.css' 2>/dev/null | wc -l)"
          echo "REACH SUMMARY|textRefFiles=$refs|actualImporters=$imports"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.reach.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "REACH=${{ steps.reach.outcome }}"; cat /tmp/r.log; echo "RESULT=$result"; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 022 index compact reach r3 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
