name: UX CSS Important 013 Dormant Home Visual R3
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  proof013:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c4b69ea11e1298c91a713f5644943970435c3b08
      TARGET_FILE: assets/css/pages/home/mobile-hero-feed.css
      TARGET_BLOB: 64b24654608164efb6803f3571259c776fb34ab3
      TARGET_SHA256: a319f97dc53e3fc53d7ca569deaef239f074c2ca78a4e8dd908a3d99f208b791
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-013-dormant-home-visual-r3.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$(git rev-parse "$TARGET_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l)" -eq 153
          git show HEAD:.diagnostics/ux-css-important-013-runtime-inventory-r2.txt >/tmp/inventory.txt
          grep -q '^RESULT=PASS$' /tmp/inventory.txt
          grep -Fq 'avatarMax=0|locationDotMax=0|notificationMax=0|filterButtonMax=0|topMax=0|identityMax=0|quickActionsMax=0|locationLabelMax=0|pageErrors=0' /tmp/inventory.txt
          grep -Fq 'SOURCE PASS|runtimeProducerHits=0|scope=html+assets/js|testScriptsExcluded=1' /tmp/inventory.txt
          echo 'PREFLIGHT PASS|parent=012|inventory=pass|runtimeNodes=0|runtimeProducerHits=0|targetImportant=153'
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8'),removed=0,rules=0;
          const selectors=new Set([
            'html.home-index-root body.home-index-shell .home-mobile-hero__avatar',
            'html.home-index-root body.home-index-shell .home-mobile-hero__location-dot',
            'html.home-index-root body.home-index-shell .home-mobile-hero__notification',
            'html.home-index-root body.home-index-shell .home-search-hero__filter-button',
            'html.home-index-root body.home-index-shell .home-mobile-hero__top',
            'html.home-index-root body.home-index-shell .home-mobile-hero__identity strong',
            'html.home-index-root body.home-index-shell .home-mobile-hero__quick-actions',
            'html.home-index-root body.home-index-shell .home-mobile-hero__location-label'
          ]);
          if((s.match(/!important\b/g)||[]).length!==153)throw Error('parent important');
          s=s.replace(/([^{}]+)\{([^{}]*)\}/g,(all,head,body)=>{if(!selectors.has(head.trim()))return all;const n=(body.match(/!important\b/g)||[]).length;if(!n)return all;removed+=n;rules++;return head+'{'+body.replace(/\s*!important\b/g,'')+'}'});
          const important=(s.match(/!important\b/g)||[]).length,buf=Buffer.from(s),sha=crypto.createHash('sha256').update(buf).digest('hex');
          if(removed!==25||rules!==12||important!==128)throw Error(`candidate ${removed}/${rules}/${important}`);
          fs.writeFileSync('/tmp/candidate.css',s);console.log(`CANDIDATE IDENTITY|sha256=${sha}|bytes=${buf.length}|important=153->128|priorityMarkersRemoved=25|rules=12|selectors=8|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|family=home-mobile-dormant-runtime`);
          NODE
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/candidate.css','utf8'),browser=await chromium.launch({headless:true}),widths=[359,379,380,381,390,430,560,561],filters=new Set([359,380,390,560]),H=b=>crypto.createHash('sha256').update(b).digest('hex');
          const dormant=['.home-mobile-hero__avatar','.home-mobile-hero__location-dot','.home-mobile-hero__notification','.home-search-hero__filter-button','.home-mobile-hero__top','.home-mobile-hero__identity','.home-mobile-hero__quick-actions','.home-mobile-hero__location-label'];
          const items=Array.from({length:8},(_,i)=>({id:'c13-'+i,serviceId:'c13-'+i,status:'active',title:'Servico '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'p'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));for(const host of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**','https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(host,r=>r.fulfill({status:200,body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.goto(`http://127.0.0.1:4173/index.html?c13=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');if(!a||!b)throw Error('grids');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(window.Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(window.Doke.publicServiceCard.create(x,{results:true})))},items);if(state==='filters'){await p.waitForFunction(()=>Boolean(window.DokeHomeFiltersApi?.open),null,{timeout:7000});await p.evaluate(()=>window.DokeHomeFiltersApi.open('tabs'));await p.waitForFunction(()=>document.body.classList.contains('home-filter-sheet-open'),null,{timeout:4000})}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(dormant=>({dormantNodes:dormant.reduce((n,s)=>n+document.querySelectorAll(s).length,0),cards:document.querySelectorAll('.doke-ad-card').length,workers:document.querySelectorAll('.video-card').length,filterOpen:document.body.classList.contains('home-filter-sheet-open')}),dormant);if(data.dormantNodes)throw Error('dormant materialized '+JSON.stringify(data));if(data.cards<8||data.workers<6)throw Error('anatomy '+JSON.stringify(data));if(state==='filters'&&!data.filterOpen)throw Error('filter');const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
          const states=[];for(const w of widths){states.push([w,'default']);if(filters.has(w))states.push([w,'filters'])}const A={},B={};fs.writeFileSync(f,P);for(const [w,s]of states)A[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,C);for(const [w,s]of states)B[`${w}-${s}`]=await cap(w,s,'candidate');let md=0,sd=0,pe=0;const d=[];for(const k of Object.keys(A)){pe+=A[k].errs.length+B[k].errs.length;if(JSON.stringify(A[k].data)!==JSON.stringify(B[k].data)){md++;d.push('meta:'+k)}if(A[k].png!==B[k].png){sd++;d.push('png:'+k)}}console.log(`CANDIDATE PARITY|states=${states.length}|viewports=${widths.join(',')}|realFilterStates=${filters.size}|metadataDiffs=${md}|screenshotDiffs=${sd}|pageErrors=${pe}|dormantNodesParent=0|dormantNodesCandidate=0|productRenderer=1|syntheticDOM=0|criteriaRelaxed=0|diffKeys=${d.join(',')}`);if(md||sd||pe)throw Error('parity '+d.join(','));await browser.close();fs.writeFileSync(f,P)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"
          git diff --exit-code -- "$TARGET_FILE"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$TARGET_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROOF=${{ steps.proof.outcome }}"; grep -E '^(PREFLIGHT PASS|CANDIDATE IDENTITY|CANDIDATE PARITY)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 280 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"; git commit -m 'diag: publish 013 dormant home visual r3 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
