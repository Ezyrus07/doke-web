name: UX CSS Important 034 Tablet Safari Layout Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote034:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 79b2820ba35e89ea066e90468d801908d5ea56f0
      TARGET_FILE: assets/css/pages/home/tablet-safari-layout.css
      TARGET_BLOB: 74d2ddc5292edbeaf4629d4f43118c8d5e6f676b
      CANDIDATE_SHA256: 78658fe4802c3ebeb9463842c9f39d0be36835b95510f70fa1f28c8f443120c4
      CANDIDATE_BLOB: ca0a440fd3fcbaa3767d7d8a53becf052fde1de0
      REACH_FILE: .diagnostics/ux-css-important-034-tablet-safari-layout-reach-r1.txt
      REACH_BLOB: 0cf0956ff45e9ec1a458295631e889ceb12b7759
      BROWSER_FILE: .diagnostics/ux-css-important-034-tablet-safari-layout-browser-r2.txt
      BROWSER_BLOB: f8b660a4f574113287aeb33747de699075c91e1d
      GOV_FILE: .diagnostics/ux-css-important-034-tablet-safari-layout-governance-r3.txt
      GOV_BLOB: 89d787d8edad5bcd811a1bb8d48e4a3db36556dd
      PERM_BRANCH: ux/ux-css-important-034-tablet-safari-layout-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-034-tablet-safari-layout-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1
          test "$(git rev-parse "HEAD:$REACH_FILE")" = "$REACH_BLOB"
          test "$(git rev-parse "HEAD:$BROWSER_FILE")" = "$BROWSER_BLOB"
          test "$(git rev-parse "HEAD:$GOV_FILE")" = "$GOV_BLOB"
          git show HEAD:"$REACH_FILE" >/tmp/reach.txt; git show HEAD:"$BROWSER_FILE" >/tmp/browser.txt; git show HEAD:"$GOV_FILE" >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -q '^RESULT=PASS$' /tmp/gov.txt
          grep -Fq "CANDIDATE PASS|bytes=102236|important=341->0|removed=341|sha256=$CANDIDATE_SHA256|blob=$CANDIDATE_BLOB|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0" /tmp/reach.txt
          grep -Fq 'BROWSER PASS|' /tmp/browser.txt; grep -Fq 'GOVERNANCE PASS|' /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout -B product "refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');const o=fs.readFileSync(process.env.TARGET_FILE,'utf8'),c=o.replace(/\s*!important\b/g,'');const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync('/tmp/candidate.css',c);const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();if(before!==341||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`candidate ${before}/${after}/${h}/${blob}`);fs.writeFileSync(process.env.TARGET_FILE,c);console.log(`CANDIDATE MATERIALIZATION PASS|sha256=${h}|blob=${blob}|bytes=${Buffer.byteLength(c)}|important=341->0|markerOnly=1|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          git diff --check; test "$(git diff --name-only | wc -l)" -eq 1; test "$(git diff --name-only)" = "$TARGET_FILE"
          num="$(git diff --numstat -- "$TARGET_FILE")"; add="$(printf '%s' "$num"|cut -f1)"; del="$(printf '%s' "$num"|cut -f2)"; test "$add" = 341; test "$del" = 341
          git config user.name Ezyrus07; git config user.email 239011076+Ezyrus07@users.noreply.github.com
          git add -- "$TARGET_FILE"; test "$(git diff --cached --name-only | wc -l)" -eq 1; test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-034: remove dormant tablet Safari layout priorities' >/dev/null
          head="$(git rev-parse HEAD)"; tree="$(git rev-parse HEAD^{tree})"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$CANDIDATE_BLOB"; test "$(git rev-list --count "$PARENT_SHA..HEAD")" -eq 1; test "$(git diff --name-only "$PARENT_SHA" HEAD | wc -l)" -eq 1; test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          echo "PRODUCT COMMIT PASS|head=$head|tree=$tree|parent=$PARENT_SHA|blob=$CANDIDATE_BLOB|files=1|additions=$add|deletions=$del|markerDelta=341|markerOnly=1"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null; test "$(git ls-remote origin "refs/heads/$PERM_BRANCH" | cut -f1)" = "$head"
          echo "PRODUCT PUSH PASS|branch=$PERM_BRANCH|head=$head|force=0"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { grep -E '^(CANDIDATE MATERIALIZATION PASS|PRODUCT COMMIT PASS|PRODUCT PUSH PASS)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 800 /tmp/p.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -- "$RESULT_FILE"; git commit -m 'diag: publish 034 tablet safari layout promotion [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
