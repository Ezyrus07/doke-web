            const links=[...document.head.querySelectorAll('link')],isDynamic=l=>l.hasAttribute('data-doke-route-preload')||l.hasAttribute('data-doke-stable-route-style')||l.hasAttribute('data-doke-route-style-pending'),attrs=l=>[...l.attributes].map(a=>[a.name,norm(a.value)]).sort((a,b)=>a[0].localeCompare(b[0])),activeLink=l=>l.rel==='stylesheet'&&!l.disabled&&(!(l.media||'').trim()||(l.media||'').trim()==='all'||matchMedia(l.media).matches);
            const dynamicActive=links.filter(l=>isDynamic(l)&&activeLink(l)).map(attrs),dynamicInactive=links.filter(l=>isDynamic(l)&&!activeLink(l)).map(attrs).map(x=>JSON.stringify(x)).sort(),staticOrdered=links.filter(l=>!isDynamic(l)).map(attrs);
            const sheets=[...document.styleSheets].map(s=>{let rules=-1;try{rules=s.cssRules.length}catch{}const media=s.media?.mediaText||'',active=!s.disabled&&(!media||media==='all'||matchMedia(media).matches);return{href:s.href?norm(new URL(s.href,location.href).href):null,media,disabled:s.disabled,rules,active}}),activeSheets=sheets.filter(s=>s.active),inactiveSheets=sheets.filter(s=>!s.active).map(x=>JSON.stringify(x)).sort();
            const styles=[...document.head.querySelectorAll('style')].map(s=>norm(s.textContent||''));
            return{title:document.title,bodyHash,bodyRows:bodyRows.length,rootAttrs,bodyAttrs,dynamicActiveHash:await sha(dynamicActive),dynamicActiveCount:dynamicActive.length,dynamicInactiveHash:await sha(dynamicInactive),dynamicInactiveCount:dynamicInactive.length,staticHash:await sha(staticOrdered),staticCount:staticOrdered.length,activeSheetsHash:await sha(activeSheets),activeSheetsCount:activeSheets.length,inactiveSheetsHash:await sha(inactiveSheets),inactiveSheetsCount:inactiveSheets.length,styleTagsHash:await sha(styles),styleTagsCount:styles.length};
          })}
