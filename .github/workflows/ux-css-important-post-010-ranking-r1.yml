name: UX CSS Important 023 App Mobile Search Visual R7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  visual023r7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: c469ab875b43f37753e660b2ac7c424f7a6f841e
      TARGET_FILE: assets/css/components/navigation/app-mobile-search.css
      TARGET_BLOB: de0178f27e9ad535acf1b00eae0e59382d14061e
      CANDIDATE_SHA256: 2431b9916decc1845f7d837bdb05b64a8f863e3b113aa32471a22571a8d48f85
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-023-app-mobile-search-visual-r7.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: visual
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/v.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null; test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts >/dev/null; npx playwright install chromium >/dev/null
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,o=fs.readFileSync(f,'utf8'),c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');if(h!==process.env.CANDIDATE_SHA256)throw Error(h);fs.writeFileSync('/tmp/candidate.css',c);fs.writeFileSync('/tmp/parent.css',o);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 & echo $! >/tmp/server.pid; sleep 1
          cat >/tmp/render023r7.js <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');const pages=['index.html','resultados.html'],widths=[359,390,430,560,600,760,761],modes=['base','focus'];const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function setup(page){page.on('request',r=>{if(r.url().includes('app-mobile-search.css'))page.__loads=(page.__loads||0)+1});await page.addInitScript(()=>{let x=0x12345678;const next=()=>((x=(1664525*x+1013904223)>>>0)/4294967296);Math.random=next;try{crypto.getRandomValues=(a)=>{for(let i=0;i<a.length;i++)a[i]=Math.floor(next()*256);return a}}catch{}});await page.route('**/*',async route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();return route.fulfill({status:204,body:''});});}
          async function settle(page){await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}html{scroll-behavior:auto!important}::-webkit-scrollbar{width:0!important;height:0!important}'});await page.evaluate(async()=>{if(document.fonts?.ready)await document.fonts.ready;});await page.waitForTimeout(180);}
          async function phase(label){const browser=await chromium.launch({headless:true});const out=[];let loads=0,errors=0,searchStates=0,warmups=0;for(const pageName of pages)for(const width of widths){const warm=await browser.newPage({viewport:{width,height:900}});await setup(warm);warm.on('pageerror',()=>errors++);await warm.goto(`http://127.0.0.1:4173/${pageName}`,{waitUntil:'domcontentloaded',timeout:30000});await settle(warm);await warm.screenshot({fullPage:true});loads+=warm.__loads||0;warmups++;await warm.close();for(const mode of modes){const page=await browser.newPage({viewport:{width,height:900}});await setup(page);page.on('pageerror',()=>errors++);await page.goto(`http://127.0.0.1:4173/${pageName}`,{waitUntil:'domcontentloaded',timeout:30000});await settle(page);const input=page.locator('.app-mobile-search__input'),exists=await input.count()>0;if(mode==='focus'&&exists){await input.first().focus();await page.waitForTimeout(50);}if(exists)searchStates++;const meta=await page.evaluate(({pageName,width,mode})=>({pageName,width,mode,scroll:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],body:[document.body.scrollWidth,document.body.scrollHeight],targetDom:document.querySelectorAll('[class*="app-mobile-search"]').length,active:document.activeElement?.className||''}),{pageName,width,mode});const shot=hash(await page.screenshot({fullPage:true}));const tl=page.__loads||0;loads+=tl;out.push({key:`${pageName}@${width}:${mode}`,meta,shot,targetLoads:tl});await page.close();}}await browser.close();console.log(`PHASE|label=${label}|states=${out.length}|warmups=${warmups}|pageErrors=${errors}|targetStylesheetLoads=${loads}|searchStates=${searchStates}`);return{out,loads,errors,searchStates,warmups};}
          (async()=>{const p=await phase('parent');fs.writeFileSync(process.env.TARGET_FILE,fs.readFileSync('/tmp/candidate.css'));const c=await phase('candidate');const pm=new Map(p.out.map(x=>[x.key,x])),cm=new Map(c.out.map(x=>[x.key,x]));let md=0,sd=0,ld=0;const diffs=[];for(const[k,a]of pm){const b=cm.get(k);if(JSON.stringify(a.meta)!==JSON.stringify(b.meta)){md++;diffs.push(`META:${k}`)}if(a.shot!==b.shot){sd++;diffs.push(`SHOT:${k}`)}if(a.targetLoads!==b.targetLoads){ld++;diffs.push(`LOAD:${k}`)}}fs.writeFileSync(process.env.TARGET_FILE,fs.readFileSync('/tmp/parent.css'));for(const d of diffs)console.log(`DIFF STATE|key=${d}`);console.log(`BROWSER PASS|sha256=${process.env.CANDIDATE_SHA256}|states=${p.out.length}|warmups=${p.warmups}/${c.warmups}|pages=2|viewports=${widths.join(',')}|modes=${modes.join(',')}|metadataDiffs=${md}|screenshotDiffs=${sd}|loadedStateDiffs=${ld}|pageErrors=${p.errors+c.errors}|targetStylesheetLoads=${p.loads}/${c.loads}|searchStates=${p.searchStates}/${c.searchStates}|syntheticDOM=0|criteriaRelaxed=0|warmupRaster=1`);if(md||sd||ld||p.errors||c.errors||p.loads||c.loads)process.exit(2);})().catch(e=>{console.error(e);process.exit(3)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/render023r7.js
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; test -f /tmp/parent.css && cp /tmp/parent.css "$TARGET_FILE" || true; test -f /tmp/server.pid && kill "$(cat /tmp/server.pid)" 2>/dev/null || true; result=FAIL; if test '${{ steps.visual.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROOF=${{ steps.visual.outcome }}"; echo 'R4_NOTE=three-screenshot-only-diffs'; echo 'R6_NOTE=two-first-render-761px-screenshot-only-diffs; warmup indicated'; grep -E '^(PHASE|DIFF STATE|BROWSER PASS)\|' /tmp/v.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 650 /tmp/v.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 023 app mobile search visual r7 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
