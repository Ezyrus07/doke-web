name: UX CSS Important 014 Marketplace Contract Promotion R7
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  promote014:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 28877228c2cbf0478b7a0202d9bde786da14cdd4
      TARGET_FILE: assets/css/components/shell/marketplace-page-contract.css
      PARENT_BLOB: c6d0b3b9ffa9e30e1fca815ab1dbe3d607c4dcaa
      CANDIDATE_SHA256: 3e53813d15d725c1f7609ab4e7800cf2fe78e587c034c08b84ba1bb639e30ae6
      PERM_BRANCH: ux/ux-css-important-014-marketplace-contract-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-014-marketplace-contract-promotion-r7.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/promote.log) 2>&1
          git show HEAD:.diagnostics/ux-css-important-014-marketplace-contract-reach-r3.txt >/tmp/reach.txt
          git show HEAD:.diagnostics/ux-css-important-014-marketplace-contract-visual-r4.txt >/tmp/browser.txt
          git show HEAD:.diagnostics/ux-css-important-014-marketplace-contract-governance-r6.txt >/tmp/gov.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt; grep -Fq 'targetReachable=0|jsRefs=0|runtimeTextRefs=0' /tmp/reach.txt; grep -q "sha256=$CANDIDATE_SHA256" /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/browser.txt; grep -q "sha256=$CANDIDATE_SHA256" /tmp/browser.txt; grep -Fq 'metadataDiffs=0|screenshotDiffs=0|pageErrors=0|targetStylesheetLoads=0' /tmp/browser.txt
          grep -q '^RESULT=PASS$' /tmp/gov.txt; grep -q "candidateHash=$CANDIDATE_SHA256" /tmp/gov.txt; grep -Fq 'IMPORTANT PASS|total=10966|outsideServiceCard=10904|files=33|delta=-104' /tmp/gov.txt
          git fetch origin "refs/heads/$PERM_BRANCH:refs/remotes/origin/$PERM_BRANCH" >/dev/null
          test "$(git rev-parse refs/remotes/origin/$PERM_BRANCH)" = "$PARENT_SHA"
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l)" -eq 104
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8'),before=(s.match(/!important\b/g)||[]).length;s=s.replace(/\s*!important\b/g,'');const buf=Buffer.from(s),h=crypto.createHash('sha256').update(buf).digest('hex'),after=(s.match(/!important\b/g)||[]).length;if(before!==104||after!==0||h!==process.env.CANDIDATE_SHA256)throw Error(`candidate ${before}/${after}/${h}`);fs.writeFileSync(f,s);console.log(`CANDIDATE|sha256=${h}|bytes=${buf.length}|important=104->0|removed=104|declarationsRemoved=0|selectorsRemoved=0|valuesChanged=0|wholeFileDormant=1`)
          NODE
          git config user.name Ezyrus07
          git config user.email 239011076+Ezyrus07@users.noreply.github.com
          git add "$TARGET_FILE"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-014 remove dormant marketplace contract priorities' >/dev/null
          HEAD_SHA=$(git rev-parse HEAD); test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          TREE=$(git rev-parse 'HEAD^{tree}'); BLOB=$(git rev-parse "HEAD:$TARGET_FILE")
          test "$(git diff --name-only "$PARENT_SHA" HEAD | wc -l)" -eq 1; test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          NUM=$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE"); echo "NUMSTAT|$NUM"
          git push origin "HEAD:refs/heads/$PERM_BRANCH" --force-with-lease="refs/heads/$PERM_BRANCH:$PARENT_SHA" >/dev/null
          test "$(git ls-remote origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')" = "$HEAD_SHA"
          echo "PROMOTION PASS|head=$HEAD_SHA|parent=$PARENT_SHA|tree=$TREE|blob=$BLOB|files=1|numstat=$(echo "$NUM" | tr '\t' '/')|leaseParent=$PARENT_SHA"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PERM_BRANCH=$PERM_BRANCH"; echo "PROMOTE=${{ steps.promote.outcome }}"; grep -E '^(CANDIDATE|NUMSTAT|PROMOTION PASS)\|' /tmp/promote.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 300 /tmp/promote.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 014 marketplace contract promotion r7 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
