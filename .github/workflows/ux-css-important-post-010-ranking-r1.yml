name: UX CSS Important 024 Tablet Shell Rail Visual R5
on:
  push:
    branches: [diag/ux-css-important-post-010-ranking-r1]
permissions: {contents: write}
jobs:
  visual024:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d9a831502ace23490f500c0b50f889409353dfb1
      TARGET_FILE: assets/css/pages/home/tablet-shell-rail.css
      TARGET_BLOB: 0154f918cd7946a045126b6b6978f43ab39724b6
      CANDIDATE_SHA256: 593fecb1bfd372d29088ba2726cba3f80ea949b94922fe09ea9003f6d019abf6
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-024-tablet-shell-rail-visual-r5.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/v.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$TARGET_BLOB"
          cp "$TARGET_FILE" /tmp/parent.css
          trap 'cp /tmp/parent.css "$TARGET_FILE" 2>/dev/null || true; kill $(cat /tmp/http.pid 2>/dev/null) 2>/dev/null || true' EXIT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),o=fs.readFileSync(process.env.TARGET_FILE,'utf8'),c=o.replace(/\s*!important\b/g,''),h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');if((o.match(/!important\b/g)||[]).length!==154||(c.match(/!important\b/g)||[]).length!==0||h!==process.env.CANDIDATE_SHA256)throw Error(h);fs.writeFileSync('/tmp/candidate.css',c);console.log(`CANDIDATE PASS|sha256=${h}|important=154->0`)
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          ok=0; for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1
          cat >/tmp/proof.js <<'NODE'
          const {chromium}=require('playwright'),crypto=require('crypto'),fs=require('fs');
          const cases=[{w:560,h:1000,key:'560p'},{w:561,h:1000,key:'561p'},{w:760,h:1000,key:'760p'},{w:761,h:1000,key:'761p'},{w:1024,h:1366,key:'1024p'},{w:1025,h:1366,key:'1025p'},{w:1179,h:820,key:'1179l'},{w:1180,h:820,key:'1180l'},{w:1181,h:820,key:'1181l'}];
          const target='tablet-shell-rail.css',hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const metaFn=()=>{const q=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect(),cs=getComputedStyle(e);return{x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2),display:cs.display,position:cs.position,visibility:cs.visibility,overflowX:cs.overflowX}};return{vw:innerWidth,vh:innerHeight,html:document.documentElement.className,body:document.body.className,shell:q('.app-shell'),page:q('.page'),header:q('header.app-header'),content:q('.page__content'),workspace:q('.page__content-inner'),sidebar:q('.sidebar'),renderer:!!(globalThis.Doke?.publicServiceCard?.create)}};
          async function stableMeta(page){let prev='';for(let i=0;i<8;i++){const m=await page.evaluate(metaFn),s=JSON.stringify(m);if(s===prev)return m;prev=s;await page.waitForTimeout(350);}return await page.evaluate(metaFn)}
          async function phase(label){const browser=await chromium.launch({headless:true});const out={};let loads=0,errs=0,renderer=0,stable=0;
            for(const c of cases){const ctx=await browser.newContext({viewport:{width:c.w,height:c.h},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Sao_Paulo',reducedMotion:'reduce'});await ctx.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();return route.abort();});await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);});const page=await ctx.newPage();page.on('pageerror',()=>errs++);page.on('request',r=>{if(r.url().includes(target))loads++});await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForTimeout(700);const meta=await stableMeta(page);const m2=await page.evaluate(metaFn);if(JSON.stringify(meta)===JSON.stringify(m2))stable++;if(meta.renderer)renderer++;await page.screenshot({fullPage:true});await page.waitForTimeout(250);const shot=await page.screenshot({fullPage:true});out[c.key]={meta,shot:hash(shot)};await ctx.close();}
            await browser.close();console.log(`PHASE|label=${label}|states=${cases.length}|stableStates=${stable}|pageErrors=${errs}|targetStylesheetLoads=${loads}|rendererStates=${renderer}`);return{out,loads,errs,renderer,stable};}
          (async()=>{const p=await phase(process.argv[2]);fs.writeFileSync(process.argv[3],JSON.stringify(p));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/proof.js parent /tmp/parent.json
          cp /tmp/candidate.css "$TARGET_FILE"
          NODE_PATH="$PWD/node_modules" node /tmp/proof.js candidate /tmp/candidate.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent.json')),b=JSON.parse(fs.readFileSync('/tmp/candidate.json'));let md=0,sd=0;for(const k of Object.keys(a.out)){if(JSON.stringify(a.out[k].meta)!==JSON.stringify(b.out[k].meta)){md++;console.log(`META DIFF|state=${k}`)}if(a.out[k].shot!==b.out[k].shot){sd++;console.log(`SHOT DIFF|state=${k}`)}}console.log(`BROWSER PASS|sha256=${process.env.CANDIDATE_SHA256}|states=${Object.keys(a.out).length}|viewports=560p,561p,760p,761p,1024p,1025p,1179l,1180l,1181l|metadataDiffs=${md}|screenshotDiffs=${sd}|stableStates=${a.stable}/${b.stable}|pageErrors=${a.errs+b.errs}|targetStylesheetLoads=${a.loads}/${b.loads}|rendererStates=${a.renderer}/${b.renderer}|syntheticDOM=0|criteriaRelaxed=0|externalResourcesBlocked=1|animationsDisabled=1`);if(md||sd||a.errs||b.errs||a.loads||b.loads||a.renderer!==9||b.renderer!==9||a.stable!==9||b.stable!==9)process.exit(1)
          NODE
          cp /tmp/parent.css "$TARGET_FILE"; cmp -s /tmp/parent.css "$TARGET_FILE"; echo 'RESTORE PASS|target=parent-exact'
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "PROOF=${{ steps.proof.outcome }}"; echo 'R4_NOTE=target-unloaded-zero-errors-but-dynamic-home-state-produced-seven-diffs'; grep -E '^(CANDIDATE PASS|PHASE|META DIFF|SHOT DIFF|BROWSER PASS|RESTORE PASS)\|' /tmp/v.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 800 /tmp/v.log || true; fi; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 024 tablet shell rail visual r5 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
