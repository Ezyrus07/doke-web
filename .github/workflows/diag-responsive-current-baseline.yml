name: Doke Responsive Debt Current Baseline

on:
  push:
    branches:
      - diag/ux-responsive-debt-current-baseline
    paths:
      - '.github/workflows/diag-responsive-current-baseline.yml'

permissions:
  contents: read

jobs:
  responsive-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate canonical responsive baseline
        run: node scripts/generate-responsive-index-baseline.js

      - name: Run current responsive contract and preserve result
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test -f reports/responsive-contract-test-report.json
          echo "responsive_contract_exit=${STATUS}"

      - name: Print current failure classification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json', 'utf8'));
          const countBy = (items, keyFn) => {
            const out = {};
            for (const item of items) {
              const key = keyFn(item);
              out[key] = (out[key] || 0) + 1;
            }
            return Object.entries(out).sort((a, b) => b[1] - a[1]);
          };
          console.log('[responsive-debt-current] status=' + report.status);
          console.log('[responsive-debt-current] checks=' + report.summary.checks);
          console.log('[responsive-debt-current] failures=' + report.summary.failures);
          console.log('[responsive-debt-current] skips=' + report.summary.skips);
          console.log('[responsive-debt-current] failures_by_page=' + JSON.stringify(countBy(report.failures, (x) => x.page)));
          console.log('[responsive-debt-current] failures_by_component=' + JSON.stringify(countBy(report.failures, (x) => x.component)));
          console.log('[responsive-debt-current] failures_by_breakpoint=' + JSON.stringify(countBy(report.failures, (x) => x.breakpoint)));
          NODE

      - name: Prove current manifest loader drops imported CSS
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('@playwright/test');
          const root = process.cwd();
          function loadHtml(pageFile) {
            let html = fs.readFileSync(path.join(root, pageFile), 'utf8');
            html = html.replace(/<link\b([^>]*?)rel=["']stylesheet["']([^>]*?)>/gi, (tag) => {
              const m = tag.match(/href=["']([^"']+)["']/i);
              if (!m) return tag;
              const href = m[1].split('?')[0];
              if (/^(https?:)?\/\//i.test(href)) return '';
              const cssPath = path.join(root, href);
              if (!fs.existsSync(cssPath)) return '';
              return `<style data-source-css="${href}">\n${fs.readFileSync(cssPath, 'utf8')}\n</style>`;
            });
            html = html.replace(/<script\b[^>]*\bsrc=["'][^"']+["'][^>]*><\/script>/gi, '');
            return html.replace(/<head([^>]*)>/i, `<head$1><base href="file://${root.replace(/\\/g, '/')}/">`);
          }
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const context = await browser.newContext({ viewport: { width: 1366, height: 768 }, javaScriptEnabled: false });
            const page = await context.newPage();
            await page.setContent(loadHtml('detalhe-anuncio.html'), { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(300);
            const result = await page.evaluate(() => {
              const selectors = ['.app-header.app-header--detail', '.app-header__inner', '.home-side-meta__search', '.detail-standard-topbar__back', '.home-side-meta__profile'];
              const data = {};
              for (const selector of selectors) {
                const el = document.querySelector(selector);
                const rect = el?.getBoundingClientRect();
                data[selector] = el ? { box: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }, display: getComputedStyle(el).display } : null;
              }
              let matchedHeaderRules = 0;
              for (const sheet of document.styleSheets) {
                try {
                  for (const rule of sheet.cssRules) {
                    if (rule.type === CSSRule.STYLE_RULE && document.querySelector('.app-header.app-header--detail')?.matches(rule.selectorText)) matchedHeaderRules += 1;
                  }
                } catch (_) {}
              }
              return { data, matchedHeaderRules };
            });
            console.log('[responsive-loader-proof] ' + JSON.stringify(result));
            if (result.matchedHeaderRules !== 0) throw new Error('expected current harness to expose zero direct matched header rules for manifest-only entrypoint');
            await browser.close();
          })();
          NODE

      - name: Expand local CSS imports in workspace only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd().resolve()
          css_root = (root / 'assets' / 'css').resolve()
          html_files = [
              'index.html', 'detalhe-anuncio.html', 'perfil.html', 'resultados.html',
              'pedidos.html', 'mensagens.html', 'notificacoes.html', 'comunidade.html',
              'carteira.html', 'ajuda.html'
          ]
          originals = {p.resolve(): p.read_text(encoding='utf-8') for p in css_root.rglob('*.css')}
          import_re = re.compile(r'@import\s+url\(\s*["\']?([^"\')]+)["\']?\s*\)\s*;')
          link_re = re.compile(r'<link\b[^>]*\brel=["\']stylesheet["\'][^>]*>', re.I)
          href_re = re.compile(r'href=["\']([^"\']+)["\']', re.I)
          memo = {}

          def expand(path, stack=()):
              path = path.resolve()
              if path in memo:
                  return memo[path]
              if path in stack:
                  raise RuntimeError('CSS import cycle: ' + ' -> '.join(str(x) for x in stack + (path,)))
              text = originals.get(path)
              if text is None:
                  raise RuntimeError(f'missing CSS import source: {path}')
              def repl(match):
                  href = match.group(1)
                  clean = href.split('?', 1)[0].split('#', 1)[0]
                  if clean.startswith(('http://', 'https://', '//')):
                      return match.group(0)
                  child = (path.parent / clean).resolve()
                  if css_root not in child.parents and child != css_root:
                      raise RuntimeError(f'import escapes assets/css: {href} from {path}')
                  return f'/* diag import start: {href} */\n{expand(child, stack + (path,))}\n/* diag import end: {href} */'
              result = import_re.sub(repl, text)
              memo[path] = result
              return result

          entrypoints = set()
          for html_name in html_files:
              html = (root / html_name).read_text(encoding='utf-8')
              for tag in link_re.findall(html):
                  m = href_re.search(tag)
                  if not m:
                      continue
                  href = m.group(1).split('?', 1)[0].split('#', 1)[0]
                  if href.startswith(('http://', 'https://', '//')):
                      continue
                  p = (root / href).resolve()
                  if p.suffix == '.css' and p.exists():
                      entrypoints.add(p)

          for p in sorted(entrypoints):
              p.write_text(expand(p), encoding='utf-8')
          print('[responsive-import-expansion] entrypoints=' + str(len(entrypoints)))
          print('[responsive-import-expansion] files=' + ','.join(str(p.relative_to(root)) for p in sorted(entrypoints)))
          PY

      - name: Regenerate baseline with recursively expanded CSS
        run: node scripts/generate-responsive-index-baseline.js

      - name: Run responsive contract with recursively expanded CSS
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test -f reports/responsive-contract-test-report.json
          echo "expanded_responsive_contract_exit=${STATUS}"

      - name: Print expanded-import failure classification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json', 'utf8'));
          const countBy = (items, keyFn) => {
            const out = {};
            for (const item of items) {
              const key = keyFn(item);
              out[key] = (out[key] || 0) + 1;
            }
            return Object.entries(out).sort((a, b) => b[1] - a[1]);
          };
          console.log('[responsive-debt-expanded] status=' + report.status);
          console.log('[responsive-debt-expanded] checks=' + report.summary.checks);
          console.log('[responsive-debt-expanded] failures=' + report.summary.failures);
          console.log('[responsive-debt-expanded] skips=' + report.summary.skips);
          console.log('[responsive-debt-expanded] failures_by_page=' + JSON.stringify(countBy(report.failures, (x) => x.page)));
          console.log('[responsive-debt-expanded] failures_by_component=' + JSON.stringify(countBy(report.failures, (x) => x.component)));
          console.log('[responsive-debt-expanded] failures_by_breakpoint=' + JSON.stringify(countBy(report.failures, (x) => x.breakpoint)));
          console.log('[responsive-debt-expanded] first_failures=' + JSON.stringify(report.failures.slice(0, 30)));
          NODE

      - name: Restore diagnostic workspace and verify branch scope
        shell: bash
        run: |
          git restore assets/css
          git diff --check
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/diag-responsive-current-baseline.yml'
