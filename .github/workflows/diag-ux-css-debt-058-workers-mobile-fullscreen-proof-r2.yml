name: Doke UX-CSS-DEBT-058 Workers Mobile Fullscreen Proof R2

on:
  push:
    branches:
      - diag/ux-css-debt-058-workers-mobile-fullscreen-proof-r2

permissions:
  contents: read

jobs:
  proof-r2:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: d6daeaa876111dbfa3ed27cc5307936084292962
      PARENT_SHA: 28e5d98e1d640a730b2b24457a1ebc83f743f786
      TARGET_FILE: assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css
      TARGET_BLOB: d5adb69cdad3a77bdb5138afc7555071075fd089
      IMPORTER: assets/css/components/before-after-workers-preview.css
      IMPORTER_BLOB: d2065a1d52d82fd7e13a7eeaaf636c526c433f23
      RUNTIME_JS: assets/js/pages/home/workers.js
      RUNTIME_BLOB: 962e267d2591593f8346cb1b7f2b4ce846c098d4
      R1_HARNESS_COMMIT: 9c297df7836ad074702e71a668b20c751a3c4c35
      R1_HARNESS_PATH: .github/workflows/diag-ux-css-debt-058-workers-mobile-fullscreen-proof.yml
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-057 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact checkpoint and R1 provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER")" = "$IMPORTER_BLOB"
          test "$(git hash-object "$RUNTIME_JS")" = "$RUNTIME_BLOB"
          git fetch origin "$R1_HARNESS_COMMIT" --depth=1
          git cat-file -e "$R1_HARNESS_COMMIT^{commit}"
          git cat-file -e "$R1_HARNESS_COMMIT:$R1_HARNESS_PATH"
          test -z "$(git status --porcelain)"
          echo "R2 INPUT GUARD PASS|sha=$TARGET_SHA|r1=$R1_HARNESS_COMMIT|productDrift=0"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install browser and generate parent baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          python3 -m http.server 4173 >/tmp/ux058-http.log 2>&1 &
          echo $! >/tmp/ux058-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          echo 'R2 PARENT BASELINE PASS|responsiveBaseline=1|http=4173'

      - name: Extract R1 proof and patch only module resolution
        shell: bash
        run: |
          set -euo pipefail
          git show "$R1_HARNESS_COMMIT:$R1_HARNESS_PATH" >/tmp/ux058-r1.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('/tmp/ux058-r1.yml').read_text()
          start="          cat > /tmp/ux058-proof.js <<'NODE'\n"
          end="\n          NODE\n          node /tmp/ux058-proof.js"
          a=src.find(start)
          if a < 0: raise SystemExit('R1 proof heredoc start missing')
          a += len(start)
          b=src.find(end,a)
          if b < 0: raise SystemExit('R1 proof heredoc end missing')
          body=src[a:b]
          lines=[line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script='\n'.join(lines)+'\n'
          old="const {chromium}=require('@playwright/test');"
          new="const {chromium}=require(process.cwd() + '/node_modules/@playwright/test');"
          if script.count(old)!=1: raise SystemExit(f'expected one module line, got {script.count(old)}')
          script=script.replace(old,new)
          Path('/tmp/ux058-proof-r2.js').write_text(script)

          gs="      - name: Governance and residual proof\n"
          ns="      - name: Dependency snapshot\n"
          ga=src.find(gs)
          if ga < 0: raise SystemExit('R1 governance step missing')
          rm=src.find("        run: |\n",ga)
          if rm < 0: raise SystemExit('R1 governance run block missing')
          rm += len("        run: |\n")
          gb=src.find(ns,rm)
          if gb < 0: raise SystemExit('R1 governance end missing')
          gov=textwrap.dedent(src[rm:gb]).rstrip()+"\n"
          Path('/tmp/ux058-governance-r2.sh').write_text(gov)
          print(f'R1 HARNESS PATCH PASS|proofBytes={len(script.encode())}|governanceBytes={len(gov.encode())}|changedLines=1|criteriaRelaxed=0')
          PY
          node --check /tmp/ux058-proof-r2.js
          bash -n /tmp/ux058-governance-r2.sh

      - name: Run unchanged R1 static runtime and candidate criteria
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/ux058-proof-r2.js

      - name: Responsive contract on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/ux058-responsive.log
          grep -q 'Checks: 893' /tmp/ux058-responsive.log
          grep -q 'Failures: 0' /tmp/ux058-responsive.log
          grep -q 'Skips: 277' /tmp/ux058-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Run unchanged R1 governance and residual criteria
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/ux058-governance-r2.sh

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json >/tmp/ux058-audit.json
          code=$?
          set -e
          node <<'NODE'
          const a=require('/tmp/ux058-audit.json');const v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);
          NODE
          echo "npmAuditExit=$code"

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux058-http.pid; then kill "$(cat /tmp/ux058-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER")" = "$IMPORTER_BLOB"
          test "$(git hash-object "$RUNTIME_JS")" = "$RUNTIME_BLOB"
          test -z "$(git status --porcelain)"
          echo "R2 RESTORE PASS|sha=$TARGET_SHA|productMutation=0|issueCreated=0|prCreated=0"
