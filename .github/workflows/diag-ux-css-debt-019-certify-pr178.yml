name: Doke UX-CSS-DEBT-019 PR178 Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-019-certify-pr178

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: daadc8dbbb91f0ddb75591251fce4ea176b66d95
      PARENT_SHA: 70a99a6dd8b82fe54c8380ed9b1f28fe1965c836
      BASE_BRANCH: ux/ux-css-debt-018-home-mobile-base-padding-compaction
      HEAD_BRANCH: ux/ux-css-debt-019-home-mobile-categories-margin-compaction
      TARGET_FILE: assets/css/pages/home/mobile/categories.css
      TARGET_SELECTOR: 'body.home-index-shell .home-catégories .section-heading, body.home-index-shell .featured-services .section-heading'
      PARENT_SHA256: 147b2fcd187c9a37d354f1cb90b2c837fe19032f407ad91a985e2aaab38dcde8
      TARGET_SHA256: 69a5cbe44c8b3b1d01d3db1a39548561dfd03c057c3ab85d7bede8f64ff8f490
      PROJECT_KEY: Ezyrus07_doke-web
      PR_NUMBER: '178'
    steps:
      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact one-commit product-only tree and Sonar base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git rev-list --count "${PARENT_SHA}"..HEAD)" = "1"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $2}')" = "1"
          test -z "$(git diff --name-only "${PARENT_SHA}"...HEAD -- package.json package-lock.json)"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"
          test "$(git merge-base "${TARGET_SHA}" "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${TARGET_SHA256}"
          git diff --check "${PARENT_SHA}"...HEAD
          echo "EXACT TREE + SONAR SCOPE GUARD PASS"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Record explicit dependency advisory snapshot
        shell: bash
        run: |
          set -uo pipefail
          code=0
          npm audit --json >/tmp/npm-audit-pr178.json 2>/tmp/npm-audit-pr178.err || code=$?
          echo "npm audit exit=${code} (non-blocking; package files unchanged)"
          node - <<'NODE'
          const fs=require('fs');
          try { const a=JSON.parse(fs.readFileSync('/tmp/npm-audit-pr178.json','utf8')); console.log('npm audit metadata='+JSON.stringify(a.metadata?.vulnerabilities||{})); }
          catch(e){ console.log('npm audit snapshot unavailable: '+e.message); }
          NODE
          exit 0

      - name: Prove permanent equals deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${PARENT_SHA}:${TARGET_FILE}" >/tmp/parent.css
          cp "${TARGET_FILE}" /tmp/permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),selector=process.env.TARGET_SELECTOR;
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const declarations=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context});}}depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}if(ap.length)throw new Error('unterminated multiline at-rule');const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push({...d,winnerLine:later.line,winnerValue:later.value,winnerImportant:later.important});if(!later||d.important||!later.important)last.set(key,d);}return{lines,declarations,dead};}
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex'),ptext=fs.readFileSync('/tmp/parent.css','utf8'),ttext=fs.readFileSync('/tmp/permanent.css','utf8'),p=parse(ptext),t=parse(ttext);
          if(sha(ptext)!==process.env.PARENT_SHA256||Buffer.byteLength(ptext)!==2477||p.declarations.length!==52||p.dead.length!==1)throw new Error('parent drift');
          const d=p.dead[0];if(d.selector!==selector||d.property!=='margin'||d.context!=='@media (max-width: 560px)'||d.value!=='0 0 4px'||d.winnerValue!=='0'||d.important||d.winnerImportant)throw new Error('dead-row drift '+JSON.stringify(d));
          const rebuilt=p.lines.filter((_l,i)=>i!==d.lineIndex).join('\n');
          if(rebuilt!==ttext)throw new Error('permanent differs from deterministic candidate');
          if(sha(ttext)!==process.env.TARGET_SHA256||Buffer.byteLength(ttext)!==2456||t.declarations.length!==51||t.dead.length!==0)throw new Error('permanent drift');
          console.log('EXACT DELETION-ONLY PROOF PASS: 52->51; -1; dead1->0; bytes2477->2456; important0->0');
          NODE

      - name: Write deterministic runtime capture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/capture-pr178.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2],expectedHits=Number(process.argv[3]),selector=process.env.TARGET_SELECTOR,vps=[['1600x1000',1600,1000],['1280x802',1280,802],['1024x900',1024,900],['820x1180',820,1180],['608x926',608,926],['561x900',561,900],['560x900',560,900],['390x844',390,844]],server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const result={};let mediaHits=0;for(const [name,width,height] of vps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto('http://127.0.0.1:5500/index.html',{waitUntil:'domcontentloaded',timeout:15000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});const snap=await page.evaluate(selector=>{const norm=s=>s.replace(/\s+/g,' ').trim(),nodes=[...document.querySelectorAll(selector)],hits=[];function walk(rules,ctx,href){for(const r of [...rules]){if(r.constructor?.name==='CSSImportRule'&&r.styleSheet){try{walk(r.styleSheet.cssRules,ctx,r.styleSheet.href||href);}catch{}}else if(r.constructor?.name==='CSSMediaRule'){walk(r.cssRules,[...ctx,`@media ${r.conditionText}`],href);}else if(norm(r.selectorText||'')===norm(selector)&&r.style?.getPropertyValue('margin'))hits.push({href,context:ctx.join(' || '),value:r.style.getPropertyValue('margin').trim(),priority:r.style.getPropertyPriority('margin')});}}for(const s of [...document.styleSheets]){try{walk(s.cssRules,[],s.href||'inline');}catch{}}const de=document.documentElement,b=document.body;return{media:matchMedia('(max-width:560px)').matches,count:nodes.length,nodes:nodes.map((el,i)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return{index:i,margin:[cs.marginTop,cs.marginRight,cs.marginBottom,cs.marginLeft],display:cs.display,rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]};}),doc:[de.scrollWidth,de.scrollHeight,de.clientWidth,de.clientHeight],body:[b.scrollWidth,b.scrollHeight,b.clientWidth,b.clientHeight],hits:hits.filter(h=>String(h.href).includes('/assets/css/pages/home/mobile/categories.css'))};},selector);if(snap.count<1)throw new Error(`selector absent ${name}`);if(snap.hits.length!==expectedHits)throw new Error(`CSSOM hits ${name}=${snap.hits.length}`);if(snap.hits.some(h=>h.context!=='@media (max-width: 560px)'||h.priority!==''))throw new Error(`CSSOM context/priority drift ${name}`);if(expectedHits===2){const vals=snap.hits.map(h=>h.value).sort();if(JSON.stringify(vals)!==JSON.stringify(['0px','0px 0px 4px']))throw new Error(`parent values drift ${name} ${JSON.stringify(vals)}`);}else if(snap.hits[0].value!=='0px')throw new Error(`permanent winner drift ${name} ${snap.hits[0].value}`);if(snap.media)mediaHits++;const {hits,...stable}=snap;result[name]=stable;await ctx.close();}await browser.close();server.kill('SIGTERM');if(mediaHits!==2)throw new Error(`media hits=${mediaHits}`);fs.writeFileSync(out,JSON.stringify(result));console.log(`CAPTURE PASS expectedHits=${expectedHits} viewports=${Object.keys(result).length} mediaHits=${mediaHits}`);})().catch(e=>{server.kill('SIGTERM');console.error(e);process.exit(1)});
          NODE

      - name: Capture parent runtime and responsive baseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent.css "${TARGET_FILE}"
          node /tmp/capture-pr178.js /tmp/parent-runtime.json 2
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/parent-responsive.json
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/parent-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/parent-conflicts.log

      - name: Restore permanent and require exact runtime parity
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/permanent.css "${TARGET_FILE}"
          node /tmp/capture-pr178.js /tmp/permanent-runtime.json 1
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/permanent-runtime.json')),diffs=[];function walk(x,y,p){if(typeof x!==typeof y||x===null||y===null||typeof x!=='object'){if(x!==y)diffs.push({path:p,parent:x,permanent:y});return;}if(Array.isArray(x)!==Array.isArray(y)){diffs.push({path:p,parent:x,permanent:y});return;}for(const k of [...new Set([...Object.keys(x),...Object.keys(y)])].sort())walk(x[k],y[k],p?`${p}.${k}`:k);}walk(a,b,'');if(diffs.length){console.error(JSON.stringify(diffs.slice(0,100),null,2));throw new Error(`runtime diffs=${diffs.length}`);}console.log('PERMANENT COMPUTED-STYLE + BOUNDING-RECT + DOCUMENT-GEOMETRY PARITY PASS: 0 diffs');
          NODE

      - name: Preserve responsive contract without rebaseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log

      - name: Validate permanent governance and residual inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:agent-governance
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          grep -q 'css files: 533 (55 direct, 401 active/imported)' /tmp/legacy.log
          grep -q 'active legacy/remediation css: 0' /tmp/legacy.log
          grep -q 'active legacy/remediation js: 0' /tmp/legacy.log
          grep -q 'high risk active css: 37' /tmp/legacy.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),target=process.env.TARGET_FILE,report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css')),importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));},meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(norm(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n);}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10;});function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null,decl=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,n=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:n(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:n([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m)decl.push({selector:sel,property:m[1].toLowerCase(),important:/\s*!important\s*$/i.test(m[2].trim()),context:stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ')});}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}const last=new Map();let dead=0;for(let i=decl.length-1;i>=0;i--){const d=decl[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d);}return{decl:decl.length,dead};}const rows=[...active].map(f=>({f,...parse(meta.get(f).text)})).filter(r=>r.dead>0),total=rows.reduce((n,r)=>n+r.dead,0),highResidual=rows.filter(r=>high.includes(r.f)),t=parse(meta.get(target).text);if(active.size!==401||high.length!==37||rows.length!==55||total!==1309||highResidual.length!==0||t.decl!==51||t.dead!==0)throw new Error(`residual drift active=${active.size} high=${high.length} files=${rows.length} dead=${total} highResidual=${highResidual.length} target=${t.decl}/${t.dead}`);console.log('PERMANENT RESIDUAL PASS: active=401 highRisk=37 filesWithDead=55 superseded=1309 highRiskWithDead=0 target=51/dead0');
          NODE

      - name: Reset generated outputs to exact permanent SHA before Sonar
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain)"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${TARGET_SHA256}"
          test "$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"
          test "$(git merge-base "${TARGET_SHA}" "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"

      - name: Require Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}"

      - name: Analyze PR 178 exact SHA and enforce SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        with:
          skipSignatureVerification: true
          args: >-
            -Dsonar.projectKey=${{ env.PROJECT_KEY }}
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.HEAD_BRANCH }}
            -Dsonar.pullrequest.base=${{ env.BASE_BRANCH }}
            -Dsonar.scm.revision=${{ env.TARGET_SHA }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify Sonar API final PR gate
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${SONAR_TOKEN}" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&pullRequest=${PR_NUMBER}" -o /tmp/qg.json
          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/qg.json'))['projectStatus']
          print('QG API status='+str(d.get('status')))
          failed=[]
          for c in d.get('conditions',[]):
              print('QG condition metric={metricKey} status={status} actual={actualValue} threshold={errorThreshold} op={comparator}'.format(**c))
              if c.get('status') not in ('OK','NO_VALUE'): failed.append(c)
          if d.get('status')!='OK' or failed: sys.exit(1)
          print('SONAR PR178 FINAL QUALITY GATE PASS')
          PY
