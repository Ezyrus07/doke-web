name: Doke SCHED-B04C Direct Negative Savepoint Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-direct-negative-savepoint-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-direct-negative-savepoint-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Wrap direct SQL negative in savepoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js')
          source = path.read_text()
          anchor = """async function readOrder(client, orderId) {
          """
          helper = """async function expectCodeInsideSavepoint(client, savepointName, operation, expectedCode) {
            if (!/^[a-z0-9_]+$/.test(savepointName)) {
              fail('DOKE_SCHED_B04C_SAVEPOINT_NAME_INVALID');
            }
            await client.query(`savepoint ${savepointName}`);
            let caught = null;
            try {
              await operation();
            } catch (error) {
              caught = error;
            }
            await client.query(`rollback to savepoint ${savepointName}`);
            await client.query(`release savepoint ${savepointName}`);
            if (!caught || caught.code !== expectedCode) {
              fail('DOKE_SCHED_B04C_EXPECTED_FAILURE_MISSING', 'DOKE_SCHED_B04C_EXPECTED_FAILURE_MISSING', {
                expectedCode,
                actualCode: caught && caught.code || null
              });
            }
            return expectedCode;
          }

          async function readOrder(client, orderId) {
          """
          if source.count(anchor) != 1:
              raise SystemExit('Unexpected readOrder anchor')
          source = source.replace(anchor, helper, 1)

          old_call = """await expectCode(
            () => directTransactionPort.projectOrderSchedule(
              fixtures.orders.replacement,
              mainHold.reservation.id,
              mainHold.reservation.startsAt
            ),
            'DOKE_SCHEDULE_RESERVATION_PROJECTION_INVALID'
          );
          """
          new_call = """await expectCodeInsideSavepoint(
            client,
            'b04c_replacement_projection_guard',
            () => directTransactionPort.projectOrderSchedule(
              fixtures.orders.replacement,
              mainHold.reservation.id,
              mainHold.reservation.startsAt
            ),
            'DOKE_SCHEDULE_RESERVATION_PROJECTION_INVALID'
          );
          """
          if source.count(old_call) != 1:
              raise SystemExit('Unexpected replacement projection negative call')
          path.write_text(source.replace(old_call, new_call, 1))
          PY

      - name: Validate savepoint reconciliation
        run: |
          set -euo pipefail
          node --check scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish savepoint reconciliation
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          if git diff --cached --quiet; then
            echo "Savepoint reconciliation already present."
            exit 0
          fi
          git commit -m "fix(sched): recover B04C transaction after direct negative"
          git push origin HEAD:ord/ord-001-baseline-audit
