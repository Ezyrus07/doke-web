name: Doke SCHED-C01A Governance Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01a-governance-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-c01a-governance-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Reconcile package and matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def write_json(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['audit:sched-001-c01a-frontend-canonical-authority-readiness'] = \
              'node scripts/audit-sched-001-c01a-frontend-canonical-authority-readiness.js'
          package['scripts']['test:sched-001-c01a-frontend-canonical-authority-readiness'] = \
              'node scripts/test-sched-001-c01a-frontend-canonical-authority-readiness.js'
          write_json(package_path, package)

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text())
          if matrix.get('version') != '1.3.70':
              raise SystemExit(f"Unexpected matrix version: {matrix.get('version')}")
          matrix['version'] = '1.3.71'
          matrix['updatedAt'] = '2026-08-01T19:22:00-03:00'
          domains = {item['id']: item for item in matrix['domains']}
          sched = domains['SCHED-001']
          order = domains['ORD-001']

          required_paths = [
              'config/sched-001-c01a-frontend-canonical-authority-readiness.json',
              'docs/SCHED-001-C01A-FRONTEND-CANONICAL-AUTHORITY-READINESS.md',
              'docs/validation/SCHED-001-C01A-FRONTEND-CANONICAL-AUTHORITY-READINESS.json',
              'scripts/audit-sched-001-c01a-frontend-canonical-authority-readiness.js',
              'scripts/test-sched-001-c01a-frontend-canonical-authority-readiness.js',
              '.github/workflows/sched-001-c01a-frontend-canonical-authority-readiness.yml',
              'assets/js/repositories/orders-repository.js',
              'assets/js/services/orders-service.js',
              'assets/js/pages/orcamento.js',
              'assets/js/pages/pedidos-local-orders.js'
          ]
          tests = [
              'audit:sched-001-c01a-frontend-canonical-authority-readiness',
              'test:sched-001-c01a-frontend-canonical-authority-readiness'
          ]
          for domain in (sched, order):
              for item in required_paths:
                  if item not in domain['requiredPaths']:
                      domain['requiredPaths'].append(item)
              for item in tests:
                  if item not in domain['tests']:
                      domain['tests'].append(item)

          sched_evidence = [
              'SCHED-C01A froze the repository-only frontend authority contract after the authenticated ORD/SCHED staging composition closed SCHED-B04.',
              'The audit found that the browser order mapper exposes scheduled_at but not schedule_reservation_id, scheduleAuthority or hasCanonicalSchedule; the quote form still submits date only as client intent and the orders surface renders advertised service availability rather than a confirmed reservation.',
              'C01A changes no runtime behavior and performs zero staging reads, mutations, migrations, deployments, frontend command activations, Cron or worker activations; SCHED remains maturity 3 with partial server authority and no internal blocker.'
          ]
          order_evidence = [
              'SCHED-C01A freezes how ORD browser surfaces must consume canonical scheduling: schedule_reservation_id, scheduled_at and scheduled status form one fail-closed projection tuple.',
              'Quote dates remain client intent, generic browser transitions to scheduled remain absent, and advertised service availability must not be presented as a confirmed booking.',
              'C01A does not close ORD-B02, ORD-B03 or ORD-B05 and does not activate frontend commands, staging access, deployment, production or merge.'
          ]
          for item in sched_evidence:
              if item not in sched['evidence']:
                  sched['evidence'].append(item)
          for item in order_evidence:
              if item not in order['evidence']:
                  order['evidence'].append(item)

          sched['nextActions'] = [
              'Implement SCHED-C01B repository-only canonical schedule read model and presentation adapters without enabling remote scheduling commands.',
              'Prepare a separately reviewed server-mediated frontend command boundary for hold, confirmation, reschedule and cancellation while preserving idempotency and fail-closed authority.',
              'Keep staging browser activation, Cron or workers, production release and pull-request merge under independent authorization.'
          ]

          if sched.get('maturity') != 3 or sched.get('serverAuthority') != 'partial':
              raise SystemExit('C01A must not promote SCHED maturity or authority')
          if sched.get('blockers') != []:
              raise SystemExit('C01A must not reopen SCHED blockers')
          if [item['id'] for item in order.get('blockers', [])] != ['ORD-B02', 'ORD-B03', 'ORD-B05']:
              raise SystemExit('C01A must preserve remaining ORD blockers')

          write_json(matrix_path, matrix)

          closure_audit = Path('scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js')
          source = closure_audit.read_text()
          old = "assert.strictEqual(matrix.version, '1.3.70');"
          new = "const matrixParts = String(matrix.version).split('.').map(Number);\nassert.strictEqual(matrixParts[0], 1);\nassert.strictEqual(matrixParts[1], 3);\nassert(matrixParts[2] >= 70, 'B04C closure requires matrix 1.3.70 or later');"
          if source.count(old) == 1:
              closure_audit.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Unexpected B04C closure matrix assertion shape')
          PY

      - name: Regenerate matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Validate C01A and cumulative authority contracts
        run: |
          set -euo pipefail
          npm run audit:sched-001-c01a-frontend-canonical-authority-readiness
          npm run test:sched-001-c01a-frontend-canonical-authority-readiness
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-ord-001-a01-baseline.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish reconciled governance
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add package.json
          git add config/domain-completion-matrix.json
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "C01A governance already reconciled."
            exit 0
          fi
          git commit -m "docs(sched): register C01A frontend authority readiness"
          git push origin HEAD:ord/ord-001-baseline-audit
