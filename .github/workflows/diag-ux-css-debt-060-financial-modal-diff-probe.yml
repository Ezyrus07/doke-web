name: Doke UX-CSS-DEBT-060 Financial Modal Fallback Repeatability Probe

on:
  push:
    branches:
      - diag/ux-css-debt-060-financial-modal-diff-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5a93b7fdf0b61e91d6dcd3867ae98d97f94d7eb9
      PARENT_SHA: 025ee39a521d8297dd68db58749b2f46a42bcdbe
      TARGET_FILE: assets/css/components/overlays/financial-modal-system.css
      TARGET_BLOB: 291af9edb634992955e324128ed5d661970d1aa5
    steps:
      - name: Checkout exact UX-CSS-DEBT-059
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo 'FALLBACK PROBE INPUT PASS'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          python3 -m http.server 4174 >/tmp/ux060-probe-http.log 2>&1 &
          echo $! >/tmp/ux060-probe-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4174/carteira.html >/dev/null

      - name: Prove custom-property fallback and measurement repeatability
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ux060-fallback-probe.js <<'NODE'
          const fs=require('fs');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const file=process.env.TARGET_FILE;
          const parent=fs.readFileSync(file,'utf8');
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){
            const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;
            for(let i=0;i<lines.length;i++){
              const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;
              if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}
              if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context});}}
              depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}
            }
            const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d);}return{declarations:ds,dead};
          }
          const parsed=parse(parent);if(parsed.declarations.length!==852||parsed.dead.length!==207)throw new Error('parse drift');
          const closeBg=parsed.dead.find(x=>x.line===140&&x.selector===':is(.charge-modal__close, .wallet-dialog__close)'&&x.property==='background');
          if(!closeBg||closeBg.value!=='var(--doke-close-button-bg)'||closeBg.winner.line!==903||closeBg.winner.value!=='var(--modal-close-bg)')throw new Error('close background chain drift');
          const allRemove=new Set(parsed.dead.map(x=>x.line));
          const rawCandidate=parent.split(/\r?\n/).filter((_,i)=>!allRemove.has(i+1)).join('\n');
          const fixedLines=parent.split(/\r?\n/).filter((_,i)=>!allRemove.has(i+1));
          const winnerIndex=fixedLines.findIndex(line=>line.includes('background: var(--modal-close-bg);'));
          if(winnerIndex<0)throw new Error('winner line not found after compaction');
          fixedLines[winnerIndex]=fixedLines[winnerIndex].replace('var(--modal-close-bg)','var(--modal-close-bg, var(--doke-close-button-bg))');
          const fixedCandidate=fixedLines.join('\n');
          async function sample(css,label,count){
            fs.writeFileSync(file,css);
            const vals=[];
            for(let n=0;n<count;n++){
              const browser=await chromium.launch({headless:true});
              const ctx=await browser.newContext({viewport:{width:359,height:900}});
              const page=await ctx.newPage();
              await page.route('**/*',route=>{const t=route.request().resourceType();if(['script','font','image'].includes(t))return route.abort();return route.continue();});
              await page.goto(`http://127.0.0.1:4174/carteira.html?sample=${label}-${n}`,{waitUntil:'domcontentloaded'});
              await page.evaluate(()=>{document.documentElement.removeAttribute('data-auth-guard');document.documentElement.classList.remove('doke-mobile-shell-pending');document.body.style.visibility='visible';document.body.style.opacity='1';document.querySelectorAll('[data-doke-document-preloader],[data-wallet-hydration-skeleton]').forEach(el=>{el.hidden=true;el.style.display='none';});const shell=document.querySelector('[data-wallet-withdraw-modal]');shell.hidden=false;shell.classList.add('is-active');shell.setAttribute('aria-hidden','false');document.body.classList.add('is-wallet-modal-open');document.querySelector('.wallet-dialog__close')?.focus();});
              await page.waitForTimeout(80);
              const v=await page.evaluate(()=>{const el=document.querySelector('.wallet-dialog__close'),cs=getComputedStyle(el),r=el.getBoundingClientRect(),round=x=>Math.round(x*1000)/1000;return{modalCloseBg:cs.getPropertyValue('--modal-close-bg').trim(),dokeCloseBg:cs.getPropertyValue('--doke-close-button-bg').trim(),background:cs.background,y:round(r.y),bottom:round(r.bottom),top:cs.top,width:cs.width,height:cs.height,display:cs.display,borderRadius:cs.borderRadius};});
              vals.push(v);await browser.close();
            }
            console.log(`SAMPLES|${label}|${JSON.stringify(vals)}`);return vals;
          }
          (async()=>{
            const p=await sample(parent,'parent',3);
            const raw=await sample(rawCandidate,'rawCandidate',2);
            const fixed=await sample(fixedCandidate,'fixedCandidate',3);
            if(p.some(x=>x.modalCloseBg!==''))throw new Error(`expected --modal-close-bg undefined on wallet, got ${JSON.stringify(p.map(x=>x.modalCloseBg))}`);
            if(p.some(x=>!x.dokeCloseBg))throw new Error('expected --doke-close-button-bg defined on wallet');
            if(raw.every(x=>x.background===p[0].background))throw new Error('raw candidate unexpectedly preserved fallback background');
            if(fixed.some(x=>x.background!==p[0].background))throw new Error(`fixed fallback does not preserve background: parent=${p[0].background} fixed=${JSON.stringify(fixed.map(x=>x.background))}`);
            const all=[...p,...fixed], ys=all.map(x=>x.y), jitter=Math.max(...ys)-Math.min(...ys);
            console.log(`FALLBACK PROOF PASS|modalCloseBgUndefined=1|dokeCloseBg=${JSON.stringify(p[0].dokeCloseBg)}|parentBackground=${JSON.stringify(p[0].background)}|rawBackground=${JSON.stringify(raw[0].background)}|fixedBackground=${JSON.stringify(fixed[0].background)}|parentFixedYEnvelope=${jitter.toFixed(3)}|samples=${all.length}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/ux060-fallback-probe.js | tee /tmp/ux060-fallback-probe.log
          grep -q 'FALLBACK PROOF PASS|modalCloseBgUndefined=1' /tmp/ux060-fallback-probe.log

      - name: Restore exact checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux060-probe-http.pid; then kill "$(cat /tmp/ux060-probe-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo 'FALLBACK PROBE RESTORE PASS'
