name: Diagnose UX-RESP-DEBT-011 Matrix Regeneration

on:
  push:
    branches:
      - diag/ux-resp-debt-011-matrix-regeneration

permissions:
  contents: write

env:
  CANDIDATE_SHA: 9cf4772d005bb8df53faea8806c296ca27d7c9bf
  OUTPUT_BRANCH: diag/ux-resp-debt-011-matrix-generated

jobs:
  matrix-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Guard exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate and validate exact matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          echo 'UX_RESP_DEBT_011_MATRIX_DIFF_BEGIN'
          git diff --unified=3 -- docs/DOMAIN-COMPLETION-MATRIX.md
          echo 'UX_RESP_DEBT_011_MATRIX_DIFF_END'

      - name: Publish generated matrix only to diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          test "$(git diff --cached --name-only)" = "docs/DOMAIN-COMPLETION-MATRIX.md"
          git commit -m 'diag(ux-resp-debt-011): materialize generated domain matrix'
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}" --force
