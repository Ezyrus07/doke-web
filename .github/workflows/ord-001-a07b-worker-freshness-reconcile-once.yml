name: ORD-A07B Worker Freshness Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07b-worker-freshness-reconcile-once.yml'
      - 'config/ord-001-a07b-worker-invocation-freshness.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile worker freshness registry and matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['test:ord-001-a07b-worker-invocation-freshness'] = 'node scripts/test-order-event-worker-invocation-freshness.js'
          scripts['audit:ord-001-a07b-worker-invocation-freshness'] = 'node scripts/audit-ord-001-a07b-worker-invocation-freshness.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['version'] = '1.3.28'
          matrix['updatedAt'] = '2026-07-30T11:19:00-03:00'
          ord_domain = next(domain for domain in matrix['domains'] if domain['id'] == 'ORD-001')

          required_paths = [
              'supabase/functions/order-event-worker/invocation-freshness.mjs',
              'config/ord-001-a07b-worker-invocation-freshness.json',
              'scripts/test-order-event-worker-invocation-freshness.js',
              'scripts/audit-ord-001-a07b-worker-invocation-freshness.js',
              'docs/ORD-001-A07B-WORKER-INVOCATION-FRESHNESS.md',
              'docs/validation/ORD-001-A07B-WORKER-INVOCATION-FRESHNESS.json',
              '.github/workflows/ord-001-a07b-worker-invocation-freshness.yml'
          ]
          for item in required_paths:
              if item not in ord_domain['requiredPaths']:
                  ord_domain['requiredPaths'].append(item)

          tests = [
              'test:ord-001-a07b-worker-invocation-freshness',
              'audit:ord-001-a07b-worker-invocation-freshness'
          ]
          for item in tests:
              if item not in ord_domain['tests']:
                  ord_domain['tests'].append(item)

          evidence = 'ORD-A07B defines a fail-closed five-minute worker invocation freshness contract with thirty-second future skew, URL-safe nonce validation and mandatory atomic nonce consumption before a worker run may begin; activation remains deliberately pending until an official Supabase CLI migration creates the private nonce ledger and service-role-only consume RPC.'
          if evidence not in ord_domain['evidence']:
              ord_domain['evidence'].append(evidence)

          old_action = 'Harden worker invocation freshness and replay resistance.'
          ord_domain['nextActions'] = [item for item in ord_domain['nextActions'] if item != old_action]
          next_action = 'Generate the ORD-A07B private nonce-ledger migration through the Supabase CLI, validate it locally, then apply and deploy only through the controlled staging release path before activating Edge freshness enforcement.'
          if next_action not in ord_domain['nextActions']:
              ord_domain['nextActions'].append(next_action)

          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/test-order-event-worker-invocation-freshness.js
          node scripts/audit-ord-001-a07b-worker-invocation-freshness.js
          node scripts/test-order-event-worker-contract.js
          node scripts/audit-ord-001-a07-request-freshness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add -A
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Register ORD-A07B worker invocation freshness contract'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
