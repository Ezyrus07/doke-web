name: Doke UX-RESP-DEBT-009 CSSOM Winner Diagnostic

on:
  push:
    branches:
      - diag/ux-resp-debt-009-import-boundary-reconciliation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-007 ancestry
        run: test "$(git merge-base HEAD b40866e1741c4c6dd41af821dc625e4a86703c53)" = "b40866e1741c4c6dd41af821dc625e4a86703c53"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Apply rejected workspace candidate for CSSOM tracing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          legacy_import='@import url("../components/shell/tablet-internal-rail-contract.css?v=20260710-tablet-rail-authority-v1") screen and (max-width: 760px);\n'
          for name in [
            'assets/css/pages/pedidos-runtime-page.css',
            'assets/css/pages/notificacoes-foundation.css',
            'assets/css/pages/carteira-runtime-page.css',
          ]:
            p=Path(name)
            s=p.read_text()
            if s.count(legacy_import) != 1:
              raise SystemExit(f'unexpected legacy import count in {name}')
            p.write_text(s.replace(legacy_import,'',1))

          p=Path('assets/css/components/internal/list-page-toolbar.css')
          s=p.read_text()
          old='''@media (max-width: 760px) {\n  body.orders-page-shell .home-side-meta,\n  body.notifications-page-shell .home-side-meta,\n  body.wallet-page-shell .home-side-meta {\n    display: none;\n  }\n\n  .home-side-meta__search-form {'''
          new='''@media (max-width: 560px) {\n  body.orders-page-shell .home-side-meta,\n  body.notifications-page-shell .home-side-meta,\n  body.wallet-page-shell .home-side-meta {\n    display: none;\n  }\n}\n\n@media (max-width: 760px) {\n  .home-side-meta__search-form {'''
          if s.count(old) != 1:
            raise SystemExit('unexpected list-page-toolbar boundary block')
          p.write_text(s.replace(old,new,1))

          p=Path('assets/css/components/shell/mobile-app-shell.css')
          s=p.read_text()
          old_item='''      .home-search-hero,\n      .home-side-meta,\n      .desktop-only,'''
          new_item='''      .home-search-hero,\n      .desktop-only,'''
          if s.count(old_item) != 1:
            raise SystemExit('unexpected pending home-side-meta list item')
          s=s.replace(old_item,new_item,1)
          anchor='''.doke-mobile-shell,\n.doke-mobile-bottom-nav {\n  display: none;\n}\n\n'''
          guard='''@media (max-width: 560px),\n  (hover: none) and (pointer: coarse) and (max-device-width: 560px) {\n  html.doke-mobile-shell-pending body .home-side-meta {\n    display: none;\n    visibility: hidden;\n    pointer-events: none;\n  }\n}\n\n'''
          if s.count(anchor) != 1:
            raise SystemExit('unexpected mobile shell guard anchor')
          p.write_text(s.replace(anchor,guard+anchor,1))
          PY

      - name: Trace computed and matched CSSOM at 608px
        run: node scripts/diag-ux-resp-debt-009-cssom.js
