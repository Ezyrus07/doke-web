name: Doke UX-RESP-DEBT-009 Active Header Suppressor Diagnostic

on:
  push:
    branches:
      - diag/ux-resp-debt-009-import-boundary-reconciliation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-007 ancestry
        run: test "$(git merge-base HEAD b40866e1741c4c6dd41af821dc625e4a86703c53)" = "b40866e1741c4c6dd41af821dc625e4a86703c53"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Print active CSS files containing whole-header suppressors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {getLoadedCssAssets}=require('./scripts/lib/css-assets');
          const selectors={
            'pedidos.html':'body.orders-page-shell .home-side-meta',
            'notificacoes.html':'body.notifications-page-shell .home-side-meta',
            'carteira.html':'body.wallet-page-shell .home-side-meta',
          };
          for (const [page,selector] of Object.entries(selectors)) {
            const html=fs.readFileSync(page,'utf8');
            const assets=[...new Set(getLoadedCssAssets(html,process.cwd()))];
            console.log('PAGE_GRAPH',page,'COUNT',assets.length);
            for (const asset of assets) {
              if (!fs.existsSync(asset)) continue;
              const css=fs.readFileSync(asset,'utf8');
              if (!css.includes(selector)) continue;
              console.log('ACTIVE_SUPPRESSOR_FILE',page,asset);
              const lines=css.split(/\r?\n/);
              lines.forEach((line,index)=>{
                if (line.includes(selector)) {
                  const start=Math.max(0,index-5);
                  const end=Math.min(lines.length,index+10);
                  console.log(`SNIPPET_START ${asset}:${index+1}`);
                  console.log(lines.slice(start,end).map((v,i)=>`${start+i+1}: ${v}`).join('\n'));
                  console.log(`SNIPPET_END ${asset}:${index+1}`);
                }
              });
            }
          }
          NODE
