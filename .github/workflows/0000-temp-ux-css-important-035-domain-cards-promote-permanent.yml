name: UX-CSS-IMPORTANT-035 Domain Cards Permanent Promotion
on:
  push:
    branches:
      - diag/ux-css-important-035-domain-cards-promote-permanent
permissions:
  contents: write
jobs:
  promote035:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      PARENT_TREE: 714d5b26a67edec2fbcb4f87ebae8c1197304269
      TARGET_FILE: assets/css/components/domain/doke-domain-cards.css
      TARGET_PARENT_BLOB: 42df66dea7658af5859a1092e6148d9394472e2a
      CANDIDATE_SHA256: d99be25b5e0c364890bec8bc0aa28226b227d9b4bd45131fe193c440328aebed
      CANDIDATE_BLOB: f7b0f8c5c4efcd7c0f821b18f514b788eef4cdfa
      PERMANENT_BRANCH: ux/ux-css-important-035-domain-cards-active-priority
      LEDGER: diag/ux-css-important-post-010-ranking-r1
      R6C_FILE: .diagnostics/ux-css-important-035-domain-cards-governance-r6c.txt
      R6C_BLOB: cbeeefa8e7ae32c151c6242dbb9cf8067609bde6
      RESULT_FILE: .diagnostics/ux-css-important-035-domain-cards-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Promote exact certified candidate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/promotion.log) 2>&1
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_PARENT_BLOB"
          git fetch origin "refs/heads/$LEDGER:refs/remotes/origin/$LEDGER" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$LEDGER:$R6C_FILE")" = "$R6C_BLOB"
          git show "refs/remotes/origin/$LEDGER:$R6C_FILE" >/tmp/r6c.txt
          grep -q '^RUN_ID=32727503402$' /tmp/r6c.txt
          grep -Fq "CANDIDATE PASS|important=215->0|sha256=$CANDIDATE_SHA256|blob=$CANDIDATE_BLOB|bytes=28604|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0" /tmp/r6c.txt
          grep -q '^RESULT=PASS$' /tmp/r6c.txt
          grep -q '^PROOF_RESULT=PASS$' /tmp/r6c.txt
          if git ls-remote --exit-code --heads origin "refs/heads/$PERMANENT_BRANCH" >/dev/null 2>&1; then
            echo "PERMANENT BRANCH ALREADY EXISTS|branch=$PERMANENT_BRANCH"
            exit 1
          fi
          git checkout --detach "$PARENT_SHA" >/dev/null
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const target=process.env.TARGET_FILE;
          const original=fs.readFileSync(target,'utf8');
          const candidate=original.replace(/\s*!important\b/g,'');
          const before=(original.match(/!important\b/g)||[]).length;
          const after=(candidate.match(/!important\b/g)||[]).length;
          const sha=crypto.createHash('sha256').update(Buffer.from(candidate)).digest('hex');
          fs.writeFileSync(target,candidate);
          const blob=cp.execFileSync('git',['hash-object',target],{encoding:'utf8'}).trim();
          if(before!==215||after!==0||sha!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB) throw new Error(`candidate mismatch ${before}/${after}/${sha}/${blob}`);
          console.log(`CANDIDATE IDENTITY PASS|important=${before}->${after}|sha256=${sha}|blob=${blob}|bytes=${Buffer.byteLength(candidate)}`);
          NODE
          test "$(git diff --name-only "$PARENT_SHA" -- | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only "$PARENT_SHA" --)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" -- "$TARGET_FILE")" = $'215\t215\t'"$TARGET_FILE"
          git diff --check "$PARENT_SHA" -- "$TARGET_FILE"
          git switch -c "$PERMANENT_BRANCH" >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$TARGET_FILE"
          git commit -m 'UX-CSS-IMPORTANT-035: remove active domain card priorities' >/dev/null
          head="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          tree="$(git rev-parse HEAD^{tree})"
          target_blob="$(git rev-parse "HEAD:$TARGET_FILE")"
          test "$parent" = "$PARENT_SHA"
          test "$target_blob" = "$CANDIDATE_BLOB"
          test "$(git diff --name-only "$PARENT_SHA" "$head" | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only "$PARENT_SHA" "$head")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$head" -- "$TARGET_FILE")" = $'215\t215\t'"$TARGET_FILE"
          git push origin "HEAD:refs/heads/$PERMANENT_BRANCH"
          echo "PROMOTION PASS|branch=$PERMANENT_BRANCH|head=$head|tree=$tree|parent=$parent|targetBlob=$target_blob|files=1|additions=215|deletions=215|force=0"
          echo 'RESULT=PASS'
      - name: Publish promotion receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL; grep -q '^RESULT=PASS$' /tmp/promotion.log 2>/dev/null && result=PASS || true
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; grep -E '^(CANDIDATE IDENTITY PASS|PERMANENT BRANCH ALREADY EXISTS|PROMOTION PASS|RESULT=)' /tmp/promotion.log 2>/dev/null || true; echo "PROOF_RESULT=$result"; } >/tmp/out
          git fetch origin "refs/heads/$LEDGER:refs/remotes/origin/$LEDGER" >/dev/null
          git checkout -B diag-output "origin/$LEDGER" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"
          git commit -m 'diag: publish 035 domain cards promotion [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$LEDGER" >/dev/null
          test "$result" = PASS
