name: Doke SCHED-C01E Domain Matrix Refresh

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01e-domain-matrix-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 1
      - name: Require immutable event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate deterministic matrix document
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "docs/DOMAIN-COMPLETION-MATRIX.md"
      - name: Publish generated Markdown only
        run: |
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "docs(governance): refresh domain completion matrix"
          git push origin HEAD:ord/ord-001-baseline-audit
