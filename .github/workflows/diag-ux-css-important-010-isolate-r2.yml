name: Doke UX CSS Important 010 Isolate R2
on: [push]
permissions: {contents: write}
jobs:
  isolate:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 839d20efdaf28d99508397722fb61cedafcdb556
      TARGET_FILE: assets/css/components/cards/mobile-card-contract.css
      TARGET_BLOB: 46ede4f081a686155ab4035581cbd8a796a831c9
      DIAG_BRANCH: diag/ux-css-important-010-isolate-r2
      RESULT_FILE: .diagnostics/ux-css-important-010-isolate-r2.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: isolate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/i.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"; git checkout "$TARGET_SHA" -- .; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,P=fs.readFileSync(f,'utf8');if((P.match(/!important\b/g)||[]).length!==4)throw Error('parent');
          const sCols=':is(.service-grid, .service-grid--compact, .service-cards-grid, .profile-services-results):not([data-more-services-grid])';const sCmp=':is(.comparison-card__visual, .profile-posts-stack .comparison-card__visual, body.home-index-shell .comparison-card__visual)';
          function strip(src,selector,props){const i=src.indexOf(selector+' {');if(i<0||src.indexOf(selector+' {',i+1)>=0)throw Error(selector);const b=src.indexOf('{',i),e=src.indexOf('}',b);let z=src.slice(b+1,e);for(const p of props){const re=new RegExp('('+p+'\\s*:[^;]+?)\\s*!important\\b');if(!re.test(z))throw Error(p);z=z.replace(re,'$1')}return src.slice(0,b+1)+z+src.slice(e)}
          const variants={grid:strip(P,sCols,['grid-template-columns']),cmpBoth:strip(P,sCmp,['min-height','aspect-ratio']),cmpMin:strip(P,sCmp,['min-height']),cmpAspect:strip(P,sCmp,['aspect-ratio'])};
          const H=s=>crypto.createHash('sha256').update(Buffer.from(s)).digest('hex');for(const [k,s] of Object.entries(variants)){fs.writeFileSync('/tmp/'+k+'.css',s);console.log(`VARIANT IDENTITY|name=${k}|sha256=${H(s)}|bytes=${Buffer.byteLength(s)}|important=${(s.match(/!important\\b/g)||[]).length}`)}
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,names=['parent','grid','cmpBoth','cmpMin','cmpAspect'],css={parent:fs.readFileSync('/tmp/parent.css','utf8')};for(const n of names.slice(1))css[n]=fs.readFileSync('/tmp/'+n+'.css','utf8');const browser=await chromium.launch({headless:true}),widths=[359,379,380,381,430,560,561],modalWidths=new Set([359,380,560]),H=b=>crypto.createHash('sha256').update(b).digest('hex');const items=Array.from({length:8},(_,i)=>({id:'i10iso-'+i,serviceId:'i10iso-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'prof'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro','rapido']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));for(const h of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**','https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(h,r=>r.fulfill({status:200,body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.goto(`http://127.0.0.1:4173/index.html?iso=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(Doke.publicServiceCard.create(x,{results:true})))},items);if(state==='modal'){await p.waitForFunction(()=>Boolean(window.DokeHomeBeforeAfter?.create),null,{timeout:6000});await p.evaluate(()=>window.DokeHomeBeforeAfter.create());await p.locator('[data-before-after-id="case-bathroom"]').click();await p.waitForFunction(()=>{const e=document.querySelector('[data-before-after-preview]');return Boolean(e&&!e.hidden&&e.getAttribute('aria-hidden')!=='true')},null,{timeout:3000})}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(()=>{const g=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{display:c.display,gap:c.gap,grid:c.gridTemplateColumns,minHeight:c.minHeight,aspect:c.aspectRatio,width:c.width,height:c.height,rect:[Math.round(r.x*1000)/1000,Math.round(r.y*1000)/1000,Math.round(r.width*1000)/1000,Math.round(r.height*1000)/1000]}};return{featured:g('#featured-services-track'),more:g('[data-more-services-grid]'),cmp:g('.comparison-card__visual'),cards:document.querySelectorAll('.doke-ad-card').length,workers:document.querySelectorAll('.video-card').length}});if(data.cards<8||data.workers<6||(state==='modal'&&!data.cmp))throw Error('anatomy '+JSON.stringify(data));const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
          const states=[];for(const w of widths){states.push([w,'default']);if(modalWidths.has(w))states.push([w,'modal'])}const out={};for(const name of names){fs.writeFileSync(f,css[name]);out[name]={};for(const [w,s] of states)out[name][`${w}-${s}`]=await cap(w,s,name)}function delta(v){let md=0,sd=0,pe=0,details=[];for(const k of Object.keys(out.parent)){const a=out.parent[k],b=out[v][k];pe+=a.errs.length+b.errs.length;if(JSON.stringify(a.data)!==JSON.stringify(b.data)){md++;details.push(`${k}:${JSON.stringify({parent:a.data,variant:b.data})}`)}if(a.png!==b.png)sd++}return{md,sd,pe,details}}
          for(const v of names.slice(1)){const d=delta(v);console.log(`VARIANT RESULT|name=${v}|states=${states.length}|metadataDiffs=${d.md}|screenshotDiffs=${d.sd}|pageErrors=${d.pe}`);d.details.slice(0,12).forEach(x=>console.log(`VARIANT DETAIL|name=${v}|${x}`))}
          const dg=delta('grid'),db=delta('cmpBoth'),dm=delta('cmpMin'),da=delta('cmpAspect');if(dg.md||dg.sd||dg.pe)throw Error('grid variant not safe');if(db.md===0&&db.sd===0)console.log('COMPARISON_BOTH_SAFE=1');else console.log('COMPARISON_BOTH_SAFE=0');if(dm.md===0&&dm.sd===0)console.log('COMPARISON_MIN_SAFE=1');else console.log('COMPARISON_MIN_SAFE=0');if(da.md===0&&da.sd===0)console.log('COMPARISON_ASPECT_SAFE=1');else console.log('COMPARISON_ASPECT_SAFE=0');console.log('GRID_SAFE=1');await browser.close();fs.writeFileSync(f,css.parent)})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.isolate.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "ISOLATE=${{ steps.isolate.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(VARIANT IDENTITY|VARIANT RESULT|VARIANT DETAIL|GRID_SAFE=|COMPARISON_)' /tmp/i.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 260 /tmp/i.log || true; fi; } >/tmp/out; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 010 isolate r2 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS