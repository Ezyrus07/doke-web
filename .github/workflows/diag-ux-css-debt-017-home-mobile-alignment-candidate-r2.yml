name: Doke UX-CSS-DEBT-017 Home Mobile Alignment Candidate R2

on:
  push:
    branches:
      - diag/ux-css-debt-017-home-mobile-alignment-candidate-r2

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: b83318f51f429019cb5bc43685e33b904653f54c
      TARGET_FILE: assets/css/pages/home/mobile-alignment.css
      EXPECTED_SELECTOR: html.home-index-root body.home-index-shell section.more-services [data-more-services-grid]
      PARENT_SHA256: 662c66707e973a3c488103af65689b5b85c4459d2d17f685d1bdb736c01ee118
      CANDIDATE_SHA256: d75e60438e75833fa3e6aec4c97b51c4eaa29b70f9dd291982b12293d13cc2c3
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${PARENT_SHA256}"
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Rebuild exact deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "${TARGET_FILE}" /tmp/home-mobile-alignment-parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),file=process.env.TARGET_FILE,text=fs.readFileSync(file,'utf8');
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,selectorParts=[],atRuleParts=[],selector=null;const declarations=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;if(!selector){if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}}if(selector){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,line:i+1,selector,property:m[1].toLowerCase(),value:raw,important,context});}}depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}}if(atRuleParts.length)throw new Error('unterminated multiline at-rule');const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push({...d,winnerLine:later.line,winnerValue:later.value,winnerImportant:later.important});if(!later||d.important||!later.important)last.set(key,d);}return{lines,declarations,dead};}
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex'),p=parse(text),selector=process.env.EXPECTED_SELECTOR;
          if(sha(text)!==process.env.PARENT_SHA256||Buffer.byteLength(text)!==10472||p.declarations.length!==167||p.dead.length!==6)throw new Error('parent contract drift');
          if(p.dead.some(d=>d.selector!==selector||d.context!=='@media (max-width: 560px)'||d.important||d.winnerImportant||d.value!==d.winnerValue))throw new Error('dead row contract drift');
          const deadSet=new Set(p.dead.map(d=>d.lineIndex)),candidate=p.lines.filter((_l,i)=>!deadSet.has(i)).join('\n'),c=parse(candidate);
          if(sha(candidate)!==process.env.CANDIDATE_SHA256||Buffer.byteLength(candidate)!==10331||c.declarations.length!==161||c.dead.length!==0)throw new Error('candidate contract drift');
          fs.writeFileSync(file,candidate);fs.writeFileSync('/tmp/home-mobile-alignment-candidate.css',candidate);fs.writeFileSync('/tmp/properties.json',JSON.stringify([...new Set(p.dead.map(d=>d.property))].sort()));
          console.log('CANDIDATE R2 BUILD PASS: 167 -> 161; -6; one selector; max560; exact hash; dead 0');
          NODE
          test "$(git diff --name-only "${PARENT_SHA}" --)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}" -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}" -- "${TARGET_FILE}" | awk '{print $2}')" = "6"
          git diff --check "${PARENT_SHA}" -- "${TARGET_FILE}"

      - name: Write dual canonical plus geometry fixture parity harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/home-mobile-alignment-capture-r2.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2],selector=process.env.EXPECTED_SELECTOR,props=JSON.parse(fs.readFileSync('/tmp/properties.json','utf8')),vps=[['1600x1000',1600,1000],['1280x802',1280,802],['1024x900',1024,900],['820x1180',820,1180],['608x926',608,926],['561x900',561,900],['560x900',560,900],['390x844',390,844]],server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const capture=(el,props)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(const p of props)style[p]=String(cs.getPropertyValue(p)||'').replace(/\s+/g,' ').trim();return{rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)],style};};
          async function main(){await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const result={};for(const [name,width,height] of vps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto('http://127.0.0.1:5500/index.html',{waitUntil:'domcontentloaded',timeout:15000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});const snap=await page.evaluate(({selector,props})=>{const canonical=document.querySelector(selector);if(!canonical)throw new Error('canonical target absent');const cap=(el)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(const p of props)style[p]=String(cs.getPropertyValue(p)||'').replace(/\s+/g,' ').trim();return{rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)],style};};const canonicalSnap=cap(canonical);const section=document.createElement('section');section.className='more-services';section.setAttribute('data-ux-css-debt-017-fixture','');section.style.cssText='display:block!important;position:fixed!important;left:20px!important;top:20px!important;width:360px!important;max-width:calc(100vw - 40px)!important;visibility:visible!important;opacity:1!important;z-index:-1!important;';const grid=document.createElement('div');grid.setAttribute('data-more-services-grid','');for(let i=0;i<3;i++){const child=document.createElement('div');child.textContent='fixture-'+i;child.style.cssText='height:48px;min-width:0;box-sizing:border-box;';grid.appendChild(child);}section.appendChild(grid);document.body.appendChild(section);const fixture=cap(grid),children=[...grid.children].map(c=>{const r=c.getBoundingClientRect();return[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]});section.remove();return{media560:matchMedia('(max-width:560px)').matches,canonical:canonicalSnap,fixture:{...fixture,children}};},{selector,props});if(snap.fixture.rect[2]<=0||snap.fixture.rect[3]<=0)throw new Error(`fixture geometry non-positive ${name} ${JSON.stringify(snap.fixture.rect)}`);if(snap.fixture.children.some(r=>r[2]<=0||r[3]<=0))throw new Error(`fixture child geometry non-positive ${name}`);result[name]=snap;await ctx.close();}await browser.close();server.kill('SIGTERM');fs.writeFileSync(out,JSON.stringify(result));console.log(`DUAL RUNTIME CAPTURE PASS: ${Object.keys(result).length} viewports; canonical selector + isolated exact-selector nonzero fixture`);}
          main().catch(e=>{server.kill('SIGTERM');console.error(e);process.exit(1)});
          NODE

      - name: Capture parent runtime responsive baseline and conflicts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/home-mobile-alignment-parent.css "${TARGET_FILE}"
          node /tmp/home-mobile-alignment-capture-r2.js /tmp/parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/parent-responsive.json
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/parent-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/parent-conflicts.log

      - name: Restore candidate and enforce responsive no-rebaseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/home-mobile-alignment-candidate.css "${TARGET_FILE}"
          cp /tmp/parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log

      - name: Require exact parent candidate runtime parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/home-mobile-alignment-capture-r2.js /tmp/candidate-runtime.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/candidate-runtime.json')),diffs=[];function walk(x,y,p){if(typeof x!==typeof y||x===null||y===null||typeof x!=='object'){if(x!==y)diffs.push({path:p,parent:x,candidate:y});return;}if(Array.isArray(x)!==Array.isArray(y)){diffs.push({path:p,parent:x,candidate:y});return;}for(const k of [...new Set([...Object.keys(x),...Object.keys(y)])].sort())walk(x[k],y[k],p?`${p}.${k}`:k);}walk(a,b,'');if(diffs.length){console.error(JSON.stringify(diffs.slice(0,100),null,2));throw new Error(`runtime diffs=${diffs.length}`);}console.log('HOME MOBILE ALIGNMENT R2 COMPUTED-STYLE + BOUNDING-RECT PARITY PASS: 0 diffs');
          NODE

      - name: Validate candidate structural governance and tracked residual reduction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/candidate-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/candidate-conflicts.log
          npm run audit:agent-governance
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          grep -q 'css files: 533 (55 direct, 401 active/imported)' /tmp/legacy.log
          grep -q 'high risk active css: 37' /tmp/legacy.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css')),importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normalize=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));},meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normalize(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n);}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10;});function dc(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],st=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(const line of lines){const t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){st.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))st.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];st.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];st.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim();ds.push({selector:sel,property:m[1].toLowerCase(),important:/\s*!important\s*$/i.test(raw),context:st.filter(x=>x.type==='at').map(x=>x.header).join(' || ')});}}depth+=o-c;while(st.length&&depth<=st[st.length-1].depthBefore){const p=st.pop();if(p.type==='rule')sel=null;}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(k);if(later&&(!d.important||later.important))dead++;if(!later||d.important||!later.important)last.set(k,d);}return dead;}const rows=[...active].map(f=>[f,dc(meta.get(f).text)]).filter(([,d])=>d),total=rows.reduce((n,[,d])=>n+d,0),highRows=rows.filter(([f])=>high.includes(f));if(active.size!==401||high.length!==37||rows.length!==57||total!==1311||highRows.length!==0)throw new Error(`residual drift active=${active.size} high=${high.length} files=${rows.length} dead=${total} highDead=${highRows.length}`);console.log('TRACKED RESIDUAL INVENTORY PASS: 57 files / 1311 superseded / 0 high-risk residual files');
          NODE
          git reset --hard "${PARENT_SHA}"
          git clean -fd
          cp /tmp/home-mobile-alignment-candidate.css "${TARGET_FILE}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${CANDIDATE_SHA256}"
          test "$(git diff --name-only "${PARENT_SHA}" --)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}" -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}" -- "${TARGET_FILE}" | awk '{print $2}')" = "6"
          git diff --check "${PARENT_SHA}" -- "${TARGET_FILE}"
