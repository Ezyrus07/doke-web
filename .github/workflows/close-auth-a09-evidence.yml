name: Close AUTH-A09 Evidence

on:
  push:
    branches:
      - 'auth/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    name: Publish AUTH-A09 closure documents
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.head_commit.message, 'Request AUTH-A09 closure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare closure evidence
        run: node scripts/close-auth-a09-evidence.js

      - name: Regenerate deterministic matrix
        run: |
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git diff --check

      - name: Verify exact closure diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$'docs/DOKE-ENGINEERING-JOURNAL.md\ndocs/DOMAIN-COMPLETION-MATRIX.md\ndocs/validation/AUTH-001-A09-PROVIDER-AUTHORITY.json\ndocs/validation/AUTH-001-A09-PROVIDER-AUTHORITY.md'
          actual="$(git diff --name-only | sort)"
          printf 'Expected closure files:\n%s\n' "$expected"
          printf 'Actual closure files:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Publish exact closure documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/DOKE-ENGINEERING-JOURNAL.md \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            docs/validation/AUTH-001-A09-PROVIDER-AUTHORITY.json \
            docs/validation/AUTH-001-A09-PROVIDER-AUTHORITY.md
          git commit -m 'Record AUTH-A09 closure evidence'
          git push origin HEAD:${{ github.ref_name }}
