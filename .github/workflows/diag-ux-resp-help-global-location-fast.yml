name: Doke diagnostic — ajuda shared location fast

on:
  push:
    branches:
      - diag/ux-resp-help-remaining-debt
    paths:
      - .github/workflows/diag-ux-resp-help-global-location-fast.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Generate baseline
        run: node scripts/generate-responsive-index-baseline.js
      - name: Execute and classify responsive contract
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 0 -o "${STATUS}" -eq 1
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json', 'utf8'));
          const byBreakpoint = {};
          for (const failure of report.failures) {
            byBreakpoint[failure.breakpoint] = (byBreakpoint[failure.breakpoint] || 0) + 1;
          }
          console.log('[diag-shared-location] final summary');
          console.log(JSON.stringify({
            status: report.status,
            checks: report.summary.checks,
            failures: report.summary.failures,
            skips: report.summary.skips,
            failuresByPage: report.summary.failuresByPage,
            failuresByComponent: report.summary.failuresByComponent,
            failuresByBreakpoint: byBreakpoint,
          }));
          NODE
