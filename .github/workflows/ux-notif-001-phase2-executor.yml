name: UX-NOTIF-001 Phase 2 Repository Executor

on:
  push:
    branches:
      - ux/ux-notif-001-center-badge-authority
    paths:
      - '.github/workflows/ux-notif-001-phase2-executor.yml'

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ux/ux-notif-001-center-badge-authority

      - name: Fail closed on concurrent branch movement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ux/ux-notif-001-center-badge-authority
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/ux/ux-notif-001-center-badge-authority)" = "${GITHUB_SHA}"

      - name: Narrow repository assertion
        run: python .github/scripts/ux-notif-001-phase2-fix.py

      - name: Apply exact Phase 2 authority integration
        run: python .github/scripts/ux-notif-001-phase2-executor.py

      - name: Validate repository-only integration
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/core/notification-center.js
          node --check assets/js/features/in-app-notifications.js
          node --check assets/js/pages/notificacoes.js
          node --check assets/js/repositories/notifications-repository.js
          node --check scripts/test-ux-notif-001-in-app-adapter.js
          node --check scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-notification-center-v2-contract.js
          node scripts/test-notification-quick-actions-contract.js
          node scripts/test-notification-quick-actions-v2-contract.js
          node scripts/test-notification-delivery-controls-contract.js
          node scripts/test-notification-authority-contract.js
          node scripts/test-notifications-supabase-repository-contract.js
          node scripts/audit-notifications-api-contract.js
          node scripts/test-ux-priv-001-account-storage.js
          node scripts/audit-auth-session-contracts.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Remove executor and publish atomic Phase 2 commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ux-notif-001-phase2-executor.yml .github/scripts/ux-notif-001-phase2-executor.py .github/scripts/ux-notif-001-phase2-fix.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ux-notif-001): delegate notification center authority'
          git push origin HEAD:ux/ux-notif-001-center-badge-authority
