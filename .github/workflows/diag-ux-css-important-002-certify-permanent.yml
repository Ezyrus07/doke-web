name: Doke UX CSS Important 002 Certify Permanent
on:
  push:
    branches: [diag/ux-css-important-002-certify-permanent]
    paths: [.github/workflows/diag-ux-css-important-002-certify-permanent.yml]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: b44fe12f2e81cbe155f154527aed78b90144c552
      PARENT_SHA: 5c9c3d2fad3b4e7e9cf74201f080cca9ddffe2e5
      TARGET_TREE: 2c86e4c70105cf376c78c9a597a21989c94c3a6d
      TARGET_FILE: assets/css/pages/home/mobile-layout.css
      PARENT_BLOB: bd00e9596d9db4c2ad68e34aeaccbdfc82cedbf0
      TARGET_BLOB: 576d351eb5e1447cd6e1e188e005b8153573fb3f
      EXPECTED_SHA256: 74cebbcd7f3bb10731a6f2deefe3513456f217b1228ce5e742834a6633d1d4d9
      EXPECTED_BYTES: '5832'
      PERMANENT_BRANCH: ux/ux-css-important-002-home-mobile-layout
      DIAG_BRANCH: diag/ux-css-important-002-certify-permanent
      RESULT_FILE: .diagnostics/ux-css-important-002-certification.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: certify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/cert.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$TARGET_SHA"
          test "$(git diff --name-only "$PARENT_SHA".."$TARGET_SHA")" = "$TARGET_FILE"; test "$(git diff --numstat "$PARENT_SHA".."$TARGET_SHA" -- "$TARGET_FILE")" = $'2\t2\t'"$TARGET_FILE"
          npm ci --ignore-scripts
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),f=process.env.TARGET_FILE;const target=fs.readFileSync(f),h=crypto.createHash('sha256').update(target).digest('hex');if(h!==process.env.EXPECTED_SHA256||target.length!==+process.env.EXPECTED_BYTES||(target.toString().match(/!important\b/g)||[]).length!==29)throw Error(`target identity ${h}/${target.length}`);const parent=cp.execFileSync('git',['show',`${process.env.PARENT_SHA}:${f}`],{encoding:'utf8'}),a='    grid-template-columns: minmax(0, 1fr) auto !important;',b='    grid-template-columns: minmax(0, 1fr) auto;',c='  body.home-index-shell .short-videos .content-rail {\n    display: block !important;\n    overflow: visible !important;\n  }',d='  body.home-index-shell .short-videos .content-rail {\n    display: block !important;\n    overflow: visible;\n  }';if((parent.match(/!important\b/g)||[]).length!==31||(parent.split(a).length-1)!==1||(parent.split(c).length-1)!==1)throw Error('parent drift');const rebuilt=Buffer.from(parent.replace(a,b).replace(c,d));if(!rebuilt.equals(target))throw Error('reconstruction mismatch');console.log(`IDENTITY PASS|sha=${process.env.TARGET_SHA}|parent=${process.env.PARENT_SHA}|tree=${process.env.TARGET_TREE}|parentBlob=${process.env.PARENT_BLOB}|targetBlob=${process.env.TARGET_BLOB}|sha256=${h}|bytes=${target.length}|fullHistory=1|files=1|additions=2|deletions=2|important=29`);console.log('RECONSTRUCTION PASS|byteIdentical=1|important=31->29|rulesChanged=2');
          NODE
          cp "$TARGET_FILE" /tmp/permanent.css
          git checkout "$PARENT_SHA" -- "$TARGET_FILE"
          node scripts/generate-responsive-index-baseline.js
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"
          cmp -s "$TARGET_FILE" /tmp/permanent.css
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log; grep -q 'Failures: 0' /tmp/responsive.log; grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|baselineSource=exact-parent'
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflicts');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`)
          NODE
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log; grep -q 'Duplicate groups: 0' /tmp/dup.log; grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log; grep -q 'Domains: 23' /tmp/domain.log; grep -q 'Critical flows: 15' /tmp/domain.log; grep -q 'Average maturity: 2.91/6' /tmp/domain.log; grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures
          npm run audit:important-reduction-plan
          npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8')),s=b.summary;if(s.totalImportant!==11257||s.outsideServiceCardImportant!==11195||s.filesWithImportant!==35)throw Error(`important ${JSON.stringify(s)}`);if(p.summary.affectedFiles!==34||p.summary.totalImportantOutsideServiceCard!==11195||p.summary.lowRiskFileCount!==0||p.summary.byRisk?.['high-baseline-required']!==11195)throw Error(`plan ${JSON.stringify(p.summary)}`);console.log('IMPORTANT BASELINE PASS|total=11257|outsideServiceCard=11195|files=35|targetImportant=29|delta=-2');console.log('QUEUE PASS|affectedFiles=34|lowRiskFiles=0|highBaselineRequired=11195');
          NODE
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`)
          NODE
          echo "AUDIT_EXIT=$code"
          echo 'PROOF TRANSFER PASS|source=32136032886|raw=32135959438|visual=32136610480|governance=32136770675|candidateSha256=74cebbcd7f3bb10731a6f2deefe3513456f217b1228ce5e742834a6633d1d4d9|computedDiffs=0|geometryDiffs=0|screenshotDiffs=0'
          echo 'GOVERNANCE PASS|duplicates=0/0|domain=23/15/2.91/12'
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"; test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$TARGET_SHA"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.certify.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_TREE=$TARGET_TREE"; echo "PARENT_BLOB=$PARENT_BLOB"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo "CERTIFY=${{ steps.certify.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(IDENTITY PASS|RECONSTRUCTION PASS|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT BASELINE PASS|QUEUE PASS|DEPENDENCY PASS|PROOF TRANSFER PASS|GOVERNANCE PASS)\|' /tmp/cert.log || true; grep '^AUDIT_EXIT=' /tmp/cert.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 240 /tmp/cert.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 002 certification [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
