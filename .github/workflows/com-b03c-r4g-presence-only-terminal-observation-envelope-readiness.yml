name: COM-B03C-R4G Presence-Only Terminal Observation Envelope Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4g.js'
      - 'scripts/execute-com-b03c-r4g-presence-only-terminal-observation-envelope.js'
      - 'config/com-b03c-r4g-presence-only-terminal-observation-envelope-readiness.json'
      - 'docs/validation/COM-B03C-R4G-PRESENCE-ONLY-TERMINAL-OBSERVATION-ENVELOPE-READINESS.json'
      - 'docs/validation/COM-B03C-R4F-PRESENCE-ONLY-JOIN-TERMINAL-STATUS-NARROWING-READINESS.json'
      - '.github/workflows/com-b03c-r4g-presence-only-terminal-observation-envelope-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

concurrency:
  group: com-b03c-r4g-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4g.js
          node --check scripts/execute-com-b03c-r4g-presence-only-terminal-observation-envelope.js
      - name: R4G repository executable observation envelope
        run: |
          node - <<'NODE'
          const r4g = require('./backend/modules/communities/community-realtime-private-auth-r4g');
          const config = require('./config/com-b03c-r4g-presence-only-terminal-observation-envelope-readiness.json');
          const result = r4g.evaluateRepositoryReadiness(config.readinessInput);
          if (result.decision !== r4g.STATUS) process.exit(1);
          if (result.repositoryExecutableObservationAuthority !== true) process.exit(1);
          NODE
          node scripts/execute-com-b03c-r4g-presence-only-terminal-observation-envelope.js --repository-self-test
      - name: No remote authority or trigger surface
        shell: bash
        run: |
          test ! -e config/com-b03c-r4g-single-use-hosted-observation-trigger.json
          node - <<'NODE'
          const r4g = require('./backend/modules/communities/community-realtime-private-auth-r4g');
          const config = require('./config/com-b03c-r4g-presence-only-terminal-observation-envelope-readiness.json');
          const result = r4g.evaluateRepositoryReadiness(config.readinessInput);
          for (const field of [
            'remoteExecutionAuthority','triggerCreationAuthority','remoteCredentialReadAuthority',
            'remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority',
            'stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority',
            'runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority'
          ]) if (result[field] !== false) process.exit(1);
          NODE
      - name: Historical adapters unchanged in R4G delta
        shell: bash
        run: |
          R4F_HEAD=7fd98abce7aa3473cde8228f68d791e5ee493ef4
          test -z "$(git diff --name-only "$R4F_HEAD" "${{ github.event.pull_request.head.sha }}" -- \
            scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js \
            scripts/execute-com-b03c-r3v-single-use-remote-execution-envelope.js)"
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
