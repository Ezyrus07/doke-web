name: COM-B03C-R4P Temporary Domain Matrix Writer

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r4p-domain-matrix-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r4p-domain-matrix-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: e63d033fb398c90c8aac34a1ab7ec2505f85c111
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r4p-domain-matrix-writer-temp.yml
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fail-closed self-cleanup lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Remove temporary writer before final generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"

      - name: Generate final canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix

      - name: Enforce bounded final scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff HEAD --name-only | sort)
          printf 'final-scope: %s\n' "${actual[@]}"
          test "${#actual[@]}" -ge 2
          printf '%s\n' "${actual[@]}" | grep -Fxq "${WRITER_PATH}"
          matrix_output_seen=false
          for path in "${actual[@]}"; do
            case "${path}" in
              "${WRITER_PATH}") ;;
              "${MATRIX_MD}"|"${MATRIX_JSON}") matrix_output_seen=true ;;
              *) echo "unexpected final-scope path: ${path}" >&2; exit 1 ;;
            esac
          done
          test "${matrix_output_seen}" = "true"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Commit writer removal and canonical outputs atomically
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- "${WRITER_PATH}" "${MATRIX_MD}"
          git add -f -- "${MATRIX_JSON}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          printf 'staged-final-scope: %s\n' "${staged[@]}"
          test "${#staged[@]}" -ge 2
          printf '%s\n' "${staged[@]}" | grep -Fxq "${WRITER_PATH}"
          matrix_output_seen=false
          for path in "${staged[@]}"; do
            case "${path}" in
              "${WRITER_PATH}") ;;
              "${MATRIX_MD}"|"${MATRIX_JSON}") matrix_output_seen=true ;;
              *) echo "unexpected staged path: ${path}" >&2; exit 1 ;;
            esac
          done
          test "${matrix_output_seen}" = "true"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(com): remove temporary R4P writer and freeze matrix'
          git push origin "HEAD:${TARGET_BRANCH}"
