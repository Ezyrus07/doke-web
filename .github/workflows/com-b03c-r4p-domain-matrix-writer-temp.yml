name: COM-B03C-R4P Temporary Domain Matrix Writer

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r4p-domain-matrix-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r4p-domain-matrix-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 988bd5573af89a30308b9763d8d6e71352f0d71c
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r4p-domain-matrix-writer-temp.yml
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fail-closed installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix

      - name: Enforce exact writer scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "${MATRIX_MD}" "${MATRIX_JSON}" | sort)"
          test "${actual}" = "${expected}"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Commit canonical outputs only
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${MATRIX_MD}" "${MATRIX_JSON}"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "${MATRIX_MD}" "${MATRIX_JSON}" | sort)"
          test "${staged}" = "${expected}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): reconcile domain matrix after R4P authorization consumption'
          git push origin "HEAD:${TARGET_BRANCH}"
