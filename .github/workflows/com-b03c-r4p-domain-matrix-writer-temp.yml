name: COM-B03C-R4P Temporary Domain Matrix Writer

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r4p-domain-matrix-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r4p-domain-matrix-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 33679c505f38be248a78716a561ea65ee3a30eee
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r4p-domain-matrix-writer-temp.yml
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fail-closed self-cleanup lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Remove temporary writer before final generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"

      - name: Generate final canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix

      - name: Enforce writer-deletion-only final scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff HEAD --name-only)"
          printf 'final-scope: %s\n' "${actual}"
          test "${actual}" = "${WRITER_PATH}"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Commit already-staged writer removal only
        shell: bash
        run: |
          set -euo pipefail
          staged="$(git diff --cached --name-only)"
          printf 'staged-final-scope: %s\n' "${staged}"
          test "${staged}" = "${WRITER_PATH}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(com): remove temporary R4P matrix writer'
          git push origin "HEAD:${TARGET_BRANCH}"
