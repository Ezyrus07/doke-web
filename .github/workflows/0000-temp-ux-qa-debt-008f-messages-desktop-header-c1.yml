name: TEMP UX-QA-DEBT-008F Messages Desktop Header C1

on:
  push:
    branches:
      - diag/ux-qa-debt-008f-messages-desktop-header-c1

permissions:
  contents: read

jobs:
  candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PARENT: a50b9faa83c975e3c70b01a7185d178445fc2d8c
      PARENT_TREE: 25273d0bc3754badfd27360ca2d613e0a17c2fd3
      PERMANENT_BRANCH: qa/ux-qa-debt-008e-results-header-rail-contract
      TEMP_PATH: .github/workflows/0000-temp-ux-qa-debt-008f-messages-desktop-header-c1.yml
      MOBILE_PATH: assets/css/pages/chat-mobile-navigation.css
      RESPONSIVE_PATH: assets/css/pages/chat-responsive-state.css
      MOBILE_PARENT_BLOB: 8ff7c626c1bf20f8814cb27ff6ce6e7bffa1491e
      RESPONSIVE_PARENT_BLOB: 4a77ff3f0a9befd89a8294be65d014a5eddb7b6c
      MESSAGES_HTML_BLOB: 7259ddb38a68e911af815e2d7e628ac6d70dc945
      COMMUNITY_HTML_BLOB: ba3923026a532fa86f0784f34c3db71a2759ee11
      GLOBAL_LAYOUT_TEST_BLOB: 3ac328c5722da0cd593003f01422546337c01116
      GLOBAL_LAYOUT_DOC_BLOB: 47f39b3e1f2f4fc1e23e027f2aad1b4ca2bc6b00
      SHARED_HEADER_AUDIT_BLOB: 5829a86b326061c39d466f28a102b530343049a7
      HEADER_RAIL_TEST_BLOB: a22d001094f6e0a5de131c51003b11ab95d923c2

    steps:
      - name: Checkout C1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze candidate scope and authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-list --count "$PARENT"..HEAD)" = "1"

          mapfile -t changed < <(git diff --name-only "$PARENT"..HEAD | sort)
          expected=(
            "$TEMP_PATH"
            "$MOBILE_PATH"
            "$RESPONSIVE_PATH"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = "3"
          test "${changed[*]}" = "${expected_sorted[*]}"

          remote_parent="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_parent" = "$PARENT"

          test "$(git rev-parse "$PARENT:$MOBILE_PATH")" = "$MOBILE_PARENT_BLOB"
          test "$(git rev-parse "$PARENT:$RESPONSIVE_PATH")" = "$RESPONSIVE_PARENT_BLOB"
          test "$(git rev-parse "$PARENT:mensagens.html")" = "$MESSAGES_HTML_BLOB"
          test "$(git rev-parse "$PARENT:comunidade-interna.html")" = "$COMMUNITY_HTML_BLOB"
          test "$(git rev-parse "$PARENT:tests/e2e/global-layout-contract.spec.js")" = "$GLOBAL_LAYOUT_TEST_BLOB"
          test "$(git rev-parse "$PARENT:docs/GLOBAL-LAYOUT-CONTRACT.md")" = "$GLOBAL_LAYOUT_DOC_BLOB"
          test "$(git rev-parse "$PARENT:scripts/audit-shared-app-header-contract.js")" = "$SHARED_HEADER_AUDIT_BLOB"
          test "$(git rev-parse "$PARENT:scripts/test-header-rail-contract.js")" = "$HEADER_RAIL_TEST_BLOB"

      - name: Prove exact two-owner CSS transformation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const parent = process.env.PARENT;
          const mobilePath = process.env.MOBILE_PATH;
          const responsivePath = process.env.RESPONSIVE_PATH;
          const show = (path) => cp.execFileSync('git', ['show', `${parent}:${path}`], { encoding: 'utf8' });
          const replaceExactlyOnce = (text, from, to, label) => {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`${label}: source fragment missing`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`${label}: source fragment not unique`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          };

          const mobileParent = show(mobilePath);
          let mobileExpected = replaceExactlyOnce(
            mobileParent,
            `/* Doke chat mobile navigation controls.\n * Scope: mensagens.html and comunidade-interna.html.\n * Responsibility: keep chat pages without the global top header while preserving\n * access to the global sidebar drawer in viewports where the desktop sidebar is hidden.\n */`,
            `/* Doke chat mobile navigation controls.\n * Scope: mensagens.html and comunidade-interna.html.\n * Responsibility: provide shared chat shell menu controls while suppressing the\n * global top header only for the approved comunidade-interna workspace.\n */`,
            'mobile ownership comment',
          );
          mobileExpected = replaceExactlyOnce(
            mobileExpected,
            `body:is([data-page="mensagens"], [data-page="comunidade-interna"]) > .app-shell > .page > .app-header {\n  display: none;\n}`,
            `body[data-page="comunidade-interna"] > .app-shell > .page > .app-header {\n  display: none;\n}`,
            'mobile base hide',
          );
          const mobileCurrent = fs.readFileSync(mobilePath, 'utf8');
          if (mobileCurrent !== mobileExpected) throw new Error('chat-mobile-navigation.css contains changes outside frozen C1 transformation');

          const responsiveParent = show(responsivePath);
          let responsiveExpected = replaceExactlyOnce(
            responsiveParent,
            `/* Chat list global header adapter.\n   Scope: mensagens.html and comunidade-interna.html list/canal states only.\n   Responsibility: consume the existing global .app-header/home-side-meta contract\n   instead of recreating header/profile geometry inside chat CSS. Thread states\n   remain full chat workspaces without a global top header. */`,
            `/* Chat list global header adapter.\n   Scope: mensagens.html and comunidade-interna.html list/canal states only.\n   Responsibility: consume the existing global .app-header/home-side-meta contract\n   instead of recreating header/profile geometry inside chat CSS. Mensagens keeps\n   the global header in desktop split/list states; only the approved\n   comunidade-interna workspace keeps the base no-global-header state. Compact\n   thread states remain full chat workspaces without a global top header. */`,
            'responsive ownership comment',
          );
          responsiveExpected = replaceExactlyOnce(
            responsiveExpected,
            `body:is([data-page="mensagens"], [data-page="comunidade-interna"]) > .app-shell > .page > .chat-list-app-header {\n  display: none;\n}`,
            `body[data-page="comunidade-interna"] > .app-shell > .page > .chat-list-app-header {\n  display: none;\n}`,
            'responsive base hide',
          );
          const responsiveCurrent = fs.readFileSync(responsivePath, 'utf8');
          if (responsiveCurrent !== responsiveExpected) throw new Error('chat-responsive-state.css contains changes outside frozen C1 transformation');

          if (/!important/.test(mobileCurrent) && !/!important/.test(mobileParent)) throw new Error('C1 introduced !important in mobile owner');
          if (/!important/.test(responsiveCurrent) && !/!important/.test(responsiveParent)) throw new Error('C1 introduced !important in responsive owner');
          console.log('008F C1 exact two-owner CSS transformation: PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Governance and shared-header gates
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:shared-app-header-contract
          git diff --check "$PARENT"..HEAD

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Permanent header-rail contract
        run: npm run test:header-rail-contract

      - name: Permanent global layout contract
        run: npm run test:layout-contract

      - name: Browser direct and stable-shell C1 validation
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/ux-qa-debt-008f-c1-browser.json
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "${RUNNER_TEMP}/ux-qa-debt-008f-c1-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/mensagens.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/mensagens.html >/dev/null

          cat > "${RUNNER_TEMP}/ux-qa-debt-008f-c1-probe.cjs" <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');

          const baseURL = 'http://127.0.0.1:4173';
          const viewports = [
            { name: 'desktop-1366x768', width: 1366, height: 768 },
            { name: 'tablet-820x1180', width: 820, height: 1180 },
            { name: 'mobile-390x844', width: 390, height: 844 },
          ];
          const authenticatedSession = {
            provider: 'mock',
            sessionStatus: 'active',
            accountStatus: 'active',
            user: {
              id: 'ux-qa-debt-008f-c1',
              role: 'client',
              name: 'Cliente 008F C1',
              email: 'qa008f-c1@example.test',
              accountStatus: 'active',
            },
          };

          async function prepareContext(browser, viewport) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            const blockedRemoteRequests = [];
            await context.route('**/*', async (route) => {
              const request = route.request();
              const url = new URL(request.url());
              if (url.hostname === '127.0.0.1' || url.hostname === 'localhost') return route.continue();
              if (url.hostname === 'fonts.googleapis.com') return route.fulfill({ status: 200, contentType: 'text/css; charset=utf-8', body: '' });
              if (url.hostname === 'fonts.gstatic.com') return route.abort();
              if (url.hostname === 'cdn.jsdelivr.net' || url.hostname === 'unpkg.com') return route.fulfill({ status: 200, contentType: 'application/javascript; charset=utf-8', body: '' });
              blockedRemoteRequests.push(request.url());
              return route.abort();
            });
            await context.addInitScript((session) => {
              localStorage.setItem('doke.auth.session.v1', JSON.stringify(session));
            }, authenticatedSession);
            return { context, blockedRemoteRequests };
          }

          async function waitForSettled(page) {
            await page.waitForLoadState('domcontentloaded');
            await page.waitForLoadState('networkidle').catch(() => {});
            await page.waitForFunction(() => document.body && document.body.dataset.page, null, { timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(350);
          }

          async function headerState(page) {
            return page.evaluate(() => {
              const headers = Array.from(document.querySelectorAll('[data-app-header]'));
              const header = headers[0] || null;
              const rect = header?.getBoundingClientRect() || null;
              const style = header ? getComputedStyle(header) : null;
              const root = document.documentElement;
              return {
                bodyPage: document.body?.dataset?.page || null,
                headerCount: headers.length,
                display: style?.display || null,
                visibility: style?.visibility || null,
                width: rect?.width || 0,
                height: rect?.height || 0,
                scrollWidth: root.scrollWidth,
                clientWidth: root.clientWidth,
                overflowX: root.scrollWidth - root.clientWidth,
              };
            });
          }

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }
          function assertVisible(state, label) {
            assert(state.headerCount === 1, `${label}: expected exactly one app header, got ${state.headerCount}`);
            assert(state.display !== 'none', `${label}: header must be visible, display=${state.display}`);
            assert(state.visibility !== 'hidden', `${label}: header visibility hidden`);
            assert(state.width > 0 && state.height > 0, `${label}: header rect must be positive, got ${state.width}x${state.height}`);
            assert(state.scrollWidth <= state.clientWidth + 1, `${label}: horizontal overflow ${state.scrollWidth}-${state.clientWidth}`);
          }
          function assertHidden(state, label) {
            assert(state.headerCount === 1, `${label}: expected exactly one app header, got ${state.headerCount}`);
            assert(state.display === 'none', `${label}: header must be hidden, display=${state.display}`);
            assert(state.scrollWidth <= state.clientWidth + 1, `${label}: horizontal overflow ${state.scrollWidth}-${state.clientWidth}`);
          }

          async function directMessages(browser, viewport) {
            const { context, blockedRemoteRequests } = await prepareContext(browser, viewport);
            const page = await context.newPage();
            await page.goto(`${baseURL}/mensagens.html`);
            await waitForSettled(page);
            const listState = await headerState(page);
            assert(listState.bodyPage === 'mensagens', `${viewport.name} direct messages: body page drift ${listState.bodyPage}`);
            assertVisible(listState, `${viewport.name} direct messages list`);

            let threadState = null;
            let restoredState = null;
            if (viewport.width <= 1180) {
              await page.evaluate(() => {
                document.body.classList.add('messages-thread-is-open');
                document.querySelector('.messages-app')?.classList.add('messages-app--thread-open');
              });
              threadState = await headerState(page);
              assertHidden(threadState, `${viewport.name} direct messages compact thread`);
              await page.evaluate(() => {
                document.body.classList.remove('messages-thread-is-open');
                document.querySelector('.messages-app')?.classList.remove('messages-app--thread-open');
              });
              restoredState = await headerState(page);
              assertVisible(restoredState, `${viewport.name} direct messages list restored`);
            }
            await context.close();
            return { listState, threadState, restoredState, blockedRemoteRequestCount: blockedRemoteRequests.length };
          }

          async function directCommunity(browser, viewport) {
            const { context, blockedRemoteRequests } = await prepareContext(browser, viewport);
            const page = await context.newPage();
            await page.goto(`${baseURL}/comunidade-interna.html`);
            await waitForSettled(page);
            const baseState = await headerState(page);
            assert(baseState.bodyPage === 'comunidade-interna', `${viewport.name} direct community: body page drift ${baseState.bodyPage}`);
            if (viewport.width > 1180) assertHidden(baseState, `${viewport.name} direct community desktop workspace`);
            else assertVisible(baseState, `${viewport.name} direct community compact list`);

            let threadState = null;
            let restoredState = null;
            if (viewport.width <= 1180) {
              await page.evaluate(() => {
                document.body.classList.add('community-room-thread-is-open');
                const layout = document.querySelector('.community-room-layout');
                if (layout) layout.setAttribute('data-mobile-view', 'thread');
              });
              threadState = await headerState(page);
              assertHidden(threadState, `${viewport.name} direct community compact thread`);
              await page.evaluate(() => {
                document.body.classList.remove('community-room-thread-is-open');
                const layout = document.querySelector('.community-room-layout');
                if (layout) layout.removeAttribute('data-mobile-view');
              });
              restoredState = await headerState(page);
              assertVisible(restoredState, `${viewport.name} direct community list restored`);
            }
            await context.close();
            return { baseState, threadState, restoredState, blockedRemoteRequestCount: blockedRemoteRequests.length };
          }

          async function stableMessages(browser, viewport) {
            const { context, blockedRemoteRequests } = await prepareContext(browser, viewport);
            const page = await context.newPage();
            await page.goto(`${baseURL}/index.html`);
            await waitForSettled(page);
            await page.waitForFunction(() => typeof window.DokeNavigate === 'function', null, { timeout: 10000 });
            await page.evaluate(() => {
              window.__qa008fC1Marker = `marker-${Date.now()}`;
              window.__qa008fC1NavigationCount = performance.getEntriesByType('navigation').length;
              window.__qa008fC1Header = document.querySelector('[data-app-header]');
            });
            const marker = await page.evaluate(() => window.__qa008fC1Marker);
            await page.evaluate(async () => {
              const result = window.DokeNavigate('/mensagens.html');
              if (result && typeof result.then === 'function') await result;
            });
            await page.waitForURL(/\/mensagens\.html(?:$|[?#])/);
            await waitForSettled(page);
            const shell = await page.evaluate(() => ({
              marker: window.__qa008fC1Marker,
              documentNavigationCount: performance.getEntriesByType('navigation').length,
              initialDocumentNavigationCount: window.__qa008fC1NavigationCount,
              adapter: document.body.dataset.dokeNavigationAdapter || null,
              headerPreserved: window.__qa008fC1Header === document.querySelector('[data-app-header]'),
            }));
            assert(shell.marker === marker, `${viewport.name} stable messages: JS marker lost`);
            assert(shell.documentNavigationCount === shell.initialDocumentNavigationCount, `${viewport.name} stable messages: new document navigation observed`);
            assert(shell.adapter === 'stable-shell', `${viewport.name} stable messages: adapter=${shell.adapter}`);
            assert(shell.headerPreserved === true, `${viewport.name} stable messages: header identity not preserved`);

            const listState = await headerState(page);
            assert(listState.bodyPage === 'mensagens', `${viewport.name} stable messages: body page drift ${listState.bodyPage}`);
            assertVisible(listState, `${viewport.name} stable messages list`);

            let threadState = null;
            let restoredState = null;
            if (viewport.width <= 1180) {
              await page.evaluate(() => {
                document.body.classList.add('messages-thread-is-open');
                document.querySelector('.messages-app')?.classList.add('messages-app--thread-open');
              });
              threadState = await headerState(page);
              assertHidden(threadState, `${viewport.name} stable messages compact thread`);
              await page.evaluate(() => {
                document.body.classList.remove('messages-thread-is-open');
                document.querySelector('.messages-app')?.classList.remove('messages-app--thread-open');
              });
              restoredState = await headerState(page);
              assertVisible(restoredState, `${viewport.name} stable messages list restored`);
            }
            await context.close();
            return { shell, listState, threadState, restoredState, blockedRemoteRequestCount: blockedRemoteRequests.length };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const report = { classification: 'CANDIDATE_PENDING', viewports: [] };
            try {
              for (const viewport of viewports) {
                const direct = await directMessages(browser, viewport);
                const community = await directCommunity(browser, viewport);
                const stable = await stableMessages(browser, viewport);
                report.viewports.push({ viewport, direct, community, stable });
              }
              report.classification = 'C1_BROWSER_VALIDATED_DIRECT_STABLE_THREE_VIEWPORTS';
              fs.writeFileSync(process.env.REPORT_PATH, `${JSON.stringify(report, null, 2)}\n`);
              console.log('UX_QA_DEBT_008F_C1_BROWSER=' + JSON.stringify(report));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "${RUNNER_TEMP}/ux-qa-debt-008f-c1-probe.cjs"

      - name: Build C1 receipt
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/ux-qa-debt-008f-c1-browser.json
          RECEIPT_PATH: ${{ runner.temp }}/ux-qa-debt-008f-c1-receipt.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const browser = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const sh = (args) => cp.execFileSync('git', args, { encoding: 'utf8' }).trim();
          const receipt = {
            boundary: 'UX-QA-DEBT-008F-C1',
            classification: 'C1_CANDIDATE_BROWSER_AND_PERMANENT_CONTRACTS_PASS',
            parent: process.env.PARENT,
            parentTree: process.env.PARENT_TREE,
            head: sh(['rev-parse', 'HEAD']),
            tree: sh(['rev-parse', 'HEAD^{tree}']),
            changedPaths: sh(['diff', '--name-only', `${process.env.PARENT}..HEAD`]).split('\n').filter(Boolean).sort(),
            browser,
            criteriaRelaxed: 0,
            introducedRegressions: 0,
            matrixMutation: false,
            snapshotMutation: false,
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`);
          console.log('UX_QA_DEBT_008F_C1_RECEIPT=' + JSON.stringify(receipt));
          NODE

      - name: Post-gates scope and parent immutability
        shell: bash
        run: |
          set -euo pipefail
          remote_parent="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_parent" = "$PARENT"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-list --count "$PARENT"..HEAD)" = "1"
          mapfile -t changed < <(git diff --name-only "$PARENT"..HEAD | sort)
          test "${#changed[@]}" = "3"
          test "${changed[0]}" = "$TEMP_PATH"
          test "${changed[1]}" = "$MOBILE_PATH"
          test "${changed[2]}" = "$RESPONSIVE_PATH"
          git diff --check "$PARENT"..HEAD

      - name: Upload C1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-debt-008f-c1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ux-qa-debt-008f-c1-browser.json
            ${{ runner.temp }}/ux-qa-debt-008f-c1-receipt.json
          if-no-files-found: error
