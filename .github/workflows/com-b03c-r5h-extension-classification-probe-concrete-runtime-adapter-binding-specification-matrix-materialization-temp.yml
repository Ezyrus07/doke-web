name: COM-B03C R5H Concrete Runtime Adapter Binding Specification Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "f055c02b60a545b18c095454f744157e28698c07"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed concrete runtime adapter binding specification assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification.json)" = "9f30614b073b62eb90724867204f95b02373020a"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification.yml)" = "c8cf38e556a977f808a95727e8eafc50ac91673b"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-boundary.json)" = "a2e7e516c0ca57239dfa584095d6d6349b810e32"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          node - <<'NODE'
          const spec = require('./config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification.json');
          if (spec.contractId !== 'com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification-v1') throw new Error('SPEC_CONTRACT_DRIFT');
          if (spec.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || spec.functionalCheckpoint.r5iCreated !== false || spec.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          const state = spec.bindingSpecification;
          if (state.repositoryOnlySpecification !== true || state.specificationOnly !== true || state.concreteRuntimeAdapterBindingSpecificationDefined !== true) throw new Error('SPEC_STATE_DRIFT');
          for (const key of ['runtimeAdapterBindingDefined','runtimeAdapterBound','runtimeAdapterImplementationPresent','targetEnvironmentBindingAllowed','targetResourceBindingAllowed','dependentPortBindingAllowed','credentialMaterialAllowed','syntheticIdentityMaterialAllowed','networkEndpointAllowed','executionEntrypointAllowed','executionWorkflowAllowed','remoteExecutionAllowed']) {
            if (state[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          for (const key of ['adapterContractId','adapterModulePath','adapterModuleBlob','bindingBoundaryHead']) {
            if (state[key] !== null) throw new Error(`${key}_MUST_REMAIN_NULL`);
          }
          for (const value of Object.values(spec.prohibitedInThisSpecification)) {
            if (value !== true) throw new Error('PROHIBITED_CAPABILITY_POLICY_DRIFT');
          }
          const gov = spec.governance;
          for (const key of ['runtimeAdapterBindingDefined','runtimeAdapterBound','runtimeAdapterImplementationPresent','transportBound','executionEntryPointExported','targetEnvironmentBound','targetResourceBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (gov[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          if (spec.causalState.exactRootCauseProven !== false || spec.causalState.causalPromotionAllowed !== false || spec.causalState.privatePresencePromotionAllowed !== false) throw new Error('CAUSAL_STATE_MUST_REMAIN_BLOCKED');
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for concrete runtime adapter binding specification" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
