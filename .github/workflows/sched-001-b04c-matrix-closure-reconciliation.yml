name: Doke SCHED-B04C Matrix Closure Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-matrix-closure-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-matrix-closure-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Reconcile matrix and versioned auditors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected replacement count in {path}: {text.count(old)}')
              path.write_text(text.replace(old, new, 1))

          def write_json(path, data):
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text())
          if matrix['version'] not in ('1.3.69', '1.3.70'):
              raise SystemExit(f"Unexpected matrix version {matrix['version']}")
          matrix['version'] = '1.3.70'
          matrix['updatedAt'] = '2026-08-01T17:03:06-03:00'
          domains = {domain['id']: domain for domain in matrix['domains']}
          sched = domains['SCHED-001']
          order = domains['ORD-001']
          sched['blockers'] = [item for item in sched['blockers'] if item['id'] != 'SCHED-B04']
          order['blockers'] = [item for item in order['blockers'] if item['id'] != 'ORD-B04']
          sched['nextActions'] = [
              'Connect the authenticated frontend scheduling surfaces to the canonical server authority under a separately reviewed activation gate.',
              'Add continuous hold-expiration operations through Cron or workers only under independent authorization and preserve canonical ORD projection.',
              'Keep production release and pull-request merge blocked pending independent release authorization.'
          ]
          order['nextActions'] = [
              'Complete ORD-B02 through the separately authorized two-account visual settlement canary and run-scoped cleanup.',
              'Keep ORD-B03 handed to PAY-001 until the real PSP webhook lifecycle becomes canonical.',
              'Keep ORD-B05 blocked until exact external staging provider selection and separately authorized deployment.',
              'Keep production release and pull-request merge blocked pending independent authorization.'
          ]
          for item in [
              'SCHED-B04C authenticated ORD/SCHED composition passed in staging run 30716088197 at head c2bddcd061d2136e07d8c3790abf8f66884c480f.',
              'The successful canary proved confirmation, reschedule, canonical cancellation, replacement rejection, partial rollback, idempotency and cross-domain event correlation inside one SERIALIZABLE transaction ending in ROLLBACK.',
              'All 15 residue counters were zero and all 8 authority counters were unchanged in both the canary report and independent post-run verification; SCHED-B04 is closed without promoting maturity or enabling frontend, Cron, workers, production or merge.'
          ]:
              if item not in sched['evidence']:
                  sched['evidence'].append(item)
          for item in [
              'SCHED-B04C authenticated ORD/SCHED composition passed in staging run 30716088197 and proved the canonical reservation reference and projection lifecycle end to end.',
              'Confirmation emitted order.scheduled, reschedule preserved the reservation ID, and canonical cancellation emitted order.accepted while atomically clearing reference and scheduled time.',
              'ORD-B04 is closed; ORD-B02, ORD-B03 and ORD-B05 remain open, and production, deployment, frontend activation and merge remain blocked.'
          ]:
              if item not in order['evidence']:
                  order['evidence'].append(item)
          closure_paths = [
              'config/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.json',
              'docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.md',
              'docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.json',
              'scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js',
              '.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.yml'
          ]
          for domain in (sched, order):
              for item in closure_paths:
                  if item not in domain['requiredPaths']:
                      domain['requiredPaths'].append(item)
              test = 'audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure'
              if test not in domain['tests']:
                  domain['tests'].append(test)
          for flow in matrix.get('criticalFlows', []):
              if isinstance(flow.get('blockers'), list):
                  flow['blockers'] = [item for item in flow['blockers'] if item not in ('SCHED-B04', 'ORD-B04')]
          write_json(matrix_path, matrix)

          for path_string in [
              'config/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.json',
              'docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.json'
          ]:
              path = Path(path_string)
              data = json.loads(path.read_text())
              data['status'] = 'authenticated_staging_composition_canary_passed_blockers_closed'
              data['blockerDecision'] = {
                  'closed': ['SCHED-B04', 'ORD-B04'],
                  'remainingSched': [],
                  'remainingOrd': ['ORD-B02', 'ORD-B03', 'ORD-B05'],
                  'domainCompletionClaimed': False
              }
              data['matrixDecision'] = {
                  'version': '1.3.70',
                  'schedMaturity': 3,
                  'schedServerAuthority': 'partial',
                  'schedStagingEvidence': 'staging_canary',
                  'reasonNoPromotion': 'Frontend activation, continuous hold expiration operations and production release remain separately gated.'
              }
              write_json(path, data)

          doc_path = Path('docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.md')
          doc = doc_path.read_text()
          doc = doc.replace(
              'Matrix and blocker reconciliation are intentionally performed in a separate validated phase.',
              'The validated matrix reconciliation closes `SCHED-B04` and `ORD-B04`. SCHED remains maturity `3`, server authority `partial` and staging evidence `staging_canary`; ORD retains `ORD-B02`, `ORD-B03` and `ORD-B05`.'
          )
          doc_path.write_text(doc)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure'] = 'node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js'
          write_json(package_path, package)

          Path('scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js').write_text(r'''#!/usr/bin/env node
'use strict';
const assert = require('assert');
const fs = require('fs');
const CONFIG = 'config/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.json';
const EVIDENCE = 'docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.json';
const DOC = 'docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.md';
const EXECUTION = 'config/sched-001-b04c-authenticated-ord-sched-composition-canary-execution.json';
const MATRIX = 'config/domain-completion-matrix.json';
const WORKFLOW = '.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.yml';
[CONFIG, EVIDENCE, DOC, EXECUTION, MATRIX, WORKFLOW, 'package.json'].forEach((file) => assert(fs.existsSync(file), `Missing closure asset ${file}`));
const config = JSON.parse(fs.readFileSync(CONFIG, 'utf8'));
const evidence = JSON.parse(fs.readFileSync(EVIDENCE, 'utf8'));
const execution = JSON.parse(fs.readFileSync(EXECUTION, 'utf8'));
const matrix = JSON.parse(fs.readFileSync(MATRIX, 'utf8'));
const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
const docs = fs.readFileSync(DOC, 'utf8');
const workflow = fs.readFileSync(WORKFLOW, 'utf8');
assert.deepStrictEqual(evidence, config);
assert.strictEqual(config.status, 'authenticated_staging_composition_canary_passed_blockers_closed');
assert.strictEqual(config.authorization.status, 'consumed');
assert.strictEqual(config.authorization.mayBeReused, false);
assert.strictEqual(config.successfulRun.runId, 30716088197);
assert.strictEqual(config.successfulRun.jobId, 91411759384);
assert.strictEqual(config.successfulRun.result, 'authenticated_ord_sched_composition_canary_passed');
assert.strictEqual(config.successfulRun.isolation, 'SERIALIZABLE');
assert.strictEqual(config.successfulRun.finalStatement, 'ROLLBACK');
assert.strictEqual(config.successfulRun.committed, false);
assert.strictEqual(config.successfulRun.rolledBack, true);
assert.strictEqual(config.successfulRun.residueCountsZero, true);
assert.strictEqual(config.successfulRun.authorityCountDeltaZero, true);
assert.strictEqual(config.attempts.totalAuthorized, 8);
assert.strictEqual(config.attempts.failedClosedBeforeSuccess, 7);
assert.strictEqual(config.attempts.successful, 1);
assert.strictEqual(config.attempts.allEndedInRollback, true);
assert.strictEqual(config.independentPostRunVerification.allResidueCountsZero, true);
assert.strictEqual(config.independentPostRunVerification.allAuthorityCountsZero, true);
assert.deepStrictEqual(config.blockerDecision.closed, ['SCHED-B04', 'ORD-B04']);
assert.deepStrictEqual(config.blockerDecision.remainingSched, []);
assert.deepStrictEqual(config.blockerDecision.remainingOrd, ['ORD-B02', 'ORD-B03', 'ORD-B05']);
assert.strictEqual(config.blockerDecision.domainCompletionClaimed, false);
Object.values(config.prohibitedActionsObserved).forEach((value) => typeof value === 'boolean' ? assert.strictEqual(value, false) : assert.strictEqual(value, 0));
assert.strictEqual(execution.authorization.status, 'consumed_success');
assert.strictEqual(execution.executionState.canaryPassed, true);
assert.strictEqual(execution.executionState.blockedBy, null);
assert.strictEqual(execution.executionState.successfulRun.runId, 30716088197);
assert.strictEqual(execution.executionState.allAuthorizedAttemptsRolledBack, true);
assert.strictEqual(execution.executionState.allResidueCountsZero, true);
assert.strictEqual(execution.executionState.allAuthorityCountDeltasZero, true);
assert.strictEqual(matrix.version, '1.3.70');
const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
assert(sched && ord);
assert.strictEqual(sched.maturity, 3);
assert.strictEqual(sched.serverAuthority, 'partial');
assert.strictEqual(sched.stagingEvidence, 'staging_canary');
assert.deepStrictEqual(sched.blockers.map((item) => item.id), []);
assert.deepStrictEqual(ord.blockers.map((item) => item.id), ['ORD-B02', 'ORD-B03', 'ORD-B05']);
assert(sched.nextActions[0].includes('frontend'));
assert(ord.nextActions[0].includes('ORD-B02'));
assert(sched.evidence.some((item) => item.includes('run 30716088197')));
assert(ord.evidence.some((item) => item.includes('run 30716088197')));
assert.strictEqual(pkg.scripts['audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure'], 'node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js');
['authenticated_ord_sched_composition_canary_passed', 'SERIALIZABLE', 'ROLLBACK', 'SCHED-B04', 'ORD-B04', 'ORD-B02', 'ORD-B03', 'ORD-B05'].forEach((fragment) => assert(docs.includes(fragment)));
assert(workflow.includes('permissions:\n  contents: read'));
['contents: write', 'secrets.', 'SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD', 'psql ', 'curl ', '--execute', 'git push'].forEach((fragment) => assert(!workflow.includes(fragment)));
assert(!fs.existsSync('.github/workflows/sched-001-b04c-authorized-retry-application.yml'));
assert(!fs.existsSync('.github/workflows/sched-001-b04c-bigint-normalization-reconciliation.yml'));
console.log('SCHED-B04C authenticated ORD/SCHED composition canary closure audit passed.');
''')

          Path('.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.yml').write_text('''name: Doke SCHED-B04C Authenticated ORD SCHED Composition Closure

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - 'config/domain-completion-matrix.json'
      - 'config/sched-001-b04c-authenticated-ord-sched-composition-canary-execution.json'
      - 'config/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.json'
      - 'docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.md'
      - 'docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.json'
      - 'scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-closure.js'
      - 'package.json'
      - '.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.yml'

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit authenticated ORD SCHED closure
        run: |
          set -euo pipefail
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js
          node scripts/audit-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-ord-001-a01-baseline.js
          npm run audit:domain-completion-matrix
''')

          replace_once(Path('scripts/audit-ord-001-a01-baseline.js'),
              "['ORD-B02', 'ORD-B03', 'ORD-B04'].forEach((id) => {\n  assert(blockerIds.has(id), `Active ORD blocker missing: ${id}`);\n});",
              "const matrixPatchOrdA01 = Number(String(matrix.version).split('.')[2] || 0);\nconst requiredOrdBlockersA01 = matrixPatchOrdA01 >= 70 ? ['ORD-B02', 'ORD-B03'] : ['ORD-B02', 'ORD-B03', 'ORD-B04'];\nrequiredOrdBlockersA01.forEach((id) => assert(blockerIds.has(id), `Active ORD blocker missing: ${id}`));\nif (matrixPatchOrdA01 >= 70) assert(!blockerIds.has('ORD-B04'));"
          )
          replace_once(Path('scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js'),
              "if (schedMatrixPatchA01 >= 63) {",
              "if (schedMatrixPatchA01 >= 70) {\n  assert.deepStrictEqual(sched.blockers.map((blocker) => blocker.id), []);\n  assert(sched.nextActions[0].includes('frontend'));\n} else if (schedMatrixPatchA01 >= 63) {"
          )

          for file in ['scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js', 'scripts/audit-sched-001-a04-server-command-runtime.js', 'scripts/audit-sched-001-a05-persistence-readiness.js']:
              path = Path(file)
              marker = "const postB02B = compareVersions(matrix.version, '1.3.63') >= 0 && sched.maturity >= 3;"
              replace_once(path, marker, "const postB04Closure = compareVersions(matrix.version, '1.3.70') >= 0 && sched.maturity >= 3;\n" + marker)
              replace_once(path, "if (postB02B) {", "if (postB04Closure) {\n  assert.deepStrictEqual(sched.blockers.map((item) => item.id), []);\n  assert(sched.nextActions[0].includes('frontend'));\n  assert(ord.evidence.some((item) => item.includes('run 30716088197')));\n} else if (postB02B) {")

          a03 = Path('scripts/audit-sched-001-a03-reservation-migration-local-contract.js')
          replace_once(a03, "const postB02B = schedMatrixPatchA03 >= 63 && sched.maturity >= 3;", "const postB04Closure = schedMatrixPatchA03 >= 70 && sched.maturity >= 3;\nconst postB02B = schedMatrixPatchA03 >= 63 && sched.maturity >= 3;")
          replace_once(a03, "if (postB02B) {", "if (postB04Closure) {\n  assert.deepStrictEqual(sched.blockers.map((item) => item.id), []);\n  assert(sched.nextActions[0].includes('frontend'));\n  assert(ord.evidence.some((item) => item.includes('run 30716088197')));\n} else if (postB02B) {")

          a07 = Path('scripts/audit-sched-001-a07-history-canary-readiness.js')
          replace_once(a07, "if (schedMatrixPatchA07 >= 63) {", "if (schedMatrixPatchA07 >= 70) {\n    assert.deepStrictEqual(blockerIds, []);\n    assert(sched.nextActions[0].includes('frontend'));\n  } else if (schedMatrixPatchA07 >= 63) {")

          for file in ['scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js', 'scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js', 'scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js']:
              replace_once(Path(file),
                  "assert(sched.blockers.some((blocker) => blocker.id === 'SCHED-B04'));\nassert(ord.blockers.some((blocker) => blocker.id === 'ORD-B04'));",
                  "const postB04Closure = Number(String(matrix.version).split('.')[2] || 0) >= 70;\nif (postB04Closure) {\n  assert(!sched.blockers.some((blocker) => blocker.id === 'SCHED-B04'));\n  assert(!ord.blockers.some((blocker) => blocker.id === 'ORD-B04'));\n} else {\n  assert(sched.blockers.some((blocker) => blocker.id === 'SCHED-B04'));\n  assert(ord.blockers.some((blocker) => blocker.id === 'ORD-B04'));\n}"
              )

          a10 = Path('scripts/audit-ord-001-a10-blocker-reconciliation.js')
          replace_once(a10,
              "assert.deepStrictEqual(ord.blockers.map((blocker) => blocker.id), ['ORD-B02', 'ORD-B03', 'ORD-B04', 'ORD-B05']);\nassert.strictEqual(ord.nextActions.length, 4);\nif (compareVersions(matrix.version, '1.3.50') >= 0) {\n  assert(ord.nextActions[0].includes('Keep ORD-B04 handed to SCHED-001'));\n  assert(ord.evidence.some((item) => item.includes('SCHED-A08 completed the official migration-history repair')));\n} else {\n  assert(ord.nextActions[0].includes('SCHED-A07'));\n}",
              "const postB04Closure = compareVersions(matrix.version, '1.3.70') >= 0;\nassert.deepStrictEqual(ord.blockers.map((blocker) => blocker.id), postB04Closure ? ['ORD-B02', 'ORD-B03', 'ORD-B05'] : ['ORD-B02', 'ORD-B03', 'ORD-B04', 'ORD-B05']);\nassert.strictEqual(ord.nextActions.length, 4);\nif (postB04Closure) {\n  assert(ord.nextActions[0].includes('ORD-B02'));\n  assert(ord.evidence.some((item) => item.includes('run 30716088197')));\n} else if (compareVersions(matrix.version, '1.3.50') >= 0) {\n  assert(ord.nextActions[0].includes('Keep ORD-B04 handed to SCHED-001'));\n  assert(ord.evidence.some((item) => item.includes('SCHED-A08 completed the official migration-history repair')));\n} else {\n  assert(ord.nextActions[0].includes('SCHED-A07'));\n}"
          )
          replace_once(a10, "assert(blockers['ORD-B04'].description.includes('SCHED-001'));", "if (postB04Closure) assert(!blockers['ORD-B04']);\nelse assert(blockers['ORD-B04'].description.includes('SCHED-001'));")

          a11 = Path('scripts/audit-ord-001-a11-scheduling-authority-handoff.js')
          replace_once(a11,
              "const ordB04 = ord.blockers.find((blocker) => blocker.id === 'ORD-B04');\nassert(ordB04, 'ORD-B04 missing from completion matrix');\nassert(ordB04.description.includes('SCHED-001'));\nassert(ordB04.description.includes('canonical reservation reference'));",
              "const schedMatrixPatchA11 = Number(String(matrix.version).split('.')[2] || 0);\nconst ordB04 = ord.blockers.find((blocker) => blocker.id === 'ORD-B04');\nif (schedMatrixPatchA11 >= 70) {\n  assert(!ordB04);\n  assert(ord.evidence.some((item) => item.includes('run 30716088197')));\n} else {\n  assert(ordB04);\n  assert(ordB04.description.includes('SCHED-001'));\n  assert(ordB04.description.includes('canonical reservation reference'));\n}"
          )
          replace_once(a11, "const schedMatrixPatchA11 = Number(String(matrix.version).split('.')[2] || 0);\nif (schedMatrixPatchA11 >= 63) {", "if (schedMatrixPatchA11 >= 63) {")
          replace_once(a11, "assert(sched.blockers.some((blocker) => blocker.id === 'SCHED-B04' && blocker.category === 'order_integration'));", "if (schedMatrixPatchA11 >= 70) assert(!sched.blockers.some((blocker) => blocker.id === 'SCHED-B04'));\nelse assert(sched.blockers.some((blocker) => blocker.id === 'SCHED-B04' && blocker.category === 'order_integration'));")
          replace_once(a11,
              "if (schedMatrixPatchA11 >= 63) {\n    assert(sched.nextActions[0].includes('SCHED-B04') || sched.nextActions[0].includes('ORD-001'));\n    assert(ord.nextActions.some((action) => action.includes('ORD-B04') || action.includes('SCHED-B04')));",
              "if (schedMatrixPatchA11 >= 70) {\n    assert(sched.nextActions[0].includes('frontend'));\n    assert(ord.nextActions[0].includes('ORD-B02'));\n  } else if (schedMatrixPatchA11 >= 63) {\n    assert(sched.nextActions[0].includes('SCHED-B04') || sched.nextActions[0].includes('ORD-001'));\n    assert(ord.nextActions.some((action) => action.includes('ORD-B04') || action.includes('SCHED-B04')));"
          )
          PY

      - name: Regenerate matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Validate closure
        run: |
          set -euo pipefail
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js
          node scripts/audit-sched-001-a07-history-canary-readiness.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-ord-001-a01-baseline.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish matrix closure
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
