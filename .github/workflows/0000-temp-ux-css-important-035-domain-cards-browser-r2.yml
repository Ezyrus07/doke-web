name: UX-CSS-IMPORTANT-035 Domain Cards Browser R2

on:
  push:
    branches:
      - diag/ux-css-important-035-domain-cards-browser-r2
    paths:
      - .github/workflows/0000-temp-ux-css-important-035-domain-cards-browser-r2.yml

permissions:
  contents: write

jobs:
  browser035r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      PARENT_TREE: 714d5b26a67edec2fbcb4f87ebae8c1197304269
      TARGET_FILE: assets/css/components/domain/doke-domain-cards.css
      CANDIDATE_SHA256: d99be25b5e0c364890bec8bc0aa28226b227d9b4bd45131fe193c440328aebed
      CANDIDATE_BLOB: f7b0f8c5c4efcd7c0f821b18f514b788eef4cdfa
      REACH_FILE: .diagnostics/ux-css-important-035-domain-cards-reach-r1.txt
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-035-domain-cards-browser-r2.txt
      DIAG_WORKFLOW: .github/workflows/0000-temp-ux-css-important-035-domain-cards-browser-r2.yml
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diag/ux-css-important-035-domain-cards-browser-r2
          fetch-depth: 0

      - name: Freeze R1 evidence and diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          git merge-base --is-ancestor "$PARENT_SHA" HEAD
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$DIAG_WORKFLOW"
          test -z "$(git diff --name-only "$PARENT_SHA" HEAD -- 'assets/css/**')"
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git show "origin/$DIAG_BRANCH:$REACH_FILE" >/tmp/reach.txt
          grep -q '^RUN_ID=32723832795$' /tmp/reach.txt
          grep -q '^REACH=success$' /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/reach.txt
          grep -Fq "CANDIDATE PASS|bytes=28604|important=215->0|removed=215|sha256=$CANDIDATE_SHA256|blob=$CANDIDATE_BLOB|transform=marker-only|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0" /tmp/reach.txt
          grep -Fq 'active=1|wholeFileDormant=0' /tmp/reach.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Browser parent versus candidate
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/browser.log) 2>&1
          git checkout --detach "$PARENT_SHA" >/dev/null
          cp "$TARGET_FILE" /tmp/parent.css
          trap 'cp /tmp/parent.css "$TARGET_FILE" 2>/dev/null || true; kill $(cat /tmp/http.pid 2>/dev/null) 2>/dev/null || true' EXIT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const o=fs.readFileSync(process.env.TARGET_FILE,'utf8');
          const c=o.replace(/\s*!important\b/g,'');
          const h=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',c);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          if(before!==215||after!==0||h!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB) throw Error(`candidate ${before}/${after}/${h}/${blob}`);
          console.log(`CANDIDATE PASS|sha256=${h}|blob=${blob}|important=215->0|bytes=${Buffer.byteLength(c)}|reachR1HashStable=1`);
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          ok=0; for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1
          cat >/tmp/proof.js <<'NODE'
          const {chromium}=require('playwright'),crypto=require('crypto'),fs=require('fs');
          const pages=['index.html','resultados.html','pedidos.html','mensagens.html','comunidade.html','perfil.html','carteira.html','notificacoes.html','configuracoes.html'];
          const viewports=[{w:390,h:844,key:'390'},{w:760,h:1000,key:'760'},{w:761,h:1000,key:'761'},{w:1366,h:900,key:'1366'}];
          const targetPath='/assets/css/components/domain/doke-domain-cards.css';
          const targetSelector='.service-card,.doke-service-card,.doke-worker-card,.doke-order-card,.doke-message-card,.doke-community-card,.doke-wallet-card,.doke-notification-card,.doke-profile-card,.doke-media-card,.doke-stat-card';
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const metaFn=(sel)=>{
            const nodes=[...document.querySelectorAll(sel)].slice(0,24).map(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e);return{tag:e.tagName,cls:e.className,x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2),display:cs.display,position:cs.position,gridTemplateColumns:cs.gridTemplateColumns,gridTemplateRows:cs.gridTemplateRows,gap:cs.gap,padding:cs.padding,minHeight:cs.minHeight,height:cs.height,overflow:cs.overflow,borderRadius:cs.borderRadius,transform:cs.transform}});
            return{path:location.pathname,page:document.body?.dataset?.page||null,nodeCount:document.querySelectorAll(sel).length,nodes};
          };
          async function stableMeta(page){let prev='';for(let i=0;i<10;i++){const m=await page.evaluate(metaFn,targetSelector),s=JSON.stringify(m);if(s===prev)return m;prev=s;await page.waitForTimeout(250);}return page.evaluate(metaFn,targetSelector)}
          async function phase(label){const browser=await chromium.launch({headless:true});const out={};let loads=0,errs=0,stable=0,totalNodes=0;for(const file of pages){for(const v of viewports){const key=`${file}@${v.key}`,ctx=await browser.newContext({viewport:{width:v.w,height:v.h},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Bahia',reducedMotion:'reduce'});await ctx.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return route.continue();return route.abort();});await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787263200000,RealDate=Date;class FixedDate extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}};globalThis.Date=FixedDate;});const page=await ctx.newPage();page.on('pageerror',e=>{errs++;console.log(`PAGE ERROR|state=${key}|message=${String(e.message||e).slice(0,180)}`)});page.on('request',r=>{const u=new URL(r.url());if(u.pathname===targetPath)loads++});await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'domcontentloaded'});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await page.evaluate(()=>document.fonts?.ready);await page.waitForTimeout(900);const meta=await stableMeta(page),m2=await page.evaluate(metaFn,targetSelector);if(JSON.stringify(meta)===JSON.stringify(m2))stable++;totalNodes+=meta.nodeCount;await page.screenshot({fullPage:true});await page.waitForTimeout(120);const shot=await page.screenshot({fullPage:true});out[key]={meta,shot:hash(shot)};await ctx.close();}}await browser.close();console.log(`PHASE|label=${label}|states=${pages.length*viewports.length}|stableStates=${stable}|pageErrors=${errs}|targetStylesheetLoads=${loads}|domainNodes=${totalNodes}`);return{out,loads,errs,stable,totalNodes};}
          (async()=>{const p=await phase(process.argv[2]);fs.writeFileSync(process.argv[3],JSON.stringify(p));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/proof.js parent /tmp/parent.json
          cp /tmp/candidate.css "$TARGET_FILE"
          NODE_PATH="$PWD/node_modules" node /tmp/proof.js candidate /tmp/candidate.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent.json')),b=JSON.parse(fs.readFileSync('/tmp/candidate.json'));let md=0,sd=0;for(const k of Object.keys(a.out)){if(JSON.stringify(a.out[k].meta)!==JSON.stringify(b.out[k].meta)){md++;console.log(`META DIFF|state=${k}`)}if(a.out[k].shot!==b.out[k].shot){sd++;console.log(`SHOT DIFF|state=${k}`)}}const n=Object.keys(a.out).length;console.log(`BROWSER RESULT|sha256=${process.env.CANDIDATE_SHA256}|pages=9|states=${n}|viewports=390,760,761,1366|metadataDiffs=${md}|screenshotDiffs=${sd}|stableStates=${a.stable}/${b.stable}|pageErrors=${a.errs+b.errs}|targetStylesheetLoads=${a.loads}/${b.loads}|domainNodes=${a.totalNodes}/${b.totalNodes}|syntheticDOM=0|syntheticAuth=0|credentialsUsed=0|criteriaRelaxed=0|exactPathMatch=1|externalResourcesBlocked=1|animationsDisabled=1|dateFrozen=1`);if(md||sd||a.errs||b.errs||a.loads===0||b.loads===0||a.loads!==b.loads||a.totalNodes===0||b.totalNodes===0||a.totalNodes!==b.totalNodes||a.stable!==n||b.stable!==n)process.exit(1);
          NODE
          cp /tmp/parent.css "$TARGET_FILE"
          cmp -s /tmp/parent.css "$TARGET_FILE"
          echo 'RESTORE PASS|target=parent-exact'

      - name: Publish R2 receipt
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          result=FAIL; if test "$PROOF_OUTCOME" = success; then result=PASS; fi
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "PARENT_SHA=$PARENT_SHA"
            echo "TARGET_FILE=$TARGET_FILE"
            echo "PROOF=$PROOF_OUTCOME"
            grep -E '^(CANDIDATE PASS|PHASE|PAGE ERROR|META DIFF|SHOT DIFF|BROWSER RESULT|RESTORE PASS)\|' /tmp/browser.log || true
            echo "RESULT=$result"
          } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"
          git commit -m 'diag: publish 035 domain cards browser r2 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null

      - name: Enforce browser proof
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: test "$PROOF_OUTCOME" = success
