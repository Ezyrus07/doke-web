name: Doke PAY-A14 Publisher Temporary

on:
  pull_request:
    paths:
      - '.pay-a14-bootstrap/chunk-*.b64'
      - '.github/workflows/pay-001-a14-publisher-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reassemble and verify PAY-A14 payload
        run: |
          cat .pay-a14-bootstrap/chunk-*.b64 | LC_ALL=C tr -cd 'A-Za-z0-9+/=' > /tmp/pay-a14.b64
          actual_b64="$(sha256sum /tmp/pay-a14.b64 | awk '{print $1}')"
          echo "PAY-A14 normalized base64 SHA-256: $actual_b64"
          test "$actual_b64" = "c0106d59bfdd98d7f2b03deb01a204d88cff63ab69852b2ae2fbdc3947ea5d7b"
          base64 -d /tmp/pay-a14.b64 > /tmp/pay-a14.tar.gz
          actual_gzip="$(sha256sum /tmp/pay-a14.tar.gz | awk '{print $1}')"
          echo "PAY-A14 gzip SHA-256: $actual_gzip"
          test "$actual_gzip" = "b216276ef5d27ae6bac40ccae6b63533ade1caa2f9e8261fd5b8cb1f0d66083d"
          gzip -dc /tmp/pay-a14.tar.gz | tar -xf -
      - name: Apply PAY-A14 repository metadata
        run: |
          node scripts/apply-pay-001-a14-repository-metadata.js
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          files = [
              'scripts/audit-pay-001-a06-provider-selection-legal-handoff.js',
              'scripts/audit-pay-001-a07-reconciliation-operations-readiness.js',
              'scripts/audit-pay-001-a08-immutable-migrations-read-only-canary.js',
              'scripts/audit-pay-001-a09-deployment-inspection-handoff.js',
          ]
          pattern = re.compile(r'assert\(\[[^\n]*\]\.some\(\(sublot\) => pay\.nextActions\[0\]\.includes\(sublot\)\), "PAY successor must remain monotonic after PAY-A10"\);')
          replaced = 0
          for file in files:
              path = Path(file)
              source = path.read_text(encoding='utf-8')
              source, count = pattern.subn("assert(pay.nextActions[0].includes('PAY-A15'), 'PAY-A15 must be the first next action');", source)
              replaced += count
              path.write_text(source, encoding='utf-8')
          if replaced != 4:
              raise SystemExit(f'Expected 4 legacy PAY successor guards, replaced {replaced}.')
          print(f'Legacy PAY successor guards advanced: {replaced}')
          PYFIX
          rm -f .pay-a14-bootstrap/chunk-*.b64
          rmdir .pay-a14-bootstrap 2>/dev/null || true
          rm -f scripts/apply-pay-001-a14-repository-metadata.js
          rm -f .github/workflows/pay-001-a14-publisher-temp.yml
          npm run write:domain-completion-matrix
      - name: Validate PAY-A14 and cumulative boundaries
        run: |
          node --check backend/modules/payments/payment-reconciliation-governance-evidence.js
          node --check scripts/audit-pay-001-a14-governance-evidence-chain.js
          node --check scripts/test-pay-001-a14-governance-evidence-chain.js
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run audit:pay-001-a05-adapter-conformance-readiness
          npm run test:pay-001-a05-adapter-conformance-readiness
          npm run audit:pay-001-a06-provider-selection-legal-handoff
          npm run test:pay-001-a06-provider-selection-legal-handoff
          npm run audit:pay-001-a07-reconciliation-operations-readiness
          npm run test:pay-001-a07-reconciliation-operations-readiness
          npm run audit:pay-001-a08-immutable-migrations-read-only-canary
          npm run test:pay-001-a08-immutable-migrations-read-only-canary
          npm run audit:pay-001-a09-deployment-inspection-handoff
          npm run test:pay-001-a09-deployment-inspection-handoff
          npm run audit:pay-001-a10-external-executor-evidence-ingestion
          npm run test:pay-001-a10-external-executor-evidence-ingestion
          npm run audit:pay-001-a11-executor-protocol-conformance
          npm run test:pay-001-a11-executor-protocol-conformance
          npm run audit:pay-001-a12-executor-trust-root-signature
          npm run test:pay-001-a12-executor-trust-root-signature
          npm run audit:pay-001-a13-executor-lifecycle-governance
          npm run test:pay-001-a13-executor-lifecycle-governance
          npm run audit:pay-001-a14-governance-evidence-chain
          npm run test:pay-001-a14-governance-evidence-chain
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Verify bounded publisher changes
        run: |
          changed="$(git status --short --untracked-files=all | sed -E 's/^.. //' | sort)"
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              backend/modules/payments/payment-reconciliation-governance-evidence.js) ;;
              config/pay-001-a14-governance-evidence-chain.json) ;;
              tests/fixtures/pay-a14-governance-evidence-chain-cases.json) ;;
              docs/PAY-001-A14-GOVERNANCE-EVIDENCE-CHAIN.md) ;;
              docs/validation/PAY-001-A14-GOVERNANCE-EVIDENCE-CHAIN.json) ;;
              scripts/audit-pay-001-a14-governance-evidence-chain.js) ;;
              scripts/test-pay-001-a14-governance-evidence-chain.js) ;;
              package.json) ;;
              config/domain-completion-matrix.json) ;;
              config/pay-001-a13-executor-lifecycle-governance.json) ;;
              scripts/audit-pay-001-a*.js) ;;
              docs/DOMAIN-COMPLETION-MATRIX.md) ;;
              reports/generated/domain-completion-matrix-report.json) ;;
              .pay-a14-bootstrap/chunk-*.b64) ;;
              .github/workflows/pay-001-a14-publisher-temp.yml) ;;
              *) echo "Unexpected PAY-A14 change: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git fetch origin pay/pay-001-baseline-audit
          test "$(git rev-parse origin/pay/pay-001-baseline-audit)" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish PAY-A14
        run: |
          git config user.name 'doke-pay-a14-bot'
          git config user.email 'doke-pay-a14-bot@users.noreply.github.com'
          git add -A
          git add -f docs/validation/PAY-001-A14-GOVERNANCE-EVIDENCE-CHAIN.json
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'Complete PAY-A14 governance evidence chain'
          git push origin HEAD:pay/pay-001-baseline-audit
