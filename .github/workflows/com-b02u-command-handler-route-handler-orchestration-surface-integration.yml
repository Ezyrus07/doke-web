name: COM-B02U Command Handler Route-Handler Orchestration Surface Integration

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact temporary carrier scope
        shell: bash
        run: |
          set -euo pipefail
          CARRIER_PARENT=3cebcfe97a3cff95edb54d86ea30f85e304ae4e8
          CANDIDATE=071899787035ad45b0733127423ea327af50bda9
          WORKFLOW=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration.yml
          TEMP=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git rev-parse HEAD^^^^)" = "$CANDIDATE"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW"
          test -f "$TEMP"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:config/com-b02u-command-handler-route-handler-orchestration-surface-integration.json)" = "f3c76888e3ccc9c8323097d76e138095e2906471"
          test "$(git rev-parse HEAD:scripts/test-com-b02u-command-handler-route-handler-orchestration-surface-integration.js)" = "f7b29c29fb486ba29f0b680709a10ea61b4f4aed"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-orchestration.js)" = "f094ddc01a3f05975794bafb925d64f146a51ea2"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Restore final certifier and generate Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=071899787035ad45b0733127423ea327af50bda9
          WORKFLOW=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration.yml
          TEMP=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration-matrix-materialization-temp.yml
          git show "$CANDIDATE:$WORKFLOW" > "$WORKFLOW"
          rm "$TEMP"
          npm run write:domain-completion-matrix >/tmp/matrix-write.log
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$WORKFLOW" "$TEMP" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          test "$(git hash-object "$WORKFLOW")" = "96bbfd7d93cdb423e2d6fcdb7b070f1c38e73ec5"
          npm run audit:domain-completion-matrix >/tmp/matrix-audit.log
          npm run audit:agent-governance >/tmp/agent-governance.log
          git diff --check
          echo 'B02U_MATRIX_AND_GOVERNANCE_AUDITS=PASS'

      - name: Fail-closed B02U assertions
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/route-handlers.js
          ORCHESTRATION=backend/modules/communities/community-command-handler-repository-orchestration.js
          node --check "$TARGET"
          node --check scripts/test-com-b02u-command-handler-route-handler-orchestration-surface-integration.js
          node scripts/test-com-b02u-command-handler-route-handler-orchestration-surface-integration.js
          grep -F "require('./community-command-handler-repository-orchestration')" "$TARGET"
          ! grep -F "require('./community-command-handler-repository-binding-surface')" "$TARGET"
          ! grep -E 'process\.env|Deno\.env|Bun\.env|createClient\(|fetch\(|https?://|SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY' "$ORCHESTRATION"
          ! grep -E '\.rpc\(' "$ORCHESTRATION"
          grep -F "repositoryOperationInvoked: false" "$ORCHESTRATION"
          grep -F "executableReferencesExposed: false" "$ORCHESTRATION"
          grep -F "runtimeActivated: false" "$ORCHESTRATION"
          ! git diff --name-only 9d5e8bf18910a771d3d64923266713c76c7ff8d4 HEAD | grep '^supabase/migrations/'
          echo 'B02U_FAIL_CLOSED_ASSERTIONS=PASS'

      - name: Emit deterministic derivatives for external finalization
        shell: bash
        run: |
          set -euo pipefail
          echo "MARKDOWN_SHA256=$(sha256sum docs/DOMAIN-COMPLETION-MATRIX.md | cut -d' ' -f1)"
          echo "REPORT_SHA256=$(sha256sum reports/generated/domain-completion-matrix-report.json | cut -d' ' -f1)"
          echo 'B02U_MARKDOWN_GZIP_BASE64_BEGIN'
          gzip -9 -c docs/DOMAIN-COMPLETION-MATRIX.md | base64 -w0 | fold -w 60000
          echo 'B02U_MARKDOWN_GZIP_BASE64_END'
          echo 'B02U_REPORT_GZIP_BASE64_BEGIN'
          gzip -9 -c reports/generated/domain-completion-matrix-report.json | base64 -w0 | fold -w 60000
          echo 'B02U_REPORT_GZIP_BASE64_END'
