name: Temporary ORD-A05 Runtime Test Reconcile

on:
  pull_request:
    paths:
      - .github/workflows/ord-a05-runtime-test-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconcile historical expectation and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-orders-write-frontend-activation-runtime.js')
          source = path.read_text(encoding='utf-8')
          old = "assertEqual(config.ordersProvider, 'mock', 'Default ordersProvider must remain mock.');"
          new = "assertEqual(config.ordersProvider, 'supabase-read', 'Staging ordersProvider must remain the canonical remote read provider while write activation stays disabled.');"
          if source.count(old) != 1:
            raise SystemExit('Historical provider expectation not found exactly once.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/ord-a05-runtime-test-reconcile.yml
          git add scripts/validate-orders-write-frontend-activation-runtime.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile ORD activation runtime with canonical reads"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
