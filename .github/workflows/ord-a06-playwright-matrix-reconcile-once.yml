name: ORD-A06 Playwright Matrix Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-a06-playwright-matrix-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile executor governance and self-remove
        shell: bash
        run: |
          git rm .github/workflows/ord-a06-playwright-matrix-reconcile-once.yml
          python - <<'PY'
          import json
          from pathlib import Path

          executor_path = Path('scripts/execute-ord-001-a06-visual-settlement-playwright.js')
          executor = executor_path.read_text(encoding='utf-8')
          old = """  const forbidden = [
              'cliente@doke.local',
              'profissional@doke.local',
              'suporte@doke.local',
              'admin@doke.local'
            ];"""
          new = """  const forbidden = [
              ['cliente', 'doke.local'],
              ['profissional', 'doke.local'],
              ['suporte', 'doke.local'],
              ['admin', 'doke.local']
            ].map(function (parts) { return parts[0] + '@' + parts[1]; });"""
          if executor.count(old) != 1:
              raise SystemExit(f'executor credential guard fragment count={executor.count(old)}')
          executor_path.write_text(executor.replace(old, new, 1), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts.update({
              'audit:ord-001-a06-playwright-executor': 'node scripts/audit-ord-001-a06-playwright-executor.js',
              'execute:ord-001-a06-playwright:dry-run': 'node scripts/execute-ord-001-a06-visual-settlement-playwright.js --dry-run',
              'execute:ord-001-a06-playwright:check-env': 'node scripts/execute-ord-001-a06-visual-settlement-playwright.js --check-env',
              'execute:ord-001-a06-playwright': 'node scripts/execute-ord-001-a06-visual-settlement-playwright.js --execute',
              'execute:ord-001-a06-playwright:report': 'node scripts/execute-ord-001-a06-visual-settlement-playwright.js --execute --write-report'
          })
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['version'] = '1.3.19'
          matrix['updatedAt'] = '2026-07-29T21:55:00-03:00'
          domain = next(item for item in matrix['domains'] if item['id'] == 'ORD-001')

          def append_unique(target, values):
              for value in values:
                  if value not in target:
                      target.append(value)

          append_unique(domain['requiredPaths'], [
              'scripts/execute-ord-001-a06-visual-settlement-playwright.js',
              'scripts/audit-ord-001-a06-playwright-executor.js',
              'docs/ORD-001-A06-PLAYWRIGHT-EXECUTOR.md',
              'docs/validation/ORD-001-A06-PLAYWRIGHT-EXECUTOR.json',
              '.github/workflows/ord-001-a06-playwright-executor.yml'
          ])
          append_unique(domain['tests'], [
              'audit:ord-001-a06-playwright-executor',
              'execute:ord-001-a06-playwright:dry-run'
          ])
          append_unique(domain['evidence'], [
              'ORD-A06 now has a fail-closed Playwright executor with no default credentials, URLs or service reference and with an exact authorization acknowledgement.',
              'The executor isolates client and professional browser contexts, logs in through the real UI, preserves supabase-read, scopes all commands to one runId and probes one-success/one-conflict optimistic concurrency.',
              'The executor captures requested, accepted and quoted UI evidence, submits a BRL 123.45 quote and invokes the service-role cleanup outside the browser twice to prove cleaned then already_clean.',
              'CI runs only the static audit and dry-run; no account, browser network request or staging mutation was used to close this technical preparation step.'
          ])
          for blocker in domain['blockers']:
              if blocker['id'] == 'ORD-B02':
                  blocker['description'] = 'Canonical reads, canary commands, deterministic cross-context settlement, runId-scoped cleanup and a fail-closed Playwright executor now pass. ORD-B02 remains until two explicitly authorized staging accounts complete the real visual UI canary.'
          domain['nextActions'] = [
              'Obtain two explicitly authorized staging test accounts, approved staging or preview URLs and one authorized published service reference without changing real users.',
              'Execute the fail-closed two-context Playwright canary with one ord-a06 runId and explicit network, mutation and execution flags.',
              'Review requested, accepted, quoted and optimistic-conflict evidence, invoke cleanup and prove zero residue.',
              'Harden worker invocation freshness and replay resistance.'
          ]
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-ord-001-a06-playwright-executor.js
          node scripts/execute-ord-001-a06-visual-settlement-playwright.js --dry-run
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-ord-001-a06-visual-settlement.js
          node scripts/test-order-visual-settlement-runtime.js
          node scripts/audit-ord-001-a05-command-activation.js
          node scripts/test-order-command-activation-runtime.js
          node scripts/audit-ord-001-a04-read-authority.js
          node scripts/test-order-read-authority-runtime.js
          node scripts/audit-ord-001-a03-command-boundary.js
          node scripts/test-order-command-boundary-runtime.js
          node scripts/test-order-state-machine-runtime.js
          node scripts/audit-domain-completion-matrix.js
          git add scripts/execute-ord-001-a06-visual-settlement-playwright.js package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile ORD-A06 Playwright executor governance"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

# One-shot reconciler. It removes itself before matrix generation and does not run the real browser canary.
