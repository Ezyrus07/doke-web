name: Doke UX-CSS-DEBT-062 Form Flow Comfort Proof R4

on:
  push:
    branches:
      - diag/ux-css-debt-062-form-flow-comfort-proof-r4

permissions:
  contents: read

jobs:
  proof-r4:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 10a9a51cfd0a96e7c6a56eb71cf44452ddb8813f
      PARENT_SHA: 1f2c971a2b74455dc752e68d680f8a4231d01cab
      TARGET_FILE: assets/css/components/forms/form-flow-comfort.css
      TARGET_BLOB: 28863e14d84271f1ce71dd87d61140555b304a22
      IMPORTER: assets/css/pages/flow-foundation.css
      IMPORTER_BLOB: dc5af3f258630570f7de83638044034020009ac3
      ACTIVATOR: assets/js/components/forms/form-flow-comfort.js
      ACTIVATOR_BLOB: 2feefdbaf1845888d900b37054d5ac2bf1259ede
      SESSION_STORE: assets/js/core/session.js
      SESSION_STORE_BLOB: a08780f52c7f161ab7f4b68ece8075cc570abe3a
      ROUTE_GUARD: assets/js/core/route-guard.js
      ROUTE_GUARD_BLOB: 4a650be0b88ac6a22088b47c92411e8c0232bced
      AUTH_SERVICE: assets/js/services/auth-service.js
      AUTH_SERVICE_BLOB: e2862ba29a5d6b806cd846e6d80fb62326ece9e1
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-061 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact CSS, activation and auth authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER")" = "$IMPORTER_BLOB"
          test "$(git hash-object "$ACTIVATOR")" = "$ACTIVATOR_BLOB"
          test "$(git hash-object "$SESSION_STORE")" = "$SESSION_STORE_BLOB"
          test "$(git hash-object "$ROUTE_GUARD")" = "$ROUTE_GUARD_BLOB"
          test "$(git hash-object "$AUTH_SERVICE")" = "$AUTH_SERVICE_BLOB"
          grep -q "document.body.classList.add('doke-form-comfort-ready')" "$ACTIVATOR"
          grep -q "const STORAGE_KEY = 'doke.auth.session.v1'" "$SESSION_STORE"
          grep -q "const getSession = () => getSessionStore" "$AUTH_SERVICE"
          grep -q "normalizeAccessState" "$ROUTE_GUARD"
          grep -q 'components/forms/form-flow-comfort.css' "$IMPORTER"
          test -z "$(git status --porcelain)"
          echo 'R4 AUTHORITY PASS|realProductDOM=1|realProductJS=1|syntheticIdentityOnly=1|tokenSecrets=0|criteriaRelaxed=0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium and serve exact product
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          python3 -m http.server 4178 >/tmp/ux062-r4-http.log 2>&1 &
          echo $! >/tmp/ux062-r4-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4178/orcamento.html >/dev/null

      - name: Authenticated real-runtime A-B proof
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ux062-r4.js <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const target=process.env.TARGET_FILE,original=fs.readFileSync(target,'utf8'),lines=original.split('\n');
          const removeLine=110,expected='  margin-bottom: 16px;';
          if((lines[removeLine-1]||'').replace(/\r$/,'')!==expected)throw new Error(`row drift ${removeLine}`);
          const candidate=lines.filter((_,i)=>i+1!==removeLine).join('\n');
          const hash=crypto.createHash('sha256').update(candidate).digest('hex'),bytes=Buffer.byteLength(candidate);
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          const p0=parse(original),c0=parse(candidate);if(p0.decl!==114||p0.dead.length!==1)throw new Error(`parent parse ${p0.decl}/${p0.dead.length}`);if(c0.decl!==113||c0.dead.length!==0)throw new Error(`candidate parse ${c0.decl}/${c0.dead.length}`);const d=p0.dead[0];if(d.line!==110||d.property!=='margin-bottom'||d.value!=='16px'||d.winner.value!=='12px')throw new Error('dead-row identity drift');
          const pages=['ajuda.html','anunciar-servico.html','avaliacao-profissional.html','novidades.html','orcamento.html','pagamento-profissional.html','tornar-profissional.html','verificacao-profissional.html'];
          const supported=new Set(['anunciar-servico.html','avaliacao-profissional.html','orcamento.html','pagamento-profissional.html','tornar-profissional.html','verificacao-profissional.html']);
          const matchPages=new Set(['orcamento.html','tornar-profissional.html']);
          const widths=[359,430,759,760,761,1024,1280];
          const full='body.doke-form-comfort-ready :is(.post-service-panel__head,.become-pro-section-head,.budget-panel__head,.verification-section__head,.payment-section__head,.review-section__head)';
          const raw='.post-service-panel__head,.become-pro-section-head,.budget-panel__head,.verification-section__head,.payment-section__head,.review-section__head';
          const session={provider:'mock',remember:true,user:{id:'ux062-proof-user',name:'UX 062 Proof',email:'ux062-proof@example.invalid',role:'client',type:'client',accountStatus:'active',verified:true},accountStatus:'active',sessionStatus:'active',issuedAt:'2026-08-17T00:00:00.000Z',updatedAt:'2026-08-17T00:00:00.000Z'};
          async function capture(tag){const browser=await chromium.launch({headless:true});const out=[];let fullTotal=0,rawTotal=0,readySamples=0;try{for(const pageName of pages){for(const width of widths){const ctx=await browser.newContext({viewport:{width,height:900}});await ctx.addInitScript(({session})=>{localStorage.setItem('doke.auth.session.v1',JSON.stringify(session));},{session});const page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url());if(['127.0.0.1','localhost'].includes(u.hostname))return route.continue();return route.abort();});await page.goto(`http://127.0.0.1:4178/${pageName}?ux062=${tag}-${width}`,{waitUntil:'domcontentloaded'});await page.waitForTimeout(1400);if(!page.url().includes('/'+pageName))throw new Error(`${pageName}@${width} redirected to ${page.url()}`);const snap=await page.evaluate(({full,raw})=>{const els=[...document.querySelectorAll(full)],rawEls=[...document.querySelectorAll(raw)];const rows=els.map((el,i)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return{i,tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',marginBottom:cs.marginBottom,display:cs.display,rect:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*1000)/1000)};});return{pageData:document.body.dataset.page||'',ready:document.body.classList.contains('doke-form-comfort-ready'),authDecision:document.documentElement.dataset.authRouteDecision||'',authenticated:document.documentElement.dataset.authenticated||'',rawCount:rawEls.length,rows,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}} ,{full,raw});const shouldReady=supported.has(pageName),shouldMatch=matchPages.has(pageName);if(snap.ready!==shouldReady)throw new Error(`${pageName}@${width} ready=${snap.ready} expected=${shouldReady} pageData=${snap.pageData}`);if(shouldReady&&snap.authDecision!=='authorized')throw new Error(`${pageName}@${width} authDecision=${snap.authDecision}`);if(shouldReady&&snap.authenticated!=='true')throw new Error(`${pageName}@${width} authenticated=${snap.authenticated}`);if(shouldMatch&&snap.rows.length===0)throw new Error(`${pageName}@${width} missing full selector`);if(!shouldMatch&&snap.rows.length!==0)throw new Error(`${pageName}@${width} unexpected full selector=${snap.rows.length}`);for(const row of snap.rows)if(row.marginBottom!=='12px')throw new Error(`${pageName}@${width} winner=${row.marginBottom}`);fullTotal+=snap.rows.length;rawTotal+=snap.rawCount;if(snap.ready)readySamples++;out.push({page:pageName,width,snap});await ctx.close()}}}finally{await browser.close()}console.log(`COVERAGE|${tag}|samples=${out.length}|supportedPages=6|realSelectorPages=2|zeroMatchPages=6|viewports=7|readySamples=${readySamples}|rawTotal=${rawTotal}|fullTotal=${fullTotal}|boundary=759/760/761`);return out}
          (async()=>{try{fs.writeFileSync(target,original);const p=await capture('parent');fs.writeFileSync(target,candidate);const c=await capture('candidate');const a=JSON.stringify(p),b=JSON.stringify(c);if(a!==b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;throw new Error(`runtime drift idx=${i} parent=${a.slice(i,i+900)} candidate=${b.slice(i,i+900)}`)}const maxOverflow=Math.max(0,...p.map(x=>x.snap.overflow));if(maxOverflow!==0)throw new Error(`overflow=${maxOverflow}`);console.log('R4 BROWSER PARITY PASS|importPages=8|supportedPages=6|realSelectorPages=2|zeroMatchPages=6|viewports=7|runtimeDiffs=0|overflow=0|realProductDOM=1|realProductJS=1|syntheticIdentityOnly=1|tokenSecrets=0|criteriaRelaxed=0');console.log(`CANDIDATE IDENTITY|sha256=${hash}|bytes=${bytes}|declarations=113|superseded=0|files=1|additions=0|deletions=1`);fs.writeFileSync(target,candidate)}catch(e){fs.writeFileSync(target,original);throw e}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node --check /tmp/ux062-r4.js
          node /tmp/ux062-r4.js | tee /tmp/ux062-r4.log
          grep -q 'COVERAGE|parent|samples=56|supportedPages=6|realSelectorPages=2|zeroMatchPages=6|viewports=7' /tmp/ux062-r4.log
          grep -q 'COVERAGE|candidate|samples=56|supportedPages=6|realSelectorPages=2|zeroMatchPages=6|viewports=7' /tmp/ux062-r4.log
          grep -q 'R4 BROWSER PARITY PASS|importPages=8|supportedPages=6|realSelectorPages=2|zeroMatchPages=6|viewports=7|runtimeDiffs=0|overflow=0' /tmp/ux062-r4.log
          grep -q 'criteriaRelaxed=0' /tmp/ux062-r4.log
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          git diff --check
          echo 'R4 PROOF PASS|browserRequired=1|realProductDOM=1|realProductJS=1|candidateLeftForDiff=1'

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux062-r4-http.pid; then kill "$(cat /tmp/ux062-r4-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER")" = "$IMPORTER_BLOB"
          test "$(git hash-object "$ACTIVATOR")" = "$ACTIVATOR_BLOB"
          test -z "$(git status --porcelain)"
          echo 'R4 RESTORE PASS|productMutation=0|permanentBranchMutation=0'
