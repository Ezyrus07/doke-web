name: Temporary AUTH-A13 Domain Closure Codemod

on:
  pull_request:
    branches: [MAIN, main, master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply AUTH-A13 codemod
        shell: bash
        run: |
          set -o pipefail
          node scripts/tmp-auth-a13-codemod.js 2>&1 | tee auth-a13-codemod.log

      - name: Upload codemod failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-a13-codemod-failure-${{ github.sha }}
          path: auth-a13-codemod.log
          if-no-files-found: error
          retention-days: 7

      - name: Audit AUTH-A13 closure
        run: npm run audit:auth-domain-closure

      - name: Validate cumulative AUTH authorities
        run: |
          npm run audit:auth-session
          npm run audit:identity-profile-contract
          npm run test:auth-local-profile-mutation-retirement
          npm run test:auth-onboarding-authority-retirement
          npm run test:auth-professional-authority-retirement

      - name: Audit runtime flags
        run: npm run audit:runtime-flags

      - name: Audit deterministic matrix
        run: npm run audit:domain-completion-matrix

      - name: Validate patch formatting
        run: git diff --check

      - name: Remove temporary codemod
        run: rm scripts/tmp-auth-a13-codemod.js

      - name: Publish AUTH-A13 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/js/config/runtime-flags.js config/domain-completion-matrix.json package.json scripts/audit-auth-domain-closure.js scripts/tmp-auth-a13-codemod.js docs/validation/AUTH-001-A13-DOMAIN-CLOSURE.md docs/validation/AUTH-001-A13-DOMAIN-CLOSURE.json docs/AUTH-INTEGRATION-CONTRACT.md docs/DOKE-ENGINEERING-JOURNAL.md docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --cached --check
          git commit -m 'Reconcile AUTH-001 domain closure authority'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
