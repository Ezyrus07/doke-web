name: Doke UX-RESP-DEBT-006 Small Tablet Migration Diagnostic

on:
  push:
    branches:
      - diag/ux-resp-debt-006-small-tablet-migration

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-005 parent
        run: test "$(git rev-parse HEAD^)" = "c8b812edf77afcdd8e71683d9cc035dc5f53dff6"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Remove quarantined imports in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('assets/css/pages/pedidos-runtime-page.css'),
            Path('assets/css/pages/notificacoes-foundation.css'),
            Path('assets/css/pages/carteira-runtime-page.css'),
          ]
          needle = 'tablet-internal-rail-contract.css'
          for p in files:
            lines = p.read_text().splitlines(True)
            matches = [line for line in lines if needle in line]
            if len(matches) != 1:
              raise SystemExit(f'{p}: expected one quarantined import, got {len(matches)}')
            p.write_text(''.join(line for line in lines if needle not in line))
          PY
          git diff -- assets/css/pages/pedidos-runtime-page.css assets/css/pages/notificacoes-foundation.css assets/css/pages/carteira-runtime-page.css

      - name: Validate CSS imports after workspace candidate
        run: npm run audit:css-import-resolution

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run full responsive contract
        shell: bash
        run: |
          node scripts/generate-responsive-index-baseline.js
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 1
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json','utf8'));
          console.log('PROBE_SUMMARY', JSON.stringify(r.summary));
          for (const f of r.failures || []) console.log('PROBE_FAILURE', JSON.stringify({page:f.page,breakpoint:f.breakpoint,component:f.component,property:f.property,expected:f.expected,actual:f.actual,selector:f.selector}));
          NODE

      - name: Validate shared header and responsive boundaries
        run: |
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
