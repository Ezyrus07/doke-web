name: Doke UX-RESP-DEBT-006 Small Tablet Migration Diagnostic

on:
  push:
    branches:
      - diag/ux-resp-debt-006-small-tablet-migration

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-005 ancestry
        run: test "$(git merge-base HEAD c8b812edf77afcdd8e71683d9cc035dc5f53dff6)" = "c8b812edf77afcdd8e71683d9cc035dc5f53dff6"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate baseline
        run: node scripts/generate-responsive-index-baseline.js

      - name: Capture certified parent responsive report
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 1
          cp reports/responsive-contract-test-report.json /tmp/parent-responsive.json
          node -e "const r=require('/tmp/parent-responsive.json'); console.log('PARENT', JSON.stringify(r.summary))"

      - name: Remove quarantined imports in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('assets/css/pages/pedidos-runtime-page.css'),
            Path('assets/css/pages/notificacoes-foundation.css'),
            Path('assets/css/pages/carteira-runtime-page.css'),
          ]
          needle = 'tablet-internal-rail-contract.css'
          for p in files:
            lines = p.read_text().splitlines(True)
            matches = [line for line in lines if needle in line]
            if len(matches) != 1:
              raise SystemExit(f'{p}: expected one quarantined import, got {len(matches)}')
            p.write_text(''.join(line for line in lines if needle not in line))
          PY
          npm run audit:css-import-resolution

      - name: Capture candidate and classify lost checks
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 1
          node <<'NODE'
          const fs=require('fs');
          const parent=JSON.parse(fs.readFileSync('/tmp/parent-responsive.json','utf8'));
          const candidate=JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json','utf8'));
          console.log('CANDIDATE',JSON.stringify(candidate.summary));
          const key=s=>[s.page,s.breakpoint||'',s.component||'',s.reason||''].join('|');
          const p=new Set((parent.skips||[]).map(key));
          const c=new Set((candidate.skips||[]).map(key));
          console.log('NEW_SKIPS_START');
          for(const s of candidate.skips||[]) if(!p.has(key(s))) console.log(JSON.stringify(s));
          console.log('NEW_SKIPS_END');
          console.log('REMOVED_SKIPS_START');
          for(const s of parent.skips||[]) if(!c.has(key(s))) console.log(JSON.stringify(s));
          console.log('REMOVED_SKIPS_END');
          for(const f of candidate.failures||[]) console.log('FAIL',JSON.stringify({page:f.page,breakpoint:f.breakpoint,component:f.component,property:f.property,expected:f.expected,actual:f.actual}));
          NODE

      - name: Validate shared header and responsive boundaries
        run: |
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
