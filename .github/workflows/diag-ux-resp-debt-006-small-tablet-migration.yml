name: Doke UX-RESP-DEBT-006 Small Tablet Migration Diagnostic

on:
  push:
    branches:
      - diag/ux-resp-debt-006-small-tablet-migration

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-005 ancestry
        run: test "$(git merge-base HEAD c8b812edf77afcdd8e71683d9cc035dc5f53dff6)" = "c8b812edf77afcdd8e71683d9cc035dc5f53dff6"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply workspace-only small-tablet migration candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('assets/css/pages/pedidos-runtime-page.css'),
            Path('assets/css/pages/notificacoes-foundation.css'),
            Path('assets/css/pages/carteira-runtime-page.css'),
          ]
          needle = 'tablet-internal-rail-contract.css'
          for p in files:
            lines = p.read_text().splitlines(True)
            matches = [line for line in lines if needle in line]
            if len(matches) != 1:
              raise SystemExit(f'{p}: expected one quarantined import, got {len(matches)}')
            p.write_text(''.join(line for line in lines if needle not in line))

          header = Path('assets/css/layout/header.css')
          s = header.read_text()
          bridge = r'''

/* UX-RESP-DEBT-006 diagnostic — contextual small-tablet account presence only. */
@media (min-width: 561px) and (max-width: 760px) {
  body:is(.orders-page-shell, .notifications-page-shell, .wallet-page-shell).has-global-header
    > .app-shell > .page > .app-header.home-side-meta
    :is(.home-side-meta__group--secondary, .app-header__group--secondary) {
    display: inline-flex;
    visibility: visible;
    opacity: 1;
  }

  body:is(.orders-page-shell, .notifications-page-shell, .wallet-page-shell).has-global-header
    > .app-shell > .page > .app-header.home-side-meta
    .home-side-meta__profile-wrap {
    display: inline-flex;
    visibility: visible;
    opacity: 1;
  }

  body:is(.orders-page-shell, .notifications-page-shell, .wallet-page-shell).has-global-header
    > .app-shell > .page > .app-header.home-side-meta
    .home-side-meta__profile {
    display: inline-flex;
    visibility: visible;
    opacity: 1;
  }

  body:is(.orders-page-shell, .notifications-page-shell, .wallet-page-shell).has-global-header
    > .app-shell > .page > .app-header.home-side-meta
    .home-side-meta__profile .home-side-meta__avatar.doke-avatar {
    display: inline-grid;
    visibility: visible;
    opacity: 1;
  }
}
'''
          if 'UX-RESP-DEBT-006 diagnostic' in s:
            raise SystemExit('diagnostic bridge already present')
          header.write_text(s + bridge)
          PY
          git diff -- assets/css/layout/header.css assets/css/pages/pedidos-runtime-page.css assets/css/pages/notificacoes-foundation.css assets/css/pages/carteira-runtime-page.css
          npm run audit:css-import-resolution

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run full responsive contract and require exact preservation
        shell: bash
        run: |
          node scripts/generate-responsive-index-baseline.js
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 1
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json','utf8'));
          console.log('PROBE_SUMMARY', JSON.stringify(r.summary));
          for(const f of r.failures||[]) console.log('PROBE_FAILURE',JSON.stringify({page:f.page,breakpoint:f.breakpoint,component:f.component,property:f.property,expected:f.expected,actual:f.actual,selector:f.selector}));
          for(const s of r.skips||[]) if(['pedidos.html','notificacoes.html','carteira.html'].includes(s.page) && s.breakpoint==='608x926' && ['home-side-meta__profile','avatar'].includes(s.component)) console.log('TARGET_SKIP',JSON.stringify(s));
          if(r.summary.checks!==897) throw new Error(`checks must remain 897, got ${r.summary.checks}`);
          if(r.summary.skips!==276) throw new Error(`skips must remain 276, got ${r.summary.skips}`);
          if(r.summary.failures!==4) throw new Error(`failures must reduce exactly 7 -> 4, got ${r.summary.failures}`);
          const pages=Object.keys(r.summary.failuresByPage||{});
          if(pages.length!==1 || pages[0]!=='detalhe-anuncio.html' || r.summary.failuresByPage['detalhe-anuncio.html']!==4) throw new Error('only four Detail failures may remain');
          NODE

      - name: Validate shared header and responsive boundaries
        run: |
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
