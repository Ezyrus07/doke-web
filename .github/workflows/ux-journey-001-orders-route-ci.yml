name: Doke UX-JOURNEY-001 Orders Route Context

on:
  pull_request:
    branches:
      - ux/ux-visual-016-wallet-financial-hierarchy
    paths:
      - '.github/workflows/ux-journey-001-orders-route-ci.yml'
      - 'pedidos.html'
      - 'assets/js/pages/pedidos/**'
      - 'assets/js/pages/pedidos-local-orders.js'
      - 'tests/ux-journey-001-*.cjs'
      - 'tests/fixtures/marketplace-demo.cjs'
      - 'scripts/serve-static-site.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  orders-route-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
      DOKE_PLAYWRIGHT_LIVE_SEARCH: '0'
      UX_JOURNEY_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check route and test syntax
        run: |
          node --check assets/js/pages/pedidos/orders-route-context.js
          node --check tests/ux-journey-001-route-context.test.cjs
          node --check tests/ux-journey-001-browser.cjs
          node --check tests/fixtures/marketplace-demo.cjs
      - name: Test authorized order route focus
        run: node --test tests/ux-journey-001-route-context.test.cjs
      - name: Test route in browser (mobile, tablet, desktop)
        run: node tests/ux-journey-001-browser.cjs
      - name: Validate domain matrix
        run: npm run audit:domain-completion-matrix
