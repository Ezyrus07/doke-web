name: COM-B03C-R3Q Repository Executable Observation Envelope Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r3q.js'
      - 'config/com-b03c-r3q-repository-executable-observation-envelope-readiness.json'
      - 'scripts/test-com-b03c-r3q-repository-executable-observation-envelope-readiness.js'
      - 'docs/validation/COM-B03C-R3Q-REPOSITORY-EXECUTABLE-OBSERVATION-ENVELOPE-READINESS.json'
      - '.github/workflows/com-b03c-r3q-repository-executable-observation-envelope-readiness.yml'

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3q.js
          node --check scripts/test-com-b03c-r3q-repository-executable-observation-envelope-readiness.js
      - name: R3Q repository executable envelope
        run: node scripts/test-com-b03c-r3q-repository-executable-observation-envelope-readiness.js
      - name: Pre-remote hard block
        run: |
          test ! -e config/com-b03c-r3q-repository-executable-observation-staging-trigger.json
          node - <<'NODE'
          const c=require('./config/com-b03c-r3q-repository-executable-observation-envelope-readiness.json');
          const e=require('./docs/validation/COM-B03C-R3Q-REPOSITORY-EXECUTABLE-OBSERVATION-ENVELOPE-READINESS.json');
          for(const value of Object.values(c.prohibitedPreparation)) if(value !== false) process.exit(1);
          if(e.authority?.remoteAdapterBinding !== false || e.authority?.remoteExecution !== false || e.authority?.stagingRead !== false || e.authority?.stagingMutation !== false) process.exit(1);
          if(e.envelope?.remoteDependencies !== false || e.envelope?.executableSqlPrepared !== false || e.envelope?.supabaseClientPrepared !== false || e.envelope?.pgClientPrepared !== false || e.envelope?.remoteExecutorPrepared !== false) process.exit(1);
          if(e.exactRootCauseProven !== false || e.causalPromotionAllowed !== false) process.exit(1);
          NODE
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
