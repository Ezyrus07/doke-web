          NODE

      - name: Publish R1b receipt on diagnostic branch only
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PARENT_SHA" >/dev/null;git clean -fd >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT_SHA";test "$(git rev-parse HEAD^{tree})" = "$PARENT_TREE";test "$(git status --porcelain)" = ""
          git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")";cp /tmp/result.json "$RESULT_FILE"
          git config user.name doke;git config user.email bielantoniomma@gmail.com;git add "$RESULT_FILE";test "$(git diff --cached --name-only)" = "$RESULT_FILE";git commit -m 'diagnostic(ux-css-important-044): record corrected doke shell reach proof' >/dev/null;git push origin HEAD:"$OUTPUT_BRANCH" >/dev/null

      - name: Verify certified predecessor remains exact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ux/ux-css-important-043-home-tablet-v2-dormant-priority >/dev/null
          test "$(git rev-parse FETCH_HEAD)" = "$PARENT_SHA";test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
