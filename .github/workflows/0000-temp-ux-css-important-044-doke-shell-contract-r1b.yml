name: TEMP UX-CSS-IMPORTANT-044 Doke Shell Contract R1b

on:
  push:
    branches: [diag/ux-css-important-044-doke-shell-contract-r1b]
    paths: [.github/workflows/0000-temp-ux-css-important-044-doke-shell-contract-r1b.yml]

permissions:
  contents: write

jobs:
  reach-source-cascade-r1b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARENT_SHA: 69d7aa33b199ff6908c5f6244526d2fae31374ce
      PARENT_TREE: 72119fd05d33a116ff342393f1711adf648e4b7c
      TARGET_FILE: assets/css/components/shell/doke-shell-contract.css
      TARGET_BLOB: c167c0b747dbb4465cdaf096b5a9225fa3d69059
      TARGET_IMPORTANT: '2552'
      PARENT_GLOBAL: '2783'
      OUTPUT_BRANCH: diag/ux-css-important-044-doke-shell-contract-r1b
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-044-doke-shell-contract-r1b.yml
      RESULT_FILE: .diagnostics/ux-css-important-044-doke-shell-contract-r1b.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}

      - name: Freeze certified 043 parent and diagnostic isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = 1
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$WORKFLOW_FILE"

      - name: Resolve all priority sites and prove live reach / source / cascade inventory
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA" >/dev/null
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),path=require('path'),posix=path.posix,crypto=require('crypto');
          const SHA=process.env.PARENT_SHA,TARGET=process.env.TARGET_FILE;
          const files=cp.execFileSync('git',['ls-tree','-r','--name-only',SHA],{encoding:'utf8'}).trim().split('\n').filter(Boolean),S=new Set(files);
          const read=p=>cp.execFileSync('git',['show',`${SHA}:${p}`],{encoding:'utf8',maxBuffer:40*1024*1024});
          const target=read(TARGET),raw=[...target.matchAll(/!important\b/gi)];
          if(raw.length!==Number(process.env.TARGET_IMPORTANT))throw Error(`target markers ${raw.length}`);
          if(cp.execFileSync('git',['rev-parse',`${SHA}:${TARGET}`],{encoding:'utf8'}).trim()!==process.env.TARGET_BLOB)throw Error('target blob mismatch');

          function maskCommentsStrings(s){let a=[...s],state='code',q='';for(let i=0;i<s.length;i++){if(state==='comment'){a[i]=' ';if(s[i]==='*'&&s[i+1]==='/'){a[i+1]=' ';i++;state='code'}continue}if(state==='string'){a[i]=' ';if(s[i]==='\\'){if(i+1<s.length){a[i+1]=' ';i++}continue}if(s[i]===q)state='code';continue}if(s[i]==='/'&&s[i+1]==='*'){a[i]=a[i+1]=' ';i++;state='comment';continue}if(s[i]==='"'||s[i]==="'"){q=s[i];a[i]=' ';state='string'}}return a.join('')}
          const masked=maskCommentsStrings(target),sites=[],unresolved=[];
          function selectorBefore(off){let depth=0;for(let i=off-1;i>=0;i--){const ch=masked[i];if(ch==='}')depth++;else if(ch==='{'){if(depth===0){let j=i-1;while(j>=0&&masked[j]!=='}'&&masked[j]!==';'&&masked[j]!=='{')j--;return masked.slice(j+1,i).trim().replace(/\s+/g,' ')}depth--}}return ''}
          for(const m of raw){const off=m.index;if(masked.slice(off,off+10).toLowerCase()!=='!important'){unresolved.push({offset:off,reason:'comment-or-string'});continue}let start=off-1;while(start>=0&&!';{}'.includes(masked[start]))start--;const frag=masked.slice(start+1,off),colon=frag.indexOf(':');if(colon<1){unresolved.push({offset:off,reason:'no-colon'});continue}const prop=frag.slice(0,colon).trim();if(!/^(?:--[A-Za-z0-9_-]+|-?[A-Za-z][A-Za-z0-9_-]*)$/.test(prop)){unresolved.push({offset:off,reason:'property-grammar',prop});continue}let line=1,col=1;for(let i=0;i<off;i++){if(target[i]==='\n'){line++;col=1}else col++}sites.push({offset:off,line,column:col,property:prop,selector:selectorBefore(off)})}
          if(unresolved.length||sites.length!==raw.length)throw Error(`unresolved ${unresolved.length} ${JSON.stringify(unresolved.slice(0,10))}`);

          const cssAll=files.filter(p=>p.endsWith('.css'));
          function imports(p){const src=maskCommentsStrings(read(p)),out=[],rx=/@import\s+(?:url\(\s*)?['"]?([^'"\)\s;]+\.css(?:\?[^'"\)\s;]*)?)['"]?\s*\)?[^;]*;/gi;for(const m of src.matchAll(rx)){let x=m[1].split('?',1)[0].split('#',1)[0];if(/^[a-z]+:\/\//i.test(x))continue;out.push(x.startsWith('/')?x.slice(1):posix.normalize(posix.join(posix.dirname(p),x)))}return out}
          const im=new Map(cssAll.map(p=>[p,imports(p)])),directImporters=cssAll.filter(p=>(im.get(p)||[]).includes(TARGET)).sort();
          const html=files.filter(p=>p.endsWith('.html')&&!/^(archive|reports|tools|test-results)\//.test(p)),linkRx=/<link\b[^>]*?href\s*=\s*['"]([^'"]+)['"][^>]*>/gis,starts=new Map(),directHtmlRefs=[];
          for(const h of html){const arr=[];for(const m of read(h).matchAll(linkRx)){let x=m[1].split('?',1)[0].split('#',1)[0];if(!x.endsWith('.css')||/^[a-z]+:\/\//i.test(x))continue;x=x.startsWith('/')?x.slice(1):posix.normalize(posix.join(posix.dirname(h),x));arr.push(x);if(x===TARGET)directHtmlRefs.push(h)}starts.set(h,arr)}
          function closureOrdered(xs){const seen=new Set(),out=[];function visit(p){if(seen.has(p)||!S.has(p)||!p.endsWith('.css'))return;seen.add(p);out.push(p);for(const q of im.get(p)||[])visit(q)}for(const x of xs)visit(x);return out}
          const targetPages=[],pageLoadOrder={},loaded=new Set();for(const [h,xs] of starts){const c=closureOrdered(xs);for(const x of c)loaded.add(x);const idx=c.indexOf(TARGET);if(idx>=0){targetPages.push(h);pageLoadOrder[h]={index:idx,total:c.length,before:c.slice(Math.max(0,idx-5),idx),after:c.slice(idx+1,idx+6)}}}
          const runtimeJsRefs=[];for(const p of files.filter(x=>x.startsWith('assets/js/')&&/\.(?:js|mjs|cjs)$/.test(x))){const t=read(p);if(t.includes(TARGET)||t.includes(posix.basename(TARGET)))runtimeJsRefs.push(p)}
          const canonicalLoaded=loaded.has(TARGET),wholeFileDormant=!canonicalLoaded&&!directImporters.length&&!directHtmlRefs.length&&!runtimeJsRefs.length;

          function declarationKeys(src){const clean=maskCommentsStrings(src),keys=new Set();let i=0;while(i<clean.length){const open=clean.indexOf('{',i);if(open<0)break;let j=open-1;while(j>=0&&clean[j]!=='}'&&clean[j]!=='{'&&clean[j]!==';')j--;const sel=clean.slice(j+1,open).trim().replace(/\s+/g,' ');let depth=1,k=open+1;for(;k<clean.length&&depth;k++){if(clean[k]==='{')depth++;else if(clean[k]==='}')depth--}if(depth){i=open+1;continue}const body=clean.slice(open+1,k-1);if(!sel.startsWith('@'))for(const part of body.split(';')){const c=part.indexOf(':');if(c>0){const prop=part.slice(0,c).trim();if(/^(?:--[A-Za-z0-9_-]+|-?[A-Za-z][A-Za-z0-9_-]*)$/.test(prop))keys.add(`${sel}\u0000${prop}`)}}i=k}return keys}
          const targetKeys=new Set(sites.filter(s=>s.selector).map(s=>`${s.selector}\u0000${s.property}`)),loadedOther=[...loaded].filter(p=>p!==TARGET),collisionByFile={},collisionKeys=new Set();
          for(const p of loadedOther){let ks;try{ks=declarationKeys(read(p))}catch{continue}const hits=[...targetKeys].filter(k=>ks.has(k));if(hits.length){collisionByFile[p]=hits.length;for(const k of hits)collisionKeys.add(k)}}
          const siteCollisionCount=sites.filter(s=>collisionKeys.has(`${s.selector}\u0000${s.property}`)).length;

          const debtCss=cssAll.filter(p=>p.startsWith('assets/css/'));
          const allCssImportant=debtCss.reduce((n,p)=>n+(read(p).match(/!important\b/gi)||[]).length,0);
          if(allCssImportant!==Number(process.env.PARENT_GLOBAL))throw Error(`canonical assets/css global ${allCssImportant}`);

          const docs=['AGENTS.md','PROJECT-RULES.md','ARCHITECTURE.md','docs/DOKE_AGENT_CONSTITUTION.md','docs/BASELINE-VISUAL-APPROVED.md','docs/CSS_AUTHORITY_MAP.md','docs/DESIGN-SYSTEM-GUIDE.md','docs/DOKE-PLANO-MESTRE-CONCLUSAO-PLATAFORMA.md','docs/DOMAIN-COMPLETION-MATRIX.md','docs/GLOBAL-LAYOUT-CONTRACT.md','docs/PAGE-ASSET-AUTHORITY-MATRIX.md'];
          const authorityDocs={};for(const p of docs.filter(x=>S.has(x)))authorityDocs[p]=cp.execFileSync('git',['rev-parse',`${SHA}:${p}`],{encoding:'utf8'}).trim();
          const siblingAuthorities=['assets/css/components/shell/app-header.css','assets/css/components/shell/tablet-shell-contract.css','assets/css/components/shell/mobile-base-stability.css','assets/css/components/layout/responsive-priority-contract.css','assets/css/components/navigation/mobile-search-header-shared.css','assets/css/pages/home-foundation.css'].filter(p=>S.has(p));
          const relations={};for(const p of siblingAuthorities)relations[p]={blob:cp.execFileSync('git',['rev-parse',`${SHA}:${p}`],{encoding:'utf8'}).trim(),literalImportantMarkers:(read(p).match(/!important\b/gi)||[]).length,relationImportsTarget:(im.get(p)||[]).includes(TARGET),targetImportsRelation:(im.get(TARGET)||[]).includes(p),loaded:loaded.has(p),exactSelectorPropertyCollisions:collisionByFile[p]||0};
          const textual=[];for(const p of files.filter(x=>x!==TARGET&&/\.(?:md|json|js|mjs|cjs|html|css|yml|yaml)$/.test(x))){let t='';try{t=read(p)}catch{}if(t.includes(TARGET)||t.includes(posix.basename(TARGET)))textual.push(p)}
          const toolingRefs=textual.filter(p=>p.startsWith('docs/')||p.startsWith('scripts/')||p.startsWith('config/')||p.startsWith('tools/')),otherRefs=textual.filter(p=>!toolingRefs.includes(p)&&!directImporters.includes(p)&&!directHtmlRefs.includes(p)&&!runtimeJsRefs.includes(p));
          const result=wholeFileDormant?'PASS_WHOLE_FILE_DORMANT':'PASS_ACTIVE_REACH_CONFIRMED';
          const out={proof:'UX-CSS-IMPORTANT-044 Reach / Source / Cascade R1b',result,checkpoint:'UX-CSS-IMPORTANT-044',harnessHistory:[{run:32900205435,job:97972005875,classification:'DIAGNOSTIC_HARNESS_GLOBAL_SCOPE_OVERBROAD',observedAllRepositoryCssImportant:4275,canonicalDebtScope:'assets/css/**',criteriaRelaxed:false}],product:{sha:SHA,tree:process.env.PARENT_TREE,globalImportant:allCssImportant,globalScope:'assets/css/**'},target:{path:TARGET,blob:process.env.TARGET_BLOB,bytes:Buffer.byteLength(target),sha256:crypto.createHash('sha256').update(target).digest('hex'),important:raw.length,importantSites:sites.length,unresolvedImportantSites:unresolved.length,uniquePrioritySelectorPropertyKeys:targetKeys.size,prioritySiteSamples:sites.slice(0,30),imports:im.get(TARGET)||[]},reach:{rootHtmlCount:html.length,loadedCssCount:loaded.size,canonicalLoaded,wholeFileDormant,targetPages:targetPages.sort(),directHtmlRefs:[...new Set(directHtmlRefs)].sort(),directImporters,runtimeJsRefs:runtimeJsRefs.sort(),pageLoadOrder,browserReconciliationRequired:!wholeFileDormant,toolingRefs:toolingRefs.sort(),otherRefs:otherRefs.sort()},cascade:{loadedOtherCssCount:loadedOther.length,exactSelectorPropertyCollisionKeys:collisionKeys.size,prioritySitesWithExactCollision:siteCollisionCount,collisionByFile:Object.fromEntries(Object.entries(collisionByFile).sort((a,b)=>b[1]-a[1]).slice(0,40)),conservativeStaticSafeSubsetNotYetCertified:true},authorityDocs,authorityRelations:relations,criteria:{expectedImportant:2552,allPrioritySitesResolved:true,criteriaRelaxed:0,broadMarkerRemovalAuthorized:wholeFileDormant,selectiveAnalysisRequired:!wholeFileDormant,productMutation:false,repositoryOnly:true,staging:false,production:false,backend:false,supabase:false,rpc:false,migrations:false,credentials:false,runtimeRealtime:false,merge:false,readyForReview:false,forcePush:false,historyRewrite:false}};
