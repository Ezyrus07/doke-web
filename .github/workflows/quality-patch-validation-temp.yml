name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact candidate patch
        shell: pwsh
        run: |
          $script = @'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = [
              Path(f'.github/quality-source-patch-parts/part-{index:02d}').read_text(encoding='ascii')
              for index in range(6)
          ]
          encoded = ''.join(parts)
          expected = 'ebd062ec4c675cad407dcfefe9833df46cbe2f977f80680f58e7cdedbf832908'
          actual = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if actual != expected:
              raise SystemExit(f'candidate patch checksum mismatch: {actual}')

          patch = zlib.decompress(base64.b64decode(encoded))
          Path('quality-candidate.patch').write_bytes(patch)

          # These two duplicate entries were already removed directly in the
          # ephemeral branch. Restore their exact CRLF baseline bytes in the
          # runner so the baseline-to-candidate patch applies deterministically.
          for relative_path in (
              'tests/e2e/mobile-shell.spec.js',
              'tests/e2e/stage28-regression-guards.spec.js',
          ):
              path = Path(relative_path)
              source = path.read_bytes()
              marker = b"  'comunidade.html',\n  'perfil.html',"
              restored = b"  'comunidade.html',\n  'comunidade.html',\n  'perfil.html',"
              if marker not in source:
                  raise SystemExit(f'baseline marker missing: {relative_path}')
              source = source.replace(marker, restored, 1)
              source = source.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
              path.write_bytes(source)

          print(f'Verified candidate patch: {len(patch)} bytes; sha256={actual}')
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'materialize-candidate.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python materialize-candidate.py
          git apply --check quality-candidate.patch
          git apply quality-candidate.patch

      - name: Verify candidate diff
        shell: bash
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Blocking E2E lane
        run: npm run test:e2e:ci

      - name: Visual structural guards
        run: npm run test:visual

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-final-evidence
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14
