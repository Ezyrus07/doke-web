name: Doke Blocking E2E Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-blocking-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blocking-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize deterministic core spec
        shell: pwsh
        run: |
          $content = @'
          const { test, expect } = require('@playwright/test');

          const clientSession = Object.freeze({
            provider: 'mock', sessionStatus: 'active', accountStatus: 'active', remember: false,
            user: Object.freeze({ id: 'user_ci_client', name: 'Cliente CI', email: 'cliente-ci@example.test', role: 'client', type: 'client', initials: 'CC', accountStatus: 'active' })
          });

          async function installRuntime(page, role = 'anonymous') {
            await page.addInitScript(({ client, selectedRole }) => {
              localStorage.setItem('doke.dataProvider', 'mock');
              localStorage.setItem('doke.authProvider', 'mock');
              localStorage.removeItem('doke.auth.session.v1');
              if (selectedRole === 'client') localStorage.setItem('doke.auth.session.v1', JSON.stringify(client));
            }, { client: clientSession, selectedRole: role });
          }

          async function expectHealthyPage(page, path, expectedDataPage, role = 'anonymous') {
            await installRuntime(page, role);
            await page.goto(`${path}${path.includes('?') ? '&' : '?'}dokeDataProvider=mock&dokeAuthProvider=mock`, { waitUntil: 'domcontentloaded' });
            await expect(page.locator('body')).toHaveAttribute('data-page', expectedDataPage);
            const health = await page.evaluate(() => ({
              width: document.documentElement.clientWidth,
              scrollWidth: Math.max(document.documentElement.scrollWidth, document.body?.scrollWidth || 0)
            }));
            expect(health.scrollWidth).toBeLessThanOrEqual(health.width + 1);
          }

          test.describe('CI core navigation contracts', () => {
            const publicPages = [
              ['/index.html', 'home'], ['/resultados.html', 'resultados'], ['/detalhe-anuncio.html', 'detalhe-anuncio']
            ];
            for (const [path, pageName] of publicPages) {
              test(`${pageName} loads in deterministic public mode`, async ({ page }) => expectHealthyPage(page, path, pageName));
            }

            const clientPages = [
              ['/pedidos.html', 'pedidos'], ['/mensagens.html', 'mensagens'], ['/carteira.html', 'carteira'],
              ['/notificacoes.html', 'notificacoes'], ['/configuracoes.html', 'configuracoes'],
              ['/orcamento.html', 'orcamento'], ['/pagamento-profissional.html', 'pagamento-profissional']
            ];
            for (const [path, pageName] of clientPages) {
              test(`${pageName} loads with deterministic client identity`, async ({ page }) => expectHealthyPage(page, path, pageName, 'client'));
            }
          });
          '@
          New-Item -ItemType Directory -Force -Path tests/e2e | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'tests/e2e/ci-core-navigation.spec.js'),
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run blocking E2E specs
        run: node node_modules/@playwright/test/cli.js test tests/e2e/ci-core-navigation.spec.js tests/e2e/anunciar-servico-ai-visual-contract.spec.js tests/e2e/payment-entry-state-contract.spec.js

      - name: Upload blocking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-blocking-e2e-evidence-final
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
