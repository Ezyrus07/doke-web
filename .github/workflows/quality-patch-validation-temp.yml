name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact final files
        shell: pwsh
        run: |
          $script = @'
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          encoded = ''.join(
              Path(f'.github/quality-final-files-parts/part-{index:02d}').read_text(encoding='ascii')
              for index in range(8)
          )
          encoded_sha = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_sha != 'f664505640ad7162a71fa83b2b9fd23a1025c6fa3c363a3dae45f5cb2bc0cd16':
              raise SystemExit(f'encoded checksum mismatch: {encoded_sha}')
          if len(encoded) != 62220:
              raise SystemExit(f'encoded size mismatch: {len(encoded)}')

          raw = zlib.decompress(base64.b64decode(encoded))
          raw_sha = hashlib.sha256(raw).hexdigest()
          if raw_sha != '82013bc566a20da3645f2b5859dbf2db792893d96f231aa1ad1d0c4058f90e85':
              raise SystemExit(f'raw checksum mismatch: {raw_sha}')
          if len(raw) != 224409:
              raise SystemExit(f'raw size mismatch: {len(raw)}')

          files = json.loads(raw.decode('utf-8'))
          if len(files) != 24:
              raise SystemExit(f'file count mismatch: {len(files)}')

          for relative_path, encoded_file in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded_file))

          print(
              f'Materialized {len(files)} exact files; '
              f'encoded={encoded_sha}; raw={raw_sha}'
          )
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'materialize-final-files.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python materialize-final-files.py

      - name: Verify candidate diff
        shell: bash
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Blocking E2E lane
        run: npm run test:e2e:ci

      - name: Visual structural guards
        run: npm run test:visual

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-final-evidence
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14
