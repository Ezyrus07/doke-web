name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact candidate files
        shell: pwsh
        run: |
          $script = @'
          import base64
          import json
          import zlib
          from pathlib import Path

          def materialize(payload):
              files = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
              for relative_path, encoded in files.items():
                  target = Path(relative_path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(base64.b64decode(encoded))
              return len(files)

          base_payload = ''.join(
              Path(f'.github/quality-patch-parts/part-{index:02d}').read_text(encoding='ascii')
              for index in range(6)
          )
          base_count = materialize(base_payload)
          visual_count = materialize(Path('.github/visual-harness-v2.b64').read_text(encoding='ascii'))
          print(f'Materialized {base_count} base files and {visual_count} visual harness files.')
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'materialize-candidate.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python materialize-candidate.py

      - name: Verify candidate diff
        shell: bash
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: E2E smoke
        id: e2e
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports/generated/quality-patch | Out-Null
          npm run test:e2e 2>&1 | Tee-Object -FilePath reports/generated/quality-patch/e2e.log
          $code = $LASTEXITCODE
          if (Test-Path reports/generated/playwright-results.json) {
            Copy-Item reports/generated/playwright-results.json reports/generated/quality-patch/e2e-results.json -Force
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'reports/generated/quality-patch/e2e-exit-code.txt'),
            [string]$code + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )
          exit $code

      - name: Visual structural guards and evidence
        id: visual
        continue-on-error: true
        shell: pwsh
        run: |
          npm run test:visual 2>&1 | Tee-Object -FilePath reports/generated/quality-patch/visual.log
          $code = $LASTEXITCODE
          if (Test-Path reports/generated/playwright-results.json) {
            Copy-Item reports/generated/playwright-results.json reports/generated/quality-patch/visual-results.json -Force
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'reports/generated/quality-patch/visual-exit-code.txt'),
            [string]$code + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )
          exit $code

      - name: Persist browser status
        if: always()
        shell: pwsh
        run: |
          $status = @{
            e2e = '${{ steps.e2e.outcome }}'
            visual = '${{ steps.visual.outcome }}'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'reports/generated/quality-patch/browser-status.json'),
            $status + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-green-evidence-v2
          path: |
            reports/generated/quality-patch/
            reports/generated/playwright-html/
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce browser results
        if: always() && (steps.e2e.outcome != 'success' || steps.visual.outcome != 'success')
        shell: bash
        run: |
          echo "Browser gates failed: e2e=${{ steps.e2e.outcome }} visual=${{ steps.visual.outcome }}"
          exit 1
