name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify candidate payload
        shell: pwsh
        run: |
          $script = @'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          encoded = ''.join(
              Path(f'.github/quality-source-patch-parts/part-{index:02d}').read_text(encoding='ascii')
              for index in range(6)
          )
          encoded_sha = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_sha != 'ebd062ec4c675cad407dcfefe9833df46cbe2f977f80680f58e7cdedbf832908':
              raise SystemExit(f'encoded checksum mismatch: {encoded_sha}')

          patch = zlib.decompress(base64.b64decode(encoded))
          patch_sha = hashlib.sha256(patch).hexdigest()
          if patch_sha != 'e9699d8abdf5fb1d09c7ffc1f709cfaab51e04abb33707622d16300bfbfcef73':
              raise SystemExit(f'patch checksum mismatch: {patch_sha}')
          if len(patch) != 60068:
              raise SystemExit(f'patch size mismatch: {len(patch)}')

          Path('quality-candidate.patch').write_bytes(patch)
          print(f'Payload verified: encoded={encoded_sha}; patch={patch_sha}; bytes={len(patch)}')
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'verify-payload.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python verify-payload.py

      - name: Restore exact test baseline
        shell: pwsh
        run: |
          $script = @'
          import hashlib
          from pathlib import Path

          expected = {
              'tests/e2e/mobile-shell.spec.js': '13279f2572a6899c0063c5ca048e7a2dd20a848434d8696350834b56879b3a10',
              'tests/e2e/stage28-regression-guards.spec.js': '7281e946322f8216fb7751d8b8ddfd205d41abf62f2feddd98d8459a3ede20e8',
          }

          for relative_path, expected_sha in expected.items():
              path = Path(relative_path)
              source = path.read_bytes()
              source = source.replace(
                  b"\n\n// Temporary trigger after the authorized Windows workflow update.\n",
                  b"\n",
              )
              marker = b"  'comunidade.html',\n  'perfil.html',"
              restored = b"  'comunidade.html',\n  'comunidade.html',\n  'perfil.html',"
              if marker not in source:
                  raise SystemExit(f'baseline marker missing: {relative_path}')
              source = source.replace(marker, restored, 1)
              source = source.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
              actual_sha = hashlib.sha256(source).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'baseline checksum mismatch for {relative_path}: {actual_sha}')
              path.write_bytes(source)
              print(f'Baseline restored: {relative_path} {actual_sha}')
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'restore-baseline.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python restore-baseline.py

      - name: Apply exact candidate patch
        shell: bash
        run: |
          git apply --check quality-candidate.patch
          git apply quality-candidate.patch
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Blocking E2E lane
        run: npm run test:e2e:ci

      - name: Visual structural guards
        run: npm run test:visual

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-final-evidence
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14
