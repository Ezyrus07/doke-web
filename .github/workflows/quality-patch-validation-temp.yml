name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply candidate corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              result = transform(source)
              if result == source:
                  raise SystemExit(f'candidate edit produced no change: {path}')
              p.write_text(result, encoding='utf-8')

          edit('.github/workflows/quality.yml', lambda s: s
              .replace('npm run test:e2e -- --project=chromium', 'npm run test:e2e')
              .replace('npm run test:visual -- --project=chromium', 'npm run test:visual')
              .replace('          path: playwright-report/\n', '          path: |\n            playwright-report/\n            test-results/\n'))

          edit('assets/css/pages/comunidade-foundation.css', lambda s: s.replace(
              '@import url("../components/layout/doke-layout-system.css?v=20260501-layout-system-v1");\n',
              '@import url("../components/layout/doke-layout-system.css?v=20260501-layout-system-v1");\n'
              '@import url("../components/domain/doke-domain-cards.css?v=20260723-quality-gate-v1");\n'
              '@import url("../components/flows/doke-product-flows.css?v=20260723-quality-gate-v1");\n', 1))

          edit('assets/css/pages/search-results-runtime-platform.css', lambda s: s.replace(
              '@import url("../components/shell/responsive-boundary.css?v=20260710-integration-contract-v1");\n',
              '@import url("../components/shell/responsive-boundary.css?v=20260710-integration-contract-v1");\n'
              '@import url("../components/shell/mobile-base-stability.css?v=20260723-quality-gate-v1");\n', 1))

          edit('scripts/audit-frontend-contracts.js', lambda s: s
              .replace("  'comunidade.html',\n  'comunidade.html',", "  'comunidade.html',")
              .replace("const requiredUiCss = 'assets/css/components/ui/doke-ui-system.css';", "const requiredUiCss = 'assets/css/components/ui/doke-ui-system.css';\nconst criticalDocumentPreloaderCss = 'assets/css/components/feedback/document-preloader.css';")
              .replace("const expectedLinks = ['assets/css/core/index.css', 'assets/css/pages/app-shell.css', pageManifest];", "const expectedLinks = [criticalDocumentPreloaderCss, 'assets/css/core/index.css', 'assets/css/pages/app-shell.css', pageManifest];")
              .replace('Deve carregar somente os CSS base e o manifesto da pÃ¡gina', 'Deve carregar somente o preloader crítico, os CSS base e o manifesto da página'))

          def update_domain_cards(s):
              s = s.replace("const path = require('path');", "const path = require('path');\nconst { getLoadedCssAssets } = require('./lib/css-assets');")
              s = s.replace("  'index.html','resultados.html','pedidos.html','mensagens.html','comunidade.html',\n  'comunidade.html','perfil.html'", "  'index.html','resultados.html','pedidos.html','mensagens.html','comunidade.html',\n  'perfil.html'")
              s = s.replace("'doke-overlay'];", "'doke-overlay','command-summary','form-page-card'];")
              s, count = re.subn(r"function stripQuery\(value\) \{.*?\n\}\n\n", "function cssGraphLoads(html, targetPath) {\n  return getLoadedCssAssets(html, root).includes(targetPath);\n}\n\n", s, count=1, flags=re.S)
              if count != 1: raise SystemExit('domain-card CSS resolver replacement failed')
              return s
          edit('scripts/audit-domain-card-contracts.js', update_domain_cards)

          def update_flows(s):
              s = s.replace("const path = require('path');", "const path = require('path');\nconst { getLoadedCssAssets } = require('./lib/css-assets');")
              s = s.replace("  'comunidade.html',\n  'comunidade.html',", "  'comunidade.html',")
              s, count = re.subn(r"function stripQuery\(value\) \{.*?\n\}\n\n", "function cssGraphLoads(html, targetPath) {\n  return getLoadedCssAssets(html, root).includes(targetPath);\n}\n\n", s, count=1, flags=re.S)
              if count != 1: raise SystemExit('flow CSS resolver replacement failed')
              return s
          edit('scripts/audit-product-flow-contracts.js', update_flows)

          edit('scripts/audit-page-route-map.js', lambda s: s.replace(
              "  { file: 'comunidade.html', flow: 'doke-community-flow' },\n  { file: 'comunidade.html', flow: 'doke-community-flow' },",
              "  { file: 'comunidade.html', flow: 'doke-community-flow' },"))

          edit('scripts/audit-mock-data-contracts.js', lambda s: s
              .replace("  { file: 'mock-users.json', type: 'array', required: ['id', 'type', 'name'] },\n  { file: 'mock-services.json', type: 'array', required: ['id', 'professionalId', 'title', 'category', 'priceMode'] },", "  { file: 'mock-users.json', type: 'array', required: ['id', 'type', 'name'], allowEmpty: true },\n  { file: 'mock-services.json', type: 'array', required: ['id', 'professionalId', 'title', 'category', 'priceMode'], allowEmpty: true },")
              .replace("if (parsed.length === 0) issues.push(`${contract.file}: array vazio`);", "if (parsed.length === 0 && !contract.allowEmpty) issues.push(`${contract.file}: array vazio`);"))

          def update_domain_services(s):
              s = s.replace("  'comunidade.html',\n  'comunidade.html',", "  'comunidade.html',")
              start = s.index('for (const page of pages) {', s.index('const controllerData'))
              end = s.index('\nif (errors.length) {', start)
              loop = '''const mockDataService = 'assets/js/services/mock-data-service.js';
          const domainDataService = 'assets/js/services/domain-data-service.js';
          const controllerDataService = 'assets/js/controllers/controller-data.js';
          const requiredByPage = {
            'index.html': [mockDataService, 'assets/js/services/search-service.js', 'assets/js/services/notification-service.js', domainDataService, controllerDataService],
            'resultados.html': [mockDataService, 'assets/js/services/profile-service.js', 'assets/js/services/search-service.js', domainDataService, controllerDataService],
            'pedidos.html': [mockDataService, 'assets/js/services/order-service.js', domainDataService, controllerDataService],
            'mensagens.html': [mockDataService, 'assets/js/services/message-service.js', domainDataService, controllerDataService],
            'comunidade.html': [mockDataService, 'assets/js/services/community-service.js', domainDataService, controllerDataService],
            'perfil.html': [mockDataService, 'assets/js/services/profile-service.js', domainDataService, controllerDataService],
            'carteira.html': [mockDataService, 'assets/js/services/wallet-service.js', domainDataService, controllerDataService],
            'notificacoes.html': [mockDataService, 'assets/js/services/notification-service.js', domainDataService, controllerDataService],
            'configuracoes.html': [mockDataService, 'assets/js/services/profile-service.js', domainDataService, controllerDataService],
          };
          const canonicalOrder = [mockDataService].concat(serviceFiles, [controllerDataService]);

          for (const page of pages) {
            const full = path.join(root, page);
            if (!fs.existsSync(full)) { errors.push(`Missing page: ${page}`); continue; }
            const source = fs.readFileSync(full, 'utf8');
            const positions = new Map(canonicalOrder.map((needle) => [needle, source.lastIndexOf(needle)]));
            for (const needle of requiredByPage[page] || []) {
              if ((positions.get(needle) ?? -1) === -1) errors.push(`${page} does not load ${needle}`);
            }
            const domainDataIndex = positions.get(domainDataService);
            const controllerDataIndex = positions.get(controllerDataService);
            const loadedDependencyIndexes = [mockDataService].concat(serviceFiles).map((needle) => positions.get(needle)).filter((index) => index >= 0);
            if (domainDataIndex >= 0 && loadedDependencyIndexes.some((index) => index > domainDataIndex)) errors.push(`${page} loads domain-data-service.js before one of its loaded domain dependencies.`);
            if (controllerDataIndex >= 0 && domainDataIndex >= 0 && controllerDataIndex <= domainDataIndex) errors.push(`${page} loads controller-data.js before domain-data-service.js.`);
          }
          '''
              return s[:start] + loop + s[end:]
          edit('scripts/audit-domain-services.js', update_domain_services)

          def update_responsive(s):
              block = '''const pages = [
            { file: 'index.html', page: 'home', flow: 'doke-search-flow', desktop: ['desktop-shell.css', 'desktop-sidebar.css', 'desktop-topbar.css', 'desktop-search.css', 'desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'resultados.html', page: 'resultados', flow: 'doke-search-flow', desktop: ['desktop-base-stability.css', 'desktop-envelope.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'pedidos.html', page: 'pedidos', flow: 'doke-order-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'mensagens.html', page: 'mensagens', flow: 'doke-message-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'comunidade.html', page: 'comunidade', flow: 'doke-community-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'perfil.html', page: 'perfil', flow: 'doke-profile-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'carteira.html', page: 'carteira', flow: 'doke-wallet-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'notificacoes.html', page: 'notificacoes', flow: 'doke-settings-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] },
            { file: 'configuracoes.html', page: 'configuracoes', flow: 'doke-settings-flow', desktop: ['desktop-base-stability.css'], mobile: ['mobile-base-stability.css'] }
          ];'''
              result, count = re.subn(r'const pages = \[.*?\n\];', block, s, count=1, flags=re.S)
              if count != 1: raise SystemExit('responsive pages replacement failed')
              return result
          edit('scripts/audit-responsive-inventory.js', update_responsive)

          edit('scripts/audit-quality-pipeline.js', lambda s: s.replace(
              "  'docs/QUALITY-GATES.md',\n  'docs/STAGE29-CI-QUALITY-GATES.md',",
              "  'docs/BETA-QUALITY-GATES-RUNBOOK.md',\n  'docs/VALIDATION.md',\n  'docs/ACTIVE-CONTRACTS-INDEX.md',"))
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Visual regression guards
        run: npm run test:visual

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-green-evidence
          path: |
            playwright-report/
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14
