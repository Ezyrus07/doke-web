name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact candidate files
        shell: pwsh
        run: |
          $script = @'
          import base64
          import json
          import zlib
          from pathlib import Path

          payload = ''.join(
              Path(f'.github/quality-patch-parts/part-{index:02d}').read_text(encoding='ascii')
              for index in range(6)
          )
          files = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))
          print(f'Materialized {len(files)} exact candidate files.')
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'materialize-candidate.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python materialize-candidate.py

      - name: Verify candidate diff
        shell: bash
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: E2E smoke
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Visual regression guards
        id: visual
        continue-on-error: true
        run: npm run test:visual

      - name: Persist browser status
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports/generated/quality-patch | Out-Null
          $status = @{
            e2e = '${{ steps.e2e.outcome }}'
            visual = '${{ steps.visual.outcome }}'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'reports/generated/quality-patch/browser-status.json'),
            $status + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-green-evidence
          path: |
            reports/generated/quality-patch/
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce browser results
        if: always() && (steps.e2e.outcome != 'success' || steps.visual.outcome != 'success')
        shell: bash
        run: |
          echo "Browser gates failed: e2e=${{ steps.e2e.outcome }} visual=${{ steps.visual.outcome }}"
          exit 1
