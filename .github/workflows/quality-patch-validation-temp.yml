name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact candidate files
        shell: pwsh
        run: |
          $script = @'
          import base64
          import json
          import zlib
          from pathlib import Path

          payload = Path('.github/quality-patch-payload.b64').read_text(encoding='ascii')
          files = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))

          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          print(f'Materialized {len(files)} exact candidate files.')
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'materialize-candidate.py'),
            $script,
            [System.Text.UTF8Encoding]::new($false)
          )
          python materialize-candidate.py

      - name: Verify candidate diff
        shell: bash
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Blocking E2E lane
        run: npm run test:e2e:ci

      - name: Visual structural guards
        run: npm run test:visual

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-final-evidence
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14
