name: Doke Quality Patch Validation

on:
  pull_request:
    branches: [ MAIN ]

permissions:
  contents: read

concurrency:
  group: doke-quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patch:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact candidate files
        shell: python
        run: |
          import base64
          import json
          import zlib
          from pathlib import Path

          payload = Path('.github/quality-patch-payload.b64').read_text(encoding='ascii')
          files = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          for relative_path, encoded in files.items():
              target = Path(relative_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))
          print(f'Materialized {len(files)} exact candidate files.')

      - name: Verify candidate diff
        shell: bash
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality gates
        run: |
          npm run audit:all
          npm run audit:quality-pipeline

      - name: Install Chromium
        run: npx playwright install chromium

      - name: E2E smoke
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Visual regression guards
        id: visual
        continue-on-error: true
        run: npm run test:visual

      - name: Persist browser status
        if: always()
        shell: python
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          import json
          import os
          from pathlib import Path
          output = Path('reports/generated/quality-patch')
          output.mkdir(parents=True, exist_ok=True)
          status = {
              'e2e': os.environ.get('E2E_OUTCOME', 'unknown'),
              'visual': os.environ.get('VISUAL_OUTCOME', 'unknown'),
          }
          (output / 'browser-status.json').write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-quality-gates-green-evidence
          path: |
            reports/generated/quality-patch/
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
            docs/validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce browser results
        if: always() && (steps.e2e.outcome != 'success' || steps.visual.outcome != 'success')
        shell: bash
        run: |
          echo "Browser gates failed: e2e=${{ steps.e2e.outcome }} visual=${{ steps.visual.outcome }}"
          exit 1
