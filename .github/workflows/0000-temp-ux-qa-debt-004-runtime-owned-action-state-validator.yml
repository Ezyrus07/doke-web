name: TEMP UX-QA-DEBT-004 Runtime-owned Action State Validator

on:
  push:
    branches:
      - diag/ux-qa-debt-004-main-action-state-runtime-owner-candidate

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PARENT: c74ce2990e697fc080cf0aad52ed7b0ca9b8bb07
      PARENT_TREE: 67736d023f2da915219d4b416138d9773a333533
      CANDIDATE: 14bdb1af9cfefff4dfd27a78b937443975266001
      VALIDATOR: scripts/audit-main-action-state-contracts.js
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-qa-debt-004-runtime-owned-action-state-validator.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify diagnostic lineage and one-file QA candidate
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$HEAD_SHA" | awk '{print $2}')" = "$CANDIDATE"
          test "$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")" = "$WORKFLOW_PATH"
          test "$(git rev-list --parents -n1 "$CANDIDATE" | awk '{print $2}')" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          mapfile -t changed < <(git diff --name-only "$PARENT" "$CANDIDATE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$VALIDATOR"
          git diff --check "$PARENT" "$CANDIDATE"
          echo LINEAGE_SCOPE=PASS
          echo PRODUCT_MUTATION=false
          echo MATRIX_MUTATION=false

      - name: Reproduce parent residual exactly
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/qa004-parent "$PARENT" >/dev/null
          (
            cd /tmp/qa004-parent
            node scripts/audit-main-action-state-contracts.js
            node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/validation/global-cycle-138-main-action-state-contracts-report.json'));
          const review = report.pages.filter((page) => page.status !== 'passed');
          if (report.status !== 'passed-with-follow-up') throw new Error(`parent status ${report.status}`);
          if (review.length !== 1 || review[0].file !== 'resultados.html') throw new Error(`parent review ${JSON.stringify(review)}`);
          if (review[0].actionStates !== 5 || review[0].loadingLabels !== 4) throw new Error(`parent resultados counts ${JSON.stringify(review[0])}`);
          console.log('PARENT_RESIDUAL=PASS resultados=5/4');
          NODE
          )

      - name: Qualify candidate semantics
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/qa004-candidate "$CANDIDATE" >/dev/null
          (
            cd /tmp/qa004-candidate
            node --check scripts/audit-main-action-state-contracts.js
            node scripts/audit-main-action-state-contracts.js
            node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/validation/global-cycle-138-main-action-state-contracts-report.json'));
          if (report.status !== 'passed' || report.reviewPages !== 0) throw new Error(`candidate report ${report.status}/${report.reviewPages}`);
          const resultados = report.pages.find((page) => page.file === 'resultados.html');
          if (!resultados) throw new Error('resultados missing');
          const expected = { actionStates: 5, loadingLabels: 4, runtimeOwnedActions: 1, accountedActions: 5, unaccountedActions: 0, status: 'passed' };
          for (const [key, value] of Object.entries(expected)) {
            if (resultados[key] !== value) throw new Error(`resultados ${key}=${resultados[key]} expected=${value}`);
          }
          const foreignRuntimeOwners = report.pages.filter((page) => page.file !== 'resultados.html' && page.runtimeOwnedActions !== 0);
          if (foreignRuntimeOwners.length) throw new Error(`unexpected runtime owners ${JSON.stringify(foreignRuntimeOwners)}`);
          if (report.pages.some((page) => page.unaccountedActions !== 0)) throw new Error('unaccounted action remains');
          console.log('CANDIDATE_SEMANTICS=PASS runtimeOwned=1 criteriaRelaxed=0');
          NODE
          )

      - name: Negative fixture action-state transition
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/qa004-candidate /tmp/qa004-negative-action
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/qa004-negative-action/assets/js/pages/search/server-results-surface.js')
          s = p.read_text()
          old = "button.dataset.actionState = loading ? 'loading' : 'idle';"
          if s.count(old) != 1:
              raise SystemExit('negative action-state source drift')
          p.write_text(s.replace(old, "button.dataset.actionState = 'idle';", 1))
          PY
          (
            cd /tmp/qa004-negative-action
            node scripts/audit-main-action-state-contracts.js
            node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/validation/global-cycle-138-main-action-state-contracts-report.json'));
          const resultados = report.pages.find((page) => page.file === 'resultados.html');
          if (!resultados || resultados.status !== 'review' || resultados.runtimeOwnedActions !== 0 || resultados.unaccountedActions !== 1) {
            throw new Error(`negative action-state not detected ${JSON.stringify(resultados)}`);
          }
          console.log('NEGATIVE_ACTION_STATE=PASS');
          NODE
          )

      - name: Negative fixture aria-busy transition
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/qa004-candidate /tmp/qa004-negative-busy
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/qa004-negative-busy/assets/js/pages/search/server-results-surface.js')
          s = p.read_text()
          old = "button.setAttribute('aria-busy', loading ? 'true' : 'false');"
          if s.count(old) != 1:
              raise SystemExit('negative aria-busy source drift')
          p.write_text(s.replace(old, "button.setAttribute('aria-busy', 'false');", 1))
          PY
          (
            cd /tmp/qa004-negative-busy
            node scripts/audit-main-action-state-contracts.js
            node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/validation/global-cycle-138-main-action-state-contracts-report.json'));
          const resultados = report.pages.find((page) => page.file === 'resultados.html');
          if (!resultados || resultados.status !== 'review' || resultados.runtimeOwnedActions !== 0 || resultados.unaccountedActions !== 1) {
            throw new Error(`negative aria-busy not detected ${JSON.stringify(resultados)}`);
          }
          console.log('NEGATIVE_ARIA_BUSY=PASS');
          NODE
          )

      - name: Negative fixture visible feedback transition
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/qa004-candidate /tmp/qa004-negative-text
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/qa004-negative-text/assets/js/pages/search/server-results-surface.js')
          s = p.read_text()
          old = "button.textContent = loading ? 'Carregando mais...' : 'Carregar mais';"
          if s.count(old) != 1:
              raise SystemExit('negative text source drift')
          p.write_text(s.replace(old, "button.textContent = 'Carregar mais';", 1))
          PY
          (
            cd /tmp/qa004-negative-text
            node scripts/audit-main-action-state-contracts.js
            node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/validation/global-cycle-138-main-action-state-contracts-report.json'));
          const resultados = report.pages.find((page) => page.file === 'resultados.html');
          if (!resultados || resultados.status !== 'review' || resultados.runtimeOwnedActions !== 0 || resultados.unaccountedActions !== 1) {
            throw new Error(`negative text not detected ${JSON.stringify(resultados)}`);
          }
          console.log('NEGATIVE_VISIBLE_FEEDBACK=PASS');
          NODE
          )

      - name: Reconcile state chain Matrix and governance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/qa004-candidate
          npm run audit:critical-states
          npm run audit:main-marketplace-state-contracts
          npm run audit:main-support-state-contracts
          npm run audit:main-action-state-contracts
          npm run audit:main-state-runtime-coverage
          npm run audit:global-state-completion-gate
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('docs/validation/global-cycle-138-main-action-state-contracts-report.json'));
          const b = JSON.parse(fs.readFileSync('docs/validation/global-cycle-139-main-state-runtime-coverage-report.json'));
          const c = JSON.parse(fs.readFileSync('docs/validation/global-cycle-140-global-state-completion-gate-report.json'));
          const review = a.pages.filter((page) => page.status !== 'passed');
          const failed = Array.isArray(c.failedReports) ? c.failedReports : [];
          if (a.status !== 'passed' || review.length !== 0) throw new Error(`cycle138 ${a.status}/${JSON.stringify(review)}`);
          if (b.status !== 'passed' || b.checkedPages !== 12 || b.failedPages !== 0) throw new Error(`cycle139 ${JSON.stringify(b)}`);
          if (failed.length !== 0) throw new Error(`cycle140 failedReports ${JSON.stringify(failed)}`);
          console.log('STATE_CHAIN=PASS ' + JSON.stringify({cycle138:a.status,reviewPages:review.length,cycle139:b.status,checkedPages:b.checkedPages,failedPages:b.failedPages,cycle140:c.status,failedReports:failed.length}));
          NODE
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          echo MATRIX_GOVERNANCE=PASS
          echo INTRODUCED_REGRESSIONS=0
          echo CRITERIA_RELAXED=0

      - name: Final diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          echo 'UX_QA_DEBT_004_DIAGNOSTIC={"result":"PASS","checkpoint":"UX-QA-DEBT-004","parent":"c74ce2990e697fc080cf0aad52ed7b0ca9b8bb07","candidate":"14bdb1af9cfefff4dfd27a78b937443975266001","qaFiles":1,"productMutation":false,"matrixMutation":false,"negativeFixtures":3,"criteriaRelaxed":0,"introducedRegressions":0,"repositoryOnly":true}'
