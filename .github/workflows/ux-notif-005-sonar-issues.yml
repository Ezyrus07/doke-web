name: UX-NOTIF-005 Sonar Issue Inspect

on:
  push:
    branches:
      - ux/ux-notif-005-inbox-reconciliation
    paths:
      - '.github/workflows/ux-notif-005-sonar-issues.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query SonarQube Cloud PR issues
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SONAR_TOKEN}"
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=Ezyrus07_doke-web' \
            --data-urlencode 'pullRequest=100' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
          | jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, cleanCodeAttribute, impacts}]}'
