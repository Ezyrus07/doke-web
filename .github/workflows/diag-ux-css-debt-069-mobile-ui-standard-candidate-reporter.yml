name: Doke UX-CSS-DEBT-069 Candidate Reporter

on:
  push:
    branches:
      - diag/ux-css-debt-069-mobile-ui-standard-candidate

permissions:
  contents: write

jobs:
  reporter:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 23cc5c7496897f0d9b742039598574ffb2b93dfb
      PARENT_SHA: c7f8397821698f4445dad3b20e5aea2ff3d57cf3
      TARGET_TREE: e65769efff06273415f71640b5e764465046ccc5
      TARGET_FILE: assets/css/core/mobile/ui-standard.css
      TARGET_BLOB: 37f9675d63c11a81974f26cb6b931333f43d95e0
      IMPORTER_FILE: assets/css/core/mobile-ui-standard.css
      IMPORTER_BLOB: 613092a594e02fe1c50b5d12393a77edf2904d11
      EXPECTED_SHA256: a472a7ba05a72eb8823ddfdd88a651daad77dcb610d66714fc6796f6853795c6
      EXPECTED_BYTES: 7358
      DIAG_BRANCH: diag/ux-css-debt-069-mobile-ui-standard-candidate
      RESULT_FILE: .diagnostics/ux-css-debt-069-candidate-reporter.txt
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-068 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Run fail-closed candidate validation and publish receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          : > /tmp/evidence.txt
          echo "RUN_ID=$GITHUB_RUN_ID" >> /tmp/evidence.txt
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" >> /tmp/evidence.txt
          echo "WORKFLOW_SHA=$GITHUB_SHA" >> /tmp/evidence.txt
          echo "TARGET_SHA=$TARGET_SHA" >> /tmp/evidence.txt
          CURRENT_GATE=bootstrap

          publish() {
            code="$1"
            trap - ERR
            set +e
            echo "FINAL_EXIT_CODE=$code" >> /tmp/evidence.txt
            if [ "$code" -eq 0 ]; then echo "RESULT=PASS" >> /tmp/evidence.txt; else echo "RESULT=FAIL" >> /tmp/evidence.txt; fi
            echo "LAST_GATE=$CURRENT_GATE" >> /tmp/evidence.txt
            git reset --hard "$TARGET_SHA" >/dev/null 2>&1
            git clean -fdx >/dev/null 2>&1
            git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null 2>&1
            git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null 2>&1
            mkdir -p "$(dirname "$RESULT_FILE")"
            cp /tmp/evidence.txt "$RESULT_FILE"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$RESULT_FILE"
            if ! git diff --cached --quiet; then
              git commit -m "diag: record UX-CSS-DEBT-069 candidate reporter [skip ci]" >/dev/null 2>&1
              git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null 2>&1
            fi
            exit "$code"
          }
          trap 'code=$?; echo "ERROR_GATE=$CURRENT_GATE" >> /tmp/evidence.txt; publish "$code"' ERR

          CURRENT_GATE=identity
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER_FILE")" = "$IMPORTER_BLOB"
          echo "IDENTITY=PASS" >> /tmp/evidence.txt

          CURRENT_GATE=install
          npm ci --ignore-scripts >/tmp/npm-ci.log 2>&1
          echo "INSTALL=PASS" >> /tmp/evidence.txt

          CURRENT_GATE=parent-baseline
          npm run audit:active-legacy-structures >/tmp/active.log 2>&1
          grep -q -- '- css files: 533 (55 direct, 401 active/imported)' /tmp/active.log
          grep -q -- '- high risk active css: 37' /tmp/active.log
          node scripts/generate-responsive-index-baseline.js >/tmp/baseline.log 2>&1
          test -s reports/responsive-index-baseline.json
          cp reports/responsive-index-baseline.json /tmp/ux069-responsive-index-baseline.json
          echo "PARENT_BASELINE=401/37/6/41/0" >> /tmp/evidence.txt

          CURRENT_GATE=candidate-identity
          node <<'NODE' >/tmp/candidate.log
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE,ls=fs.readFileSync(f,'utf8').split('\n');if((ls[3]||'').replace(/\r$/,'')!=='    --doke-mobile-card-radius: 22px;')throw new Error('source row drift');const out=ls.filter((_,i)=>i!==3).join('\n');fs.writeFileSync(f,out);const b=fs.readFileSync(f),h=crypto.createHash('sha256').update(b).digest('hex');if(h!==process.env.EXPECTED_SHA256||b.length!==Number(process.env.EXPECTED_BYTES))throw new Error(`${h}/${b.length}`);console.log(`sha256=${h}|bytes=${b.length}`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          git diff --quiet "$TARGET_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          git diff --check
          cat /tmp/candidate.log >> /tmp/evidence.txt
          echo "CANDIDATE=76/0|DIFF=1/+0/-1" >> /tmp/evidence.txt

          CURRENT_GATE=responsive
          cp /tmp/ux069-responsive-index-baseline.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js >/tmp/responsive.log 2>&1
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo "RESPONSIVE=893/0/277" >> /tmp/evidence.txt

          CURRENT_GATE=governance
          npm run audit:agent-governance >/tmp/governance.log 2>&1
          node scripts/audit-css-responsive-conflicts.js >/tmp/conflicts.log 2>&1
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract >/tmp/header.log 2>&1
          npm run audit:mobile-shell-location-contract >/tmp/mobile-shell.log 2>&1
          npm run audit:responsive-boundaries >/tmp/boundaries.log 2>&1
          npm run audit:duplicate-assets >/tmp/dup.log 2>&1
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix >/tmp/domain.log 2>&1
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          echo "GOVERNANCE=PASS|CONFLICTS=339|DUPLICATES=0/0|DOMAIN=23/15/2.91/12" >> /tmp/evidence.txt

          CURRENT_GATE=residual
          node <<'NODE' >/tmp/residual.log
          const fs=require('fs'),path=require('path'),cp=require('child_process');const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length})}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function dc(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0,pageResidual=0;for(const f of active){const p=dc(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++;if(f.includes('/pages/'))pageResidual++}}const q=dc(meta.get(process.env.TARGET_FILE).text);if(q.decl!==76||q.dead!==0)throw new Error(`target ${q.decl}/${q.dead}`);if(files!==5||total!==40||highDead!==0||pageResidual!==0)throw new Error(`residual ${files}/${total}/${highDead}/${pageResidual}`);console.log('RESIDUAL=5/40/0|PAGE_RESIDUAL=0|TARGET=76/0|ACTIVE=401|HIGH=37');
          NODE
          cat /tmp/residual.log >> /tmp/evidence.txt

          CURRENT_GATE=dependencies
          set +e
          npm audit --json >/tmp/audit.json
          audit_code=$?
          set -e
          node <<'NODE' >/tmp/deps.log
          const a=require('/tmp/audit.json'),v=a.metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);console.log('DEPENDENCIES=13/0/10/1/2');
          NODE
          cat /tmp/deps.log >> /tmp/evidence.txt
          echo "NPM_AUDIT_EXIT=$audit_code" >> /tmp/evidence.txt

          CURRENT_GATE=complete
          echo "STATIC_PROOF=PASS|BROWSER_REQUIRED=0" >> /tmp/evidence.txt
          publish 0
