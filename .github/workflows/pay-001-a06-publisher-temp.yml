name: Doke PAY-A06 Publisher Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/pay-001-a06-publisher-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Materialize PAY-A06 payload
        run: |
          test "$(find .pay-a06-payload -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 7
          cat .pay-a06-payload/part-* > /tmp/pay-a06-payload.b64
          test "$(wc -c < /tmp/pay-a06-payload.b64)" -eq 20288
          printf '%s  %s\n' '65b03f8ace3472fa79eff812d8f9259368098ee86007f157573ecbdcc6067a53' '/tmp/pay-a06-payload.b64' | sha256sum --check --strict
          base64 --decode /tmp/pay-a06-payload.b64 > /tmp/pay-a06-payload.tar.gz
          printf '%s  %s\n' '15fd9382eccc80ab51917727805888ec8daea03c626d370d519d9f7ceb3d6482' '/tmp/pay-a06-payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/pay-a06-payload.tar.gz -C .
          python - <<'PYFIX'
          from pathlib import Path
          path = Path('scripts/audit-pay-001-a05-adapter-conformance-readiness.js')
          lines = path.read_text().splitlines()
          rows = [index for index, line in enumerate(lines) if "const ADAPTER_CONTRACT_VERSION = 'pay-provider-adapter-v1'" in line]
          if len(rows) != 2:
              raise SystemExit(f'Unexpected adapter contract assertions: {rows}')
          lines[rows[1]] = lines[rows[1]].replace('ADAPTER_CONTRACT_VERSION', 'CONTRACT_VERSION')
          lines = [line for line in lines if 'DOKE_FINANCIAL_SERVER_AUTHORITY_REQUIRED' not in line]
          path.write_text('\n'.join(lines) + '\n')

          contract_audit = Path('scripts/audit-pay-001-a05-adapter-contract.js')
          content = contract_audit.read_text()
          if 'isNumericSemanticVersionAtLeast' not in content:
              content = content.replace(
                  "const path = require('node:path');\n",
                  "const path = require('node:path');\nconst { isNumericSemanticVersionAtLeast } = require('./lib/semantic-version');\n"
              )
          content = content.replace(
              "assert(matrix.version === '1.3.90', 'matrix must remain 1.3.90 for A05 hardening');",
              "assert(isNumericSemanticVersionAtLeast(matrix.version, '1.3.90'), 'matrix must remain at least 1.3.90 after A05 hardening');"
          )
          contract_audit.write_text(content)

          docs = Path('docs/PAY-001-A06-PROVIDER-SELECTION-LEGAL-HANDOFF.md')
          content = docs.read_text()
          marker = '`repository_only_decision_handoff_ready_provider_unselected_staging_blocked`\n'
          statement = '\nEm termos operacionais, PAY-A06 não seleciona nenhum PSP e não autoriza qualquer efeito remoto.\n'
          if statement.strip() not in content:
              if marker not in content:
                  raise SystemExit('PAY-A06 documentation status marker missing')
              content = content.replace(marker, marker + statement, 1)
          docs.write_text(content)
          PYFIX
          node scripts/prepare-pay-001-a06-matrix-temp.js
      - name: Remove temporary payload only
        run: |
          rm -rf .pay-a06-payload
          rm -f scripts/prepare-pay-001-a06-matrix-temp.js
          test -e .github/workflows/pay-001-a06-publisher-temp.yml
          test -e .github/workflows/pay-001-a06-provider-selection-legal-handoff.yml
      - name: Generate canonical derivatives
        run: npm run write:domain-completion-matrix
      - name: Validate cumulative PAY and stacked MSG contracts
        run: |
          node --check backend/modules/payments/payment-provider-selection-handoff.js
          node --check scripts/audit-pay-001-a06-provider-selection-legal-handoff.js
          node --check scripts/test-pay-001-a06-provider-selection-legal-handoff.js
          node --check scripts/audit-pay-001-a05-adapter-conformance-readiness.js
          node --check scripts/audit-pay-001-a05-adapter-contract.js
          node --check scripts/lib/semantic-version.js
          node --check scripts/test-semantic-version.js
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run audit:pay-001-a05-adapter-conformance-readiness
          npm run test:pay-001-a05-adapter-conformance-readiness
          node scripts/audit-pay-001-a05-adapter-contract.js
          node scripts/test-pay-001-a05-adapter-contract.js
          npm run audit:pay-001-a06-provider-selection-legal-handoff
          npm run test:pay-001-a06-provider-selection-legal-handoff
          node scripts/test-semantic-version.js
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Verify closed non-workflow change boundary
        run: |
          test ! -e .pay-a06-payload
          test ! -e scripts/prepare-pay-001-a06-matrix-temp.js
          test -e .github/workflows/pay-001-a06-publisher-temp.yml
          test -z "$(git diff --name-only -- .github/workflows)"
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              .pay-a06-payload/part-00|\
              .pay-a06-payload/part-01|\
              .pay-a06-payload/part-02|\
              .pay-a06-payload/part-03|\
              .pay-a06-payload/part-04|\
              .pay-a06-payload/part-05|\
              .pay-a06-payload/part-06|\
              backend/modules/payments/payment-provider-selection-handoff.js|\
              config/pay-001-a06-provider-selection-legal-handoff.json|\
              docs/PAY-001-A06-PROVIDER-SELECTION-LEGAL-HANDOFF.md|\
              docs/validation/PAY-001-A06-PROVIDER-SELECTION-LEGAL-HANDOFF.json|\
              scripts/audit-pay-001-a06-provider-selection-legal-handoff.js|\
              scripts/test-pay-001-a06-provider-selection-legal-handoff.js|\
              scripts/audit-pay-001-a05-adapter-conformance-readiness.js|\
              scripts/audit-pay-001-a05-adapter-contract.js|\
              package.json|\
              config/domain-completion-matrix.json|\
              docs/DOMAIN-COMPLETION-MATRIX.md|\
              reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected changed path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          node -e "const m=require('./config/domain-completion-matrix.json'); if(m.version!=='1.3.91') process.exit(1)"
          git fetch origin pay/pay-001-baseline-audit
          test "$(git rev-parse origin/pay/pay-001-baseline-audit)" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish non-workflow PAY-A06 artifacts
        run: |
          git config user.name 'doke-pay-a06-bot'
          git config user.email 'doke-pay-a06-bot@users.noreply.github.com'
          git add -A -- \
            .pay-a06-payload \
            backend/modules/payments/payment-provider-selection-handoff.js \
            config/pay-001-a06-provider-selection-legal-handoff.json \
            docs/PAY-001-A06-PROVIDER-SELECTION-LEGAL-HANDOFF.md \
            scripts/audit-pay-001-a06-provider-selection-legal-handoff.js \
            scripts/test-pay-001-a06-provider-selection-legal-handoff.js \
            scripts/audit-pay-001-a05-adapter-conformance-readiness.js \
            scripts/audit-pay-001-a05-adapter-contract.js \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- \
            docs/validation/PAY-001-A06-PROVIDER-SELECTION-LEGAL-HANDOFF.json \
            reports/generated/domain-completion-matrix-report.json
          git commit -m 'Implement PAY-A06 provider decision handoff'
          git push origin HEAD:pay/pay-001-baseline-audit
