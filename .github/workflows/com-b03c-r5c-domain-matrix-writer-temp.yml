name: COM-B03C-R5C Domain Matrix Reconciler

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5c-domain-matrix-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r5c-domain-matrix-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: d5f1eb59a4bb716562ad5c9dbdd7114282489986
  R5B_CERTIFIED_ISSUER_HEAD: 6a16670f666f639099412b6531bd3c311ac571fa
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r5c-domain-matrix-writer-temp.yml
  RECEIPT_PATH: config/com-b03c-r5b-r5a-fresh-authorization-consumption.json
  TRIGGER_PATH: config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fail-closed writer installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate R5C repository-only state
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RECEIPT_PATH}"
          test ! -e "${TRIGGER_PATH}"
          test "$(git rev-parse HEAD:${RECEIPT_PATH})" = "a2ed29dc6a44f9d62f5159dfeabd2c769f677b50"
          test "$(git rev-parse HEAD:scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js)" = "ff083f29e43b2f85045b23bf8f12a4b354fb0005"
          node --check backend/modules/communities/community-realtime-private-auth-r5c.js
          node --check scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
          node scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
          node - <<'NODE'
          const r5c = require('./backend/modules/communities/community-realtime-private-auth-r5c');
          try {
            r5c.assertRemoteExecutionBoundaryAbsent();
            process.exit(1);
          } catch (error) {
            if (error?.code !== r5c.REMOTE_EXECUTION_BLOCK_CODE) throw error;
          }
          NODE
      - name: Preserve R5C materialization and workflow fix
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "${EXPECTED_PARENT}" HEAD -- \
            backend/modules/communities/community-realtime-private-auth-r5c.js \
            config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.json \
            scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js \
            docs/validation/COM-B03C-R5C-SINGLE-USE-CORRECTED-TERMINAL-OBSERVATION-TRIGGER-READINESS.json \
            .github/workflows/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.yml)"
      - name: Remove writer before canonical generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"
      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix
      - name: Enforce final reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff HEAD --name-only | sort)"
          printf '%s\n' "${actual}" | grep -qx "${WRITER_PATH}"
          printf '%s\n' "${actual}" | grep -qx "${MATRIX_MD}"
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}"|"${MATRIX_MD}"|"${MATRIX_JSON}") ;;
              *) echo "unauthorized final path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${actual}"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Stage and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${MATRIX_MD}"
          git add -f -- "${MATRIX_JSON}"
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "${staged}" | grep -qx "${WRITER_PATH}"
          printf '%s\n' "${staged}" | grep -qx "${MATRIX_MD}"
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}"|"${MATRIX_MD}"|"${MATRIX_JSON}") ;;
              *) echo "unauthorized staged path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${staged}"
          git diff --cached --check
      - name: Commit clean reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): reconcile matrix after R5C readiness'
          git push origin "HEAD:${TARGET_BRANCH}"
