name: TEMP COM-B02CX Matrix Candidate Artifact

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/tmp-com-b02cx-matrix-candidate-artifact.yml'

permissions:
  contents: read

jobs:
  generate-b02cx-matrix-candidate-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_HEAD: 0b578cda5aceb45f39d80dcb9e17e1f1827e1eda
      TEMP_WORKFLOW: .github/workflows/tmp-com-b02cx-matrix-candidate-artifact.yml
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_GENERATOR: scripts/audit-domain-completion-matrix.js
      MATRIX_GENERATOR_BLOB: f60d9b9efc8a191822b34d39d4e9137a59b8727e
      PACKAGE_JSON: package.json
      PACKAGE_JSON_BLOB: 8b9670383773896d03410cb661a23e2061911495
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_MD_BLOB: fa97eac621201107e76afc1fb6103b1a65f7925f
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      MATRIX_REPORT_BLOB: a8642aba18f8c8668bf8f017c077334bf5afb459

    steps:
      - name: Checkout exact artifact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze B02CX lineage and artifact-only scope
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"

          actual="$(git diff --name-status "$CANDIDATE_HEAD" HEAD)"
          expected="$(printf 'A\t%s' "$TEMP_WORKFLOW")"
          test "$actual" = "$expected"

          test "$(git rev-parse "HEAD:$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$MATRIX_GENERATOR")" = "$MATRIX_GENERATOR_BLOB"
          test "$(git rev-parse "HEAD:$PACKAGE_JSON")" = "$PACKAGE_JSON_BLOB"
          test "$(git rev-parse "HEAD:$MATRIX_MD")" = "$MATRIX_MD_BLOB"
          test "$(git rev-parse "HEAD:$MATRIX_REPORT")" = "$MATRIX_REPORT_BLOB"

          git diff --check "$CANDIDATE_HEAD" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Generate canonical Matrix derivatives locally
        shell: bash
        run: |
          set -euo pipefail

          npm run write:domain-completion-matrix

          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test "$(git hash-object "$MATRIX_GENERATOR")" = "$MATRIX_GENERATOR_BLOB"
          test "$(git hash-object "$PACKAGE_JSON")" = "$PACKAGE_JSON_BLOB"

          actual_generated="$(git diff --name-only | sort)"
          test -n "$actual_generated"

          for path in $actual_generated; do
            case "$path" in
              "$MATRIX_MD"|"$MATRIX_REPORT") ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Validate generated Matrix candidate
        shell: bash
        run: |
          set -euo pipefail

          npm run audit:domain-completion-matrix
          git diff --check -- "$MATRIX_MD" "$MATRIX_REPORT"

          actual_generated="$(git diff --name-only | sort)"
          test -n "$actual_generated"
          for path in $actual_generated; do
            case "$path" in
              "$MATRIX_MD"|"$MATRIX_REPORT") ;;
              *) echo "Unexpected path after validation: $path" >&2; exit 1 ;;
            esac
          done

          printf 'BASE_HEAD=%s\n' "$CANDIDATE_HEAD"
          printf 'ARTIFACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'MARKDOWN_BLOB=%s\n' "$(git hash-object "$MATRIX_MD")"
          printf 'REPORT_BLOB=%s\n' "$(git hash-object "$MATRIX_REPORT")"

      - name: Upload B02CX Matrix candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: com-b02cx-domain-completion-matrix-candidate-${{ github.sha }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 7
