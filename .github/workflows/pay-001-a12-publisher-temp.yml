name: Doke PAY-A12 Publisher Temporary

on:
  pull_request:
    paths:
      - '.pay-a12-bootstrap/chunk-*.b64'
      - '.github/workflows/pay-001-a12-publisher-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reassemble and verify PAY-A12 payload
        run: |
          cat .pay-a12-bootstrap/chunk-*.b64 | LC_ALL=C tr -cd 'A-Za-z0-9+/=' > /tmp/pay-a12.b64
          actual_b64="$(sha256sum /tmp/pay-a12.b64 | awk '{print $1}')"
          echo "PAY-A12 normalized base64 SHA-256: $actual_b64"
          test "$actual_b64" = "1debb8651e5731e40378ce79bc2db3807a056b89df3dc79c5402baf42e74701b"
          base64 -d /tmp/pay-a12.b64 > /tmp/pay-a12.tar.gz
          actual_gzip="$(sha256sum /tmp/pay-a12.tar.gz | awk '{print $1}')"
          echo "PAY-A12 gzip SHA-256: $actual_gzip"
          test "$actual_gzip" = "5fac75fa321fe51c74ec48afeec103ca6d5a1e48e5f358fca72743bba7ef3171"
          gzip -dc /tmp/pay-a12.tar.gz | tar -xf -
      - name: Apply PAY-A12 repository metadata
        run: |
          node scripts/apply-pay-001-a12-repository-metadata.js
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'scripts/audit-pay-001-a06-provider-selection-legal-handoff.js': [
              ('["PAY-A08","PAY-A09","PAY-A10","PAY-A11","PAY-A12"]', '["PAY-A08","PAY-A09","PAY-A10","PAY-A11","PAY-A12","PAY-A13"]')
            ],
            'scripts/audit-pay-001-a07-reconciliation-operations-readiness.js': [
              ('["PAY-A09","PAY-A10","PAY-A11","PAY-A12"]', '["PAY-A09","PAY-A10","PAY-A11","PAY-A12","PAY-A13"]')
            ],
            'scripts/audit-pay-001-a08-immutable-migrations-read-only-canary.js': [
              ('["PAY-A09","PAY-A10","PAY-A11","PAY-A12"]', '["PAY-A09","PAY-A10","PAY-A11","PAY-A12","PAY-A13"]')
            ],
            'scripts/audit-pay-001-a09-deployment-inspection-handoff.js': [
              ('["PAY-A10","PAY-A11","PAY-A12"]', '["PAY-A10","PAY-A11","PAY-A12","PAY-A13"]')
            ],
            'scripts/audit-pay-001-a10-external-executor-evidence-ingestion.js': [
              ("assert(pay.nextActions[0].includes('PAY-A12'), 'PAY-A12 must be the first next action');", "assert(pay.nextActions[0].includes('PAY-A13'), 'PAY-A13 must be the first next action');")
            ]
          }
          for file, pairs in replacements.items():
            path = Path(file)
            source = path.read_text(encoding='utf-8')
            for old, new in pairs:
              assert old in source, f'missing expected guard in {file}'
              source = source.replace(old, new)
            path.write_text(source, encoding='utf-8')
          PY
          npm run write:domain-completion-matrix
          rm -f .pay-a12-bootstrap/chunk-*.b64
          rm -f scripts/apply-pay-001-a12-repository-metadata.js
          rm -f .github/workflows/pay-001-a12-publisher-temp.yml
          rmdir .pay-a12-bootstrap 2>/dev/null || true
      - name: Validate PAY-A12 and cumulative boundaries
        run: |
          node --check backend/modules/payments/payment-reconciliation-executor-trust.js
          node --check scripts/audit-pay-001-a12-executor-trust-root-signature.js
          node --check scripts/test-pay-001-a12-executor-trust-root-signature.js
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run audit:pay-001-a03-psp-neutral-intent-webhook
          npm run test:pay-001-a03-psp-neutral-intent-webhook
          npm run audit:pay-001-a04-reconciliation-queue
          npm run test:pay-001-a04-reconciliation-queue
          npm run audit:pay-001-a05-adapter-conformance-readiness
          npm run test:pay-001-a05-adapter-conformance-readiness
          npm run audit:pay-001-a06-provider-selection-legal-handoff
          npm run test:pay-001-a06-provider-selection-legal-handoff
          npm run audit:pay-001-a07-reconciliation-operations-readiness
          npm run test:pay-001-a07-reconciliation-operations-readiness
          npm run audit:pay-001-a08-immutable-migrations-read-only-canary
          npm run test:pay-001-a08-immutable-migrations-read-only-canary
          npm run audit:pay-001-a09-deployment-inspection-handoff
          npm run test:pay-001-a09-deployment-inspection-handoff
          npm run audit:pay-001-a10-external-executor-evidence-ingestion
          npm run test:pay-001-a10-external-executor-evidence-ingestion
          npm run audit:pay-001-a11-executor-protocol-conformance
          npm run test:pay-001-a11-executor-protocol-conformance
          npm run audit:pay-001-a12-executor-trust-root-signature
          npm run test:pay-001-a12-executor-trust-root-signature
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Verify bounded changes
        run: |
          changed="$(git status --short --untracked-files=all | sed -E 's/^.. //' | sort)"
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              backend/modules/payments/payment-reconciliation-executor-trust.js) ;;
              config/pay-001-a12-executor-trust-root-signature.json) ;;
              tests/fixtures/pay-a12-executor-trust-root-cases.json) ;;
              docs/PAY-001-A12-EXECUTOR-TRUST-ROOT-SIGNATURE.md) ;;
              docs/validation/PAY-001-A12-EXECUTOR-TRUST-ROOT-SIGNATURE.json) ;;
              scripts/audit-pay-001-a12-executor-trust-root-signature.js) ;;
              scripts/test-pay-001-a12-executor-trust-root-signature.js) ;;
              scripts/audit-pay-001-a06-provider-selection-legal-handoff.js) ;;
              scripts/audit-pay-001-a07-reconciliation-operations-readiness.js) ;;
              scripts/audit-pay-001-a08-immutable-migrations-read-only-canary.js) ;;
              scripts/audit-pay-001-a09-deployment-inspection-handoff.js) ;;
              scripts/audit-pay-001-a10-external-executor-evidence-ingestion.js) ;;
              scripts/audit-pay-001-a11-executor-protocol-conformance.js) ;;
              package.json) ;;
              config/domain-completion-matrix.json) ;;
              config/pay-001-a11-executor-protocol-conformance.json) ;;
              docs/DOMAIN-COMPLETION-MATRIX.md) ;;
              reports/generated/domain-completion-matrix-report.json) ;;
              .pay-a12-bootstrap/chunk-*.b64) ;;
              scripts/apply-pay-001-a12-repository-metadata.js) ;;
              .github/workflows/pay-001-a12-publisher-temp.yml) ;;
              *) echo "Unexpected PAY-A12 change: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git fetch origin pay/pay-001-baseline-audit
          test "$(git rev-parse origin/pay/pay-001-baseline-audit)" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish PAY-A12
        run: |
          git config user.name 'doke-pay-a12-bot'
          git config user.email 'doke-pay-a12-bot@users.noreply.github.com'
          git add -f docs/validation/PAY-001-A12-EXECUTOR-TRUST-ROOT-SIGNATURE.json
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -A
          git commit -m 'Complete PAY-A12 trust-root signature contracts'
          git push origin HEAD:pay/pay-001-baseline-audit
