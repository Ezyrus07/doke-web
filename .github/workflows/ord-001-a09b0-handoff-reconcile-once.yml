name: ORD-A09B0 Handoff Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a09b0-handoff-reconcile-once.yml'
      - 'config/ord-001-a09b0-provider-selection-handoff.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile handoff registry and matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['audit:ord-001-a09b0-provider-selection-handoff'] = 'node scripts/audit-ord-001-a09b0-provider-selection-handoff.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['version'] = '1.3.25'
          matrix['updatedAt'] = '2026-07-30T10:10:00-03:00'
          ord_domain = next(domain for domain in matrix['domains'] if domain['id'] == 'ORD-001')

          required_paths = [
              'config/ord-001-a09b0-provider-selection-handoff.json',
              'docs/ORD-001-A09B0-PROVIDER-SELECTION-HANDOFF.md',
              'docs/validation/ORD-001-A09B0-PROVIDER-SELECTION-HANDOFF.json',
              'scripts/audit-ord-001-a09b0-provider-selection-handoff.js',
              '.github/workflows/ord-001-a09b0-provider-selection-handoff.yml'
          ]
          for item in required_paths:
              if item not in ord_domain['requiredPaths']:
                  ord_domain['requiredPaths'].append(item)

          test_name = 'audit:ord-001-a09b0-provider-selection-handoff'
          if test_name not in ord_domain['tests']:
              ord_domain['tests'].append(test_name)

          evidence = 'ORD-A09B0 provider selection handoff separates the exact Railway staging selection phrase from account, billing, secrets, infrastructure, deployment, rollback, visual canary and production authorizations; generic continuation remains non-authorizing.'
          if evidence not in ord_domain['evidence']:
              ord_domain['evidence'].append(evidence)

          blocker = next(blocker for blocker in ord_domain['blockers'] if blocker['id'] == 'ORD-B05')
          blocker['description'] = 'ORD-A08 release identity, ORD-A09A provider evaluation, the ORD-A09B0 provider-neutral adapter boundary and the provider selection handoff are complete. Railway is recommended as the external staging release provider, but no explicit provider selection, provider-specific adapter, account, billing, secrets, infrastructure, rollback command or deployment exists.'

          next_action = 'Await the exact Railway staging selection phrase; after it is received, create only the non-secret provider-specific adapter and run local dry-run plus check-env while keeping account, billing, infrastructure and deployment separately authorized.'
          if next_action not in ord_domain['nextActions']:
              ord_domain['nextActions'].append(next_action)

          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/audit-ord-001-a09b0-provider-selection-handoff.js
          node scripts/audit-ord-001-a09b0-provider-adapter-boundary.js
          node scripts/audit-ord-001-a09a-staging-provider-evaluation.js
          node scripts/audit-ord-001-a08-staging-release-readiness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add -A
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete ORD-A09B0 provider selection handoff'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
