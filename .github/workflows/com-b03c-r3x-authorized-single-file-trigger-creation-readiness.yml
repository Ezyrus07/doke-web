name: COM-B03C-R3X Authorized Single-File Trigger Creation Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r3x.js'
      - 'config/com-b03c-r3x-authorized-single-file-trigger-creation-readiness.json'
      - 'config/com-b03c-r3w-single-use-staging-authorization-trigger.json'
      - 'scripts/test-com-b03c-r3x-authorized-single-file-trigger-creation-readiness.js'
      - 'docs/validation/COM-B03C-R3X-AUTHORIZED-SINGLE-FILE-TRIGGER-CREATION-READINESS.json'
      - '.github/workflows/com-b03c-r3x-authorized-single-file-trigger-creation-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3x.js
          node --check scripts/test-com-b03c-r3x-authorized-single-file-trigger-creation-readiness.js
      - name: R3X authorization receipt and trigger lifecycle
        run: node scripts/test-com-b03c-r3x-authorized-single-file-trigger-creation-readiness.js
      - name: Trigger state validation
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TRIGGER=config/com-b03c-r3w-single-use-staging-authorization-trigger.json
          if test -f "$TRIGGER"; then
            node - <<'NODE'
          const cp = require('node:child_process');
          const r3x = require('./backend/modules/communities/community-realtime-private-auth-r3x');
          const trigger = require('./config/com-b03c-r3w-single-use-staging-authorization-trigger.json');
          const actualHead = String(process.env.PR_HEAD_SHA || '').trim();
          if (!/^[a-f0-9]{40}$/.test(actualHead)) throw new Error('R3X_PR_HEAD_SHA_REQUIRED');
          cp.execFileSync('git', ['cat-file', '-e', `${actualHead}^{commit}`]);
          const parentHead = cp.execFileSync('git', ['rev-parse', `${actualHead}^`], { encoding: 'utf8' }).trim();
          const changedFiles = cp.execFileSync('git', ['diff', '--name-only', parentHead, actualHead], { encoding: 'utf8' }).trim().split(/\n/).filter(Boolean);
          const result = r3x.validateAuthorizedTriggerCommit({
            trigger,
            parentHead,
            changedFiles,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          });
          if (result.decision !== 'future_trigger_commit_shape_valid_remote_execution_still_separately_blocked') {
            console.error(result);
            process.exit(1);
          }
          NODE
          else
            echo 'R3X trigger absent: repository pre-trigger or post-cleanup state.'
          fi
      - name: Pre-remote hard block
        run: |
          node - <<'NODE'
          const r3x = require('./backend/modules/communities/community-realtime-private-auth-r3x');
          let sideEffects = 0;
          try { r3x.assertRemoteExecutionBoundaryAbsent(); sideEffects += 1; }
          catch (error) { if (error?.code !== r3x.REMOTE_EXECUTION_BLOCK_CODE) throw error; }
          if (sideEffects !== 0) process.exit(1);
          NODE
      - name: Workflow repository-only guard
        shell: bash
        run: |
          WORKFLOW=.github/workflows/com-b03c-r3x-authorized-single-file-trigger-creation-readiness.yml
          test "$(grep -c '^  push:' "$WORKFLOW" || true)" -eq 0
          test "$(grep -Ec '^[[:space:]]+environment:' "$WORKFLOW" || true)" -eq 0
          test "$(grep -c 'secrets[.]' "$WORKFLOW" || true)" -eq 0
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
