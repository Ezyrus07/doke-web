name: Doke Staging Edge HTTP Canary

on:
  pull_request:
    branches: [MAIN, main, master]
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-auth-a05-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close-auth-a05-evidence:
    name: Publish AUTH-A05 evidence and journal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Close AUTH-A05 evidence
        shell: python
        run: |
          from pathlib import Path
          import json

          runtime_head = '1ccd40328596368703bbf2e507fcaef3c3bb908c'

          evidence = Path('docs/validation/AUTH-001-A05-PASSWORD-RECOVERY.md')
          text = evidence.read_text(encoding='utf-8')
          old_status = '**Status:** `IMPLEMENTED — FINAL CI PENDING`'
          if text.count(old_status) != 1:
              raise SystemExit('Expected one AUTH-A05 pending status marker')
          text = text.replace(old_status, '**Status:** `DONE`')

          pending_block = '''## Final validation pending

          - Doke Quality Gates on the evidence head;
          - Diagnostic E2E on the evidence head;
          - visual structural guards on the evidence head;
          - staging Edge HTTP canary on the evidence head;
          - real recovery-email delivery canary under `MAIL-001`.
          '''.replace('          ', '')
          final_block = '''## Final validation

          Runtime and visual-validation head: `1ccd40328596368703bbf2e507fcaef3c3bb908c`.

          - Doke Quality Gates #351: `success`;
          - blocking deterministic E2E: `success`;
          - 105 visual structural guards: `success`;
          - Doke Diagnostic E2E #146: `success`;
          - Doke Staging Edge HTTP Canary #125: `success`;
          - governed matrix, authentication runtime tests and clean-patch checks: `success`.

          Actual recovery-email delivery remains explicitly blocked under `MAIL-001`; it is not presented as validated.
          '''.replace('          ', '')
          if text.count(pending_block) != 1:
              raise SystemExit('Expected one AUTH-A05 final validation pending block')
          evidence.write_text(text.replace(pending_block, final_block), encoding='utf-8')

          json_path = Path('docs/validation/AUTH-001-A05-PASSWORD-RECOVERY.json')
          payload = {
              'id': 'AUTH-A05',
              'observedAt': '2026-07-24',
              'branch': 'auth/auth-001-baseline-audit',
              'status': 'DONE',
              'runtimeChanged': True,
              'supabaseMutated': False,
              'productionMutated': False,
              'authority': {
                  'provider': 'supabase_auth',
                  'requestRecovery': 'resetPasswordForEmail',
                  'recoveryEvent': 'PASSWORD_RECOVERY',
                  'completeRecovery': 'updateUser_password',
                  'reauthenticate': 'signInWithPassword',
                  'changePassword': 'updateUser_password_currentPassword',
                  'revokeOtherSessions': 'signOut_scope_others'
              },
              'controls': {
                  'browserRecoveryCodeRemoved': True,
                  'browserRecoverySecretPersistence': False,
                  'emailEnumerationResistantFeedback': True,
                  'credentialBearingRecoveryContextRequired': True,
                  'recoveryCredentialsScrubbedFromHistory': True,
                  'phoneRecoveryFailsClosed': True,
                  'currentPasswordRequiredForSettingsChange': True,
                  'otherSessionsRevokedAfterChange': True,
                  'temporaryRecoverySessionEndsAfterReset': True,
                  'singleCanonicalRecoveryPage': True
              },
              'validation': {
                  'validatedHead': runtime_head,
                  'qualityGates': {'runNumber': 351, 'conclusion': 'success'},
                  'diagnosticE2E': {'runNumber': 146, 'conclusion': 'success', 'blocking': False},
                  'stagingEdgeHttpCanary': {'runNumber': 125, 'conclusion': 'success'},
                  'blockingDeterministicE2E': 'success',
                  'visualStructuralGuards': {'cases': 105, 'conclusion': 'success'},
                  'authRuntimeTest': 'tests/auth/test-auth-password-recovery-runtime.js',
                  'canonicalAuthAudit': 'success',
                  'domainMatrix': 'success',
                  'cleanPatch': 'success'
              },
              'externalDependencies': [
                  'MAIL-001_recovery_email_delivery_and_redirect_canary',
                  'PAID-001_leaked_password_protection'
              ],
              'outOfScope': [
                  'sms_recovery_provider',
                  'oauth_provider_activation',
                  'custom_smtp_configuration'
              ]
          }
          json_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          journal = Path('docs/DOKE-ENGINEERING-JOURNAL.md')
          journal_text = journal.read_text(encoding='utf-8')
          old_next = 'Next sublot: `AUTH-A05 — real password recovery, reset and reauthentication authority`.'
          new_next = 'Completed through `AUTH-A05`. Next sublot: `AUTH-A06 — final provider exposure, identity lifecycle and AUTH-001 closure review`.'
          if old_next in journal_text:
              journal_text = journal_text.replace(old_next, new_next, 1)

          marker = '## 2026-07-24 — AUTH-A05 password authority closed'
          if marker not in journal_text:
              entry = '''

          ---

          ## 2026-07-24 — AUTH-A05 password authority closed

          **Scope:** PR #9, authentication recovery and account security

          **Outcome:** `DONE` for `AUTH-A05`; `BLOCKED` for `MAIL-001`

          ### Context

          The active recovery page generated a browser-local code, retained a recovery record in browser storage and displayed a phone option without a proven provider. Password change in Settings also lacked a real reauthentication authority.

          ### Decision

          Supabase Auth is now the only password authority. Recovery is email-only, reset requires a credential-bearing recovery context, and authenticated password changes require confirmation of the current password.

          ### Implementation

          - Replaced the local recovery-code flow with a Supabase recovery request.
          - Consolidated request and reset into one canonical recovery page.
          - Added a token-free early recovery marker and controlled invalid-link state.
          - Added authenticated password change in Settings with current-password verification.
          - Added revocation of other sessions after a successful password change.
          - Removed the unsupported phone-recovery option instead of simulating it.
          - Added deterministic runtime coverage and updated visual/form-control governance contracts.

          ### Validation

          - Quality Gates #351: success.
          - Diagnostic E2E #146: success.
          - Staging Edge HTTP Canary #125: success.
          - Blocking deterministic E2E: success.
          - 105 visual structural guards: success.
          - Authentication, matrix, governance and clean-patch audits: success.

          ### Risks and boundaries

          - No production environment or Supabase Auth setting was changed.
          - No existing user password was changed during the deterministic validation.
          - Real recovery-message delivery remains unvalidated because the built-in SMTP quota is exhausted.
          - `MAIL-001` remains blocked until a controlled SMTP provider or quota window is available.
          - `PAID-001` remains blocked by the Supabase plan.

          ### Next step

          Execute `AUTH-A06`: review exposed providers and remaining identity lifecycle gaps, then decide whether AUTH-001 can close or requires another focused sublot.
          '''.replace('          ', '')
              journal_text = journal_text.rstrip() + entry + '\n'
          journal.write_text(journal_text, encoding='utf-8')

      - name: Publish AUTH-A05 closure documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/AUTH-001-A05-PASSWORD-RECOVERY.md docs/validation/AUTH-001-A05-PASSWORD-RECOVERY.json docs/DOKE-ENGINEERING-JOURNAL.md
          if git diff --cached --quiet; then
            echo "AUTH-A05 evidence already closed."
            exit 0
          fi
          git commit -m "Close AUTH-A05 evidence and journal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
