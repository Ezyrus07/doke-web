name: Doke Staging Edge HTTP Canary

on:
  pull_request:
    branches: [MAIN, main, master]
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
      - 'scripts/validate-staging-edge-http-canary.mjs'
      - 'assets/js/core/supabase-config.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/145_edge_function_abuse_guard.sql'
      - 'supabase/tests/014_edge_function_abuse_guard_validation.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-staging-edge-http-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-edge-http-canary:
    name: Seven-function staging HTTP boundary canary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose domain completion governance
        id: domain_completion
        continue-on-error: true
        run: npm run audit:domain-completion-matrix

      - name: Diagnose agent governance
        id: agent_governance
        continue-on-error: true
        run: npm run audit:agent-governance

      - name: Diagnose unused asset governance
        id: unused_assets
        continue-on-error: true
        run: npm run audit:unused-asset-candidates

      - name: Diagnose duplicate asset governance
        id: duplicate_assets
        continue-on-error: true
        run: npm run audit:duplicate-assets

      - name: Fail on governed audit drift
        if: >-
          steps.domain_completion.outcome != 'success' ||
          steps.agent_governance.outcome != 'success' ||
          steps.unused_assets.outcome != 'success' ||
          steps.duplicate_assets.outcome != 'success'
        run: |
          echo "domain_completion=${{ steps.domain_completion.outcome }}"
          echo "agent_governance=${{ steps.agent_governance.outcome }}"
          echo "unused_assets=${{ steps.unused_assets.outcome }}"
          echo "duplicate_assets=${{ steps.duplicate_assets.outcome }}"
          exit 1

      - name: Run staging Edge HTTP canary
        run: node scripts/validate-staging-edge-http-canary.mjs

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-staging-edge-http-canary-${{ github.sha }}
          path: reports/generated/staging-edge-http-canary.json
          if-no-files-found: warn
          retention-days: 30
