name: Doke AUTH-A04 Staging Signup Canary

on:
  pull_request:
    branches: [MAIN, main, master]
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-auth-a04-signup-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-a04-signup-canary:
    name: Real staging registration and username authority
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run public Supabase signup canary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const source = fs.readFileSync('assets/js/core/supabase-config.js', 'utf8');
          const url = source.match(/url:\s*"([^"]+)"/)?.[1];
          const anonKey = source.match(/anonKey:\s*\n\s*"([^"]+)"/)?.[1];
          if (!url || !anonKey) throw new Error('Public Supabase staging configuration not found.');

          const validEmail = 'auth-a04-canary@example.test';
          const duplicateEmail = 'auth-a04-canary-duplicate@example.test';
          const reservedEmail = 'auth-a04-canary-reserved@example.test';
          const handle = 'autha04_canary';
          const password = `Aa1!${crypto.randomBytes(24).toString('base64url')}`;

          const request = async (path, body) => {
            const response = await fetch(`${url}${path}`, {
              method: 'POST',
              headers: {
                apikey: anonKey,
                Authorization: `Bearer ${anonKey}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(body)
            });
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
            return { response, data };
          };

          const valid = await request('/auth/v1/signup', {
            email: validEmail,
            password,
            data: { name: 'AUTH A04 Canary', handle }
          });
          if (!valid.response.ok || !valid.data?.user?.id) {
            throw new Error(`Valid signup failed (${valid.response.status}): ${JSON.stringify(valid.data)}`);
          }

          const userId = valid.data.user.id;
          const profileResponse = await fetch(
            `${url}/rest/v1/user_profiles?user_id=eq.${encodeURIComponent(userId)}&select=user_id,username,display_name`,
            { headers: { apikey: anonKey, Authorization: `Bearer ${anonKey}` } }
          );
          const profiles = await profileResponse.json();
          if (!profileResponse.ok || !Array.isArray(profiles) || profiles.length !== 1 || profiles[0].username !== handle) {
            throw new Error(`Profile materialization mismatch: ${JSON.stringify(profiles)}`);
          }

          const availability = await request('/rest/v1/rpc/check_username_availability', {
            p_username: handle.toUpperCase()
          });
          const availabilityRow = Array.isArray(availability.data) ? availability.data[0] : availability.data;
          if (!availability.response.ok || availabilityRow?.available !== false || availabilityRow?.reason !== 'taken') {
            throw new Error(`Taken username was not reported: ${JSON.stringify(availability.data)}`);
          }

          const duplicate = await request('/auth/v1/signup', {
            email: duplicateEmail,
            password,
            data: { name: 'AUTH A04 Duplicate', handle: handle.toUpperCase() }
          });
          if (duplicate.response.ok) {
            throw new Error('Duplicate username signup unexpectedly succeeded.');
          }

          const reserved = await request('/auth/v1/signup', {
            email: reservedEmail,
            password,
            data: { name: 'AUTH A04 Reserved', handle: 'ADMIN' }
          });
          if (reserved.response.ok) {
            throw new Error('Reserved username signup unexpectedly succeeded.');
          }

          console.log(JSON.stringify({
            authA04RealSignup: true,
            userId,
            email: validEmail,
            username: handle,
            profileMaterialized: true,
            duplicateRejected: true,
            reservedRejected: true,
            privilegedCredentialUsed: false
          }));
          NODE
