name: Doke Staging Edge HTTP Canary

on:
  pull_request:
    branches:
      - MAIN
      - main
      - master
      - 'auth/**'
      - 'prof/**'
      - 'cat/**'
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
      - 'scripts/validate-staging-edge-http-canary.mjs'
      - 'assets/js/core/supabase-config.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/145_edge_function_abuse_guard.sql'
      - 'supabase/tests/014_edge_function_abuse_guard_validation.sql'
      - 'docs/DOKE-ENGINEERING-JOURNAL.md'
      - 'docs/validation/SEC-001-B05-B09-HARDENING-*'
      - 'docs/validation/SEC-001-B09-STAGING-HTTP-CANARY.json'
  push:
    branches:
      - 'prof/**'
      - 'cat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-staging-edge-http-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-edge-http-canary:
    name: Seven-function staging HTTP boundary canary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run staging Edge HTTP canary
        run: node scripts/validate-staging-edge-http-canary.mjs

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-staging-edge-http-canary-${{ github.sha }}
          path: reports/generated/staging-edge-http-canary.json
          if-no-files-found: warn
          retention-days: 30

  cat-a05-finalize-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'cat/cat-001-baseline-audit'
    name: Execute CAT-A05 final reconciliation once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute deterministic CAT finalizer
        run: node scripts/cat-a05-finalize-once.js

      - name: Normalize matrix package-script references
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          const scripts = JSON.parse(fs.readFileSync('package.json', 'utf8')).scripts || {};
          for (const domain of matrix.domains || []) {
            domain.tests = Array.from(new Set(domain.tests || [])).filter((test) => Boolean(scripts[test]));
          }
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

      - name: Regenerate deterministic matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Remove one-time machinery
        shell: bash
        run: |
          git show 09e77e5236d2bc0c820d73768f0161f326adeefe:.github/workflows/staging-edge-http-canary.yml > .github/workflows/staging-edge-http-canary.yml
          rm scripts/cat-a05-finalize-once.js

      - name: Validate final closure state
        run: |
          node scripts/audit-service-catalog-authority-baseline.js
          node scripts/audit-cat-domain-closure-candidate.js
          node scripts/audit-cat-final-transition-manifest.js
          npm run audit:domain-completion-matrix
          npm run audit:quality-pipeline
          git diff --check

      - name: Commit final CAT reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize CAT-001 domain reconciliation"
          git push origin HEAD:cat/cat-001-baseline-audit
