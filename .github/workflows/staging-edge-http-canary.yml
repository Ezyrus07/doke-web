name: Doke Staging Edge HTTP Canary

on:
  pull_request:
    branches: [MAIN, main, master]
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
      - 'scripts/validate-staging-edge-http-canary.mjs'
      - 'assets/js/core/supabase-config.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'assets/js/services/auth-registration-authority.js'
      - 'scripts/test-auth-registration-username-runtime.js'
      - 'scripts/audit-auth-session-contracts.js'
      - 'auth/cadastro.html'
      - 'docs/DOKE-ENGINEERING-JOURNAL.md'
      - 'docs/validation/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-staging-edge-http-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-edge-http-canary:
    name: Regenerate governed matrix and run staging canary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate governed domain matrix
        run: npm run write:domain-completion-matrix

      - name: Publish deterministic matrix only
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md; then
            echo "Domain completion matrix is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "Regenerate domain completion matrix for AUTH-A04"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run staging Edge HTTP canary
        run: node scripts/validate-staging-edge-http-canary.mjs

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-staging-edge-http-canary-${{ github.sha }}
          path: reports/generated/staging-edge-http-canary.json
          if-no-files-found: warn
          retention-days: 30
