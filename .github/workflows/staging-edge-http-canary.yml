name: Doke Staging Edge HTTP Canary

on:
  pull_request:
    branches: [MAIN, main, master]
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
      - 'scripts/validate-staging-edge-http-canary.mjs'
      - 'assets/js/core/supabase-config.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/145_edge_function_abuse_guard.sql'
      - 'supabase/tests/014_edge_function_abuse_guard_validation.sql'
      - 'docs/DOKE-ENGINEERING-JOURNAL.md'
      - 'docs/validation/SEC-001-B05-B09-HARDENING-*'
      - 'docs/validation/SEC-001-B09-STAGING-HTTP-CANARY.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-staging-edge-http-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-edge-http-canary:
    name: Seven-function staging HTTP boundary canary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run staging Edge HTTP canary
        run: node scripts/validate-staging-edge-http-canary.mjs

      - name: Regenerate governed matrix
        run: npm run write:domain-completion-matrix

      - name: Commit regenerated matrix to PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md; then
            echo "Domain completion matrix already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --cached --check
          git commit -m "Regenerate domain completion matrix for AUTH authority gate"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-staging-edge-http-canary-${{ github.sha }}
          path: |
            reports/generated/staging-edge-http-canary.json
            reports/generated/domain-completion-matrix-report.json
            docs/DOMAIN-COMPLETION-MATRIX.md
          if-no-files-found: warn
          retention-days: 30
