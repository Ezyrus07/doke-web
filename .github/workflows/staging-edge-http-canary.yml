name: Doke Staging Edge HTTP Canary

on:
  pull_request:
    branches:
      - MAIN
      - main
      - master
      - 'auth/**'
      - 'prof/**'
      - 'cat/**'
    paths:
      - '.github/workflows/staging-edge-http-canary.yml'
      - 'scripts/validate-staging-edge-http-canary.mjs'
      - 'assets/js/core/supabase-config.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/145_edge_function_abuse_guard.sql'
      - 'supabase/tests/014_edge_function_abuse_guard_validation.sql'
      - 'docs/DOKE-ENGINEERING-JOURNAL.md'
      - 'docs/validation/SEC-001-B05-B09-HARDENING-*'
      - 'docs/validation/SEC-001-B09-STAGING-HTTP-CANARY.json'
  push:
    branches:
      - 'prof/**'
      - 'cat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-staging-edge-http-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-edge-http-canary:
    name: Seven-function staging HTTP boundary canary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run staging Edge HTTP canary
        run: node scripts/validate-staging-edge-http-canary.mjs

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-staging-edge-http-canary-${{ github.sha }}
          path: reports/generated/staging-edge-http-canary.json
          if-no-files-found: warn
          retention-days: 30

  cat-domain-matrix-reconcile:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cat-matrix-sync]')
    name: One-time CAT matrix reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate deterministic matrix
        run: npm run write:domain-completion-matrix

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "No generated drift remains."
            exit 0
          fi
          git commit -m "Regenerate CAT domain matrix evidence"
          git push origin HEAD:cat/cat-001-baseline-audit
