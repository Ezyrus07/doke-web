name: UX-FILTERS-001 Lifecycle Fix

on:
  push:
    branches:
      - ux/ux-filters-001-applied-draft
    paths:
      - '.github/workflows/ux-filters-001-lifecycle-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/ux-filters-001-applied-draft
          fetch-depth: 0

      - name: Apply lifecycle hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/js/pages/search-data.js')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  var installation = null;\n",
                  ""
              ),
              (
                  "    if (root.document.readyState === 'loading') {\n"
                  "      root.document.addEventListener('DOMContentLoaded', arm, { once: true, signal: signal });\n"
                  "    } else {\n"
                  "      defer(arm);\n"
                  "    }\n",
                  "    function scheduleArm() {\n"
                  "      if (typeof root.setTimeout === 'function') {\n"
                  "        root.setTimeout(arm, 0);\n"
                  "        return;\n"
                  "      }\n"
                  "      defer(arm);\n"
                  "    }\n\n"
                  "    if (root.document.readyState === 'loading') {\n"
                  "      root.document.addEventListener('DOMContentLoaded', scheduleArm, { once: true, signal: signal });\n"
                  "    } else {\n"
                  "      scheduleArm();\n"
                  "    }\n"
              ),
              (
                  "  Doke.searchFilterState = api;\n"
                  "  if (installation && installation.cleanup) installation.cleanup();\n"
                  "  installation = install();\n"
                  "  Doke.searchFilterStateInstallation = installation;\n"
                  "}());\n",
                  "  Doke.searchFilterState = api;\n"
                  "  if (Doke.searchFilterStateInstallation && Doke.searchFilterStateInstallation.cleanup) {\n"
                  "    Doke.searchFilterStateInstallation.cleanup();\n"
                  "  }\n"
                  "  Doke.searchFilterStateInstallation = install();\n"
                  "}());\n"
              )
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one lifecycle pattern, found {count}.')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

      - name: Validate and remove temporary workflow
        run: |
          node --check assets/js/pages/search-data.js
          node scripts/test-ux-filters-001-filter-state.js
          rm .github/workflows/ux-filters-001-lifecycle-fix.yml

      - name: Commit lifecycle hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/pages/search-data.js .github/workflows/ux-filters-001-lifecycle-fix.yml
          git commit -m 'UX-FILTERS-001 harden route lifecycle and bootstrap ordering'
          git push origin HEAD:ux/ux-filters-001-applied-draft
