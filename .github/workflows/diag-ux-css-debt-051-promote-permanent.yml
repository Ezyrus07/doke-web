name: Doke UX-CSS-DEBT-051 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-051-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 62dcfa29b7a4a21e07d5fefe2c336c4c76a0eb05
      PARENT_SHA: 927b4d24e26d1684864cc3a4222540bb7c9f9667
      TARGET_FILE: assets/css/components/cards/service-card-home-feed.css
      TARGET_BLOB: 95f4b03a325a5fd62dae8b89bfe89b94b1290027
      TARGET_HASH: 2db6992d12aa5d92bef793f06472076bd7507a2a64a1fa44df72011a376ac18d
      TARGET_BYTES: '10140'
      PERM_BRANCH: ux/ux-css-debt-051-service-card-home-feed-compaction
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
      - name: Preserve promotion helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-051-promote.cjs /tmp/ux051-promote.cjs
          node --check /tmp/ux051-promote.cjs
      - name: Checkout exact certified UX-CSS-DEBT-050 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          clean: true
          persist-credentials: true
      - name: Guard exact parent and seeded permanent namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          REMOTE_BEFORE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE_BEFORE" = "$TARGET_SHA"
          echo "PROMOTION PARENT PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|blob=$TARGET_BLOB|permanentNamespace=seeded-at-parent"
      - name: Build exact candidate on permanent branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$PERM_BRANCH"
          node /tmp/ux051-promote.cjs
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          git diff --check
      - name: Commit exact permanent product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "doke"
          git config user.email "bielantoniomma@gmail.com"
          git add "$TARGET_FILE"
          git commit -m "UX-CSS-DEBT-051: compact superseded home feed service card declarations"
          COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA"...HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$TARGET_SHA"...HEAD -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          echo "PERMANENT COMMIT PASS|sha=$COMMIT|parent=$TARGET_SHA|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=3"
      - name: Fast-forward permanent branch
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          REMOTE_BEFORE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE_BEFORE" = "$TARGET_SHA"
          git push origin "HEAD:refs/heads/$PERM_BRANCH"
          REMOTE_AFTER="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE_AFTER" = "$COMMIT"
          echo "PROMOTION FINAL PASS|branch=$PERM_BRANCH|sha=$COMMIT|parent=$TARGET_SHA|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=3|prCreated=0|transport=seeded-fast-forward"
