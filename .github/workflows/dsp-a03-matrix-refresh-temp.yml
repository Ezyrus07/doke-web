name: DSP-A03 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/dsp-a03-matrix-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'dsp/dsp-001-baseline-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dsp/dsp-001-baseline-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Regenerate matrix derivatives
        run: npm run write:domain-completion-matrix
      - name: Enforce allowlist
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          test -z "$unexpected"
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/dsp-a03-matrix-refresh-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -A .github/workflows/dsp-a03-matrix-refresh-temp.yml
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          unexpected="$(printf '%s\n' "$staged" | grep -v -E '^(docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json|\.github/workflows/dsp-a03-matrix-refresh-temp\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'chore(dsp): refresh matrix for DSP-A03'
          git push origin HEAD:dsp/dsp-001-baseline-audit
