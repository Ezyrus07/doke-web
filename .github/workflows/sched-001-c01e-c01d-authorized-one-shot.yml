name: Doke SCHED-C01E Authorized Fixture Lifecycle and C01D One-Shot

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01e-c01d-authorized-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: sched-001-c01e-c01d-authorized-one-shot
  cancel-in-progress: false

jobs:
  authorized-canary:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      DOKE_STAGING_CLIENT_EMAIL: ${{ secrets.DOKE_STAGING_CLIENT_EMAIL }}
      DOKE_STAGING_CLIENT_PASSWORD: ${{ secrets.DOKE_STAGING_CLIENT_PASSWORD }}
      DOKE_STAGING_PROFESSIONAL_EMAIL: ${{ secrets.DOKE_STAGING_PROFESSIONAL_EMAIL }}
      DOKE_STAGING_PROFESSIONAL_PASSWORD: ${{ secrets.DOKE_STAGING_PROFESSIONAL_PASSWORD }}
      DOKE_SCHED_C01E_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01E_SYNTHETIC_ORDER_FIXTURE_LIFECYCLE_ON_DOKE_STAGING
      DOKE_SCHED_C01E_BROWSER_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING
      DOKE_SCHED_C01D_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING
      DOKE_SCHED_C01E_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOKE_SCHED_C01D_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOKE_SCHED_C01E_RUN_ID: sched-c01e-${{ github.run_id }}
      DOKE_ENVIRONMENT: staging
      DOKE_SCHED_C01D_ALLOW_NETWORK: '1'
      DOKE_SCHED_C01D_EXECUTE: '1'
      DOKE_SCHED_C01D_WEB_BASE_URL: http://127.0.0.1:5500
      DOKE_SCHED_C01E_REPORT_PATH: reports/generated/sched-001-c01e-synthetic-order-fixture-lifecycle-report.json
      DOKE_SCHED_C01D_REPORT_PATH: reports/generated/sched-001-c01d-authenticated-browser-read-only-canary-report.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Require immutable authorized head and first attempt
        run: |
          test "${{ github.run_attempt }}" = "1"
          test "$(git rev-parse HEAD)" = "$DOKE_SCHED_C01E_EXPECTED_HEAD_SHA"
          test "$DOKE_SCHED_C01E_EXPECTED_HEAD_SHA" = "$DOKE_SCHED_C01D_EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Fail closed unless all staging secrets are present
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$DOKE_STAGING_CLIENT_EMAIL"
          test -n "$DOKE_STAGING_CLIENT_PASSWORD"
          test -n "$DOKE_STAGING_PROFESSIONAL_EMAIL"
          test -n "$DOKE_STAGING_PROFESSIONAL_PASSWORD"

      - name: Validate canonical execution packages
        run: |
          node --check scripts/prepare-sched-001-c01e-dual-authorization-runtime.js
          node --check scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js
          node --check scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js
          node --check scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js
          node scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Materialize ephemeral dual authorization
        id: materialize
        run: node scripts/prepare-sched-001-c01e-dual-authorization-runtime.js

      - name: Verify zero residue before provisioning
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --preflight --write-report

      - name: Provision bounded synthetic fixture graph
        id: provision
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --provision --write-report

      - name: Check authenticated browser environment
        run: node scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js --check-env --write-report

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start exact-head static server
        run: |
          DOKE_E2E_DISABLE_REMOTE_SERVICES=0 node scripts/serve-static-site.js --host=127.0.0.1 --port=5500 > "$RUNNER_TEMP/sched-c01d-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sched-c01d-server.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:5500/pedidos.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sched-c01d-server.log"
          exit 1

      - name: Execute bound authenticated read-only canary
        id: c01d
        run: node scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js --execute --write-report

      - name: Cleanup bounded synthetic fixture graph
        if: always() && steps.materialize.outcome == 'success'
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --cleanup --write-report

      - name: Independently verify zero residue
        if: always() && steps.materialize.outcome == 'success'
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --verify-clean --write-report

      - name: Finalize sanitized lifecycle evidence
        if: always() && steps.materialize.outcome == 'success'
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --finalize --write-report

      - name: Verify canonical sources remained immutable
        if: always()
        run: |
          git diff --exit-code -- \
            scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js \
            scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js

      - name: Stop static server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/sched-c01d-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/sched-c01d-server.pid")" 2>/dev/null || true
          fi

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-c01e-c01d-sanitized-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/generated/sched-001-c01e-synthetic-order-fixture-lifecycle-report.json
            reports/generated/sched-001-c01d-authenticated-browser-read-only-canary-report.json
