name: TEMP COM-B02CG Matrix Derivatives Export

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cg-matrix-derivatives-export.yml'

permissions:
  contents: read

jobs:
  export-matrix-derivatives:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXECUTION_PROOF_HEAD: a797a05b32fea1d2ec15ca348190afead19d2122
      EXECUTION_PROOF_TREE: cce5e830695fcea86e160c46f9a134ad5c5f77b6
      EXECUTION_PROOF_RUN_ID: '32734569237'
      EXECUTION_PROOF_JOB_ID: '97454242038'
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-resolve-release-execution.js
      TARGET_BLOB: 116bb4d0fc938ee9bd36aa5666e6a1588b8a386e
      CONFIG: config/com-b02cg-repository-only-deterministic-synthetic-continuation-state-register-resolve-release-execution.json
      CONFIG_BLOB: e5fb02661582363fcd86d0c97e7ff5b4fea30096
      TEST: scripts/test-com-b02cg-repository-only-deterministic-synthetic-continuation-state-register-resolve-release-execution.js
      TEST_BLOB: 3295cc1ccaed30d1361489c02f99d64cfb30e5a6
      EXECUTOR: .github/workflows/0000-temp-com-b02cg-authorized-single-use-register-resolve-release-execution.yml
      EXECUTOR_BLOB: c32be91e4bead76fb1b266932afd32cb851d9ec0
      EXPORTER: .github/workflows/0000-temp-com-b02cg-matrix-derivatives-export.yml
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623

    steps:
      - name: Checkout exact exporter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze consumed execution proof and static-only exporter scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.run_attempt }}" = '1'
          test "$(git rev-parse "$EXECUTION_PROOF_HEAD^{tree}")" = "$EXECUTION_PROOF_TREE"
          test "$(git rev-parse HEAD^)" = "$EXECUTION_PROOF_HEAD"
          test "$EXECUTION_PROOF_RUN_ID" = '32734569237'
          test "$EXECUTION_PROOF_JOB_ID" = '97454242038'
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$EXECUTOR)" = "$EXECUTOR_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          expected="$(printf '%s\n' "$EXPORTER")"
          actual="$(git diff --name-only "$EXECUTION_PROOF_HEAD" HEAD)"
          test "$actual" = "$expected"
          needle='--''execute'
          ! grep -F -- "$needle" "$EXPORTER"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate and audit Matrix derivatives without B02CG reexecution
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          printf 'markdown_blob=%s\nreport_blob=%s\n' \
            "$(git hash-object docs/DOMAIN-COMPLETION-MATRIX.md)" \
            "$(git hash-object reports/generated/domain-completion-matrix-report.json)" \
            > /tmp/com-b02cg-matrix-manifest.txt
          cat /tmp/com-b02cg-matrix-manifest.txt

      - name: Upload exact Matrix derivatives
        uses: actions/upload-artifact@v4
        with:
          name: com-b02cg-matrix-derivatives
          if-no-files-found: error
          retention-days: 1
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
            /tmp/com-b02cg-matrix-manifest.txt
