name: ORD-A07D Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07d-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07D registry and matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(packageJson.scripts, {
            'test:ord-001-a07d-edge-function-freshness-wiring': 'node scripts/test-ord-001-a07d-worker-invocation-gate.mjs',
            'audit:ord-001-a07d-edge-function-freshness-wiring': 'node scripts/audit-ord-001-a07d-edge-function-freshness-wiring.js'
          });
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.32';
          matrix.updatedAt = '2026-07-30T13:08:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'supabase/functions/order-event-worker/invocation-gate.mjs',
            'config/ord-001-a07d-edge-function-freshness-wiring.json',
            'scripts/test-ord-001-a07d-worker-invocation-gate.mjs',
            'scripts/audit-ord-001-a07d-edge-function-freshness-wiring.js',
            'docs/ORD-001-A07D-EDGE-FUNCTION-FRESHNESS-WIRING.md',
            'docs/validation/ORD-001-A07D-EDGE-FUNCTION-FRESHNESS-WIRING.json',
            '.github/workflows/ord-001-a07d-edge-function-freshness-wiring.yml'
          ]);
          appendUnique(ord.tests, [
            'test:ord-001-a07d-edge-function-freshness-wiring',
            'audit:ord-001-a07d-edge-function-freshness-wiring'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07D wires token verification, freshness validation and atomic nonce consumption before begin_order_event_worker_run in the repository Edge Function.',
            'Missing or invalid freshness fails with HTTP 428, unavailable ledger fails with HTTP 428, and replay fails with HTTP 409 before any worker run or event claim.',
            'The nonce is excluded from worker-run metadata and logs; only issued-at and calculated age are retained for diagnosis.',
            'Repository wiring is complete while staging migrations, Cron changes, Edge Function deploy and production remain unauthorized.'
          ]);
          appendUnique(ord.nextActions, [
            'Apply and verify ORD-A07B under its exact staging authorization, then separately authorize ORD-A07C, deploy the repository-wired Edge Function through the controlled staging release, and run the concurrent replay canary.'
          ]);
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/test-ord-001-a07d-worker-invocation-gate.mjs
          node scripts/audit-ord-001-a07d-edge-function-freshness-wiring.js
          node scripts/test-ord-001-a07c-worker-invocation-headers.mjs
          node scripts/audit-ord-001-a07c-worker-invocation-headers.js
          node scripts/test-order-event-worker-invocation-freshness.js
          node scripts/audit-ord-001-a07b-worker-invocation-freshness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07D Edge Function freshness wiring' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
