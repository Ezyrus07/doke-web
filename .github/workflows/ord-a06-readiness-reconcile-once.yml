name: ORD-A06 Readiness Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-a06-readiness-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A06 readiness governance and self-remove
        shell: bash
        run: |
          git rm .github/workflows/ord-a06-readiness-reconcile-once.yml
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package.setdefault('scripts', {})['audit:ord-001-a06-execution-readiness'] = 'node scripts/audit-ord-001-a06-execution-readiness.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['version'] = '1.3.20'
          matrix['updatedAt'] = '2026-07-29T22:23:00-03:00'
          domain = next(item for item in matrix['domains'] if item['id'] == 'ORD-001')

          def append_unique(target, values):
              for value in values:
                  if value not in target:
                      target.append(value)

          append_unique(domain['requiredPaths'], [
              'docs/ORD-001-A06-EXECUTION-READINESS.md',
              'docs/validation/ORD-001-A06-EXECUTION-READINESS.json',
              'scripts/audit-ord-001-a06-execution-readiness.js',
              '.github/workflows/ord-001-a06-execution-readiness.yml'
          ])
          append_unique(domain['tests'], [
              'audit:ord-001-a06-execution-readiness'
          ])
          append_unique(domain['evidence'], [
              'A read-only staging inspection found one compatible distinct client/professional pair and one eligible published service owned by the professional candidate.',
              'The readiness evidence stores only aggregate capacity and boolean eligibility; no e-mail, UUID, username, display name, service reference, credential or token is committed.',
              'Technical capacity is explicitly separated from operational authorization: existing users and services remain unusable until each resource is authorized and secrets are injected outside the repository.',
              'The readiness CI gate is static-only and preserves the fail-closed Playwright executor, cleanup boundary and deterministic cross-session settlement without browser or staging mutation.'
          ])
          for blocker in domain['blockers']:
              if blocker['id'] == 'ORD-B02':
                  blocker['description'] = 'Canonical reads, canary commands, cleanup, deterministic settlement and the fail-closed Playwright executor pass. Staging contains one compatible account pair and one eligible owned service, but ORD-B02 remains until those resources are explicitly authorized and the real two-context visual canary is executed.'
          domain['nextActions'] = [
              'Obtain explicit authorization for the identified staging client, professional and professional-owned published service without modifying user data.',
              'Supply account credentials, approved web/API/Supabase endpoints, service reference and service-role secret only to the executor environment.',
              'Run the fail-closed executor in check-env mode and permit execution only when all authorization, target and mutation gates pass.',
              'Review requested, accepted, quoted and optimistic-conflict evidence, invoke cleanup twice and prove zero residue.',
              'Harden worker invocation freshness and replay resistance.'
          ]
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-ord-001-a06-execution-readiness.js
          node scripts/audit-ord-001-a06-playwright-executor.js
          node scripts/execute-ord-001-a06-visual-settlement-playwright.js --dry-run
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-ord-001-a06-visual-settlement.js
          node scripts/test-order-visual-settlement-runtime.js
          node scripts/audit-domain-completion-matrix.js
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile ORD-A06 execution readiness governance"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
