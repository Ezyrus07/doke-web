name: Doke UX-CSS-DEBT-063 Mobile Panel Proof R1

on:
  push:
    branches:
      - diag/ux-css-debt-063-mobile-panel-proof-r1

permissions:
  contents: read

jobs:
  proof-r1:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ffe9c5a19921422fac17e93e6208a58f2f829429
      PARENT_SHA: 10a9a51cfd0a96e7c6a56eb71cf44452ddb8813f
      TARGET_FILE: assets/css/components/panels/mobile-panel.css
      TARGET_BLOB: aa29bd1a0484e8b6d2995b8afacfe9f30192cefa
      IMPORTER_A: assets/css/pages/comunidade-foundation.css
      IMPORTER_A_BLOB: fad24aba42d840a174328af28ae8c98700219cd4
      IMPORTER_B: assets/css/pages/internal-foundation.css
      IMPORTER_B_BLOB: f35c6e8496849ef552d2c5b2752cf70269c53980
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-062 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Exact input and source-closure guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER_A")" = "$IMPORTER_A_BLOB"
          test "$(git hash-object "$IMPORTER_B")" = "$IMPORTER_B_BLOB"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const files=cp.execFileSync('git',['ls-files','-z','*.html','assets/js'],{encoding:'utf8'}).split('\0').filter(Boolean).filter(f=>fs.existsSync(f)&&fs.statSync(f).isFile());
          const specific=['doke-mobile-panel--filters','doke-mobile-panel--selection','doke-mobile-panel--menu','doke-mobile-panel--context','data-mobile-panel-type="filters"','data-mobile-panel-type="selection"','data-mobile-panel-type="menu"','data-mobile-panel-type="context"'];
          const specificHits=[];const genericHits=[];
          for(const f of files){const s=fs.readFileSync(f,'utf8');const sp=specific.filter(t=>s.includes(t));if(sp.length)specificHits.push({f,sp});if(s.includes('data-mobile-panel'))genericHits.push(f)}
          if(specificHits.length)throw new Error(`changed-family source unexpectedly exists ${JSON.stringify(specificHits)}`);
          const html=[...new Set(genericHits.filter(f=>f.endsWith('.html')))].sort(),js=[...new Set(genericHits.filter(f=>f.endsWith('.js')))].sort();
          if(JSON.stringify(html)!==JSON.stringify(['comunidade.html'])||js.length!==0)throw new Error(`generic closure ${JSON.stringify({html,js})}`);
          console.log('SOURCE CLOSURE PASS|changedFamilySources=0|genericHtml=comunidade.html|genericJs=0|importReachPages=15');
          NODE
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium and serve exact product
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          python3 -m http.server 4181 >/tmp/ux063-r1-http.log 2>&1 &
          echo $! >/tmp/ux063-r1-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4181/comunidade.html >/dev/null

      - name: Authoritative A-B proof on real product DOM
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ux063-r1.js <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const file=process.env.TARGET_FILE,original=fs.readFileSync(file,'utf8'),lines=original.split('\n');
          const rows=new Map([
            [65,'    max-width: calc(100vw - (var(--doke-panel-gutter) * 2));'],
            [90,'    left: max(var(--doke-panel-gutter), env(safe-area-inset-left, 0px));'],
            [91,'    right: max(var(--doke-panel-gutter), env(safe-area-inset-right, 0px));'],
            [94,'    max-height: min(72vh, calc(100dvh - 132px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));']
          ]);
          for(const [n,e] of rows){const a=(lines[n-1]||'').replace(/\r$/,'');if(a!==e)throw new Error(`row drift ${n}: ${JSON.stringify(a)}`)}
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          const pp=parse(original);if(pp.decl!==98||pp.dead.length!==4)throw new Error(`parent ${pp.decl}/${pp.dead.length}`);
          const identical=pp.dead.filter(d=>d.value===d.winner.value&&d.important===d.winner.important).length;if(identical!==3)throw new Error(`identical=${identical}`);if(pp.dead.length-identical!==1)throw new Error('changed count');
          const candidate=lines.filter((_,i)=>!rows.has(i+1)).join('\n');const cc=parse(candidate);if(cc.decl!==94||cc.dead.length!==0)throw new Error(`candidate ${cc.decl}/${cc.dead.length}`);
          const hash=crypto.createHash('sha256').update(candidate).digest('hex'),bytes=Buffer.byteLength(candidate);
          const widths=[359,380,430,767,768,769,1024];
          const generic='.doke-mobile-panel, [data-mobile-panel]';
          const changed='.doke-mobile-panel--filters, .doke-mobile-panel--selection, .doke-mobile-panel--menu, .doke-mobile-panel--context, [data-mobile-panel-type="filters"], [data-mobile-panel-type="selection"], [data-mobile-panel-type="menu"], [data-mobile-panel-type="context"]';
          async function capture(tag){const browser=await chromium.launch({headless:true});const out=[];try{for(const width of widths){const ctx=await browser.newContext({viewport:{width,height:900}});const page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url());if(['127.0.0.1','localhost'].includes(u.hostname))return route.continue();return route.abort()});await page.goto(`http://127.0.0.1:4181/comunidade.html?ux063=${tag}-${width}`,{waitUntil:'domcontentloaded'});await page.waitForTimeout(500);const snap=await page.evaluate(({generic,changed})=>{const panel=document.querySelector('[data-community-mobile-search][data-mobile-panel][data-mobile-panel-type="search"]');if(!panel)throw new Error('real mobile search panel missing');const cs=getComputedStyle(panel),r=panel.getBoundingClientRect();return{genericMatches:document.querySelectorAll(generic).length,changedMatches:document.querySelectorAll(changed).length,hidden:panel.hidden,classes:panel.className,type:panel.getAttribute('data-mobile-panel-type'),maxWidth:cs.maxWidth,maxHeight:cs.maxHeight,left:cs.left,right:cs.right,width:cs.width,position:cs.position,display:cs.display,rect:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*1000)/1000),overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}} ,{generic,changed});if(snap.genericMatches<1)throw new Error(`generic miss @${width}`);if(snap.changedMatches!==0)throw new Error(`changed family unexpectedly active @${width}`);if(snap.type!=='search')throw new Error(`type ${snap.type}`);out.push({width,snap});await ctx.close()}}finally{await browser.close()}console.log(`COVERAGE|${tag}|page=comunidade.html|viewports=${widths.length}|genericRealMatches=1+|changedFamilyMatches=0|boundary=767/768/769`);return out}
          (async()=>{try{fs.writeFileSync(file,original);const p=await capture('parent');fs.writeFileSync(file,candidate);const c=await capture('candidate');const a=JSON.stringify(p),b=JSON.stringify(c);if(a!==b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;throw new Error(`runtime drift idx=${i} parent=${a.slice(i,i+700)} candidate=${b.slice(i,i+700)}`)}if(Math.max(...p.map(x=>x.snap.overflow))!==0)throw new Error('overflow');console.log('R1 BROWSER PARITY PASS|realDOM=1|syntheticDOM=0|genericFamilyActive=1|changedFamilySource=0|changedFamilyRuntimeMatches=0|viewports=7|runtimeDiffs=0|geometryDiffs=0|overflow=0|criteriaRelaxed=0');console.log(`CANDIDATE IDENTITY|sha256=${hash}|bytes=${bytes}|declarations=94|superseded=0|identicalRemoved=3|changedRemoved=1|files=1|additions=0|deletions=4`)}finally{fs.writeFileSync(file,original)}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node --check /tmp/ux063-r1.js
          node /tmp/ux063-r1.js | tee /tmp/ux063-r1.log
          grep -q 'COVERAGE|parent|page=comunidade.html|viewports=7' /tmp/ux063-r1.log
          grep -q 'COVERAGE|candidate|page=comunidade.html|viewports=7' /tmp/ux063-r1.log
          grep -q 'R1 BROWSER PARITY PASS|realDOM=1|syntheticDOM=0|genericFamilyActive=1|changedFamilySource=0|changedFamilyRuntimeMatches=0|viewports=7|runtimeDiffs=0|geometryDiffs=0|overflow=0|criteriaRelaxed=0' /tmp/ux063-r1.log
          test -z "$(git status --porcelain)"

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux063-r1-http.pid; then kill "$(cat /tmp/ux063-r1-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo 'R1 RESTORE PASS|productMutation=0|permanentMutation=0'
