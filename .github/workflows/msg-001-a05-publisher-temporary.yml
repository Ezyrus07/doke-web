name: Doke Temporary MSG-A05 Publisher

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msg-a05-publisher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'msg/msg-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 100

      - name: Freeze repository-only head
        run: |
          git merge-base --is-ancestor efecb8d82abcb3e722380f8d172142bdf533fa0d HEAD
          echo "RUN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(find scripts/.msg-a05-payload -maxdepth 1 -type f -name 'part-*' | wc -l)" = "6"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Reconstruct and execute MSG-A05 generator
        run: |
          cat scripts/.msg-a05-payload/part-* | base64 --decode | gzip --decompress > /tmp/apply-msg-a05.js
          node --check /tmp/apply-msg-a05.js
          node /tmp/apply-msg-a05.js
          cat > .github/workflows/msg-001-a05-attachment-lifecycle.yml <<'YAML'
          name: Doke MSG-A05 Attachment Lifecycle Contract

          on:
            pull_request:
              paths:
                - 'assets/js/repositories/attachments-repository.js'
                - 'assets/js/core/supabase-config.js'
                - 'supabase/migrations/20260802220000_msg_a05_transaction_attachment_lifecycle_contract.sql'
                - 'supabase/functions/self-service-operations/index.ts'
                - 'supabase/functions/self-service-operations/operations.mjs'
                - 'supabase/functions/transaction-attachment-cleanup/index.ts'
                - 'config/msg-001-a05-attachment-lifecycle.json'
                - 'docs/MSG-001-A05-ATTACHMENT-LIFECYCLE.md'
                - 'docs/validation/MSG-001-A05-ATTACHMENT-LIFECYCLE.json'
                - 'scripts/audit-msg-001-a05-attachment-lifecycle.js'
                - 'scripts/test-msg-001-a05-attachment-lifecycle-runtime.js'
                - 'scripts/test-attachments-supabase-repository-contract.js'
                - 'config/domain-completion-matrix.json'
                - 'docs/DOMAIN-COMPLETION-MATRIX.md'
                - 'reports/generated/domain-completion-matrix-report.json'
                - 'package.json'
                - '.github/workflows/msg-001-a05-attachment-lifecycle.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            lifecycle:
              runs-on: ubuntu-24.04
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci --ignore-scripts
                - name: Validate MSG-A05 attachment lifecycle
                  run: |
                    node --check assets/js/repositories/attachments-repository.js
                    node --check supabase/functions/self-service-operations/operations.mjs
                    node --check scripts/audit-msg-001-a05-attachment-lifecycle.js
                    node --check scripts/test-msg-001-a05-attachment-lifecycle-runtime.js
                    npm run audit:msg-001-a01-authority-baseline
                    npm run audit:msg-001-a02-canonical-authority-boundary
                    npm run test:msg-001-a02-canonical-authority-boundary
                    npm run audit:msg-001-a03-server-command-boundary
                    npm run test:msg-001-a03-server-command-boundary
                    npm run audit:msg-001-a04-realtime-publication-subscription-contract
                    npm run test:msg-001-a04-realtime-publication-subscription-runtime
                    npm run audit:msg-001-a05-attachment-lifecycle
                    npm run test:msg-001-a05-attachment-lifecycle-runtime
                    npm run test:attachments-supabase-repository-contract
                    node scripts/test-self-service-edge-authority-contract.js
                    node scripts/test-self-service-operations-edge-runtime.mjs
                    node scripts/audit-edge-function-source-closure.js
                    npm run audit:domain-completion-matrix
                    git diff --check
          YAML
          npm run write:domain-completion-matrix

      - name: Validate MSG-A05 and cumulative contracts
        run: |
          node --check assets/js/repositories/attachments-repository.js
          node --check supabase/functions/self-service-operations/operations.mjs
          node --check scripts/audit-msg-001-a05-attachment-lifecycle.js
          node --check scripts/test-msg-001-a05-attachment-lifecycle-runtime.js
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run audit:msg-001-a03-server-command-boundary
          npm run test:msg-001-a03-server-command-boundary
          npm run audit:msg-001-a04-realtime-publication-subscription-contract
          npm run test:msg-001-a04-realtime-publication-subscription-runtime
          npm run audit:msg-001-a05-attachment-lifecycle
          npm run test:msg-001-a05-attachment-lifecycle-runtime
          npm run test:attachments-supabase-repository-contract
          node scripts/test-self-service-edge-authority-contract.js
          node scripts/test-self-service-operations-edge-runtime.mjs
          node scripts/audit-edge-function-source-closure.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage canonical non-workflow artifacts only
        run: |
          git add assets/js/repositories/attachments-repository.js assets/js/core/supabase-config.js supabase/migrations/20260802220000_msg_a05_transaction_attachment_lifecycle_contract.sql supabase/functions/self-service-operations/index.ts supabase/functions/self-service-operations/operations.mjs supabase/functions/transaction-attachment-cleanup/index.ts config/msg-001-a05-attachment-lifecycle.json docs/MSG-001-A05-ATTACHMENT-LIFECYCLE.md scripts/audit-msg-001-a05-attachment-lifecycle.js scripts/test-msg-001-a05-attachment-lifecycle-runtime.js scripts/test-attachments-supabase-repository-contract.js package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f docs/validation/MSG-001-A05-ATTACHMENT-LIFECYCLE.json reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              assets/js/repositories/attachments-repository.js|assets/js/core/supabase-config.js|supabase/migrations/20260802220000_msg_a05_transaction_attachment_lifecycle_contract.sql|supabase/functions/self-service-operations/index.ts|supabase/functions/self-service-operations/operations.mjs|supabase/functions/transaction-attachment-cleanup/index.ts|config/msg-001-a05-attachment-lifecycle.json|docs/MSG-001-A05-ATTACHMENT-LIFECYCLE.md|docs/validation/MSG-001-A05-ATTACHMENT-LIFECYCLE.json|scripts/audit-msg-001-a05-attachment-lifecycle.js|scripts/test-msg-001-a05-attachment-lifecycle-runtime.js|scripts/test-attachments-supabase-repository-contract.js|package.json|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish canonical non-workflow artifacts
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$RUN_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(msg): harden transaction attachment lifecycle"
          git push origin HEAD:msg/msg-001-baseline-audit
