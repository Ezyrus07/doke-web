name: UX-HOME-002 Runtime Integration

on:
  push:
    branches:
      - ux/ux-home-002-more-services-filters
    paths:
      - '.github/workflows/ux-home-002-runtime-integration.yml'

permissions:
  contents: write

jobs:
  integrate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact Home runtime integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<button class="mini-tab is-active doke-tab-pill" type="button">Para você</button>',
                  '<button class="mini-tab is-active doke-tab-pill" type="button" data-more-services-intent="for-you" role="tab" aria-selected="true" aria-pressed="true" tabindex="0">Para você</button>'
              ),
              (
                  '<button class="mini-tab doke-tab-pill" type="button">Seguindo</button>',
                  '<button class="mini-tab doke-tab-pill" type="button" data-more-services-intent="following" role="tab" aria-selected="false" aria-pressed="false" tabindex="-1">Seguindo</button>'
              ),
              (
                  '<button class="mini-tab doke-tab-pill" type="button">Bem avaliados</button>',
                  '<button class="mini-tab doke-tab-pill" type="button" data-more-services-intent="top-rated" role="tab" aria-selected="false" aria-pressed="false" tabindex="-1">Bem avaliados</button>'
              ),
              (
                  '<button class="mini-tab doke-tab-pill" type="button">Com garantia</button>',
                  '<button class="mini-tab doke-tab-pill" type="button" data-more-services-intent="guaranteed" role="tab" aria-selected="false" aria-pressed="false" tabindex="-1">Com garantia</button>'
              ),
              (
                  '<button class="mini-tab doke-tab-pill" type="button">Disponíveis hoje</button>',
                  '<button class="mini-tab doke-tab-pill" type="button" data-more-services-intent="available-today" role="tab" aria-selected="false" aria-pressed="false" tabindex="-1">Disponíveis hoje</button>'
              ),
              (
                  '<button class="mini-tab doke-tab-pill" type="button">Novos</button>',
                  '<button class="mini-tab doke-tab-pill" type="button" data-more-services-intent="newest" role="tab" aria-selected="false" aria-pressed="false" tabindex="-1">Novos</button>'
              ),
              (
                  '<button class="filter-chip is-active doke-chip" type="button">Com garantia</button>',
                  '<button class="filter-chip doke-chip" type="button" aria-pressed="false">Com garantia</button>'
              ),
              (
                  '<script src="assets/js/core/list-state.js?v=20260511-data-ready-v1" defer></script>',
                  '<script src="assets/js/core/list-state.js?v=20260511-data-ready-v1" defer></script>\n'
                  '  <script src="assets/js/pages/home/more-services-state.js?v=20260807-ux-home-002-v1" defer></script>\n'
                  '  <script src="assets/js/pages/home/more-services-surface.js?v=20260807-ux-home-002-v1" defer></script>'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence for replacement, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          if text.count('data-more-services-intent=') != 6:
              raise SystemExit('Expected exactly six stable more-services intent attributes.')
          if text.count('assets/js/pages/home/more-services-state.js?v=20260807-ux-home-002-v1') != 1:
              raise SystemExit('more-services state script must be loaded exactly once.')
          if text.count('assets/js/pages/home/more-services-surface.js?v=20260807-ux-home-002-v1') != 1:
              raise SystemExit('more-services surface script must be loaded exactly once.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/pages/home/more-services-state.js
          node --check assets/js/pages/home/more-services-surface.js
          node scripts/test-ux-home-002-more-services-state.js
          node scripts/test-ux-home-002-more-services-surface.js
          node scripts/test-ux-home-001-rail-state.js
          node scripts/test-ux-home-001-index-controller.js
          node scripts/test-ux-home-001-favorites-surface.js
          node scripts/test-search-ux02-runtime.js
          node scripts/test-ux-search-001-search-experience.js
          git diff --check
          git diff --exit-code -- .github/workflows/ux-home-002-runtime-integration.yml || true

      - name: Commit canonical Home integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo '::error::Expected canonical index.html integration diff was not produced.'
            exit 1
          fi
          git config user.name 'doke-ci'
          git config user.email 'doke-ci@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: wire more-services runtime into Home'
          git push origin HEAD:ux/ux-home-002-more-services-filters
