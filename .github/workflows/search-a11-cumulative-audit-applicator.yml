          NODE

      - name: Validate patched audit syntax
        run: |
          node --check scripts/audit-favorites-authority-retirement.js
          node --check scripts/audit-search-server-contract.js
          node --check scripts/audit-search-ranking-signal-baseline.js
          node --check scripts/audit-search-ranking-v1.js
          node --check scripts/audit-search-ranked-rpc-v2.js
          node --check scripts/audit-search-observability-v2.js

      - name: Run patched cumulative audits
        run: |
          node scripts/audit-search-authority-baseline.js
          node scripts/audit-favorites-authority-retirement.js
          node scripts/audit-search-server-contract.js
          node scripts/audit-search-ranking-signal-baseline.js
          node scripts/audit-search-ranking-v1.js
          node scripts/audit-search-ranked-rpc-v2.js
          node scripts/audit-search-observability-v2.js

      - name: Commit cumulative compatibility update
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit-favorites-authority-retirement.js \
            scripts/audit-search-server-contract.js \
            scripts/audit-search-ranking-signal-baseline.js \
            scripts/audit-search-ranking-v1.js \
            scripts/audit-search-ranked-rpc-v2.js \
            scripts/audit-search-observability-v2.js
          git diff --cached --check
          git commit -m "Make SEARCH cumulative audits closure-aware"
          git push origin HEAD:"${HEAD_REF}"
