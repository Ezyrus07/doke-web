name: Doke SEARCH-A11 Cumulative Audit Applicator

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-a11-cumulative-audit-applicator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-search-a11-cumulative-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Make SEARCH-A02 through A09 closure-aware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Patch cumulative historical audits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: expected block not found`);
            fs.writeFileSync(file, source.replace(before, after), 'utf8');
          }

          replaceOnce(
            'scripts/audit-favorites-authority-retirement.js',
            `const matrix = JSON.parse(read(files.matrix));
          const search = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          assert(Boolean(search), 'SEARCH-001 is missing from the domain completion matrix');
          assert(search && search.maturity === (searchB02Reconciled ? 3 : 2), 'SEARCH maturity changed outside controlled reconciliation');
          assert(search && search.userFacingAuthority === 'hybrid', 'SEARCH user-facing authority must remain hybrid');
          assert(search && search.serverAuthority === (searchB02Reconciled ? 'partial' : 'contract_only'), 'SEARCH server authority changed outside controlled reconciliation');
          assert(search && search.securityGate === 'blocked', 'SEARCH-001 security gate must remain blocked');
          assert(search && search.productionGate === 'blocked', 'SEARCH-001 production gate must remain blocked');
          const blockers = (search && search.blockers || []).map((blocker) => blocker.id).sort();
          assert(
            same(blockers, searchB02Reconciled ? ['SEARCH-B03'] : searchB01Reconciled ? ['SEARCH-B02', 'SEARCH-B03'] : ['SEARCH-B01', 'SEARCH-B02', 'SEARCH-B03']),
            'SEARCH blockers changed outside controlled matrix reconciliation'
          );`,
            `const matrix = JSON.parse(read(files.matrix));
          const search = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          const a11EvidencePath = 'docs/validation/SEARCH-001-A11-FINAL-RECONCILIATION.json';
          const a11Evidence = exists(a11EvidencePath) ? JSON.parse(read(a11EvidencePath)) : null;
          const searchA11Complete = Boolean(
            a11Evidence &&
            a11Evidence.status === 'COMPLETE_STAGING_GOVERNANCE_RECONCILIATION' &&
            a11Evidence.closure &&
            a11Evidence.closure['SEARCH-B03'] === 'reconciled_removed_by_SEARCH-A11'
          );
          assert(Boolean(search), 'SEARCH-001 is missing from the domain completion matrix');
          assert(search && search.userFacingAuthority === 'hybrid', 'SEARCH user-facing authority must remain hybrid');
          assert(search && search.productionGate === 'blocked', 'SEARCH-001 production gate must remain blocked');
          const blockers = (search && search.blockers || []).map((blocker) => blocker.id).sort();
          if (searchA11Complete) {
            assert(search.maturity === 4, 'SEARCH completed maturity must be staging-operational level 4');
            assert(search.serverAuthority === 'canonical', 'SEARCH completed server authority must be canonical');
            assert(search.stagingEvidence === 'staging_operational', 'SEARCH completed staging evidence must be operational');
            assert(search.securityGate === 'partial', 'SEARCH completed security gate must remain partial');
            assert(same(blockers, []), 'SEARCH completed blocker set must be empty');
          } else {
            assert(search.maturity === (searchB02Reconciled ? 3 : 2), 'SEARCH maturity changed outside controlled reconciliation');
            assert(search.serverAuthority === (searchB02Reconciled ? 'partial' : 'contract_only'), 'SEARCH server authority changed outside controlled reconciliation');
            assert(search.securityGate === 'blocked', 'SEARCH-001 security gate must remain blocked before A11');
            assert(
              same(blockers, searchB02Reconciled ? ['SEARCH-B03'] : searchB01Reconciled ? ['SEARCH-B02', 'SEARCH-B03'] : ['SEARCH-B01', 'SEARCH-B02', 'SEARCH-B03']),
              'SEARCH blockers changed outside controlled matrix reconciliation'
            );
          }`
          );

          replaceOnce(
            'scripts/audit-favorites-authority-retirement.js',
            `console.log(searchB02Reconciled
            ? '[SEARCH-A02] SEARCH-B02 reconciliation preserves favorites as the canonical identity-scoped persistence foundation.'
            : searchB01Reconciled
              ? '[SEARCH-A02] SEARCH-B01 reconciliation preserves A02 as the canonical persistence foundation.'
              : '[SEARCH-A02] SEARCH-B01 remains open until every governed favorite surface is canonical.');`,
            `console.log(searchA11Complete
            ? '[SEARCH-A02] SEARCH-A11 closure preserves public.favorites as the canonical identity-scoped persistence authority.'
            : searchB02Reconciled
              ? '[SEARCH-A02] SEARCH-B02 reconciliation preserves favorites as the canonical identity-scoped persistence foundation.'
              : searchB01Reconciled
                ? '[SEARCH-A02] SEARCH-B01 reconciliation preserves A02 as the canonical persistence foundation.'
                : '[SEARCH-A02] SEARCH-B01 remains open until every governed favorite surface is canonical.');`
          );

          replaceOnce(
            'scripts/audit-search-server-contract.js',
            `const matrix = JSON.parse(read(files.matrix));
          const searchDomain = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          assert(Boolean(searchDomain), 'SEARCH-001 is missing from the domain matrix');
          const searchB02Reconciled = Boolean(a05Evidence && a05Evidence.status === 'COMPLETE' && a05Evidence.matrix && a05Evidence.matrix.searchB02 === 'reconciled_removed');
          assert(searchDomain && searchDomain.maturity === (searchB02Reconciled ? 3 : 2), 'SEARCH maturity changed outside controlled A05 reconciliation');
          assert(searchDomain && searchDomain.userFacingAuthority === 'hybrid', 'SEARCH user-facing authority must remain hybrid');
          assert(searchDomain && searchDomain.serverAuthority === (searchB02Reconciled ? 'partial' : 'contract_only'), 'SEARCH server authority changed outside controlled A05 reconciliation');
          assert(searchDomain && searchDomain.stagingEvidence === (searchB02Reconciled ? 'staging_canary' : 'local_e2e'), 'SEARCH staging evidence changed outside controlled A05 reconciliation');
          assert(searchDomain && searchDomain.securityGate === 'blocked', 'SEARCH security gate must remain blocked');
          assert(searchDomain && searchDomain.productionGate === 'blocked', 'SEARCH production gate must remain blocked');
          const blockers = (searchDomain && searchDomain.blockers || []).map((blocker) => blocker.id).sort();
          assert(same(blockers, searchB02Reconciled ? ['SEARCH-B03'] : ['SEARCH-B02', 'SEARCH-B03']), 'SEARCH blocker set changed outside controlled A05 reconciliation');`,
            `const matrix = JSON.parse(read(files.matrix));
          const searchDomain = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          const a11EvidencePath = 'docs/validation/SEARCH-001-A11-FINAL-RECONCILIATION.json';
          const a11Evidence = exists(a11EvidencePath) ? JSON.parse(read(a11EvidencePath)) : null;
          const searchA11Complete = Boolean(
            a11Evidence &&
            a11Evidence.status === 'COMPLETE_STAGING_GOVERNANCE_RECONCILIATION' &&
            a11Evidence.closure &&
            a11Evidence.closure['SEARCH-B03'] === 'reconciled_removed_by_SEARCH-A11'
          );
          assert(Boolean(searchDomain), 'SEARCH-001 is missing from the domain matrix');
          const searchB02Reconciled = Boolean(a05Evidence && a05Evidence.status === 'COMPLETE' && a05Evidence.matrix && a05Evidence.matrix.searchB02 === 'reconciled_removed');
          assert(searchDomain && searchDomain.userFacingAuthority === 'hybrid', 'SEARCH user-facing authority must remain hybrid');
          assert(searchDomain && searchDomain.productionGate === 'blocked', 'SEARCH production gate must remain blocked');
          const blockers = (searchDomain && searchDomain.blockers || []).map((blocker) => blocker.id).sort();
          if (searchA11Complete) {
            assert(searchDomain.maturity === 4, 'SEARCH completed maturity must be staging-operational level 4');
            assert(searchDomain.serverAuthority === 'canonical', 'SEARCH completed server authority must be canonical');
            assert(searchDomain.stagingEvidence === 'staging_operational', 'SEARCH completed staging evidence must be operational');
            assert(searchDomain.securityGate === 'partial', 'SEARCH completed security gate must remain partial');
            assert(same(blockers, []), 'SEARCH completed blocker set must be empty');
          } else {
            assert(searchDomain.maturity === (searchB02Reconciled ? 3 : 2), 'SEARCH maturity changed outside controlled A05 reconciliation');
            assert(searchDomain.serverAuthority === (searchB02Reconciled ? 'partial' : 'contract_only'), 'SEARCH server authority changed outside controlled A05 reconciliation');
            assert(searchDomain.stagingEvidence === (searchB02Reconciled ? 'staging_canary' : 'local_e2e'), 'SEARCH staging evidence changed outside controlled A05 reconciliation');
            assert(searchDomain.securityGate === 'blocked', 'SEARCH security gate must remain blocked before A11');
            assert(same(blockers, searchB02Reconciled ? ['SEARCH-B03'] : ['SEARCH-B02', 'SEARCH-B03']), 'SEARCH blocker set changed outside controlled A05 reconciliation');
          }`
          );

          replaceOnce(
            'scripts/audit-search-server-contract.js',
            `console.log(resultsActivated
            ? '[SEARCH-A04] The validated contract is consumed by the SEARCH-A05 candidate while matrix reconciliation remains blocked.'
            : stagingValidated
              ? '[SEARCH-A04] Migrations and transactional SQL validations passed in staging; UI activation remains deferred to SEARCH-A05.'
              : '[SEARCH-A04] Results renderer activation remains explicitly deferred pending controlled staging validation.');`,
            `console.log(searchA11Complete
            ? '[SEARCH-A04] The bounded contract remains preserved inside the completed SEARCH-A11 service-search authority.'
            : resultsActivated
              ? '[SEARCH-A04] The validated contract is consumed by the SEARCH-A05 candidate while matrix reconciliation remains blocked.'
              : stagingValidated
                ? '[SEARCH-A04] Migrations and transactional SQL validations passed in staging; UI activation remains deferred to SEARCH-A05.'
                : '[SEARCH-A04] Results renderer activation remains explicitly deferred pending controlled staging validation.');`
          );

          replaceOnce(
            'scripts/audit-search-ranking-signal-baseline.js',
            `ok(search&&search.maturity===3,'SEARCH maturity must remain 3');
          ok(search&&search.serverAuthority==='partial','SEARCH server authority must remain partial');
          ok(search&&search.stagingEvidence==='staging_canary','SEARCH staging evidence must remain staging_canary');
          ok(search&&search.securityGate==='blocked','SEARCH security gate must remain blocked');
          ok(search&&search.productionGate==='blocked','SEARCH production gate must remain blocked');
          ok((search&&search.blockers||[]).map((item)=>item.id).join(',')==='SEARCH-B03','SEARCH-B03 must remain the only blocker');`,
            `const a11Path='docs/validation/SEARCH-001-A11-FINAL-RECONCILIATION.json';const a11=fs.existsSync(path.join(root,a11Path))?JSON.parse(read(a11Path)):null;const searchA11Complete=Boolean(a11&&a11.status==='COMPLETE_STAGING_GOVERNANCE_RECONCILIATION'&&a11.closure&&a11.closure['SEARCH-B03']==='reconciled_removed_by_SEARCH-A11');
          ok(search&&search.userFacingAuthority==='hybrid','SEARCH user-facing authority must remain hybrid');
          ok(search&&search.productionGate==='blocked','SEARCH production gate must remain blocked');
          if(searchA11Complete){
            ok(search.maturity===4,'SEARCH completed maturity must be staging-operational level 4');
            ok(search.serverAuthority==='canonical','SEARCH completed server authority must be canonical');
            ok(search.stagingEvidence==='staging_operational','SEARCH completed staging evidence must be operational');
            ok(search.securityGate==='partial','SEARCH completed security gate must remain partial');
            ok((search.blockers||[]).length===0,'SEARCH completed blocker set must be empty');
          }else{
            ok(search&&search.maturity===3,'SEARCH maturity must remain 3 before A11');
            ok(search&&search.serverAuthority==='partial','SEARCH server authority must remain partial before A11');
            ok(search&&search.stagingEvidence==='staging_canary','SEARCH staging evidence must remain staging_canary before A11');
            ok(search&&search.securityGate==='blocked','SEARCH security gate must remain blocked before A11');
            ok((search&&search.blockers||[]).map((item)=>item.id).join(',')==='SEARCH-B03','SEARCH-B03 must remain the only blocker before A11');
          }`
          );

          replaceOnce(
            'scripts/audit-search-ranking-v1.js',
            `const matrix = JSON.parse(read(files.matrix));
          const search = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          assert(Boolean(search), 'SEARCH-001 is missing from the domain matrix');
          assert(search && search.maturity === 3, 'SEARCH-A07 cannot advance maturity before RPC ranking activation');
          assert(search && search.userFacingAuthority === 'hybrid', 'SEARCH-A07 must preserve hybrid user-facing authority');
          assert(search && search.serverAuthority === 'partial', 'SEARCH-A07 must preserve partial server authority');
          assert(search && search.stagingEvidence === 'staging_canary', 'SEARCH-A07 must preserve staging canary evidence');
          assert(search && search.securityGate === 'blocked', 'SEARCH-A07 security gate must remain blocked');
          assert(search && search.productionGate === 'blocked', 'SEARCH-A07 production gate must remain blocked');
          assert(same((search && search.blockers || []).map((item) => item.id).sort(), ['SEARCH-B03']), 'SEARCH-B03 must remain the only SEARCH blocker');`,
            `const matrix = JSON.parse(read(files.matrix));
          const search = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          const a11EvidencePath = 'docs/validation/SEARCH-001-A11-FINAL-RECONCILIATION.json';
          const a11Evidence = exists(a11EvidencePath) ? JSON.parse(read(a11EvidencePath)) : null;
          const searchA11Complete = Boolean(
            a11Evidence &&
            a11Evidence.status === 'COMPLETE_STAGING_GOVERNANCE_RECONCILIATION' &&
            a11Evidence.closure &&
            a11Evidence.closure['SEARCH-B03'] === 'reconciled_removed_by_SEARCH-A11'
          );
          assert(Boolean(search), 'SEARCH-001 is missing from the domain matrix');
          assert(search && search.userFacingAuthority === 'hybrid', 'SEARCH-A07 must preserve hybrid user-facing authority');
          assert(search && search.productionGate === 'blocked', 'SEARCH-A07 production gate must remain blocked');
          if (searchA11Complete) {
            assert(search.maturity === 4, 'SEARCH completed maturity must be staging-operational level 4');
            assert(search.serverAuthority === 'canonical', 'SEARCH completed server authority must be canonical');
            assert(search.stagingEvidence === 'staging_operational', 'SEARCH completed staging evidence must be operational');
            assert(search.securityGate === 'partial', 'SEARCH completed security gate must remain partial');
            assert(same((search.blockers || []).map((item) => item.id).sort(), []), 'SEARCH completed blocker set must be empty');
          } else {
            assert(search.maturity === 3, 'SEARCH-A07 cannot advance maturity before A11 reconciliation');
            assert(search.serverAuthority === 'partial', 'SEARCH-A07 must preserve partial server authority before A11');
            assert(search.stagingEvidence === 'staging_canary', 'SEARCH-A07 must preserve staging canary evidence before A11');
            assert(search.securityGate === 'blocked', 'SEARCH-A07 security gate must remain blocked before A11');
            assert(same((search.blockers || []).map((item) => item.id).sort(), ['SEARCH-B03']), 'SEARCH-B03 must remain the only SEARCH blocker before A11');
          }`
          );

          replaceOnce(
            'scripts/audit-search-ranking-v1.js',
            `console.log('[SEARCH-A07] Production remains unchanged and SEARCH-B03 remains open.');`,
            `console.log(searchA11Complete
            ? '[SEARCH-A07] Production remains unchanged; SEARCH-A11 reconciled SEARCH-B03 without activating ranking v1.'
            : '[SEARCH-A07] Production remains unchanged and SEARCH-B03 remains open.');`
          );

          replaceOnce(
            'scripts/audit-search-ranked-rpc-v2.js',
            `const matrix = JSON.parse(read(files.matrix));
          const search = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          assert(Boolean(search), 'SEARCH-001 is missing from the domain matrix');
          assert(search && search.maturity === 3, 'SEARCH-A08 cannot advance maturity before browser cutover and monitoring');
          assert(search && search.userFacingAuthority === 'hybrid', 'SEARCH-A08 must preserve hybrid user-facing authority');
          assert(search && search.serverAuthority === 'partial', 'SEARCH-A08 must preserve partial server authority');
          assert(search && search.stagingEvidence === 'staging_canary', 'SEARCH-A08 must preserve staging canary evidence');
          assert(search && search.securityGate === 'blocked', 'SEARCH-A08 security gate must remain blocked');
          assert(search && search.productionGate === 'blocked', 'SEARCH-A08 production gate must remain blocked');
          assert(same((search && search.blockers || []).map((item) => item.id).sort(), ['SEARCH-B03']), 'SEARCH-B03 must remain the only SEARCH blocker');`,
            `const matrix = JSON.parse(read(files.matrix));
          const search = (matrix.domains || []).find((domain) => domain.id === 'SEARCH-001');
          const a11EvidencePath = 'docs/validation/SEARCH-001-A11-FINAL-RECONCILIATION.json';
          const a11Evidence = exists(a11EvidencePath) ? JSON.parse(read(a11EvidencePath)) : null;
          const searchA11Complete = Boolean(
            a11Evidence &&
            a11Evidence.status === 'COMPLETE_STAGING_GOVERNANCE_RECONCILIATION' &&
            a11Evidence.closure &&
            a11Evidence.closure['SEARCH-B03'] === 'reconciled_removed_by_SEARCH-A11'
          );
          assert(Boolean(search), 'SEARCH-001 is missing from the domain matrix');
          assert(search && search.userFacingAuthority === 'hybrid', 'SEARCH-A08 must preserve hybrid user-facing authority');
          assert(search && search.productionGate === 'blocked', 'SEARCH-A08 production gate must remain blocked');
          if (searchA11Complete) {
            assert(search.maturity === 4, 'SEARCH completed maturity must be staging-operational level 4');
            assert(search.serverAuthority === 'canonical', 'SEARCH completed server authority must be canonical');
            assert(search.stagingEvidence === 'staging_operational', 'SEARCH completed staging evidence must be operational');
            assert(search.securityGate === 'partial', 'SEARCH completed security gate must remain partial');
            assert(same((search.blockers || []).map((item) => item.id).sort(), []), 'SEARCH completed blocker set must be empty');
          } else {
            assert(search.maturity === 3, 'SEARCH-A08 cannot advance maturity before A11 reconciliation');
            assert(search.serverAuthority === 'partial', 'SEARCH-A08 must preserve partial server authority before A11');
            assert(search.stagingEvidence === 'staging_canary', 'SEARCH-A08 must preserve staging canary evidence before A11');
            assert(search.securityGate === 'blocked', 'SEARCH-A08 security gate must remain blocked before A11');
            assert(same((search.blockers || []).map((item) => item.id).sort(), ['SEARCH-B03']), 'SEARCH-B03 must remain the only SEARCH blocker before A11');
          }`
          );

          replaceOnce(
            'scripts/audit-search-ranked-rpc-v2.js',
            `console.log('[SEARCH-A08] Browser remains on public.search_public_services_v1 while v2 is validated in staging.');`,
            `console.log(searchA11Complete
            ? '[SEARCH-A08] The v2 contract remains preserved after the controlled A10 browser cutover.'
            : '[SEARCH-A08] Browser remains on public.search_public_services_v1 while v2 is validated in staging.');`
          );

          replaceOnce(
            'scripts/audit-search-observability-v2.js',
            `const matrix = JSON.parse(read('config/domain-completion-matrix.json'));
          const search = matrix.domains.find((domain) => domain.id === 'SEARCH-001');
          assert(search?.maturity === 3 && search?.userFacingAuthority === 'hybrid' && search?.serverAuthority === 'partial', 'SEARCH matrix authority changed');
          assert(search?.securityGate === 'blocked' && search?.productionGate === 'blocked', 'SEARCH gates changed');
          assert(JSON.stringify((search?.blockers || []).map((item) => item.id).sort()) === JSON.stringify(['SEARCH-B03']), 'SEARCH-B03 not preserved');`,
            `const matrix = JSON.parse(read('config/domain-completion-matrix.json'));
          const search = matrix.domains.find((domain) => domain.id === 'SEARCH-001');
          const a11EvidencePath = 'docs/validation/SEARCH-001-A11-FINAL-RECONCILIATION.json';
