name: Doke Temporary MSG-A04 Publisher

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msg-a04-publisher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'msg/msg-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: 1033eb0118f3d23a70592a020a1ca118459a7702
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 30

      - name: Require immutable MSG-A04 generator ancestor
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor b486ffa96d85c968746e13f273969677c5f194dc HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Generate MSG-A04 repository-only package
        run: |
          node --check scripts/apply-msg-001-a04-temporary.js
          node scripts/apply-msg-001-a04-temporary.js
          cat > .github/workflows/msg-001-a04-realtime-publication-subscription-contract.yml <<'YAML'
          name: Doke MSG-A04 Realtime Publication Subscription Contract

          on:
            pull_request:
              paths:
                - 'assets/js/repositories/messages-realtime-repository.js'
                - 'assets/js/core/supabase-config.js'
                - 'mensagens.html'
                - 'supabase/migrations/20260802183100_msg_a04_realtime_publication_contract.sql'
                - 'config/msg-001-a04-realtime-publication-subscription-contract.json'
                - 'docs/MSG-001-A04-REALTIME-PUBLICATION-SUBSCRIPTION-CONTRACT.md'
                - 'docs/validation/MSG-001-A04-REALTIME-PUBLICATION-SUBSCRIPTION-CONTRACT.json'
                - 'scripts/audit-msg-001-a04-realtime-publication-subscription-contract.js'
                - 'scripts/test-msg-001-a04-realtime-publication-subscription-runtime.js'
                - 'config/domain-completion-matrix.json'
                - 'docs/DOMAIN-COMPLETION-MATRIX.md'
                - 'reports/generated/domain-completion-matrix-report.json'
                - 'package.json'
                - '.github/workflows/msg-001-a04-realtime-publication-subscription-contract.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            contract:
              runs-on: ubuntu-24.04
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci --ignore-scripts
                - name: Validate MSG-A04 Realtime contract
                  run: |
                    node --check assets/js/repositories/messages-realtime-repository.js
                    node --check scripts/audit-msg-001-a04-realtime-publication-subscription-contract.js
                    node --check scripts/test-msg-001-a04-realtime-publication-subscription-runtime.js
                    npm run audit:msg-001-a01-authority-baseline
                    npm run audit:msg-001-a02-canonical-authority-boundary
                    npm run test:msg-001-a02-canonical-authority-boundary
                    npm run audit:msg-001-a03-server-command-boundary
                    npm run test:msg-001-a03-server-command-boundary
                    npm run audit:msg-001-a04-realtime-publication-subscription-contract
                    npm run test:msg-001-a04-realtime-publication-subscription-runtime
                    npm run audit:messages-api-contract
                    npm run test:messages-supabase-repository-contract
                    npm run test:attachments-supabase-repository-contract
                    npm run audit:domain-completion-matrix
                    git diff --check
          YAML
          npm run write:domain-completion-matrix

      - name: Validate MSG-A04 and cumulative contracts
        run: |
          node --check assets/js/repositories/messages-realtime-repository.js
          node --check scripts/audit-msg-001-a04-realtime-publication-subscription-contract.js
          node --check scripts/test-msg-001-a04-realtime-publication-subscription-runtime.js
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run audit:msg-001-a03-server-command-boundary
          npm run test:msg-001-a03-server-command-boundary
          npm run audit:msg-001-a04-realtime-publication-subscription-contract
          npm run test:msg-001-a04-realtime-publication-subscription-runtime
          npm run audit:messages-api-contract
          npm run test:messages-supabase-repository-contract
          npm run test:attachments-supabase-repository-contract
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage canonical non-workflow artifacts only
        run: |
          git add assets/js/repositories/messages-realtime-repository.js assets/js/core/supabase-config.js mensagens.html supabase/migrations/20260802183100_msg_a04_realtime_publication_contract.sql config/msg-001-a04-realtime-publication-subscription-contract.json docs/MSG-001-A04-REALTIME-PUBLICATION-SUBSCRIPTION-CONTRACT.md scripts/audit-msg-001-a04-realtime-publication-subscription-contract.js scripts/test-msg-001-a04-realtime-publication-subscription-runtime.js package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f docs/validation/MSG-001-A04-REALTIME-PUBLICATION-SUBSCRIPTION-CONTRACT.json reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              assets/js/repositories/messages-realtime-repository.js|assets/js/core/supabase-config.js|mensagens.html|supabase/migrations/20260802183100_msg_a04_realtime_publication_contract.sql|config/msg-001-a04-realtime-publication-subscription-contract.json|docs/MSG-001-A04-REALTIME-PUBLICATION-SUBSCRIPTION-CONTRACT.md|docs/validation/MSG-001-A04-REALTIME-PUBLICATION-SUBSCRIPTION-CONTRACT.json|scripts/audit-msg-001-a04-realtime-publication-subscription-contract.js|scripts/test-msg-001-a04-realtime-publication-subscription-runtime.js|package.json|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish canonical non-workflow artifacts
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(msg): prepare participant-scoped Realtime contract"
          git push origin HEAD:msg/msg-001-baseline-audit
