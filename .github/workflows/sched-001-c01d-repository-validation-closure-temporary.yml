name: Doke Temporary SCHED-C01D Repository Validation Closure

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01d-repository-validation-closure-temporary.yml'

permissions:
  contents: write

concurrency:
  group: sched-001-c01d-repository-validation-closure-temporary
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 20

      - name: Require immutable source head and validated ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 30474a63c87d374e228e4b6520c11fffad72888c HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Reconcile completed repository validation
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');

          const configPath = 'config/sched-001-c01d-authenticated-browser-canary-readiness.json';
          const evidencePath = 'docs/validation/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.json';
          const docsPath = 'docs/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.md';
          const auditPath = 'scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js';
          const matrixPath = 'config/domain-completion-matrix.json';

          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.repositoryValidation = {
            status: 'passed',
            validatedHeadSha: '30474a63c87d374e228e4b6520c11fffad72888c',
            matrixVersion: '1.3.77',
            permanentGates: {
              c01dReadiness: { runId: 30761908387, jobId: 91533849967, conclusion: 'success' },
              c01eReadiness: { runId: 30761908161, jobId: 91533849460, conclusion: 'success' },
              c01cPresentation: { runId: 30761908428, jobId: 91533850005, conclusion: 'success' }
            },
            authorizedRemoteAttempt: {
              runId: 30761292305,
              jobId: 91532221365,
              conclusion: 'failed_closed',
              authorizationsConsumed: true,
              authorizationsReusable: false,
              completedAuthenticatedReads: 0,
              independentZeroResidueGroups: 13
            },
            remoteProofStatus: 'incomplete_requires_fresh_dual_authorization'
          };
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          fs.writeFileSync(evidencePath, JSON.stringify(config, null, 2) + '\n');

          let docs = fs.readFileSync(docsPath, 'utf8');
          if (!docs.includes('## Repository validation closure')) {
            docs += `\n## Repository validation closure\n\nThe single-navigation correction is repository-validated on immutable head \`30474a63c87d374e228e4b6520c11fffad72888c\`. The permanent C01D readiness gate passed in run \`30761908387\` / job \`91533849967\`, C01E readiness passed in run \`30761908161\` / job \`91533849460\`, and C01C presentation passed in run \`30761908428\` / job \`91533850005\`.\n\nThe authorized remote attempt remains fail-closed rather than successful: run \`30761292305\` completed zero authenticated staging reads, consumed both exact authorization phrases, and independently verified zero residue across thirteen fixture groups. Those phrases are not reusable.\n\nRepository validation is therefore complete, while remote proof remains separately blocked. Any new staging attempt requires a fresh exact C01E plus C01D authorization pair bound to one immutable head.\n`;
          }
          fs.writeFileSync(docsPath, docs);

          let audit = fs.readFileSync(auditPath, 'utf8');
          const marker = "assert.strictEqual(config.canonicalRuntime.allowedReadRoutesUseFallback, true);";
          const assertions = `${marker}\nassert.strictEqual(config.repositoryValidation.status, 'passed');\nassert.strictEqual(config.repositoryValidation.validatedHeadSha, '30474a63c87d374e228e4b6520c11fffad72888c');\nassert.strictEqual(config.repositoryValidation.matrixVersion, '1.3.77');\nassert.deepStrictEqual(config.repositoryValidation.permanentGates.c01dReadiness, { runId: 30761908387, jobId: 91533849967, conclusion: 'success' });\nassert.deepStrictEqual(config.repositoryValidation.permanentGates.c01eReadiness, { runId: 30761908161, jobId: 91533849460, conclusion: 'success' });\nassert.deepStrictEqual(config.repositoryValidation.permanentGates.c01cPresentation, { runId: 30761908428, jobId: 91533850005, conclusion: 'success' });\nassert.strictEqual(config.repositoryValidation.authorizedRemoteAttempt.authorizationsConsumed, true);\nassert.strictEqual(config.repositoryValidation.authorizedRemoteAttempt.authorizationsReusable, false);\nassert.strictEqual(config.repositoryValidation.authorizedRemoteAttempt.completedAuthenticatedReads, 0);\nassert.strictEqual(config.repositoryValidation.authorizedRemoteAttempt.independentZeroResidueGroups, 13);\nassert.strictEqual(config.repositoryValidation.remoteProofStatus, 'incomplete_requires_fresh_dual_authorization');\nassert(docs.includes('## Repository validation closure'));\nassert(docs.includes('Repository validation is therefore complete'));`;
          const occurrences = audit.split(marker).length - 1;
          if (occurrences !== 1) throw new Error(`Expected one audit marker, found ${occurrences}`);
          audit = audit.replace(marker, assertions);
          fs.writeFileSync(auditPath, audit);

          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          if (matrix.version !== '1.3.76') throw new Error(`Unexpected matrix version ${matrix.version}`);
          const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
          if (!sched) throw new Error('SCHED-001 missing from matrix');
          const completedAction = 'Validate SCHED-C01D single-navigation bootstrap repository-only; any new SCHED-C01E plus SCHED-C01D staging canary still requires a fresh exact authorization pair for one immutable head.';
          const actionIndex = sched.nextActions.indexOf(completedAction);
          if (actionIndex < 0) throw new Error('Completed repository-validation next action missing');
          sched.nextActions.splice(actionIndex, 1);
          const finalEvidence = 'SCHED-C01D single-navigation repository validation closed on head 30474a63c87d374e228e4b6520c11fffad72888c: permanent C01D, C01E and C01C gates passed in runs 30761908387, 30761908161 and 30761908428. Remote proof remains incomplete because authorized run 30761292305 completed zero authenticated reads; both exact phrases were consumed and independent cleanup verified zero residue across thirteen groups.';
          if (!sched.evidence.includes(finalEvidence)) sched.evidence.push(finalEvidence);
          matrix.version = '1.3.77';
          matrix.updatedAt = '2026-08-02T15:50:00-03:00';
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          npm run write:domain-completion-matrix

      - name: Validate closure and cumulative gates
        run: |
          node --check scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js
          node scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js
          node scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js --dry-run
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          npm run audit:sched-001-c01c-deterministic-frontend-presentation
          npm run test:sched-001-c01c-deterministic-frontend-presentation
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage only canonical closure artifacts
        run: |
          git add \
            config/sched-001-c01d-authenticated-browser-canary-readiness.json \
            docs/validation/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.json \
            docs/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.md \
            scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r path; do
            case "$path" in
              config/sched-001-c01d-authenticated-browser-canary-readiness.json|docs/validation/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.json|docs/SCHED-001-C01D-AUTHENTICATED-BROWSER-CANARY-READINESS.md|scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish repository validation closure
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin ord/ord-001-baseline-audit --depth=1
          test "$(git rev-parse origin/ord/ord-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(sched): close C01D repository validation"
          git push origin HEAD:ord/ord-001-baseline-audit
