name: Temporary SEARCH-A10 conservative matrix reconciliation

on:
  pull_request:
    branches:
      - 'cat/**'
    paths:
      - '.github/workflows/search-a10-matrix-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: doke-search-a10-matrix-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve A10 evidence without premature domain closure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const domain = matrix.domains.find((entry) => entry.id === 'SEARCH-001');
          if (!domain) throw new Error('SEARCH-001 domain not found');
          if (domain.maturity !== 4 || domain.serverAuthority !== 'canonical' || (domain.blockers || []).length !== 0) {
            throw new Error('Unexpected SEARCH-001 promoted precondition');
          }

          domain.maturity = 3;
          domain.userFacingAuthority = 'hybrid';
          domain.serverAuthority = 'partial';
          domain.stagingEvidence = 'staging_canary';
          domain.securityGate = 'blocked';
          domain.productionGate = 'blocked';
          domain.blockers = [{
            id: 'SEARCH-B03',
            severity: 'medium',
            category: 'analytics',
            description: 'Ranking signals and anti-manipulation controls are technically implemented, but cumulative governance audits still require a dedicated closure reconciliation.',
            targetPhase: 'Fase 15'
          }];
          domain.nextActions = [
            'Execute SEARCH-A11 as a dedicated cumulative-governance reconciliation before removing SEARCH-B03 or promoting domain maturity.',
            'Keep search-rank-v0 active; ranking v1 remains installed and inactive until a separately authorized activation sublot.',
            'Keep workers, publications, suggestions and browser-local search history explicitly governed by their own controlled domains and sublots.',
            'Keep production blocked until the global security, analytics and launch gates are satisfied.'
          ];

          fs.writeFileSync(path, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE

      - name: Regenerate canonical matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Audit regenerated matrix
        run: npm run audit:domain-completion-matrix

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Publish conservative SEARCH-A10 matrix
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Preserve SEARCH-B03 for dedicated governance closure'
          git push origin HEAD:${TARGET_BRANCH}
