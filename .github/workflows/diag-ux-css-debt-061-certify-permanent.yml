name: Doke UX-CSS-DEBT-061 Permanent Certification

on:
  push:
    branches:
      - diag/ux-css-debt-061-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      PERMANENT_BRANCH: ux/ux-css-debt-061-action-modal-compaction
      PERMANENT_SHA: 10a9a51cfd0a96e7c6a56eb71cf44452ddb8813f
      PARENT_SHA: 1f2c971a2b74455dc752e68d680f8a4231d01cab
      PARENT_PARENT_SHA: 5a93b7fdf0b61e91d6dcd3867ae98d97f94d7eb9
      TREE_SHA: 3783fa1dce707e102475b90e2fec88c5c68c2f66
      TARGET_FILE: assets/css/components/overlays/action-modal-system.css
      PARENT_TARGET_BLOB: 94227b1313fa55a56cbea342e327553b7280c6d7
      PERMANENT_TARGET_BLOB: 4b53d4c1835a89eb5885b17404a81daef54123a0
      EXPECTED_SHA256: a62b12a97be17c70c7d46a59c402227a2a130386202894ce96773b87e7b8f6db
      EXPECTED_BYTES: 10917
      COMMUNITY_IMPORTER: assets/css/pages/comunidade/entry-create-modals.css
      COMMUNITY_IMPORTER_BLOB: 3307a97e05474a9f4f3bfee769a21ea3b06848f0
      MESSAGES_IMPORTER: assets/css/pages/messaging-runtime-chat.css
      MESSAGES_IMPORTER_BLOB: 225939d37e493d4f7d3ae3349e75866a5196a94b
      ORDERS_IMPORTER: assets/css/pages/pedidos-runtime-page.css
      ORDERS_IMPORTER_BLOB: 26a650eaa1212aaff334bed383c630251659aac4
      COMMUNITY_HTML_BLOB: aeb03acca897a4949e02699c55af5c24a9f8d6f5
      MESSAGES_HTML_BLOB: 7259ddb38a68e911af815e2d7e628ac6d70dc945
      ORDERS_HTML_BLOB: bc97ee8dc0f08cc6f3f894aad2654c95323f9274
      BROWSER_RUN: 31987021659
      BROWSER_JOB: 95263682139
      CANDIDATE_RUN: 31987148709
      CANDIDATE_JOB: 95264012506
      PROMOTION_RUN: 31987324424
      PROMOTION_JOB: 95264468783
    steps:
      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PERMANENT_SHA }}
          fetch-depth: 0

      - name: Exact permanent identity and full-history guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$PERMANENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA^")" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$PERMANENT_TARGET_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$PERMANENT_TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = "1"
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE")" = $'0\t6\t'"$TARGET_FILE"
          git diff --quiet "$PARENT_SHA" HEAD -- '*.html' 'assets/js/**' package.json package-lock.json docs
          git diff --check "$PARENT_SHA" HEAD
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PERMANENT_SHA"
          echo "IDENTITY PASS|permanent=$PERMANENT_SHA|parent=$PARENT_SHA|tree=$TREE_SHA|parentBlob=$PARENT_TARGET_BLOB|targetBlob=$PERMANENT_TARGET_BLOB|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|commits=1|files=1|additions=0|deletions=6|fullHistory=1|branch=$remote_sha"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Independent reconstruction and runtime authority identity
        shell: bash
        run: |
          set -euo pipefail
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/ux061-parent.css
          cp "$TARGET_FILE" /tmp/ux061-permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const parent=fs.readFileSync('/tmp/ux061-parent.css','utf8'), permanent=fs.readFileSync('/tmp/ux061-permanent.css','utf8');
          const lines=parent.split('\n');
          const rows=new Map([[182,'  gap: 16px;'],[242,'  background: var(--doke-action-modal-soft);'],[258,'  min-height: 88px;'],[269,'  border-color: transparent;'],[271,'  box-shadow: var(--doke-visual-focus-ring);'],[307,'  background: var(--modal-surface-bg-soft);']]);
          for(const [n,e] of rows){const a=(lines[n-1]||'').replace(/\r$/,'');if(a!==e)throw new Error(`parent row drift ${n}: ${JSON.stringify(a)}`)}
          const rebuilt=lines.filter((_,i)=>!rows.has(i+1)).join('\n');
          if(rebuilt!==permanent)throw new Error('independent reconstruction differs from permanent');
          const hash=crypto.createHash('sha256').update(rebuilt).digest('hex');if(hash!==process.env.EXPECTED_SHA256)throw new Error(`hash ${hash}`);
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d)}return{declarations:ds,dead}}
          const p=parse(parent),q=parse(permanent);if(p.declarations.length!==270||p.dead.length!==6)throw new Error(`parent ${p.declarations.length}/${p.dead.length}`);if(q.declarations.length!==264||q.dead.length!==0)throw new Error(`permanent ${q.declarations.length}/${q.dead.length}`);if(new Set(p.dead.map(x=>x.selector)).size!==5)throw new Error('families');const identical=p.dead.filter(x=>x.value===x.winner.value&&x.important===x.winner.important).length;if(identical!==1)throw new Error(`identical ${identical}`);if(p.dead.some(x=>x.important||x.winner.important))throw new Error('unexpected important');
          console.log(`RECONSTRUCTION PASS|parent=270/6|permanent=264/0|families=5|identical=1|changed=5|byteIdentical=1|sha256=${hash}`);
          NODE
          test "$(git rev-parse "HEAD:$COMMUNITY_IMPORTER")" = "$COMMUNITY_IMPORTER_BLOB"
          test "$(git rev-parse "HEAD:$MESSAGES_IMPORTER")" = "$MESSAGES_IMPORTER_BLOB"
          test "$(git rev-parse "HEAD:$ORDERS_IMPORTER")" = "$ORDERS_IMPORTER_BLOB"
          test "$(git rev-parse "HEAD:comunidade.html")" = "$COMMUNITY_HTML_BLOB"
          test "$(git rev-parse "HEAD:mensagens.html")" = "$MESSAGES_HTML_BLOB"
          test "$(git rev-parse "HEAD:pedidos.html")" = "$ORDERS_HTML_BLOB"
          grep -q 'components/overlays/action-modal-system.css' "$COMMUNITY_IMPORTER"
          grep -q 'components/overlays/action-modal-system.css' "$MESSAGES_IMPORTER"
          grep -q 'components/overlays/action-modal-system.css' "$ORDERS_IMPORTER"
          grep -q 'community-request-modal' comunidade.html
          grep -q 'community-code-modal' comunidade.html
          echo "RUNTIME AUTHORITY PASS|communityImporter=$COMMUNITY_IMPORTER_BLOB|messagesImporter=$MESSAGES_IMPORTER_BLOB|ordersImporter=$ORDERS_IMPORTER_BLOB|communityHtml=$COMMUNITY_HTML_BLOB|messagesHtml=$MESSAGES_HTML_BLOB|ordersHtml=$ORDERS_HTML_BLOB|browserTransfer=$BROWSER_RUN/$BROWSER_JOB|candidateTransfer=$CANDIDATE_RUN/$CANDIDATE_JOB|promotion=$PROMOTION_RUN/$PROMOTION_JOB|families=5/5|viewports=7|states=4|samplesPerSide=532|runtimeDiffs=0|overflow=0|zeroMatchConsumers=2|stateWaitMs=500|criteriaRelaxed=0"

      - name: Generate responsive baseline from exact parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA"
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          git checkout --detach "$PERMANENT_SHA"
          test "$(git rev-parse HEAD)" = "$PERMANENT_SHA"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "PARENT BASELINE PASS|parent=$PARENT_SHA|permanent=$PERMANENT_SHA|fullHistory=1"

      - name: Responsive contract on exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-responsive-contract.js | tee /tmp/ux061-responsive.log
          grep -q 'Checks: 893' /tmp/ux061-responsive.log
          grep -q 'Failures: 0' /tmp/ux061-responsive.log
          grep -q 'Skips: 277' /tmp/ux061-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and permanent canonical residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$PERMANENT_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});
          function deadCount(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0;for(const f of active){const p=deadCount(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++}}
          const guards=[['assets/css/components/overlays/action-modal-system.css',264,0,'061'],['assets/css/components/overlays/financial-modal-system.css',645,0,'060'],['assets/css/components/media-lightbox.css',280,0,'059'],['assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css',216,0,'058'],['assets/css/components/chat-composer.css',125,0,'057'],['assets/css/components/before-after-workers-preview/mobile-comment-sheets.css',302,0,'056'],['assets/css/patterns/settings-shell.css',104,0,'055'],['assets/css/components/before-after-workers-preview/publication-light-modal.css',75,0,'054']];
          if(files!==13||total!==69||highDead!==0)throw new Error(`residual ${files}/${total}/${highDead}`);for(const [f,d,dead,label] of guards){const p=deadCount(meta.get(f).text);if(p.decl!==d||p.dead!==dead)throw new Error(`${label} ${p.decl}/${p.dead}`)}
          console.log('CANONICAL RESIDUAL PASS|active=401|high=37|files=13|dead=69|highDead=0|061=264/0|060=645/0|059=280/0|058=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          test "$(git rev-parse HEAD)" = "$PERMANENT_SHA"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e; npm audit --json >/tmp/ux061-audit.json; code=$?; set -e
          node <<'NODE'
          const a=require('/tmp/ux061-audit.json'),v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);
          NODE
          echo "npmAuditExit=$code"

      - name: Final exact full-history restore and branch identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PARENT_SHA"
          git clean -fdx
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          test -z "$(git status --porcelain)"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PERMANENT_SHA"
          echo "CERTIFICATION RESTORE PASS|local=$PARENT_SHA|parentParent=$PARENT_PARENT_SHA|fullHistory=1|permanentBranch=$remote_sha|productMutation=0"
