name: COM-B02BS Repository-Only Attachment-Capable Target Implementation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.js'
      - 'config/com-b02bs-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.json'
      - 'scripts/test-com-b02bs-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.js'
      - '.github/workflows/com-b02bs-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: 5e94b134262f7137fc2027ad5363b4c551c7ef3d
      PREDECESSOR_TREE: f7979ba82586686b6f55ff2b7c8f9bea8ed2cb15
      B02BR_MODULE_BLOB: 0aaf21b98933e6c71d3c5ce7aa0318f983b8064b
      B02BR_CONFIG_BLOB: 0292ef1060dbdabaf9900ef9c07d966a8271dbab
      B02BR_TEST_BLOB: c3d8da2823861940805db007f5c77c62ddf16e64
      B02BR_WORKFLOW_BLOB: 4305b8c0191dddfcfe5905e2c5c58d1288d6879e
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.js
      CONFIG: config/com-b02bs-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.json
      TEST: scripts/test-com-b02bs-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.js
      WORKFLOW: .github/workflows/com-b02bs-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-implementation.yml

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze predecessor lineage and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR_HEAD"
          expected="$(printf '%s\n' "$TARGET" "$CONFIG" "$TEST" "$WORKFLOW" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.js)" = "$B02BR_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.json)" = "$B02BR_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.js)" = "$B02BR_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.yml)" = "$B02BR_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02BS
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'executable-operation-method-references-binding' "$TARGET"
          ! grep -E 'Object\.definePropert(y|ies)\(' "$TARGET"
          ! grep -E '\.(call|apply)[[:space:]]*\(|Reflect\.apply[[:space:]]*\(' "$TARGET"
          ! grep -E 'implementationFactoryInvokedByBoundary[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'attachmentCapableTargetMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|attachmentAppliedToEntryContainerInstance[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableOperationMethodsInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Domain Completion Matrix and governance
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

      - name: Diff hygiene
        run: |
          git diff --check "$PREDECESSOR_HEAD" HEAD
