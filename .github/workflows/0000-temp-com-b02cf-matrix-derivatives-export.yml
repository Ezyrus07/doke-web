name: 0000 TEMP COM-B02CF Matrix Derivatives Export

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cf-matrix-derivatives-export.yml'

permissions:
  contents: read

jobs:
  export-matrix-derivatives:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 7a674db2fea15eff9ee2210aaffc682f1c792439
      EXPECTED_PARENT_TREE: 5657838c8dab400dee28ab9c411cdc736965e2c1
      EXECUTION_RUN_ID: '32725256676'
      EXECUTION_JOB_ID: '97424982777'
      HELPER_PATH: .github/workflows/0000-temp-com-b02cf-matrix-derivatives-export.yml
      EXECUTOR_PATH: .github/workflows/0000-temp-com-b02cf-authorized-single-use-register-resolve-execution.yml
      EXECUTOR_BLOB: 4cd6c3332a4dcf73f3ec95963a145d742905a59f
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-resolve-execution.js
      TARGET_BLOB: fe54e170a68f346aaa6049ba26acd930ba10579b
      CONFIG: config/com-b02cf-repository-only-deterministic-synthetic-continuation-state-register-resolve-execution.json
      CONFIG_BLOB: c48e15c789796b43374abeeb699b163d56211db3
      TEST: scripts/test-com-b02cf-repository-only-deterministic-synthetic-continuation-state-register-resolve-execution.js
      TEST_BLOB: 4f2768955bcae98e8327e58d543f8b4edd20e562
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      B02CE_CONFIG: config/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.json
      B02CE_CONFIG_BLOB: c50a24779cb81d767be4d8fb5aadda5a06c1dd20
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact exporter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze consumed execution proof and recovery scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_PARENT_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          actual="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$actual" = "$HELPER_PATH"
          test "$EXECUTION_RUN_ID" = '32725256676'
          test "$EXECUTION_JOB_ID" = '97424982777'
          test "$(git rev-parse HEAD:$EXECUTOR_PATH)" = "$EXECUTOR_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$B02CE_CONFIG)" = "$B02CE_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          grep -F '"status": "AUTHORIZED_SINGLE_USE_EXECUTION_PENDING"' "$CONFIG"
          grep -F '"singleUse": true' "$CONFIG"
          grep -F '"reusable": false' "$CONFIG"
          grep -F '"registryReleaseAuthority": false' "$CONFIG"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static-only B02CF recovery preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          grep -F 'registry.set(key, storedState);' "$TARGET"
          grep -F 'const resolvedState = registry.get(key);' "$TARGET"
          ! grep -F 'registry.delete(' "$TARGET" "$TEST"
          ! grep -F -- '--execute' "$HELPER_PATH"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Materialize canonical Matrix derivatives without reexecution
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- "$MATRIX_SOURCE"
          expected="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          mkdir -p artifact/docs artifact/reports/generated
          cp "$MATRIX_MD" artifact/docs/DOMAIN-COMPLETION-MATRIX.md
          cp "$MATRIX_REPORT" artifact/reports/generated/domain-completion-matrix-report.json
          echo "MATRIX_MD_BLOB=$(git hash-object "$MATRIX_MD")" >> "$GITHUB_ENV"
          echo "MATRIX_REPORT_BLOB=$(git hash-object "$MATRIX_REPORT")" >> "$GITHUB_ENV"

      - name: Report exact derivative identities
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix-md-blob=$MATRIX_MD_BLOB"
          echo "matrix-report-blob=$MATRIX_REPORT_BLOB"
          test "$(git hash-object artifact/docs/DOMAIN-COMPLETION-MATRIX.md)" = "$MATRIX_MD_BLOB"
          test "$(git hash-object artifact/reports/generated/domain-completion-matrix-report.json)" = "$MATRIX_REPORT_BLOB"

      - name: Upload exact Matrix derivatives only
        uses: actions/upload-artifact@v4
        with:
          name: com-b02cf-matrix-derivatives
          path: |
            artifact/docs/DOMAIN-COMPLETION-MATRIX.md
            artifact/reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
