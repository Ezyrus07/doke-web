name: UX-FILTERS-002 Static Wiring

on:
  push:
    branches:
      - ux/ux-filters-002-removable-chips
    paths:
      - '.github/workflows/ux-filters-002-static-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/ux-filters-002-removable-chips
          fetch-depth: 0

      - name: Add static CSS and JavaScript references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('resultados.html')
          source = path.read_text(encoding='utf-8')

          css = '  <link rel="stylesheet" href="assets/css/pages/search-filter-presentation.css?v=20260805-ux-filters-002-v1">'
          css_anchor = '  <link rel="stylesheet" href="assets/css/pages/search-results.css?v=20260718-seller-identity-v1">'
          if css not in source:
              if css_anchor not in source:
                  raise SystemExit('CSS anchor not found')
              source = source.replace(css_anchor, css_anchor + '\n' + css, 1)

          script = '    <script src="assets/js/pages/search-filter-presentation.js?v=20260805-ux-filters-002-v1"></script>'
          script_anchor = '    <script src="assets/js/pages/search-data.js?v=20260505-publications-3up-v2"></script>'
          if script not in source:
              if script_anchor not in source:
                  raise SystemExit('Script anchor not found')
              source = source.replace(script_anchor, script_anchor + '\n' + script, 1)

          if source.index(script_anchor) >= source.index(script):
              raise SystemExit('Presentation script must load after search-data.js')
          results_script = 'assets/js/pages/search-results.js'
          if source.index(script) >= source.index(results_script):
              raise SystemExit('Presentation script must load before search-results.js')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove temporary workflow and publish wiring
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ux-filters-002-static-wiring.yml
          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add resultados.html .github/workflows/ux-filters-002-static-wiring.yml
          git diff --cached --check
          git commit -m 'UX-FILTERS-002 wire static presentation assets'
          git push origin HEAD:ux/ux-filters-002-removable-chips
