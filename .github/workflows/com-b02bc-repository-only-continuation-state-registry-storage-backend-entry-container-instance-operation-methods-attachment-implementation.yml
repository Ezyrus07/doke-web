name: COM-B02BC Repository-Only Entry Container Instance Operation Methods Attachment Implementation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.yml'
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js'
      - 'config/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.json'
      - 'scripts/test-com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: e92b59926af1462a39bcd2c8306b0dcc1732d70e
      PREDECESSOR_TREE: 301b46f746a2d8404280ddfefe41f7cc693cb9f1
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      B02BB_MODULE_BLOB: 7caa4a78a72488fb8b3d6249a72936aa4a703cf2
      B02BB_CONFIG_BLOB: f1c2087f9748629d580710147c6627d708c89d6c
      B02BC_MODULE_BLOB: 43bde8dbed4a82de957b06fb45e3678b31a43ea2
      B02BC_CONFIG_BLOB: b41a6c984746d1212e071c063f5ad497f455c27f
      B02BC_TEST_BLOB: 712d9489c620cdcb42e3d775b41fd7ab0ff75c62
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact B02BC candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze predecessor lineage and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR_HEAD"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js \
            config/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.json \
            scripts/test-com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-contract.js)" = "$B02BB_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-contract.json)" = "$B02BB_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js)" = "$B02BC_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.json)" = "$B02BC_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js)" = "$B02BC_TEST_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic B02BC and hard blocks
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js
          TEST=scripts/test-com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|entryContainerMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableMethodReferenceMaterialized[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check "$PREDECESSOR_HEAD" HEAD