name: COM-B03C R5H Sanitized Evidence Recorder Binding Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=884615cd05a8ff215d4304cd2a424f9723be0912
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-sanitized-evidence-recorder.js)" = "11c61cd8666a7929819dc02ea3d367ff4834c85d"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.json)" = "11ca808f80e3cae310b966b39e20d86e1dba113b"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.yml)" = "94f3e5da876f6954be4974e18365731668df49c7"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-descriptor-boundary.json)" = "beffe2201e6c4b338fc397e4c876e1471c2cb4dd"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-harness.js)" = "723d33aea011a28766b819fa823aad82f341aba3"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed sanitized-evidence-recorder binding assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-sanitized-evidence-recorder.js)" = "11c61cd8666a7929819dc02ea3d367ff4834c85d"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.json)" = "11ca808f80e3cae310b966b39e20d86e1dba113b"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.yml)" = "94f3e5da876f6954be4974e18365731668df49c7"
          node - <<'NODE'
          const b=require('./config/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary.json');
          const r=require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-sanitized-evidence-recorder.js');
          const fields=['caseId','predicate','expectedClassification','joinSubscribed','terminalStatusClassification','extensionValueClassification','cleanupCompleted','zeroResidue','rawErrorCaptured'];
          if(b.contractId!=='com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-boundary-v1')throw new Error('BOUNDARY_CONTRACT_DRIFT');
          if(r.CONTRACT_ID!=='com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-repository-implementation-v1')throw new Error('RECORDER_CONTRACT_DRIFT');
          if(r.EVIDENCE_FIELDS.join('|')!==fields.join('|'))throw new Error('EVIDENCE_FIELDS_DRIFT');
          const s=b.sanitizedEvidenceRecorderBinding;
          if(s.sanitizedEvidenceRecorderBindingDescriptorDefined!==true||s.sanitizedEvidenceRecorderImplementationPresent!==true||s.sanitizedEvidenceRecorderBindingDefined!==true||s.sanitizedEvidenceRecorderBound!==true||s.bindingKind!=='repository_owned_immutable_inert_module'||s.localRepositoryBindingOnly!==true)throw new Error('RECORDER_BINDING_STATE_DRIFT');
          if(s.recorderModuleBlob!=='11c61cd8666a7929819dc02ea3d367ff4834c85d'||s.bindingBoundaryHead!==null||s.bindingBoundaryHeadResolvedByCertifierSubjectHead!==true)throw new Error('RECORDER_BINDING_IDENTITY_DRIFT');
          for(const k of ['sanitizedEvidenceRecorder','evidenceSink','evidencePersistenceTarget'])if(s[k]!==null)throw new Error(`CONCRETE_RECORDER_VALUE_FORBIDDEN:${k}`);
          for(const k of ['evidenceWriteImplemented','evidencePersistenceImplemented','transportBound','cleanupVerifierBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority'])if(s[k]!==false)throw new Error(`RECORDER_AUTHORITY_DRIFT:${k}`);
          if(b.remainingDependentPortState.length!==1||b.remainingDependentPortState[0].slotId!=='cleanup_verifier'||b.remainingDependentPortState[0].descriptorDefined!==false||b.remainingDependentPortState[0].bound!==false)throw new Error('NEXT_PORT_DRIFT');
          const g=b.governance;
          for(const k of ['evidencePersistenceImplemented','cleanupVerifierBound','transportBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'])if(g[k]!==false)throw new Error(`GOVERNANCE_DRIFT:${k}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-sanitized-evidence-recorder-binding-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for sanitized evidence recorder binding" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
