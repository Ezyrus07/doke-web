name: COM-B03C R5H Realtime Client Factory Binding Descriptor Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified synthetic-identity-lifecycle binding lineage
        shell: bash
        run: |
          set -euo pipefail
          parent=feb50f13e3dc312deffeadb3d8814f3fca98be17
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$parent^{tree}")" = "178c077d8e8274603d0a6d3bc9e4a953e862b17b"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.json)" = "9525ec59debc3f9595f6cdcda9e5bd3a79881ff3"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.yml)" = "1419c9b921a8bca843e41662333729f2a32e9521"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-synthetic-identity-lifecycle.js)" = "ebc2e17cc27721c14c06d068de7889d119953e5c"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js)" = "27c1e962f0da3dbf2aaf7f122fa79211d5483dc2"

      - name: Exact repository-only materialization scope
        shell: bash
        run: |
          set -euo pipefail
          parent=feb50f13e3dc312deffeadb3d8814f3fca98be17
          descriptor=config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary.json
          certifier=.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary.yml
          initial="$(printf '%s\n' "$certifier" "$descriptor" | sort)"
          final="$(printf '%s\n' "$certifier" "$descriptor" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          if [ "$actual" != "$initial" ] && [ "$actual" != "$final" ]; then
            printf 'Unexpected scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Static descriptor-only no-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          descriptor=config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary.json
          if grep -En 'https?://|process\.env|secrets\.|@supabase|createClient|\.channel\(|\.subscribe\(|fetch\(|WebSocket|projectRef|projectUrl|apiKey|service_role|anonKey|SUPABASE_|\.auth\.admin|createUser\(|deleteUser\(|signUp\(' "$descriptor"; then
            echo 'Runtime client, transport, endpoint, Auth/Admin or secret-source syntax is forbidden in realtime-client-factory descriptor boundary' >&2
            exit 1
          fi

      - name: Semantic realtime-client-factory binding descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const d = require('./config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary.json');
          const p = require('./config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.json');
          const rt = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js');
          const w = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js');

          const environment='doke-web-staging';
          const resource='doke-web-staging-realtime-messages-extension-classification-probe';
          const fingerprint='sha256:2ab84b52b269ef4c9556c9818f4355d466bce9f735878213b49d9840cdd00fbf';
          const fields=['factoryContractId','factoryModulePath','factoryModuleBlob','bindingBoundaryHead'];
          const allTrue=(o,keys,label)=>keys.forEach(k=>{if(o[k]!==true)throw new Error(`${label}:${k}`)});
          const allFalse=(o,keys,label)=>keys.forEach(k=>{if(o[k]!==false)throw new Error(`${label}:${k}`)});

          if (d.contractId !== 'com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-descriptor-boundary-v1') throw new Error('CONTRACT_DRIFT');
          const rc=d.repositoryContext;
          if (rc.parentCertifiedSyntheticIdentityLifecycleBindingHead !== 'feb50f13e3dc312deffeadb3d8814f3fca98be17' || rc.parentCertifiedSyntheticIdentityLifecycleBindingTree !== '178c077d8e8274603d0a6d3bc9e4a953e862b17b' || rc.parentCertificationRun !== 31960147891 || rc.parentCertificationJob !== 95196769878) throw new Error('PARENT_CERTIFICATION_DRIFT');
          if (rc.parentBoundaryBlob !== '9525ec59debc3f9595f6cdcda9e5bd3a79881ff3' || rc.parentCertifierBlob !== '1419c9b921a8bca843e41662333729f2a32e9521' || rc.parentLifecycleModuleBlob !== 'ebc2e17cc27721c14c06d068de7889d119953e5c') throw new Error('PARENT_BLOB_DRIFT');
          if (d.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || d.functionalCheckpoint.r5iCreated !== false || d.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          if (!rt.DEPENDENT_PORTS.includes('realtime_client_factory')) throw new Error('RUNTIME_TARGET_PORT_MISSING');
          const port=w.PORT_CONTRACTS.find(x=>x.id==='realtime_client_factory');
          if (!port || port.responsibility!=='future_fresh_realtime_client_factory_binding') throw new Error('WIRING_PORT_DRIFT');

          const pb=p.syntheticIdentityLifecycleBinding;
          if (pb.syntheticIdentityLifecycleBindingDefined!==true || pb.identityLifecycleBound!==true || pb.lifecycleModuleBlob!=='ebc2e17cc27721c14c06d068de7889d119953e5c') throw new Error('PARENT_IDENTITY_BINDING_DRIFT');
          ['syntheticIdentityReference','syntheticIdentityMaterial','syntheticIdentity'].forEach(k=>{if(pb[k]!==null)throw new Error(`PARENT_IDENTITY_MATERIAL:${k}`)});
          allFalse(pb,['identityReferenceResolutionImplemented','identityProvisioningImplemented','identityDeletionImplemented','identityMaterializationImplemented','credentialReadImplemented','transportBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','authIdentityLifecycleAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority'],'PARENT_AUTHORITY');

          const schema=d.canonicalRealtimeClientFactorySchema;
          if(schema.slotId!=='realtime_client_factory' || schema.schemaOrigin!=='repository_owned_dependent_port_contract' || schema.requiredFields.join('|')!==fields.join('|')) throw new Error('SCHEMA_DRIFT');
          allTrue(schema.constraints,['repositoryOwnedModuleRequired','repositoryRelativeModulePathRequired','immutableModuleBlobRequired','separateCertifiedBindingBoundaryRequired','freshClientPerObservationRequired','clientDisposalAfterEachObservationRequired','remoteClientInstantiationForbidden','endpointForbidden','transportBindingForbidden','credentialReadForbidden','identityLifecycleMutationForbidden','processEnvironmentReadForbidden','remoteDependencyImportForbidden','networkCallForbidden','realtimeSubscriptionForbidden'],'SCHEMA_CONSTRAINT');

          const b=d.realtimeClientFactoryBindingDescriptor;
          if(b.slotId!=='realtime_client_factory' || b.realtimeClientFactoryBindingDescriptorDefined!==true || b.schemaOnly!==true || b.requiredFields.join('|')!==fields.join('|')) throw new Error('DESCRIPTOR_DRIFT');
          allFalse(b,['realtimeClientFactoryBindingDefined','realtimeClientFactoryBound','clientInstantiationImplemented','clientDisposalImplemented','transportBound'],'DESCRIPTOR_MUST_REMAIN_FALSE');
          ['factoryContractId','factoryModulePath','factoryModuleBlob','bindingBoundaryHead','realtimeClientFactory','runtimeClient','networkEndpoint'].forEach(k=>{if(b[k]!==null)throw new Error(`CONCRETE_FACTORY_FORBIDDEN:${k}`)});
          allTrue(b,['repositoryOwnedModuleRequired','repositoryRelativeModulePathRequired','immutableModuleBlobRequired','futureBindingBoundaryRequired','futureBindingBoundaryMustBeSeparateCertifiedBoundary','futureBindingBoundaryMustReferenceThisDescriptorCertifiedHead','futureBindingBoundaryMayBindOnlyRealtimeClientFactorySlot','futureBindingBoundaryMustProvideRepositoryOwnedModuleContract','futureBindingBoundaryMustProvideRepositoryRelativeModulePath','futureBindingBoundaryMustProvideImmutableModuleBlob','futureBindingBoundaryMustPreserveAllUpstreamBindings','futureBindingBoundaryMustPreserveFreshClientPerObservationContract','futureBindingBoundaryMustPreserveClientDisposalAfterEachObservationContract','futureBindingBoundaryMayNotInstantiateRemoteClient','futureBindingBoundaryMayNotIntroduceEndpoint','futureBindingBoundaryMayNotBindTransport','futureBindingBoundaryMayNotReadCredential','futureBindingBoundaryMayNotProvisionIdentity','futureBindingBoundaryMayNotDeleteIdentity','futureBindingBoundaryMayNotMaterializeIdentity','futureBindingBoundaryMayNotReadProcessEnvironment','futureBindingBoundaryMayNotImportRemoteDependency','futureBindingBoundaryMayNotOpenRealtimeChannel','futureBindingBoundaryMayNotSubscribeRealtime','futureBindingBoundaryMayNotBindEvidenceRecorder','futureBindingBoundaryMayNotBindCleanupVerifier','futureBindingBoundaryMayNotGrantStagingReadAuthority','futureBindingBoundaryMayNotGrantStagingMutationAuthority','futureBindingBoundaryMayNotGrantNetworkAuthority','futureBindingBoundaryMayNotGrantRealtimeSubscriptionAuthority','futureBindingBoundaryMayNotGrantAuthIdentityLifecycleAuthority','futureBindingBoundaryMayNotGrantRemoteExecutionAuthority'],'FUTURE_BINDING_FAIL_CLOSED');

          const u=d.upstreamBindings;
          if(u.runtimeAdapter.bound!==true || u.runtimeAdapter.bindingBoundaryHead!=='e2809ba029930eac76729c9ae5f1496919a500de') throw new Error('UPSTREAM_RUNTIME_ADAPTER_DRIFT');
          if(u.targetEnvironment.bound!==true || u.targetEnvironment.bindingBoundaryHead!=='10ddea2bb7a4ded9bf1b7654585092a396f885cb' || u.targetEnvironment.stableEnvironmentIdentifier!==environment || u.targetEnvironment.production!==false) throw new Error('UPSTREAM_ENV_DRIFT');
          if(u.targetResource.bound!==true || u.targetResource.bindingBoundaryHead!=='e297b7f921c72864471e123a3d628a7f3e2dd3fd' || u.targetResource.stableResourceIdentifier!==resource || u.targetResource.resourceScopeFingerprint!==fingerprint) throw new Error('UPSTREAM_RESOURCE_DRIFT');
          if(u.credentialProvider.bound!==true || u.credentialProvider.bindingBoundaryHead!=='8ebf9cce39ded220df4a361b82145884041048bb' || u.credentialProvider.providerModuleBlob!=='6419696544fb9e1906df92e3591e93efcf04b826' || u.credentialProvider.credentialReadImplemented!==false) throw new Error('UPSTREAM_PROVIDER_DRIFT');
          if(u.syntheticIdentityLifecycle.bound!==true || u.syntheticIdentityLifecycle.bindingBoundaryHead!=='feb50f13e3dc312deffeadb3d8814f3fca98be17' || u.syntheticIdentityLifecycle.lifecycleModuleBlob!=='ebc2e17cc27721c14c06d068de7889d119953e5c' || u.syntheticIdentityLifecycle.identityProvisioningImplemented!==false || u.syntheticIdentityLifecycle.identityDeletionImplemented!==false || u.syntheticIdentityLifecycle.identityMaterializationImplemented!==false) throw new Error('UPSTREAM_IDENTITY_DRIFT');

          const slots=['realtime_client_factory','sanitized_evidence_recorder','cleanup_verifier'];
          if(d.remainingDependentPorts.map(x=>x.slotId).join('|')!==slots.join('|')) throw new Error('PORT_SET_DRIFT');
          d.remainingDependentPorts.forEach((x,i)=>{if(x.bound!==false || x.concreteValuePresent!==false || x.descriptorDefined!==(i===0))throw new Error(`PORT_STATE_DRIFT:${x.slotId}`)});

          Object.entries(d.concreteState).forEach(([k,v])=>{if(v!==null)throw new Error(`CONCRETE_STATE_FORBIDDEN:${k}`)});

          const f=d.futureBindingBoundaryRequirements;
          allTrue(f,['repositoryOnlyBoundaryRequired','exactDescriptorCertifiedHeadRequired','realtimeClientFactorySlotOnly','requiredFieldsMustRemainExact','allUpstreamBindingsMustRemainExact','credentialMaterialMustRemainAbsent','credentialReadAuthorityMustRemainFalse','identityReferenceMustRemainAbsent','identityMaterialMustRemainAbsent','identityProvisioningAuthorityMustRemainFalse','identityDeletionAuthorityMustRemainFalse','identityMaterializationAuthorityMustRemainFalse','freshClientPerObservationContractRequired','clientDisposalAfterEachObservationContractRequired','remoteClientInstantiationMustRemainFalse','endpointMustRemainAbsent','transportMustRemainUnbound','sanitizedEvidenceRecorderMustRemainUnbound','cleanupVerifierMustRemainUnbound','processEnvironmentReadMustRemainAbsent','remoteDependencyLoadAuthorityMustRemainFalse','stagingReadAuthorityMustRemainFalse','stagingMutationAuthorityMustRemainFalse','networkAuthorityMustRemainFalse','realtimeSubscriptionAuthorityMustRemainFalse','authIdentityLifecycleAuthorityMustRemainFalse','executionEntrypointMustRemainAbsent','executionWorkflowMustRemainAbsent','remoteExecutionAuthorityMustRemainFalse'],'FUTURE_REQUIREMENT');
          if(f.exactTargetEnvironmentStableIdentifier!==environment || f.exactTargetResourceStableIdentifier!==resource || f.exactTargetResourceScopeFingerprint!==fingerprint) throw new Error('FUTURE_TARGET_DRIFT');

          const a=d.authorizationState;
          if(a.genericContinuationGrantsRemoteAuthority!==false || a.priorR5dAuthorizationReusable!==false || a.priorR5dReceiptReusable!==false || a.priorR5dTriggerReusable!==false) throw new Error('AUTH_REUSE_DRIFT');
          const c=d.causalState;
          allFalse(c,['exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'],'CAUSAL_DRIFT');

          const g=d.governance;
          allTrue(g,['repositoryOnlyDefinition','runtimeAdapterBound','targetEnvironmentBound','targetResourceBound','credentialProviderBound','syntheticIdentityLifecycleBindingDefined','identityLifecycleBound','realtimeClientFactoryBindingDescriptorDefined'],'GOV_TRUE');
          allFalse(g,['identityProvisioningImplemented','identityDeletionImplemented','identityMaterializationImplemented','realtimeClientFactoryBindingDefined','realtimeClientFactoryBound','remoteClientInstantiationImplemented','sanitizedEvidenceRecorderBound','cleanupVerifierBound','transportBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority'],'GOV_FALSE');
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check feb50f13e3dc312deffeadb3d8814f3fca98be17...HEAD
