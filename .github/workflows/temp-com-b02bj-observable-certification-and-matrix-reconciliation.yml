name: TEMP COM-B02BJ Observable Certification and Matrix Reconciliation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02bj-observable-certification-and-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  certify-reconcile-and-finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: 8caef3cd2842920c35a9555279f4716cbafc5f91
      CANDIDATE_TREE: a2664561d69576e6795aef6a3b4464a33e24b971
      PREDECESSOR_HEAD: bf7a883abf3c0fb95696fcdd6609bd4972494116
      PREDECESSOR_TREE: 4a61f7206262041943860f67f1de9d318fb1c343
      B02BJ_MODULE_BLOB: 99d804721a5d350dcf8e59dd935937e24561e094
      B02BJ_CONFIG_BLOB: 96b496fde2d79b9c5514e6f231d82f6fa52c9ec4
      B02BJ_TEST_BLOB: 2abfd460bd894ab7f32360f5032edde8dcdd5f9a
      B02BJ_WORKFLOW_BLOB: 417e7a1a07f6a1e73fea58ba4fb76bbcf63c3b53
      B02BI_MODULE_BLOB: 65de02785f97a05783415f6c80b7cc404ea4f3ad
      B02BI_CONFIG_BLOB: 0c886afa40d0d64224166f578a3f32d0be1373e4
      B02BH_MODULE_BLOB: c9ba2a6549ce116db504b85bf38e100251be1da2
      B02BC_MODULE_BLOB: 43bde8dbed4a82de957b06fb45e3678b31a43ea2
      B02BB_CONTRACT_BLOB: 7caa4a78a72488fb8b3d6249a72936aa4a703cf2
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02bj-observable-certification-and-matrix-reconciliation.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-methods-implementation.js
      CONFIG: config/com-b02bj-repository-only-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-methods-implementation.json
      TEST: scripts/test-com-b02bj-repository-only-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-methods-implementation.js
      CANONICAL_WORKFLOW: .github/workflows/com-b02bj-repository-only-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-methods-implementation.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze candidate lineage and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          for commit in $(git rev-list --first-parent "$CANDIDATE_HEAD"..HEAD); do
            test "$(git diff-tree --no-commit-id --name-only -r "$commit" | sort -u)" = "$TEMP_PATH"
          done
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$CANDIDATE_HEAD^")" = "$PREDECESSOR_HEAD"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          expected="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02BJ_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02BJ_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02BJ_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02BJ_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment-readiness.js)" = "$B02BI_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bi-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment-readiness.json)" = "$B02BI_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment-to-instance-binding.js)" = "$B02BH_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js)" = "$B02BC_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-contract.js)" = "$B02BB_CONTRACT_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02BJ candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          grep -q 'function registerOpaqueContinuationState' "$TARGET"
          grep -q 'function resolveOpaqueContinuationState' "$TARGET"
          grep -q 'function releaseOpaqueContinuationState' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'new[[:space:]]+(Map|Set|WeakMap|WeakSet)\b|crypto\.|randomUUID\(' "$TARGET"
          ! grep -E '\.(set|get|delete|clear)\(' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|attachmentAppliedToEntryContainerInstance[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableMethodReferenceMaterialized[[:space:]]*:[[:space:]]*true|executableMethodReferencesCaptured[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Reconcile Matrix only for the exact stale-derived blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npm run audit:domain-completion-matrix 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output"
            stale='- docs/DOMAIN-COMPLETION-MATRIX.md is stale; run npm run write:domain-completion-matrix'
            test "$(printf '%s\n' "$output" | grep -Fxc -- "$stale")" -eq 1
            unexpected="$(printf '%s\n' "$output" | grep '^- ' | grep -Fvx -- "$stale" || true)"
            test -z "$unexpected"
            npm run write:domain-completion-matrix
          fi
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          changed="$(git diff --name-only | sort)"
          if [ -n "$changed" ]; then
            expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
            test "$changed" = "$expected"
          fi

      - name: Matrix governance and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node "$TEST"
          git diff --check "$PREDECESSOR_HEAD" HEAD
          git diff --check
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Commit permanent derived state and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- reports/generated/domain-completion-matrix-report.json
          git rm -- "$TEMP_PATH"
          git commit -m "ci(com): finalize B02BJ repository-only certification [run ${GITHUB_RUN_ID}]"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02bj-'
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Certify permanent B02BJ tree
        shell: bash
        run: |
          set -euo pipefail
          expected4="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          expected6="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json "$TEST" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected4" || test "$actual" = "$expected6"
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02BJ_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02BJ_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02BJ_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02BJ_WORKFLOW_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02bj-'

      - name: Fast-forward branch only if TEMP head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
