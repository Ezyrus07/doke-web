name: Doke UX-QA-DEBT-002 Visible Actions Candidate

on:
  push:
    branches:
      - diag/ux-qa-debt-002-pedidos-visible-actions-candidate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 12e55ca25db38971c5ab5de12845839ca1a684a7
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard diagnostic-only branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = ".github/workflows/diag-ux-qa-debt-002-visible-actions-candidate.yml"
          git diff --check "${PARENT_SHA}"...HEAD

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Write client and professional runtime comparator
        shell: bash
        run: |
          cat > /tmp/agenda-runtime.js <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2];
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:['ignore','pipe','pipe'],env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const viewports=[
            {name:'1366x768',width:1366,height:768},
            {name:'1280x802',width:1280,height:802},
            {name:'820x1180',width:820,height:1180},
            {name:'608x926',width:608,height:926},
            {name:'390x844',width:390,height:844}
          ];
          async function main(){
            await sleep(700);
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const result={};
            for(const role of ['client','professional']){
              result[role]={};
              for(const vp of viewports){
                const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
                const page=await context.newPage();
                await page.addInitScript(({role})=>{
                  const user={id:role==='client'?'client_qa2':'professional_qa2',role,name:'QA'};
                  const orders=[{id:'order_qa2',clientId:role==='client'?user.id:'client_other',professionalId:role==='professional'?user.id:'professional_other',providerName:'Studio QA',serviceTitle:'Serviço QA',status:'pending',viewerRole:role,createdAt:'2026-06-28T10:00:00.000Z'}];
                  localStorage.setItem('doke.auth.session.v1',JSON.stringify({user}));
                  localStorage.setItem('doke.orders.local.v1',JSON.stringify(orders));
                  localStorage.setItem('doke.orders',JSON.stringify(orders));
                },{role});
                await page.goto('http://127.0.0.1:5500/pedidos.html',{waitUntil:'domcontentloaded'});
                await page.waitForFunction(expected=>document.body.dataset.ordersAudience===expected,role,{timeout:10000});
                await page.waitForFunction(()=>document.querySelectorAll('[data-orders-agenda-toggle]').length===2,{timeout:10000});
                result[role][vp.name]=await page.evaluate(()=>{
                  const snap=selector=>[...document.querySelectorAll(selector)].map((node,index)=>{
                    const cs=getComputedStyle(node),r=node.getBoundingClientRect();
                    return {
                      index,
                      hidden:Boolean(node.hidden),
                      ariaHidden:node.getAttribute('aria-hidden'),
                      display:cs.display,
                      visibility:cs.visibility,
                      rect:{x:+r.x.toFixed(3),y:+r.y.toFixed(3),width:+r.width.toFixed(3),height:+r.height.toFixed(3)},
                      color:cs.color,
                      backgroundColor:cs.backgroundColor,
                      borderTopWidth:cs.borderTopWidth,
                      borderTopColor:cs.borderTopColor,
                      borderRadius:cs.borderTopLeftRadius,
                      padding:cs.padding,
                      gap:cs.gap,
                      flex:cs.flex,
                      className:node.className
                    };
                  });
                  return {agenda:snap('[data-orders-agenda-toggle]'),filters:snap('[data-orders-filter-toggle]'),selects:snap('[data-orders-select-toggle]')};
                });
                await context.close();
              }
            }
            await browser.close();
            fs.writeFileSync(out,JSON.stringify(result,null,2));
          }
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Capture exact parent runtime and responsive baseline
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/agenda-runtime.js /tmp/parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/parent-responsive.json

      - name: Require parent E2E to reproduce exact known defect
        shell: bash
        run: |
          set +e
          node node_modules/@playwright/test/cli.js test tests/e2e/pedidos-role-composition.spec.js > /tmp/parent-e2e.log 2>&1
          code=$?
          set -e
          cat /tmp/parent-e2e.log
          test "$code" = "1"
          grep -F 'Expected: true' /tmp/parent-e2e.log
          grep -F 'Received: false' /tmp/parent-e2e.log
          grep -F "node.hidden && getComputedStyle(node).display === 'none'" /tmp/parent-e2e.log

      - name: Apply visible-only geometry candidate in workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'assets/css/layout/header.css': [
              (
                'body:is(.orders-page-shell, .notifications-page-shell).has-global-header .app-header.home-side-meta .page-header-context__action',
                'body:is(.orders-page-shell, .notifications-page-shell).has-global-header .app-header.home-side-meta .page-header-context__action:not([hidden])',
                1,
              ),
            ],
            'assets/css/pages/pedidos/orders-command-center.css': [
              (
                'body.orders-page-shell .app-header--orders .orders-page-actions .page-header-context__action',
                'body.orders-page-shell .app-header--orders .orders-page-actions .page-header-context__action:not([hidden])',
                1,
              ),
              (
                'body.orders-page-shell .app-header--orders .page-header-context__action',
                'body.orders-page-shell .app-header--orders .page-header-context__action:not([hidden])',
                1,
              ),
            ],
            'assets/css/pages/pedidos/tablet-rail-contract.css': [
              (
                'body.orders-page-shell.has-global-header .app-header.app-header--orders .orders-page-actions .page-header-context__action',
                'body.orders-page-shell.has-global-header .app-header.app-header--orders .orders-page-actions .page-header-context__action:not([hidden])',
                1,
              ),
            ],
          }

          for file, rules in replacements.items():
            path=Path(file)
            text=path.read_text()
            for old,new,expected in rules:
              count=text.count(old)
              print(f'{file}: {old} -> occurrences={count}')
              if count != expected:
                raise SystemExit(f'unexpected selector count in {file}: expected {expected}, got {count}: {old}')
              text=text.replace(old,new)
            path.write_text(text)
          PY

          expected=$'assets/css/layout/header.css\nassets/css/pages/pedidos/orders-command-center.css\nassets/css/pages/pedidos/tablet-rail-contract.css'
          test "$(git diff --name-only)" = "$expected"
          test -z "$(git diff --name-only -- '*.html' '*.js')"
          git diff --check
          git diff --stat
          git diff -- assets/css/layout/header.css assets/css/pages/pedidos/orders-command-center.css assets/css/pages/pedidos/tablet-rail-contract.css

      - name: Require Pedidos role composition E2E green
        shell: bash
        run: node node_modules/@playwright/test/cli.js test tests/e2e/pedidos-role-composition.spec.js

      - name: Preserve exact responsive contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -F 'Checks: 893' /tmp/responsive.log
          grep -F 'Failures: 0' /tmp/responsive.log
          grep -F 'Skips: 277' /tmp/responsive.log

      - name: Prove client closure and professional geometry parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/agenda-runtime.js /tmp/candidate-runtime.json
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const parent=JSON.parse(fs.readFileSync('/tmp/parent-runtime.json','utf8'));
          const cand=JSON.parse(fs.readFileSync('/tmp/candidate-runtime.json','utf8'));
          for(const vp of Object.keys(parent.professional)){
            assert.deepStrictEqual(cand.professional[vp],parent.professional[vp],`professional drift ${vp}`);
          }
          for(const vp of Object.keys(parent.client)){
            assert.deepStrictEqual(cand.client[vp].filters,parent.client[vp].filters,`client filter drift ${vp}`);
            assert.deepStrictEqual(cand.client[vp].selects,parent.client[vp].selects,`client select drift ${vp}`);
            assert.strictEqual(cand.client[vp].agenda.length,2,`agenda count ${vp}`);
            for(const node of cand.client[vp].agenda){
              assert.strictEqual(node.hidden,true,`hidden ${vp} #${node.index}`);
              assert.strictEqual(node.ariaHidden,'true',`aria-hidden ${vp} #${node.index}`);
              assert.strictEqual(node.display,'none',`display ${vp} #${node.index}`);
              assert.strictEqual(node.rect.width,0,`width ${vp} #${node.index}`);
              assert.strictEqual(node.rect.height,0,`height ${vp} #${node.index}`);
            }
          }
          console.log('Visible-only action authority runtime proof: PASS');
          NODE

      - name: Run structural and governance audits
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/css-conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          echo '--- final inventory ---'
          grep -E 'CSS files scanned|Definitions|Conflicting class/property pairs' /tmp/css-conflicts.log || true
          grep -E 'active legacy/remediation css|active legacy/remediation js|high risk active css' /tmp/legacy.log || true

      - name: Emit exact candidate hashes and diff
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/css/layout/header.css \
            assets/css/pages/pedidos/orders-command-center.css \
            assets/css/pages/pedidos/tablet-rail-contract.css
          do
            echo "FILE=$file"
            echo "PARENT_SHA256=$(git show "${PARENT_SHA}:$file" | sha256sum | awk '{print $1}')"
            echo "CANDIDATE_SHA256=$(sha256sum "$file" | awk '{print $1}')"
            git diff --numstat "${PARENT_SHA}" -- "$file"
          done
