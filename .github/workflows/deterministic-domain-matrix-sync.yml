# Temporary AUTH-A11 bundle applicator. Restore the canonical read-only workflow after use.
name: Doke Deterministic Domain Matrix Sync

on:
  push:
    branches:
      - 'auth/**'

permissions:
  contents: read

concurrency:
  group: doke-auth-a11-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-auth-a11:
    name: Apply and validate AUTH-A11 bundle
    if: ${{ startsWith(github.event.head_commit.message, 'Apply AUTH-A11 bundle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct AUTH-A11 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/auth-a11-bundle/part-* | base64 --decode > /tmp/auth-a11-bundle.tar.gz
          tar -xzf /tmp/auth-a11-bundle.tar.gz -C .
          rm -rf .github/auth-a11-bundle

      - name: Validate AUTH-A11 authority contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/services/auth-service.js
          node --check assets/js/services/auth-session-authority.js
          node --check assets/js/services/profile-service.js
          node --check assets/js/services/onboarding-service.js
          node --check assets/js/contracts/identity-profile-contract.js
          node --check tests/auth/test-auth-profile-identity-authority-runtime.js
          node scripts/audit-auth-session-contracts.js
          node scripts/test-auth-canonical-session-runtime.js
          npm run audit:identity-profile-contract
          node scripts/test-profile-write-contract.js
          node scripts/test-auth-username-onboarding-contract.js
          node scripts/test-self-service-edge-authority-contract.js
          node scripts/test-self-service-operations-edge-runtime.mjs
          npm run audit:auth-real-contract
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git diff --check

      - name: Publish AUTH-A11 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'AUTH-A11 bundle produced no changes.'
            exit 1
          fi
          git commit -m 'Implement AUTH-A11 provider-reconciled identity authority'
          git push origin HEAD:${{ github.ref_name }}
