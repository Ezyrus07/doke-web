# Temporary AUTH-A11 profile-facade retirement applicator. Restore canonical matrix sync after use.
name: Doke Deterministic Domain Matrix Sync

on:
  push:
    branches:
      - 'auth/**'

permissions:
  contents: read

concurrency:
  group: doke-auth-a11-profile-facade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-auth-a11-profile-facade:
    name: Apply AUTH-A11 profile facade retirement
    if: ${{ startsWith(github.event.head_commit.message, 'Apply AUTH-A11 profile facade retirement') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply profile facade retirement
        run: node scripts/apply-auth-a11-profile-facade-retirement.js

      - name: Validate AUTH-A11 profile facade slice
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/services/auth-service.js
          node --check assets/js/services/auth-session-authority.js
          node --check scripts/audit-auth-session-contracts.js
          node --check tests/auth/test-auth-session-lifecycle-runtime.js
          node scripts/audit-auth-session-contracts.js
          node scripts/test-auth-canonical-session-runtime.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'assets/js/services/auth-service.js' \
            'assets/js/services/auth-session-authority.js' \
            'docs/DOMAIN-COMPLETION-MATRIX.md' \
            'scripts/audit-auth-session-contracts.js' \
            'tests/auth/test-auth-session-lifecycle-runtime.js' | sort)"
          test "$actual" = "$expected"

      - name: Publish AUTH-A11 profile facade slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/js/services/auth-service.js \
            assets/js/services/auth-session-authority.js \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            scripts/audit-auth-session-contracts.js \
            tests/auth/test-auth-session-lifecycle-runtime.js
          git commit -m 'Retire AUTH-A11 profile mutation facade from auth'
          git push origin HEAD:${{ github.ref_name }}
