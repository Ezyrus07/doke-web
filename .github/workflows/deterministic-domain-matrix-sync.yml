# Temporary AUTH-A12A reconciliation bridge is materialized; execute the restricted document update.
name: Doke Deterministic Domain Matrix Sync

on:
  workflow_dispatch:
  push:
    branches:
      - MAIN
      - main
      - master
      - 'auth/**'
      - 'sec/**'
      - 'domain/**'

permissions:
  contents: read

concurrency:
  group: doke-domain-matrix-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    name: Reconcile AUTH-A12 contracts and matrix
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.head_commit.message, 'Request AUTH-A12 contract reconciliation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile active identity contract index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ACTIVE-CONTRACTS-INDEX.md')
          text = path.read_text(encoding='utf-8')
          old = """## Sprint 12B

- `assets/js/contracts/identity-profile-contract.js` — contrato runtime de identidade/perfil.
- `docs/AUTH-INTEGRATION-CONTRACT.md` — endpoints `/users/me` e `/profiles/me`, DTO de identidade e regras de sessão enriquecida.
"""
          new = """## Sprint 12B — registro histórico reconciliado no AUTH-A12A

- `assets/js/contracts/identity-profile-contract.js` — contrato runtime atual de identidade/perfil, fixado em Supabase e nas ações autenticadas de `self-service-operations`.
- `docs/AUTH-INTEGRATION-CONTRACT.md` — DTOs atuais, autoridade reconciliada de perfil/configurações/onboarding e isolamento dos endpoints históricos `/users/me` e `/profiles/me` ao diagnóstico CLI-only.
"""
          if text.count(old) != 1:
              raise SystemExit('Sprint 12B contract block is missing or ambiguous.')
          text = text.replace(old, new)
          old_cli = "- O contrato continua `authProvider=api`, `dataProvider=mock`, com chamadas restritas a `/auth/login`, `/auth/session`, `/users/me` e `/profiles/me`."
          new_cli = "- O contrato diagnóstico CLI-only continua `authProvider=api`, `dataProvider=mock`, com chamadas restritas a `/auth/login`, `/auth/session`, `/users/me` e `/profiles/me`; ele não descreve nem seleciona o provider do navegador."
          if text.count(old_cli) != 1:
              raise SystemExit('Sprint 27 CLI-only contract line is missing or ambiguous.')
          path.write_text(text.replace(old_cli, new_cli), encoding='utf-8')
          PY

      - name: Generate and validate deterministic matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'docs/ACTIVE-CONTRACTS-INDEX.md' 'docs/DOMAIN-COMPLETION-MATRIX.md')"
          test "$actual" = "$expected"

      - name: Publish reconciled documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ACTIVE-CONTRACTS-INDEX.md docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m 'Reconcile AUTH-A12 active contracts and matrix'
          git push origin HEAD:${{ github.ref_name }}
