name: Doke UX CSS Important 006 Runtime Delta R12
on:
  push:
    branches: [diag/ux-css-important-006-runtime-delta-r12]
    paths: [.github/workflows/diag-ux-css-important-006-runtime-delta-r12.yml]
permissions: {contents: write}
jobs:
  delta:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 24b49e5693f24621a1024b94c33c8ba6e18b12c0
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      TARGET_BLOB: 896730319ae0852caca8a0f93cd1507608dd9894
      DIAG_BRANCH: diag/ux-css-important-006-runtime-delta-r12
      RESULT_FILE: .diagnostics/ux-css-important-006-runtime-delta-r12.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: delta
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/delta.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"; git checkout "$TARGET_SHA" -- .; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts; npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const parent=fs.readFileSync(f,'utf8');let s=parent.replace(/\s*!important\b/g,'');function restore(sel,ps){const re=new RegExp(esc(sel)+'\\s*\\{','g'),all=[...s.matchAll(re)].map(m=>{const b=s.indexOf('{',m.index),e=s.indexOf('}',b);return{b,e,block:s.slice(b+1,e)}}),hits=all.filter(x=>ps.every(p=>new RegExp(`(^|\\n)\\s*${esc(p)}\\s*:`,'m').test(x.block)));if(hits.length!==1)throw Error(`restore ${sel} ${hits.length}`);let block=hits[0].block;for(const p of ps)block=block.replace(new RegExp(`(^|\\n)(\\s*${esc(p)}\\s*:[^;]+);`,'m'),'$1$2 !important;');s=s.slice(0,hits[0].b+1)+block+s.slice(hits[0].e)}restore('body.home-index-shell .featured-services,\n  body.home-index-shell .before-after,\n  body.home-index-shell .short-videos',['overflow']);restore('body.home-index-shell .doke-search-panel__form',['position','overflow']);restore('body.home-index-shell .home-search-hero__field::before,\n  body.home-index-shell .home-search-hero__field::after',['display']);restore('body.home-index-shell .featured-services .content-rail',['overflow']);const b=Buffer.from(s),h=crypto.createHash('sha256').update(b).digest('hex');if(h!=='36ae6b9a99e438a28950b7f78ac616197b01785fedf11f4aeccd03d395e0351f'||(s.match(/!important\b/g)||[]).length!==5)throw Error('identity');fs.writeFileSync('/tmp/candidate.css',s);console.log(`CANDIDATE|sha256=${h}|important=23->5|bytes=${b.length}`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs');const {chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/candidate.css','utf8'),browser=await chromium.launch({headless:true}),states=[[359,'default'],[359,'rail'],[380,'default'],[380,'rail'],[560,'default'],[560,'rail'],[561,'default']];const selectors=['.featured-services','.short-videos','.featured-services .content-rail','#featured-services-track','.short-videos .content-rail','#short-videos-track'];const props=['display','visibility','position','overflow','overflow-x','overflow-y','width','max-width','min-width','height','max-height','min-height','flex-direction','flex-wrap','grid-template-columns','grid-auto-flow','grid-auto-columns','overscroll-behavior-x','scroll-snap-type','scroll-padding-left','padding-left','padding-right','margin-left','margin-right','box-sizing'];const items=Array.from({length:6},(_,i)=>({id:`diag-${i}`,serviceId:`diag-${i}`,status:'active',title:`Serviço ${i}`,category:'Reformas',providerName:`Profissional ${i}`,providerHandle:`prof${i}`,rating:4.9,reviewsCount:20+i,price:120+i*10,location:'Salvador, BA',tags:['seguro','rapido']}));
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage();await p.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));await p.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:200,contentType:'font/woff2',body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.route('https://unpkg.com/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.goto(`http://127.0.0.1:4173/index.html?delta=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(800);await p.waitForFunction(()=>window.Doke?.homePublicServices?.render&&window.Doke?.publicServiceCard?.create,{timeout:6000});await p.evaluate(items=>window.Doke.homePublicServices.render(items),items);await p.waitForFunction(()=>document.querySelector('#featured-services-track')?.children.length===6,{timeout:3000});if(state==='rail'){await p.evaluate(()=>{const e=document.querySelector('#featured-services-track');e.scrollLeft=e.scrollWidth-e.clientWidth});await p.waitForTimeout(200)}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(({selectors,props})=>{const R=n=>Math.round(n*1000)/1000,o={};for(const s of selectors){const e=document.querySelector(s);if(!e)throw Error('missing '+s);const c=getComputedStyle(e),r=e.getBoundingClientRect(),st={};for(const x of props)st[x]=c.getPropertyValue(x).trim();o[s]={style:st,rect:{x:R(r.x),y:R(r.y),w:R(r.width),h:R(r.height)},scroll:{clientWidth:e.clientWidth,clientHeight:e.clientHeight,scrollWidth:e.scrollWidth,scrollHeight:e.scrollHeight,scrollLeft:R(e.scrollLeft),scrollTop:R(e.scrollTop)},children:e.children.length}}return o},{selectors,props});await c.close();return data}
          const A={},B={};fs.writeFileSync(f,P);for(const [w,s] of states)A[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,C);for(const [w,s] of states)B[`${w}-${s}`]=await cap(w,s,'candidate');function flat(o,p='',out={}){if(o&&typeof o==='object'&&!Array.isArray(o)){for(const [k,v] of Object.entries(o))flat(v,p?`${p}.${k}`:k,out)}else out[p]=o;return out}let total=0;for(const key of Object.keys(A)){const a=flat(A[key]),b=flat(B[key]),ks=[...new Set([...Object.keys(a),...Object.keys(b)])].sort(),diffs=[];for(const k of ks)if(JSON.stringify(a[k])!==JSON.stringify(b[k]))diffs.push({field:k,parent:a[k],candidate:b[k]});if(diffs.length){total+=diffs.length;console.log(`STATE DELTA|state=${key}|count=${diffs.length}`);for(const d of diffs)console.log(`DELTA|state=${key}|field=${d.field}|parent=${JSON.stringify(d.parent)}|candidate=${JSON.stringify(d.candidate)}`)}}console.log(`DELTA SUMMARY|states=${Object.keys(A).length}|fields=${total}`);if(total===0)throw Error('expected R11 diffs not reproduced');await browser.close();fs.writeFileSync(f,P)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.delta.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "DELTA=${{ steps.delta.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE|STATE DELTA|DELTA\||DELTA SUMMARY)' /tmp/delta.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 320 /tmp/delta.log || true; fi; } >/tmp/evidence.txt; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 006 runtime delta r12 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
