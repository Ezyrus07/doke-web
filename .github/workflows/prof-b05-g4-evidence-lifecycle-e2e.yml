name: Doke PROF-B05 G4 Evidence Lifecycle E2E
# Disposable project only; never point this workflow at persistent staging.

on:
  pull_request:
    paths:
      - 'scripts/validate-professional-kyc-evidence-lifecycle-runtime.mjs'
      - 'scripts/test-professional-kyc-authority-contract.js'
      - 'package.json'
      - 'supabase/migrations/20260918205000_professional_kyc_evidence_lifecycle_authority.sql'
      - 'supabase/migrations/20260918213000_professional_kyc_evidence_event_ordering_authority.sql'
      - 'supabase/tests/032_professional_kyc_evidence_lifecycle_validation.sql'
      - '.github/workflows/prof-b05-g4-evidence-lifecycle-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-prof-b05-g4-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'prof/prof-b05-implementation'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DOKE_KYC_E2E_PROJECT_REF: bqmmbopwfgwffkbtheab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: node --check scripts/validate-professional-kyc-evidence-lifecycle-runtime.mjs
      - name: KYC static authority
        run: node scripts/test-professional-kyc-authority-contract.js
      - name: Dry-run contract
        run: node scripts/validate-professional-kyc-evidence-lifecycle-runtime.mjs --dry-run
      - name: Execute evidence lifecycle E2E
        run: node scripts/validate-professional-kyc-evidence-lifecycle-runtime.mjs --execute
