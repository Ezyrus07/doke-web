name: Doke UX-CSS-IMPORTANT-001 Permanent Certification
on:
  push:
    branches: [diag/ux-css-important-001-certify-permanent]
    paths: [.github/workflows/diag-ux-css-important-001-certify-permanent.yml]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5c9c3d2fad3b4e7e9cf74201f080cca9ddffe2e5
      PARENT_SHA: b159cd296daef5a4ea9e38d419e8dc43670c9c1e
      PARENT_PARENT_SHA: 3a2f10f67fcf7452114959d9c3a217852a765c55
      TARGET_TREE: c385ae4b40c67d200f6c4a4d99f2a46bb2f47b23
      TARGET_FILE: assets/css/components/in-app-notifications.css
      PARENT_TARGET_BLOB: cc5fa323b338995a76b8e927474fcaf90344885d
      TARGET_BLOB: 15caac7b2e43aea620474b5f203128fac620569a
      EXPECTED_SHA256: 802214d70ed62d1d023467e0fc13a6f30250bcfa531b9149decf3dd041167fcb
      EXPECTED_BYTES: '7403'
      PERMANENT_BRANCH: ux/ux-css-important-001-in-app-notifications
      SOURCE_RUN: '32132317110'
      R1_RUN: '32133344764'
      CORE_RUN: '32133757438'
      GOVERNANCE_RUN: '32133825210'
      PROMOTION_RUN: '32134142721'
      DIAG_BRANCH: diag/ux-css-important-001-certify-permanent
      RESULT_FILE: .diagnostics/ux-css-important-001-certification.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/cert.log) 2>&1
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git show "$PARENT_SHA:$TARGET_FILE" | git hash-object --stdin)" = "$PARENT_TARGET_BLOB"
          test "$(git rev-list --count "$PARENT_SHA..$TARGET_SHA")" = 1
          test "$(git diff --name-only "$PARENT_SHA" "$TARGET_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$TARGET_SHA" -- "$TARGET_FILE")" = $'2\t2\t'"$TARGET_FILE"
          git diff --quiet "$PARENT_SHA" "$TARGET_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH"
          test "$(git rev-parse origin/$PERMANENT_BRANCH)" = "$TARGET_SHA"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l | tr -d ' ')" = 0
          echo "IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|fullHistory=1|files=1|additions=2|deletions=2|important=0"

          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent-in-app-notifications.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const src=fs.readFileSync('/tmp/parent-in-app-notifications.css','utf8');
          const oldA='.doke-live-toast__actions { display: flex !important; gap: 8px; margin-top: 5px; overflow: visible !important; white-space: normal !important; }';
          const newA='.doke-live-toast__content > .doke-live-toast__actions { display: flex; gap: 8px; margin-top: 5px; overflow: visible; white-space: normal; }';
          const oldP='.notifications-settings-panel__select { align-items: flex-start !important; flex-direction: column; }';
          const newP='.notifications-settings-panel__options > .notifications-settings-panel__select { align-items: flex-start; flex-direction: column; }';
          if((src.match(/!important\b/g)||[]).length!==4||!src.includes(oldA)||!src.includes(oldP))throw Error('parent reconstruction drift');
          const out=src.replace(oldA,newA).replace(oldP,newP),b=Buffer.from(out),h=crypto.createHash('sha256').update(b).digest('hex');
          if(h!==process.env.EXPECTED_SHA256||b.length!==+process.env.EXPECTED_BYTES)throw Error(`reconstruction ${h}/${b.length}`);
          if(!b.equals(fs.readFileSync(process.env.TARGET_FILE)))throw Error('reconstruction not byte-identical');
          console.log(`RECONSTRUCTION PASS|byteIdentical=1|sha256=${h}|bytes=${b.length}|important=4->0|rulesChanged=2`);
          NODE

          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),target=process.env.TARGET_FILE;
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));
          const re=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v))};
          const meta=new Map();for(const f of tracked){const src=fs.readFileSync(f,'utf8'),imports=[];let m;re.lastIndex=0;while((m=re.exec(src)))imports.push(norm(m[1],f));meta.set(f,{src,imports,size:Buffer.byteLength(src),important:(src.match(/!important\b/g)||[]).length})}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css||[]))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}
          if(active.size!==401)throw Error(`active ${active.size}`);
          const importers=[...meta].filter(([f,x])=>f!==target&&x.imports.includes(target)).map(([f])=>f).sort(),aim=importers.filter(f=>active.has(f));
          const exp=['assets/css/pages/comunidade-interna-runtime-page.css','assets/css/pages/messaging-runtime-extensions.css'];if(JSON.stringify(importers)!==JSON.stringify(exp)||JSON.stringify(aim)!==JSON.stringify(exp))throw Error(`importers ${importers}/${aim}`);
          const reach=[];for(const p of report.pageAssets){const seen=new Set(),stack=[...(p.css||[]).filter(f=>meta.has(f))];while(stack.length){const f=stack.pop();if(seen.has(f)||!meta.has(f))continue;seen.add(f);if(f===target){reach.push(p.page);break}for(const n of meta.get(f).imports)if(meta.has(n))stack.push(n)}}reach.sort();const expReach=['comunidade-interna.html','mensagens.html','notificacoes.html'];if(JSON.stringify(reach)!==JSON.stringify(expReach))throw Error(`reach ${reach}`);
          console.log(`AUTHORITY PASS|importers=2/2 active|reach=3|pageList=${reach.join(',')}|source=${process.env.SOURCE_RUN}|browserProof=${process.env.R1_RUN}|syntheticDOM=0`);
          NODE
          echo "BROWSER PROOF TRANSFER PASS|r1=$R1_RUN|candidateSha256=$EXPECTED_SHA256|negativeControl=PASS|styleDiffs=0|geometryDiffs=0|screenshotDiffs=0|syntheticDOM=0"

          git checkout --detach "$PARENT_SHA"
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/responsive-parent.json
          git checkout --detach "$TARGET_SHA"
          cp /tmp/responsive-parent.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

          npm run audit:notifications-api-contract
          npm run test:notification-delivery-controls
          npm run test:notification-quick-actions
          npm run test:notification-quick-actions-v2
          npm run test:community-request-notification-contract
          echo 'NOTIFICATION CONTRACTS PASS|api=1|delivery=1|quickActions=1|quickActionsV2=1|communityRequestNotification=1'

          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true

          npm run audit:important-reduction-plan
          npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8'));
          const p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8'));
          const s=b.summary;
          if(s.totalImportant!==11259||s.outsideServiceCardImportant!==11197||s.filesWithImportant!==35||s.groupsWithImportant!==4)throw Error(`important baseline ${JSON.stringify(s)}`);
          const components=b.groups?.components;if(!components||components.importantCount!==8039||components.filesWithImportant!==24)throw Error(`components ${JSON.stringify(components)}`);
          if(p.summary.affectedFiles!==34||p.summary.totalImportantOutsideServiceCard!==11197||p.summary.lowRiskFileCount!==0||p.summary.byRisk?.['high-baseline-required']!==11197)throw Error(`plan ${JSON.stringify(p.summary)}`);
          console.log('IMPORTANT BASELINE PASS|total=11259|outsideServiceCard=11197|files=35|components=8039/24|delta=-4');
          console.log('LOW-RISK QUEUE PASS|affectedFiles=34|lowRiskFiles=0|highBaselineRequired=11197|targetImportant=0');
          NODE

          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));
          const re=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v))};
          const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;re.lastIndex=0;while((m=re.exec(text)))imports.push(norm(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length})}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css||[]))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});
          const ns=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function deadCount(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],rx=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(const line of ls){const t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:ns(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:ns([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=ns(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=ns(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(rx);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const x=stack.pop();if(x.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return dead}
          let files=0,total=0,highDead=0,pageResidual=0;for(const f of active){const d=deadCount(meta.get(f).text);if(d){files++;total+=d;if(high.includes(f))highDead++;if(f.includes('/pages/'))pageResidual++}}
          if(active.size!==401||high.length!==37||files!==0||total!==0||highDead!==0||pageResidual!==0)throw Error(`residual ${active.size}/${high.length}/${files}/${total}/${highDead}/${pageResidual}`);
          console.log('STRUCTURAL RESIDUAL PASS|active=401|high=37|files=0|dead=0|highDead=0|pageResidual=0');
          NODE

          set +e; npm audit --json >/tmp/audit.json; auditCode=$?; set -e
          node <<'NODE'
          const a=require('/tmp/audit.json'),v=a.metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`dependency drift ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`);
          NODE
          echo "AUDIT_EXIT=$auditCode"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH"
          test "$(git rev-parse origin/$PERMANENT_BRANCH)" = "$TARGET_SHA"
          echo 'GOVERNANCE PASS|conflicts=339|duplicates=0/0|domain=23/15/2.91/12|activeCss=401|highRiskActiveCss=37'
      - id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_SHA" >/dev/null 2>&1 || true
          git reset --hard "$TARGET_SHA" >/dev/null
          git clean -fdx >/dev/null
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
      - name: Publish fail-closed certification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if test '${{ steps.validate.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TARGET_SHA=$TARGET_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_TREE=$TARGET_TREE"; echo "PARENT_TARGET_BLOB=$PARENT_TARGET_BLOB"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo 'DIFF=1 file +2/-2'; echo 'FULL_HISTORY=1'; grep -E '^(IDENTITY PASS|RECONSTRUCTION PASS|AUTHORITY PASS|BROWSER PROOF TRANSFER PASS|RESPONSIVE PASS|NOTIFICATION CONTRACTS PASS|IMPORTANT BASELINE PASS|LOW-RISK QUEUE PASS|STRUCTURAL RESIDUAL PASS|DEPENDENCY PASS|GOVERNANCE PASS)\|' /tmp/cert.log || true; grep '^AUDIT_EXIT=' /tmp/cert.log || true; echo "SOURCE=$SOURCE_RUN"; echo "R1=$R1_RUN"; echo "CORE=$CORE_RUN"; echo "GOVERNANCE=$GOVERNANCE_RUN"; echo "PROMOTION=$PROMOTION_RUN"; echo "VALIDATE=${{ steps.validate.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 260 /tmp/cert.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")" && cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: record UX-CSS-IMPORTANT-001 certification [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
