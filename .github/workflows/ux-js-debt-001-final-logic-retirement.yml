name: Doke UX-JS-DEBT-001 Final Logic Retirement

on:
  push:
    branches:
      - ux/ux-js-debt-001-final-logic-retirement
  pull_request:
    branches:
      - ux/ux-resp-debt-011-profile-header-parity-retirement

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ux-js-debt-001-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BASE: da913753aef021e94ead3dbdbd8e369764dc999b
  PR_NUMBER: '138'

jobs:
  ux-js-debt-001:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-011 parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ux/ux-resp-debt-011-profile-header-parity-retirement --quiet
          test "$(git merge-base HEAD origin/ux/ux-resp-debt-011-profile-header-parity-retirement)" = "${EXPECTED_BASE}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate bounded retirement delta
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/ux-js-debt-001-final-logic-retirement.yml|assets/js/features/community-final-logic-stability.js|mensagens.html|notificacoes.html|scripts/test-community-final-logic-stability-contract.js|scripts/test-community-final-readiness-contract.js|scripts/test-messages-interaction-stability-contract.js|docs/DOMAIN-COMPLETION-MATRIX.md) ;;
              *) echo "::error::Unexpected UX-JS-DEBT-001 path: ${changed_path}"; exit 1 ;;
            esac
          done < <(git diff --name-only "${EXPECTED_BASE}"...HEAD)
          git cat-file -e "${EXPECTED_BASE}:assets/js/features/community-final-logic-stability.js"
          test ! -e assets/js/features/community-final-logic-stability.js

      - name: Validate HTML import-only delta
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const base = process.env.EXPECTED_BASE;
          const line = '<script src="assets/js/features/community-final-logic-stability.js?v=20260714-interaction-stability-v1" defer></script>\n';
          for (const file of ['mensagens.html', 'notificacoes.html']) {
            const parent = execFileSync('git', ['show', `${base}:${file}`], { encoding: 'utf8' });
            const current = fs.readFileSync(file, 'utf8');
            assert.strictEqual(parent.split(line).length - 1, 1, `${file}: parent must load retired shim exactly once`);
            assert.strictEqual(current, parent.replace(line, ''), `${file}: delta must remove only retired shim import`);
          }
          NODE

      - name: Validate reconciled ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:community:final-logic
          npm run test:community:final-readiness
          node scripts/test-messages-interaction-stability-contract.js
          npm run test:community-critical-hardening
          npm run audit:auth-session
          npm run audit:active-legacy-structures

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Preserve responsive surface
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-responsive-index-baseline.js
          node scripts/test-responsive-contract.js

      - name: Validate shared boundaries and governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

      - name: Validate patch whitespace
        run: git diff --check "${EXPECTED_BASE}"...HEAD

      - name: Require SonarQube Cloud credential
        if: github.event_name == 'push' && env.PR_NUMBER != '0'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}"

      - name: Analyze PR and enforce SonarQube Cloud Quality Gate
        if: github.event_name == 'push' && env.PR_NUMBER != '0'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=ux/ux-js-debt-001-final-logic-retirement
            -Dsonar.pullrequest.base=ux/ux-resp-debt-011-profile-header-parity-retirement
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
