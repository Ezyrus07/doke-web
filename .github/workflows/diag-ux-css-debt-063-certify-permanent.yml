name: Doke UX-CSS-DEBT-063 Permanent Certification

on:
  push:
    branches:
      - diag/ux-css-debt-063-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 6756a335c3bd5ecedf7ba0b6bb40cfbb1cab6d54
      PARENT_SHA: ffe9c5a19921422fac17e93e6208a58f2f829429
      PARENT_PARENT_SHA: 10a9a51cfd0a96e7c6a56eb71cf44452ddb8813f
      EXPECTED_TREE: 74bd79b2685c75dbae832b21c0491f9ccde90da5
      TARGET_FILE: assets/css/components/panels/mobile-panel.css
      PARENT_TARGET_BLOB: aa29bd1a0484e8b6d2995b8afacfe9f30192cefa
      TARGET_BLOB: 3d6a97e26328db22aba68ee986d29eb14d317a7a
      IMPORTER_A: assets/css/pages/comunidade-foundation.css
      IMPORTER_A_BLOB: fad24aba42d840a174328af28ae8c98700219cd4
      IMPORTER_B: assets/css/pages/internal-foundation.css
      IMPORTER_B_BLOB: f35c6e8496849ef552d2c5b2752cf70269c53980
      EXPECTED_SHA256: c2a66ba6925b103a11c0b3c56c5a4a2b6cb76e9ce0ac4f54c5ce43dd3fe42cb4
      EXPECTED_BYTES: 7074
      PERMANENT_BRANCH: ux/ux-css-debt-063-mobile-panel-compaction
      PROOF_RUN: 32033335302
      PROOF_JOB: 95398036564
    steps:
      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Exact permanent identity and full-history guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git diff --name-only "$PARENT_SHA" "$TARGET_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$TARGET_SHA" -- "$TARGET_FILE")" = $'0\t4\t'"$TARGET_FILE"
          test "$(git rev-list --count "$PARENT_SHA..$TARGET_SHA")" = "1"
          git diff --quiet "$PARENT_SHA" "$TARGET_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$EXPECTED_TREE|parentBlob=$PARENT_TARGET_BLOB|targetBlob=$TARGET_BLOB|fullHistory=1|files=1|additions=0|deletions=4"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Independent reconstruction and source authority identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const parent=cp.execFileSync('git',['show',`${process.env.PARENT_SHA}:${process.env.TARGET_FILE}`],{encoding:'utf8'}),lines=parent.split('\n');
          const rows=new Map([[65,'    max-width: calc(100vw - (var(--doke-panel-gutter) * 2));'],[90,'    left: max(var(--doke-panel-gutter), env(safe-area-inset-left, 0px));'],[91,'    right: max(var(--doke-panel-gutter), env(safe-area-inset-right, 0px));'],[94,'    max-height: min(72vh, calc(100dvh - 132px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));']]);
          for(const [n,e] of rows){const a=(lines[n-1]||'').replace(/\r$/,'');if(a!==e)throw new Error(`parent row drift ${n}: ${JSON.stringify(a)}`)}
          const rebuilt=lines.filter((_,i)=>!rows.has(i+1)).join('\n'),current=fs.readFileSync(process.env.TARGET_FILE,'utf8');if(Buffer.from(rebuilt).compare(Buffer.from(current))!==0)throw new Error('independent reconstruction mismatch');
          const files=cp.execFileSync('git',['ls-files','-z','*.html','assets/js'],{encoding:'utf8'}).split('\0').filter(Boolean).filter(f=>fs.existsSync(f)&&fs.statSync(f).isFile());const specific=['doke-mobile-panel--filters','doke-mobile-panel--selection','doke-mobile-panel--menu','doke-mobile-panel--context','data-mobile-panel-type="filters"','data-mobile-panel-type="selection"','data-mobile-panel-type="menu"','data-mobile-panel-type="context"'];const sh=[],generic=[];for(const f of files){const s=fs.readFileSync(f,'utf8'),hit=specific.filter(t=>s.includes(t));if(hit.length)sh.push({f,hit});if(s.includes('data-mobile-panel'))generic.push(f)}if(sh.length)throw new Error(`changed-family source drift ${JSON.stringify(sh)}`);const html=[...new Set(generic.filter(f=>f.endsWith('.html')))].sort(),js=[...new Set(generic.filter(f=>f.endsWith('.js')))].sort();if(JSON.stringify(html)!==JSON.stringify(['comunidade.html'])||js.length)throw new Error(`source closure ${JSON.stringify({html,js})}`);
          console.log(`INDEPENDENT REBUILD PASS|byteIdentical=1|sourceChangedFamily=0|genericHtml=comunidade.html|genericJs=0|browserTransfer=${process.env.PROOF_RUN}/${process.env.PROOF_JOB}`);
          NODE
          test "$(git hash-object "$IMPORTER_A")" = "$IMPORTER_A_BLOB"
          test "$(git hash-object "$IMPORTER_B")" = "$IMPORTER_B_BLOB"
          test -z "$(git status --porcelain)"

      - name: Generate responsive baseline from exact parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$PARENT_SHA" -- "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          echo 'PARENT BASELINE PASS|active=401|high=37|responsiveBaseline=1'

      - name: Responsive contract on exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-responsive-contract.js | tee /tmp/ux063-cert-responsive.log
          grep -q 'Checks: 893' /tmp/ux063-cert-responsive.log
          grep -q 'Failures: 0' /tmp/ux063-cert-responsive.log
          grep -q 'Skips: 277' /tmp/ux063-cert-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and permanent canonical residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length})}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10}),norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function dc(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0;for(const f of active){const p=dc(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++}}const guards=[['assets/css/components/panels/mobile-panel.css',94,0,'063'],['assets/css/components/forms/form-flow-comfort.css',113,0,'062'],['assets/css/components/overlays/action-modal-system.css',264,0,'061'],['assets/css/components/overlays/financial-modal-system.css',645,0,'060'],['assets/css/components/media-lightbox.css',280,0,'059'],['assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css',216,0,'058'],['assets/css/components/chat-composer.css',125,0,'057'],['assets/css/components/before-after-workers-preview/mobile-comment-sheets.css',302,0,'056'],['assets/css/patterns/settings-shell.css',104,0,'055'],['assets/css/components/before-after-workers-preview/publication-light-modal.css',75,0,'054']];if(files!==11||total!==64||highDead!==0)throw new Error(`residual ${files}/${total}/${highDead}`);for(const [f,d,dead,l] of guards){const p=dc(meta.get(f).text);if(p.decl!==d||p.dead!==dead)throw new Error(`${l} ${p.decl}/${p.dead}`)}console.log('PERMANENT RESIDUAL PASS|active=401|high=37|files=11|dead=64|highDead=0|063=94/0|062=113/0|061=264/0|060=645/0|059=280/0|058=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e; npm audit --json >/tmp/ux063-cert-audit.json; code=$?; set -e
          node <<'NODE'
          const a=require('/tmp/ux063-cert-audit.json'),v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);
          NODE
          echo "npmAuditExit=$code"

      - name: Final exact full-history restore and branch identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git hash-object "$IMPORTER_A")" = "$IMPORTER_A_BLOB"
          test "$(git hash-object "$IMPORTER_B")" = "$IMPORTER_B_BLOB"
          test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "CERTIFICATION RESTORE PASS|sha=$TARGET_SHA|fullHistory=1|remoteExact=1|productMutation=0"
