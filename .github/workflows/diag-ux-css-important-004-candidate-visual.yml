name: Doke UX CSS Important 004 Candidate Visual
on:
  push:
    branches: [diag/ux-css-important-004-candidate-visual]
    paths: [.github/workflows/diag-ux-css-important-004-candidate-visual.yml]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 8b6aef68b21109309adfa35ef580888252fd318e
      TARGET_FILE: assets/css/pages/home/mobile-layout.css
      TARGET_BLOB: c85093c659ce3b6b2de2bd58a720f3ef013331d3
      EXPECTED_SHA256: ccbefed21575963c669038053cb7d3e26913986d0a033dbdfe3d368bae1933b4
      EXPECTED_BYTES: '5513'
      DIAG_BRANCH: diag/ux-css-important-004-candidate-visual
      RESULT_FILE: .diagnostics/ux-css-important-004-candidate-visual.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 2}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: visual
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/visual.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,src=fs.readFileSync(f,'utf8');if((src.match(/!important\b/g)||[]).length!==21)throw Error('parent count');const out=src.replace(/\s*!important\b/g,'');const z=Buffer.from(out),h=crypto.createHash('sha256').update(z).digest('hex');if(h!==process.env.EXPECTED_SHA256||z.length!==+process.env.EXPECTED_BYTES||(out.match(/!important\b/g)||[]).length!==0)throw Error(`candidate ${h}/${z.length}`);fs.writeFileSync('/tmp/candidate.css',out);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=21->0|files=1|additions=21|deletions=21`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,parent=fs.readFileSync(f,'utf8'),candidate=fs.readFileSync('/tmp/candidate.css','utf8'),widths=[359,379,380,381,430,560,561],modalWidths=new Set([359,380,560]),browser=await chromium.launch({headless:true}),hash=x=>crypto.createHash('sha256').update(x).digest('hex'),selectors=['body.home-index-shell .home-mobile-hero__top','body.home-index-shell .before-after .content-rail','body.home-index-shell .comparison-grid','body.home-index-shell .comparison-grid > .comparison-card','body.home-index-shell .comparison-grid > .comparison-card .comparison-card__visual'];async function cap(w,phase,modal){const c=await browser.newContext({viewport:{width:w,height:1000}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));for(const u of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**'])await p.route(u,r=>r.fulfill({status:200,contentType:'text/css',body:''}));for(const u of ['https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(u,r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await p.goto(`http://127.0.0.1:4173/index.html?important004=${phase}-${w}-${modal?'modal':'default'}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForTimeout(900);if(modal){const t=p.locator('[data-before-after-id="case-bathroom"]').first();if(!(await t.count()))throw Error('modal trigger missing');await t.click();await p.waitForTimeout(250)}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(sels=>({counts:sels.map(s=>document.querySelectorAll(s).length),href:location.pathname}),selectors);const png=hash(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}const par={},can={};fs.writeFileSync(f,parent);for(const w of widths){par[`d-${w}`]=await cap(w,'parent',false);if(modalWidths.has(w))par[`m-${w}`]=await cap(w,'parent',true)}fs.writeFileSync(f,candidate);for(const w of widths){can[`d-${w}`]=await cap(w,'candidate',false);if(modalWidths.has(w))can[`m-${w}`]=await cap(w,'candidate',true)}let screenshotDiffs=0,nodeMismatches=0,pageErrors=0,samples=0;for(const k of Object.keys(par)){samples++;pageErrors+=par[k].errs.length+can[k].errs.length;if(par[k].png!==can[k].png)screenshotDiffs++;if(JSON.stringify(par[k].data)!==JSON.stringify(can[k].data))nodeMismatches++;if(par[k].data.counts.some(Boolean)||can[k].data.counts.some(Boolean))throw Error(`selector materialized ${k}`)}if(samples!==10||screenshotDiffs||nodeMismatches||pageErrors)throw Error(`parity ${samples}/${screenshotDiffs}/${nodeMismatches}/${pageErrors}`);console.log(`VISUAL PASS|viewports=${widths.join(',')}|states=default7+modal3|selectorNodes=0|nodeDiffs=0|screenshotDiffs=0|screenshots=10|pageErrors=0|syntheticDOM=0|criteriaRelaxed=0|inertnessRun=32139241281`);await browser.close();fs.writeFileSync(f,parent)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.visual.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "VISUAL=${{ steps.visual.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|VISUAL PASS)\|' /tmp/visual.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 180 /tmp/visual.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish important 004 visual [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
