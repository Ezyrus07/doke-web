name: Doke UX-CSS-DEBT-066 Filter Select Proof R1 V2

on:
  push:
    branches:
      - diag/ux-css-debt-066-filter-select-proof-r1-v2

permissions:
  contents: read

jobs:
  proof-r1:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 2937218b2ecfa9b59586d4fd1c2f6361c103e786
      PARENT_SHA: 39780a7192b1b17e8b971372a52b689ad39ef67d
      TARGET_FILE: assets/css/components/internal/filter-select-standard.css
      TARGET_BLOB: 08bbd3a12d0a5590267d534aecdc69aa777a81d6
      SOURCE_RUN: 32038404222
      SOURCE_JOB: 95413229878
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-065 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Exact input guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo "R1 V2 INPUT PASS|sourceClosure=$SOURCE_RUN/$SOURCE_JOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium and serve exact product
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          node scripts/serve-static-site.js --host=127.0.0.1 --port=4183 >/tmp/ux066-r1v2-http.log 2>&1 &
          echo $! >/tmp/ux066-r1v2-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:4183/pedidos.html >/dev/null

      - name: Authoritative real-DOM A-B parity without auth runtime
        shell: bash
        env:
          DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
        run: |
          set -euo pipefail
          cat >/tmp/ux066-r1v2.js <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const file=process.env.TARGET_FILE,original=fs.readFileSync(file,'utf8'),lines=original.split('\n');
          const rows=new Map([[81,'  background: linear-gradient(135deg, #22a06b, #2ac59f);'],[82,'  border-color: transparent;'],[83,'  color: #fff;'],[84,'  box-shadow: var(--shadow-action-secondary-strong);'],[101,'  margin-top: 16px;'],[119,'  min-height: var(--chip-height);'],[123,'  background: var(--color-primary-soft);'],[125,'  color: var(--color-primary-strong);'],[138,'  min-height: var(--chip-height);'],[142,'  background: var(--color-surface);'],[143,'  color: var(--color-text-muted);'],[147,'  box-shadow: var(--shadow-control-soft);']]);
          for(const [n,e] of rows){const a=(lines[n-1]||'').replace(/\r$/,'');if(a!==e)throw new Error(`row drift ${n}: ${JSON.stringify(a)}`)}
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          const pp=parse(original);if(pp.decl!==416||pp.dead.length!==12)throw new Error(`parent ${pp.decl}/${pp.dead.length}`);const identical=pp.dead.filter(d=>d.value===d.winner.value&&d.important===d.winner.important).length;if(identical!==2||pp.dead.length-identical!==10)throw new Error(`winner class ${identical}/${pp.dead.length-identical}`);
          const candidate=lines.filter((_,i)=>!rows.has(i+1)).join('\n'),cc=parse(candidate);if(cc.decl!==404||cc.dead.length!==0)throw new Error(`candidate ${cc.decl}/${cc.dead.length}`);
          const hash=crypto.createHash('sha256').update(candidate).digest('hex'),bytes=Buffer.byteLength(candidate);
          const routes=['pedidos.html','notificacoes.html','mensagens.html'],widths=[359,430,759,760,761,1024,1280];
          const families=[
            {name:'agenda',selector:'body.orders-page-shell .page-header-context__action[data-orders-agenda-toggle], body.orders-page-shell .orders-page-header__hero-chip[data-orders-agenda-toggle], body.notifications-page-shell .page-header-context__action[aria-label="Agenda"]',props:['backgroundImage','backgroundColor','borderTopColor','color','boxShadow']},
            {name:'controls',selector:'body.orders-page-shell :is(.orders-page-header__controls, .notifications-page-header__controls):not([hidden]), body.notifications-page-shell .notifications-page-header__controls:not([hidden]), body.messages-page-shell .messages-header-controls:not([hidden])',props:['marginTop','paddingTop','paddingRight','paddingBottom','paddingLeft','borderRadius','borderTopColor','backgroundColor','boxShadow']},
            {name:'chip',selector:'body.orders-page-shell .orders-active-filter-chip, body.notifications-page-shell .orders-active-filter-chip, body.messages-page-shell .orders-active-filter-chip',props:['minHeight','borderTopColor','backgroundColor','color']},
            {name:'clear',selector:'body.orders-page-shell .orders-active-filter-clear, body.notifications-page-shell .orders-active-filter-clear, body.messages-page-shell .orders-active-filter-clear, body.orders-page-shell .orders-select-panel__heading, body.notifications-page-shell .notifications-select-panel__heading',props:['minHeight','borderTopColor','backgroundColor','color','boxShadow']}
          ];
          async function capture(tag){const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const out=[];const totals=Object.fromEntries(families.map(f=>[f.name,0]));let overflow=0;try{for(const route of routes)for(const width of widths){const ctx=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',r=>{const u=new URL(r.request().url()),local=u.origin==='http://127.0.0.1:4183';if(local&&u.pathname.endsWith('.js'))return r.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return r.continue();return r.abort()});await page.goto(`http://127.0.0.1:4183/${route}?ux066=${tag}-${width}`,{waitUntil:'domcontentloaded',timeout:15000});await page.addStyleTag({content:'html,body{visibility:visible!important;opacity:1!important}.doke-document-preloader,.doke-page-hydration-skeleton{display:none!important}'});await page.evaluate(()=>{for(const el of document.querySelectorAll('.orders-page-header__controls,.notifications-page-header__controls,.messages-header-controls,.orders-active-filter-chip,.orders-active-filter-clear'))el.hidden=false});const snap=await page.evaluate(fams=>{const round=v=>Math.round(v*1000)/1000,families={};for(const f of fams){families[f.name]=[...document.querySelectorAll(f.selector)].map((el,index)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(const p of f.props)style[p]=cs[p];return{index,tag:el.tagName,cls:String(el.className||''),hidden:el.hidden,ariaExpanded:el.getAttribute('aria-expanded'),style,rect:[r.x,r.y,r.width,r.height].map(round)}})}return{families,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}} ,families);for(const f of families)totals[f.name]+=snap.families[f.name].length;overflow=Math.max(overflow,snap.overflow);out.push({route,width,snap});await ctx.close()}}finally{await browser.close()}for(const f of families)if(totals[f.name]===0)throw new Error(`${tag} no real DOM coverage for ${f.name}`);console.log(`COVERAGE|${tag}|routes=${routes.length}|viewports=${widths.length}|samples=${out.length}|agenda=${totals.agenda}|controls=${totals.controls}|chip=${totals.chip}|clear=${totals.clear}|boundary=759/760/761|overflow=${overflow}`);if(overflow!==0)throw new Error(`${tag} overflow=${overflow}`);return out}
          (async()=>{try{fs.writeFileSync(file,original);const p=await capture('parent');fs.writeFileSync(file,candidate);const c=await capture('candidate');const a=JSON.stringify(p),b=JSON.stringify(c);if(a!==b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;throw new Error(`runtime drift idx=${i} parent=${a.slice(i,i+1200)} candidate=${b.slice(i,i+1200)}`)}console.log('R1 V2 BROWSER PARITY PASS|realProductDOM=1|existingDOMStateToggle=1|syntheticDOM=0|localJsAborted=1|families=4/4|routes=3|viewports=7|samplesPerSide=21|runtimeDiffs=0|computedStyleDiffs=0|geometryDiffs=0|overflow=0|criteriaRelaxed=0');console.log(`CANDIDATE IDENTITY|sha256=${hash}|bytes=${bytes}|declarations=404|superseded=0|identicalRemoved=2|changedRemoved=10|files=1|additions=0|deletions=12`)}finally{fs.writeFileSync(file,original)}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node --check /tmp/ux066-r1v2.js
          node /tmp/ux066-r1v2.js | tee /tmp/ux066-r1v2.log
          grep -q 'COVERAGE|parent|routes=3|viewports=7|samples=21' /tmp/ux066-r1v2.log
          grep -q 'COVERAGE|candidate|routes=3|viewports=7|samples=21' /tmp/ux066-r1v2.log
          grep -q 'R1 V2 BROWSER PARITY PASS|realProductDOM=1|existingDOMStateToggle=1|syntheticDOM=0|localJsAborted=1|families=4/4|routes=3|viewports=7|samplesPerSide=21|runtimeDiffs=0|computedStyleDiffs=0|geometryDiffs=0|overflow=0|criteriaRelaxed=0' /tmp/ux066-r1v2.log
          test -z "$(git status --porcelain)"

      - name: Exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/ux066-r1v2-http.pid; then kill "$(cat /tmp/ux066-r1v2-http.pid)" 2>/dev/null || true; fi
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo 'R1 V2 RESTORE PASS|productMutation=0|permanentMutation=0'
