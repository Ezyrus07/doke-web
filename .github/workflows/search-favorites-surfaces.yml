name: Doke SEARCH-A03 Favorites Surfaces

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - 'assets/js/components/service-favorites-controller.js'
      - 'assets/js/components/public-service-card.js'
      - 'assets/js/components/ad-card-interactions.js'
      - 'assets/js/repositories/favorites-repository.js'
      - 'assets/js/services/favorites-service.js'
      - 'assets/js/pages/detail-ad-experience.js'
      - 'assets/js/pages/detalhe-anuncio-data-controller.js'
      - 'assets/js/pages/profile/favorites-surface.js'
      - 'assets/css/pages/client-profile.css'
      - 'index.html'
      - 'resultados.html'
      - 'meu-perfil.html'
      - 'scripts/audit-search-authority-baseline.js'
      - 'scripts/audit-favorites-authority-retirement.js'
      - 'scripts/test-favorites-authority-retirement-runtime.js'
      - 'scripts/audit-service-favorites-surfaces.js'
      - 'scripts/test-service-favorites-controller-runtime.js'
      - 'docs/validation/SEARCH-001-A03-FAVORITES-SURFACES.json'
      - '.github/workflows/search-favorites-surfaces.yml'
  push:
    branches:
      - 'search/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-search-a03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retire-profile-direct-catalog:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Remove direct profile catalog scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('meu-perfil.html')
          text = path.read_text(encoding='utf-8')
          markers = [
            '    <script src="assets/js/repositories/services-repository.js?v=20260720-moderation-flow-v1" defer></script>\n',
            '    <script src="assets/js/services/services-service.js?v=20260720-moderation-flow-v1" defer></script>\n'
          ]
          changed = False
          for marker in markers:
            if marker in text:
              text = text.replace(marker, '', 1)
              changed = True
          if changed:
            path.write_text(text, encoding='utf-8')
          PY

      - name: Commit profile boundary correction
        shell: bash
        run: |
          if git diff --quiet -- meu-perfil.html; then
            echo "Profile catalog boundary already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-perfil.html
          git commit -m "Load profile favorites catalog through module boundary"
          git push origin HEAD:${TARGET_BRANCH}

  search-a03:
    name: SEARCH-A03 canonical favorites surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit cumulative SEARCH-A01 baseline
        run: node scripts/audit-search-authority-baseline.js

      - name: Audit cumulative SEARCH-A02 authority retirement
        run: node scripts/audit-favorites-authority-retirement.js

      - name: Test cumulative SEARCH-A02 runtime
        run: node scripts/test-favorites-authority-retirement-runtime.js

      - name: Audit SEARCH-A03 favorites surfaces
        run: node scripts/audit-service-favorites-surfaces.js

      - name: Test SEARCH-A03 batched runtime
        run: node scripts/test-service-favorites-controller-runtime.js

      - name: Verify clean patch formatting
        run: git diff --check
