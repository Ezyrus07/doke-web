name: COM-B04B Immutable Moderation Persistence Readiness

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'backend/modules/communities/community-moderation-supabase-repository-adapter.js'
      - 'config/com-b04b-immutable-moderation-persistence-readiness.json'
      - 'supabase/migrations/20260805205800_com_b04b_moderation_persistence.sql'
      - 'scripts/test-com-b04b-immutable-moderation-persistence-readiness.js'
      - 'scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js'
      - 'scripts/audit-com-b04b-domain-matrix-reconciliation.js'
      - 'scripts/audit-com-b04-domain-matrix-reconciliation.js'
      - 'docs/COM-B04B-IMMUTABLE-MODERATION-PERSISTENCE-READINESS.md'
      - 'docs/validation/COM-B04B-IMMUTABLE-MODERATION-PERSISTENCE-READINESS.json'
      - '.github/workflows/com-b04b-immutable-moderation-persistence-readiness.yml'
      - 'package.json'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
  pull_request:
    paths:
      - 'backend/modules/communities/community-moderation-supabase-repository-adapter.js'
      - 'config/com-b04b-immutable-moderation-persistence-readiness.json'
      - 'supabase/migrations/20260805205800_com_b04b_moderation_persistence.sql'
      - 'scripts/test-com-b04b-immutable-moderation-persistence-readiness.js'
      - 'scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js'
      - 'scripts/audit-com-b04b-domain-matrix-reconciliation.js'
      - 'scripts/audit-com-b04-domain-matrix-reconciliation.js'
      - 'docs/COM-B04B-IMMUTABLE-MODERATION-PERSISTENCE-READINESS.md'
      - 'docs/validation/COM-B04B-IMMUTABLE-MODERATION-PERSISTENCE-READINESS.json'
      - '.github/workflows/com-b04b-immutable-moderation-persistence-readiness.yml'
      - 'package.json'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read

jobs:
  com-b04b-immutable-moderation-persistence-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-moderation-supabase-repository-adapter.js
          node --check scripts/test-com-b04b-immutable-moderation-persistence-readiness.js
          node --check scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js
          node --check scripts/audit-com-b04b-domain-matrix-reconciliation.js
          node --check scripts/audit-com-b04-domain-matrix-reconciliation.js
      - name: Audit COM-B04B
        run: node scripts/audit-com-b04b-immutable-moderation-persistence-readiness.js
      - name: Conformance COM-B04B
        run: node scripts/test-com-b04b-immutable-moderation-persistence-readiness.js
      - name: Audit COM-B04B domain matrix reconciliation
        run: node scripts/audit-com-b04b-domain-matrix-reconciliation.js
      - name: COM-B04 predecessor regression
        run: |
          node scripts/audit-com-b04-moderation-case-authority.js
          node scripts/test-com-b04-moderation-case-authority.js
          node scripts/audit-com-b04-domain-matrix-reconciliation.js
      - name: COM-B02B persistence-boundary regression
        run: |
          node scripts/audit-com-b02b-supabase-repository-migration-readiness.js
          node scripts/test-com-b02b-supabase-repository-migration-readiness.js
      - name: Canonical matrix drift
        run: npm run audit:domain-completion-matrix
      - name: Diff hygiene
        run: git diff --check
