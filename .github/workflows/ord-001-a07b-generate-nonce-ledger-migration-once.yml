name: ORD-A07B Generate Nonce Ledger Migration Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07b-generate-nonce-ledger-migration-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.101.0
          github-token: ${{ github.token }}
      - name: Discover pinned CLI commands
        run: |
          supabase --version
          supabase migration --help
          supabase migration new --help
      - name: Generate migration through Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          before="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"
          supabase migration new ord_a07b_worker_invocation_nonce_ledger
          after="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"
          migration_file="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -n 1)"
          test -n "$migration_file"
          migration_path="supabase/migrations/$migration_file"
          cat > "$migration_path" <<'SQL'
          -- Doke ORD-A07B: single-use freshness nonces for internal order-event worker invocations.
          -- Generated through Supabase CLI. Repository-only migration; not applied by this workflow.

          create table if not exists private.order_event_worker_invocation_nonces (
            nonce_hash bytea primary key,
            issued_at timestamptz not null,
            source text not null default 'manual'
              check (source in ('cron', 'manual', 'test', 'recovery')),
            consumed_at timestamptz not null default clock_timestamp(),
            expires_at timestamptz not null,
            constraint order_event_worker_invocation_nonce_expiry_check
              check (expires_at > issued_at)
          );

          alter table private.order_event_worker_invocation_nonces enable row level security;

          create index if not exists idx_order_event_worker_invocation_nonces_expires_at
            on private.order_event_worker_invocation_nonces(expires_at);

          revoke all on private.order_event_worker_invocation_nonces from public, anon, authenticated;
          grant usage on schema private to service_role;
          grant select, insert, delete on private.order_event_worker_invocation_nonces to service_role;

          create or replace function public.consume_order_event_worker_invocation_nonce(
            p_nonce text,
            p_issued_at timestamptz,
            p_source text default 'manual'
          )
          returns boolean
          language plpgsql
          security invoker
          set search_path = private, public, extensions, pg_temp
          as $$
          declare
            v_now timestamptz := clock_timestamp();
            v_source text := lower(trim(coalesce(p_source, 'manual')));
            v_inserted integer := 0;
          begin
            if p_nonce is null
              or p_nonce !~ '^[A-Za-z0-9_-]{24,128}$'
              or p_issued_at is null
              or p_issued_at < v_now - interval '5 minutes'
              or p_issued_at > v_now + interval '30 seconds'
            then
              return false;
            end if;

            if v_source not in ('cron', 'manual', 'test', 'recovery') then
              v_source := 'manual';
            end if;

            delete from private.order_event_worker_invocation_nonces
             where expires_at < v_now - interval '1 hour';

            insert into private.order_event_worker_invocation_nonces(
              nonce_hash,
              issued_at,
              source,
              consumed_at,
              expires_at
            )
            values (
              extensions.digest(p_nonce, 'sha256'),
              p_issued_at,
              v_source,
              v_now,
              p_issued_at + interval '5 minutes'
            )
            on conflict (nonce_hash) do nothing;

            get diagnostics v_inserted = row_count;
            return v_inserted = 1;
          end;
          $$;

          revoke all on function public.consume_order_event_worker_invocation_nonce(text, timestamptz, text)
            from public, anon, authenticated;
          grant execute on function public.consume_order_event_worker_invocation_nonce(text, timestamptz, text)
            to service_role;

          comment on table private.order_event_worker_invocation_nonces is
            'Atomic single-use nonce ledger for freshness-protected internal order-event worker invocations.';
          comment on function public.consume_order_event_worker_invocation_nonce(text, timestamptz, text) is
            'Consumes one URL-safe worker nonce exactly once when its timestamp is within the accepted freshness window.';
          SQL
          printf '%s\n' "$migration_path" > /tmp/ord_a07b_migration_path
      - name: Validate migration on ephemeral Postgres 17
        shell: bash
        run: |
          set -euo pipefail
          migration_path="$(cat /tmp/ord_a07b_migration_path)"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists private;
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          do $$ begin
            create role anon nologin;
          exception when duplicate_object then null; end $$;
          do $$ begin
            create role authenticated nologin;
          exception when duplicate_object then null; end $$;
          do $$ begin
            create role service_role nologin bypassrls;
          exception when duplicate_object then null; end $$;
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration_path"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_nonce text := 'Nonce_For_ORD_A07B_1234567890';
            v_first boolean;
            v_second boolean;
            v_expired boolean;
            v_future boolean;
          begin
            set local role service_role;
            select public.consume_order_event_worker_invocation_nonce(v_nonce, clock_timestamp(), 'test') into v_first;
            select public.consume_order_event_worker_invocation_nonce(v_nonce, clock_timestamp(), 'test') into v_second;
            select public.consume_order_event_worker_invocation_nonce('Expired_Nonce_ORD_A07B_123456', clock_timestamp() - interval '6 minutes', 'test') into v_expired;
            select public.consume_order_event_worker_invocation_nonce('Future_Nonce_ORD_A07B_12345678', clock_timestamp() + interval '31 seconds', 'test') into v_future;
            reset role;

            if v_first is not true then raise exception 'first nonce consumption must succeed'; end if;
            if v_second is not false then raise exception 'duplicate nonce consumption must fail'; end if;
            if v_expired is not false then raise exception 'expired invocation must fail'; end if;
            if v_future is not false then raise exception 'future invocation must fail'; end if;
            if has_function_privilege('anon', 'public.consume_order_event_worker_invocation_nonce(text,timestamptz,text)', 'EXECUTE') then
              raise exception 'anon must not execute nonce consumer';
            end if;
            if has_function_privilege('authenticated', 'public.consume_order_event_worker_invocation_nonce(text,timestamptz,text)', 'EXECUTE') then
              raise exception 'authenticated must not execute nonce consumer';
            end if;
            if not has_function_privilege('service_role', 'public.consume_order_event_worker_invocation_nonce(text,timestamptz,text)', 'EXECUTE') then
              raise exception 'service_role must execute nonce consumer';
            end if;
          end;
          $$;
          SQL
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          migration_path="$(cat /tmp/ord_a07b_migration_path)"
          git add "$migration_path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate ORD-A07B worker nonce ledger migration'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
