name: COM-B03C R5D Hosted Execution Post-Execution Matrix Reconciliation TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5d-hosted-execution-post-matrix-reconciliation-temp.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  reconcile:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only post-execution writer boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-hosted-execution-post-matrix-reconciliation-temp.yml
          RECEIPT=config/com-b03c-r5d-single-use-corrected-terminal-observation-execution-authorization-consumption.json
          test "$(git rev-parse HEAD^)" = "05079fcc5c58fdbfb790c843f4d7a2093f113fba"
          test "$(git rev-parse HEAD^^)" = "06e9bd172ece4c5bd2a64e8c97e93fc078a14206"
          test "$(git rev-parse HEAD^^^)" = "9854d1950223892c16a1939198dec27eab534e16"
          test "$(git rev-parse HEAD^^^^)" = "b3a5bdcd35df41ea64d14c9ff562d5615e13ce6d"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$workflow"
          test "$(git diff --name-only HEAD^^^ HEAD^^)" = "$workflow"
          test "$(git diff --name-only HEAD^^^^ HEAD^^^)" = "$RECEIPT"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^^^:$RECEIPT)" = "4cf9881eaf6043493a36176bf7b96a35708bac53"
          test "$(git rev-parse HEAD^^^:.github/workflows/com-b03c-r5d-corrected-terminal-observation-hosted-execution.yml)" = "91ec3418dc211a290efe091789bf00c9292b388b"

          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/61)"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "true"
          test "$(jq -r '.merged' <<<"$pr")" = "false"
          test "$(jq -r '.head.ref' <<<"$pr")" = "com/com-001-baseline-audit"
          test "$(jq -r '.base.ref' <<<"$pr")" = "rep/rep-001-baseline-audit"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$GITHUB_SHA"

          run="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/31916760689)"
          test "$(jq -r '.head_sha' <<<"$run")" = "9854d1950223892c16a1939198dec27eab534e16"
          test "$(jq -r '.run_attempt' <<<"$run")" = "1"
          test "$(jq -r '.status' <<<"$run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run")" = "success"

          jobs="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/31916760689/jobs?per_page=100)"
          test "$(jq -r '.jobs[] | select(.name=="certify") | .id' <<<"$jobs")" = "95089752543"
          test "$(jq -r '.jobs[] | select(.name=="certify") | .conclusion' <<<"$jobs")" = "success"
          test "$(jq -r '.jobs[] | select(.name=="authorize") | .id' <<<"$jobs")" = "95089810575"
          test "$(jq -r '.jobs[] | select(.name=="authorize") | .conclusion' <<<"$jobs")" = "success"
          test "$(jq -r '.jobs[] | select(.name=="canary") | .id' <<<"$jobs")" = "95089999719"
          test "$(jq -r '.jobs[] | select(.name=="canary") | .conclusion' <<<"$jobs")" = "success"

          artifacts="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/31916760689/artifacts)"
          test "$(jq -r '.artifacts[] | select(.id==9255154728) | .name' <<<"$artifacts")" = "com-b03c-r5d-corrected-terminal-observation-31916760689"
          test "$(jq -r '.artifacts[] | select(.id==9255154728) | .digest' <<<"$artifacts")" = "sha256:bacf4b188b16708a7d246f40764f37269a72178da813fa71166331840610391d"

      - name: Persist sanitized execution evidence and reconcile COM-B03 semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');

          const matrixPath = 'config/domain-completion-matrix.json';
          const evidencePath = 'docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION.json';
          const receiptPath = 'config/com-b03c-r5d-single-use-corrected-terminal-observation-execution-authorization-consumption.json';

          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          if (matrix.version !== '1.3.113') throw new Error('R5D_POST_EXEC_MATRIX_VERSION_DRIFT');
          const com = matrix.domains.find((domain) => domain.id === 'COM-001');
          if (!com) throw new Error('R5D_POST_EXEC_COM_DOMAIN_MISSING');
          if (
            com.maturity !== 3 ||
            com.userFacingAuthority !== 'hybrid' ||
            com.serverAuthority !== 'partial' ||
            com.stagingEvidence !== 'staging_canary' ||
            com.securityGate !== 'partial' ||
            com.productionGate !== 'blocked'
          ) throw new Error('R5D_POST_EXEC_COM_GATE_DRIFT');

          const blocker = com.blockers.find((item) => item.id === 'COM-B03');
          if (!blocker) throw new Error('R5D_POST_EXEC_COM_B03_MISSING');
          if (!blocker.description.includes('future single-file execution-authorization receipt remains absent')) {
            throw new Error('R5D_POST_EXEC_EXPECTED_PRE_EXECUTION_BLOCKER_STATE_NOT_FOUND');
          }
          const actionIndex = com.nextActions.findIndex((item) =>
            item.startsWith('Preserve the R5H frozen trigger certification and the repository-only R5D hosted execution boundary')
          );
          if (actionIndex < 0) throw new Error('R5D_POST_EXEC_EXPECTED_PRE_EXECUTION_NEXT_ACTION_NOT_FOUND');

          for (const path of [receiptPath, evidencePath]) {
            if (!com.requiredPaths.includes(path)) com.requiredPaths.push(path);
          }

          const preExecutionEvidenceIndex = com.evidence.findIndex((item) =>
            item.startsWith('COM-B03C now has a separate R5D hosted corrected-terminal-observation execution boundary repository-defined')
          );
          if (preExecutionEvidenceIndex < 0) throw new Error('R5D_POST_EXEC_HOSTED_BOUNDARY_EVIDENCE_MISSING');
          com.evidence[preExecutionEvidenceIndex] =
            'COM-B03C established a separate R5D hosted corrected-terminal-observation execution boundary repository-defined on head 14a358b42f4550168c35e72b15622937ebc2c87e and finally repository-certified on head b3a5bdcd35df41ea64d14c9ff562d5615e13ce6d. At boundary-certification time the execution receipt was absent and no staging execution had occurred; the boundary bound the frozen R5H trigger, R5F consumed receipt, certified R5D envelope and corrected R4Z bridge while preserving zero remote authority.';

          const executionEvidence =
            'COM-B03C-R5D hosted corrected terminal observation executed exactly once in Doke staging from receipt commit 9854d1950223892c16a1939198dec27eab534e16 on workflow run 31916760689 attempt 1: certify 95089752543, authorize 95089810575 and canary 95089999719 all succeeded. The ACTIVE_HEALTHY staging project returned terminalStatus=CHANNEL_ERROR with joinSubscribed=false and sanitizedJoinClassification=realtime_rls_authorization_rejected; identity cleanup succeeded and zero residue was proven across auth.users, public.users, public.user_profiles and public.client_profiles. The execution receipt is consumed and non-reusable; exactRootCauseProven=false and causalPromotionAllowed=false remain preserved, so private Presence, Typing/Broadcast and channel_messages receive no promotion.';
          if (!com.evidence.includes(executionEvidence)) com.evidence.push(executionEvidence);

          blocker.description =
            'Authenticated community_posts Postgres Changes is proven in staging. R3L narrowed the private Presence authorization failure to evaluation involving realtime.messages.extension without proving the exact root cause. R5B and R5F receipts are consumed and non-reusable; R5G certified trigger readiness; the R5D-bound single-use trigger was materialized and R5H certified it at head a06de307f580c6b787a4c233a342a28a751f3621. The separate R5D hosted execution boundary was repository-certified at head b3a5bdcd35df41ea64d14c9ff562d5615e13ce6d. A fresh exact-head single-use execution authorization was then consumed into the sole receipt commit 9854d1950223892c16a1939198dec27eab534e16, and workflow run 31916760689 attempt 1 completed certify/authorize/canary successfully. The corrected staging observation reproduced CHANNEL_ERROR with joinSubscribed=false and sanitized classification realtime_rls_authorization_rejected on an ACTIVE_HEALTHY project; synthetic identity cleanup succeeded and zero residue was proven. This proves a private Realtime authorization rejection under the corrected envelope but does not prove the exact root cause: exactRootCauseProven=false and causalPromotionAllowed=false. No reusable remote/staging/network/credential/Realtime authority remains after the attempt. Private Presence is not promoted, private Typing/Broadcast remains unproven, and channel_messages still lacks canonical remote authority. Any future staging execution requires a separately governed future boundary and a fresh explicit single-use authorization bound to its exact certified head; generic continuation is non-authorizing.';

          com.nextActions[actionIndex] =
            'Preserve R5H, the frozen trigger and the consumed R5D hosted execution evidence without rerunning run 31916760689 or reusing any authorization/receipt. Continue only repository-side causal investigation to identify the smallest next proof obligation that can distinguish the exact Realtime RLS authorization cause; do not presume or name R5I before a separate certified boundary exists. Any future staging probe requires a fresh explicit single-use authorization bound to the exact future certified head; generic continuation is non-authorizing.';

          const evidence = {
            validationId: 'COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION',
            contractId: 'com-b03c-r5d-corrected-terminal-observation-hosted-execution-evidence-v1',
            status: 'staging_corrected_terminal_observation_authorization_rejected_zero_residue_no_causal_promotion',
            repository: 'Ezyrus07/doke-web',
            pullRequest: 61,
            branch: 'com/com-001-baseline-audit',
            base: 'rep/rep-001-baseline-audit',
            authorizedBoundaryHead: 'b3a5bdcd35df41ea64d14c9ff562d5615e13ce6d',
            receiptCommit: '9854d1950223892c16a1939198dec27eab534e16',
            receiptTree: '5ed5f9e5c2931157aea57401701b71832b04cbd9',
            receiptBlob: '4cf9881eaf6043493a36176bf7b96a35708bac53',
            authorizationReceiptId: 'a17197d865430b0e2184117eb1ede6a8324bbd30f320dc523b05d427ee13ad24',
            authorizationPhraseFingerprint: '098ee84bdecf3131858bd7c3d0d1c2ce0cf75671b43f1a0fa783f69c918863aa',
            run: {
              id: 31916760689,
              attempt: 1,
              conclusion: 'success',
              certifyJob: { id: 95089752543, conclusion: 'success' },
              authorizeJob: { id: 95089810575, conclusion: 'success' },
              canaryJob: { id: 95089999719, conclusion: 'success' }
            },
            artifact: {
              id: 9255154728,
              name: 'com-b03c-r5d-corrected-terminal-observation-31916760689',
              digest: 'sha256:bacf4b188b16708a7d246f40764f37269a72178da813fa71166331840610391d',
              sanitized: true
            },
            staging: {
              projectId: 'zwkczgewzbsorbrjuzpb',
              projectPreflightStatus: 'ACTIVE_HEALTHY',
              terminalStatus: 'CHANNEL_ERROR',
              joinSubscribed: false,
              sanitizedJoinClassification: 'realtime_rls_authorization_rejected',
              executionFailure: null,
              correctedTerminalObservationExecuted: true
            },
            cleanup: {
              identityCreated: true,
              identityCleanupAttempted: true,
              identityCleanupSucceeded: true,
              zeroResidueProven: true,
              residue: {
                authUsers: 0,
                publicUsers: 0,
                userProfiles: 0,
                clientProfiles: 0
              }
            },
            authorization: {
              singleUse: true,
              authorizationConsumed: true,
              authorizationReusable: false,
              reusableAfterFailure: false,
              rawAuthorizationPhrasePersisted: false
            },
            authorityAfterAttempt: {
              remoteExecutionAuthority: false,
              remoteCredentialReadAuthority: false,
              remoteDependencyLoadAuthority: false,
              networkAuthority: false,
              stagingReadAuthority: false,
              stagingMutationAuthority: false,
              realtimeSubscriptionAuthority: false,
              authIdentityLifecycleAuthority: false,
              runtimeChangeAuthority: false,
              productionAuthority: false,
              pullRequestMergeAuthority: false
            },
            functionalPromotion: {
              privatePresencePromoted: false,
              privateTypingBroadcastProven: false,
              channelMessagesCanonicalRemoteAuthority: false
            },
            rawRemoteErrorExposed: false,
            exactRootCauseProven: false,
            causalPromotionAllowed: false,
            rerunForbidden: true,
            receiptReuseForbidden: true,
            triggerRecreationForbidden: true
          };

          fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);
          matrix.updatedAt = '2026-08-15T21:20:00-03:00';
          fs.writeFileSync(matrixPath, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE

      - name: Regenerate canonical Matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Repository governance validation
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Post-execution semantic fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const matrix = require('./config/domain-completion-matrix.json');
          const evidence = require('./docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION.json');
          const com = matrix.domains.find((domain) => domain.id === 'COM-001');
          const blocker = com.blockers.find((item) => item.id === 'COM-B03');

          if (com.maturity !== 3 || com.productionGate !== 'blocked') throw new Error('R5D_POST_EXEC_PROMOTION_FORBIDDEN');
          if (!com.requiredPaths.includes('config/com-b03c-r5d-single-use-corrected-terminal-observation-execution-authorization-consumption.json')) throw new Error('R5D_POST_EXEC_RECEIPT_PATH_MISSING');
          if (!com.requiredPaths.includes('docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION.json')) throw new Error('R5D_POST_EXEC_EVIDENCE_PATH_MISSING');
          if (!blocker.description.includes('receipt commit 9854d1950223892c16a1939198dec27eab534e16')) throw new Error('R5D_POST_EXEC_RECEIPT_STATE_MISSING');
          if (!blocker.description.includes('CHANNEL_ERROR') || !blocker.description.includes('realtime_rls_authorization_rejected')) throw new Error('R5D_POST_EXEC_TERMINAL_OBSERVATION_MISSING');
          if (!blocker.description.includes('zero residue was proven')) throw new Error('R5D_POST_EXEC_ZERO_RESIDUE_MISSING');
          if (!blocker.description.includes('exactRootCauseProven=false') || !blocker.description.includes('causalPromotionAllowed=false')) throw new Error('R5D_POST_EXEC_CAUSAL_BLOCK_REQUIRED');
          if (!com.nextActions.some((item) => item.includes('do not presume or name R5I'))) throw new Error('R5D_POST_EXEC_R5I_PROHIBITION_MISSING');

          if (evidence.receiptCommit !== '9854d1950223892c16a1939198dec27eab534e16') throw new Error('R5D_POST_EXEC_EVIDENCE_RECEIPT_DRIFT');
          if (evidence.run.id !== 31916760689 || evidence.run.attempt !== 1 || evidence.run.conclusion !== 'success') throw new Error('R5D_POST_EXEC_EVIDENCE_RUN_DRIFT');
          if (evidence.staging.terminalStatus !== 'CHANNEL_ERROR' || evidence.staging.joinSubscribed !== false || evidence.staging.sanitizedJoinClassification !== 'realtime_rls_authorization_rejected') throw new Error('R5D_POST_EXEC_EVIDENCE_OBSERVATION_DRIFT');
          if (evidence.cleanup.identityCleanupSucceeded !== true || evidence.cleanup.zeroResidueProven !== true) throw new Error('R5D_POST_EXEC_EVIDENCE_CLEANUP_REQUIRED');
          if (Object.values(evidence.cleanup.residue).some((value) => value !== 0)) throw new Error('R5D_POST_EXEC_EVIDENCE_RESIDUE_FORBIDDEN');
          if (evidence.authorization.authorizationConsumed !== true || evidence.authorization.authorizationReusable !== false || evidence.authorization.reusableAfterFailure !== false) throw new Error('R5D_POST_EXEC_AUTHORIZATION_CONSUMPTION_REQUIRED');
          if (evidence.rawRemoteErrorExposed !== false || evidence.exactRootCauseProven !== false || evidence.causalPromotionAllowed !== false) throw new Error('R5D_POST_EXEC_NO_CAUSAL_PROMOTION_REQUIRED');
          if (Object.values(evidence.authorityAfterAttempt).some((value) => value !== false)) throw new Error('R5D_POST_EXEC_REMOTE_AUTHORITY_MUST_BE_FALSE');
          NODE

      - name: Exact reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-hosted-execution-post-matrix-reconciliation-temp.yml
          evidence=docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION.json
          expected_tracked="$(printf '%s\n' \
            "$workflow" \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          actual_tracked="$(git diff --name-only HEAD^ | sort)"
          printf 'expected tracked:\n%s\nactual tracked:\n%s\n' "$expected_tracked" "$actual_tracked"
          test "$actual_tracked" = "$expected_tracked"
          test -f "$evidence"
          test "$(git ls-files --others --exclude-standard -- "$evidence")" = "$evidence"
          test -z "$(git ls-files --others --exclude-standard | grep -vFx "$evidence" || true)"

      - name: Publish reconciled source and generated derivatives
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-hosted-execution-post-matrix-reconciliation-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION.json
          git add -f reports/generated/domain-completion-matrix-report.json
          git rm "$workflow"
          git diff --cached --check
          git commit -m 'docs(com): reconcile R5D hosted execution evidence'
          git push origin HEAD:com/com-001-baseline-audit
