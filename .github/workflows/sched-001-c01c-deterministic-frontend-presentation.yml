name: Doke SCHED-C01C Deterministic Frontend Presentation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - 'assets/js/patterns/order-schedule-presentation.js'
      - 'assets/js/pages/pedidos-local-orders.js'
      - 'assets/js/pages/pedidos/orders-data.js'
      - 'assets/js/pages/pedidos/orders-details.js'
      - 'assets/js/pages/mensagens.js'
      - 'pedidos.html'
      - 'mensagens.html'
      - 'config/sched-001-c01c-deterministic-frontend-presentation.json'
      - 'docs/SCHED-001-C01C-DETERMINISTIC-FRONTEND-PRESENTATION.md'
      - 'docs/validation/SCHED-001-C01C-DETERMINISTIC-FRONTEND-PRESENTATION.json'
      - 'scripts/audit-sched-001-c01c-deterministic-frontend-presentation.js'
      - 'scripts/test-sched-001-c01c-deterministic-frontend-presentation.js'
      - '.github/workflows/sched-001-c01c-deterministic-frontend-presentation.yml'
      - 'config/domain-completion-matrix.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate runtime syntax
        run: |
          node --check assets/js/patterns/order-schedule-presentation.js
          node --check assets/js/pages/pedidos-local-orders.js
          node --check assets/js/pages/pedidos/orders-data.js
          node --check assets/js/pages/pedidos/orders-details.js
          node --check assets/js/pages/mensagens.js
      - name: Audit and test C01C
        run: |
          npm run audit:sched-001-c01c-deterministic-frontend-presentation
          npm run test:sched-001-c01c-deterministic-frontend-presentation
      - name: Preserve C01B and C01A
        run: |
          npm run audit:sched-001-c01b-frontend-canonical-schedule-read-model
          npm run test:sched-001-c01b-frontend-canonical-schedule-read-model
          npm run audit:sched-001-c01a-frontend-canonical-authority-readiness
          npm run test:sched-001-c01a-frontend-canonical-authority-readiness
      - name: Validate cumulative scheduling authority
        run: |
          npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-closure
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check
