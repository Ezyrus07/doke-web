name: COM-B03C-R3D R3A Policy Materialization Evidence Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - backend/modules/communities/community-realtime-private-auth-r3d.js
      - config/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.json
      - scripts/test-com-b03c-r3d-r3a-policy-materialization-evidence-readiness.js
      - docs/validation/COM-B03C-R3D-R3A-POLICY-MATERIALIZATION-EVIDENCE-READINESS.json
      - .github/workflows/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.yml
      - scripts/execute-com-b03c-r3a-presence-full-conjunction-isolation-staging-canary.js
      - docs/validation/COM-B03C-R3C-REALTIME-MESSAGES-POLICY-CATALOG-STAGING-ATTEMPT.json

permissions: { contents: write }

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3d.js
          node --check scripts/test-com-b03c-r3d-r3a-policy-materialization-evidence-readiness.js
      - name: COM-B03C-R3D repository evidence readiness
        run: node scripts/test-com-b03c-r3d-r3a-policy-materialization-evidence-readiness.js
      - name: Canonical domain completion matrix writer
        run: |
          npm run write:domain-completion-matrix
          allowed='^(docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json)$'
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed" | grep -Ev "$allowed" > /tmp/r3d-unexpected || true
            test ! -s /tmp/r3d-unexpected
            git config user.name doke
            git config user.email bielantoniomma@gmail.com
            git add docs/DOMAIN-COMPLETION-MATRIX.md
            git add -f reports/generated/domain-completion-matrix-report.json
            test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -le 2
            git commit -m 'docs(gov): regenerate domain completion matrix for COM-B03C-R3D'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Domain completion matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Agent governance audit
        run: npm run audit:agent-governance
      - name: Governance invariants
        run: |
          grep -q '"matrixVersion": "1.3.113"' config/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.json
          grep -q '"maturity": 3' config/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.json
          grep -q '"productionGate": "blocked"' config/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.json
          grep -q '"stagingReadAuthority": false' config/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.json
          grep -q '"authorizationPhraseDefined": false' config/com-b03c-r3d-r3a-policy-materialization-evidence-readiness.json
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
