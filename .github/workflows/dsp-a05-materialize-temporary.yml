name: DSP-A05 Materialize Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/dsp-a05-materialize-temporary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dsp/dsp-001-baseline-audit
          fetch-depth: 0

      - name: Materialize DSP-A05 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dsp-a05.tar.gz.b64 <<'ARCHIVE'
[... ELLIPSIZATION ...]
ARCHIVE
          base64 -d /tmp/dsp-a05.tar.gz.b64 > /tmp/dsp-a05.tar.gz
          tar -xzf /tmp/dsp-a05.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f '.github/workflows/dsp-a05-materialize-temporary.yml'

      - name: Validate artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/disputes/dispute-operator-case-dual-control-readiness.js
          node --check scripts/audit-dsp-a05-operator-case-dual-control-readiness.js
          node --check scripts/test-dsp-a05-operator-case-dual-control-readiness.js
          node scripts/audit-dsp-a05-operator-case-dual-control-readiness.js
          node scripts/test-dsp-a05-operator-case-dual-control-readiness.js
          git diff --check

      - name: Enforce allowlist and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = [".github/workflows/dsp-a05-materialize-temporary.yml", ".github/workflows/dsp-a05-operator-case-dual-control-readiness.yml", "backend/modules/disputes/dispute-operator-case-dual-control-readiness.js", "config/dsp-a05-operator-case-dual-control-readiness.json", "docs/DSP-A05-OPERATOR-CASE-DUAL-CONTROL-READINESS.md", "scripts/audit-dsp-a05-operator-case-dual-control-readiness.js", "scripts/test-dsp-a05-operator-case-dual-control-readiness.js", "tests/fixtures/dsp-a05-operator-case-dual-control-cases.json"]
          changed = []
          output = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          for line in output.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(set(changed) - set(allowed))
          if unexpected:
              raise SystemExit('Unexpected files: ' + ', '.join(unexpected))
          required = [".github/workflows/dsp-a05-operator-case-dual-control-readiness.yml", "backend/modules/disputes/dispute-operator-case-dual-control-readiness.js", "config/dsp-a05-operator-case-dual-control-readiness.json", "docs/DSP-A05-OPERATOR-CASE-DUAL-CONTROL-READINESS.md", "scripts/audit-dsp-a05-operator-case-dual-control-readiness.js", "scripts/test-dsp-a05-operator-case-dual-control-readiness.js", "tests/fixtures/dsp-a05-operator-case-dual-control-cases.json"]
          missing = [path for path in required if not __import__('os').path.exists(path)]
          if missing:
              raise SystemExit('Missing materialized files: ' + ', '.join(missing))
          PY
          git config user.name "doke-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '.github/workflows/dsp-a05-materialize-temporary.yml' '.github/workflows/dsp-a05-operator-case-dual-control-readiness.yml' 'backend/modules/disputes/dispute-operator-case-dual-control-readiness.js' 'config/dsp-a05-operator-case-dual-control-readiness.json' 'docs/DSP-A05-OPERATOR-CASE-DUAL-CONTROL-READINESS.md' 'scripts/audit-dsp-a05-operator-case-dual-control-readiness.js' 'scripts/test-dsp-a05-operator-case-dual-control-readiness.js' 'tests/fixtures/dsp-a05-operator-case-dual-control-cases.json'
          git commit -m "feat(disputes): add DSP-A05 operator dual-control readiness"
          git push origin HEAD:dsp/dsp-001-baseline-audit
