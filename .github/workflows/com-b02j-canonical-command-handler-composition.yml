name: COM-B02J Canonical Command Handler Composition

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-command-handler-composition.js'
      - 'backend/modules/communities/route-handlers.js'
      - 'config/com-b02j-canonical-command-handler-composition.json'
      - 'scripts/test-com-b02j-canonical-command-handler-composition.js'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - '.github/workflows/com-b02j-canonical-command-handler-composition.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02j-command-handler-composition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02I predecessor and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=419dc9cd7c55044fbca838d6a9d1701d0272b1f4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-context-projection-composition-contract.js)" = "37b2628138bfff972c20f3a2ee1faa1d342d7bdd"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-providers.js)" = "b919a29337edf40d69109fb2f338616c75b3911b"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git rev-parse HEAD:backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          test "$(git rev-parse HEAD:config/com-b02i-canonical-command-source-providers.json)" = "4817bf608943a435c999f77badde57c9aa9a1764"
          test "$(git rev-parse HEAD:backend/modules/communities/community-membership-command.js)" = "bd26ebf77038cdba5077a2e524a7d15f3055a96f"
          test "$(git rev-parse HEAD:backend/modules/communities/community-governance-discipline-contract.js)" = "c7935bb5881d64b6d3f1b3ea4cccfb88075549b1"
          test "$(git rev-parse HEAD:backend/modules/communities/community-content-realtime-contract.js)" = "ec2c4b01e38b1a9c771154c37ffc8d896d33ce5d"
          test "$(git rev-parse HEAD:config/com-b02f-server-authority-main-runtime-wiring-authorization.json)" = "a1905e3cba0182edbda0741c96853a2e7bfacc53"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/community-supabase-repository-adapter.js)" = "94bc05d9797bc2b5673e440d0b25f09485d8215d"
          test "$(git rev-parse HEAD:supabase/migrations/20260805121500_com_b02b_server_authority.sql)" = "fd74f6abc029023c4e0972b32b35daca975c3d57"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-composition.js)" = "27b1e212c3656dd4ad5a1f2f604903ce44c8dbfb"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          test "$(git rev-parse HEAD:config/com-b02j-canonical-command-handler-composition.json)" = "50d67be0a5417afd7725a35fbe07c501f2c5992b"
          test "$(git rev-parse HEAD:scripts/test-com-b02j-canonical-command-handler-composition.js)" = "1c79b8ad7617d29c8cbe2b9074c92ae55b89bece"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02j-canonical-command-handler-composition.yml \
            backend/modules/communities/community-command-handler-composition.js \
            backend/modules/communities/route-handlers.js \
            config/com-b02j-canonical-command-handler-composition.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02j-canonical-command-handler-composition.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected"

      - name: Syntax and semantic handler-composition conformance
        run: |
          node --check backend/modules/communities/community-command-handler-composition.js
          node --check backend/modules/communities/route-handlers.js
          node --check scripts/test-com-b02j-canonical-command-handler-composition.js
          node scripts/test-com-b02j-canonical-command-handler-composition.js

      - name: Fail-closed runtime and remote hard blocks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/modules/communities/community-command-handler-composition.js
          grep -F "const B02F_FAILURE_CODE = 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED';" backend/modules/communities/route-handlers.js
          grep -F "throw createB02FBlockedRouteError('communities.membership.command')" backend/modules/communities/route-handlers.js
          grep -F "throw createB02FBlockedRouteError('communities.governance.command')" backend/modules/communities/route-handlers.js
          grep -F "throw createB02FBlockedRouteError('communities.content.command')" backend/modules/communities/route-handlers.js
          grep -F 'composeMembershipCommandRepositoryOnly' backend/modules/communities/route-handlers.js
          grep -F 'composeGovernanceCommandRepositoryOnly' backend/modules/communities/route-handlers.js
          grep -F 'composeContentCommandRepositoryOnly' backend/modules/communities/route-handlers.js
          ! git diff --name-only 419dc9cd7c55044fbca838d6a9d1701d0272b1f4 HEAD | grep '^supabase/migrations/'
          node - <<'NODE'
          const b=require('./config/com-b02j-canonical-command-handler-composition.json');
          if(b.authorization.type!=='standing_repository_only'||b.authorization.genericNextAuthorized!==true||b.authorization.singleUse!==false||b.authorization.sensitiveBoundariesExcluded!==true)throw new Error('B02J_STANDING_AUTHORIZATION_DRIFT');
          if(b.composition.repositoryExecutorBound!==false||b.composition.httpHandlersRemainFailClosed503!==true||b.composition.httpFailureCode!=='COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED')throw new Error('B02J_COMPOSITION_DRIFT');
          for(const k of ['routeRegistryMutationAuthority','moduleRouteLoaderMutationAuthority','runtimeActivationAuthority','repositoryRemoteExecutionAuthority','stagingDeploymentAuthority','stagingTrafficAuthority','rpcExecutionAuthority','networkAuthority','realtimeActivationAuthority','credentialReadAuthority','identityLifecycleRemoteAuthority','realCommunityMutationAuthority','migrationApplicationAuthority','triggerCreationAuthority','receiptCreationAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','r5iCreationAuthority'])if(b.authority[k]!==false)throw new Error(`B02J_FORBIDDEN_AUTHORITY:${k}`);
          for(const k of ['routeRegistryChanged','moduleRouteLoaderChanged','repositoryExecutorBound','runtimeActivated','stagingDeploymentExecuted','stagingTrafficEnabled','rpcExecuted','networkRequestExecuted','realtimeSubscriptionExecuted','credentialReadExecuted','remoteIdentityMutationExecuted','realCommunityMutationExecuted','migrationApplied','triggerCreated','receiptCreated','productionChanged','pullRequestMerged','readyForReviewChanged'])if(b.effects[k]!==false)throw new Error(`B02J_FORBIDDEN_EFFECT:${k}`);
          if(b.effects.handlerCompositionModuleMaterialized!==true||b.effects.communityRouteHandlersChanged!==true||b.effects.blockedExecuteHandlersPreserved!==true)throw new Error('B02J_EXPECTED_REPOSITORY_EFFECT_MISSING');
          if(b.functionalCheckpoint.lastFunctionalCheckpoint!=='COM-B03C-R5H'||b.functionalCheckpoint.exactRootCauseProven!==false||b.functionalCheckpoint.causalPromotionAllowed!==false||b.functionalCheckpoint.privatePresencePromotionAllowed!==false||b.functionalCheckpoint.r5iCreated!==false||b.functionalCheckpoint.r5iInferred!==false)throw new Error('B02J_FUNCTIONAL_CHECKPOINT_DRIFT');
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check 419dc9cd7c55044fbca838d6a9d1701d0272b1f4 HEAD
