name: SCHED-A04 Reconcile Once

on:
  push:
    branches:
      - ord/ord-001-baseline-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile A04 matrix, package and historical living gates
        run: |
          node <<'NODE'
          const fs = require('fs');

          const appendUnique = (items, value) => {
            if (!items.includes(value)) items.push(value);
          };
          const replaceRequired = (source, oldValue, newValue, path) => {
            if (!source.includes(oldValue)) throw new Error(`Expected fragment missing in ${path}: ${oldValue}`);
            return source.replace(oldValue, newValue);
          };

          const matrixPath = 'config/domain-completion-matrix.json';
          const packagePath = 'package.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/sched-001-a04-server-command-runtime.json', 'utf8'));

          matrix.version = '1.3.47';
          matrix.updatedAt = '2026-07-31T09:55:00-03:00';

          const sched = matrix.domains.find((domain) => domain.id === 'SCHED-001');
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!sched || !ord) throw new Error('ORD-001 or SCHED-001 missing from matrix');

          const paths = [
            'backend/modules/scheduling/scheduling-service.js',
            'backend/modules/scheduling/scheduling-command-handlers.js',
            'backend/modules/scheduling/scheduling-repository-port.js',
            'backend/modules/scheduling/scheduling-timezone.js',
            'backend/modules/scheduling/scheduling-normalization.js',
            'backend/modules/scheduling/scheduling-errors.js',
            'supabase/migrations/20260731151000_sched_a04_dst_local_projection_compatibility.sql',
            'config/sched-001-a04-server-command-runtime.json',
            'docs/SCHED-001-A04-SERVER-COMMAND-RUNTIME.md',
            'docs/validation/SCHED-001-A04-SERVER-COMMAND-RUNTIME.json',
            'scripts/audit-sched-001-a04-server-command-runtime.js',
            'scripts/test-sched-001-a04-scheduling-service-runtime.js',
            '.github/workflows/sched-001-a04-server-command-runtime.yml'
          ];
          const tests = [
            'audit:sched-001-a04-server-command-runtime',
            'test:sched-001-a04-scheduling-service-runtime'
          ];

          for (const domain of [sched, ord]) {
            domain.requiredPaths ||= [];
            domain.tests ||= [];
            paths.forEach((path) => appendUnique(domain.requiredPaths, path));
            tests.forEach((test) => appendUnique(domain.tests, test));
          }

          sched.maturity = 2;
          sched.serverAuthority = 'contract_only';
          sched.stagingEvidence = 'staging_canary';
          sched.securityGate = 'partial';
          sched.scanRoots ||= [];
          ['backend/modules/scheduling', 'supabase/migrations', 'scripts'].forEach((root) => appendUnique(sched.scanRoots, root));
          sched.tables ||= [];
          ['schedule_availability_rules', 'schedule_reservations', 'schedule_command_idempotency', 'schedule_domain_events']
            .forEach((table) => appendUnique(sched.tables, table));
          appendUnique(
            sched.evidence,
            'SCHED-A04 implemented a repository-agnostic transaction command runtime for all six scheduling commands with deterministic idempotency, optimistic concurrency, DST-safe timezone validation, durable events, order projections and rollback tests; no persistence adapter or migration was activated.'
          );
          appendUnique(
            sched.evidence,
            'SCHED-A04 generated an append-only compatibility migration that removes local wall-clock ordering as authority across DST fall-back while preserving UTC ordering; it has not been applied.'
          );
          appendUnique(
            ord.evidence,
            'ORD-001 now has an executable SCHED-A04 order projection port for schedule_reservation_id and scheduled_at, but ORD-B04 remains open until a transactional adapter and staging activation exist.'
          );

          const blockerDescriptions = {
            'SCHED-B02': 'SCHED-A04 implements all six canonical commands against a transaction-capable repository port, but the concrete persistence adapter and server activation remain absent.',
            'SCHED-B03': 'SCHED-A04 proves local overlap behavior and maps PostgreSQL exclusion SQLSTATE 23P01, but the generated migrations are not applied and no remote concurrent overlap proof exists.',
            'SCHED-B04': 'SCHED-A04 implements atomic order projection operations, but schedule_reservation_id is not applied and ORD-001 does not consume the active scheduling runtime.',
            'SCHED-B05': 'SCHED-A04 enforces trusted server actors and forbids professional booking commands, but the generated legacy policy hardening remains unapplied.'
          };
          for (const blocker of sched.blockers) {
            if (blockerDescriptions[blocker.id]) blocker.description = blockerDescriptions[blocker.id];
          }
          sched.nextActions = config.orderedNextActions;
          ord.nextActions = ord.nextActions.map((action, index) =>
            index === 0
              ? 'Complete SCHED-A05 transactional persistence adapter and staging readiness before ORD-B04 can consume schedule_reservation_id.'
              : action
          );

          pkg.scripts['audit:sched-001-a04-server-command-runtime'] = 'node scripts/audit-sched-001-a04-server-command-runtime.js';
          pkg.scripts['test:sched-001-a04-scheduling-service-runtime'] = 'node scripts/test-sched-001-a04-scheduling-service-runtime.js';

          fs.writeFileSync(matrixPath, `${JSON.stringify(matrix, null, 2)}\n`);
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const replacements = [
            {
              path: 'scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js',
              changes: [
                ["assert.strictEqual(sched.maturity, 1);", "assert(sched.maturity >= 1);"],
                ["assert.strictEqual(sched.serverAuthority, 'none');", "assert(['none', 'contract_only', 'partial', 'canonical'].includes(sched.serverAuthority));"],
                ["assert(sched.nextActions[0].includes('SCHED-A04'));", "assert(sched.nextActions[0].includes('SCHED-A05'));"],
                ["assert(ord.nextActions[0].includes('SCHED-A04'));", "assert(ord.nextActions[0].includes('SCHED-A05'));" ]
              ]
            },
            {
              path: 'scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js',
              changes: [
                ["assert.strictEqual(sched.maturity, 1);", "assert(sched.maturity >= 1);"],
                ["assert.strictEqual(sched.serverAuthority, 'none');", "assert(['none', 'contract_only', 'partial', 'canonical'].includes(sched.serverAuthority));"],
                ["assert.deepStrictEqual(sched.nextActions, config.orderedNextActions);\nassert(ord.nextActions[0].includes('SCHED-A04'));", "assert(config.orderedNextActions[0].includes('SCHED-A04'));\nassert(sched.nextActions[0].includes('SCHED-A05'));\nassert(ord.nextActions[0].includes('SCHED-A05'));" ]
              ]
            },
            {
              path: 'scripts/audit-sched-001-a03-reservation-migration-local-contract.js',
              changes: [
                ["assert.strictEqual(matrix.version, '1.3.46');", "assert(Number(String(matrix.version).split('.')[2]) >= 46, `Matrix version ${matrix.version} predates SCHED-A03.`);"],
                ["assert.deepStrictEqual(sched.nextActions, config.orderedNextActions);", "assert(config.orderedNextActions[0].includes('SCHED-A04'));\nassert(sched.nextActions[0].includes('SCHED-A05'));\nassert(ord.nextActions[0].includes('SCHED-A05'));" ]
              ]
            },
            {
              path: 'scripts/audit-ord-001-a11-scheduling-authority-handoff.js',
              changes: [
                ["assert.strictEqual(sched.maturity, 1);", "assert(sched.maturity >= 1);"],
                ["assert.strictEqual(sched.serverAuthority, 'none');", "assert(['none', 'contract_only', 'partial', 'canonical'].includes(sched.serverAuthority));"],
                ["assert(sched.nextActions[0].includes('SCHED-A04'));", "assert(sched.nextActions[0].includes('SCHED-A05'));"],
                ["assert(ord.nextActions[0].includes('SCHED-A04'));", "assert(ord.nextActions[0].includes('SCHED-A05'));" ]
              ]
            },
            {
              path: 'scripts/audit-ord-001-a10-blocker-reconciliation.js',
              changes: [
                ["assert(ord.nextActions[0].includes('SCHED-A04'));", "assert(ord.nextActions[0].includes('SCHED-A05'));" ]
              ]
            }
          ];

          for (const item of replacements) {
            let source = fs.readFileSync(item.path, 'utf8');
            for (const [oldValue, newValue] of item.changes) {
              source = replaceRequired(source, oldValue, newValue, item.path);
            }
            fs.writeFileSync(item.path, source);
          }
          NODE
      - name: Regenerate living matrix documents
        run: node scripts/audit-domain-completion-matrix.js --write
      - name: Validate reconciled A04 assets
        run: |
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/test-sched-001-a04-scheduling-service-runtime.js
          node scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          node scripts/test-sched-001-a03-reservation-migration-static.js
          node scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          node scripts/test-sched-001-a02-contract-runtime.js
          node scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-ord-001-a10-blocker-reconciliation.js
          node scripts/audit-domain-completion-matrix.js
      - name: Commit reconciliation when needed
        run: |
          if git diff --quiet; then
            echo 'SCHED-A04 reconciliation already complete.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/domain-completion-matrix.json package.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add scripts/audit-sched-001-a01-repository-baseline-staging-security-preflight.js
          git add scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js
          git add scripts/audit-sched-001-a03-reservation-migration-local-contract.js
          git add scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          git add scripts/audit-ord-001-a10-blocker-reconciliation.js
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'Reconcile SCHED-A04 runtime and living gates'
          git push origin HEAD:ord/ord-001-baseline-audit
