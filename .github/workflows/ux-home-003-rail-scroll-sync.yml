name: Doke UX-HOME-003 Rail Scroll Sync

on:
  push:
    branches:
      - ux/ux-home-003-rail-scroll-sync
    paths:
      - 'assets/js/pages/home/rail-scroll-state.js'
      - 'assets/js/pages/home/rail-scroll-controller.js'
      - 'scripts/test-ux-home-003-rail-scroll-state.js'
      - 'scripts/test-ux-home-003-rail-scroll-controller.js'
      - 'docs/ux/UX-HOME-003.md'
      - '.github/workflows/ux-home-003-rail-scroll-sync.yml'
      - 'sonar-project.properties'
  pull_request:
    paths:
      - 'assets/js/pages/home/rail-scroll-state.js'
      - 'assets/js/pages/home/rail-scroll-controller.js'
      - 'scripts/test-ux-home-003-rail-scroll-state.js'
      - 'scripts/test-ux-home-003-rail-scroll-controller.js'
      - 'docs/ux/UX-HOME-003.md'
      - '.github/workflows/ux-home-003-rail-scroll-sync.yml'
      - 'sonar-project.properties'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ux-home-003-rail-scroll-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/pages/home/rail-scroll-state.js
          node --check assets/js/pages/home/rail-scroll-controller.js
          node --check scripts/test-ux-home-003-rail-scroll-state.js
          node --check scripts/test-ux-home-003-rail-scroll-controller.js

      - name: Validate rail scroll state behavior
        run: node scripts/test-ux-home-003-rail-scroll-state.js

      - name: Validate rail scroll controller behavior
        run: node scripts/test-ux-home-003-rail-scroll-controller.js

      - name: Preserve inherited Home contracts
        run: |
          node scripts/test-ux-home-001-rail-state.js
          node scripts/test-ux-home-001-index-controller.js
          node scripts/test-ux-home-001-favorites-surface.js
          node scripts/test-ux-home-002-more-services-state.js
          node scripts/test-ux-home-002-more-services-surface.js

      - name: Generate executable LCOV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage/ux-home-003
          mkdir -p coverage/ux-home-003
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='assets/js/pages/home/rail-scroll-state.js' \
            --test-coverage-include='assets/js/pages/home/rail-scroll-controller.js' \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/ux-home-003/lcov.info \
            scripts/test-ux-home-003-rail-scroll-state.js \
            scripts/test-ux-home-003-rail-scroll-controller.js

      - name: Validate LCOV evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT='coverage/ux-home-003/lcov.info'
          test -s "${REPORT}"
          grep -Fq 'SF:assets/js/pages/home/rail-scroll-state.js' "${REPORT}"
          grep -Fq 'SF:assets/js/pages/home/rail-scroll-controller.js' "${REPORT}"
          FOUND="$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{print lh+0 "/" lf+0}' "${REPORT}")"
          echo "[ux-home-003] executable lines: ${FOUND}"

      - name: Require SonarQube Cloud credential
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo '::error::SONAR_TOKEN is unavailable to the trusted branch workflow.'
            exit 1
          fi

      - name: Upload LCOV evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-home-003-lcov-${{ github.event_name }}-${{ github.run_id }}
          path: coverage/ux-home-003/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Validate patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^
          fi

      - name: Analyze PR and enforce SonarQube Cloud Quality Gate
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=88
            -Dsonar.pullrequest.branch=ux/ux-home-003-rail-scroll-sync
            -Dsonar.pullrequest.base=ux/ux-home-002-more-services-filters
            -Dsonar.javascript.lcov.reportPaths=coverage/ux-home-003/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
