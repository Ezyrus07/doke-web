name: Doke PAY-B03B Generated Matrix Finalizer Temp

on:
  push:
    branches:
      - pay/pay-b03b-commercial-approval-evidence-build
    paths:
      - '.github/workflows/pay-b03b-generated-matrix-finalizer-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-b03b-commercial-approval-evidence-build
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate canonical matrix derivatives
        run: npm run write:domain-completion-matrix
      - name: Commit allowlisted generated outputs and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git rm .github/workflows/pay-b03b-generated-matrix-finalizer-temp.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/pay-b03b-generated-matrix-finalizer-temp.yml' 'docs/DOMAIN-COMPLETION-MATRIX.md' 'reports/generated/domain-completion-matrix-report.json' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git commit -m "Refresh matrix derivatives for PAY-B03B"
          git push origin HEAD:pay/pay-b03b-commercial-approval-evidence-build
