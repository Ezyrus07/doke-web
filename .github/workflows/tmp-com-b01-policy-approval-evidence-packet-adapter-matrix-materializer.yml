name: TEMP COM-B01 Adapter Matrix Materializer

on:
  push:
    branches:
      - tmp/com-b01-policy-approval-evidence-packet-adapter-matrix-22eea4b9
    paths:
      - '.github/workflows/tmp-com-b01-policy-approval-evidence-packet-adapter-matrix-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp/com-b01-policy-approval-evidence-packet-adapter-matrix-22eea4b9

      - name: Guard exact source and temporary isolation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD='22eea4b920cf400388071bcc4871610d2c25433f'
          WORKFLOW='.github/workflows/tmp-com-b01-policy-approval-evidence-packet-adapter-matrix-materializer.yml'
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git merge-base --is-ancestor '5eb51438fa6a89e1a3c8587eabeab16153d18855' HEAD
          test "$(git rev-parse HEAD:backend/modules/communities/community-policy-operational-integration-gate.js)" = '4c4424401b52060303735f178058a34d138ff42c'
          test "$(git rev-parse HEAD:config/com-b01-server-owned-policy-approval-evidence-template.json)" = 'e98a7fcb57706a17edae9bd3bbaaa36c42801817'
          test "$(git rev-parse HEAD:docs/validation/COM-B01-POLICY-APPROVAL-EVIDENCE-TEMPLATE-CERTIFICATION.json)" = '517479c1e1ae92226422fd0d27f77c73f4665738'
          git diff --name-only "$SOURCE_HEAD"..HEAD | sort > /tmp/source-diff
          printf '%s\n' "$WORKFLOW" | sort > /tmp/source-expected
          diff -u /tmp/source-expected /tmp/source-diff
          test -z "$(git status --porcelain)"

      - name: Materialize only canonical Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_BEFORE="$(git hash-object config/domain-completion-matrix.json)"
          npm run write:domain-completion-matrix
          test "$(git hash-object config/domain-completion-matrix.json)" = "$CONFIG_BEFORE"
          git diff --name-only | sort > /tmp/generated-diff
          printf '%s\n' \
            'docs/DOMAIN-COMPLETION-MATRIX.md' \
            'reports/generated/domain-completion-matrix-report.json' | sort > /tmp/generated-expected
          diff -u /tmp/generated-expected /tmp/generated-diff

      - name: Prove no Matrix promotion
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Maturidade média atual: **2.91/6**.' docs/DOMAIN-COMPLETION-MATRIX.md
          grep -F '| 15 | COM-001 | Comunidades, membros e moderação social | 3/6 | hybrid | partial | staging canary | partial | blocked |' docs/DOMAIN-COMPLETION-MATRIX.md
          grep -F '| FLOW-12 | Comunidade e conteúdo | hybrid | COM-001 | discover → join_or_request → role → post_or_message → report → sanction → appeal | COM-B02, COM-B03, COM-B04 |' docs/DOMAIN-COMPLETION-MATRIX.md

      - name: Validate generated derivatives and adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node --check backend/modules/communities/community-policy-approval-evidence-packet-adapter.js
          node scripts/audit-com-b01-policy-approval-evidence-packet-adapter.js
          node scripts/test-com-b01-policy-approval-evidence-packet-adapter.js
          node scripts/audit-com-b01-policy-operational-integration-gate.js
          node scripts/test-com-b01-policy-operational-integration-gate.js
          git diff --check

      - name: Commit exactly two generated derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doke-ci'
          git config user.email 'doke-ci@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git diff --cached --name-only | sort > /tmp/staged-diff
          printf '%s\n' \
            'docs/DOMAIN-COMPLETION-MATRIX.md' \
            'reports/generated/domain-completion-matrix-report.json' | sort > /tmp/staged-expected
          diff -u /tmp/staged-expected /tmp/staged-diff
          git commit -m 'chore(com): materialize B01 adapter matrix derivatives [skip ci]'
          git push origin HEAD:tmp/com-b01-policy-approval-evidence-packet-adapter-matrix-22eea4b9
