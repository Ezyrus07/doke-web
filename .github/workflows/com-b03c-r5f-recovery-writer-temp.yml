name: COM-B03C-R5F Exact-Scope Recovery Writer

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5f-recovery-writer-temp.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fail-closed recovery install boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "com/com-001-baseline-audit"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "f309ec7758789831666d87d9a0c7070a7310d3dd"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/com-b03c-r5f-recovery-writer-temp.yml"
          test "$(git rev-parse HEAD^:.github/workflows/com-b03c-r5f-recovery-writer-temp.yml)" = "6a239638ce3928253749fae63b518466b890b5af"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5f-boundary-writer-temp.yml)" = "a0b75c2ef7ee4cc04f41fdb637969c8dcb71ffd9"
          test ! -e backend/modules/communities/community-realtime-private-auth-r5f.js
          test ! -e config/com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.json
          test ! -e scripts/test-com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.js
          test ! -e docs/validation/COM-B03C-R5F-R5E-BOUND-R5D-EXECUTION-AUTHORIZATION-ISSUANCE-CONSUMPTION-READINESS.json
          test ! -e .github/workflows/com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.yml
          test ! -e config/com-b03c-r5f-r5e-fresh-execution-authorization-consumption.json
          test ! -e config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Freeze certified lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5e.js)" = "e6e71f10007c796576e036902dfb1cb8e285b7f8"
          test "$(git rev-parse HEAD:config/com-b03c-r5e-fresh-head-bound-r5d-execution-authorization-lifecycle-readiness.json)" = "18b1b6c3d96cc6a826896b3f22b8e82c9351f61c"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5d.js)" = "7cde416f2922230bae6b1e4b1e48fdfaf411da99"
          test "$(git rev-parse HEAD:config/com-b03c-r5b-r5a-fresh-authorization-consumption.json)" = "a2ed29dc6a44f9d62f5159dfeabd2c769f677b50"
          test "$(git rev-parse HEAD:scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js)" = "ff083f29e43b2f85045b23bf8f12a4b354fb0005"
      - name: Extract frozen R5F materialization scripts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('.github/workflows/com-b03c-r5f-boundary-writer-temp.yml', 'utf8');
          function extract(name, nextName) {
            const startMarker = `      - name: ${name}\n`;
            const endMarker = `      - name: ${nextName}\n`;
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`R5F_RECOVERY_STEP_NOT_FOUND_${name}`);
            const section = source.slice(start, end);
            const runMarker = '        run: |\n';
            const runAt = section.indexOf(runMarker);
            if (runAt < 0) throw new Error(`R5F_RECOVERY_RUN_BLOCK_NOT_FOUND_${name}`);
            const body = section.slice(runAt + runMarker.length);
            const lines = body.split('\n');
            const decoded = lines.map((line) => {
              if (!line) return '';
              if (!line.startsWith('          ')) throw new Error(`R5F_RECOVERY_INDENT_DRIFT_${name}`);
              return line.slice(10);
            }).join('\n');
            return `#!/usr/bin/env bash\nset -euo pipefail\n${decoded}\n`;
          }
          fs.writeFileSync('/tmp/r5f-materialize.sh', extract('Materialize R5F repository-only boundary', 'Reconcile canonical COM-001 through R5F'));
          fs.writeFileSync('/tmp/r5f-reconcile.sh', extract('Reconcile canonical COM-001 through R5F', 'Canonical audits and exact delta'));
          NODE
          chmod 700 /tmp/r5f-materialize.sh /tmp/r5f-reconcile.sh
      - name: Reproduce R5F repository-only boundary
        shell: bash
        run: |
          set -euo pipefail
          /tmp/r5f-materialize.sh
          /tmp/r5f-reconcile.sh
          git restore --source=HEAD -- .github/workflows/com-b03c-r5f-boundary-writer-temp.yml
          test -e .github/workflows/com-b03c-r5f-recovery-writer-temp.yml
      - name: Validate R5F and canonical governance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-realtime-private-auth-r5f.js
          node --check scripts/test-com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.js
          node scripts/test-com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.js
          node - <<'NODE'
          const r5f = require('./backend/modules/communities/community-realtime-private-auth-r5f');
          try { r5f.assertRemoteExecutionBoundaryAbsent(); process.exit(1); }
          catch (error) { if (error?.code !== r5f.REMOTE_EXECUTION_BLOCK_CODE) throw error; }
          NODE
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git restore --source=HEAD -- docs/HOME-AUTHORITY-CLASSIFICATION.md docs/PAGE-ASSET-AUTHORITY-MATRIX.md
          git diff --check
          test ! -e config/com-b03c-r5f-r5e-fresh-execution-authorization-consumption.json
          test ! -e config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
      - name: Stage non-workflow R5F surface only
        shell: bash
        run: |
          set -euo pipefail
          permanent_workflow=.github/workflows/com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.yml
          test -f "$permanent_workflow"
          workflow_blob=$(git hash-object "$permanent_workflow")
          printf '%s\n' "R5F_PERMANENT_WORKFLOW_BLOB=$workflow_blob"

          git add -- \
            backend/modules/communities/community-realtime-private-auth-r5f.js \
            config/com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            scripts/test-com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.js
          git add -f -- \
            docs/validation/COM-B03C-R5F-R5E-BOUND-R5D-EXECUTION-AUTHORIZATION-ISSUANCE-CONSUMPTION-READINESS.json \
            reports/generated/domain-completion-matrix-report.json

          expected=$(printf '%s\n' \
            'backend/modules/communities/community-realtime-private-auth-r5f.js' \
            'config/com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.json' \
            'config/domain-completion-matrix.json' \
            'docs/DOMAIN-COMPLETION-MATRIX.md' \
            'docs/validation/COM-B03C-R5F-R5E-BOUND-R5D-EXECUTION-AUTHORIZATION-ISSUANCE-CONSUMPTION-READINESS.json' \
            'reports/generated/domain-completion-matrix-report.json' \
            'scripts/test-com-b03c-r5f-r5e-bound-r5d-execution-authorization-issuance-consumption-readiness.js' | sort)
          staged=$(git diff --cached --name-only | sort)
          printf '%s\n' '--- R5F non-workflow staged scope ---' "$staged"
          test "$staged" = "$expected"
          git diff --cached --check
          test -z "$(git diff --name-only)"
          untracked=$(git ls-files --others --exclude-standard | sort)
          test "$untracked" = "$permanent_workflow"
          test -e .github/workflows/com-b03c-r5f-boundary-writer-temp.yml
          test -e .github/workflows/com-b03c-r5f-recovery-writer-temp.yml
          test ! -e config/com-b03c-r5f-r5e-fresh-execution-authorization-consumption.json
          test ! -e config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
      - name: Commit non-workflow canonical R5F readiness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(com): prepare R5F non-workflow authorization boundary'
          git push origin HEAD:com/com-001-baseline-audit
