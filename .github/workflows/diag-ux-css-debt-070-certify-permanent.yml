name: Doke UX-CSS-DEBT-070 Permanent Certification

on:
  push:
    branches:
      - diag/ux-css-debt-070-certify-permanent
    paths:
      - .github/workflows/diag-ux-css-debt-070-certify-permanent.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 149bfa8cdb931543aabd1afb0a5453379f565ae8
      PARENT_SHA: 6e89d01531842722985c7b2abcd2723a3f383d26
      PARENT_PARENT_SHA: 23cc5c7496897f0d9b742039598574ffb2b93dfb
      TARGET_TREE: 2c72e5e5ad700641a16630b6c5ba9535c222dee8
      TARGET_FILE: assets/css/components/cards/publication-card.css
      PARENT_TARGET_BLOB: a4735b4ca0141e4db72abdfe7caac77ba01acebc
      TARGET_BLOB: da5dc1df3e1c260bd1802f14c1f2c10b305138b1
      EXPECTED_SHA256: 82d79e7c616ea3c59f7f6c2b2516d1c6a27a86d6ae27e7397f0833a0565b5c97
      EXPECTED_BYTES: 17333
      PERMANENT_BRANCH: ux/ux-css-debt-070-publication-card-compaction
      DIAG_BRANCH: diag/ux-css-debt-070-certify-permanent
      RESULT_FILE: .diagnostics/ux-css-debt-070-certification.txt
      RANKING_RUN: 32084413898
      SOURCE_RUN: 32084542860
      RUNTIME_REACH_RUN: 32085362154
      R1_RUN: 32085443453
      CANDIDATE_RUN: 32085583864
      PROMOTION_RUN: 32085798824
    steps:
      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Exact permanent identity and full-history guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git rev-list --count "$PARENT_SHA..$TARGET_SHA")" = "1"
          test "$(git diff --name-only "$PARENT_SHA" "$TARGET_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$TARGET_SHA" -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          git diff --quiet "$PARENT_SHA" "$TARGET_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          git diff --check "$PARENT_SHA" "$TARGET_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          echo "IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|fullHistory=1|files=1|additions=0|deletions=3"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate active graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures

      - name: Independent reconstruction importer reconciliation and proof transfer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),path=require('path');
          const f=process.env.TARGET_FILE,permanent=fs.readFileSync(f,'utf8'),parent=cp.execFileSync('git',['show',`${process.env.PARENT_SHA}:${f}`],{encoding:'utf8'}),ls=parent.split('\n');
          const rows=new Map([[272,'    min-height: 162px;'],[276,'    padding: 12px 13px 13px;'],[402,'    border-radius: var(--radius-md);']]);
          for(const [i,row] of rows)if((ls[i]||'').replace(/\r$/,'')!==row)throw new Error(`parent row drift ${i+1}`);
          const rebuilt=ls.filter((_,i)=>!rows.has(i)).join('\n');if(rebuilt!==permanent)throw new Error('independent reconstruction not byte-identical');
          const h=crypto.createHash('sha256').update(Buffer.from(rebuilt)).digest('hex');if(h!==process.env.EXPECTED_SHA256||Buffer.byteLength(rebuilt)!==Number(process.env.EXPECTED_BYTES))throw new Error('rebuild identity mismatch');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(x=>x.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;const norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const x of tracked){const text=fs.readFileSync(x,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(norm(m[1],x));meta.set(x,{text,imports});}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(x=>meta.has(x));while(todo.length){const x=todo.pop();if(active.has(x)||!meta.has(x))continue;active.add(x);for(const n of meta.get(x).imports)if(meta.has(n))todo.push(n)}if(active.size!==401)throw new Error(`active ${active.size}`);
          const all=[...meta].filter(([x,m])=>x!==f&&m.imports.includes(f)).map(([x])=>x).sort(),act=all.filter(x=>active.has(x));const expected=['assets/css/core/components.css','assets/css/pages/home-runtime-feed.css','assets/css/pages/marketplace-detail-foundation.css','assets/css/pages/profile-runtime-components.css','assets/css/pages/search-results-runtime-display.css'];if(JSON.stringify(all)!==JSON.stringify(expected)||JSON.stringify(act)!==JSON.stringify(expected))throw new Error(`importers ${JSON.stringify(all)}/${JSON.stringify(act)}`);
          let reach=0;for(const p of report.pageAssets){const seen=new Set(),stack=[...p.css.filter(x=>meta.has(x))];let hit=false;while(stack.length){const x=stack.pop();if(seen.has(x)||!meta.has(x))continue;seen.add(x);if(x===f){hit=true;break}for(const n of meta.get(x).imports)if(meta.has(n))stack.push(n)}if(hit)reach++}if(reach!==26)throw new Error(`reach ${reach}`);
          console.log(`RECONSTRUCTION PASS|byteIdentical=1|sha256=${h}|bytes=${Buffer.byteLength(rebuilt)}|allImporters=5|activeImporters=5|reachPages=26|ranking=${process.env.RANKING_RUN}|source=${process.env.SOURCE_RUN}|runtimeReach=${process.env.RUNTIME_REACH_RUN}|r1=${process.env.R1_RUN}|candidate=${process.env.CANDIDATE_RUN}|promotion=${process.env.PROMOTION_RUN}|proofTransferByExactCandidateBytes=1|browserRequired=1`);
          NODE

      - name: Generate responsive baseline from exact parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$PARENT_SHA"
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          cp reports/responsive-index-baseline.json /tmp/ux070-cert-responsive.json
          git checkout "$TARGET_SHA"
          cp /tmp/ux070-cert-responsive.json reports/responsive-index-baseline.json
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Responsive contract on exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-responsive-contract.js | tee /tmp/ux070-cert-responsive.log
          grep -q 'Checks: 893' /tmp/ux070-cert-responsive.log
          grep -q 'Failures: 0' /tmp/ux070-cert-responsive.log
          grep -q 'Skips: 277' /tmp/ux070-cert-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and permanent canonical residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length})}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function dc(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0,pageResidual=0;for(const f of active){const p=dc(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++;if(f.includes('/pages/'))pageResidual++}}const guards=[['assets/css/components/cards/publication-card.css',369,0,'070'],['assets/css/core/mobile/ui-standard.css',76,0,'069'],['assets/css/components/internal/list-page-toolbar.css',269,0,'068'],['assets/css/components/overlays/modal-visual-contract.css',475,0,'067'],['assets/css/components/internal/filter-select-standard.css',404,0,'066'],['assets/css/components/ui-surface/buttons-close.css',110,0,'065'],['assets/css/components/layout/doke-layout-system.css',108,0,'064'],['assets/css/components/panels/mobile-panel.css',94,0,'063'],['assets/css/components/forms/form-flow-comfort.css',113,0,'062'],['assets/css/components/overlays/action-modal-system.css',264,0,'061'],['assets/css/components/overlays/financial-modal-system.css',645,0,'060'],['assets/css/components/media-lightbox.css',280,0,'059'],['assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css',216,0,'058'],['assets/css/components/chat-composer.css',125,0,'057'],['assets/css/components/before-after-workers-preview/mobile-comment-sheets.css',302,0,'056'],['assets/css/patterns/settings-shell.css',104,0,'055'],['assets/css/components/before-after-workers-preview/publication-light-modal.css',75,0,'054']];if(files!==4||total!==37||highDead!==0||pageResidual!==0)throw new Error(`residual ${files}/${total}/${highDead}/${pageResidual}`);for(const [f,d,dead,l] of guards){const p=dc(meta.get(f).text);if(p.decl!==d||p.dead!==dead)throw new Error(`${l} ${p.decl}/${p.dead}`)}console.log('PERMANENT RESIDUAL PASS|active=401|high=37|files=4|dead=37|highDead=0|pageResidual=0|070=369/0|069=76/0|068=269/0|067=475/0|066=404/0|065=110/0|064=108/0|063=94/0|062=113/0|061=264/0|060=645/0|059=280/0|058=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e; npm audit --json >/tmp/ux070-cert-audit.json; code=$?; set -e
          node <<'NODE'
          const a=require('/tmp/ux070-cert-audit.json'),v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);
          NODE
          echo "npmAuditExit=$code"

      - name: Final exact full-history restore and branch identity
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test -z "$(git status --porcelain)"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          echo "CERTIFICATION RESTORE PASS|sha=$TARGET_SHA|fullHistory=1|remotePermanent=$remote_sha|productMutation=0"

      - name: Publish certification evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "PARENT_SHA=$PARENT_SHA"
            echo "TARGET_TREE=$TARGET_TREE"
            echo "PARENT_TARGET_BLOB=$PARENT_TARGET_BLOB"
            echo "TARGET_BLOB=$TARGET_BLOB"
            echo "SHA256=$EXPECTED_SHA256"
            echo "BYTES=$EXPECTED_BYTES"
            echo "DIFF=1 file +0/-3"
            echo "FULL_HISTORY=1"
            echo "RECONSTRUCTION=byte-identical"
            echo "IMPORTERS=5/5 active"
            echo "REACH=26 pages"
            echo "RANKING=$RANKING_RUN"
            echo "SOURCE=$SOURCE_RUN"
            echo "RUNTIME_REACH=$RUNTIME_REACH_RUN"
            echo "R1=$R1_RUN"
            echo "CANDIDATE=$CANDIDATE_RUN"
            echo "PROMOTION=$PROMOTION_RUN"
            echo "BROWSER_PROOF_TRANSFER=PASS"
            echo "RESPONSIVE=893/0/277"
            echo "CONFLICTS=339"
            echo "DUPLICATES=0/0"
            echo "DOMAIN=23/15/2.91/12"
            echo "ACTIVE_CSS=401"
            echo "HIGH_RISK_ACTIVE_CSS=37"
            echo "RESIDUAL=4/37/0"
            echo "PAGE_RESIDUAL=0"
            echo "DEPENDENCIES=13/0/10/1/2"
            echo "RESULT=PASS"
          } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH"
          git checkout -B diag-output "origin/$DIAG_BRANCH"
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m "diag: record UX-CSS-DEBT-070 certification [skip ci]"
          git push origin "HEAD:refs/heads/$DIAG_BRANCH"
