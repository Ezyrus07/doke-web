name: COM-B02T Command Handler Repository Orchestration Matrix Materialization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02t-command-handler-repository-orchestration-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=1ab929d52f40ca54361f13fdd5d86ba390676161
          temp=.github/workflows/com-b02t-command-handler-repository-orchestration-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-orchestration.js)" = "f094ddc01a3f05975794bafb925d64f146a51ea2"
          test "$(git rev-parse HEAD:config/com-b02t-command-handler-repository-orchestration.json)" = "fffa465c28b8a289ee8d0fdd6fcf529467d3df1e"
          test "$(git rev-parse HEAD:scripts/test-com-b02t-command-handler-repository-orchestration.js)" = "27a2135a51af05a6737a10c256e81fad147285a3"
          test "$(git rev-parse HEAD:.github/workflows/com-b02t-command-handler-repository-orchestration.yml)" = "d349159dd8137db3292dbae651800aa09fa7d761"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-binding-surface.js)" = "0778690aaaf428247159a08eac83a38796888f41"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-repository-binding-composition.js)" = "cfc3bd8790d99b1ee61bf52fa93fd2bb2a6bf3bc"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-repository-executor-service-role-provider-binding.js)" = "384c3a452b7e0e66d1bf2ddfeebb341c8b36f3c9"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "de55f9f2782aefacbef4c60fb5ac3d3f4c7293aa"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02t-command-handler-repository-orchestration-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed B02T assertions
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/community-command-handler-repository-orchestration.js
          test "$(git rev-parse HEAD:$TARGET)" = "f094ddc01a3f05975794bafb925d64f146a51ea2"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "de55f9f2782aefacbef4c60fb5ac3d3f4c7293aa"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          node --check "$TARGET"
          node --check scripts/test-com-b02t-command-handler-repository-orchestration.js
          node scripts/test-com-b02t-command-handler-repository-orchestration.js
          ! grep -E 'process\.env|Deno\.env|Bun\.env|createClient\(|fetch\(|https?://|SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.rpc\(' "$TARGET"
          grep -F "repositoryOperationInvoked: false" "$TARGET"
          grep -F "executableReferencesExposed: false" "$TARGET"
          grep -F "runtimeActivated: false" "$TARGET"
          ! git diff --name-only 0b052f88758bb45b5b7b521dba668600bd14e3a9 HEAD | grep '^supabase/migrations/'

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02t-command-handler-repository-orchestration-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for B02T repository orchestration" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
