name: ANA-A08 Retention Cohort Projection
# ANA-A08 final generated-matrix state certification

on:
  pull_request:
    paths:
      - 'backend/modules/analytics/retention-cohort-projection.js'
      - 'config/ana-a08-retention-cohort-projection.json'
      - 'docs/ANA-A08-RETENTION-COHORT-PROJECTION.md'
      - 'scripts/audit-ana-a08-retention-cohort-projection.js'
      - 'scripts/test-ana-a08-retention-cohort-projection.js'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - 'package.json'
      - '.github/workflows/ana-a08-retention-cohort-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/analytics/retention-cohort-projection.js
          node --check scripts/audit-ana-a08-retention-cohort-projection.js
          node --check scripts/test-ana-a08-retention-cohort-projection.js
      - name: ANA-A08 audit
        run: npm run audit:ana-a08-retention-cohort-projection
      - name: ANA-A08 conformance
        run: npm run test:ana-a08-retention-cohort-projection
      - name: ANA-A04 regression
        run: |
          npm run audit:ana-a04-marketplace-funnel-health-projections
          npm run test:ana-a04-marketplace-funnel-health-projections
      - name: ANA-A07 regression
        run: |
          npm run audit:ana-a07-freshness-window-authority
          npm run test:ana-a07-freshness-window-authority
      - name: Domain matrix regression
        run: npm run audit:domain-completion-matrix
      - name: Diff hygiene
        run: git diff --check
