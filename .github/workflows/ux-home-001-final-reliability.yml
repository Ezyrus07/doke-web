name: Apply UX-HOME-001 Final Reliability

on:
  push:
    branches:
      - ux/ux-home-001-rail-states
    paths:
      - '.github/workflows/ux-home-001-final-reliability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-home-001-rail-states
          fetch-depth: 0

      - name: Apply final optional chaining correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/pages/index-data-controller.js')
          source = path.read_text(encoding='utf-8')
          old = "if (child.matches && child.matches('[data-list-loading], [data-home-rail-feedback]')) return total;"
          new = "if (child.matches?.('[data-list-loading], [data-home-rail-feedback]')) return total;"
          if source.count(old) != 1:
              raise SystemExit(f'expected one final reliability guard, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Validate controller behavior
        run: |
          node --check assets/js/pages/index-data-controller.js
          node scripts/test-ux-home-001-rail-state.js
          node scripts/test-ux-home-001-index-controller.js
          node scripts/audit-index-data-controller.js
          node scripts/test-public-service-catalog-contract.js
          node scripts/audit-action-favorite-ownership.js
          git diff --check

      - name: Commit final reliability correction
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add assets/js/pages/index-data-controller.js
          git commit -m 'UX-HOME-001 resolve final controller reliability finding'
          git push origin HEAD:ux/ux-home-001-rail-states
