name: CAT-A03 Cumulative Audit Reconcile

on:
  pull_request:
    branches: [MAIN]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a03-audit-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Reconcile CAT-A01 cumulative audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/audit-service-catalog-authority-baseline.js';
          let source = fs.readFileSync(file, 'utf8');

          const replaceOnce = (oldValue, newValue, label) => {
            const index = source.indexOf(oldValue);
            if (index === -1) throw new Error('CAT-A03 audit marker missing: ' + label);
            if (source.indexOf(oldValue, index + oldValue.length) !== -1) throw new Error('CAT-A03 audit marker duplicated: ' + label);
            source = source.slice(0, index) + newValue + source.slice(index + oldValue.length);
          };

          replaceOnce(
            "  catA02EvidenceJson: 'docs/validation/CAT-001-A02-SERVICE-AUTHORITY-RETIREMENT.json',\n  journal: 'docs/DOKE-ENGINEERING-JOURNAL.md',",
            "  catA02EvidenceJson: 'docs/validation/CAT-001-A02-SERVICE-AUTHORITY-RETIREMENT.json',\n  catA03EvidenceJson: 'docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json',\n  journal: 'docs/DOKE-ENGINEERING-JOURNAL.md',",
            'CAT-A03 evidence file'
          );

          replaceOnce(
            ".filter(([name]) => name !== 'catA02EvidenceJson')",
            ".filter(([name]) => !['catA02EvidenceJson', 'catA03EvidenceJson'].includes(name))",
            'optional evidence filter'
          );

          replaceOnce(
            "const matrix = JSON.parse(read(files.matrix));",
            "const catA03Evidence = exists(files.catA03EvidenceJson)\n  ? JSON.parse(read(files.catA03EvidenceJson))\n  : null;\nconst catA03Applied = Boolean(\n  catA03Evidence &&\n  catA03Evidence.domain === 'CAT-001' &&\n  catA03Evidence.sublot === 'CAT-A03' &&\n  ['validation_pending', 'done'].includes(catA03Evidence.status)\n);\n\nconst matrix = JSON.parse(read(files.matrix));",
            'CAT-A03 implementation detection'
          );

          const oldServiceBlock = `const service = read(files.service);
[
  'function submitForReview(',
  'return repository.submitForReview(service, options)',
  'function transitionOwned(',
  'function updateOwned(',
  'return repository.update(serviceId, patch || {})',
  'function deactivateOwned(',
  'function reactivateOwned(',
  'function archiveOwned('
].forEach((marker) => assert(service.includes(marker), \`service lifecycle marker missing: \${marker}\`));`;

          const newServiceBlock = `const service = read(files.service);
[
  'function submitForReview(',
  'return repository.submitForReview(service, options)',
  'function transitionOwned(',
  'function updateOwned(',
  'function deactivateOwned(',
  'function reactivateOwned(',
  'function archiveOwned('
].forEach((marker) => assert(service.includes(marker), \`service lifecycle marker missing: \${marker}\`));

if (catA03Applied) {
  [
    'repository.transitionOwnedLifecycle',
    'repository.submitForReview(candidate',
    'DOKE_SERVICE_MUTATION_SPLIT_REQUIRED',
    'DOKE_SERVICE_ARCHIVED'
  ].forEach((marker) => assert(service.includes(marker), \`post-CAT-A03 lifecycle marker missing: \${marker}\`));
  assert(!service.includes('return repository.update(serviceId, patch || {})'), 'retired generic remote edit route remains');
} else {
  assert(service.includes('return repository.update(serviceId, patch || {})'), 'historical generic edit route changed before CAT-A03');
}`;

          replaceOnce(oldServiceBlock, newServiceBlock, 'service lifecycle cumulative block');
          fs.writeFileSync(file, source);
          NODE

      - name: Validate cumulative CAT-A01
        run: node scripts/audit-service-catalog-authority-baseline.js

      - name: Validate cumulative CAT-A02
        run: node scripts/audit-service-catalog-authority-retirement.js

      - name: Validate CAT-A03
        run: |
          node scripts/audit-service-lifecycle-authority.js
          node scripts/test-service-lifecycle-authority-runtime.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Publish cumulative audit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-service-catalog-authority-baseline.js
          git commit -m "Reconcile CAT-A01 audit for CAT-A03 authority"
          git fetch origin cat/cat-001-baseline-audit
          git rebase origin/cat/cat-001-baseline-audit
          git push origin HEAD:cat/cat-001-baseline-audit
