name: 0000 TEMP COM-B02CE Matrix Derivatives Export

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02ce-matrix-derivatives-export.yml'

permissions:
  contents: read

jobs:
  export-matrix-derivatives:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 8c950b938fafb8d32ff72a3b4e687c9e374c3e58
      EXPECTED_PARENT_TREE: 590587bbf1321a6a966babf5c4babef2246f219c
      EXECUTION_RUN_ID: '32721876143'
      EXECUTION_JOB_ID: '97414818662'
      HELPER_PATH: .github/workflows/0000-temp-com-b02ce-matrix-derivatives-export.yml
      EXECUTOR_PATH: .github/workflows/0000-temp-com-b02ce-authorized-single-use-register-execution.yml
      EXECUTOR_BLOB: c5cfb391a1793243d524da7988d8e279059437c9
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      TARGET_BLOB: c1fe633bfbe4db36099c98180d1c630fedd6c616
      CONFIG: config/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.json
      CONFIG_BLOB: b440145f64256ad2403d390748ebf8e68b4a9090
      TEST: scripts/test-com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      TEST_BLOB: f846f57748229e0983d887d1b4ee0cc3b7d29d35
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      B02CD_CONFIG: config/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.json
      B02CD_CONFIG_BLOB: 0e900788a5966caeca1f82277eecc5cdad42ecd0
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact exporter head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze consumed execution proof and recovery scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_PARENT_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          actual="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$actual" = "$HELPER_PATH"
          test "$EXECUTION_RUN_ID" = '32721876143'
          test "$EXECUTION_JOB_ID" = '97414818662'
          test "$(git rev-parse HEAD:$EXECUTOR_PATH)" = "$EXECUTOR_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$B02CD_CONFIG)" = "$B02CD_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          grep -F '"status": "QUARANTINED_NOT_REPOSITORY_CERTIFIED"' "$B02CD_CONFIG"
          grep -F '"singleUse": true' "$CONFIG"
          grep -F '"reusable": false' "$CONFIG"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static-only B02CE recovery preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          grep -F 'registry.set(key, storedState);' "$TARGET"
          ! grep -E 'registry\.(get|has|delete)\(' "$TARGET" "$TEST"
          ! grep -E 'implementation\.(resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Materialize canonical Matrix derivatives without reexecution
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- "$MATRIX_SOURCE"
          expected="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          mkdir -p artifact/docs artifact/reports/generated
          cp "$MATRIX_MD" artifact/docs/DOMAIN-COMPLETION-MATRIX.md
          cp "$MATRIX_REPORT" artifact/reports/generated/domain-completion-matrix-report.json
          echo "MATRIX_MD_BLOB=$(git hash-object "$MATRIX_MD")" >> "$GITHUB_ENV"
          echo "MATRIX_REPORT_BLOB=$(git hash-object "$MATRIX_REPORT")" >> "$GITHUB_ENV"

      - name: Report exact derivative identities
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix-md-blob=$MATRIX_MD_BLOB"
          echo "matrix-report-blob=$MATRIX_REPORT_BLOB"
          test "$(git hash-object artifact/docs/DOMAIN-COMPLETION-MATRIX.md)" = "$MATRIX_MD_BLOB"
          test "$(git hash-object artifact/reports/generated/domain-completion-matrix-report.json)" = "$MATRIX_REPORT_BLOB"

      - name: Upload exact Matrix derivatives only
        uses: actions/upload-artifact@v4
        with:
          name: com-b02ce-matrix-derivatives
          path: |
            artifact/docs/DOMAIN-COMPLETION-MATRIX.md
            artifact/reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
