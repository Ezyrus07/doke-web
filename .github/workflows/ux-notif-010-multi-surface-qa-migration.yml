name: Doke UX-NOTIF-010 Multi Surface QA Migration

on:
  push:
    branches:
      - ux/ux-notif-010-multi-surface-qa-migration
    paths:
      - 'assets/js/core/notification-action.js'
      - 'assets/js/core/notification-toast.js'
      - 'assets/js/services/message-command-executor.js'
      - 'assets/js/services/message-service.js'
      - 'scripts/test-ux-notif-010-multi-surface-rollout.js'
      - 'scripts/test-ux-notif-009-notification-actions.js'
      - 'scripts/test-ux-notif-003-toast-manager.js'
      - 'scripts/test-ux-notif-003-toast-manager-runtime.js'
      - 'docs/ux/UX-NOTIF-010.md'
      - 'notificacoes.html'
      - 'mensagens.html'
      - 'comunidade-interna.html'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - '.github/workflows/ux-notif-010-multi-surface-qa-migration.yml'
      - 'sonar-project.properties'
  pull_request:
    paths:
      - 'assets/js/core/notification-action.js'
      - 'assets/js/core/notification-toast.js'
      - 'assets/js/services/message-command-executor.js'
      - 'assets/js/services/message-service.js'
      - 'scripts/test-ux-notif-010-multi-surface-rollout.js'
      - 'scripts/test-ux-notif-009-notification-actions.js'
      - 'scripts/test-ux-notif-003-toast-manager.js'
      - 'scripts/test-ux-notif-003-toast-manager-runtime.js'
      - 'docs/ux/UX-NOTIF-010.md'
      - 'notificacoes.html'
      - 'mensagens.html'
      - 'comunidade-interna.html'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - '.github/workflows/ux-notif-010-multi-surface-qa-migration.yml'
      - 'sonar-project.properties'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ux-notif-010-multi-surface-qa-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified H09 parent
        shell: bash
        env:
          EXPECTED_BASE: e97d244671b7f672fbcd9735d2b15319414e5f67
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ACTUAL_BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin ux/ux-notif-009-quick-actions --quiet
            ACTUAL_BASE="$(git merge-base HEAD origin/ux/ux-notif-009-quick-actions)"
          fi
          test "${ACTUAL_BASE}" = "${EXPECTED_BASE}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate clean permanent H10 tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/ux-notif-010-migration-apply.yml
          test ! -e .github/workflows/ux-notif-010-matrix-sync.yml
          test ! -e scripts/tmp-ux-notif-010-matrix.js
          test ! -e docs/validation/UX-NOTIF-010-MATRIX-SYNC-REQUEST.md
          test -e reports/generated/domain-completion-matrix-report.json

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/core/notification-action.js
          node --check assets/js/core/notification-toast.js
          node --check assets/js/services/message-command-executor.js
          node --check assets/js/services/message-service.js
          node --check scripts/test-ux-notif-010-multi-surface-rollout.js
          node --check scripts/test-ux-notif-009-notification-actions.js
          node --check scripts/test-ux-notif-003-toast-manager.js
          node --check scripts/test-ux-notif-003-toast-manager-runtime.js

      - name: Validate canonical domain matrix
        run: npm run audit:domain-completion-matrix

      - name: Validate canonical agent governance
        run: npm run audit:agent-governance

      - name: Validate H10 multi-surface migration and capability gate
        run: node scripts/test-ux-notif-010-multi-surface-rollout.js

      - name: Preserve H09 quick-action command authority
        run: node scripts/test-ux-notif-009-notification-actions.js

      - name: Preserve MSG-A07 command reliability authority
        run: |
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime

      - name: Preserve UX-NOTIF-008 browser notification authority
        run: node scripts/test-ux-notif-008-browser-notifications.js

      - name: Preserve UX-NOTIF-007 delivery authority
        run: |
          node scripts/test-ux-notif-007-delivery-policy.js
          node scripts/test-ux-notif-007-toast-delivery-integration.js
          node scripts/test-ux-notif-007-adapter-delegation.js
          node scripts/test-notification-delivery-controls-contract.js

      - name: Preserve UX-NOTIF-001 presentation authority
        run: |
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js

      - name: Preserve UX-NOTIF-002 event and repository authority
        run: |
          node scripts/test-ux-notif-002-notification-event.js
          node scripts/test-ux-notif-002-repository-adapter.js
          node scripts/test-ux-notif-002-producer-envelopes.js
          node scripts/test-ux-notif-002-financial-producer-handoff.js

      - name: Preserve UX-NOTIF-003 toast authority
        run: |
          node scripts/test-ux-notif-003-toast-manager.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-in-app-delegation.js

      - name: Preserve UX-NOTIF-004 badge authority
        run: node scripts/test-ux-notif-004-badge-snapshot.js

      - name: Preserve UX-NOTIF-005 reconciliation authority
        run: |
          node scripts/test-ux-notif-005-inbox-reconciliation.js
          node scripts/test-ux-notif-005-adapter-repository-contract.js
          node scripts/test-ux-notif-005-remote-mutation-runtime.js
          node scripts/test-ux-notif-005-in-app-mutation-runtime.js

      - name: Preserve UX-NOTIF-006 event policy authority
        run: |
          node scripts/test-ux-notif-006-event-policy-matrix.js
          node scripts/test-ux-notif-006-badge-policy-integration.js
          node scripts/test-ux-notif-006-producer-policy-coverage.js

      - name: Preserve notification repository and API authority
        run: |
          node scripts/test-notification-authority-contract.js
          node scripts/test-notifications-supabase-repository-contract.js
          node scripts/audit-notifications-api-contract.js

      - name: Preserve account and session isolation contracts
        run: |
          node scripts/test-ux-priv-001-account-storage.js
          node scripts/audit-auth-session-contracts.js

      - name: Validate responsive structural contracts
        run: |
          npm run baseline:responsive-index
          node scripts/test-responsive-contract.js
          npm run audit:responsive-boundaries

      - name: Generate executable LCOV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage/ux-notif-010
          mkdir -p coverage/ux-notif-010
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='assets/js/core/notification-action.js' \
            --test-coverage-include='assets/js/core/notification-toast.js' \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/ux-notif-010/lcov.info \
            scripts/test-ux-notif-010-multi-surface-rollout.js \
            scripts/test-ux-notif-009-notification-actions.js \
            scripts/test-ux-notif-003-toast-manager.js \
            scripts/test-ux-notif-003-toast-manager-runtime.js \
            scripts/test-ux-notif-003-in-app-delegation.js

      - name: Validate LCOV evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT='coverage/ux-notif-010/lcov.info'
          test -s "${REPORT}"
          grep -Fq 'SF:assets/js/core/notification-action.js' "${REPORT}"
          grep -Fq 'SF:assets/js/core/notification-toast.js' "${REPORT}"
          FOUND="$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{print lh+0 "/" lf+0}' "${REPORT}")"
          echo "[ux-notif-010] executable lines: ${FOUND}"

      - name: Require SonarQube Cloud credential
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo '::error::SONAR_TOKEN is unavailable to the trusted branch workflow.'
            exit 1
          fi

      - name: Upload LCOV evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-notif-010-lcov-${{ github.event_name }}-${{ github.run_id }}
          path: coverage/ux-notif-010/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Validate patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^
          fi

      - name: Analyze PR and enforce SonarQube Cloud Quality Gate
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=110
            -Dsonar.pullrequest.branch=ux/ux-notif-010-multi-surface-qa-migration
            -Dsonar.pullrequest.base=ux/ux-notif-009-quick-actions
            -Dsonar.javascript.lcov.reportPaths=coverage/ux-notif-010/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
