name: TEMP UX-QA-DEBT-008D C1 Certifier R1

on:
  push:
    branches:
      - diag/ux-qa-debt-008d-c1-certifier-r1

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout TEMP branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze C1 and detached authorities
        shell: bash
        run: |
          set -euo pipefail
          PARENT='dd9bfa9c56ec8c338c8de5db8283ab8dd28f6fe3'
          CANDIDATE='65fc2342f315acba99fa39b0cfc695c08ca4d255'
          CANDIDATE_TREE='bfd34a50eafec796c1c68165d48ac5b1566eed93'
          OWNER='scripts/test-navigation-lifecycle-finalization-contract.js'
          OWNER_BLOB='0b21a7171167de4d62f623d3d95b3ae8a2d447c3'
          TEMP_PATH='.github/workflows/0000-temp-ux-qa-debt-008d-c1-certifier-r1.yml'

          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(git rev-parse "$CANDIDATE^")" = "$PARENT"
          test "$(git show -s --format=%T "$CANDIDATE")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$CANDIDATE:$OWNER")" = "$OWNER_BLOB"
          test "$(git diff --name-only "$CANDIDATE"..HEAD)" = "$TEMP_PATH"
          test "$(git diff --name-only "$PARENT".."$CANDIDATE")" = "$OWNER"

          test "$(git rev-parse "$CANDIDATE:auth/login.html")" = '6a4f57f4f01d591fb9fbfe3d52a29f3c960fc35c'
          test "$(git rev-parse "$CANDIDATE:auth/cadastro.html")" = 'b37679c165e75babeb8676994a983e2cc823d46b'
          test "$(git rev-parse "$CANDIDATE:auth/esqueci-senha.html")" = '72a2e1eb457349e64e6cbe81038d5e13aa6abd5e'
          test "$(git rev-parse "$CANDIDATE:assets/js/pages/auth-password-pages.js")" = '00fd71f58915a069405cc3bd1ea6ad9761dd8161'
          test "$(git rev-parse "$CANDIDATE:assets/js/pages/auth.js")" = '651669cfadbb0652d395173e1cbfd6a48d512b78'
          test "$(git rev-parse "$CANDIDATE:assets/js/core/navigation-lifecycle.js")" = '23aa36beb2929d4538b336e6670ee38e04057919'

          git checkout --detach "$CANDIDATE"
          git reset --hard "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test "$(git rev-parse "HEAD:$OWNER")" = "$OWNER_BLOB"
          test -z "$(git status --porcelain)"

          echo 'FREEZE=PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run frozen governance and auth-navigation gates
        shell: bash
        run: |
          set -euo pipefail
          PARENT='dd9bfa9c56ec8c338c8de5db8283ab8dd28f6fe3'
          CANDIDATE='65fc2342f315acba99fa39b0cfc695c08ca4d255'
          OWNER='scripts/test-navigation-lifecycle-finalization-contract.js'

          node --check "$OWNER"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PARENT".."$CANDIDATE"
          npm run test:navigation-lifecycle-finalization-contract
          npm run audit:navigation-lifecycle-contract
          npm run test:navigation-lifecycle-core-contract
          npm run audit:auth-session

          test "$(git diff --name-only "$PARENT".."$CANDIDATE")" = "$OWNER"
          git diff --quiet "$PARENT".."$CANDIDATE" -- \
            auth/login.html \
            auth/cadastro.html \
            auth/esqueci-senha.html \
            assets/js/pages/auth-password-pages.js \
            assets/js/pages/auth.js \
            assets/js/core/navigation-lifecycle.js \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            docs/validation/domain-completion-staging-snapshot.json \
            tests/visual reports/baseline

          echo 'NODE_CHECK=PASS'
          echo 'DOMAIN_MATRIX=PASS'
          echo 'AGENT_GOVERNANCE=PASS'
          echo 'DIFF_CHECK=PASS'
          echo 'FINALIZATION_CONTRACT=PASS'
          echo 'NAVIGATION_LIFECYCLE_AUDIT=PASS'
          echo 'NAVIGATION_LIFECYCLE_CORE=PASS'
          echo 'AUTH_SESSION=PASS'

      - name: Prove exact controller-order assertions and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/generated
          node <<'NODE'
          const fs = require('fs');
          const owner = fs.readFileSync('scripts/test-navigation-lifecycle-finalization-contract.js', 'utf8');
          const read = (file) => fs.readFileSync(file, 'utf8');

          if (!owner.includes("for (const file of ['auth/login.html', 'auth/cadastro.html'])")) {
            throw new Error('login/cadastro shared legacy-controller assertion was relaxed or moved');
          }
          if (!owner.includes("const file = 'auth/esqueci-senha.html';")) {
            throw new Error('forgot-password dedicated assertion block missing');
          }
          if (!owner.includes("../assets/js/pages/auth-password-pages.js")) {
            throw new Error('dedicated password controller assertion missing');
          }
          if (!owner.includes("legacy auth controller must remain absent")) {
            throw new Error('legacy auth absence assertion missing');
          }

          const login = read('auth/login.html');
          const cadastro = read('auth/cadastro.html');
          const recovery = read('auth/esqueci-senha.html');
          const lifecycle = '../assets/js/core/navigation-lifecycle.js';
          const legacy = '../assets/js/pages/auth.js';
          const dedicated = '../assets/js/pages/auth-password-pages.js';

          for (const [name, html] of [['auth/login.html', login], ['auth/cadastro.html', cadastro]]) {
            const lifecycleIndex = html.indexOf(lifecycle);
            const legacyIndex = html.indexOf(legacy);
            if (!(lifecycleIndex >= 0 && legacyIndex >= 0 && lifecycleIndex < legacyIndex)) {
              throw new Error(`${name}: canonical lifecycle -> auth.js order not preserved`);
            }
          }

          const recoveryLifecycleIndex = recovery.indexOf(lifecycle);
          const recoveryDedicatedIndex = recovery.indexOf(dedicated);
          const recoveryLegacyIndex = recovery.indexOf(legacy);
          if (!(recoveryLifecycleIndex >= 0 && recoveryDedicatedIndex >= 0 && recoveryLifecycleIndex < recoveryDedicatedIndex)) {
            throw new Error('auth/esqueci-senha.html: canonical lifecycle -> dedicated controller order not preserved');
          }
          if (recoveryLegacyIndex >= 0) {
            throw new Error('auth/esqueci-senha.html: legacy auth.js unexpectedly present');
          }

          const receipt = {
            result: 'PASS',
            checkpoint: 'UX-QA-DEBT-008D-C1-CERTIFIER-R1',
            parent: 'dd9bfa9c56ec8c338c8de5db8283ab8dd28f6fe3',
            candidate: '65fc2342f315acba99fa39b0cfc695c08ca4d255',
            candidateTree: 'bfd34a50eafec796c1c68165d48ac5b1566eed93',
            owner: 'scripts/test-navigation-lifecycle-finalization-contract.js',
            ownerBlob: '0b21a7171167de4d62f623d3d95b3ae8a2d447c3',
            loginLifecycleBeforeLegacyAuth: true,
            cadastroLifecycleBeforeLegacyAuth: true,
            recoveryLifecycleBeforeDedicatedAuth: true,
            recoveryLegacyAuthAbsent: true,
            finalizationContract: true,
            navigationLifecycleAudit: true,
            navigationLifecycleCore: true,
            authSession: true,
            nodeCheck: true,
            domainMatrix: true,
            agentGovernance: true,
            diffCheck: true,
            criteriaRelaxed: 0,
            introducedRegressions: 0,
            candidateMutation: false,
            htmlMutation: false,
            productMutation: false,
            authSemanticsMutation: false,
            runtimeMutation: false,
            matrixMutation: false,
            snapshotMutation: false,
            visualBaselineMutation: false,
            permanentBranchCreated: false,
            prCreated: false,
            readyForReview: false,
            merge: false,
            repositoryOnly: true
          };
          fs.writeFileSync('reports/generated/ux-qa-debt-008d-c1-certifier-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(`UX_QA_DEBT_008D_C1_CERTIFIER_FINAL=${JSON.stringify(receipt)}`);
          NODE

      - name: Prove candidate remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='65fc2342f315acba99fa39b0cfc695c08ca4d255'
          CANDIDATE_TREE='bfd34a50eafec796c1c68165d48ac5b1566eed93'
          OWNER='scripts/test-navigation-lifecycle-finalization-contract.js'
          OWNER_BLOB='0b21a7171167de4d62f623d3d95b3ae8a2d447c3'

          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test "$(git rev-parse "HEAD:$OWNER")" = "$OWNER_BLOB"
          git diff --quiet HEAD --
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'POST_GATES_IMMUTABILITY=PASS'

      - name: Upload C1 certifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-debt-008d-c1-certifier-${{ github.sha }}
          path: |
            reports/generated/ux-qa-debt-008d-c1-certifier-receipt.json
          if-no-files-found: warn
          retention-days: 14
