name: Doke SCHED-B04C Domain Error Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-domain-error-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-domain-error-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Preserve private function domain errors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repository_path = Path('backend/modules/scheduling/scheduling-postgres-repository.js')
          repository = repository_path.read_text()
          old_import = "const { assertTransactionPort } = require('./scheduling-repository-port');"
          new_import = "const { assertTransactionPort, mapRepositoryError } = require('./scheduling-repository-port');"
          if repository.count(old_import) != 1:
              raise SystemExit('Unexpected scheduling repository import shape')
          repository = repository.replace(old_import, new_import)

          old_project = """    async projectOrderSchedule(orderId, reservationId, scheduledAt) {
                const response = await query(
                  `/* sched-a05:project-order-schedule */
                   select *
                   from private.apply_order_schedule_projection(
                     $1::uuid,
                     $2::uuid,
                     $3::timestamptz
                   )`,
                  [orderId, reservationId, scheduledAt]
                );
                return requireRow(response, 'DOKE_SCHEDULE_ORDER_PROJECTION_FAILED');
              },
          """
          new_project = """    async projectOrderSchedule(orderId, reservationId, scheduledAt) {
                try {
                  const response = await query(
                    `/* sched-a05:project-order-schedule */
                     select *
                     from private.apply_order_schedule_projection(
                       $1::uuid,
                       $2::uuid,
                       $3::timestamptz
                     )`,
                    [orderId, reservationId, scheduledAt]
                  );
                  return requireRow(response, 'DOKE_SCHEDULE_ORDER_PROJECTION_FAILED');
                } catch (error) {
                  throw mapRepositoryError(error);
                }
              },
          """
          if repository.count(old_project) != 1:
              raise SystemExit('Unexpected projectOrderSchedule shape')
          repository = repository.replace(old_project, new_project)

          old_clear = """    async clearOrderSchedule(orderId, reservationId) {
                const response = await query(
                  `/* sched-a05:clear-order-schedule */
                   select *
                   from private.clear_order_schedule_projection(
                     $1::uuid,
                     $2::uuid
                   )`,
                  [orderId, reservationId]
                );
                return requireRow(response, 'DOKE_SCHEDULE_ORDER_CLEAR_FAILED');
              },
          """
          new_clear = """    async clearOrderSchedule(orderId, reservationId) {
                try {
                  const response = await query(
                    `/* sched-a05:clear-order-schedule */
                     select *
                     from private.clear_order_schedule_projection(
                       $1::uuid,
                       $2::uuid
                     )`,
                    [orderId, reservationId]
                  );
                  return requireRow(response, 'DOKE_SCHEDULE_ORDER_CLEAR_FAILED');
                } catch (error) {
                  throw mapRepositoryError(error);
                }
              },
          """
          if repository.count(old_clear) != 1:
              raise SystemExit('Unexpected clearOrderSchedule shape')
          repository_path.write_text(repository.replace(old_clear, new_clear))

          test_path = Path('scripts/test-sched-001-a05-postgres-repository-runtime.js')
          test = test_path.read_text()
          marker = "  const rollbackClient = createScriptedClient({});"
          addition = """  const privateProjectionError = new Error('DOKE_SCHEDULE_RESERVATION_PROJECTION_INVALID');
          privateProjectionError.code = '23514';
          const privateProjectionClient = createScriptedClient({
            'project-order-schedule': [privateProjectionError]
          });
          const privateProjectionTx = createTransactionPort(privateProjectionClient);
          await assert.rejects(
            () => privateProjectionTx.projectOrderSchedule('order-1', 'res-foreign', '2026-08-03T12:00:00.000Z'),
            (error) => error.code === 'DOKE_SCHEDULE_RESERVATION_PROJECTION_INVALID' && error.sqlState === '23514'
          );

          """
          if test.count(marker) != 1:
              raise SystemExit('Unexpected A05 rollback marker')
          test_path.write_text(test.replace(marker, addition + marker, 1))

          executor_path = Path('scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js')
          executor = executor_path.read_text()
          old_expectation = """  () => directTransactionPort.projectOrderSchedule(
              fixtures.orders.replacement,
              mainHold.reservation.id,
              mainHold.reservation.startsAt
            ),
            'DOKE_SCHEDULE_ORDER_PROJECTION_FAILED'
          );
          """
          new_expectation = """  () => directTransactionPort.projectOrderSchedule(
              fixtures.orders.replacement,
              mainHold.reservation.id,
              mainHold.reservation.startsAt
            ),
            'DOKE_SCHEDULE_RESERVATION_PROJECTION_INVALID'
          );
          """
          if executor.count(old_expectation) != 1:
              raise SystemExit('Unexpected B04C replacement rejection expectation')
          executor_path.write_text(executor.replace(old_expectation, new_expectation))
          PY

      - name: Validate reconciled contracts
        run: |
          set -euo pipefail
          node --check backend/modules/scheduling/scheduling-postgres-repository.js
          node --check scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Publish reconciled domain errors
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add backend/modules/scheduling/scheduling-postgres-repository.js
          git add scripts/test-sched-001-a05-postgres-repository-runtime.js
          git add scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          if git diff --cached --quiet; then
            echo "Domain error handling already reconciled."
            exit 0
          fi
          git commit -m "fix(sched): preserve private projection domain errors"
          git push origin HEAD:ord/ord-001-baseline-audit
