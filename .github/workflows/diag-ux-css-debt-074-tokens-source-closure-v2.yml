name: Doke UX-CSS-DEBT-074 Tokens Source Closure V2

on:
  push:
    branches: [diag/ux-css-debt-074-tokens-source-closure-v2]
    paths: [.github/workflows/diag-ux-css-debt-074-tokens-source-closure-v2.yml]

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 3a2f10f67fcf7452114959d9c3a217852a765c55
      PARENT_SHA: c79ccdced5ed83b77ef050a66cbc2284e6fc9ca8
      TARGET_TREE: c847008cab6841b7291f8b1f1c03091e5e6cb8f9
      TARGET_FILE: assets/css/core/tokens.css
      TARGET_BLOB: 3c2a22b31ad8a73740b1491398a3c6e82acc6a65
      RANKING_RUN: 32130332702
      DIAG_BRANCH: diag/ux-css-debt-074-tokens-source-closure-v2
      RESULT_FILE: .diagnostics/ux-css-debt-074-source-closure-v2.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/closure.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');
          const f=process.env.TARGET_FILE,text=fs.readFileSync(f,'utf8'),lines=text.split('\n');
          const rows=new Map([[40,'  --doke-type-tracking-display: -0.035em;'],[41,'  --doke-type-tracking-label: 0.08em;'],[261,'  --doke-overlay-border: 0;'],[262,'  --doke-overlay-shadow: 0 18px 48px rgba(20, 50, 80, 0.14);'],[434,'  --doke-close-button-size: var(--close-button-size);']]);for(const [i,v] of rows)if((lines[i]||'').replace(/\r$/,'')!==v)throw Error(`row drift ${i+1}`);
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function parse(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],rx=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(rx);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winnerLine:l.line,winnerValue:l.value,winnerImportant:l.important});if(!l||d.important||!l.important)last.set(k,d)}return{ds,dead}}
          const p=parse(text);if(p.ds.length!==855||p.dead.length!==5)throw Error(`target metrics ${p.ds.length}/${p.dead.length}`);
          const expected=[[41,'--doke-type-tracking-display','-0.035em',958,'-0.04em'],[42,'--doke-type-tracking-label','0.08em',961,'0.08em'],[262,'--doke-overlay-border','0',421,'var(--modal-surface-border)'],[263,'--doke-overlay-shadow','0 18px 48px rgba(20, 50, 80, 0.14)',424,'var(--modal-surface-shadow)'],[435,'--doke-close-button-size','var(--close-button-size)',946,'var(--close-button-size)']];
          const got=p.dead.sort((a,b)=>a.line-b.line);for(let i=0;i<expected.length;i++){const [line,prop,val,wline,wval]=expected[i],d=got[i];if(!d||d.line!==line||d.property!==prop||d.value!==val||d.winnerLine!==wline||d.winnerValue!==wval||d.context!==''||d.important||d.winnerImportant)throw Error(`cascade drift ${JSON.stringify(d)}`);console.log(`CASCADE ROW|prop=${prop}|earlyLine=${line}|early=${val}|winnerLine=${wline}|winner=${wval}|sameSelector=1|sameContext=1|sameImportance=1|unconditional=1`)}
          if(new Set(got.map(x=>x.selector)).size!==1)throw Error('selector family drift');
          const candidate=lines.filter((_,i)=>!rows.has(i)).join('\n'),c=parse(candidate);if(c.ds.length!==850||c.dead.length!==0)throw Error(`candidate metrics ${c.ds.length}/${c.dead.length}`);const b=Buffer.from(candidate),hash=crypto.createHash('sha256').update(b).digest('hex');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(x=>x.endsWith('.css')),importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const x of tracked){const src=fs.readFileSync(x,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(src)))imports.push(normImport(m[1],x));meta.set(x,{imports})}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(pg=>pg.css))].filter(x=>meta.has(x));while(todo.length){const x=todo.pop();if(active.has(x)||!meta.has(x))continue;active.add(x);for(const n of meta.get(x).imports)if(meta.has(n))todo.push(n)}if(active.size!==401)throw Error(`active ${active.size}`);const importers=[...meta].filter(([x,m])=>x!==f&&m.imports.includes(f)).map(([x])=>x).sort(),activeImporters=importers.filter(x=>active.has(x));if(!activeImporters.includes('assets/css/core/index.css'))throw Error(`active importer ${activeImporters}`);const reach=[];for(const pg of report.pageAssets){const seen=new Set(),stack=[...(pg.css||[]).filter(x=>meta.has(x))];while(stack.length){const x=stack.pop();if(seen.has(x)||!meta.has(x))continue;seen.add(x);if(x===f){reach.push(pg.page);break}for(const n of meta.get(x).imports)if(meta.has(n))stack.push(n)}}reach.sort();if(reach.length!==27)throw Error(`reach ${reach.length}`);
          console.log(`IMPORTER PASS|all=${importers.length}|active=${activeImporters.length}|allList=${importers.join(',')||'-'}|activeList=${activeImporters.join(',')||'-'}`);console.log(`ACTIVE REACH|pages=${reach.length}|pageList=${reach.join(',')}`);console.log('CASCADE PASS|target=855/5|candidate=850/0|family=:root|identical=2|changed=3|sameCascadeKey=5/5|unconditional=5/5|browserRequired=0|reason=same-root-global-later-custom-property-winner');console.log(`CANDIDATE IDENTITY|candidate=850/0|sha256=${hash}|bytes=${b.length}|files=1|additions=0|deletions=5`);console.log(`SOURCE CLOSURE PASS|target=${f}|targetBlob=${process.env.TARGET_BLOB}|ranking=${process.env.RANKING_RUN}|browserRequired=0`);
          NODE
      - id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL; if test '${{ steps.validate.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TARGET_SHA=$TARGET_SHA"; echo "VALIDATE=${{ steps.validate.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep '^IMPORTER PASS|' /tmp/closure.log || true; grep '^ACTIVE REACH|' /tmp/closure.log || true; grep '^CASCADE ROW|' /tmp/closure.log || true; grep '^CASCADE PASS|' /tmp/closure.log || true; grep '^CANDIDATE IDENTITY|' /tmp/closure.log || true; grep '^SOURCE CLOSURE PASS|' /tmp/closure.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 120 /tmp/closure.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record UX-CSS-DEBT-074 source closure v2 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
