name: COM-B03C R5H Extension Proof Matrix Derivative Sync TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-proof-matrix-derivative-sync-temp.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only parent and installation scope
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5h-extension-proof-matrix-derivative-sync-temp.yml
          test "$(git rev-parse HEAD^)" = "e7346431cd8feed71df5624194681f049619469d"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"

      - name: Regenerate deterministic Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          printf 'expected generated diff:\n%s\nactual generated diff:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Repository-only validation
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed COM-001 assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const matrix = require('./config/domain-completion-matrix.json');
          const proof = require('./config/com-b03c-r5h-bound-private-realtime-extension-causal-proof-obligation.json');
          const com = matrix.domains.find((domain) => domain.id === 'COM-001');
          if (matrix.version !== '1.3.113') throw new Error('MATRIX_VERSION_DRIFT');
          if (!com || com.maturity !== 3 || com.productionGate !== 'blocked') throw new Error('COM_PROMOTION_FORBIDDEN');
          if (proof.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H') throw new Error('R5H_CHECKPOINT_DRIFT');
          if (proof.functionalCheckpoint.r5iCreated !== false || proof.functionalCheckpoint.r5iInferred !== false) throw new Error('R5I_MUST_NOT_EXIST');
          if (proof.proofObligation.exactRootCauseProven !== false || proof.proofObligation.causalPromotionAllowed !== false) throw new Error('CAUSAL_PROMOTION_MUST_REMAIN_BLOCKED');
          if (proof.governance.executionBoundaryDefined !== false || proof.governance.triggerCreated !== false || proof.governance.receiptCreated !== false || proof.governance.executionAttempted !== false) throw new Error('EXECUTION_BOUNDARY_MUST_REMAIN_ABSENT');
          for (const key of ['remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (proof.governance[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          NODE

      - name: Commit only regenerated derivatives and remove temporary writer
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5h-extension-proof-matrix-derivative-sync-temp.yml
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git rm "$workflow"
          expected="$(printf '%s\n' "$workflow" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --cached --name-only | sort)"
          printf 'expected staged:\n%s\nactual staged:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '4189827+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): synchronize Matrix derivatives for extension proof'
          git push origin HEAD:com/com-001-baseline-audit
