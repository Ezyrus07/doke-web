name: TEMP UX-STATE-001 Community Canonical View Candidate A R3
on:
  push:
    branches:
      - diag/ux-state-001-community-canonical-view-candidate-a-r3
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    env:
      PARENT: 84dc170e5bcf8b04aaf7eaba6f46c1ae67b730af
      PARENT_TREE: 9c2545f50d34ebf81e3976fb5c421e6f5f616b32
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-state-001-community-canonical-view-candidate-a-r3.yml
      TARGET: assets/js/pages/comunidade.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Qualify minimal public state normalization
        shell: bash
        run: |
          set -euo pipefail
          DIAG_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$DIAG_HEAD" | awk '{print $2}')" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-only -r "$DIAG_HEAD")" = "$WORKFLOW_PATH"
          git checkout --detach "$PARENT" >/dev/null
          test -z "$(git status --porcelain)"
          npm ci --ignore-scripts

          PARENT_BLOB="$(git rev-parse HEAD:$TARGET)"
          PARENT_SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          PARENT_BYTES="$(wc -c < "$TARGET" | tr -d ' ')"

          node <<'NODE'
          const fs=require('fs');
          const f='assets/js/pages/comunidade.js';
          let s=fs.readFileSync(f,'utf8');
          const before='page.dataset.viewState = nextState;';
          const after="page.dataset.viewState = nextState === 'hydrated' ? 'ready' : nextState;";
          const n=s.split(before).length-1;
          if(n!==1) throw new Error(`expected exactly one assignment, got ${n}`);
          fs.writeFileSync(f,s.replace(before,after));
          NODE

          test "$(git diff --name-only)" = "$TARGET"
          test "$(git diff --numstat | awk '{print $1" "$2" "$3}')" = "1 1 $TARGET"
          git diff --check
          node --check "$TARGET"

          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/pages/comunidade.js','utf8');
          const authority=fs.readFileSync('assets/js/state/state-contracts.js','utf8');
          const required=[
            "page.dataset.viewState = nextState === 'hydrated' ? 'ready' : nextState;",
            "page.dataset.state = nextState;",
            "document.body.dataset.dataState = nextState;",
            "page.setAttribute('aria-busy', String(nextState === 'loading'));",
            "setCommunityPageState('hydrated');",
            "page.dataset.communityHydrated = 'true'",
            "nextState === 'hydrated' && incomingCommunityTransition?.context?.listingState"
          ];
          for(const token of required) if(!s.includes(token)) throw new Error('missing required token: '+token);
          if(s.includes('page.dataset.viewState = nextState;')) throw new Error('legacy public assignment remains');
          if(!/READY\s*:\s*['\"]ready['\"]/.test(authority)) throw new Error('canonical READY missing');
          if(/HYDRATED\s*:\s*['\"]hydrated['\"]/.test(authority)) throw new Error('HYDRATED unexpectedly canonical');
          console.log('SOURCE_CONTRACT=PASS');
          console.log('PUBLIC_STATE_SEMANTIC_PROOF='+JSON.stringify({result:'PASS',hydratedInput:{pageState:'hydrated',publicViewState:'ready',bodyDataState:'hydrated',ariaBusy:'false'},loadingInput:{pageState:'loading',publicViewState:'loading',bodyDataState:'loading',ariaBusy:'true'},errorInput:{pageState:'error',publicViewState:'error',bodyDataState:'error',ariaBusy:'false'},internalHydrationPreserved:true}));
          NODE

          CANDIDATE_BLOB="$(git hash-object "$TARGET")"
          CANDIDATE_SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          CANDIDATE_BYTES="$(wc -c < "$TARGET" | tr -d ' ')"

          node scripts/test-community-hydration-transition-contract.js
          node scripts/test-first-paint-loading-contract.js
          npm run audit:main-state-runtime-coverage

          printf 'UX_STATE_001_CANDIDATE_A_R3={"result":"PASS","parent":"%s","parentTree":"%s","target":"%s","parentBlob":"%s","parentSha256":"%s","parentBytes":%s,"candidateBlob":"%s","candidateSha256":"%s","candidateBytes":%s,"changedFiles":1,"additions":1,"deletions":1,"canonicalPublicState":"ready","internalHydrationState":"hydrated","productMutation":false,"criteriaRelaxed":0,"repositoryOnly":true}\n' "$PARENT" "$PARENT_TREE" "$TARGET" "$PARENT_BLOB" "$PARENT_SHA256" "$PARENT_BYTES" "$CANDIDATE_BLOB" "$CANDIDATE_SHA256" "$CANDIDATE_BYTES"

          git reset --hard "$PARENT" >/dev/null
          git clean -fd >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT"
          test -z "$(git status --porcelain)"
