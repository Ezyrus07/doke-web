name: Doke UX CSS Important 003 Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-003-promote-permanent]
    paths: [.github/workflows/diag-ux-css-important-003-promote-permanent.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: b44fe12f2e81cbe155f154527aed78b90144c552
      TARGET_FILE: assets/css/pages/home/mobile-layout.css
      TARGET_BLOB: 576d351eb5e1447cd6e1e188e005b8153573fb3f
      EXPECTED_SHA256: d1a9d8a573010ace9aeae3960b9c148116a0c3b44d9e65893d23df67aef59ecd
      EXPECTED_BYTES: '5744'
      PERMANENT_BRANCH: ux/ux-css-important-003-home-mobile-runtime-stable
      DIAG_BRANCH: diag/ux-css-important-003-promote-permanent
      RESULT_FILE: .diagnostics/ux-css-important-003-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.PARENT_SHA }}', fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/promote.log) 2>&1
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          remote_before=$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')
          test "$remote_before" = "$PARENT_SHA"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,src=fs.readFileSync(f,'utf8');
          const oldCard=`  body.home-index-shell .home-search-hero__card {\n    display: grid !important;\n    gap: 12px;\n    padding: 10px 10px 12px;\n    background: linear-gradient(180deg, var(--home-stage15-brand) 0%, var(--home-stage15-brand-strong) 100%);\n    border: 1px solid color-mix(in srgb, var(--home-stage15-brand) 82%, white);\n    border-radius: var(--home-stage15-radius);\n    box-shadow: var(--doke-home-mobile-hero-shadow);\n    overflow: hidden !important;\n  }`;
          const newCard=oldCard.replace('display: grid !important;','display: grid;').replace('overflow: hidden !important;','overflow: hidden;');
          const oldRail=`  body.home-index-shell .short-videos .content-rail {\n    display: block !important;\n    overflow: visible;\n  }`;
          const newRail=oldRail.replace('display: block !important;','display: block;');
          const oldTrack=`  body.home-index-shell .short-videos .short-videos__track {\n    display: grid !important;\n    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n    grid-auto-flow: row !important;\n    grid-auto-columns: auto !important;\n    gap: 10px;\n    width: 100%;\n    max-width: 100%;\n    min-width: 0;\n    overflow: visible !important;\n    padding: 0;\n  }`;
          const newTrack=oldTrack.replace(/ !important/g,'');
          if((src.match(/!important\b/g)||[]).length!==29||!src.includes(oldCard)||!src.includes(oldRail)||!src.includes(oldTrack))throw Error('parent drift');const out=src.replace(oldCard,newCard).replace(oldRail,newRail).replace(oldTrack,newTrack);fs.writeFileSync(f,out);const z=fs.readFileSync(f),h=crypto.createHash('sha256').update(z).digest('hex');if(h!==process.env.EXPECTED_SHA256||z.length!==+process.env.EXPECTED_BYTES||(out.match(/!important\b/g)||[]).length!==21)throw Error(`candidate ${h}/${z.length}`);console.log(`CANDIDATE PASS|sha256=${h}|bytes=${z.length}|important=29->21`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'8\t8\t'"$TARGET_FILE"; git diff --check
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_FILE"; git commit -m 'UX-CSS-IMPORTANT-003: remove runtime-stable Home mobile priority markers' >/dev/null
          NEW_SHA=$(git rev-parse HEAD); NEW_TREE=$(git rev-parse HEAD^{tree}); NEW_BLOB=$(git hash-object "$TARGET_FILE")
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git push --force-with-lease="refs/heads/$PERMANENT_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERMANENT_BRANCH" >/dev/null
          test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$NEW_SHA"
          echo "NEW_SHA=$NEW_SHA"; echo "NEW_TREE=$NEW_TREE"; echo "NEW_BLOB=$NEW_BLOB"; echo "PARENT_BLOB=$TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo 'DIFF=1 file +8/-8'; echo 'SOURCE_RUN=32137798522'; echo 'RAW_RUN=32137749131'; echo 'VISUAL_RUN=32137982277'; echo 'GOVERNANCE_RUN=32138052633'
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$PARENT_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$PARENT_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PROMOTE=${{ steps.promote.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE PASS|NEW_SHA=|NEW_TREE=|NEW_BLOB=|PARENT_BLOB=|SHA256=|BYTES=|DIFF=|SOURCE_RUN=|RAW_RUN=|VISUAL_RUN=|GOVERNANCE_RUN=)' /tmp/promote.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 180 /tmp/promote.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 003 promotion [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
