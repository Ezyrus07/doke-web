name: CAT-A03 Authority Apply

on:
  pull_request:
    branches: [MAIN]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a03-custom-authority-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Apply CAT-A03 authority implementation
        run: node scripts/execute-cat-a03-authority.js

      - name: Reconcile cumulative CAT-A02 contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/audit-service-catalog-authority-retirement.js';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["  'Authenticated remote save must finish as synced.',\n", "  'DOKE_SERVICE_DIRECT_MUTATION_FORBIDDEN',\n"],
            ["  \"throw createAuthorityUnavailableError('gravação', error)\",\n", "  \"createDirectMutationForbiddenError('gravação direta')\",\n"]
          ];
          replacements.forEach(([retired, current]) => {
            if (!source.includes(retired)) throw new Error('CAT-A02 historical marker not found: ' + retired.trim());
            source = source.replace(retired, current);
          });
          fs.writeFileSync(file, source);
          NODE

      - name: Reconcile repository test assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/test-services-supabase-repository-contract.js';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace("const fs = require('fs');\n", "const nodeAssert = require('assert');\nconst fs = require('fs');\n");
          source = source.replace('  await assert.rejects(\n', '  await nodeAssert.rejects(\n');
          fs.writeFileSync(file, source);
          NODE

      - name: Validate cumulative CAT-A02 authority
        run: node scripts/audit-service-catalog-authority-retirement.js

      - name: Validate CAT-A03 structural authority
        run: node scripts/audit-service-lifecycle-authority.js

      - name: Validate CAT-A03 runtime authority
        run: node scripts/test-service-lifecycle-authority-runtime.js

      - name: Validate Supabase repository boundary
        run: node scripts/test-services-supabase-repository-contract.js

      - name: Validate service-order integration
        run: |
          mkdir -p reports/generated
          set -o pipefail
          node scripts/test-service-order-integration-contract.js 2>&1 | tee reports/generated/cat-a03-service-order-integration.log

      - name: Upload CAT-A03 integration diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cat-a03-service-order-integration-${{ github.sha }}
          path: reports/generated/cat-a03-service-order-integration.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate patch formatting
        run: git diff --check

      - name: Publish CAT-A03 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/repositories/services-repository.js
          git add assets/js/services/services-service.js
          git add supabase/functions/self-service-operations/operations.mjs
          git add supabase/migrations/149_service_lifecycle_authority.sql
          git add supabase/tests/018_service_lifecycle_authority_validation.sql
          git add scripts/audit-service-catalog-authority-retirement.js
          git add scripts/audit-service-lifecycle-authority.js
          git add scripts/test-service-lifecycle-authority-runtime.js
          git add scripts/test-services-supabase-repository-contract.js
          git add scripts/test-service-order-integration-contract.js
          git add docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json
          git add docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.md
          git commit -m "Implement CAT-A03 service lifecycle authority"
          git push origin HEAD:cat/cat-001-baseline-audit
