name: CAT-A03 Authority Apply

on:
  pull_request:
    branches: [MAIN]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a03-authority-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Apply CAT-A03 authority implementation
        run: node scripts/execute-cat-a03-authority.js

      - name: Validate CAT-A03 focused contracts
        run: |
          node scripts/audit-service-catalog-authority-retirement.js
          node scripts/audit-service-lifecycle-authority.js
          node scripts/test-service-lifecycle-authority-runtime.js
          node scripts/test-services-supabase-repository-contract.js
          node scripts/test-service-order-integration-contract.js
          git diff --check

      - name: Publish CAT-A03 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/repositories/services-repository.js
          git add assets/js/services/services-service.js
          git add supabase/functions/self-service-operations/operations.mjs
          git add supabase/migrations/149_service_lifecycle_authority.sql
          git add supabase/tests/018_service_lifecycle_authority_validation.sql
          git add scripts/audit-service-catalog-authority-retirement.js
          git add scripts/audit-service-lifecycle-authority.js
          git add scripts/test-service-lifecycle-authority-runtime.js
          git add scripts/test-services-supabase-repository-contract.js
          git add scripts/test-service-order-integration-contract.js
          git add docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json
          git add docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.md
          git add .github/workflows/quality.yml
          git commit -m "Implement CAT-A03 service lifecycle authority"
          git push origin HEAD:cat/cat-001-baseline-audit
