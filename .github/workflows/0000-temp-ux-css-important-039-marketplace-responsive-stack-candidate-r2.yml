name: UX-CSS-IMPORTANT-039 Candidate Static Governance R2

on:
  push:
    branches:
      - diag/ux-css-important-039-marketplace-responsive-stack-candidate-r2
    paths:
      - .github/workflows/0000-temp-ux-css-important-039-marketplace-responsive-stack-candidate-r2.yml

permissions:
  contents: write

jobs:
  prove039r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARENT_SHA: b64024a143e6531c51263d7750ab00162cf7e772
      PARENT_TREE: 64f556068e5dd89f3dfdda211b0f85b3e5a773e8
      TARGET_FILE: assets/css/patterns/marketplace-responsive-stack.css
      TARGET_BLOB: 0d284a91858a4e16ec5ac3edc48c9700982bac11
      PARENT_IMPORTANT: 468
      PARENT_GLOBAL_IMPORTANT: 6271
      CANDIDATE_GLOBAL_IMPORTANT: 5803
      CHILD_FILE: assets/css/components/cards/marketplace-responsive-card-stack.css
      CHILD_BLOB: 4609bbb257194173d418ae608f2eca20bb8cbeff
      R1_BRANCH: diag/ux-css-important-039-marketplace-responsive-stack-reach-r1
      R1_FILE: .diagnostics/ux-css-important-039-marketplace-responsive-stack-reach-r1.json
      R1_BLOB: 0d25b0d7f6530244e729558f38f503d2bdd558be
      OUTPUT_BRANCH: diag/ux-css-important-039-marketplace-responsive-stack-candidate-r2
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-039-marketplace-responsive-stack-candidate-r2.yml
      RESULT_FILE: .diagnostics/ux-css-important-039-marketplace-responsive-stack-candidate-r2.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Freeze parent and R1 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git rev-parse "$PARENT_SHA:$CHILD_FILE")" = "$CHILD_BLOB"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = 1
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$WORKFLOW_FILE"
          git fetch --no-tags origin "refs/heads/$R1_BRANCH:refs/remotes/origin/$R1_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R1_BRANCH:$R1_FILE")" = "$R1_BLOB"
          git show "refs/remotes/origin/$R1_BRANCH:$R1_FILE" >/tmp/r1.json
          node <<'NODE'
          const r=JSON.parse(require('fs').readFileSync('/tmp/r1.json','utf8'));
          const imp=r.imports||{}, reach=r.reach||{}, cas=r.cascade||{}, pol=r.policy||{};
          const ok=r.result==='PASS' && r.parentSha===process.env.PARENT_SHA && r.parentTree===process.env.PARENT_TREE && r.targetFile===process.env.TARGET_FILE && r.targetBlob===process.env.TARGET_BLOB && r.rawImportantMarkerCount===468 && reach.classification==='whole-file-dormant' && reach.canonicalLoaded===false && reach.wholeFileDormant===true && reach.targetPageCount===0 && (reach.directHtmlRefs||[]).length===0 && (reach.runtimeJsRefs||[]).length===0 && (imp.directImporters||[]).length===0 && (imp.targetImports||[]).length===1 && imp.targetImports[0].resolved===process.env.CHILD_FILE && imp.certified038Child?.blob===process.env.CHILD_BLOB && imp.certified038Child?.important===0 && cas.runtimeExactCollisionRelationCount===0 && cas.browserReconciliationRequired===false && pol.targetInActive===false && pol.targetInDormant===true && pol.deprecatedReactivated===0 && pol.unregisteredActive===0;
          if(!ok) throw new Error('R1 frozen evidence mismatch');
          NODE

      - name: Build exact marker-only candidate and preserve imports
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),path=require('path');
          const f=process.env.TARGET_FILE;
          const parent=fs.readFileSync(f,'utf8');
          const imports=s=>[...s.matchAll(/@import\s+(?:url\()?\s*['\"]([^'\")]+)['\"]\s*\)?[^;]*;/gi)].map(m=>m[0]);
          const before=(parent.match(/!important\b/gi)||[]).length;
          if(before!==468) throw new Error(`parent important ${before}`);
          const parentImports=imports(parent);
          if(parentImports.length!==1) throw new Error(`import count ${parentImports.length}`);
          const candidate=parent.replace(/\s*!important\b/gi,'');
          if((candidate.match(/!important\b/gi)||[]).length!==0) throw new Error('candidate important remains');
          if(JSON.stringify(imports(candidate))!==JSON.stringify(parentImports)) throw new Error('import text/order changed');
          if(parent.replace(/\s*!important\b/gi,'')!==candidate) throw new Error('non-marker transform');
          fs.writeFileSync('/tmp/candidate.css',candidate); fs.writeFileSync(f,candidate);
          function walk(d,out=[]){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p,out);else if(e.isFile()&&p.endsWith('.css'))out.push(p)}return out}
          const count=x=>(fs.readFileSync(x,'utf8').match(/!important\b/gi)||[]).length;
          const global=walk('assets/css').reduce((n,x)=>n+count(x),0);
          if(global!==5803) throw new Error(`global important ${global}`);
          const blob=cp.execFileSync('git',['hash-object',f],{encoding:'utf8'}).trim();
          const sha256=crypto.createHash('sha256').update(candidate).digest('hex');
          const bytes=Buffer.byteLength(candidate);
          const ns=cp.execFileSync('git',['diff','--numstat',process.env.PARENT_SHA,'--',f],{encoding:'utf8'}).trim().split(/\s+/);
          const additions=Number(ns[0]),deletions=Number(ns[1]);
          const out={importantBefore:468,importantAfter:0,removed:468,parentGlobal:6271,candidateGlobal:global,globalDelta:global-6271,gitBlob:blob,sha256,bytes,markerOnly:true,selectorsRemoved:0,declarationsRemoved:0,propertiesChanged:0,valuesChanged:0,importCount:parentImports.length,importsPreserved:true,importOrderPreserved:true,additions,deletions,diffFiles:1};
          fs.writeFileSync('/tmp/candidate.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          NODE
          test "$(git diff --name-only "$PARENT_SHA" -- | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only "$PARENT_SHA" --)" = "$TARGET_FILE"
          git diff --check "$PARENT_SHA" -- "$TARGET_FILE"

      - name: Prove dormancy and import target preserved
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'); const {getLoadedCssAssets}=require('./scripts/lib/css-assets');
          const norm=f=>String(f).replace(/\\/g,'/').replace(/^\.\//,''); const target=norm(process.env.TARGET_FILE);
          function imports(f){if(!fs.existsSync(f))return[];const s=fs.readFileSync(f,'utf8'),o=[];for(const m of s.matchAll(/@import\s+(?:url\()?\s*['\"]([^'\")]+)['\"]\s*\)?[^;]*;/gi)){const raw=m[1].split('#')[0].split('?')[0];if(!raw||/^https?:/i.test(raw)||/^data:/i.test(raw))continue;o.push(norm(raw.startsWith('/')?raw.slice(1):path.join(path.dirname(f),raw)));}return o;}
          const pages=fs.readdirSync('.').filter(f=>f.endsWith('.html')).sort(),hits=[],loaded=new Set();
          for(const page of pages){const html=fs.readFileSync(page,'utf8'),seen=new Set(),q=getLoadedCssAssets(html,process.cwd()).map(norm);for(let i=0;i<q.length;i++){const cur=norm(q[i]);if(seen.has(cur)||!fs.existsSync(cur))continue;seen.add(cur);loaded.add(cur);for(const x of imports(cur))q.push(x);}if(seen.has(target))hits.push(page);}
          if(hits.length) throw new Error(`candidate reactivated target: ${hits.join(',')}`);
          const ti=imports(process.env.TARGET_FILE); if(ti.length!==1||ti[0]!==process.env.CHILD_FILE) throw new Error('child import changed');
          fs.writeFileSync('/tmp/reach.json',JSON.stringify({canonicalLoaded:false,wholeFileDormant:true,targetPages:hits,rootHtmlCount:pages.length,loadedCssCount:loaded.size,targetImports:ti},null,2)+'\n');
          NODE
          node scripts/audit-css-dormant-debt-policy.js >/tmp/dorm-candidate.txt 2>&1 || true
          cp /tmp/candidate.css /tmp/candidate.keep
          git checkout "$PARENT_SHA" -- .
          node scripts/audit-css-dormant-debt-policy.js >/tmp/dorm-parent.txt 2>&1 || true
          node <<'NODE'
          const fs=require('fs');const p=fs.readFileSync('/tmp/dorm-parent.txt','utf8'),c=fs.readFileSync('/tmp/dorm-candidate.txt','utf8');
          const labels=['CSS depreciado reativado','Arquivos registrados ausentes','CSS ativo com !important fora do registro'];
          const metric=(s,label)=>{const esc=label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const m=s.match(new RegExp(esc+'[: ]+\\*?\\*?(\\d+)'));return m?Number(m[1]):null};
          const metrics={};for(const label of labels){const a=metric(p,label),b=metric(c,label);if(a===null||b===null||a!==b)throw new Error(`${label} ${a}->${b}`);metrics[label]={parent:a,candidate:b};}
          fs.writeFileSync('/tmp/dormancy.json',JSON.stringify({candidateDormant:true,canonicalLoaded:false,runtimeRelevant:false,policyViolationMetricsStable:true,metrics},null,2)+'\n');
          NODE
          cp /tmp/candidate.keep "$TARGET_FILE"

      - name: Install dependencies and run parent candidate gate matrix
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$PARENT_SHA" -- package.json package-lock.json
          npm ci --ignore-scripts >/dev/null
          cat >/tmp/gates.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1"; mode="$2"; : > "/tmp/${phase}.tsv"
          restore(){ git checkout "$PARENT_SHA" -- . >/dev/null 2>&1 || exit 90; if [ "$mode" = candidate ]; then cp /tmp/candidate.css "$TARGET_FILE"; fi; return 0; }
          norm(){ sed -E -e 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+-]+Z?/<TIME>/g' -e 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$1"; }
          gate(){ label="$1"; shift; restore; log="/tmp/${phase}-${label}.log"; set +e; "$@" >"$log" 2>&1; rc=$?; set -e; norm "$log" >"${log}.norm"; hash="$(sha256sum "${log}.norm"|awk '{print $1}')"; printf '%s\t%s\t%s\n' "$label" "$rc" "$hash" >> "/tmp/${phase}.tsv"; echo "$phase|$label|rc=$rc|hash=$hash"; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/gates.sh
          /tmp/gates.sh parent parent
          /tmp/gates.sh candidate candidate

      - name: Reconcile gates without criteria relaxation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const parse=f=>new Map(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [l,r,h]=x.split('\t');return[l,{rc:Number(r),hash:h}]}));
          const p=parse('/tmp/parent.tsv'),c=parse('/tmp/candidate.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'];
          const debt=['important_reduction_plan','global_css_design_system']; const rows=[];let green=0,baselineEquivalent=0,improved=0;
          for(const l of exact){const a=p.get(l),b=c.get(l);if(!a||!b)throw new Error('missing '+l);if(a.rc===0&&b.rc===0&&a.hash===b.hash){green++;rows.push({label:l,classification:'PASS_BOTH_IDENTICAL',parent:a,candidate:b});}else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash){baselineEquivalent++;rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,candidate:b});}else throw new Error(`${l} divergence ${a.rc}/${a.hash}->${b.rc}/${b.hash}`);}
          for(const l of debt){const a=p.get(l),b=c.get(l);if(!a||!b)throw new Error('missing '+l);if(a.rc===0&&b.rc===0){green++;rows.push({label:l,classification:'PASS_BOTH_EXPECTED_DEBT_DELTA',parent:a,candidate:b});}else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash){baselineEquivalent++;rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,candidate:b});}else if(a.rc!==0&&b.rc===0){improved++;rows.push({label:l,classification:'CANDIDATE_IMPROVES_BASELINE',parent:a,candidate:b});}else throw new Error(`${l} regression ${a.rc}->${b.rc}`);}
          const a=p.get('frontend_strict'),b=c.get('frontend_strict');if(!a||!b||a.rc!==b.rc)throw new Error(`frontend rc ${a?.rc}->${b?.rc}`);
          const pl=fs.readFileSync('/tmp/parent-frontend_strict.log','utf8'),cl=fs.readFileSync('/tmp/candidate-frontend_strict.log','utf8');
          const lines=(s,t)=>s.split('\n').filter(x=>x.includes(t)).sort();
          if(JSON.stringify(lines(pl,'**CRITICAL**'))!==JSON.stringify(lines(cl,'**CRITICAL**')))throw new Error('frontend critical set changed');
          if(JSON.stringify(lines(pl,'**WARNING**'))!==JSON.stringify(lines(cl,'**WARNING**')))throw new Error('frontend warning set changed');
          rows.push({label:'frontend_strict',classification:'BASELINE_EQUIVALENT_EXPECTED_DEBT_DELTA',parent:a,candidate:b});baselineEquivalent++;
          fs.writeFileSync('/tmp/gates.json',JSON.stringify({rows,passBoth:green,baselineEquivalent,improved,introducedRegressions:0,criteriaRelaxed:0},null,2)+'\n');
          NODE

      - name: Freeze candidate receipt and restore exact parent
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/candidate.css "$TARGET_FILE"
          test "$(git diff --name-only "$PARENT_SHA" -- | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only "$PARENT_SHA" --)" = "$TARGET_FILE"
          node <<'NODE'
          const fs=require('fs');
          const result={proof:'UX-CSS-IMPORTANT-039 Candidate Static Governance R2',result:'PASS',parentSha:process.env.PARENT_SHA,parentTree:process.env.PARENT_TREE,targetFile:process.env.TARGET_FILE,parentTargetBlob:process.env.TARGET_BLOB,r1:{branch:process.env.R1_BRANCH,file:process.env.R1_FILE,blob:process.env.R1_BLOB,result:'PASS'},candidate:JSON.parse(fs.readFileSync('/tmp/candidate.json','utf8')),dormancyAfterCandidate:JSON.parse(fs.readFileSync('/tmp/dormancy.json','utf8')),reachAfterCandidate:JSON.parse(fs.readFileSync('/tmp/reach.json','utf8')),staticGateReconciliation:JSON.parse(fs.readFileSync('/tmp/gates.json','utf8')),browserRequired:false,restore:{targetParentExact:false,trackedWorkspaceClean:false}};
          fs.writeFileSync('/tmp/final.json',JSON.stringify(result,null,2)+'\n');
          NODE
          git checkout "$PARENT_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/final.json','utf8'));r.restore={targetParentExact:true,trackedWorkspaceClean:true};fs.writeFileSync('/tmp/final.json',JSON.stringify(r,null,2)+'\n');
          NODE

      - name: Publish R2 receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/final.json ]; then echo '{"proof":"UX-CSS-IMPORTANT-039 Candidate Static Governance R2","result":"FAIL","reason":"receipt missing"}' >/tmp/final.json; fi
          git checkout "$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/final.json "$RESULT_FILE"
          git add "$RESULT_FILE"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=doke -c user.email=bielantoniomma@gmail.com commit -m 'diag: publish UX-CSS-IMPORTANT-039 candidate R2 receipt' >/dev/null
          git push origin "HEAD:$OUTPUT_BRANCH" >/dev/null
