name: UX-CSS-IMPORTANT-037 Reach Source Cascade R1

on:
  push:
    branches:
      - diag/ux-css-important-037-mobile-search-header-reach-r1
    paths:
      - .github/workflows/0000-temp-ux-css-important-037-mobile-search-header-reach-r1.yml

permissions:
  contents: write

jobs:
  prove037r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PARENT_SHA: d3d45498ca2e8889c50273fa82550f92d3b7af1f
      PARENT_TREE: c44532c746318e9f82d59755c1d857abb346e5c6
      TARGET_FILE: assets/css/components/navigation/mobile-search-header-shared.css
      TARGET_BLOB: 946a1e094936900ca550442dead9a108fbf7221c
      TARGET_IMPORTANT: 348
      OUTPUT_BRANCH: diag/ux-css-important-037-mobile-search-header-reach-r1
      RESULT_FILE: .diagnostics/ux-css-important-037-mobile-search-header-reach-r1.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prove reach source and cascade
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          git checkout --detach "$PARENT_SHA" >/dev/null
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"

          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const TARGET=process.env.TARGET_FILE.replace(/\\/g,'/');
          const TARGET_BLOB=process.env.TARGET_BLOB;
          const EXPECTED=Number(process.env.TARGET_IMPORTANT);
          const excluded=new Set(['.git','node_modules','.next','dist','coverage','reports','.diagnostics']);
          function walk(dir,out=[]){
            if(!fs.existsSync(dir)) return out;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(excluded.has(e.name)) continue;
              const p=path.join(dir,e.name);
              if(e.isDirectory()) walk(p,out); else if(e.isFile()) out.push(p.replace(/\\/g,'/'));
            }
            return out;
          }
          const all=walk('.').map(p=>p.replace(/^\.\//,''));
          const cssFiles=all.filter(p=>p.endsWith('.css'));
          const htmlFiles=all.filter(p=>p.endsWith('.html'));
          const jsFiles=all.filter(p=>/\.(?:js|mjs|cjs|ts)$/i.test(p));
          const read=f=>fs.readFileSync(f,'utf8');
          const norm=s=>s.replace(/\s+/g,' ').trim();
          function resolveRef(from,ref){
            if(!ref) return null;
            ref=ref.trim().replace(/^['"]|['"]$/g,'').split('#')[0].split('?')[0];
            if(!ref||/^(?:https?:|data:|blob:|\/\/)/i.test(ref)) return null;
            let p=ref.startsWith('/')?ref.slice(1):path.posix.normalize(path.posix.join(path.posix.dirname(from),ref));
            return p.replace(/^\.\//,'');
          }
          function importsFor(file){
            const s=read(file), out=[];
            const re=/@import\s+(?:url\(\s*)?(?:["']([^"']+)["']|([^\s);]+))\s*\)?[^;]*;/gi;
            let m; while((m=re.exec(s))){ const r=resolveRef(file,m[1]||m[2]); if(r&&r.endsWith('.css')&&fs.existsSync(r)) out.push(r); }
            return [...new Set(out)];
          }
          const cssImports=new Map(cssFiles.map(f=>[f,importsFor(f)]));
          const actualImporters=cssFiles.filter(f=>(cssImports.get(f)||[]).includes(TARGET));
          function linksForHtml(file){
            const s=read(file), out=[]; let m;
            const re=/<link\b[^>]*?href\s*=\s*["']([^"']+\.css(?:[?#][^"']*)?)["'][^>]*>/gi;
            while((m=re.exec(s))){const r=resolveRef(file,m[1]); if(r&&fs.existsSync(r)) out.push(r);}
            return [...new Set(out)];
          }
          const htmlLinks=new Map(htmlFiles.map(f=>[f,linksForHtml(f)]));
          function reaches(css,seen=new Set()){
            if(css===TARGET) return true;
            if(seen.has(css)) return false; seen.add(css);
            return (cssImports.get(css)||[]).some(x=>reaches(x,seen));
          }
          const reachedHtml=htmlFiles.filter(h=>(htmlLinks.get(h)||[]).some(c=>reaches(c,new Set())));
          const directHtml=htmlFiles.filter(h=>(htmlLinks.get(h)||[]).includes(TARGET));

          function findClose(s,open,end){
            let depth=1,q=null,esc=false;
            for(let i=open+1;i<end;i++){
              const c=s[i],n=s[i+1];
              if(q){if(esc){esc=false;continue} if(c==='\\'){esc=true;continue} if(c===q)q=null; continue;}
              if(c==='"'||c==="'"){q=c;continue}
              if(c==='/'&&n==='*'){const j=s.indexOf('*/',i+2); if(j<0)return end-1; i=j+1;continue}
              if(c==='{')depth++; else if(c==='}'&&--depth===0)return i;
            }
            return end-1;
          }
          function splitSelectors(s){
            const out=[];let cur='',q=null,depth=0;
            for(let i=0;i<s.length;i++){
              const c=s[i];
              if(q){cur+=c;if(c==='\\'){cur+=s[++i]||'';continue}if(c===q)q=null;continue}
              if(c==='"'||c==="'"){q=c;cur+=c;continue}
              if(c==='('||c==='[')depth++; else if(c===')'||c===']')depth=Math.max(0,depth-1);
              if(c===','&&depth===0){if(cur.trim())out.push(norm(cur));cur='';}else cur+=c;
            }
            if(cur.trim())out.push(norm(cur)); return out;
          }
          function declarations(body){
            const out=[]; let start=0,q=null,paren=0,bracket=0;
            function take(seg){
              const m=seg.match(/^\s*([\w-]+)\s*:\s*([\s\S]*?)\s*$/); if(!m)return;
              let value=m[2].trim(); const imp=/\s*!important\s*$/i.test(value); value=value.replace(/\s*!important\s*$/i,'').trim();
              out.push({property:m[1].toLowerCase(),value,important:imp});
            }
            for(let i=0;i<body.length;i++){
              const c=body[i];
              if(q){if(c==='\\'){i++;continue}if(c===q)q=null;continue}
              if(c==='"'||c==="'"){q=c;continue}
              if(c==='(')paren++;else if(c===')')paren=Math.max(0,paren-1);else if(c==='[')bracket++;else if(c===']')bracket=Math.max(0,bracket-1);
              else if(c===';'&&paren===0&&bracket===0){take(body.slice(start,i));start=i+1;}
            }
            take(body.slice(start)); return out;
          }
          function parseCss(file){
            const s=read(file), rules=[];
            function parseRange(start,end,contexts){
              let i=start;
              while(i<end){
                while(i<end&&/\s/.test(s[i]))i++;
                if(s[i]==='/'&&s[i+1]==='*'){const j=s.indexOf('*/',i+2);i=j<0?end:j+2;continue}
                if(i>=end)break;
                const p=i;let q=null,paren=0,bracket=0,found=-1,semi=-1;
                for(;i<end;i++){
                  const c=s[i],n=s[i+1];
                  if(q){if(c==='\\'){i++;continue}if(c===q)q=null;continue}
                  if(c==='"'||c==="'"){q=c;continue}
                  if(c==='/'&&n==='*'){const j=s.indexOf('*/',i+2);i=j<0?end:j+1;continue}
                  if(c==='(')paren++;else if(c===')')paren=Math.max(0,paren-1);else if(c==='[')bracket++;else if(c===']')bracket=Math.max(0,bracket-1);
                  else if(paren===0&&bracket===0&&c==='{'){found=i;break}
                  else if(paren===0&&bracket===0&&c===';'){semi=i;break}
                }
                if(semi>=0){i=semi+1;continue} if(found<0)break;
                const pre=norm(s.slice(p,found)); const close=findClose(s,found,end); const body=s.slice(found+1,close);
                if(/^@(media|supports|container|layer|scope|document)\b/i.test(pre)) parseRange(found+1,close,[...contexts,pre]);
                else if(!pre.startsWith('@')){
                  const sels=splitSelectors(pre), decls=declarations(body);
                  if(sels.length&&decls.length) rules.push({selectors:sels,context:contexts.join(' && ')||'(root)',declarations:decls});
                }
                i=close+1;
              }
            }
            parseRange(0,s.length,[]); return rules;
          }
          const targetRules=parseCss(TARGET);
          const targetImportant=[]; let idx=0;
          for(const r of targetRules) for(const d of r.declarations) if(d.important){
            for(const selector of r.selectors) targetImportant.push({index:idx,selector,property:d.property,value:d.value,context:r.context});
            idx++;
          }
          const physicalImportant=(read(TARGET).match(/!important\b/gi)||[]).length;
          if(idx!==EXPECTED||physicalImportant!==EXPECTED) throw Error(`important count parsed=${idx} physical=${physicalImportant} expected=${EXPECTED}`);

          const external=new Map();
          for(const f of cssFiles){if(f===TARGET)continue;for(const r of parseCss(f))for(const d of r.declarations)for(const selector of r.selectors){
            const k=norm(selector)+'|'+d.property; if(!external.has(k))external.set(k,new Set()); external.get(k).add(f);
          }}
          const collisionDeclIndexes=new Set(), collisionFiles=new Set(), collisionSample=[];
          for(const x of targetImportant){const files=external.get(norm(x.selector)+'|'+x.property);if(files&&files.size){collisionDeclIndexes.add(x.index);for(const f of files)collisionFiles.add(f);if(collisionSample.length<30)collisionSample.push({...x,files:[...files].sort()});}}

          const tokenSet=new Set();
          for(const x of targetImportant){let m;const re=/[.#]([A-Za-z_][\w-]*)/g;while((m=re.exec(x.selector)))tokenSet.add(m[1]);}
          const sourceText=[...htmlFiles,...jsFiles].map(f=>read(f)).join('\n');
          const sourceTokens=[...tokenSet].filter(t=>new RegExp(`(^|[^A-Za-z0-9_-])${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}([^A-Za-z0-9_-]|$)`).test(sourceText));
          const unreferenced=[...tokenSet].filter(t=>!sourceTokens.includes(t));

          const runtimeRefs=[],toolingRefs=[]; const needle=path.posix.basename(TARGET);
          for(const f of jsFiles){const s=read(f);if(s.includes(TARGET)||s.includes(needle)){(f.startsWith('scripts/')||f.includes('/test')||f.startsWith('tests/')?toolingRefs:runtimeRefs).push(f)}}
          const byContext={},byProperty={};
          for(const r of targetRules)for(const d of r.declarations)if(d.important){byContext[r.context]=(byContext[r.context]||0)+1;byProperty[d.property]=(byProperty[d.property]||0)+1;}
          const active=reachedHtml.length>0||actualImporters.length>0||runtimeRefs.length>0;
          const result={
            proof:'UX-CSS-IMPORTANT-037 Reach Source Cascade R1',parentSha:process.env.PARENT_SHA,parentTree:process.env.PARENT_TREE,
            targetFile:TARGET,targetBlob:TARGET_BLOB,importantDeclarationCount:idx,physicalImportantCount:physicalImportant,
            reach:{rootHtml:htmlFiles.length,cssFiles:cssFiles.length,directHtmlRefs:directHtml.length,reachableHtml:reachedHtml.length,actualImporters:actualImporters.length,runtimeJsRefs:runtimeRefs.length,toolingJsRefs:toolingRefs.length,active,wholeFileDormant:!active,directHtmlFiles:directHtml.sort(),reachableHtmlFiles:reachedHtml.sort(),importers:actualImporters.sort(),runtimeRefs:runtimeRefs.sort(),toolingRefs:toolingRefs.sort()},
            source:{selectorTokenCount:tokenSet.size,referencedSelectorTokens:sourceTokens.length,unreferencedSelectorTokens:unreferenced.length,unreferencedTokenSample:unreferenced.sort().slice(0,30)},
            cascade:{importantByContext:Object.entries(byContext).sort((a,b)=>b[1]-a[1]).map(([context,count])=>({context,count})),importantByProperty:Object.entries(byProperty).sort((a,b)=>b[1]-a[1]).map(([property,count])=>({property,count})),declarationsWithExternalExactSelectorPropertyCollision:collisionDeclIndexes.size,externalCollisionFiles:[...collisionFiles].sort(),collisionSample},
            result:'PASS'
          };
          if(!active) throw Error('target unexpectedly dormant; separate proof required');
          fs.writeFileSync('/tmp/r1.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({important:idx,active,reachedHtml:reachedHtml.length,importers:actualImporters.length,selectorTokens:tokenSet.size,referencedTokens:sourceTokens.length,collisionDeclarations:collisionDeclIndexes.size,collisionFiles:collisionFiles.size}));
          NODE

      - name: Publish R1 receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          test -s /tmp/r1.json && result="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/r1.json','utf8')).result||'FAIL')")" || true
          git fetch origin "refs/heads/$OUTPUT_BRANCH:refs/remotes/origin/$OUTPUT_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          if test -s /tmp/r1.json; then cp /tmp/r1.json "$RESULT_FILE"; else printf '{"proof":"UX-CSS-IMPORTANT-037 Reach Source Cascade R1","result":"FAIL","reason":"receipt missing"}\n' > "$RESULT_FILE"; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"
          if ! git diff --cached --quiet; then
            git commit -m 'diag: publish UX-CSS-IMPORTANT-037 reach source cascade R1 [skip ci]' >/dev/null
            git push origin "HEAD:refs/heads/$OUTPUT_BRANCH" >/dev/null
          fi
          test "$result" = PASS

# trigger-r1
