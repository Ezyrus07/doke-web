          const compatibilityBlock = `if (fs.existsSync('config/msg-001-a02-canonical-authority-boundary.json')) {
  [
    "return user && isUuid(user.id) ? 'remote-only' : 'fixture-memory'",
    "error.code = 'DOKE_MESSAGES_REMOTE_AUTHORITY_UNAVAILABLE'",
    "return saveLocal(normalized, 'memory-only')",
    'persistentLocalAuthority: false',
    'pendingSynchronization: false'
  ].forEach((fragment) => assert(messagesRepository.includes(fragment), 'Messages repository missing A02 closure fragment: ' + fragment));
  [
    'var local = readLocal();',
    "remote.forEach(function (item) { saveLocal(item, 'synced'); });",
    "return saveLocal(Object.assign({}, localSaved, { syncStatus: 'pending'"
  ].forEach((fragment) => assert(!messagesRepository.includes(fragment), 'Messages repository retained A01 gap after A02: ' + fragment));
} else {
  [
    "var STORAGE_KEY = 'doke.conversations.local.v1'",
    "var LEGACY_STORAGE_KEY = 'doke.messages.local.v1'",
    "setProviderState('local-fallback')",
    "return loadLocal(options)",
    "saveLocal(normalized, 'pending')",
    "syncStatus: 'pending'"
  ].forEach((fragment) => assert(messagesRepository.includes(fragment), 'Messages repository missing baseline fragment: ' + fragment));
}

`;
          a01Audit = a01Audit.slice(0, blockStart) + compatibilityBlock + a01Audit.slice(blockEnd);
          write('scripts/audit-msg-001-a01-authority-baseline.js', a01Audit);

          const permanentWorkflow = [
            'name: Doke MSG-A02 Canonical Authority Boundary',
            '',
            'on:',
            '  pull_request:',
            '    branches:',
            '      - ord/ord-001-baseline-audit',
            '    paths:',
            "      - 'assets/js/repositories/messages-repository.js'",
            "      - 'config/msg-001-a02-canonical-authority-boundary.json'",
            "      - 'docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md'",
            "      - 'docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json'",
            "      - 'scripts/audit-msg-001-a01-authority-baseline.js'",
            "      - 'scripts/audit-msg-001-a02-canonical-authority-boundary.js'",
            "      - 'scripts/test-msg-001-a02-canonical-authority-boundary.js'",
            "      - 'config/domain-completion-matrix.json'",
            "      - 'package.json'",
            "      - '.github/workflows/msg-001-a02-canonical-authority-boundary.yml'",
            '',
            'permissions:',
            '  contents: read',
            '',
            'jobs:',
            '  authority:',
            '    runs-on: ubuntu-24.04',
            '    timeout-minutes: 10',
            '    steps:',
            '      - uses: actions/checkout@v4',
            '      - uses: actions/setup-node@v4',
            '        with:',
            '          node-version: 24',
            '          cache: npm',
            '      - name: Install pinned dependencies',
            '        run: npm ci --ignore-scripts',
            '      - name: Validate MSG-A02 authority boundary',
            '        run: |',
            '          node --check assets/js/repositories/messages-repository.js',
            '          node --check scripts/audit-msg-001-a02-canonical-authority-boundary.js',
            '          node --check scripts/test-msg-001-a02-canonical-authority-boundary.js',
            '          npm run audit:msg-001-a01-authority-baseline',
            '          npm run audit:msg-001-a02-canonical-authority-boundary',
            '          npm run test:msg-001-a02-canonical-authority-boundary',
            '          npm run test:messages-supabase-repository-contract',
            '          npm run test:attachments-supabase-repository-contract',
            '          npm run audit:domain-completion-matrix',
            '          git diff --check',
            ''
          ].join('\n');
          write('.github/workflows/msg-001-a02-canonical-authority-boundary.yml', permanentWorkflow);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['audit:msg-001-a02-canonical-authority-boundary'] = 'node scripts/audit-msg-001-a02-canonical-authority-boundary.js';
          pkg.scripts['test:msg-001-a02-canonical-authority-boundary'] = 'node scripts/test-msg-001-a02-canonical-authority-boundary.js';
          write('package.json', JSON.stringify(pkg, null, 2));

          const matrix = JSON.parse(fs.readFileSync('config/domain-completion-matrix.json', 'utf8'));
          if (matrix.version !== '1.3.78') throw new Error('Unexpected matrix version ' + matrix.version);
          const msg = matrix.domains.find(function (domain) { return domain.id === 'MSG-001'; });
          if (!msg) throw new Error('MSG-001 missing from matrix');
          [
            repositoryPath,
            'config/msg-001-a02-canonical-authority-boundary.json',
            'docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md',
            'docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json',
            'scripts/audit-msg-001-a01-authority-baseline.js',
            'scripts/audit-msg-001-a02-canonical-authority-boundary.js',
            'scripts/test-msg-001-a02-canonical-authority-boundary.js',
            '.github/workflows/msg-001-a02-canonical-authority-boundary.yml'
          ].forEach(function (file) { addUnique(msg.requiredPaths, file); });
          addUnique(msg.tests, 'audit:msg-001-a02-canonical-authority-boundary');
          addUnique(msg.tests, 'test:msg-001-a02-canonical-authority-boundary');
          addUnique(msg.evidence, 'MSG-A02 implemented the repository-only canonical authority split: authenticated UUID sessions are remote-only and fail closed without Supabase; non-UUID or anonymous fixtures are memory-only; canonical paths no longer merge, persist or synchronize browser-local conversations and messages.');
          msg.nextActions = config.orderedNextActions.slice();
          matrix.version = '1.3.79';
          matrix.updatedAt = '2026-08-02T16:27:00-03:00';
          write('config/domain-completion-matrix.json', JSON.stringify(matrix, null, 2));
          NODE

          npm run write:domain-completion-matrix

      - name: Validate MSG-A02 and cumulative contracts
        run: |
          node --check assets/js/repositories/messages-repository.js
          node --check scripts/audit-msg-001-a01-authority-baseline.js
          node --check scripts/audit-msg-001-a02-canonical-authority-boundary.js
          node --check scripts/test-msg-001-a02-canonical-authority-boundary.js
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run test:messages-supabase-repository-contract
          npm run test:attachments-supabase-repository-contract
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage only non-workflow canonical artifacts
        run: |
          git add \
            assets/js/repositories/messages-repository.js \
            config/msg-001-a02-canonical-authority-boundary.json \
            docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md \
            scripts/audit-msg-001-a01-authority-baseline.js \
            scripts/audit-msg-001-a02-canonical-authority-boundary.js \
            scripts/test-msg-001-a02-canonical-authority-boundary.js \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f \
            docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json \
            reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              assets/js/repositories/messages-repository.js|config/msg-001-a02-canonical-authority-boundary.json|docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md|docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json|scripts/audit-msg-001-a01-authority-baseline.js|scripts/audit-msg-001-a02-canonical-authority-boundary.js|scripts/test-msg-001-a02-canonical-authority-boundary.js|package.json|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish MSG-A02 domain artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(msg): enforce canonical messaging authority split"
          git push origin HEAD:msg/msg-001-baseline-audit
