name: Doke Temporary MSG-A02 Authority Boundary Applicator

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a02-authority-boundary-apply-temporary.yml'

permissions:
  contents: write

concurrency:
  group: msg-001-a02-authority-boundary-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.run_number == 1 && github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 20

      - name: Require immutable stacked ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 5ac1383d89e4f8afd6f7416a3c79ed8d3175f8b9 HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Implement MSG-A02 authority split
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');

          function write(file, content) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content.endsWith('\n') ? content : content + '\n');
          }
          function replaceOnce(source, before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(label + ': expected one match, found ' + count);
            return source.replace(before, after);
          }
          function replaceSection(source, start, end, replacement, label) {
            const from = source.indexOf(start);
            const to = source.indexOf(end, from + start.length);
            if (from < 0 || to < 0) throw new Error(label + ': section markers not found');
            return source.slice(0, from) + replacement + '\n\n' + source.slice(to);
          }
          function addUnique(items, value) {
            if (!items.includes(value)) items.push(value);
          }

          const repositoryPath = 'assets/js/repositories/messages-repository.js';
          let source = fs.readFileSync(repositoryPath, 'utf8');

          source = replaceOnce(
            source,
            '  var cache = null;',
            "  var cache = null;\n  var cacheAuthority = '';\n  var fixtureMemory = [];\n  var fixtureMemoryInitialized = false;",
            'authority memory declarations'
          );

          source = replaceSection(source, '  function readLocal() {', '  function writeLocal(items) {', [
            '  function readLocal() {',
            '    return clone(fixtureMemory);',
            '  }'
          ].join('\n'), 'readLocal memory boundary');

          source = replaceSection(source, '  function writeLocal(items) {', '  function isDemoProfessional(user) {', [
            '  function writeLocal(items) {',
            '    fixtureMemory = (Array.isArray(items) ? items : []).map(normalizeConversation);',
            '    fixtureMemoryInitialized = true;',
            '    cache = clone(fixtureMemory);',
            "    cacheAuthority = 'fixture-memory';",
            "    setProviderState('fixture-memory');",
            '    return clone(fixtureMemory);',
            '  }'
          ].join('\n'), 'writeLocal memory boundary');

          source = replaceOnce(source, [
            '  function isUuid(value) {',
            '    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(normalizeText(value));',
            '  }'
          ].join('\n'), [
            '  function isUuid(value) {',
            '    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(normalizeText(value));',
            '  }',
            '',
            '  function getAuthorityMode() {',
            '    var user = getSessionUser();',
            "    return user && isUuid(user.id) ? 'remote-only' : 'fixture-memory';",
            '  }',
            '',
            '  function createAuthorityError(message) {',
            "    var error = new Error(message || 'A autoridade remota de mensagens está indisponível.');",
            "    error.code = 'DOKE_MESSAGES_REMOTE_AUTHORITY_UNAVAILABLE';",
            '    return error;',
            '  }'
          ].join('\n'), 'authority helpers');

          source = replaceSection(source, '  function warnRemote(error, context) {', '  function getSupabaseClient() {', [
            '  function warnRemote(error, context) {',
            "    lastRemoteError = error || createAuthorityError('Falha desconhecida nas mensagens remotas.');",
            "    var remoteOnly = getAuthorityMode() === 'remote-only';",
            "    setProviderState(remoteOnly ? 'supabase-error' : 'fixture-memory');",
            "    if (root.console && typeof root.console.warn === 'function') {",
            "      root.console.warn('[Doke messages repository] Falha em ' + context + (remoteOnly ? '. Operação encerrada em fail-closed.' : '. Fixture mantida somente em memória.'), error);",
            '    }',
            '  }'
          ].join('\n'), 'remote warning boundary');

          source = replaceOnce(source, [
            "    if (!config.enabled || config.messagesEnabled === false || !config.url || !config.anonKey || !sdk || typeof sdk.createClient !== 'function') {",
            "      setProviderState('local');",
            '      return null;',
            '    }'
          ].join('\n'), [
            "    if (!config.enabled || config.messagesEnabled === false || !config.url || !config.anonKey || !sdk || typeof sdk.createClient !== 'function') {",
            "      setProviderState(getAuthorityMode() === 'remote-only' ? 'supabase-unavailable' : 'fixture-memory');",
            '      return null;',
            '    }'
          ].join('\n'), 'provider bootstrap state');

          source = replaceOnce(
            source,
            '      if (!user || !isUuid(user.id)) return [];',
            "      if (!user || !isUuid(user.id)) throw createAuthorityError('Sessão Supabase canônica indisponível para leitura de mensagens.');",
            'remote read canonical session requirement'
          );

          source = replaceOnce(
            source,
            '    if (cache && !options.fresh) return Promise.resolve(clone(cache));',
            "    if (cache && cacheAuthority === 'fixture-memory' && !options.fresh) return Promise.resolve(clone(cache));",
            'fixture cache authority'
          );

          source = replaceSection(source, '  function synchronizePending(items) {', '  function load(options) {', [
            '  function synchronizePending(items) {',
            "    if (getAuthorityMode() === 'remote-only') return Promise.resolve([]);",
            '    return Promise.resolve(clone(items || fixtureMemory));',
            '  }'
          ].join('\n'), 'pending synchronization retirement');

          source = replaceSection(source, '  function load(options) {', '  function list(filters) {', [
            '  function load(options) {',
            '    options = options || {};',
            '    var authority = getAuthorityMode();',
            '    if (cache && cacheAuthority === authority && !options.fresh) return Promise.resolve(clone(cache));',
            "    if (authority === 'fixture-memory') {",
            '      return loadLocal(options).then(function (items) {',
            "        cacheAuthority = 'fixture-memory';",
            "        setProviderState('fixture-memory');",
            '        return clone(items);',
            '      });',
            '    }',
            '    if (!getSupabaseClient()) {',
            "      var unavailable = createAuthorityError('Cliente Supabase indisponível para a sessão autenticada.');",
            "      warnRemote(unavailable, 'bootstrap remoto');",
            '      return Promise.reject(unavailable);',
            '    }',
            '    return fetchRemoteConversations().then(function (remote) {',
            '      cache = mergeById(remote);',
            "      cacheAuthority = 'remote-only';",
            '      lastRemoteError = null;',
            "      setProviderState('supabase');",
            '      return clone(cache);',
            '    }).catch(function (error) {',
            "      warnRemote(error, 'leitura');",
            '      throw error;',
            '    });',
            '  }'
          ].join('\n'), 'load authority boundary');

          source = replaceSection(source, '  function listLocal(filters) {', '  function getById(id) {', [
            '  function listLocal(filters) {',
            '    filters = filters || {};',
            "    if (getAuthorityMode() === 'remote-only') return [];",
            '    var user = filters.currentUser === false ? null : getSessionUser();',
            "    var orderId = normalizeText(filters.orderId || '');",
            '    return clone(readLocal().filter(function (item) {',
            '      if (orderId && item.orderId !== orderId) return false;',
            '      if (filters.currentUser !== false && !matchesCurrentUser(item, user)) return false;',
            '      return true;',
            '    }));',
            '  }'
          ].join('\n'), 'listLocal authority boundary');

          source = replaceSection(source, '  function save(conversation) {', '  function createForOrder(order, options) {', [
            '  function save(conversation) {',
            '    var normalized = normalizeConversation(conversation);',
            "    if (getAuthorityMode() === 'fixture-memory') return saveLocal(normalized, 'memory-only');",
            '    if (!getSupabaseClient()) {',
            "      var unavailable = createAuthorityError('Cliente Supabase indisponível para gravar a conversa autenticada.');",
            "      warnRemote(unavailable, 'gravação');",
            '      return Promise.reject(unavailable);',
            '    }',
            '    return saveRemote(normalized).then(function (remoteSaved) {',
            '      cache = mergeById([remoteSaved], cache || []);',
            "      cacheAuthority = 'remote-only';",
            '      lastRemoteError = null;',
            "      setProviderState('supabase');",
            '      return clone(remoteSaved);',
            '    }).catch(function (error) {',
            "      warnRemote(error, 'gravação');",
            '      throw error;',
            '    });',
            '  }'
          ].join('\n'), 'save authority boundary');

          source = replaceOnce(source,
            "    getProviderStatus: function () { return Object.freeze({ provider: getSupabaseClient() ? 'supabase' : 'local', fallbackActive: Boolean(lastRemoteError), lastError: lastRemoteError ? normalizeText(lastRemoteError.message) : '' }); },",
            "    getAuthorityStatus: function () { return Object.freeze({ authority: getAuthorityMode(), persistentLocalAuthority: false, pendingSynchronization: false }); },\n    getProviderStatus: function () { var authority = getAuthorityMode(); return Object.freeze({ authority: authority, provider: authority === 'remote-only' ? (getSupabaseClient() ? 'supabase' : 'unavailable') : 'fixture-memory', fallbackActive: false, lastError: lastRemoteError ? normalizeText(lastRemoteError.message) : '' }); },",
            'provider status contract'
          );
          source = replaceOnce(source,
            '    clearCache: function () { cache = null; }',
            "    clearCache: function () { cache = null; cacheAuthority = ''; }",
            'cache reset contract'
          );

          write(repositoryPath, source);

          const config = {
            contractVersion: 'msg-a02-canonical-authority-boundary-v1',
            status: 'repository_only_authority_split_implemented',
            domain: 'MSG-001',
            scope: 'canonical_remote_only_real_sessions_and_memory_only_fixtures',
            observedAt: '2026-08-02T16:27:00-03:00',
            repository: {
              name: 'Ezyrus07/doke-web',
              branch: 'msg/msg-001-baseline-audit',
              baseHead: '39114341b2e1ee4d5e6797eb0538558d65e70a3b'
            },
            authorityClasses: {
              authenticatedUuidSession: 'remote-only',
              nonUuidOrAnonymousFixture: 'fixture-memory',
              persistentBrowserConversationAuthorityAllowed: false,
              realSessionLocalFallbackAllowed: false,
              realSessionPendingWriteAllowed: false,
              legacyStorageKeysDeletedAutomatically: false,
              legacyStorageKeysConsultedByCanonicalPaths: false
            },
            readContract: {
              realSessionSource: 'Supabase conversations and messages only',
              remoteFailurePolicy: 'reject_fail_closed',
              remoteRowsPersistedToBrowserStorage: false,
              fixtureSource: 'in_memory_plus_static_fixture_seed',
              crossAuthorityMergeAllowed: false
            },
            writeContract: {
              realSessionDestination: 'Supabase only',
              remoteFailurePolicy: 'reject_fail_closed',
              optimisticPersistentLocalSuccessAllowed: false,
              pendingSynchronizationAllowed: false,
              fixtureDestination: 'memory-only'
            },
            compatibility: {
              publicRepositoryApiPreserved: true,
              localStorageKeysPreservedForNonDestructiveMigration: true,
              explicitLegacyReadWriteExportsRemainNonPersistentMemoryAdapters: true,
              realtimePublicationChanged: false,
              backendCommandBoundaryChanged: false,
              attachmentLifecycleChanged: false
            },
            blockerDisposition: {
              'MSG-B02': { status: 'open', reason: 'Realtime publication remains outside MSG-A02.' },
              'MSG-B03': { status: 'narrowed', reason: 'Conversation and message persistence no longer mixes local and remote authority; presence, typing and read-receipt realtime remain pending.' },
              'MSG-B04': { status: 'open', reason: 'Attachment ownership, cleanup and retention remain outside MSG-A02.' }
            },
            orderedNextActions: [
              'MSG-A03: introduce a server-owned command and read-state boundary; retire direct authenticated browser DML as canonical authority.',
              'MSG-A04: prepare participant-scoped Realtime publication and subscription contracts without applying staging changes.',
              'MSG-A05: map and harden transaction-attachments ownership, signed URL, cleanup and retention boundaries.'
            ],
            effects: {
              stagingReads: 0,
              stagingMutations: 0,
              migrationsApplied: 0,
              realtimePublicationChanges: 0,
              storagePolicyChanges: 0,
              deployments: 0,
              productionChanged: false,
              accountsChanged: 0,
              messagesChanged: 0,
              pullRequestsMerged: 0
            }
          };
          const configJson = JSON.stringify(config, null, 2) + '\n';
          write('config/msg-001-a02-canonical-authority-boundary.json', configJson);
          write('docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json', configJson);

          write('docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md', `# MSG-001 / A02 — Canonical authority boundary

## Outcome

MSG-A02 separates real messaging authority from fixture behavior without accessing staging. Authenticated UUID sessions now read and write conversations exclusively through Supabase. Non-UUID and anonymous fixtures remain available only in runtime memory.

## Real sessions

- no browser persistence of conversations or messages;
- no merge between local and remote rows;
- no fallback to stale local data after a remote read failure;
- no pending local success after a remote write failure;
- missing Supabase client or canonical Supabase session rejects with \`DOKE_MESSAGES_REMOTE_AUTHORITY_UNAVAILABLE\`;
- remote data may be cached only in process memory for the current authority class.

## Fixtures

- non-UUID identities use \`fixture-memory\`;
- static mock data may seed memory when explicitly requested;
- save, list and clear operations do not call \`localStorage\`;
- legacy storage keys are not deleted automatically, but canonical paths no longer consult them.

## Compatibility

The public repository API remains available. Realtime, server-owned command routing and attachment lifecycle are deliberately unchanged and stay assigned to MSG-A03, MSG-A04 and MSG-A05.

## Blockers

- MSG-B02 remains open for Realtime publication.
- MSG-B03 is narrowed: persistent conversation/message divergence is removed, while presence, typing and read receipts remain local-only.
- MSG-B04 remains open for attachment lifecycle hardening.

## Safety

- staging reads: 0
- staging mutations: 0
- migrations applied: 0
- Realtime publication changes: 0
- Storage policy changes: 0
- deployments: 0
- production changes: 0
- accounts or real messages changed: 0
- merge: 0
`);

          write('scripts/test-msg-001-a02-canonical-authority-boundary.js', `#!/usr/bin/env node
'use strict';

const assert = require('assert');
const fs = require('fs');
const vm = require('vm');

const source = fs.readFileSync('assets/js/repositories/messages-repository.js', 'utf8');

function boot(user, options) {
  options = options || {};
  const store = new Map();
  store.set('doke.conversations.local.v1', JSON.stringify([{ id: 'stale-local', clientId: user && user.id || '', professionalId: 'stale-peer' }]));
  let reads = 0;
  let writes = 0;
  const attributes = {};
  const localStorage = {
    getItem(key) { reads += 1; return store.has(key) ? store.get(key) : null; },
    setItem(key, value) { writes += 1; store.set(key, String(value)); },
    removeItem(key) { writes += 1; store.delete(key); }
  };
  const Doke = {
    session: { getCurrentUser() { return user || null; } },
    repositories: {}
  };
  const root = {
    Doke,
    localStorage,
    DOKE_SUPABASE_CONFIG: options.config || { enabled: false, messagesEnabled: true },
    supabase: options.supabase || null,
    console: { warn() {} }
  };
  const document = { documentElement: { setAttribute(name, value) { attributes[name] = value; } } };
  const context = {
    window: root,
    document,
    fetch: async function () { return { ok: true, json: async function () { return []; } }; },
    Intl, Date, Promise, Object, Array, String, Number, Boolean, RegExp, JSON, Error, Math,
    setTimeout, clearTimeout
  };
  root.window = root;
  root.document = document;
  root.fetch = context.fetch;
  vm.runInNewContext(source, context, { filename: 'messages-repository.js' });
  return {
    repository: root.Doke.repositories.messages,
    getReads: function () { return reads; },
    getWrites: function () { return writes; },
    attributes
  };
}

(async function run() {
  const fixture = boot({ id: 'fixture-client', role: 'client', name: 'Fixture' });
  const fixtureConversation = {
    id: 'conv-fixture',
    clientId: 'fixture-client',
    professionalId: 'fixture-professional',
    participants: ['fixture-client', 'fixture-professional'],
    messages: []
  };
  const fixtureSaved = await fixture.repository.save(fixtureConversation);
  assert.strictEqual(fixtureSaved.syncStatus, 'memory-only');
  assert.strictEqual(fixture.getWrites(), 0, 'fixture authority must not persist to localStorage');
  assert.strictEqual(fixture.repository.listLocal({ currentUser: false }).length, 1);
  const fixtureStatus = fixture.repository.getProviderStatus();
  assert.strictEqual(fixtureStatus.authority, 'fixture-memory');
  assert.strictEqual(fixtureStatus.provider, 'fixture-memory');
  assert.strictEqual(fixtureStatus.fallbackActive, false);

  const uuid = '11111111-1111-4111-8111-111111111111';
  const remote = boot({ id: uuid, role: 'client', name: 'Real' });
  await assert.rejects(
    remote.repository.load({ fresh: true, currentUser: false }),
    function (error) { return error && error.code === 'DOKE_MESSAGES_REMOTE_AUTHORITY_UNAVAILABLE'; }
  );
  await assert.rejects(
    remote.repository.save({ id: 'conv-real', clientId: uuid, professionalId: '22222222-2222-4222-8222-222222222222', messages: [] }),
    function (error) { return error && error.code === 'DOKE_MESSAGES_REMOTE_AUTHORITY_UNAVAILABLE'; }
  );
  assert.strictEqual(remote.getWrites(), 0, 'real authority must not persist failed operations locally');
  assert.deepStrictEqual(remote.repository.listLocal({ currentUser: false }), []);
  const remoteStatus = remote.repository.getProviderStatus();
  assert.strictEqual(remoteStatus.authority, 'remote-only');
  assert.strictEqual(remoteStatus.provider, 'unavailable');
  assert.strictEqual(remoteStatus.fallbackActive, false);
  assert.strictEqual(remote.repository.getAuthorityStatus().persistentLocalAuthority, false);
  assert.strictEqual(remote.repository.getAuthorityStatus().pendingSynchronization, false);

  console.log('MSG-A02 canonical authority boundary runtime test passed.');
}()).catch(function (error) {
  console.error(error);
  process.exitCode = 1;
});
`);

