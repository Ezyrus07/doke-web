name: Doke UX-RESP-DEBT-010 Tablet Rail Retirement Readiness

on:
  push:
    branches:
      - diag/ux-resp-debt-010-tablet-rail-retirement-readiness

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-009 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 153fedff9bf4989a68ff99956181527926ed6533)" = "153fedff9bf4989a68ff99956181527926ed6533"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Inventory direct references and active page consumers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { getLoadedCssAssets } = require('./scripts/lib/css-assets');
          const root = process.cwd();
          const target = 'assets/css/components/shell/tablet-internal-rail-contract.css';
          const needle = 'tablet-internal-rail-contract.css';

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else out.push(full);
            }
            return out;
          }

          const cssFiles = walk(path.join(root, 'assets', 'css')).filter((file) => file.endsWith('.css'));
          const directRefs = [];
          const importRefs = [];
          for (const file of cssFiles) {
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes(needle)) continue;
            const rel = path.relative(root, file).replaceAll(path.sep, '/');
            directRefs.push(rel);
            if (/^\s*@import[^;]*tablet-internal-rail-contract\.css[^;]*;/m.test(text)) importRefs.push(rel);
          }

          const rootHtml = fs.readdirSync(root).filter((name) => name.endsWith('.html')).sort();
          const activePages = [];
          for (const page of rootHtml) {
            const html = fs.readFileSync(path.join(root, page), 'utf8');
            const assets = getLoadedCssAssets(html, root);
            if (assets.includes(target)) activePages.push(page);
          }

          console.log('TARGET_EXISTS=' + fs.existsSync(path.join(root, target)));
          console.log('DIRECT_REFERENCE_FILES=' + JSON.stringify(directRefs));
          console.log('IMPORT_REFERENCE_FILES=' + JSON.stringify(importRefs));
          console.log('ACTIVE_PAGE_CONSUMERS=' + JSON.stringify(activePages));
          console.log('DIRECT_REFERENCE_COUNT=' + directRefs.length);
          console.log('IMPORT_REFERENCE_COUNT=' + importRefs.length);
          console.log('ACTIVE_PAGE_CONSUMER_COUNT=' + activePages.length);
          NODE

      - name: Validate current CSS import graph
        run: npm run audit:css-import-resolution

      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Reproduce certified responsive checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-responsive-index-baseline.js
          node scripts/test-responsive-contract.js
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json', 'utf8'));
          if (report.summary.checks !== 893 || report.summary.failures !== 0 || report.summary.skips !== 277) {
            throw new Error(`checkpoint drift: ${report.summary.checks}/${report.summary.failures}/${report.summary.skips}`);
          }
          console.log('CHECKPOINT=893/0/277');
          NODE

      - name: Probe physical retirement in workspace only
        shell: bash
        run: |
          set -euo pipefail
          rm assets/css/components/shell/tablet-internal-rail-contract.css
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { getLoadedCssAssets } = require('./scripts/lib/css-assets');
          const root = process.cwd();
          const target = 'assets/css/components/shell/tablet-internal-rail-contract.css';
          for (const page of fs.readdirSync(root).filter((name) => name.endsWith('.html'))) {
            const assets = getLoadedCssAssets(fs.readFileSync(path.join(root, page), 'utf8'), root);
            if (assets.includes(target)) throw new Error(`${page} still resolves retired contract`);
          }
          console.log('RETIREMENT_IMPORT_GRAPH=PASS');
          NODE
          npm run audit:css-import-resolution
          node scripts/generate-responsive-index-baseline.js
          node scripts/test-responsive-contract.js
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/responsive-contract-test-report.json', 'utf8'));
          console.log(`RETIREMENT_CHECKPOINT=${report.summary.checks}/${report.summary.failures}/${report.summary.skips}`);
          if (report.summary.checks !== 893 || report.summary.failures !== 0 || report.summary.skips !== 277) {
            throw new Error('physical retirement changes certified responsive surface');
          }
          NODE

      - name: Validate shared boundaries after retirement probe
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          git diff --check
