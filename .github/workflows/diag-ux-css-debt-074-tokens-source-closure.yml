name: Doke UX-CSS-DEBT-074 Tokens Source Closure

on:
  push:
    branches: [diag/ux-css-debt-074-tokens-source-closure]
    paths: [.github/workflows/diag-ux-css-debt-074-tokens-source-closure.yml]

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 3a2f10f67fcf7452114959d9c3a217852a765c55
      PARENT_SHA: c79ccdced5ed83b77ef050a66cbc2284e6fc9ca8
      TARGET_TREE: c847008cab6841b7291f8b1f1c03091e5e6cb8f9
      TARGET_FILE: assets/css/core/tokens.css
      TARGET_BLOB: 3c2a22b31ad8a73740b1491398a3c6e82acc6a65
      RANKING_RUN: 32130332702
      DIAG_BRANCH: diag/ux-css-debt-074-tokens-source-closure
      RESULT_FILE: .diagnostics/ux-css-debt-074-source-closure.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/closure.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');
          const f=process.env.TARGET_FILE,text=fs.readFileSync(f,'utf8'),lines=text.split('\n');
          const expected=new Map([[40,'  --doke-type-tracking-display: -0.035em;'],[41,'  --doke-type-tracking-label: 0.08em;'],[261,'  --doke-overlay-border: 0;'],[262,'  --doke-overlay-shadow: 0 18px 48px rgba(20, 50, 80, 0.14);'],[434,'  --doke-close-button-size: var(--close-button-size);']]);
          for(const [i,v] of expected)if((lines[i]||'').replace(/\r$/,'')!==v)throw Error(`row drift ${i+1}: ${JSON.stringify(lines[i])}`);
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(x=>x.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const x of tracked){const src=fs.readFileSync(x,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(src)))imports.push(normImport(m[1],x));meta.set(x,{src,imports})}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(x=>meta.has(x));while(todo.length){const x=todo.pop();if(active.has(x)||!meta.has(x))continue;active.add(x);for(const n of meta.get(x).imports)if(meta.has(n))todo.push(n)}if(active.size!==401)throw Error(`active drift ${active.size}`);
          const importers=[...meta].filter(([x,m])=>x!==f&&m.imports.includes(f)).map(([x])=>x).sort(),activeImporters=importers.filter(x=>active.has(x));if(!activeImporters.includes('assets/css/core/index.css'))throw Error(`core importer missing ${activeImporters}`);
          const reach=[];for(const pg of report.pageAssets){const seen=new Set(),stack=[...(pg.css||[]).filter(x=>meta.has(x))];while(stack.length){const x=stack.pop();if(seen.has(x)||!meta.has(x))continue;seen.add(x);if(x===f){reach.push(pg.page);break}for(const n of meta.get(x).imports)if(meta.has(n))stack.push(n)}}reach.sort();if(reach.length!==27)throw Error(`reach ${reach.length}`);
          // All five residues are duplicate custom-property declarations inside the same unconditional :root declaration block.
          const rootStart=lines.findIndex(x=>x.trim()===':root {'),rootEnd=lines.findIndex((x,i)=>i>rootStart&&x.trim()==='}');if(rootStart<0||rootEnd<0||rootEnd<965)throw Error(`root block ${rootStart}/${rootEnd}`);
          const checks=[['--doke-type-tracking-display',40,957,'-0.035em','-0.04em'],['--doke-type-tracking-label',41,960,'0.08em','0.08em'],['--doke-overlay-border',261,420,'0','var(--modal-surface-border)'],['--doke-overlay-shadow',262,423,'0 18px 48px rgba(20, 50, 80, 0.14)','var(--modal-surface-shadow)'],['--doke-close-button-size',434,945,'var(--close-button-size)','var(--close-button-size)']];
          for(const [prop,early,late,ev,lv] of checks){for(const i of [early,late])if(i<=rootStart||i>=rootEnd)throw Error(`${prop} outside root`);const re=new RegExp(`^\\s*${prop.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')}\\s*:\\s*(.*?)\\s*;\\s*$`);const a=(lines[early]||'').match(re),b=(lines[late]||'').match(re);if(!a||!b||a[1]!==ev||b[1]!==lv)throw Error(`${prop} identity ${a?.[1]}/${b?.[1]}`);if(late<=early)throw Error(`${prop} order`);console.log(`CASCADE ROW|prop=${prop}|earlyLine=${early+1}|early=${ev}|winnerLine=${late+1}|winner=${lv}|sameRootBlock=1|sameImportance=1|unconditional=1`)}
          const candidate=lines.filter((_,i)=>!expected.has(i)).join('\n');const b=Buffer.from(candidate),hash=crypto.createHash('sha256').update(b).digest('hex');
          const count=(src)=>{const m=src.match(/^\s*--[\w-]+\s*:/gm)||[];return m.length};if(count(text)!==855||count(candidate)!==850)throw Error(`declaration metrics ${count(text)}/${count(candidate)}`);
          for(const [prop] of checks){const n=(candidate.match(new RegExp(`^\\s*${prop.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')}\\s*:`, 'gm'))||[]).length;if(n!==1)throw Error(`${prop} candidate duplicates ${n}`)}
          console.log(`IMPORTER PASS|all=${importers.length}|active=${activeImporters.length}|allList=${importers.join(',')||'-'}|activeList=${activeImporters.join(',')||'-'}`);
          console.log(`ACTIVE REACH|pages=${reach.length}|pageList=${reach.join(',')}`);
          console.log('CASCADE PASS|target=855/5|candidate=850/0|family=:root|identical=2|changed=3|sameRootBlock=5/5|unconditional=5/5|browserRequired=0|reason=same-declaration-block-later-custom-property-winner');
          console.log(`CANDIDATE IDENTITY|candidate=850/0|sha256=${hash}|bytes=${b.length}|files=1|additions=0|deletions=5`);
          console.log(`SOURCE CLOSURE PASS|target=${f}|targetBlob=${process.env.TARGET_BLOB}|ranking=${process.env.RANKING_RUN}|browserRequired=0`);
          NODE
      - id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
      - name: Publish fail-closed source closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL; if test '${{ steps.validate.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TARGET_SHA=$TARGET_SHA"; echo "VALIDATE=${{ steps.validate.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep '^IMPORTER PASS|' /tmp/closure.log || true; grep '^ACTIVE REACH|' /tmp/closure.log || true; grep '^CASCADE ROW|' /tmp/closure.log || true; grep '^CASCADE PASS|' /tmp/closure.log || true; grep '^CANDIDATE IDENTITY|' /tmp/closure.log || true; grep '^SOURCE CLOSURE PASS|' /tmp/closure.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 120 /tmp/closure.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"; git commit -m 'diag: record UX-CSS-DEBT-074 source closure [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
