name: TEMP UX-STATE-001 Community Canonical View Browser R9
on:
  push:
    branches: [diag/ux-state-001-community-canonical-view-browser-r9]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PARENT: 84dc170e5bcf8b04aaf7eaba6f46c1ae67b730af
      PARENT_TREE: 9c2545f50d34ebf81e3976fb5c421e6f5f616b32
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-state-001-community-canonical-view-browser-r9.yml
      TARGET: assets/js/pages/comunidade.js
      CANDIDATE_BLOB: 32f472683cf33986f2b6b7802ba384de9fc25b3f
      CANDIDATE_SHA256: 816bc9acf0530dadfb01fd5011251f0cf4474696aaf1c6e918171c8c489a59fb
      CANDIDATE_BYTES: '98844'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Browser A/B after ownership reconciliation
        shell: bash
        run: |
          set -euo pipefail
          DIAG_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$DIAG_HEAD" | awk '{print $2}')" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-only -r "$DIAG_HEAD")" = "$WORKFLOW_PATH"
          git checkout --detach "$PARENT" >/dev/null
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          git worktree add --detach /tmp/ux-state-parent "$PARENT" >/dev/null
          git worktree add --detach /tmp/ux-state-candidate "$PARENT" >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const f='/tmp/ux-state-candidate/assets/js/pages/comunidade.js';
          let s=fs.readFileSync(f,'utf8');
          const before='page.dataset.viewState = nextState;';
          const after="page.dataset.viewState = nextState === 'hydrated' ? 'ready' : nextState;";
          const n=s.split(before).length-1;
          if(n!==1) throw new Error(`candidate assignment count ${n}`);
          fs.writeFileSync(f,s.replace(before,after));
          NODE
          test "$(git -C /tmp/ux-state-candidate diff --name-only)" = "$TARGET"
          test "$(git -C /tmp/ux-state-candidate diff --numstat | awk '{print $1" "$2" "$3}')" = "1 1 $TARGET"
          test "$(git -C /tmp/ux-state-candidate hash-object "$TARGET")" = "$CANDIDATE_BLOB"
          test "$(sha256sum /tmp/ux-state-candidate/$TARGET | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(wc -c < /tmp/ux-state-candidate/$TARGET | tr -d ' ')" = "$CANDIDATE_BYTES"
          echo CANDIDATE_IDENTITY=PASS
          (cd /tmp/ux-state-parent && python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/parent-server.log 2>&1 & echo $! >/tmp/parent-server.pid)
          (cd /tmp/ux-state-candidate && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/candidate-server.log 2>&1 & echo $! >/tmp/candidate-server.pid)
          trap 'kill $(cat /tmp/parent-server.pid 2>/dev/null) $(cat /tmp/candidate-server.pid 2>/dev/null) 2>/dev/null || true' EXIT
          for p in 4173 4174; do
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$p/comunidade.html" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            test "$ok" = 1
          done
          cat >/tmp/ux-state-browser-r9.cjs <<'NODE'
          const crypto=require('crypto');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const stable=s=>String(s||'').replace(/\s+/g,' ').trim();
          async function capture(browser,label,port){
            const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1,colorScheme:'light',reducedMotion:'reduce'});
            const page=await context.newPage();
            const pageErrors=[], consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            const response=await page.goto(`http://127.0.0.1:${port}/comunidade.html`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response?.ok()) throw new Error(`${label} navigation ${response?.status()}`);
            await page.waitForFunction(()=>document.querySelector('[data-communities-page]')?.dataset.communityHydrated==='true',null,{timeout:20000});
            await page.waitForTimeout(1800);
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}'});
            await page.waitForTimeout(150);
            const meta=await page.evaluate(()=>{
              const root=document.querySelector('[data-communities-page]');
              const body=document.body;
              const cards=[...document.querySelectorAll('[data-community-card]')];
              const sections=[...document.querySelectorAll('main section')];
              const buttons=[...document.querySelectorAll('main button:not([hidden])')].filter(x=>getComputedStyle(x).display!=='none');
              return {
                url:location.pathname,title:document.title,
                viewState:root?.dataset.viewState??null,state:root?.dataset.state??null,
                experienceState:root?.dataset.experienceState??null,pageHydration:root?.dataset.pageHydration??null,
                bodyDataState:body?.dataset.dataState??null,communityHydrated:root?.dataset.communityHydrated??null,
                ariaBusy:root?.getAttribute('aria-busy'),cardCount:cards.length,sectionCount:sections.length,
                visibleButtonCount:buttons.length,activeFilter:root?.dataset.activeFilter??null,
                bodyClass:body.className,mainText:(document.querySelector('main')?.innerText||'').replace(/\s+/g,' ').trim()
              };
            });
            meta.mainTextHash=sha(Buffer.from(stable(meta.mainText))); delete meta.mainText;
            const png=await page.screenshot({fullPage:true,animations:'disabled'});
            await context.close();
            return {meta,pageErrors,consoleErrors,screenshotSha256:sha(png),screenshotBytes:png.length};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const parent=await capture(browser,'parent',4173);
              const candidate=await capture(browser,'candidate',4174);
              if(parent.meta.viewState!=='idle') throw new Error('parent expected canonicalizer fallback idle '+JSON.stringify(parent.meta));
              if(candidate.meta.viewState!=='ready') throw new Error('candidate expected ready '+JSON.stringify(candidate.meta));
              for(const [label,x] of [['parent',parent],['candidate',candidate]]){
                if(x.meta.state!=='hydrated') throw new Error(`${label} internal state ${x.meta.state}`);
                if(x.meta.bodyDataState!=='hydrated') throw new Error(`${label} bodyDataState ${x.meta.bodyDataState}`);
                if(x.meta.communityHydrated!=='true') throw new Error(`${label} communityHydrated ${x.meta.communityHydrated}`);
                if(x.meta.ariaBusy!=='false') throw new Error(`${label} ariaBusy ${x.meta.ariaBusy}`);
                if(x.meta.experienceState!==null) throw new Error(`${label} unexpected experience owner ${x.meta.experienceState}`);
                if(x.meta.pageHydration!==null) throw new Error(`${label} unexpected page hydration owner ${x.meta.pageHydration}`);
                if(x.pageErrors.length) throw new Error(`${label} page errors ${JSON.stringify(x.pageErrors)}`);
              }
              const normalize=m=>{const x={...m}; delete x.viewState; return x};
              if(JSON.stringify(normalize(parent.meta))!==JSON.stringify(normalize(candidate.meta))) throw new Error('unexpected metadata delta '+JSON.stringify({parent:normalize(parent.meta),candidate:normalize(candidate.meta)}));
              if(JSON.stringify(parent.consoleErrors)!==JSON.stringify(candidate.consoleErrors)) throw new Error('console delta '+JSON.stringify({parent:parent.consoleErrors,candidate:candidate.consoleErrors}));
              const screenshotParity=parent.screenshotSha256===candidate.screenshotSha256&&parent.screenshotBytes===candidate.screenshotBytes;
              if(!screenshotParity) throw new Error('screenshot delta '+JSON.stringify({parent:{sha:parent.screenshotSha256,bytes:parent.screenshotBytes},candidate:{sha:candidate.screenshotSha256,bytes:candidate.screenshotBytes}}));
              console.log('UX_STATE_001_BROWSER_R9='+JSON.stringify({result:'PASS',viewport:'1440x1000',ownership:{parentPublicFallback:'idle',candidatePublicCanonical:'ready',internalHydration:'hydrated'},parent:{...parent.meta,pageErrors:0,consoleErrors:parent.consoleErrors.length,screenshotSha256:parent.screenshotSha256,screenshotBytes:parent.screenshotBytes},candidate:{...candidate.meta,pageErrors:0,consoleErrors:candidate.consoleErrors.length,screenshotSha256:candidate.screenshotSha256,screenshotBytes:candidate.screenshotBytes},expectedDiffKeys:['viewState'],metadataParityExceptExpected:true,screenshotParity:true,consoleParity:true,criteriaRelaxed:0,repositoryOnly:true,productMutation:false}));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/ux-state-browser-r9.cjs
          git worktree remove --force /tmp/ux-state-parent
          git worktree remove --force /tmp/ux-state-candidate
          git reset --hard "$PARENT" >/dev/null
          git clean -fd >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT"
          test -z "$(git status --porcelain)"
