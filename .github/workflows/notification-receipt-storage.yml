name: Notification receipt storage

on:
  pull_request:
    paths:
      - 'assets/js/core/notification-action.js'
      - 'assets/js/core/account-storage.js'
      - 'scripts/lib/notification-action-test-runtime.js'
      - 'scripts/test-ux-notif-009-notification-actions.js'
      - 'scripts/test-ux-notif-010-multi-surface-rollout.js'
      - '.github/workflows/notification-receipt-storage.yml'

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax
        run: |
          node --check assets/js/core/notification-action.js
          node --check scripts/lib/notification-action-test-runtime.js
          node --check scripts/test-ux-notif-009-notification-actions.js
          node --check scripts/test-ux-notif-010-multi-surface-rollout.js
      - name: Validate real storage and notification consumers
        run: |
          node scripts/test-ux-notif-009-notification-actions.js
          node scripts/test-ux-notif-010-multi-surface-rollout.js
          node scripts/test-ux-priv-001-account-storage.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
      - name: Audit governance
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:unused-asset-candidates
          npm run audit:duplicate-assets
          git diff --check
