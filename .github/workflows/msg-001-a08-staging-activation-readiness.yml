name: Doke MSG-A08 Final Cleanup Matrix Publisher

on:
  pull_request:
    paths:
      - '.github/workflows/msg-001-a08-staging-activation-readiness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-a08-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Simulate permanent clean state
        run: |
          echo '' | base64 -d > .github/workflows/msg-001-a08-staging-activation-readiness.yml
          rm -f .github/tmp/msg-a08-generator.js .github/tmp/patch-msg-a08-generator.js
          node scripts/audit-domain-completion-matrix.js --write
      - name: Validate simulated final state
        run: |
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run audit:msg-001-a03-server-command-boundary
          npm run test:msg-001-a03-server-command-boundary
          npm run audit:msg-001-a04-realtime-publication-subscription-contract
          npm run test:msg-001-a04-realtime-publication-subscription-runtime
          npm run audit:msg-001-a05-attachment-lifecycle
          npm run test:msg-001-a05-attachment-lifecycle-runtime
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:msg-001-a07-command-reliability
          npm run test:msg-001-a07-command-reliability-runtime
          npm run audit:msg-001-a08-staging-activation-readiness
          npm run test:msg-001-a08-staging-activation-readiness
          npm run audit:messages-api-contract
          npm run audit:runtime-idempotency-audit
          npm run audit:staging-messaging-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Commit final-state matrix artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "Final-state matrix already current."
            exit 0
          fi
          git commit -m "Regenerate matrix for permanent MSG-A08 state"
          git push origin HEAD:msg/msg-001-baseline-audit
