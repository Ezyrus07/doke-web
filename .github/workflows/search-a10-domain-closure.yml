name: Temporary SEARCH-A10 domain closure

on:
  pull_request:
    branches:
      - 'cat/**'
    paths:
      - '.github/workflows/search-a10-domain-closure.yml'

permissions:
  contents: write

concurrency:
  group: doke-search-a10-domain-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote SEARCH-001 matrix state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const domain = matrix.domains.find((entry) => entry.id === 'SEARCH-001');
          if (!domain) throw new Error('SEARCH-001 domain not found');
          const blockerIds = (domain.blockers || []).map((item) => item.id);
          if (domain.maturity !== 3
              || domain.serverAuthority !== 'partial'
              || domain.stagingEvidence !== 'staging_canary'
              || blockerIds.length !== 1
              || blockerIds[0] !== 'SEARCH-B03') {
            throw new Error(`Unexpected SEARCH-001 precondition: ${JSON.stringify({
              maturity: domain.maturity,
              serverAuthority: domain.serverAuthority,
              stagingEvidence: domain.stagingEvidence,
              blockerIds
            })}`);
          }

          domain.maturity = 4;
          domain.userFacingAuthority = 'hybrid';
          domain.serverAuthority = 'canonical';
          domain.stagingEvidence = 'staging_operational';
          domain.securityGate = 'partial';
          domain.productionGate = 'blocked';
          domain.edgeFunctions = ['search-public-services-v2'];
          domain.evidence = [
            'SEARCH-A01 through SEARCH-A03 established authority boundaries and canonical identity-scoped favorites across discovery surfaces.',
            'SEARCH-A04 and SEARCH-A05 installed and activated bounded server-side filtering, approved-snapshot eligibility, opaque pagination and fail-closed result rendering.',
            'SEARCH-A06 through SEARCH-A08 installed immutable ranking versions, bounded anti-manipulation signals, search-rank-v0 rollback and the version-bound public RPC v2 without exposing score internals.',
            'SEARCH-A09 installed private server-authoritative latency, error, cursor, zero-result and ranking-version observability through the JWT-protected search-public-services-v2 Edge proxy.',
            'SEARCH-A10 activated Edge v2 in the staging browser under search-rank-v0, proved no automatic fallback, proved deliberate RPC v1 rollback and prohibited direct browser catalog reads.',
            'SEARCH-A10 deterministic browser canary #191 passed the complete A01-A10 chain with request identity a10a10a1-0000-4000-8000-000000000010.',
            'Ranking v1 remains installed but inactive; behavioral metrics, paid boosts, contacts, messages, views and CTR remain excluded from active ranking authority.',
            'Production remains blocked and no account, service, favorite, real metric, SMS, OAuth, paid integration or production configuration was changed.'
          ];
          domain.blockers = [];
          domain.nextActions = [
            'Keep search-rank-v0 active until a separate explicitly authorized ranking-v1 activation sublot proves production-grade thresholds and rollback.',
            'Keep workers, publications, suggestions and browser-local search history explicitly governed by their own controlled domains and sublots.',
            'Keep production blocked until the global security, analytics and launch gates are satisfied.'
          ];

          fs.writeFileSync(path, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE

      - name: Regenerate canonical matrix artifacts
        run: npm run write:domain-completion-matrix

      - name: Audit regenerated matrix
        run: npm run audit:domain-completion-matrix

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Publish SEARCH-001 closure matrix
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Close SEARCH-001 domain matrix after A10'
          git push origin HEAD:${TARGET_BRANCH}
