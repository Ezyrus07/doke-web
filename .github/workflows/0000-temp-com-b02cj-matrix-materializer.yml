name: TEMP COM-B02CJ Matrix Derivative Materializer

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cj-matrix-materializer.yml'

permissions:
  contents: write

jobs:
  materialize-b02cj-matrix-derivative:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: 003696632ca2633e03b6cfbfa3fd190492b0af08
      PREDECESSOR_HEAD: ab18acc2eff8ccb896dc621b352dad092f326c33
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      PERMANENT_WORKFLOW: .github/workflows/com-b02cj-repository-only-route-resume-surface-controlled-invocation.yml
      PERMANENT_WORKFLOW_BLOB: bfdcefc7d42f7d0980b1a5111ecfb454f0ce73e4
      TEST: scripts/test-com-b02cj-repository-only-route-resume-surface-controlled-invocation.js
      TEST_BLOB: e0e49ea5fd20b253921d67d51cf402b7426eb581
      CONFIG: config/com-b02cj-repository-only-route-resume-surface-controlled-invocation.json
      CONFIG_BLOB: 0c441b3327101d820c9ad3e06894a70007385912
      TEMP_WORKFLOW: .github/workflows/0000-temp-com-b02cj-matrix-materializer.yml
      TARGET_BRANCH: com/com-001-baseline-audit

    steps:
      - name: Checkout exact TEMP recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze recovery lineage and source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          test "$(git rev-list --count "$CANDIDATE_HEAD..HEAD")" = '3'
          expected="$TEMP_WORKFLOW"
          actual="$(git diff --name-only "$CANDIDATE_HEAD" HEAD)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$PERMANENT_WORKFLOW)" = "$PERMANENT_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test -f "$TEMP_WORKFLOW"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Materialize canonical Matrix derivatives and final scope
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          expected_generated="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual_generated="$(git diff --name-only | sort)"
          test "$actual_generated" = "$expected_generated"

          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/com-b02cj-repository-only-route-resume-surface-controlled-invocation.yml')
          text = path.read_text()
          replacements = [
              (
                  "      - 'scripts/test-com-b02cj-repository-only-route-resume-surface-controlled-invocation.js'\n      - '.github/workflows/com-b02cj-repository-only-route-resume-surface-controlled-invocation.yml'",
                  "      - 'scripts/test-com-b02cj-repository-only-route-resume-surface-controlled-invocation.js'\n      - 'docs/DOMAIN-COMPLETION-MATRIX.md'\n      - 'reports/generated/domain-completion-matrix-report.json'\n      - '.github/workflows/com-b02cj-repository-only-route-resume-surface-controlled-invocation.yml'",
              ),
              (
                  "      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623\n      ROUTE_REGISTRY_BLOB:",
                  "      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623\n      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md\n      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json\n      ROUTE_REGISTRY_BLOB:",
              ),
              (
                  "          test \"$(git rev-list --count \"$PREDECESSOR_HEAD..HEAD\")\" = '3'",
                  "          test \"$(git rev-list --count \"$PREDECESSOR_HEAD..HEAD\")\" = '7'",
              ),
              (
                  "          expected=\"$(printf '%s\\n' \"$CONFIG\" \"$TEST\" \"$WORKFLOW\" | sort)\"",
                  "          expected=\"$(printf '%s\\n' \"$CONFIG\" \"$TEST\" \"$MATRIX_MD\" \"$MATRIX_REPORT\" \"$WORKFLOW\" | sort)\"",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one permanent-workflow replacement target: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git rm "$TEMP_WORKFLOW"
          git add "$MATRIX_MD" "$MATRIX_REPORT" "$PERMANENT_WORKFLOW"

          expected_final="$(printf '%s\n' "$CONFIG" "$MATRIX_MD" "$MATRIX_REPORT" "$TEST" "$PERMANENT_WORKFLOW" | sort)"
          actual_final="$(git diff --cached --name-only "$PREDECESSOR_HEAD" | sort)"
          test "$actual_final" = "$expected_final"
          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test -z "$(find .github/workflows -maxdepth 1 -type f -name '0000-temp-com-b02cj-*' -print -quit)"

          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node --check "$TEST"
          git diff --cached --check "$PREDECESSOR_HEAD"

      - name: Prepare immutable TEMP-free commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"

          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          local_tree="$(git write-tree)"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' "$MATRIX_MD" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' "$MATRIX_REPORT" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          permanent_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' "$PERMANENT_WORKFLOW" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg permanent "$permanent_blob" \
            --arg temp "$TEMP_WORKFLOW" \
            --arg permanent_path "$PERMANENT_WORKFLOW" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$permanent_path,mode:"100644",type:"blob",sha:$permanent},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          test "$tree" = "$local_tree"

          commit="$(jq -n \
            --arg message 'docs(com): materialize B02CJ matrix derivatives' \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
          printf 'PERMANENT_WORKFLOW_BLOB_SHA=%s\n' "$permanent_blob"
