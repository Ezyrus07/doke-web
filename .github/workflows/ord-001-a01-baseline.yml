name: Doke ORD-A01 Authority Baseline

on:
  pull_request:
    paths:
      - package.json
      - config/domain-completion-matrix.json
      - docs/DOMAIN-COMPLETION-MATRIX.md
      - reports/generated/domain-completion-matrix-report.json
      - .github/workflows/ord-001-a01-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Register commands and reconcile ORD-A03 matrix evidence
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const packageFile = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packageFile, 'utf8'));
          packageJson.scripts['audit:ord-001-a03-command-boundary'] = 'node scripts/audit-ord-001-a03-command-boundary.js';
          packageJson.scripts['test:order-command-boundary-runtime'] = 'node scripts/test-order-command-boundary-runtime.js';
          fs.writeFileSync(packageFile, JSON.stringify(packageJson, null, 2) + '\n');

          const file = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(file, 'utf8'));
          const domain = matrix.domains.find((item) => item.id === 'ORD-001');
          if (!domain) throw new Error('ORD-001 not found in domain matrix.');

          matrix.version = '1.3.14';
          matrix.updatedAt = '2026-07-29T20:30:00-03:00';

          const appendUnique = (items, values) => Array.from(new Set([...(items || []), ...values]));
          domain.requiredPaths = appendUnique(domain.requiredPaths, [
            'docs/ORD-001-COMMAND-BOUNDARY.md',
            'docs/validation/ORD-001-A03-COMMAND-BOUNDARY.json',
            'scripts/audit-ord-001-a03-command-boundary.js',
            'scripts/test-order-command-boundary-runtime.js',
            'supabase/migrations/20260729201000_ord_a03_order_command_boundary.sql',
            'supabase/migrations/20260729201500_ord_a03_order_event_projection_compatibility_fix.sql'
          ]);
          domain.tests = appendUnique(domain.tests, [
            'audit:ord-001-a03-command-boundary',
            'test:order-command-boundary-runtime'
          ]);
          domain.evidence = [
            'Canonical state machine, transaction events, outbox worker and operational controls are active in staging.',
            'Backend real local and staging E2E reports cover order writes.',
            'ORD-A03 revoked authenticated direct DML on orders and budgets, made submitted creation and quote submission RPC-authoritative, preserved expected-state concurrency and proved zero-residue rollback canaries.',
            'Browser drafts and mock fixtures remain explicit local-only paths; submitted write failures no longer become silent local success.',
            'Relationship-derived capability allows a professional account to act as the client when hiring another professional.'
          ];
          domain.blockers = (domain.blockers || []).filter((item) => item.id !== 'ORD-B01');
          domain.nextActions = [
            'Promote real order reads and commands behind controlled rollout while preserving explicit mock-only development mode.',
            'Retire duplicate frontend order services and remove legacy local read authority from production paths.',
            'Harden worker invocation freshness and replay resistance.',
            'Connect order transitions to messaging, scheduling and payment authorities.'
          ];

          for (const flow of matrix.criticalFlows || []) {
            flow.blockers = (flow.blockers || []).filter((item) => item !== 'ORD-B01');
          }

          fs.writeFileSync(file, JSON.stringify(matrix, null, 2) + '\n');
          NODE
          node scripts/audit-domain-completion-matrix.js --write
      - name: Validate and commit matrix reconciliation
        run: |
          node scripts/audit-domain-completion-matrix.js
          npm run audit:ord-001-a03-command-boundary
          npm run test:order-command-boundary-runtime
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "Reconcile ORD-A03 domain matrix evidence"
          git push origin HEAD:ord/ord-001-baseline-audit
