name: COM-B02N Runtime Binding Integration Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-command-runtime-binding-integration-readiness.js'
      - 'config/com-b02n-runtime-binding-integration-readiness.json'
      - 'scripts/test-com-b02n-runtime-binding-integration-readiness.js'
      - '.github/workflows/com-b02n-runtime-binding-integration-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02n-runtime-binding-integration-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02M predecessor and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=ee81ce055b96b5c492203a25bc41824184a885f3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-binding-adapter-implementation.js)" = "233e241fa9da0494d0d350c9ac686168e508d2e2"
          test "$(git rev-parse HEAD:config/com-b02m-command-runtime-binding-adapter-implementation.json)" = "86c5aefeb3826932bd1ce7cafaddf557a5a57acc"
          test "$(git rev-parse HEAD:scripts/test-com-b02m-command-runtime-binding-adapter-implementation.js)" = "68de4eb458a8d4d59aa20a02731ec9e139222f62"
          test "$(git rev-parse HEAD:.github/workflows/com-b02m-command-runtime-binding-adapter-implementation.yml)" = "1abd4d52a7847516bba242f78319cded97874440"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git rev-parse HEAD:backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-binding-integration-readiness.js)" = "6b424886266249eff93c47d814d3c2abc5564537"
          test "$(git rev-parse HEAD:config/com-b02n-runtime-binding-integration-readiness.json)" = "ae417df251707a34d368cf772b9503d13ebc963c"
          test "$(git rev-parse HEAD:scripts/test-com-b02n-runtime-binding-integration-readiness.js)" = "01ba77dd1ba1f8d2f50cac082c9ed47d33fba956"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02n-runtime-binding-integration-readiness.yml \
            backend/modules/communities/community-command-runtime-binding-integration-readiness.js \
            config/com-b02n-runtime-binding-integration-readiness.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02n-runtime-binding-integration-readiness.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected"

      - name: Syntax and semantic integration-readiness conformance
        run: |
          node --check backend/modules/communities/community-command-runtime-binding-integration-readiness.js
          node --check scripts/test-com-b02n-runtime-binding-integration-readiness.js
          node scripts/test-com-b02n-runtime-binding-integration-readiness.js

      - name: Integration seams remain identified but unbound
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/community-command-runtime-binding-integration-readiness.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'createCommandSourceRepository\(|beginRuntimeBindingAdapter\(|resumeWithCanonicalState\(|resumeWithIdempotencyClaim\(|resumeWithRepositoryWrite\(' "$TARGET"
          grep -F 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          node - <<'NODE'
          const handlers=require('./backend/modules/communities/route-handlers');
          const loader=require('./backend/shared/http/module-route-loader');
          const readiness=require('./backend/modules/communities/community-command-runtime-binding-integration-readiness');
          for(const name of ['executeMembershipCommand','executeGovernanceCommand','executeContentCommand']){
            if(handlers.handlers[name]!==handlers[name])throw new Error(`B02N_EXECUTE_HANDLER_DRIFT:${name}`);
            if(loader.getHandler('communities',name)!==handlers[name])throw new Error(`B02N_LOADER_HANDLER_DRIFT:${name}`);
          }
          for(const name of ['beginRuntimeBindingAdapter','resumeWithCanonicalState','resumeWithIdempotencyClaim','resumeWithRepositoryWrite']){
            if(loader.getHandler('communities',name)!==null)throw new Error(`B02N_ADAPTER_RUNTIME_EXPOSED:${name}`);
          }
          const seams=readiness.inspectRepositoryOnlyIntegrationSeams();
          if(seams.runtimeHandlerIntegrationMaterialized!==false||seams.repositoryV2ExecutorBound!==false||seams.serviceRoleProviderBound!==false||seams.repositoryV2SqlApplied!==false||seams.runtimeActivated!==false)throw new Error('B02N_SEAM_STATE_DRIFT');
          const b=require('./config/com-b02n-runtime-binding-integration-readiness.json');
          if(b.authorization.received!==true||b.authorization.type!=='standing_repository_only'||b.authorization.genericNextAuthorized!==true||b.authorization.sensitiveBoundariesExcluded!==true)throw new Error('B02N_AUTHORIZATION_DRIFT');
          if(b.readiness.runtimeHandlerIntegrated!==false||b.readiness.repositoryV2ExecutorBound!==false||b.readiness.serviceRoleProviderBound!==false||b.readiness.repositoryV2SqlApplied!==false||b.readiness.runtimeActivated!==false)throw new Error('B02N_READINESS_SCOPE_DRIFT');
          if(b.authority.repositoryOnlyIntegrationReadinessAuthority!==true)throw new Error('B02N_REPOSITORY_ONLY_AUTHORITY_REQUIRED');
          for(const k of ['runtimeHandlerMutationAuthority','moduleRouteLoaderMutationAuthority','repositoryExecutorBindingAuthority','runtimeActivationAuthority','stagingDeploymentAuthority','stagingTrafficAuthority','rpcExecutionAuthority','networkAuthority','realtimeActivationAuthority','credentialReadAuthority','identityLifecycleRemoteAuthority','realCommunityMutationAuthority','migrationApplicationAuthority','triggerCreationAuthority','receiptCreationAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','r5iCreationAuthority'])if(b.authority[k]!==false)throw new Error(`B02N_FORBIDDEN_AUTHORITY:${k}`);
          for(const k of ['b02mAdapterChanged','routeHandlersChanged','moduleRouteLoaderChanged','repositoryV2ContractChanged','repositoryV2SqlChanged','runtimeHandlerIntegrated','repositoryV2ExecutorBound','serviceRoleProviderBound','runtimeActivated','rpcExecuted','networkRequestExecuted','credentialReadExecuted','realCommunityMutationExecuted','migrationApplied','triggerCreated','receiptCreated','productionChanged','pullRequestMerged','readyForReviewChanged'])if(b.effects[k]!==false)throw new Error(`B02N_FORBIDDEN_EFFECT:${k}`);
          if(b.functionalCheckpoint.lastFunctionalCheckpoint!=='COM-B03C-R5H'||b.functionalCheckpoint.exactRootCauseProven!==false||b.functionalCheckpoint.causalPromotionAllowed!==false||b.functionalCheckpoint.privatePresencePromotionAllowed!==false||b.functionalCheckpoint.r5iCreated!==false||b.functionalCheckpoint.r5iInferred!==false)throw new Error('B02N_FUNCTIONAL_CHECKPOINT_DRIFT');
          NODE
          ! git diff --name-only ee81ce055b96b5c492203a25bc41824184a885f3 HEAD | grep '^supabase/migrations/'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check ee81ce055b96b5c492203a25bc41824184a885f3 HEAD
