name: Doke temporary — UX-RESP-DEBT-002 Matrix Sync

on:
  push:
    branches:
      - domain/ux-resp-debt-002-matrix-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temp sync branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate canonical Matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          git checkout -- reports/generated/domain-completion-matrix-report.json
          git status --short
          CHANGED="$(git diff --name-only)"
          test "${CHANGED}" = "docs/DOMAIN-COMPLETION-MATRIX.md"
          npm run audit:domain-completion-matrix
      - name: Commit only canonical Matrix Markdown
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m 'docs(domain): sync matrix for UX-RESP-DEBT-002'
          git push origin HEAD:domain/ux-resp-debt-002-matrix-sync
