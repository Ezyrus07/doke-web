name: Doke UX-CSS-DEBT-070 Publication Card Proof R1 V4

on:
  push:
    branches:
      - diag/ux-css-debt-070-publication-card-proof-r1-v4
    paths:
      - .github/workflows/diag-ux-css-debt-070-publication-card-proof-r1-v4.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 6e89d01531842722985c7b2abcd2723a3f383d26
      PARENT_SHA: 23cc5c7496897f0d9b742039598574ffb2b93dfb
      TARGET_FILE: assets/css/components/cards/publication-card.css
      TARGET_BLOB: a4735b4ca0141e4db72abdfe7caac77ba01acebc
      EXPECTED_SHA256: 82d79e7c616ea3c59f7f6c2b2516d1c6a27a86d6ae27e7397f0833a0565b5c97
      EXPECTED_BYTES: 17333
      SOURCE_RUN: 32084542860
      DIAG_BRANCH: diag/ux-css-debt-070-publication-card-proof-r1-v4
      RESULT_FILE: .diagnostics/ux-css-debt-070-r1-v4.txt
    steps:
      - name: Checkout exact UX-CSS-DEBT-069
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Fail-closed CSSOM browser parity
        shell: bash
        run: |
          exec > >(tee /tmp/r1.log) 2>&1
          publish() {
            code=$?; trap - EXIT; set +e
            test -f /tmp/http.pid && kill "$(cat /tmp/http.pid)" 2>/dev/null || true
            result=FAIL; test "$code" = 0 && result=PASS
            {
              echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "TARGET_SHA=$TARGET_SHA"; echo "SOURCE_RUN=$SOURCE_RUN"; echo "EXIT_CODE=$code"
              grep '^INPUT PASS|' /tmp/r1.log || true
              grep '^CSSOM READY|' /tmp/r1.log || true
              grep '^COVERAGE|' /tmp/r1.log || true
              grep '^BROWSER PARITY PASS|' /tmp/r1.log || true
              grep '^CANDIDATE IDENTITY|' /tmp/r1.log || true
              grep '^R1 PROOF PASS|' /tmp/r1.log || true
              echo "RESULT=$result"
              if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 100 /tmp/r1.log || true; fi
            } >/tmp/evidence.txt
            git reset --hard "$TARGET_SHA" >/dev/null 2>&1 || true; git clean -fdx >/dev/null 2>&1 || true
            git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null 2>&1
            git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null 2>&1
            mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"
            git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$RESULT_FILE"; if ! git diff --cached --quiet; then git commit -m 'diag: record UX-CSS-DEBT-070 R1 v4 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; fi
            exit "$code"
          }
          trap publish EXIT
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          echo "INPUT PASS|sha=$TARGET_SHA|blob=$TARGET_BLOB|sourceRun=$SOURCE_RUN|realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0"
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          python3 -m http.server 4180 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          sleep 1

          cat >/tmp/r1.js <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const {chromium}=require(process.cwd()+'/node_modules/@playwright/test');
          const file=process.env.TARGET_FILE,src=fs.readFileSync(file,'utf8'),lines=src.split('\n');
          const rows=new Map([[272,'    min-height: 162px;'],[276,'    padding: 12px 13px 13px;'],[402,'    border-radius: var(--radius-md);']]);
          for(const [i,v] of rows) if((lines[i]||'').replace(/\r$/,'')!==v) throw Error(`row drift ${i+1}`);
          const candidate=lines.filter((_,i)=>!rows.has(i)).join('\n');
          const hash=crypto.createHash('sha256').update(candidate).digest('hex'),bytes=Buffer.byteLength(candidate);
          if(hash!==process.env.EXPECTED_SHA256||bytes!==+process.env.EXPECTED_BYTES) throw Error(`identity ${hash}/${bytes}`);
          const pages=['index.html','detalhe-anuncio.html','perfil.html'], widths=[359,560,760,761,1024,1280];
          const targetPath='/assets/css/components/cards/publication-card.css';
          const cssomReady=()=>{
            const seen=new Set();
            function walk(sheet){if(!sheet||seen.has(sheet))return false;seen.add(sheet);let href='';try{href=sheet.href?new URL(sheet.href,location.href).pathname:''}catch{};let rules;try{rules=sheet.cssRules}catch{return false};if(href.endsWith(targetPath)&&rules&&rules.length>10)return true;for(const r of rules||[]){if(r.styleSheet&&walk(r.styleSheet))return true}return false}
            return [...document.styleSheets].some(walk);
          };
          const props={media:['display','position','width','height','min-height','max-height','margin-top','margin-right','margin-bottom','margin-left','border-top-left-radius','border-top-right-radius','border-bottom-right-radius','border-bottom-left-radius','box-sizing','overflow'],content:['display','width','height','min-height','gap','padding-top','padding-right','padding-bottom','padding-left','box-sizing']};
          async function capture(label){const browser=await chromium.launch({headless:true});const out=[],counts={media:0,content:0,visibleMedia:0,visibleContent:0};try{for(const pageName of pages)for(const width of widths){const ctx=await browser.newContext({viewport:{width,height:900},javaScriptEnabled:false,reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',r=>{const u=new URL(r.request().url());if(!['127.0.0.1','localhost'].includes(u.hostname)||u.pathname.endsWith('.js'))return r.abort();r.continue()});await page.goto(`http://127.0.0.1:4180/${pageName}?proof=${label}-${width}-${Date.now()}`,{waitUntil:'domcontentloaded'});await page.evaluate(()=>{document.documentElement.setAttribute('data-auth-guard','ready');document.documentElement.classList.remove('doke-mobile-shell-pending');for(const p of document.querySelectorAll('[data-doke-document-preloader],.doke-document-preloader,.orders-document-preloader'))p.hidden=true;for(const card of document.querySelectorAll('.publication-card'))for(let n=card;n&&n!==document.documentElement;n=n.parentElement)if(n.hasAttribute('hidden'))n.removeAttribute('hidden')});await page.waitForFunction(cssomReady,null,{timeout:10000});await page.waitForTimeout(120);const ready=await page.evaluate(cssomReady);if(!ready)throw Error(`cssom lost ${pageName}/${width}`);console.log(`CSSOM READY|${label}|page=${pageName}|width=${width}|target=1`);const snap=await page.evaluate((props)=>{function take(sel,keys){return [...document.querySelectorAll(sel)].map((el,i)=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return{i,cls:el.className,style:Object.fromEntries(keys.map(k=>[k,s.getPropertyValue(k)])),rect:[r.x,r.y,r.width,r.height].map(x=>Math.round(x*1000)/1000),visible:r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}})}return{media:take('.publication-card__media',props.media),content:take('.publication-card__content',props.content),overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}},props);counts.media+=snap.media.length;counts.content+=snap.content.length;counts.visibleMedia+=snap.media.filter(x=>x.visible).length;counts.visibleContent+=snap.content.filter(x=>x.visible).length;out.push({page:pageName,width,snap});await ctx.close()}}finally{await browser.close()}if(!counts.media||!counts.content||!counts.visibleMedia||!counts.visibleContent)throw Error(`coverage ${JSON.stringify(counts)}`);console.log(`COVERAGE|${label}|pages=3|viewports=6|families=2/2|media=${counts.media}/${counts.visibleMedia}|content=${counts.content}/${counts.visibleContent}|boundary=760/761|realProductDOM=1|syntheticDOM=0`);return out}
          (async()=>{try{fs.writeFileSync(file,src);const a=await capture('parent');fs.writeFileSync(file,candidate);const b=await capture('candidate');const A=JSON.stringify(a),B=JSON.stringify(b);if(A!==B){let i=0;while(i<A.length&&i<B.length&&A[i]===B[i])i++;throw Error(`runtime drift idx=${i} parent=${A.slice(i,i+1800)} candidate=${B.slice(i,i+1800)}`)}console.log(`BROWSER PARITY PASS|pages=3|viewports=6|snapshots=18|families=2/2|computedStyleDiffs=0|geometryDiffs=0|runtimeDiffs=0|boundary=760/761|realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0`);console.log(`CANDIDATE IDENTITY|sha256=${hash}|bytes=${bytes}|declarations=369|superseded=0|files=1|additions=0|deletions=3`);fs.writeFileSync(file,candidate)}catch(e){fs.writeFileSync(file,src);throw e}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node --check /tmp/r1.js
          node /tmp/r1.js
          grep -q 'COVERAGE|parent|pages=3|viewports=6|families=2/2' /tmp/r1.log
          grep -q 'COVERAGE|candidate|pages=3|viewports=6|families=2/2' /tmp/r1.log
          grep -q 'BROWSER PARITY PASS|pages=3|viewports=6|snapshots=18|families=2/2|computedStyleDiffs=0|geometryDiffs=0|runtimeDiffs=0' /tmp/r1.log
          grep -q "CANDIDATE IDENTITY|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|declarations=369|superseded=0|files=1|additions=0|deletions=3" /tmp/r1.log
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          git diff --check
          echo 'R1 PROOF PASS|browserRequired=1|realProductDOM=1|syntheticDOM=0|criteriaRelaxed=0'
