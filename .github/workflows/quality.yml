name: Doke Quality Gates

on:
  pull_request:
    branches: [ MAIN, main, master ]
  push:
    branches: [ MAIN, main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audits:
    name: Static architecture audits
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all static audits
        run: npm run audit:all

      - name: Run quality pipeline audit
        run: npm run audit:quality-pipeline

  playwright-regression:
    name: Playwright smoke + visual guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static-audits

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e -- --project=chromium

      - name: Run visual regression guards
        run: npm run test:visual -- --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
