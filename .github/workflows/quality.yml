name: CAT-A02 Documentary Finalization

on:
  pull_request:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a02-documentary-finalization
  cancel-in-progress: true

jobs:
  finalize-cat-a02:
    name: Finalize CAT-A02 evidence and journal
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout CAT head branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Generate evidence and remove finalizer
        run: |
          node scripts/finalize-cat-a02-evidence.js
          git rm scripts/finalize-cat-a02-evidence.js

      - name: Restore canonical Quality in worktree
        run: git show 22c684a8bc5183476c69361e571447da78fbfa6f:.github/workflows/quality.yml > .github/workflows/quality.yml

      - name: Validate cumulative CAT-A01
        run: node scripts/audit-service-catalog-authority-baseline.js

      - name: Validate CAT-A02 completion
        run: node scripts/audit-service-catalog-authority-retirement.js

      - name: Validate deterministic matrix
        run: node scripts/audit-domain-completion-matrix.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Publish documentary closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/CAT-001-A02-SERVICE-AUTHORITY-RETIREMENT.json
          git add docs/validation/CAT-001-A02-SERVICE-AUTHORITY-RETIREMENT.md
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git commit -m "Finalize CAT-A02 evidence and journal"
          git push origin "HEAD:cat/cat-001-baseline-audit"
