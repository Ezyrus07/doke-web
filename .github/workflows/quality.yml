name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  push:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audits:
    name: Static architecture and partition audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend contracts
        run: npm run audit:frontend:strict

      - name: Audit canonical UI
        run: npm run audit:ui

      - name: Audit domain cards
        run: npm run audit:domain

      - name: Audit layout contracts
        run: npm run audit:layout

      - name: Audit product flows
        run: npm run audit:flows

      - name: Audit legacy bridge scope
        run: npm run audit:bridge

      - name: Audit page route map
        run: npm run audit:routes

      - name: Audit mock data contracts
        run: npm run audit:mocks

      - name: Audit project architecture
        run: npm run audit:architecture

      - name: Audit backend data contracts
        run: npm run audit:backend-data

      - name: Audit Edge Function source closure
        run: npm run audit:edge-function-source-closure

      - name: Audit auth session structure
        run: node scripts/audit-auth-session-contracts.js

      - name: Capture auth session audit failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/generated
          node scripts/audit-auth-session-contracts.js > reports/generated/auth-session-audit-failure.log 2>&1 || true

      - name: Upload auth session audit failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-auth-session-audit-failure-${{ github.sha }}
          path: reports/generated/auth-session-audit-failure.log
          if-no-files-found: error
          retention-days: 7

      - name: Test canonical auth session runtime
        run: node scripts/test-auth-canonical-session-runtime.js

      - name: Audit desktop shell contracts
        run: npm run audit:desktop-shell

      - name: Audit JavaScript foundation
        run: npm run audit:js-foundation

      - name: Audit visual baseline
        run: npm run audit:visual-baseline

      - name: Audit controller mock wiring
        run: npm run audit:controller-mocks

      - name: Audit domain services
        run: npm run audit:domain-services

      - name: Audit runtime flags
        run: npm run audit:runtime-flags

      - name: Audit responsive inventory
        run: npm run audit:responsive-inventory

      - name: Audit responsive boundaries
        run: npm run audit:responsive-boundaries

      - name: Audit desktop base stability
        run: npm run audit:desktop-base

      - name: Audit mobile base stability
        run: npm run audit:mobile-base

      - name: Validate platform ACL contract
        run: npm run test:platform-default-acl-contract

      - name: Run quality pipeline audit
        run: npm run audit:quality-pipeline

      - name: Validate domain completion matrix
        run: npm run audit:domain-completion-matrix

      - name: Generate stale domain matrix evidence
        if: failure()
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Upload stale domain matrix evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-domain-matrix-drift-${{ github.sha }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Run agent governance audits
        run: npm run audit:agent-governance

      - name: Audit unused asset candidates
        run: npm run audit:unused-asset-candidates

      - name: Audit duplicate assets
        run: npm run audit:duplicate-assets

      - name: Audit E2E lane partition
        run: npm run audit:e2e-lanes

      - name: Verify clean patch formatting
        run: git diff --check

  auth-fallback-source-cleanup:
    name: Remove dormant browser identity fallbacks
    needs: static-audits
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'auth/auth-001-baseline-audit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply exact AUTH-A06 cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('assets/js/services/auth-service.js')
          auth = auth_path.read_text(encoding='utf-8')
          auth = auth.replace(
              '   Responsibility: rules for local/mock login, registration, logout and recovery.\n',
              '   Responsibility: provider orchestration for login, registration, session and public identity.\n',
              1,
          )
          auth = auth.replace("  const RECOVERY_KEY = 'doke.auth.recovery.v1';\n", '', 1)
          auth = auth.replace("    recovery: '/auth/recovery',\n", '', 1)
          auth = auth.replace("    resetPassword: '/auth/reset-password',\n", '', 1)

          def remove_between(source, start_marker, end_marker):
              if start_marker not in source:
                  return source
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + source[end:]

          auth = remove_between(auth, '  const readJson = (key, fallback) => {', '  const toPublicUser = (user) => {')
          auth = remove_between(auth, '  const checkUsernameAvailability = async (value) => {', '  const logout = async')
          auth = remove_between(auth, '  const maskEmail = (value) => {', '  const getCurrentPathForNext = () => {')
          auth = auth.replace('    checkUsernameAvailability,\n', '', 1)
          auth = auth.replace('    requestRecovery,\n    resetPassword,\n', '', 1)

          forbidden = [
              'RECOVERY_KEY',
              'generateRecoveryCode',
              'debugCode',
              'updatePassword(recovery.userId',
              'const checkUsernameAvailability = async',
          ]
          remaining = [token for token in forbidden if token in auth]
          if remaining:
              raise SystemExit(f'Browser fallback tokens remain in auth-service: {remaining}')
          auth_path.write_text(auth, encoding='utf-8')

          authority_path = Path('assets/js/services/auth-session-authority.js')
          authority = authority_path.read_text(encoding='utf-8')
          guard_code = """  const identityMutationError = () => {
            const error = new Error('Alterações de identidade exigem uma autoridade remota dedicada.');
            error.code = 'DOKE_AUTH_IDENTITY_MUTATION_REQUIRES_REMOTE_AUTHORITY';
            return error;
          };

          const updateCurrentUser = async (patch = {}) => {
            const source = patch && typeof patch === 'object' ? patch : {};
            const keys = Object.keys(source);
            if (keys.length === 1 && keys[0] === 'settings' && typeof baseService?.updateCurrentUser === 'function') {
              return baseService.updateCurrentUser(source);
            }
            throw identityMutationError();
          };

          const updateCurrentProfile = async () => {
            throw identityMutationError();
          };

          """
          marker = '  const resolveLoginRedirect = () => {'
          if 'DOKE_AUTH_IDENTITY_MUTATION_REQUIRES_REMOTE_AUTHORITY' not in authority:
              if authority.count(marker) != 1:
                  raise SystemExit('Session authority identity guard marker is not unique.')
              authority = authority.replace(marker, guard_code + marker, 1)
              authority = authority.replace(
                  '    requestRecovery,\n    resetPassword,\n    getPublicState,',
                  '    requestRecovery,\n    resetPassword,\n    updateCurrentUser,\n    updateCurrentProfile,\n    getPublicState,',
                  1,
              )
              authority = authority.replace(
                  '      requestRecovery,\n      resetPassword,\n      sessionAuthority: api',
                  '      requestRecovery,\n      resetPassword,\n      updateCurrentUser,\n      updateCurrentProfile,\n      sessionAuthority: api',
                  1,
              )
              authority = authority.replace(
                  '    ns.requestRecovery = requestRecovery;\n    ns.resetPassword = resetPassword;\n',
                  '    ns.requestRecovery = requestRecovery;\n    ns.resetPassword = resetPassword;\n    ns.updateCurrentUser = updateCurrentUser;\n    ns.updateCurrentProfile = updateCurrentProfile;\n',
                  1,
              )
          authority_path.write_text(authority, encoding='utf-8')

          test_path = Path('tests/auth/test-auth-session-lifecycle-runtime.js')
          test = test_path.read_text(encoding='utf-8')
          static_marker = "  assert(!recoveryPageSource.includes('assets/js/pages/auth.js'));\n"
          static_code = """  for (const forbidden of [
            'RECOVERY_KEY',
            'generateRecoveryCode',
            'debugCode',
            'updatePassword(recovery.userId',
            'const checkUsernameAvailability = async'
          ]) {
            assert(!authServiceSource.includes(forbidden), `Canonical auth service still contains ${forbidden}.`);
          }
          for (const token of [
            'DOKE_AUTH_IDENTITY_MUTATION_REQUIRES_REMOTE_AUTHORITY',
            "keys.length === 1 && keys[0] === 'settings'",
            'updateCurrentUser',
            'updateCurrentProfile'
          ]) {
            assert(sessionAuthoritySource.includes(token), `Session authority is missing identity guard token: ${token}`);
          }

          """
          if 'Canonical auth service still contains' not in test:
              if test.count(static_marker) != 1:
                  raise SystemExit('A06 fallback test marker is not unique.')
              test = test.replace(static_marker, static_code + static_marker, 1)
              runtime_marker = "  assert.strictEqual(storage.getItem('doke.auth.recovery.v1'), null, 'Legacy recovery state was recreated.');\n"
              runtime_code = """

          await expectCode(
            () => runtime.window.DokeAuth.service.updateCurrentUser({ email: 'forbidden@staging.example' }),
            'DOKE_AUTH_IDENTITY_MUTATION_REQUIRES_REMOTE_AUTHORITY'
          );
          await expectCode(
            () => runtime.window.DokeAuth.service.updateCurrentProfile({ handle: 'forbidden-change' }),
            'DOKE_AUTH_IDENTITY_MUTATION_REQUIRES_REMOTE_AUTHORITY'
          );"""
              if test.count(runtime_marker) != 1:
                  raise SystemExit('A06 runtime identity guard marker is not unique.')
              test = test.replace(runtime_marker, runtime_marker + runtime_code, 1)
          test_path.write_text(test, encoding='utf-8')

          audit_path = Path('scripts/audit-auth-session-contracts.js')
          audit = audit_path.read_text(encoding='utf-8')
          audit_marker = "const sessionSource = read(SESSION_STORE);\n"
          audit_code = """for (const forbidden of [
            'RECOVERY_KEY',
            'generateRecoveryCode',
            'debugCode',
            'updatePassword(recovery.userId',
            'const checkUsernameAvailability = async'
          ]) {
            if (canonicalSource.includes(forbidden)) errors.push(`${CANONICAL_AUTH_SERVICE} still contains browser identity fallback token: ${forbidden}`);
          }

          """
          if 'still contains browser identity fallback token' not in audit:
              if audit.count(audit_marker) != 1:
                  raise SystemExit('Auth audit fallback marker is not unique.')
              audit = audit.replace(audit_marker, audit_code + audit_marker, 1)
              audit = audit.replace(
                  "  'ns.service = facade;'\n]) {",
                  "  'ns.service = facade;',\n  'DOKE_AUTH_IDENTITY_MUTATION_REQUIRES_REMOTE_AUTHORITY',\n  'updateCurrentUser',\n  'updateCurrentProfile'\n]) {",
                  1,
              )
          audit_path.write_text(audit, encoding='utf-8')
          PY

          git diff --check
          node --check assets/js/services/auth-service.js
          node --check assets/js/services/auth-session-authority.js
          node --check tests/auth/test-auth-session-lifecycle-runtime.js
          node --check scripts/audit-auth-session-contracts.js
          node scripts/audit-auth-session-contracts.js
          node scripts/test-auth-canonical-session-runtime.js

          expected=$'assets/js/services/auth-service.js\nassets/js/services/auth-session-authority.js\nscripts/audit-auth-session-contracts.js\ntests/auth/test-auth-session-lifecycle-runtime.js'
          actual="$(git diff --name-only | sort)"
          if [ -z "$actual" ]; then
            echo 'AUTH-A06 source cleanup already applied.'
            exit 0
          fi
          test "$actual" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/services/auth-service.js assets/js/services/auth-session-authority.js scripts/audit-auth-session-contracts.js tests/auth/test-auth-session-lifecycle-runtime.js
          git commit -m 'Remove dormant browser identity fallbacks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  blocking-e2e:
    name: Blocking deterministic E2E lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run blocking E2E lane
        run: npm run test:e2e:blocking

      - name: Upload blocking E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-blocking-e2e-${{ github.sha }}
          path: |
            reports/generated/e2e-blocking-lane-summary.json
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  visual-structural:
    name: 105 visual structural guards
    runs-on: windows-latest
    timeout-minutes: 40
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run 105 visual structural guards
        run: npm run test:visual:structural

      - name: Upload visual structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-visual-structural-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
