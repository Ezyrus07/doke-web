name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  push:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audits:
    name: Static architecture and partition audits
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all static audits
        run: npm run audit:all

      - name: Validate platform ACL contract
        run: npm run test:platform-default-acl-contract

      - name: Run quality pipeline audit
        run: npm run audit:quality-pipeline

      - name: Audit domain completion matrix
        run: npm run audit:domain-completion-matrix

      - name: Audit active legacy structures
        run: npm run audit:active-legacy-structures

      - name: Audit page asset authority matrix
        run: npm run audit:page-asset-authority-matrix

      - name: Audit home rail authority
        run: npm run audit:home-rail-card-authority

      - name: Audit documentation hygiene
        run: npm run audit:docs-report-hygiene

      - name: Audit duplicate assets
        run: npm run audit:duplicate-assets

      - name: Audit form page top contract
        run: npm run audit:form-page-top-contract

      - name: Audit form button contract
        run: npm run audit:form-button-contract

      - name: Audit navigation registry contract
        run: npm run audit:navigation-registry-contract

      - name: Audit mobile drawer visual authority
        run: npm run audit:mobile-drawer-visual-authority

      - name: Audit mobile shell location contract
        run: npm run audit:mobile-shell-location-contract

      - name: Audit operational event toast contract
        run: npm run audit:operational-event-toast-contract

      - name: Audit shared app header contract
        run: npm run audit:shared-app-header-contract

      - name: Audit remaining content and modal contracts
        run: |
          npm run audit:page-label-references
          npm run audit:content-action-contract
          npm run audit:content-surface-contract
          npm run audit:content-tab-contract
          npm run audit:content-search-contract
          npm run audit:content-disclosure-contract
          npm run audit:content-icon-contract
          npm run audit:content-meta-contract
          npm run audit:content-side-list-contract
          npm run audit:close-button-contract
          npm run audit:overlay-modal-contract
          npm run audit:modal-visual-contract
          npm run audit:form-control-contract
          npm run audit:button-system-contract
          npm run audit:modal-lab-footer-contract

      - name: Audit unused asset candidates
        run: npm run audit:unused-asset-candidates

      - name: Audit E2E lane partition
        run: npm run audit:e2e-lanes

      - name: Verify clean patch formatting
        run: git diff --check

  blocking-e2e:
    name: Blocking deterministic E2E lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run blocking E2E lane
        run: npm run test:e2e:blocking

      - name: Upload blocking E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-blocking-e2e-${{ github.sha }}
          path: |
            reports/generated/e2e-blocking-lane-summary.json
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  visual-structural:
    name: 105 visual structural guards
    runs-on: windows-latest
    timeout-minutes: 40
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run 105 visual structural guards
        run: npm run test:visual:structural

      - name: Upload visual structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-visual-structural-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
