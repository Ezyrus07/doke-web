name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cat-a02-clean-matrix-regeneration:
    name: Regenerate CAT-A02 matrix on clean tree
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout CAT head branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Regenerate clean deterministic matrix
        run: |
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

      - name: Publish clean generated Markdown
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "Regenerate CAT-A02 matrix on clean tree"
          git push origin "HEAD:cat/cat-001-baseline-audit"
