name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a03-matrix-reconciliation
  cancel-in-progress: true

jobs:
  reconcile-cat-a03-matrix:
    name: Reconcile CAT-A03 deterministic matrix
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Restore canonical Quality in worktree
        run: git show HEAD^:.github/workflows/quality.yml > .github/workflows/quality.yml

      - name: Reconcile CAT-A03 matrix contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(file, 'utf8'));
          matrix.version = '1.3.7';
          matrix.updatedAt = '2026-07-27T16:50:00-03:00';

          const cat = matrix.domains.find((domain) => domain.id === 'CAT-001');
          if (!cat) throw new Error('CAT-001 matrix domain missing');

          const requiredPaths = [
            'assets/js/services/services-service.js',
            'supabase/functions/self-service-operations/operations.mjs',
            'supabase/migrations/149_service_lifecycle_authority.sql',
            'supabase/tests/018_service_lifecycle_authority_validation.sql',
            'scripts/audit-service-lifecycle-authority.js',
            'scripts/test-service-lifecycle-authority-runtime.js',
            'docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json',
            'docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.md'
          ];
          requiredPaths.forEach((path) => {
            if (!cat.requiredPaths.includes(path)) cat.requiredPaths.push(path);
          });

          if (!cat.edgeFunctions.includes('self-service-operations')) {
            cat.edgeFunctions.push('self-service-operations');
          }

          const evidence = 'CAT-A03 code candidate routes owner content edits through versioned review and pause, reactivate and archive through an explicit owner-only server operation; staging application remains pending.';
          if (!cat.evidence.includes(evidence)) cat.evidence.push(evidence);

          const blocker = cat.blockers.find((item) => item.id === 'CAT-B03');
          if (!blocker) throw new Error('CAT-B03 blocker must remain until staging validation');
          blocker.description = 'CAT-A03 code and permanent gates exist, but migration 149 and the self-service lifecycle allowlist still require controlled staging application and SQL validation.';

          cat.nextActions = [
            'Apply migration 149 and the self-service lifecycle allowlist to staging, then validate SQL contract 018 with rollback.',
            'Close service-media replacement and abandoned-draft cleanup lifecycle.',
            'Guarantee immutable service snapshot on every order creation path.'
          ];

          fs.writeFileSync(file, JSON.stringify(matrix, null, 2) + '\n');
          NODE

      - name: Regenerate deterministic matrix
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Validate deterministic matrix
        run: node scripts/audit-domain-completion-matrix.js

      - name: Validate CAT cumulative authority
        run: |
          node scripts/audit-service-catalog-authority-baseline.js
          node scripts/audit-service-catalog-authority-retirement.js
          node scripts/audit-service-lifecycle-authority.js
          node scripts/test-service-lifecycle-authority-runtime.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Publish matrix reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/domain-completion-matrix.json
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "Reconcile CAT-A03 domain matrix"
          git push origin HEAD:cat/cat-001-baseline-audit
