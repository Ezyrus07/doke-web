name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-auth-a05-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-auth-a05-matrix:
    name: Regenerate AUTH-A05 governed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical matrix
        run: npm run write:domain-completion-matrix

      - name: Validate generated matrix
        run: npm run audit:domain-completion-matrix

      - name: Restore canonical Quality Gates workflow
        run: |
          git fetch origin MAIN
          git checkout origin/MAIN -- .github/workflows/quality.yml

      - name: Publish matrix and restored workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md .github/workflows/quality.yml
          if git diff --cached --quiet; then
            echo "Generated matrix already matches the repository."
            exit 0
          fi
          git commit -m "Regenerate domain matrix for AUTH-A05"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
