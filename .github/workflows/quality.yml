name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a03-documentary-publisher-v1
  cancel-in-progress: true

jobs:
  static-audits:
    name: Publish CAT-A03 documentary files
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate documentary closure
        shell: bash
        run: |
          set -euo pipefail
          git show 9a71d700f8f6b5237c97fadc87a292ed5c475ea8:scripts/audit-domain-completion-matrix.js > scripts/audit-domain-completion-matrix.js
          node scripts/finalize-cat-a03-documentary-temp.js
          node scripts/audit-domain-completion-matrix.js --write
          git diff --check

      - name: Publish documentary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- scripts/finalize-cat-a03-documentary-temp.js scripts/audit-domain-completion-matrix.js config/domain-completion-matrix.json docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.md docs/DOKE-ENGINEERING-JOURNAL.md docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m 'Finalize CAT-A03 evidence and matrix'
          git push origin HEAD:cat/cat-001-baseline-audit
