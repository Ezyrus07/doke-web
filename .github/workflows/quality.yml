name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  push:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journal-closure:
    name: Record AUTH-A12B.2 engineering journal closure
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'auth/auth-001-baseline-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout AUTH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Append journal entry
        shell: bash
        run: |
          set -euo pipefail
          marker='AUTH-A12B.2 generic local profile mutation authority retired'
          if grep -Fq "$marker" docs/DOKE-ENGINEERING-JOURNAL.md; then
            echo 'Journal entry already present.'
            exit 0
          fi

          cat >> docs/DOKE-ENGINEERING-JOURNAL.md <<'EOF'

---

## 2026-07-26 — AUTH-A12B.2 generic local profile mutation authority retired

**Scope:** PR #9, branch `auth/auth-001-baseline-audit`

**Outcome:** `DONE` for AUTH-A12B.2; `PLANNED` for AUTH-A12B.3 and AUTH-A12C

### Context

The browser users repository still exposed generic account, profile and settings mutation methods. `profile-service.js` also retained local profile/settings fallbacks and manually rewrote the Doke public session. Professional local flows consumed the same generic user mutation method, but their role-promotion semantics belong to AUTH-A12C.

### Decision

Remove generic browser-local mutation authority immediately. Keep professional compatibility only behind one explicit, narrow fixture boundary that cannot accept UUID/Supabase subjects and must be removed in AUTH-A12C. Remote authority failure must fail closed instead of materializing local identity state.

### Implementation

- Removed `updateCurrentUser`, `updateCurrentProfile` and `updateCurrentSettings` from `users-repository.js`.
- Removed local profile/settings mutation fallbacks and manual `Doke.session` rewrites from `profile-service.js`.
- Required `self-service-operations` for profile and settings mutations.
- Added `updateProfessionalFixtureUser` as an isolated temporary fixture boundary.
- Restricted the fixture patch to professional role/profile routing fields.
- Blocked empty IDs, UUID/Supabase subjects, unsupported fields and missing fixtures.
- Added `tests/auth/test-auth-local-profile-mutation-retirement-runtime.js`.
- Added the runtime permanently to the canonical Doke Quality Gates.
- Updated the AUTH integration contract and AUTH-A12 Markdown/JSON evidence.
- Synchronized the deterministic domain matrix.
- Removed all temporary codemod, workflow and diagnostic surfaces after use.

### Validation

Validated head: `3866fbea076deba2328f9077a2d582b3a2c5033b`.

- Doke Quality Gates #620: success.
- AUTH-A12B.2 local profile mutation retirement runtime: success.
- Blocking deterministic E2E: success.
- 105 visual structural guards: success.
- Doke Staging Edge HTTP Canary #394: success.
- Doke Diagnostic E2E #415: success.
- Deterministic matrix, governance, asset audits, E2E partition and `git diff --check`: success.

### Supabase and production boundary

- No migration was applied.
- No Edge Function was deployed.
- No staging configuration or data was changed.
- No real or persistent synthetic account was modified.
- Production was not changed.
- PR #9 remains draft and unmerged.

### Remaining risk

`updateProfessionalFixtureUser` is not a production identity authority. It remains a temporary compatibility boundary for local professional fixtures and must be removed or moved outside active runtime loading in AUTH-A12C.

### Next step

Execute AUTH-A12B.3: audit and retire residual local onboarding mutation and manual session rewrites while preserving server-side reconciliation as the only active authority.
EOF

      - name: Publish journal entry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DOKE-ENGINEERING-JOURNAL.md; then
            echo 'No journal change to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git commit -m 'Record AUTH-A12B.2 engineering journal closure'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  static-audits:
    name: Static architecture and partition audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend contracts
        run: npm run audit:frontend:strict

      - name: Audit canonical UI
        run: npm run audit:ui

      - name: Audit domain cards
        run: npm run audit:domain

      - name: Audit layout contracts
        run: npm run audit:layout

      - name: Audit product flows
        run: npm run audit:flows

      - name: Audit legacy bridge scope
        run: npm run audit:bridge

      - name: Audit page route map
        run: npm run audit:routes

      - name: Audit mock data contracts
        run: npm run audit:mocks

      - name: Audit project architecture
        run: npm run audit:architecture

      - name: Audit backend data contracts
        run: npm run audit:backend-data

      - name: Audit Edge Function source closure
        run: npm run audit:edge-function-source-closure

      - name: Audit auth session structure
        run: node scripts/audit-auth-session-contracts.js

      - name: Capture auth session audit failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/generated
          node scripts/audit-auth-session-contracts.js > reports/generated/auth-session-audit-failure.log 2>&1 || true

      - name: Upload auth session audit failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-auth-session-audit-failure-${{ github.sha }}
          path: reports/generated/auth-session-audit-failure.log
          if-no-files-found: error
          retention-days: 7

      - name: Test canonical auth session runtime
        run: node scripts/test-auth-canonical-session-runtime.js

      - name: Audit identity profile authority
        run: npm run audit:identity-profile-contract

      - name: Test local profile mutation retirement
        run: npm run test:auth-local-profile-mutation-retirement

      - name: Test provider-reconciled profile contract
        run: node scripts/test-profile-write-contract.js

      - name: Test registration and onboarding authority contract
        run: node scripts/test-auth-username-onboarding-contract.js

      - name: Audit desktop shell contracts
        run: npm run audit:desktop-shell

      - name: Audit JavaScript foundation
        run: npm run audit:js-foundation

      - name: Audit visual baseline
        run: npm run audit:visual-baseline

      - name: Audit controller mock wiring
        run: npm run audit:controller-mocks

      - name: Audit domain services
        run: npm run audit:domain-services

      - name: Audit runtime flags
        run: npm run audit:runtime-flags

      - name: Audit responsive inventory
        run: npm run audit:responsive-inventory

      - name: Audit responsive boundaries
        run: npm run audit:responsive-boundaries

      - name: Audit desktop base stability
        run: npm run audit:desktop-base

      - name: Audit mobile base stability
        run: npm run audit:mobile-base

      - name: Validate platform ACL contract
        run: npm run test:platform-default-acl-contract

      - name: Run quality pipeline audit
        run: npm run audit:quality-pipeline

      - name: Validate domain completion matrix
        run: npm run audit:domain-completion-matrix

      - name: Generate stale domain matrix evidence
        if: failure()
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Upload stale domain matrix evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-domain-matrix-drift-${{ github.sha }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Run agent governance audits
        run: npm run audit:agent-governance

      - name: Audit unused asset candidates
        run: npm run audit:unused-asset-candidates

      - name: Audit duplicate assets
        run: npm run audit:duplicate-assets

      - name: Audit E2E lane partition
        run: npm run audit:e2e-lanes

      - name: Verify clean patch formatting
        run: git diff --check

  blocking-e2e:
    name: Blocking deterministic E2E lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run blocking E2E lane
        run: npm run test:e2e:blocking

      - name: Upload blocking E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-blocking-e2e-${{ github.sha }}
          path: |
            reports/generated/e2e-blocking-lane-summary.json
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  visual-structural:
    name: 105 visual structural guards
    runs-on: windows-latest
    timeout-minutes: 40
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run 105 visual structural guards
        run: npm run test:visual:structural

      - name: Upload visual structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-visual-structural-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
