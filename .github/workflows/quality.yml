name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  push:
    branches:
      - 'cat/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-a03-documentary-finalization
  cancel-in-progress: true

jobs:
  static-audits:
    name: Finalize CAT-A03 evidence and journal
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout CAT branch
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize CAT-A03 evidence and journal
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const jsonPath = 'docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json';
          const evidence = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          evidence.status = 'done';
          evidence.validatedCandidateHead = '9a71d700f8f6b5237c97fadc87a292ed5c475ea8';
          evidence.validation = {
            staticAudit: 'success',
            runtimeAuthority: 'success',
            sqlValidation: 'success',
            deterministicMatrix: 'success',
            quality: 'success',
            qualityRunNumber: 992,
            blockingE2E: 'success',
            visualStructuralGuards: 'success',
            stagingCanary: 'success',
            stagingCanaryRunNumber: 714,
            diagnostic: 'success',
            diagnosticRunNumber: 736,
            finalEvidence: 'success'
          };
          evidence.safety.temporaryWorkflowRemaining = false;
          evidence.safety.temporaryCodemodRemaining = false;
          evidence.nextControlledWork = 'CAT-A04: close service-media replacement, superseded-object cleanup and abandoned-draft cleanup lifecycle.';
          fs.writeFileSync(jsonPath, JSON.stringify(evidence, null, 2) + '\n');

          const mdPath = 'docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.md';
          fs.writeFileSync(mdPath, `# CAT-001 / CAT-A03 — Autoridade server-side de edição e ciclo de vida

## Status

\`DONE\`

## Problema

Após o CAT-A02 retirar a persistência local, edição e ciclo de vida ainda terminavam em uma mutação genérica de \`public.services\`. Isso permitia que o navegador coordenasse consistência, atualizasse conteúdo aprovado sem uma nova \`service_version\` e controlasse pausa, reativação e arquivamento por um caminho amplo de tabela.

## Decisão

- edição de conteúdo real usa exclusivamente \`submit_service_for_review\`;
- pausa, reativação e arquivamento usam \`transition_owned_service_lifecycle\`;
- a Edge Function deriva o ator do JWT e o dispatcher recompõe o contexto autenticado;
- \`anon\` e \`authenticated\` não executam diretamente a função privilegiada;
- \`anon\` e \`authenticated\` não possuem \`INSERT\`, \`UPDATE\` ou \`DELETE\` em \`public.services\`;
- fixtures não UUID permanecem somente em memória;
- arquivamento encerra versão pendente sem apagar versões aprovadas ou snapshots históricos.

## Implementação

- criada migration \`149_service_lifecycle_authority.sql\`;
- criada função \`public.transition_owned_service_lifecycle\`;
- dispatcher anterior preservado como \`execute_self_service_operation_internal_pre_cat_a03\`;
- action adicionada ao allowlist de \`self-service-operations\`;
- edição de conteúdo passou pela moderação versionada;
- transições de status passaram por uma operação server-side única;
- gravação remota genérica foi bloqueada com \`DOKE_SERVICE_DIRECT_MUTATION_FORBIDDEN\`;
- criado runtime permanente CAT-A03;
- criado teste SQL transacional 018;
- audits cumulativos CAT-A01/CAT-A02 foram reconciliados;
- matriz determinística 1.3.7 reconciliada, preservando \`CAT-B03\` e \`CAT-B04\`.

## Staging

Projeto \`doke-web-staging\` (\`zwkczgewzbsorbrjuzpb\`):

- migration registrada como \`20260727195302_service_lifecycle_authority\`;
- teste SQL 018 executado dentro de transação e encerrado com \`ROLLBACK\`;
- função de ciclo de vida presente;
- \`service_role\` com execução permitida;
- \`anon\` e \`authenticated\` sem execução direta;
- \`anon\` e \`authenticated\` sem escrita direta em \`services\`;
- dispatcher CAT-A03 ativo e delegação das operações anteriores preservada;
- Edge Function \`self-service-operations\` implantada como versão 7;
- função \`ACTIVE\` e \`verify_jwt: true\`;
- nenhuma conta ou serviço sintético persistente criado.

## Validação

**Head validado:** \`9a71d700f8f6b5237c97fadc87a292ed5c475ea8\`

- Doke Quality Gates #992: sucesso;
- audit cumulativo CAT-A01: sucesso;
- audit e runtime CAT-A02: sucesso;
- audit e runtime CAT-A03: sucesso;
- matriz determinística 1.3.7: sucesso;
- E2E bloqueante: sucesso;
- 105 guards visuais: sucesso;
- Doke Staging Edge HTTP Canary #714: sucesso;
- Doke Diagnostic E2E #736: sucesso.

## Segurança operacional

- staging alterado de forma controlada;
- produção não alterada;
- nenhuma conta real modificada;
- nenhuma conta sintética persistente criada;
- nenhum SMS, OAuth ou recurso pago habilitado;
- nenhuma autoridade local aposentada foi reaberta;
- nenhuma ferramenta temporária permanece após o fechamento;
- PR permanece draft, aberto e não mesclado.

## Pendências preservadas

- \`CAT-B03 / CAT-A04\`: ciclo de substituição e limpeza de mídia, objetos superseded e rascunhos abandonados;
- \`CAT-B04\`: snapshot imutável de serviço em todos os caminhos de criação de pedido;
- produção permanece bloqueada.
`);

          const journalPath = 'docs/DOKE-ENGINEERING-JOURNAL.md';
          let journal = fs.readFileSync(journalPath, 'utf8').trimEnd();
          const heading = '# 2026-07-27 — CAT-A03 / autoridade server-side de edição e ciclo de vida';
          if (!journal.includes(heading)) {
            journal += `\n\n---\n\n${heading}\n\n**Status:** \`DONE\`\n\n**Branch:** \`cat/cat-001-baseline-audit\`\n\n**Pull Request:** \`#12\`\n\n## Problema\n\nEdição, pausa, reativação e arquivamento ainda eram validados no navegador e terminavam em uma mutação genérica de \`public.services\`, mesmo após a retirada da persistência local no CAT-A02.\n\n## Decisão\n\n- conteúdo aprovado só muda por nova versão submetida à moderação;\n- ciclo de vida do owner usa uma função server-side explícita;\n- ator vem do JWT validado pela Edge Function;\n- browser não recebe grant direto para função privilegiada nem para mutações de tabela;\n- operações históricas do dispatcher permanecem delegadas à autoridade anterior.\n\n## Implementação\n\n- migration \`149_service_lifecycle_authority.sql\`;\n- função \`transition_owned_service_lifecycle\`;\n- wrapper do dispatcher com delegação pré-CAT-A03;\n- allowlist da Edge Function atualizada;\n- edição roteada para \`submit_service_for_review\`;\n- pausa, reativação e arquivamento roteados para a nova operação;\n- mutação remota genérica aposentada;\n- runtime, audit e teste SQL permanentes;\n- matriz determinística 1.3.7 reconciliada, com \`CAT-B03\` e \`CAT-B04\` preservados.\n\n## Staging\n\n- migration \`20260727195302_service_lifecycle_authority\` aplicada;\n- Edge Function \`self-service-operations\` versão 7, \`ACTIVE\`, JWT obrigatório;\n- teste SQL 018 passou com \`ROLLBACK\`;\n- grants e ACLs confirmados;\n- nenhuma conta ou entidade sintética persistente criada.\n\n## Validação\n\n**Head:** \`9a71d700f8f6b5237c97fadc87a292ed5c475ea8\`\n\n- Quality #992: sucesso;\n- E2E bloqueante: sucesso;\n- 105 guards visuais: sucesso;\n- Canary #714: sucesso;\n- Diagnostic #736: sucesso.\n\n## Segurança operacional\n\n- produção não alterada;\n- nenhuma conta real modificada;\n- nenhum SMS, OAuth ou recurso pago habilitado;\n- nenhum fallback local reaberto;\n- PR permanece draft e não mesclado.\n\n## Próximo sublote\n\n\`CAT-A04\`: fechar substituição e limpeza de mídia, objetos superseded e rascunhos abandonados.\n`;
          }
          fs.writeFileSync(journalPath, journal + '\n');
          NODE

      - name: Restore canonical Quality in worktree
        run: git show 9a71d700f8f6b5237c97fadc87a292ed5c475ea8:.github/workflows/quality.yml > .github/workflows/quality.yml

      - name: Regenerate deterministic matrix
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Validate documentary closure
        run: |
          node scripts/audit-service-catalog-authority-baseline.js
          node scripts/audit-service-catalog-authority-retirement.js
          node scripts/audit-service-lifecycle-authority.js
          node scripts/audit-domain-completion-matrix.js
          git diff --check

      - name: Publish documentary closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.json
          git add docs/validation/CAT-001-A03-SERVICE-LIFECYCLE-AUTHORITY.md
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "Finalize CAT-A03 evidence"
          git push origin HEAD:cat/cat-001-baseline-audit
