name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]

permissions:
  contents: read

jobs:
  auth-a12-index-reconciliation:
    name: Reconcile AUTH-A12 active contract index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Patch active contract index
        shell: bash
        env:
          AUTH_A12_INDEX_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$AUTH_A12_INDEX_PATCH_B64" | base64 --decode | python3
          git diff --check
          test "$(git diff --name-only)" = 'docs/ACTIVE-CONTRACTS-INDEX.md'

      - name: Publish contract index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ACTIVE-CONTRACTS-INDEX.md
          git commit -m 'Reconcile AUTH-A12 active contract index'
          git push origin HEAD:${{ github.head_ref }}
