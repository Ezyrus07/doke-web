name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  push:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audits:
    name: Static architecture and partition audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend contracts
        run: npm run audit:frontend:strict

      - name: Audit canonical UI
        run: npm run audit:ui

      - name: Audit domain cards
        run: npm run audit:domain

      - name: Audit layout contracts
        run: npm run audit:layout

      - name: Audit product flows
        run: npm run audit:flows

      - name: Audit legacy bridge scope
        run: npm run audit:bridge

      - name: Audit page route map
        run: npm run audit:routes

      - name: Audit mock data contracts
        run: npm run audit:mocks

      - name: Audit project architecture
        run: npm run audit:architecture

      - name: Audit backend data contracts
        run: npm run audit:backend-data

      - name: Audit Edge Function source closure
        run: npm run audit:edge-function-source-closure

      - name: Audit auth session structure
        run: node scripts/audit-auth-session-contracts.js

      - name: Capture auth session audit failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/generated
          node scripts/audit-auth-session-contracts.js > reports/generated/auth-session-audit-failure.log 2>&1 || true

      - name: Upload auth session audit failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-auth-session-audit-failure-${{ github.sha }}
          path: reports/generated/auth-session-audit-failure.log
          if-no-files-found: error
          retention-days: 7

      - name: Test canonical auth session runtime
        run: node scripts/test-auth-canonical-session-runtime.js

      - name: Audit desktop shell contracts
        run: npm run audit:desktop-shell

      - name: Audit JavaScript foundation
        run: npm run audit:js-foundation

      - name: Audit visual baseline
        run: npm run audit:visual-baseline

      - name: Audit controller mock wiring
        run: npm run audit:controller-mocks

      - name: Audit domain services
        run: npm run audit:domain-services

      - name: Audit runtime flags
        run: npm run audit:runtime-flags

      - name: Audit responsive inventory
        run: npm run audit:responsive-inventory

      - name: Audit responsive boundaries
        run: npm run audit:responsive-boundaries

      - name: Audit desktop base stability
        run: npm run audit:desktop-base

      - name: Audit mobile base stability
        run: npm run audit:mobile-base

      - name: Validate platform ACL contract
        run: npm run test:platform-default-acl-contract

      - name: Run quality pipeline audit
        run: npm run audit:quality-pipeline

      - name: Validate domain completion matrix
        run: npm run audit:domain-completion-matrix

      - name: Generate stale domain matrix evidence
        if: failure()
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Upload stale domain matrix evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-domain-matrix-drift-${{ github.sha }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Run agent governance audits
        run: npm run audit:agent-governance

      - name: Audit unused asset candidates
        run: npm run audit:unused-asset-candidates

      - name: Audit duplicate assets
        run: npm run audit:duplicate-assets

      - name: Audit E2E lane partition
        run: npm run audit:e2e-lanes

      - name: Verify clean patch formatting
        run: git diff --check

  auth-a08-journal:
    name: Publish AUTH-A08 journal and matrix
    needs: static-audits
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'auth/auth-001-baseline-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Append journal and regenerate matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DOKE-ENGINEERING-JOURNAL.md')
          content = path.read_text(encoding='utf-8')
          marker = '## 2026-07-25 — AUTH-A08 legacy authority and unavailable providers retired'
          if marker not in content:
              anchor = '\n---\n\n# Entry template\n'
              if anchor not in content:
                  raise SystemExit('Engineering Journal entry-template anchor is missing.')
              entry = r'''

## 2026-07-25 — AUTH-A08 legacy authority and unavailable providers retired

**Scope:** PR #9, branch `auth/auth-001-baseline-audit`

**Outcome:** `DONE` for AUTH-A08; `BLOCKED` for optional providers without real configuration

### Context

The active pages no longer loaded the old browser authentication service, but the file still contained a complete second authority that could be restored by a stale import. Login also advertised phone access, while login and signup exposed Google, Facebook and Apple controls without configured provider flows.

### Decision

Keep the historical path as a non-executable tombstone, expose e-mail as the only canonical login identifier, remove unavailable OAuth controls and make this contract part of the mandatory auth/session runtime gate.

### Implementation

- Replaced `assets/js/core/auth-service.js` with the `AUTH-A08_RETIRED_AUTHORITY` tombstone.
- Removed all executable credential, registration, recovery, storage and API-publication behavior from that path.
- Preserved only historical legacy identifiers for migration and audit traceability.
- Made `auth/login.html` e-mail-only and removed phone-login language and hooks.
- Removed Google, Facebook and Apple controls from login and signup.
- Strengthened `scripts/test-real-auth-only-contract.js`.
- Added the real-auth-only contract to `scripts/test-auth-canonical-session-runtime.js`.
- Added a restricted deterministic matrix synchronization workflow.
- Added Markdown and JSON closure evidence under `docs/validation/`.

### Validation

Runtime and visual-validation head: `cae8fa312116ef2a2fa38507068e24067842a8d5`.

- Doke Quality Gates #414: success.
- Blocking deterministic E2E: success.
- 105 visual structural guards: success.
- Doke Staging Edge HTTP Canary #188: success.
- Static audits, auth/session runtime, real-auth-only contract, matrix, governance, asset audits and `git diff --check`: success.
- Diagnostic E2E #209 was non-blocking and still executing when mandatory closure gates completed; no success claim was made for it.

### Risks and boundaries

- No production environment, authentication provider configuration or database object was changed.
- No existing account, credential, contact, profile or role was changed.
- No SMS or OAuth provider was enabled.
- Inactive social-auth CSS and a dormant phone-mask helper remain candidates for a dedicated dead-code/controller cleanup audit; they do not expose active controls.
- `MAIL-001` and `PAID-001 / SEC-B05` remain open.
- PR #9 remains draft and must not be merged without explicit authorization.

### Next step

Plan `AUTH-A09` around `AUTH-B02`: remove browser-controlled provider selection and promote remote authentication as the only production authority through controlled route-by-route canaries.
'''
              content = content.replace(anchor, '\n---\n' + entry + '\n---\n\n# Entry template\n', 1)
              path.write_text(content, encoding='utf-8')
          PY

          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git diff --check

          expected=$'docs/DOKE-ENGINEERING-JOURNAL.md\ndocs/DOMAIN-COMPLETION-MATRIX.md'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Publish exact closure files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOKE-ENGINEERING-JOURNAL.md docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m 'Record AUTH-A08 closure evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  blocking-e2e:
    name: Blocking deterministic E2E lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run blocking E2E lane
        run: npm run test:e2e:blocking

      - name: Upload blocking E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-blocking-e2e-${{ github.sha }}
          path: |
            reports/generated/e2e-blocking-lane-summary.json
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  visual-structural:
    name: 105 visual structural guards
    runs-on: windows-latest
    timeout-minutes: 40
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run 105 visual structural guards
        run: npm run test:visual:structural

      - name: Upload visual structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-visual-structural-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
