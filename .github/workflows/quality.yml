name: Doke Quality Gates

on:
  pull_request:
    branches: [MAIN, main, master]
  push:
    branches: [MAIN, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audits:
    name: Static architecture and partition audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend contracts
        run: npm run audit:frontend:strict

      - name: Audit canonical UI
        run: npm run audit:ui

      - name: Audit domain cards
        run: npm run audit:domain

      - name: Audit layout contracts
        run: npm run audit:layout

      - name: Audit product flows
        run: npm run audit:flows

      - name: Audit legacy bridge scope
        run: npm run audit:bridge

      - name: Audit page route map
        run: npm run audit:routes

      - name: Audit mock data contracts
        run: npm run audit:mocks

      - name: Audit project architecture
        run: npm run audit:architecture

      - name: Audit backend data contracts
        run: npm run audit:backend-data

      - name: Audit Edge Function source closure
        run: npm run audit:edge-function-source-closure

      - name: Audit auth session structure
        run: node scripts/audit-auth-session-contracts.js

      - name: Capture auth session audit failure
        if: failure()
        shell: bash
        run: |
          mkdir -p reports/generated
          node scripts/audit-auth-session-contracts.js > reports/generated/auth-session-audit-failure.log 2>&1 || true

      - name: Upload auth session audit failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-auth-session-audit-failure-${{ github.sha }}
          path: reports/generated/auth-session-audit-failure.log
          if-no-files-found: error
          retention-days: 7

      - name: Test canonical auth session runtime
        run: node scripts/test-auth-canonical-session-runtime.js

      - name: Audit desktop shell contracts
        run: npm run audit:desktop-shell

      - name: Audit JavaScript foundation
        run: npm run audit:js-foundation

      - name: Audit visual baseline
        run: npm run audit:visual-baseline

      - name: Audit controller mock wiring
        run: npm run audit:controller-mocks

      - name: Audit domain services
        run: npm run audit:domain-services

      - name: Audit runtime flags
        run: npm run audit:runtime-flags

      - name: Audit responsive inventory
        run: npm run audit:responsive-inventory

      - name: Audit responsive boundaries
        run: npm run audit:responsive-boundaries

      - name: Audit desktop base stability
        run: npm run audit:desktop-base

      - name: Audit mobile base stability
        run: npm run audit:mobile-base

      - name: Validate platform ACL contract
        run: npm run test:platform-default-acl-contract

      - name: Run quality pipeline audit
        run: npm run audit:quality-pipeline

      - name: Validate domain completion matrix
        run: npm run audit:domain-completion-matrix

      - name: Generate stale domain matrix evidence
        if: failure()
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Upload stale domain matrix evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doke-domain-matrix-drift-${{ github.sha }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Run agent governance audits
        run: npm run audit:agent-governance

      - name: Audit unused asset candidates
        run: npm run audit:unused-asset-candidates

      - name: Audit duplicate assets
        run: npm run audit:duplicate-assets

      - name: Audit E2E lane partition
        run: npm run audit:e2e-lanes

      - name: Verify clean patch formatting
        run: git diff --check

  blocking-e2e:
    name: Blocking deterministic E2E lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run blocking E2E lane
        run: npm run test:e2e:blocking

      - name: Upload blocking E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-blocking-e2e-${{ github.sha }}
          path: |
            reports/generated/e2e-blocking-lane-summary.json
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  visual-structural:
    name: 105 visual structural guards
    runs-on: windows-latest
    timeout-minutes: 40
    needs: static-audits

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run 105 visual structural guards
        run: npm run test:visual:structural

      - name: Upload visual structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-visual-structural-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  auth-a11-journal-append:
    name: Append AUTH-A11 closure Journal entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Append closure entry once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/DOKE-ENGINEERING-JOURNAL.md')
          text = path.read_text(encoding='utf-8')
          title = '## 2026-07-26 — AUTH-A11 provider-reconciled identity authority closed'
          marker = '# Entry template'
          if title in text:
              print('AUTH-A11 journal entry already present.')
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit('Journal template marker is missing or ambiguous.')
          entry = '''## 2026-07-26 — AUTH-A11 provider-reconciled identity authority closed

**Scope:** PR #9, branch `auth/auth-001-baseline-audit`, staging `zwkczgewzbsorbrjuzpb`

**Outcome:** `DONE` for AUTH-A11; `BLOCKED` for AUTH-A07 under MAIL-001 and for PAID-001 / SEC-B05

### Context and decision

Profile, settings and onboarding mutations still crossed the authentication boundary and could duplicate provider metadata or rewrite the public session snapshot. Supabase Auth remains the credential/session authority; public identity mutations now use narrow server-side self-service operations and canonical server responses.

### Implementation

- Removed `DokeAuth.updateCurrentUser` and `DokeAuth.updateCurrentProfile`.
- Added `update_account_profile_reconciled`, `update_account_settings`, `complete_account_onboarding_reconciled` and canonical identity reads.
- Removed browser `supabase.auth.updateUser(...)` metadata duplication and manual Supabase session writes from profile/onboarding flows.
- Added permanent profile, settings and onboarding reconciliation runtimes.
- Applied migration 147 to staging as version `20260726141755`.
- Deployed `self-service-operations` v5 with `verify_jwt = true`.

### Validation

- Head `e5341f5f9063ddf36c1c350971c6568e4625f62b` passed Quality Gates #544, blocking E2E, 105 visual guards, Edge HTTP Canary #318 and Diagnostic E2E #339.
- SQL validation 016 passed with transaction rollback and zero residual synthetic rows.
- Authenticated public-Edge canary run `30206309047`, final job `89805250392`, passed profile, settings, onboarding and final identity reconciliation.
- Protected e-mail, role and account status remained unchanged; rejected settings keys were not persisted.
- The disposable identity was deleted; remaining rows in `auth.users`, `auth.identities`, `public.users` and `public.user_profiles` were all zero.
- No new AUTH-A11-specific Security Advisor issue was introduced.

### Risks and boundaries

- Production and real users were not changed.
- No persistent synthetic identity remains.
- No SMTP, SMS, OAuth or paid configuration was enabled.
- `MAIL-001` and `PAID-001 / SEC-B05` remain open.
- PR #9 remains draft and must not be merged without explicit authorization.

### Next step

Audit and reconcile remaining identity/profile contracts and dormant local repository surfaces before choosing the next unblocked AUTH-001 implementation sublot. AUTH-A07 stays blocked while MAIL-001 is unresolved.

---

'''
          path.write_text(text.replace(marker, entry + marker), encoding='utf-8')
          PY
          git diff --check
          changes="$(git diff --name-only)"
          test -z "$changes" || test "$changes" = 'docs/DOKE-ENGINEERING-JOURNAL.md'

      - name: Publish Journal entry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DOKE-ENGINEERING-JOURNAL.md; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git commit -m 'Record AUTH-A11 staging closure in engineering journal'
          git push origin HEAD:${{ github.head_ref }}
