name: Doke SEARCH-A09 Verified Applicator

on:
  push:
    branches:
      - 'search/search-001-baseline-audit'
    paths:
      - '.github/workflows/search-a09-apply.yml'
      - '.search-a09-part-*'
      - '.search-a09-r-*'

permissions:
  contents: write

concurrency:
  group: doke-search-a09-applicator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-search-a09:
    name: Verify and publish SEARCH-A09 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct verified candidate archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .search-a09-part-00 \
            .search-a09-part-01 \
            .search-a09-part-02 \
            .search-a09-part-03 \
            .search-a09-part-04 \
            .search-a09-r-00 \
            .search-a09-r-01 \
            .search-a09-r-02 \
            .search-a09-r-03 \
            .search-a09-r-04 \
            .search-a09-r-05 \
            .search-a09-r-06 \
            | tr -d '\r\n' \
            | base64 --decode \
            > /tmp/search-a09-patch.tar.gz
          echo '94388de073d2e659bffdf23bebc3819702fdcc86733d5d4bde69145ae413ae06  /tmp/search-a09-patch.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/search-a09-patch.tar.gz -C .

      - name: Validate candidate contracts
        run: |
          set -euo pipefail
          node --check scripts/audit-search-observability-v2.js
          node --check scripts/test-search-observability-v2-runtime.mjs
          node --check scripts/validate-search-observability-staging-http-canary.mjs
          node scripts/test-search-observability-v2-runtime.mjs
          node scripts/audit-search-observability-v2.js
          node scripts/audit-edge-function-source-closure.js
          git diff --check

      - name: Remove temporary applicator material
        shell: bash
        run: |
          rm -f \
            .search-a09-part-00 \
            .search-a09-part-01 \
            .search-a09-part-02 \
            .search-a09-part-03 \
            .search-a09-part-04 \
            .search-a09-r-00 \
            .search-a09-r-01 \
            .search-a09-r-02 \
            .search-a09-r-03 \
            .search-a09-r-04 \
            .search-a09-r-05 \
            .search-a09-r-06 \
            .github/workflows/search-a09-apply.yml

      - name: Commit verified SEARCH-A09 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement SEARCH-A09 server-authoritative observability'
          git push origin HEAD:${{ github.ref_name }}
