name: FE-C01 Rail Owner Sync

on:
  pull_request:
    paths:
      - "assets/js/dev/fe-c01-rail-owner-trigger.txt"

permissions:
  contents: write

concurrency:
  group: fe-c01-rail-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate domain completion matrix
        run: npm run write:domain-completion-matrix

      - name: Validate structural and governed contracts
        run: |
          node scripts/audit-frontend-structural-gates.js --strict
          node scripts/audit-token-authority.js
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:unused-asset-candidates
          npm run audit:duplicate-assets
          git diff --check

      - name: Commit deterministic matrix refresh
        shell: bash
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md; then
            echo "Domain completion matrix already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "FE-C01: refresh matrix after rail ownership split"
          git push origin HEAD:${{ github.head_ref }}
