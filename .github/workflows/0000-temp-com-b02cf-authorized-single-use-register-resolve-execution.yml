name: TEMP COM-B02CF Authorized Single-Use Register Resolve Execution

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-resolve-execution.js'
      - 'config/com-b02cf-repository-only-deterministic-synthetic-continuation-state-register-resolve-execution.json'
      - 'scripts/test-com-b02cf-repository-only-deterministic-synthetic-continuation-state-register-resolve-execution.js'
      - '.github/workflows/0000-temp-com-b02cf-authorized-single-use-register-resolve-execution.yml'

permissions:
  contents: read

jobs:
  execute-authorized-single-use-register-resolve:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: e4b74dbac4821521a65a2d24b6e59bbad4fd1928
      PREDECESSOR_TREE: c149f1c1de85e5e63ded7e18470e26059494bc62
      PREDECESSOR_RUN_ID: '32723087958'
      PREDECESSOR_JOB_ID: '97418474387'
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-resolve-execution.js
      CONFIG: config/com-b02cf-repository-only-deterministic-synthetic-continuation-state-register-resolve-execution.json
      TEST: scripts/test-com-b02cf-repository-only-deterministic-synthetic-continuation-state-register-resolve-execution.js
      WORKFLOW: .github/workflows/0000-temp-com-b02cf-authorized-single-use-register-resolve-execution.yml
      B02CE_TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      B02CE_TARGET_BLOB: d069f092d7c710e253bd3f9143746247ee08d57e
      B02CE_CONFIG: config/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.json
      B02CE_CONFIG_BLOB: c50a24779cb81d767be4d8fb5aadda5a06c1dd20
      B02CE_TEST: scripts/test-com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      B02CE_TEST_BLOB: ea9e2f65c38e49471ceaab06d7a5b4bb15c6f308
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact authorized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02CE lineage and exact single-use scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.run_attempt }}" = '1'
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR_HEAD"
          test "$PREDECESSOR_RUN_ID" = '32723087958'
          test "$PREDECESSOR_JOB_ID" = '97418474387'
          test "$(git rev-parse HEAD:$B02CE_TARGET)" = "$B02CE_TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CE_CONFIG)" = "$B02CE_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$B02CE_TEST)" = "$B02CE_TEST_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          expected="$(printf '%s\n' "$TARGET" "$CONFIG" "$TEST" "$WORKFLOW" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"
          grep -F '"status": "AUTHORIZED_SINGLE_USE_EXECUTION_PENDING"' "$CONFIG"
          grep -F '"singleUse": true' "$CONFIG"
          grep -F '"reusable": false' "$CONFIG"
          grep -F '"registryLookupAuthority": true' "$CONFIG"
          grep -F '"registryResolveAuthority": true' "$CONFIG"
          grep -F '"registryReleaseAuthority": false' "$CONFIG"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static preflight without execution
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          grep -F 'registry.set(key, storedState);' "$TARGET"
          grep -F 'const resolvedState = registry.get(key);' "$TARGET"
          ! grep -F 'registry.delete(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Execute exactly one authorized process-local synthetic register resolve
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.run_attempt }}" = '1'
          node "$TEST" --execute

      - name: Governance and Matrix observation after consumed execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
