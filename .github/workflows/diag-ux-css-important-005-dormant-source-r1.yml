name: Doke UX CSS Important 005 Dormant Source R1
on:
  push:
    branches: [diag/ux-css-important-005-dormant-source-r1]
    paths: [.github/workflows/diag-ux-css-important-005-dormant-source-r1.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 1c1f6c97a851fc73b7f81c07fe646d7d60e03843
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      TARGET_BLOB: 1e24479b2b9065659a5a11a18854131e4ef90187
      DIAG_BRANCH: diag/ux-css-important-005-dormant-source-r1
      RESULT_FILE: .diagnostics/ux-css-important-005-dormant-source-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/source.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');const tracked=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean),files=tracked.filter(p=>p.endsWith('.html')||p.startsWith('assets/js/')&&p.endsWith('.js'));
          const cls=['home-mobile-hero__top','home-mobile-hero__quick-actions','home-mobile-hero__location-label','content-rail__arrow','comparison-card'];const ids=['before-after-track'];
          const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          function classProduced(t,a){const e=esc(a);return new RegExp(`class\\s*=\\s*["'\x60][^"'\x60]*?(?:^|\\s)${e}(?=\\s|["'\x60])`,'m').test(t)||new RegExp(`classList\\.add\\([^)]*["'\x60]${e}["'\x60]`).test(t)||new RegExp(`setAttribute\\(\\s*["']class["']\\s*,[^)]*\\b${e}\\b`).test(t)||new RegExp(`className\\s*=\\s*["'\x60][^"'\x60]*\\b${e}\\b`).test(t)}
          function idProduced(t,a){const e=esc(a);return new RegExp(`id\\s*=\\s*["'\x60]${e}["'\x60]`).test(t)||new RegExp(`setAttribute\\(\\s*["']id["']\\s*,\\s*["'\x60]${e}["'\x60]`).test(t)}
          let producers=0;for(const a of cls){const hit=files.filter(p=>classProduced(fs.readFileSync(p,'utf8'),a));producers+=hit.length;console.log(`CLASS PRODUCER|anchor=${a}|files=${hit.length}|list=${hit.join(',')||'-'}`)}for(const a of ids){const hit=files.filter(p=>idProduced(fs.readFileSync(p,'utf8'),a));producers+=hit.length;console.log(`ID PRODUCER|anchor=${a}|files=${hit.length}|list=${hit.join(',')||'-'}`)}
          const index=fs.readFileSync('index.html','utf8'),tokens=[...index.matchAll(/class=["']([^"']+)["']/g)].flatMap(m=>m[1].split(/\s+/)),idvals=[...index.matchAll(/id=["']([^"']+)["']/g)].map(m=>m[1]);for(const a of cls)console.log(`INDEX CLASS|anchor=${a}|count=${tokens.filter(x=>x===a).length}`);for(const a of ids)console.log(`INDEX ID|anchor=${a}|count=${idvals.filter(x=>x===a).length}`);
          const src=fs.readFileSync(process.env.TARGET_FILE,'utf8');if((src.match(/!important\b/g)||[]).length!==36)throw Error('target drift');const patterns=[/home-mobile-hero__top[\s\S]*?grid-template-columns:[^;]+!important/g,/home-mobile-hero__quick-actions[\s\S]*?display:[^;]+!important[\s\S]*?grid-template-columns:[^;]+!important/g,/home-mobile-hero__location-label[\s\S]*?display:[^;]+!important[\s\S]*?overflow:[^;]+!important/g,/#before-after-track\s*>\s*\.comparison-card\s*\{[\s\S]*?\}/g,/#before-after-track\s*>\s*\.comparison-card\s+\.comparison-card__visual\s*\{[\s\S]*?\}/g,/\.content-rail__arrow\s*\{[\s\S]*?display:[^;]+!important[\s\S]*?\}/g];let candidateRows=0;for(const p of patterns){const m=src.match(p)||[];for(const x of m)candidateRows+=(x.match(/!important\b/g)||[]).length}console.log(`CANDIDATE SOURCE|priorityMarkers=${candidateRows}|expected=13|producerHits=${producers}`);if(candidateRows!==13||producers!==0)throw Error(`closure rows=${candidateRows} producers=${producers}`);console.log('DECISION|dormantPriorityMarkers=13|activeProducer=0|candidateEligible=1');
          NODE
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.source.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "SOURCE=${{ steps.source.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CLASS PRODUCER|ID PRODUCER|INDEX CLASS|INDEX ID|CANDIDATE SOURCE|DECISION)\|' /tmp/source.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 200 /tmp/source.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 005 dormant source proof [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
