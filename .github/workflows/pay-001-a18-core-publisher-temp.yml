name: Doke PAY-A18 Core Publisher Temp

on:
  push:
    branches:
      - 'pay/pay-a18-witness-proof-rehearsal-build'
    paths:
      - '.pay-a18-core-payload.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-a18-witness-proof-rehearsal-build
          fetch-depth: 0
      - name: Verify fixed payload
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "pay/pay-a18-witness-proof-rehearsal-build"
          printf '%s  %s\n' '95d5c2b14b7a330b1ab9399d433d0df6ffd1a5bf302c396e50333e80738b78a6' '.pay-a18-core-payload.b64' | sha256sum --check --strict
          base64 --decode .pay-a18-core-payload.b64 > /tmp/pay-a18-core.tar.gz
          printf '%s  %s\n' '35b2cadef38ee2d8a85483b93f338e7db9ed50bc8941525cbe28beec3c8c6d39' '/tmp/pay-a18-core.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/pay-a18-core.tar.gz | sort > /tmp/actual-paths.txt
          printf '%s\n' \
            'backend/modules/payments/payment-reconciliation-witness-proof-rehearsal.js' \
            'scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js' \
            | sort > /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
      - name: Materialize and validate PAY-A18 core
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/pay-a18-core.tar.gz
          node --check backend/modules/payments/payment-reconciliation-witness-proof-rehearsal.js
          node --check scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js
          node scripts/audit-pay-001-a18-witness-proof-rehearsal-adoption-gate.js
          node scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js
          git diff --check
      - name: Commit exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          rm .pay-a18-core-payload.b64
          rm .github/workflows/pay-001-a18-core-publisher-temp.yml
          git add -A -- \
            backend/modules/payments/payment-reconciliation-witness-proof-rehearsal.js \
            scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js \
            .pay-a18-core-payload.b64 \
            .github/workflows/pay-001-a18-core-publisher-temp.yml
          git diff --cached --name-only | sort > /tmp/actual-commit-paths.txt
          printf '%s\n' \
            '.github/workflows/pay-001-a18-core-publisher-temp.yml' \
            '.pay-a18-core-payload.b64' \
            'backend/modules/payments/payment-reconciliation-witness-proof-rehearsal.js' \
            'scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js' \
            | sort > /tmp/expected-commit-paths.txt
          diff -u /tmp/expected-commit-paths.txt /tmp/actual-commit-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement PAY-A18 witness proof rehearsal core'
          git push origin HEAD:pay/pay-a18-witness-proof-rehearsal-build
