name: COM-B03C-R3H Single-Use Ephemeral Policy Identity Presence Diagnostic Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - backend/modules/communities/community-realtime-private-auth-r3h.js
      - config/com-b03c-r3h-single-use-staging-diagnostic-readiness.json
      - scripts/test-com-b03c-r3h-single-use-staging-diagnostic-readiness.js
      - scripts/execute-com-b03c-r3h-case-time-policy-snapshot-presence-staging-diagnostic.js
      - scripts/verify-com-b03c-r3h-case-time-policy-snapshot-presence-staging-evidence.js
      - docs/validation/COM-B03C-R3H-SINGLE-USE-STAGING-DIAGNOSTIC-READINESS.json
      - .github/workflows/com-b03c-r3h-single-use-staging-diagnostic-readiness.yml
      - docs/validation/COM-B03C-R3G-REMOTE-ADAPTER-WIRING-READINESS.json
      - docs/DOMAIN-COMPLETION-MATRIX.md
      - reports/generated/domain-completion-matrix-report.json
  push:
    branches: [com/com-001-baseline-audit]
    paths: [config/com-b03c-r3h-case-time-policy-snapshot-presence-diagnostic-staging-trigger.json]

permissions: { contents: read }
concurrency:
  group: com-b03c-r3h-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3h.js
          node --check scripts/test-com-b03c-r3h-single-use-staging-diagnostic-readiness.js
          node --check scripts/execute-com-b03c-r3h-case-time-policy-snapshot-presence-staging-diagnostic.js
          node --check scripts/verify-com-b03c-r3h-case-time-policy-snapshot-presence-staging-evidence.js
      - name: COM-B03C-R3H repository single-use staging diagnostic readiness
        run: node scripts/test-com-b03c-r3h-single-use-staging-diagnostic-readiness.js
      - name: Repository-only evidence contract self-test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p reports/generated
          node scripts/execute-com-b03c-r3h-case-time-policy-snapshot-presence-staging-diagnostic.js --repository-self-test > reports/generated/COM-B03C-R3H-REPOSITORY-SELF-TEST.json
          node scripts/verify-com-b03c-r3h-case-time-policy-snapshot-presence-staging-evidence.js reports/generated/COM-B03C-R3H-REPOSITORY-SELF-TEST.json
      - name: Pre-authorization staging hard-block
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test ! -e config/com-b03c-r3h-case-time-policy-snapshot-presence-diagnostic-staging-trigger.json
          set +e
          output="$(node scripts/execute-com-b03c-r3h-case-time-policy-snapshot-presence-staging-diagnostic.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R3H_STAGING_AUTHORIZATION_REQUIRED'
      - name: Trigger commit continuity on staging execution
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          TRIGGER=config/com-b03c-r3h-case-time-policy-snapshot-presence-diagnostic-staging-trigger.json
          test -f "${TRIGGER}"
          test "$(git rev-parse HEAD^)" = "$(node -p "require('./${TRIGGER}').workflowInstallHead")"
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "${TRIGGER}"
      - name: Domain completion matrix audit
        if: github.event_name == 'pull_request'
        run: npm run audit:domain-completion-matrix
      - name: Agent governance audit
        if: github.event_name == 'pull_request'
        run: npm run audit:agent-governance
      - name: Governance invariants
        if: github.event_name == 'pull_request'
        run: |
          node - <<'NODE'
          const e=require('./docs/validation/COM-B03C-R3H-SINGLE-USE-STAGING-DIAGNOSTIC-READINESS.json');
          if(e.checkpoint?.maturity!==3||e.checkpoint?.productionGate!=='blocked')process.exit(1);
          const a=e.futureAuthorization||{};
          if(a.defined!==true||a.singleUse!==true||a.reusableAfterFailure!==false||a.predecessorAuthorizationReusable!==false||a.triggerExists!==false)process.exit(1);
          const pre=a.received===false&&a.consumed===false&&a.executionAttempted===false;
          const s=e.stagingExecution||{};
          const closed=a.received===true&&a.consumed===true&&a.executionAttempted===true&&
            e.status==='staging_execution_completed_authorization_consumed_zero_residue_repository_followup_required'&&
            s.run===31343163304&&s.certifyJob===93320157103&&s.authorizeJob===93320185686&&s.canaryJob===93320239022&&s.status==='success'&&
            s.artifact?.id===9046469554&&s.cleanup?.zeroResidueProven===true&&s.cleanup?.temporaryPolicyResidue===0&&s.cleanup?.syntheticIdentityResidue===0&&
            s.trigger?.commit==='a07daf53dce4c3c9635f54847c660daee1ab0c97'&&s.trigger?.removed===true&&s.trigger?.removalCommit==='ea98d34f10fd30bada960d35c6831b19db0b9ed5'&&
            s.observedResult?.allStructuralEvidenceComplete===true&&s.observedResult?.negativeControlPassed===true&&s.observedResult?.initialCatalogCount===0&&s.observedResult?.finalCatalogCount===0;
          if(!pre&&!closed)process.exit(1);
          for(const k of ['triggerCreationAuthority','stagingReadAuthority','stagingMutationAuthority','authIdentityLifecycleAuthority','syntheticAccountMaterializationAuthority','realtimePolicyLifecycleAuthority','realtimeSubscriptionAuthority','domainMutationAuthority','publicationMutationAuthority','runtimeDeployAuthority','productionAuthority','pullRequestMergeAuthority'])if(e.authority?.[k]!==false)process.exit(1);
          if(pre){
            for(const k of ['stagingAccessExecuted','remoteCredentialReadExecuted','remoteDependencyLoadExecuted','authIdentityMutationExecuted','syntheticAccountMaterializationExecuted','realtimePolicyMutationExecuted','realtimeSubscriptionExecuted','generalDomainMutationExecuted','publicationMutationExecuted','runtimeDeployExecuted','productionExecuted','mergeExecuted'])if(e.effects?.[k]!==false)process.exit(1);
          }
          if(closed){
            for(const k of ['stagingAccessExecuted','remoteCredentialReadExecuted','remoteDependencyLoadExecuted','authIdentityMutationExecuted','syntheticAccountMaterializationExecuted','realtimePolicyMutationExecuted','realtimeSubscriptionExecuted'])if(e.effects?.[k]!==true)process.exit(1);
            for(const k of ['generalDomainMutationExecuted','publicationMutationExecuted','runtimeDeployExecuted','productionExecuted','mergeExecuted'])if(e.effects?.[k]!==false)process.exit(1);
          }
          if(e.exactRootCauseProven!==false)process.exit(1);
          NODE
      - name: Diff hygiene
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

  authorize:
    if: github.event_name == 'push'
    needs: certify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Validate single-use COM-B03C-R3H trigger boundary
        shell: bash
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          TRIGGER=config/com-b03c-r3h-case-time-policy-snapshot-presence-diagnostic-staging-trigger.json
          test -f "${TRIGGER}"
          test "$(git rev-parse HEAD^)" = "$(node -p "require('./${TRIGGER}').workflowInstallHead")"
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "${TRIGGER}"
          node - <<'NODE'
          const t=require('./config/com-b03c-r3h-case-time-policy-snapshot-presence-diagnostic-staging-trigger.json');
          const r=require('./backend/modules/communities/community-realtime-private-auth-r3h');
          if(t.contractId!==r.TRIGGER_CONTRACT_ID||t.status!=='authorization_consumed_execution_pending'||t.authorization?.phrase!==r.REQUIRED_AUTHORIZATION_PHRASE)process.exit(1);
          for(const k of ['received','consumed','executionAttempted','singleUse'])if(t.authorization?.[k]!==true)process.exit(1);
          if(t.authorization?.reusableAfterFailure!==false||t.authorization?.predecessorAuthorizationReusable!==false)process.exit(1);
          const a=r.evaluateStagingAuthorization({
            authorizationPhrase:t.authorization.phrase,
            targetEnvironment:t.target.environment,
            projectId:t.target.projectId,
            branch:t.target.branch,
            pullRequest:t.target.pullRequest,
            runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            authorizationConsumed:false,
            executionAttempted:false,
            predecessorAuthorizationReusable:false,
            ...t.canary
          });
          if(a.decision!=='authorized_for_single_bounded_ephemeral_policy_identity_presence_diagnostic')process.exit(1);
          NODE

  canary:
    if: github.event_name == 'push'
    needs: authorize
    runs-on: ubuntu-24.04
    environment: doke-staging
    env:
      COM_B03C_R3H_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_COM_B03C_R3H_SINGLE_USE_EPHEMERAL_POLICY_IDENTITY_AND_PRESENCE_DIAGNOSTIC_ON_DOKE_STAGING
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COM_B03C_R3H_REPORT_PATH: reports/generated/COM-B03C-R3H-CASE-TIME-POLICY-SNAPSHOT-PRESENCE-STAGING.json
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install canary-only dependencies
        run: npm install --no-save --ignore-scripts pg@8 @supabase/supabase-js@2.112.2
      - name: Execute bounded case-time Presence diagnostic
        id: execute
        continue-on-error: true
        run: node scripts/execute-com-b03c-r3h-case-time-policy-snapshot-presence-staging-diagnostic.js
      - name: Verify sanitized COM-B03C-R3H evidence
        if: always()
        run: node scripts/verify-com-b03c-r3h-case-time-policy-snapshot-presence-staging-evidence.js reports/generated/COM-B03C-R3H-CASE-TIME-POLICY-SNAPSHOT-PRESENCE-STAGING.json
      - name: Upload sanitized COM-B03C-R3H evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com-b03c-r3h-presence-diagnostic-${{ github.run_id }}
          path: reports/generated/COM-B03C-R3H-CASE-TIME-POLICY-SNAPSHOT-PRESENCE-STAGING.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagate diagnostic result
        if: steps.execute.outcome != 'success'
        run: exit 1
