name: COM-B03C-R5H Trigger Certification Matrix Writer TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-trigger-certification-matrix-writer-temp.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Exact writer install boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a44cdaf94fac3a2519e5e35787bfe3c8b0ada59d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/com-b03c-r5h-trigger-certification-matrix-writer-temp.yml"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
      - name: R5H syntax and repository certification self-test
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r5h.js
          node --check scripts/test-com-b03c-r5h-r5g-bound-single-use-r5d-trigger-certification.js
          node scripts/test-com-b03c-r5h-r5g-bound-single-use-r5d-trigger-certification.js
      - name: Frozen trigger and lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json)" = "0d8b8a39104a1de003f9097a867e51b2313bb750"
          test "$(git rev-parse HEAD:config/com-b03c-r5f-r5e-fresh-execution-authorization-consumption.json)" = "12a1e21253759ae334ee6c9bf423cfe3ea7d27f4"
          test "$(git rev-parse HEAD:config/com-b03c-r5b-r5a-fresh-authorization-consumption.json)" = "a2ed29dc6a44f9d62f5159dfeabd2c769f677b50"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5d.js)" = "7cde416f2922230bae6b1e4b1e48fdfaf411da99"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5g.js)" = "53227cbe72e5de06d0a8d7d70520e4dc01cde9e8"
          git merge-base --is-ancestor 4fc3577316f6426c12cebdd12bb6374e5c45a5f7 HEAD
          git merge-base --is-ancestor d8e20471b86fca88ec9735a130dd42812772d03c HEAD
      - name: Remote execution hard block
        run: |
          node - <<'NODE'
          const r5h = require('./backend/modules/communities/community-realtime-private-auth-r5h');
          try { r5h.assertRemoteExecutionBoundaryAbsent(); process.exit(1); }
          catch (error) { if (error?.code !== r5h.REMOTE_EXECUTION_BLOCK_CODE) throw error; }
          NODE
      - name: Remove temporary writer and generate canonical Matrix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/com-b03c-r5h-trigger-certification-matrix-writer-temp.yml
          npm run write:domain-completion-matrix
      - name: Repository governance
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
      - name: Exact reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/com-b03c-r5h-trigger-certification-matrix-writer-temp\.yml|config/domain-completion-matrix\.json|docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$'
          unexpected="$(git status --porcelain=v1 | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - name: Publish reconciled tree and certification commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/com-b03c-r5h-trigger-certification-matrix-writer-temp.yml config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged" || { echo 'R5H_RECONCILIATION_EMPTY_UNEXPECTED'; exit 1; }
          printf '%s\n' "$staged" | grep -Ev '^(\.github/workflows/com-b03c-r5h-trigger-certification-matrix-writer-temp\.yml|config/domain-completion-matrix\.json|docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' && exit 1 || true
          git commit -m 'docs(com): reconcile matrix for R5H trigger certification'
          git commit --allow-empty -m 'chore: certify R5H trigger certification reconciled tree'
          git push origin HEAD:com/com-001-baseline-audit
