name: Doke Domain Completion Matrix Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/domain-completion-matrix-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: domain-completion-matrix-reconciliation-pr-25
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - name: Require immutable PR head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git ls-remote origin refs/heads/ord/ord-001-baseline-audit | cut -f1)" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate and validate matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          node --check scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js
          node --check scripts/prepare-sched-001-c01e-dual-authorization-runtime.js
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          git diff --check
          test "$(git diff --name-only)" = $'docs/DOMAIN-COMPLETION-MATRIX.md\nreports/generated/domain-completion-matrix-report.json'

      - name: Publish generated matrix artifacts only
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/ord/ord-001-baseline-audit | cut -f1)" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git commit -m "docs(gov): refresh domain completion matrix"
          git push origin HEAD:refs/heads/ord/ord-001-baseline-audit
