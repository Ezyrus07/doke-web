name: Doke Temporary Exact Domain Matrix Restore

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/domain-completion-matrix-exact-restore-temporary.yml'

permissions:
  contents: write

concurrency:
  group: domain-completion-matrix-exact-restore-temporary
  cancel-in-progress: false

jobs:
  restore:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 20

      - name: Require immutable event head and canonical ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor dc13e81bc13185a4fb4da068e5d1e82e092173bc HEAD
          test "$(git rev-parse dc13e81bc13185a4fb4da068e5d1e82e092173bc:config/domain-completion-matrix.json)" = "90ffff2e590d13715ee9f0114ff807d623d9251b"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Restore exact canonical matrix blob
        run: |
          git show dc13e81bc13185a4fb4da068e5d1e82e092173bc:config/domain-completion-matrix.json > config/domain-completion-matrix.json
          test "$(git hash-object config/domain-completion-matrix.json)" = "90ffff2e590d13715ee9f0114ff807d623d9251b"
          node -e "const m=require('./config/domain-completion-matrix.json'); if(m.version!=='1.3.77') process.exit(1)"

      - name: Validate exact restoration and cumulative governance
        run: |
          npm run audit:domain-completion-matrix
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-bootstrap-runtime.js
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          npm run audit:sched-001-c01c-deterministic-frontend-presentation
          npm run test:sched-001-c01c-deterministic-frontend-presentation
          git diff --check

      - name: Stage only restored matrix
        run: |
          git add config/domain-completion-matrix.json
          test "$(git diff --cached --name-only)" = "config/domain-completion-matrix.json"
          test "$(git hash-object config/domain-completion-matrix.json)" = "90ffff2e590d13715ee9f0114ff807d623d9251b"
          git diff --cached --check

      - name: Publish exact matrix restoration
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin ord/ord-001-baseline-audit --depth=1
          test "$(git rev-parse origin/ord/ord-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(governance): restore canonical domain matrix"
          git push origin HEAD:ord/ord-001-baseline-audit
