name: COM-B02CE Authorized Single-Use Register Execution Certification

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-authorized-reexecution.js'
      - 'config/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.json'
      - 'scripts/test-com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.js'
      - '.github/workflows/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read

jobs:
  certify-authorized-single-use-register-proof:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: 0eee210c0b968ac6bae029e1ab448d03ae55b7f4
      PREDECESSOR_TREE: f64913266231c886b315f6bd4d09d03a0b08952e
      B02CD_RUN_ID: '32677911805'
      B02CD_JOB_ID: '97289298570'
      EXECUTION_PROOF_HEAD: 8c950b938fafb8d32ff72a3b4e687c9e374c3e58
      EXECUTION_PROOF_TREE: 590587bbf1321a6a966babf5c4babef2246f219c
      EXECUTION_RUN_ID: '32721876143'
      EXECUTION_JOB_ID: '97414818662'
      EXECUTION_WORKFLOW: .github/workflows/0000-temp-com-b02ce-authorized-single-use-register-execution.yml
      EXECUTION_WORKFLOW_BLOB: c5cfb391a1793243d524da7988d8e279059437c9
      EXECUTION_TARGET_BLOB: c1fe633bfbe4db36099c98180d1c630fedd6c616
      EXECUTION_CONFIG_BLOB: b440145f64256ad2403d390748ebf8e68b4a9090
      EXECUTION_TEST_BLOB: f846f57748229e0983d887d1b4ee0cc3b7d29d35
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      CONFIG: config/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.json
      TEST: scripts/test-com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.js
      WORKFLOW: .github/workflows/com-b02ce-repository-only-deterministic-synthetic-continuation-state-register-authorized-reexecution.yml
      TARGET_BLOB: d069f092d7c710e253bd3f9143746247ee08d57e
      CONFIG_BLOB: c50a24779cb81d767be4d8fb5aadda5a06c1dd20
      TEST_BLOB: ea9e2f65c38e49471ceaab06d7a5b4bb15c6f308
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_MD_BLOB: 385eb41e7f07a7e9b6ef1fbce07d7e2d1537bc50
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      MATRIX_REPORT_BLOB: d802aa7ed6a37c883a7c1222e4794cbc807385bb
      B02CD_TARGET_BLOB: fe5cd04e593c85bebd0a0434f07e75f41dac4b22
      B02CD_CONFIG_BLOB: 0e900788a5966caeca1f82277eecc5cdad42ecd0
      B02CD_TEST_BLOB: 987b14dca52dbd036e1c968c46910d82c28cd686
      B02CD_WORKFLOW_BLOB: 1b8e71fc32c2959671063e405dcc667c989dbc8d
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze quarantine predecessor, consumed execution proof, and exact final scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse "$EXECUTION_PROOF_HEAD^{tree}")" = "$EXECUTION_PROOF_TREE"
          git merge-base --is-ancestor "$EXECUTION_PROOF_HEAD" HEAD
          test "$B02CD_RUN_ID" = '32677911805'
          test "$B02CD_JOB_ID" = '97289298570'
          test "$EXECUTION_RUN_ID" = '32721876143'
          test "$EXECUTION_JOB_ID" = '97414818662'
          test "$(git rev-parse "$EXECUTION_PROOF_HEAD:$EXECUTION_WORKFLOW")" = "$EXECUTION_WORKFLOW_BLOB"
          test "$(git rev-parse "$EXECUTION_PROOF_HEAD:$TARGET")" = "$EXECUTION_TARGET_BLOB"
          test "$(git rev-parse "$EXECUTION_PROOF_HEAD:$CONFIG")" = "$EXECUTION_CONFIG_BLOB"
          test "$(git rev-parse "$EXECUTION_PROOF_HEAD:$TEST")" = "$EXECUTION_TEST_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_MD)" = "$MATRIX_MD_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_REPORT)" = "$MATRIX_REPORT_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-execution.js)" = "$B02CD_TARGET_BLOB"
          test "$(git rev-parse HEAD:config/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.json)" = "$B02CD_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.js)" = "$B02CD_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.yml)" = "$B02CD_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          test ! -e '.github/workflows/0000-temp-com-b02ce-authorized-single-use-register-execution.yml'
          test ! -e '.github/workflows/0000-temp-com-b02ce-matrix-derivatives-export.yml'
          test ! -e '.github/workflows/0000-temp-com-b02ce-matrix-derivatives-promote.yml'
          expected="$(printf '%s\n' "$TARGET" "$CONFIG" "$TEST" "$WORKFLOW" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Certify frozen authorized execution proof without reexecution
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          grep -F '"status": "EXECUTION_PROVEN_REPOSITORY_CERTIFICATION_CANDIDATE"' "$CONFIG"
          grep -F '"authorizationConsumed": true' "$CONFIG"
          grep -F '"executionEffectAcceptedAsAuthorizedBoundary": true' "$CONFIG"
          grep -F '"singleUse": true' "$CONFIG"
          grep -F '"reusable": false' "$CONFIG"
          grep -F '"reexecutionAllowed": false' "$CONFIG"
          grep -F '"registryLookupAuthority": false' "$CONFIG"
          grep -F '"registryReleaseAuthority": false' "$CONFIG"
          grep -F '"status": "QUARANTINED_NOT_REPOSITORY_CERTIFIED"' config/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.json
          git show "$EXECUTION_PROOF_HEAD:$TARGET" | grep -F 'registry.set(key, storedState);'
          ! grep -E 'registry\.set\(|new Map\(|registerOpaqueContinuationState\(|executeRepositoryOnlyDeterministicSyntheticRegisterAfterQuarantine\(|resolveOpaqueContinuationState\(|releaseOpaqueContinuationState\(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Matrix governance, frozen runtime surfaces, and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_MD)" = "$MATRIX_MD_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_REPORT)" = "$MATRIX_REPORT_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
