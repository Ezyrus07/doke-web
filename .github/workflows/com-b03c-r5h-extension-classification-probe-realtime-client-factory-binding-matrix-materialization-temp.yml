name: COM-B03C R5H Realtime Client Factory Binding Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=30d6daefe41ea72601cfbc2abb6684dd70975364
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-realtime-client-factory.js)" = "6048f2850b2c87871204a6d669300329c2adf204"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-boundary.json)" = "b63b3ed76049332d7c65e3c5f9b3351cb309ae8a"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-boundary.yml)" = "d38be3f7a5578610ec1a20b3ff9c526c5ac6ba47"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed realtime-client-factory binding assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-realtime-client-factory.js)" = "6048f2850b2c87871204a6d669300329c2adf204"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-boundary.json)" = "b63b3ed76049332d7c65e3c5f9b3351cb309ae8a"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-boundary.yml)" = "d38be3f7a5578610ec1a20b3ff9c526c5ac6ba47"
          node - <<'NODE'
          const b=require('./config/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-boundary.json');
          const f=require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-realtime-client-factory.js');
          if(b.contractId!=='com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-boundary-v1')throw new Error('BOUNDARY_DRIFT');
          const x=b.realtimeClientFactoryBinding;
          if(x.realtimeClientFactoryBindingDescriptorDefined!==true||x.realtimeClientFactoryImplementationPresent!==true||x.realtimeClientFactoryBindingDefined!==true||x.realtimeClientFactoryBound!==true||x.localRepositoryBindingOnly!==true)throw new Error('BINDING_DRIFT');
          if(x.freshClientPerObservationContractPreserved!==true||x.clientDisposalAfterEachObservationContractPreserved!==true)throw new Error('LIFECYCLE_CONTRACT_DRIFT');
          for(const k of ['realtimeClientFactory','runtimeClient','networkEndpoint'])if(x[k]!==null)throw new Error(`RUNTIME_VALUE_FORBIDDEN:${k}`);
          for(const k of ['clientInstantiationImplemented','clientDisposalImplemented','credentialReadImplemented','identityLifecycleMutationImplemented','remoteDependencyLoadImplemented','transportBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority'])if(x[k]!==false)throw new Error(`BINDING_AUTHORITY_DRIFT:${k}`);
          const d=f.repositoryDescriptor();
          if(d.realtimeClientFactoryImplementationPresent!==true||d.clientInstantiationImplemented!==false||d.transportBound!==false||d.networkAuthority!==false||d.realtimeSubscriptionAuthority!==false||d.remoteExecutionAuthority!==false)throw new Error('FACTORY_MODULE_DRIFT');
          const g=b.governance;
          for(const k of ['remoteClientInstantiationImplemented','sanitizedEvidenceRecorderBound','cleanupVerifierBound','transportBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'])if(g[k]!==false)throw new Error(`GOVERNANCE_DRIFT:${k}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-realtime-client-factory-binding-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for realtime client factory binding" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
