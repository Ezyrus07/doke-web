name: COM-B02CH Repository-Only Route Resume Dispatcher Post-Carrier Wiring Readiness

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - 'backend/shared/http/repository-only-route-resume-dispatch-post-carrier-wiring-readiness.js'
      - 'config/com-b02ch-repository-only-route-resume-dispatch-post-carrier-wiring-readiness.json'
      - 'scripts/test-com-b02ch-repository-only-route-resume-dispatch-post-carrier-wiring-readiness.js'
      - '.github/workflows/com-b02ch-repository-only-route-resume-dispatch-post-carrier-wiring-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read

jobs:
  certify-post-carrier-resume-wiring-readiness:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: efc2e7a635d975d4cf7958e86bd88ac2c703aaea
      PREDECESSOR_TREE: 1879e8859b43099a73ed910d521d5ad6b581dc48
      PREDECESSOR_RUN_ID: '32738520064'
      PREDECESSOR_JOB_ID: '97467102582'
      TARGET: backend/shared/http/repository-only-route-resume-dispatch-post-carrier-wiring-readiness.js
      TARGET_BLOB: 1906135de39c3cc1ed1f38b137419f1a6702b76e
      CONFIG: config/com-b02ch-repository-only-route-resume-dispatch-post-carrier-wiring-readiness.json
      CONFIG_BLOB: 85fff4c61a12cee61ac3d0f1aee5225b12710daa
      TEST: scripts/test-com-b02ch-repository-only-route-resume-dispatch-post-carrier-wiring-readiness.js
      TEST_BLOB: 8599c569387e2724adb081a5ae3f0b6b2bd37319
      WORKFLOW: .github/workflows/com-b02ch-repository-only-route-resume-dispatch-post-carrier-wiring-readiness.yml
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      B02Z: backend/shared/http/repository-only-route-resume-dispatch-readiness.js
      B02Z_BLOB: b192f58e0ec5639cb1c5d524e5d015dc2699b1ef
      B02AA: backend/shared/http/repository-only-route-continuation-carrier-contract.js
      B02AA_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
      B02X: backend/shared/http/repository-only-route-surface-resolver.js
      B02X_BLOB: 00df5c48a9ac4a72fefde4aa31486fe8ed46ea8c
      B02T: backend/modules/communities/community-command-handler-repository-orchestration.js
      B02T_BLOB: f094ddc01a3f05975794bafb925d64f146a51ea2
      B02CG_TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-resolve-release-execution.js
      B02CG_TARGET_BLOB: 03f40d61423a5f64d30d53483cf393eee605c3c1
      B02CG_CONFIG: config/com-b02cg-repository-only-deterministic-synthetic-continuation-state-register-resolve-release-execution.json
      B02CG_CONFIG_BLOB: ba706830e76d53d5c9fc22a7ba4cf9d86474fa45
      B02CG_WORKFLOW: .github/workflows/com-b02cg-repository-only-deterministic-synthetic-continuation-state-register-resolve-release-execution.yml
      B02CG_WORKFLOW_BLOB: 3a759f4b4c8e6759daf37b6d8a1a136a2a743118
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02CG predecessor, dependencies, and exact final scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$PREDECESSOR_RUN_ID" = '32738520064'
          test "$PREDECESSOR_JOB_ID" = '97467102582'
          expected="$(printf '%s\n' "$TARGET" "$CONFIG" "$TEST" "$WORKFLOW" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"
          test -z "$(find .github/workflows -maxdepth 1 -type f -name '0000-temp-com-b02ch-*' -print -quit)"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$B02Z)" = "$B02Z_BLOB"
          test "$(git rev-parse HEAD:$B02AA)" = "$B02AA_BLOB"
          test "$(git rev-parse HEAD:$B02X)" = "$B02X_BLOB"
          test "$(git rev-parse HEAD:$B02T)" = "$B02T_BLOB"
          test "$(git rev-parse HEAD:$B02CG_TARGET)" = "$B02CG_TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CG_CONFIG)" = "$B02CG_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$B02CG_WORKFLOW)" = "$B02CG_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Certify post-carrier resume wiring readiness without invocation
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          grep -F '"status": "REPOSITORY_CERTIFICATION_CANDIDATE"' "$CONFIG"
          grep -F '"certificationRunId": 32738520064' "$CONFIG"
          grep -F '"certificationJobId": 97467102582' "$CONFIG"
          grep -F '"repositoryOnlyResumeDispatchPostCarrierWiringReadinessAuthority": true' "$CONFIG"
          grep -F '"resumeDispatcherImplementationAuthority": false' "$CONFIG"
          grep -F '"resumeSurfaceInvocationAuthority": false' "$CONFIG"
          grep -F '"continuationStateStorageAuthority": false' "$CONFIG"
          grep -F '"registryOperationInvocationAuthority": false' "$CONFIG"
          grep -F '"networkAuthority": false' "$CONFIG"
          ! grep -E 'resumeRepositoryOnlyCommandHandlerOrchestration[[:space:]]*\(' "$TARGET" "$TEST"
          ! grep -E 'registry\.(set|get|delete)\(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Matrix governance, frozen runtime surfaces, and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
