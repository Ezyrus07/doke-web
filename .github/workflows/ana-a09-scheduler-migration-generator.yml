name: ANA-A09 Scheduler Migration Generator

on:
  push:
    branches:
      - ana/ana-001-foundation
    paths:
      - .github/workflows/ana-a09-scheduler-migration-generator.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'Ezyrus07/doke-web' && github.ref == 'refs/heads/ana/ana-001-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout authorized ANA branch
        uses: actions/checkout@v4
        with:
          ref: ana/ana-001-foundation
          fetch-depth: 2

      - name: Verify authorized source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "77c6ef87b8e773d2031631078169ad0bbc8c1a1c"
          test -z "$(find supabase/migrations -maxdepth 1 -type f -name '*_ana_a09_funnel_scheduler_activation.sql' -print -quit)"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Generate migration with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new ana_a09_funnel_scheduler_activation
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*_ana_a09_funnel_scheduler_activation.sql' -print -quit)"
          test -n "$migration"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration"
          git commit -m "ANA-A09 generate scheduler activation migration via Supabase CLI"
          git push origin HEAD:ana/ana-001-foundation
