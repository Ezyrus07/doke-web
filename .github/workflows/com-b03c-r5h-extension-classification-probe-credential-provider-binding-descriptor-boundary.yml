name: COM-B03C R5H Credential Provider Binding Descriptor Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified target-resource binding lineage
        shell: bash
        run: |
          set -euo pipefail
          parent=e297b7f921c72864471e123a3d628a7f3e2dd3fd
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$parent^{tree}")" = "b66282ed75e1a9d7de72a7c8ea546101e65a02ed"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json)" = "0f711628b6755fe7025687042c0bbde7824dd1cb"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.yml)" = "41f651230e17d55d7c003d0d22e8fb665d5a1dc5"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json)" = "9ad9c4ac7a8863ff54cde18bd898483685346906"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js)" = "27c1e962f0da3dbf2aaf7f122fa79211d5483dc2"

      - name: Exact repository-only materialization scope
        shell: bash
        run: |
          set -euo pipefail
          parent=e297b7f921c72864471e123a3d628a7f3e2dd3fd
          descriptor=config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json
          certifier=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.yml
          initial="$(printf '%s\n' "$certifier" "$descriptor" | sort)"
          final="$(printf '%s\n' "$certifier" "$descriptor" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          if [ "$actual" != "$initial" ] && [ "$actual" != "$final" ]; then
            printf 'Unexpected scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Static descriptor-only no-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          descriptor=config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json
          if grep -En 'https?://|process\.env|secrets\.|@supabase|createClient|\.channel\(|\.subscribe\(|fetch\(|projectRef|projectUrl|apiKey|service_role|anonKey|SUPABASE_' "$descriptor"; then
            echo 'Runtime, endpoint or secret-source syntax is forbidden in credential-provider descriptor boundary' >&2
            exit 1
          fi

      - name: Semantic credential-provider binding descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const descriptor = require('./config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json');
          const parent = require('./config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json');
          const runtimeTarget = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js');
          const wiring = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js');

          const expectedContract = 'com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary-v1';
          const expectedEnvironment = 'doke-web-staging';
          const expectedResource = 'doke-web-staging-realtime-messages-extension-classification-probe';
          const expectedFingerprint = 'sha256:2ab84b52b269ef4c9556c9818f4355d466bce9f735878213b49d9840cdd00fbf';
          const expectedFields = ['providerContractId','providerModulePath','providerModuleBlob','bindingBoundaryHead'];

          if (descriptor.contractId !== expectedContract) throw new Error('DESCRIPTOR_CONTRACT_DRIFT');
          if (descriptor.repositoryContext.parentCertifiedTargetResourceBindingHead !== 'e297b7f921c72864471e123a3d628a7f3e2dd3fd') throw new Error('PARENT_HEAD_DRIFT');
          if (descriptor.repositoryContext.parentCertifiedTargetResourceBindingTree !== 'b66282ed75e1a9d7de72a7c8ea546101e65a02ed') throw new Error('PARENT_TREE_DRIFT');
          if (descriptor.repositoryContext.parentTargetResourceBindingCertificationRun !== 31956883300 || descriptor.repositoryContext.parentTargetResourceBindingCertificationJob !== 95188760690) throw new Error('PARENT_CERTIFICATION_DRIFT');
          if (descriptor.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || descriptor.functionalCheckpoint.r5iCreated !== false || descriptor.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          if (!runtimeTarget.DEPENDENT_PORTS.includes('credential_provider')) throw new Error('RUNTIME_TARGET_CREDENTIAL_PROVIDER_PORT_MISSING');
          const wiringPort = wiring.PORT_CONTRACTS.find(x => x.id === 'credential_provider');
          if (!wiringPort || wiringPort.responsibility !== 'future_credential_provider_binding') throw new Error('WIRING_CREDENTIAL_PROVIDER_PORT_DRIFT');

          const parentBinding = parent.targetResourceBinding;
          if (parentBinding.targetResourceBindingDefined !== true || parentBinding.targetResourceBound !== true) throw new Error('PARENT_TARGET_RESOURCE_BINDING_MISSING');
          if (parentBinding.stableResourceIdentifier !== expectedResource || parentBinding.targetEnvironmentStableIdentifier !== expectedEnvironment || parentBinding.resourceScopeFingerprint !== expectedFingerprint) throw new Error('PARENT_TARGET_RESOURCE_IDENTITY_DRIFT');
          if (parentBinding.transportBound !== false || parentBinding.credentialProviderBound !== false || parentBinding.stagingReadAuthority !== false || parentBinding.stagingMutationAuthority !== false || parentBinding.networkAuthority !== false || parentBinding.remoteExecutionAuthority !== false) throw new Error('PARENT_REMOTE_AUTHORITY_DRIFT');

          const canonical = descriptor.canonicalCredentialProviderSchema;
          if (canonical.slotId !== 'credential_provider' || canonical.schemaOrigin !== 'repository_owned_dependent_port_contract') throw new Error('CANONICAL_CREDENTIAL_PROVIDER_SCHEMA_DRIFT');
          if (canonical.requiredFields.join('|') !== expectedFields.join('|')) throw new Error('CREDENTIAL_PROVIDER_REQUIRED_FIELDS_DRIFT');
          const constraints = canonical.constraints;
          if (constraints.repositoryOwnedModuleRequired !== true || constraints.repositoryRelativeModulePathRequired !== true || constraints.immutableModuleBlobRequired !== true || constraints.separateCertifiedBindingBoundaryRequired !== true || constraints.secretNameForbiddenInBindingBoundary !== true || constraints.credentialMaterialForbiddenInBindingBoundary !== true || constraints.credentialReadForbiddenInBindingBoundary !== true || constraints.processEnvironmentReadForbiddenInBindingBoundary !== true || constraints.remoteDependencyImportForbiddenInBindingBoundary !== true) throw new Error('CREDENTIAL_PROVIDER_CONSTRAINT_DRIFT');

          const binding = descriptor.credentialProviderBindingDescriptor;
          if (binding.slotId !== 'credential_provider' || binding.credentialProviderBindingDescriptorDefined !== true || binding.schemaOnly !== true) throw new Error('CREDENTIAL_PROVIDER_DESCRIPTOR_NOT_DEFINED');
          if (binding.credentialProviderBindingDefined !== false || binding.credentialProviderBound !== false || binding.transportBound !== false) throw new Error('CREDENTIAL_PROVIDER_MUST_REMAIN_UNBOUND');
          if (binding.requiredFields.join('|') !== expectedFields.join('|') || binding.repositoryOwnedModuleRequired !== true || binding.repositoryRelativeModulePathRequired !== true || binding.immutableModuleBlobRequired !== true) throw new Error('CREDENTIAL_PROVIDER_DESCRIPTOR_SCHEMA_DRIFT');
          for (const key of ['providerContractId','providerModulePath','providerModuleBlob','bindingBoundaryHead','credentialSecretName','credentialReference','credentialMaterial']) {
            if (binding[key] !== null) throw new Error(`CONCRETE_CREDENTIAL_PROVIDER_MUST_REMAIN_NULL:${key}`);
          }
          if (binding.futureBindingBoundaryMustBeSeparateCertifiedBoundary !== true || binding.futureBindingBoundaryMayBindOnlyCredentialProviderSlot !== true || binding.futureBindingBoundaryMustProvideRepositoryOwnedModuleContract !== true || binding.futureBindingBoundaryMustProvideRepositoryRelativeModulePath !== true || binding.futureBindingBoundaryMustProvideImmutableModuleBlob !== true || binding.futureBindingBoundaryMustPreserveRuntimeAdapterBinding !== true || binding.futureBindingBoundaryMustPreserveTargetEnvironmentBinding !== true || binding.futureBindingBoundaryMustPreserveTargetResourceBinding !== true) throw new Error('FUTURE_CREDENTIAL_PROVIDER_BINDING_STRUCTURE_DRIFT');
          for (const key of ['futureBindingBoundaryMayNotIntroduceSecretName','futureBindingBoundaryMayNotIntroduceCredentialReference','futureBindingBoundaryMayNotIntroduceCredentialMaterial','futureBindingBoundaryMayNotReadCredential','futureBindingBoundaryMayNotReadProcessEnvironment','futureBindingBoundaryMayNotImportRemoteDependency','futureBindingBoundaryMayNotBindIdentityLifecycle','futureBindingBoundaryMayNotBindRealtimeClientFactory','futureBindingBoundaryMayNotBindEvidenceRecorder','futureBindingBoundaryMayNotBindCleanupVerifier','futureBindingBoundaryMayNotIntroduceEndpoint','futureBindingBoundaryMayNotBindTransport','futureBindingBoundaryMayNotGrantStagingReadAuthority','futureBindingBoundaryMayNotGrantStagingMutationAuthority','futureBindingBoundaryMayNotGrantNetworkAuthority','futureBindingBoundaryMayNotGrantRemoteExecutionAuthority']) {
            if (binding[key] !== true) throw new Error(`FUTURE_CREDENTIAL_PROVIDER_FAIL_CLOSED_DRIFT:${key}`);
          }

          const upstream = descriptor.upstreamBindingState;
          if (!upstream.runtimeAdapter || upstream.runtimeAdapter.bound !== true || upstream.runtimeAdapter.bindingBoundaryHead !== 'e2809ba029930eac76729c9ae5f1496919a500de') throw new Error('UPSTREAM_RUNTIME_ADAPTER_DRIFT');
          if (!upstream.targetEnvironment || upstream.targetEnvironment.bound !== true || upstream.targetEnvironment.bindingBoundaryHead !== '10ddea2bb7a4ded9bf1b7654585092a396f885cb' || upstream.targetEnvironment.stableEnvironmentIdentifier !== expectedEnvironment || upstream.targetEnvironment.production !== false) throw new Error('UPSTREAM_TARGET_ENVIRONMENT_DRIFT');
          if (!upstream.targetResource || upstream.targetResource.bound !== true || upstream.targetResource.bindingBoundaryHead !== 'e297b7f921c72864471e123a3d628a7f3e2dd3fd' || upstream.targetResource.stableResourceIdentifier !== expectedResource || upstream.targetResource.resourceScopeFingerprint !== expectedFingerprint) throw new Error('UPSTREAM_TARGET_RESOURCE_DRIFT');

          const expectedSlots = ['credential_provider','synthetic_identity_lifecycle','realtime_client_factory','sanitized_evidence_recorder','cleanup_verifier'];
          if (descriptor.dependentPortState.map(x => x.slotId).join('|') !== expectedSlots.join('|')) throw new Error('DEPENDENT_PORT_SET_DRIFT');
          for (const slot of descriptor.dependentPortState) {
            if (slot.bound !== false || slot.concreteValuePresent !== false || slot.separateCertifiedBindingBoundaryRequired !== true) throw new Error(`DEPENDENT_PORT_MUST_REMAIN_UNBOUND:${slot.slotId}`);
          }
          if (descriptor.dependentPortState[0].descriptorDefined !== true) throw new Error('CREDENTIAL_PROVIDER_DESCRIPTOR_FLAG_MISSING');
          for (const slot of descriptor.dependentPortState.slice(1)) if (slot.descriptorDefined !== false) throw new Error(`UNAUTHORIZED_DEPENDENT_DESCRIPTOR:${slot.slotId}`);

          const concrete = descriptor.concreteBindingState;
          if (!concrete.runtimeAdapter || !concrete.targetEnvironment || !concrete.targetResource) throw new Error('UPSTREAM_CONCRETE_BINDINGS_MUST_BE_PRESERVED');
          const forbiddenConcrete = ['credentialProvider','credentialSecretName','credentialReference','credentialMaterial','syntheticIdentity','realtimeClientFactory','sanitizedEvidenceRecorder','cleanupVerifier','networkEndpoint','executionCommand','executionWorkflow','executionEntrypoint'];
          for (const key of forbiddenConcrete) if (concrete[key] !== null) throw new Error(`FORBIDDEN_CONCRETE_BINDING:${key}`);

          const future = descriptor.futureCredentialProviderBindingBoundaryRequirements;
          if (future.repositoryOnlyBoundaryRequired !== true || future.exactDescriptorCertifiedHeadRequired !== true || future.credentialProviderSlotOnly !== true || future.requiredFieldsMustRemainExact !== true || future.repositoryOwnedModuleRequired !== true || future.repositoryRelativeModulePathRequired !== true || future.immutableModuleBlobRequired !== true || future.runtimeAdapterBindingMustRemainExact !== true || future.targetEnvironmentBindingMustRemainExact !== true || future.targetResourceBindingMustRemainExact !== true) throw new Error('FUTURE_CREDENTIAL_PROVIDER_SCOPE_DRIFT');
          if (future.exactTargetEnvironmentStableIdentifier !== expectedEnvironment || future.exactTargetResourceStableIdentifier !== expectedResource || future.exactTargetResourceScopeFingerprint !== expectedFingerprint) throw new Error('FUTURE_CREDENTIAL_PROVIDER_TARGET_DRIFT');
          const futureTrueKeys = ['secretNameMustRemainAbsent','credentialReferenceMustRemainAbsent','credentialMaterialMustRemainAbsent','credentialReadAuthorityMustRemainFalse','processEnvironmentReadMustRemainAbsent','remoteDependencyLoadAuthorityMustRemainFalse','identityLifecycleMustRemainUnbound','realtimeClientFactoryMustRemainUnbound','sanitizedEvidenceRecorderMustRemainUnbound','cleanupVerifierMustRemainUnbound','endpointMustRemainAbsent','transportMustRemainUnbound','stagingReadAuthorityMustRemainFalse','stagingMutationAuthorityMustRemainFalse','networkAuthorityMustRemainFalse','executionEntrypointMustRemainAbsent','executionWorkflowMustRemainAbsent','remoteExecutionAuthorityMustRemainFalse'];
          for (const key of futureTrueKeys) if (future[key] !== true) throw new Error(`FUTURE_CREDENTIAL_PROVIDER_AUTHORITY_DRIFT:${key}`);

          const auth = descriptor.authorizationState;
          if (auth.genericContinuationGrantsRemoteAuthority !== false || auth.priorR5dAuthorizationReusable !== false || auth.priorR5dReceiptReusable !== false || auth.priorR5dTriggerReusable !== false) throw new Error('AUTHORIZATION_REUSE_DRIFT');
          const causal = descriptor.causalState;
          if (causal.exactRootCauseProven !== false || causal.causalPromotionAllowed !== false || causal.privatePresencePromotionAllowed !== false || causal.privateTypingBroadcastProven !== false || causal.channelMessagesCanonicalRemoteAuthority !== false) throw new Error('CAUSAL_STATE_DRIFT');

          const g = descriptor.governance;
          const trueKeys = ['repositoryOnlyDefinition','runtimeAdapterBindingDefined','runtimeAdapterBound','targetEnvironmentBindingDescriptorDefined','targetEnvironmentBindingDefined','targetEnvironmentBound','targetResourceBindingDescriptorDefined','targetResourceBindingDefined','targetResourceBound','credentialProviderBindingDescriptorDefined'];
          for (const key of trueKeys) if (g[key] !== true) throw new Error(`GOVERNANCE_MUST_BE_TRUE:${key}`);
          const falseKeys = ['credentialProviderBindingDefined','credentialProviderBound','transportBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority'];
          for (const key of falseKeys) if (g[key] !== false) throw new Error(`GOVERNANCE_MUST_REMAIN_FALSE:${key}`);
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check e297b7f921c72864471e123a3d628a7f3e2dd3fd HEAD
