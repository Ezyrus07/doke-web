name: COM-B03C R5H Synthetic Identity Lifecycle Descriptor Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "77665ad87ae8bcc49c523cff07706c54f0ebae68"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json)" = "37be2271a1413696729b6c80fce7127265bd25b6"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.yml)" = "cbf61470e9cc7a04e4546663397edc8f64058296"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed synthetic identity lifecycle descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json)" = "37be2271a1413696729b6c80fce7127265bd25b6"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.yml)" = "cbf61470e9cc7a04e4546663397edc8f64058296"
          node - <<'NODE'
          const d = require('./config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json');
          const b = d.syntheticIdentityLifecycleBindingDescriptor;
          if (d.contractId !== 'com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary-v1') throw new Error('CONTRACT_DRIFT');
          if (d.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || d.functionalCheckpoint.r5iCreated !== false || d.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (b.syntheticIdentityLifecycleBindingDescriptorDefined !== true || b.syntheticIdentityLifecycleBindingDefined !== false || b.identityLifecycleBound !== false || b.schemaOnly !== true) throw new Error('DESCRIPTOR_STATE_DRIFT');
          if (b.identityProvisioningImplemented !== false || b.identityDeletionImplemented !== false || b.transportBound !== false) throw new Error('IDENTITY_RUNTIME_FORBIDDEN');
          for (const key of ['lifecycleContractId','lifecycleModulePath','lifecycleModuleBlob','bindingBoundaryHead','syntheticIdentityReference','syntheticIdentityMaterial','syntheticIdentity']) if (b[key] !== null) throw new Error(`IDENTITY_VALUE_FORBIDDEN:${key}`);
          for (const [key,value] of Object.entries(d.concreteState)) if (value !== null) throw new Error(`CONCRETE_STATE_FORBIDDEN:${key}`);
          const cp = d.upstreamBindings.credentialProvider;
          if (cp.bound !== true || cp.bindingBoundaryHead !== '8ebf9cce39ded220df4a361b82145884041048bb' || cp.providerModuleBlob !== '6419696544fb9e1906df92e3591e93efcf04b826' || cp.credentialReadImplemented !== false) throw new Error('UPSTREAM_PROVIDER_DRIFT');
          const g = d.governance;
          for (const key of ['syntheticIdentityLifecycleBindingDefined','identityLifecycleBound','identityProvisioningImplemented','identityDeletionImplemented','transportBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) if (g[key] !== false) throw new Error(`AUTHORITY_MUST_REMAIN_FALSE:${key}`);
          const c = d.causalState;
          for (const key of ['exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred']) if (c[key] !== false) throw new Error(`CAUSAL_STATE_DRIFT:${key}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for synthetic identity lifecycle descriptor" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
