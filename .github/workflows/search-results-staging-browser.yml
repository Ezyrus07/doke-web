name: Doke SEARCH-A10 Browser Cutover V2

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - 'assets/js/core/supabase-config.js'
      - 'assets/js/repositories/search-repository.js'
      - 'assets/js/services/search-service.js'
      - 'assets/js/pages/search/server-results-surface.js'
      - 'assets/js/pages/search-results.js'
      - 'assets/js/pages/resultados-data-controller.js'
      - 'assets/js/controllers/controller-data.js'
      - 'assets/css/pages/search-results.css'
      - 'resultados.html'
      - 'scripts/audit-search-results-server-activation.js'
      - 'scripts/audit-search-browser-cutover-v2.js'
      - 'scripts/test-search-browser-cutover-runtime.js'
      - 'tests/search/search-results-staging.spec.js'
      - '.github/workflows/search-results-staging-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-search-a10-browser-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staging-browser-cutover:
    name: SEARCH-A10 Edge v2 and RPC v1 rollback browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit SEARCH-A01 authority baseline
        run: node scripts/audit-search-authority-baseline.js

      - name: Audit SEARCH-A02 favorites authority
        run: node scripts/audit-favorites-authority-retirement.js

      - name: Test SEARCH-A02 favorites runtime
        run: node scripts/test-favorites-authority-retirement-runtime.js

      - name: Audit SEARCH-A03 favorite surfaces
        run: node scripts/audit-service-favorites-surfaces.js

      - name: Test SEARCH-A03 favorite surfaces runtime
        run: node scripts/test-service-favorites-controller-runtime.js

      - name: Audit SEARCH-A04 server search contract
        run: node scripts/audit-search-server-contract.js

      - name: Test SEARCH-A04 server contract runtime
        run: node scripts/test-search-server-contract-runtime.js

      - name: Audit SEARCH-A05 server results activation
        run: node scripts/audit-search-results-server-activation.js

      - name: Test SEARCH-A05 server results runtime
        run: node scripts/test-search-results-server-surface-runtime.js

      - name: Audit SEARCH-A06 ranking signal baseline
        run: node scripts/audit-search-ranking-signal-baseline.js

      - name: Audit SEARCH-A07 ranking v1 contract
        run: node scripts/audit-search-ranking-v1.js

      - name: Test SEARCH-A07 ranking v1 runtime
        run: node scripts/test-search-ranking-v1-runtime.js

      - name: Audit SEARCH-A08 ranked RPC v2 contract
        run: node scripts/audit-search-ranked-rpc-v2.js

      - name: Test SEARCH-A08 ranked RPC v2 runtime
        run: node scripts/test-search-ranked-rpc-v2-runtime.js

      - name: Audit SEARCH-A09 observability contract
        run: node scripts/audit-search-observability-v2.js

      - name: Test SEARCH-A09 observability runtime
        run: node scripts/test-search-observability-v2-runtime.mjs

      - name: Audit SEARCH-A10 browser cutover
        run: node scripts/audit-search-browser-cutover-v2.js

      - name: Test SEARCH-A10 browser transport runtime
        run: node scripts/test-search-browser-cutover-runtime.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run SEARCH-A10 staging browser authority tests
        run: node node_modules/@playwright/test/cli.js test tests/search/search-results-staging.spec.js --workers=1

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Upload staging browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-search-a10-staging-browser-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
