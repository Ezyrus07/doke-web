name: COM-B02AA Domain Completion Matrix Materialization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02aa-domain-completion-matrix-materialization-temp.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02aa-domain-completion-matrix-materialization-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT_HEAD: a406d618749aca3c7281e032962e8c7abc8a7710
  EXPECTED_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
  EXPECTED_B02AA_CONTRACT_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
  EXPECTED_B02AA_CONFIG_BLOB: cd0bb4a13f44a4465d3163fb63692732ac10bd3a
  EXPECTED_B02AA_TEST_BLOB: 57fe6c92012ad5fcbe98713a000ba33b4fd17731
  EXPECTED_B02AA_CERTIFIER_BLOB: 7f9a67841ffe5f7cd1bade37d13f281c7a4c585a

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate and prove exact B02AA derivatives
        shell: bash
        run: |
          set -euo pipefail
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'
          TEMP='.github/workflows/com-b02aa-domain-completion-matrix-materialization-temp.yml'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-carrier-contract.js)" = "$EXPECTED_B02AA_CONTRACT_BLOB"
          test "$(git rev-parse HEAD:config/com-b02aa-repository-only-opaque-continuation-carrier-contract.json)" = "$EXPECTED_B02AA_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js)" = "$EXPECTED_B02AA_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml)" = "$EXPECTED_B02AA_CERTIFIER_BLOB"

          rm "$TEMP"
          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json

          node scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js
          npm ci --ignore-scripts
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$TEMP" \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"

          echo "MARKDOWN_BLOB=$(git hash-object docs/DOMAIN-COMPLETION-MATRIX.md)"
          echo "REPORT_BLOB=$(git hash-object reports/generated/domain-completion-matrix-report.json)"
          echo "SOURCE_BLOB=$(git rev-parse HEAD:config/domain-completion-matrix.json)"
          echo 'COM-B02AA_MATRIX_MATERIALIZATION=PASS'
