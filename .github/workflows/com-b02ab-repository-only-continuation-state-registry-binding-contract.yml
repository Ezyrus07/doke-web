name: COM-B02AB Repository-Only Continuation State Registry Binding Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js'
      - 'config/com-b02ab-repository-only-continuation-state-registry-binding-contract.json'
      - 'scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js'
      - '.github/workflows/com-b02ab-repository-only-continuation-state-registry-binding-contract.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: com-b02ab-domain-completion-matrix-finalization-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: 782bb6fd5b7aa170c5a2a4404f43264fab7d8f4f
  B02AA_BASE: d77aceca20588f42f8594f9897e3ae9e12649990
  EXPECTED_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
  EXPECTED_MODULE_BLOB: 5cd04d4a72f0b728cb78ef8dd41f4f8b6a5efa6e
  EXPECTED_CONFIG_BLOB: 0274e5a998982b257bc0a6ba4072142c3785ebc8
  EXPECTED_TEST_BLOB: c882494fa36d7c2b60aa79ec695df7cf415b6777
  CANONICAL_CERTIFIER_BLOB: 555f2342c91f1295320b7da2370dcf5325dd1460

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate exact B02AB derivatives and prepare final snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='com/com-001-baseline-audit'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'
          CERT='.github/workflows/com-b02ab-repository-only-continuation-state-registry-binding-contract.yml'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js)" = "$EXPECTED_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02ab-repository-only-continuation-state-registry-binding-contract.json)" = "$EXPECTED_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js)" = "$EXPECTED_TEST_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"

          git show "$CANDIDATE_HEAD:$CERT" > "$CERT"
          test "$(git hash-object "$CERT")" = "$CANONICAL_CERTIFIER_BLOB"

          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json
          node scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js
          npm ci --ignore-scripts
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$CERT" \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"
          test "$(git hash-object "$CERT")" = "$CANONICAL_CERTIFIER_BLOB"

          echo "MARKDOWN_BLOB=$(git hash-object docs/DOMAIN-COMPLETION-MATRIX.md)"
          echo "REPORT_BLOB=$(git hash-object reports/generated/domain-completion-matrix-report.json)"

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add "$CERT" docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'docs(com): reconcile B02AB Domain Completion Matrix derivatives'

          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02ab-repository-only-continuation-state-registry-binding-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js \
            config/com-b02ab-repository-only-continuation-state-registry-binding-contract.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js | sort)"
          actual_final="$(git diff --name-only "$B02AA_BASE" HEAD | sort)"
          test "$actual_final" = "$expected_final"

          echo "PREPARED_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "PREPARED_FINAL_TREE=$(git rev-parse HEAD^{tree})"

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"refs/heads/$BRANCH"
