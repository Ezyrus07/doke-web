name: COM-B02AB Repository-Only Continuation State Registry Binding Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js'
      - 'config/com-b02ab-repository-only-continuation-state-registry-binding-contract.json'
      - 'scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js'
      - '.github/workflows/com-b02ab-repository-only-continuation-state-registry-binding-contract.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02ab-repository-only-continuation-state-registry-binding-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02AA predecessor and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d77aceca20588f42f8594f9897e3ae9e12649990
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-carrier-contract.js)" = "fb7448f83fe385e94a2be61685f612d9e27d949f"
          test "$(git rev-parse HEAD:config/com-b02aa-repository-only-opaque-continuation-carrier-contract.json)" = "cd0bb4a13f44a4465d3163fb63692732ac10bd3a"
          test "$(git rev-parse HEAD:.github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml)" = "7f9a67841ffe5f7cd1bade37d13f281c7a4c585a"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:backend/runtime/staging/staging-api-runtime.js)" = "69de100fe3a269507a0da7847ae8e9887f831ceb"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02ab-repository-only-continuation-state-registry-binding-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js \
            config/com-b02ab-repository-only-continuation-state-registry-binding-contract.json \
            scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js | sort)"
          expected_reconciled="$(printf '%s\n' \
            .github/workflows/com-b02ab-repository-only-continuation-state-registry-binding-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js \
            config/com-b02ab-repository-only-continuation-state-registry-binding-contract.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected" || test "$actual" = "$expected_reconciled"

      - name: Syntax and semantic registry-binding contract conformance
        run: |
          node --check backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js
          node --check scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js
          node scripts/test-com-b02ab-repository-only-continuation-state-registry-binding-contract.js

      - name: Registry binding remains contract-only and remote effects remain blocked
        shell: bash
        run: |
          set -euo pipefail
          FILE=backend/shared/http/repository-only-route-continuation-state-registry-binding-contract.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$FILE"
          ! grep -E 'registerOpaqueContinuationState\(|resolveOpaqueContinuationState\(|releaseOpaqueContinuationState\(' "$FILE"
          ! grep -E 'resumeRepositoryOnlyCommandHandlerOrchestration\(|\.resumeSurface\(|resolution\.resumeSurface\(' "$FILE"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$FILE"
          ! grep -F 'repository-only-route-continuation-state-registry-binding-contract' backend/runtime/staging/staging-api-runtime.js
          grep -F "const { getHandler } = require('../../shared/http/module-route-loader');" backend/runtime/staging/staging-api-runtime.js

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=d77aceca20588f42f8594f9897e3ae9e12649990
          git diff --check "$BASE" HEAD
