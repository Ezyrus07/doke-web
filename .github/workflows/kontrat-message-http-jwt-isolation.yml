name: Kontrat Messaging HTTP JWT Isolation

on:
  pull_request:
    paths:
      - '.github/workflows/kontrat-message-http-jwt-isolation.yml'
      - 'scripts/test-msg-http-jwt-postgrest-ci.sh'
      - 'scripts/test-msg-http-jwt-postgrest.mjs'
      - 'scripts/fixtures/msg-http-jwt-postgrest-setup.sql'
      - 'scripts/fixtures/msg-staging-catalog-derived-baseline.sql'
      - 'supabase/migrations/20260802220000_msg_a05_transaction_attachment_lifecycle_contract.sql'
      - 'supabase/migrations/*message_update_authority_guard.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgrest-http-jwt:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: msg_http_jwt_ci
          POSTGRES_USER: kontrat_sandbox
          POSTGRES_PASSWORD: synthetic-only-postgres-http-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U kontrat_sandbox -d msg_http_jwt_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: kontrat_sandbox
      PGDATABASE: msg_http_jwt_ci
      PGPASSWORD: synthetic-only-postgres-http-ci
      JWT_TEST_SECRET: synthetic-jwt-secret-msg-http-2026-please-never-reuse
      RUN_SYNTHETIC_HTTP_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Check HTTP regression sources
        run: |
          node --check scripts/test-msg-http-jwt-postgrest.mjs
          bash -n scripts/test-msg-http-jwt-postgrest-ci.sh
          node scripts/generate-msg-staging-catalog-fixture.js --check
      - name: Real local PostgREST HTTP with synthetic signed JWTs
        run: bash scripts/test-msg-http-jwt-postgrest-ci.sh
