name: Doke SEARCH-A09 Domain Matrix Sync

on:
  push:
    branches:
      - 'search/search-001-baseline-audit'
    paths:
      - '.github/workflows/search-a09-sync-domain-matrix.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: doke-search-a09-domain-matrix-sync
  cancel-in-progress: false

jobs:
  sync-domain-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: search/search-001-baseline-audit
          fetch-depth: 0

      - name: Download verified generated matrix artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8721231360'
          EXPECTED_ARTIFACT_SHA256: '99b2f1612e33596651ab40087cd65095fb8585b0d0e964a90d7575595c3524dc'
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/domain-matrix.zip
          echo "${EXPECTED_ARTIFACT_SHA256}  /tmp/domain-matrix.zip" | sha256sum --check --strict
          rm -rf /tmp/domain-matrix
          mkdir -p /tmp/domain-matrix
          unzip -q /tmp/domain-matrix.zip -d /tmp/domain-matrix
          test -s /tmp/domain-matrix/docs/DOMAIN-COMPLETION-MATRIX.md
          cp /tmp/domain-matrix/docs/DOMAIN-COMPLETION-MATRIX.md docs/DOMAIN-COMPLETION-MATRIX.md

      - name: Validate generated matrix
        run: node scripts/audit-domain-completion-matrix.js

      - name: Remove temporary sync workflow
        run: rm -f .github/workflows/search-a09-sync-domain-matrix.yml

      - name: Commit synchronized matrix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md .github/workflows/search-a09-sync-domain-matrix.yml
          git diff --cached --check
          git commit -m 'Synchronize SEARCH-A09 domain matrix evidence'
          git push origin HEAD:search/search-001-baseline-audit
