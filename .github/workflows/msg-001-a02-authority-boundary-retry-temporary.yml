name: Doke Temporary MSG-A02 Authority Boundary Retry

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a02-authority-boundary-retry-temporary.yml'

permissions:
  contents: write

concurrency:
  group: msg-001-a02-authority-boundary-retry
  cancel-in-progress: false

jobs:
  apply:
    if: github.run_number == 1 && github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 20

      - name: Require immutable stacked ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 79aeed2f63d7436f13f2a49109f2650f1a985a39 HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Extract, scope and run frozen A02 generator
        run: |
          awk '/^[[:space:]]*node <<'"'"'NODE'"'"'$/ {capture=1; next} /^[[:space:]]*NODE$/ && capture {exit} capture {sub(/^          /, ""); print}' \
            .github/workflows/msg-001-a02-authority-boundary-apply-temporary.yml \
            > /tmp/msg-a02-generate.js
          test -s /tmp/msg-a02-generate.js
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const file = '/tmp/msg-a02-generate.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = "            if (count !== 1) throw new Error(label + ': expected one match, found ' + count);\n            return source.replace(before, after);";
          const after = "            if (label === 'fixture cache authority' && count === 2) return source.replace(before, after);\n            if (count !== 1) throw new Error(label + ': expected one match, found ' + count);\n            return source.replace(before, after);";
          if (!source.includes(before)) throw new Error('replaceOnce helper marker missing');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
          node /tmp/msg-a02-generate.js
          npm run write:domain-completion-matrix

      - name: Validate MSG-A02 and cumulative contracts
        run: |
          node --check assets/js/repositories/messages-repository.js
          node --check scripts/audit-msg-001-a01-authority-baseline.js
          node --check scripts/audit-msg-001-a02-canonical-authority-boundary.js
          node --check scripts/test-msg-001-a02-canonical-authority-boundary.js
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run test:messages-supabase-repository-contract
          npm run test:attachments-supabase-repository-contract
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage only non-workflow canonical artifacts
        run: |
          git add \
            assets/js/repositories/messages-repository.js \
            config/msg-001-a02-canonical-authority-boundary.json \
            docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md \
            scripts/audit-msg-001-a01-authority-baseline.js \
            scripts/audit-msg-001-a02-canonical-authority-boundary.js \
            scripts/test-msg-001-a02-canonical-authority-boundary.js \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f \
            docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json \
            reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              assets/js/repositories/messages-repository.js|config/msg-001-a02-canonical-authority-boundary.json|docs/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.md|docs/validation/MSG-001-A02-CANONICAL-AUTHORITY-BOUNDARY.json|scripts/audit-msg-001-a01-authority-baseline.js|scripts/audit-msg-001-a02-canonical-authority-boundary.js|scripts/test-msg-001-a02-canonical-authority-boundary.js|package.json|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish MSG-A02 domain artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(msg): enforce canonical messaging authority split"
          git push origin HEAD:msg/msg-001-baseline-audit
