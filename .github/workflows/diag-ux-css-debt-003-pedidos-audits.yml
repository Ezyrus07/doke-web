name: Doke UX-CSS-DEBT-003 Pedidos Audits

on:
  push:
    branches:
      - diag/ux-css-debt-003-readiness

permissions:
  contents: read

jobs:
  audits:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 06dbac77dcdd8e2896744868eb40fd7031ad95cb
      TARGET_FILE: assets/css/pages/pedidos/orders-command-center.css
      EXPECTED_CANDIDATE_SHA256: 9ecb1e63fb2baa5e1ca0d1502acad4ec0910563cc5e162086eb462f1bb82f2e3
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git diff --exit-code

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build exact deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const file=process.env.TARGET_FILE;
          const text=fs.readFileSync(file,'utf8');
          const lines=text.split(/\r?\n/);
          let depth=0,selectorParts=[],selector=null;
          const declarations=[],blockStack=[];
          const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*(!important)?\s*;\s*$/;
          for(let i=0;i<lines.length;i++){
            const line=lines[i],trimmed=line.trim();
            const opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector&&trimmed&&!trimmed.startsWith('/*')&&!trimmed.startsWith('*')&&trimmed!=='*/'&&trimmed!=='}'){
              if(trimmed.startsWith('@')&&line.includes('{')) blockStack.push({type:'at',header:trimmed.replace(/\{\s*$/,'').replace(/\s+/g,' ').trim(),depthBefore:depth});
              else if(!trimmed.startsWith('@')&&!trimmed.includes(':')&&!line.includes(';')){
                selectorParts.push(trimmed.replace(/\{\s*$/,'').trim());
                if(line.includes('{')){selector=selectorParts.join(' ').replace(/\s+/g,' ').trim();selectorParts=[];blockStack.push({type:'rule',selector,depthBefore:depth});}
              }
            }
            if(selector){const m=line.match(declRe);if(m){const context=blockStack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1],important:Boolean(m[3]),context});}}
            depth+=opens-closes;
            while(blockStack.length&&depth<=blockStack[blockStack.length-1].depthBefore){const p=blockStack.pop();if(p.type==='rule')selector=null;}
          }
          const dead=[];
          for(let i=0;i<declarations.length;i++){
            const cur=declarations[i];
            const later=declarations.slice(i+1).find(x=>x.selector===cur.selector&&x.property===cur.property&&x.context===cur.context&&(!cur.important||x.important));
            if(later)dead.push(cur);
          }
          const deadLines=new Set(dead.map(x=>x.lineIndex));
          const candidate=lines.filter((_l,i)=>!deadLines.has(i)).join('\n');
          const sha=crypto.createHash('sha256').update(candidate).digest('hex');
          if(declarations.length!==2367) throw new Error(`declaration drift ${declarations.length}`);
          if(dead.length!==596) throw new Error(`dead drift ${dead.length}`);
          if(sha!==process.env.EXPECTED_CANDIDATE_SHA256) throw new Error(`candidate sha drift ${sha}`);
          fs.writeFileSync('/tmp/orders-parent.css',text);
          fs.writeFileSync('/tmp/orders-candidate.css',candidate);
          console.log(`candidate=${sha}`);
          console.log(`declarations=${declarations.length}->${declarations.length-dead.length}`);
          console.log(`bytes=${Buffer.byteLength(text)}->${Buffer.byteLength(candidate)}`);
          NODE

      - name: Write agenda visibility snapshot helper
        shell: bash
        run: |
          cat > /tmp/orders-agenda-snapshot.js <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2];
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:['ignore','pipe','pipe'],env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          async function main(){
            await sleep(700);
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1280,height:802}});
            await page.addInitScript(()=>{
              const user={id:'client_test',role:'client',name:'Cliente Teste'};
              const orders=[
                {id:'order_client_1',clientId:user.id,professionalId:'professional_1',providerName:'Studio Aquarela',serviceTitle:'Pintura comercial',status:'pending',createdAt:'2026-06-28T10:00:00.000Z'},
                {id:'order_client_2',clientId:user.id,professionalId:'professional_1',providerName:'Studio Aquarela',serviceTitle:'Textura e acabamento',status:'pending',createdAt:'2026-06-27T10:00:00.000Z'}
              ];
              localStorage.setItem('doke.auth.session.v1',JSON.stringify({user}));
              localStorage.setItem('doke.orders.local.v1',JSON.stringify(orders));
              localStorage.setItem('doke.orders',JSON.stringify(orders));
            });
            await page.goto('http://127.0.0.1:5500/pedidos.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.body.dataset.ordersAudience==='client',{timeout:10000});
            await page.waitForFunction(()=>document.querySelectorAll('.orders-list .order-card:not([hidden])').length===2,{timeout:10000});
            const state=await page.evaluate(()=>([...document.querySelectorAll('[data-orders-agenda-toggle]')].map(node=>{const cs=getComputedStyle(node),r=node.getBoundingClientRect();return {tag:node.tagName,className:node.className||'',hidden:node.hidden,display:cs.display,visibility:cs.visibility,ariaHidden:node.getAttribute('aria-hidden'),rect:{x:+r.x.toFixed(3),y:+r.y.toFixed(3),width:+r.width.toFixed(3),height:+r.height.toFixed(3)}};})));
            fs.writeFileSync(out,JSON.stringify(state,null,2));
            console.log(JSON.stringify(state));
            await browser.close();
          }
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Capture parent agenda visibility baseline
        run: node /tmp/orders-agenda-snapshot.js /tmp/orders-agenda-parent.json

      - name: Apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/orders-candidate.css "${TARGET_FILE}"
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "596"
          git diff --check -- "${TARGET_FILE}"

      - name: Require agenda visibility state unchanged
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/orders-agenda-snapshot.js /tmp/orders-agenda-candidate.json
          cmp /tmp/orders-agenda-parent.json /tmp/orders-agenda-candidate.json
          echo 'Pre-existing agenda-toggle visibility state is unchanged by candidate.'

      - name: Confirm known parent E2E failure remains same class of baseline debt
        shell: bash
        run: |
          set +e
          node node_modules/@playwright/test/cli.js test tests/e2e/pedidos-role-composition.spec.js > /tmp/pedidos-e2e.log 2>&1
          code=$?
          set -e
          cat /tmp/pedidos-e2e.log
          test "$code" = "1"
          grep -F 'Expected: true' /tmp/pedidos-e2e.log
          grep -F 'Received: false' /tmp/pedidos-e2e.log
          grep -F "node.hidden && getComputedStyle(node).display === 'none'" /tmp/pedidos-e2e.log
          echo 'Known pre-existing Pedidos E2E failure reproduced without widening.'

      - name: Validate CSS and shared boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/css-conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

      - name: Report final diagnostic metrics
        shell: bash
        run: |
          set -euo pipefail
          echo '--- candidate numstat ---'
          git diff --numstat -- "${TARGET_FILE}"
          echo '--- conflicts ---'
          grep -E 'CSS files scanned|Definitions|Conflicting class/property pairs' /tmp/css-conflicts.log || true
          echo '--- structural debt ---'
          grep -E 'active legacy/remediation css|active legacy/remediation js|high risk active css' /tmp/legacy.log || true

      - name: Restore parent workspace
        if: always()
        shell: bash
        run: |
          git checkout -- "${TARGET_FILE}" 2>/dev/null || true
          rm -rf test-results playwright-report reports/generated/playwright-html reports/generated/playwright-results.json || true
