name: COM-B03C R5H Extension Classification Matrix Generator TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-matrix-derivative-sync-temp.yml'

permissions:
  contents: read

jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only parent and installation scope
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5h-extension-classification-matrix-derivative-sync-temp.yml
          test "$(git rev-parse HEAD^)" = "4a5a636fc6bbe347537d0b8e1320d7dffe4c98e7"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"

      - name: Generate deterministic Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed extension boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const matrix = require('./config/domain-completion-matrix.json');
          const cfg = require('./config/com-b03c-r5h-extension-classification-probe-execution-boundary.json');
          const com = matrix.domains.find((domain) => domain.id === 'COM-001');
          if (matrix.version !== '1.3.113') throw new Error('MATRIX_VERSION_DRIFT');
          if (!com || com.maturity !== 3 || com.productionGate !== 'blocked') throw new Error('COM_PROMOTION_FORBIDDEN');
          if (cfg.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || cfg.functionalCheckpoint.r5iCreated !== false || cfg.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (cfg.governance.executionBoundaryDefined !== true || cfg.governance.executionHarnessDefined !== false) throw new Error('BOUNDARY_STATE_INVALID');
          for (const key of ['triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (cfg.governance[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          if (cfg.probeBoundary.exactRootCauseProven !== false || cfg.probeBoundary.causalPromotionAllowed !== false || cfg.probeBoundary.privatePresencePromotionAllowed !== false) throw new Error('CAUSAL_PROMOTION_MUST_REMAIN_BLOCKED');
          NODE

      - name: Stage generated artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matrix-sync/docs /tmp/matrix-sync/reports/generated
          cp docs/DOMAIN-COMPLETION-MATRIX.md /tmp/matrix-sync/docs/DOMAIN-COMPLETION-MATRIX.md
          cp reports/generated/domain-completion-matrix-report.json /tmp/matrix-sync/reports/generated/domain-completion-matrix-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: com-b03c-r5h-extension-classification-matrix-derivatives-${{ github.run_id }}
          path: /tmp/matrix-sync
          if-no-files-found: error
          retention-days: 1
