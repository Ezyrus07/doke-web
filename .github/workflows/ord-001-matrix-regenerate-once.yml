name: ORD-001 Matrix Regenerate Once

on:
  pull_request:
    paths:
      - .github/workflows/ord-001-matrix-regenerate-once.yml
      - docs/ORD-001-A05-CANARY-PREFLIGHT.md
      - scripts/audit-ord-001-a05-canary-preflight.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate deterministic matrix artifacts
        run: node scripts/audit-domain-completion-matrix.js --write
      - name: Enforce generated-file scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Upload generated matrix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ord-a05-generated-matrix
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 1

# One-shot read-only artifact generator. Remove after the generated files are committed.
