name: ORD-001 Matrix Regenerate Once

on:
  push:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - .github/workflows/ord-001-matrix-regenerate-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate deterministic matrix artifacts
        run: node scripts/audit-domain-completion-matrix.js --write
      - name: Enforce generated-file scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/DOMAIN-COMPLETION-MATRIX\.md|reports/generated/domain-completion-matrix-report\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json; then
            echo 'Matrix artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git commit -m 'Regenerate domain completion matrix for ORD-A05 preflight'
          git push origin HEAD:ord/ord-001-baseline-audit

# One-shot controlled applicator. Remove after the generated commit is confirmed.
