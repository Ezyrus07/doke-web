name: Doke UX-CSS-DEBT-047 Permanent Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-047-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5e9ca1d26039e6a78547916d149328d2d77b445f
      PARENT_SHA: 9b691b6f1387987172259db6485c2884604fec5b
      PARENT_PARENT_SHA: 75ab79e2316cb61d602658597e2bf66ce487af87
      TARGET_TREE: e4356d4b61a32394aedef02994d397e37938dc4c
      TARGET_FILE: assets/css/pages/profile/visual-hierarchy.css
      PARENT_BLOB: 7e3b74a06b7c10f1b12744a92a987d0a4c111567
      TARGET_BLOB: c4fbde9bc37f51aa1a5c32b2f6e90711e5addbaf
      TARGET_HASH: 2fb0f03cc13a1f14688b7b03cbc2ae21ca223588e2f3586945ea9a2b1630eff4
      TARGET_BYTES: '5806'
      PERM_BRANCH: ux/ux-css-debt-047-profile-visual-hierarchy-compaction
      AUTHORITY_DOC_A: docs/PAGE-ASSET-AUTHORITY-MATRIX.md
      AUTHORITY_DOC_B: docs/HOME-AUTHORITY-CLASSIFICATION.md
      AUTHORITY_DOC_A_REGEN_HASH: 345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6
      AUTHORITY_DOC_B_REGEN_HASH: b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Preserve exact-cert helpers
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-047-cert-identity.cjs /tmp/ux-css-debt-047-cert-identity.cjs
          cp .github/diagnostics/ux-css-debt-047-cert-residual.cjs /tmp/ux-css-debt-047-cert-residual.cjs
          node --check /tmp/ux-css-debt-047-cert-identity.cjs
          node --check /tmp/ux-css-debt-047-cert-residual.cjs

      - name: Checkout exact certified UX-CSS-DEBT-046 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2
          clean: true

      - name: Guard parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_BLOB"
          test -z "$(git status --porcelain)"
          echo "PARENT IDENTITY PASS|sha=$PARENT_SHA|parent=$PARENT_PARENT_SHA|blob=$PARENT_BLOB"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate parent governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          npm run audit:page-asset-authority-matrix
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$PARENT_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          echo "PARENT BASELINES PASS|responsive=generated|authorityHashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH"

      - name: Checkout exact permanent SHA without removing generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA" --depth=2
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -s reports/responsive-index-baseline.json
          echo "PERMANENT CHECKOUT PASS|sha=$TARGET_SHA"

      - name: Exact permanent identity scope reach and static-proof guard
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"...HEAD -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          test -z "$(git diff --name-only "$PARENT_SHA"...HEAD -- '*.js' '*.html' 'package.json' 'package-lock.json' 'docs/**')"
          git diff --check "$PARENT_SHA"...HEAD
          node /tmp/ux-css-debt-047-cert-identity.cjs
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const target=process.env.TARGET_FILE,importer='assets/css/pages/profile-foundation.css',expectedPages=['meu-perfil.html','perfil-cliente.html','perfil-profissional.html','perfil.html'];
          const tracked=new Set(cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(Boolean));
          function importsFor(file){const src=fs.readFileSync(file,'utf8'),out=[],re=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;let m;while((m=re.exec(src))){let v=m[1].replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))v=v.replace(/^\/+/, '');else if(!v.startsWith('assets/'))v=path.posix.normalize(path.posix.join(path.posix.dirname(file),v));if(tracked.has(v))out.push(v);}return out;}
          const direct=[...tracked].filter(f=>importsFor(f).includes(target)).sort();if(JSON.stringify(direct)!==JSON.stringify([importer]))throw new Error('direct importer drift '+JSON.stringify(direct));
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),reached=[];
          for(const p of report.pageAssets){const seen=new Set(),stack=[...(p.css||[]).filter(f=>tracked.has(f))];let hit=false;while(stack.length){const f=stack.pop();if(seen.has(f)||!tracked.has(f))continue;seen.add(f);if(f===target){hit=true;break;}for(const n of importsFor(f))stack.push(n);}if(hit)reached.push(p.page);}
          reached.sort();if(JSON.stringify(reached)!==JSON.stringify(expectedPages))throw new Error('active reach drift '+JSON.stringify(reached));
          for(const page of expectedPages){const html=fs.readFileSync(page,'utf8');if(!/<body[^>]*class=["'][^"']*profile-page-shell/.test(html))throw new Error('profile shell missing '+page);if(!/data-profile-contract=["']clean-v1["']/.test(html))throw new Error('clean-v1 missing '+page);}
          console.log(`REACH AUTHORITY PASS|pages=${reached.join(',')}|directImporter=${importer}|target=${target}|affectedFamilies=1|staticProof=unconditional-dominance`);
          NODE
          echo "EXACT IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=1"

      - name: Responsive contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Responsive contract test: PASS' /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PERMANENT PASS|checks=893|failures=0|skips=277'

      - name: Governance contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo 'GOVERNANCE PERMANENT PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Isolate parent-stale authority-doc regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$AUTHORITY_DOC_A" | awk '{print $1}')" = "$AUTHORITY_DOC_A_REGEN_HASH"
          test "$(sha256sum "$AUTHORITY_DOC_B" | awk '{print $1}')" = "$AUTHORITY_DOC_B_REGEN_HASH"
          git checkout "$TARGET_SHA" -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B"
          test -z "$(git diff --name-only -- "$AUTHORITY_DOC_A" "$AUTHORITY_DOC_B")"
          test -z "$(git diff --name-only)"
          echo "AUTHORITY DOC BASELINE ISOLATION PASS|candidateSemanticDocDelta=0|hashes=$AUTHORITY_DOC_A_REGEN_HASH/$AUTHORITY_DOC_B_REGEN_HASH|workingTreeTrackedClean=1"

      - name: Permanent residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          node /tmp/ux-css-debt-047-cert-residual.cjs

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));const v=a.metadata?.vulnerabilities||{};console.log(`NPM AUDIT SNAPSHOT|total=${v.total??'n/a'}|critical=${v.critical??'n/a'}|high=${v.high??'n/a'}|moderate=${v.moderate??'n/a'}|low=${v.low??'n/a'}`);
          NODE

      - name: Final exact-SHA certification marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$TARGET_BYTES"
          test -z "$(git diff --name-only)"
          echo "PERMANENT EXACT CERT PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|tree=$TARGET_TREE|blob=$TARGET_BLOB|hash=$TARGET_HASH|bytes=$TARGET_BYTES|files=1|additions=0|deletions=1|responsive=893/0/277|residual=27/542/0|staticProof=transferred-by-independent-byte-reconstruction|prCreated=0"

      - name: Clean generated artifacts and restore exact permanent checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$TARGET_HASH"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0|prCreated=0|generatedArtifactsCleaned=1"
