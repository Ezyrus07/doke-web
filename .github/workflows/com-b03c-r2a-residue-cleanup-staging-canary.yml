name: COM-B03C-R2A Staging Residue Cleanup Recovery

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - backend/modules/communities/community-realtime-r2a-residue-cleanup-readiness.js
      - config/com-b03c-r2a-residue-cleanup-readiness.json
      - scripts/test-com-b03c-r2a-residue-cleanup-readiness.js
      - scripts/execute-com-b03c-r2a-residue-cleanup-staging-canary.js
      - scripts/verify-com-b03c-r2a-residue-cleanup-staging-canary-evidence.js
      - .github/workflows/com-b03c-r2a-residue-cleanup-staging-canary.yml
      - docs/validation/COM-B03C-R2-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
      - docs/validation/COM-B03C-R2A-STAGING-RESIDUE-CLEANUP-READINESS.json
      - docs/validation/COM-B03C-R2A-STAGING-RESIDUE-CLEANUP.json
  push:
    branches: [com/com-001-baseline-audit]
    paths: [config/com-b03c-r2a-residue-cleanup-staging-trigger.json]

permissions:
  contents: read

concurrency:
  group: com-b03c-r2a-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-r2a-residue-cleanup-readiness.js
          node --check scripts/test-com-b03c-r2a-residue-cleanup-readiness.js
          node --check scripts/execute-com-b03c-r2a-residue-cleanup-staging-canary.js
          node --check scripts/verify-com-b03c-r2a-residue-cleanup-staging-canary-evidence.js
      - name: COM-B03C-R2A readiness
        run: node scripts/test-com-b03c-r2a-residue-cleanup-readiness.js
      - name: Predecessor failure evidence
        run: |
          test -f docs/validation/COM-B03C-R2-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
          grep -q 'cleanup_unproven' docs/validation/COM-B03C-R2-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
          grep -q '"mustNotBeRerun": true' docs/validation/COM-B03C-R2-REALTIME-AUTH-PREDICATE-LADDER-STAGING-ATTEMPT.json
      - name: Cleanup-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com_b03c_r2_' config/com-b03c-r2a-residue-cleanup-readiness.json
          grep -q 'com-b03c-r2-' config/com-b03c-r2a-residue-cleanup-readiness.json
          grep -q '"rerunPredicateLadderAllowed": false' config/com-b03c-r2a-residue-cleanup-readiness.json
          grep -q '"openRealtimeChannelsAllowed": false' config/com-b03c-r2a-residue-cleanup-readiness.json
          if [ -f config/com-b03c-r2a-residue-cleanup-staging-trigger.json ]; then
            node - <<'NODE'
          const t=require('./config/com-b03c-r2a-residue-cleanup-staging-trigger.json');
          const r=require('./backend/modules/communities/community-realtime-r2a-residue-cleanup-readiness');
          if(t.contractId!=='com-b03c-r2a-residue-cleanup-staging-trigger-v1')process.exit(1);
          if(t.status!=='authorization_consumed_execution_pending')process.exit(1);
          if(t.authorization?.phrase!==r.REQUIRED_AUTHORIZATION_PHRASE)process.exit(1);
          for(const k of ['received','consumed','executionAttempted','singleUse'])if(t.authorization?.[k]!==true)process.exit(1);
          for(const k of ['reusableAfterFailure','predecessorAuthorizationReusable'])if(t.authorization?.[k]!==false)process.exit(1);
          NODE
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=2 origin "${TARGET_SHA}"
          else
            TARGET_SHA="${GITHUB_SHA}"
          fi
          git diff --check "${TARGET_SHA}^" "${TARGET_SHA}"
          if git diff --name-only "${TARGET_SHA}^" "${TARGET_SHA}" | grep -E '(^|/)(node_modules|reports/generated)/'; then exit 1; fi

  authorize:
    if: github.event_name == 'push'
    needs: certify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Validate single-use cleanup trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -f config/com-b03c-r2a-residue-cleanup-staging-trigger.json
          test "$(git rev-parse HEAD^)" = "$(node -p "require('./config/com-b03c-r2a-residue-cleanup-staging-trigger.json').workflowInstallHead")"
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "config/com-b03c-r2a-residue-cleanup-staging-trigger.json"
          node - <<'NODE'
          const t=require('./config/com-b03c-r2a-residue-cleanup-staging-trigger.json');
          const r=require('./backend/modules/communities/community-realtime-r2a-residue-cleanup-readiness');
          if(t.contractId!=='com-b03c-r2a-residue-cleanup-staging-trigger-v1'||t.status!=='authorization_consumed_execution_pending')process.exit(1);
          if(t.authorization?.phrase!==r.REQUIRED_AUTHORIZATION_PHRASE)process.exit(1);
          for(const k of ['received','consumed','executionAttempted','singleUse'])if(t.authorization?.[k]!==true)process.exit(1);
          for(const k of ['reusableAfterFailure','predecessorAuthorizationReusable'])if(t.authorization?.[k]!==false)process.exit(1);
          const a=r.evaluateStagingAuthorization({authorizationPhrase:t.authorization.phrase,targetEnvironment:t.target.environment,projectId:t.target.projectId,branch:t.target.branch,pullRequest:t.target.pullRequest,authorizationConsumed:false,executionAttempted:false,predecessorAuthorizationReusable:false,...t.cleanup});
          if(a.decision!=='authorized_for_single_bounded_r2_residue_inspection_and_cleanup_only')process.exit(1);
          NODE

  canary:
    if: github.event_name == 'push'
    needs: authorize
    runs-on: ubuntu-24.04
    environment: doke-staging
    env:
      COM_B03C_R2A_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_COM_B03C_R2A_STAGING_RESIDUE_INSPECTION_AND_CLEANUP_ONLY
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COM_B03C_R2A_REPORT_PATH: reports/generated/COM-B03C-R2A-STAGING-RESIDUE-CLEANUP.json
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install cleanup-only dependencies
        run: npm install --no-save --ignore-scripts pg@8 @supabase/supabase-js@2.112.2
      - name: Execute R2 residue inspection and cleanup only
        id: execute
        continue-on-error: true
        run: node scripts/execute-com-b03c-r2a-residue-cleanup-staging-canary.js
      - name: Verify sanitized cleanup evidence
        if: always()
        run: node scripts/verify-com-b03c-r2a-residue-cleanup-staging-canary-evidence.js
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com-b03c-r2a-residue-cleanup-${{ github.run_id }}
          path: reports/generated/COM-B03C-R2A-STAGING-RESIDUE-CLEANUP.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagate cleanup result
        if: steps.execute.outcome != 'success'
        run: exit 1
