name: TEMP UX Post-Data-Ready Global State Semantic Reconcile
on:
  push:
    branches:
      - diag/ux-post-data-ready-global-state-semantic-reconcile
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      PARENT: 84dc170e5bcf8b04aaf7eaba6f46c1ae67b730af
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-post-data-ready-global-state-semantic-reconcile.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify diagnostic lineage
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$HEAD_SHA" | awk '{print $2}')" = "$PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")" = "$WORKFLOW_PATH"
          git checkout --detach "$PARENT" >/dev/null
          test "$(git rev-parse HEAD)" = "$PARENT"
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Reconcile 131 through 140 against canonical hydration semantics
        shell: bash
        run: |
          set -euo pipefail

          npm run audit:critical-state-runtime-api
          npm run audit:critical-state-contracts
          npm run audit:critical-action-state-contracts

          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const stateRuntime=read('assets/js/state/state-contracts.js');
          const hydrationRuntime=read('assets/js/core/page-hydration.js');

          if (/HYDRATED\s*:\s*['"]hydrated['"]/.test(stateRuntime)) {
            throw new Error('canonical state contract unexpectedly includes hydrated');
          }
          for (const token of ["READY: 'ready'","LOADING: 'loading'",'root.dataset.viewState = nextState === \'hydrating\'']) {
            if (!(stateRuntime.includes(token) || hydrationRuntime.includes(token))) throw new Error(`missing canonical runtime token: ${token}`);
          }

          const specs=[
            {group:'marketplace',file:'index.html',scope:'index',skeleton:'data-home-hydration-skeleton',ready:'data-home-hydration-ready',completion:{type:'route',token:"'/index.html'"}},
            {group:'marketplace',file:'resultados.html',scope:'resultados',skeleton:'data-results-hydration-skeleton',ready:'data-results-hydration-ready',completion:{type:'route',token:"'/resultados.html'"}},
            {group:'marketplace',file:'perfil.html',scope:'perfil',skeleton:'data-profile-hydration-skeleton',ready:'data-profile-hydration-ready',completion:{type:'controller',path:'assets/js/pages/profile-experience.js',tokens:["page: 'perfil'",'hydration.ready({ hasItems: true })']}},
            {group:'marketplace',file:'detalhe-anuncio.html',scope:'detalhe-anuncio',skeleton:'data-detail-hydration-skeleton',ready:'data-detail-hydration-ready',completion:{type:'route',token:"'/detalhe-anuncio.html'"}},
            {group:'support',file:'configuracoes.html',scope:'configuracoes',skeleton:'data-settings-hydration-pending',ready:'data-settings-hydration-ready',completion:{type:'controller',path:'assets/js/pages/configuracoes.js',tokens:["page: 'configuracoes'",'hydration?.ready({ hasItems: true })']}},
            {group:'support',file:'notificacoes.html',scope:'notificacoes',skeleton:'data-notifications-hydration-skeleton',ready:'data-notifications-hydration-ready',completion:{type:'controller',path:'assets/js/pages/notificacoes.js',tokens:["page: 'notificacoes'","waitFor: ['dom', 'auth', 'local-notifications']","hydration?.mark('local-notifications')"]}},
            {group:'support',file:'comunidade.html',scope:'comunidade',skeleton:'data-community-hydration-skeleton',ready:'data-community-hydration-content',completion:{type:'community',path:'assets/js/pages/comunidade.js'}}
          ];

          function inspect(spec){
            const html=read(spec.file);
            const missing=[];
            const boundaryToken=`data-state-boundary="${spec.scope}"`;
            if(!html.includes(boundaryToken)) missing.push('state-boundary');
            const loading=html.includes('data-view-state="loading"');
            const readyStatic=html.includes('data-view-state="ready"');
            const busyTrue=html.includes('aria-busy="true"');
            const busyFalse=html.includes('aria-busy="false"');
            if(!html.includes(spec.skeleton)) missing.push('loading-surface');
            if(!html.includes(spec.ready)) missing.push('ready-surface');
            if(!html.includes('assets/js/core/page-hydration.js')) missing.push('shared-page-hydration-runtime');

            let completionCanonical=false;
            let finalState='unknown';
            let reason='';
            if(spec.completion.type==='route'){
              completionCanonical=hydrationRuntime.includes(spec.completion.token);
              if(!completionCanonical) missing.push('shared-route-hydration-contract');
              finalState=completionCanonical?'ready':'unknown';
            }else if(spec.completion.type==='controller'){
              const js=read(spec.completion.path);
              completionCanonical=spec.completion.tokens.every(t=>js.includes(t));
              if(!completionCanonical) missing.push('canonical-ready-controller');
              finalState=completionCanonical?'ready':'unknown';
            }else{
              const js=read(spec.completion.path);
              const usesHydrated=js.includes("setCommunityPageState('hydrated')") && js.includes("state === 'hydrated' ? 'hydrated'");
              const normalizesReady=js.includes("setCommunityPageState('ready')") || js.includes("setBoundaryState(page, 'ready'") || js.includes("setBoundaryState('[data-state-boundary=\"comunidade\"]', 'ready'");
              completionCanonical=!usesHydrated && normalizesReady;
              finalState=usesHydrated?'hydrated':normalizesReady?'ready':'unknown';
              if(usesHydrated) missing.push('noncanonical-final-view-state=hydrated');
              else if(!normalizesReady) missing.push('canonical-ready-completion');
              reason=usesHydrated?'controller writes hydrated directly although canonical stateContracts does not define hydrated':'';
            }

            const validInitial=(readyStatic && busyFalse) || (loading && busyTrue);
            if(!validInitial) missing.push('valid-initial-state/busy-pair');
            const status=missing.length===0 && completionCanonical?'passed':'failed';
            return {file:spec.file,scope:spec.scope,status,initialState:readyStatic?'ready':loading?'loading':'unknown',initialBusy:busyFalse?false:busyTrue?true:null,finalState,completionCanonical,reason,missing};
          }

          const rows=specs.map(inspect);
          const market=rows.filter(r=>specs.find(s=>s.file===r.file).group==='marketplace');
          const support=rows.filter(r=>specs.find(s=>s.file===r.file).group==='support');
          const mk={cycle:136,scope:'main-marketplace-state-contracts-semantic-reconciliation',status:market.every(r=>r.status==='passed')?'passed':'failed',checkedPages:market.length,failedPages:market.filter(r=>r.status==='failed').length,pages:market,contract:'ready/false OR loading/true with real canonical hydration completion',criteriaRelaxed:0};
          const sp={cycle:137,scope:'main-support-state-contracts-semantic-reconciliation',status:support.every(r=>r.status==='passed')?'passed':'failed',checkedPages:support.length,failedPages:support.filter(r=>r.status==='failed').length,pages:support,contract:'ready/false OR loading/true with real canonical hydration completion',criteriaRelaxed:0};
          write('docs/validation/global-cycle-136-main-marketplace-state-contracts-report.json',mk);
          write('docs/validation/global-cycle-137-main-support-state-contracts-report.json',sp);
          console.log('SEMANTIC_136='+JSON.stringify(mk));
          console.log('SEMANTIC_137='+JSON.stringify(sp));
          NODE

          npm run audit:main-action-state-contracts
          npm run audit:main-state-runtime-coverage

          set +e
          npm run audit:global-state-completion-gate
          C140_RC=$?
          set -e
          echo "SEMANTIC_C140_RC=$C140_RC"

          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const r136=read('docs/validation/global-cycle-136-main-marketplace-state-contracts-report.json');
          const r137=read('docs/validation/global-cycle-137-main-support-state-contracts-report.json');
          const r138=read('docs/validation/global-cycle-138-main-action-state-contracts-report.json');
          const r139=read('docs/validation/global-cycle-139-main-state-runtime-coverage-report.json');
          const r140=read('docs/validation/global-cycle-140-global-state-completion-gate-report.json');
          const blockers=[...r136.pages,...r137.pages].filter(p=>p.status==='failed');
          const out={
            result:blockers.length===1 && blockers[0].file==='comunidade.html'?'PASS_DIAGNOSTIC':'REVIEW',
            parent:process.env.PARENT,
            semanticStatuses:{c136:r136.status,c137:r137.status,c138:r138.status,c139:r139.status,c140:r140.status},
            blockers,
            actionReviewPages:(r138.pages||[]).filter(p=>p.status==='review'),
            completion:{failedReports:r140.failedReports,followUpReports:r140.followUpReports,nextPhaseConstraint:r140.nextPhaseConstraint,visualChange:r140.visualChange},
            nextFront:blockers.length===1 && blockers[0].file==='comunidade.html'?'COMMUNITY_CANONICAL_VIEW_STATE_NORMALIZATION':'GLOBAL_STATE_CONTRACT_REVIEW',
            productMutation:false,
            criteriaRelaxed:0,
            repositoryOnly:true
          };
          console.log('GLOBAL_STATE_SEMANTIC_RECONCILE='+JSON.stringify(out));
          if(out.result!=='PASS_DIAGNOSTIC') process.exitCode=1;
          NODE

          CHANGED="$(git status --porcelain | awk '{print $2}')"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED" | grep -v '^docs/validation/global-cycle-13[1-9]-' | grep -v '^docs/validation/global-cycle-140-' && exit 1 || true
          fi
          git reset --hard "$PARENT" >/dev/null
          git clean -fd >/dev/null
          test -z "$(git status --porcelain)"
