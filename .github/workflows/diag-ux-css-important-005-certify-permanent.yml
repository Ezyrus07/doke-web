name: Doke UX CSS Important 005 Certify Permanent
on:
  push:
    branches: [diag/ux-css-important-005-certify-permanent]
    paths: [.github/workflows/diag-ux-css-important-005-certify-permanent.yml]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 24b49e5693f24621a1024b94c33c8ba6e18b12c0
      PARENT_SHA: 1c1f6c97a851fc73b7f81c07fe646d7d60e03843
      TARGET_TREE: e5bd25ebf12efc7179d000cb012512e339773f01
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      PARENT_BLOB: 1e24479b2b9065659a5a11a18854131e4ef90187
      TARGET_BLOB: 896730319ae0852caca8a0f93cd1507608dd9894
      EXPECTED_SHA256: 4bd9c3664ad99a35b3dbca9237f16a0c858125e74c5371d751322ae5f6e7d0df
      EXPECTED_BYTES: '9323'
      PERMANENT_BRANCH: ux/ux-css-important-005-home-mobile-composition-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-005-certify-permanent
      RESULT_FILE: .diagnostics/ux-css-important-005-certification.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: certify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/cert.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$TARGET_SHA"
          test "$(git diff --name-only "$PARENT_SHA".."$TARGET_SHA")" = "$TARGET_FILE"; test "$(git diff --numstat "$PARENT_SHA".."$TARGET_SHA" -- "$TARGET_FILE")" = $'13\t13\t'"$TARGET_FILE"
          npm ci --ignore-scripts
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),f=process.env.TARGET_FILE,target=fs.readFileSync(f),h=crypto.createHash('sha256').update(target).digest('hex');if(h!==process.env.EXPECTED_SHA256||target.length!==+process.env.EXPECTED_BYTES||(target.toString().match(/!important\b/g)||[]).length!==23)throw Error(`target identity ${h}/${target.length}`);let s=cp.execFileSync('git',['show',`${process.env.PARENT_SHA}:${f}`],{encoding:'utf8'});if((s.match(/!important\b/g)||[]).length!==36)throw Error('parent drift');function strip(selector,props){const key=selector+' {';const hits=[];let at=0;while((at=s.indexOf(key,at))>=0){const b=s.indexOf('{',at),e=s.indexOf('}',b),block=s.slice(b+1,e);const ok=props.every(prop=>new RegExp(`(^|\\n)\\s*${prop.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')}\\s*:[^;]+?\\s*!important;`,'m').test(block));if(ok)hits.push({b,e,block});at=e+1;}if(hits.length!==1)throw Error(`selector ${selector} matchingBlocks=${hits.length}`);let out=hits[0].block;for(const prop of props){const re=new RegExp(`(^|\\n)(\\s*${prop.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')}\\s*:[^;]+?)\\s*!important;`,'m');out=out.replace(re,'$1$2;')}s=s.slice(0,hits[0].b+1)+out+s.slice(hits[0].e)}strip('body.home-index-shell #before-after-track > .comparison-card',['flex','width','min-width','max-width']);strip('body.home-index-shell #before-after-track > .comparison-card .comparison-card__visual',['aspect-ratio','min-height','max-height']);strip('body.home-index-shell .content-rail__arrow',['display']);strip('body.home-index-shell .home-mobile-hero__top',['grid-template-columns']);strip('body.home-index-shell .home-mobile-hero__quick-actions',['display','grid-template-columns']);strip('body.home-index-shell .home-mobile-hero__location-label',['display','overflow']);const rebuilt=Buffer.from(s);if(!rebuilt.equals(target))throw Error('reconstruction mismatch');console.log(`IDENTITY PASS|sha=${process.env.TARGET_SHA}|parent=${process.env.PARENT_SHA}|tree=${process.env.TARGET_TREE}|parentBlob=${process.env.PARENT_BLOB}|targetBlob=${process.env.TARGET_BLOB}|sha256=${h}|bytes=${target.length}|fullHistory=1|files=1|additions=13|deletions=13|important=23`);console.log('RECONSTRUCTION PASS|byteIdentical=1|important=36->23|priorityMarkersRemoved=13|declarationsRemoved=0');
          NODE
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');const tracked=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean),files=tracked.filter(p=>p.endsWith('.html')||p.startsWith('assets/js/')&&p.endsWith('.js')),cls=['home-mobile-hero__top','home-mobile-hero__quick-actions','home-mobile-hero__location-label','content-rail__arrow','comparison-card'],ids=['before-after-track'],esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');function cpClass(t,a){const e=esc(a);return new RegExp(`class\\s*=\\s*["'\x60][^"'\x60]*?(?:^|\\s)${e}(?=\\s|["'\x60])`,'m').test(t)||new RegExp(`classList\\.add\\([^)]*["'\x60]${e}["'\x60]`).test(t)||new RegExp(`className\\s*=\\s*["'\x60][^"'\x60]*\\b${e}\\b`).test(t)}function cpId(t,a){const e=esc(a);return new RegExp(`id\\s*=\\s*["'\x60]${e}["'\x60]`).test(t)}let hits=0;for(const a of cls)hits+=files.filter(p=>cpClass(fs.readFileSync(p,'utf8'),a)).length;for(const a of ids)hits+=files.filter(p=>cpId(fs.readFileSync(p,'utf8'),a)).length;if(hits!==0)throw Error(`producer hits ${hits}`);console.log('SOURCE RECHECK PASS|candidateAnchors=6|producerHits=0|sourceRun=32144434761');
          NODE
          cp "$TARGET_FILE" /tmp/permanent.css; git checkout "$PARENT_SHA" -- "$TARGET_FILE"; node scripts/generate-responsive-index-baseline.js; git checkout "$TARGET_SHA" -- "$TARGET_FILE"; cmp -s "$TARGET_FILE" /tmp/permanent.css
          npm run test:responsive-contract | tee /tmp/responsive.log; grep -q 'Checks: 893' /tmp/responsive.log; grep -q 'Failures: 0' /tmp/responsive.log; grep -q 'Skips: 277' /tmp/responsive.log; echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|baselineSource=exact-parent'
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflicts');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`)
          NODE
          npm run audit:shared-app-header-contract; npm run audit:mobile-shell-location-contract; npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log; grep -q 'Duplicate groups: 0' /tmp/dup.log; grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log; grep -q 'Domains: 23' /tmp/domain.log; grep -q 'Critical flows: 15' /tmp/domain.log; grep -q 'Average maturity: 2.91/6' /tmp/domain.log; grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures; npm run audit:important-reduction-plan; npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8')),s=b.summary;if(s.totalImportant!==11215||s.outsideServiceCardImportant!==11153||s.filesWithImportant!==34)throw Error(`important ${JSON.stringify(s)}`);if(p.summary.affectedFiles!==33||p.summary.totalImportantOutsideServiceCard!==11153||p.summary.lowRiskFileCount!==0||p.summary.byRisk?.['high-baseline-required']!==11130||p.summary.byRisk?.['medium-baseline-required']!==23)throw Error(`plan ${JSON.stringify(p.summary)}`);console.log('IMPORTANT BASELINE PASS|total=11215|outsideServiceCard=11153|files=34|targetImportant=23|delta=-13');console.log('QUEUE PASS|affectedFiles=33|lowRiskFiles=0|highBaselineRequired=11130|mediumBaselineRequired=23');
          NODE
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`)
          NODE
          echo "AUDIT_EXIT=$code"; echo 'PROOF TRANSFER PASS|ranking=32143884413|source=32144434761|visual=32144795646|governance=32144845518|candidateSha256=4bd9c3664ad99a35b3dbca9237f16a0c858125e74c5371d751322ae5f6e7d0df|selectorNodes=0|screenshotDiffs=0|syntheticDOM=0'; echo 'GOVERNANCE PASS|duplicates=0/0|domain=23/15/2.91/12'
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"; test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$TARGET_SHA"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.certify.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_TREE=$TARGET_TREE"; echo "PARENT_BLOB=$PARENT_BLOB"; echo "TARGET_BLOB=$TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo "CERTIFY=${{ steps.certify.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(IDENTITY PASS|RECONSTRUCTION PASS|SOURCE RECHECK PASS|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT BASELINE PASS|QUEUE PASS|DEPENDENCY PASS|PROOF TRANSFER PASS|GOVERNANCE PASS)\|' /tmp/cert.log || true; grep '^AUDIT_EXIT=' /tmp/cert.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 260 /tmp/cert.log || true; fi; } >/tmp/evidence.txt; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 005 certification [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
