name: Doke SCHED-B04A Matrix Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04-ord-canonical-wiring-readiness.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04a-matrix-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Patch B04A matrix and regenerate derivatives
        run: |
          export SCHED_B04A_UPDATED_AT="$(TZ=America/Bahia date -Iseconds)"
          node scripts/patch-sched-001-b04a-matrix.js
          npm run write:domain-completion-matrix
      - name: Validate reconciled state
        run: |
          set -euo pipefail
          node scripts/test-sched-001-b04-ord-canonical-wiring-readiness.js
          node scripts/audit-sched-001-b02b-authenticated-composition-canary.js
          node scripts/test-sched-001-b02b-authenticated-composition-canary.js
          node scripts/audit-sched-001-b02-composition-root-readiness.js
          node scripts/test-sched-001-b02-composition-root-runtime.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          node scripts/audit-domain-completion-matrix.js
          git diff --check
      - name: Remove temporary matrix patcher
        run: git rm scripts/patch-sched-001-b04a-matrix.js
      - name: Commit validated B04A reconciliation
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add config/domain-completion-matrix.json \
            package.json \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "docs(sched): register B04A canonical wiring readiness"
          git push origin HEAD:ord/ord-001-baseline-audit
