name: Doke SCHED-B04A Final Derivative Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04-ord-canonical-wiring-readiness.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04a-final-derivative-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate deterministic matrix derivatives
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Publish final derivatives
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "docs(sched): synchronize B04A matrix derivatives"
          git push origin HEAD:ord/ord-001-baseline-audit
