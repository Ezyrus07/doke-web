name: Doke SCHED-B04 ORD Canonical Wiring Readiness

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - 'config/sched-001-b04-ord-canonical-wiring-readiness.json'
      - 'docs/SCHED-001-B04-ORD-CANONICAL-WIRING-READINESS.md'
      - 'docs/validation/SCHED-001-B04-ORD-CANONICAL-WIRING-READINESS.json'
      - 'scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js'
      - 'scripts/test-sched-001-b04-ord-canonical-wiring-readiness.js'
      - '.github/workflows/sched-001-b04-ord-canonical-wiring-readiness.yml'
      - 'backend/modules/orders/orders-service.js'
      - 'backend/modules/orders/order-state-machine.js'
      - 'backend/modules/scheduling/scheduling-postgres-repository.js'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Audit SCHED-B04 ORD canonical wiring readiness
        run: node scripts/audit-sched-001-b04-ord-canonical-wiring-readiness.js
      - name: Test SCHED-B04 ORD canonical wiring contract
        run: node scripts/test-sched-001-b04-ord-canonical-wiring-readiness.js
      - name: Preserve B02B authenticated composition evidence
        run: |
          node scripts/audit-sched-001-b02b-authenticated-composition-canary.js
          node scripts/test-sched-001-b02b-authenticated-composition-canary.js
      - name: Preserve scheduling composition and persistence contracts
        run: |
          node scripts/audit-sched-001-b02-composition-root-readiness.js
          node scripts/test-sched-001-b02-composition-root-runtime.js
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
      - name: Preserve ORD scheduling authority handoff
        run: node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
      - name: Audit domain completion matrix
        run: node scripts/audit-domain-completion-matrix.js
