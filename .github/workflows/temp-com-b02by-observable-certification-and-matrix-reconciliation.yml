name: TEMP COM-B02BY Observable Certification and Matrix Reconciliation R5

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - '.github/workflows/temp-com-b02by-observable-certification-and-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  certify-reconcile-and-finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: 4c1d2495e786bdb2c9a67135004bed6fa1850ca6
      CANDIDATE_TREE: f60996fa3b6ba9281dd5a7663cb37c6712176121
      PREDECESSOR_HEAD: 127bc25bbd0811023fd8c8e00aea0d1172e7166c
      PREDECESSOR_TREE: e07d93b30576a7634c0de636d002993f620e22b0
      B02BY_MODULE_BLOB: 0c2886fc1b5c521951511de2c0370030761eb35d
      B02BY_CONFIG_BLOB: 9c208880dab4b7bef1356593f87f77d933c89bff
      B02BY_TEST_BLOB: e5008fcc8a9baef3cf513d5cb077085ddb26a04b
      B02BY_WORKFLOW_BLOB: 0a46b2d3ffd66942815b029ce596828c36f0beb2
      B02BX_MODULE_BLOB: 2987c0e5eec8cafb776f4520a7866818aa94ed27
      B02BX_CONFIG_BLOB: 631871b705c67fc3e6807792aa483502ec317321
      B02BU_MODULE_BLOB: ead15b75489c9f7c57439a00badf9b6e02d4d415
      B02BO_BINDING_BLOB: 16da9ada3a308535e5515a242ac381c54c7c2fc4
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02by-observable-certification-and-matrix-reconciliation.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment.js
      CONFIG: config/com-b02by-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment.json
      TEST: scripts/test-com-b02by-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment.js
      CANONICAL_WORKFLOW: .github/workflows/com-b02by-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment.yml
      TEMP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEMP_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze corrected candidate lineage and exact recovery scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEMP_HEAD_SHA"
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          recovery_actual="$(git diff --name-only "$CANDIDATE_HEAD" HEAD | sort)"
          recovery_expected_temp_only="$(printf '%s\n' "$TEMP_PATH" | sort)"
          recovery_expected_with_matrix="$(printf '%s\n' "$TEMP_PATH" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$recovery_actual" = "$recovery_expected_temp_only" || test "$recovery_actual" = "$recovery_expected_with_matrix"
          expected="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02BY_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02BY_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02BY_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02BY_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment-implementation-descriptor-preparation.js)" = "$B02BX_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bx-repository-only-continuation-state-registry-storage-backend-entry-container-instance-actual-operation-methods-attachment-implementation-descriptor-preparation.json)" = "$B02BX_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization.js)" = "$B02BU_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-method-references-binding.js)" = "$B02BO_BINDING_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git ls-tree -r --name-only HEAD | grep -c '^\.github/workflows/temp-com-b02by-')" -eq 1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and exact attachment invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          test "$(grep -Fc 'Object.defineProperty(target' "$TARGET")" -eq 1
          ! grep -E '\.(call|apply)[[:space:]]*\(|Reflect\.apply[[:space:]]*\(' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          test "$(grep -Fc 'executableReferencesCopiedToTarget: true' "$TARGET")" -ge 1
          test "$(grep -Fc 'targetMutationPerformedByBoundary: true' "$TARGET")" -ge 1
          test "$(grep -Fc 'attachmentAppliedToEntryContainerInstance: true' "$TARGET")" -ge 1
          test "$(grep -Fc 'operationMethodsAttachedToInstance: true' "$TARGET")" -ge 1
          ! grep -E 'executableOperationMethodsInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Reconcile Matrix only for exact stale-derived blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run audit:domain-completion-matrix
          matrix_rc=$?
          set -e
          if [ "$matrix_rc" -ne 0 ]; then
            npm run write:domain-completion-matrix
            changed="$(git status --short | awk '{print $2}' | sort)"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
                *) echo "unexpected Matrix reconciliation path: $path"; exit 1 ;;
              esac
            done <<< "$changed"
            test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
            npm run audit:domain-completion-matrix
          fi

      - name: Governance and frozen repository surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Commit permanent derived state and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$TEMP_PATH"
          git add docs/DOMAIN-COMPLETION-MATRIX.md 2>/dev/null || true
          git add -f reports/generated/domain-completion-matrix-report.json 2>/dev/null || true
          staged="$(git diff --cached --name-only | sort)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              "$TEMP_PATH"|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "unexpected finalizer path: $path"; exit 1 ;;
            esac
          done <<< "$staged"
          echo "$staged" | grep -Fx "$TEMP_PATH"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          git commit -m "ci(com): finalize B02BY repository-only actual operation methods attachment certification [run ${GITHUB_RUN_ID}]"
          ! git ls-tree -r --name-only HEAD | grep '^\.github/workflows/temp-com-b02by-'

      - name: Certify permanent B02BY tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          expected4="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          expected6="$(printf '%s\n' "$CANONICAL_WORKFLOW" "$TARGET" "$CONFIG" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json "$TEST" | sort)"
          test "$actual" = "$expected4" || test "$actual" = "$expected6"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02BY_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02BY_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02BY_TEST_BLOB"
          test "$(git rev-parse HEAD:$CANONICAL_WORKFLOW)" = "$B02BY_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^\.github/workflows/temp-com-b02by-'
          node "$TEST"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Fast-forward branch only if TEMP head is still current
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$current" = "$TEMP_HEAD_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
