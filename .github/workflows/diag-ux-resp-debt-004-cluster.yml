name: Diagnostic UX responsive remaining clusters

on:
  push:
    branches:
      - diag/ux-resp-debt-004-cluster

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate responsive baseline
        run: node scripts/generate-responsive-index-baseline.js

      - name: Execute contract and classify remaining failures
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "$STATUS" -eq 0 -o "$STATUS" -eq 1
          node - <<'NODE'
          const report = require('./reports/responsive-contract-test-report.json');
          const failures = report.failures || [];
          const countBy = (keyFn) => failures.reduce((acc, f) => {
            const key = keyFn(f);
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});
          const byPageComponent = countBy(f => `${f.page} :: ${f.component}`);
          const byComponentProperty = countBy(f => `${f.component} :: ${f.property}`);
          const byBreakpointPage = countBy(f => `${f.breakpoint} :: ${f.page}`);
          const at608 = failures.filter(f => f.breakpoint === '608x926');
          console.log('SUMMARY');
          console.log(JSON.stringify(report.summary, null, 2));
          console.log('BY_PAGE_COMPONENT');
          console.log(JSON.stringify(Object.fromEntries(Object.entries(byPageComponent).sort((a,b)=>b[1]-a[1])), null, 2));
          console.log('BY_COMPONENT_PROPERTY');
          console.log(JSON.stringify(Object.fromEntries(Object.entries(byComponentProperty).sort((a,b)=>b[1]-a[1])), null, 2));
          console.log('BY_BREAKPOINT_PAGE');
          console.log(JSON.stringify(Object.fromEntries(Object.entries(byBreakpointPage).sort((a,b)=>b[1]-a[1])), null, 2));
          console.log('FAILURES_608');
          console.log(JSON.stringify(at608, null, 2));
          NODE

      - name: Probe computed 608px rail and header tokens
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('@playwright/test');
          const { loadHtmlWithLocalCss } = require('./scripts/lib/responsive-html-loader');
          const rootDir = process.cwd();
          const targets = [
            ['index.html', '.app-header'],
            ['detalhe-anuncio.html', '.app-header'],
            ['perfil.html', '.app-header'],
            ['resultados.html', '.app-header'],
            ['comunidade.html', '.app-header'],
          ];
          (async () => {
            const executablePath = process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE
              || process.env.CHROMIUM_PATH
              || (fs.existsSync('/usr/bin/chromium') ? '/usr/bin/chromium' : undefined);
            const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            try {
              for (const [file, selector] of targets) {
                const context = await browser.newContext({ viewport: { width: 608, height: 926 }, deviceScaleFactor: 1, javaScriptEnabled: false });
                const page = await context.newPage();
                await page.setContent(loadHtmlWithLocalCss(file, rootDir, { modeLabel: 'ux-resp-debt-004 token probe' }), { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(80);
                const result = await page.evaluate((selector) => {
                  const body = document.body;
                  const header = document.querySelector(selector);
                  const inner = header?.querySelector('.app-header__inner');
                  const style = getComputedStyle(body);
                  const rect = header?.getBoundingClientRect();
                  const innerRect = inner?.getBoundingClientRect();
                  return {
                    dataPage: body.dataset.page || null,
                    classes: body.className,
                    vars: {
                      railInlineGutter: style.getPropertyValue('--doke-rail-inline-gutter').trim(),
                      railAvailable: style.getPropertyValue('--doke-rail-available').trim(),
                      railMax: style.getPropertyValue('--doke-rail-max').trim(),
                      pageRail: style.getPropertyValue('--doke-page-rail').trim(),
                      headerRail: style.getPropertyValue('--doke-header-rail').trim(),
                      headerHeight: style.getPropertyValue('--doke-header-height').trim(),
                      firstBlockTop: style.getPropertyValue('--doke-first-block-top').trim(),
                    },
                    header: rect ? { x: rect.x, y: rect.y, width: rect.width, height: rect.height } : null,
                    inner: innerRect ? { x: innerRect.x, y: innerRect.y, width: innerRect.width, height: innerRect.height } : null,
                  };
                }, selector);
                console.log(file, JSON.stringify(result));
                await context.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
