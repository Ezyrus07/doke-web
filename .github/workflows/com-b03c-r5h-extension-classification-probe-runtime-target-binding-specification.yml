name: COM-B03C R5H Runtime Target Binding Specification

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b03c-r5h-runtime-target-binding-specification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified execution wiring implementation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-boundary.json)" = "86d7ed97336fa8dc7d3f4f6cff8920720fe4d637"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js)" = "27c1e962f0da3dbf2aaf7f122fa79211d5483dc2"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-boundary.yml)" = "f8ad69ba0dfb27632c44291fe814699aedc44cd2"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json)" = "9ad9c4ac7a8863ff54cde18bd898483685346906"

      - name: Exact repository-only push scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          spec=config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json
          workflow=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.yml
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification-matrix-materialization-temp.yml
          installation_scope="$(printf '%s\n' "$spec" "$workflow" | sort)"
          maintenance_scope="$workflow"
          materialization_scope="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          if [ "$actual" = "$installation_scope" ]; then
            test "$(git rev-parse HEAD^)" = "d7f2f36018b1f3db463d31a6c4524493afa5ebca"
          elif [ "$actual" != "$maintenance_scope" ] && [ "$actual" != "$materialization_scope" ]; then
            printf 'Unexpected repository-only push scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Static specification-only no-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          spec=config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$spec"
          ! grep -Eq 'https?://|eyJ[A-Za-z0-9_-]+|sk[-_][A-Za-z0-9_-]+|sbp_[A-Za-z0-9_-]+' "$spec"

      - name: Certify runtime target binding specification repository-only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const spec = require('./config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json');
          const parent = require('./config/com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-boundary.json');
          const wiring = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js');

          if (spec.contractId !== 'com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification-v1') throw new Error('RUNTIME_TARGET_BINDING_SPEC_CONTRACT_DRIFT');
          const ctx = spec.repositoryContext;
          if (ctx.parentCertifiedWiringImplementationHead !== 'd7f2f36018b1f3db463d31a6c4524493afa5ebca') throw new Error('PARENT_WIRING_IMPLEMENTATION_HEAD_DRIFT');
          if (ctx.parentCertifiedWiringImplementationTree !== 'b31cf82caa65b90624df0d3fbe36b6251fcd6a60') throw new Error('PARENT_WIRING_IMPLEMENTATION_TREE_DRIFT');
          if (ctx.parentWiringImplementationCertificationRun !== 31923010745 || ctx.parentWiringImplementationCertificationJob !== 95105915834) throw new Error('PARENT_WIRING_IMPLEMENTATION_CERTIFICATION_DRIFT');
          if (ctx.parentWiringImplementationBoundaryBlob !== '86d7ed97336fa8dc7d3f4f6cff8920720fe4d637' || ctx.parentWiringImplementationModuleBlob !== '27c1e962f0da3dbf2aaf7f122fa79211d5483dc2' || ctx.parentWiringImplementationCertifierBlob !== 'f8ad69ba0dfb27632c44291fe814699aedc44cd2') throw new Error('PARENT_WIRING_IMPLEMENTATION_BLOB_DRIFT');
          if (ctx.matrixVersion !== '1.3.113' || ctx.maturity !== 3 || ctx.productionGate !== 'blocked') throw new Error('MATRIX_STATE_DRIFT');
          if (spec.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || spec.functionalCheckpoint.r5iCreated !== false || spec.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          if (parent.contractId !== 'com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-boundary-v1') throw new Error('PARENT_WIRING_IMPLEMENTATION_CONTRACT_DRIFT');
          if (parent.implementationBoundary.executionWiringDefined !== true || parent.implementationBoundary.executionWiringImplemented !== true || parent.implementationBoundary.remoteRuntimeAdaptersImplemented !== false) throw new Error('PARENT_WIRING_IMPLEMENTATION_STATE_DRIFT');
          if (wiring.CONTRACT_ID !== 'com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-v1') throw new Error('PARENT_WIRING_MODULE_CONTRACT_DRIFT');

          const binding = spec.bindingSpecification;
          for (const key of ['repositoryOnlySpecification','specificationOnly','runtimeTargetBindingSpecificationDefined']) {
            if (binding[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          for (const key of ['runtimeTargetBindingDefined','runtimeTargetBindingImplemented','runtimeAdapterBindingDefined','targetEnvironmentBindingDefined','targetResourceBindingDefined','credentialProviderBindingDefined','syntheticIdentityLifecycleBindingDefined','realtimeClientFactoryBindingDefined','sanitizedEvidenceRecorderBindingDefined','cleanupVerifierBindingDefined']) {
            if (binding[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          for (const key of ['concreteRuntimeAdapter','concreteTargetEnvironment','concreteTargetResource','targetEnvironmentClass','targetEnvironmentStableIdentifier','targetResourceStableIdentifier','targetResourceScopeFingerprint','credentialProvider','credentialSecretName','credentialMaterial','syntheticIdentity','realtimeClientFactory','networkEndpoint','bindingCommand','bindingWorkflow','executionEntrypoint']) {
            if (binding[key] !== null) throw new Error(`${key}_MUST_REMAIN_NULL`);
          }

          const requiredSlots = ['runtime_adapter','target_environment','target_resource'];
          if (JSON.stringify(spec.futureBindingRequirements.map((item) => item.slotId)) !== JSON.stringify(requiredSlots)) throw new Error('FUTURE_BINDING_REQUIREMENT_SET_DRIFT');
          for (const item of spec.futureBindingRequirements) {
            if (item.futureBindingRequired !== true || item.futureBindingMustBeSeparateCertifiedBoundary !== true || item.boundNow !== false || item.concreteValuePresent !== false) throw new Error(`FUTURE_BINDING_REQUIREMENT_INVALID:${item.slotId}`);
          }
          if (spec.futureBindingRequirements[1].futureEnvironmentClassMustBeNonProductionStaging !== true || spec.futureBindingRequirements[1].productionEnvironmentForbidden !== true) throw new Error('TARGET_ENVIRONMENT_POLICY_DRIFT');
          if (spec.futureBindingRequirements[2].futureExactStableResourceIdentifierRequired !== true || spec.futureBindingRequirements[2].futureResourceMustBelongToCertifiedTargetEnvironment !== true || spec.futureBindingRequirements[2].futureResourceScopeFingerprintRequired !== true) throw new Error('TARGET_RESOURCE_POLICY_DRIFT');

          const dependentSlots = ['credential_provider','synthetic_identity_lifecycle','realtime_client_factory','sanitized_evidence_recorder','cleanup_verifier'];
          if (JSON.stringify(spec.dependentPortState.map((item) => item.slotId)) !== JSON.stringify(dependentSlots)) throw new Error('DEPENDENT_PORT_SET_DRIFT');
          for (const item of spec.dependentPortState) {
            if (item.mustRemainUnboundInThisSpecification !== true || item.boundNow !== false || item.concreteValuePresent !== false) throw new Error(`DEPENDENT_PORT_MUST_REMAIN_UNBOUND:${item.slotId}`);
          }

          const descriptors = spec.futureBindingDescriptorRequirements;
          if (descriptors.targetEnvironment.requiredEnvironmentClass !== 'non_production_staging' || descriptors.targetEnvironment.requiredProductionValue !== false) throw new Error('FUTURE_TARGET_ENV_DESCRIPTOR_POLICY_DRIFT');
          if (descriptors.targetResource.mustMatchCertifiedTargetEnvironment !== true) throw new Error('FUTURE_TARGET_RESOURCE_DESCRIPTOR_POLICY_DRIFT');

          const auth = spec.authorizationBindingRequirements;
          for (const key of ['futureAuthorizationMustBeFresh','futureAuthorizationMustBeExplicit','futureAuthorizationMustBeSingleUse','futureAuthorizationMustBindExactCertifiedRuntimeTargetBindingHead','futureAuthorizationMustBindExactNonProductionEnvironmentIdentifier','futureAuthorizationMustBindExactResourceIdentifier','futureAuthorizationMustBindExactResourceScopeFingerprint','futureReceiptMustBeSeparateSingleFileCommit','receiptParentMustEqualAuthorizedHead','futureTriggerMustBeSeparateCanonicalBoundary','runAttemptOneRequired','priorR5dAuthorizationReuseForbidden','priorR5dReceiptReuseForbidden','priorR5dTriggerReuseForbidden']) {
            if (auth[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          if (auth.genericContinuationGrantsRemoteAuthority !== false) throw new Error('GENERIC_CONTINUATION_MUST_NOT_AUTHORIZE_REMOTE');

          for (const value of Object.values(spec.prohibitedInThisSpecification)) {
            if (value !== true) throw new Error('PROHIBITED_CAPABILITY_POLICY_DRIFT');
          }

          const gov = spec.governance;
          for (const key of ['repositoryOnlyDefinition','executionWiringSpecificationDefined','executionWiringDefined','executionWiringImplemented','runtimeTargetBindingSpecificationDefined']) {
            if (gov[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          for (const key of ['runtimeTargetBindingDefined','runtimeTargetBindingImplemented','transportBound','executionEntryPointExported','targetEnvironmentBound','targetResourceBound','runtimeAdapterBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (gov[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }

          if (spec.causalState.exactRootCauseProven !== false || spec.causalState.causalPromotionAllowed !== false || spec.causalState.privatePresencePromotionAllowed !== false || spec.causalState.privateTypingBroadcastProven !== false || spec.causalState.channelMessagesCanonicalRemoteAuthority !== false) throw new Error('CAUSAL_STATE_MUST_REMAIN_BLOCKED');

          const descriptor = wiring.repositoryDescriptor();
          if (descriptor.executionWiringDefined !== true || descriptor.executionWiringImplemented !== true) throw new Error('PARENT_WIRING_DESCRIPTOR_DRIFT');
          for (const key of ['transportBound','executionEntryPointExported','targetEnvironmentBound','targetResourceBound','runtimeAdapterBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority']) {
            if (descriptor[key] !== false) throw new Error(`PARENT_WIRING_DESCRIPTOR_${key}_MUST_REMAIN_FALSE`);
          }
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check
