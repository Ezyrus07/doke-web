name: COM-B02AD Domain Completion Matrix Finalization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02ad-domain-completion-matrix-finalization-temp.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: com-b02ad-domain-completion-matrix-finalization-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: dbb47f492a40b6d7bfb3c2244fb38b3e2096574c
  B02AC_BASE: 139678acfb1188729634dcbd0c2a0634a73a51e6
  EXPECTED_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
  EXPECTED_MODULE_BLOB: db53a52234c4ef8b2928e5cfd217bc7d4a406397
  EXPECTED_CONFIG_BLOB: e1142eaf30ebb7cb39dd918c3d194479f95a621f
  EXPECTED_TEST_BLOB: de4901df687cde169d2f1cbe5cb6b15a20b4a4a8
  EXPECTED_CERTIFIER_BLOB: 91bba32dd5b42ed1359af22b8d7c81007ba2e105

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate exact B02AD derivatives and prepare final snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='com/com-001-baseline-audit'
          SELF='.github/workflows/com-b02ad-domain-completion-matrix-finalization-temp.yml'
          CERT='.github/workflows/com-b02ad-repository-only-continuation-state-registry-adapter-contract.yml'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          git merge-base --is-ancestor "$B02AC_BASE" HEAD
          temp_delta="$(git diff --name-only "$CANDIDATE_HEAD" HEAD | sort)"
          test "$temp_delta" = "$SELF"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js)" = "$EXPECTED_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02ad-repository-only-continuation-state-registry-adapter-contract.json)" = "$EXPECTED_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js)" = "$EXPECTED_TEST_BLOB"
          test "$(git rev-parse HEAD:$CERT)" = "$EXPECTED_CERTIFIER_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"

          node --check backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js
          node --check scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js
          node scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js

          npm ci --ignore-scripts
          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

          git rm "$SELF"
          actual="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' \
            "$SELF" \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"

          test "$(grep -F '**Evidência estática observada:** 1462 arquivos no escopo;' docs/DOMAIN-COMPLETION-MATRIX.md | wc -l)" -ge 1

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'docs(com): reconcile B02AD Domain Completion Matrix derivatives'

          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02ad-repository-only-continuation-state-registry-adapter-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-adapter-contract.js \
            config/com-b02ad-repository-only-continuation-state-registry-adapter-contract.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ad-repository-only-continuation-state-registry-adapter-contract.js | sort)"
          actual_final="$(git diff --name-only "$B02AC_BASE" HEAD | sort)"
          test "$actual_final" = "$expected_final"
          test "$(git rev-parse HEAD:$CERT)" = "$EXPECTED_CERTIFIER_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"

          echo "PREPARED_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "PREPARED_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "MARKDOWN_BLOB=$(git rev-parse HEAD:docs/DOMAIN-COMPLETION-MATRIX.md)"
          echo "REPORT_BLOB=$(git rev-parse HEAD:reports/generated/domain-completion-matrix-report.json)"

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"refs/heads/$BRANCH"
