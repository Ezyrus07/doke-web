name: CAT-A01 Matrix Reconciliation

on:
  push:
    branches:
      - cat/cat-001-baseline-audit

permissions:
  contents: write

concurrency:
  group: cat-a01-matrix-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CAT candidate
        uses: actions/checkout@v4
        with:
          ref: cat/cat-001-baseline-audit
          fetch-depth: 0

      - name: Reconcile CAT-A01 matrix inventory
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(file, 'utf8'));
          const cat = matrix.domains.find((domain) => domain.id === 'CAT-001');
          if (!cat) throw new Error('CAT-001 missing');
          const required = [
            'scripts/audit-service-catalog-authority-baseline.js',
            'docs/validation/CAT-001-A01-AUTHORITY-BASELINE.json',
            'docs/validation/CAT-001-A01-AUTHORITY-BASELINE.md'
          ];
          cat.requiredPaths = Array.from(new Set([...(cat.requiredPaths || []), ...required]));
          const baselineEvidence = 'CAT-A01 freezes the hybrid browser/remote service authority boundary and adds a permanent regression audit before CAT-B03 retirement.';
          if (!(cat.evidence || []).includes(baselineEvidence)) cat.evidence.push(baselineEvidence);
          matrix.version = '1.3.5';
          matrix.updatedAt = '2026-07-27T13:05:00-03:00';
          fs.writeFileSync(file, JSON.stringify(matrix, null, 2) + '\n');
          NODE

      - name: Regenerate deterministic matrix
        run: node scripts/audit-domain-completion-matrix.js --write

      - name: Validate reconciliation
        run: |
          node scripts/audit-service-catalog-authority-baseline.js
          node scripts/audit-domain-completion-matrix.js

      - name: Remove reconciler and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cat-a01-matrix-reconciliation.yml
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "Reconcile CAT-A01 domain matrix"
          git push origin "HEAD:cat/cat-001-baseline-audit"
