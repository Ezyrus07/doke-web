name: ANA-A09 Canonical Funnel Projection

on:
  pull_request:
    paths:
      - 'backend/modules/analytics/canonical-funnel-projection.js'
      - 'config/ana-a09-canonical-funnel-projection.json'
      - 'docs/ANA-A09-CANONICAL-FUNNEL-PROJECTION.md'
      - 'scripts/audit-ana-a09-canonical-funnel-projection.js'
      - 'scripts/test-ana-a09-canonical-funnel-projection.js'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - 'package.json'
      - '.github/workflows/ana-a09-canonical-funnel-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/analytics/canonical-funnel-projection.js
          node --check scripts/audit-ana-a09-canonical-funnel-projection.js
          node --check scripts/test-ana-a09-canonical-funnel-projection.js
      - name: ANA-A09 audit
        run: npm run audit:ana-a09-canonical-funnel-projection
      - name: ANA-A09 conformance
        run: npm run test:ana-a09-canonical-funnel-projection
      - name: ANA-A03 regression
        run: |
          npm run audit:ana-a03-behavioral-ingestion-identity-boundary
          npm run test:ana-a03-behavioral-ingestion-identity-boundary
      - name: ANA-A07 regression
        run: |
          npm run audit:ana-a07-freshness-window-authority
          npm run test:ana-a07-freshness-window-authority
      - name: Domain matrix regression
        run: npm run audit:domain-completion-matrix
      - name: Diff hygiene
        run: git diff --check
