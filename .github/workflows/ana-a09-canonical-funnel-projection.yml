name: ANA-A09 Canonical Funnel Projection
# ANA-A09 final generated-matrix state certification

on:
  pull_request:
    paths:
      - 'backend/modules/analytics/canonical-funnel-projection.js'
      - 'supabase/migrations/20260923235500_ana_a09_canonical_funnel_projector.sql'
      - 'supabase/tests/042_ana_a09_canonical_funnel_projector_validation.sql'
      - 'config/ana-a09-server-side-funnel-projector-runtime-readiness.json'
      - 'docs/ANA-A09-SERVER-SIDE-FUNNEL-PROJECTOR-RUNTIME-READINESS.md'
      - 'scripts/audit-ana-a09-server-side-funnel-projector-runtime-readiness.js'
      - 'scripts/test-ana-a09-server-side-funnel-projector-runtime-readiness.js'
      - 'backend/modules/analytics/dependency-watermark-authority.js'
      - 'config/ana-a07-behavior-ord-watermark-authority.json'
      - 'docs/ANA-A07-BEHAVIOR-ORD-WATERMARK-AUTHORITY.md'
      - 'config/ana-a09-canonical-funnel-projection.json'
      - 'docs/ANA-A09-CANONICAL-FUNNEL-PROJECTION.md'
      - 'scripts/audit-ana-a09-canonical-funnel-projection.js'
      - 'scripts/test-ana-a09-canonical-funnel-projection.js'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
      - 'reports/generated/ana-a09-server-side-funnel-projector-runtime-evidence.json'
      - 'package.json'
      - '.github/workflows/ana-a09-canonical-funnel-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/analytics/canonical-funnel-projection.js
          node --check scripts/audit-ana-a09-canonical-funnel-projection.js
          node --check scripts/test-ana-a09-canonical-funnel-projection.js
          node --check scripts/audit-ana-a09-server-side-funnel-projector-runtime-readiness.js
          node --check scripts/test-ana-a09-server-side-funnel-projector-runtime-readiness.js
      - name: ANA-A09 audit
        run: npm run audit:ana-a09-canonical-funnel-projection
      - name: ANA-A09 server projector candidate audit
        run: node scripts/audit-ana-a09-server-side-funnel-projector-runtime-readiness.js
      - name: ANA-A09 server projector candidate conformance
        run: node scripts/test-ana-a09-server-side-funnel-projector-runtime-readiness.js
      - name: ANA-A09 conformance
        run: npm run test:ana-a09-canonical-funnel-projection
      - name: ANA-A03 regression
        run: |
          npm run audit:ana-a03-behavioral-ingestion-identity-boundary
          npm run test:ana-a03-behavioral-ingestion-identity-boundary
      - name: ANA-A07 regression
        run: |
          npm run audit:ana-a07-freshness-window-authority
          npm run test:ana-a07-freshness-window-authority
      - name: Domain matrix regression
        run: npm run audit:domain-completion-matrix
      - name: Diff hygiene
        run: git diff --check
