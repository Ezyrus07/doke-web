name: Doke UX-CSS-DEBT-074 Promote Permanent

on:
  push:
    branches: [diag/ux-css-debt-074-promote-permanent]
    paths: [.github/workflows/diag-ux-css-debt-074-promote-permanent.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 3a2f10f67fcf7452114959d9c3a217852a765c55
      PARENT_PARENT_SHA: c79ccdced5ed83b77ef050a66cbc2284e6fc9ca8
      TARGET_FILE: assets/css/core/tokens.css
      PARENT_TARGET_BLOB: 3c2a22b31ad8a73740b1491398a3c6e82acc6a65
      EXPECTED_SHA256: ffd7ec44d056de5b777e1cbda9743936bae465ba9dfea6c0a587b4c19d1e20a8
      EXPECTED_BYTES: 47667
      PERMANENT_BRANCH: ux/ux-css-debt-074-global-tokens-compaction
      CORE_RUN: 32130614914
      GOVERNANCE_RUN: 32130661998
      SOURCE_RUN: 32130539872
      DIAG_BRANCH: diag/ux-css-debt-074-promote-permanent
      RESULT_FILE: .diagnostics/ux-css-debt-074-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.PARENT_SHA }}', fetch-depth: 2}
      - name: Guard exact parent and permanent seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"; test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH" >/dev/null
          test "$(git rev-parse origin/$PERMANENT_BRANCH)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PROMOTION GUARD PASS|parent=$PARENT_SHA|permanentSeed=$(git rev-parse origin/$PERMANENT_BRANCH)"
      - name: Rebuild exact candidate and promote with lease
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE,ls=fs.readFileSync(f,'utf8').split('\n'),rows=new Map([[40,'  --doke-type-tracking-display: -0.035em;'],[41,'  --doke-type-tracking-label: 0.08em;'],[261,'  --doke-overlay-border: 0;'],[262,'  --doke-overlay-shadow: 0 18px 48px rgba(20, 50, 80, 0.14);'],[434,'  --doke-close-button-size: var(--close-button-size);']]);for(const [i,v] of rows)if((ls[i]||'').replace(/\r$/,'')!==v)throw Error(`row drift ${i+1}`);const out=ls.filter((_,i)=>!rows.has(i)).join('\n');fs.writeFileSync(f,out);const b=fs.readFileSync(f),h=crypto.createHash('sha256').update(b).digest('hex');if(h!==process.env.EXPECTED_SHA256||b.length!==+process.env.EXPECTED_BYTES)throw Error(`identity ${h}/${b.length}`);console.log(`PROMOTION CANDIDATE PASS|sha256=${h}|bytes=${b.length}|parent=855/5|candidate=850/0|files=1|additions=0|deletions=5`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t5\t'"$TARGET_FILE"; git diff --quiet "$PARENT_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs; git diff --check
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_FILE"; git commit -m 'UX-CSS-DEBT-074: compact final superseded global token declarations' >/dev/null
          NEW_SHA="$(git rev-parse HEAD)"; test "$(git rev-parse HEAD^)" = "$PARENT_SHA"; test "$(git diff --name-only "$PARENT_SHA" "$NEW_SHA")" = "$TARGET_FILE"; test "$(git diff --numstat "$PARENT_SHA" "$NEW_SHA" -- "$TARGET_FILE")" = $'0\t5\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERMANENT_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERMANENT_BRANCH" >/dev/null
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH" >/dev/null; test "$(git rev-parse origin/$PERMANENT_BRANCH)" = "$NEW_SHA"
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"; echo "NEW_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"; echo "NEW_TARGET_BLOB=$(git hash-object "$TARGET_FILE")" >> "$GITHUB_ENV"
          echo "PROMOTION PASS|permanent=$PERMANENT_BRANCH|sha=$NEW_SHA|parent=$PARENT_SHA|tree=$(git rev-parse HEAD^{tree})|blob=$(git hash-object "$TARGET_FILE")|files=1|additions=0|deletions=5"
      - name: Restore and publish receipt
        shell: bash
        run: |
          set -euo pipefail; git reset --hard "$PARENT_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$PARENT_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "PARENT_SHA=$PARENT_SHA"; echo "NEW_SHA=$NEW_SHA"; echo "NEW_TREE=$NEW_TREE"; echo "PARENT_TARGET_BLOB=$PARENT_TARGET_BLOB"; echo "NEW_TARGET_BLOB=$NEW_TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo 'DIFF=1 file +0/-5'; echo "CORE_RUN=$CORE_RUN"; echo "GOVERNANCE_RUN=$GOVERNANCE_RUN"; echo "SOURCE_RUN=$SOURCE_RUN"; echo 'RESULT=PASS'; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record UX-CSS-DEBT-074 promotion [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
