name: Doke UX-CSS-DEBT-047 Tracked Residual Ranking

on:
  push:
    branches:
      - diag/ux-css-debt-047-tracked-residual-ranking

permissions:
  contents: read

jobs:
  ranking:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9b691b6f1387987172259db6485c2884604fec5b
      PARENT_SHA: 75ab79e2316cb61d602658597e2bf66ce487af87
      PRIOR_046_FILE: assets/css/pages/chat-components.css
      PRIOR_046_BLOB: f451819c26130e9cb84430b20d9b450865729675
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Preserve ranking helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-047-ranking.cjs /tmp/ux-css-debt-047-ranking.cjs
          node --check /tmp/ux-css-debt-047-ranking.cjs

      - name: Checkout exact certified UX-CSS-DEBT-046 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          clean: true

      - name: Guard exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git hash-object "${PRIOR_046_FILE}")" = "${PRIOR_046_BLOB}"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CHECKPOINT GUARD PASS|sha=${TARGET_SHA}|parent=${PARENT_SHA}|046blob=${PRIOR_046_BLOB}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install and generate canonical active graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures

      - name: Rank tracked active CSS residuals
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/ux-css-debt-047-ranking.cjs

      - name: Preserve governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Restore exact checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git hash-object "${PRIOR_046_FILE}")" = "${PRIOR_046_BLOB}"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0|issueCreated=0|prCreated=0"
