name: COM-B03C R5H Credential Provider Binding Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "787b05c179d874aa5d1be483a8d5ae421bfe7375"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js)" = "6419696544fb9e1906df92e3591e93efcf04b826"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json)" = "a5b6700e8335511a39cbe215459a4675f17a16a1"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.yml)" = "5b47e102a439bc94fa5385a55edc09c7e05e950f"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed credential provider binding assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js)" = "6419696544fb9e1906df92e3591e93efcf04b826"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json)" = "a5b6700e8335511a39cbe215459a4675f17a16a1"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.yml)" = "5b47e102a439bc94fa5385a55edc09c7e05e950f"
          node - <<'NODE'
          const b = require('./config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json');
          const p = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js');
          const binding = b.credentialProviderBinding;
          if (b.contractId !== 'com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary-v1') throw new Error('CONTRACT_DRIFT');
          if (b.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || b.functionalCheckpoint.r5iCreated !== false || b.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (binding.credentialProviderBindingDefined !== true || binding.credentialProviderBound !== true || binding.providerModuleBlob !== '6419696544fb9e1906df92e3591e93efcf04b826') throw new Error('PROVIDER_BINDING_DRIFT');
          for (const key of ['credentialSecretName','credentialReference','credentialMaterial']) if (binding[key] !== null) throw new Error(`CREDENTIAL_SOURCE_FORBIDDEN:${key}`);
          for (const key of ['credentialReadImplemented','secretResolutionImplemented','credentialReferenceResolutionImplemented','transportBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority']) if (binding[key] !== false) throw new Error(`REMOTE_AUTHORITY_FORBIDDEN:${key}`);
          const d = p.repositoryDescriptor();
          if (d.credentialProviderImplementationPresent !== true || d.credentialReadHardBlockImplemented !== true || d.remoteCredentialReadAuthority !== false || d.remoteExecutionAuthority !== false) throw new Error('PROVIDER_MODULE_DRIFT');
          const g = b.governance;
          for (const key of ['credentialProviderBindingDefined','credentialProviderBound']) if (g[key] !== true) throw new Error(`BINDING_MUST_BE_TRUE:${key}`);
          for (const key of ['credentialSecretNamePresent','credentialReferencePresent','credentialMaterialPresent','credentialReadImplemented','transportBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) if (g[key] !== false) throw new Error(`AUTHORITY_MUST_REMAIN_FALSE:${key}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for credential provider binding" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
