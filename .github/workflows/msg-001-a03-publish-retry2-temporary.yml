name: Doke Temporary MSG-A03 Canonical Publisher Retry 2

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a03-publish-retry2-temporary.yml'

permissions:
  contents: write

concurrency:
  group: msg-001-a03-canonical-publisher-retry2
  cancel-in-progress: false

jobs:
  publish:
    if: github.run_number == 1 && github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 20

      - name: Require immutable retry ancestor
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 9ceed2d43d34f53f5aa172531584c3c61b76ae68 HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Extract, repair and execute validated MSG-A03 generator
        run: |
          awk '/cat > \/tmp\/msg-a03-generator\.b64/ {capture=1; next} /^[[:space:]]*B64$/ && capture {exit} capture {print}' \
            .github/workflows/msg-001-a03-apply-temporary.yml \
            | grep -E '^[[:space:]]*[A-Za-z0-9+/=]+[[:space:]]*$' \
            | tr -d '[:space:]' \
            > /tmp/msg-a03-generator.b64
          test -s /tmp/msg-a03-generator.b64
          base64 --decode /tmp/msg-a03-generator.b64 > /tmp/msg-a03-generator.js
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const file = '/tmp/msg-a03-generator.js';
          const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
          const indexes = [];
          lines.forEach(function (line, index) {
            if (line.includes('getAuthorityStatus: function')) indexes.push(index);
          });
          if (indexes.length !== 2) throw new Error('Expected two authority-status generator lines, found ' + indexes.length);
          lines[indexes[0]] = "  \"getAuthorityStatus: function () { return Object.freeze({ authority: getAuthorityMode(), persistentLocalAuthority: false, pendingSynchronization: false }); },\",";
          lines[indexes[1]] = "  \"getAuthorityStatus: function () { var authority = getAuthorityMode(); return Object.freeze({ authority: authority, commandAuthority: authority === 'remote-only' ? 'server-owned' : 'fixture-memory', directBrowserDml: false, persistentLocalAuthority: false, pendingSynchronization: false }); },\",";
          fs.writeFileSync(file, lines.join('\n'));
          NODE
          node --check /tmp/msg-a03-generator.js
          node /tmp/msg-a03-generator.js
          npm run write:domain-completion-matrix

      - name: Validate MSG-A03 and cumulative contracts
        run: |
          node --check assets/js/repositories/messages-repository.js
          node --check assets/js/services/message-service.js
          node --check assets/js/services/api-repository-provider.js
          node --check scripts/audit-msg-001-a01-authority-baseline.js
          node --check scripts/audit-msg-001-a02-canonical-authority-boundary.js
          node --check scripts/audit-msg-001-a03-server-command-boundary.js
          node --check scripts/test-msg-001-a02-canonical-authority-boundary.js
          node --check scripts/test-msg-001-a03-server-command-boundary.js
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run audit:msg-001-a03-server-command-boundary
          npm run test:msg-001-a03-server-command-boundary
          npm run audit:messages-api-contract
          npm run test:messages-supabase-repository-contract
          npm run test:attachments-supabase-repository-contract
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage only canonical MSG-A03 artifacts
        run: |
          git add \
            assets/js/repositories/messages-repository.js \
            assets/js/services/message-service.js \
            assets/js/services/api-repository-provider.js \
            config/msg-001-a03-server-command-boundary.json \
            docs/MSG-001-A03-SERVER-COMMAND-BOUNDARY.md \
            scripts/audit-msg-001-a01-authority-baseline.js \
            scripts/audit-msg-001-a02-canonical-authority-boundary.js \
            scripts/audit-msg-001-a03-server-command-boundary.js \
            scripts/test-msg-001-a02-canonical-authority-boundary.js \
            scripts/test-msg-001-a03-server-command-boundary.js \
            scripts/test-messages-supabase-repository-contract.js \
            scripts/audit-messages-api-contract.js \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            .github/workflows/msg-001-a03-server-command-boundary.yml
          git add -f \
            docs/validation/MSG-001-A03-SERVER-COMMAND-BOUNDARY.json \
            reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              assets/js/repositories/messages-repository.js|assets/js/services/message-service.js|assets/js/services/api-repository-provider.js|config/msg-001-a03-server-command-boundary.json|docs/MSG-001-A03-SERVER-COMMAND-BOUNDARY.md|docs/validation/MSG-001-A03-SERVER-COMMAND-BOUNDARY.json|scripts/audit-msg-001-a01-authority-baseline.js|scripts/audit-msg-001-a02-canonical-authority-boundary.js|scripts/audit-msg-001-a03-server-command-boundary.js|scripts/test-msg-001-a02-canonical-authority-boundary.js|scripts/test-msg-001-a03-server-command-boundary.js|scripts/test-messages-supabase-repository-contract.js|scripts/audit-messages-api-contract.js|package.json|config/domain-completion-matrix.json|docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json|.github/workflows/msg-001-a03-server-command-boundary.yml) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish MSG-A03 canonical artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(msg): enforce server-owned message commands"
          git push origin HEAD:msg/msg-001-baseline-audit
