name: Doke SCHED-B04C Authenticated ORD SCHED Composition Canary Readiness

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - 'config/sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.json'
      - 'config/sched-001-b04c-authenticated-ord-sched-composition-canary-execution.json'
      - 'docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-READINESS.md'
      - 'docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-READINESS.json'
      - 'scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js'
      - 'scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js'
      - 'scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js'
      - 'scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js'
      - 'scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js'
      - '.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.yml'
      - '.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary.yml'
      - 'backend/modules/orders/order-scheduling-authority.js'
      - 'backend/modules/orders/orders-service.js'
      - 'backend/modules/orders/order-state-machine.js'
      - 'backend/modules/scheduling/scheduling-command-handlers.js'
      - 'backend/modules/scheduling/scheduling-postgres-repository.js'
      - 'config/domain-completion-matrix.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Audit B04C authenticated composition readiness
        run: npm run audit:sched-001-b04c-authenticated-ord-sched-composition-canary-readiness
      - name: Test B04C authenticated composition contract
        run: npm run test:sched-001-b04c-authenticated-ord-sched-composition-canary-readiness
      - name: Validate inert B04C execution package
        run: |
          node --check scripts/execute-sched-001-b04c-authenticated-ord-sched-composition-canary.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
      - name: Preserve B04B repository wiring
        run: |
          npm run audit:sched-001-b04b-ord-canonical-wiring-implementation
          npm run test:sched-001-b04b-ord-canonical-wiring-runtime
      - name: Preserve B04A authority readiness
        run: |
          npm run audit:sched-001-b04-ord-canonical-wiring-readiness
          npm run test:sched-001-b04-ord-canonical-wiring-readiness
      - name: Preserve authenticated scheduling evidence
        run: |
          node scripts/audit-sched-001-b02b-authenticated-composition-canary.js
          node scripts/test-sched-001-b02b-authenticated-composition-canary.js
      - name: Preserve scheduling persistence and service contracts
        run: |
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/test-sched-001-a04-scheduling-service-runtime.js
      - name: Preserve ORD scheduling handoff
        run: node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
      - name: Audit domain completion matrix
        run: npm run audit:domain-completion-matrix
