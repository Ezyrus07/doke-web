name: Doke SCHED-B04C Readiness Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-readiness-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Apply B04C readiness reconciliation
        run: node scripts/apply-sched-001-b04c-authenticated-ord-sched-canary-readiness.js
      - name: Regenerate deterministic matrix derivatives
        run: npm run write:domain-completion-matrix
      - name: Validate readiness contracts before publication
        run: |
          set -euo pipefail
          npm run test:sched-001-b04c-authenticated-ord-sched-composition-canary-readiness
          npm run audit:sched-001-b04b-ord-canonical-wiring-implementation
          npm run test:sched-001-b04b-ord-canonical-wiring-runtime
          npm run audit:sched-001-b04-ord-canonical-wiring-readiness
          npm run test:sched-001-b04-ord-canonical-wiring-readiness
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Publish reconciled readiness state
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add -A
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "docs(sched): reconcile B04C authenticated canary readiness"
          git push origin HEAD:ord/ord-001-baseline-audit
