name: ADM-A01 Authority Baseline

on:
  pull_request:
    paths:
      - 'config/adm-a01-authority-baseline.json'
      - 'docs/ADM-A01-AUTHORITY-BASELINE.md'
      - 'scripts/audit-adm-a01-authority-baseline.js'
      - 'scripts/test-adm-a01-authority-baseline.js'
      - '.github/workflows/adm-a01-authority-baseline.yml'
      - 'assets/js/services/admin-access-service.js'
      - 'assets/js/pages/admin.js'
      - 'assets/js/repositories/service-moderation-repository.js'
      - 'admin.html'

permissions:
  contents: read

jobs:
  adm-a01-authority-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check scripts/audit-adm-a01-authority-baseline.js
          node --check scripts/test-adm-a01-authority-baseline.js
      - name: Audit ADM-A01
        run: node scripts/audit-adm-a01-authority-baseline.js
      - name: Conformance ADM-A01
        run: node scripts/test-adm-a01-authority-baseline.js
      - name: COM-A05 predecessor regression
        run: |
          node scripts/audit-com-a05-moderation-appeal-media-readiness.js
          node scripts/test-com-a05-moderation-appeal-media-readiness.js
      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha }}..${{ github.sha }}
