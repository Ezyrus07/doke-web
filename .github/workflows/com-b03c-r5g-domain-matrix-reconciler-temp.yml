name: COM-B03C-R5G Domain Matrix Reconciler

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5g-domain-matrix-reconciler-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r5g-domain-matrix-reconciler-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: a501d80af4c76cd34a1d66175ca0961aac88c805
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r5g-domain-matrix-reconciler-temp.yml
  RECEIPT_PATH: config/com-b03c-r5f-r5e-fresh-execution-authorization-consumption.json
  TRIGGER_PATH: config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Fail-closed writer installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"
      - name: R5G syntax and repository self-test
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-realtime-private-auth-r5g.js
          node --check scripts/test-com-b03c-r5g-r5f-consumed-r5d-execution-trigger-readiness.js
          node scripts/test-com-b03c-r5g-r5f-consumed-r5d-execution-trigger-readiness.js
      - name: Preserve consumed receipt and certified lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:${RECEIPT_PATH})" = "12a1e21253759ae334ee6c9bf423cfe3ea7d27f4"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5d.js)" = "7cde416f2922230bae6b1e4b1e48fdfaf411da99"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5e.js)" = "e6e71f10007c796576e036902dfb1cb8e285b7f8"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5f.js)" = "fc3d88efa391d33d95906bfd6e8bf63c6d05db15"
          test ! -e "${TRIGGER_PATH}"
      - name: Remote execution hard block
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const r5g = require('./backend/modules/communities/community-realtime-private-auth-r5g');
          try {
            r5g.assertRemoteExecutionBoundaryAbsent();
            process.exit(1);
          } catch (error) {
            if (error?.code !== r5g.REMOTE_EXECUTION_BLOCK_CODE) throw error;
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Remove reconciler before canonical generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"
      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix
      - name: Enforce final reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff HEAD --name-only | sort)"
          printf '%s\n' "${actual}" | grep -qx "${WRITER_PATH}"
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}"|"${MATRIX_MD}"|"${MATRIX_JSON}") ;;
              *) echo "unauthorized final path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${actual}"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Stage and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${MATRIX_MD}"
          git add -f -- "${MATRIX_JSON}"
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "${staged}" | grep -qx "${WRITER_PATH}"
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}"|"${MATRIX_MD}"|"${MATRIX_JSON}") ;;
              *) echo "unauthorized staged path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${staged}"
          git diff --cached --check
      - name: Commit reconciled outputs and certify clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): reconcile matrix for R5G trigger readiness'
          git commit --allow-empty -m 'chore: certify R5G pre-workflow reconciled tree'
          git push origin "HEAD:${TARGET_BRANCH}"
