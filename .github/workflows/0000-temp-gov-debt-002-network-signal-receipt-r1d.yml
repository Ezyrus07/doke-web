name: TEMP GOV-DEBT-002 Network Signal Receipt R1d

on:
  push:
    branches:
      - diag/gov-debt-002-network-signal-receipt-r1d

permissions:
  contents: read

jobs:
  receipt:
    runs-on: windows-2025
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Freeze lineage and TEMP-only remote scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent='00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $tree='d982dc7c0c7cd9b227f1543a83243dc76de08b9a'
          $workflow='.github/workflows/0000-temp-gov-debt-002-network-signal-receipt-r1d.yml'
          if ((git rev-parse HEAD^).Trim() -ne $parent) { throw 'parent drift' }
          if ((git rev-parse "$parent^{tree}").Trim() -ne $tree) { throw 'parent tree drift' }
          $changed=@(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne $workflow) { throw "TEMP scope drift: $($changed -join ', ')" }
          Write-Host "GOV_DEBT_002_R1D_LINEAGE=PASS parent=$parent tree=$tree"

      - name: Reconstruct exact integrated tree and emit corrected receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent='00a034f90f7940e820fab1f74c27ade9a32d16d1'
          $worktree=Join-Path $env:RUNNER_TEMP 'gov-debt-002-r1d-integrated'
          git worktree add --detach $worktree $parent
          if ($LASTEXITCODE -ne 0) { throw 'worktree add failed' }
          git -C $worktree config user.name 'doke-diagnostic'
          git -C $worktree config user.email 'doke-diagnostic@users.noreply.github.com'
          git fetch --no-tags origin diag/ux-qa-debt-006-results-lifecycle-candidate-r1d:refs/remotes/origin/qa006-r1d
          if ($LASTEXITCODE -ne 0) { throw 'fetch QA006 failed' }
          git fetch --no-tags origin diag/ux-qa-debt-007-search-flow-mobile-r1:refs/remotes/origin/qa007-r1
          if ($LASTEXITCODE -ne 0) { throw 'fetch QA007 failed' }
          if ((git rev-parse refs/remotes/origin/qa006-r1d).Trim() -ne '0c232c375c27e9ab2e8a48a759b390ea3308309b') { throw 'QA006 source drift' }
          if ((git rev-parse refs/remotes/origin/qa007-r1).Trim() -ne '553ad212f6204294fe17b0563d7194792cfeaa45') { throw 'QA007 source drift' }
          $env:WORKTREE=$worktree

          @'
          from pathlib import Path
          import os, subprocess, textwrap
          root=Path(os.environ['GITHUB_WORKSPACE'])
          wt=Path(os.environ['WORKTREE'])
          exp={
            'qa006':'f99c8a622abacf6360680dbf5864e0b1c2ef2484',
            'qa007':'e0276bfc627c8cec0f8857b76b7f6e05233c5912',
            'state':'456e01e5fede548c276a5d4d7088a39175a3ae2a',
            'scanner':'b47e62538641e5796bee13208cec301f73107102',
          }
          def out(a,c): return subprocess.check_output(a,cwd=c,text=True).strip()
          def run(a,c): subprocess.run(a,cwd=c,check=True,stdout=subprocess.DEVNULL)
          def stage(rel):
            run(['git','add','--',rel],wt)
            return out(['git','rev-parse',f':{rel}'],wt)
          def show(ref,rel): return subprocess.check_output(['git','show',f'{ref}:{rel}'],cwd=root).decode('utf-8')

          y=show('refs/remotes/origin/qa006-r1d','.github/workflows/0000-temp-ux-qa-debt-006-results-lifecycle-candidate-r1d.yml')
          marker="@'\n          const { test, expect } = require('@playwright/test');"
          s=y.index(marker)+len("@'\n")
          e=y.index("\n          '@ | Set-Content -LiteralPath 'tests/e2e/results-entry-lifecycle.spec.js'",s)
          body=textwrap.dedent(y[s:e]).replace('\r\n','\n').replace('\r','\n')
          matched=False
          for trailing in (False,True):
            text=body+('\n' if trailing and not body.endswith('\n') else '')
            for ending in ('\n','\r\n'):
              raw=text.replace('\n',ending).encode('utf-8')
              for data in (raw,b'\xef\xbb\xbf'+raw):
                p=wt/'tests/e2e/results-entry-lifecycle.spec.js'; p.write_bytes(data)
                if stage('tests/e2e/results-entry-lifecycle.spec.js')==exp['qa006']:
                  matched=True; break
                run(['git','reset','HEAD','--','tests/e2e/results-entry-lifecycle.spec.js'],wt)
              if matched: break
            if matched: break
          if not matched: raise SystemExit('QA006 blob not reproducible')

          y=show('refs/remotes/origin/qa007-r1','.github/workflows/0000-temp-ux-qa-debt-007-search-flow-mobile-r1.yml')
          marker="cat > tests/e2e/search-flow.spec.js <<'EOF'\n"
          s=y.index(marker)+len(marker); e=y.index("\n          EOF",s)
          (wt/'tests/e2e/search-flow.spec.js').write_text(textwrap.dedent(y[s:e])+'\n',encoding='utf-8',newline='\n')
          if stage('tests/e2e/search-flow.spec.js')!=exp['qa007']: raise SystemExit('QA007 blob drift')

          p=wt/'assets/js/state/state-contracts.js'; src=p.read_text(encoding='utf-8')
          old_apply="    syncRegion(boundary, state, options);\n  }\n\n  function setBoundaryState"
          new_apply="    if (options.preserveRegion !== true) syncRegion(boundary, state, options);\n  }\n\n  function setBoundaryState"
          old_boot="      applyBoundaryState(boundary, initialState, { announce: false });"
          new_boot="      applyBoundaryState(boundary, initialState, { announce: false, preserveRegion: true });"
          if src.count(old_apply)!=1 or src.count(old_boot)!=1: raise SystemExit('STATE anchors drifted')
          p.write_text(src.replace(old_apply,new_apply).replace(old_boot,new_boot),encoding='utf-8',newline='\n')
          if stage('assets/js/state/state-contracts.js')!=exp['state']: raise SystemExit('STATE blob drift')

          p=wt/'scripts/audit-domain-completion-matrix.js'; src=p.read_text(encoding='utf-8')
          write="const WRITE = process.argv.includes('--write');\n"
          count_fn="""function signalCount(text, regex) {
            regex.lastIndex = 0;
            const matches = text.match(regex);
            return matches ? matches.length : 0;
          }
          """
          scan="      const count = signalCount(text, regex);"
          compare="if (!fs.existsSync(DOC_PATH) || fs.readFileSync(DOC_PATH, 'utf8') !== markdown) failures.push('docs/DOMAIN-COMPLETION-MATRIX.md is stale; run npm run write:domain-completion-matrix');"
          for needle in (write,count_fn,scan,compare):
            if src.count(needle)!=1: raise SystemExit('scanner anchor drift')
          src=src.replace(write,write+"const normalizeLineEndings = (value) => String(value ?? '').replace(/\\r\\n?/g, '\\n');\nconst PLAYWRIGHT_ROUTE_FETCH_SIGNAL = /\\broute\\s*\\.\\s*fetch\\s*\\(/g;\nconst PLAYWRIGHT_TEST_IMPORT = /(?:require\\s*\\(\\s*['\\\"]@playwright\\/test['\\\"]\\s*\\)|from\\s+['\\\"]@playwright\\/test['\\\"])/;\n")
          src=src.replace(count_fn,count_fn+"""
          function networkSignalCount(text, file) {
            const total = signalCount(text, SIGNALS.network);
            if (!total) return 0;
            const relative = normalizeRel(file);
            if (!relative.startsWith('tests/e2e/') || !PLAYWRIGHT_TEST_IMPORT.test(text)) return total;
            return Math.max(0, total - signalCount(text, PLAYWRIGHT_ROUTE_FETCH_SIGNAL));
          }
          """)
          src=src.replace(scan,"      const count = key === 'network' ? networkSignalCount(text, file) : signalCount(text, regex);")
          src=src.replace(compare,"if (!fs.existsSync(DOC_PATH) || normalizeLineEndings(fs.readFileSync(DOC_PATH, 'utf8')) !== normalizeLineEndings(markdown)) failures.push('docs/DOMAIN-COMPLETION-MATRIX.md is stale; run npm run write:domain-completion-matrix');")
          p.write_text(src,encoding='utf-8',newline='\n')
          if stage('scripts/audit-domain-completion-matrix.js')!=exp['scanner']: raise SystemExit('scanner blob drift')

          wanted={'assets/js/state/state-contracts.js','scripts/audit-domain-completion-matrix.js','tests/e2e/results-entry-lifecycle.spec.js','tests/e2e/search-flow.spec.js'}
          actual=set(out(['git','diff','--cached','--name-only'],wt).splitlines())
          if actual!=wanted: raise SystemExit(f'scope drift {sorted(actual)}')
          run(['git','commit','-m','test(gov): freeze R1d integrated receipt'],wt)
          sha=out(['git','rev-parse','HEAD'],wt)
          tree=out(['git','rev-parse','HEAD^{tree}'],wt)
          if tree!='bee05e8bea81436c521fb73bb36472c8d46baf52': raise SystemExit(f'integrated tree drift {tree}')
          print(f'GOV_DEBT_002_R1D_MATERIALIZATION=PASS sha={sha} tree={tree} files=4')
          Path(os.environ['RUNNER_TEMP'],'r1d-integrated-sha.txt').write_text(sha,encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "materialization rc=$LASTEXITCODE" }

          $integratedSha=(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'r1d-integrated-sha.txt') -Raw).Trim()
          Set-Location $worktree
          if (git status --porcelain) { throw 'integrated worktree dirty at receipt' }
          $scannerRev="${integratedSha}:scripts/audit-domain-completion-matrix.js"
          $qa006Rev="${integratedSha}:tests/e2e/results-entry-lifecycle.spec.js"
          $qa007Rev="${integratedSha}:tests/e2e/search-flow.spec.js"
          $stateRev="${integratedSha}:assets/js/state/state-contracts.js"
          if ((git rev-parse $scannerRev).Trim() -ne 'b47e62538641e5796bee13208cec301f73107102') { throw 'scanner final blob drift' }
          if ((git rev-parse $qa006Rev).Trim() -ne 'f99c8a622abacf6360680dbf5864e0b1c2ef2484') { throw 'QA006 final blob drift' }
          if ((git rev-parse $qa007Rev).Trim() -ne 'e0276bfc627c8cec0f8857b76b7f6e05233c5912') { throw 'QA007 final blob drift' }
          if ((git rev-parse $stateRev).Trim() -ne '456e01e5fede548c276a5d4d7088a39175a3ae2a') { throw 'STATE final blob drift' }
          if ((git rev-parse "${integratedSha}^{tree}").Trim() -ne 'bee05e8bea81436c521fb73bb36472c8d46baf52') { throw 'integrated tree drift' }

          Set-Location $env:GITHUB_WORKSPACE
          $remoteChanged=@(git diff --name-only HEAD^ HEAD)
          if ($remoteChanged.Count -ne 1 -or $remoteChanged[0] -ne '.github/workflows/0000-temp-gov-debt-002-network-signal-receipt-r1d.yml') { throw 'remote TEMP scope changed' }
          Write-Host "GOV_DEBT_002_R1D_FINAL=PASS integratedTree=bee05e8bea81436c521fb73bb36472c8d46baf52 scannerBlob=b47e62538641e5796bee13208cec301f73107102 qa006Blob=f99c8a622abacf6360680dbf5864e0b1c2ef2484 qa007Blob=e0276bfc627c8cec0f8857b76b7f6e05233c5912 stateBlob=456e01e5fede548c276a5d4d7088a39175a3ae2a linuxSemanticRun=33223565977 windowsIntegratedRun=33223643094 windowsMatrix=PASS lifecycle=5/5 acceptance=5/5 globalState=PASS agentGovernance=PASS receiptInterpolationFixed=true currentProcessWorktreeFixed=true criteriaRelaxed=0 introducedRegressions=0 matrixMutation=false snapshotMutation=false remoteProductMutation=false permanentBranchCreated=false prCreated=false readyForReview=false merge=false staging=false production=false repositoryOnly=true"
