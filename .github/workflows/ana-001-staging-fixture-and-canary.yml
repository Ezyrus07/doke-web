name: ANA-001 Staging Fixture Provision + Authenticated Canary

on:
  push:
    branches:
      - ana/ana-001-foundation
    paths:
      - 'config/ana-001-staging-fixture-and-canary-execution.json'

permissions:
  contents: read

concurrency:
  group: ana-001-staging-fixture-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.guard.outputs.execute }}
    steps:
      - name: Checkout one-shot trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: guard
        name: Validate one-shot authorization envelope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          trigger='config/ana-001-staging-fixture-and-canary-execution.json'
          status="$(git diff-tree --no-commit-id --name-status -r HEAD -- "$trigger")"
          test "$status" = $'A\t'"$trigger"
          node <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('config/ana-001-staging-fixture-and-canary-execution.json','utf8'));
          if (c.contractId !== 'ana-001-staging-fixture-and-canary-execution-v1') throw new Error('ANA_FIXTURE_CONTRACT_MISMATCH');
          if (c.environment !== 'staging' || c.projectRef !== 'zwkczgewzbsorbrjuzpb') throw new Error('ANA_FIXTURE_TARGET_MISMATCH');
          if (c.productionAllowed !== false) throw new Error('ANA_FIXTURE_PRODUCTION_MUST_BE_BLOCKED');
          if (c.authorization?.fixturePreparation !== 'Autorizo provisionar os 4 usuários canário via Supabase Admin API e aplicar o seed 002 controlado somente em staging.') throw new Error('ANA_FIXTURE_AUTHORIZATION_MISMATCH');
          if (c.authorization?.authenticatedCanary !== 'execute-ana-staging-canary') throw new Error('ANA_CANARY_AUTHORIZATION_MISMATCH');
          if (c.singleUse !== true || c.consumed !== false) throw new Error('ANA_FIXTURE_ONE_SHOT_INVALID');
          NODE
          echo 'execute=true' >> "$GITHUB_OUTPUT"

  fixture-and-canary:
    needs: authorize
    if: needs.authorize.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOKE_ENVIRONMENT: staging
      DOKE_SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DOKE_STAGING_CLIENT_EMAIL: cliente@doke.local
      DOKE_STAGING_PROFESSIONAL_EMAIL: profissional@doke.local
      DOKE_STAGING_SUPPORT_EMAIL: suporte@doke.local
      DOKE_STAGING_ADMIN_EMAIL: admin@doke.local
      DOKE_STAGING_AUTH_PROVISION_CONFIRM: provision-staging-auth-canaries
      DOKE_ANA_STAGING_CANARY_CONFIRM: execute-ana-staging-canary
      DOKE_ANA_STAGING_SEARCH_QUERY: Pintura
      DOKE_ANA_STAGING_SEARCH_SERVICE_ID: 55555555-5555-4555-8555-555555555555
      DOKE_ANA_STAGING_SERVICE_ID: 55555555-5555-4555-8555-555555555555
      DOKE_ANA_STAGING_OWNER_SERVICE_ID: 55555555-5555-4555-8555-555555555555
      DOKE_ANA_STAGING_ORDER_ID: 66666666-6666-4666-8666-666666666666
    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Verify target and retrieve server-side API keys in memory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          project_json="$(curl -fsS "https://api.supabase.com/v1/projects/${DOKE_SUPABASE_PROJECT_REF}" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          test "$(jq -r '.id' <<<"$project_json")" = "${DOKE_SUPABASE_PROJECT_REF}"
          test "$(jq -r '.name' <<<"$project_json")" = "doke-web-staging"
          region="$(jq -r '.region' <<<"$project_json")"
          test -n "$region"
          echo "DOKE_SUPABASE_REGION=$region" >> "$GITHUB_ENV"
          keys_json="$(curl -fsS "https://api.supabase.com/v1/projects/${DOKE_SUPABASE_PROJECT_REF}/api-keys?reveal=true" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          secret_key="$(jq -r '[.[] | select(.type=="secret" and .disabled!=true)][0].api_key // [.[] | select(.name=="service_role" and .disabled!=true)][0].api_key // empty' <<<"$keys_json")"
          publishable_key="$(jq -r '[.[] | select(.type=="publishable" and .disabled!=true)][0].api_key // [.[] | select(.name=="anon" and .disabled!=true)][0].api_key // empty' <<<"$keys_json")"
          test -n "$secret_key"
          test -n "$publishable_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$publishable_key"
          echo "DOKE_SUPABASE_URL=https://${DOKE_SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "DOKE_SUPABASE_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "DOKE_SUPABASE_ANON_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Generate masked synthetic Auth credentials
        shell: bash
        run: |
          set -euo pipefail
          for role in CLIENT PROFESSIONAL SUPPORT ADMIN; do
            password="$(node -e "const c=require('crypto'); process.stdout.write('Dk!'+c.randomBytes(24).toString('base64url')+'9a')")"
            echo "::add-mask::$password"
            echo "DOKE_STAGING_${role}_PASSWORD=$password" >> "$GITHUB_ENV"
          done

      - name: Repository and environment preflight
        run: |
          node scripts/audit-ana-a03-runtime-readiness.js
          node scripts/test-ana-a03-runtime-readiness.js
          node scripts/audit-ana-a04-runtime-readiness.js
          node scripts/test-ana-a04-runtime-readiness.js
          node scripts/audit-ana-a05-runtime-readiness.js
          node scripts/test-ana-a05-runtime-readiness.js
          node scripts/audit-ana-001-staging-canary.js
          node scripts/test-ana-001-staging-canary.js

      - name: Provision four staging Auth canaries through Admin API
        run: npm run provision:staging-auth-canaries

      - name: Apply controlled seed 002 only to staging
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for host in "aws-0-${DOKE_SUPABASE_REGION}.pooler.supabase.com" "aws-1-${DOKE_SUPABASE_REGION}.pooler.supabase.com" "db.${DOKE_SUPABASE_PROJECT_REF}.supabase.co"; do
            if PGHOST="$host" PGPORT=5432 PGDATABASE=postgres PGUSER="postgres.${DOKE_SUPABASE_PROJECT_REF}" PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require \
              psql -v ON_ERROR_STOP=1 -f supabase/seed/002_mvp_controlled_seed.sql; then
              success=1
              break
            fi
          done
          test "$success" = "1"

      - name: Set bounded ANA reconciliation window
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const end = new Date(Date.now() + 5 * 60_000);
          const start = new Date(Date.now() - 30 * 60_000);
          console.log('DOKE_ANA_STAGING_WINDOW_START=' + start.toISOString());
          console.log('DOKE_ANA_STAGING_WINDOW_END=' + end.toISOString());
          NODE

      - name: Validate canary environment
        run: npm run execute:ana-001-staging-canary:check-env

      - name: Execute authenticated ANA staging canary
        run: npm run execute:ana-001-staging-canary -- --write-report

      - name: Verify no production target and record fixture postconditions
        shell: bash
        run: |
          set -euo pipefail
          test "${DOKE_SUPABASE_PROJECT_REF}" = "zwkczgewzbsorbrjuzpb"
          node -e "const r=require('./reports/generated/ana-001-staging-canary.json'); if(r.status!=='passed'||r.summary.failed!==0) process.exit(1)"

      - name: Upload sanitized ANA canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ana-001-staging-canary-${{ github.run_id }}
          path: reports/generated/ana-001-staging-canary.json
          if-no-files-found: warn
          retention-days: 14
