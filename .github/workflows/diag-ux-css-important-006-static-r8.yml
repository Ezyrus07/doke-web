        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/prove.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA"..HEAD)" = '.github/workflows/diag-ux-css-important-006-static-r8.yml'
          git checkout "$TARGET_SHA" -- .; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),f=process.env.TARGET_FILE;
          const parent=fs.readFileSync(f,'utf8');if((parent.match(/!important\b/g)||[]).length!==23)throw Error('parent drift');let s=parent.replace(/\s*!important\b/g,'');const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          function restore(selector,props){const re=new RegExp(esc(selector)+'\\s*\\{','g'),all=[...s.matchAll(re)].map(m=>{const b=s.indexOf('{',m.index),e=s.indexOf('}',b);return{b,e,block:s.slice(b+1,e)}}),hits=all.filter(x=>props.every(p=>new RegExp(`(^|\\n)\\s*${esc(p)}\\s*:`,'m').test(x.block)));if(hits.length!==1)throw Error(`restore ${selector} hits=${hits.length}`);let block=hits[0].block;for(const p of props){const pr=new RegExp(`(^|\\n)(\\s*${esc(p)}\\s*:[^;]+);`,'m');block=block.replace(pr,'$1$2 !important;')}s=s.slice(0,hits[0].b+1)+block+s.slice(hits[0].e)}
          restore('body.home-index-shell .featured-services,\n  body.home-index-shell .before-after,\n  body.home-index-shell .short-videos',['overflow']);restore('body.home-index-shell .doke-search-panel__form',['position','overflow']);restore('body.home-index-shell .home-search-hero__field::before,\n  body.home-index-shell .home-search-hero__field::after',['display']);restore('body.home-index-shell .featured-services .content-rail',['overflow']);
          if((s.match(/!important\b/g)||[]).length!==5)throw Error(`candidate count ${(s.match(/!important\b/g)||[]).length}`);fs.writeFileSync('/tmp/candidate.css',s);const z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex');let stat='';try{stat=cp.execFileSync('git',['diff','--no-index','--numstat','/tmp/parent.css','/tmp/candidate.css'],{encoding:'utf8'}).trim()}catch(e){stat=String(e.stdout||'').trim()}const [a,d]=stat.split(/\s+/).map(Number);if(a!==18||d!==18)throw Error(`diff ${stat}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=23->5|files=1|additions=${a}|deletions=${d}|priorityMarkersRemoved=18|searchMarkersPreserved=3|sectionOverflowPreserved=1|featuredOverflowGuardPreserved=1`);

          function stripComments(x){return x.replace(/\/\*[\s\S]*?\*\//g,'')}
          function matchBrace(x,b){let d=0;for(let i=b;i<x.length;i++){if(x[i]==='{')d++;else if(x[i]==='}'&&--d===0)return i}throw Error('brace')}
          function parse(x,ctx=[],out=[]){x=stripComments(x);let i=0;while(i<x.length){while(i<x.length&&/\s/.test(x[i]))i++;if(i>=x.length)break;let b=x.indexOf('{',i),semi=x.indexOf(';',i);if(semi>=0&&(b<0||semi<b)){i=semi+1;continue}if(b<0)break;const head=x.slice(i,b).trim(),e=matchBrace(x,b),body=x.slice(b+1,e);if(head.startsWith('@media'))parse(body,[...ctx,head.replace(/\s+/g,' ')],out);else out.push({selector:head.split(',').map(v=>v.trim().replace(/\s+/g,' ')),body,ctx:[...ctx],order:out.length});i=e+1}return out}
          function decl(body,p){const m=body.match(new RegExp(`(?:^|;)\\s*${esc(p)}\\s*:\\s*([^;]+)`));if(!m)return null;let v=m[1].trim(),important=/\s*!important\s*$/.test(v);v=v.replace(/\s*!important\s*$/,'').trim().replace(/\s+/g,' ');return{value:v,important}}
          function rule(rules,selector,prop,value){const hits=rules.filter(r=>r.selector.includes(selector)&&decl(r.body,prop)&&(!value||decl(r.body,prop).value===value));if(!hits.length)throw Error(`rule ${selector} ${prop} ${value||''}`);return hits}
          const t=parse(parent),align=parse(fs.readFileSync('assets/css/pages/home/mobile-alignment.css','utf8'));
          const manifest=fs.readFileSync('assets/css/pages/home-runtime.css','utf8'),feed=fs.readFileSync('assets/css/pages/home-runtime-feed.css','utf8');if(!(manifest.indexOf('home-runtime-components.css')>=0&&manifest.indexOf('home-runtime-feed.css')>manifest.indexOf('home-runtime-components.css')&&feed.includes('./home/mobile-alignment.css')))throw Error('import order');
          const trackSel='body.home-index-shell #featured-services-track',shortSel='body.home-index-shell #short-videos-track',railSel='body.home-index-shell .short-videos .content-rail',scrollSel='body.home-index-shell #featured-services-track::-webkit-scrollbar';
          const trackProps=['display','flex-direction','flex-wrap','grid-template-columns','grid-auto-flow','overflow-x','overflow-y','overscroll-behavior-x','scroll-snap-type','-webkit-overflow-scrolling'];for(const p of trackProps){const a=rule(t,trackSel,p)[0],b=rule(align,trackSel,p)[0],da=decl(a.body,p),db=decl(b.body,p);if(!da.important||db.important||da.value!==db.value)throw Error(`track ${p} ${JSON.stringify({da,db})}`)}
          const shortProps=['display','grid-template-columns','grid-auto-flow','grid-auto-columns','overflow'];for(const p of shortProps){const a=rule(t,shortSel,p)[0],b=rule(align,shortSel,p)[0],da=decl(a.body,p),db=decl(b.body,p);if(!da.important||db.important||da.value!==db.value)throw Error(`short ${p}`)}
          {const a=rule(t,railSel,'overflow','visible')[0],b=rule(align,railSel,'overflow','visible')[0];if(!decl(a.body,'overflow').important||decl(b.body,'overflow').important)throw Error('short rail')}
          {const a=rule(t,scrollSel,'display','none')[0],b=rule(align,scrollSel,'display','none')[0];if(!decl(a.body,'display').important||decl(b.body,'display').important)throw Error('scrollbar')}
          const groupSel='body.home-index-shell .featured-services .content-rail',groups=rule(t,groupSel,'overflow','hidden').sort((a,b)=>a.order-b.order);if(groups.length<2)throw Error('featured overflow rules');const first=groups[0],last=groups[groups.length-1];if(!decl(first.body,'overflow').important||!decl(last.body,'overflow').important||last.order<=first.order)throw Error('featured ordering');
          const index=fs.readFileSync('index.html','utf8');const beforeAfterClass=(index.match(/class=["'][^"']*\bbefore-after\b[^"']*["']/g)||[]).length,beforeTrack=(index.match(/id=["']before-after-track["']/g)||[]).length;if(beforeAfterClass||beforeTrack)throw Error(`inactive co-selector drift ${beforeAfterClass}/${beforeTrack}`);
          console.log('CASCADE PROOF|removed=18|laterSameKeySameValue=17|sameTargetLaterImportantWinner=1|inactiveBeforeAfterMarkup=0/0|importOrder=components-before-feed|alignmentLoadedLater=1');
          console.log('BROWSER REQUIRED|value=0|reason=all-active-removed-priorities-have-identical-later-cascade-winners;inactive-co-selectors-have-zero-markup');
          console.log('RESULT=PASS');
          NODE
      - id: restore
        if: always()
        run: set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.prove.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PROVE=${{ steps.prove.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|CASCADE PROOF|BROWSER REQUIRED|RESULT=)' /tmp/prove.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 260 /tmp/prove.log || true; fi; } >/tmp/evidence.txt; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 006 static r8 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
