name: Doke UX CSS Important 003 Candidate Governance R1
on:
  push:
    branches: [diag/ux-css-important-003-candidate-governance-r1]
    paths: [.github/workflows/diag-ux-css-important-003-candidate-governance-r1.yml]
permissions:
  contents: write
jobs:
  governance:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: b44fe12f2e81cbe155f154527aed78b90144c552
      TARGET_FILE: assets/css/pages/home/mobile-layout.css
      TARGET_BLOB: 576d351eb5e1447cd6e1e188e005b8153573fb3f
      DIAG_BRANCH: diag/ux-css-important-003-candidate-governance-r1
      RESULT_FILE: .diagnostics/ux-css-important-003-candidate-governance-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 2}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: governance
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/gov.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          node scripts/generate-responsive-index-baseline.js
          test -f reports/responsive-index-baseline.json
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE,src=fs.readFileSync(f,'utf8');
          const oldCard=`  body.home-index-shell .home-search-hero__card {\n    display: grid !important;\n    gap: 12px;\n    padding: 10px 10px 12px;\n    background: linear-gradient(180deg, var(--home-stage15-brand) 0%, var(--home-stage15-brand-strong) 100%);\n    border: 1px solid color-mix(in srgb, var(--home-stage15-brand) 82%, white);\n    border-radius: var(--home-stage15-radius);\n    box-shadow: var(--doke-home-mobile-hero-shadow);\n    overflow: hidden !important;\n  }`;
          const newCard=oldCard.replace('display: grid !important;','display: grid;').replace('overflow: hidden !important;','overflow: hidden;');
          const oldRail=`  body.home-index-shell .short-videos .content-rail {\n    display: block !important;\n    overflow: visible;\n  }`;
          const newRail=oldRail.replace('display: block !important;','display: block;');
          const oldTrack=`  body.home-index-shell .short-videos .short-videos__track {\n    display: grid !important;\n    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n    grid-auto-flow: row !important;\n    grid-auto-columns: auto !important;\n    gap: 10px;\n    width: 100%;\n    max-width: 100%;\n    min-width: 0;\n    overflow: visible !important;\n    padding: 0;\n  }`;
          const newTrack=oldTrack.replace(/ !important/g,'');
          if((src.match(/!important\b/g)||[]).length!==29||!src.includes(oldCard)||!src.includes(oldRail)||!src.includes(oldTrack))throw Error('parent drift');const out=src.replace(oldCard,newCard).replace(oldRail,newRail).replace(oldTrack,newTrack);fs.writeFileSync(f,out);const z=fs.readFileSync(f),h=crypto.createHash('sha256').update(z).digest('hex');if((out.match(/!important\b/g)||[]).length!==21)throw Error(`candidate ${h}/${z.length}`);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=29->21|files=1|priorityMarkersRemoved=8`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'8\t8\t'"$TARGET_FILE"; git diff --check
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log; grep -q 'Failures: 0' /tmp/responsive.log; grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277|baselineSource=exact-parent'
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          node <<'NODE'
          const fs=require('fs'),m=fs.readFileSync('/tmp/conflicts.log','utf8').match(/Conflicting class\/property pairs:\s*(\d+)/);if(!m||+m[1]>339)throw Error('conflict regression');console.log(`CONFLICTS PASS|count=${m[1]}|maxBaseline=339|regression=0`)
          NODE
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log; grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log; grep -q 'Critical flows: 15' /tmp/domain.log; grep -q 'Average maturity: 2.91/6' /tmp/domain.log; grep -q 'Critical blockers: 12' /tmp/domain.log
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md 2>/dev/null || true
          npm run audit:active-legacy-structures
          npm run audit:important-reduction-plan
          npm run audit:global-css-design-system
          node <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('docs/validation/global-cycle-121-important-baseline-by-group-report.json','utf8')),p=JSON.parse(fs.readFileSync('reports/generated/css-important/global-cycle-117-important-reduction-plan-report.json','utf8')),s=b.summary;if(s.totalImportant!==11249||s.outsideServiceCardImportant!==11187||s.filesWithImportant!==35)throw Error(`important ${JSON.stringify(s)}`);if(p.summary.affectedFiles!==34||p.summary.totalImportantOutsideServiceCard!==11187||p.summary.lowRiskFileCount!==0||p.summary.byRisk?.['high-baseline-required']!==11166||p.summary.byRisk?.['medium-baseline-required']!==21)throw Error(`plan ${JSON.stringify(p.summary)}`);console.log('IMPORTANT BASELINE PASS|total=11249|outsideServiceCard=11187|files=35|delta=-8');console.log('QUEUE PASS|affectedFiles=34|lowRiskFiles=0|highBaselineRequired=11166|mediumBaselineRequired=21|targetImportant=21');
          NODE
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const v=require('/tmp/audit.json').metadata?.vulnerabilities||{};if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)throw Error(`deps ${JSON.stringify(v)}`);console.log(`DEPENDENCY PASS|total=${v.total}|critical=${v.critical}|high=${v.high}|moderate=${v.moderate}|low=${v.low}`)
          NODE
          echo "AUDIT_EXIT=$code"; echo 'GOVERNANCE PASS|duplicates=0/0|domain=23/15/2.91/12|sourceRun=32137798522|rawRun=32137749131'
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.governance.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "GOVERNANCE=${{ steps.governance.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|RESPONSIVE PASS|CONFLICTS PASS|IMPORTANT BASELINE PASS|QUEUE PASS|DEPENDENCY PASS|GOVERNANCE PASS)\|' /tmp/gov.log || true; grep '^AUDIT_EXIT=' /tmp/gov.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 220 /tmp/gov.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record important003 candidate governance [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
