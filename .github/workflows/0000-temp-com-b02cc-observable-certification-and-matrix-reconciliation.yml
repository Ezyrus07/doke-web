name: 0000 TEMP COM-B02CC Observable Certification and Matrix Reconciliation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/0000-temp-com-b02cc-observable-certification-and-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  certify-reconcile-and-finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: b7e590ae04ca314cbe5d23e5770fded5261b3141
      PREDECESSOR_TREE: 267fd2f6b15cdc246015c1d63690d6e94a3f3544
      CANDIDATE_HEAD: c249cd90871727c5ddc14263da875a84983b9f7c
      CANDIDATE_TREE: 5a2ecd7b0b026f3fcae4023b4a7fed71a984ca98
      INVOCATION_PROOF_HEAD: 2b28a152deeae09dea9d2f2e952506c4c9a01180
      INVOCATION_PROOF_TREE: c808f8b440dd3243b628804f5852a439fc75e0cb
      INVOCATION_PROOF_RUN_ID: '32648813775'
      INVOCATION_PROOF_JOB_ID: '97217121069'
      B02CC_MODULE_BLOB: 5fde3fbf90e7531ff60c984b914741ad55e8c6dd
      B02CC_CONFIG_BLOB: 77f054bdaac72dbd28845c8dac45282ddbfb0bd4
      B02CC_TEST_BLOB: f5dbba3002fe89242041701a9028821150044d03
      B02CC_WORKFLOW_BLOB: f90bb4ab78da15ed8de9e6ef55399b34a39eef1f
      B02CB_MODULE_BLOB: 7775c39d4d30f4fdab68c51799f8bc56513d9be9
      B02CB_CONFIG_BLOB: 704670c254ea6eadf2a0b66ea03e788c3276fb34
      B02CB_TEST_BLOB: f6db7fac35a612e16027793a940107b19e56980a
      B02CB_WORKFLOW_BLOB: 765c7dc0f408792cff2e05b6fe3b341cf67b29f0
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/0000-temp-com-b02cc-observable-certification-and-matrix-reconciliation.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-operation-method-invocation.js
      CONFIG: config/com-b02cc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-operation-method-invocation.json
      TEST: scripts/test-com-b02cc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-operation-method-invocation.js
      WORKFLOW: .github/workflows/com-b02cc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-operation-method-invocation.yml
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      TEMP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEMP_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02CC candidate, consumed invocation proof, and TEMP-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEMP_HEAD_SHA"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$INVOCATION_PROOF_HEAD^{tree}")" = "$INVOCATION_PROOF_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD
          git merge-base --is-ancestor "$INVOCATION_PROOF_HEAD" HEAD
          git merge-base --is-ancestor "$CANDIDATE_HEAD" HEAD
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          test "$(git diff --name-only "$INVOCATION_PROOF_HEAD" "$CANDIDATE_HEAD")" = "$WORKFLOW"

          expected4="$(printf '%s\n' "$WORKFLOW" "$TARGET" "$CONFIG" "$TEST" | sort)"
          test "$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)" = "$expected4"

          test "$(git rev-parse "$INVOCATION_PROOF_HEAD:$TARGET")" = "$B02CC_MODULE_BLOB"
          test "$(git rev-parse "$INVOCATION_PROOF_HEAD:$CONFIG")" = "$B02CC_CONFIG_BLOB"
          test "$(git rev-parse "$INVOCATION_PROOF_HEAD:$TEST")" = "$B02CC_TEST_BLOB"
          test "$(git rev-parse HEAD:$TARGET)" = "$B02CC_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02CC_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02CC_TEST_BLOB"
          test "$(git rev-parse HEAD:$WORKFLOW)" = "$B02CC_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.js)" = "$B02CB_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02cb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.json)" = "$B02CB_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02cb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.js)" = "$B02CB_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02cb-repository-only-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-invocation-harness.yml)" = "$B02CB_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Re-certify recorded invocation proof without invoking methods again
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          test "$INVOCATION_PROOF_RUN_ID" = '32648813775'
          test "$INVOCATION_PROOF_JOB_ID" = '97217121069'
          grep -F 'const result = method(testCase.packet);' "$TARGET"
          grep -F 'assert.equal(invocation.operationMethodInvocationCount, 3);' "$TEST"
          grep -F 'assert.equal(invocation.executableOperationMethodsInvoked, true);' "$TEST"
          grep -F 'assert.equal(invocation.allInvocationResultsPreparedAndEffectless, true);' "$TEST"
          grep -F '"operationMethodInvocationAuthority": true' "$CONFIG"
          grep -F '"continuationStateStorageAuthority": false' "$CONFIG"
          grep -F '"registryOperationInvocationAuthority": false' "$CONFIG"
          grep -F '"registryLookupAuthority": false' "$CONFIG"
          grep -F '"registryReleaseAuthority": false' "$CONFIG"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"
          ! grep -E 'activeExecuteHandlerInvoked[[:space:]]*:[[:space:]]*true|repositoryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET" "$CONFIG"

      - name: Reconcile Matrix only for proven stale-derived blocker
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- config/domain-completion-matrix.json
          expected_generated="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual_generated="$(git diff --name-only | sort)"
          test "$actual_generated" = "$expected_generated"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Commit permanent derived state and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MATRIX_MD"
          git add -f "$MATRIX_REPORT"
          git rm "$TEMP_PATH"
          expected_staged="$(printf '%s\n' "$TEMP_PATH" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual_staged="$(git diff --cached --name-only | sort)"
          test "$actual_staged" = "$expected_staged"
          git commit -m "ci(com): finalize B02CC repository-only synthetic invocation certification [run $GITHUB_RUN_ID]"

      - name: Certify permanent B02CC tree without re-invocation
        shell: bash
        run: |
          set -euo pipefail
          expected6="$(printf '%s\n' "$WORKFLOW" "$TARGET" "$CONFIG" "$TEST" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected6"
          ! git ls-tree -r --name-only HEAD | grep -E '(^|/)temp-com-b02cc-|0000-temp-com-b02cc-'
          test "$(git rev-parse HEAD:$TARGET)" = "$B02CC_MODULE_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$B02CC_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$B02CC_TEST_BLOB"
          test "$(git rev-parse HEAD:$WORKFLOW)" = "$B02CC_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          node --check "$TARGET"
          node --check "$TEST"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"

      - name: Fast-forward branch only if TEMP head is still current
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$TEMP_HEAD_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          pushed_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$pushed_head" = "$(git rev-parse HEAD)"
