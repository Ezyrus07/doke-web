name: TEMP UX-NAV-DEBT-003 Permanent Promotion Certifier

on:
  push:
    branches:
      - diag/ux-nav-debt-003-promotion-readiness-r5-run

permissions:
  contents: write

jobs:
  promote_and_certify:
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      PARENT: b260bfb59241d15f5cee76dedd2b60e115919425
      PARENT_TREE: bbe1dc29f352908a7603e194215eb7ca0a3b9c43
      PERMANENT_BRANCH: ux/ux-nav-debt-003-filter-state-rearm
      PREVIOUS_PERMANENT_BRANCH: qa/ux-qa-debt-008e-results-header-rail-contract
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-nav-debt-003-promotion-readiness-r5.yml
      BASE_ROUTER_BLOB: 453d9f1bdd6bda9690692117e1f42c0719535c06
      BASE_SEARCH_BLOB: 1ee0c15efbf028f203b295f0051cb9a6c628446e
      EXPECTED_ROUTER_BLOB: f3b4d3f303967055173e418244dc0d4b3a1b0e55
      EXPECTED_SEARCH_BLOB: b42704c5df2f039bd6b68b3ead8153c92aa3de7c
      EXPECTED_PATCH_SHA256: b7efeb26db11ba08512399d8915647ae9649d3eb38de630d1f16fe96acbd7e87
      EXPECTED_TREE: 9e5e8cf0e9f4515a58420fea61eeb4a36eaffe7f

    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Freeze authorization and identity
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          [[ "$(git rev-parse "$PARENT^{tree}")" == "$PARENT_TREE" ]] || { echo 'Parent TREE mismatch'; exit 1; }
          mapfile -t controller_changed < <(git diff --name-only "$PARENT" "$head")
          [[ ${#controller_changed[@]} -eq 1 && "${controller_changed[0]}" == "$WORKFLOW_PATH" ]] || { printf 'Controller scope mismatch: %s\n' "${controller_changed[*]}"; exit 1; }
          [[ "$(git rev-parse "$PARENT:assets/js/core/stable-shell-router.js")" == "$BASE_ROUTER_BLOB" ]] || { echo 'Router preimage drift'; exit 1; }
          [[ "$(git rev-parse "$PARENT:assets/js/pages/search-data.js")" == "$BASE_SEARCH_BLOB" ]] || { echo 'Search-data preimage drift'; exit 1; }
          target_remote="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          [[ "$target_remote" == "$PARENT" ]] || { echo "Permanent branch start mismatch: $target_remote"; exit 1; }
          previous_remote="$(git ls-remote origin "refs/heads/$PREVIOUS_PERMANENT_BRANCH" | awk '{print $1}')"
          [[ "$previous_remote" == "$PARENT" ]] || { echo "Previous permanent branch moved: $previous_remote"; exit 1; }
          echo "CONTROLLER_SHA=$head"
          echo 'PARENT_IDENTITY=PASS'
          echo 'R4_PREIMAGE_DRIFT=false'
          echo 'PERMANENT_BRANCH_START=PASS'
          echo 'PREVIOUS_PERMANENT_UNTOUCHED=PASS'

      - name: Materialize exact NAV-003 bytes and push permanent branch
        run: |
          set -euo pipefail
          git worktree add --detach ../nav003-permanent "$PARENT"

          python - ../nav003-permanent <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])

          search = root / 'assets/js/pages/search-data.js'
          text = search.read_text(encoding='utf-8')
          old = """  Doke.searchFilterState = api;\n  if (Doke.searchFilterStateInstallation && Doke.searchFilterStateInstallation.cleanup) {\n    Doke.searchFilterStateInstallation.cleanup();\n  }\n  Doke.searchFilterStateInstallation = install();\n}());\n"""
          new = """  Doke.searchFilterState = api;\n\n  function installCanonicalSearchFilterState() {\n    if (Doke.searchFilterStateInstallation && Doke.searchFilterStateInstallation.cleanup) {\n      Doke.searchFilterStateInstallation.cleanup();\n    }\n    Doke.searchFilterStateInstallation = install();\n    return Doke.searchFilterStateInstallation;\n  }\n\n  root.DokeInitSearchFilterState = installCanonicalSearchFilterState;\n  installCanonicalSearchFilterState();\n}());\n"""
          if text.count(old) != 1:
              raise SystemExit('search-data install tail not found exactly once')
          search.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          router = root / 'assets/js/core/stable-shell-router.js'
          text = router.read_text(encoding='utf-8')
          old = "    '/resultados.html': ['DokeInitSearchResults'],"
          new = "    '/resultados.html': ['DokeInitSearchFilterState', 'DokeInitSearchResults'],"
          if text.count(old) != 1:
              raise SystemExit('Resultados ROUTE_INIT entry not found exactly once')
          router.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          mapfile -t changed < <(git -C ../nav003-permanent diff --name-only "$PARENT")
          [[ ${#changed[@]} -eq 2 ]] || { printf 'Candidate file count mismatch: %s\n' "${changed[*]}"; exit 1; }
          printf '%s\n' "${changed[@]}" | sort > "$RUNNER_TEMP/nav003-permanent-files.txt"
          printf '%s\n' 'assets/js/core/stable-shell-router.js' 'assets/js/pages/search-data.js' | sort > "$RUNNER_TEMP/nav003-permanent-expected.txt"
          diff -u "$RUNNER_TEMP/nav003-permanent-expected.txt" "$RUNNER_TEMP/nav003-permanent-files.txt"
          [[ -z "$(git -C ../nav003-permanent diff --name-only "$PARENT" -- config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md docs/BASELINE-VISUAL-APPROVED.md docs/validation tests/visual)" ]] || { echo 'Forbidden Matrix/snapshot mutation'; exit 1; }

          git -C ../nav003-permanent config user.name doke-ux
          git -C ../nav003-permanent config user.email doke-ux@users.noreply.github.com
          git -C ../nav003-permanent add assets/js/core/stable-shell-router.js assets/js/pages/search-data.js
          git -C ../nav003-permanent commit -m 'fix(nav): rearm Resultados filter state on stable-shell navigation'

          candidate_sha="$(git -C ../nav003-permanent rev-parse HEAD)"
          candidate_tree="$(git -C ../nav003-permanent rev-parse HEAD^{tree})"
          candidate_parent="$(git -C ../nav003-permanent rev-parse HEAD^)"
          router_blob="$(git -C ../nav003-permanent rev-parse HEAD:assets/js/core/stable-shell-router.js)"
          search_blob="$(git -C ../nav003-permanent rev-parse HEAD:assets/js/pages/search-data.js)"
          patch_sha="$(git -C ../nav003-permanent diff "$PARENT" HEAD --binary | sha256sum | awk '{print $1}')"

          [[ "$candidate_parent" == "$PARENT" ]] || { echo "Candidate parent mismatch: $candidate_parent"; exit 1; }
          [[ "$candidate_tree" == "$EXPECTED_TREE" ]] || { echo "Candidate TREE mismatch: $candidate_tree"; exit 1; }
          [[ "$router_blob" == "$EXPECTED_ROUTER_BLOB" ]] || { echo "Router candidate blob mismatch: $router_blob"; exit 1; }
          [[ "$search_blob" == "$EXPECTED_SEARCH_BLOB" ]] || { echo "Search candidate blob mismatch: $search_blob"; exit 1; }
          [[ "$patch_sha" == "$EXPECTED_PATCH_SHA256" ]] || { echo "Candidate patch SHA mismatch: $patch_sha"; exit 1; }

          git -C ../nav003-permanent push origin "$candidate_sha:refs/heads/$PERMANENT_BRANCH"
          git fetch origin "$PERMANENT_BRANCH"
          [[ "$(git rev-parse "origin/$PERMANENT_BRANCH")" == "$candidate_sha" ]] || { echo 'Remote permanent SHA mismatch after push'; exit 1; }
          [[ "$(git rev-parse "origin/$PERMANENT_BRANCH^{tree}")" == "$EXPECTED_TREE" ]] || { echo 'Remote permanent TREE mismatch after push'; exit 1; }

          echo "PERMANENT_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "PERMANENT_TREE=$candidate_tree" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha"
          echo "CANDIDATE_TREE=$candidate_tree"
          echo "ROUTER_BLOB=$router_blob"
          echo "SEARCH_DATA_BLOB=$search_blob"
          echo "PATCH_SHA256=$patch_sha"
          echo 'EXACT_TWO_OWNER_PROMOTION=PASS'
          echo 'MATRIX_MUTATION=false'
          echo 'SNAPSHOT_MUTATION=false'

      - name: Install certification dependencies
        run: |
          set -euo pipefail
          cd ../nav003-permanent
          npm ci
          npx playwright install chromium

      - name: Validate syntax governance and permanent identity
        run: |
          set -euo pipefail
          cd ../nav003-permanent
          node --check assets/js/core/stable-shell-router.js
          node --check assets/js/pages/search-data.js
          git diff --check "$PARENT" HEAD
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git reset --hard HEAD
          [[ "$(git rev-parse HEAD)" == "$PERMANENT_SHA" ]] || { echo 'Permanent SHA drift during governance'; exit 1; }
          [[ "$(git rev-parse HEAD^)" == "$PARENT" ]] || { echo 'Permanent parent drift'; exit 1; }
          [[ "$(git rev-parse HEAD^{tree})" == "$EXPECTED_TREE" ]] || { echo 'Permanent TREE drift'; exit 1; }
          [[ "$(git rev-parse HEAD:assets/js/core/stable-shell-router.js)" == "$EXPECTED_ROUTER_BLOB" ]] || exit 1
          [[ "$(git rev-parse HEAD:assets/js/pages/search-data.js)" == "$EXPECTED_SEARCH_BLOB" ]] || exit 1
          mapfile -t changed < <(git diff --name-only "$PARENT" HEAD)
          [[ ${#changed[@]} -eq 2 ]] || exit 1
          echo 'MINIMUM_GOVERNANCE_GATES=PASS'
          echo 'PERMANENT_IDENTITY=PASS'

      - name: Validate NAV-003 static qualification contracts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('../nav003-permanent');
          const commands = [
            ['navigationLifecycleAudit', 'npm run audit:navigation-lifecycle-contract'],
            ['navigationLifecycleCore', 'npm run test:navigation-lifecycle-core-contract'],
            ['navigationLifecycleFinalization', 'npm run test:navigation-lifecycle-finalization-contract'],
            ['shellRouterScrollAudit', 'npm run audit:shell-router-scroll-reset'],
            ['responsiveBoundaries', 'npm run audit:responsive-boundaries'],
            ['desktopBase', 'npm run audit:desktop-base'],
            ['sharedHeader', 'npm run audit:shared-app-header-contract'],
            ['resultsDensity', 'npm run test:results-card-density-contract'],
            ['resultsHeaderRail', 'npm run test:results-header-rail-contract']
          ];
          function run(command) {
            const out = spawnSync(command, { cwd: root, shell: true, encoding: 'utf8', env: process.env, maxBuffer: 40 * 1024 * 1024 });
            const rc = Number.isInteger(out.status) ? out.status : 1;
            return { rc, output: ((out.stdout || '') + '\n' + (out.stderr || '')).slice(-8000) };
          }
          const rows = commands.map(([name, command]) => ({ name, ...run(command) }));
          const failures = rows.filter(r => r.rc !== 0).map(r => r.name);
          const receipt = { total: rows.length, failures, green: failures.length === 0 };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/nav003-permanent-static.json', JSON.stringify(receipt));
          console.log('UX_NAV_DEBT_003_PERMANENT_STATIC=' + JSON.stringify(receipt));
          if (!receipt.green || receipt.total !== 9) throw new Error('Permanent static qualification not green');
          console.log('STATIC_FAILURES=0');
          NODE

      - name: Validate direct navigation lifecycle cleanup and idempotence
        run: |
          set -euo pipefail
          python -m http.server 4176 --directory ../nav003-permanent > "$RUNNER_TEMP/nav003-permanent-server.log" 2>&1 &
          server=$!
          cleanup() { kill "$server" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:4176/index.html' >/dev/null; then ok=1; break; fi
            sleep 1
          done
          [[ "$ok" == 1 ]] || { echo 'Permanent candidate server did not become ready'; exit 1; }
          cd ../nav003-permanent
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          const assert = require('node:assert/strict');
          const viewports = [
            { name: 'desktop', width: 1366, height: 768 },
            { name: 'tablet', width: 820, height: 1180 },
            { name: 'mobile', width: 390, height: 844 }
          ];
          async function readSnapshot(page) {
            return page.evaluate(() => {
              const form = document.querySelector('[data-results-filters-form]');
              return {
                statusCount: document.querySelectorAll('[data-results-filter-status]').length,
                authority: form?.getAttribute('data-filter-authority') || '',
                contract: form?.getAttribute('data-filter-contract') || '',
                state: form?.getAttribute('data-filter-state') || '',
                dirty: form?.getAttribute('data-filter-dirty') || '',
                applyDisabled: Boolean(form?.querySelector('button[type="submit"]')?.disabled),
                initializer: typeof window.DokeInitSearchFilterState === 'function',
                resultsInitializer: typeof window.DokeInitSearchResults === 'function',
                installation: Boolean(window.Doke?.searchFilterStateInstallation),
                noOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth
              };
            });
          }
          async function waitResults(page) {
            await page.waitForFunction(() => {
              const form = document.querySelector('[data-results-filters-form]');
              return form && form.getAttribute('data-filter-authority') === '20260805-ux-filters-001-v1' && document.querySelectorAll('[data-results-filter-status]').length === 1;
            }, null, { timeout: 10000 });
          }
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const receipts = [];
            for (const viewport of viewports) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              const errors = [];
              page.on('pageerror', e => errors.push(String(e?.message || e)));

              await page.goto('http://127.0.0.1:4176/resultados.html', { waitUntil: 'domcontentloaded' });
              await waitResults(page);
              const direct = await readSnapshot(page);
              assert.equal(direct.statusCount, 1);
              assert.equal(direct.authority, '20260805-ux-filters-001-v1');
              assert.equal(direct.contract, 'search-filter-state-v1');
              assert.equal(direct.state, 'applied');
              assert.equal(direct.dirty, 'false');
              assert.equal(direct.initializer, true);
              assert.equal(direct.resultsInitializer, true);
              assert.equal(direct.installation, true);
              assert.equal(direct.noOverflow, true);

              await page.goto('http://127.0.0.1:4176/index.html', { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => typeof window.DokeNavigate === 'function');
              await page.evaluate(() => window.DokeNavigate('/resultados.html'));
              await page.waitForFunction(() => location.pathname.endsWith('/resultados.html'));
              await waitResults(page);
              const nav = await readSnapshot(page);
              for (const key of ['statusCount','authority','contract','state','dirty','applyDisabled','initializer','resultsInitializer','installation','noOverflow']) {
                assert.deepEqual(nav[key], direct[key], `direct/nav divergence at ${viewport.name}: ${key}`);
              }

              await page.evaluate(() => { window.__nav003PermanentFirst = window.Doke?.searchFilterStateInstallation || null; });
              const urlBeforeDraft = page.url();
              const drafted = await page.evaluate(() => {
                const form = document.querySelector('[data-results-filters-form]');
                const checkbox = form?.querySelector('input[name="guaranteed"]');
                if (!checkbox) return false;
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event('change', { bubbles: true }));
                return true;
              });
              if (drafted) {
                await page.waitForFunction(() => document.querySelector('[data-results-filters-form]')?.getAttribute('data-filter-dirty') === 'true');
                assert.equal(page.url(), urlBeforeDraft);
                await page.evaluate(() => window.Doke?.searchFilterStateInstallation?.cancel?.());
                await page.waitForFunction(() => document.querySelector('[data-results-filters-form]')?.getAttribute('data-filter-dirty') === 'false');
              }

              await page.evaluate(() => window.DokeNavigate('/index.html'));
              await page.waitForFunction(() => location.pathname.endsWith('/index.html'));
              await page.waitForTimeout(300);
              const homeLeak = await page.evaluate(() => document.querySelectorAll('[data-results-filter-status], [data-filter-authority]').length);
              assert.equal(homeLeak, 0);

              await page.evaluate(() => window.DokeNavigate('/resultados.html'));
              await page.waitForFunction(() => location.pathname.endsWith('/resultados.html'));
              await waitResults(page);
              const second = await page.evaluate(() => ({
                statusCount: document.querySelectorAll('[data-results-filter-status]').length,
                freshInstallation: Boolean(window.__nav003PermanentFirst && window.Doke?.searchFilterStateInstallation && window.__nav003PermanentFirst !== window.Doke.searchFilterStateInstallation),
                noOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth
              }));
              assert.equal(second.statusCount, 1);
              assert.equal(second.freshInstallation, true);
              assert.equal(second.noOverflow, true);
              assert.deepEqual(errors, []);
              receipts.push({ viewport, direct, nav, drafted, homeLeak, second });
              await page.close();
            }
            await browser.close();
            console.log('UX_NAV_DEBT_003_PERMANENT_VIEWPORT_LIFECYCLE=' + JSON.stringify({ result: 'PASS', receipts, criteriaRelaxed: 0, introducedRegressions: 0 }));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Validate qualification requirement 12
        run: |
          set -euo pipefail
          specs=(
            tests/e2e/results-entry-lifecycle.spec.js
            tests/e2e/ux-results-001-browser-acceptance.spec.js
            tests/e2e/search-flow.spec.js
            tests/e2e/stable-shell-transition-contract.spec.js
            tests/e2e/stable-shell-transition-matrix.spec.js
            tests/e2e/stable-shell-scroll-contract.spec.js
            tests/e2e/global-layout-contract.spec.js
          )
          for spec in "${specs[@]}"; do
            [[ -f "../nav003-permanent/$spec" ]] || { echo "Missing required spec: $spec"; exit 1; }
          done
          set +e
          (cd ../nav003-permanent && node node_modules/@playwright/test/cli.js test "${specs[@]}" --workers=1 --retries=0 --reporter=json > "$RUNNER_TEMP/nav003-permanent-playwright.json")
          candidate_rc=$?
          set -e
          export CANDIDATE_RC="$candidate_rc"
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/nav003-permanent-playwright.json', 'utf8'));
          function collect(report) {
            const rows = [];
            function walk(suite, parents) {
              const prefix = [...parents, suite.title || ''].filter(Boolean);
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  let status = test.status;
                  const last = (test.results || []).at(-1) || {};
                  if (!['expected','unexpected','flaky','skipped'].includes(status)) {
                    const actual = last.status || 'unknown';
                    if (actual === 'skipped') status = 'skipped';
                    else if (actual === 'passed' && (test.expectedStatus || 'passed') === 'passed') status = 'expected';
                    else status = 'unexpected';
                  }
                  const key = [...prefix, spec.title || '', test.projectName || ''].filter(Boolean).join(' :: ');
                  rows.push({ key, status });
                }
              }
              for (const child of suite.suites || []) walk(child, prefix);
            }
            for (const suite of report.suites || []) walk(suite, []);
            return rows;
          }
          const rows = collect(report);
          const count = status => rows.filter(r => r.status === status).length;
          const receipt = {
            rc: Number(process.env.CANDIDATE_RC),
            total: rows.length,
            expected: count('expected'),
            unexpected: count('unexpected'),
            flaky: count('flaky'),
            skipped: count('skipped')
          };
          receipt.green = receipt.rc === 0 && receipt.total === 75 && receipt.expected === 75 && receipt.unexpected === 0 && receipt.flaky === 0 && receipt.skipped === 0;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/nav003-permanent-requirement12.json', JSON.stringify(receipt));
          console.log('UX_NAV_DEBT_003_PERMANENT_REQUIREMENT_12=' + JSON.stringify(receipt));
          if (!receipt.green) throw new Error('Qualification requirement #12 is not fully green');
          console.log('BROWSER_TOTAL=75');
          console.log('BROWSER_EXPECTED=75');
          console.log('BROWSER_UNEXPECTED=0');
          console.log('BROWSER_FLAKY=0');
          console.log('BROWSER_SKIPPED=0');
          NODE

      - name: Emit permanent certification receipt
        run: |
          set -euo pipefail
          git fetch origin "$PERMANENT_BRANCH" "$PREVIOUS_PERMANENT_BRANCH"
          [[ "$(git rev-parse "origin/$PERMANENT_BRANCH")" == "$PERMANENT_SHA" ]] || { echo 'Permanent ref drift before receipt'; exit 1; }
          [[ "$(git rev-parse "origin/$PERMANENT_BRANCH^{tree}")" == "$EXPECTED_TREE" ]] || { echo 'Permanent TREE drift before receipt'; exit 1; }
          [[ "$(git rev-parse "origin/$PREVIOUS_PERMANENT_BRANCH")" == "$PARENT" ]] || { echo 'Previous permanent branch moved'; exit 1; }
          node - <<'NODE'
          const fs = require('node:fs');
          const staticReceipt = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/nav003-permanent-static.json', 'utf8'));
          const requirement12 = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/nav003-permanent-requirement12.json', 'utf8'));
          if (!staticReceipt.green || !requirement12.green) throw new Error('Certification receipts are not green');
          const receipt = {
            result: 'PASS',
            checkpoint: 'UX-NAV-DEBT-003-PERMANENT-CERTIFICATION',
            permanentBranch: process.env.PERMANENT_BRANCH,
            permanentSha: process.env.PERMANENT_SHA,
            permanentTree: process.env.EXPECTED_TREE,
            parent: process.env.PARENT,
            parentTree: process.env.PARENT_TREE,
            routerBlob: process.env.EXPECTED_ROUTER_BLOB,
            searchDataBlob: process.env.EXPECTED_SEARCH_BLOB,
            patchSha256: process.env.EXPECTED_PATCH_SHA256,
            exactTwoOwnerPromotion: true,
            r4PreimageDrift: false,
            governanceSyntax: 'PASS',
            nav003Contract: 'PASS',
            directDokeNavigateConvergence: 'PASS',
            lifecycleCleanupIdempotence: 'PASS',
            criterion12Green: true,
            browserTotal: requirement12.total,
            browserExpected: requirement12.expected,
            browserUnexpected: requirement12.unexpected,
            browserFlaky: requirement12.flaky,
            browserSkipped: requirement12.skipped,
            criteriaRelaxed: 0,
            introducedRegressions: 0,
            matrixMutation: false,
            snapshotMutation: false,
            previousPermanentMutation: false,
            issueMutation: false,
            prMutation: false,
            supabaseMutation: false,
            stagingMutation: false,
            readyForReview: false,
            merge: false,
            repositoryOnly: true,
            permanentCertified: true
          };
          console.log('UX_NAV_DEBT_003_PERMANENT_FINAL=' + JSON.stringify(receipt));
          console.log('STATUS=NAV003_PERMANENT_BRANCH_CERTIFIED_STOP');
          NODE
