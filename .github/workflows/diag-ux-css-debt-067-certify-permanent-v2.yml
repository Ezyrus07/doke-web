name: Doke UX-CSS-DEBT-067 Permanent Certification V2

on:
  push:
    branches:
      - diag/ux-css-debt-067-certify-permanent-v2

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c7f8397821698f4445dad3b20e5aea2ff3d57cf3
      PARENT_SHA: 460120dbda36a407a143cfeb1471d46859be62ed
      PARENT_PARENT_SHA: 2937218b2ecfa9b59586d4fd1c2f6361c103e786
      TARGET_TREE: f66b3a49361a8632d8ff3191e75085fe921d7256
      TARGET_FILE: assets/css/components/overlays/modal-visual-contract.css
      PARENT_TARGET_BLOB: 2fd0b2fc22c9437052e00442848c0ed93966021a
      TARGET_BLOB: b14fef93f3c0c2ed417eee537c47554c24e0a5c8
      EXPECTED_SHA256: cdfa41223fc6dc8fe743137e162a9e5174d35073e7ae24a6492881d8de2347b2
      EXPECTED_BYTES: 38428
      PERMANENT_BRANCH: ux/ux-css-debt-067-modal-visual-compaction
      SOURCE_RUN: 32040463349
      SOURCE_JOB: 95418744475
      R1_RUN: 32040598748
      R1_JOB: 95419101465
      V1_CERT_RUN: 32041160510
      V1_CERT_JOB: 95420593044
    steps:
      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Exact permanent identity and full-history guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git rev-list --count "$PARENT_SHA..$TARGET_SHA")" = "1"
          test "$(git diff --name-only "$PARENT_SHA" "$TARGET_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$TARGET_SHA" -- "$TARGET_FILE")" = $'0\t1\t'"$TARGET_FILE"
          git diff --quiet "$PARENT_SHA" "$TARGET_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          echo "IDENTITY PASS|sha=$TARGET_SHA|parent=$PARENT_SHA|parentParent=$PARENT_PARENT_SHA|tree=$TARGET_TREE|targetBlob=$TARGET_BLOB|fullHistory=1|files=1|additions=0|deletions=1"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate active graph
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures

      - name: Independent reconstruction and corrected active-importer proof transfer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),path=require('path');
          const f=process.env.TARGET_FILE,permanent=fs.readFileSync(f,'utf8');
          const parent=cp.execFileSync('git',['show',`${process.env.PARENT_SHA}:${f}`],{encoding:'utf8'}),ls=parent.split('\n');
          if((ls[81]||'').replace(/\r$/,'')!=='  display: grid;')throw new Error('parent row drift 82');
          if((ls[685]||'').trim()!=='display: block;')throw new Error('parent winner drift 686');
          const rebuilt=ls.filter((_,i)=>i!==81).join('\n');
          if(rebuilt!==permanent)throw new Error('independent reconstruction not byte-identical');
          const hash=crypto.createHash('sha256').update(Buffer.from(rebuilt)).digest('hex');
          if(hash!==process.env.EXPECTED_SHA256||Buffer.byteLength(rebuilt)!==Number(process.env.EXPECTED_BYTES))throw new Error('rebuild identity mismatch');

          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(x=>x.endsWith('.css'));
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;
          const norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const meta=new Map();for(const x of tracked){const text=fs.readFileSync(x,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(norm(m[1],x));meta.set(x,{text,imports});}
          const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(x=>meta.has(x));while(todo.length){const x=todo.pop();if(active.has(x)||!meta.has(x))continue;active.add(x);for(const n of meta.get(x).imports)if(meta.has(n))todo.push(n)}
          if(active.size!==401)throw new Error(`active drift ${active.size}`);
          const allImporters=[...meta].filter(([x,m])=>x!==f&&m.imports.includes(f)).map(([x])=>x).sort();
          const activeImporters=allImporters.filter(x=>active.has(x));
          const inactiveImporters=allImporters.filter(x=>!active.has(x));
          const expectedActive=['assets/css/components/profile/profile-editor-form.css','assets/css/pages/admin-foundation.css','assets/css/pages/ajuda-foundation.css','assets/css/pages/anunciar-servico-foundation.css','assets/css/pages/avaliacao-profissional-foundation.css','assets/css/pages/carteira-runtime-finance.css','assets/css/pages/comunidade-foundation.css','assets/css/pages/comunidade-interna-runtime-settings.css','assets/css/pages/configuracoes-foundation.css','assets/css/pages/marketplace-detail-foundation.css','assets/css/pages/messaging-foundation.css','assets/css/pages/notificacoes-foundation.css','assets/css/pages/novidades-foundation.css','assets/css/pages/orcamento-foundation.css','assets/css/pages/pagamento-profissional-foundation.css','assets/css/pages/pedidos-runtime-page.css','assets/css/pages/tornar-profissional-foundation.css','assets/css/pages/verificacao-profissional-foundation.css'];
          const expectedInactive=['assets/css/pages/home-foundation.css','assets/css/pages/resultados-foundation.css'];
          if(JSON.stringify(activeImporters)!==JSON.stringify(expectedActive))throw new Error(`active importer drift ${activeImporters.join(',')}`);
          if(JSON.stringify(inactiveImporters)!==JSON.stringify(expectedInactive))throw new Error(`inactive importer drift ${inactiveImporters.join(',')}`);
          if(allImporters.length!==20||activeImporters.length!==18||inactiveImporters.length!==2)throw new Error(`importer counts ${allImporters.length}/${activeImporters.length}/${inactiveImporters.length}`);

          const src=cp.execFileSync('git',['ls-files','-z','*.html','assets/js'],{encoding:'utf8'}).split('\0').filter(Boolean).filter(x=>fs.existsSync(x));
          const aliases=['doke-modal-surface','doke-overlay__surface','doke-modal__surface','doke-action-modal__surface','doke-financial-modal__surface'];let total=0;for(const a of aliases){const occ=src.reduce((n,x)=>n+(fs.readFileSync(x,'utf8').split(a).length-1),0);if(!occ)throw new Error(`alias missing ${a}`);total+=occ}if(total!==169)throw new Error(`alias occurrence drift ${total}`);
          console.log(`V1 HARNESS CLASSIFICATION PASS|v1=${process.env.V1_CERT_RUN}/${process.env.V1_CERT_JOB}|allImporters=20|activeImporters=18|inactiveImporters=2|inactive=${inactiveImporters.join(',')}|productIdentityUnchanged=1`);
          console.log(`RECONSTRUCTION PASS|byteIdentical=1|sourceProof=${process.env.SOURCE_RUN}/${process.env.SOURCE_JOB}|r1Proof=${process.env.R1_RUN}/${process.env.R1_JOB}|r1TransferByExactCandidateBytes=1|activeImporters=18|allImporters=20|sourceOccurrences=169|realProductDOM=1|syntheticDOM=0|arms=4/4|changedWinners=1`);
          NODE

      - name: Generate responsive baseline from exact parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$PARENT_SHA"
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          cp reports/responsive-index-baseline.json /tmp/ux067-cert-v2-responsive.json
          git checkout "$TARGET_SHA"
          cp /tmp/ux067-cert-v2-responsive.json reports/responsive-index-baseline.json
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo 'PARENT RESPONSIVE BASELINE PASS|active=401|high=37'

      - name: Responsive contract on exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-responsive-contract.js | tee /tmp/ux067-cert-v2-responsive.log
          grep -q 'Checks: 893' /tmp/ux067-cert-v2-responsive.log
          grep -q 'Failures: 0' /tmp/ux067-cert-v2-responsive.log
          grep -q 'Skips: 277' /tmp/ux067-cert-v2-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and permanent canonical residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$TARGET_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length})}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();function dc(src){const ls=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<ls.length;i++){const line=ls[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0,pageResidual=0;for(const f of active){const p=dc(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++;if(f.includes('/pages/'))pageResidual++}}const guards=[['assets/css/components/overlays/modal-visual-contract.css',475,0,'067'],['assets/css/components/internal/filter-select-standard.css',404,0,'066'],['assets/css/components/ui-surface/buttons-close.css',110,0,'065'],['assets/css/components/layout/doke-layout-system.css',108,0,'064'],['assets/css/components/panels/mobile-panel.css',94,0,'063'],['assets/css/components/forms/form-flow-comfort.css',113,0,'062'],['assets/css/components/overlays/action-modal-system.css',264,0,'061'],['assets/css/components/overlays/financial-modal-system.css',645,0,'060'],['assets/css/components/media-lightbox.css',280,0,'059'],['assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css',216,0,'058'],['assets/css/components/chat-composer.css',125,0,'057'],['assets/css/components/before-after-workers-preview/mobile-comment-sheets.css',302,0,'056'],['assets/css/patterns/settings-shell.css',104,0,'055'],['assets/css/components/before-after-workers-preview/publication-light-modal.css',75,0,'054']];if(files!==7||total!==48||highDead!==0||pageResidual!==0)throw new Error(`residual ${files}/${total}/${highDead}/${pageResidual}`);for(const [f,d,dead,label] of guards){const p=dc(meta.get(f).text);if(p.decl!==d||p.dead!==dead)throw new Error(`${label} ${p.decl}/${p.dead}`)}console.log('PERMANENT RESIDUAL PASS|active=401|high=37|files=7|dead=48|highDead=0|pageResidual=0|067=475/0|066=404/0|065=110/0|064=108/0|063=94/0|062=113/0|061=264/0|060=645/0|059=280/0|058=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e; npm audit --json >/tmp/ux067-cert-v2-audit.json; code=$?; set -e
          node <<'NODE'
          const a=require('/tmp/ux067-cert-v2-audit.json'),v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);
          NODE
          echo "npmAuditExit=$code"

      - name: Final exact full-history restore and branch identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test -z "$(git status --porcelain)"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          echo "CERTIFICATION RESTORE PASS|sha=$TARGET_SHA|fullHistory=1|remotePermanent=$remote_sha|productMutation=0"
