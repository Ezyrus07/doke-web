name: UX-NOTIF-004 Phase 1 Apply

on:
  push:
    branches:
      - ux/ux-notif-004-badge-snapshot
    paths:
      - '.github/workflows/ux-notif-004-phase1-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard exact H04 parent chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "be33af7426852f3f865ac22a2a6c527c7a5771df"
          test "$(git rev-parse HEAD^^)" = "6337fca09cbd780941ba2e461561d1aa996dd469"
          test "$(git rev-parse HEAD^^^)" = "93e93b9fa9e9e687ca006661c9b377d7a6644197"
          test "$(git rev-parse HEAD^^^^)" = "d45c48ac3839a70f2afcdcf01ba251aae1e02f23"
          test "$(git rev-parse HEAD^^^^^)" = "6d97c49cecef7d1a414bd314c595a843ac153998"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply H04 badge snapshot
        run: python scripts/tmp-ux-notif-004-phase1.py

      - name: Correct H04 source-guard assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-ux-notif-004-badge-snapshot.js')
          source = path.read_text(encoding='utf-8')
          old = "assert.equal(/title|body|message/i.test(centerSource.match(/function badgeSnapshot\\([\\s\\S]*?\\n  }/)[0]), false,"
          new = "assert.equal(/\\.(?:title|body|message)\\b/.test(centerSource.match(/function badgeSnapshot\\([\\s\\S]*?\\n  }/)[0]), false,"
          if old not in source:
              raise SystemExit('H04 source-guard assertion anchor missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Migrate H01 surface contract to H04 selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-ux-notif-001-surface-contract.js')
          source = path.read_text(encoding='utf-8')
          old = '''assert(center.includes("BADGE_SELECTOR = '[data-notifications-unread-count]'"));'''
          new = '''assert(center.includes('var BADGE_SELECTORS = Object.freeze({'));
          assert(center.includes("unreadTotal: '[data-notifications-unread-count]'"));
          assert(center.includes("actionRequiredTotal: '[data-notifications-action-required-count]'"));
          assert(center.includes("urgentTotal: '[data-notifications-urgent-count]'"));
          assert(center.includes("unreadMessages: '[data-notifications-messages-count]'"));'''
          if old not in source:
              raise SystemExit('H01 badge selector assertion anchor missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate syntax and H04 behavior
        run: |
          node --check assets/js/core/notification-center.js
          node --check scripts/test-ux-notif-004-badge-snapshot.js
          node --check scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-004-badge-snapshot.js

      - name: Preserve UX-NOTIF-001 through UX-NOTIF-003
        run: |
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-002-notification-event.js
          node scripts/test-ux-notif-002-repository-adapter.js
          node scripts/test-ux-notif-002-producer-envelopes.js
          node scripts/test-ux-notif-002-financial-producer-handoff.js
          node scripts/test-ux-notif-003-toast-manager.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-in-app-delegation.js

      - name: Preserve notification and account authorities
        run: |
          node scripts/test-notification-authority-contract.js
          node scripts/test-notifications-supabase-repository-contract.js
          node scripts/audit-notifications-api-contract.js
          node scripts/test-ux-priv-001-account-storage.js
          node scripts/audit-auth-session-contracts.js

      - name: Regenerate and audit canonical matrix
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix

      - name: Validate canonical agent governance
        run: npm run audit:agent-governance

      - name: Validate patch and publish functional H04 commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add assets/js/core/notification-center.js \
            scripts/test-ux-notif-004-badge-snapshot.js \
            scripts/test-ux-notif-001-surface-contract.js \
            docs/ux/UX-NOTIF-004.md \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No functional H04 changes to commit.'; exit 1; }
          git commit -m 'feat(ux-notif-004): add canonical badge snapshot'
          git push origin HEAD:ux/ux-notif-004-badge-snapshot
