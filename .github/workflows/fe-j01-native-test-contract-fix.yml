name: FE-J01 Native Test Contract Fix

on:
  pull_request:
    paths:
      - "assets/js/dev/fe-j01-native-test-contract-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore canonical document navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/js/core/navigation-lifecycle.js')
          source = path.read_text()

          doc_start = source.index('  function documentNavigate(url, options) {')
          doc_end = source.index('\n  function go(href, options) {', doc_start)
          document_function = """  function documentNavigate(url, options) {
            var id = routeBegin({
              from: window.location.href,
              to: url.href,
              source: options.source || 'document-fallback',
              replace: options.replace === true,
              restore: options.restoreScroll === true,
              adapter: 'document'
            });
            routeCommit(id, { adapter: 'document' });
            if (options.replace === true) window.location.replace(url.href);
            else window.location.assign(url.href);
            return Promise.resolve(true);
          }
          """
          source = source[:doc_start] + document_function + source[doc_end + 1:]

          guard_start = source.index('  function runGuard(options) {')
          guard_end = source.index('\n  function bindPopstate() {', guard_start)
          guard_function = """  function runGuard(options) {
            options = options || {};
            if (typeof options.check !== 'function') {
              return Promise.reject(new TypeError('Guard check must be a function.'));
            }
            var id = guardBegin({ name: options.name || 'guard', source: options.source || normalizePath() });
            return Promise.resolve()
              .then(function () { return options.check(); })
              .then(function (result) {
                var allowed = typeof options.allowed === 'function' ? options.allowed(result) : Boolean(result);
                if (allowed) {
                  guardAllow(id, { result: result });
                  return { allowed: true, result: result, guardId: id };
                }
                var target = typeof options.redirect === 'function' ? options.redirect(result) : options.redirect;
                if (!target) throw new Error('Guard negado sem destino seguro.');
                guardRedirect(id, target, { result: result });
                return go(target, {
                  replace: true,
                  source: 'guard',
                  forceDocument: options.forceDocument === true
                }).then(function () {
                  return { allowed: false, result: result, guardId: id, redirect: normalizeUrl(target).href };
                });
              })
              .catch(function (error) {
                guardFail(id, error, { source: options.source || normalizePath() });
                if (!options.fallback) throw error;
                guardRedirect(id, options.fallback, { fallback: true });
                return go(options.fallback, {
                  replace: true,
                  source: 'guard-fallback',
                  forceDocument: options.forceDocument === true
                }).then(function () {
                  return { allowed: false, error: error, guardId: id, redirect: normalizeUrl(options.fallback).href };
                });
              });
          }
          """
          path.write_text(source[:guard_start] + guard_function + source[guard_end + 1:])
          PY

      - name: Align lifecycle unit contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-navigation-lifecycle-core-contract.js')
          source = path.read_text()
          markers = [
            "  const documentNavigationResult = api.navigation.go('https://doke.test/pagamento-profissional.html'",
            "  const documentNavigation = api.navigation.go('https://doke.test/pagamento-profissional.html'"
          ]
          starts = [source.find(marker) for marker in markers]
          starts = [value for value in starts if value >= 0]
          if not starts:
              raise SystemExit('document navigation unit block not found')
          start = min(starts)
          end = source.index('\n\n  await api.navigation.back', start)
          replacement = """  const documentNavigation = api.navigation.go('https://doke.test/pagamento-profissional.html', {
            source: 'test-document-navigation',
            forceDocument: true
          });
          assert.strictEqual(typeof documentNavigation?.then, 'function', 'document navigation must preserve the promise contract');
          assert.deepStrictEqual(assigned.at(-1), {
            method: 'assign',
            value: 'https://doke.test/pagamento-profissional.html'
          });
          await documentNavigation;"""
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Make native E2E entry explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/payment-entry-state-contract.spec.js')
          source = path.read_text()
          start = source.index('const navigateFromIndex = async (page, target) => {')
          end = source.index('\n\nfor (const viewport of viewports)', start)
          replacement = """const navigateFromIndex = async (page, target) => {
            await page.goto('/index.html');
            await expect.poll(() => page.evaluate(() => typeof window.DokeNavigate)).toBe('function');

            const expected = new URL(target, page.url());
            const navigation = page.waitForURL((url) => (
              url.pathname === expected.pathname && url.search === expected.search
            ));

            await page.evaluate((href) => {
              window.setTimeout(() => window.DokeNavigate(href), 0);
            }, target);
            await navigation;
          };"""
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Validate focused contracts
        run: |
          node --check assets/js/core/navigation-lifecycle.js
          node --check tests/e2e/payment-entry-state-contract.spec.js
          node scripts/test-navigation-lifecycle-core-contract.js
          node scripts/audit-navigation-registry-ownership.js
          git diff --check

      - name: Publish validated files through Contents API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          };

          async function publish(path, message) {
            const endpoint = `https://api.github.com/repos/${repo}/contents/${path}`;
            const currentResponse = await fetch(`${endpoint}?ref=${encodeURIComponent(branch)}`, { headers });
            if (!currentResponse.ok) throw new Error(`fetch ${path}: ${currentResponse.status} ${await currentResponse.text()}`);
            const current = await currentResponse.json();
            const response = await fetch(endpoint, {
              method: 'PUT',
              headers,
              body: JSON.stringify({
                message,
                content: fs.readFileSync(path).toString('base64'),
                sha: current.sha,
                branch
              })
            });
            if (!response.ok) throw new Error(`publish ${path}: ${response.status} ${await response.text()}`);
            const result = await response.json();
            console.log(`${path}: ${result.commit.sha}`);
          }

          (async () => {
            await publish('assets/js/core/navigation-lifecycle.js', 'FE-J01: restore canonical document navigation contract');
            await publish('scripts/test-navigation-lifecycle-core-contract.js', 'FE-J01: cover canonical document navigation contract');
            await publish('tests/e2e/payment-entry-state-contract.spec.js', 'FE-J01: await native payment navigation in E2E');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
