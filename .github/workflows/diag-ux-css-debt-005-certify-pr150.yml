name: Doke UX-CSS-DEBT-005 PR150 Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-005-certify-pr150

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: e3453eeb1f2123377eefac0a8213f7f04c519d44
      PARENT_SHA: b5e569ae0f4827f4981ec436967e59470f6a7404
      TARGET_FILE: assets/css/pages/comunidade-interna.css
      EXPECTED_PARENT_SHA256: ddee624f00fe72d13b0c8d48b7bb93c4381b3461c7ca384464241178473c8696
      EXPECTED_CANDIDATE_SHA256: af971af4a1b5a907ff317d350afe8b1ae7deeaa1b38143f6732f87b4cba66bc8
      PR_NUMBER: '150'
    steps:
      - name: Checkout exact permanent SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact one-commit product-only tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git rev-list --count "${PARENT_SHA}"..HEAD)" = "1"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $2}')" = "98"
          git diff --check "${PARENT_SHA}"...HEAD
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Prove permanent CSS equals deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${PARENT_SHA}:${TARGET_FILE}" > /tmp/community-parent.css
          cp "${TARGET_FILE}" /tmp/community-permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const parent=fs.readFileSync('/tmp/community-parent.css','utf8');
          const permanent=fs.readFileSync('/tmp/community-permanent.css','utf8');
          const lines=parent.split(/\r?\n/);
          let depth=0,selectorParts=[],selector=null;const declarations=[],stack=[];
          const re=/^\s*([\w-]+)\s*:\s*(.*?)\s*(!important)?\s*;\s*$/;
          for(let i=0;i<lines.length;i++){
            const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector&&t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'){
              if(t.startsWith('@')&&line.includes('{'))stack.push({type:'at',header:t.replace(/\{\s*$/,'').replace(/\s+/g,' ').trim(),depthBefore:depth});
              else if(!t.startsWith('@')&&!line.includes(';')){selectorParts.push(t.replace(/\{\s*$/,'').trim());if(line.includes('{')){selector=selectorParts.join(' ').replace(/\s+/g,' ').trim();selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
            }
            if(selector){const m=line.match(re);if(m){const context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1],important:Boolean(m[3]),context});}}
            depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}
          }
          const last=new Map(),dead=[];
          for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push(d);if(!later||d.important||!later.important)last.set(key,d);}
          const deadSet=new Set(dead.map(d=>d.lineIndex));const rebuilt=lines.filter((_l,i)=>!deadSet.has(i)).join('\n');
          const selectors=[...new Set(dead.map(d=>d.selector))].sort();
          const sha=v=>crypto.createHash('sha256').update(v).digest('hex');
          if(sha(parent)!==process.env.EXPECTED_PARENT_SHA256)throw new Error(`parent hash drift ${sha(parent)}`);
          if(sha(permanent)!==process.env.EXPECTED_CANDIDATE_SHA256)throw new Error(`permanent hash drift ${sha(permanent)}`);
          if(rebuilt!==permanent)throw new Error('permanent CSS differs from deterministic candidate');
          if(declarations.length!==2670||dead.length!==98||selectors.length!==25)throw new Error('metric drift');
          if(Buffer.byteLength(parent)!==133343||Buffer.byteLength(permanent)!==130867)throw new Error('byte drift');
          if((parent.match(/!important/g)||[]).length||(permanent.match(/!important/g)||[]).length)throw new Error('unexpected !important');
          fs.writeFileSync('/tmp/community-selectors.json',JSON.stringify(selectors,null,2));
          console.log('Exact deletion-only proof: PASS');
          console.log('- declarations: 2670 -> 2572');
          console.log('- deleted: 98');
          console.log('- affected selectors: 25');
          console.log('- bytes: 133343 -> 130867');
          NODE

      - name: Write precise Community runtime harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/community-pr150-capture.js <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2];
          const selectors=JSON.parse(fs.readFileSync('/tmp/community-selectors.json','utf8'));
          const vps=[['1366x768',1366,768],['1280x802',1280,802],['820x1180',820,1180],['608x926',608,926],['390x844',390,844]];
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const result={},matched=new Set();
            for(const [name,width,height] of vps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});const page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto('http://127.0.0.1:5500/comunidade-interna.html',{waitUntil:'domcontentloaded'});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}'});await page.evaluate(()=>{const p=document.querySelector('[data-community-room-pending]');if(p)p.hidden=true;const l=document.querySelector('.community-room-layout');if(!l)throw new Error('layout missing');l.hidden=false;l.setAttribute('aria-hidden','false');l.dataset.mobileView='list';l.classList.remove('is-settings-mode');document.body.classList.remove('community-room-thread-is-open');for(const e of l.querySelectorAll('[hidden]'))e.hidden=false;for(const e of l.querySelectorAll('[aria-hidden="true"]'))e.setAttribute('aria-hidden','false');const ev=document.querySelector('.community-events-panel');if(ev&&!ev.querySelector('.community-event-calendar__day')){const day=document.createElement('button');day.className='community-event-calendar__day';day.type='button';day.textContent='12';(ev.querySelector('.community-event-calendar')||ev).appendChild(day);}const f=document.createElement('section');f.id='ux-css-debt-005-fixture';f.innerHTML=`<button class="community-room-channel" type="button">Canal</button><div class="community-room-message__actions"><button type="button">Ação</button></div><div class="community-room-message-menu"><button type="button">Menu</button></div><section class="community-room-panel-empty"><strong>Vazio</strong><p>Sem itens</p></section><section class="community-room-thread-empty"><h3>Sem mensagens</h3><p>Comece</p></section><article class="community-room-request-item"><div class="community-room-request-actions"><button class="doke-btn" type="button">Aceitar</button></div></article><section class="community-member-directory"><div class="community-member-directory__menu"><div class="community-member-directory__discipline-actions"></div><button class="community-member-directory__remove" type="button">Remover</button><div class="community-member-directory__role-list"><label class="community-member-directory__role-option"><span class="community-member-directory__role-option-copy"><strong>Cargo</strong></span></label></div></div></section>`;l.appendChild(f);});await page.evaluate(()=>document.fonts&&document.fonts.ready);await sleep(60);result[name]=await page.evaluate(selectors=>{const clean=v=>String(v??'').replace(/\s+/g,' ').trim();const capture=el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(let i=0;i<cs.length;i++){const p=cs[i];style[p]=clean(cs.getPropertyValue(p));}return{tag:el.tagName,id:el.id||'',className:typeof el.className==='string'?clean(el.className):'',hidden:Boolean(el.hidden),rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)],style};};const samples={};for(const s of selectors){const nodes=[...document.querySelectorAll(s)];if(!nodes.length)throw new Error(`missing ${s}`);samples[s]=nodes.map(capture);}return samples;},selectors);for(const s of selectors)matched.add(s);await ctx.close();}
            await browser.close();if(matched.size!==selectors.length)throw new Error(`coverage ${matched.size}/${selectors.length}`);fs.writeFileSync(out,JSON.stringify(result,null,2));console.log(`affected-selector coverage: ${matched.size}/${selectors.length}`);}
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Capture parent precise runtime and responsive baseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/community-parent.css "${TARGET_FILE}"
          node /tmp/community-pr150-capture.js /tmp/community-parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/community-parent-responsive.json

      - name: Restore exact permanent candidate and preserve responsive contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/community-permanent.css "${TARGET_FILE}"
          cp /tmp/community-parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          git diff --check

      - name: Require exact parent-to-permanent affected-selector parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/community-pr150-capture.js /tmp/community-permanent-runtime.json
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/community-parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/community-permanent-runtime.json'));const diffs=[];function walk(x,y,p){if(typeof x!==typeof y||x===null||y===null||typeof x!=='object'){if(x!==y)diffs.push({path:p,parent:x,candidate:y});return;}if(Array.isArray(x)!==Array.isArray(y)){diffs.push({path:p,parent:x,candidate:y});return;}for(const k of [...new Set([...Object.keys(x),...Object.keys(y)])].sort())walk(x[k],y[k],p?`${p}.${k}`:k);}walk(a,b,'');if(diffs.length){console.error(JSON.stringify(diffs.slice(0,40),null,2));throw new Error(`runtime differences ${diffs.length}`);}console.log('Affected-selector computed-style + rect parity: PASS (0 diffs)');
          NODE

      - name: Validate Community and structural contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-community-logic-stability-contract.js
          node scripts/test-community-final-logic-stability-contract.js
          node scripts/test-community-final-readiness-contract.js
          node scripts/test-community-critical-hardening-contract.js
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/css-conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:duplicate-assets
          git diff --check
          echo '--- final metrics ---'
          grep -E 'CSS files scanned|Definitions|Conflicting class/property pairs' /tmp/css-conflicts.log || true
          grep -Ei 'active legacy/remediation css|active legacy/remediation js|high risk active css' /tmp/legacy.log || true

      - name: Restore tracked workspace to exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"

      - name: Require SonarQube Cloud credential
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}"

      - name: Analyze PR 150 exact SHA and enforce SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=150
            -Dsonar.pullrequest.branch=ux/ux-css-debt-005-community-interna-compaction
            -Dsonar.pullrequest.base=ux/ux-css-debt-004-detalhe-anuncio-compaction
            -Dsonar.scm.revision=e3453eeb1f2123377eefac0a8213f7f04c519d44
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
