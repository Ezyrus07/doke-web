name: FE-J01 Document Acknowledgement Fix

on:
  pull_request:
    paths:
      - "assets/js/dev/fe-j01-document-ack-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply synchronous document acknowledgement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle_path = Path('assets/js/core/navigation-lifecycle.js')
          lifecycle = lifecycle_path.read_text()

          doc_start = lifecycle.index('  function documentNavigate(url, options) {')
          doc_end = lifecycle.index('\n  function go(href, options) {', doc_start)
          new_doc = """  function documentNavigate(url, options) {
            var id = routeBegin({
              from: window.location.href,
              to: url.href,
              source: options.source || 'document-fallback',
              replace: options.replace === true,
              restore: options.restoreScroll === true,
              adapter: 'document'
            });
            routeCommit(id, { adapter: 'document' });
            window.setTimeout(function () {
              if (options.replace === true) window.location.replace(url.href);
              else window.location.assign(url.href);
            }, 0);
            return true;
          }
          """
          lifecycle = lifecycle[:doc_start] + new_doc + lifecycle[doc_end + 1:]

          guard_start = lifecycle.index('  function runGuard(options) {')
          guard_end = lifecycle.index('\n  function bindPopstate() {', guard_start)
          new_guard = """  function runGuard(options) {
            options = options || {};
            if (typeof options.check !== 'function') {
              return Promise.reject(new TypeError('Guard check must be a function.'));
            }
            var id = guardBegin({ name: options.name || 'guard', source: options.source || normalizePath() });
            return Promise.resolve()
              .then(function () { return options.check(); })
              .then(function (result) {
                var allowed = typeof options.allowed === 'function' ? options.allowed(result) : Boolean(result);
                if (allowed) {
                  guardAllow(id, { result: result });
                  return { allowed: true, result: result, guardId: id };
                }
                var target = typeof options.redirect === 'function' ? options.redirect(result) : options.redirect;
                if (!target) throw new Error('Guard negado sem destino seguro.');
                guardRedirect(id, target, { result: result });
                return Promise.resolve(go(target, {
                  replace: true,
                  source: 'guard',
                  forceDocument: options.forceDocument === true
                })).then(function () {
                  return { allowed: false, result: result, guardId: id, redirect: normalizeUrl(target).href };
                });
              })
              .catch(function (error) {
                guardFail(id, error, { source: options.source || normalizePath() });
                if (!options.fallback) throw error;
                guardRedirect(id, options.fallback, { fallback: true });
                return Promise.resolve(go(options.fallback, {
                  replace: true,
                  source: 'guard-fallback',
                  forceDocument: options.forceDocument === true
                })).then(function () {
                  return { allowed: false, error: error, guardId: id, redirect: normalizeUrl(options.fallback).href };
                });
              });
          }
          """
          lifecycle = lifecycle[:guard_start] + new_guard + lifecycle[guard_end + 1:]
          lifecycle_path.write_text(lifecycle)

          test_path = Path('scripts/test-navigation-lifecycle-core-contract.js')
          test = test_path.read_text()
          test_start = test.index("  const documentNavigation = api.navigation.go('https://doke.test/pagamento-profissional.html'")
          test_end = test.index('  assert.deepStrictEqual(assigned.at(-1), {', test_start)
          new_test = """  const documentNavigationResult = api.navigation.go('https://doke.test/pagamento-profissional.html', {
            source: 'test-document-navigation',
            forceDocument: true
          });
          assert.strictEqual(documentNavigationResult, true, 'document navigation must acknowledge synchronously');
          assert.strictEqual(assigned.length, 0, 'document navigation must not destroy the caller context synchronously');
          await new Promise((resolve) => setTimeout(resolve, 0));
          """
          test_path.write_text(test[:test_start] + new_test + test[test_end:])
          PY

      - name: Validate focused contracts
        run: |
          node --check assets/js/core/navigation-lifecycle.js
          node scripts/test-navigation-lifecycle-core-contract.js
          node scripts/audit-navigation-registry-ownership.js

      - name: Commit focused acknowledgement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/core/navigation-lifecycle.js scripts/test-navigation-lifecycle-core-contract.js
          git commit -m "FE-J01: acknowledge document navigation synchronously"
          git push origin HEAD:${GITHUB_HEAD_REF}
