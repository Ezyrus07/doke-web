name: FE-J01 Document Acknowledgement Fix

on:
  pull_request:
    paths:
      - "assets/js/dev/fe-j01-document-ack-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply synchronous document acknowledgement
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          lifecycle_path = Path('assets/js/core/navigation-lifecycle.js')
          lifecycle = lifecycle_path.read_text()

          doc_start = lifecycle.index('  function documentNavigate(url, options) {')
          doc_end = lifecycle.index('\n  function go(href, options) {', doc_start)
          doc_block = lifecycle[doc_start:doc_end]
          doc_pattern = re.compile(
              r"return new Promise\(function \(resolve\) \{\s*"
              r"resolve\(true\);\s*"
              r"window\.setTimeout\(function \(\) \{\s*"
              r"if \(options\.replace === true\) window\.location\.replace\(url\.href\);\s*"
              r"else window\.location\.assign\(url\.href\);\s*"
              r"\}, 64\);\s*"
              r"\}\);"
          )
          new_doc = """window.setTimeout(function () {
                if (options.replace === true) window.location.replace(url.href);
                else window.location.assign(url.href);
              }, 0);
              return true;"""
          doc_block, doc_count = doc_pattern.subn(new_doc, doc_block, count=1)
          if doc_count != 1:
              raise SystemExit(f'document navigation block matches: {doc_count}')
          lifecycle = lifecycle[:doc_start] + doc_block + lifecycle[doc_end:]

          guard_start = lifecycle.index('  function runGuard(options) {')
          guard_end = lifecycle.index('\n  function bindPopstate() {', guard_start)
          guard_block = lifecycle[guard_start:guard_end]
          if guard_block.count('return go(') != 2 or guard_block.count('}).then(function () {') != 2:
              raise SystemExit('guard navigation call shape changed')
          guard_block = guard_block.replace('return go(', 'return Promise.resolve(go(', 2)
          guard_block = guard_block.replace('}).then(function () {', '})).then(function () {', 2)
          lifecycle = lifecycle[:guard_start] + guard_block + lifecycle[guard_end:]
          lifecycle_path.write_text(lifecycle)

          test_path = Path('scripts/test-navigation-lifecycle-core-contract.js')
          test = test_path.read_text()
          test_pattern = re.compile(
              r"const documentNavigation = api\.navigation\.go\('https://doke\.test/pagamento-profissional\.html', \{\s*"
              r"source: 'test-document-navigation',\s*"
              r"forceDocument: true\s*"
              r"\}\);\s*"
              r"assert\.strictEqual\(assigned\.length, 0, 'document navigation must not destroy the caller context synchronously'\);\s*"
              r"await documentNavigation;\s*"
              r"assert\.strictEqual\(assigned\.length, 0, 'document navigation must settle before the hard navigation task'\);\s*"
              r"await new Promise\(\(resolve\) => setTimeout\(resolve, 80\)\);"
          )
          new_test = """const documentNavigationResult = api.navigation.go('https://doke.test/pagamento-profissional.html', {
              source: 'test-document-navigation',
              forceDocument: true
            });
            assert.strictEqual(documentNavigationResult, true, 'document navigation must acknowledge synchronously');
            assert.strictEqual(assigned.length, 0, 'document navigation must not destroy the caller context synchronously');
            await new Promise((resolve) => setTimeout(resolve, 0));"""
          test, test_count = test_pattern.subn(new_test, test, count=1)
          if test_count != 1:
              raise SystemExit(f'document navigation test block matches: {test_count}')
          test_path.write_text(test)
          PY

      - name: Validate focused contracts
        run: |
          node --check assets/js/core/navigation-lifecycle.js
          node scripts/test-navigation-lifecycle-core-contract.js
          node scripts/audit-navigation-registry-ownership.js

      - name: Commit focused acknowledgement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/core/navigation-lifecycle.js scripts/test-navigation-lifecycle-core-contract.js
          git commit -m "FE-J01: acknowledge document navigation synchronously"
          git push origin HEAD:${GITHUB_HEAD_REF}
