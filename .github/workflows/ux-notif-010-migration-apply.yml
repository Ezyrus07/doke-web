name: Doke UX-NOTIF-010 Migration Apply

on:
  push:
    branches:
      - ux/ux-notif-010-multi-surface-qa-migration
    paths:
      - .github/workflows/ux-notif-010-migration-apply.yml

permissions:
  contents: write

jobs:
  apply-migration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout H10 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-notif-010-multi-surface-qa-migration
          fetch-depth: 0

      - name: Apply deterministic H10 migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          action_tag = ' <script src="assets/js/core/notification-action.js?v=20260810-ux-notif-010-v1"></script>\n'
          toast_tag = ' <script src="assets/js/core/notification-toast.js"></script>'

          for name in ('mensagens.html', 'comunidade-interna.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'assets/js/core/notification-action.js' in text:
                  raise SystemExit(f'{name}: notification-action already present; refusing duplicate migration')
              if text.count(toast_tag) != 1:
                  raise SystemExit(f'{name}: expected exactly one canonical toast anchor')
              text = text.replace(toast_tag, action_tag + toast_tag, 1)
              path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/test-ux-notif-009-notification-actions.js')
          test = test_path.read_text(encoding='utf-8')

          old_capability = """  for (const scenario of [\n    { serviceMode: 'missing' },\n    { serviceMode: 'no-status' },\n    { serviceMode: 'no-send' },\n    { boundaryStatus: { required: false, ready: true } },\n    { boundaryStatus: { required: true, ready: false } },\n    { boundaryThrows: true }\n  ]) {\n    const runtime = browserAuthority(scenario);\n    const action = runtime.api.resolveActions({ actions: [candidate()] })[0];\n    const result = await runtime.api.execute(action, { body: 'Não deve sair' });\n    assert.equal(result.state, 'FAILED');\n    assert.equal(result.error.code, 'DOKE_NOTIFICATION_ACTION_EXECUTOR_UNAVAILABLE');\n    assert.equal(runtime.calls.length, 0);\n  }\n"""
          new_capability = """  for (const scenario of [\n    { serviceMode: 'missing' },\n    { serviceMode: 'no-status' },\n    { serviceMode: 'no-send' },\n    { boundaryStatus: { required: false, ready: true } },\n    { boundaryStatus: { required: true, ready: false } },\n    { boundaryThrows: true }\n  ]) {\n    const runtime = browserAuthority(scenario);\n    assert.equal(runtime.api.resolveActions({ actions: [candidate()] }).length, 0, 'unavailable browser executor must fail closed before render');\n    const result = await runtime.api.execute(candidate(), { body: 'Não deve sair' });\n    assert.equal(result.state, 'FAILED');\n    assert.equal(result.reason, 'invalid-action');\n    assert.equal(runtime.calls.length, 0);\n  }\n"""
          if test.count(old_capability) != 1:
              raise SystemExit('H09 capability regression anchor diverged')
          test = test.replace(old_capability, new_capability, 1)

          old_surface = """    assert.ok(actionIndex >= 0, 'canonical notification surface must load notification-action authority');\n    assert.ok(toastIndex > actionIndex, 'notification-action must execute before notification-toast');\n    assert.doesNotMatch(read('mensagens.html'), /notification-action\\.js/, 'H09 must not silently expand rollout to messages');\n    assert.doesNotMatch(read('comunidade-interna.html'), /notification-action\\.js/, 'H09 must leave multi-surface migration to H10');\n"""
          new_surface = """    assert.ok(actionIndex >= 0, 'canonical notification surface must load notification-action authority');\n    assert.ok(toastIndex > actionIndex, 'notification-action must execute before notification-toast');\n    for (const surface of ['mensagens.html', 'comunidade-interna.html']) {\n      const source = read(surface);\n      const migratedActionIndex = source.indexOf('assets/js/core/notification-action.js');\n      const migratedToastIndex = source.indexOf('assets/js/core/notification-toast.js');\n      assert.ok(migratedActionIndex >= 0, `${surface} must load notification-action after H10 migration`);\n      assert.ok(migratedToastIndex > migratedActionIndex, `${surface} must load notification-action before notification-toast`);\n    }\n"""
          if test.count(old_surface) != 1:
              raise SystemExit('H09 surface regression anchor diverged')
          test = test.replace(old_surface, new_surface, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          git diff --exit-code --quiet && { echo '::error::Migration produced no diff'; exit 1; } || true

      - name: Commit deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mensagens.html comunidade-interna.html scripts/test-ux-notif-009-notification-actions.js
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'feat(ux-notif-010): migrate quick-action surfaces'
          git push origin HEAD:ux/ux-notif-010-multi-surface-qa-migration
