name: REP-A01 Authority Baseline

on:
  pull_request:
    paths:
      - 'config/rep-a01-authority-baseline.json'
      - 'docs/REP-A01-AUTHORITY-BASELINE.md'
      - 'scripts/audit-rep-a01-authority-baseline.js'
      - 'scripts/test-rep-a01-authority-baseline.js'
      - '.github/workflows/rep-a01-authority-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rep-a01-authority-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax
        run: |
          node --check scripts/audit-rep-a01-authority-baseline.js
          node --check scripts/test-rep-a01-authority-baseline.js

      - name: Audit authority baseline
        run: node scripts/audit-rep-a01-authority-baseline.js

      - name: Conformance
        run: node scripts/test-rep-a01-authority-baseline.js

      - name: DSP-A05 predecessor regression
        run: |
          node scripts/audit-dsp-a05-operator-case-dual-control-readiness.js
          node scripts/test-dsp-a05-operator-case-dual-control-readiness.js

      - name: Diff hygiene
        run: git diff --check
