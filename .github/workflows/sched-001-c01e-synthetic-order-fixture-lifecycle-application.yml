name: Doke SCHED-C01E Authorized Fixture Lifecycle and C01D

on:
  pull_request:
    branches: [search/search-ux02-intent-favorites-clean]
    paths:
      - 'scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js'
      - 'scripts/prepare-sched-001-c01e-dual-authorization-runtime.js'
      - '.github/workflows/sched-001-c01e-synthetic-order-fixture-lifecycle-application.yml'

permissions:
  contents: read

concurrency:
  group: sched-c01e-authorized-lifecycle
  cancel-in-progress: false

jobs:
  canary:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DOKE_STAGING_CLIENT_EMAIL: ${{ secrets.DOKE_STAGING_CLIENT_EMAIL }}
      DOKE_STAGING_CLIENT_PASSWORD: ${{ secrets.DOKE_STAGING_CLIENT_PASSWORD }}
      DOKE_STAGING_PROFESSIONAL_EMAIL: ${{ secrets.DOKE_STAGING_PROFESSIONAL_EMAIL }}
      DOKE_STAGING_PROFESSIONAL_PASSWORD: ${{ secrets.DOKE_STAGING_PROFESSIONAL_PASSWORD }}
      DOKE_SCHED_C01E_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01E_SYNTHETIC_ORDER_FIXTURE_LIFECYCLE_ON_DOKE_STAGING
      DOKE_SCHED_C01E_BROWSER_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING
      DOKE_SCHED_C01E_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOKE_SCHED_C01E_RUN_ID: sched-c01e-${{ github.run_id }}
      DOKE_SCHED_C01E_REPORT_PATH: reports/generated/sched-001-c01e-synthetic-order-fixture-lifecycle-report.json
      DOKE_ENVIRONMENT: staging
      DOKE_SCHED_C01D_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING
      DOKE_SCHED_C01D_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOKE_SCHED_C01D_ALLOW_NETWORK: '1'
      DOKE_SCHED_C01D_EXECUTE: '1'
      DOKE_SCHED_C01D_WEB_BASE_URL: http://127.0.0.1:5500
      DOKE_SCHED_C01D_REPORT_PATH: reports/generated/sched-001-c01d-authenticated-browser-read-only-canary-report.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 1

      - name: Require immutable authorized head
        run: |
          test "$(git rev-parse HEAD)" = "$DOKE_SCHED_C01E_EXPECTED_HEAD_SHA"
          test "$DOKE_SCHED_C01D_EXPECTED_HEAD_SHA" = "$DOKE_SCHED_C01E_EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate authorized execution package
        run: |
          node --check scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js
          node --check scripts/prepare-sched-001-c01e-dual-authorization-runtime.js
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          npm run audit:domain-completion-matrix

      - name: Materialize ephemeral dual authorization
        run: node scripts/prepare-sched-001-c01e-dual-authorization-runtime.js

      - name: Read-only preflight
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --preflight

      - name: Provision bounded fixture graph
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --provision

      - name: Validate C01D environment
        run: node scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js --check-env --write-report

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact-head web server
        run: |
          DOKE_E2E_DISABLE_REMOTE_SERVICES=0 node scripts/serve-static-site.js --host=127.0.0.1 --port=5500 > "$RUNNER_TEMP/sched-c01e-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5500/index.html >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/sched-c01e-server.log"
          exit 1

      - name: Execute bound C01D read-only canary
        continue-on-error: true
        run: node scripts/prepare-sched-001-c01d-authenticated-browser-login-runtime.js --execute --write-report

      - name: Cleanup fixture graph
        if: always()
        continue-on-error: true
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --cleanup

      - name: Verify zero residue independently
        if: always()
        continue-on-error: true
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --verify-clean

      - name: Finalize sanitized evidence
        if: always()
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --finalize

      - name: Verify C01D source restoration
        if: always()
        run: git diff --exit-code -- scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-c01e-bound-c01d-${{ github.run_id }}
          path: |
            reports/generated/sched-001-c01e-synthetic-order-fixture-lifecycle-report.json
            reports/generated/sched-001-c01d-authenticated-browser-read-only-canary-report.json
          if-no-files-found: warn
          retention-days: 14
