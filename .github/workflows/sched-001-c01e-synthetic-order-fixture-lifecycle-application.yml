name: Doke SCHED-C01E Synthetic Fixture Lifecycle and Bound C01D Canary

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - 'scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js'
      - '.github/workflows/sched-001-c01e-synthetic-order-fixture-lifecycle-application.yml'

permissions:
  contents: read

concurrency:
  group: sched-c01e-synthetic-fixture-lifecycle-bound-c01d
  cancel-in-progress: false

jobs:
  canary:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DOKE_STAGING_CLIENT_EMAIL: ${{ secrets.DOKE_STAGING_CLIENT_EMAIL }}
      DOKE_STAGING_CLIENT_PASSWORD: ${{ secrets.DOKE_STAGING_CLIENT_PASSWORD }}
      DOKE_STAGING_PROFESSIONAL_EMAIL: ${{ secrets.DOKE_STAGING_PROFESSIONAL_EMAIL }}
      DOKE_STAGING_PROFESSIONAL_PASSWORD: ${{ secrets.DOKE_STAGING_PROFESSIONAL_PASSWORD }}
      DOKE_SCHED_C01E_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01E_SYNTHETIC_ORDER_FIXTURE_LIFECYCLE_ON_DOKE_STAGING
      DOKE_SCHED_C01E_BROWSER_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING
      DOKE_SCHED_C01E_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOKE_SCHED_C01E_RUN_ID: sched-c01e-${{ github.run_id }}
      DOKE_SCHED_C01E_STATE_PATH: ${{ runner.temp }}/sched-c01e/state.json
      DOKE_SCHED_C01E_REPORT_PATH: reports/generated/sched-001-c01e-synthetic-order-fixture-lifecycle-report.json
      DOKE_ENVIRONMENT: staging
      DOKE_SCHED_C01D_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING
      DOKE_SCHED_C01D_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOKE_SCHED_C01D_ALLOW_NETWORK: '1'
      DOKE_SCHED_C01D_EXECUTE: '1'
      DOKE_SCHED_C01D_WEB_BASE_URL: http://127.0.0.1:5500
      DOKE_SCHED_C01D_REPORT_PATH: reports/generated/sched-001-c01d-authenticated-browser-read-only-canary-report.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 1

      - name: Require immutable authorized PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DOKE_SCHED_C01E_EXPECTED_HEAD_SHA"
          test "$DOKE_SCHED_C01E_AUTHORIZATION" = "I_EXPLICITLY_AUTHORIZE_SCHED_C01E_SYNTHETIC_ORDER_FIXTURE_LIFECYCLE_ON_DOKE_STAGING"
          test "$DOKE_SCHED_C01E_BROWSER_AUTHORIZATION" = "I_EXPLICITLY_AUTHORIZE_SCHED_C01D_AUTHENTICATED_BROWSER_READ_ONLY_CANARY_ON_DOKE_STAGING"
          test "$DOKE_SCHED_C01D_AUTHORIZATION" = "$DOKE_SCHED_C01E_BROWSER_AUTHORIZATION"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Preserve repository and execution contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js
          node scripts/audit-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/test-sched-001-c01e-synthetic-order-fixture-lifecycle-readiness.js
          node scripts/plan-sched-001-c01e-synthetic-order-fixture-lifecycle.js --dry-run
          node scripts/audit-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-canary-readiness.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary.js
          node scripts/test-sched-001-c01d-authenticated-browser-read-only-canary-runner.js
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Materialize ephemeral dual authorization envelopes
        shell: bash
        run: |
          set -euo pipefail
          for name in DOKE_STAGING_CLIENT_EMAIL DOKE_STAGING_CLIENT_PASSWORD DOKE_STAGING_PROFESSIONAL_EMAIL DOKE_STAGING_PROFESSIONAL_PASSWORD SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            test -n "${!name:-}"
          done
          test "$DOKE_STAGING_CLIENT_EMAIL" != "$DOKE_STAGING_PROFESSIONAL_EMAIL"
          mkdir -p "$RUNNER_TEMP/sched-c01e"
          export C01E_MANIFEST_PATH="$RUNNER_TEMP/sched-c01e/fixture-manifest.json"
          export C01E_ENVELOPE_PATH="$RUNNER_TEMP/sched-c01e/authorization-envelope.json"
          export C01D_MANIFEST_PATH="$RUNNER_TEMP/sched-c01e/c01d-case-manifest.json"
          export C01D_ENVELOPE_PATH="$RUNNER_TEMP/sched-c01e/c01d-authorization-envelope.json"
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const normalizeEmail = (value) => String(value || '').trim().toLowerCase();
          const now = new Date();
          const expires = new Date(now.getTime() + 55 * 60 * 1000);

          const fixtureManifest = {
            contractVersion: 'sched-c01e-fixture-manifest-v1',
            serviceCount: 1,
            serviceVersionCount: 1,
            orderCount: 2,
            conversationCount: 2,
            messageCountMaximum: 2,
            scheduleReservationCount: 1,
            canonicalConfirmedOrderCount: 1,
            alternateOrderCount: 1
          };
          const fixtureManifestText = JSON.stringify(fixtureManifest, null, 2) + '\n';
          fs.writeFileSync(process.env.C01E_MANIFEST_PATH, fixtureManifestText);
          const fixtureManifestDigest = sha256(fixtureManifestText);

          const fixtureEnvelope = {
            contractVersion: 'sched-c01e-external-authorization-envelope-v1',
            issuedAt: now.toISOString(),
            expiresAt: expires.toISOString(),
            headSha: process.env.DOKE_SCHED_C01E_EXPECTED_HEAD_SHA,
            projectRef: process.env.SUPABASE_PROJECT_REF,
            runId: process.env.DOKE_SCHED_C01E_RUN_ID,
            fixtureAuthorizationPhraseDigest: sha256(process.env.DOKE_SCHED_C01E_AUTHORIZATION),
            browserAuthorizationPhraseDigest: sha256(process.env.DOKE_SCHED_C01E_BROWSER_AUTHORIZATION),
            clientAccountDigest: sha256(normalizeEmail(process.env.DOKE_STAGING_CLIENT_EMAIL)),
            professionalAccountDigest: sha256(normalizeEmail(process.env.DOKE_STAGING_PROFESSIONAL_EMAIL)),
            fixtureManifestDigest
          };
          const fixtureEnvelopeText = JSON.stringify(fixtureEnvelope, null, 2) + '\n';
          fs.writeFileSync(process.env.C01E_ENVELOPE_PATH, fixtureEnvelopeText);

          const caseManifest = {
            contractVersion: 'sched-c01d-read-only-case-manifest-v1',
            headSha: process.env.DOKE_SCHED_C01D_EXPECTED_HEAD_SHA,
            projectRef: process.env.SUPABASE_PROJECT_REF,
            requiredAuthorities: ['canonical_confirmed'],
            alternateAuthorities: ['client_intent', 'none'],
            maximumOrders: 4
          };
          const caseManifestText = JSON.stringify(caseManifest, null, 2) + '\n';
          fs.writeFileSync(process.env.C01D_MANIFEST_PATH, caseManifestText);
          const caseManifestDigest = sha256(caseManifestText);

          const c01dEnvelope = {
            contractVersion: 'sched-c01d-external-authorization-envelope-v1',
            issuedAt: now.toISOString(),
            expiresAt: expires.toISOString(),
            headSha: process.env.DOKE_SCHED_C01D_EXPECTED_HEAD_SHA,
            projectRef: process.env.SUPABASE_PROJECT_REF,
            authorizationPhraseDigest: sha256(process.env.DOKE_SCHED_C01D_AUTHORIZATION),
            clientAccountDigest: sha256(normalizeEmail(process.env.DOKE_STAGING_CLIENT_EMAIL)),
            professionalAccountDigest: sha256(normalizeEmail(process.env.DOKE_STAGING_PROFESSIONAL_EMAIL)),
            caseManifestDigest
          };
          const c01dEnvelopeText = JSON.stringify(c01dEnvelope, null, 2) + '\n';
          fs.writeFileSync(process.env.C01D_ENVELOPE_PATH, c01dEnvelopeText);

          const output = [
            ['DOKE_SCHED_C01E_FIXTURE_MANIFEST_PATH', process.env.C01E_MANIFEST_PATH],
            ['DOKE_SCHED_C01E_FIXTURE_MANIFEST_SHA256', fixtureManifestDigest],
            ['DOKE_SCHED_C01E_AUTHORIZATION_ENVELOPE_PATH', process.env.C01E_ENVELOPE_PATH],
            ['DOKE_SCHED_C01E_AUTHORIZATION_ENVELOPE_SHA256', sha256(fixtureEnvelopeText)],
            ['DOKE_SCHED_C01D_CASE_MANIFEST_PATH', process.env.C01D_MANIFEST_PATH],
            ['DOKE_SCHED_C01D_CASE_MANIFEST_SHA256', caseManifestDigest],
            ['DOKE_SCHED_C01D_AUTHORIZATION_ENVELOPE_PATH', process.env.C01D_ENVELOPE_PATH],
            ['DOKE_SCHED_C01D_AUTHORIZATION_ENVELOPE_SHA256', sha256(c01dEnvelopeText)]
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, output.map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          NODE

      - name: Read-only preflight and zero-residue gate
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --preflight

      - name: Provision bounded synthetic fixture graph
        id: provision
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --provision

      - name: Fail-closed C01D environment preflight
        run: node scripts/run-sched-001-c01d-authenticated-browser-read-only-canary.js --check-env --write-report

      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact-PR local web server
        shell: bash
        run: |
          set -euo pipefail
          DOKE_E2E_DISABLE_REMOTE_SERVICES=0 node scripts/serve-static-site.js --host=127.0.0.1 --port=5500 > "$RUNNER_TEMP/sched-c01e-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sched-c01e-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5500/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sched-c01e-server.log"
          exit 1

      - name: Execute bound authenticated browser read-only canary
        id: c01d
        continue-on-error: true
        run: node scripts/prepare-sched-001-c01d-authenticated-browser-login-runtime.js --execute --write-report

      - name: Cleanup bounded synthetic fixture graph
        id: cleanup
        if: always()
        continue-on-error: true
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --cleanup

      - name: Independently verify zero residue
        id: verify_cleanup
        if: always()
        continue-on-error: true
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --verify-clean

      - name: Finalize sanitized lifecycle evidence
        if: always()
        run: node scripts/execute-sched-001-c01e-synthetic-order-fixture-lifecycle.js --finalize

      - name: Verify C01D executor restoration
        if: always()
        run: git diff --exit-code -- scripts/execute-sched-001-c01d-authenticated-browser-read-only-canary.js

      - name: Upload sanitized C01E and C01D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-001-c01e-fixture-lifecycle-bound-c01d-${{ github.run_id }}
          path: |
            reports/generated/sched-001-c01e-synthetic-order-fixture-lifecycle-report.json
            reports/generated/sched-001-c01d-authenticated-browser-read-only-canary-report.json
          if-no-files-found: warn
          retention-days: 14
