name: Doke Frontend Structural Gates

on:
  pull_request:
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "scripts/audit-token-authority.js"
      - "scripts/migrate-token-authority-overrides.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"
  push:
    branches:
      - MAIN
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "scripts/audit-token-authority.js"
      - "scripts/migrate-token-authority-overrides.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"

permissions:
  contents: write

jobs:
  structural-gates:
    name: Baseline-aware frontend architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run frontend structural gates
        run: node scripts/audit-frontend-structural-gates.js --strict

      - name: Apply reviewed FE-T01 candidate
        shell: bash
        run: |
          node scripts/audit-token-authority.js --write || true
          node scripts/migrate-token-authority-overrides.js
          node scripts/audit-token-authority.js
          git diff --name-only -- assets/css > reports/generated/token-authority-changed-files.txt
          unexpected="$(git diff --name-only | grep -v '^assets/css/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit reviewed CSS migration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- assets/css; then
            echo "Token authority migration is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css
          git commit -m "FE-T01: apply canonical token authority migration"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload structural gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-structural-gates-${{ github.sha }}
          path: |
            reports/generated/frontend-structural-gates-report.json
            reports/generated/token-authority-report.json
            reports/generated/token-authority-changed-files.txt
          if-no-files-found: error
          retention-days: 14
