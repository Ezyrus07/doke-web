name: Doke Frontend Structural Gates

on:
  pull_request:
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "scripts/audit-token-authority.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"
  push:
    branches:
      - MAIN
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "scripts/audit-token-authority.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"

permissions:
  contents: read

jobs:
  structural-gates:
    name: Baseline-aware frontend architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run frontend structural gates
        run: node scripts/audit-frontend-structural-gates.js --strict

      - name: Run canonical token authority gate
        run: node scripts/audit-token-authority.js

      - name: Generate deterministic domain matrix candidate
        shell: bash
        run: |
          cp docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-current.md
          npm run write:domain-completion-matrix
          cp docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-candidate.md
          diff -u reports/generated/domain-completion-matrix-current.md reports/generated/domain-completion-matrix-candidate.md > reports/generated/domain-completion-matrix.diff || true

      - name: Upload structural gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-structural-gates-${{ github.sha }}
          path: |
            reports/generated/frontend-structural-gates-report.json
            reports/generated/token-authority-report.json
            reports/generated/domain-completion-matrix-current.md
            reports/generated/domain-completion-matrix-candidate.md
            reports/generated/domain-completion-matrix.diff
          if-no-files-found: error
          retention-days: 14
