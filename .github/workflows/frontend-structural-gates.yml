name: Doke Frontend Structural Gates

on:
  pull_request:
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "scripts/audit-token-authority.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"
  push:
    branches:
      - MAIN
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "scripts/audit-token-authority.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"

permissions:
  contents: write

jobs:
  structural-gates:
    name: Baseline-aware frontend architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run frontend structural gates
        run: node scripts/audit-frontend-structural-gates.js --strict

      - name: Run canonical token authority gate
        run: node scripts/audit-token-authority.js

      - name: Refresh deterministic domain matrix
        run: npm run write:domain-completion-matrix

      - name: Commit deterministic domain matrix
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md; then
            echo "Domain matrix is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "FE-T01: refresh domain completion matrix"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload structural gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-structural-gates-${{ github.sha }}
          path: |
            reports/generated/frontend-structural-gates-report.json
            reports/generated/token-authority-report.json
          if-no-files-found: error
          retention-days: 14
