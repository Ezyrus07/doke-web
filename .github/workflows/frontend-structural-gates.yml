name: Doke Frontend Structural Gates

on:
  pull_request:
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"
  push:
    branches:
      - MAIN
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "scripts/audit-frontend-structural-gates.js"
      - "config/frontend-structural-gates.json"
      - ".github/workflows/frontend-structural-gates.yml"

permissions:
  contents: read

jobs:
  structural-gates:
    name: Baseline-aware frontend architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run frontend structural gates
        run: node scripts/audit-frontend-structural-gates.js --strict

      - name: Capture governed audit diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports/generated
          set -o pipefail
          npm run audit:agent-governance 2>&1 | tee reports/generated/frontend-agent-governance.log

      - name: Preserve current domain matrix
        if: always()
        run: cp docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-before.md

      - name: Generate deterministic domain matrix candidate
        if: always()
        run: npm run write:domain-completion-matrix

      - name: Upload structural gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-structural-gates-${{ github.sha }}
          path: |
            reports/generated/frontend-structural-gates-report.json
            reports/generated/frontend-agent-governance.log
            reports/generated/domain-completion-matrix-report.json
            reports/generated/domain-completion-matrix-before.md
            docs/DOMAIN-COMPLETION-MATRIX.md
          if-no-files-found: error
          retention-days: 14
