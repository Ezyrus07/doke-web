name: COM-B03C R5H Concrete Runtime Adapter Binding Implementation Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js'
      - 'config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js'
      - 'config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b03c-r5h-concrete-runtime-adapter-binding-implementation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified concrete runtime adapter binding specification lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification.json)" = "9f30614b073b62eb90724867204f95b02373020a"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification.yml)" = "c8cf38e556a977f808a95727e8eafc50ac91673b"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-implementation-boundary.json)" = "a2e7e516c0ca57239dfa584095d6d6349b810e32"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js)" = "6fc34e1b365ec801665fdab0c7d0c6761a8013e6"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json)" = "04a8aaac9a44dee241d852f6ca55f457b5adecfa"

      - name: Exact repository-only push scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          module=backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js
          boundary=config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json
          workflow=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.yml
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-matrix-materialization-temp.yml
          installation_scope="$(printf '%s\n' "$module" "$boundary" "$workflow" | sort)"
          maintenance_scope="$workflow"
          materialization_scope="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          if [ "$actual" = "$installation_scope" ]; then
            test "$(git rev-parse HEAD^)" = "6cdd58b2d436acaaf72c160ddde55869ea0e3a63"
          elif [ "$actual" != "$maintenance_scope" ] && [ "$actual" != "$materialization_scope" ]; then
            printf 'Unexpected repository-only push scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Syntax and transport-unbound static boundary
        shell: bash
        run: |
          set -euo pipefail
          module=backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js
          boundary=config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json
          workflow=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.yml
          node --check "$module"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$boundary"
          ! grep -Eq 'https?://|eyJ[A-Za-z0-9_-]+|sk[-_][A-Za-z0-9_-]+|sbp_[A-Za-z0-9_-]+' "$module" "$boundary"
          ! grep -Fq 'process.env' "$module"
          ! grep -Fq '@supabase' "$module"
          ! grep -Fq 'createClient' "$module"
          ! grep -Fq '.channel(' "$module"
          ! grep -Fq '.subscribe(' "$module"
          ! grep -Fq 'fetch(' "$module"
          grep -Fq '  contents: read' "$workflow"
          grep -Fq '  pull-requests: read' "$workflow"
          contents_write='  contents'': write'
          secret_ref='secrets''.'
          environment_key='environment'':'
          supabase_prefix='SUPABASE''_'
          http_prefix='http'':'
          https_prefix='https'':'
          ! grep -Fq "$contents_write" "$workflow"
          ! grep -Fq "$secret_ref" "$workflow"
          ! grep -Fq "$environment_key" "$workflow"
          ! grep -Fq "$supabase_prefix" "$workflow"
          ! grep -Fq "${http_prefix}//" "$workflow"
          ! grep -Fq "${https_prefix}//" "$workflow"

      - name: Certify transport-unbound concrete runtime adapter implementation repository-only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const spec = require('./config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification.json');
          const boundary = require('./config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json');
          const adapter = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js');
          const parent = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js');

          if (spec.contractId !== 'com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-specification-v1') throw new Error('PARENT_SPEC_CONTRACT_DRIFT');
          if (boundary.contractId !== 'com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary-v1') throw new Error('ADAPTER_IMPLEMENTATION_BOUNDARY_CONTRACT_DRIFT');
          const ctx = boundary.repositoryContext;
          if (ctx.parentCertifiedConcreteRuntimeAdapterBindingSpecificationHead !== '6cdd58b2d436acaaf72c160ddde55869ea0e3a63') throw new Error('PARENT_SPEC_HEAD_DRIFT');
          if (ctx.parentCertifiedConcreteRuntimeAdapterBindingSpecificationTree !== 'bf29205415fffc4af1bbed2b54ccfebb5766926e') throw new Error('PARENT_SPEC_TREE_DRIFT');
          if (ctx.parentConcreteRuntimeAdapterBindingSpecificationCertificationRun !== 31951610351 || ctx.parentConcreteRuntimeAdapterBindingSpecificationCertificationJob !== 95175797464) throw new Error('PARENT_SPEC_CERTIFICATION_DRIFT');
          if (ctx.parentConcreteRuntimeAdapterBindingSpecificationBlob !== '9f30614b073b62eb90724867204f95b02373020a' || ctx.parentConcreteRuntimeAdapterBindingSpecificationCertifierBlob !== 'c8cf38e556a977f808a95727e8eafc50ac91673b') throw new Error('PARENT_SPEC_BLOB_DRIFT');
          if (ctx.parentRuntimeTargetBindingImplementationModuleBlob !== '759935689fccc695cf7bcfa5d495fefb0965d8be') throw new Error('PARENT_RUNTIME_TARGET_MODULE_BLOB_DRIFT');
          if (ctx.matrixVersion !== '1.3.113' || ctx.maturity !== 3 || ctx.productionGate !== 'blocked') throw new Error('MATRIX_STATE_DRIFT');
          if (boundary.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || boundary.functionalCheckpoint.r5iCreated !== false || boundary.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          const impl = boundary.implementation;
          for (const key of ['implementationPresent','concreteRuntimeAdapterBindingSpecificationDefined','concreteRuntimeAdapterBindingImplementationBoundaryDefined','validatedCaseAdapterImplemented','delegatedPortContractImplemented','sanitizedOutputGateImplemented','repositoryReadinessEvaluatorImplemented','remoteExecutionHardBlockImplemented','runtimeAdapterImplementationPresent']) {
            if (impl[key] !== true) throw new Error(`${key}_REQUIRED`);
          }
          for (const key of ['runtimeAdapterBindingDefined','runtimeAdapterBound','transportBound','executionEntryPointExported','executionWorkflowImplemented']) {
            if (impl[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          if (impl.modulePath !== 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js' || impl.moduleBlob !== '6fc34e1b365ec801665fdab0c7d0c6761a8013e6' || impl.moduleContractId !== 'com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-v1') throw new Error('ADAPTER_MODULE_DESCRIPTOR_DRIFT');

          const implementationDescriptor = boundary.adapterImplementationDescriptor;
          if (implementationDescriptor.adapterContractId !== impl.moduleContractId || implementationDescriptor.adapterModulePath !== impl.modulePath || implementationDescriptor.adapterModuleBlob !== impl.moduleBlob) throw new Error('IMPLEMENTATION_DESCRIPTOR_DRIFT');
          if (implementationDescriptor.bindingBoundaryHead !== null || implementationDescriptor.bound !== false || implementationDescriptor.repositoryOwnedModule !== true || implementationDescriptor.immutableModuleBlob !== true || implementationDescriptor.repositoryRelativeModulePath !== true) throw new Error('IMPLEMENTATION_DESCRIPTOR_MUST_REMAIN_UNBOUND');

          const expectedCases = {
            extension_unavailable_or_null: 'extension IS NULL',
            extension_expected_presence_value: "extension = 'presence'",
            extension_unexpected_non_null_value: "extension IS NOT NULL AND extension <> 'presence'"
          };
          if (JSON.stringify(Object.keys(adapter.CASE_PREDICATES)) !== JSON.stringify(Object.keys(expectedCases))) throw new Error('ADAPTER_CASE_SET_DRIFT');
          for (const [caseId, extensionPredicate] of Object.entries(expectedCases)) {
            if (adapter.CASE_PREDICATES[caseId] !== extensionPredicate) throw new Error(`ADAPTER_CASE_PREDICATE_DRIFT:${caseId}`);
            const validated = adapter.validateObservationPlanCase({caseId, extensionPredicate, validatedObservationPlanCase:true, freshRealtimeClientRequired:true, privateChannelRequired:true, presenceOnlyRequired:true});
            if (validated.decision !== 'repository_only_validated_observation_plan_case') throw new Error(`ADAPTER_CASE_VALIDATION_FAILED:${caseId}`);
            const plan = adapter.buildAdapterInvocationPlan({caseId, extensionPredicate, validatedObservationPlanCase:true, freshRealtimeClientRequired:true, privateChannelRequired:true, presenceOnlyRequired:true});
            if (plan.decision !== 'repository_only_concrete_runtime_adapter_invocation_plan_defined' || plan.executionEnabled !== false || plan.transportBound !== false || plan.remoteExecutionAuthority !== false) throw new Error(`ADAPTER_PLAN_NOT_FAIL_CLOSED:${caseId}`);
            if (plan.delegatedPorts.length !== 7 || plan.delegatedPorts.some((item) => item.bound !== false || item.concreteValuePresent !== false || item.mustBeInjectedBySeparateCertifiedBindingBoundary !== true)) throw new Error(`ADAPTER_DELEGATED_PORT_PLAN_DRIFT:${caseId}`);
            const readiness = adapter.evaluateRepositoryAdapterReadiness({invocationPlan:plan, delegatedPortBindings:{}});
            if (readiness.reason !== 'CONCRETE_RUNTIME_ADAPTER_ALL_PORT_BINDINGS_REQUIRE_SEPARATE_CERTIFIED_BOUNDARIES' || readiness.remoteExecutionAuthority !== false) throw new Error(`ADAPTER_READINESS_MUST_REMAIN_BLOCKED:${caseId}`);
          }

          const invalidCase = adapter.validateObservationPlanCase({caseId:'unknown', extensionPredicate:'x', validatedObservationPlanCase:true, freshRealtimeClientRequired:true, privateChannelRequired:true, presenceOnlyRequired:true});
          if (invalidCase.decision !== 'blocked_repository_only') throw new Error('UNKNOWN_CASE_MUST_BLOCK');
          const materialCase = adapter.validateObservationPlanCase({caseId:'extension_unavailable_or_null', extensionPredicate:'extension IS NULL', validatedObservationPlanCase:true, freshRealtimeClientRequired:true, privateChannelRequired:true, presenceOnlyRequired:true, credentialMaterial:'forbidden'});
          if (materialCase.reason !== 'CONCRETE_RUNTIME_ADAPTER_CONCRETE_BINDING_MATERIAL_FORBIDDEN') throw new Error('CONCRETE_MATERIAL_MUST_BLOCK');

          const raw = adapter.sanitizeAdapterObservation({caseId:'extension_unavailable_or_null', extensionPredicate:'extension IS NULL', rawRemoteError:'forbidden'});
          if (raw.reason !== 'CONCRETE_RUNTIME_ADAPTER_RAW_REMOTE_OUTPUT_FORBIDDEN') throw new Error('RAW_REMOTE_OUTPUT_MUST_BLOCK');
          const sanitized = adapter.sanitizeAdapterObservation({caseId:'extension_expected_presence_value', extensionPredicate:"extension = 'presence'", sanitizedClassification:'sample', terminalChannelStatus:'sample', joinSubscribed:false, cleanupAttempted:true, cleanupSucceeded:true, zeroResidue:true, observationSequence:1, crossCaseComparable:true, ignoredField:'drop'});
          const allowed = ['caseId','extensionPredicate','sanitizedClassification','terminalChannelStatus','joinSubscribed','cleanupAttempted','cleanupSucceeded','zeroResidue','observationSequence','crossCaseComparable'];
          if (Object.keys(sanitized).some((key) => !allowed.includes(key)) || sanitized.ignoredField !== undefined) throw new Error('SANITIZED_OUTPUT_FIELD_LEAK');

          const descriptor = adapter.repositoryDescriptor();
          for (const key of ['implementationPresent','concreteRuntimeAdapterBindingSpecificationDefined','concreteRuntimeAdapterBindingImplementationBoundaryDefined','validatedCaseAdapterImplemented','delegatedPortContractImplemented','sanitizedOutputGateImplemented','repositoryReadinessEvaluatorImplemented','remoteExecutionHardBlockImplemented','runtimeAdapterImplementationPresent']) {
            if (descriptor[key] !== true) throw new Error(`ADAPTER_DESCRIPTOR_${key}_REQUIRED`);
          }
          for (const key of ['runtimeAdapterBindingDefined','runtimeAdapterBound','transportBound','executionEntryPointExported','targetEnvironmentBound','targetResourceBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed']) {
            if (descriptor[key] !== false) throw new Error(`ADAPTER_DESCRIPTOR_${key}_MUST_REMAIN_FALSE`);
          }

          const forbiddenExports = ['execute','run','subscribe','createClient','bindRuntime','authorize'];
          for (const key of forbiddenExports) if (Object.prototype.hasOwnProperty.call(adapter, key)) throw new Error(`FORBIDDEN_EXECUTION_EXPORT:${key}`);
          let disabled = false;
          try { adapter.assertRemoteExecutionDisabled(); } catch (error) { disabled = error && error.code === adapter.REMOTE_EXECUTION_DISABLED_CODE; }
          if (!disabled) throw new Error('REMOTE_EXECUTION_HARD_BLOCK_REQUIRED');

          const portBound = adapter.evaluateRepositoryAdapterReadiness({
            invocationPlan: adapter.buildAdapterInvocationPlan({caseId:'extension_unavailable_or_null', extensionPredicate:'extension IS NULL', validatedObservationPlanCase:true, freshRealtimeClientRequired:true, privateChannelRequired:true, presenceOnlyRequired:true}),
            delegatedPortBindings: {target_environment:{bound:true}}
          });
          if (portBound.reason !== 'CONCRETE_RUNTIME_ADAPTER_PORT_BINDING_REQUIRES_SEPARATE_CERTIFIED_BOUNDARY') throw new Error('PORT_BINDING_MUST_REQUIRE_SEPARATE_BOUNDARY');

          if (boundary.delegatedPortState.length !== 7 || boundary.delegatedPortState.some((item) => item.bound !== false || item.concreteValuePresent !== false || item.separateCertifiedBindingBoundaryRequired !== true)) throw new Error('BOUNDARY_DELEGATED_PORT_STATE_DRIFT');
          if (Object.values(boundary.concreteBindingState).some((value) => value !== null)) throw new Error('CONCRETE_BINDING_STATE_MUST_REMAIN_NULL');
          for (const value of Object.values(boundary.prohibitedCapabilities)) if (value !== true) throw new Error('PROHIBITED_CAPABILITY_POLICY_DRIFT');
          const gov = boundary.governance;
          for (const key of ['repositoryOnlyDefinition','repositoryOnlyImplementation','concreteRuntimeAdapterBindingSpecificationDefined','concreteRuntimeAdapterBindingImplementationBoundaryDefined','runtimeAdapterImplementationPresent']) if (gov[key] !== true) throw new Error(`${key}_REQUIRED`);
          for (const key of ['runtimeAdapterBindingDefined','runtimeAdapterBound','transportBound','executionEntryPointExported','targetEnvironmentBound','targetResourceBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) if (gov[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          if (boundary.causalState.exactRootCauseProven !== false || boundary.causalState.causalPromotionAllowed !== false || boundary.causalState.privatePresencePromotionAllowed !== false || boundary.causalState.privateTypingBroadcastProven !== false || boundary.causalState.channelMessagesCanonicalRemoteAuthority !== false) throw new Error('CAUSAL_STATE_MUST_REMAIN_BLOCKED');

          const parentDescriptor = parent.repositoryDescriptor();
          if (parentDescriptor.runtimeTargetBindingImplementationBoundaryDefined !== true || parentDescriptor.runtimeTargetBindingDefined !== false || parentDescriptor.runtimeTargetBindingImplemented !== false || parentDescriptor.concreteBindingPresent !== false || parentDescriptor.transportBound !== false || parentDescriptor.remoteExecutionAuthority !== false) throw new Error('PARENT_RUNTIME_TARGET_BINDING_STATE_DRIFT');
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check
