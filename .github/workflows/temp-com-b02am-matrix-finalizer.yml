name: TEMP COM-B02AM Matrix Finalizer

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02am-matrix-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: cca461c0c97a6197d33e44bb37745b216d8d0424
      CANDIDATE: 30e9bd6e76da6e008ef1a88a3148e2c2ee6b2a28
      TEMP_V1: c5924e56f5ac099477b65b7963bb098c7a2a1aa6
      BRANCH: com/com-001-baseline-audit
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      TEMP_PATH: .github/workflows/temp-com-b02am-matrix-finalizer.yml
    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze recovered candidate lineage and Matrix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TEMP_V1"
          test "$(git rev-parse HEAD^^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          actual="$(git diff --name-only "$CANDIDATE" HEAD | sort)"
          test "$actual" = "$TEMP_PATH"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate only canonical Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git hash-object config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Revalidate B02AM and repository governance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-implementation.js
          node --check scripts/test-com-b02am-repository-only-continuation-state-registry-storage-backend-implementation.js
          node scripts/test-com-b02am-repository-only-continuation-state-registry-storage-backend-implementation.js
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Commit derivatives and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- "$TEMP_PATH"
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          expected_cached="$(printf '%s\n' "$TEMP_PATH" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual_cached="$(git diff --cached --name-only | sort)"
          test "$actual_cached" = "$expected_cached"
          test -z "$(git diff --name-only)"
          git commit -m "docs(com): reconcile B02AM Domain Completion Matrix derivatives"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02am-repository-only-continuation-state-registry-storage-backend-implementation.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-implementation.js \
            config/com-b02am-repository-only-continuation-state-registry-storage-backend-implementation.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02am-repository-only-continuation-state-registry-storage-backend-implementation.js | sort)"
          actual_final="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual_final" = "$expected_final"
          ! git ls-tree -r --name-only HEAD | grep -Fx "$TEMP_PATH"

      - name: Fast-forward branch only if recovered temporary head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/$BRANCH
