name: TEMP UX-CSS-IMPORTANT-050 G5 Browser R2B
on:
  push:
    branches: [diag/ux-css-important-050-g5-browser-r2b]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {repeat: [1,2,3]}
    env:
      PARENT: 4b32b8b88018560402ae5d67a26c126d0e65d942
      TREE: d7f3580ac4406a0bcdd225cb405e882eb34dfa1c
      TARGET: assets/css/pages/home/mobile-hero-feed.css
      PARENT_BLOB: 54890bd4e2765364820796be64c62417d965ac65
      EXPECTED_BLOB: f7ffa8ead445a69ebdc8f801c46d70c852c041ae
      EXPECTED_SHA256: 398c28bc6d56e1cc8c0aa4d154aa6212ef470b73b119b0c8d65c647f58f47365
      REPEAT: ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - name: Reconstruct exact G5 candidate
        shell: bash
        run: |
          set -euo pipefail
          DIAG_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$DIAG_HEAD" | awk '{print $2}')" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$TREE"
          test "$(git rev-parse "$PARENT:$TARGET")" = "$PARENT_BLOB"
          git checkout --detach "$PARENT" >/dev/null
          cp "$TARGET" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),path=require('path');
          const f=process.env.TARGET,p=fs.readFileSync(f,'utf8');
          if((p.match(/!important\b/gi)||[]).length!==63)throw Error('parent markers');
          const ords=Array.from({length:16},(_,i)=>i+2),set=new Set(ords);let n=0,r=0;
          const c=p.replace(/\s*!important\b/gi,m=>{n++;if(set.has(n)){r++;return ''}return m});
          if(n!==63||r!==16||(c.match(/!important\b/gi)||[]).length!==47)throw Error(`ordinal ${n}/${r}`);
          if(p.replace(/\s*!important\b/gi,'')!==c.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');
          if(!/\.featured-services\s+\.content-rail\s*\{[\s\S]*?overflow:\s*visible\s*!important\s*;/m.test(c))throw Error('G3 guard lost');
          const blob=cp.execFileSync('git',['hash-object','--stdin'],{input:c,encoding:'utf8'}).trim(),sha256=crypto.createHash('sha256').update(c).digest('hex'),bytes=Buffer.byteLength(c);
          if(blob!==process.env.EXPECTED_BLOB||sha256!==process.env.EXPECTED_SHA256||bytes!==36317)throw Error(`identity ${blob}/${sha256}/${bytes}`);
          fs.writeFileSync('/tmp/candidate.css',c);fs.writeFileSync(f,c);
          const css=[];(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,e.name);e.isDirectory()?walk(q):q.endsWith('.css')&&css.push(q)}})('assets/css');
          const global=css.reduce((s,q)=>s+(fs.readFileSync(q,'utf8').match(/!important\b/gi)||[]).length,0);if(global!==89)throw Error('global '+global);
          console.log('G5_BROWSER_IDENTITY='+JSON.stringify({result:'PASS',repeat:Number(process.env.REPEAT),blob,sha256,bytes,removedOrdinals:ords,preservedOrdinal:1,target:'63->47',global:'105->89',markerOnly:true}));
          NODE
          test "$(git diff --name-only "$PARENT" --)" = "$TARGET"
          git diff --check "$PARENT" -- "$TARGET"
          cp /tmp/parent.css "$TARGET"
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Canonical 12-state G5 A B
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true; cp /tmp/parent.css "$TARGET" 2>/dev/null || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{
            const f=process.env.TARGET,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/candidate.css','utf8');
            const widths=[359,379,380,381,390,430,560,561],filters=new Set([359,380,390,560]),states=[];for(const w of widths){states.push([w,'default']);if(filters.has(w))states.push([w,'filters'])}
            const H=b=>crypto.createHash('sha256').update(b).digest('hex');
            const tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
            const items=Array.from({length:8},(_,i)=>({id:'c50g5-'+i,serviceId:'c50g5-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'p'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro']}));
            const sels=['[data-more-filters-panel]','[data-more-filters-panel] .home-filter-panel__card','.home-filter-panel__dialog','.home-filter-panel__panel','.home-filter-panel__header','.home-filter-panel__content','.home-filter-panel__footer','.featured-services .content-rail','#featured-services-track'];
            const browser=await chromium.launch({headless:true});
            async function cap(w,state,phase){
              const c=await browser.newContext({viewport:{width:w,height:1050},reducedMotion:'reduce'}),p=await c.newPage(),errs=[];let loaded=false;
              p.on('pageerror',e=>errs.push(e.message));p.on('request',r=>{try{if(new URL(r.url()).pathname==='/'+f)loaded=true}catch{}});
              await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:4173/'))return r.continue();if(u.startsWith('https://images.pexels.com/'))return r.fulfill({status:200,contentType:'image/png',body:tiny});return r.abort()});
              await p.goto(`http://127.0.0.1:4173/index.html?c50g5=${process.env.REPEAT}-${phase}-${w}-${state}`,{waitUntil:'domcontentloaded',timeout:15000});
              await p.waitForLoadState('networkidle',{timeout:7000}).catch(()=>{});
              await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});
              await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');if(!a||!b)throw Error('grids');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(window.Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(window.Doke.publicServiceCard.create(x,{results:true})))},items);
              if(state==='filters'){
                await p.waitForFunction(()=>Boolean(window.DokeHomeFiltersApi?.open),null,{timeout:7000});
                await p.evaluate(()=>window.DokeHomeFiltersApi.open('tabs'));
                await p.waitForFunction(()=>{const x=document.querySelector('[data-more-filters-panel]');return document.body.classList.contains('home-filter-sheet-open')&&Boolean(x&&!x.hidden&&x.getAttribute('aria-hidden')!=='true')},null,{timeout:4000});
              }
              await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;}'});await p.waitForTimeout(150);
              const data=await p.evaluate(sels=>{const pick=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{hidden:e.hidden,aria:e.getAttribute('aria-hidden'),d:c.display,p:c.position,v:c.visibility,o:c.opacity,z:c.zIndex,w:c.width,h:c.height,minh:c.minHeight,maxh:c.maxHeight,maxw:c.maxWidth,m:c.margin,bd:c.border,br:c.borderRadius,bg:c.backgroundColor,bs:c.boxShadow,ov:c.overflow,ovx:c.overflowX,ovy:c.overflowY,r:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*100)/100),sw:e.scrollWidth,sh:e.scrollHeight,cw:e.clientWidth,ch:e.clientHeight}};return{body:document.body.className,root:document.documentElement.className,dw:document.documentElement.scrollWidth,dh:document.documentElement.scrollHeight,styles:sels.map(pick)}},sels);
              const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs,loaded};
            }
            fs.writeFileSync(f,P);const base={};for(const [w,s] of states)base[`${w}-${s}`]=await cap(w,s,'parent');
            fs.writeFileSync(f,C);let md=0,sd=0,ld=0,pe=0;const diffs=[];for(const [w,s] of states){const k=`${w}-${s}`,a=base[k],b=await cap(w,s,'candidate');pe+=a.errs.length+b.errs.length;if(JSON.stringify(a.data)!==JSON.stringify(b.data)){md++;diffs.push('meta:'+k)}if(a.png!==b.png){sd++;diffs.push('png:'+k)}if(a.loaded!==b.loaded){ld++;diffs.push('load:'+k)}}
            fs.writeFileSync(f,P);await browser.close();const result={result:!md&&!sd&&!ld&&!pe?'PASS':'FAIL',repeat:Number(process.env.REPEAT),states:states.length,filterStates:filters.size,metadataDiffs:md,screenshotDiffs:sd,loadDiffs:ld,pageErrors:pe,diffKeys:diffs};console.log('G5_BROWSER='+JSON.stringify(result));if(result.result!=='PASS')process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
