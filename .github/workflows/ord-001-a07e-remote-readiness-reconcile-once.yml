name: ORD-A07E Remote Readiness Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07e-remote-readiness-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07E remote replay readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['plan:ord-001-a07e-remote-concurrent-replay-canary:dry-run'] =
            'node scripts/plan-ord-001-a07e-remote-concurrent-replay-canary.js --dry-run';
          packageJson.scripts['plan:ord-001-a07e-remote-concurrent-replay-canary:check-env'] =
            'node scripts/plan-ord-001-a07e-remote-concurrent-replay-canary.js --check-env';
          packageJson.scripts['test:ord-001-a07e-remote-concurrent-replay-canary-readiness'] =
            'node scripts/test-ord-001-a07e-remote-concurrent-replay-canary-readiness.js';
          packageJson.scripts['audit:ord-001-a07e-remote-concurrent-replay-canary-readiness'] =
            'node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-readiness.js';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.39';
          matrix.updatedAt = '2026-07-30T23:00:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'config/ord-001-a07e-remote-concurrent-replay-canary-readiness.json',
            'scripts/plan-ord-001-a07e-remote-concurrent-replay-canary.js',
            'scripts/test-ord-001-a07e-remote-concurrent-replay-canary-readiness.js',
            'scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-readiness.js',
            'docs/ORD-001-A07E-REMOTE-CONCURRENT-REPLAY-CANARY-READINESS.md',
            'docs/validation/ORD-001-A07E-REMOTE-CONCURRENT-REPLAY-CANARY-READINESS.json',
            '.github/workflows/ord-001-a07e-remote-concurrent-replay-canary-readiness.yml'
          ]);
          appendUnique(ord.tests, [
            'plan:ord-001-a07e-remote-concurrent-replay-canary:dry-run',
            'test:ord-001-a07e-remote-concurrent-replay-canary-readiness',
            'audit:ord-001-a07e-remote-concurrent-replay-canary-readiness'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07E remote replay readiness freezes 32 concurrent staging requests sharing one issued-at and nonce, with exactly one HTTP 200 acceptance and 31 HTTP 409 replay rejections expected.',
            'The cleanup contract deletes only the accepted empty test worker run by returned runId and only the SHA-256 hash of the canary nonce, while preserving the preexisting test nonce row.',
            'Read-only staging inspection confirmed service_role can delete the nonce row but cannot delete worker runs, so future run cleanup requires narrowly conditioned privileged SQL.',
            'The readiness planner supports only dry-run and check-env, contains no network, SQL, deploy or cleanup execution capability, and rejects generic continuation.',
            'The remote replay canary remains unexecuted and requires the exact independent authorization phrase I_EXPLICITLY_AUTHORIZE_ORD_A07E_REMOTE_CONCURRENT_REPLAY_CANARY_ON_DOKE_STAGING.'
          ]);
          ord.nextActions = ord.nextActions.filter((action) =>
            !/prepare a separate exact-authorization and cleanup-safe gate for the remote concurrent replay canary/i.test(action)
          );
          appendUnique(ord.nextActions, [
            'Execute the cleanup-safe ORD-A07E remote concurrent replay canary on Doke staging only after the exact authorization phrase; generic continuation must not execute it.'
          ]);

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/test-ord-001-a07e-remote-concurrent-replay-canary-readiness.js
          node scripts/plan-ord-001-a07e-remote-concurrent-replay-canary.js --dry-run
          node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-readiness.js
          node scripts/audit-ord-001-a07e-concurrent-replay-canary.js
          node scripts/audit-ord-001-a07d-edge-function-staging-deploy-application.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07E remote replay readiness' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
