name: TEMP COM-B02AU Observable Final Certification Bridge

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02au-final-certification-bridge.yml'

permissions:
  contents: write

jobs:
  certify-final-tree:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINAL_HEAD: 4a733e2e46028e38488f73dd05124f7f7a0658d4
      FINAL_TREE: 7b970d4a617d52bd334b69a2d9a8678f23dac6a8
      PREDECESSOR_HEAD: 53137be9ad8fb833d00ecec8575500e226f9c3e7
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      B02AU_MODULE_BLOB: 36b552b00bf0b3dea8af24b35fec97c405ede480
      B02AU_CONFIG_BLOB: eac25a2b9821a611fbe0f49c123d4f34258476f9
      B02AU_TEST_BLOB: 1cab68cef1d30cbf22ec97d848fef9fc3af94ad7
      B02AU_WORKFLOW_BLOB: f35cada3b0b1ae172d723a3ff5ea2fa826d2a7b7
      B02AT_MODULE_BLOB: 5c0572ecca18cac3e33e4194fee48c7d3f289234
      B02AT_CONFIG_BLOB: aa2a54228c60950e81f721959bf6cc12d7afc995
      B02AR_INSTANCE_BLOB: 762b0c5ed4ffaee24f2375a780e6c1bea7fb65d9
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02au-final-certification-bridge.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary bridge head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze final B02AU tree and bridge-only lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$FINAL_HEAD"
          test "$(git rev-parse "$FINAL_HEAD^{tree}")" = "$FINAL_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git diff --name-only "$FINAL_HEAD" HEAD)" = "$TEMP_PATH"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-implementation.js \
            config/com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.js | sort)"
          actual_final="$(git diff --name-only "$PREDECESSOR_HEAD" "$FINAL_HEAD" | sort)"
          test "$actual_final" = "$expected_final"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-implementation.js)" = "$B02AU_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.json)" = "$B02AU_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.js)" = "$B02AU_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.yml)" = "$B02AU_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-contract.js)" = "$B02AT_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02at-repository-only-continuation-state-registry-storage-backend-entry-container-contract.json)" = "$B02AT_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance.js)" = "$B02AR_INSTANCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          ! git ls-tree -r --name-only "$FINAL_HEAD" | grep '^.github/workflows/temp-com-b02au-'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02AU final tree
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-implementation.js
          node --check scripts/test-com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.js
          node scripts/test-com-b02au-repository-only-continuation-state-registry-storage-backend-entry-container-implementation.js
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-implementation.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'storageBackendMaterialized[[:space:]]*:[[:space:]]*true|entryContainerMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Matrix governance and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" "$FINAL_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Self-remove bridge and preserve exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- "$TEMP_PATH"
          test "$(git write-tree)" = "$FINAL_TREE"
          git commit -m "ci(com): certify B02AU final tree [run ${GITHUB_RUN_ID}]"
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02au-'

      - name: Fast-forward branch only if bridge head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
