name: COM-B03C-R4S Baseline Counter Read and Cleanup Observability Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4s.js'
      - 'scripts/test-com-b03c-r4s-baseline-counter-read-cleanup-observability-readiness.js'
      - 'config/com-b03c-r4s-baseline-counter-read-cleanup-observability-readiness.json'
      - 'docs/validation/COM-B03C-R4S-BASELINE-COUNTER-READ-CLEANUP-OBSERVABILITY-READINESS.json'
      - '.github/workflows/com-b03c-r4s-baseline-counter-read-cleanup-observability-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

concurrency:
  group: com-b03c-r4s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4s.js
          node --check scripts/test-com-b03c-r4s-baseline-counter-read-cleanup-observability-readiness.js
      - name: R4S counter-read decomposition and cleanup observability readiness
        run: node scripts/test-com-b03c-r4s-baseline-counter-read-cleanup-observability-readiness.js
      - name: Historical R4C R4Q R4R boundaries unchanged
        shell: bash
        run: |
          PREDECESSOR=7940c8fc95e40577144ac3f80597f02d27f5334c
          test -z "$(git diff --name-only "$PREDECESSOR" "${{ github.event.pull_request.head.sha }}" -- \
            backend/modules/communities/community-realtime-private-auth-r4c.js \
            backend/modules/communities/community-realtime-private-auth-r4q.js \
            scripts/execute-com-b03c-r4q-single-use-phase-attributed-hosted-terminal-observation.js \
            docs/validation/COM-B03C-R4R-R4Q-PHASE-ATTRIBUTED-STAGING-EXECUTION-SUMMARY.json)"
      - name: Repository-only hard block
        shell: bash
        run: |
          test ! -e config/com-b03c-r4o-single-use-phase-attributed-hosted-terminal-observation-trigger.json
          set +e
          output="$(node - <<'NODE'
          const r4s = require('./backend/modules/communities/community-realtime-private-auth-r4s');
          try { r4s.assertRemoteExecutionBoundaryAbsent(); } catch (error) {
            console.log(error.code);
            process.exit(error.code === r4s.REMOTE_EXECUTION_BLOCK_CODE ? 2 : 1);
          }
          process.exit(1);
          NODE
          )"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R4S_REMOTE_EXECUTION_NOT_AUTHORIZED'
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
