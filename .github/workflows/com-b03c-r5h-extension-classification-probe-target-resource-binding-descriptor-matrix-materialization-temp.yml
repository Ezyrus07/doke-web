name: COM-B03C R5H Target Resource Binding Descriptor Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "b075641039c0c3dd01cd516213cffa17cc8823fb"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.json)" = "cba91836e751bbd3225fa8992551d7953869cf01"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.yml)" = "b50e389d567913fcf1dc398d79a6b3bf6a5f13d3"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed target resource descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.json)" = "cba91836e751bbd3225fa8992551d7953869cf01"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.yml)" = "b50e389d567913fcf1dc398d79a6b3bf6a5f13d3"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-environment-binding-boundary.json)" = "34d3d179090ccca8c51aaaf12a2ba1bb673ef495"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          node - <<'NODE'
          const descriptor = require('./config/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary.json');
          const binding = descriptor.targetResourceBindingDescriptor;
          if (descriptor.contractId !== 'com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-boundary-v1') throw new Error('DESCRIPTOR_CONTRACT_DRIFT');
          if (descriptor.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || descriptor.functionalCheckpoint.r5iCreated !== false || descriptor.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (binding.targetResourceBindingDescriptorDefined !== true || binding.targetResourceBindingDefined !== false || binding.targetResourceBound !== false || binding.transportBound !== false || binding.schemaOnly !== true) throw new Error('TARGET_RESOURCE_DESCRIPTOR_STATE_DRIFT');
          if (binding.requiredTargetEnvironmentStableIdentifier !== 'doke-web-staging' || binding.stableResourceIdentifier !== null || binding.targetEnvironmentStableIdentifier !== null || binding.resourceScopeFingerprint !== null || binding.bindingBoundaryHead !== null) throw new Error('CONCRETE_TARGET_RESOURCE_FORBIDDEN');
          if (!descriptor.upstreamBindingState.runtimeAdapter || descriptor.upstreamBindingState.runtimeAdapter.bound !== true) throw new Error('RUNTIME_ADAPTER_BINDING_DRIFT');
          if (!descriptor.upstreamBindingState.targetEnvironment || descriptor.upstreamBindingState.targetEnvironment.bound !== true || descriptor.upstreamBindingState.targetEnvironment.stableEnvironmentIdentifier !== 'doke-web-staging') throw new Error('TARGET_ENVIRONMENT_BINDING_DRIFT');
          for (const slot of descriptor.delegatedPortState) if (slot.bound !== false || slot.concreteValuePresent !== false) throw new Error(`DELEGATED_PORT_BOUND:${slot.slotId}`);
          const forbidden = ['targetResource','targetResourceStableIdentifier','targetResourceEnvironmentIdentifier','targetResourceScopeFingerprint','credentialProvider','credentialMaterial','syntheticIdentity','realtimeClientFactory','sanitizedEvidenceRecorder','cleanupVerifier','networkEndpoint','executionCommand','executionWorkflow','executionEntrypoint'];
          for (const key of forbidden) if (descriptor.concreteBindingState[key] !== null) throw new Error(`FORBIDDEN_CONCRETE_BINDING:${key}`);
          const g = descriptor.governance;
          if (g.runtimeAdapterBound !== true || g.targetEnvironmentBound !== true || g.targetResourceBindingDescriptorDefined !== true || g.targetResourceBound !== false || g.transportBound !== false || g.remoteExecutionAuthority !== false || g.networkAuthority !== false || g.stagingReadAuthority !== false || g.stagingMutationAuthority !== false || g.executionAttempted !== false) throw new Error('REMOTE_AUTHORITY_FORBIDDEN');
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-target-resource-binding-descriptor-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for target resource descriptor" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
