name: COM-B02AO Repository-Only Continuation State Registry Storage Backend Instance Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js'
      - 'config/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.json'
      - 'scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js'
      - '.github/workflows/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02AN predecessor and exact repository-only contract scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=b6e30ba09aaf0c9e16c011889ad8793ca087f0be
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse "$BASE^{tree}")" = "012597db6e429884ab88db8b946cda71003a43d3"
          git merge-base --is-ancestor "$BASE" HEAD

          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js \
            config/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.json \
            scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js | sort)"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js \
            config/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected_candidate" || test "$actual" = "$expected_final"
          ! printf '%s\n' "$actual" | grep '^supabase/migrations/'
          ! printf '%s\n' "$actual" | grep '^\.github/workflows/temp-'

          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-readiness.js)" = "029017fc386c9eb21b416a29a5f196ed8024de4c"
          test "$(git rev-parse HEAD:config/com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.json)" = "ef05c1fc16f6a9173384ed7e95d18b19603dae20"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Syntax and semantic B02AO instance contract conformance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js
          node --check scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js
          node scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js

      - name: Contract remains instance-free containerless operation-free and side-effect-free
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'storageBackendInstanceImplementationMaterialized[[:space:]]*:[[:space:]]*true|storageBackendInstanceMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'entryContainerMaterialized[[:space:]]*:[[:space:]]*true|operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true|rawStateSerialized[[:space:]]*:[[:space:]]*true|rawStateExported[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check b6e30ba09aaf0c9e16c011889ad8793ca087f0be HEAD
