name: COM-B03C R5D Hosted Boundary Matrix Reconciliation TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5d-hosted-boundary-matrix-reconciliation-temp.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only writer boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-hosted-boundary-matrix-reconciliation-temp.yml
          test "$(git rev-parse HEAD^)" = "8acd5d386be2d9d0d1f72518bb13362fb8498cd4"
          test "$(git rev-parse HEAD^^)" = "14a358b42f4550168c35e72b15622937ebc2c87e"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$workflow"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^^:backend/modules/communities/community-realtime-private-auth-r5d-hosted-execution.js)" = "0a3a3b9f4dcb9971352b08735a03d99aadc1c832"
          test "$(git rev-parse HEAD^^:config/com-b03c-r5d-corrected-terminal-observation-hosted-execution-boundary.json)" = "f97d41623f8351e4430ec69bdd215d75e4303f80"
          test "$(git rev-parse HEAD^^:.github/workflows/com-b03c-r5d-corrected-terminal-observation-hosted-execution.yml)" = "91ec3418dc211a290efe091789bf00c9292b388b"
          test ! -e config/com-b03c-r5d-single-use-corrected-terminal-observation-execution-authorization-consumption.json

      - name: Reconcile COM-B03 semantics to hosted execution boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (matrix.version !== '1.3.113') throw new Error('R5D_HOSTED_MATRIX_VERSION_DRIFT');
          const com = matrix.domains.find((domain) => domain.id === 'COM-001');
          if (!com) throw new Error('R5D_HOSTED_COM_DOMAIN_MISSING');
          if (
            com.maturity !== 3 ||
            com.userFacingAuthority !== 'hybrid' ||
            com.serverAuthority !== 'partial' ||
            com.stagingEvidence !== 'staging_canary' ||
            com.securityGate !== 'partial' ||
            com.productionGate !== 'blocked'
          ) throw new Error('R5D_HOSTED_COM_GATE_DRIFT');

          const blocker = com.blockers.find((item) => item.id === 'COM-B03');
          if (!blocker) throw new Error('R5D_HOSTED_COM_B03_MISSING');
          if (!blocker.description.includes('R5H certified it at head a06de307f580c6b787a4c233a342a28a751f3621')) {
            throw new Error('R5D_HOSTED_EXPECTED_R5H_BLOCKER_STATE_NOT_FOUND');
          }
          const actionIndex = com.nextActions.findIndex((item) =>
            item.startsWith('Preserve the R5H frozen trigger certification without promoting Presence')
          );
          if (actionIndex < 0) throw new Error('R5D_HOSTED_EXPECTED_R5H_NEXT_ACTION_NOT_FOUND');

          const paths = [
            'backend/modules/communities/community-realtime-private-auth-r5d-hosted-execution.js',
            'config/com-b03c-r5d-corrected-terminal-observation-hosted-execution-boundary.json',
            'scripts/test-com-b03c-r5d-corrected-terminal-observation-hosted-execution-boundary.js',
            'scripts/execute-com-b03c-r5d-corrected-terminal-observation-hosted-execution.js',
            'scripts/verify-com-b03c-r5d-corrected-terminal-observation-hosted-execution-report.js',
            'docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-HOSTED-EXECUTION-BOUNDARY.json',
            '.github/workflows/com-b03c-r5d-corrected-terminal-observation-hosted-execution.yml'
          ];
          for (const path of paths) if (!com.requiredPaths.includes(path)) com.requiredPaths.push(path);

          const evidence = 'COM-B03C now has a separate R5D hosted corrected-terminal-observation execution boundary repository-defined on head 14a358b42f4550168c35e72b15622937ebc2c87e. The boundary binds the frozen R5H trigger, R5F consumed receipt, certified R5D envelope and corrected R4Z bridge; it requires a future fresh exact-head single-use execution authorization plus a sole single-file execution-authorization receipt trigger. The boundary grants zero remote/staging authority now, the receipt remains absent, no corrected terminal observation staging execution occurred, and exactRootCauseProven=false / causalPromotionAllowed=false remain preserved.';
          if (!com.evidence.includes(evidence)) com.evidence.push(evidence);

          blocker.description = 'Authenticated community_posts Postgres Changes is proven in staging. R3L narrowed the private Presence authorization failure to evaluation involving realtime.messages.extension without proving the exact root cause. R5B and R5F authorization receipts are consumed and non-reusable; R5G certified trigger readiness; the R5D-bound single-use trigger was materialized and R5H certified it at head a06de307f580c6b787a4c233a342a28a751f3621. A separate R5D hosted corrected-terminal-observation execution boundary now exists repository-only and is bound to the frozen R5H trigger, certified R5D envelope and corrected R4Z bridge. The future single-file execution-authorization receipt remains absent, no corrected terminal observation staging execution has occurred, and all remote/staging/network/credential/Realtime authority remains false. exactRootCauseProven=false and causalPromotionAllowed=false. Private Typing/Broadcast remains unproven and channel_messages still lacks canonical remote authority. Any staging execution requires a fresh explicit single-use authorization bound to the exact certified hosted-boundary head before the sole receipt trigger may be materialized.';

          com.nextActions[actionIndex] = 'Preserve the R5H frozen trigger certification and the repository-only R5D hosted execution boundary without promoting Presence, Typing/Broadcast or channel_messages. Do not recreate R5H or the trigger and do not reuse R5B, R5F or trigger-creation authorizations. After exact hosted-boundary certification, wait for a fresh explicit single-use corrected-terminal-observation execution authorization bound to that certified head before materializing the sole single-file execution-authorization receipt; generic continuation is non-authorizing.';

          matrix.updatedAt = '2026-08-15T21:06:00-03:00';
          fs.writeFileSync(file, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE

      - name: Regenerate canonical Matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Repository governance validation
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Hosted-boundary semantic fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const matrix = require('./config/domain-completion-matrix.json');
          const com = matrix.domains.find((domain) => domain.id === 'COM-001');
          const blocker = com.blockers.find((item) => item.id === 'COM-B03');
          if (com.maturity !== 3 || com.productionGate !== 'blocked') throw new Error('R5D_HOSTED_PROMOTION_FORBIDDEN');
          if (!blocker.description.includes('separate R5D hosted corrected-terminal-observation execution boundary now exists repository-only')) throw new Error('R5D_HOSTED_MATRIX_BOUNDARY_MISSING');
          if (!blocker.description.includes('future single-file execution-authorization receipt remains absent')) throw new Error('R5D_HOSTED_MATRIX_RECEIPT_ABSENCE_MISSING');
          if (!blocker.description.includes('no corrected terminal observation staging execution has occurred')) throw new Error('R5D_HOSTED_MATRIX_EXECUTION_FALSE_REQUIRED');
          if (!blocker.description.includes('exactRootCauseProven=false') || !blocker.description.includes('causalPromotionAllowed=false')) throw new Error('R5D_HOSTED_MATRIX_CAUSAL_BLOCK_REQUIRED');
          if (!com.nextActions.some((item) => item.includes('fresh explicit single-use corrected-terminal-observation execution authorization bound to that certified head'))) throw new Error('R5D_HOSTED_MATRIX_NEXT_AUTH_REQUIRED');
          if (fs.existsSync('config/com-b03c-r5d-single-use-corrected-terminal-observation-execution-authorization-consumption.json')) throw new Error('R5D_HOSTED_EXECUTION_RECEIPT_MUST_REMAIN_ABSENT');
          NODE

      - name: Exact reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-hosted-boundary-matrix-reconciliation-temp.yml
          expected="$(printf '%s\n' "$workflow" config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only HEAD^ | sort)"
          test "$actual" = "$expected"

      - name: Publish reconciled source and generated derivatives
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-hosted-boundary-matrix-reconciliation-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git rm "$workflow"
          git diff --cached --check
          git commit -m 'docs(com): reconcile R5D hosted boundary matrix semantics'
          git push origin HEAD:com/com-001-baseline-audit
