    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/gov.log) 2>&1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE,ls=fs.readFileSync(f,'utf8').split('\n');const rows=new Map([[338,'    transform: var(--doke-interaction-lift-card);'],[339,'    box-shadow: none;'],[340,'    border-color: rgba(82, 137, 198, 0.22);'],[345,'    opacity: 0.98;'],[470,'    border-radius: var(--doke-mobile-card-radius, var(--radius-surface));'],[474,'    min-height: var(--doke-mobile-card-media, clamp(168px, 49vw, 206px));'],[476,'    padding: var(--doke-mobile-card-padding, 14px);'],[480,'    padding: var(--doke-mobile-card-padding, 14px);'],[481,'    gap: 10px;'],[482,'    grid-template-columns: minmax(0, 1fr) auto;']]);for(const [i,v] of rows)if((ls[i]||'').replace(/\r$/,'')!==v)throw Error(`row drift ${i+1}`);const out=ls.filter((_,i)=>!rows.has(i)).join('\n');fs.writeFileSync(f,out);const b=fs.readFileSync(f),h=crypto.createHash('sha256').update(b).digest('hex');if(h!==process.env.EXPECTED_SHA256||b.length!==+process.env.EXPECTED_BYTES)throw Error(`identity ${h}/${b.length}`);console.log(`IDENTITY PASS|sha256=${h}|bytes=${b.length}|parent=289/10|candidate=279/0`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
