name: Temporary AUTH-A12C Codemod

on:
  pull_request:
    branches: [MAIN, main, master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply controlled codemod
        run: node scripts/tmp-auth-a12c-codemod.js

      - name: Test cumulative local mutation retirement
        run: node tests/auth/test-auth-local-profile-mutation-retirement-runtime.js

      - name: Test professional authority retirement
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js

      - name: Audit identity authority
        run: node scripts/audit-identity-profile-contract.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Publish implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js scripts tests package.json .github/workflows/quality.yml docs
          git commit -m 'Retire local professional identity authority'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
