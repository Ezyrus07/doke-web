name: Temporary AUTH-A12C Codemod

on:
  push:
    branches:
      - 'auth/auth-001-baseline-audit'

permissions:
  contents: write

jobs:
  codemod:
    if: startsWith(github.event.head_commit.message, 'Run AUTH-A12C codemod')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply controlled codemod
        run: node scripts/tmp-auth-a12c-codemod.js

      - name: Validate patch
        run: |
          node tests/auth/test-auth-local-profile-mutation-retirement-runtime.js
          node tests/auth/test-auth-professional-authority-retirement-runtime.js
          node scripts/audit-identity-profile-contract.js
          git diff --check

      - name: Publish implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js scripts tests package.json .github/workflows/quality.yml docs
          git commit -m 'Retire local professional identity authority'
          git push origin HEAD:${{ github.ref_name }}
