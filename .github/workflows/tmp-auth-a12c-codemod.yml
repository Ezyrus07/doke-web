name: Temporary AUTH-A12C Codemod

on:
  pull_request:
    branches: [MAIN, main, master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply controlled codemod
        run: node scripts/tmp-auth-a12c-codemod.js

      - name: Test cumulative local mutation retirement
        run: node tests/auth/test-auth-local-profile-mutation-retirement-runtime.js

      - name: Test professional static retirement
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js static

      - name: Test professional fixture reads
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js users

      - name: Diagnose remote account role
        run: node scripts/tmp-auth-a12c-access-diagnostic.js remote

      - name: Diagnose role and document conflict
        run: node scripts/tmp-auth-a12c-access-diagnostic.js conflict

      - name: Diagnose missing provider boundary
        run: node scripts/tmp-auth-a12c-access-diagnostic.js provider

      - name: Diagnose read-only local fixture
        run: node scripts/tmp-auth-a12c-access-diagnostic.js local

      - name: Test professional server-role access
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js access

      - name: Test professional remote reviewer
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js reviewer

      - name: Audit identity authority
        run: node scripts/audit-identity-profile-contract.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Remove temporary execution files
        run: rm -f scripts/tmp-auth-a12c-codemod.js scripts/tmp-auth-a12c-access-diagnostic.js .github/workflows/tmp-auth-a12c-codemod.yml

      - name: Publish implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/js scripts tests package.json .github/workflows docs
          git commit -m 'Retire local professional identity authority'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
