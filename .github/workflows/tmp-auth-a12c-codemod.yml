name: Temporary AUTH-A12C Codemod

on:
  pull_request:
    branches: [MAIN, main, master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply controlled codemod
        run: |
          node scripts/tmp-auth-a12c-codemod.js
          node - <<'NODE'
          const fs = require('fs');

          const accessFile = 'assets/js/services/professional-access-service.js';
          let accessSource = fs.readFileSync(accessFile, 'utf8');
          const duplicate = "    });\n    });\n  }\n\n  function evaluate";
          if (!accessSource.includes(duplicate)) throw new Error('Expected nested resolveContext closure was not found.');
          accessSource = accessSource.replace(duplicate, "    });\n  }\n\n  function evaluate");
          fs.writeFileSync(accessFile, accessSource);

          const auditFile = 'scripts/audit-identity-profile-contract.js';
          let auditSource = fs.readFileSync(auditFile, 'utf8');
          const staleMarker = "'local completion inference is absent'";
          if (!auditSource.includes(staleMarker)) throw new Error('Stale onboarding audit marker was not found.');
          auditSource = auditSource.replace(staleMarker, "'completion is exclusively server-authoritative'");
          fs.writeFileSync(auditFile, auditSource);
          NODE

      - name: Test cumulative local mutation retirement
        run: node tests/auth/test-auth-local-profile-mutation-retirement-runtime.js

      - name: Test professional static retirement
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js static

      - name: Test professional fixture reads
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js users

      - name: Capture access diagnostic scenarios
        run: |
          node scripts/tmp-auth-a12c-access-diagnostic.js remote
          node scripts/tmp-auth-a12c-access-diagnostic.js conflict
          node scripts/tmp-auth-a12c-access-diagnostic.js provider
          node scripts/tmp-auth-a12c-access-diagnostic.js local

      - name: Upload access diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: tmp-auth-a12c-access-${{ github.sha }}
          path: reports/generated/tmp-auth-a12c-access-*.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate access diagnostic scenarios
        run: |
          node -e "for (const name of ['remote','conflict','provider','local']) { const report=require('./reports/generated/tmp-auth-a12c-access-'+name+'.json'); if (!report.ok) { console.error(report); process.exit(1); } }"

      - name: Test professional server-role access
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js access

      - name: Test professional remote reviewer
        run: node tests/auth/test-auth-professional-authority-retirement-runtime.js reviewer

      - name: Capture identity authority audit
        run: |
          mkdir -p reports/generated
          set +e
          node scripts/audit-identity-profile-contract.js > reports/generated/tmp-auth-a12c-identity-audit.log 2>&1
          status=$?
          echo "$status" > reports/generated/tmp-auth-a12c-identity-audit.status
          exit 0

      - name: Upload identity authority audit
        uses: actions/upload-artifact@v4
        with:
          name: tmp-auth-a12c-identity-audit-${{ github.sha }}
          path: reports/generated/tmp-auth-a12c-identity-audit.*
          if-no-files-found: error
          retention-days: 1

      - name: Validate identity authority audit
        run: |
          cat reports/generated/tmp-auth-a12c-identity-audit.log
          test "$(cat reports/generated/tmp-auth-a12c-identity-audit.status)" = '0'

      - name: Validate patch formatting
        run: git diff --check

      - name: Remove temporary execution files
        run: rm -f scripts/tmp-auth-a12c-codemod.js scripts/tmp-auth-a12c-access-diagnostic.js .github/workflows/tmp-auth-a12c-codemod.yml reports/generated/tmp-auth-a12c-*.json reports/generated/tmp-auth-a12c-identity-audit.*

      - name: Publish implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/js scripts tests package.json .github/workflows docs
          git commit -m 'Retire local professional identity authority'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
