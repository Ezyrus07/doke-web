name: TEMP UX-CSS-IMPORTANT-045 Service Card Hero Materialize R3b
on:
  push:
    branches: [diag/ux-css-important-045-service-card-hero-materialize-r3b]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 03350507015579bfc60e413f1b3dfa97f4371f68
      PARENT_TREE: fb684d8ec8e96cf1a2d0ada42f7415259e084650
      TARGET_FILE: assets/css/components/cards/service-card-home-hero-feed.css
      TARGET_BLOB: 5f1f57692ca30fdca1fc10c5f89418343f3c4d8d
      R1_BRANCH: diag/ux-css-important-045-service-card-hero-r1b
      R1_FILE: .diagnostics/ux-css-important-045-service-card-home-hero-feed-r1.json
      R1_BLOB: d9d9d7d90073028dfb87503b9085a118b0111fa1
      R2_BRANCH: diag/ux-css-important-045-service-card-hero-candidate-r2
      R2_FILE: .diagnostics/ux-css-important-045-service-card-home-hero-feed-candidate-r2.json
      R2_BLOB: b98a02839d3302fb0c3976f350b50ff40f6780dd
      CANDIDATE_BLOB: 01841edf1c93b35fd92a064e642c1353d9484130
      CANDIDATE_SHA256: 852f25e93997b9b0dbc1293d83c4a2e291a8437f246db5dd1c8caf51f79efe5f
      CANDIDATE_BYTES: '8130'
      OUTPUT_BRANCH: diag/ux-css-important-045-service-card-hero-materialize-r3b
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-045-service-card-hero-materialize-r3b.yml
      RESULT_FILE: .diagnostics/ux-css-important-045-service-card-home-hero-feed-materialize-r3b.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Freeze exact parent and certified receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_BLOB"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = 1
          test "$(git diff --name-only "$PARENT_SHA"...HEAD)" = "$WORKFLOW_FILE"
          git fetch --no-tags origin "refs/heads/$R1_BRANCH:refs/remotes/origin/$R1_BRANCH" "refs/heads/$R2_BRANCH:refs/remotes/origin/$R2_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R1_BRANCH:$R1_FILE")" = "$R1_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R2_BRANCH:$R2_FILE")" = "$R2_BLOB"
      - name: Reconstruct exact certified candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA" >/dev/null
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),path=require('path');
          const f=process.env.TARGET_FILE,parent=fs.readFileSync(f,'utf8');
          if((parent.match(/!important\b/gi)||[]).length!==62) throw Error('parent marker count');
          const candidate=parent.replace(/\s*!important\b/gi,'');
          if((candidate.match(/!important\b/gi)||[]).length!==0) throw Error('candidate marker count');
          fs.writeFileSync(f,candidate);
          const blob=cp.execFileSync('git',['hash-object',f],{encoding:'utf8'}).trim();
          const sha256=crypto.createHash('sha256').update(candidate).digest('hex');
          const bytes=Buffer.byteLength(candidate);
          if(blob!==process.env.CANDIDATE_BLOB) throw Error(`blob ${blob}`);
          if(sha256!==process.env.CANDIDATE_SHA256) throw Error(`sha256 ${sha256}`);
          if(bytes!==Number(process.env.CANDIDATE_BYTES)) throw Error(`bytes ${bytes}`);
          const css=[];function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&p.endsWith('.css'))css.push(p)}}walk('assets/css');
          const global=css.reduce((n,p)=>n+(fs.readFileSync(p,'utf8').match(/!important\b/gi)||[]).length,0);
          if(global!==169) throw Error(`global ${global}`);
          cp.execFileSync('git',['diff','--check',process.env.PARENT_SHA,'--',f],{stdio:'inherit'});
          fs.writeFileSync('/tmp/result.json',JSON.stringify({result:'PASS',checkpoint:'UX-CSS-IMPORTANT-045',parent:process.env.PARENT_SHA,parentTree:process.env.PARENT_TREE,target:f,parentBlob:process.env.TARGET_BLOB,candidateBlob:blob,candidateSha256:sha256,candidateBytes:bytes,importantBefore:62,importantAfter:0,parentGlobal:231,candidateGlobal:169,markerOnly:true,r1ReceiptBlob:process.env.R1_BLOB,r2ReceiptBlob:process.env.R2_BLOB,repositoryOnly:true},null,2)+'\n');
          NODE
          test "$(git diff --name-only "$PARENT_SHA" --)" = "$TARGET_FILE"
      - name: Publish materialized candidate and receipt only on diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          cp "$TARGET_FILE" /tmp/candidate.css
          git switch "$OUTPUT_BRANCH"
          cp /tmp/candidate.css "$TARGET_FILE"
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/result.json "$RESULT_FILE"
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "$TARGET_FILE" "$RESULT_FILE"
          git commit -m "diagnostic(ux-css-important-045): materialize certified service card candidate"
          git push origin "HEAD:$OUTPUT_BRANCH"
      - name: Verify materialized target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:$TARGET_FILE)" = "$CANDIDATE_BLOB"
          test "$(git diff --name-only "$PARENT_SHA"...HEAD | sort)" = "$(printf '%s\n%s\n' "$RESULT_FILE" "$TARGET_FILE" | sort)"
