name: Doke UX-CSS-DEBT-004 Residual Cluster

on:
  push:
    branches:
      - diag/ux-css-debt-004-residual-cluster

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5769b3888e612145df6a94fcc8238d5a9ca6ca7f
          fetch-depth: 0

      - name: Guard parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5769b3888e612145df6a94fcc8238d5a9ca6ca7f"
          git diff --quiet

      - name: Inventory structural CSS debt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const files = [
            'assets/css/pages/detalhe-anuncio.css',
            'assets/css/pages/comunidade-interna.css',
            'assets/css/pages/carteira.css',
            'assets/css/pages/notificacoes.css',
            'assets/css/pages/perfil-profissional.css',
            'assets/css/pages/perfil-profissional/sections.css',
            'assets/css/components/desktop/internal-page-polish.css',
            'assets/css/pages/pedidos/orders-command-center.css',
            'assets/css/pages/home/mobile-hero-feed.css'
          ];

          function analyze(file) {
            const text = fs.readFileSync(file, 'utf8');
            const lines = text.split(/\r?\n/);
            let depth = 0;
            let selectorParts = [];
            let selector = null;
            const blockStack = [];
            const declarations = [];
            const ruleBlockCounts = new Map();
            const declRe = /^\s*([\w-]+)\s*:\s*(.*?)\s*(!important)?\s*;\s*$/;

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              const trimmed = line.trim();
              const opens = (line.match(/\{/g) || []).length;
              const closes = (line.match(/\}/g) || []).length;

              if (!selector && trimmed && !trimmed.startsWith('/*') && !trimmed.startsWith('*') && trimmed !== '*/' && trimmed !== '}') {
                if (trimmed.startsWith('@') && line.includes('{')) {
                  blockStack.push({ type: 'at', header: trimmed.replace(/\{\s*$/, '').replace(/\s+/g, ' ').trim(), depthBefore: depth });
                } else if (!trimmed.startsWith('@') && !line.includes(';')) {
                  selectorParts.push(trimmed.replace(/\{\s*$/, '').trim());
                  if (line.includes('{')) {
                    selector = selectorParts.join(' ').replace(/\s+/g, ' ').trim();
                    selectorParts = [];
                    const context = blockStack.filter(x => x.type === 'at').map(x => x.header).join(' || ');
                    const key = `${context} >>> ${selector}`;
                    ruleBlockCounts.set(key, (ruleBlockCounts.get(key) || 0) + 1);
                    blockStack.push({ type: 'rule', selector, depthBefore: depth });
                  }
                }
              }

              if (selector) {
                const m = line.match(declRe);
                if (m) {
                  const context = blockStack.filter(x => x.type === 'at').map(x => x.header).join(' || ');
                  declarations.push({
                    lineIndex: i,
                    selector,
                    property: m[1],
                    important: Boolean(m[3]),
                    context
                  });
                }
              }

              depth += opens - closes;
              while (blockStack.length && depth <= blockStack[blockStack.length - 1].depthBefore) {
                const popped = blockStack.pop();
                if (popped.type === 'rule') selector = null;
              }
            }

            const lastStrong = new Map();
            const dead = [];
            for (let i = declarations.length - 1; i >= 0; i--) {
              const cur = declarations[i];
              const key = `${cur.context} >>> ${cur.selector} >>> ${cur.property}`;
              const later = lastStrong.get(key);
              if (later && (!cur.important || later.important)) dead.push(cur);
              if (!later || cur.important || !later.important) lastStrong.set(key, cur);
            }

            const affectedSelectors = new Set(dead.map(d => d.selector));
            const repeatedBlocks = [...ruleBlockCounts.values()].filter(v => v > 1).reduce((n, v) => n + v, 0);
            const repeatedKeys = [...ruleBlockCounts.values()].filter(v => v > 1).length;
            return {
              file,
              bytes: Buffer.byteLength(text),
              sha256: crypto.createHash('sha256').update(text).digest('hex'),
              important: (text.match(/!important/g) || []).length,
              declarations: declarations.length,
              repeatedRuleKeys: repeatedKeys,
              repeatedRuleBlocks: repeatedBlocks,
              superseded: dead.length,
              affectedSelectors: affectedSelectors.size,
              supersededPct: declarations.length ? +(dead.length * 100 / declarations.length).toFixed(2) : 0
            };
          }

          const rows = files.filter(fs.existsSync).map(analyze).sort((a,b) => b.superseded - a.superseded);
          console.log('UX-CSS-DEBT-004_RESIDUAL_CLUSTER_INVENTORY');
          console.log(JSON.stringify(rows, null, 2));
          console.log('RANKING');
          for (const r of rows) {
            console.log(`${r.superseded}\t${r.supersededPct}%\t${r.bytes}\t${r.important}\t${r.affectedSelectors}\t${r.file}`);
          }
          NODE

      - name: Confirm repository debt inventory
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
