name: COM-B02U Route-Handler Orchestration Surface Integration Matrix Materialization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=071899787035ad45b0733127423ea327af50bda9
          temp=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:config/com-b02u-command-handler-route-handler-orchestration-surface-integration.json)" = "f3c76888e3ccc9c8323097d76e138095e2906471"
          test "$(git rev-parse HEAD:scripts/test-com-b02u-command-handler-route-handler-orchestration-surface-integration.js)" = "f7b29c29fb486ba29f0b680709a10ea61b4f4aed"
          test "$(git rev-parse HEAD:.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration.yml)" = "96bbfd7d93cdb423e2d6fcdb7b070f1c38e73ec5"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-orchestration.js)" = "f094ddc01a3f05975794bafb925d64f146a51ea2"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-binding-surface.js)" = "0778690aaaf428247159a08eac83a38796888f41"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed B02U assertions
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/route-handlers.js
          ORCHESTRATION=backend/modules/communities/community-command-handler-repository-orchestration.js
          test "$(git rev-parse HEAD:$TARGET)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:$ORCHESTRATION)" = "f094ddc01a3f05975794bafb925d64f146a51ea2"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          node --check "$TARGET"
          node --check scripts/test-com-b02u-command-handler-route-handler-orchestration-surface-integration.js
          node scripts/test-com-b02u-command-handler-route-handler-orchestration-surface-integration.js
          grep -F "require('./community-command-handler-repository-orchestration')" "$TARGET"
          ! grep -F "require('./community-command-handler-repository-binding-surface')" "$TARGET"
          ! grep -E 'process\.env|Deno\.env|Bun\.env|createClient\(|fetch\(|https?://|SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY' "$ORCHESTRATION"
          ! grep -E '\.rpc\(' "$ORCHESTRATION"
          grep -F "repositoryOperationInvoked: false" "$ORCHESTRATION"
          grep -F "executableReferencesExposed: false" "$ORCHESTRATION"
          grep -F "runtimeActivated: false" "$ORCHESTRATION"
          ! git diff --name-only 9d5e8bf18910a771d3d64923266713c76c7ff8d4 HEAD | grep '^supabase/migrations/'

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02u-command-handler-route-handler-orchestration-surface-integration-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for B02U route-handler orchestration integration" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
