name: COM-B03C R5H Synthetic Identity Lifecycle Binding Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=5c28f512e68acb05530647680cb9b837dfd26412
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-synthetic-identity-lifecycle.js)" = "ebc2e17cc27721c14c06d068de7889d119953e5c"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.json)" = "9525ec59debc3f9595f6cdcda9e5bd3a79881ff3"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.yml)" = "1419c9b921a8bca843e41662333729f2a32e9521"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed synthetic identity lifecycle binding assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-synthetic-identity-lifecycle.js)" = "ebc2e17cc27721c14c06d068de7889d119953e5c"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.json)" = "9525ec59debc3f9595f6cdcda9e5bd3a79881ff3"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.yml)" = "1419c9b921a8bca843e41662333729f2a32e9521"
          node - <<'NODE'
          const b=require('./config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary.json');
          const m=require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-synthetic-identity-lifecycle.js');
          if(b.contractId!=='com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-boundary-v1')throw new Error('BOUNDARY_DRIFT');
          const x=b.syntheticIdentityLifecycleBinding;
          if(x.syntheticIdentityLifecycleBindingDefined!==true||x.identityLifecycleBound!==true||x.bindingKind!=='repository_owned_immutable_inert_module'||x.localRepositoryBindingOnly!==true)throw new Error('LOCAL_BINDING_DRIFT');
          if(x.lifecycleModuleBlob!=='ebc2e17cc27721c14c06d068de7889d119953e5c'||x.bindingBoundaryHead!==null||x.bindingBoundaryHeadResolvedByCertifierSubjectHead!==true)throw new Error('BINDING_PROVENANCE_DRIFT');
          for(const k of ['syntheticIdentityReference','syntheticIdentityMaterial','syntheticIdentity'])if(x[k]!==null)throw new Error(`IDENTITY_VALUE_FORBIDDEN:${k}`);
          for(const k of ['identityReferenceResolutionImplemented','identityProvisioningImplemented','identityDeletionImplemented','identityMaterializationImplemented','credentialReadImplemented','transportBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','authIdentityLifecycleAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority'])if(x[k]!==false)throw new Error(`BOUNDARY_AUTHORITY_DRIFT:${k}`);
          const d=m.repositoryDescriptor();
          for(const k of ['identityProvisioningImplemented','identityDeletionImplemented','identityMaterializationImplemented','credentialReadImplemented','remoteDependencyLoadImplemented','transportBound','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority','executionAttempted','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'])if(d[k]!==false)throw new Error(`MODULE_AUTHORITY_DRIFT:${k}`);
          const g=b.governance;
          for(const k of ['identityProvisioningImplemented','identityDeletionImplemented','identityMaterializationImplemented','credentialReadImplemented','transportBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority'])if(g[k]!==false)throw new Error(`GOVERNANCE_DRIFT:${k}`);
          const c=b.causalState;
          for(const k of ['exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'])if(c[k]!==false)throw new Error(`CAUSAL_DRIFT:${k}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for synthetic identity lifecycle binding" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
