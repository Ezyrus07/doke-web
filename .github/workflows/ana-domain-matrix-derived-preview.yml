name: ANA Domain Matrix Derived Preview

on:
  pull_request:
    paths:
      - 'config/domain-completion-matrix.json'
      - 'scripts/audit-domain-completion-matrix.js'
      - '.github/workflows/ana-domain-matrix-derived-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-derived-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate deterministic derived files
        run: node scripts/audit-domain-completion-matrix.js --write
      - name: Verify generated matrix
        run: node scripts/audit-domain-completion-matrix.js
      - name: Commit canonical derived matrix on PR branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md; then
            echo "Derived matrix already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git commit -m "docs(matrix): refresh ANA derived matrix"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload derived matrix
        uses: actions/upload-artifact@v4
        with:
          name: ana-domain-completion-derived
          if-no-files-found: error
          retention-days: 1
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
