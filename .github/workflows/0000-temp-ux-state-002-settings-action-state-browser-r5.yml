name: TEMP UX-STATE-002 Settings Action-State Browser R5

on:
  push:
    branches:
      - diag/ux-state-002-settings-action-state-browser-r5

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PARENT: 0f38e88e8c0ae027d8b2eaab40ee5ad6cf90c9b2
      PARENT_TREE: ee8f2c8bd6b22af3c5905f01785f47dee1caf52c
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-state-002-settings-action-state-browser-r5.yml
      HTML_BLOB: a7b129933aa3b901f820151d9a56e1949a775aff
      HTML_SHA256: c2b62ef5319692a4c129df394639ceba0703a1b7075abdd3013c00a79f6a4183
      HTML_BYTES: '63715'
      JS_BLOB: e350a601f1f0b5e2764cca95e7cdbed1caa3bff7
      JS_SHA256: 2243a14ec9bcb111cda86e1279a269e1d7fc033fb21d20fc752c1da7b338598d
      JS_BYTES: '36309'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify lineage and reconstruct frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          H="$(git rev-parse HEAD)"
          test "$(git rev-parse "$H^")" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git diff --name-only "$PARENT" "$H")" = "$WORKFLOW_PATH"
          git checkout --detach "$PARENT" >/dev/null
          git worktree add --detach /tmp/ux-state-002-parent "$PARENT" >/dev/null
          git worktree add --detach /tmp/ux-state-002-candidate "$PARENT" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          def one(text, before, after, label):
              n = text.count(before)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 got {n}')
              return text.replace(before, after, 1)

          hp = Path('/tmp/ux-state-002-candidate/configuracoes.html')
          h = hp.read_text()
          h = one(h,
              'data-settings-save-panel="payments" data-action-state="idle" aria-busy="false"',
              'data-settings-save-panel="payments" data-action-state="idle" data-action-loading-label="Salvando pagamentos" aria-busy="false"',
              'payments loading label')
          h = one(h,
              'data-settings-save-panel="support" data-action-state="idle" aria-busy="false"',
              'data-settings-save-panel="support" data-action-state="idle" data-action-loading-label="Salvando suporte" aria-busy="false"',
              'support loading label')
          hp.write_text(h)

          jp = Path('/tmp/ux-state-002-candidate/assets/js/pages/configuracoes.js')
          s = jp.read_text()
          helper = (
              "  const pendingActionLabels = new WeakMap();\n\n"
              "  const setButtonSubmittingFeedback = (button) => {\n"
              "    if (!button || !button.hasAttribute('data-action-state')) return false;\n"
              "    if (!pendingActionLabels.has(button)) {\n"
              "      pendingActionLabels.set(button, button.getAttribute('aria-label'));\n"
              "    }\n"
              "    const loadingLabel = button.dataset.actionLoadingLabel || '';\n"
              "    const setActionState = window.Doke?.stateContracts?.setActionState;\n"
              "    if (typeof setActionState === 'function' && setActionState(button, 'submitting', loadingLabel)) {\n"
              "      return true;\n"
              "    }\n"
              "    button.setAttribute('data-action-state', 'submitting');\n"
              "    button.setAttribute('aria-busy', 'true');\n"
              "    button.disabled = true;\n"
              "    if (loadingLabel) button.setAttribute('aria-label', loadingLabel);\n"
              "    return true;\n"
              "  };\n\n"
              "  const restoreButtonPendingLabel = (button) => {\n"
              "    if (!button || !pendingActionLabels.has(button)) return;\n"
              "    const originalAriaLabel = pendingActionLabels.get(button);\n"
              "    pendingActionLabels.delete(button);\n"
              "    if (originalAriaLabel === null) button.removeAttribute('aria-label');\n"
              "    else button.setAttribute('aria-label', originalAriaLabel);\n"
              "  };\n\n"
          )
          s = one(s,
              '  const setButtonSavedFeedback = (button) => {\n',
              helper + '  const setButtonSavedFeedback = (button) => {\n',
              'helper insertion')
          s = one(s,
              "  const setButtonSavedFeedback = (button) => {\n    if (!button) return;\n",
              "  const setButtonSavedFeedback = (button) => {\n    if (!button) return;\n    restoreButtonPendingLabel(button);\n",
              'success label restore')
          s = one(s,
              "    if (profileError) profileError.textContent = '';\n    button.disabled = true;\n    button.setAttribute('aria-busy', 'true');\n    try {\n",
              "    if (profileError) profileError.textContent = '';\n    setButtonSubmittingFeedback(button);\n    try {\n",
              'profile submitting')
          s = one(s,
              "    } catch (error) {\n      if (profileError) profileError.textContent = error?.message || 'Não foi possível salvar o perfil.';\n      button.setAttribute('data-action-state', 'error');\n",
              "    } catch (error) {\n      if (profileError) profileError.textContent = error?.message || 'Não foi possível salvar o perfil.';\n      restoreButtonPendingLabel(button);\n      button.setAttribute('data-action-state', 'error');\n",
              'profile error restore')
          s = one(s,
              "      if (!panelName) return;\n      button.disabled = true;\n      button.setAttribute('aria-busy', 'true');\n      try {\n",
              "      if (!panelName) return;\n      if (button.hasAttribute('data-action-state')) {\n        setButtonSubmittingFeedback(button);\n      } else {\n        button.disabled = true;\n        button.setAttribute('aria-busy', 'true');\n      }\n      try {\n",
              'panel submitting')
          s = one(s,
              "      } catch (error) {\n        button.setAttribute('data-action-state', 'error');\n        button.setAttribute('aria-busy', 'false');\n",
              "      } catch (error) {\n        restoreButtonPendingLabel(button);\n        button.setAttribute('data-action-state', 'error');\n        button.setAttribute('aria-busy', 'false');\n",
              'panel error restore')
          jp.write_text(s)
          PY
          test "$(git -C /tmp/ux-state-002-candidate hash-object configuracoes.html)" = "$HTML_BLOB"
          test "$(sha256sum /tmp/ux-state-002-candidate/configuracoes.html | awk '{print $1}')" = "$HTML_SHA256"
          test "$(wc -c < /tmp/ux-state-002-candidate/configuracoes.html | tr -d ' ')" = "$HTML_BYTES"
          test "$(git -C /tmp/ux-state-002-candidate hash-object assets/js/pages/configuracoes.js)" = "$JS_BLOB"
          test "$(sha256sum /tmp/ux-state-002-candidate/assets/js/pages/configuracoes.js | awk '{print $1}')" = "$JS_SHA256"
          test "$(wc -c < /tmp/ux-state-002-candidate/assets/js/pages/configuracoes.js | tr -d ' ')" = "$JS_BYTES"
          mapfile -t changed < <(git -C /tmp/ux-state-002-candidate diff --name-only)
          test "${#changed[@]}" -eq 2
          test "$(git -C /tmp/ux-state-002-candidate diff --numstat assets/js/pages/configuracoes.js | awk '{print $1" "$2}')" = "37 4"
          test "$(git -C /tmp/ux-state-002-candidate diff --numstat configuracoes.html | awk '{print $1" "$2}')" = "2 2"
          git -C /tmp/ux-state-002-candidate diff --check
          node --check /tmp/ux-state-002-candidate/assets/js/pages/configuracoes.js
          echo CANDIDATE_IDENTITY=PASS

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts >/dev/null
          node node_modules/@playwright/test/cli.js install --with-deps chromium >/dev/null 2>&1

      - name: Browser parent candidate lifecycle A B
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/ux-state-002-parent && python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ux-state-002-parent-http.log 2>&1 & echo $! >/tmp/ux-state-002-parent.pid)
          (cd /tmp/ux-state-002-candidate && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/ux-state-002-candidate-http.log 2>&1 & echo $! >/tmp/ux-state-002-candidate.pid)
          trap 'kill $(cat /tmp/ux-state-002-parent.pid 2>/dev/null) $(cat /tmp/ux-state-002-candidate.pid 2>/dev/null) 2>/dev/null || true' EXIT
          for p in 4173 4174; do
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$p/configuracoes.html" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            test "$ok" = 1
          done
          cat >/tmp/ux-state-002-browser-r5.cjs <<'NODE'
          const crypto = require('crypto');
          const { chromium } = require(process.cwd() + '/node_modules/@playwright/test');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const tiny = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64');
          const fixture = {
            provider: 'mock', remember: true, accountStatus: 'active', sessionStatus: 'active',
            issuedAt: '2026-08-27T12:00:00.000Z',
            user: { id: 'ux-state-002-browser', name: 'Browser Fixture', email: 'ux-state-002@example.test', handle: 'browser.fixture', role: 'client', type: 'client', accountStatus: 'active' }
          };
          const actions = {
            profile: { tab: 'profile', button: '[data-settings-save-profile]', kind: 'profile', loading: 'Salvando alterações' },
            payments: { tab: 'payments', button: '[data-settings-save-panel="payments"]', kind: 'settings', loading: 'Salvando pagamentos' },
            support: { tab: 'support', button: '[data-settings-save-panel="support"]', kind: 'settings', loading: 'Salvando suporte' }
          };
          const round = value => Math.round(value * 100) / 100;
          const normalizeRect = rect => ({ x: round(rect.x), y: round(rect.y), width: round(rect.width), height: round(rect.height) });

          async function snapshot(page, selector) {
            const meta = await page.locator(selector).evaluate(el => {
              const r = el.getBoundingClientRect();
              const cs = getComputedStyle(el);
              return {
                state: el.getAttribute('data-action-state'),
                busy: el.getAttribute('aria-busy'),
                disabled: Boolean(el.disabled),
                ariaLabel: el.getAttribute('aria-label'),
                loadingLabel: el.getAttribute('data-action-loading-label'),
                text: el.textContent.trim(),
                rect: { x: r.x, y: r.y, width: r.width, height: r.height },
                style: {
                  display: cs.display, visibility: cs.visibility, opacity: cs.opacity,
                  color: cs.color, backgroundColor: cs.backgroundColor,
                  borderColor: cs.borderColor, cursor: cs.cursor,
                  fontSize: cs.fontSize, fontWeight: cs.fontWeight
                }
              };
            });
            meta.rect = normalizeRect(meta.rect);
            const png = await page.locator(selector).screenshot({ animations: 'disabled' });
            meta.screenshot = { sha256: sha(png), bytes: png.length };
            return meta;
          }

          async function waitAuthorized(page) {
            await page.waitForFunction(() => {
              const html = document.documentElement;
              const profile = document.querySelector('[data-settings-save-profile]');
              const ready = [...document.querySelectorAll('[data-settings-hydration-ready]')].some(el => !el.hidden);
              return html.dataset.authRouteDecision === 'authorized' &&
                ready && profile && profile.getClientRects().length > 0 &&
                getComputedStyle(profile).visibility !== 'hidden';
            }, null, { timeout: 20000 });
          }

          async function scenario(browser, label, port, key) {
            const cfg = actions[key];
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1, colorScheme: 'light', reducedMotion: 'reduce' });
            await context.addInitScript(({ session }) => {
              try { localStorage.setItem('doke.auth.session.v1', JSON.stringify(session)); } catch {}
            }, { session: fixture });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error.message || error)));
            await page.route('**/*', route => {
              const url = route.request().url();
              if (url.startsWith(`http://127.0.0.1:${port}/`)) return route.continue();
              if (/\.(?:png|jpe?g|webp|gif|svg)(?:\?|$)/i.test(url)) return route.fulfill({ status: 200, contentType: 'image/png', body: tiny });
              return route.abort();
            });
            const response = await page.goto(`http://127.0.0.1:${port}/configuracoes.html?uxstate002r5=${label}-${key}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            if (!response?.ok()) throw new Error(`${label}/${key} navigation ${response?.status()}`);
            await waitAuthorized(page);
            await page.addStyleTag({ content: '*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}' });
            if (cfg.tab !== 'profile') {
              await page.locator(`[data-settings-tab="${cfg.tab}"]`).click();
              await page.waitForFunction(tab => {
                const panel = document.querySelector(`[data-settings-panel="${tab}"]`);
                return panel && !panel.hidden && panel.classList.contains('is-active');
              }, cfg.tab, { timeout: 5000 });
              await page.locator(cfg.button).waitFor({ state: 'visible', timeout: 5000 });
            }
            await page.evaluate(() => {
              const original = window.Doke?.services?.profile;
              if (!original) throw new Error('profile service unavailable');
              const control = { seq: 0, pending: null };
              const make = (kind, payload) => new Promise((resolve, reject) => {
                control.seq += 1;
                control.pending = { kind, payload, resolve, reject, seq: control.seq };
              });
              window.__uxState002Control = control;
              window.Doke.services.profile = Object.freeze(Object.assign({}, original, {
                updateCurrentProfile: payload => make('profile', payload),
                updateCurrentSettings: payload => make('settings', payload)
              }));
            });

            const initial = await snapshot(page, cfg.button);
            if (initial.state !== 'idle' || initial.busy !== 'false' || initial.disabled) throw new Error(`${label}/${key} initial ${JSON.stringify(initial)}`);
            const initialAria = initial.ariaLabel;

            await page.locator(cfg.button).click();
            await page.waitForFunction(kind => window.__uxState002Control?.pending?.kind === kind, cfg.kind, { timeout: 5000 });
            await page.waitForTimeout(80);
            const pending = await snapshot(page, cfg.button);
            const expectedPending = label === 'candidate' ? 'submitting' : 'idle';
            if (pending.state !== expectedPending || pending.busy !== 'true' || !pending.disabled) throw new Error(`${label}/${key} pending ${JSON.stringify(pending)}`);
            if (pending.text !== initial.text) throw new Error(`${label}/${key} visible text changed while pending`);
            if (label === 'candidate') {
              if (pending.loadingLabel !== cfg.loading || pending.ariaLabel !== cfg.loading) throw new Error(`${label}/${key} pending label ${JSON.stringify(pending)}`);
            } else if (pending.ariaLabel !== initialAria) {
              throw new Error(`${label}/${key} parent aria-label changed`);
            }

            await page.evaluate(() => window.__uxState002Control.pending.reject(new Error('controlled failure')));
            await page.waitForFunction(sel => document.querySelector(sel)?.getAttribute('data-action-state') === 'error', cfg.button, { timeout: 5000 });
            const error = await snapshot(page, cfg.button);
            if (error.busy !== 'false' || error.disabled || error.ariaLabel !== initialAria) throw new Error(`${label}/${key} error recovery ${JSON.stringify(error)}`);

            const firstSeq = await page.evaluate(() => window.__uxState002Control.seq);
            await page.locator(cfg.button).click();
            await page.waitForFunction(({ kind, seq }) => window.__uxState002Control?.pending?.kind === kind && window.__uxState002Control.pending.seq > seq, { kind: cfg.kind, seq: firstSeq }, { timeout: 5000 });
            await page.waitForTimeout(80);
            const retryPending = await snapshot(page, cfg.button);
            if (retryPending.state !== expectedPending || retryPending.busy !== 'true' || !retryPending.disabled) throw new Error(`${label}/${key} retry pending ${JSON.stringify(retryPending)}`);
            if (label === 'candidate' && retryPending.ariaLabel !== cfg.loading) throw new Error(`${label}/${key} retry pending label`);

            const successValue = cfg.kind === 'profile'
              ? { name: 'Browser Fixture', handle: 'browser.fixture', avatarUrl: '', coverUrl: '', city: '', state: '', bio: '', interests: [] }
              : {};
            await page.evaluate(value => window.__uxState002Control.pending.resolve(value), successValue);
            await page.waitForFunction(sel => document.querySelector(sel)?.getAttribute('data-action-state') === 'success', cfg.button, { timeout: 5000 });
            const success = await snapshot(page, cfg.button);
            if (success.busy !== 'false' || success.disabled || success.ariaLabel !== initialAria || success.text !== 'Salvo') throw new Error(`${label}/${key} success ${JSON.stringify(success)}`);

            await page.waitForFunction(({ sel, text }) => {
              const el = document.querySelector(sel);
              return el?.getAttribute('data-action-state') === 'idle' && el.textContent.trim() === text;
            }, { sel: cfg.button, text: initial.text }, { timeout: 4000 });
            const recovered = await snapshot(page, cfg.button);
            if (recovered.busy !== 'false' || recovered.disabled || recovered.ariaLabel !== initialAria) throw new Error(`${label}/${key} recovered ${JSON.stringify(recovered)}`);

            const auth = await page.evaluate(() => ({
              routeDecision: document.documentElement.dataset.authRouteDecision || null,
              authGuard: document.documentElement.dataset.authGuard || null,
              lifecycleGuard: window.DokeNavigationLifecycle?.getSnapshot?.()?.guard?.state || null
            }));
            await context.close();
            return { initial, pending, error, retryPending, success, recovered, auth, pageErrors };
          }

          function assertParity(key, parent, candidate) {
            for (const phase of ['initial', 'pending', 'error', 'retryPending', 'success', 'recovered']) {
              const p = parent[phase], c = candidate[phase];
              if (JSON.stringify(p.rect) !== JSON.stringify(c.rect)) throw new Error(`${key}/${phase} geometry delta ${JSON.stringify({ parent: p.rect, candidate: c.rect })}`);
              if (JSON.stringify(p.style) !== JSON.stringify(c.style)) throw new Error(`${key}/${phase} computed style delta ${JSON.stringify({ parent: p.style, candidate: c.style })}`);
              if (p.text !== c.text) throw new Error(`${key}/${phase} visible text delta`);
              if (p.screenshot.sha256 !== c.screenshot.sha256 || p.screenshot.bytes !== c.screenshot.bytes) throw new Error(`${key}/${phase} screenshot delta ${JSON.stringify({ parent: p.screenshot, candidate: c.screenshot })}`);
            }
            if (parent.pageErrors.length || candidate.pageErrors.length) throw new Error(`${key} page errors ${JSON.stringify({ parent: parent.pageErrors, candidate: candidate.pageErrors })}`);
            if (parent.auth.routeDecision !== 'authorized' || candidate.auth.routeDecision !== 'authorized') throw new Error(`${key} auth route decision drift`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const results = { parent: {}, candidate: {} };
              for (const key of Object.keys(actions)) results.parent[key] = await scenario(browser, 'parent', 4173, key);
              for (const key of Object.keys(actions)) results.candidate[key] = await scenario(browser, 'candidate', 4174, key);
              for (const key of Object.keys(actions)) assertParity(key, results.parent[key], results.candidate[key]);
              const compact = {};
              for (const key of Object.keys(actions)) compact[key] = {
                parentPending: results.parent[key].pending.state,
                candidatePending: results.candidate[key].pending.state,
                candidatePendingBusy: results.candidate[key].pending.busy,
                candidatePendingDisabled: results.candidate[key].pending.disabled,
                candidatePendingAria: results.candidate[key].pending.ariaLabel,
                errorState: results.candidate[key].error.state,
                retryPendingState: results.candidate[key].retryPending.state,
                successState: results.candidate[key].success.state,
                recoveredState: results.candidate[key].recovered.state,
                authRouteDecision: results.candidate[key].auth.routeDecision,
                visualParity: true,
                geometryParity: true,
                pageErrors: 0
              };
              console.log('UX_STATE_002_BROWSER_R5=' + JSON.stringify({
                result: 'PASS', viewport: '1440x1000', actions: compact,
                parentDefectReproduced: true,
                candidateCanonicalPending: true,
                errorRetrySuccessRecovery: true,
                visualParity: true,
                geometryParity: true,
                criteriaRelaxed: 0,
                repositoryOnly: true,
                productMutation: false
              }));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error.stack || error); process.exit(1); });
          NODE
          node /tmp/ux-state-002-browser-r5.cjs

      - name: Cleanup exact parent
        if: always()
        shell: bash
        run: |
          kill $(cat /tmp/ux-state-002-parent.pid 2>/dev/null) $(cat /tmp/ux-state-002-candidate.pid 2>/dev/null) 2>/dev/null || true
          git worktree remove --force /tmp/ux-state-002-parent 2>/dev/null || true
          git worktree remove --force /tmp/ux-state-002-candidate 2>/dev/null || true
          git reset --hard "$PARENT" >/dev/null 2>&1 || true
          git clean -fd >/dev/null 2>&1 || true
          test "$(git rev-parse HEAD)" = "$PARENT"
          test -z "$(git status --porcelain)"
