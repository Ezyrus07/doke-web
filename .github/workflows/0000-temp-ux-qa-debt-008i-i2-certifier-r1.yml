name: TEMP UX-QA-DEBT-008I I2 Certifier R1

on:
  push:
    branches:
      - diag/ux-qa-debt-008i-i2-certifier-r1

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout TEMP branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze I2 and detach exact candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='d6bcea66da5c3e08293f6daf309d86ab6b911505'
          CANDIDATE_TREE='3e332f7782964e3b2d16d6e87aecf4471654cc1e'
          PARENT='d40f365ef60feea53541e8a56946f491d9387192'
          TEMP_PATH='.github/workflows/0000-temp-ux-qa-debt-008i-i2-certifier-r1.yml'

          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(git show -s --format=%T "$CANDIDATE")" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$CANDIDATE"..HEAD)" = "$TEMP_PATH"

          candidate_changed="$(git diff --name-only "$PARENT".."$CANDIDATE")"
          expected='tests/e2e/stable-shell-transition-matrix.spec.js'
          test "$candidate_changed" = "$expected"

          git checkout --detach "$CANDIDATE"
          git reset --hard "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run minimum governance gates
        shell: bash
        run: |
          set -euo pipefail
          PARENT='d40f365ef60feea53541e8a56946f491d9387192'
          CANDIDATE='d6bcea66da5c3e08293f6daf309d86ab6b911505'

          node --check tests/e2e/stable-shell-scroll-contract.spec.js
          node --check tests/e2e/stable-shell-transition-matrix.spec.js
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PARENT".."$CANDIDATE"

          changed="$(git diff --name-only "$PARENT".."$CANDIDATE")"
          expected='tests/e2e/stable-shell-transition-matrix.spec.js'
          test "$changed" = "$expected"
          git diff --quiet "$PARENT".."$CANDIDATE" -- docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --quiet "$PARENT".."$CANDIDATE" -- docs/validation/domain-completion-staging-snapshot.json
          git diff --quiet "$PARENT".."$CANDIDATE" -- tests/visual reports/baseline

          echo 'Runner status after governance audits:'
          git status --porcelain || true

          git diff --quiet HEAD -- \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            docs/validation/domain-completion-staging-snapshot.json \
            tests/e2e/stable-shell-scroll-contract.spec.js \
            tests/e2e/stable-shell-transition-matrix.spec.js \
            tests/visual reports/baseline

          git reset --hard "$CANDIDATE"
          git clean -fd -- reports/generated test-results || true
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"

      - name: Run exact I2 owner suites
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test \
            tests/e2e/stable-shell-scroll-contract.spec.js \
            tests/e2e/stable-shell-transition-matrix.spec.js

      - name: Prove candidate remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE='d6bcea66da5c3e08293f6daf309d86ab6b911505'
          CANDIDATE_TREE='3e332f7782964e3b2d16d6e87aecf4471654cc1e'
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"

      - name: Upload owner-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-debt-008i-i2-certifier-${{ github.sha }}
          path: |
            reports/generated/playwright-html/
            reports/generated/playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
