name: Doke UX-QA-DEBT-002 Visible Actions Candidate R4

on:
  push:
    branches:
      - diag/ux-qa-debt-002-pedidos-visible-actions-candidate-r4

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 12e55ca25db38971c5ab5de12845839ca1a684a7
    steps:
      - name: Checkout exact-parent diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard QA-only branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = ".github/workflows/diag-ux-qa-debt-002-visible-actions-candidate-r4.yml"
          git diff --check "${PARENT_SHA}"...HEAD

      - name: Write deterministic zero-specificity transformer
        shell: bash
        run: |
          cat > /tmp/apply-qa2-candidate.py <<'PY'
          import re, os
          from pathlib import Path

          specs = [
              (Path('assets/css/layout/header.css'),
               re.compile(r'(body:is\(\.orders-page-shell, \.notifications-page-shell\)\.has-global-header\s*\n\s*\.app-header\.home-side-meta \.page-header-context__action)(\s*\{\s*box-sizing:\s*border-box;\s*display:\s*inline-flex;)', re.MULTILINE),
               r'\1:where(:not([hidden]))\2',
               'desktop contextual action display authority'),
              (Path('assets/css/pages/pedidos/orders-command-center.css'),
               re.compile(r'(body\.orders-page-shell \.app-header--orders \.orders-page-actions \.page-header-context__action)(\s*\{\s*display:\s*inline-flex;)', re.MULTILINE),
               r'\1:where(:not([hidden]))\2',
               'Pedidos 561-1180 orders-page-actions display authority'),
              (Path('assets/css/pages/pedidos/orders-command-center.css'),
               re.compile(r'(body\.orders-page-shell \.app-header--orders \.page-header-context__action)(\s*\{\s*display:\s*inline-flex;)', re.MULTILINE),
               r'\1:where(:not([hidden]))\2',
               'Pedidos contextual action display authority'),
              (Path('assets/css/pages/pedidos/tablet-rail-contract.css'),
               re.compile(r'(body\.orders-page-shell\.has-global-header \.app-header\.app-header--orders \.orders-page-actions \.page-header-context__action)(\s*\{\s*display:\s*inline-flex;)', re.MULTILINE),
               r'\1:where(:not([hidden]))\2',
               'Pedidos portrait tablet action display authority'),
          ]
          dry=os.environ.get('DRY_RUN')=='1'
          cache={}
          for path,pattern,replacement,label in specs:
              text=cache.get(path,path.read_text())
              updated,count=pattern.subn(replacement,text,count=1)
              print(f'{label}: matches={count}')
              if count != 1:
                  raise SystemExit(f'unexpected match count for {label}: {count}')
              cache[path]=updated
          for path,updated in cache.items():
              if updated == path.read_text():
                  raise SystemExit(f'no delta for {path}')
              if not dry:
                  path.write_text(updated)
          PY
          DRY_RUN=1 python3 /tmp/apply-qa2-candidate.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and Chromium
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Write role runtime comparator
        shell: bash
        run: |
          cat > /tmp/agenda-runtime.js <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2];
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:['ignore','pipe','pipe'],env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const viewports=[{name:'1366x768',width:1366,height:768},{name:'1280x802',width:1280,height:802},{name:'820x1180',width:820,height:1180},{name:'608x926',width:608,height:926},{name:'390x844',width:390,height:844}];
          async function main(){
            await sleep(700);
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const result={};
            for(const role of ['client','professional']){
              result[role]={};
              for(const vp of viewports){
                const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
                const page=await context.newPage();
                await page.addInitScript(({role})=>{
                  const user={id:role==='client'?'client_qa2':'professional_qa2',role,name:'QA'};
                  const orders=[{id:'order_qa2',clientId:role==='client'?user.id:'client_other',professionalId:role==='professional'?user.id:'professional_other',providerName:'Studio QA',serviceTitle:'Serviço QA',status:'pending',viewerRole:role,createdAt:'2026-06-28T10:00:00.000Z'}];
                  localStorage.setItem('doke.auth.session.v1',JSON.stringify({user}));
                  localStorage.setItem('doke.orders.local.v1',JSON.stringify(orders));
                  localStorage.setItem('doke.orders',JSON.stringify(orders));
                },{role});
                await page.goto('http://127.0.0.1:5500/pedidos.html',{waitUntil:'domcontentloaded'});
                await page.waitForFunction(expected=>document.body.dataset.ordersAudience===expected,role,{timeout:10000});
                await page.waitForFunction(()=>document.querySelectorAll('[data-orders-agenda-toggle]').length===2,{timeout:10000});
                result[role][vp.name]=await page.evaluate(()=>{
                  const snap=selector=>[...document.querySelectorAll(selector)].map((node,index)=>{const cs=getComputedStyle(node),r=node.getBoundingClientRect();return {index,hidden:Boolean(node.hidden),ariaHidden:node.getAttribute('aria-hidden'),display:cs.display,visibility:cs.visibility,rect:{x:+r.x.toFixed(3),y:+r.y.toFixed(3),width:+r.width.toFixed(3),height:+r.height.toFixed(3)},color:cs.color,backgroundColor:cs.backgroundColor,borderTopWidth:cs.borderTopWidth,borderTopColor:cs.borderTopColor,borderRadius:cs.borderTopLeftRadius,padding:cs.padding,gap:cs.gap,flex:cs.flex,className:node.className};});
                  return {agenda:snap('[data-orders-agenda-toggle]'),filters:snap('[data-orders-filter-toggle]'),selects:snap('[data-orders-select-toggle]')};
                });
                await context.close();
              }
            }
            await browser.close();
            fs.writeFileSync(out,JSON.stringify(result,null,2));
          }
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Capture exact parent baseline and defect
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/agenda-runtime.js /tmp/parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/parent-responsive.json
          set +e
          node node_modules/@playwright/test/cli.js test tests/e2e/pedidos-role-composition.spec.js > /tmp/parent-e2e.log 2>&1
          code=$?
          set -e
          cat /tmp/parent-e2e.log
          test "$code" = "1"
          grep -F "node.hidden && getComputedStyle(node).display === 'none'" /tmp/parent-e2e.log

      - name: Apply exact candidate in workspace only
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply-qa2-candidate.py
          expected=$'assets/css/layout/header.css\nassets/css/pages/pedidos/orders-command-center.css\nassets/css/pages/pedidos/tablet-rail-contract.css'
          test "$(git diff --name-only)" = "$expected"
          test -z "$(git diff --name-only -- '*.html' '*.js')"
          test "$(git diff --shortstat | sed 's/^ *//')" = "3 files changed, 4 insertions(+), 4 deletions(-)"
          git diff --check
          git diff --stat
          git diff -- assets/css/layout/header.css assets/css/pages/pedidos/orders-command-center.css assets/css/pages/pedidos/tablet-rail-contract.css

      - name: Require existing Pedidos E2E green
        shell: bash
        run: node node_modules/@playwright/test/cli.js test tests/e2e/pedidos-role-composition.spec.js

      - name: Preserve responsive contract without rebaseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -F 'Checks: 893' /tmp/responsive.log
          grep -F 'Failures: 0' /tmp/responsive.log
          grep -F 'Skips: 277' /tmp/responsive.log

      - name: Prove hidden closure and visible runtime parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/agenda-runtime.js /tmp/candidate-runtime.json
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const parent=JSON.parse(fs.readFileSync('/tmp/parent-runtime.json','utf8'));
          const cand=JSON.parse(fs.readFileSync('/tmp/candidate-runtime.json','utf8'));
          for(const vp of Object.keys(parent.professional)) assert.deepStrictEqual(cand.professional[vp],parent.professional[vp],`professional drift ${vp}`);
          for(const vp of Object.keys(parent.client)){
            assert.deepStrictEqual(cand.client[vp].filters,parent.client[vp].filters,`client filter drift ${vp}`);
            assert.deepStrictEqual(cand.client[vp].selects,parent.client[vp].selects,`client select drift ${vp}`);
            assert.strictEqual(cand.client[vp].agenda.length,2,`agenda count ${vp}`);
            for(const node of cand.client[vp].agenda){
              assert.strictEqual(node.hidden,true,`hidden ${vp} #${node.index}`);
              assert.strictEqual(node.ariaHidden,'true',`aria ${vp} #${node.index}`);
              assert.strictEqual(node.display,'none',`display ${vp} #${node.index}`);
              assert.strictEqual(node.rect.width,0,`width ${vp} #${node.index}`);
              assert.strictEqual(node.rect.height,0,`height ${vp} #${node.index}`);
            }
          }
          console.log('Zero-specificity visible-action runtime proof: PASS');
          NODE

      - name: Run structural governance suite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/css-conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          echo '--- final inventory ---'
          grep -E 'CSS files scanned|Definitions|Conflicting class/property pairs' /tmp/css-conflicts.log || true
          grep -E 'active legacy/remediation css|active legacy/remediation js|high risk active css' /tmp/legacy.log || true

      - name: Emit exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/css/layout/header.css assets/css/pages/pedidos/orders-command-center.css assets/css/pages/pedidos/tablet-rail-contract.css; do
            echo "FILE=$file"
            echo "PARENT_SHA256=$(git show "${PARENT_SHA}:$file" | sha256sum | awk '{print $1}')"
            echo "CANDIDATE_SHA256=$(sha256sum "$file" | awk '{print $1}')"
            git diff --numstat "${PARENT_SHA}" -- "$file"
          done
          git diff --shortstat "${PARENT_SHA}" -- assets/css/layout/header.css assets/css/pages/pedidos/orders-command-center.css assets/css/pages/pedidos/tablet-rail-contract.css
