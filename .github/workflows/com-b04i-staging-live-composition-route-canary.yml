name: COM-B04I Attempt 2 Staging Live Composition Route Canary

# One-shot activation chain:
# readiness head baa531e6 -> authorization trigger 541081fa -> registered workflow 51724c58 -> this armed commit.
on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/com-b04i-staging-live-composition-route-canary.yml'

permissions:
  contents: read

concurrency:
  group: com-b04i-attempt-2-staging-live-composition-route-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout registered one-shot activation
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind exact consumed COM-B04I attempt-2 trigger
        shell: bash
        env:
          COM_B04I_ATTEMPT_2_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_COM_B04I_ATTEMPT_2_STAGING_LIVE_COMPOSITION_ACTIVATION_AND_ROLLBACK_ONLY_ROUTE_CANARY
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "51724c58d5a6fca360d1b5ced2c5b41e452b8055"
          workflow='.github/workflows/com-b04i-staging-live-composition-route-canary.yml'
          status="$(git diff-tree --no-commit-id --name-status -r HEAD -- "$workflow")"
          test "$status" = $'M\t'"$workflow"
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/com-b04i-attempt-2-staging-live-composition-route-canary.json', 'utf8'));
          const phrase = 'I_EXPLICITLY_AUTHORIZE_COM_B04I_ATTEMPT_2_STAGING_LIVE_COMPOSITION_ACTIVATION_AND_ROLLBACK_ONLY_ROUTE_CANARY';
          if (process.env.COM_B04I_ATTEMPT_2_AUTHORIZATION !== phrase) throw new Error('COM_B04I_ATTEMPT_2_ENV_AUTHORIZATION_MISMATCH');
          if (config.contractId !== 'com-b04i-attempt-2-staging-live-composition-route-canary-v1') throw new Error('COM_B04I_ATTEMPT_2_CONTRACT_MISMATCH');
          if (config.status !== 'authorization_consumed_execution_pending') throw new Error('COM_B04I_ATTEMPT_2_NOT_PENDING');
          if (config.authorization?.phrase !== phrase || config.authorization?.received !== true || config.authorization?.consumed !== true) throw new Error('COM_B04I_ATTEMPT_2_AUTHORIZATION_STATE_INVALID');
          if (config.authorization?.singleUse !== true || config.authorization?.reusableAfterFailure !== false) throw new Error('COM_B04I_ATTEMPT_2_SINGLE_USE_STATE_INVALID');
          if (config.authorization?.sourceHead !== 'baa531e6672fbd752038e7f9b35d436aa6efa486') throw new Error('COM_B04I_ATTEMPT_2_SOURCE_HEAD_MISMATCH');
          if (config.execution?.attempted !== true || config.execution?.executorStarted !== false || config.execution?.workflowRerunAllowed !== false) throw new Error('COM_B04I_ATTEMPT_2_EXECUTION_ENVELOPE_INVALID');
          if (config.target?.environment !== 'staging' || config.target?.projectId !== 'zwkczgewzbsorbrjuzpb' || config.target?.pullRequest !== 61 || config.target?.branch !== 'com/com-001-baseline-audit') throw new Error('COM_B04I_ATTEMPT_2_TARGET_INVALID');
          if (config.canary?.processLocalActivation !== true || config.canary?.publicTrafficEnabled !== false || config.canary?.syntheticOnly !== true || config.canary?.rollbackOnly !== true || config.canary?.outerIsolation !== 'serializable') throw new Error('COM_B04I_ATTEMPT_2_SCOPE_INVALID');
          if (config.synthetic?.initialEvidenceReference !== 'opaque:com-b04i:staging-live-route-canary') throw new Error('COM_B04I_ATTEMPT_2_OPAQUE_REFERENCE_INVALID');
          const allowlist = ['com_moderation_load_case_v1', 'com_moderation_commit_case_command_v1'];
          if (JSON.stringify(config.canary?.rpcAllowlist) !== JSON.stringify(allowlist)) throw new Error('COM_B04I_ATTEMPT_2_RPC_ALLOWLIST_INVALID');
          NODE

  canary:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      COM_B04I_ATTEMPT_2_AUTHORIZATION: I_EXPLICITLY_AUTHORIZE_COM_B04I_ATTEMPT_2_STAGING_LIVE_COMPOSITION_ACTIVATION_AND_ROLLBACK_ONLY_ROUTE_CANARY
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      COM_B04I_ATTEMPT_2_REPORT_PATH: reports/generated/COM-B04I-ATTEMPT-2-STAGING-LIVE-COMPOSITION-ROUTE-CANARY.json
    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/runtime/staging/community-moderation-live-route-canary.js
          node --check backend/modules/communities/route-handlers.js
          node --check scripts/test-com-b04i-staging-live-composition-route-canary.js
          node --check scripts/audit-com-b04i-attempt-2-staging-live-composition-route-canary.js
          node --check scripts/execute-com-b04i-attempt-2-staging-live-composition-route-canary.js
      - name: COM-B04I attempt-2 local conformance
        run: node scripts/test-com-b04i-staging-live-composition-route-canary.js
      - name: COM-B04I attempt-2 execution audit
        run: node scripts/audit-com-b04i-attempt-2-staging-live-composition-route-canary.js
      - name: COM-B04H regression
        run: |
          node scripts/test-com-b04h-live-composition-activation-readiness.js
          node scripts/audit-com-b04h-live-composition-activation-readiness.js
      - name: COM-B04G regression
        run: |
          node scripts/test-com-b04g-route-runtime-wiring-execution.js
          node scripts/audit-com-b04g-route-runtime-wiring-execution.js
      - name: Runtime security checks
        shell: bash
        run: |
          ! grep -R -E 'process\.env|SUPABASE_(SERVICE_ROLE_KEY|ACCESS_TOKEN|DB_PASSWORD)' backend/runtime/staging/community-moderation-live-route-canary.js
          grep -F 'COM_B04G_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          grep -F "Object.freeze(['disabled', 'local_test_double'])" backend/modules/communities/community-moderation-runtime-composition.js
          ! grep -F 'staging_authenticated_server_runtime' backend/modules/communities/community-moderation-runtime-composition.js
      - name: Diff hygiene
        run: git diff --check
      - name: Execute authenticated attempt-2 process-local route canary with rollback
        run: node scripts/execute-com-b04i-attempt-2-staging-live-composition-route-canary.js
      - name: Upload sanitized COM-B04I attempt-2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com-b04i-attempt-2-staging-live-composition-route-canary-${{ github.run_id }}
          path: reports/generated/COM-B04I-ATTEMPT-2-STAGING-LIVE-COMPOSITION-ROUTE-CANARY.json
          if-no-files-found: error
          retention-days: 14
