name: TEMP COM-B02AO Final Certification Bridge

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02ao-final-certification-bridge.yml'

permissions:
  contents: write

jobs:
  certify-final-tree:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: b6e30ba09aaf0c9e16c011889ad8793ca087f0be
      FINAL_HEAD: 303b30f36264c3f9a4619c03a6be6fec7cde8504
      FINAL_TREE: d1471f8f228c2f75a55838e993b28bf0a703f272
      BRANCH: com/com-001-baseline-audit
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      TEMP_PATH: .github/workflows/temp-com-b02ao-final-certification-bridge.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary certification head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze final B02AO tree and bridge-only lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$FINAL_HEAD"
          test "$(git rev-parse "$FINAL_HEAD^{tree}")" = "$FINAL_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          actual="$(git diff --name-only "$FINAL_HEAD" HEAD | sort)"
          test "$actual" = "$TEMP_PATH"

          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js \
            config/com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js | sort)"
          actual_final="$(git diff --name-only "$BASE" "$FINAL_HEAD" | sort)"
          test "$actual_final" = "$expected_final"
          ! git ls-tree -r --name-only "$FINAL_HEAD" | grep -Fx "$TEMP_PATH"

          test "$(git rev-parse "$FINAL_HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-readiness.js")" = "029017fc386c9eb21b416a29a5f196ed8024de4c"
          test "$(git rev-parse "$FINAL_HEAD:config/com-b02an-repository-only-continuation-state-registry-storage-backend-instance-readiness.json")" = "ef05c1fc16f6a9173384ed7e95d18b19603dae20"
          test "$(git rev-parse "$FINAL_HEAD:backend/shared/http/route-registry.js")" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse "$FINAL_HEAD:backend/shared/http/module-route-loader.js")" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse "$FINAL_HEAD:backend/modules/communities/route-handlers.js")" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse "$FINAL_HEAD:config/domain-completion-matrix.json")" = "$MATRIX_SOURCE_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02AO certification
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js
          node --check scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js
          node scripts/test-com-b02ao-repository-only-continuation-state-registry-storage-backend-instance-contract.js

          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-contract.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'storageBackendInstanceImplementationMaterialized[[:space:]]*:[[:space:]]*true|storageBackendInstanceMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'entryContainerMaterialized[[:space:]]*:[[:space:]]*true|operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true|rawStateSerialized[[:space:]]*:[[:space:]]*true|rawStateExported[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Domain Completion Matrix Agent Governance and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$BASE" "$FINAL_HEAD"

      - name: Self-remove bridge and preserve exact certified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- "$TEMP_PATH"
          test "$(git write-tree)" = "$FINAL_TREE"
          git commit -m "ci(com): certify B02AO repository-only final tree"
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep -Fx "$TEMP_PATH"

      - name: Fast-forward branch only if bridge head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
