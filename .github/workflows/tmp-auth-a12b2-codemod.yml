# Temporary PR-triggered codemod. The implementation commit deletes this file.
name: TEMP AUTH-A12B.2 Controlled Codemod

on:
  pull_request:
    branches:
      - MAIN
      - main
      - master

permissions:
  contents: write

concurrency:
  group: tmp-auth-a12b2-codemod-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'auth/auth-001-baseline-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout AUTH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate codemod syntax
        run: node --check scripts/tmp-auth-a12b2-codemod.js

      - name: Apply controlled codemod
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/generated
          node scripts/tmp-auth-a12b2-codemod.js 2>&1 | tee reports/generated/auth-a12b2-codemod.log

      - name: Upload codemod failure detail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-a12b2-codemod-failure-${{ github.sha }}
          path: reports/generated/auth-a12b2-codemod.log
          if-no-files-found: error
          retention-days: 3

      - name: Run AUTH-A12B.2 targeted gates
        run: |
          node scripts/audit-identity-profile-contract.js
          node tests/auth/test-auth-local-profile-mutation-retirement-runtime.js
          node scripts/test-profile-write-contract.js
          node scripts/test-auth-username-onboarding-contract.js
          git diff --check

      - name: Remove temporary execution surfaces
        run: |
          rm scripts/tmp-auth-a12b2-codemod.js
          rm .github/workflows/tmp-auth-a12b2-codemod.yml
          rm -f reports/generated/auth-a12b2-codemod.log

      - name: Publish controlled implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --short)"
          git commit -m 'Implement AUTH-A12B.2 local profile mutation retirement'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
