# Second push intentionally triggers the already-registered temporary workflow.
name: TEMP AUTH-A12B.2 Controlled Codemod

on:
  push:
    branches:
      - 'auth/auth-001-baseline-audit'

permissions:
  contents: write

concurrency:
  group: tmp-auth-a12b2-codemod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Run AUTH-A12B.2 controlled codemod')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout AUTH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate codemod syntax
        run: node --check scripts/tmp-auth-a12b2-codemod.js

      - name: Apply controlled codemod
        run: node scripts/tmp-auth-a12b2-codemod.js

      - name: Run AUTH-A12B.2 targeted gates
        run: |
          node scripts/audit-identity-profile-contract.js
          node tests/auth/test-auth-local-profile-mutation-retirement-runtime.js
          node scripts/test-profile-write-contract.js
          node scripts/test-auth-username-onboarding-contract.js
          git diff --check

      - name: Remove temporary execution surfaces
        run: |
          rm scripts/tmp-auth-a12b2-codemod.js
          rm .github/workflows/tmp-auth-a12b2-codemod.yml

      - name: Publish controlled implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --short)"
          git commit -m 'Implement AUTH-A12B.2 local profile mutation retirement'
          git push origin HEAD:${{ github.ref_name }}
