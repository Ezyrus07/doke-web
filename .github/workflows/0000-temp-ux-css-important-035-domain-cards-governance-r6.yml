name: UX-CSS-IMPORTANT-035 Domain Cards Static Governance R6
on:
  push:
    branches:
      - diag/ux-css-important-035-domain-cards-governance-r6
permissions:
  contents: write
jobs:
  governance035r6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      PARENT_TREE: 714d5b26a67edec2fbcb4f87ebae8c1197304269
      TARGET_FILE: assets/css/components/domain/doke-domain-cards.css
      TARGET_PARENT_BLOB: 42df66dea7658af5859a1092e6148d9394472e2a
      CANDIDATE_SHA256: d99be25b5e0c364890bec8bc0aa28226b227d9b4bd45131fe193c440328aebed
      CANDIDATE_BLOB: f7b0f8c5c4efcd7c0f821b18f514b788eef4cdfa
      LEDGER: diag/ux-css-important-post-010-ranking-r1
      REACH_FILE: .diagnostics/ux-css-important-035-domain-cards-reach-r1.txt
      REACH_BLOB: ccda73b1e5f18f7edc8f5f1cd388b067b16b7957
      SOURCE_FILE: .diagnostics/ux-css-important-035-domain-cards-source-r1.txt
      SOURCE_BLOB: 7daea433bfd43984ac9b6d7062ede5feeced9138
      R2_FILE: .diagnostics/ux-css-important-035-domain-cards-browser-r2.txt
      R2_BLOB: 6a2696943f73c92af38a9805383592bd57394e7c
      R3_FILE: .diagnostics/ux-css-important-035-domain-cards-delta-r3.txt
      R3_BLOB: 253232f6a0c1b895b92da11a65a277a4f6207c86
      R5_FILE: .diagnostics/ux-css-important-035-domain-cards-reconcile-r5.txt
      R5_BLOB: e4f87f2ecc690e0bb58f6986497d5e83d298a5d3
      R3_BRANCH: diag/ux-css-important-035-domain-cards-delta-r3
      R3_WORKFLOW: .github/workflows/ux-css-important-035-domain-cards-delta-r3.yml
      R3_WORKFLOW_BLOB: a415b866496f87d92b0f0adbaa2c6886234cc8c4
      R5_BRANCH: diag/ux-css-important-035-domain-cards-reconcile-r5
      R5_WORKFLOW: .github/workflows/0000-temp-ux-css-important-035-domain-cards-reconcile-r5.yml
      R5_WORKFLOW_BLOB: 2ea496f9a44c580434cf9b9b40ef9e450290c49a
      RESULT_FILE: .diagnostics/ux-css-important-035-domain-cards-governance-r6.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Freeze lineage and reconcile exact browser evidence
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/r6.log) 2>&1
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_PARENT_BLOB"
          git fetch origin "refs/heads/$LEDGER:refs/remotes/origin/$LEDGER" "refs/heads/$R3_BRANCH:refs/remotes/origin/$R3_BRANCH" "refs/heads/$R5_BRANCH:refs/remotes/origin/$R5_BRANCH" >/dev/null
          for spec in "$REACH_FILE:$REACH_BLOB" "$SOURCE_FILE:$SOURCE_BLOB" "$R2_FILE:$R2_BLOB" "$R3_FILE:$R3_BLOB" "$R5_FILE:$R5_BLOB"; do f="${spec%%:*}"; b="${spec##*:}"; test "$(git rev-parse "refs/remotes/origin/$LEDGER:$f")" = "$b"; done
          test "$(git rev-parse "refs/remotes/origin/$R3_BRANCH:$R3_WORKFLOW")" = "$R3_WORKFLOW_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R5_BRANCH:$R5_WORKFLOW")" = "$R5_WORKFLOW_BLOB"
          git show "refs/remotes/origin/$LEDGER:$REACH_FILE" >/tmp/reach.txt
          git show "refs/remotes/origin/$LEDGER:$SOURCE_FILE" >/tmp/source.txt
          git show "refs/remotes/origin/$LEDGER:$R2_FILE" >/tmp/r2.txt
          git show "refs/remotes/origin/$LEDGER:$R3_FILE" >/tmp/r3.txt
          git show "refs/remotes/origin/$LEDGER:$R5_FILE" >/tmp/r5.txt
          git show "refs/remotes/origin/$R3_BRANCH:$R3_WORKFLOW" >/tmp/r3.yml
          git show "refs/remotes/origin/$R5_BRANCH:$R5_WORKFLOW" >/tmp/r5.yml
          grep -q '^RESULT=PASS$' /tmp/reach.txt
          grep -Fq 'active=1|wholeFileDormant=0' /tmp/reach.txt
          grep -q '^RESULT=PASS$' /tmp/source.txt
          grep -Fq 'SUMMARY|pages=9|domainHtmlRefs=80|domainJsProducerRefs=21|legacyHtmlRefs=0|legacyJsProducerRefs=29' /tmp/source.txt
          grep -q '^RUN_ID=32724005852$' /tmp/r2.txt
          grep -Fq 'SHOT DIFF|state=resultados.html@760' /tmp/r2.txt
          grep -Fq 'metadataDiffs=0|screenshotDiffs=1|stableStates=36/36|pageErrors=0' /tmp/r2.txt
          grep -q '^RESULT=FAIL$' /tmp/r2.txt
          grep -q '^RUN_ID=32724815997$' /tmp/r3.txt
          grep -Fq "DELTA SUMMARY|nodes=977/977|styleOrRectDiffs=0|screenshotDiff=0|loads=6/6|pageErrors=0|candidateSha256=$CANDIDATE_SHA256" /tmp/r3.txt
          grep -q '^RESULT=PASS$' /tmp/r3.txt
          grep -q '^PROBE_RESULT=PASS$' /tmp/r3.txt
          grep -q '^RUN_ID=32725291044$' /tmp/r5.txt
          grep -Fq 'PHASE|label=parent|states=36|metadataStable=36|screenshotStable=36|pageErrors=0|targetStylesheetLoads=100|domainNodes=136' /tmp/r5.txt
          grep -Fq 'PHASE|label=candidate|states=36|metadataStable=36|screenshotStable=36|pageErrors=0|targetStylesheetLoads=100|domainNodes=136' /tmp/r5.txt
          grep -Fq 'RECONCILE RESULT|states=36|metadataDiffs=0|screenshotDiffs=0|deepNodeDiffs=977|metadataStable=36/36|screenshotStable=36/36|pageErrors=0|targetStylesheetLoads=100/100|domainNodes=136/136' /tmp/r5.txt
          grep -q '^PROOF_RESULT=FAIL$' /tmp/r5.txt
          grep -Fq "if(JSON.stringify(da[i])!==JSON.stringify(db[i]))deep++" /tmp/r5.yml
          grep -Fq "for(const scope of ['style','before','after']) for(const p of Object.keys(x[scope])) if(x[scope][p]!==y[scope][p])" /tmp/r3.yml
          echo 'EVIDENCE RECONCILIATION PASS|r2HistoricalFail=preserved|r5HistoricalFail=preserved|visualStates=36|metadataDiffs=0|screenshotDiffs=0|r3DeepState=resultados@760|r3DeepNodes=977/977|r3StyleOrRectDiffs=0|criteriaRelaxed=0'
      - name: Build exact candidate and measure fresh importance queue
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA" >/dev/null
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),cp=require('child_process');
          const root=process.cwd(),target=process.env.TARGET_FILE;
          const protectedFiles=new Map([
            ['assets/css/pages/home/mobile-composition.css','UX-CSS-IMPORTANT-006'],
            ['assets/css/components/cards/mobile-card-contract.css','UX-CSS-IMPORTANT-010'],
            ['assets/css/components/shell/mobile-base-stability.css','UX-CSS-IMPORTANT-020'],
            ['assets/css/pages/home/mobile-hero-feed.css','UX-CSS-IMPORTANT-021'],
          ]);
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(e.isFile()&&e.name.endsWith('.css')?[f]:[])});
          const rel=f=>path.relative(root,f).replace(/\\/g,'/');
          const risk=(r,n)=>{if(r.includes('service-card'))return'excluded-service-card';if(r.includes('/core/')||r.includes('/layout/')||r.includes('shell')||r.includes('sidebar')||r.includes('header'))return'high-baseline-required';if(n>=25)return'high-baseline-required';if(n>=5)return'medium-baseline-required';return'low-review-candidate'};
          function measure(){const rows=walk(path.join(root,'assets/css')).map(f=>{const r=rel(f),n=(fs.readFileSync(f,'utf8').match(/!important\b/g)||[]).length;return{file:r,n,risk:risk(r,n),protectedBy:protectedFiles.get(r)||null}});const all=rows.reduce((s,x)=>s+x.n,0),res=rows.filter(x=>x.n>0&&x.risk!=='excluded-service-card');return{global:all,outsideService:res.reduce((s,x)=>s+x.n,0),files:res.length,high:res.filter(x=>x.risk==='high-baseline-required').reduce((s,x)=>s+x.n,0),medium:res.filter(x=>x.risk==='medium-baseline-required').reduce((s,x)=>s+x.n,0),low:res.filter(x=>x.risk==='low-review-candidate').reduce((s,x)=>s+x.n,0),protected:Object.fromEntries([...protectedFiles].map(([f,k])=>[k,rows.find(x=>x.file===f)?.n??-1])),target:rows.find(x=>x.file===target)?.n??-1};}
          const parent=measure();
          const o=fs.readFileSync(target,'utf8'),c=o.replace(/\s*!important\b/g,'');
          const sha=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync('/tmp/candidate.css',c);const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if((o.match(/!important\b/g)||[]).length!==215||(c.match(/!important\b/g)||[]).length!==0||sha!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error('candidate identity');
          fs.writeFileSync(target,c);const candidate=measure();
          const p=parent,cand=candidate;
          if(p.global!==7576||p.outsideService!==7514||p.files!==14||p.high!==7506||p.medium!==6||p.low!==2||p.target!==215)throw Error(`parent metrics ${JSON.stringify(p)}`);
          if(cand.global!==7361||cand.outsideService!==7299||cand.files!==13||cand.high!==7291||cand.medium!==6||cand.low!==2||cand.target!==0)throw Error(`candidate metrics ${JSON.stringify(cand)}`);
          for(const [k,v] of Object.entries({['UX-CSS-IMPORTANT-006']:6,['UX-CSS-IMPORTANT-010']:2,['UX-CSS-IMPORTANT-020']:28,['UX-CSS-IMPORTANT-021']:127})){if(p.protected[k]!==v||cand.protected[k]!==v)throw Error(`protected ${k}`)}
          console.log(`CANDIDATE PASS|important=215->0|sha256=${sha}|blob=${blob}|bytes=${Buffer.byteLength(c)}|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          console.log(`IMPORTANT FRESH PASS|global=${p.global}->${cand.global}|outsideService=${p.outsideService}->${cand.outsideService}|queueFiles=${p.files}->${cand.files}|high=${p.high}->${cand.high}|medium=${p.medium}->${cand.medium}|low=${p.low}->${cand.low}|protected006=6|protected010=2|protected020=28|protected021=127`);
          NODE
      - name: Run static and governance gates on candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts >/dev/null
          node scripts/generate-responsive-index-baseline.js >/tmp/responsive-baseline.log 2>&1
          npm run test:responsive-contract >/tmp/responsive.log 2>&1
          echo 'RESPONSIVE CONTRACT PASS'
          npm run audit:domain >/tmp/domain-card.log 2>&1
          echo 'DOMAIN CARD CONTRACT PASS'
          npm run audit:agent-governance >/tmp/agent.log 2>&1
          echo 'AGENT GOVERNANCE PASS'
          node scripts/audit-css-responsive-conflicts.js >/tmp/conflicts.log 2>&1
          echo 'CSS RESPONSIVE CONFLICTS PASS'
          npm run audit:shared-app-header-contract >/tmp/header.log 2>&1
          npm run audit:mobile-shell-location-contract >/tmp/mobile-shell.log 2>&1
          npm run audit:responsive-boundaries >/tmp/boundaries.log 2>&1
          echo 'SHARED RESPONSIVE CONTRACTS PASS'
          npm run audit:duplicate-assets >/tmp/duplicates.log 2>&1
          npm run audit:domain-completion-matrix >/tmp/domain-matrix.log 2>&1
          echo 'DUPLICATES + DOMAIN MATRIX PASS'
          npm run audit:active-legacy-structures >/tmp/legacy.log 2>&1
          npm run audit:important-reduction-plan >/tmp/important-plan.log 2>&1
          npm run audit:global-css-design-system >/tmp/design-system.log 2>&1
          echo 'CSS GOVERNANCE SUITE PASS'
          npm audit --json >/tmp/npm-audit.json 2>/dev/null || true
          node <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));const v=j.metadata?.vulnerabilities||{};const total=Number(v.total||0),critical=Number(v.critical||0),high=Number(v.high||0),moderate=Number(v.moderate||0),low=Number(v.low||0);if(total!==13||critical!==0||high!==10||moderate!==1||low!==2)throw Error(`npm audit ${JSON.stringify(v)}`);console.log(`DEPENDENCIES PASS|total=${total}|critical=${critical}|high=${high}|moderate=${moderate}|low=${low}`);
          NODE
      - name: Diff hygiene and exact restore
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/candidate.css /tmp/candidate-final.css
          git restore --worktree -- .
          git clean -fd >/dev/null
          cp /tmp/candidate-final.css "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$CANDIDATE_BLOB"
          test "$(grep -o '!important' "$TARGET_FILE" | wc -l | tr -d ' ')" = 0
          test "$(git diff --name-only "$PARENT_SHA" -- | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only "$PARENT_SHA" --)" = "$TARGET_FILE"
          num="$(git diff --numstat "$PARENT_SHA" -- "$TARGET_FILE")"
          test "$num" = $'215\t215\t'"$TARGET_FILE"
          git diff --check "$PARENT_SHA" -- "$TARGET_FILE"
          echo "DIFF HYGIENE PASS|files=1|target=$TARGET_FILE|additions=215|deletions=215|markerOnly=1"
          cp /tmp/parent.css "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_PARENT_BLOB"
          test -z "$(git status --short --untracked-files=no)"
          echo 'RESTORE PASS|target=parent-exact|workspaceTrackedClean=1'
          echo 'RESULT=PASS'
      - name: Publish R6 receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL; grep -q '^RESULT=PASS$' /tmp/r6.log && result=PASS || true
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; grep -E '^(EVIDENCE RECONCILIATION PASS|CANDIDATE PASS|IMPORTANT FRESH PASS|RESPONSIVE CONTRACT PASS|DOMAIN CARD CONTRACT PASS|AGENT GOVERNANCE PASS|CSS RESPONSIVE CONFLICTS PASS|SHARED RESPONSIVE CONTRACTS PASS|DUPLICATES \+ DOMAIN MATRIX PASS|CSS GOVERNANCE SUITE PASS|DEPENDENCIES PASS|DIFF HYGIENE PASS|RESTORE PASS|RESULT=)' /tmp/r6.log || true; echo "PROOF_RESULT=$result"; } >/tmp/out
          git fetch origin "refs/heads/$LEDGER:refs/remotes/origin/$LEDGER" >/dev/null
          git checkout -B diag-output "origin/$LEDGER" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"
          git commit -m 'diag: publish 035 domain cards governance r6 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$LEDGER" >/dev/null
          test "$result" = PASS
