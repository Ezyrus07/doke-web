name: COM-B02W Domain Completion Matrix Materialization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02w-domain-completion-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: com-b02w-domain-completion-matrix-materialization-temp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and fast-forward B02W Matrix reconciliation
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='com/com-001-baseline-audit'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

          rm .github/workflows/com-b02w-domain-completion-matrix-materialization-temp.yml
          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02w-domain-completion-matrix-materialization-temp.yml \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"
          git diff --check

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -u .github/workflows/com-b02w-domain-completion-matrix-materialization-temp.yml
          git commit -m 'docs(com): reconcile B02W Domain Completion Matrix derivatives'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"refs/heads/$BRANCH"
