name: COM-B03C R5H Target Environment Binding Matrix Artifact TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-target-environment-binding-matrix-artifact-temp.yml'

permissions:
  contents: read

jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact read-only temporary installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-target-environment-binding-matrix-artifact-temp.yml
          test "$(git rev-parse HEAD^)" = "6be38b0a66d971941a4f3cd841bcb7b82accd428"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-environment-binding-boundary.json)" = "34d3d179090ccca8c51aaaf12a2ba1bb673ef495"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-target-environment-binding-boundary.yml)" = "575d7bab78f04caaa405e88c71454a3ef28399e4"

      - name: Generate deterministic Matrix derivatives only
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          npm run audit:domain-completion-matrix
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json "
          git diff --check

      - name: Upload Matrix derivatives
        uses: actions/upload-artifact@v4
        with:
          name: target-environment-binding-matrix-derivatives
          if-no-files-found: error
          retention-days: 1
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
