name: COM-B03C R5H Synthetic Identity Lifecycle Binding Descriptor Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified credential-provider binding lineage
        shell: bash
        run: |
          set -euo pipefail
          parent=8ebf9cce39ded220df4a361b82145884041048bb
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$parent^{tree}")" = "0b081095b933db08525d5ba48e9f9985acd20a27"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json)" = "a5b6700e8335511a39cbe215459a4675f17a16a1"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.yml)" = "5b47e102a439bc94fa5385a55edc09c7e05e950f"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js)" = "6419696544fb9e1906df92e3591e93efcf04b826"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js)" = "759935689fccc695cf7bcfa5d495fefb0965d8be"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js)" = "27c1e962f0da3dbf2aaf7f122fa79211d5483dc2"

      - name: Exact repository-only materialization scope
        shell: bash
        run: |
          set -euo pipefail
          parent=8ebf9cce39ded220df4a361b82145884041048bb
          descriptor=config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json
          certifier=.github/workflows/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.yml
          initial="$(printf '%s\n' "$certifier" "$descriptor" | sort)"
          final="$(printf '%s\n' "$certifier" "$descriptor" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          if [ "$actual" != "$initial" ] && [ "$actual" != "$final" ]; then
            printf 'Unexpected scope:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Static descriptor-only no-runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          descriptor=config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json
          if grep -En 'https?://|process\.env|secrets\.|@supabase|createClient|\.channel\(|\.subscribe\(|fetch\(|projectRef|projectUrl|apiKey|service_role|anonKey|SUPABASE_|\.auth\.admin|createUser\(|deleteUser\(|signUp\(' "$descriptor"; then
            echo 'Runtime, Auth/Admin, endpoint or secret-source syntax is forbidden in synthetic-identity-lifecycle descriptor boundary' >&2
            exit 1
          fi

      - name: Semantic synthetic-identity-lifecycle binding descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const d = require('./config/com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary.json');
          const p = require('./config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json');
          const rt = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-runtime-target-binding.js');
          const w = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js');
          const provider = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js');

          const environment='doke-web-staging';
          const resource='doke-web-staging-realtime-messages-extension-classification-probe';
          const fingerprint='sha256:2ab84b52b269ef4c9556c9818f4355d466bce9f735878213b49d9840cdd00fbf';
          const fields=['lifecycleContractId','lifecycleModulePath','lifecycleModuleBlob','bindingBoundaryHead'];
          const allTrue=(o,keys,label)=>keys.forEach(k=>{if(o[k]!==true)throw new Error(`${label}:${k}`)});
          const allFalse=(o,keys,label)=>keys.forEach(k=>{if(o[k]!==false)throw new Error(`${label}:${k}`)});

          if (d.contractId !== 'com-b03c-r5h-extension-classification-probe-synthetic-identity-lifecycle-binding-descriptor-boundary-v1') throw new Error('CONTRACT_DRIFT');
          const rc=d.repositoryContext;
          if (rc.parentCertifiedCredentialProviderBindingHead !== '8ebf9cce39ded220df4a361b82145884041048bb' || rc.parentCertifiedCredentialProviderBindingTree !== '0b081095b933db08525d5ba48e9f9985acd20a27' || rc.parentCertificationRun !== 31958613933 || rc.parentCertificationJob !== 95193044369) throw new Error('PARENT_CERTIFICATION_DRIFT');
          if (rc.parentBoundaryBlob !== 'a5b6700e8335511a39cbe215459a4675f17a16a1' || rc.parentCertifierBlob !== '5b47e102a439bc94fa5385a55edc09c7e05e950f' || rc.parentProviderModuleBlob !== '6419696544fb9e1906df92e3591e93efcf04b826') throw new Error('PARENT_BLOB_DRIFT');
          if (d.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || d.functionalCheckpoint.r5iCreated !== false || d.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          if (!rt.DEPENDENT_PORTS.includes('synthetic_identity_lifecycle')) throw new Error('RUNTIME_TARGET_PORT_MISSING');
          const port=w.PORT_CONTRACTS.find(x=>x.id==='synthetic_identity_lifecycle');
          if (!port || port.responsibility!=='future_synthetic_identity_lifecycle_binding') throw new Error('WIRING_PORT_DRIFT');

          const pb=p.credentialProviderBinding;
          if (pb.credentialProviderBindingDefined!==true || pb.credentialProviderBound!==true || pb.providerModuleBlob!=='6419696544fb9e1906df92e3591e93efcf04b826') throw new Error('PARENT_PROVIDER_BINDING_DRIFT');
          ['credentialSecretName','credentialReference','credentialMaterial'].forEach(k=>{if(pb[k]!==null)throw new Error(`PARENT_CREDENTIAL_SOURCE:${k}`)});
          allFalse(pb,['credentialReadImplemented','secretResolutionImplemented','credentialReferenceResolutionImplemented','transportBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority'],'PARENT_AUTHORITY');
          const pd=provider.repositoryDescriptor();
          if (pd.credentialProviderImplementationPresent!==true || pd.remoteCredentialReadAuthority!==false || pd.remoteExecutionAuthority!==false) throw new Error('PARENT_PROVIDER_MODULE_DRIFT');

          const schema=d.canonicalSyntheticIdentityLifecycleSchema;
          if(schema.slotId!=='synthetic_identity_lifecycle' || schema.schemaOrigin!=='repository_owned_dependent_port_contract' || schema.requiredFields.join('|')!==fields.join('|')) throw new Error('SCHEMA_DRIFT');
          allTrue(schema.constraints,['repositoryOwnedModuleRequired','repositoryRelativeModulePathRequired','immutableModuleBlobRequired','separateCertifiedBindingBoundaryRequired','identityReferenceForbidden','identityMaterialForbidden','identityProvisioningForbidden','identityDeletionForbidden','authAdminClientCreationForbidden','credentialReadForbidden','processEnvironmentReadForbidden','remoteDependencyImportForbidden','networkCallForbidden'],'SCHEMA_CONSTRAINT');

          const b=d.syntheticIdentityLifecycleBindingDescriptor;
          if(b.slotId!=='synthetic_identity_lifecycle' || b.syntheticIdentityLifecycleBindingDescriptorDefined!==true || b.schemaOnly!==true || b.requiredFields.join('|')!==fields.join('|')) throw new Error('DESCRIPTOR_DRIFT');
          allFalse(b,['syntheticIdentityLifecycleBindingDefined','identityLifecycleBound','identityProvisioningImplemented','identityDeletionImplemented','transportBound'],'DESCRIPTOR_MUST_REMAIN_FALSE');
          ['lifecycleContractId','lifecycleModulePath','lifecycleModuleBlob','bindingBoundaryHead','syntheticIdentityReference','syntheticIdentityMaterial','syntheticIdentity'].forEach(k=>{if(b[k]!==null)throw new Error(`CONCRETE_IDENTITY_FORBIDDEN:${k}`)});
          allTrue(b,['repositoryOwnedModuleRequired','repositoryRelativeModulePathRequired','immutableModuleBlobRequired','futureBindingBoundaryRequired','futureBindingBoundaryMustBeSeparateCertifiedBoundary','futureBindingBoundaryMustReferenceThisDescriptorCertifiedHead','futureBindingBoundaryMayBindOnlySyntheticIdentityLifecycleSlot','futureBindingBoundaryMustProvideRepositoryOwnedModuleContract','futureBindingBoundaryMustProvideRepositoryRelativeModulePath','futureBindingBoundaryMustProvideImmutableModuleBlob','futureBindingBoundaryMustPreserveAllUpstreamBindings','futureBindingBoundaryMayNotIntroduceIdentityReference','futureBindingBoundaryMayNotIntroduceIdentityMaterial','futureBindingBoundaryMayNotProvisionIdentity','futureBindingBoundaryMayNotDeleteIdentity','futureBindingBoundaryMayNotCreateAuthAdminClient','futureBindingBoundaryMayNotReadCredential','futureBindingBoundaryMayNotReadProcessEnvironment','futureBindingBoundaryMayNotImportRemoteDependency','futureBindingBoundaryMayNotBindRealtimeClientFactory','futureBindingBoundaryMayNotBindEvidenceRecorder','futureBindingBoundaryMayNotBindCleanupVerifier','futureBindingBoundaryMayNotIntroduceEndpoint','futureBindingBoundaryMayNotBindTransport','futureBindingBoundaryMayNotGrantStagingReadAuthority','futureBindingBoundaryMayNotGrantStagingMutationAuthority','futureBindingBoundaryMayNotGrantNetworkAuthority','futureBindingBoundaryMayNotGrantAuthIdentityLifecycleAuthority','futureBindingBoundaryMayNotGrantRemoteExecutionAuthority'],'FUTURE_BINDING_FAIL_CLOSED');

          const u=d.upstreamBindings;
          if(u.runtimeAdapter.bound!==true || u.runtimeAdapter.bindingBoundaryHead!=='e2809ba029930eac76729c9ae5f1496919a500de') throw new Error('UPSTREAM_RUNTIME_ADAPTER_DRIFT');
          if(u.targetEnvironment.bound!==true || u.targetEnvironment.bindingBoundaryHead!=='10ddea2bb7a4ded9bf1b7654585092a396f885cb' || u.targetEnvironment.stableEnvironmentIdentifier!==environment || u.targetEnvironment.production!==false) throw new Error('UPSTREAM_ENV_DRIFT');
          if(u.targetResource.bound!==true || u.targetResource.bindingBoundaryHead!=='e297b7f921c72864471e123a3d628a7f3e2dd3fd' || u.targetResource.stableResourceIdentifier!==resource || u.targetResource.resourceScopeFingerprint!==fingerprint) throw new Error('UPSTREAM_RESOURCE_DRIFT');
          if(u.credentialProvider.bound!==true || u.credentialProvider.bindingBoundaryHead!=='8ebf9cce39ded220df4a361b82145884041048bb' || u.credentialProvider.providerModuleBlob!=='6419696544fb9e1906df92e3591e93efcf04b826' || u.credentialProvider.credentialReadImplemented!==false) throw new Error('UPSTREAM_PROVIDER_DRIFT');

          const slots=['synthetic_identity_lifecycle','realtime_client_factory','sanitized_evidence_recorder','cleanup_verifier'];
          if(d.remainingDependentPorts.map(x=>x.slotId).join('|')!==slots.join('|')) throw new Error('PORT_SET_DRIFT');
          d.remainingDependentPorts.forEach((x,i)=>{if(x.bound!==false || x.concreteValuePresent!==false || x.descriptorDefined!==(i===0))throw new Error(`PORT_STATE_DRIFT:${x.slotId}`)});

          Object.entries(d.concreteState).forEach(([k,v])=>{if(v!==null)throw new Error(`CONCRETE_STATE_FORBIDDEN:${k}`)});

          const f=d.futureBindingBoundaryRequirements;
          allTrue(f,['repositoryOnlyBoundaryRequired','exactDescriptorCertifiedHeadRequired','syntheticIdentityLifecycleSlotOnly','requiredFieldsMustRemainExact','allUpstreamBindingsMustRemainExact','credentialMaterialMustRemainAbsent','credentialReadAuthorityMustRemainFalse','identityReferenceMustRemainAbsent','identityMaterialMustRemainAbsent','identityProvisioningAuthorityMustRemainFalse','identityDeletionAuthorityMustRemainFalse','authAdminClientCreationMustRemainAbsent','processEnvironmentReadMustRemainAbsent','remoteDependencyLoadAuthorityMustRemainFalse','realtimeClientFactoryMustRemainUnbound','sanitizedEvidenceRecorderMustRemainUnbound','cleanupVerifierMustRemainUnbound','endpointMustRemainAbsent','transportMustRemainUnbound','stagingReadAuthorityMustRemainFalse','stagingMutationAuthorityMustRemainFalse','networkAuthorityMustRemainFalse','authIdentityLifecycleAuthorityMustRemainFalse','executionEntrypointMustRemainAbsent','executionWorkflowMustRemainAbsent','remoteExecutionAuthorityMustRemainFalse'],'FUTURE_REQUIREMENT');
          if(f.exactTargetEnvironmentStableIdentifier!==environment || f.exactTargetResourceStableIdentifier!==resource || f.exactTargetResourceScopeFingerprint!==fingerprint) throw new Error('FUTURE_TARGET_DRIFT');

          const a=d.authorizationState;
          if(a.genericContinuationGrantsRemoteAuthority!==false || a.priorR5dAuthorizationReusable!==false || a.priorR5dReceiptReusable!==false || a.priorR5dTriggerReusable!==false) throw new Error('AUTH_REUSE_DRIFT');
          const c=d.causalState;
          allFalse(c,['exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'],'CAUSAL_DRIFT');

          const g=d.governance;
          allTrue(g,['repositoryOnlyDefinition','runtimeAdapterBound','targetEnvironmentBound','targetResourceBound','credentialProviderBound','syntheticIdentityLifecycleBindingDescriptorDefined'],'GOV_TRUE');
          allFalse(g,['syntheticIdentityLifecycleBindingDefined','identityLifecycleBound','identityProvisioningImplemented','identityDeletionImplemented','transportBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority'],'GOV_FALSE');
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check 8ebf9cce39ded220df4a361b82145884041048bb...HEAD
