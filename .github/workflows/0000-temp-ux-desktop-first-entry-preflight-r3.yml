name: TEMP UX Desktop First Entry Preflight R3

on:
  push:
    branches:
      - diag/ux-desktop-first-entry-preflight-r3

permissions:
  contents: read

jobs:
  static-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PARENT: 14bdb1af9cfefff4dfd27a78b937443975266001
      PARENT_TREE: 32f449b165b8cb119600c702c0625cc7199f3416
      PERMANENT_BRANCH: ux/ux-qa-debt-004-main-action-state-runtime-owner-contract
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-desktop-first-entry-preflight-r3.yml
      DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify diagnostic-only lineage
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$HEAD_SHA" | awk '{print $2}')" = "$PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$PERMANENT_BRANCH")" = "$PARENT"
          echo LINUX_LINEAGE=PASS
          echo PRODUCT_MUTATION=false
          echo MATRIX_MUTATION=false

      - name: Install locked dependencies and expose Playwright Chromium to legacy audits
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium
          chromium_path="$(node -e "const { chromium }=require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          test -x /usr/bin/chromium
          /usr/bin/chromium --version
          echo LEGACY_CHROMIUM_PATH_COMPAT=PASS

      - name: Reconfirm state closure and canonical desktop entry gates
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:global-state-completion
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/validation/global-cycle-140-global-state-completion-gate-report.json', 'utf8'));
          const failedReports = Array.isArray(report.failedReports) ? report.failedReports.length : Number(report.failedReports || 0);
          const followUpReports = Array.isArray(report.followUpReports) ? report.followUpReports.length : Number(report.followUpReports || 0);
          if (report.status !== 'passed' || failedReports !== 0 || followUpReports !== 0) throw new Error(`state gate not closed: ${JSON.stringify({status:report.status,failedReports,followUpReports})}`);
          if (!String(report.nextPhaseConstraint || '').includes('desktop-first')) throw new Error(`desktop-first constraint missing: ${report.nextPhaseConstraint}`);
          console.log('STATE_CLOSURE=PASS next=DESKTOP_FIRST_ENTRY_PREFLIGHT');
          NODE
          npm run audit:desktop-base
          npm run audit:desktop-phase-entry-gate
          npm run audit:desktop-phase-entry-contract
          npm run audit:visual-baseline
          npm run audit:shared-app-header-contract
          npm run test:results-card-density-contract
          npm run audit:marketplace-index-parity
          npm run audit:focused-index-parity
          npm run audit:section-header-contract
          npm run audit:overflow-text-clipping
          echo DESKTOP_CANONICAL_GATES=PASS

      - name: Classify inherited shared-card debt without relaxing Resultados
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npm run audit:shared-card-anatomy 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo SHARED_CARD_ANATOMY_GLOBAL=PASS
            echo INHERITED_SHARED_CARD_DEBT=NONE
            exit 0
          fi
          mapfile -t finding_files < <(printf '%s\n' "$output" | sed -n -E 's#^(assets/css/[^:]+):[0-9]+:.*#\1#p' | sort -u)
          test "${#finding_files[@]}" -gt 0
          allowed=(
            "assets/css/pages/detalhe-anuncio/visual-hierarchy.css"
            "assets/css/pages/home/visual-hierarchy.css"
            "assets/css/pages/profile/visual-hierarchy.css"
            "assets/css/pages/profile-page.css"
          )
          for file in "${finding_files[@]}"; do
            ok=false
            for expected in "${allowed[@]}"; do
              if [ "$file" = "$expected" ]; then ok=true; break; fi
            done
            if [ "$ok" != true ]; then
              echo "Unexpected shared-card finding outside inherited set: $file" >&2
              exit 1
            fi
          done
          if printf '%s\n' "$output" | grep -Eqi 'resultados|search-results'; then
            echo 'Resultados has a shared-card anatomy violation' >&2
            exit 1
          fi
          printf 'INHERITED_SHARED_CARD_FILES=%s\n' "$(IFS=,; echo "${finding_files[*]}")"
          echo RESULTADOS_SHARED_CARD_DEBT=0
          echo INHERITED_SHARED_CARD_DEBT=OBSERVED_AND_SEPARATED

      - name: Verify Resultados ownership, baseline asset, and desktop ordering
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('resultados.html', 'utf8');
          const css = fs.readFileSync('assets/css/pages/search-results.css', 'utf8');
          const map = fs.readFileSync('docs/CSS_AUTHORITY_MAP.md', 'utf8');
          const baseline = fs.readFileSync('docs/BASELINE-VISUAL-APPROVED.md', 'utf8');
          for (const token of ['data-page="resultados"','data-app-header','search-results-workspace','assets/css/pages/search-results.css','assets/css/pages/search-filter-presentation.css']) if (!html.includes(token)) throw new Error(`resultados missing ${token}`);
          if (/<style\b/i.test(html)) throw new Error('resultados contains inline style block');
          for (const token of ['../layout/header.css','./search-results-runtime.css','../components/cards/marketplace-card-contract.css','./results/visual-hierarchy.css']) if (!css.includes(token)) throw new Error(`search-results manifest missing ${token}`);
          const order = ['resultados.html','detalhe-anuncio.html','perfil.html'].map((token) => map.indexOf(token));
          if (order.some((v) => v < 0) || !(order[0] < order[1] && order[1] < order[2])) throw new Error(`desktop close order drift: ${JSON.stringify(order)}`);
          if (!baseline.includes('Results card density boundary') || !baseline.includes('resultados.html')) throw new Error('Resultados baseline boundary missing');
          const snapshot = 'tests/visual/doke-visual-regression.spec.js-snapshots/resultados-desktop-1366x768-win32.png';
          if (!fs.existsSync(snapshot)) throw new Error('required Resultados Win32 desktop baseline missing');
          console.log('RESULTADOS_AUTHORITY=PASS');
          console.log('RESULTADOS_BASELINE_ASSET=PASS');
          console.log('DESKTOP_ORDER=PASS resultados>detalhe-anuncio>perfil');
          NODE
          git checkout -- .
          git clean -fd
          test "$(git rev-parse HEAD^1)" = "$PARENT"
          echo STATIC_LINUX=PASS

  browser-win32:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PARENT: 14bdb1af9cfefff4dfd27a78b937443975266001
      PARENT_TREE: 32f449b165b8cb119600c702c0625cc7199f3416
      PERMANENT_BRANCH: ux/ux-qa-debt-004-main-action-state-runtime-owner-contract
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-desktop-first-entry-preflight-r3.yml
      DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify diagnostic-only lineage
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$HEAD_SHA" | awk '{print $2}')" = "$PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$PERMANENT_BRANCH")" = "$PARENT"
          echo WIN32_LINEAGE=PASS

      - name: Install locked dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium

      - name: Required Resultados desktop visual baseline comparison
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test tests/visual/doke-visual-regression.spec.js --grep "resultados mantém contrato visual e estrutural em desktop-1366x768"
          echo RESULTADOS_VISUAL_BASELINE=PASS

      - name: Direct load and stable-shell navigation contract
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test tests/e2e/global-layout-contract.spec.js --grep "desktop-1366.*resultados.html keeps structural layout contract|DokeNavigate no-reload flow"
          echo RESULTADOS_DIRECT_AND_NAV_LAYOUT=PASS

      - name: Direct-load versus internal-navigation computed-style parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const { spawn } = require('child_process');
          const http = require('http');
          const server = spawn(process.execPath, ['scripts/serve-static-site.js', '--host=127.0.0.1', '--port=5500'], { env: { ...process.env, DOKE_E2E_DISABLE_REMOTE_SERVICES: '1' }, stdio: ['ignore','pipe','pipe'] });
          const waitForServer = () => new Promise((resolve, reject) => {
            let attempts = 0;
            const probe = () => {
              attempts += 1;
              const req = http.get('http://127.0.0.1:5500/index.html', (res) => {
                res.resume();
                if (res.statusCode === 200) return resolve();
                if (attempts > 40) return reject(new Error(`server status ${res.statusCode}`));
                setTimeout(probe, 250);
              });
              req.on('error', () => attempts > 40 ? reject(new Error('static server unavailable')) : setTimeout(probe, 250));
            };
            probe();
          });
          const routeExternal = async (page) => {
            await page.route('https://unpkg.com/**', (route) => route.fulfill({ contentType:'application/javascript', body:'' }));
            await page.route('https://cdn.jsdelivr.net/**', (route) => route.fulfill({ contentType:'application/javascript', body:'' }));
            await page.route('https://fonts.googleapis.com/**', (route) => route.fulfill({ contentType:'text/css', body:'' }));
            await page.route('https://fonts.gstatic.com/**', (route) => route.abort());
          };
          const stable = async (page) => {
            await page.waitForLoadState('domcontentloaded');
            await page.waitForLoadState('networkidle').catch(() => {});
            await page.addStyleTag({ content:'*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important;caret-color:transparent!important}' });
            await page.waitForTimeout(450);
          };
          const signature = (page) => page.evaluate(() => {
            const visible = (el) => { if (!el) return false; const r=el.getBoundingClientRect(); const s=getComputedStyle(el); return r.width>0 && r.height>0 && s.display!=='none' && s.visibility!=='hidden'; };
            const read = (selector) => {
              const el = Array.from(document.querySelectorAll(selector)).find(visible);
              if (!el) return null;
              const r=el.getBoundingClientRect(), s=getComputedStyle(el);
              return { left:Math.round(r.left*10)/10, width:Math.round(r.width*10)/10, display:s.display, position:s.position, gridTemplateColumns:s.gridTemplateColumns, gap:s.gap, paddingLeft:s.paddingLeft, paddingRight:s.paddingRight, borderRadius:s.borderRadius };
            };
            const root=document.documentElement;
            return { dataPage:document.body?.dataset.page||'', overflow:root.scrollWidth>root.clientWidth+1, header:read('[data-app-header] .app-header__inner'), workspace:read('.search-results-workspace'), searchbar:read('.results-searchbar'), layout:read('.results-layout') };
          });
          const compare = (a,b) => {
            if (a.dataPage!=='resultados' || b.dataPage!=='resultados') throw new Error('body[data-page] mismatch');
            if (a.overflow || b.overflow) throw new Error(`horizontal overflow direct=${a.overflow} nav=${b.overflow}`);
            for (const key of ['header','workspace','searchbar','layout']) {
              if (!a[key] || !b[key]) throw new Error(`${key} missing direct/nav`);
              if (Math.abs(a[key].left-b[key].left)>1 || Math.abs(a[key].width-b[key].width)>1) throw new Error(`${key} geometry drift ${JSON.stringify({direct:a[key],nav:b[key]})}`);
              for (const prop of ['display','position','gridTemplateColumns','gap','paddingLeft','paddingRight','borderRadius']) if (a[key][prop]!==b[key][prop]) throw new Error(`${key}.${prop} drift direct=${a[key][prop]} nav=${b[key][prop]}`);
            }
          };
          (async()=>{
            let browser;
            try {
              await waitForServer();
              browser=await chromium.launch();
              const context=await browser.newContext({ viewport:{width:1366,height:768} });
              const direct=await context.newPage(); const directErrors=[]; direct.on('pageerror',(e)=>directErrors.push(String(e))); await routeExternal(direct); await direct.goto('http://127.0.0.1:5500/resultados.html'); await stable(direct); const a=await signature(direct); if(directErrors.length) throw new Error(`direct page errors ${JSON.stringify(directErrors)}`);
              const nav=await context.newPage(); const navErrors=[]; nav.on('pageerror',(e)=>navErrors.push(String(e))); await routeExternal(nav); await nav.goto('http://127.0.0.1:5500/index.html'); await stable(nav); await nav.waitForFunction(()=>typeof window.DokeNavigate==='function'); await nav.evaluate(async()=>{const r=window.DokeNavigate('/resultados.html'); if(r&&typeof r.then==='function') await r;}); await nav.waitForURL(/\/resultados\.html(?:$|[?#])/); await stable(nav); const b=await signature(nav); if(navErrors.length) throw new Error(`nav page errors ${JSON.stringify(navErrors)}`);
              compare(a,b);
              console.log(`DIRECT_SIGNATURE=${JSON.stringify(a)}`);
              console.log(`NAV_SIGNATURE=${JSON.stringify(b)}`);
              console.log('DIRECT_INTERNAL_COMPUTED_PARITY=PASS');
            } finally { if(browser) await browser.close().catch(()=>{}); server.kill(); }
          })().catch((e)=>{ console.error(e); server.kill(); process.exit(1); });
          NODE

      - name: Freeze browser evidence
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .
          git clean -fd
          test "$(git rev-parse HEAD^1)" = "$PARENT"
          echo BROWSER_WIN32=PASS
          echo CRITERIA_RELAXED=0
          echo INTRODUCED_PRODUCT_MUTATIONS=0

  receipt:
    needs: [static-linux, browser-win32]
    runs-on: ubuntu-latest
    steps:
      - name: Final desktop-first entry receipt
        shell: bash
        run: |
          set -euo pipefail
          echo 'DESKTOP_FIRST_ENTRY_PREFLIGHT={"result":"PASS","parent":"14bdb1af9cfefff4dfd27a78b937443975266001","entryTarget":"resultados.html","stateClosure":"PASS","desktopCanonicalGates":"PASS","linuxParityAudits":"PASS","visualBaseline1366Win32":"PASS","directLoad":"PASS","internalNavigation":"PASS","computedStyleParity":"PASS","resultadosSharedCardDebt":0,"inheritedSharedCardDebt":"separated","productMutation":false,"matrixMutation":false,"criteriaRelaxed":0,"classification":"RESULTADOS_DESKTOP_BASELINE_ALIGNED","nextTarget":"detalhe-anuncio.html","repositoryOnly":true}'
