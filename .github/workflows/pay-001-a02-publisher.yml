name: Doke PAY-A02 Repository Publisher

on:
  push:
    branches:
      - pay/pay-001-baseline-audit
    paths:
      - '.github/tmp/pay-a02-apply.js'
      - '.github/workflows/pay-001-a02-publisher.yml'
  pull_request:
    branches:
      - msg/msg-001-baseline-audit
    paths:
      - '.github/tmp/pay-a02-apply.js'
      - '.github/workflows/pay-001-a02-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply PAY-A02 deterministic patch
        run: |
          node .github/tmp/pay-a02-apply.js
          node scripts/audit-domain-completion-matrix.js --write
      - name: Validate PAY-A01 and PAY-A02
        run: |
          node --check assets/js/services/payment-service.js
          node --check assets/js/repositories/finance-repository.js
          node --check scripts/audit-pay-001-a01-authority-baseline.js
          node --check scripts/audit-pay-001-a02-authenticated-authority-boundary.js
          node --check scripts/test-pay-001-a01-authority-baseline.js
          node --check scripts/test-pay-001-a02-authenticated-authority-boundary.js
          npm run audit:pay-001-a01-authority-baseline
          npm run test:pay-001-a01-authority-baseline
          npm run audit:pay-001-a02-authenticated-authority-boundary
          npm run test:pay-001-a02-authenticated-authority-boundary
          npm run test:finance-supabase-repository-contract
          npm run test:financial-rpc-authority-contract
          npm run test:financial-operations-edge-runtime
          npm run test:staging-finance-sandbox-authority-contract
          npm run test:staging-finance-sandbox-edge-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Commit PAY-A02 canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/services/payment-service.js assets/js/repositories/finance-repository.js
          git add scripts/audit-pay-001-a01-authority-baseline.js
          git add config/pay-001-a02-authenticated-authority-boundary.json
          git add docs/PAY-001-A02-AUTHENTICATED-AUTHORITY-BOUNDARY.md
          git add docs/validation/PAY-001-A02-AUTHENTICATED-AUTHORITY-BOUNDARY.json
          git add scripts/audit-pay-001-a02-authenticated-authority-boundary.js
          git add scripts/test-pay-001-a02-authenticated-authority-boundary.js
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          if git diff --cached --quiet; then
            echo "PAY-A02 canonical files already current."
            exit 0
          fi
          git commit -m "Establish PAY-A02 authenticated financial authority boundary"
          git pull --rebase origin pay/pay-001-baseline-audit
          git push origin HEAD:pay/pay-001-baseline-audit
