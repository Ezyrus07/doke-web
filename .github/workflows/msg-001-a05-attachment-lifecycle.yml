name: Doke MSG-A05 Attachment Lifecycle Contract

on:
  pull_request:
    paths:
      - 'scripts/tmp-cleanup-msg-a06.js'
      - '.github/workflows/msg-001-a05-attachment-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-a06:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove temporary publishers and restore MSG-A05 gate
        run: node scripts/tmp-cleanup-msg-a06.js
      - name: Validate canonical MSG-A06 before cleanup commit
        run: |
          npm run audit:msg-001-a01-authority-baseline
          npm run audit:msg-001-a02-canonical-authority-boundary
          npm run test:msg-001-a02-canonical-authority-boundary
          npm run audit:msg-001-a03-server-command-boundary
          npm run test:msg-001-a03-server-command-boundary
          npm run audit:msg-001-a04-realtime-publication-subscription-contract
          npm run test:msg-001-a04-realtime-publication-subscription-runtime
          npm run audit:msg-001-a05-attachment-lifecycle
          npm run test:msg-001-a05-attachment-lifecycle-runtime
          npm run audit:msg-001-a06-presence-typing-boundary
          npm run test:msg-001-a06-presence-typing-runtime
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Commit clean repository state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-a06-1.js
          git add -A scripts/tmp-a06-group1.js
          git add -A scripts/tmp-a06-5.js
          git add -A scripts/tmp-a06-6.js
          git add -A scripts/tmp-a06-7.js
          git add -A scripts/tmp-a06-8.js
          git add -A scripts/tmp-patch-msg-a06.js
          git add -A scripts/tmp-patch-msg-a06-cumulative.js
          git add -A scripts/tmp-finalize-msg-a06.js
          git add -A .github/workflows/tmp-msg-a06-publisher.yml
          git add .github/workflows/msg-001-a05-attachment-lifecycle.yml
          git rm scripts/tmp-cleanup-msg-a06.js
          git commit -m "Remove MSG-A06 temporary publishers"
          git push origin HEAD:msg/msg-001-baseline-audit
