name: 0000 TEMP COM-B02CD Exact Derivatives Atomic Promotion

on:
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cd-exact-derivatives-artifact-export.yml'

permissions:
  contents: write

jobs:
  promote-exact-derivatives:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 32bd6cda71571eb95946dc8f14a72f81253c08dc
      HELPER_PATH: .github/workflows/0000-temp-com-b02cd-exact-derivatives-artifact-export.yml
      REMOVED_TEMP: .github/workflows/0000-temp-com-b02cd-governance-recovery-matrix-materialization.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-execution.js
      CONFIG: config/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.json
      TEST: scripts/test-com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.js
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_MD_BLOB: 0596f9a7d081fea8416f8fc293d7c793c4eebd05
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      MATRIX_REPORT_BLOB: 7cd6d6887c8fdfd9478ea50c9781506e7c5c51ab
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20

    steps:
      - name: Checkout exact promotion head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze promotion lineage and repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$HELPER_PATH"
          ! git cat-file -e "HEAD:$REMOVED_TEMP"
          test "$(git rev-parse HEAD:"$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Revalidate static quarantine without operation execution
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'registerOpaqueContinuationState\(|registry\.set\(|new Map\(|executeRepositoryOnlyDeterministicSyntheticRegister' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Materialize and certify exact two derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:"$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- "$MATRIX_SOURCE"
          expected="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          test "$(git hash-object "$MATRIX_MD")" = "$MATRIX_MD_BLOB"
          test "$(git hash-object "$MATRIX_REPORT")" = "$MATRIX_REPORT_BLOB"

      - name: Create atomic final recovery commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "doke-repository-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add "$MATRIX_MD" "$MATRIX_REPORT"
          git rm "$HELPER_PATH"
          expected="$(printf '%s\n' "$HELPER_PATH" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "fix(com): promote B02CD recovery Matrix derivatives"
          test "$(git rev-parse HEAD^)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$expected"
          test "$(git rev-parse HEAD:"$MATRIX_MD")" = "$MATRIX_MD_BLOB"
          test "$(git rev-parse HEAD:"$MATRIX_REPORT")" = "$MATRIX_REPORT_BLOB"
          test "$(git rev-parse HEAD:"$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          ! git cat-file -e "HEAD:$HELPER_PATH"
          ! git cat-file -e "HEAD:$REMOVED_TEMP"

      - name: Fast-forward branch only if promotion head is still live
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin com/com-001-baseline-audit
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin "HEAD:refs/heads/com/com-001-baseline-audit"
