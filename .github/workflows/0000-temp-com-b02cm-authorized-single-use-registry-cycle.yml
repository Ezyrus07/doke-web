name: TEMP COM-B02CM Authorized Single-Use Permanent Process-Local Registry Cycle

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/0000-temp-com-b02cm-authorized-single-use-registry-cycle.yml'

permissions:
  contents: read

jobs:
  execute-authorized-single-use-registry-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      B02CL_HEAD: 72404ef1300ffa977b92067f37d9f54bebecfa11
      B02CL_TREE: 1d2e3431601b22240590194b0d9294066e22c90f
      B02CL_RUN: '33090061746'
      B02CL_JOB: '98580165521'
      B02CL_TARGET: backend/shared/http/repository-only-permanent-process-local-registry-storage-execution-implementation.js
      B02CL_TARGET_BLOB: 9f1916f87db37a81045be897ae1c87e1341c4774
      B02CL_CONFIG: config/com-b02cl-repository-only-permanent-process-local-registry-storage-execution-implementation.json
      B02CL_CONFIG_BLOB: e03f883851911382692f30823067e63a5740b753
      B02CL_TEST: scripts/test-com-b02cl-repository-only-permanent-process-local-registry-storage-execution-implementation.js
      B02CL_TEST_BLOB: 0102e6156b62f690d55829fb6f45b02ff56020b5
      B02CL_WORKFLOW: .github/workflows/com-b02cl-repository-only-permanent-process-local-registry-storage-execution-implementation.yml
      B02CL_WORKFLOW_BLOB: f9085e278162aa111d19dbdd6609ac94e1a5a1e7
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      DISPATCHER: backend/shared/http/repository-only-route-resume-dispatcher.js
      DISPATCHER_BLOB: 4a8da53cca4ef27777c550e91f28a4abe5bbe542
      CARRIER: backend/shared/http/repository-only-route-continuation-carrier-contract.js
      CARRIER_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
      OP_IMPL: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-methods-implementation.js
      OP_IMPL_BLOB: 99d804721a5d350dcf8e59dd935937e24561e094
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TEMP_WORKFLOW: .github/workflows/0000-temp-com-b02cm-authorized-single-use-registry-cycle.yml
    steps:
      - name: Checkout exact TEMP head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze B02CL certification and TEMP-only installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$B02CL_HEAD"
          test "$(git rev-parse "$B02CL_HEAD^{tree}")" = "$B02CL_TREE"
          actual="$(git diff --name-only "$B02CL_HEAD" HEAD)"
          test "$actual" = "$TEMP_WORKFLOW"
          test "$(git rev-parse HEAD:$B02CL_TARGET)" = "$B02CL_TARGET_BLOB"
          test "$(git rev-parse HEAD:$B02CL_CONFIG)" = "$B02CL_CONFIG_BLOB"
          test "$(git rev-parse HEAD:$B02CL_TEST)" = "$B02CL_TEST_BLOB"
          test "$(git rev-parse HEAD:$B02CL_WORKFLOW)" = "$B02CL_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$DISPATCHER)" = "$DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:$CARRIER)" = "$CARRIER_BLOB"
          test "$(git rev-parse HEAD:$OP_IMPL)" = "$OP_IMPL_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Execute exactly one authorized process-local synthetic register resolve release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const implementation = require('./backend/shared/http/repository-only-permanent-process-local-registry-storage-execution-implementation');

          const routeName = 'communities.membership.command';
          const opaqueStateHandle = 'repo-only-cont:COMB02CM_SYNTHETIC_000001';
          const continuationState = Object.freeze({
            contractId: 'com-b02cm-deterministic-synthetic-continuation-state-v1',
            boundaryId: 'COM-B02CM',
            routeName,
            continuationKind: 'deterministic_synthetic_process_local_registry_cycle',
            syntheticSequence: 1,
            awaitingExternalRepositoryResult: true
          });

          assert.equal(implementation.CONTRACT_ID,
            'com-b02cl-repository-only-permanent-process-local-registry-storage-execution-implementation-v1');
          assert.equal(implementation.BOUNDARY_ID, 'COM-B02CL');
          assert.equal(typeof implementation.createRepositoryOnlyPermanentProcessLocalRegistryStorageExecution, 'function');

          const registry = implementation.createRepositoryOnlyPermanentProcessLocalRegistryStorageExecution();
          assert.equal(registry.processLocalOnly, true);
          assert.equal(registry.ephemeralRegistry, true);
          assert.equal(registry.stateEscapesExecutionProcess, false);

          const register = registry.registerOpaqueContinuationState({
            routeName,
            opaqueStateHandle,
            continuationState
          });
          assert.equal(register.decision,
            'repository_only_permanent_process_local_continuation_state_registered');
          assert.equal(register.continuationStateStored, true);
          assert.equal(register.registryOperationInvoked, true);
          assert.equal(register.registryRegisterExecuted, true);
          assert.equal(register.registryLookupExecuted, false);
          assert.equal(register.registryResolveExecuted, false);
          assert.equal(register.registryReleaseExecuted, false);
          assert.equal(register.entryCount, 1);
          assert.equal(register.replacedExistingEntry, false);
          assert.equal(register.networkExecuted, false);
          assert.equal(register.runtimeActivated, false);
          assert.equal(register.productionChanged, false);

          const resolve = registry.resolveOpaqueContinuationState({ routeName, opaqueStateHandle });
          assert.equal(resolve.decision,
            'repository_only_permanent_process_local_continuation_state_resolved');
          assert.equal(resolve.registryOperationInvoked, true);
          assert.equal(resolve.registryRegisterExecuted, false);
          assert.equal(resolve.registryLookupExecuted, true);
          assert.equal(resolve.registryResolveExecuted, true);
          assert.equal(resolve.registryReleaseExecuted, false);
          assert.equal(resolve.entryCount, 1);
          assert.deepEqual(resolve.resolvedContinuationState, continuationState);
          assert.notEqual(resolve.resolvedContinuationState, continuationState);
          assert.equal(resolve.networkExecuted, false);
          assert.equal(resolve.runtimeActivated, false);
          assert.equal(resolve.productionChanged, false);

          const release = registry.releaseOpaqueContinuationState({ routeName, opaqueStateHandle });
          assert.equal(release.decision,
            'repository_only_permanent_process_local_continuation_state_released');
          assert.equal(release.registryOperationInvoked, true);
          assert.equal(release.registryRegisterExecuted, false);
          assert.equal(release.registryLookupExecuted, false);
          assert.equal(release.registryResolveExecuted, false);
          assert.equal(release.registryReleaseExecuted, true);
          assert.equal(release.entryCount, 0);
          assert.equal(release.networkExecuted, false);
          assert.equal(release.runtimeActivated, false);
          assert.equal(release.productionChanged, false);

          const finalInspection = registry.inspectProcessLocalRegistry();
          assert.equal(finalInspection.entryCount, 0);
          assert.equal(finalInspection.processLocalOnly, true);
          assert.equal(finalInspection.ephemeralRegistry, true);
          assert.equal(finalInspection.stateEscapesExecutionProcess, false);
          assert.equal(finalInspection.rawStateSerialized, false);
          assert.equal(finalInspection.rawStateExported, false);
          assert.equal(finalInspection.networkExecuted, false);
          assert.equal(finalInspection.runtimeActivated, false);
          assert.equal(finalInspection.productionChanged, false);

          const receipt = {
            contractId: 'com-b02cm-repository-only-deterministic-synthetic-permanent-process-local-registry-storage-execution-v1',
            boundaryId: 'COM-B02CM',
            predecessorContractId: implementation.CONTRACT_ID,
            predecessorBoundaryId: implementation.BOUNDARY_ID,
            authorizationConsumed: true,
            executionEffectAcceptedAsAuthorizedBoundary: true,
            synthetic: true,
            deterministic: true,
            routeName,
            opaqueStateHandle,
            factoryInvoked: true,
            operationMethodInvocationPerformed: true,
            registerOperationInvoked: true,
            resolveOperationInvoked: true,
            releaseOperationInvoked: true,
            continuationStateStored: true,
            registryOperationInvoked: true,
            registryRegisterExecuted: true,
            registryLookupExecuted: true,
            registryResolveExecuted: true,
            registryReleaseExecuted: true,
            entryCountAfterRegister: register.entryCount,
            entryCountAfterResolve: resolve.entryCount,
            entryCountAfterRelease: release.entryCount,
            storedStateMatchesExpected: true,
            resolvedStatePresent: Boolean(resolve.resolvedContinuationState),
            resolvedStateMatchesExpected: true,
            entryRetainedAfterResolve: resolve.entryCount === 1,
            entryAbsentAfterRelease: release.entryCount === 0,
            processLocalOnly: true,
            ephemeralRegistry: true,
            stateEscapesExecutionProcess: false,
            rawStateSerialized: false,
            rawStateExported: false,
            executableReferencesSerialized: false,
            executableReferencesExported: false,
            dispatcherRegistryLookupIntegrationPerformed: false,
            resumeSurfaceInvoked: false,
            activeExecuteHandlerInvoked: false,
            repositoryOperationInvoked: false,
            credentialReadExecuted: false,
            rpcExecuted: false,
            networkExecuted: false,
            stagingReadExecuted: false,
            stagingMutationExecuted: false,
            migrationApplied: false,
            runtimeActivated: false,
            realtimeActivated: false,
            productionChanged: false,
            routeRegistryChanged: false,
            moduleRouteLoaderChanged: false,
            routeHandlersChanged: false
          };
          console.log('COM_B02CM_EXECUTION_RECEIPT=' + JSON.stringify(receipt));
          NODE

      - name: Re-freeze repository-only scope after execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$B02CL_HEAD"
          test "$(git diff --name-only "$B02CL_HEAD" HEAD)" = "$TEMP_WORKFLOW"
          test "$(git rev-parse HEAD:$MATRIX_SOURCE)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:$DISPATCHER)" = "$DISPATCHER_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          git diff --check "$B02CL_HEAD" HEAD
