name: COM-B03C-R4F Presence-Only Join Terminal Status Narrowing Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4f.js'
      - 'scripts/test-com-b03c-r4f-presence-only-join-terminal-status-narrowing-readiness.js'
      - 'config/com-b03c-r4f-presence-only-join-terminal-status-narrowing-readiness.json'
      - 'docs/validation/COM-B03C-R4F-PRESENCE-ONLY-JOIN-TERMINAL-STATUS-NARROWING-READINESS.json'
      - 'docs/validation/COM-B03C-R4E-R4C-BRIDGED-RETRY-EXECUTION-AUTHORIZATION-LIFECYCLE-READINESS.json'
      - '.github/workflows/com-b03c-r4f-presence-only-join-terminal-status-narrowing-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

concurrency:
  group: com-b03c-r4f-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4f.js
          node --check scripts/test-com-b03c-r4f-presence-only-join-terminal-status-narrowing-readiness.js
      - name: R4F terminal-status narrowing readiness
        run: node scripts/test-com-b03c-r4f-presence-only-join-terminal-status-narrowing-readiness.js
      - name: No remote authority or trigger surface
        shell: bash
        run: |
          test ! -e config/com-b03c-r4f-single-use-trigger.json
          node - <<'NODE'
          const r4f = require('./backend/modules/communities/community-realtime-private-auth-r4f');
          const config = require('./config/com-b03c-r4f-presence-only-join-terminal-status-narrowing-readiness.json');
          const result = r4f.evaluateRepositoryReadiness(config);
          for (const field of [
            'remoteExecutionAuthority','triggerCreationAuthority','remoteCredentialReadAuthority',
            'remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority',
            'stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority',
            'runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority'
          ]) if (result[field] !== false) process.exit(1);
          NODE
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
