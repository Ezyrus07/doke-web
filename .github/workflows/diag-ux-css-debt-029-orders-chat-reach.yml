name: Doke UX-CSS-DEBT-029 Orders Chat Reach

on:
  push:
    branches:
      - diag/ux-css-debt-029-orders-chat-reach

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: baf6adc3dffcb875ff9442be4c808bad589d4cf4
      TARGET_BLOB: f7d980dd5839493bf5c45a09adcbf654ee51a5ff
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 4

      - name: Preserve harness and checkout exact UX-CSS-DEBT-028 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-029-orders-chat-reach.cjs /tmp/ux-css-debt-029-orders-chat-reach.cjs
          python3 - <<'PY'
          p='/tmp/ux-css-debt-029-orders-chat-reach.cjs'
          s=open(p,encoding='utf-8').read()
          old="assert((js.match(/\\bcreateLayer\\s*\\(/g)||[]).length===1, 'createLayer has a runtime caller; reach assumption invalid');"
          new="assert((js.match(/\\bcreateLayer\\s*\\(/g)||[]).length===0, 'createLayer call count drift');"
          if old not in s:
              raise SystemExit('expected createLayer assertion not found')
          s=s.replace(old,new).replace('STATIC REACH PASS|createLayerLexicalRefs=1','STATIC REACH PASS|createLayerCalls=0')
          open(p,'w',encoding='utf-8').write(s)
          PY
          git fetch origin "${TARGET_SHA}" --depth=1
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object assets/css/pages/pedidos/orders-chat.css)" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CHECKPOINT GUARD PASS|sha=${TARGET_SHA}|blob=${TARGET_BLOB}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Prove reach, cascade and runtime parity
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$PWD/node_modules" node /tmp/ux-css-debt-029-orders-chat-reach.cjs

      - name: Verify exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object assets/css/pages/pedidos/orders-chat.css)" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          echo "FINAL CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0"
