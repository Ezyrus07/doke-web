name: DSP-A04 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/dsp-a04-provider-chargeback-reconciliation-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dsp/dsp-001-baseline-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Regenerate matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Enforce allowlist and commit derivatives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
            'docs/DOMAIN-COMPLETION-MATRIX.md',
            'reports/generated/domain-completion-matrix-report.json'
          }
          changed = []
          for line in subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit('Unexpected files: ' + ', '.join(unexpected))
          missing = sorted(allowed - set(changed))
          if missing:
              raise SystemExit('Expected derivative changes missing: ' + ', '.join(missing))
          PY
          npm run audit:domain-completion-matrix
          git diff --check
          git config user.name "doke-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git commit -m "docs(matrix): include DSP-A05 operator readiness"
          git push origin HEAD:dsp/dsp-001-baseline-audit
