name: DSP-A04 Provider Chargeback Reconciliation Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/dsp-a04-provider-chargeback-reconciliation-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-dsp-a05-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dsp/dsp-001-baseline-audit
          fetch-depth: 0

      - name: Diagnose archive transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          text = Path('.github/workflows/dsp-a05-materialize-temporary.yml').read_text()
          start = text.index("<<'ARCHIVE'")
          payload = text[start:].splitlines()[1]
          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          invalid = [(i, ch, payload[max(0, i-40):i+80]) for i, ch in enumerate(payload) if ch not in allowed]
          print({'payload_length': len(payload), 'length_mod_4': len(payload) % 4, 'invalid_count': len(invalid)})
          for item in invalid[:10]:
              print({'position': item[0], 'char_repr': repr(item[1]), 'context': item[2]})
          try:
              raw = base64.b64decode(payload, validate=True)
              print({'decoded_bytes': len(raw), 'gzip_magic': raw[:2].hex()})
              print({'gzip_uncompressed_bytes': len(gzip.decompress(raw))})
          except Exception as exc:
              print({'decode_error': type(exc).__name__, 'message': str(exc)})
              raise
          PY
