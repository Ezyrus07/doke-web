name: SCHED-B02A Cumulative Audit Transition

on:
  pull_request:
    paths:
      - '.github/workflows/sched-001-b02a-audit-transition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sched-b02a-audit-transition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  transition:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply B02A cumulative audit transition
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const paths = [
            'scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js',
            'scripts/audit-sched-001-a03-reservation-migration-local-contract.js',
            'scripts/audit-sched-001-a04-server-command-runtime.js',
            'scripts/audit-sched-001-a07-history-canary-readiness.js',
            'scripts/audit-ord-001-a10-blocker-reconciliation.js',
            'scripts/audit-ord-001-a11-scheduling-authority-handoff.js'
          ];
          const frozen = "  assert(sched.nextActions[0].includes('trusted server composition root'));";
          const transition = [
            "  if (compareVersions(matrix.version, '1.3.51') >= 0) {",
            "    assert(sched.nextActions[0].includes('authenticated staging composition canary'));",
            '  } else {',
            "    assert(sched.nextActions[0].includes('trusted server composition root'));",
            '  }'
          ].join('\n');
          let changed = 0;
          for (const path of paths) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(transition)) continue;
            if (!source.includes(frozen)) continue;
            source = source.replace(frozen, transition);
            fs.writeFileSync(path, source);
            changed += 1;
          }
          console.log(`SCHED-B02A cumulative auditors transitioned: ${changed}`);
          NODE
          npm run write:domain-completion-matrix
      - name: Validate cumulative scheduling and order contracts
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:sched-001-b02-composition-root-readiness
          npm run test:sched-001-b02-composition-root-runtime
          npm run audit:sched-001-a05-persistence-readiness
          npm run test:sched-001-a05-postgres-repository-runtime
          npm run audit:sched-001-a04-server-command-runtime
          npm run test:sched-001-a04-scheduling-service-runtime
          npm run audit:sched-001-a03-reservation-migration-local-contract
          npm run audit:sched-001-a02-command-event-timezone-conflict-contract
          npm run audit:ord-001-a10-blocker-reconciliation
          npm run audit:ord-001-a11-scheduling-authority-handoff
          npm run audit:sched-001-a07-history-canary-readiness
      - name: Commit validated audit transition
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            scripts/audit-sched-001-a02-command-event-timezone-conflict-contract.js \
            scripts/audit-sched-001-a03-reservation-migration-local-contract.js \
            scripts/audit-sched-001-a04-server-command-runtime.js \
            scripts/audit-sched-001-a07-history-canary-readiness.js \
            scripts/audit-ord-001-a10-blocker-reconciliation.js \
            scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          git add -f reports/generated/domain-completion-matrix-report.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'SCHED_B02A_AUDIT_TRANSITION_ALREADY_APPLIED'
            exit 0
          fi
          git commit -m "test(sched): recognize B02A cumulative matrix state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
