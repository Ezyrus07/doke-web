name: Doke PAY-A18 Matrix Integration Temp

on:
  push:
    branches:
      - 'pay/pay-a18-witness-proof-rehearsal-build'
    paths:
      - '.pay-a18-matrix-integration.request'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-a18-witness-proof-rehearsal-build
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Apply deterministic PAY-A18 metadata integration
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "pay/pay-a18-witness-proof-rehearsal-build"
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const matrixPath = 'config/domain-completion-matrix.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['audit:pay-001-a18-witness-proof-rehearsal-adoption-gate'] = 'node scripts/audit-pay-001-a18-witness-proof-rehearsal-adoption-gate.js';
          pkg.scripts['test:pay-001-a18-witness-proof-rehearsal-adoption-gate'] = 'node scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          if (matrix.version !== '1.3.102') throw new Error('Unexpected matrix baseline: ' + matrix.version);
          matrix.version = '1.3.103';
          matrix.updatedAt = '2026-08-04T11:53:00-03:00';
          const pay = matrix.domains.find((domain) => domain.id === 'PAY-001');
          if (!pay) throw new Error('PAY-001 domain missing');
          const expectedState = {
            maturity: 2,
            userFacingAuthority: 'local',
            serverAuthority: 'contract_only',
            stagingEvidence: 'local_e2e',
            securityGate: 'blocked',
            productionGate: 'blocked'
          };
          for (const [key, value] of Object.entries(expectedState)) {
            if (pay[key] !== value) throw new Error(`PAY-001 ${key} drifted: ${pay[key]}`);
          }
          const blockerIds = pay.blockers.map((item) => item.id);
          if (JSON.stringify(blockerIds) !== JSON.stringify(['PAY-B01', 'PAY-B03', 'PAY-B04'])) throw new Error('PAY blockers drifted');
          const requiredPaths = [
            'backend/modules/payments/payment-reconciliation-witness-proof-rehearsal.js',
            'config/pay-001-a18-witness-proof-rehearsal-adoption-gate.json',
            'tests/fixtures/pay-a18-witness-proof-rehearsal-adoption-gate-cases.json',
            'docs/PAY-001-A18-WITNESS-PROOF-REHEARSAL-ADOPTION-GATE.md',
            'docs/validation/PAY-001-A18-WITNESS-PROOF-REHEARSAL-ADOPTION-GATE.json',
            'scripts/audit-pay-001-a18-witness-proof-rehearsal-adoption-gate.js',
            'scripts/test-pay-001-a18-witness-proof-rehearsal-adoption-gate.js',
            '.github/workflows/pay-001-a18-witness-proof-rehearsal-adoption-gate.yml'
          ];
          for (const value of requiredPaths) if (!pay.requiredPaths.includes(value)) pay.requiredPaths.push(value);
          for (const value of [requiredPaths[0], requiredPaths[2]]) if (!pay.scanRoots.includes(value)) pay.scanRoots.push(value);
          const tests = [
            'audit:pay-001-a18-witness-proof-rehearsal-adoption-gate',
            'test:pay-001-a18-witness-proof-rehearsal-adoption-gate'
          ];
          for (const value of tests) if (!pay.tests.includes(value)) pay.tests.push(value);
          const evidence = 'PAY-A18: interoperable witness profiles, deterministic inclusion and consistency-proof conformance, synthetic forward-only recovery rehearsal attestation and a blocked pre-provider adoption gate passed 54/54 repository-only cases.';
          if (!pay.evidence.includes(evidence)) pay.evidence.push(evidence);
          const reconciliation = pay.blockers.find((item) => item.id === 'PAY-B04');
          reconciliation.description = 'Remote reconciliation infrastructure remains absent. PAY-A08 through PAY-A17 define immutable migrations, phased staging controls, external evidence, executor protocols and trust, issuer status distribution, transparency and forward-only recovery. PAY-A18 adds interoperable witness profiles, inclusion and consistency-proof conformance plus synthetic rehearsal attestation, but no real trust roots, witnesses, transparency log, remote store, lease, scheduler, metrics sink, alert delivery, on-call ownership or staging rehearsal exists.';
          pay.nextActions = [
            'PAY-B03 — obtain legally approved commercial, tax, escrow, refund, dispute and funds-flow decisions before any provider evaluation.',
            'PAY-B01 — keep PSP selection, account creation, credentials, signed webhook registration and provider contact blocked until a separate resource-bound authorization exists.',
            'PAY-B04 — keep remote reconciliation infrastructure, real witnesses, transparency-log publication and staging rehearsal blocked until separately designed and authorized.'
          ];
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');

          const guards = [
            'scripts/audit-pay-001-a06-provider-selection-legal-handoff.js',
            'scripts/audit-pay-001-a07-reconciliation-operations-readiness.js',
            'scripts/audit-pay-001-a08-immutable-migrations-read-only-canary.js',
            'scripts/audit-pay-001-a09-deployment-inspection-handoff.js',
            'scripts/audit-pay-001-a10-external-executor-evidence-ingestion.js',
            'scripts/audit-pay-001-a11-executor-protocol-conformance.js',
            'scripts/audit-pay-001-a12-executor-trust-root-signature.js',
            'scripts/audit-pay-001-a13-executor-lifecycle-governance.js',
            'scripts/audit-pay-001-a14-governance-evidence-chain.js',
            'scripts/audit-pay-001-a15-identity-issuer-lifecycle.js',
            'scripts/audit-pay-001-a16-issuer-status-distribution-resilience.js',
            'scripts/audit-pay-001-a17-transparency-recovery-incident-handoff.js'
          ];
          for (const file of guards) {
            let source = fs.readFileSync(file, 'utf8');
            source = source
              .replaceAll("pay.nextActions[0].includes('PAY-A18')", "pay.nextActions[0].includes('PAY-B03')")
              .replaceAll("'PAY-A18 must be first next action'", "'PAY-B03 must be first next action'")
              .replaceAll("guardSource.includes('PAY-A18')", "guardSource.includes('PAY-B03')");
            if (source.includes("pay.nextActions[0].includes('PAY-A18')")) throw new Error('Stale PAY-A18 next-action guard in ' + file);
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Regenerate and validate matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
      - name: Validate PAY-A06 through PAY-A18
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            audit:pay-001-a06-provider-selection-legal-handoff \
            audit:pay-001-a07-reconciliation-operations-readiness \
            audit:pay-001-a08-immutable-migrations-read-only-canary \
            audit:pay-001-a09-deployment-inspection-handoff \
            audit:pay-001-a10-external-executor-evidence-ingestion \
            audit:pay-001-a11-executor-protocol-conformance \
            audit:pay-001-a12-executor-trust-root-signature \
            audit:pay-001-a13-executor-lifecycle-governance \
            audit:pay-001-a14-governance-evidence-chain \
            audit:pay-001-a15-identity-issuer-lifecycle \
            audit:pay-001-a16-issuer-status-distribution-resilience \
            audit:pay-001-a17-transparency-recovery-incident-handoff \
            audit:pay-001-a18-witness-proof-rehearsal-adoption-gate \
            test:pay-001-a18-witness-proof-rehearsal-adoption-gate
          do
            npm run "$gate"
          done
          git diff --check
      - name: Commit exact clean integration tree
        shell: bash
        run: |
          set -euo pipefail
          rm .pay-a18-matrix-integration.request
          rm .github/workflows/pay-001-a18-matrix-integration-temp.yml
          git add -A -- \
            package.json \
            config/domain-completion-matrix.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/audit-pay-001-a06-provider-selection-legal-handoff.js \
            scripts/audit-pay-001-a07-reconciliation-operations-readiness.js \
            scripts/audit-pay-001-a08-immutable-migrations-read-only-canary.js \
            scripts/audit-pay-001-a09-deployment-inspection-handoff.js \
            scripts/audit-pay-001-a10-external-executor-evidence-ingestion.js \
            scripts/audit-pay-001-a11-executor-protocol-conformance.js \
            scripts/audit-pay-001-a12-executor-trust-root-signature.js \
            scripts/audit-pay-001-a13-executor-lifecycle-governance.js \
            scripts/audit-pay-001-a14-governance-evidence-chain.js \
            scripts/audit-pay-001-a15-identity-issuer-lifecycle.js \
            scripts/audit-pay-001-a16-issuer-status-distribution-resilience.js \
            scripts/audit-pay-001-a17-transparency-recovery-incident-handoff.js \
            .pay-a18-matrix-integration.request \
            .github/workflows/pay-001-a18-matrix-integration-temp.yml
          git diff --cached --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/pay-001-a18-matrix-integration-temp.yml' \
            '.pay-a18-matrix-integration.request' \
            'config/domain-completion-matrix.json' \
            'docs/DOMAIN-COMPLETION-MATRIX.md' \
            'package.json' \
            'reports/generated/domain-completion-matrix-report.json' \
            'scripts/audit-pay-001-a06-provider-selection-legal-handoff.js' \
            'scripts/audit-pay-001-a07-reconciliation-operations-readiness.js' \
            'scripts/audit-pay-001-a08-immutable-migrations-read-only-canary.js' \
            'scripts/audit-pay-001-a09-deployment-inspection-handoff.js' \
            'scripts/audit-pay-001-a10-external-executor-evidence-ingestion.js' \
            'scripts/audit-pay-001-a11-executor-protocol-conformance.js' \
            'scripts/audit-pay-001-a12-executor-trust-root-signature.js' \
            'scripts/audit-pay-001-a13-executor-lifecycle-governance.js' \
            'scripts/audit-pay-001-a14-governance-evidence-chain.js' \
            'scripts/audit-pay-001-a15-identity-issuer-lifecycle.js' \
            'scripts/audit-pay-001-a16-issuer-status-distribution-resilience.js' \
            'scripts/audit-pay-001-a17-transparency-recovery-incident-handoff.js' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate PAY-A18 into canonical completion matrix'
          git push origin HEAD:pay/pay-a18-witness-proof-rehearsal-build
