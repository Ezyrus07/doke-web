name: COM-B02AZ Repository-Only Continuation State Registry Entry Container Inert Instance

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js'
      - 'config/com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.json'
      - 'scripts/test-com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.js'
      - '.github/workflows/com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: feebb2f6a4b041de1c040bc8ed7022d4e7b3f7ae
      PREDECESSOR_TREE: dc104b5f5fefdda165469ff8581586d62fbc393f
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      B02AY_MODULE_BLOB: 96583348127ec79eae90bffd69a14b345ed8c441
      B02AY_CONFIG_BLOB: 2ffeb11579046e96899845b864931bb5ced01552
      B02AX_MODULE_BLOB: 33e7af667457918df2bddc4439b70ef8df1beef1
      B02AW_MODULE_BLOB: 2962453da8857e3ca0be3a2c49455e7012d736a6
      B02AV_MODULE_BLOB: ae5f90bf8e6c185794b83eb268ab2da04a4e8ab9
      B02AU_MODULE_BLOB: 36b552b00bf0b3dea8af24b35fec97c405ede480
      B02AT_MODULE_BLOB: 5c0572ecca18cac3e33e4194fee48c7d3f289234
      B02AR_INSTANCE_BLOB: 762b0c5ed4ffaee24f2375a780e6c1bea7fb65d9
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02AY predecessor and exact repository-only inert-instance scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD
          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js \
            config/com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.json \
            scripts/test-com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.js | sort)"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js \
            config/com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.js | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected_candidate" || test "$actual" = "$expected_final"
          ! printf '%s\n' "$actual" | grep '^supabase/migrations/'
          ! printf '%s\n' "$actual" | grep '^\.github/workflows/temp-'
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-materialization-readiness.js)" = "$B02AY_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02ay-repository-only-continuation-state-registry-storage-backend-entry-container-instance-materialization-readiness.json)" = "$B02AY_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-implementation.js)" = "$B02AX_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-contract.js)" = "$B02AW_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-readiness.js)" = "$B02AV_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-implementation.js)" = "$B02AU_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-contract.js)" = "$B02AT_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance.js)" = "$B02AR_INSTANCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Syntax and semantic B02AZ inert instance conformance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js
          node --check scripts/test-com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.js
          node scripts/test-com-b02az-repository-only-continuation-state-registry-storage-backend-entry-container-inert-instance.js

      - name: Inert instance remains containerless operation-free and side-effect-free
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'storageBackendMaterialized[[:space:]]*:[[:space:]]*true|entryContainerMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true|opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'rawStateSerialized[[:space:]]*:[[:space:]]*true|rawStateExported[[:space:]]*:[[:space:]]*true|executableReferencesExported[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check "$PREDECESSOR_HEAD" HEAD
