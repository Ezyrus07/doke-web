name: TEMP COM-B02BE Observable Certification and Matrix Reconciliation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02be-observable-certification-and-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  certify-reconcile-and-finalize:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: bda8f3319dff512e453abb2c546bc8cc2eb532b7
      CANDIDATE_TREE: 1a985192849eddcf72ced81a089147295a4fbec8
      PREDECESSOR_HEAD: 03084aff2a2daded34c015fa5c0966d4c7ad5bc8
      PREDECESSOR_TREE: 174c266fa5ddd7bba45c5f6bae85fc0ebf307ebf
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      B02BE_MODULE_BLOB: 116aceb2f6ca3f728d39f81e5e5fb4de371a71db
      B02BE_CONFIG_BLOB: 0d54c5b20b8c63901b410b325a5c96b51d16b24d
      B02BE_TEST_BLOB: 32c471e26b381b4d471966ac2415acb77d6e2068
      B02BE_WORKFLOW_BLOB: c8b6c583c84e52cd3be10407cf404cf7a1540d86
      B02BD_MODULE_BLOB: 4dfc1957f1de5edccf6301c4b10fa4ed208cca63
      B02BD_CONFIG_BLOB: 1bf1642345f85f3e696c47cff974c44cd83423bf
      B02BD_TEST_BLOB: dbae3003f8109bfb2555413f61da5818abed266d
      B02BD_WORKFLOW_BLOB: 047fd4b3ec3a40d13464310349ba3e7f887f70b2
      B02BC_MODULE_BLOB: 43bde8dbed4a82de957b06fb45e3678b31a43ea2
      B02AZ_INSTANCE_BLOB: 35e2bbe0b983d6a249bc7f8cb4ee157d3b85d654
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02be-observable-certification-and-matrix-reconciliation.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02BE candidate lineage and temporary-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js \
            config/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.json \
            scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js | sort)"
          actual_candidate="$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)"
          test "$actual_candidate" = "$expected_candidate"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js)" = "$B02BE_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.json)" = "$B02BE_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js)" = "$B02BE_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.yml)" = "$B02BE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js)" = "$B02BD_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.json)" = "$B02BD_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js)" = "$B02BD_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.yml)" = "$B02BD_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js)" = "$B02BC_MODULE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js)" = "$B02AZ_INSTANCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prove B02BE semantics and hard blocks before Matrix handling
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js
          TEST=scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|attachmentAppliedToEntryContainerInstance[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableMethodReferenceMaterialized[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'entryContainerMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          git diff --check "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD"

      - name: Audit Matrix and reconcile only an isolated stale derived-artifact failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          MATRIX_OUTPUT="$(npm run audit:domain-completion-matrix 2>&1)"
          MATRIX_STATUS=$?
          set -e
          printf '%s\n' "$MATRIX_OUTPUT"
          if [ "$MATRIX_STATUS" -eq 0 ]; then
            echo 'Matrix already fresh; no derived regeneration required.'
            exit 0
          fi
          mapfile -t FAILURES < <(printf '%s\n' "$MATRIX_OUTPUT" | sed -n 's/^[[:space:]]*-[[:space:]]*/- /p')
          test "${#FAILURES[@]}" -eq 1
          test "${FAILURES[0]}" = '- docs/DOMAIN-COMPLETION-MATRIX.md is stale; run npm run write:domain-completion-matrix'
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$changed" = "$expected"

      - name: Validate permanent artifacts and governance before commit
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js
          git diff --check "$PREDECESSOR_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Commit permanent derived artifacts and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md; then git add -- docs/DOMAIN-COMPLETION-MATRIX.md; fi
          if ! git diff --quiet -- reports/generated/domain-completion-matrix-report.json; then git add -f -- reports/generated/domain-completion-matrix-report.json; fi
          git rm -- "$TEMP_PATH"
          git commit -m 'docs(com): reconcile B02BE derived matrix artifacts and remove TEMP'
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02be-'
          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js \
            config/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.json \
            scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js | sort)"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js \
            config/com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js | sort)"
          actual_final="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual_final" = "$expected_candidate" || test "$actual_final" = "$expected_final"

      - name: Certify exact permanent B02BE tree
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js
          TEST=scripts/test-com-b02be-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-inert-attachment.js
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02be-'
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          git commit --allow-empty -m "ci(com): certify B02BE final tree [run ${GITHUB_RUN_ID}]"
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_TREE"

      - name: Fast-forward branch only if temporary head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
