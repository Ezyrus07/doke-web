name: COM-B02Y Domain Completion Matrix Finalization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02y-domain-completion-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: com-b02y-domain-completion-matrix-finalization-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT_HEAD: 78cac8da2132691e1c27d70d1bd2103a1399ea39
  EXPECTED_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
  EXPECTED_B02Y_HELPER_BLOB: 00d8d8e62dfb7c30b70753f83fa172f3953aad83
  EXPECTED_B02Y_CONFIG_BLOB: bfc98f91d0aa0d87ab002b8a5826ec76201efaeb
  EXPECTED_B02Y_TEST_BLOB: b793ba0ac8feaf5179712686bcedb119cebac793
  EXPECTED_B02Y_CERTIFIER_BLOB: b6cd243d922a8b9bc2cc993aa6f7eabbaee42a1e
  EXPECTED_MARKDOWN_BLOB: 896c2e5c7d7963dc2b7c8442f0ba38183e95e61a
  EXPECTED_REPORT_BLOB: efa3975837c65637a18059778dfefe51e5395f85

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate exact B02Y derivatives and fast-forward final snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='com/com-001-baseline-audit'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-begin-dispatcher.js)" = "$EXPECTED_B02Y_HELPER_BLOB"
          test "$(git rev-parse HEAD:config/com-b02y-repository-only-route-begin-dispatch-integration.json)" = "$EXPECTED_B02Y_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02y-repository-only-route-begin-dispatch-integration.js)" = "$EXPECTED_B02Y_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02y-repository-only-route-begin-dispatch-integration.yml)" = "$EXPECTED_B02Y_CERTIFIER_BLOB"

          rm .github/workflows/com-b02y-domain-completion-matrix-materialization-temp.yml
          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json

          test "$(git hash-object docs/DOMAIN-COMPLETION-MATRIX.md)" = "$EXPECTED_MARKDOWN_BLOB"
          test "$(git hash-object reports/generated/domain-completion-matrix-report.json)" = "$EXPECTED_REPORT_BLOB"

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02y-domain-completion-matrix-materialization-temp.yml \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"

          node scripts/test-com-b02y-repository-only-route-begin-dispatch-integration.js
          npm ci --ignore-scripts
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -u .github/workflows/com-b02y-domain-completion-matrix-materialization-temp.yml
          git commit -m 'docs(com): reconcile B02Y Domain Completion Matrix derivatives'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"refs/heads/$BRANCH"
