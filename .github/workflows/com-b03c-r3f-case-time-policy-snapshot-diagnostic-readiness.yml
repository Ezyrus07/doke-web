name: COM-B03C-R3F Case-Time Policy Snapshot Diagnostic Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - backend/modules/communities/community-realtime-private-auth-r3f.js
      - config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
      - scripts/execute-com-b03c-r3f-case-time-policy-snapshot-diagnostic.js
      - scripts/verify-com-b03c-r3f-case-time-policy-snapshot-evidence.js
      - scripts/test-com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.js
      - docs/validation/COM-B03C-R3F-CASE-TIME-POLICY-SNAPSHOT-DIAGNOSTIC-READINESS.json
      - .github/workflows/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.yml
      - backend/modules/communities/community-realtime-private-auth-r3e.js
      - docs/validation/COM-B03C-R3E-CASE-TIME-POLICY-SNAPSHOT-READINESS.json

permissions: { contents: write }

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3f.js
          node --check scripts/execute-com-b03c-r3f-case-time-policy-snapshot-diagnostic.js
          node --check scripts/verify-com-b03c-r3f-case-time-policy-snapshot-evidence.js
          node --check scripts/test-com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.js
      - name: COM-B03C-R3F repository diagnostic implementation readiness
        run: node scripts/test-com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.js
      - name: Repository-only synthetic executor self-test
        run: node scripts/execute-com-b03c-r3f-case-time-policy-snapshot-diagnostic.js --repository-self-test
      - name: Pre-authorization remote execution hard-block
        shell: bash
        run: |
          set +e
          output="$(node scripts/execute-com-b03c-r3f-case-time-policy-snapshot-diagnostic.js 2>&1)"
          code=$?
          set -e
          test "$code" -ne 0
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R3F_STAGING_AUTHORIZATION_REQUIRED'
      - name: Canonical domain completion matrix writer
        run: |
          npm run write:domain-completion-matrix
          allowed='^(docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json)$'
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed" | grep -Ev "$allowed" > /tmp/r3f-unexpected || true
            test ! -s /tmp/r3f-unexpected
            git config user.name doke
            git config user.email bielantoniomma@gmail.com
            git add docs/DOMAIN-COMPLETION-MATRIX.md
            git add -f reports/generated/domain-completion-matrix-report.json
            test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -le 2
            git commit -m 'docs(gov): regenerate domain completion matrix for COM-B03C-R3F'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Domain completion matrix audit
        run: npm run audit:domain-completion-matrix
      - name: Agent governance audit
        run: npm run audit:agent-governance
      - name: Governance invariants
        run: |
          grep -q '"matrixVersion": "1.3.113"' config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
          grep -q '"maturity": 3' config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
          grep -q '"productionGate": "blocked"' config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
          grep -q '"stagingReadAuthority": false' config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
          grep -q '"authorizationPhraseDefined": false' config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
          grep -q '"remoteConnectorCreated": false' config/com-b03c-r3f-case-time-policy-snapshot-diagnostic-readiness.json
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
