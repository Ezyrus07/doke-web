name: 0000 TEMP COM-B02CD Read-Only Matrix Materialization

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/0000-temp-com-b02cd-read-only-matrix-materialization.yml'

permissions:
  contents: read

jobs:
  materialize-derived-matrix-read-only:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: 0590e64b75a640880ac00485d2a678b6ac3092e7
      PREDECESSOR_TREE: 3e0122015344206918cf4a06047730d8e92e88e1
      REGISTER_PROOF_HEAD: f671d8a93157353bb58b5edf8a4351706461d0ac
      REGISTER_PROOF_TREE: fa4fe8ce737e941dcad4944d496e511e37ab1267
      REGISTER_PROOF_RUN_ID: '32652016270'
      REGISTER_PROOF_JOB_ID: '97224998719'
      SAFE_HEAD: 2016a641cd6285a25e419e9ed271e87895f6cf56
      SAFE_TREE: ae50ab73c72955a9d30a4d2f705d3f77e68a0807
      TEMP_PATH: .github/workflows/0000-temp-com-b02cd-read-only-matrix-materialization.yml
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-deterministic-synthetic-continuation-state-register-execution.js
      CONFIG: config/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.json
      TEST: scripts/test-com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.js
      WORKFLOW: .github/workflows/com-b02cd-repository-only-deterministic-synthetic-continuation-state-register-execution.yml
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TARGET_BLOB: 32f067ac1dd024eedd95b78097ea4609c82da377
      CONFIG_BLOB: 589a5d1bcc0ac69f362d2aa8c707eaddf91976e4
      TEST_BLOB: ddbfe3da52335e612d5c6bce4bae2fcb7f21b312
      SAFE_WORKFLOW_BLOB: dd567ed45880e0812d8435b17e303b5a4f9785ff

    steps:
      - name: Checkout exact temporary head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze consumed register proof and TEMP-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse "$REGISTER_PROOF_HEAD^{tree}")" = "$REGISTER_PROOF_TREE"
          test "$(git rev-parse "$SAFE_HEAD^{tree}")" = "$SAFE_TREE"
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD
          git merge-base --is-ancestor "$REGISTER_PROOF_HEAD" HEAD
          git merge-base --is-ancestor "$SAFE_HEAD" HEAD
          test "$(git diff --name-only "$SAFE_HEAD" HEAD)" = "$TEMP_PATH"
          test "$(git rev-parse HEAD:$TARGET)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:$CONFIG)" = "$CONFIG_BLOB"
          test "$(git rev-parse HEAD:$TEST)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:$WORKFLOW)" = "$SAFE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Re-certify consumed proof statically without executing register
        shell: bash
        run: |
          set -euo pipefail
          test "$REGISTER_PROOF_RUN_ID" = '32652016270'
          test "$REGISTER_PROOF_JOB_ID" = '97224998719'
          node --check "$TARGET"
          node --check "$TEST"
          grep -F 'registry.set(key, storedState);' "$TARGET"
          grep -F "assert.equal(result.registryRegisterExecuted, true);" "$TEST"
          grep -F '"registryLookupAuthority": false' "$CONFIG"
          grep -F '"registryReleaseAuthority": false' "$CONFIG"
          ! grep -F 'node "$TEST"' "$WORKFLOW"
          ! grep -F 'executeRepositoryOnlyDeterministicSyntheticRegister()' "$WORKFLOW"
          ! grep -E 'resolveOpaqueContinuationState\(|releaseOpaqueContinuationState\(' "$TARGET" "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET" "$TEST"

      - name: Materialize and certify only Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          git diff --quiet -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
          echo "MATRIX_MD_GIT_BLOB=$(git hash-object "$MATRIX_MD")"
          echo "MATRIX_REPORT_GIT_BLOB=$(git hash-object "$MATRIX_REPORT")"
          echo "MATRIX_MD_GZIP_BASE64_BEGIN"
          gzip -c "$MATRIX_MD" | base64 -w0
          echo
          echo "MATRIX_MD_GZIP_BASE64_END"
          echo "MATRIX_REPORT_GZIP_BASE64_BEGIN"
          gzip -c "$MATRIX_REPORT" | base64 -w0
          echo
          echo "MATRIX_REPORT_GZIP_BASE64_END"
