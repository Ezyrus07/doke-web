name: COM-B02S Command Handler Repository Binding Surface Matrix Materialization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02s-command-handler-repository-binding-surface-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=519f11e9fd21c9db3ca945c336dd2d6ad8b85037
          temp=.github/workflows/com-b02s-command-handler-repository-binding-surface-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-binding-surface.js)" = "0778690aaaf428247159a08eac83a38796888f41"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "de55f9f2782aefacbef4c60fb5ac3d3f4c7293aa"
          test "$(git rev-parse HEAD:config/com-b02s-command-handler-repository-binding-surface.json)" = "9ce3b9e29d3e30b0e72567d856d96641e224cd67"
          test "$(git rev-parse HEAD:scripts/test-com-b02s-command-handler-repository-binding-surface.js)" = "4daadbde0c00a828606fee472248d234a0e0b877"
          test "$(git rev-parse HEAD:.github/workflows/com-b02s-command-handler-repository-binding-surface.yml)" = "c97ca424dda46a3617ca49382b444329577b9a3f"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-repository-binding-composition.js)" = "cfc3bd8790d99b1ee61bf52fa93fd2bb2a6bf3bc"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02s-command-handler-repository-binding-surface-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed B02S assertions
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/community-command-handler-repository-binding-surface.js
          test "$(git rev-parse HEAD:$TARGET)" = "0778690aaaf428247159a08eac83a38796888f41"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "de55f9f2782aefacbef4c60fb5ac3d3f4c7293aa"
          test "$(git rev-parse HEAD:config/com-b02s-command-handler-repository-binding-surface.json)" = "9ce3b9e29d3e30b0e72567d856d96641e224cd67"
          test "$(git rev-parse HEAD:scripts/test-com-b02s-command-handler-repository-binding-surface.js)" = "4daadbde0c00a828606fee472248d234a0e0b877"
          test "$(git rev-parse HEAD:.github/workflows/com-b02s-command-handler-repository-binding-surface.yml)" = "c97ca424dda46a3617ca49382b444329577b9a3f"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-repository-binding-composition.js)" = "cfc3bd8790d99b1ee61bf52fa93fd2bb2a6bf3bc"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          node --check "$TARGET"
          node --check backend/modules/communities/route-handlers.js
          node --check scripts/test-com-b02s-command-handler-repository-binding-surface.js
          node scripts/test-com-b02s-command-handler-repository-binding-surface.js
          ! grep -E 'process\.env|Deno\.env|Bun\.env|createClient\(|fetch\(|https?://|SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.rpc\(' "$TARGET"
          grep -F "runtimeRepositoryComposition.beginComposition" "$TARGET"
          grep -F "repositoryOperationInvoked: false" "$TARGET"
          grep -F "runtimeActivated: false" "$TARGET"
          git diff -U0 abfd04593530ce945be0f8db2f3077bc6f2e8f12 HEAD -- backend/modules/communities/route-handlers.js > /tmp/b02s-route-handlers.diff
          ! grep -E '^[+-].*(B02F_FAILURE_CODE|createB02FBlockedRouteError|executeMembershipCommand|executeGovernanceCommand|executeContentCommand|stagingTrafficEnabled|realCommunityMutationEnabled|realtimeEnabled)' /tmp/b02s-route-handlers.diff
          ! git diff --name-only abfd04593530ce945be0f8db2f3077bc6f2e8f12 HEAD | grep '^supabase/migrations/'

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02s-command-handler-repository-binding-surface-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for B02S handler surface binding" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
