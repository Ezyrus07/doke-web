name: Temporary SEARCH-A10 applicator

on:
  pull_request:
    branches:
      - 'cat/**'
    paths:
      - '.search-a10-payload.part*'
      - '.github/workflows/search-a10-apply.yml'

permissions:
  contents: write

concurrency:
  group: doke-search-a10-applicator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify complete controlled payload
        shell: bash
        run: |
          set -euo pipefail
          for part in 00a 00b 01 02 03 04; do
            test -f ".search-a10-payload.part${part}"
          done
          test "$(git hash-object .search-a10-payload.part00a)" = '2155d7645affe8c3525b7897d491cfe529724533'
          test "$(git hash-object .search-a10-payload.part00b)" = '78efd8baa338fdaf4b601e25df6b3af1b8157af3'
          test "$(git hash-object .search-a10-payload.part01)" = '88473790781a83d31d9720712e6a926cc64738c2'
          test "$(git hash-object .search-a10-payload.part02)" = '58e27f3296b0f4deca24e35ead6b238c74aaa7d7'
          test "$(git hash-object .search-a10-payload.part03)" = 'c0c751c60ac49d8464f3fe0cbd8898b8ecc9867d'
          test "$(git hash-object .search-a10-payload.part04)" = '96ad101fd4385a0d3a64f851de2c54f7ddc44873'
          cat .search-a10-payload.part00a .search-a10-payload.part00b .search-a10-payload.part01 .search-a10-payload.part02 .search-a10-payload.part03 .search-a10-payload.part04 > /tmp/search-a10-payload.b64
          base64 -d /tmp/search-a10-payload.b64 > /tmp/search-a10-payload.tar.gz
          echo 'ff700cc75cde0d45040ebc543e0f4d282f60497ea77dc73880a0e5cc29705007  /tmp/search-a10-payload.tar.gz' | sha256sum -c -
          if tar -tzf /tmp/search-a10-payload.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe payload path detected.' >&2
            exit 1
          fi

      - name: Extract controlled payload
        run: tar -xzf /tmp/search-a10-payload.tar.gz

      - name: Validate SEARCH-A10 candidate
        run: |
          node --check assets/js/core/supabase-config.js
          node --check assets/js/repositories/search-repository.js
          node --check assets/js/pages/resultados-data-controller.js
          node --check assets/js/pages/search/server-results-surface.js
          node --check scripts/audit-search-results-server-activation.js
          node --check scripts/audit-search-browser-cutover-v2.js
          node --check scripts/test-search-browser-cutover-runtime.js
          node --check tests/search/search-results-staging.spec.js
          node scripts/audit-search-results-server-activation.js
          node scripts/audit-search-browser-cutover-v2.js
          node scripts/test-search-browser-cutover-runtime.js
          git diff --check

      - name: Publish non-workflow SEARCH-A10 candidate
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/search-results-staging-browser.yml
          chmod 0644 assets/js/core/supabase-config.js
          chmod 0644 assets/js/repositories/search-repository.js
          chmod 0644 assets/js/pages/resultados-data-controller.js
          chmod 0644 assets/js/pages/search/server-results-surface.js
          chmod 0644 scripts/audit-search-results-server-activation.js
          chmod 0644 scripts/audit-search-browser-cutover-v2.js
          chmod 0644 scripts/test-search-browser-cutover-runtime.js
          chmod 0644 tests/search/search-results-staging.spec.js
          chmod 0644 docs/validation/SEARCH-001-A10-BROWSER-CUTOVER-V2.json
          rm -f .search-a10-payload.part00 .search-a10-payload.part00a .search-a10-payload.part00b
          rm -f .search-a10-payload.part01 .search-a10-payload.part02 .search-a10-payload.part03 .search-a10-payload.part04
          git add -A
          git reset -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement SEARCH-A10 controlled browser cutover'
          git push origin HEAD:${TARGET_BRANCH}
