name: ANA domain matrix refresh one-shot

on:
  push:
    branches:
      - ana/ana-001-foundation
    paths:
      - '.github/workflows/ana-domain-matrix-refresh-one-shot.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ana/ana-001-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate deterministic matrix
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix

      - name: Commit generated outputs
        run: |
          git config user.name "doke-automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git diff --cached --check
          git commit -m "chore(ana): regenerate domain completion matrix"
          git push origin HEAD:ana/ana-001-foundation
