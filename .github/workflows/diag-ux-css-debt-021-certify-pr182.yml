name: Doke UX-CSS-DEBT-021 PR182 Exact Certification

on:
  push:
    branches:
      - diag/ux-css-debt-021-certify-pr182

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: f29547f405cad765f8cac75d52d59bd3575f469f
      PARENT_SHA: 928b74a947a7301f9a645d1f316ad3a3f6e37b1e
      BASE_BRANCH: ux/ux-css-debt-020-carteira-static-shadow-compaction
      HEAD_BRANCH: ux/ux-css-debt-021-detalhe-related-heading-mobile-compaction
      TARGET_FILE: assets/css/pages/detalhe-anuncio-related-sections.css
      TARGET_SELECTOR: 'body[data-page="detalhe-anuncio"] :is( .detail-section--ad-workers, .detail-section--ad-publications, .detail-section--similar-ads ) .detail-related-section-heading .section-heading__title.home-section-title'
      PARENT_SHA256: 75dad013a3c75a04a334217c25ce4c8f9b5c056fd4c7fdfa5c78981a33b99b3f
      TARGET_SHA256: a3e2b022f8615e9c5e5e550fa86f2e256e0aa42af47162f0219db9fbec08fbf5
      PROJECT_KEY: Ezyrus07_doke-web
      PR_NUMBER: '182'
    steps:
      - name: Checkout exact permanent SHA with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact one-commit product-only tree and Sonar base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git rev-list --count "${PARENT_SHA}"..HEAD)" = "1"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $2}')" = "2"
          test -z "$(git diff --name-only "${PARENT_SHA}"...HEAD -- package.json package-lock.json)"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"
          test "$(git merge-base "${TARGET_SHA}" "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${TARGET_SHA256}"
          git diff --check "${PARENT_SHA}"...HEAD
          echo 'EXACT TREE + SONAR SCOPE GUARD PASS'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Record explicit dependency advisory snapshot
        shell: bash
        run: |
          set -uo pipefail
          code=0
          npm audit --json >/tmp/npm-audit-pr182.json 2>/tmp/npm-audit-pr182.err || code=$?
          echo "npm audit exit=${code} (non-blocking; package files unchanged)"
          node - <<'NODE'
          const fs=require('fs');try{const a=JSON.parse(fs.readFileSync('/tmp/npm-audit-pr182.json','utf8'));console.log('npm audit metadata='+JSON.stringify(a.metadata?.vulnerabilities||{}));}catch(e){console.log('npm audit snapshot unavailable: '+e.message)}
          NODE
          exit 0

      - name: Prove permanent equals deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git show "${PARENT_SHA}:${TARGET_FILE}" >/tmp/parent.css
          cp "${TARGET_FILE}" /tmp/permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const parent=fs.readFileSync('/tmp/parent.css','utf8'),target=fs.readFileSync('/tmp/permanent.css','utf8'),lines=parent.split(/\r?\n/);
          if(sha(parent)!==process.env.PARENT_SHA256||Buffer.byteLength(parent)!==34103)throw new Error('parent drift');
          if(lines[100].trim()!=='font-size: var(--doke-section-title-size, 0.96rem);'||lines[101].trim()!=='letter-spacing: var(--doke-section-title-letter, 0.08em);')throw new Error('dead-row drift');
          const rebuilt=lines.filter((_l,i)=>i!==100&&i!==101).join('\n');
          if(rebuilt!==target)throw new Error('permanent differs from deterministic candidate');
          if(sha(target)!==process.env.TARGET_SHA256||Buffer.byteLength(target)!==33985)throw new Error('permanent hash/bytes drift');
          const decl=s=>(s.match(/^\s*[\w-]+\s*:\s*.*;\s*$/gm)||[]).length;
          if(decl(parent)!==549||decl(target)!==547)throw new Error(`declaration drift ${decl(parent)}->${decl(target)}`);
          console.log('EXACT DELETION-ONLY PROOF PASS: 549->547; -2; bytes34103->33985; target hash exact');
          NODE

      - name: Write deterministic Detalhe Anuncio runtime capture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/capture-pr182.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2],mediaExpected=Number(process.argv[3]),selector=process.env.TARGET_SELECTOR;
          const vps=[['1600',1600,1000],['1280',1280,802],['1024',1024,900],['820',820,1180],['761',761,900],['760',760,900],['608',608,926],['390',390,844]],sleep=ms=>new Promise(r=>setTimeout(r,ms)),srv=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          (async()=>{await sleep(500);const b=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const result={};let mobile=0;for(const [name,w,h] of vps){const c=await b.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'}),p=await c.newPage();await p.route('**/*',r=>{const u=new URL(r.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return r.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return r.continue();return r.abort();});await p.goto('http://127.0.0.1:5500/detalhe-anuncio.html',{waitUntil:'domcontentloaded',timeout:15000});await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});const s=await p.evaluate(selector=>{const canon=s=>(s||'').replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s*,\s*/g,',').trim(),hits=[],nodes=[...document.querySelectorAll(selector)];function walk(rs,ctx,href){for(const r of [...rs]){if(r.constructor?.name==='CSSImportRule'&&r.styleSheet){try{walk(r.styleSheet.cssRules,ctx,r.styleSheet.href||href)}catch{}}else if(r.constructor?.name==='CSSMediaRule')walk(r.cssRules,[...ctx,`@media ${r.conditionText}`],href);else if(canon(r.selectorText)===canon(selector)){for(const prop of ['font-size','letter-spacing']){const value=r.style?.getPropertyValue(prop);if(value)hits.push({href,ctx:ctx.join(' || '),prop,value:value.trim(),priority:r.style.getPropertyPriority(prop)});}}}for(const st of [...document.styleSheets])try{walk(st.cssRules,[],st.href||'inline')}catch{}const de=document.documentElement,body=document.body;return{mobile:matchMedia('(max-width: 760px)').matches,nodes:nodes.map(n=>{const cs=getComputedStyle(n),r=n.getBoundingClientRect();return{className:n.className,fontSize:cs.fontSize,letterSpacing:cs.letterSpacing,lineHeight:cs.lineHeight,rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]}}),doc:[de.scrollWidth,de.scrollHeight,de.clientWidth,de.clientHeight],body:[body.scrollWidth,body.scrollHeight,body.clientWidth,body.clientHeight],hits:hits.filter(x=>String(x.href).includes('/assets/css/pages/detalhe-anuncio-related-sections.css'))};},selector);if(!s.nodes.length)throw new Error(`selector absent ${name}`);const media=s.hits.filter(x=>x.ctx==='@media (max-width: 760px)');if(media.length!==mediaExpected)throw new Error(`media ${name}=${media.length}/${mediaExpected}`);const f=media.filter(x=>x.prop==='font-size'),l=media.filter(x=>x.prop==='letter-spacing');if(mediaExpected===4){if(f.length!==2||l.length!==2||f[0].value!=='var(--doke-section-title-size, 0.96rem)'||f[1].value!=='13px'||l[0].value!=='var(--doke-section-title-letter, 0.08em)'||l[1].value!=='0.06em')throw new Error(`parent cascade ${name}`);}else if(f.length!==1||l.length!==1||f[0].value!=='13px'||l[0].value!=='0.06em')throw new Error(`permanent cascade ${name}`);if(media.some(x=>x.priority!==''))throw new Error(`priority ${name}`);if(s.mobile)mobile++;const{hits,...stable}=s;result[name]=stable;await c.close();}await b.close();srv.kill('SIGTERM');if(mobile!==3)throw new Error(`mobile=${mobile}`);fs.writeFileSync(out,JSON.stringify(result));console.log(`CAPTURE PASS expected=${mediaExpected} viewports=8 mobile=3`);})().catch(e=>{srv.kill('SIGTERM');console.error(e);process.exit(1)});
          NODE
          node --check /tmp/capture-pr182.js

      - name: Capture parent runtime and responsive baseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent.css "${TARGET_FILE}"
          node /tmp/capture-pr182.js /tmp/parent-runtime.json 4
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/parent-responsive.json
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/parent-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/parent-conflicts.log

      - name: Restore permanent and require exact runtime parity
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/permanent.css "${TARGET_FILE}"
          node /tmp/capture-pr182.js /tmp/permanent-runtime.json 2
          node - <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/permanent-runtime.json'));if(JSON.stringify(a)!==JSON.stringify(b)){console.error('runtime mismatch');process.exit(1)}console.log('PERMANENT COMPUTED-STYLE + BOUNDING-RECT + DOCUMENT-GEOMETRY PARITY PASS: 0 diffs');
          NODE

      - name: Preserve responsive contract without rebaseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log

      - name: Validate permanent governance and residual inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:agent-governance
          npm run audit:active-legacy-structures | tee /tmp/legacy.log
          grep -q 'css files: 533 (55 direct, 401 active/imported)' /tmp/legacy.log
          grep -q 'active legacy/remediation css: 0' /tmp/legacy.log
          grep -q 'active legacy/remediation js: 0' /tmp/legacy.log
          grep -q 'high risk active css: 37' /tmp/legacy.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),target=process.env.TARGET_FILE,report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css')),ir=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));},meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;ir.lastIndex=0;while((m=ir.exec(text)))imports.push(norm(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n);}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10;});function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null,ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,n=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(const line of lines){const t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:n(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:n([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=n(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim();ds.push({sel,prop:m[1].toLowerCase(),imp:/\s*!important\s*$/i.test(raw),ctx:stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ')});}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.ctx}>${d.sel}>${d.prop}`,l=last.get(k);if(l&&(!d.imp||l.imp))dead++;if(!l||d.imp||!l.imp)last.set(k,d);}return{decl:ds.length,dead};}const rows=[...active].map(f=>({f,...parse(meta.get(f).text)})).filter(r=>r.dead>0),total=rows.reduce((n,r)=>n+r.dead,0),highResidual=rows.filter(r=>high.includes(r.f)),t=parse(meta.get(target).text);if(active.size!==401||high.length!==37||rows.length!==53||total!==1306||highResidual.length!==0||t.decl!==547||t.dead!==0)throw new Error(`residual drift active=${active.size} high=${high.length} files=${rows.length} dead=${total} highResidual=${highResidual.length} target=${t.decl}/${t.dead}`);console.log('PERMANENT RESIDUAL PASS: active=401 highRisk=37 filesWithDead=53 superseded=1306 highRiskWithDead=0 target=547/dead0');
          NODE

      - name: Reset generated outputs to exact permanent SHA before Sonar
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain)"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${TARGET_SHA256}"
          test "$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"
          test "$(git merge-base "${TARGET_SHA}" "refs/remotes/origin/${BASE_BRANCH}")" = "${PARENT_SHA}"

      - name: Require Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}"

      - name: Analyze PR 182 exact SHA and enforce SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        with:
          skipSignatureVerification: true
          args: >-
            -Dsonar.projectKey=${{ env.PROJECT_KEY }}
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.HEAD_BRANCH }}
            -Dsonar.pullrequest.base=${{ env.BASE_BRANCH }}
            -Dsonar.scm.revision=${{ env.TARGET_SHA }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify Sonar API final PR gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${SONAR_TOKEN}" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&pullRequest=${PR_NUMBER}" -o /tmp/qg.json
          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/qg.json'))['projectStatus']; print('QG API status='+str(d.get('status'))); failed=[]
          for c in d.get('conditions',[]):
              print('QG condition metric={metricKey} status={status} actual={actualValue} threshold={errorThreshold} op={comparator}'.format(**c))
              if c.get('status') not in ('OK','NO_VALUE'): failed.append(c)
          if d.get('status')!='OK' or failed: sys.exit(1)
          print('SONAR PR182 FINAL QUALITY GATE PASS')
          PY
