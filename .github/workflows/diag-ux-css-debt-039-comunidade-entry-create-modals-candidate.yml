name: Doke UX-CSS-DEBT-039 Comunidade Entry Create Modals Candidate

on:
  push:
    branches:
      - diag/ux-css-debt-039-comunidade-entry-create-modals-candidate

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 721c8036a7f1a23208f512ce5a6f4b532209595a
      PARENT_SHA: 2c2b87e287a2df5f261be5cc9f94439ed9719145
      TARGET_BLOB: 9dea353aa056080433035b044d9c92fb83f80062
      TARGET_FILE: assets/css/pages/comunidade/entry-create-modals.css
      AUTHORITY_DOC_A: docs/PAGE-ASSET-AUTHORITY-MATRIX.md
      AUTHORITY_DOC_B: docs/HOME-AUTHORITY-CLASSIFICATION.md
      AUTHORITY_DOC_A_REGEN_HASH: 345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6
      AUTHORITY_DOC_B_REGEN_HASH: b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 5

      - name: Preserve helpers and checkout exact UX-CSS-DEBT-038 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-039-candidate.cjs /tmp/ux-css-debt-039-candidate.cjs
          cp .github/diagnostics/ux-css-debt-039-candidate-residual.cjs /tmp/ux-css-debt-039-candidate-residual.cjs
          node --check /tmp/ux-css-debt-039-candidate.cjs
          node --check /tmp/ux-css-debt-039-candidate-residual.cjs
          git fetch origin "${TARGET_SHA}" --depth=2
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CANDIDATE PARENT PASS|sha=${TARGET_SHA}|parent=${PARENT_SHA}|blob=${TARGET_BLOB}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate parent baselines
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          echo "PARENT BASELINES PASS|active=generated|responsiveBaseline=generated"

      - name: Build exact ephemeral candidate
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/ux-css-debt-039-candidate.cjs | tee /tmp/candidate-build.log
          grep -q 'CANDIDATE BUILD PASS' /tmp/candidate-build.log
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}")" = $'0\t192\t'"${TARGET_FILE}"
          git diff --check

      - name: Responsive contract on candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:responsive-contract | tee /tmp/responsive.log
          grep -q 'Responsive contract test: PASS' /tmp/responsive.log
          grep -q 'Checks: 893' /tmp/responsive.log
          grep -q 'Failures: 0' /tmp/responsive.log
          grep -q 'Skips: 277' /tmp/responsive.log
          echo 'RESPONSIVE CANDIDATE PASS|checks=893|failures=0|skips=277'

      - name: Governance contracts on candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          conflicts="$(sed -n 's/.*Conflicting class\/property pairs: \([0-9][0-9]*\).*/\1/p' /tmp/conflicts.log | tail -1)"
          test -n "$conflicts"
          test "$conflicts" -le 339
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo "GOVERNANCE CANDIDATE PASS|conflicts=$conflicts|domain=23/15/2.91/12|duplicates=0/0"

      - name: Isolate parent-stale authority-doc regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${AUTHORITY_DOC_A}" | awk '{print $1}')" = "${AUTHORITY_DOC_A_REGEN_HASH}"
          test "$(sha256sum "${AUTHORITY_DOC_B}" | awk '{print $1}')" = "${AUTHORITY_DOC_B_REGEN_HASH}"
          test -n "$(git diff --name-only -- "${AUTHORITY_DOC_A}")"
          test -n "$(git diff --name-only -- "${AUTHORITY_DOC_B}")"
          git checkout "${TARGET_SHA}" -- "${AUTHORITY_DOC_A}" "${AUTHORITY_DOC_B}"
          test -z "$(git diff --name-only -- "${AUTHORITY_DOC_A}" "${AUTHORITY_DOC_B}")"
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          echo "AUTHORITY DOC BASELINE ISOLATION PASS|candidateSemanticDocDelta=0|parentGeneratedHashes=${AUTHORITY_DOC_A_REGEN_HASH}/${AUTHORITY_DOC_B_REGEN_HASH}|trackedProductDiff=${TARGET_FILE}"

      - name: Candidate residual proof
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          node /tmp/ux-css-debt-039-candidate-residual.cjs

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log(`NPM AUDIT SNAPSHOT|total=${v.total??'n/a'}|critical=${v.critical??'n/a'}|high=${v.high??'n/a'}|moderate=${v.moderate??'n/a'}|low=${v.low??'n/a'}`);
          NODE

      - name: Candidate diff integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          read -r add del file < <(git diff --numstat -- "${TARGET_FILE}")
          test "$add" = "0" && test "$del" = "192" && test "$file" = "${TARGET_FILE}"
          git diff --check
          hash="$(sha256sum "${TARGET_FILE}" | awk '{print $1}')"
          bytes="$(wc -c < "${TARGET_FILE}" | tr -d ' ')"
          test "$hash" = "2a00446c049d4095400c0e696236b2ee88c91015b23a5bc2bf9936fd983ea81c"
          test "$bytes" = "44057"
          echo "CANDIDATE FINAL PASS|parent=${TARGET_SHA}|hash=$hash|bytes=$bytes|files=1|additions=0|deletions=192|responsive=893/0/277|residual=35/657/0|prCreated=0"

      - name: Verify exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0|issueCreated=0|prCreated=0"
