name: ANA authenticated staging canary one-shot
# explicit staging-only execution gate

on:
  push:
    branches:
      - ana/ana-001-foundation
    paths:
      - '.github/workflows/ana-staging-authenticated-canary.yml'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOKE_ENVIRONMENT: staging
      DOKE_SUPABASE_URL: https://zwkczgewzbsorbrjuzpb.supabase.co
      DOKE_SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      DOKE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DOKE_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DOKE_STAGING_CLIENT_EMAIL: cliente@doke.local
      DOKE_STAGING_CLIENT_PASSWORD: ${{ secrets.DOKE_STAGING_CLIENT_PASSWORD }}
      DOKE_STAGING_PROFESSIONAL_EMAIL: profissional@doke.local
      DOKE_STAGING_PROFESSIONAL_PASSWORD: ${{ secrets.DOKE_STAGING_PROFESSIONAL_PASSWORD }}
      DOKE_ANA_STAGING_SEARCH_QUERY: pintura
      DOKE_ANA_STAGING_SEARCH_SERVICE_ID: 55555555-5555-4555-8555-555555555555
      DOKE_ANA_STAGING_SERVICE_ID: 55555555-5555-4555-8555-555555555555
      DOKE_ANA_STAGING_OWNER_SERVICE_ID: 55555555-5555-4555-8555-555555555555
      DOKE_ANA_STAGING_ORDER_ID: 66666666-6666-4666-8666-666666666666
      DOKE_ANA_STAGING_WINDOW_START: 2026-09-19T00:00:00Z
      DOKE_ANA_STAGING_WINDOW_END: 2026-09-19T02:00:00Z
      DOKE_ANA_STAGING_CANARY_CONFIRM: execute-ana-staging-canary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate canary environment
        run: node scripts/run-ana-001-staging-canary.js --check-env

      - name: Execute authenticated ANA staging canary
        run: node scripts/run-ana-001-staging-canary.js --execute --write-report

      - name: Print sanitized canary report
        if: always()
        run: |
          if [ -f reports/generated/ana-001-staging-canary.json ]; then
            cat reports/generated/ana-001-staging-canary.json
          fi
