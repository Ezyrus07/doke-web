name: TEMP UX-QA-DEBT-008E Permanent Promotion R1

on:
  push:
    branches:
      - diag/ux-qa-debt-008e-permanent-promotion-r1

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PARENT_SHA: c62445938fb4e0bbf937fdb45209a12eb3d0b52d
      PARENT_TREE: bfd34a50eafec796c1c68165d48ac5b1566eed93
      SOURCE_BRANCH: diag/ux-qa-debt-008e-results-header-rail-contract-c1
      SOURCE_SHA: 0deab753b417428d5f1e920e92eae24099beac47
      SOURCE_TREE: 25273d0bc3754badfd27360ca2d613e0a17c2fd3
      PERMANENT_BRANCH: qa/ux-qa-debt-008e-results-header-rail-contract
      OWNER_FILE: scripts/test-results-header-rail-contract.js
      OWNER_PREIMAGE_BLOB: 56d0046cb4c3a4b408fe4be2a531648474266ec7
      OWNER_BLOB: 368ec5dafafb25d9b74e8c76bf8c0f3145ea591b
      QA006_OWNER: tests/e2e/results-entry-lifecycle.spec.js
      QA006_BLOB: f99c8a622abacf6360680dbf5864e0b1c2ef2484
      SEARCH_REPOSITORY: assets/js/repositories/search-repository.js
      SEARCH_REPOSITORY_BLOB: d4418a94cb939ba56dc7099069afc27ae57ea54f
      SUPABASE_CONFIG: assets/js/core/supabase-config.js
      SUPABASE_CONFIG_BLOB: a370c903fc6c390ba02bdc20ecc5ca88c11e1f29
      TEMP_PATH: .github/workflows/0000-temp-ux-qa-debt-008e-permanent-promotion-r1.yml

    steps:
      - name: Checkout TEMP controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze controller source and permanent target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$TEMP_PATH"

          remote_target="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | cut -f1)"
          test "$remote_target" = "$PARENT_SHA"

          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/uxqa008e-source"
          test "$(git rev-parse refs/remotes/origin/uxqa008e-source)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA:$OWNER_FILE")" = "$OWNER_PREIMAGE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:$OWNER_FILE")" = "$OWNER_BLOB"
          test "$(git diff --name-only "$PARENT_SHA".."$SOURCE_SHA")" = "$OWNER_FILE"
          test "$(git rev-parse "$SOURCE_SHA:$QA006_OWNER")" = "$QA006_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:$SEARCH_REPOSITORY")" = "$SEARCH_REPOSITORY_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:$SUPABASE_CONFIG")" = "$SUPABASE_CONFIG_BLOB"

          echo 'CONTROLLER_LINEAGE=PASS'
          echo 'SOURCE_IDENTITY=PASS'
          echo 'PERMANENT_TARGET_FROZEN=PASS'
          echo 'AUTHORITY_BLOBS=PASS'

      - name: Create exact parent worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add ../candidate "$PARENT_SHA"
          cd ../candidate
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test -z "$(git status --porcelain)"

      - name: Reconstruct exact certified C1 owner blob
        shell: bash
        run: |
          set -euo pipefail
          cd ../candidate
          git show "$SOURCE_SHA:$OWNER_FILE" > "$OWNER_FILE"
          test "$(git hash-object "$OWNER_FILE")" = "$OWNER_BLOB"
          test "$(git diff --name-only)" = "$OWNER_FILE"
          git diff --check
          git diff --quiet -- "$QA006_OWNER" "$SEARCH_REPOSITORY" "$SUPABASE_CONFIG"
          git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md docs/validation/domain-completion-staging-snapshot.json
          git diff --quiet -- tests/visual reports/baseline
          echo 'EXACT_OWNER_BLOB=PASS'
          echo 'OWNER_SCOPE=1_FILE'

      - name: Prove owner-only structural invariance
        shell: bash
        run: |
          set -euo pipefail
          cd ../candidate
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const parent = process.env.PARENT_SHA;
          const owner = process.env.OWNER_FILE;
          const candidate = fs.readFileSync(owner, 'utf8');
          const preimage = execFileSync('git', ['show', `${parent}:${owner}`], { encoding: 'utf8' });
          const start = 'async function installNetworkMocks(context) {';
          const suffix = '\nasync function collectLayout(page) {';
          const pStart = preimage.indexOf(start);
          const cStart = candidate.indexOf(start);
          const pSuffix = preimage.indexOf(suffix);
          const cSuffix = candidate.indexOf(suffix);
          if ([pStart, cStart, pSuffix, cSuffix].some((value) => value < 0)) throw new Error('structural markers missing');
          if (preimage.slice(0, pStart) !== candidate.slice(0, cStart)) throw new Error('bytes before installNetworkMocks changed');
          if (preimage.slice(pSuffix) !== candidate.slice(cSuffix)) throw new Error('bytes after installNetworkMocks changed');
          const required = [
            "const routes = ['/resultados.html?q=sSAS', '/doke-web/resultados.html?q=sSAS'];",
            '[390, 844]', '[760, 1024]', '[820, 1180]', '[1024, 1180]', '[1366, 768]', '[1760, 900]',
            'const tolerance = 1.25;', 'await page.waitForTimeout(650);',
            'involuntary horizontal overflow', 'app header inner is not visible',
            'results searchbar is not visible', 'results layout is not visible',
            'searchbar left rail must match header', 'searchbar right rail must match header',
            'results layout left rail must match header', 'results layout right rail must match header',
            'results workspace must not keep nested page padding',
            "context.route('**/assets/js/repositories/search-repository.js*'",
            'const response = await route.fetch();', "if (request.query === 'sSAS')",
            'return original.queryPage(request);',
            'normalizeRequest: function (request) { return original.normalizeRequest(request); }',
            'getLastError: function () { return original.getLastError(); }',
            'getContract: function () { return original.getContract(); }',
            '__qaResultsHeaderRailHarness: true'
          ];
          for (const token of required) if (!candidate.includes(token)) throw new Error(`required token missing: ${token}`);
          if (candidate.includes('window.supabase={createClient(){return {}}};')) throw new Error('obsolete Supabase mock remains');
          if (candidate.includes('functions.invoke') || candidate.includes('.rpc(')) throw new Error('forbidden Supabase/RPC synthesis');
          console.log('OUTSIDE_INSTALL_NETWORK_MOCKS_BYTE_IDENTICAL=PASS');
          console.log('CRITERIA_TOKENS_PRESERVED=PASS');
          console.log('DETERMINISTIC_REPOSITORY_HARNESS=PASS');
          console.log('CRITERIA_RELAXED=0');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd ../candidate
          npm ci
          npx playwright install --with-deps chromium

      - name: Run frozen syntax and browser contract
        shell: bash
        run: |
          set -euo pipefail
          cd ../candidate
          node --check "$OWNER_FILE"
          node "$OWNER_FILE" > "$RUNNER_TEMP/results-header-rail-contract.json"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/results-header-rail-contract.json`, 'utf8'));
          if (payload.ok !== true || !Array.isArray(payload.report) || payload.report.length !== 12) throw new Error('expected exactly 12 passing browser cases');
          const routes = ['/resultados.html?q=sSAS', '/doke-web/resultados.html?q=sSAS'];
          const viewports = ['390x844', '760x1024', '820x1180', '1024x1180', '1366x768', '1760x900'];
          const tolerance = 1.25;
          for (const route of routes) {
            const rows = payload.report.filter((row) => row.route === route);
            if (rows.length !== 6) throw new Error(`${route}: expected six viewport rows`);
            for (const viewport of viewports) if (!rows.some((row) => row.viewport === viewport)) throw new Error(`${route}: missing ${viewport}`);
            const tablet = rows.find((row) => row.viewport === '820x1180');
            const layout = tablet && tablet.layout;
            if (!layout || layout.bodyPage !== 'resultados') throw new Error(`${route}: 820 bodyPage mismatch`);
            if (layout.scrollWidth - layout.clientWidth > tolerance) throw new Error(`${route}: 820 overflow`);
            for (const key of ['appHeaderInner', 'resultsSearchbar', 'resultsLayout']) if (!layout[key] || layout[key].visible !== true) throw new Error(`${route}: 820 ${key} not visible`);
            if (Math.abs(layout.resultsSearchbar.left - layout.appHeaderInner.left) > tolerance
              || Math.abs(layout.resultsSearchbar.right - layout.appHeaderInner.right) > tolerance
              || Math.abs(layout.resultsLayout.left - layout.appHeaderInner.left) > tolerance
              || Math.abs(layout.resultsLayout.right - layout.appHeaderInner.right) > tolerance) throw new Error(`${route}: 820 rail divergence`);
            if (layout.pageInner.paddingLeft !== '0px' || layout.pageInner.paddingRight !== '0px') throw new Error(`${route}: 820 nested padding drift`);
          }
          console.log('RESULTS_HEADER_RAIL_BROWSER_CONTRACT=PASS');
          console.log('ROUTES_X_VIEWPORTS=12/12');
          console.log('TABLET_820_GEOMETRY_BOTH_ROUTES=PASS');
          NODE

      - name: Run repository governance gates
        shell: bash
        run: |
          set -euo pipefail
          cd ../candidate
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git restore --worktree --staged docs/HOME-AUTHORITY-CLASSIFICATION.md docs/PAGE-ASSET-AUTHORITY-MATRIX.md 2>/dev/null || true
          git clean -fd -- docs/validation reports/generated test-results >/dev/null 2>&1 || true
          test "$(git diff --name-only)" = "$OWNER_FILE"
          test "$(git hash-object "$OWNER_FILE")" = "$OWNER_BLOB"
          git diff --check
          git diff --quiet -- "$QA006_OWNER" "$SEARCH_REPOSITORY" "$SUPABASE_CONFIG"
          git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md docs/validation/domain-completion-staging-snapshot.json
          git diff --quiet -- tests/visual reports/baseline
          echo 'DOMAIN_MATRIX=PASS'
          echo 'AGENT_GOVERNANCE=PASS'
          echo 'DIFF_CHECK=PASS'
          echo 'INTRODUCED_REGRESSIONS=0'

      - name: Commit once and fast forward permanent branch
        shell: bash
        run: |
          set -euo pipefail
          cd ../candidate
          remote_target="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | cut -f1)"
          test "$remote_target" = "$PARENT_SHA"
          test "$(git diff --name-only)" = "$OWNER_FILE"
          test "$(git hash-object "$OWNER_FILE")" = "$OWNER_BLOB"

          git config user.name 'doke-qa'
          git config user.email 'doke-qa@users.noreply.github.com'
          git add "$OWNER_FILE"
          test "$(git diff --cached --name-only)" = "$OWNER_FILE"
          git diff --cached --check
          git commit -m 'test(qa): align Resultados header-rail deterministic precondition'

          permanent_commit="$(git rev-parse HEAD)"
          permanent_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse "HEAD:$OWNER_FILE")" = "$OWNER_BLOB"
          test "$(git diff --name-only "$PARENT_SHA"..HEAD)" = "$OWNER_FILE"
          test "$permanent_tree" = "$SOURCE_TREE"
          test "$(git rev-parse "HEAD:$QA006_OWNER")" = "$QA006_BLOB"
          test "$(git rev-parse "HEAD:$SEARCH_REPOSITORY")" = "$SEARCH_REPOSITORY_BLOB"
          test "$(git rev-parse "HEAD:$SUPABASE_CONFIG")" = "$SUPABASE_CONFIG_BLOB"

          git push origin "HEAD:refs/heads/$PERMANENT_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | cut -f1)"
          test "$pushed" = "$permanent_commit"

          echo "PERMANENT_COMMIT=$permanent_commit" >> "$GITHUB_ENV"
          echo "PERMANENT_TREE=$permanent_tree" >> "$GITHUB_ENV"
          echo "PERMANENT_COMMIT=$permanent_commit"
          echo "PERMANENT_TREE=$permanent_tree"
          echo 'FAST_FORWARD_FORCE_FALSE=1'

      - name: Emit permanent promotion receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promotion-evidence
          cp "$RUNNER_TEMP/results-header-rail-contract.json" promotion-evidence/results-header-rail-contract.json
          node <<'NODE'
          const fs = require('fs');
          const receipt = {
            result: 'PASS',
            checkpoint: 'UX-QA-DEBT-008E-PERMANENT-PROMOTION-R1',
            parent: process.env.PARENT_SHA,
            parentTree: process.env.PARENT_TREE,
            source: process.env.SOURCE_SHA,
            sourceTree: process.env.SOURCE_TREE,
            permanentBranch: process.env.PERMANENT_BRANCH,
            head: process.env.PERMANENT_COMMIT,
            tree: process.env.PERMANENT_TREE,
            owner: process.env.OWNER_FILE,
            ownerBlob: process.env.OWNER_BLOB,
            nodeCheck: true,
            browserCases: 12,
            tablet820GeometryPassedBothRoutes: true,
            domainMatrix: true,
            agentGovernance: true,
            diffCheck: true,
            criteriaRelaxed: 0,
            introducedRegressions: 0,
            candidateMutation: false,
            productMutation: false,
            cssHtmlMutation: false,
            qa006Mutation: false,
            matrixMutation: false,
            snapshotMutation: false,
            supabaseInvocation: false,
            rpcInvocation: false,
            stagingProduction: false,
            fastForward: true,
            force: false,
            prCreated: false,
            readyForReview: false,
            merge: false,
            repositoryOnly: true
          };
          fs.writeFileSync('promotion-evidence/receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log('UX_QA_DEBT_008E_PROMOTION_FINAL=' + JSON.stringify(receipt));
          NODE

      - name: Upload permanent promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-debt-008e-permanent-promotion-${{ github.sha }}
          path: promotion-evidence/
          if-no-files-found: error
          retention-days: 14
