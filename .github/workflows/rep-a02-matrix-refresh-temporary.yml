name: REP-A02 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/rep-a02-matrix-refresh-temporary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-matrix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate and audit matrix
        run: |
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

      - name: Enforce allowlist
        run: |
          changed="$(git status --short | awk '{print $2}' | sort)"
          allowed="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$changed" = "$allowed"

      - name: Commit derived files
        run: |
          git config user.name 'doke-contract-bot'
          git config user.email 'doke-contract-bot@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'REP-A02: refresh canonical matrix derivatives'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
