name: COM-B03C-R4W Temporary Domain Matrix Reconciler

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r4w-domain-matrix-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r4w-domain-matrix-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 948417687a145bd0ed4ff382a6a181637706ca36
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r4w-domain-matrix-writer-temp.yml
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_JSON: reports/generated/domain-completion-matrix-report.json

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fail-closed writer installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: R4W pre-gates
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-realtime-private-auth-r4w.js
          node --check scripts/test-com-b03c-r4w-r4v-consumed-authorization-successor-workflow-installation-readiness.js
          node --check scripts/execute-com-b03c-r4w-single-use-r4t-successor-hosted-execution.js
          node --check scripts/verify-com-b03c-r4w-single-use-r4t-successor-hosted-execution-report.js
          node scripts/test-com-b03c-r4w-r4v-consumed-authorization-successor-workflow-installation-readiness.js
          node scripts/execute-com-b03c-r4w-single-use-r4t-successor-hosted-execution.js --repository-self-test
          node scripts/verify-com-b03c-r4w-single-use-r4t-successor-hosted-execution-report.js --repository-self-test
          test -e config/com-b03c-r4v-r4u-fresh-authorization-consumption.json
          test ! -e config/com-b03c-r4t-single-use-successor-executor-trigger.json
          PREDECESSOR=6673c49da04658b9fc4276997a7f2a281dad8826
          test -z "$(git diff --name-only "$PREDECESSOR" "${EXPECTED_PARENT}" -- \
            backend/modules/communities/community-realtime-private-auth-r4t.js \
            scripts/build-com-b03c-r4t-r4q-successor-executor.js \
            backend/modules/communities/community-realtime-private-auth-r4v.js \
            config/com-b03c-r4v-r4u-fresh-authorization-consumption.json \
            backend/modules/communities/community-realtime-private-auth-r4u.js \
            backend/modules/communities/community-realtime-private-auth-r4q.js)"
      - name: Remove writer before canonical generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"
      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix
      - name: Enforce final reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff HEAD --name-only | sort)"
          printf '%s\n' "${actual}" | grep -qx "${WRITER_PATH}"
          matrix_changed=false
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}") ;;
              "${MATRIX_MD}"|"${MATRIX_JSON}") matrix_changed=true ;;
              *) echo "unauthorized final path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${actual}"
          test "${matrix_changed}" = "true"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Stage and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${MATRIX_MD}"
          git add -f -- "${MATRIX_JSON}"
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "${staged}" | grep -qx "${WRITER_PATH}"
          matrix_staged=false
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              "${WRITER_PATH}") ;;
              "${MATRIX_MD}"|"${MATRIX_JSON}") matrix_staged=true ;;
              *) echo "unauthorized staged path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "${staged}"
          test "${matrix_staged}" = "true"
          git diff --cached --check
      - name: Commit clean reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): reconcile matrix after R4W readiness'
          git push origin "HEAD:${TARGET_BRANCH}"
