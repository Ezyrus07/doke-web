name: Doke UX-CSS-DEBT-065 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-065-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 39780a7192b1b17e8b971372a52b689ad39ef67d
      PARENT_PARENT_SHA: 6756a335c3bd5ecedf7ba0b6bb40cfbb1cab6d54
      TARGET_FILE: assets/css/components/ui-surface/buttons-close.css
      PARENT_TARGET_BLOB: d817fab2184459063dfab110131e5fffc768649b
      EXPECTED_SHA256: b376339537f77d4bb511fce8b4335d5fe08855d7f4a3d1a75739cea3d413e480
      EXPECTED_BYTES: 12435
      PERMANENT_BRANCH: ux/ux-css-debt-065-buttons-close-compaction
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2

      - name: Guard parent and seeded permanent namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PROMOTION GUARD PASS|parent=$PARENT_SHA|permanentSeed=$remote_sha|targetBlob=$PARENT_TARGET_BLOB"

      - name: Rebuild exact certified candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const f=process.env.TARGET_FILE,s=fs.readFileSync(f,'utf8'),ls=s.split('\n');
          if(ls[108].replace(/\r$/,'')!=='  border: 0;'||ls[112].replace(/\r$/,'')!=='  box-shadow: none;')throw new Error('target rows drift');
          fs.writeFileSync(f,ls.filter((_,i)=>i!==108&&i!==112).join('\n'));
          console.log('DETERMINISTIC REBUILD PASS|parent=112/2|candidate=110/0|families=1|identical=2|changed=0');
          NODE
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t2\t'"$TARGET_FILE"
          git diff --check
          echo "CANDIDATE IDENTITY PASS|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|files=1|additions=0|deletions=2"

      - name: Commit and atomically fast-forward permanent branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "doke"
          git config user.email "bielantoniomma@gmail.com"
          git add -- "$TARGET_FILE"
          git commit -m "UX-CSS-DEBT-065: compact superseded close-button surface declarations"
          commit_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE")" = $'0\t2\t'"$TARGET_FILE"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PARENT_SHA"
          git push --force-with-lease="refs/heads/$PERMANENT_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERMANENT_BRANCH"
          after="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$after" = "$commit_sha"
          echo "PROMOTION PASS|permanent=$after|parent=$PARENT_SHA|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|files=1|additions=0|deletions=2"
