name: UX-CSS-IMPORTANT-036 Narrow Static Governance R5

on:
  push:
    branches:
      - diag/ux-css-important-036-narrow-governance-r5
    paths:
      - .github/workflows/0000-temp-ux-css-important-036-narrow-governance-r5.yml

permissions:
  contents: write

jobs:
  governance036r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARENT_SHA: 483d49d5f59c2eb24be0169f3d7ed6aec9703679
      PARENT_TREE: 01704fc7f8e4b17f895bd11a0ed8f235baa9ec47
      TARGET_FILE: assets/css/components/shell/mobile-app-shell.css
      TARGET_PARENT_BLOB: af6fd982517f2bc821435e633d70237e95ee11a8
      CANDIDATE_SHA256: 8fb0e7919197559b37a2d2b3c348766cff38729792c13cfffcdcb9bada8ad097
      CANDIDATE_BLOB: 14fb64c93777d606b07c0abbf2c6532aed134cc4
      RESULT_FILE: .diagnostics/ux-css-important-036-narrow-governance-r5.txt
      OUTPUT_BRANCH: diag/ux-css-important-036-narrow-governance-r5
      R4_BRANCH: diag/ux-css-important-036-narrow-candidate-r4
      R4_PATH: .diagnostics/ux-css-important-036-narrow-candidate-r4.json
      R4_BLOB: 48107edc5888823b64aa77700d968070844c9df0
      R4B_BRANCH: diag/ux-css-important-036-narrow-static-r4b
      R4B_PATH: .diagnostics/ux-css-important-036-narrow-static-r4b.json
      R4B_BLOB: adb051fdcc3333da3c3a08c9d25287eb5846b963
      R4C_BRANCH: diag/ux-css-important-036-responsive-baseline-r4c
      R4C_PATH: .diagnostics/ux-css-important-036-responsive-baseline-r4c.json
      R4C_BLOB: f8ed3a11029e423f3f329ae734b8056e0df2649b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate browser/responsive evidence and static governance
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/summary
          pass(){ echo "$1" | tee -a /tmp/summary; }

          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_PARENT_BLOB"

          git fetch --no-tags origin "$R4_BRANCH" "$R4B_BRANCH" "$R4C_BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$R4_BRANCH:refs/remotes/origin/$R4_BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$R4B_BRANCH:refs/remotes/origin/$R4B_BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$R4C_BRANCH:refs/remotes/origin/$R4C_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R4_BRANCH:$R4_PATH")" = "$R4_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R4B_BRANCH:$R4B_PATH")" = "$R4B_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R4C_BRANCH:$R4C_PATH")" = "$R4C_BLOB"

          git show "refs/remotes/origin/$R4_BRANCH:$R4_PATH" >/tmp/r4.json
          git show "refs/remotes/origin/$R4B_BRANCH:$R4B_PATH" >/tmp/r4b.json
          git show "refs/remotes/origin/$R4C_BRANCH:$R4C_PATH" >/tmp/r4c.json
          node <<'NODE'
          const fs=require('fs');
          const r4=JSON.parse(fs.readFileSync('/tmp/r4.json','utf8'));
          const r4b=JSON.parse(fs.readFileSync('/tmp/r4b.json','utf8'));
          const r4c=JSON.parse(fs.readFileSync('/tmp/r4c.json','utf8'));
          if(r4.diffs?.total!==0||r4.candidateImportant!==6||r4.removedMarkers!==308||r4.candidateGitBlob!==process.env.CANDIDATE_BLOB)throw Error('R4 browser evidence');
          const passed=r4b.audits.filter(a=>a.status===0).map(a=>a.name);
          const need=['audit:responsive-boundaries','audit:mobile-base','audit:shared-app-header','audit:mobile-shell-location','test:home-mobile-shell-rail','audit:css-responsive-conflicts','git:diff-check'];
          if(!need.every(n=>passed.includes(n)))throw Error('R4B static evidence');
          if(r4c.status!=='PASS'||r4c.responsiveContract?.status!==0||r4c.candidateGitBlob!==process.env.CANDIDATE_BLOB||!r4c.restorePass)throw Error('R4C responsive evidence');
          NODE
          pass 'BROWSER + RESPONSIVE EVIDENCE PASS|states=60|metadataDiffs=0|screenshotDiffs=0|responsiveChecks=893|responsiveFailures=0|criteriaRelaxed=0'

          git checkout --detach "$PARENT_SHA" >/dev/null
          cp "$TARGET_FILE" /tmp/parent.css

          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),cp=require('child_process');
          const root=process.cwd(),target=process.env.TARGET_FILE;
          const blockers=new Set([106,139,141,142,147,275]);
          const protectedFiles=new Map([
            ['assets/css/pages/home/mobile-composition.css','006'],
            ['assets/css/components/cards/mobile-card-contract.css','010'],
            ['assets/css/components/shell/mobile-base-stability.css','020'],
            ['assets/css/pages/home/mobile-hero-feed.css','021'],
          ]);
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(e.isFile()&&e.name.endsWith('.css')?[f]:[])});
          const rel=f=>path.relative(root,f).replace(/\\/g,'/');
          const risk=(r,n)=>{if(r.includes('service-card'))return'excluded-service-card';if(r.includes('/core/')||r.includes('/layout/')||r.includes('shell')||r.includes('sidebar')||r.includes('header'))return'high-baseline-required';if(n>=25)return'high-baseline-required';if(n>=5)return'medium-baseline-required';return'low-review-candidate'};
          function measure(){const rows=walk(path.join(root,'assets/css')).map(f=>{const file=rel(f),n=(fs.readFileSync(f,'utf8').match(/!important\b/g)||[]).length;return{file,n,risk:risk(file,n)}});const all=rows.reduce((s,x)=>s+x.n,0),res=rows.filter(x=>x.n>0&&x.risk!=='excluded-service-card');return{global:all,outsideService:res.reduce((s,x)=>s+x.n,0),files:res.length,high:res.filter(x=>x.risk==='high-baseline-required').reduce((s,x)=>s+x.n,0),medium:res.filter(x=>x.risk==='medium-baseline-required').reduce((s,x)=>s+x.n,0),low:res.filter(x=>x.risk==='low-review-candidate').reduce((s,x)=>s+x.n,0),target:rows.find(x=>x.file===target)?.n??-1,protected:Object.fromEntries([...protectedFiles].map(([f,k])=>[k,rows.find(x=>x.file===f)?.n??-1]))};}
          const parent=measure(),o=fs.readFileSync(target,'utf8');let i=-1;const c=o.replace(/\s*!important\b/gi,m=>{i++;return blockers.has(i)?m:'';});
          const sha=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');fs.writeFileSync('/tmp/candidate.css',c);const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(i+1!==314||(o.match(/!important\b/gi)||[]).length!==314||(c.match(/!important\b/gi)||[]).length!==6||sha!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error('candidate identity');
          fs.writeFileSync(target,c);const candidate=measure();
          const pe={global:7361,outsideService:7299,files:13,high:7291,medium:6,low:2,target:314};
          const ce={global:7053,outsideService:6991,files:13,high:6983,medium:6,low:2,target:6};
          for(const [k,v] of Object.entries(pe))if(parent[k]!==v)throw Error(`parent ${k}=${parent[k]} expected ${v}`);
          for(const [k,v] of Object.entries(ce))if(candidate[k]!==v)throw Error(`candidate ${k}=${candidate[k]} expected ${v}`);
          for(const [k,v] of Object.entries({'006':6,'010':2,'020':28,'021':127}))if(parent.protected[k]!==v||candidate.protected[k]!==v)throw Error(`protected ${k}`);
          const normalized=s=>s.replace(/\s*!important\b/gi,'');
          if(normalized(o)!==normalized(c))throw Error('marker-only normalization');
          fs.writeFileSync('/tmp/metrics',`CANDIDATE PASS|important=314->6|removed=308|sha256=${sha}|blob=${blob}|bytes=${Buffer.byteLength(c)}|blockers=106,139,141,142,147,275|markerOnly=1\nIMPORTANT FRESH PASS|global=7361->7053|outsideService=7299->6991|queueFiles=13->13|high=7291->6983|medium=6->6|low=2->2|protected006=6|protected010=2|protected020=28|protected021=127\n`);
          NODE
          cat /tmp/metrics | tee -a /tmp/summary

          npm ci --ignore-scripts >/dev/null
          npm run audit:domain >/tmp/domain.log 2>&1
          pass 'DOMAIN CARD CONTRACT PASS'
          npm run audit:agent-governance >/tmp/agent.log 2>&1
          pass 'AGENT GOVERNANCE PASS'
          node scripts/audit-css-responsive-conflicts.js >/tmp/conflicts.log 2>&1
          pass 'CSS RESPONSIVE CONFLICTS PASS'
          npm run audit:shared-app-header-contract >/tmp/header.log 2>&1
          npm run audit:mobile-shell-location-contract >/tmp/mobile-shell.log 2>&1
          npm run audit:responsive-boundaries >/tmp/boundaries.log 2>&1
          npm run audit:mobile-base >/tmp/mobile-base.log 2>&1
          node scripts/test-home-mobile-shell-rail-contract.js >/tmp/home-shell-rail.log 2>&1
          pass 'SHARED SHELL + RESPONSIVE STATIC CONTRACTS PASS'
          npm run audit:duplicate-assets >/tmp/duplicates.log 2>&1
          npm run audit:domain-completion-matrix >/tmp/domain-matrix.log 2>&1
          pass 'DUPLICATES + DOMAIN MATRIX PASS'
          npm run audit:active-legacy-structures >/tmp/legacy.log 2>&1
          npm run audit:important-reduction-plan >/tmp/important-plan.log 2>&1
          npm run audit:global-css-design-system >/tmp/design-system.log 2>&1
          pass 'CSS GOVERNANCE SUITE PASS'

          npm audit --json >/tmp/npm-audit.json 2>/dev/null || true
          node <<'NODE'
          const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8')).metadata?.vulnerabilities||{};
          if(Number(v.total||0)!==13||Number(v.critical||0)!==0||Number(v.high||0)!==10||Number(v.moderate||0)!==1||Number(v.low||0)!==2)throw Error(JSON.stringify(v));
          NODE
          pass 'DEPENDENCIES PASS|total=13|critical=0|high=10|moderate=1|low=2'

          test "$(git hash-object "$TARGET_FILE")" = "$CANDIDATE_BLOB"
          test "$(git diff --name-only "$PARENT_SHA" --)" = "$TARGET_FILE"
          git diff --check "$PARENT_SHA" -- "$TARGET_FILE"
          numstat="$(git diff --numstat "$PARENT_SHA" -- "$TARGET_FILE")"
          pass "DIFF HYGIENE PASS|files=1|target=$TARGET_FILE|numstat=$numstat|removedMarkers=308|markerOnly=1"

          cp /tmp/parent.css "$TARGET_FILE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_PARENT_BLOB"
          test -z "$(git status --short --untracked-files=no)"
          pass 'RESTORE PASS|target=parent-exact|workspaceTrackedClean=1'
          pass 'RESULT=PASS'

      - name: Publish R5 receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          test -f /tmp/summary && grep -q '^RESULT=PASS$' /tmp/summary && result=PASS || true
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; test -f /tmp/summary && cat /tmp/summary || true; echo "PROOF_RESULT=$result"; } >/tmp/out
          git fetch origin "refs/heads/$OUTPUT_BRANCH:refs/remotes/origin/$OUTPUT_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"
          if ! git diff --cached --quiet; then
            git commit -m 'diag: publish 036 narrow governance R5 [skip ci]' >/dev/null
            git push origin "HEAD:refs/heads/$OUTPUT_BRANCH" >/dev/null
          fi
          test "$result" = PASS
