name: Doke UX-CSS-DEBT-007 High-Risk Inventory

on:
  push:
    branches:
      - diag/ux-css-debt-007-high-risk-inventory

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ec3b0617d7f7722664a7ae4f08a571a98cc2b968
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate canonical active CSS inventory
        run: npm run audit:active-legacy-structures

      - name: Rank current high-risk CSS by deterministic superseded declarations and blast radius
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const high=report.highestRiskActiveCss;
          if(report.totals.highRiskActiveCss!==38) throw new Error(`high-risk drift: ${report.totals.highRiskActiveCss}`);
          const allCss=[];
          function walk(d){if(!fs.existsSync(d))return;for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=path.join(d,e.name);if(e.isDirectory())walk(f);else if(f.endsWith('.css'))allCss.push(f.replace(/\\/g,'/'));}}
          walk('assets/css');
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi;
          const normalize=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          const imports=new Map();
          for(const file of allCss){const t=fs.readFileSync(file,'utf8'),arr=[];let m;importRe.lastIndex=0;while((m=importRe.exec(t)))arr.push(normalize(m[1],file));imports.set(file,arr);}
          const directPages=new Map();
          for(const p of report.pageAssets){for(const css of p.css){if(!directPages.has(css))directPages.set(css,[]);directPages.get(css).push(p.page);}}
          function pagesFor(target){const pages=[];for(const p of report.pageAssets){const seen=new Set(),stack=[...p.css];let hit=false;while(stack.length){const f=stack.pop();if(seen.has(f))continue;seen.add(f);if(f===target){hit=true;break;}for(const n of imports.get(f)||[])stack.push(n);}if(hit)pages.push(p.page);}return pages.sort();}
          function superseded(file){const text=fs.readFileSync(file,'utf8'),lines=text.split(/\r?\n/);let depth=0,selectorParts=[],selector=null;const declarations=[],stack=[];const re=/^\s*([\w-]+)\s*:\s*(.*?)\s*(!important)?\s*;\s*$/;for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;if(!selector&&t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'){if(t.startsWith('@')&&line.includes('{'))stack.push({type:'at',header:t.replace(/\{\s*$/,'').replace(/\s+/g,' ').trim(),depthBefore:depth});else if(!t.startsWith('@')&&!line.includes(';')){selectorParts.push(t.replace(/\{\s*$/,'').trim());if(line.includes('{')){selector=selectorParts.join(' ').replace(/\s+/g,' ').trim();selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}}if(selector){const m=line.match(re);if(m){const context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1],important:Boolean(m[3]),context});}}depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}}
            const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push(d);if(!later||d.important||!later.important)last.set(key,d);}return{declarations:declarations.length,dead:dead.length,selectors:new Set(dead.map(d=>d.selector)).size};}
          const rows=high.map(item=>{const s=superseded(item.file),pages=pagesFor(item.file),parents=allCss.filter(f=>(imports.get(f)||[]).includes(item.file));const scope=item.file.includes('/pages/')?'page':'shared';const globalPenalty=(item.authority?.shell||item.authority?.header||item.authority?.rail||item.authority?.cards||item.authority?.mobile)?1:0;return{file:item.file,size:item.sizeBytes,important:item.importantCount,imports:item.importCount,decl:s.declarations,dead:s.dead,deadPct:s.declarations?+(100*s.dead/s.declarations).toFixed(2):0,selectors:s.selectors,pages:pages.length,pageList:pages,importParents:parents.length,parentList:parents.sort(),scope,globalPenalty};}).sort((a,b)=>(b.dead-a.dead)||(a.globalPenalty-b.globalPenalty)||(a.pages-b.pages)||(b.deadPct-a.deadPct)||(b.size-a.size));
          console.log('UX-CSS-DEBT-007 fresh inventory');
          console.log(`checkpoint=${process.env.TARGET_SHA}`);
          console.log(`highRisk=${rows.length}`);
          console.log('RANK | DEAD | PCT | PAGES | SCOPE | !IMP | BYTES | FILE');
          rows.forEach((r,i)=>console.log(`${String(i+1).padStart(2)} | ${String(r.dead).padStart(4)} | ${String(r.deadPct).padStart(5)} | ${String(r.pages).padStart(2)} | ${r.scope.padEnd(6)} | ${String(r.important).padStart(4)} | ${String(r.size).padStart(6)} | ${r.file}`));
          console.log('\nTop 12 detail JSON:');
          console.log(JSON.stringify(rows.slice(0,12),null,2));
          fs.writeFileSync('/tmp/ux-css-debt-007-inventory.json',JSON.stringify({checkpoint:process.env.TARGET_SHA,rows},null,2));
          NODE

      - name: Preserve baseline governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          git diff --check
