name: ORD-A07E Remote Application Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07e-remote-application-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07E remote replay application
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['audit:ord-001-a07e-remote-concurrent-replay-canary-application'] =
            'node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-application.js';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.40';
          matrix.updatedAt = '2026-07-30T23:10:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'config/ord-001-a07e-remote-concurrent-replay-canary-application.json',
            'docs/ORD-001-A07E-REMOTE-CONCURRENT-REPLAY-CANARY-APPLICATION.md',
            'docs/validation/ORD-001-A07E-REMOTE-CONCURRENT-REPLAY-CANARY-APPLICATION.json',
            'scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-application.js',
            '.github/workflows/ord-001-a07e-remote-concurrent-replay-canary-application.yml'
          ]);
          appendUnique(ord.tests, [
            'audit:ord-001-a07e-remote-concurrent-replay-canary-application'
          ]);
          appendUnique(ord.evidence, [
            'The authorized ORD-A07E staging canary dispatched 32 concurrent requests sharing one issued-at and nonce; exactly one returned HTTP 200 and all other 31 returned HTTP 409 DOKE_ORDER_EVENT_WORKER_REPLAY_REJECTED.',
            'The sole accepted invocation created one empty completed test worker run with zero claimed, completed, failed and dead-letter events; the run was deleted through a narrowly conditioned privileged cleanup.',
            'The canonical nonce consumer evicted the expired preexisting test nonce before inserting the canary nonce, so the canary nonce was retained to preserve the one-row ledger baseline instead of deleting it and creating count drift.',
            'Post-cleanup staging returned to one historical worker run, zero test worker runs, one test nonce row and zero orders, budgets, history, domain events, metric events or delivery attempts.',
            'The remote replay canary required no Edge Function deploy, migration or Cron change; Railway, production and merge remain blocked.'
          ]);
          ord.nextActions = ord.nextActions.filter((action) =>
            !/execute.*remote.*replay.*canary|remote concurrent replay canary.*exact authorization|cleanup-safe.*remote concurrent replay canary/i.test(action)
          );
          appendUnique(ord.nextActions, [
            'Review the remaining ORD-001 blockers after the successful remote replay canary and select the next repository-only closure sublot; do not activate Railway, production or merge from generic continuation.'
          ]);

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-application.js
          node scripts/audit-ord-001-a07e-remote-concurrent-replay-canary-readiness.js
          node scripts/audit-ord-001-a07e-concurrent-replay-canary.js
          node scripts/audit-ord-001-a07d-edge-function-staging-deploy-application.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07E remote replay application' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

# Retry after cleanup terminology alignment.
