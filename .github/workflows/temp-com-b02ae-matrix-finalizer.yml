name: TEMP COM-B02AE Matrix Finalizer

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02ae-matrix-finalizer.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-com-b02ae-matrix-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prove temporary install lineage
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=cd1dbec32a3479184e19626a6703f3bedbfe24a0
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = ".github/workflows/temp-com-b02ae-matrix-finalizer.yml"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate canonical Matrix derivatives only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BEFORE="$(git hash-object config/domain-completion-matrix.json)"
          npm run write:domain-completion-matrix
          SOURCE_AFTER="$(git hash-object config/domain-completion-matrix.json)"
          test "$SOURCE_BEFORE" = "$SOURCE_AFTER"
          test "$SOURCE_AFTER" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$changed" = "$expected"

      - name: Revalidate B02AE and governance
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/shared/http/repository-only-route-continuation-state-registry-adapter-implementation.js
          node --check scripts/test-com-b02ae-repository-only-continuation-state-registry-adapter-implementation.js
          node scripts/test-com-b02ae-repository-only-continuation-state-registry-adapter-implementation.js
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Remove TEMP and prove final permanent scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=f9b57034e27a7d8ed42a4eeb9673d6a640e69915
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- reports/generated/domain-completion-matrix-report.json
          git rm -- .github/workflows/temp-com-b02ae-matrix-finalizer.yml
          actual="$(git diff HEAD --name-only "$BASE" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02ae-repository-only-continuation-state-registry-adapter-implementation.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-adapter-implementation.js \
            config/com-b02ae-repository-only-continuation-state-registry-adapter-implementation.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02ae-repository-only-continuation-state-registry-adapter-implementation.js | sort)"
          test "$actual" = "$expected"
          test "$(git hash-object config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          git diff --check "$BASE"
          git commit -m "docs(com): reconcile B02AE Domain Completion Matrix derivatives"

      - name: Fast-forward branch only
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/com/com-001-baseline-audit
