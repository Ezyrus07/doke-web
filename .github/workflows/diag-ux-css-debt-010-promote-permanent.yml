name: Doke UX-CSS-DEBT-010 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-010-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PARENT_SHA: 4d96f04758ba0e33b7b1490a95a5c1e6e2f3e819
      TARGET_BRANCH: ux/ux-css-debt-010-pedidos-command-center-compaction
      TARGET_FILE: assets/css/pages/pedidos/orders-command-center.css
      EXPECTED_PARENT_SHA256: a775b3d0b334c7e4f524be722ad2f826e5a66224e857ecd9c464501f833522af
      EXPECTED_CANDIDATE_SHA256: 4e21d66fb22b5e3b4409670e66adef26551642b1e6ce9cb6896e6146d47f3e7f
      FOCUS_SELECTOR: 'body.orders-page-shell .orders-page .home-side-meta.is-search-open .home-side-meta__search-input:focus'
    steps:
      - name: Checkout permanent target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard target remains exact certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_PARENT_SHA256}"
          git diff --exit-code

      - name: Build exact deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const file=process.env.TARGET_FILE,parent=fs.readFileSync(file,'utf8'),lines=parent.split(/\r?\n/);
          let depth=0,selectorParts=[],atRuleParts=[],selector=null;const declarations=[],stack=[];
          const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=parts=>parts.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          for(let i=0;i<lines.length;i++){
            const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector){
              if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}
              else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}
              else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
              else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
            }
            if(selector){const m=line.match(declRe);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1].toLowerCase(),important,context});}}
            depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}
          }
          if(atRuleParts.length)throw new Error('unterminated multiline at-rule');
          const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push(d);if(!later||d.important||!later.important)last.set(key,d);}
          const selectors=[...new Set(dead.map(d=>d.selector))].sort(),focus=process.env.FOCUS_SELECTOR,focusRows=dead.filter(d=>d.selector===focus),otherRows=dead.filter(d=>d.selector!==focus);
          if(declarations.length!==1931||dead.length!==22||selectors.length!==4)throw new Error('metric drift');
          if(focusRows.length!==8||!focusRows.every(d=>d.context==='@media (min-width: 1024px)'))throw new Error('focus context drift');
          if(!otherRows.every(d=>d.context===''))throw new Error('global-context drift');
          const deadSet=new Set(dead.map(d=>d.lineIndex)),candidate=lines.filter((_l,i)=>!deadSet.has(i)).join('\n'),sha=v=>crypto.createHash('sha256').update(v).digest('hex');
          if(sha(parent)!==process.env.EXPECTED_PARENT_SHA256)throw new Error('parent hash drift');
          if(sha(candidate)!==process.env.EXPECTED_CANDIDATE_SHA256)throw new Error('candidate hash drift');
          if(Buffer.byteLength(parent)!==120557||Buffer.byteLength(candidate)!==120028)throw new Error('byte drift');
          if((parent.match(/!important/gi)||[]).length||(candidate.match(/!important/gi)||[]).length)throw new Error('unexpected !important');
          fs.writeFileSync(file,candidate);
          NODE

      - name: Guard exact permanent delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "22"
          git diff --check

      - name: Commit and push product-only tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "${TARGET_FILE}"
          git commit -m "UX-CSS-DEBT-010: compact superseded Pedidos command-center declarations"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git diff --name-only "${PARENT_SHA}"...HEAD)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}"...HEAD -- "${TARGET_FILE}" | awk '{print $2}')" = "22"
          git push origin HEAD:"${TARGET_BRANCH}"
