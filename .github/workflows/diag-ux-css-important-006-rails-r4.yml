eady.featuredChildren<1||ready.shortChildren<1||!ready.visible)throw Error(`runtime not materialized ${JSON.stringify(ready)} w=${w}`);if(state==='rail'){const m=await p.evaluate(()=>{const el=document.querySelector('#featured-services-track'),max=Math.max(0,el.scrollWidth-el.clientWidth);if(max<=0)return{max,left:0};el.scrollLeft=Math.min(120,max);return{max,left:el.scrollLeft}});if(!m||m.max<=0||m.left<=0)throw Error(`rail not scrollable ${JSON.stringify(m)} w=${w}`);await p.waitForTimeout(150)}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate((targets)=>{const round=n=>Math.round(n*1000)/1000,out={};for(const t of targets){out[t.s]=[...document.querySelectorAll(t.s)].map(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(const x of t.p)style[x]=cs.getPropertyValue(x).trim();return{style,rect:{x:round(r.x),y:round(r.y),w:round(r.width),h:round(r.height)},scroll:{cw:el.clientWidth,ch:el.clientHeight,sw:el.scrollWidth,sh:el.scrollHeight,sx:round(el.scrollLeft),sy:round(el.scrollTop)},children:el.children.length}})}const track=document.querySelector('#featured-services-track');out.__scrollbar=track?{display:getComputedStyle(track,'::-webkit-scrollbar').display}:null;return out},targets);const png=hash(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}
