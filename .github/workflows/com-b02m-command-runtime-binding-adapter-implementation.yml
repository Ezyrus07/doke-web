name: COM-B02M Command Runtime Binding Adapter Implementation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-command-runtime-binding-adapter-implementation.js'
      - 'config/com-b02m-command-runtime-binding-adapter-implementation.json'
      - 'scripts/test-com-b02m-command-runtime-binding-adapter-implementation.js'
      - '.github/workflows/com-b02m-command-runtime-binding-adapter-implementation.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02m-command-runtime-binding-adapter-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02L predecessor and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=c5dca9ed3f797d0d062d113ea9417645d2016bf3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-binding-adapter-contract.js)" = "c48eabab7bb5b37b6a1663a051b3a8a6223cd0c9"
          test "$(git rev-parse HEAD:config/com-b02l-command-runtime-binding-adapter-contract.json)" = "31f234b9724d44047031f0dca4f9d3f32518f4b9"
          test "$(git rev-parse HEAD:scripts/test-com-b02l-command-runtime-binding-adapter-contract.js)" = "dacb6079809784fec95aeb1672c2411332767313"
          test "$(git rev-parse HEAD:.github/workflows/com-b02l-command-runtime-binding-adapter-contract.yml)" = "9268fbb2919ab502bce13ec5f33d26ad962a8f4a"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-composition.js)" = "27b1e212c3656dd4ad5a1f2f604903ce44c8dbfb"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git rev-parse HEAD:backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-binding-adapter-implementation.js)" = "233e241fa9da0494d0d350c9ac686168e508d2e2"
          test "$(git rev-parse HEAD:config/com-b02m-command-runtime-binding-adapter-implementation.json)" = "86c5aefeb3826932bd1ce7cafaddf557a5a57acc"
          test "$(git rev-parse HEAD:scripts/test-com-b02m-command-runtime-binding-adapter-implementation.js)" = "68de4eb458a8d4d59aa20a02731ec9e139222f62"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02m-command-runtime-binding-adapter-implementation.yml \
            backend/modules/communities/community-command-runtime-binding-adapter-implementation.js \
            config/com-b02m-command-runtime-binding-adapter-implementation.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02m-command-runtime-binding-adapter-implementation.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected"

      - name: Syntax and semantic adapter-implementation conformance
        run: |
          node --check backend/modules/communities/community-command-runtime-binding-adapter-implementation.js
          node --check scripts/test-com-b02m-command-runtime-binding-adapter-implementation.js
          node scripts/test-com-b02m-command-runtime-binding-adapter-implementation.js

      - name: Runtime ports remain descriptive and unbound
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/community-command-runtime-binding-adapter-implementation.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'loadCanonicalState\(|claimIdempotencyKey\(|createCommunityProjectionOutcome\(|commitEventProjectionOutcome\(' "$TARGET"
          ! grep -E '^\s*async\s+|\bawait\b' "$TARGET"
          grep -F 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          node - <<'NODE'
          const handlers=require('./backend/modules/communities/route-handlers');
          const loader=require('./backend/shared/http/module-route-loader');
          const impl=require('./backend/modules/communities/community-command-runtime-binding-adapter-implementation');
          for(const name of ['executeMembershipCommand','executeGovernanceCommand','executeContentCommand']){
            if(handlers.handlers[name]!==handlers[name])throw new Error(`B02M_EXECUTE_HANDLER_DRIFT:${name}`);
            if(loader.getHandler('communities',name)!==handlers[name])throw new Error(`B02M_LOADER_HANDLER_DRIFT:${name}`);
          }
          for(const name of ['beginRuntimeBindingAdapter','resumeWithCanonicalState','resumeWithIdempotencyClaim','resumeWithRepositoryWrite']){
            if(typeof impl[name]!=='function')throw new Error(`B02M_IMPLEMENTATION_EXPORT_MISSING:${name}`);
            if(Object.prototype.hasOwnProperty.call(handlers.handlers,name))throw new Error(`B02M_IMPLEMENTATION_RUNTIME_BOUND:${name}`);
            if(loader.getHandler('communities',name)!==null)throw new Error(`B02M_LOADER_EXPOSES_IMPLEMENTATION:${name}`);
          }
          const b=require('./config/com-b02m-command-runtime-binding-adapter-implementation.json');
          if(b.authorization.received!==true||b.authorization.type!=='standing_repository_only'||b.authorization.genericNextAuthorized!==true||b.authorization.sensitiveBoundariesExcluded!==true)throw new Error('B02M_AUTHORIZATION_DRIFT');
          if(b.implementation.invokesRepositoryPorts!==false||b.implementation.bindsExecutor!==false||b.implementation.bindsRuntimeHandler!==false||b.implementation.activatesRuntime!==false)throw new Error('B02M_IMPLEMENTATION_SCOPE_DRIFT');
          if(b.runtimeState.repositoryV2ExecutorBound!==false||b.runtimeState.repositoryV2SqlApplied!==false||b.runtimeState.runtimeHandlerBound!==false||b.runtimeState.runtimeActivated!==false)throw new Error('B02M_RUNTIME_STATE_DRIFT');
          if(b.authority.repositoryOnlyAdapterImplementationAuthority!==true)throw new Error('B02M_REPOSITORY_ONLY_AUTHORITY_REQUIRED');
          for(const k of ['runtimeHandlerMutationAuthority','moduleRouteLoaderMutationAuthority','repositoryExecutorBindingAuthority','runtimeActivationAuthority','stagingDeploymentAuthority','stagingTrafficAuthority','rpcExecutionAuthority','networkAuthority','realtimeActivationAuthority','credentialReadAuthority','identityLifecycleRemoteAuthority','realCommunityMutationAuthority','migrationApplicationAuthority','triggerCreationAuthority','receiptCreationAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','r5iCreationAuthority'])if(b.authority[k]!==false)throw new Error(`B02M_FORBIDDEN_AUTHORITY:${k}`);
          for(const k of ['b02lContractChanged','b02jCompositionChanged','routeHandlersChanged','moduleRouteLoaderChanged','repositoryPortInvoked','repositoryExecutorBound','runtimeHandlerBound','runtimeActivated','stagingDeploymentExecuted','stagingTrafficEnabled','rpcExecuted','networkRequestExecuted','realtimeSubscriptionExecuted','credentialReadExecuted','remoteIdentityMutationExecuted','realCommunityMutationExecuted','migrationApplied','triggerCreated','receiptCreated','productionChanged','pullRequestMerged','readyForReviewChanged'])if(b.effects[k]!==false)throw new Error(`B02M_FORBIDDEN_EFFECT:${k}`);
          if(b.functionalCheckpoint.lastFunctionalCheckpoint!=='COM-B03C-R5H'||b.functionalCheckpoint.exactRootCauseProven!==false||b.functionalCheckpoint.causalPromotionAllowed!==false||b.functionalCheckpoint.privatePresencePromotionAllowed!==false||b.functionalCheckpoint.r5iCreated!==false||b.functionalCheckpoint.r5iInferred!==false)throw new Error('B02M_FUNCTIONAL_CHECKPOINT_DRIFT');
          NODE
          ! git diff --name-only c5dca9ed3f797d0d062d113ea9417645d2016bf3 HEAD | grep '^supabase/migrations/'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check c5dca9ed3f797d0d062d113ea9417645d2016bf3 HEAD
