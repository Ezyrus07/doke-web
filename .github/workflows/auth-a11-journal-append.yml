name: AUTH-A11 Journal Closure Append

on:
  push:
    branches:
      - 'auth/**'

permissions:
  contents: read

jobs:
  append:
    if: startsWith(github.event.head_commit.message, 'Run AUTH-A11 journal closure append')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Append closure entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/DOKE-ENGINEERING-JOURNAL.md')
          text = path.read_text(encoding='utf-8')
          marker = '# Entry template'
          if text.count(marker) != 1:
              raise SystemExit('Journal template marker is missing or ambiguous.')
          if '## 2026-07-26 — AUTH-A11 provider-reconciled identity authority closed' in text:
              raise SystemExit('AUTH-A11 closure entry already exists.')

          entry = '''## 2026-07-26 — AUTH-A11 provider-reconciled identity authority closed

**Scope:** PR #9, branch `auth/auth-001-baseline-audit`, staging project `zwkczgewzbsorbrjuzpb`

**Outcome:** `DONE` for AUTH-A11; `BLOCKED` for AUTH-A07 under MAIL-001 and for PAID-001 / SEC-B05

### Context

Profile, settings and onboarding mutations still crossed the authentication boundary, duplicated provider metadata in the browser and could manually rewrite the public session snapshot. The final staging closure also required proving the new server authorities through the deployed authenticated Edge path rather than relying only on source and SQL tests.

### Decision

Keep Supabase Auth as the credential/session authority and move public identity mutations to narrow self-service database operations. A successful browser mutation must consume the canonical server response; a failure must preserve the previous public snapshot and surface the real provider error.

### Implementation

- Removed `DokeAuth.updateCurrentUser` and `DokeAuth.updateCurrentProfile` from the canonical Auth and Session Authority surfaces.
- Added server-reconciled profile mutation through `update_account_profile_reconciled`.
- Added narrow settings mutation through `update_account_settings`.
- Added server-reconciled onboarding through `complete_account_onboarding_reconciled`.
- Removed browser `supabase.auth.updateUser(...)` metadata duplication and manual Supabase session writes from profile/onboarding success paths.
- Added permanent deterministic runtimes for profile, settings and onboarding reconciliation.
- Applied migration 147 to staging as `identity_profile_reconciliation_authority`, version `20260726141755`.
- Deployed `self-service-operations` version 5 with `verify_jwt = true` and the AUTH-A11 allowlist.

### Validation

- Browser/runtime validation head `e5341f5f9063ddf36c1c350971c6568e4625f62b` passed Quality Gates #544, blocking E2E, 105 visual guards, Staging Edge HTTP Canary #318 and Diagnostic E2E #339.
- SQL validation 016 passed in a transaction followed by rollback.
- Direct execution by `anon` and `authenticated` remains revoked for the new identity/settings functions; `service_role` retains the dispatcher path.
- Authenticated public-Edge canary run `30206309047`, final job `89805250392`, passed profile, settings, onboarding and final identity reconciliation through `self-service-operations` v5.
- The canary confirmed that protected e-mail, role and account-status fields were unchanged and rejected settings keys were not persisted.
- The disposable identity was deleted after validation; remaining rows in `auth.users`, `auth.identities`, `public.users` and `public.user_profiles` were all zero.
- Security Advisor showed no new AUTH-A11-specific issue.

### Risks and boundaries

- Production was not changed.
- No real account, credential, contact, profile, role or settings record was modified.
- No persistent synthetic identity remains.
- No SMTP, SMS, OAuth or paid configuration was enabled.
- `MAIL-001` remains open and keeps AUTH-A07 blocked.
- Leaked-password protection remains blocked by the current Supabase plan under `PAID-001 / SEC-B05`.
- PR #9 remains draft and must not be merged without explicit authorization.

### Next step

Audit and reconcile the remaining identity/profile contracts and dormant local repository surfaces before selecting the next unblocked AUTH-001 implementation sublot. Do not implement verified contact changes while MAIL-001 remains unresolved.

---

'''
          path.write_text(text.replace(marker, entry + marker), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'docs/DOKE-ENGINEERING-JOURNAL.md'

      - name: Publish journal entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git commit -m 'Record AUTH-A11 staging closure in engineering journal'
          git push origin HEAD:${{ github.ref_name }}
