name: Doke UX-CSS-DEBT-072 Promote Permanent
on:
  push:
    branches: [diag/ux-css-debt-072-promote-permanent]
    paths: [.github/workflows/diag-ux-css-debt-072-promote-permanent.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 5c888a5ec84329062fac2de6ccf7ff3061fd07fd
      PARENT_PARENT_SHA: 149bfa8cdb931543aabd1afb0a5453379f565ae8
      TARGET_FILE: assets/css/components/cards/service-card.css
      PARENT_TARGET_BLOB: 0847b48ee62e3d09c737a35a46f6ce5271aac143
      EXPECTED_SHA256: 7c9fdffc50c299e9912873da8a838f8e02c22a247f40fe94f51b3fd1ba0083bc
      EXPECTED_BYTES: 16290
      PERMANENT_BRANCH: ux/ux-css-debt-072-service-card-compaction
      CORE_RUN: 32089138938
      GOVERNANCE_RUN: 32089177607
      INERTNESS_RUN: 32089093770
      DIAG_BRANCH: diag/ux-css-debt-072-promote-permanent
      RESULT_FILE: .diagnostics/ux-css-debt-072-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2
      - name: Guard exact parent and permanent lease seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH"
          test "$(git rev-parse origin/$PERMANENT_BRANCH)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PROMOTION GUARD PASS|parent=$PARENT_SHA|permanentSeed=$(git rev-parse origin/$PERMANENT_BRANCH)"
      - name: Rebuild exact certified candidate and atomically promote
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE,ls=fs.readFileSync(f,'utf8').split('\n');const rows=new Map([[338,'    transform: var(--doke-interaction-lift-card);'],[339,'    box-shadow: none;'],[340,'    border-color: rgba(82, 137, 198, 0.22);'],[345,'    opacity: 0.98;'],[470,'    border-radius: var(--doke-mobile-card-radius, var(--radius-surface));'],[474,'    min-height: var(--doke-mobile-card-media, clamp(168px, 49vw, 206px));'],[476,'    padding: var(--doke-mobile-card-padding, 14px);'],[480,'    padding: var(--doke-mobile-card-padding, 14px);'],[481,'    gap: 10px;'],[482,'    grid-template-columns: minmax(0, 1fr) auto;']]);for(const [i,v] of rows)if((ls[i]||'').replace(/\r$/,'')!==v)throw Error(`row drift ${i+1}`);const out=ls.filter((_,i)=>!rows.has(i)).join('\n');fs.writeFileSync(f,out);const b=fs.readFileSync(f),h=crypto.createHash('sha256').update(b).digest('hex');if(h!==process.env.EXPECTED_SHA256||b.length!==+process.env.EXPECTED_BYTES)throw Error(`identity ${h}/${b.length}`);console.log(`PROMOTION CANDIDATE PASS|sha256=${h}|bytes=${b.length}|parent=289/10|candidate=279/0|files=1|additions=0|deletions=10`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t10\t'"$TARGET_FILE"
          git diff --quiet "$PARENT_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_FILE"
          git commit -m 'UX-CSS-DEBT-072: compact superseded service card declarations'
          NEW_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git diff --name-only "$PARENT_SHA" "$NEW_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$NEW_SHA" -- "$TARGET_FILE")" = $'0\t10\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERMANENT_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERMANENT_BRANCH"
          git fetch origin "refs/heads/$PERMANENT_BRANCH:refs/remotes/origin/$PERMANENT_BRANCH"
          test "$(git rev-parse origin/$PERMANENT_BRANCH)" = "$NEW_SHA"
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "NEW_TARGET_BLOB=$(git hash-object "$TARGET_FILE")" >> "$GITHUB_ENV"
          echo "PROMOTION PASS|permanent=$PERMANENT_BRANCH|sha=$NEW_SHA|parent=$PARENT_SHA|tree=$(git rev-parse HEAD^{tree})|blob=$(git hash-object "$TARGET_FILE")|files=1|additions=0|deletions=10"
      - name: Restore product checkout and publish promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PARENT_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"; echo "PARENT_SHA=$PARENT_SHA"; echo "NEW_SHA=$NEW_SHA"; echo "NEW_TREE=$NEW_TREE"; echo "PARENT_TARGET_BLOB=$PARENT_TARGET_BLOB"; echo "NEW_TARGET_BLOB=$NEW_TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo 'DIFF=1 file +0/-10'; echo "CORE_RUN=$CORE_RUN"; echo "GOVERNANCE_RUN=$GOVERNANCE_RUN"; echo "INERTNESS_RUN=$INERTNESS_RUN"; echo 'RESULT=PASS'; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH"
          git checkout -B diag-output "origin/$DIAG_BRANCH"
          mkdir -p "$(dirname "$RESULT_FILE")" && cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE" && git commit -m 'diag: record UX-CSS-DEBT-072 promotion [skip ci]'
          git push origin "HEAD:refs/heads/$DIAG_BRANCH"
