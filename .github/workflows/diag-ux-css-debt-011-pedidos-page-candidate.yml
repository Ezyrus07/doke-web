name: Doke UX-CSS-DEBT-011 Pedidos Page Candidate

on:
  push:
    branches:
      - diag/ux-css-debt-011-pedidos-page-candidate

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9f1274abeff4aa0d17391cfc9929559d3d286f93
      TARGET_FILE: assets/css/pages/pedidos.css
    steps:
      - name: Checkout exact UX-CSS-DEBT-010 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "${TARGET_FILE}" /tmp/pedidos-parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const file=process.env.TARGET_FILE,text=fs.readFileSync(file,'utf8'),lines=text.split(/\r?\n/);
          let depth=0,selectorParts=[],atRuleParts=[],selector=null;const declarations=[],stack=[];
          const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=parts=>parts.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          for(let i=0;i<lines.length;i++){
            const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector){
              if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}
              else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}
              else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
              else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
            }
            if(selector){const m=line.match(declRe);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,selector,property:m[1].toLowerCase(),important,context});}}
            depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}
          }
          if(atRuleParts.length)throw new Error('unterminated multiline at-rule');
          const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push(d);if(!later||d.important||!later.important)last.set(key,d);}
          const selectors=[...new Set(dead.map(d=>d.selector))].sort(),contexts=[...new Set(dead.map(d=>d.context))].sort(),deadSet=new Set(dead.map(d=>d.lineIndex));
          if(declarations.length!==1289||dead.length!==14||selectors.length!==11)throw new Error(`metric drift ${declarations.length}/${dead.length}/${selectors.length}`);
          if((text.match(/!important/gi)||[]).length!==0)throw new Error('unexpected !important');
          for(const c of contexts){if(c && !c.split(' || ').every(x=>x.startsWith('@media ')))throw new Error(`unsupported at-rule context: ${c}`);}
          const candidate=lines.filter((_l,i)=>!deadSet.has(i)).join('\n');
          fs.writeFileSync('/tmp/pedidos-candidate.css',candidate);fs.writeFileSync('/tmp/pedidos-selectors.json',JSON.stringify(selectors));fs.writeFileSync('/tmp/pedidos-dead.json',JSON.stringify(dead,null,2));fs.writeFileSync('/tmp/pedidos-contexts.json',JSON.stringify(contexts));fs.writeFileSync(file,candidate);
          const sha=v=>crypto.createHash('sha256').update(v).digest('hex');
          console.log('Deterministic candidate: PASS');console.log(`- declarations: ${declarations.length} -> ${declarations.length-dead.length}`);console.log(`- deleted: ${dead.length}`);console.log(`- selectors: ${selectors.length}`);console.log(`- bytes: ${Buffer.byteLength(text)} -> ${Buffer.byteLength(candidate)}`);console.log(`- parent sha256: ${sha(text)}`);console.log(`- candidate sha256: ${sha(candidate)}`);console.log('- contexts:',JSON.stringify(contexts));console.log('- selectors:',JSON.stringify(selectors));console.log('- dead rows:',JSON.stringify(dead));
          NODE
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "14"
          git diff --check

      - name: Write runtime parity harness
        shell: bash
        run: |
          cat > /tmp/pedidos-011-capture.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2],selectors=JSON.parse(fs.readFileSync('/tmp/pedidos-selectors.json','utf8')),dead=JSON.parse(fs.readFileSync('/tmp/pedidos-dead.json','utf8'));
          const vps=[['1600x1000',1600,1000],['1366x768',1366,768],['1280x802',1280,802],['1024x900',1024,900],['820x1180',820,1180],['608x926',608,926],['390x844',390,844]];
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const mediaParts=c=>!c?[]:c.split(' || ').map(x=>x.replace(/^@media\s+/,'').trim());
          async function main(){await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}),result={},contextCoverage=new Map(dead.map(d=>[d.context,false]));for(const [name,width,height] of vps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto('http://127.0.0.1:5500/pedidos.html',{waitUntil:'domcontentloaded'});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});await page.evaluate(()=>{document.documentElement.removeAttribute('data-auth-guard');document.body.setAttribute('data-page','pedidos');document.body.classList.add('orders-page-shell');});
            for(const d of dead){const parts=mediaParts(d.context);const active=await page.evaluate(parts=>parts.every(q=>matchMedia(q).matches),parts);if(active)contextCoverage.set(d.context,true);}
            const canonical=await page.evaluate(selectors=>Object.fromEntries(selectors.map(s=>{try{return[s,document.querySelectorAll(s).length]}catch{return[s,-1]}})),selectors);if(Object.values(canonical).some(v=>v<0))throw new Error('invalid selector');
            const bodySelector=selectors.find(s=>s.startsWith('body.orders-page-shell .page__content-inner'));if(bodySelector&&canonical[bodySelector]===0)throw new Error(`canonical owner selector missing: ${bodySelector}`);
            await page.evaluate(({selectors,canonical})=>{const root=document.querySelector('.orders-page')||document.body;const fixture=document.createElement('div');fixture.dataset.cssDebtFixture='pedidos-011';fixture.innerHTML='<div class="orders-list"><article><div class="order-card__top"></div><div class="order-card__meta-grid"></div><div class="order-card__actions"><button class="order-card__button">Fixture</button></div></article></div><section class="orders-planner"><div class="orders-planner__card"><button class="orders-planner__month-button">Mês</button></div></section><aside class="orders-sidepanel--details"></aside>';root.appendChild(fixture);for(const s of selectors){if(!document.querySelector(s))throw new Error(`fixture could not cover ${s}`);}}, {selectors,canonical});await page.evaluate(()=>document.fonts&&document.fonts.ready);await sleep(60);
            result[name]=await page.evaluate(({selectors,canonical})=>{const clean=v=>String(v??'').replace(/\s+/g,' ').trim(),capture=el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(let i=0;i<cs.length;i++){const p=cs[i];style[p]=clean(cs.getPropertyValue(p));}return{tag:el.tagName,id:el.id||'',className:typeof el.className==='string'?clean(el.className):'',rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)],style};},samples={};for(const s of selectors){const nodes=[...document.querySelectorAll(s)];samples[s]=nodes.map(capture);}return{canonical,samples};},{selectors,canonical});console.log(`${name}: selectors ${selectors.length}/${selectors.length}; canonical present ${Object.values(canonical).filter(v=>v>0).length}/${selectors.length}`);await ctx.close();}
            for(const [c,hit] of contextCoverage){if(!hit)throw new Error(`at-rule context not exercised: ${c}`);}await browser.close();fs.writeFileSync(out,JSON.stringify(result));console.log('All dead at-rule contexts exercised by viewport matrix: PASS');}
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Capture parent runtime and baseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pedidos-parent.css "${TARGET_FILE}"
          node /tmp/pedidos-011-capture.js /tmp/pedidos-parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/pedidos-parent-responsive.json
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/pedidos-parent-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/pedidos-parent-conflicts.log

      - name: Restore candidate and preserve responsive contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pedidos-candidate.css "${TARGET_FILE}"
          cp /tmp/pedidos-parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/pedidos-responsive.log
          grep -q 'Checks: 893' /tmp/pedidos-responsive.log
          grep -q 'Failures: 0' /tmp/pedidos-responsive.log
          grep -q 'Skips: 277' /tmp/pedidos-responsive.log

      - name: Require exact parent-to-candidate runtime parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/pedidos-011-capture.js /tmp/pedidos-candidate-runtime.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/pedidos-parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/pedidos-candidate-runtime.json')),diffs=[];
          function walk(x,y,p){if(typeof x!==typeof y||x===null||y===null||typeof x!=='object'){if(x!==y)diffs.push({path:p,parent:x,candidate:y});return;}if(Array.isArray(x)!==Array.isArray(y)){diffs.push({path:p,parent:x,candidate:y});return;}for(const k of [...new Set([...Object.keys(x),...Object.keys(y)])].sort())walk(x[k],y[k],p?`${p}.${k}`:k);}walk(a,b,'');if(diffs.length){console.error(JSON.stringify(diffs.slice(0,100),null,2));throw new Error(`runtime differences ${diffs.length}`);}console.log('Affected-selector computed-style + rect parity: PASS (0 diffs)');
          NODE

      - name: Validate structural and governance contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/pedidos-candidate-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/pedidos-candidate-conflicts.log
          echo 'CSS conflicts: 339 -> 339'
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/pedidos-legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:duplicate-assets
          grep -q 'active legacy/remediation css: 0' /tmp/pedidos-legacy.log
          grep -q 'active legacy/remediation js: 0' /tmp/pedidos-legacy.log
          grep -q 'high risk active css: 38' /tmp/pedidos-legacy.log

      - name: Require product-only candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git restore -- reports docs/HOME-AUTHORITY-CLASSIFICATION.md docs/PAGE-ASSET-AUTHORITY-MATRIX.md || true
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "14"
          git diff --check
          echo 'Candidate scope: PASS (one product file, +0/-14)'
