name: Doke SCHED-B04D Canonical Order Projection Guard Readiness

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - 'supabase/migrations/20260801183000_sched_b04d_canonical_order_projection_guard.sql'
      - 'backend/modules/scheduling/scheduling-postgres-repository.js'
      - 'config/sched-001-b04d-canonical-order-projection-guard-readiness.json'
      - 'docs/SCHED-001-B04D-CANONICAL-ORDER-PROJECTION-GUARD-READINESS.md'
      - 'docs/validation/SCHED-001-B04D-CANONICAL-ORDER-PROJECTION-GUARD-READINESS.json'
      - 'scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js'
      - 'scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js'
      - '.github/workflows/sched-001-b04d-canonical-order-projection-guard-readiness.yml'
      - 'config/domain-completion-matrix.json'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Audit B04D canonical projection guard readiness
        run: node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
      - name: Test B04D canonical projection adapter runtime
        run: node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
      - name: Preserve B04C and B04B contracts
        run: |
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-readiness.js
          node scripts/audit-sched-001-b04b-ord-canonical-wiring-implementation.js
          node scripts/test-sched-001-b04b-ord-canonical-wiring-runtime.js
      - name: Preserve scheduling persistence and ORD handoff
        run: |
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/test-sched-001-a04-scheduling-service-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
      - name: Audit domain completion matrix
        run: npm run audit:domain-completion-matrix
