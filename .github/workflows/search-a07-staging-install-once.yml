name: Doke SEARCH-A07 Staging Install Once

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-a07-staging-install-once.yml'
      - 'supabase/migrations/160_service_search_ranking_v1.sql'
      - 'supabase/tests/024_service_search_ranking_v1_validation.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-search-a07-staging-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-validate:
    name: Install inactive ranking infrastructure and validate rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOKE_SUPABASE_DB_URL: ${{ secrets.DOKE_SUPABASE_DB_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply exact A07 migration to staging and run transactional validation
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="${DOKE_SUPABASE_DB_URL:-${SUPABASE_DB_URL:-}}"
          if [ -z "$DB_URL" ]; then
            echo "Missing DOKE_SUPABASE_DB_URL or SUPABASE_DB_URL repository secret."
            exit 1
          fi
          case "$DB_URL" in
            *zwkczgewzbsorbrjuzpb*) ;;
            *)
              echo "Database target is not the approved doke-web-staging project."
              exit 1
              ;;
          esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/160_service_search_ranking_v1.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/024_service_search_ranking_v1_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_active text;
            v_versions integer;
            v_events integer;
          begin
            select active_version into v_active
            from private.service_search_ranking_state
            where singleton = true;

            select count(*) into v_versions
            from private.service_search_ranking_versions
            where version in ('search-rank-v0', 'search-rank-v1');

            select count(*) into v_events
            from private.service_search_ranking_state_events;

            if v_active <> 'search-rank-v0' then
              raise exception 'SEARCH_A07_ACTIVE_VERSION_CHANGED: %', v_active;
            end if;
            if v_versions <> 2 then
              raise exception 'SEARCH_A07_VERSION_SET_INVALID: %', v_versions;
            end if;
            if v_events <> 0 then
              raise exception 'SEARCH_A07_TRANSACTIONAL_EVENTS_PERSISTED: %', v_events;
            end if;
          end;
          $$;
          SQL

      - name: Confirm public search RPC remains on legacy ordering
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="${DOKE_SUPABASE_DB_URL:-${SUPABASE_DB_URL:-}}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select case when pg_get_functiondef('public.search_public_services_v1(jsonb)'::regprocedure) like '%order by updated_at desc, id desc%' then 'legacy-order-preserved' else 'unexpected-order' end;" | grep -Fx 'legacy-order-preserved'
