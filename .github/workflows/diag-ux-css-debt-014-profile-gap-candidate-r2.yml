name: Doke UX-CSS-DEBT-014 Profile Gap Candidate R2

on:
  push:
    branches:
      - diag/ux-css-debt-014-profile-gap-candidate-r2

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 6fee4223f75b86833e0d6540315d6185d2e74f2a
      TARGET_FILE: assets/css/pages/profile-page.css
    steps:
      - name: Checkout exact UX-CSS-DEBT-013 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build deterministic deletion-only candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "${TARGET_FILE}" /tmp/profile-parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const file=process.env.TARGET_FILE,text=fs.readFileSync(file,'utf8'),lines=text.split(/\r?\n/);
          let depth=0,selectorParts=[],atRuleParts=[],selector=null;const declarations=[],stack=[];
          const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=parts=>parts.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          for(let i=0;i<lines.length;i++){
            const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;
            if(!selector){
              if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}
              else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}
              else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
              else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}
            }
            if(selector){const m=line.match(declRe);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,line:i+1,selector,property:m[1].toLowerCase(),value:raw,important,context});}}
            depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}
          }
          if(atRuleParts.length)throw new Error('unterminated multiline at-rule');
          const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push({...d,winnerLine:later.line,winnerValue:later.value,winnerImportant:later.important});if(!later||d.important||!later.important)last.set(key,d);}
          const selectors=[...new Set(dead.map(d=>d.selector))].sort(),contexts=[...new Set(dead.map(d=>d.context))].sort(),deadSet=new Set(dead.map(d=>d.lineIndex));
          const expectedSelector='body.profile-page-shell[data-profile-contract="clean-v1"] .profile-feed';
          if(declarations.length!==747||dead.length!==1||selectors.length!==1)throw new Error(`metric drift ${declarations.length}/${dead.length}/${selectors.length}`);
          if(JSON.stringify(selectors)!==JSON.stringify([expectedSelector]))throw new Error(`selector drift ${JSON.stringify(selectors)}`);
          if(JSON.stringify(contexts)!==JSON.stringify(['@media (max-width: 760px)']))throw new Error(`context drift ${JSON.stringify(contexts)}`);
          const d=dead[0];if(d.property!=='gap'||d.value!=='28px'||d.winnerValue!=='20px'||d.important||d.winnerImportant)throw new Error(`dead row drift ${JSON.stringify(d)}`);
          if((text.match(/!important/gi)||[]).length!==0)throw new Error('unexpected !important');
          const candidate=lines.filter((_l,i)=>!deadSet.has(i)).join('\n');
          fs.writeFileSync('/tmp/profile-candidate.css',candidate);fs.writeFileSync('/tmp/profile-selectors.json',JSON.stringify(selectors));fs.writeFileSync('/tmp/profile-dead.json',JSON.stringify(dead,null,2));fs.writeFileSync(file,candidate);
          const sha=v=>crypto.createHash('sha256').update(v).digest('hex');
          if(sha(text)!=='dd6377b618e7a0303e80da20ec5851aa60a2d81e2f22d86808e26315bcc859ca')throw new Error('parent hash drift');
          if(sha(candidate)!=='a331d4814bb0462c19cd2e88400f0d2806b84130bf891f936ba057c1ceff2b68')throw new Error('candidate hash drift');
          if(Buffer.byteLength(text)!==51261||Buffer.byteLength(candidate)!==51246)throw new Error('byte drift');
          console.log('Deterministic profile candidate R2: PASS');
          console.log('- declarations: 747 -> 746');console.log('- deleted: 1');console.log('- affected selectors: 1');
          console.log('- bytes: 51261 -> 51246');console.log('- parent sha256: dd6377b618e7a0303e80da20ec5851aa60a2d81e2f22d86808e26315bcc859ca');console.log('- candidate sha256: a331d4814bb0462c19cd2e88400f0d2806b84130bf891f936ba057c1ceff2b68');console.log('- context: @media (max-width: 760px)');
          NODE
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "1"
          git diff --check

      - name: Write four-page runtime parity harness
        shell: bash
        run: |
          cat > /tmp/profile-014-capture.js <<'NODE'
          const fs=require('fs'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const out=process.argv[2],selectors=JSON.parse(fs.readFileSync('/tmp/profile-selectors.json','utf8'));
          const pages=['meu-perfil.html','perfil-cliente.html','perfil-profissional.html','perfil.html'];
          const vps=[['1600x1000',1600,1000],['1366x768',1366,768],['1280x802',1280,802],['1024x900',1024,900],['820x1180',820,1180],['608x926',608,926],['390x844',390,844]];
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const result={};let mobileHits=0;
            for(const html of pages)for(const [name,width,height] of vps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto(`http://127.0.0.1:5500/${html}`,{waitUntil:'domcontentloaded'});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});await page.evaluate(()=>{document.documentElement.removeAttribute('data-auth-guard');document.body.removeAttribute('data-auth-guard');const feed=document.querySelector('.profile-feed');let n=feed;while(n&&n!==document.body){if(n.hasAttribute&&n.hasAttribute('hidden'))n.removeAttribute('hidden');n=n.parentElement;}});
              const canonical=await page.evaluate(selectors=>Object.fromEntries(selectors.map(s=>[s,document.querySelectorAll(s).length])),selectors);if(Object.values(canonical).some(v=>v!==1))throw new Error(`${html}/${name}: selector coverage drift ${JSON.stringify(canonical)}`);if(width<=760){const hit=await page.evaluate(()=>matchMedia('(max-width: 760px)').matches);if(!hit)throw new Error(`${html}/${name}: mobile context not active`);mobileHits++;}
              await page.evaluate(()=>document.fonts&&document.fonts.ready);await sleep(50);const key=`${html}:${name}`;result[key]=await page.evaluate(({selectors,canonical})=>{const clean=v=>String(v??'').replace(/\s+/g,' ').trim(),capture=el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(let i=0;i<cs.length;i++){const p=cs[i];style[p]=clean(cs.getPropertyValue(p));}return{tag:el.tagName,id:el.id||'',className:typeof el.className==='string'?clean(el.className):'',rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)],style};},samples={};for(const s of selectors)samples[s]=[...document.querySelectorAll(s)].map(capture);return{canonical,samples};},{selectors,canonical});console.log(`${html} ${name}: canonical selector 1/1`);await ctx.close();}
            if(mobileHits!==8)throw new Error(`mobile context coverage drift ${mobileHits}`);await browser.close();fs.writeFileSync(out,JSON.stringify(result));console.log('Four-page profile selector coverage: PASS (28 page/viewports; mobile context hits=8)');}
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Capture parent runtime, responsive baseline and conflicts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/profile-parent.css "${TARGET_FILE}"
          node /tmp/profile-014-capture.js /tmp/profile-parent-runtime.json
          node scripts/generate-responsive-index-baseline.js
          cp reports/responsive-index-baseline.json /tmp/profile-parent-responsive.json
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/profile-parent-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/profile-parent-conflicts.log

      - name: Restore candidate and preserve responsive contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/profile-candidate.css "${TARGET_FILE}"
          cp /tmp/profile-parent-responsive.json reports/responsive-index-baseline.json
          node scripts/test-responsive-contract.js | tee /tmp/profile-responsive.log
          grep -q 'Checks: 893' /tmp/profile-responsive.log
          grep -q 'Failures: 0' /tmp/profile-responsive.log
          grep -q 'Skips: 277' /tmp/profile-responsive.log

      - name: Require exact four-page parent-to-candidate runtime parity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/profile-014-capture.js /tmp/profile-candidate-runtime.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/profile-parent-runtime.json')),b=JSON.parse(fs.readFileSync('/tmp/profile-candidate-runtime.json')),diffs=[];
          function walk(x,y,p){if(typeof x!==typeof y||x===null||y===null||typeof x!=='object'){if(x!==y)diffs.push({path:p,parent:x,candidate:y});return;}if(Array.isArray(x)!==Array.isArray(y)){diffs.push({path:p,parent:x,candidate:y});return;}for(const k of [...new Set([...Object.keys(x),...Object.keys(y)])].sort())walk(x[k],y[k],p?`${p}.${k}`:k);}walk(a,b,'');if(diffs.length){console.error(JSON.stringify(diffs.slice(0,100),null,2));throw new Error(`runtime differences ${diffs.length}`);}console.log('Four-page affected-selector computed-style + rect parity: PASS (0 diffs)');
          NODE

      - name: Validate structural and governance contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/profile-candidate-conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/profile-candidate-conflicts.log
          echo 'CSS conflicts: 339 -> 339'
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:active-legacy-structures | tee /tmp/profile-legacy.log
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          npm run audit:duplicate-assets
          grep -q 'active legacy/remediation css: 0' /tmp/profile-legacy.log
          grep -q 'active legacy/remediation js: 0' /tmp/profile-legacy.log
          grep -q 'high risk active css: 38' /tmp/profile-legacy.log

      - name: Require product-only candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git restore -- reports docs/HOME-AUTHORITY-CLASSIFICATION.md docs/PAGE-ASSET-AUTHORITY-MATRIX.md || true
          test "$(git diff --name-only)" = "${TARGET_FILE}"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- "${TARGET_FILE}" | awk '{print $2}')" = "1"
          git diff --check
          echo 'Candidate scope: PASS (profile-page.css only, +0/-1)'
