name: Doke UX-CSS-DEBT-016 Mobile Shell Reach

on:
  push:
    branches:
      - diag/ux-css-debt-016-mobile-shell-reach

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: d7dcc2c0264a77d8d8a326210c3074c0eb4057df
      TARGET_CSS: assets/css/components/shell/mobile-app-shell.css
      TARGET_JS: assets/js/components/mobile-app-shell.js
    steps:
      - name: Checkout exact UX-CSS-DEBT-015 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Guard exact checkpoint and ownership files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -f "${TARGET_CSS}"
          test -f "${TARGET_JS}"
          grep -Fq 'components/shell/mobile-app-shell.css?v=' assets/css/pages/app-shell.css
          grep -Fq 'components/shell/mobile-app-shell.css?v=' assets/css/pages/home-runtime-shell.css
          grep -Fq "function createShell(cfg)" "${TARGET_JS}"
          grep -Fq "doke-mobile-shell-mounted" "${TARGET_JS}"
          grep -Fq "max-width: 560px" "${TARGET_JS}"
          npm run audit:mobile-shell-location-contract
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Prove corrected parser contract and dead rows
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file=process.env.TARGET_CSS,text=fs.readFileSync(file,'utf8'),lines=text.split(/\r?\n/);
          let depth=0,selectorParts=[],atRuleParts=[],selector=null;const declarations=[],stack=[];
          const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;if(!selector){if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}}if(selector){const m=line.match(declRe);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,line:i+1,selector,property:m[1].toLowerCase(),value:raw,important,context});}}depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}}
          if(atRuleParts.length)throw new Error('unterminated multiline at-rule');
          const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push({...d,winnerLine:later.line,winnerValue:later.value,winnerImportant:later.important});if(!later||d.important||!later.important)last.set(key,d);}
          const expectedSelectors=['body.doke-mobile-shell-mounted .doke-mobile-shell__filter','body.doke-mobile-shell-mounted .doke-mobile-shell__input::selection','body.doke-mobile-shell-mounted .doke-mobile-shell__search'].sort();
          const selectors=[...new Set(dead.map(d=>d.selector))].sort(),contexts=[...new Set(dead.map(d=>d.context))].sort();
          if(declarations.length!==509||dead.length!==7)throw new Error(`parser drift ${declarations.length}/${dead.length}`);
          if(JSON.stringify(selectors)!==JSON.stringify(expectedSelectors))throw new Error(`selector drift ${JSON.stringify(selectors)}`);
          if(JSON.stringify(contexts)!==JSON.stringify(['@media (max-width: 760px)']))throw new Error(`context drift ${JSON.stringify(contexts)}`);
          if(dead.some(d=>!d.important||!d.winnerImportant||d.value!==d.winnerValue))throw new Error('dead rows are not exact important duplicates');
          if(Buffer.byteLength(text)!==40715)throw new Error(`byte drift ${Buffer.byteLength(text)}`);
          if((text.match(/!important/gi)||[]).length!==321)throw new Error('important count drift');
          console.log(JSON.stringify(dead,null,2));
          console.log('PARSER CONTRACT PASS: 509 declarations; 7 exact !important duplicates; 3 selectors; max760 only; 40715 bytes; 321 !important');
          NODE

      - name: Derive exact 26 CSS consumers and run browser reach matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          cat > /tmp/mobile-shell-reach.js <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const target='assets/css/components/shell/mobile-app-shell.css';
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));
          const allCss=[];function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=path.join(d,e.name);if(e.isDirectory())walk(f);else if(f.endsWith('.css'))allCss.push(f.replace(/\\/g,'/'));}}walk('assets/css');
          const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,meta=new Map();
          const normalize=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};
          for(const f of allCss){const text=fs.readFileSync(f,'utf8'),imports=[];let m;while((m=importRe.exec(text)))imports.push(normalize(m[1],f));importRe.lastIndex=0;meta.set(f,imports);}
          function reaches(list){const seen=new Set(),stack=[...list];while(stack.length){const f=stack.pop();if(seen.has(f)||!meta.has(f))continue;seen.add(f);if(f===target)return true;for(const n of meta.get(f))stack.push(n);}return false;}
          const pages=report.pageAssets.filter(p=>reaches(p.css)).map(p=>p.page).sort();
          if(pages.length!==26)throw new Error(`consumer drift ${pages.length}: ${pages.join(',')}`);
          const shellJs=fs.readFileSync(process.env.TARGET_JS,'utf8');
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const mountedVps=[['560x900',560,900],['390x844',390,844]],unmountedVps=[['561x900',561,900],['608x926',608,926],['760x900',760,900]];
          async function main(){await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const presence={};let mounted=0,unmounted=0,pseudo=0,cssReach=0;
            for(const html of pages){presence[html]={mounted:{},unmounted:{}};
              for(const [name,width,height] of mountedVps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto(`http://127.0.0.1:5500/${html}`,{waitUntil:'domcontentloaded',timeout:15000});await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});const loaded=await page.evaluate(()=>performance.getEntriesByType('resource').some(e=>new URL(e.name).pathname.endsWith('/assets/css/components/shell/mobile-app-shell.css')));if(!loaded)throw new Error(`${html}/${name}: target CSS not loaded`);cssReach++;await page.addScriptTag({content:shellJs});await sleep(30);const snap=await page.evaluate(()=>{const b=document.body,s=document.querySelector('.doke-mobile-shell'),search=document.querySelector('.doke-mobile-shell__search'),input=document.querySelector('.doke-mobile-shell__input'),filter=document.querySelector('.doke-mobile-shell__filter');if(!b.classList.contains('doke-mobile-shell-mounted')||!s)throw new Error('shell failed to mount');if(Boolean(search)!==Boolean(input)||Boolean(search)!==Boolean(filter))throw new Error('search/input/filter anatomy diverged');let selection=null;if(input){input.value='Doke shell';input.focus();input.setSelectionRange(0,input.value.length);const ps=getComputedStyle(input,'::selection');selection={color:ps.color,backgroundColor:ps.backgroundColor};}return{search:Boolean(search),input:Boolean(input),filter:Boolean(filter),selection};});if(snap.selection)pseudo++;presence[html].mounted[name]=snap;mounted++;await ctx.close();}
              for(const [name,width,height] of unmountedVps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto(`http://127.0.0.1:5500/${html}`,{waitUntil:'domcontentloaded',timeout:15000});await page.addScriptTag({content:shellJs});await sleep(20);const snap=await page.evaluate(()=>({mounted:document.body.classList.contains('doke-mobile-shell-mounted'),shell:document.querySelectorAll('.doke-mobile-shell').length,search:document.querySelectorAll('body.doke-mobile-shell-mounted .doke-mobile-shell__search').length,filter:document.querySelectorAll('body.doke-mobile-shell-mounted .doke-mobile-shell__filter').length,input:document.querySelectorAll('body.doke-mobile-shell-mounted .doke-mobile-shell__input').length}));if(snap.mounted||snap.shell||snap.search||snap.filter||snap.input)throw new Error(`${html}/${name}: shell unexpectedly mounted ${JSON.stringify(snap)}`);presence[html].unmounted[name]=snap;unmounted++;await ctx.close();}
            }
            const set560=pages.filter(p=>presence[p].mounted['560x900'].search),set390=pages.filter(p=>presence[p].mounted['390x844'].search);if(JSON.stringify(set560)!==JSON.stringify(set390))throw new Error('search-bearing page set differs by mounted viewport');if(!set560.length)throw new Error('no canonical search-bearing consumers');
            await browser.close();fs.writeFileSync('/tmp/mobile-shell-reach.json',JSON.stringify({pages,searchBearing:set560,presence},null,2));console.log('26 consumers='+pages.join(','));console.log('search-bearing='+set560.length+': '+set560.join(','));console.log(`MOUNTED REACH PASS mounted=${mounted}, unmounted=${unmounted}, cssReach=${cssReach}, pseudoSelection=${pseudo}`);console.log('Runtime boundary: mounted <=560; absent at 561/608/760 while CSS media remains <=760.');
          }
          main().finally(()=>server.kill('SIGTERM')).catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/mobile-shell-reach.js

      - name: Preserve mobile shell governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:mobile-shell-location-contract
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          git diff --check
