name: ANA-001 Staging Activation Readiness

on:
  pull_request:
    paths:
      - 'config/ana-001-staging-activation-readiness.json'
      - 'docs/ANA-001-STAGING-ACTIVATION-READINESS.md'
      - 'scripts/plan-ana-001-staging-activation.js'
      - 'scripts/audit-ana-001-staging-activation-readiness.js'
      - 'scripts/test-ana-001-staging-activation-readiness.js'
      - 'supabase/migrations/20260918232000_ana_a03_behavioral_event_ledger.sql'
      - 'supabase/migrations/20260918233000_ana_a04_metric_projection_runtime.sql'
      - 'supabase/migrations/20260918234000_ana_a05_reconciliation_runtime.sql'
      - 'supabase/functions/search-public-services-v2/index.ts'
      - 'supabase/functions/analytics-behavior-v1/index.ts'
      - '.github/workflows/ana-001-staging-activation-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ana-001-staging-activation-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check scripts/plan-ana-001-staging-activation.js
          node --check scripts/audit-ana-001-staging-activation-readiness.js
          node --check scripts/test-ana-001-staging-activation-readiness.js
      - name: Readiness audit
        run: node scripts/audit-ana-001-staging-activation-readiness.js
      - name: Readiness conformance
        run: node scripts/test-ana-001-staging-activation-readiness.js
      - name: Dry-run
        run: node scripts/plan-ana-001-staging-activation.js --dry-run
      - name: Domain matrix regression
        run: node scripts/audit-domain-completion-matrix.js
      - name: Diff hygiene
        run: git diff --check
