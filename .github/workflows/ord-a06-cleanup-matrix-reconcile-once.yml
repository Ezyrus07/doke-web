name: ORD-A06 Cleanup Matrix Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-a06-cleanup-matrix-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A06 cleanup governance and self-remove
        shell: bash
        run: |
          git rm .github/workflows/ord-a06-cleanup-matrix-reconcile-once.yml
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package.setdefault('scripts', {})['audit:ord-001-a06-cleanup-boundary'] = 'node scripts/audit-ord-001-a06-cleanup-boundary.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['version'] = '1.3.18'
          matrix['updatedAt'] = '2026-07-29T21:31:00-03:00'
          ord_domain = next(domain for domain in matrix['domains'] if domain['id'] == 'ORD-001')

          def append_unique(items, values):
              for value in values:
                  if value not in items:
                      items.append(value)

          append_unique(ord_domain['requiredPaths'], [
              'supabase/migrations/20260730003500_ord_a06_canary_cleanup_boundary.sql',
              'supabase/migrations/20260730004500_ord_a06_cleanup_explicit_role_precedence.sql',
              'docs/ORD-001-A06-CANARY-CLEANUP-BOUNDARY.md',
              'docs/validation/ORD-001-A06-CANARY-CLEANUP-BOUNDARY.json',
              'scripts/audit-ord-001-a06-cleanup-boundary.js',
              '.github/workflows/ord-001-a06-cleanup-boundary.yml'
          ])
          append_unique(ord_domain['tests'], ['audit:ord-001-a06-cleanup-boundary'])
          append_unique(ord_domain['evidence'], [
              'ORD-A06 now has a service-role-only cleanup boundary that requires matching runId metadata and external_id markers and refuses ambiguous or partial scope.',
              'The cleanup boundary aborts on messaging, payment, wallet, review, quote-funnel or manual operator dependencies instead of broadening deletion authority.',
              'A rolled-back staging canary proved authenticated denial, explicit JWT role precedence, requested-to-quoted cleanup, control-order survival, idempotent re-execution and zero residue.'
          ])

          for blocker in ord_domain['blockers']:
              if blocker['id'] == 'ORD-B02':
                  blocker['description'] = 'Canonical reads, canary commands and deterministic cross-context settlement pass, and the service-role-only cleanup boundary is now staged. ORD-B02 remains until two explicitly authorized staging accounts complete the real browser UI canary.'

          ord_domain['nextActions'] = [
              action for action in ord_domain['nextActions']
              if not action.startswith('Freeze a service-role-only cleanup boundary')
          ]
          next_actions = [
              'Obtain two explicitly authorized staging test accounts without changing real users.',
              'Run the two-browser requested, accepted, quoted, optimistic-conflict and UI settlement canary using one ord-a06 runId.',
              'Invoke the service-role cleanup boundary and prove zero residue after the real browser canary.',
              'Harden worker invocation freshness and replay resistance.'
          ]
          ord_domain['nextActions'] = []
          append_unique(ord_domain['nextActions'], next_actions)

          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-ord-001-a06-cleanup-boundary.js
          node scripts/audit-ord-001-a06-visual-settlement.js
          node scripts/test-order-visual-settlement-runtime.js
          node scripts/audit-ord-001-a05-command-activation.js
          node scripts/test-order-command-activation-runtime.js
          node scripts/audit-ord-001-a04-read-authority.js
          node scripts/test-order-read-authority-runtime.js
          node scripts/audit-ord-001-a03-command-boundary.js
          node scripts/test-order-command-boundary-runtime.js
          node scripts/test-order-state-machine-runtime.js
          node scripts/audit-domain-completion-matrix.js
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile ORD-A06 cleanup boundary governance"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

# One-shot reconciler. It removes itself before generating the final matrix.
