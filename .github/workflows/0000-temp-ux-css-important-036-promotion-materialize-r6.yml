name: UX-CSS-IMPORTANT-036 Promotion Materialize R6

on:
  push:
    branches:
      - diag/ux-css-important-036-promotion-materialize-r6
    paths:
      - .github/workflows/0000-temp-ux-css-important-036-promotion-materialize-r6.yml

permissions:
  contents: write

jobs:
  materialize036r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PARENT_SHA: 483d49d5f59c2eb24be0169f3d7ed6aec9703679
      TARGET_FILE: assets/css/components/shell/mobile-app-shell.css
      TARGET_PARENT_BLOB: af6fd982517f2bc821435e633d70237e95ee11a8
      CANDIDATE_SHA256: 8fb0e7919197559b37a2d2b3c348766cff38729792c13cfffcdcb9bada8ad097
      CANDIDATE_BLOB: 14fb64c93777d606b07c0abbf2c6532aed134cc4
      R5E_BRANCH: diag/ux-css-important-036-narrow-governance-r5e
      R5E_PATH: .diagnostics/ux-css-important-036-narrow-governance-r5e.txt
      R5E_BLOB: 7bcff4bcf4774f1de08d6bee7e50e889483beb99
      OUTPUT_FILE: .diagnostics/ux-css-important-036-certified-candidate.css
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Freeze governance evidence and materialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$TARGET_PARENT_BLOB"
          git fetch --no-tags origin "refs/heads/$R5E_BRANCH:refs/remotes/origin/$R5E_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R5E_BRANCH:$R5E_PATH")" = "$R5E_BLOB"
          git show "refs/remotes/origin/$R5E_BRANCH:$R5E_PATH" | grep -q '^RESULT=PASS$'
          git show "refs/remotes/origin/$R5E_BRANCH:$R5E_PATH" | grep -q '^PROOF_RESULT=PASS$'
          git show "$PARENT_SHA:$TARGET_FILE" > /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const o=fs.readFileSync('/tmp/parent.css','utf8');
          const blockers=new Set([106,139,141,142,147,275]);let i=-1;
          const c=o.replace(/\s*!important\b/gi,m=>{i++;return blockers.has(i)?m:'';});
          if(i+1!==314||(o.match(/!important\b/gi)||[]).length!==314||(c.match(/!important\b/gi)||[]).length!==6)throw Error('marker counts');
          if(o.replace(/\s*!important\b/gi,'')!==c.replace(/\s*!important\b/gi,''))throw Error('not marker-only');
          const sha=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',c);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(sha!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB)throw Error(`identity ${sha} ${blob}`);
          fs.mkdirSync('.diagnostics',{recursive:true});
          fs.writeFileSync(process.env.OUTPUT_FILE,c);
          NODE
          test "$(git hash-object "$OUTPUT_FILE")" = "$CANDIDATE_BLOB"
          test "$(sha256sum "$OUTPUT_FILE" | cut -d' ' -f1)" = "$CANDIDATE_SHA256"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$OUTPUT_FILE"
          git commit -m 'diag: materialize certified 036 candidate [skip ci]'
          git push origin HEAD:diag/ux-css-important-036-promotion-materialize-r6

# trigger-r6
