name: Doke Temporary MSG-A04 Matrix Refresh

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msg-a04-matrix-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'msg/msg-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 30

      - name: Require canonical A04 ancestor
        run: |
          git merge-base --is-ancestor 6a92847fcc585d3ac0d4a2c573f0b98149860654 HEAD
          echo "RUN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Refresh generated matrix artifacts
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Stage generated matrix artifacts only
        run: |
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | while IFS= read -r file; do
            case "$file" in
              docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check

      - name: Publish refreshed generated artifacts
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$RUN_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(msg): refresh matrix after A04 gate"
          git push origin HEAD:msg/msg-001-baseline-audit
