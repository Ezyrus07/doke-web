name: Doke UX-CSS-DEBT-016 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-016-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d7dcc2c0264a77d8d8a326210c3074c0eb4057df
      PERMANENT_BRANCH: ux/ux-css-debt-016-mobile-shell-compaction
      TARGET_FILE: assets/css/components/shell/mobile-app-shell.css
      PARENT_SHA256: 00d99ad9ca61c56d1e10ffc7871eff41af5e70a564b6ac39af5016260835763a
      CANDIDATE_SHA256: 78bf9b6076ba99946480908b3ce222fb40fcab80e7398ee434364730c0cabdbf
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0

      - name: Guard permanent branch starts exactly at parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PARENT_SHA}"
          git fetch origin "${PERMANENT_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${PARENT_SHA}"
          git diff --check

      - name: Rebuild exact deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),file=process.env.TARGET_FILE,text=fs.readFileSync(file,'utf8');
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,selectorParts=[],atRuleParts=[],selector=null;const declarations=[],stack=[];const declRe=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;if(!selector){if(atRuleParts.length){if(t)atRuleParts.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(atRuleParts),depthBefore:depth});atRuleParts=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else atRuleParts=[t];}else if(selectorParts.length){if(t)selectorParts.push(t);if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){selectorParts=[t];if(line.includes('{')){selector=norm(selectorParts);selectorParts=[];stack.push({type:'rule',selector,depthBefore:depth});}}}if(selector){const m=line.match(declRe);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,line:i+1,selector,property:m[1].toLowerCase(),value:raw,important,context});}}depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')selector=null;}}if(atRuleParts.length)throw new Error('unterminated multiline at-rule');const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push({...d,winnerLine:later.line,winnerValue:later.value,winnerImportant:later.important});if(!later||d.important||!later.important)last.set(key,d);}return{lines,declarations,dead,selectors:[...new Set(dead.map(d=>d.selector))].sort(),contexts:[...new Set(dead.map(d=>d.context))].sort()};}
          const expected=['body.doke-mobile-shell-mounted .doke-mobile-shell__filter','body.doke-mobile-shell-mounted .doke-mobile-shell__input::selection','body.doke-mobile-shell-mounted .doke-mobile-shell__search'].sort(),sha=v=>crypto.createHash('sha256').update(v).digest('hex'),p=parse(text);
          if(sha(text)!==process.env.PARENT_SHA256||Buffer.byteLength(text)!==40715||p.declarations.length!==509||p.dead.length!==7||JSON.stringify(p.selectors)!==JSON.stringify(expected)||JSON.stringify(p.contexts)!==JSON.stringify(['@media (max-width: 760px)'])||(text.match(/!important/gi)||[]).length!==321)throw new Error('parent contract drift');
          if(p.dead.some(d=>!d.important||!d.winnerImportant||d.value!==d.winnerValue))throw new Error('non-identical duplicate');
          const deadSet=new Set(p.dead.map(d=>d.lineIndex)),candidate=p.lines.filter((_l,i)=>!deadSet.has(i)).join('\n'),c=parse(candidate);
          if(sha(candidate)!==process.env.CANDIDATE_SHA256||Buffer.byteLength(candidate)!==40408||c.declarations.length!==502||c.dead.length!==0||(candidate.match(/!important/gi)||[]).length!==314)throw new Error('candidate contract drift');
          fs.writeFileSync(file,candidate);console.log('PROMOTION CANDIDATE PASS: 509 -> 502; -7; 3 selectors; max760; 40715 -> 40408; important 321 -> 314; dead 0');
          NODE
          test "$(git diff --name-only "${PARENT_SHA}" --)" = "${TARGET_FILE}"
          test "$(git diff --numstat "${PARENT_SHA}" -- "${TARGET_FILE}" | awk '{print $1}')" = "0"
          test "$(git diff --numstat "${PARENT_SHA}" -- "${TARGET_FILE}" | awk '{print $2}')" = "7"
          git diff --check "${PARENT_SHA}" -- "${TARGET_FILE}"

      - name: Commit and push only product CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -- "${TARGET_FILE}"
          test "$(git diff --cached --name-only)" = "${TARGET_FILE}"
          git commit -m "UX-CSS-DEBT-016: compact superseded mobile app shell declarations"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(sha256sum "${TARGET_FILE}" | awk '{print $1}')" = "${CANDIDATE_SHA256}"
          git push origin "HEAD:refs/heads/${PERMANENT_BRANCH}"
          echo "PERMANENT_SHA=$(git rev-parse HEAD)"
