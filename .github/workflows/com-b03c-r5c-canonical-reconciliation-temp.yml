name: COM-B03C-R5C Canonical Reconciliation Writer

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/com-b03c-r5c-canonical-reconciliation-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r5c-canonical-reconciliation-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 65554baca33933cdbf6c660ba87658ab3ab4c5db
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r5c-canonical-reconciliation-temp.yml
  MATRIX_SOURCE: config/domain-completion-matrix.json
  MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
  MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
  R5C_VALIDATION: docs/validation/COM-B03C-R5C-SINGLE-USE-CORRECTED-TERMINAL-OBSERVATION-TRIGGER-READINESS.json
  R5C_MODULE: backend/modules/communities/community-realtime-private-auth-r5c.js
  R5C_TEST: scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
  R5C_WORKFLOW: .github/workflows/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.yml
  R5B_MODULE: backend/modules/communities/community-realtime-private-auth-r5b.js
  RECEIPT_PATH: config/com-b03c-r5b-r5a-fresh-authorization-consumption.json
  FUTURE_TRIGGER_PATH: config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
  CORRECTED_BRIDGE: scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js

jobs:
  reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fail-closed writer installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${WRITER_PATH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Preserve certified R5C repository-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f "${R5C_VALIDATION}"
          test -f "${R5C_MODULE}"
          test -f "${R5C_TEST}"
          test -f "${R5C_WORKFLOW}"
          test -f "${R5B_MODULE}"
          test -f "${RECEIPT_PATH}"
          test -f "${CORRECTED_BRIDGE}"
          test ! -e "${FUTURE_TRIGGER_PATH}"
          test "$(git rev-parse HEAD:${RECEIPT_PATH})" = "a2ed29dc6a44f9d62f5159dfeabd2c769f677b50"
          test "$(git rev-parse HEAD:${CORRECTED_BRIDGE})" = "ff083f29e43b2f85045b23bf8f12a4b354fb0005"
          node --check "${R5C_MODULE}"
          node --check "${R5C_TEST}"
          node "${R5C_TEST}"
          node - <<'NODE'
          const r5c = require('./backend/modules/communities/community-realtime-private-auth-r5c');
          try {
            r5c.assertRemoteExecutionBoundaryAbsent();
            process.exit(1);
          } catch (error) {
            if (error?.code !== r5c.REMOTE_EXECUTION_BLOCK_CODE) throw error;
          }
          NODE

      - name: Reconcile COM-001 machine-readable source through R5C
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const matches = matrix.domains.filter((domain) => domain.id === 'COM-001');
          if (matches.length !== 1) throw new Error(`COM-001 uniqueness violated: ${matches.length}`);
          const domain = matches[0];

          const expectedState = {
            maturity: 3,
            userFacingAuthority: 'hybrid',
            serverAuthority: 'partial',
            stagingEvidence: 'staging_canary',
            securityGate: 'partial',
            productionGate: 'blocked'
          };
          for (const [key, value] of Object.entries(expectedState)) {
            if (domain[key] !== value) throw new Error(`COM-001 ${key} drift: ${domain[key]} !== ${value}`);
          }

          const staleBlocker = 'Authenticated community_posts Postgres Changes is proven in staging. The R3L 17-case Presence differential diagnostic completed with zero residue: direct control/uid/topic/row-topic probes subscribed while extension_direct and all tested presence-extension compositions were rejected. This narrows the failing evaluation surface but does not prove the exact root cause; private Typing/Broadcast remains unproven and channel_messages still lacks canonical remote authority.';
          const nextBlocker = 'Authenticated community_posts Postgres Changes is proven in staging. R3L narrowed the private Presence authorization failure to evaluation involving realtime.messages.extension without proving the exact root cause. R5B consumed the fresh R5A-bound authorization without execution, and R5C certified only repository readiness for a future single-use corrected terminal observation trigger: no trigger exists and no staging, network, credential or Realtime authority is active. Private Typing/Broadcast remains unproven and channel_messages still lacks canonical remote authority.';
          const blocker = domain.blockers.find((item) => item.id === 'COM-B03');
          if (!blocker) throw new Error('COM-B03 blocker missing');
          if (blocker.description !== staleBlocker) throw new Error('COM-B03 blocker no longer matches expected pre-reconciliation text');
          blocker.description = nextBlocker;

          const staleAction = 'Perform repository-only root-cause narrowing of Presence authorization semantics around realtime.messages.extension and its runtime evaluation context. Do not re-run staging unless a separately certified boundary identifies a precise missing observation and receives a new explicit single-use authorization.';
          const nextAction = 'Preserve the certified R5C repository-only boundary and continue root-cause narrowing without promoting Presence, Typing/Broadcast or channel_messages. Any future trigger must be a separate single-file boundary bound to the certified R5C head, frozen receipt and corrected bridge; staging execution remains separately gated by a new exact single-use authorization.';
          const actionIndex = domain.nextActions.indexOf(staleAction);
          if (actionIndex === -1) throw new Error('Expected stale COM-B03 next action missing');
          domain.nextActions[actionIndex] = nextAction;

          const requiredPaths = [
            'backend/modules/communities/community-realtime-private-auth-r5b.js',
            'backend/modules/communities/community-realtime-private-auth-r5c.js',
            'config/com-b03c-r5b-r5a-fresh-authorization-consumption.json',
            'config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.json',
            'scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js',
            'docs/validation/COM-B03C-R5C-SINGLE-USE-CORRECTED-TERMINAL-OBSERVATION-TRIGGER-READINESS.json',
            '.github/workflows/com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.yml'
          ];
          for (const item of requiredPaths) {
            if (!domain.requiredPaths.includes(item)) domain.requiredPaths.push(item);
          }

          const evidence = [
            'COM-B03C-R5B consumed the fresh R5A-bound corrected-terminal-observation authorization into a frozen receipt without creating a trigger or attempting remote execution; the authorization is permanently non-reusable and remains bound to the corrected R4Z bridge.',
            'COM-B03C-R5C repository-certified single-use corrected terminal observation trigger readiness at head 65554baca33933cdbf6c660ba87658ab3ab4c5db; the future trigger remains absent, staging/network/Realtime/credential authority remains false, exactRootCauseProven remains false and causal promotion remains blocked.',
            'R5C final CI run 31713609745 / certify job 94492595157 passed repository readiness, consumed receipt and corrected-bridge preservation, remote execution hard block, Domain Completion Matrix, Agent Governance and diff hygiene.'
          ];
          for (const item of evidence) {
            if (!domain.evidence.includes(item)) domain.evidence.push(item);
          }

          const duplicateValues = (items) => items.filter((value, index) => items.indexOf(value) !== index);
          if (duplicateValues(domain.requiredPaths).length) throw new Error('Duplicate COM-001 requiredPaths introduced');
          if (duplicateValues(domain.evidence).length) throw new Error('Duplicate COM-001 evidence introduced');
          if (domain.nextActions.length !== 3) throw new Error(`Unexpected COM-001 nextActions count: ${domain.nextActions.length}`);

          for (const [key, value] of Object.entries(expectedState)) {
            if (domain[key] !== value) throw new Error(`COM-001 ${key} mutated during reconciliation`);
          }

          fs.writeFileSync(path, `${JSON.stringify(matrix, null, 2)}\n`);
          NODE

      - name: Remove writer before canonical generation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"

      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix

      - name: Enforce exact reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' "${WRITER_PATH}" "${MATRIX_SOURCE}" "${MATRIX_MD}" "${MATRIX_REPORT}" | sort)"
          test "${actual}" = "${expected}"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff HEAD --check

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Stage and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${MATRIX_SOURCE}" "${MATRIX_MD}"
          git add -f -- "${MATRIX_REPORT}"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${WRITER_PATH}" "${MATRIX_SOURCE}" "${MATRIX_MD}" "${MATRIX_REPORT}" | sort)"
          test "${staged}" = "${expected}"
          git diff --cached --check

      - name: Commit clean reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(com): reconcile canonical COM-001 through R5C'
          git push origin "HEAD:${TARGET_BRANCH}"
