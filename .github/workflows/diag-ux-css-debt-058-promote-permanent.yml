name: Doke UX-CSS-DEBT-058 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-058-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: d6daeaa876111dbfa3ed27cc5307936084292962
      PARENT_PARENT_SHA: 28e5d98e1d640a730b2b24457a1ebc83f743f786
      TARGET_FILE: assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css
      PARENT_TARGET_BLOB: d5adb69cdad3a77bdb5138afc7555071075fd089
      EXPECTED_SHA256: c130076b51622b0b1d1712f36ba3df3d2656d01d1b0c3b12f9f85412f008d4eb
      EXPECTED_BYTES: "11472"
      PERMANENT_BRANCH: ux/ux-css-debt-058-workers-mobile-fullscreen-compaction
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2

      - name: Guard parent and seeded permanent namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PROMOTION GUARD PASS|parent=$PARENT_SHA|permanentSeed=$remote_sha|targetBlob=$PARENT_TARGET_BLOB"

      - name: Rebuild exact certified deletion candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file=process.env.TARGET_FILE;
          const src=fs.readFileSync(file,'utf8');
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){
            const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;
            for(let i=0;i<lines.length;i++){
              const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;
              if(!sel){
                if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}
                else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}
                else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}
                else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}
              }
              if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context});}}
              depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}
            }
            const last=new Map(),dead=[];
            for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d);}
            return {declarations:ds,dead};
          }
          const p=parse(src);
          if(p.declarations.length!==294||p.dead.length!==78)throw new Error(`parent parse drift ${p.declarations.length}/${p.dead.length}`);
          const sels=new Set(p.dead.map(x=>x.selector));if(sels.size!==17)throw new Error(`family drift ${sels.size}`);
          const contexts=[...new Set(p.dead.map(x=>x.context))].sort();
          if(JSON.stringify(contexts)!==JSON.stringify(['@media (max-width: 380px)','@media (max-width: 760px)']))throw new Error(`context drift ${contexts}`);
          const identical=p.dead.filter(x=>x.value===x.winner.value&&x.important===x.winner.important).length;
          if(identical!==26)throw new Error(`identical drift ${identical}`);
          if(p.dead.some(x=>x.important||x.winner.important))throw new Error('unexpected important');
          const remove=new Set(p.dead.map(x=>x.line));
          const candidate=src.split(/\r?\n/).filter((_,i)=>!remove.has(i+1)).join('\n');
          fs.writeFileSync(file,candidate);
          const q=parse(candidate);
          if(q.declarations.length!==216||q.dead.length!==0)throw new Error(`candidate parse drift ${q.declarations.length}/${q.dead.length}`);
          console.log('DETERMINISTIC REBUILD PASS|parent=294/78|candidate=216/0|families=17|identical=26|changed=52|contexts=380,760');
          NODE
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t78\t'"$TARGET_FILE"
          git diff --check
          echo "CANDIDATE IDENTITY PASS|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|files=1|additions=0|deletions=78"

      - name: Commit and fast-forward permanent branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "doke"
          git config user.email "bielantoniomma@gmail.com"
          git add -- "$TARGET_FILE"
          git commit -m "UX-CSS-DEBT-058: compact superseded workers mobile fullscreen declarations"
          commit_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE")" = $'0\t78\t'"$TARGET_FILE"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PARENT_SHA"
          git push origin "HEAD:refs/heads/$PERMANENT_BRANCH"
          after="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$after" = "$commit_sha"
          echo "PROMOTION PASS|permanent=$after|parent=$PARENT_SHA|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|files=1|additions=0|deletions=78"
