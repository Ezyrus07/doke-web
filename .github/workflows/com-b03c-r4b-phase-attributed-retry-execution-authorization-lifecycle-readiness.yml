name: COM-B03C-R4B Phase-Attributed Retry Execution Authorization Lifecycle

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4b.js'
      - 'scripts/test-com-b03c-r4b-phase-attributed-retry-execution-authorization-lifecycle-readiness.js'
      - 'scripts/execute-com-b03c-r4b-single-use-phase-attributed-retry.js'
      - 'scripts/verify-com-b03c-r4b-single-use-phase-attributed-retry-report.js'
      - 'config/com-b03c-r4b-phase-attributed-retry-execution-authorization-lifecycle-readiness.json'
      - 'config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json'
      - 'config/com-b03c-r4a-single-use-phase-attributed-retry-trigger.json'
      - 'docs/validation/COM-B03C-R4B-PHASE-ATTRIBUTED-RETRY-EXECUTION-AUTHORIZATION-LIFECYCLE-READINESS.json'
      - '.github/workflows/com-b03c-r4b-phase-attributed-retry-execution-authorization-lifecycle-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json'

permissions: { contents: read }

concurrency:
  group: com-b03c-r4b-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts

      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4b.js
          node --check scripts/test-com-b03c-r4b-phase-attributed-retry-execution-authorization-lifecycle-readiness.js
          node --check scripts/execute-com-b03c-r4b-single-use-phase-attributed-retry.js
          node --check scripts/verify-com-b03c-r4b-single-use-phase-attributed-retry-report.js

      - name: R4B execution authorization lifecycle readiness
        if: github.event_name == 'pull_request'
        run: node scripts/test-com-b03c-r4b-phase-attributed-retry-execution-authorization-lifecycle-readiness.js

      - name: R4B executor repository self-test
        if: github.event_name == 'pull_request'
        run: node scripts/execute-com-b03c-r4b-single-use-phase-attributed-retry.js --repository-self-test

      - name: R3Z phase attribution continuity
        if: github.event_name == 'pull_request'
        run: node scripts/execute-com-b03c-r3z-preinstall-phase-attribution.js --repository-self-test

      - name: R4A consumed trigger lineage and content
        shell: bash
        run: |
          R4A_HEAD=6affdcc7dd34166cfd8195167469de153215abd0
          R4A_TRIGGER_COMMIT=8eaa7748b79b3d1e9eda0bcc40d34c3d08d62923
          R4A_TRIGGER=config/com-b03c-r4a-single-use-phase-attributed-retry-trigger.json
          test -f "$R4A_TRIGGER"
          git merge-base --is-ancestor "$R4A_TRIGGER_COMMIT" HEAD
          test "$(git rev-parse ${R4A_TRIGGER_COMMIT}^)" = "$R4A_HEAD"
          test "$(git diff --name-only "$R4A_HEAD" "$R4A_TRIGGER_COMMIT" | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only "$R4A_HEAD" "$R4A_TRIGGER_COMMIT")" = "$R4A_TRIGGER"
          node - <<'NODE'
          const r4b = require('./backend/modules/communities/community-realtime-private-auth-r4b');
          const trigger = require('./config/com-b03c-r4a-single-use-phase-attributed-retry-trigger.json');
          const result = r4b.assertConsumedR4ATrigger(trigger);
          if (result.decision !== 'r4a_consumed_trigger_continuity_verified') process.exit(1);
          if (result.remoteExecutionAuthority !== false) process.exit(1);
          NODE

      - name: Pre-execution-authorization hard block
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test ! -e config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json
          set +e
          output="$(node scripts/execute-com-b03c-r4b-single-use-phase-attributed-retry.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R4B_FRESH_EXECUTION_AUTHORIZATION_REQUIRED'

      - name: Execution trigger commit continuity
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          TRIGGER=config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json
          test -f "$TRIGGER"
          test "$(git rev-parse HEAD^)" = "$(node -p "require('./${TRIGGER}').workflowInstallHead")"
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER"
          node - <<'NODE'
          const cp = require('node:child_process');
          const r4b = require('./backend/modules/communities/community-realtime-private-auth-r4b');
          const trigger = require('./config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json');
          const parentHead = cp.execFileSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' }).trim();
          const changedFiles = cp.execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD'], { encoding: 'utf8' }).trim().split(/\n/).filter(Boolean);
          const authorizationReceipt = r4b.buildExpectedConsumedReceipt(trigger.authorizationEvidenceHead);
          const result = r4b.validateFutureExecutionTriggerCommit({ trigger, parentHead, changedFiles, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), authorizationReceipt });
          if (result.decision !== 'phase_attributed_execution_trigger_valid_authority_available_for_this_attempt') process.exit(1);
          NODE

      - name: Domain Completion Matrix
        if: github.event_name == 'pull_request'
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        if: github.event_name == 'pull_request'
        run: npm run audit:agent-governance
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  authorize:
    if: github.event_name == 'push'
    needs: certify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Authorize exact single-use phase-attributed retry
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          TRIGGER=config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json
          test -f "$TRIGGER"
          test "$(git rev-parse HEAD^)" = "$(node -p "require('./${TRIGGER}').workflowInstallHead")"
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER"
          node - <<'NODE'
          const cp = require('node:child_process');
          const r4b = require('./backend/modules/communities/community-realtime-private-auth-r4b');
          const trigger = require('./config/com-b03c-r4b-single-use-phase-attributed-retry-execution-trigger.json');
          const parentHead = cp.execFileSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' }).trim();
          const changedFiles = cp.execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD'], { encoding: 'utf8' }).trim().split(/\n/).filter(Boolean);
          const authorizationReceipt = r4b.buildExpectedConsumedReceipt(trigger.authorizationEvidenceHead);
          const result = r4b.authorizeExecution({ trigger, parentHead, changedFiles, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), authorizationReceipt });
          if (result.decision !== r4b.AUTHORIZED_DECISION) process.exit(1);
          if (result.remoteExecutionAuthority !== true || result.stagingReadAuthority !== true || result.stagingMutationAuthority !== true || result.remoteCredentialReadAuthority !== true || result.remoteDependencyLoadAuthority !== true || result.runtimeChangeAuthority !== false || result.productionAuthority !== false || result.pullRequestMergeAuthority !== false) process.exit(1);
          NODE

  canary:
    if: github.event_name == 'push'
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: doke-staging
    env:
      SUPABASE_PROJECT_REF: zwkczgewzbsorbrjuzpb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      COM_B03C_R4B_REPORT_PATH: reports/generated/COM-B03C-R4B-SINGLE-USE-PHASE-ATTRIBUTED-RETRY.json
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install canary-only dependencies
        run: npm install --no-save --ignore-scripts pg@8 @supabase/supabase-js@2.112.2
      - name: Execute single-use phase-attributed retry
        id: execute
        continue-on-error: true
        run: node scripts/execute-com-b03c-r4b-single-use-phase-attributed-retry.js
      - name: Verify sanitized phase-attributed retry evidence
        if: always()
        run: node scripts/verify-com-b03c-r4b-single-use-phase-attributed-retry-report.js reports/generated/COM-B03C-R4B-SINGLE-USE-PHASE-ATTRIBUTED-RETRY.json
      - name: Upload sanitized phase-attributed retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com-b03c-r4b-phase-attributed-retry-${{ github.run_id }}
          path: reports/generated/COM-B03C-R4B-SINGLE-USE-PHASE-ATTRIBUTED-RETRY.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagate phase-attributed retry result
        if: steps.execute.outcome != 'success'
        run: exit 1
