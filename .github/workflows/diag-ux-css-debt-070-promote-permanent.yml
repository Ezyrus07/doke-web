name: Doke UX-CSS-DEBT-070 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-070-promote-permanent
    paths:
      - .github/workflows/diag-ux-css-debt-070-promote-permanent.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 6e89d01531842722985c7b2abcd2723a3f383d26
      PARENT_PARENT_SHA: 23cc5c7496897f0d9b742039598574ffb2b93dfb
      PARENT_TREE: a89565f5e64b7eba94a327f3b0153cadab7377b2
      TARGET_FILE: assets/css/components/cards/publication-card.css
      PARENT_TARGET_BLOB: a4735b4ca0141e4db72abdfe7caac77ba01acebc
      EXPECTED_SHA256: 82d79e7c616ea3c59f7f6c2b2516d1c6a27a86d6ae27e7397f0833a0565b5c97
      EXPECTED_BYTES: 17333
      PERMANENT_BRANCH: ux/ux-css-debt-070-publication-card-compaction
      DIAG_BRANCH: diag/ux-css-debt-070-promote-permanent
      RESULT_FILE: .diagnostics/ux-css-debt-070-promotion.txt
      CANDIDATE_RUN: 32085583864
      R1_RUN: 32085443453
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-069 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 2

      - name: Guard exact parent and permanent seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PROMOTION GUARD PASS|parent=$PARENT_SHA|permanentSeed=$remote_sha|candidate=$CANDIDATE_RUN|r1=$R1_RUN"

      - name: Rebuild exact certified candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const f=process.env.TARGET_FILE,ls=fs.readFileSync(f,'utf8').split('\n');
          const rows=new Map([[272,'    min-height: 162px;'],[276,'    padding: 12px 13px 13px;'],[402,'    border-radius: var(--radius-md);']]);
          for(const [i,row] of rows)if((ls[i]||'').replace(/\r$/,'')!==row)throw new Error(`source row drift ${i+1}`);
          const out=ls.filter((_,i)=>!rows.has(i)).join('\n');fs.writeFileSync(f,out);const b=fs.readFileSync(f),h=crypto.createHash('sha256').update(b).digest('hex');
          if(h!==process.env.EXPECTED_SHA256||b.length!==Number(process.env.EXPECTED_BYTES))throw new Error(`${h}/${b.length}`);
          console.log(`PROMOTION CANDIDATE PASS|sha256=${h}|bytes=${b.length}|parent=372/3|candidate=369/0|files=1|additions=0|deletions=3`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          git diff --quiet "$PARENT_SHA" -- '*.html' 'assets/js/**' package.json package-lock.json docs
          git diff --check

      - name: Commit and atomically promote permanent branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add "$TARGET_FILE"
          git commit -m "UX-CSS-DEBT-070: compact superseded mobile publication card declarations"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          new_blob="$(git hash-object "$TARGET_FILE")"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git diff --name-only "$PARENT_SHA" "$new_sha")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" "$new_sha" -- "$TARGET_FILE")" = $'0\t3\t'"$TARGET_FILE"
          git push --force-with-lease="refs/heads/$PERMANENT_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERMANENT_BRANCH"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$new_sha"
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "PARENT_SHA=$PARENT_SHA"
            echo "NEW_SHA=$new_sha"
            echo "NEW_TREE=$new_tree"
            echo "PARENT_TARGET_BLOB=$PARENT_TARGET_BLOB"
            echo "NEW_TARGET_BLOB=$new_blob"
            echo "SHA256=$EXPECTED_SHA256"
            echo "BYTES=$EXPECTED_BYTES"
            echo "DIFF=1 file +0/-3"
            echo "CANDIDATE_RUN=$CANDIDATE_RUN"
            echo "R1_RUN=$R1_RUN"
            echo "RESULT=PASS"
          } >/tmp/evidence.txt
          echo "PROMOTION PASS|permanent=$PERMANENT_BRANCH|sha=$new_sha|parent=$PARENT_SHA|tree=$new_tree|blob=$new_blob|files=1|additions=0|deletions=3"

      - name: Publish promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PARENT_SHA"
          git clean -fdx
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH"
          git checkout -B diag-output "origin/$DIAG_BRANCH"
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m "diag: record UX-CSS-DEBT-070 promotion [skip ci]"
          git push origin "HEAD:refs/heads/$DIAG_BRANCH"
