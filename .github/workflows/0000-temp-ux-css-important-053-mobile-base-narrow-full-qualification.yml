name: TEMP UX-CSS-IMPORTANT-053 Mobile Base Narrow Full Qualification

on:
  pull_request:
    types: [reopened]
    branches:
      - diag/ux-css-important-053-mobile-base-narrow-full-qualification-base

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    env:
      PARENT: 4f861d705eaf288eb3ea7a81ba8df2802464d2b1
      PARENT_TREE: a302b917d63f9caa9212765ec6a02c4a807411b0
      TARGET: assets/css/components/shell/mobile-base-stability.css
      PARENT_BLOB: fe3efc820ef1bbbdbad1b40b99513d156243e04e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and freeze narrow candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-list --parents -n1 "$BASE_SHA" | awk '{print $2}')" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT:$TARGET")" = "$PARENT_BLOB"
          test "$(git diff-tree --no-commit-id --name-only -r "$BASE_SHA")" = ".github/workflows/0000-temp-ux-css-important-053-mobile-base-narrow-full-qualification.yml"
          git checkout --detach "$PARENT" >/dev/null
          cp "$TARGET" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),path=require('path');
          const f=process.env.TARGET,p=fs.readFileSync(f,'utf8'),keep=new Set([3,4,8,14,20,21,22,23,25,26,27,28]);let n=0,r=0;
          const c=p.replace(/\s*!important\b/gi,m=>{n++;if(keep.has(n))return m;r++;return ''});
          if(n!==28||r!==16||(c.match(/!important\b/gi)||[]).length!==12)throw Error(`ordinal reconstruction ${n}/${r}`);
          if(p.replace(/\s*!important\b/gi,'')!==c.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');
          fs.writeFileSync('/tmp/candidate.css',c);fs.writeFileSync(f,c);
          const blob=cp.execFileSync('git',['hash-object',f],{encoding:'utf8'}).trim(),sha256=crypto.createHash('sha256').update(c).digest('hex'),bytes=Buffer.byteLength(c);
          const css=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,e.name);e.isDirectory()?w(q):q.endsWith('.css')&&css.push(q)}})('assets/css');const global=css.reduce((sum,q)=>sum+(fs.readFileSync(q,'utf8').match(/!important\b/gi)||[]).length,0);
          if(global!==27)throw Error(`global ${global}`);
          console.log('NARROW_CANDIDATE_IDENTITY='+JSON.stringify({blob,sha256,bytes,target:'28->12',global:'43->27',removed:16,preservedOrdinals:[3,4,8,14,20,21,22,23,25,26,27,28],markerOnly:true}));
          NODE
          test "$(git diff --name-only)" = "$TARGET"
          git diff --check
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent.css "$TARGET"
          npm ci --ignore-scripts >/dev/null
      - name: Prove dedicated mobile-base contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent.css "$TARGET"
          npm run audit:mobile-base >/tmp/mobile-parent.log 2>&1
          cp /tmp/candidate.css "$TARGET"
          npm run audit:mobile-base >/tmp/mobile-candidate.log 2>&1
          echo MOBILE_BASE_PARENT=PASS
          echo MOBILE_BASE_CANDIDATE=PASS
      - name: Reconcile canonical static gates
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/matrix.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1"; candidate="$2"; : >"/tmp/$phase.tsv"
          restore(){ git checkout "$PARENT" -- . >/dev/null 2>&1 || exit 90; if [ "$candidate" = 1 ]; then cp /tmp/candidate.css "$TARGET"; fi; }
          gate(){ label="$1"; shift; restore; log="/tmp/$phase-$label.log"; set +e; "$@" >"$log" 2>&1; rc=$?; set -e; sed -E 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$log" >"$log.n"; h=$(sha256sum "$log.n"|awk '{print $1}'); printf '%s\t%s\t%s\n' "$label" "$rc" "$h" >>"/tmp/$phase.tsv"; echo "$phase|$label|rc=$rc|hash=$h"; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/matrix.sh
          /tmp/matrix.sh parent 0
          /tmp/matrix.sh candidate 1
          node <<'NODE'
          const fs=require('fs'),read=f=>Object.fromEntries(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [k,rc,h]=x.split('\t');return[k,{rc:+rc,h}]}));const p=read('/tmp/parent.tsv'),c=read('/tmp/candidate.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'],debt=['important_reduction_plan','global_css_design_system'];
          for(const k of exact){const a=p[k],b=c[k];if(!a||!b||a.rc!==b.rc||(a.rc!==0&&a.h!==b.h))throw Error(`static regression ${k}`)}
          for(const k of debt){const a=p[k],b=c[k];if(!a||!b||b.rc>a.rc)throw Error(`debt regression ${k}`)}
          if(p.frontend_strict.rc!==c.frontend_strict.rc)throw Error('frontend rc drift');
          const sig=f=>fs.readFileSync(f,'utf8').split('\n').filter(x=>x.includes('**CRITICAL**')||x.includes('**WARNING**')).sort();if(JSON.stringify(sig('/tmp/parent-frontend_strict.log'))!==JSON.stringify(sig('/tmp/candidate-frontend_strict.log')))throw Error('frontend warning drift');
          console.log('STATIC_RESULT=PASS');console.log('INTRODUCED_REGRESSIONS=0');console.log('CRITERIA_RELAXED=0');
          NODE

