            const pages=['index.html','resultados.html','pedidos.html','mensagens.html','comunidade.html','perfil.html','carteira.html','notificacoes.html','configuracoes.html'];
            const widths=[390,760,761],states=[];for(const page of pages)for(const width of widths)states.push({page,width});
            const expectedActive=pages.flatMap(page=>[390,760].map(width=>`${page}|${width}`)),expectedInactive=pages.map(page=>`${page}|761`);
            const fixtureId='uxcss053_narrow_fixture',fixtureSession={provider:'mock',remember:true,accountStatus:'active',sessionStatus:'active',issuedAt:'2026-08-26T00:00:00.000Z',user:{id:fixtureId,name:'Narrow Fixture',email:'narrow-fixture@example.test',role:'client',type:'client',accountStatus:'active'}};
            const H=b=>crypto.createHash('sha256').update(b).digest('hex'),tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
