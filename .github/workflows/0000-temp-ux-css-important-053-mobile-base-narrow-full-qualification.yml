          test "$(git diff-tree --no-commit-id --name-only -r "$BASE_SHA")" = ".github/workflows/0000-temp-ux-css-important-053-mobile-base-narrow-full-qualification.yml"
          git checkout --detach "$PARENT" >/dev/null
          cp "$TARGET" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');const f=process.env.TARGET,p=fs.readFileSync(f,'utf8'),keep=new Set([3,4,8,14,20,21,22,23,25,26,27,28]);let n=0,r=0;const c=p.replace(/\s*!important\b/gi,m=>{n++;if(keep.has(n))return m;r++;return ''});if(n!==28||r!==16||(c.match(/!important\b/gi)||[]).length!==12)throw Error(`ordinal ${n}/${r}`);if(p.replace(/\s*!important\b/gi,'')!==c.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');const blob=cp.execFileSync('git',['hash-object','--stdin'],{input:c,encoding:'utf8'}).trim(),sha256=crypto.createHash('sha256').update(c).digest('hex'),bytes=Buffer.byteLength(c);fs.writeFileSync('/tmp/candidate.css',c);console.log('NARROW_CANDIDATE_IDENTITY='+JSON.stringify({blob,sha256,bytes,preservedOrdinals:[3,4,8,14,20,21,22,23,25,26,27,28]}));
          NODE
      - name: Install frozen dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Full authenticated parent candidate A B
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parent.css "$TARGET"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true; cp /tmp/parent.css "$TARGET" 2>/dev/null || true' EXIT
          sleep 1
          REPEAT='${{ matrix.repeat }}' NODE_PATH="$PWD/node_modules" node <<'NODE'
