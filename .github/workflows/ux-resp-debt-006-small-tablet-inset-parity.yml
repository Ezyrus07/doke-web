name: Doke UX-RESP-DEBT-006 Small Tablet Inset Parity

on:
  push:
    branches:
      - ux/ux-resp-debt-006-small-tablet-inset-parity
  pull_request:
    branches:
      - ux/ux-resp-debt-005-contextual-tablet-header

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ux-resp-debt-006-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BASE: c8b812edf77afcdd8e71683d9cc035dc5f53dff6

jobs:
  ux-resp-debt-006:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard certified UX-RESP-DEBT-005 parent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ACTUAL_BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin ux/ux-resp-debt-005-contextual-tablet-header --quiet
            ACTUAL_BASE="$(git merge-base HEAD origin/ux/ux-resp-debt-005-contextual-tablet-header)"
          fi
          test "${ACTUAL_BASE}" = "${EXPECTED_BASE}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate permanent delta allowlist
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/ux-resp-debt-006-small-tablet-inset-parity.yml|assets/css/components/shell/tablet-internal-rail-contract.css|docs/DOMAIN-COMPLETION-MATRIX.md|scripts/test-ux-resp-debt-006-small-tablet-inset-parity.js) ;;
              *) echo "::error::Unexpected UX-RESP-DEBT-006 path: ${changed_path}"; exit 1 ;;
            esac
          done < <(git diff --name-only "${EXPECTED_BASE}"...HEAD)

      - name: Validate exact product authority delta and test syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test-ux-resp-debt-006-small-tablet-inset-parity.js
          test "$(git diff --numstat "${EXPECTED_BASE}"...HEAD -- assets/css/components/shell/tablet-internal-rail-contract.css | awk '{print $1}')" = "2"
          test "$(git diff --numstat "${EXPECTED_BASE}"...HEAD -- assets/css/components/shell/tablet-internal-rail-contract.css | awk '{print $2}')" = "2"
          test "$(git diff --name-only "${EXPECTED_BASE}"...HEAD | grep -Ec '\.html$' || true)" -eq 0
          test "$(git diff --name-only "${EXPECTED_BASE}"...HEAD | grep -Ec '^assets/js/' || true)" -eq 0
          node scripts/test-ux-resp-debt-006-small-tablet-inset-parity.js

      - name: Validate canonical CSS import inventory
        run: npm run audit:css-import-resolution

      - name: Install Chromium from lockfile-pinned Playwright
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate responsive index baseline
        run: node scripts/generate-responsive-index-baseline.js

      - name: Execute responsive contract with residual debt preserved
        shell: bash
        run: |
          set +e
          node scripts/test-responsive-contract.js
          STATUS=$?
          set -e
          test "${STATUS}" -eq 1
          test -f reports/responsive-contract-test-report.json

      - name: Prove exact small-tablet inset reduction
        run: node scripts/test-ux-resp-debt-006-small-tablet-inset-parity.js

      - name: Validate responsive and governance boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
          npm run audit:css-responsive-conflicts
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

      - name: Validate patch whitespace
        run: git diff --check "${EXPECTED_BASE}"...HEAD

      - name: Require SonarQube Cloud credential
        if: github.event_name == 'push'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}"

      - name: Analyze PR and enforce SonarQube Cloud Quality Gate
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Ezyrus07_doke-web
            -Dsonar.organization=ezyrus07
            -Dsonar.pullrequest.key=126
            -Dsonar.pullrequest.branch=ux/ux-resp-debt-006-small-tablet-inset-parity
            -Dsonar.pullrequest.base=ux/ux-resp-debt-005-contextual-tablet-header
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
