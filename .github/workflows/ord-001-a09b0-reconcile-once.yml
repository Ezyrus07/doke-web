name: ORD-A09B0 Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a09b0-reconcile-once.yml'
      - 'config/ord-001-a09b0-provider-adapter-boundary.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile package and matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['audit:ord-001-a09a-staging-provider-evaluation'] = 'node scripts/audit-ord-001-a09a-staging-provider-evaluation.js'
          scripts['audit:ord-001-a09b0-provider-adapter-boundary'] = 'node scripts/audit-ord-001-a09b0-provider-adapter-boundary.js'
          scripts['test:ord-001-a09b0-provider-adapter-contract'] = 'node scripts/test-ord-001-a09b0-provider-adapter-contract.js'
          scripts['plan:ord-001-a09b0-provider-adapter:dry-run'] = 'node scripts/plan-ord-001-a09b0-provider-adapter.js --dry-run'
          scripts['plan:ord-001-a09b0-provider-adapter:check-env'] = 'node scripts/plan-ord-001-a09b0-provider-adapter.js --check-env'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('config/domain-completion-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          matrix['version'] = '1.3.24'
          matrix['updatedAt'] = '2026-07-30T09:43:00-03:00'
          ord_domain = next(domain for domain in matrix['domains'] if domain['id'] == 'ORD-001')

          required_paths = [
              'config/ord-001-a09-staging-provider-evaluation.json',
              'docs/ORD-001-A09A-STAGING-PROVIDER-EVALUATION.md',
              'docs/validation/ORD-001-A09A-STAGING-PROVIDER-EVALUATION.json',
              'scripts/audit-ord-001-a09a-staging-provider-evaluation.js',
              '.github/workflows/ord-001-a09a-staging-provider-evaluation.yml',
              'config/ord-001-a09b0-provider-adapter-boundary.json',
              'backend/runtime/staging/provider-adapter-contract.js',
              'scripts/plan-ord-001-a09b0-provider-adapter.js',
              'scripts/test-ord-001-a09b0-provider-adapter-contract.js',
              'scripts/audit-ord-001-a09b0-provider-adapter-boundary.js',
              'docs/ORD-001-A09B0-PROVIDER-ADAPTER-BOUNDARY.md',
              'docs/validation/ORD-001-A09B0-PROVIDER-ADAPTER-BOUNDARY.json',
              '.github/workflows/ord-001-a09b0-provider-adapter-boundary.yml'
          ]
          for item in required_paths:
              if item not in ord_domain['requiredPaths']:
                  ord_domain['requiredPaths'].append(item)

          tests = [
              'audit:ord-001-a09a-staging-provider-evaluation',
              'audit:ord-001-a09b0-provider-adapter-boundary',
              'test:ord-001-a09b0-provider-adapter-contract',
              'plan:ord-001-a09b0-provider-adapter:dry-run'
          ]
          for item in tests:
              if item not in ord_domain['tests']:
                  ord_domain['tests'].append(item)

          evidence = [
              'ORD-A09A evaluated Railway, Fly.io, Render and Vercel and recommends Railway only for initial external staging; no provider selection, account, billing, secret or deployment was authorized.',
              'ORD-A09B0 installs a provider-neutral adapter contract that validates exact selection input but never materializes commands or permits status, deploy or rollback before a provider-specific adapter and separate deployment authorization exist.'
          ]
          for item in evidence:
              if item not in ord_domain['evidence']:
                  ord_domain['evidence'].append(item)

          blocker = next(blocker for blocker in ord_domain['blockers'] if blocker['id'] == 'ORD-B05')
          blocker['description'] = 'ORD-A08 release identity, ORD-A09A provider evaluation and the ORD-A09B0 provider-neutral adapter boundary are complete. Railway is recommended as the external staging release provider, but no explicit provider selection, provider-specific adapter, billing decision, rollback command or deployment exists.'

          next_actions = [
              'Require the exact provider selection phrase before creating any provider-specific adapter.',
              'After explicit selection, create only a non-secret provider adapter and run dry-run plus check-env; keep account creation, billing and deploy separately authorized.',
              'After an independently authorized deployment, execute the ORD-A08 read-only GET/OPTIONS preflight before any visual canary.'
          ]
          for item in next_actions:
              if item not in ord_domain['nextActions']:
                  ord_domain['nextActions'].append(item)

          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node scripts/test-ord-001-a09b0-provider-adapter-contract.js
          node scripts/plan-ord-001-a09b0-provider-adapter.js --dry-run
          node scripts/audit-ord-001-a09b0-provider-adapter-boundary.js
          node scripts/audit-ord-001-a09a-staging-provider-evaluation.js
          node scripts/audit-ord-001-a08-staging-release-readiness.js
          node scripts/audit-ord-001-a07-request-freshness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add -A
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Establish ORD-A09B0 provider adapter boundary'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
