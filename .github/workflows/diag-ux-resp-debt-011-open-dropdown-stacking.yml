name: Diagnose UX-RESP-DEBT-011 Post-Preloader Dropdown Stacking

on:
  push:
    branches:
      - diag/ux-resp-debt-011-active-legacy-inventory

permissions:
  contents: read

env:
  BASE_SHA: 68f6b60d3a7a15a80d5704a0a3d521f500c4dcdb
  TARGET_CSS: assets/css/components/navigation/profile-header-index-parity.css
  PROFILE_MANIFEST: assets/css/pages/profile-foundation.css

jobs:
  post-preloader-stacking:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard diagnostic-only branch on certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "${BASE_SHA}")" = "${BASE_SHA}"
          test -z "$(git diff --name-only "${BASE_SHA}"...HEAD | grep -Ev '^\.github/workflows/diag-ux-resp-debt-011-' || true)"
          test -f "${TARGET_CSS}"
          test -f "${PROFILE_MANIFEST}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Compare certified stacking pattern before and after shim removal
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const { chromium } = require('@playwright/test');
          const { loadHtmlWithLocalCss } = require('./scripts/lib/responsive-html-loader');

          const profilePages = ['perfil.html', 'meu-perfil.html', 'perfil-cliente.html', 'perfil-profissional.html'];
          const viewports = [
            { width: 1366, height: 768 },
            { width: 1280, height: 802 },
            { width: 820, height: 1180 },
            { width: 608, height: 926 },
            { width: 390, height: 844 },
          ];
          const indexAuthorityViewports = viewports.filter(({ width }) => width !== 390);
          const manifest = process.env.PROFILE_MANIFEST;
          const target = process.env.TARGET_CSS;
          const targetLine = '@import url("../components/navigation/profile-header-index-parity.css?v=20260719-profile-family-v1");\n';

          async function inspect(pageName, viewport, mode) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport });
            try {
              const html = loadHtmlWithLocalCss(pageName, process.cwd(), { modeLabel: mode });
              await page.setContent(html, { waitUntil: 'domcontentloaded' });
              return await page.evaluate(() => {
                document.querySelectorAll('.doke-document-preloader').forEach((node) => {
                  node.hidden = true;
                  node.style.display = 'none';
                  node.setAttribute('aria-hidden', 'true');
                });

                const dropdown = document.querySelector('.profile-dropdown--home-main');
                if (!dropdown) return { missing: true };
                dropdown.hidden = false;
                dropdown.style.display = 'block';

                const style = getComputedStyle(dropdown);
                const rect = dropdown.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) {
                  return { rendered: false, zIndex: style.zIndex, rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height } };
                }

                const insetX = Math.min(14, Math.max(2, rect.width / 5));
                const insetY = Math.min(14, Math.max(2, rect.height / 5));
                const points = [
                  [rect.left + insetX, rect.top + insetY],
                  [rect.left + rect.width / 2, rect.top + Math.min(48, rect.height / 2)],
                  [rect.right - insetX, rect.top + insetY],
                  [rect.left + rect.width / 2, rect.top + rect.height / 2],
                ].filter(([x, y]) => x >= 0 && x < innerWidth && y >= 0 && y < innerHeight);

                const hits = points.map(([x, y]) => {
                  const top = document.elementFromPoint(x, y);
                  const topStyle = top ? getComputedStyle(top) : null;
                  return {
                    withinDropdown: !!top && (top === dropdown || dropdown.contains(top)),
                    topTag: top?.tagName || null,
                    topClass: typeof top?.className === 'string' ? top.className : '',
                    topPosition: topStyle?.position || null,
                    topZIndex: topStyle?.zIndex || null,
                  };
                });

                return {
                  rendered: true,
                  zIndex: style.zIndex,
                  rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                  hits,
                  allTopmost: hits.length > 0 && hits.every((hit) => hit.withinDropdown),
                };
              });
            } finally {
              await page.close();
              await browser.close();
            }
          }

          async function captureProfiles(label, expectedZ) {
            const out = {};
            for (const pageName of profilePages) {
              out[pageName] = {};
              for (const viewport of viewports) {
                const key = `${viewport.width}x${viewport.height}`;
                const result = await inspect(pageName, viewport, label);
                out[pageName][key] = result;
                assert.strictEqual(result.missing, undefined, `${pageName} ${key}: dropdown missing`);
                assert.strictEqual(result.rendered, true, `${pageName} ${key}: dropdown must render after preloader dismissal`);
                assert.strictEqual(result.zIndex, expectedZ, `${pageName} ${key}: unexpected z-index`);
              }
            }
            return out;
          }

          (async () => {
            const index = {};
            for (const viewport of indexAuthorityViewports) {
              const key = `${viewport.width}x${viewport.height}`;
              const result = await inspect('index.html', viewport, 'debt011-index-post-preloader');
              index[key] = result;
              assert.strictEqual(result.missing, undefined, `index ${key}: dropdown missing`);
              assert.strictEqual(result.rendered, true, `index ${key}: dropdown must render`);
              assert.strictEqual(result.zIndex, '80', `index ${key}: canonical dropdown z-index must be 80`);
              assert.strictEqual(result.allTopmost, true, `index ${key}: canonical dropdown must be topmost after preloader dismissal`);
            }

            const before = await captureProfiles('debt011-profile-before-post-preloader', '120');

            const manifestText = fs.readFileSync(manifest, 'utf8');
            assert.strictEqual(manifestText.split(targetLine).length - 1, 1, 'profile manifest must contain exactly one parity import');
            fs.writeFileSync(manifest, manifestText.replace(targetLine, ''));
            fs.unlinkSync(target);

            const after = await captureProfiles('debt011-profile-after-post-preloader', '80');

            for (const pageName of profilePages) {
              for (const viewport of viewports) {
                const key = `${viewport.width}x${viewport.height}`;
                assert.deepStrictEqual(after[pageName][key].rect, before[pageName][key].rect, `${pageName} ${key}: geometry changed`);
                assert.deepStrictEqual(after[pageName][key].hits, before[pageName][key].hits, `${pageName} ${key}: hit-test/occlusion pattern changed`);
                assert.strictEqual(after[pageName][key].allTopmost, before[pageName][key].allTopmost, `${pageName} ${key}: topmost outcome changed`);
              }
            }

            const baselineOcclusions = [];
            for (const pageName of profilePages) {
              for (const viewport of viewports) {
                const key = `${viewport.width}x${viewport.height}`;
                if (!before[pageName][key].allTopmost) baselineOcclusions.push({ pageName, viewport: key, hits: before[pageName][key].hits });
              }
            }

            console.log('UX_RESP_DEBT_011_POST_PRELOADER_BEGIN');
            console.log(JSON.stringify({ index, baselineOcclusions, before, after }, null, 2));
            console.log('UX_RESP_DEBT_011_POST_PRELOADER_END');
            console.log(`[ux-resp-debt-011] 120 -> 80 preserved geometry and exact hit-test pattern across 4 profile pages x 5 viewports; baseline occlusion cases=${baselineOcclusions.length}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Prove structural debt reduction after candidate removal
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:css-import-resolution
          npm run audit:active-legacy-structures
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const report = JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json', 'utf8'));
          assert.strictEqual(report.totals.activeLegacyCss, 0, 'candidate must reduce active legacy CSS to zero');
          assert.strictEqual(report.totals.activeLegacyJs, 1, 'community legacy JS debt must remain untouched');
          assert.strictEqual(report.totals.cssFiles, 533, 'candidate must remove exactly one physical CSS file');
          assert.strictEqual(report.totals.activeOrImportedCss, 401, 'candidate must remove exactly one active/imported CSS file');
          NODE

      - name: Reproduce certified responsive contract after candidate removal
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-responsive-index-baseline.js
          node scripts/test-responsive-contract.js | tee /tmp/debt011-post-preloader-responsive.txt
          grep -Fx 'Responsive contract test: PASS' /tmp/debt011-post-preloader-responsive.txt
          grep -Fx 'Checks: 893' /tmp/debt011-post-preloader-responsive.txt
          grep -Fx 'Failures: 0' /tmp/debt011-post-preloader-responsive.txt
          grep -Fx 'Skips: 277' /tmp/debt011-post-preloader-responsive.txt

      - name: Validate shared header and responsive boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:shared-app-header-contract
          npm run audit:responsive-boundaries
