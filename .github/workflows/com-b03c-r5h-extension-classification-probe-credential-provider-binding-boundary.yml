name: COM-B03C R5H Credential Provider Binding Boundary

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js'
      - 'config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json'
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  certify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Frozen certified credential-provider descriptor lineage
        shell: bash
        run: |
          set -euo pipefail
          parent=a5540f314103bc11b72d2b488907150d5bb35a3a
          certified=8ebf9cce39ded220df4a361b82145884041048bb
          git merge-base --is-ancestor "$parent" HEAD
          git merge-base --is-ancestor "$certified" HEAD
          test "$(git rev-parse "$parent^{tree}")" = "07c6c71e9beb6e78aeb04f65d04df7f20c5f70b2"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json)" = "00de308adfa27fc46110100f15bc4942911afd2e"
          test "$(git rev-parse "$parent:.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.yml")" = "3363a344a9a3d03c004ab79cce6971cbfe749289"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json)" = "0f711628b6755fe7025687042c0bbde7824dd1cb"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js)" = "6fc34e1b365ec801665fdab0c7d0c6761a8013e6"

      - name: Exact repository-only materialization scope
        shell: bash
        run: |
          set -euo pipefail
          parent=a5540f314103bc11b72d2b488907150d5bb35a3a
          certified=8ebf9cce39ded220df4a361b82145884041048bb
          module=backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js
          boundary=config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json
          certifier=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.yml
          initial="$(printf '%s\n' "$boundary" "$certifier" "$module" | sort)"
          final="$(printf '%s\n' "$boundary" "$certifier" "$module" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only "$parent" "$certified" | sort)"
          if [ "$actual" != "$initial" ] && [ "$actual" != "$final" ]; then
            printf 'Unexpected scope:\n%s\n' "$actual" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD:$module)" = "6419696544fb9e1906df92e3591e93efcf04b826"
          test "$(git rev-parse HEAD:$boundary)" = "a5b6700e8335511a39cbe215459a4675f17a16a1"

      - name: Syntax and inert no-runtime provider boundary
        shell: bash
        run: |
          set -euo pipefail
          module=backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js
          boundary=config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json
          node --check "$module"
          if grep -En 'process\.env|@supabase|createClient|\.channel\(|\.subscribe\(|fetch\(|https?://|SUPABASE_|service_role' "$module"; then
            echo 'Remote runtime syntax is forbidden in repository credential provider module' >&2
            exit 1
          fi
          if grep -En 'https?://|process\.env|secrets\.|@supabase|createClient|\.channel\(|\.subscribe\(|fetch\(|projectRef|projectUrl|apiKey|service_role|anonKey|SUPABASE_' "$boundary"; then
            echo 'Runtime, endpoint or secret-source syntax is forbidden in credential-provider binding boundary' >&2
            exit 1
          fi

      - name: Semantic credential-provider binding assertions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const boundary = require('./config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary.json');
          const descriptor = require('./config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json');
          const targetResource = require('./config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json');
          const provider = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js');

          const expectedContract = 'com-b03c-r5h-extension-classification-probe-credential-provider-binding-boundary-v1';
          const expectedProviderContract = 'com-b03c-r5h-extension-classification-probe-credential-provider-repository-implementation-v1';
          const expectedProviderPath = 'backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-credential-provider.js';
          const expectedProviderBlob = '6419696544fb9e1906df92e3591e93efcf04b826';
          const expectedEnvironment = 'doke-web-staging';
          const expectedResource = 'doke-web-staging-realtime-messages-extension-classification-probe';
          const expectedFingerprint = 'sha256:2ab84b52b269ef4c9556c9818f4355d466bce9f735878213b49d9840cdd00fbf';
          const expectedFields = ['providerContractId','providerModulePath','providerModuleBlob','bindingBoundaryHead'];

          if (boundary.contractId !== expectedContract) throw new Error('BOUNDARY_CONTRACT_DRIFT');
          if (boundary.repositoryContext.parentCertifiedCredentialProviderDescriptorHead !== 'a5540f314103bc11b72d2b488907150d5bb35a3a') throw new Error('PARENT_HEAD_DRIFT');
          if (boundary.repositoryContext.parentCertifiedCredentialProviderDescriptorTree !== '07c6c71e9beb6e78aeb04f65d04df7f20c5f70b2') throw new Error('PARENT_TREE_DRIFT');
          if (boundary.repositoryContext.parentCredentialProviderDescriptorCertificationRun !== 31957706074 || boundary.repositoryContext.parentCredentialProviderDescriptorCertificationJob !== 95190779178) throw new Error('PARENT_CERTIFICATION_DRIFT');
          if (boundary.repositoryContext.parentCredentialProviderDescriptorBlob !== '00de308adfa27fc46110100f15bc4942911afd2e' || boundary.repositoryContext.parentCredentialProviderDescriptorCertifierBlob !== '3363a344a9a3d03c004ab79cce6971cbfe749289') throw new Error('PARENT_BLOB_DRIFT');
          if (boundary.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || boundary.functionalCheckpoint.r5iCreated !== false || boundary.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');

          const parentBinding = descriptor.credentialProviderBindingDescriptor;
          if (descriptor.contractId !== 'com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary-v1') throw new Error('PARENT_DESCRIPTOR_CONTRACT_DRIFT');
          if (parentBinding.requiredFields.join('|') !== expectedFields.join('|')) throw new Error('PARENT_SCHEMA_DRIFT');
          if (parentBinding.credentialProviderBindingDescriptorDefined !== true || parentBinding.credentialProviderBindingDefined !== false || parentBinding.credentialProviderBound !== false || parentBinding.schemaOnly !== true) throw new Error('PARENT_DESCRIPTOR_STATE_DRIFT');
          for (const key of ['providerContractId','providerModulePath','providerModuleBlob','bindingBoundaryHead','credentialSecretName','credentialReference','credentialMaterial']) if (parentBinding[key] !== null) throw new Error(`PARENT_CONCRETE_VALUE_DRIFT:${key}`);

          const moduleDescriptor = provider.repositoryDescriptor();
          if (provider.CONTRACT_ID !== expectedProviderContract || moduleDescriptor.contractId !== expectedProviderContract) throw new Error('PROVIDER_CONTRACT_DRIFT');
          if (moduleDescriptor.credentialProviderImplementationPresent !== true || moduleDescriptor.requestDescriptorValidationImplemented !== true || moduleDescriptor.credentialReadHardBlockImplemented !== true) throw new Error('PROVIDER_IMPLEMENTATION_DRIFT');
          const moduleFalseKeys = ['credentialProviderBindingDefined','credentialProviderBound','secretSourceBound','credentialReferenceBound','credentialMaterialPresent','credentialReadImplemented','secretResolutionImplemented','credentialReferenceResolutionImplemented','remoteDependencyLoadImplemented','transportBound','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','identityProvisioningAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority','executionAttempted','exactRootCauseProven','causalPromotionAllowed','privatePresencePromotionAllowed','r5iCreated','r5iInferred'];
          for (const key of moduleFalseKeys) if (moduleDescriptor[key] !== false) throw new Error(`PROVIDER_MODULE_MUST_REMAIN_FALSE:${key}`);
          const request = provider.createCredentialRequestDescriptor({ purpose: 'realtime_extension_classification_probe' });
          if (request.decision !== 'repository_only_credential_request_descriptor_validated' || request.credentialLookupAllowed !== false || request.credentialReferenceResolutionAllowed !== false || request.credentialMaterialAllowed !== false || request.transportBound !== false || request.networkAuthority !== false || request.remoteCredentialReadAuthority !== false || request.remoteExecutionAuthority !== false) throw new Error('PROVIDER_REQUEST_DESCRIPTOR_DRIFT');
          const rejected = provider.createCredentialRequestDescriptor({ purpose: 'realtime_extension_classification_probe', credentialMaterial: 'forbidden-test-value' });
          if (rejected.decision !== 'blocked_repository_only' || rejected.reason !== 'CREDENTIAL_PROVIDER_CONCRETE_CREDENTIAL_INPUT_FORBIDDEN') throw new Error('PROVIDER_FORBIDDEN_INPUT_GATE_DRIFT');
          const readiness = provider.evaluateRepositoryCredentialProviderReadiness({ requestDescriptor: request });
          if (readiness.decision !== 'blocked_repository_only' || readiness.reason !== 'CREDENTIAL_PROVIDER_SOURCE_REQUIRES_SEPARATE_CERTIFIED_BOUNDARY_AND_FUTURE_EXPLICIT_AUTHORIZATION' || readiness.remoteCredentialReadAuthority !== false || readiness.remoteExecutionAuthority !== false) throw new Error('PROVIDER_READINESS_DRIFT');
          let hardBlocked = false;
          try { provider.assertCredentialReadDisabled(); } catch (error) { hardBlocked = error && error.code === provider.CREDENTIAL_READ_DISABLED_CODE; }
          if (!hardBlocked) throw new Error('PROVIDER_CREDENTIAL_READ_HARD_BLOCK_MISSING');

          const impl = boundary.providerImplementation;
          if (impl.contractId !== expectedProviderContract || impl.path !== expectedProviderPath || impl.blob !== expectedProviderBlob || impl.repositoryOwned !== true || impl.repositoryRelativeModulePath !== true || impl.immutableModuleBlob !== true || impl.inertUntilLaterAuthorizedComposition !== true) throw new Error('PROVIDER_IMPLEMENTATION_BINDING_DRIFT');
          for (const key of ['credentialReadImplemented','secretResolutionImplemented','credentialReferenceResolutionImplemented','remoteDependencyLoadImplemented','transportImplemented','networkAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority']) if (impl[key] !== false) throw new Error(`PROVIDER_IMPLEMENTATION_REMOTE_CAPABILITY_DRIFT:${key}`);

          const binding = boundary.credentialProviderBinding;
          if (binding.slotId !== 'credential_provider' || binding.credentialProviderBindingDescriptorDefined !== true || binding.credentialProviderBindingDefined !== true || binding.credentialProviderBound !== true || binding.bindingKind !== 'repository_owned_immutable_inert_module' || binding.localRepositoryBindingOnly !== true) throw new Error('CREDENTIAL_PROVIDER_BINDING_STATE_DRIFT');
          if (binding.providerContractId !== expectedProviderContract || binding.providerModulePath !== expectedProviderPath || binding.providerModuleBlob !== expectedProviderBlob) throw new Error('CREDENTIAL_PROVIDER_BINDING_IDENTITY_DRIFT');
          if (binding.bindingBoundaryHead !== null || binding.bindingBoundaryHeadResolvedByCertifierSubjectHead !== true) throw new Error('BINDING_HEAD_EVIDENCE_DRIFT');
          for (const key of ['credentialSecretName','credentialReference','credentialMaterial']) if (binding[key] !== null) throw new Error(`CREDENTIAL_SOURCE_MUST_REMAIN_NULL:${key}`);
          for (const key of ['credentialReadImplemented','secretResolutionImplemented','credentialReferenceResolutionImplemented','transportBound','stagingReadAuthority','stagingMutationAuthority','networkAuthority','remoteCredentialReadAuthority','remoteExecutionAuthority']) if (binding[key] !== false) throw new Error(`CREDENTIAL_PROVIDER_AUTHORITY_DRIFT:${key}`);

          const upstream = boundary.preservedUpstreamBindings;
          if (upstream.runtimeAdapter.bound !== true || upstream.runtimeAdapter.bindingBoundaryHead !== 'e2809ba029930eac76729c9ae5f1496919a500de' || upstream.runtimeAdapter.adapterModuleBlob !== '6fc34e1b365ec801665fdab0c7d0c6761a8013e6') throw new Error('UPSTREAM_RUNTIME_ADAPTER_DRIFT');
          if (upstream.targetEnvironment.bound !== true || upstream.targetEnvironment.bindingBoundaryHead !== '10ddea2bb7a4ded9bf1b7654585092a396f885cb' || upstream.targetEnvironment.stableEnvironmentIdentifier !== expectedEnvironment || upstream.targetEnvironment.production !== false) throw new Error('UPSTREAM_TARGET_ENVIRONMENT_DRIFT');
          if (upstream.targetResource.bound !== true || upstream.targetResource.bindingBoundaryHead !== 'e297b7f921c72864471e123a3d628a7f3e2dd3fd' || upstream.targetResource.stableResourceIdentifier !== expectedResource || upstream.targetResource.resourceScopeFingerprint !== expectedFingerprint) throw new Error('UPSTREAM_TARGET_RESOURCE_DRIFT');
          if (targetResource.targetResourceBinding.targetResourceBound !== true || targetResource.targetResourceBinding.resourceScopeFingerprint !== expectedFingerprint || targetResource.targetResourceBinding.credentialProviderBound !== false) throw new Error('FROZEN_TARGET_RESOURCE_PARENT_DRIFT');

          const expectedRemaining = ['synthetic_identity_lifecycle','realtime_client_factory','sanitized_evidence_recorder','cleanup_verifier'];
          if (boundary.remainingDependentPortState.map(x => x.slotId).join('|') !== expectedRemaining.join('|')) throw new Error('REMAINING_DEPENDENT_PORT_SET_DRIFT');
          for (const slot of boundary.remainingDependentPortState) if (slot.descriptorDefined !== false || slot.bound !== false || slot.concreteValuePresent !== false || slot.separateCertifiedBindingBoundaryRequired !== true) throw new Error(`REMAINING_PORT_MUST_BE_UNBOUND:${slot.slotId}`);

          const concrete = boundary.concreteBindingState;
          if (!concrete.credentialProvider || concrete.credentialProvider.providerContractId !== expectedProviderContract || concrete.credentialProvider.providerModulePath !== expectedProviderPath || concrete.credentialProvider.providerModuleBlob !== expectedProviderBlob || concrete.credentialProvider.bindingBoundaryHead !== null) throw new Error('CONCRETE_PROVIDER_BINDING_DRIFT');
          for (const key of ['credentialSecretName','credentialReference','credentialMaterial','syntheticIdentity','realtimeClientFactory','sanitizedEvidenceRecorder','cleanupVerifier','networkEndpoint','executionCommand','executionWorkflow','executionEntrypoint']) if (concrete[key] !== null) throw new Error(`FORBIDDEN_CONCRETE_BINDING:${key}`);

          const completeness = boundary.bindingCompleteness;
          if (completeness.runtimeAdapterSlotBound !== true || completeness.targetEnvironmentSlotBound !== true || completeness.targetResourceSlotBound !== true || completeness.credentialProviderSlotBound !== true || completeness.primaryRuntimeTargetSlotsBound !== true || completeness.allDependentPortsBound !== false || completeness.transportBound !== false || completeness.executionReady !== false) throw new Error('BINDING_COMPLETENESS_DRIFT');

          const future = boundary.futureBoundaryRequirements;
          if (future.nextDependentPortDescriptorMustBeSeparateCertifiedBoundary !== true || future.nextDependentPortDescriptorSlot !== 'synthetic_identity_lifecycle' || future.credentialProviderBindingMustRemainExact !== true) throw new Error('NEXT_BOUNDARY_DRIFT');
          const futureTrueKeys = ['credentialSecretNameMustRemainAbsent','credentialReferenceMustRemainAbsent','credentialMaterialMustRemainAbsent','credentialReadAuthorityMustRemainFalse','remoteDependencyLoadAuthorityMustRemainFalse','realtimeClientFactoryMustRemainUnbound','sanitizedEvidenceRecorderMustRemainUnbound','cleanupVerifierMustRemainUnbound','endpointMustRemainAbsent','transportMustRemainUnbound','stagingReadAuthorityMustRemainFalse','stagingMutationAuthorityMustRemainFalse','networkAuthorityMustRemainFalse','executionEntrypointMustRemainAbsent','executionWorkflowMustRemainAbsent','remoteExecutionAuthorityMustRemainFalse'];
          for (const key of futureTrueKeys) if (future[key] !== true) throw new Error(`FUTURE_FAIL_CLOSED_DRIFT:${key}`);

          const auth = boundary.authorizationState;
          if (auth.genericContinuationGrantsRemoteAuthority !== false || auth.priorR5dAuthorizationReusable !== false || auth.priorR5dReceiptReusable !== false || auth.priorR5dTriggerReusable !== false) throw new Error('AUTHORIZATION_REUSE_DRIFT');
          const causal = boundary.causalState;
          if (causal.exactRootCauseProven !== false || causal.causalPromotionAllowed !== false || causal.privatePresencePromotionAllowed !== false || causal.privateTypingBroadcastProven !== false || causal.channelMessagesCanonicalRemoteAuthority !== false) throw new Error('CAUSAL_STATE_DRIFT');

          const g = boundary.governance;
          const trueKeys = ['repositoryOnlyDefinition','repositoryOnlyBinding','runtimeAdapterBindingDefined','runtimeAdapterBound','targetEnvironmentBindingDescriptorDefined','targetEnvironmentBindingDefined','targetEnvironmentBound','targetResourceBindingDescriptorDefined','targetResourceBindingDefined','targetResourceBound','credentialProviderImplementationPresent','credentialProviderBindingDescriptorDefined','credentialProviderBindingDefined','credentialProviderBound'];
          for (const key of trueKeys) if (g[key] !== true) throw new Error(`GOVERNANCE_MUST_BE_TRUE:${key}`);
          const falseKeys = ['credentialSecretNamePresent','credentialReferencePresent','credentialMaterialPresent','credentialReadImplemented','transportBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority'];
          for (const key of falseKeys) if (g[key] !== false) throw new Error(`GOVERNANCE_MUST_REMAIN_FALSE:${key}`);
          NODE

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check a5540f314103bc11b72d2b488907150d5bb35a3a HEAD
