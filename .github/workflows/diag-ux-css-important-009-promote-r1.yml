name: Doke UX CSS Important 009 Promote R1
on: [push]
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ad132fc1c25f0d9e234810cae6993360d8baf2e6
      TARGET_FILE: assets/css/components/cards/mobile-card-contract.css
      TARGET_BLOB: 0fef120997dacc4a1437ff4acb2f7db7b57c6408
      CANDIDATE_SHA256: e2ec2c64886991c155f60779b66e0e0baacc7857ac2225c19bce230357eaf40e
      PERM_BRANCH: ux/ux-css-important-009-mobile-card-dormant-actions
      DIAG_BRANCH: diag/ux-css-important-009-promote-r1
      RESULT_FILE: .diagnostics/ux-css-important-009-promotion-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1; test "$(git rev-parse HEAD^)" = "$TARGET_SHA"; remote_before="$(git ls-remote origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"; test "$remote_before" = "$TARGET_SHA"; git reset --hard "$TARGET_SHA" >/dev/null; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8'),r=0;function x(a,n){let i=s.indexOf(a+' {');if(i<0||s.indexOf(a+' {',i+1)>=0)throw Error(a);let b=s.indexOf('{',i),e=s.indexOf('}',b),z=s.slice(b+1,e),c=(z.match(/!important\b/g)||[]).length;if(c!==n)throw Error(a+' '+c);z=z.replace(/\s*!important\b/g,'');r+=c;s=s.slice(0,b+1)+z+s.slice(e)}if((s.match(/!important\b/g)||[]).length!==20)throw Error('parent');x(':is(.service-card__favorite, .favorite-button, .heart-button, .video-card__play)',10);x(':is(.service-card__favorite, .favorite-button, .heart-button, .video-card__play) svg',2);x('body.home-index-shell .short-videos .short-videos__track > .video-card .video-card__play,\n  body.search-results-body .results-layout :is(.results-grid, .results-videos-grid) > .video-card .video-card__play,\n  body.profile-page-shell .profile-posts-stack .short-videos__track > .video-card .video-card__play',4);let z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex');if(r!==16||(s.match(/!important\b/g)||[]).length!==4||h!==process.env.CANDIDATE_SHA256)throw Error('candidate');fs.writeFileSync(f,s);console.log(`CANDIDATE PASS|sha256=${h}|bytes=${z.length}|important=20->4|removed=16`)
          NODE
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'16\t16\t'"$TARGET_FILE"; git diff --check; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$TARGET_FILE"; git commit -m 'UX-CSS-IMPORTANT-009: remove dormant legacy mobile-card action priorities' >/dev/null; new_sha="$(git rev-parse HEAD)"; new_tree="$(git rev-parse HEAD^{tree})"; new_blob="$(git rev-parse HEAD:$TARGET_FILE)"; test "$(git rev-parse HEAD^)" = "$TARGET_SHA"; test "$(git diff --numstat "$TARGET_SHA"..HEAD -- "$TARGET_FILE")" = $'16\t16\t'"$TARGET_FILE"; test "$(git diff --name-only "$TARGET_SHA"..HEAD)" = "$TARGET_FILE"; remote_check="$(git ls-remote origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"; test "$remote_check" = "$TARGET_SHA"; git push origin "HEAD:refs/heads/$PERM_BRANCH" >/dev/null; remote_after="$(git ls-remote origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"; test "$remote_after" = "$new_sha"; echo "PARENT_SHA=$TARGET_SHA"; echo "REMOTE_BEFORE=$remote_before"; echo "NEW_SHA=$new_sha"; echo "NEW_TREE=$new_tree"; echo "PARENT_BLOB=$TARGET_BLOB"; echo "NEW_BLOB=$new_blob"; echo "SHA256=$CANDIDATE_SHA256"; echo 'BYTES=9564'; echo 'DIFF=1 file +16/-16'; echo 'PROOF_RUNS=ranking:32198664130,source:32198892904,visual:32199103177,governance:32198991395'
      - id: restore
        if: always()
        shell: bash
        run: set -euo pipefail; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; git clean -fdx >/dev/null
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PROMOTE=${{ steps.promote.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE PASS|PARENT_SHA=|REMOTE_BEFORE=|NEW_SHA=|NEW_TREE=|PARENT_BLOB=|NEW_BLOB=|SHA256=|BYTES=|DIFF=|PROOF_RUNS=)' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 220 /tmp/p.log || true; fi; } >/tmp/o; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/o "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 009 promotion r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
