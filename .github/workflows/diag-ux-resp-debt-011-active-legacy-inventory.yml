name: Diagnose UX-RESP-DEBT-011 Active Legacy Inventory

on:
  push:
    branches:
      - diag/ux-resp-debt-011-active-legacy-inventory

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard exact UX-RESP-DEBT-010 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "68f6b60d3a7a15a80d5704a0a3d521f500c4dcdb"
          test "$(git diff --name-only HEAD^...HEAD)" = ".github/workflows/diag-ux-resp-debt-011-active-legacy-inventory.yml"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate current structural inventory
        run: npm run audit:active-legacy-structures

      - name: Print actionable inventory
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json', 'utf8'));
          const out = {
            totals: report.totals,
            activeLegacyCss: report.activeLegacyCss,
            activeLegacyJs: report.activeLegacyJs,
            highestRiskActiveCss: report.highestRiskActiveCss,
            legacyConsumers: report.highestRiskPages
              .filter((page) => page.activeLegacyCssLinks.length || page.activeLegacyJsLinks.length),
            authorityCollisions: report.authorityCollisions
          };
          console.log('UX_RESP_DEBT_011_INVENTORY_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('UX_RESP_DEBT_011_INVENTORY_END');
          NODE

      - name: Validate import graph
        run: npm run audit:css-import-resolution
