name: Doke SCHED-B04B Repository Applicator

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04b-repository-applicator.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04b-repository-applicator
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Apply B04B repository wiring
        run: node scripts/apply-sched-001-b04b-ord-canonical-wiring.js
      - name: Reconcile ORD-A11 cumulative auditor
        run: node scripts/reconcile-ord-a11-post-sched-b04b.js
      - name: Regenerate deterministic matrix derivatives
        run: npm run write:domain-completion-matrix
      - name: Validate B04B and cumulative contracts
        run: |
          set -euo pipefail
          npm run audit:sched-001-b04b-ord-canonical-wiring-implementation
          npm run test:sched-001-b04b-ord-canonical-wiring-runtime
          npm run audit:sched-001-b04-ord-canonical-wiring-readiness
          npm run test:sched-001-b04-ord-canonical-wiring-readiness
          node scripts/audit-sched-001-a05-persistence-readiness.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          node scripts/audit-sched-001-a04-server-command-runtime.js
          node scripts/test-sched-001-a04-scheduling-service-runtime.js
          node scripts/audit-ord-001-a11-scheduling-authority-handoff.js
          npm run audit:domain-completion-matrix
          git diff --check
      - name: Commit validated B04B implementation
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add -A
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "feat(sched): implement B04B ORD canonical wiring"
          git push origin HEAD:ord/ord-001-baseline-audit
