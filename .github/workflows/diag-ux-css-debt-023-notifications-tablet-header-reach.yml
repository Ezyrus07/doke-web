name: Doke UX-CSS-DEBT-023 Notifications Tablet Header Reach

on:
  push:
    branches:
      - diag/ux-css-debt-023-notifications-tablet-header-reach

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c72fdba37031001c0d503af7b61babbeb46e1c96
      TARGET_FILE: assets/css/pages/notificacoes/tablet-header-rail.css
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
      - name: Guard exact owner and dead rows
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          grep -Fq '@import url("./notificacoes/tablet-header-rail.css?v=20260625-account-pill-contract-v1");' assets/css/pages/notificacoes-foundation.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const f=process.env.TARGET_FILE,s=fs.readFileSync(f,'utf8'),lines=s.split(/\r?\n/),sha=crypto.createHash('sha256').update(s).digest('hex');
          const exact=[
            [159,'flex: 0 0 auto;'],[160,'inline-size: max-content;'],[161,'min-inline-size: max-content;'],[162,'overflow: visible;'],
            [199,'flex: 0 0 auto;'],[200,'inline-size: auto;'],[204,'min-inline-size: max-content;'],[211,'overflow: visible;']
          ];
          for(const [n,v] of exact) if(lines[n-1].trim()!==v) throw new Error(`line ${n} drift: ${lines[n-1]}`);
          const decl=(s.match(/^\s*[\w-]+\s*:\s*.*;\s*$/gm)||[]).length;
          if(decl!==119) throw new Error('decl drift '+decl);
          console.log(`STATIC PASS|decl=119|dead=4|sha=${sha}|bytes=${Buffer.byteLength(s)}`);
          NODE
      - name: Setup Node and Chromium
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Prove canonical DOM CSSOM and tablet boundaries
        run: |
          set -euo pipefail
          cat >/tmp/reach.js <<'NODE'
          const cp=require('child_process'); const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const viewports=[[760,900],[761,900],[820,1180],[1024,900],[1179,900],[1180,900],[1181,900],[390,844]];
          const fileNeedle='/assets/css/pages/notificacoes/tablet-header-rail.css';
          const selector='body[data-page="notificacoes"].has-global-header .app-header--notifications .notifications-header-context';
          const canon=s=>(s||'').replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s*,\s*/g,',').trim();
          const server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{try{await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});let active=0;
            for(const [w,h] of viewports){const ctx=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});const page=await ctx.newPage();
              await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});
              await page.goto('http://127.0.0.1:5500/notificacoes.html',{waitUntil:'domcontentloaded',timeout:15000});
              await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}.doke-document-preloader{display:none!important}html,body{visibility:visible!important;opacity:1!important}'});
              const out=await page.evaluate(({selector,fileNeedle})=>{const canon=s=>(s||'').replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s*,\s*/g,',').trim();const hits=[];
                function walk(rules,ctx,href){for(const r of [...rules]){if(r.constructor?.name==='CSSImportRule'&&r.styleSheet){try{walk(r.styleSheet.cssRules,ctx,r.styleSheet.href||href)}catch{}}else if(r.constructor?.name==='CSSMediaRule'){walk(r.cssRules,[...ctx,`@media ${r.conditionText}`],href)}else if(canon(r.selectorText)===canon(selector)){for(const p of ['flex','inline-size','min-inline-size','overflow']){const v=r.style?.getPropertyValue(p);if(v)hits.push({prop:p,value:v.trim(),priority:r.style.getPropertyPriority(p),ctx:ctx.join(' || '),href});}}}}
                for(const sh of [...document.styleSheets]){try{walk(sh.cssRules,[],sh.href||'inline')}catch{}}
                const node=document.querySelector(selector),cs=node?getComputedStyle(node):null,r=node?.getBoundingClientRect();
                return {count:document.querySelectorAll(selector).length,media:matchMedia('(min-width: 761px) and (max-width: 1180px)').matches,computed:node?{flexGrow:cs.flexGrow,flexShrink:cs.flexShrink,flexBasis:cs.flexBasis,inlineSize:cs.inlineSize,minInlineSize:cs.minInlineSize,overflow:cs.overflow,rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]}:null,hits:hits.filter(x=>String(x.href).includes(fileNeedle))};
              },{selector,fileNeedle});
              if(out.count!==1)throw new Error(`canonical DOM count ${w}: ${out.count}`);
              const mh=out.hits.filter(x=>x.ctx==='@media (min-width: 761px) and (max-width: 1180px)');
              for(const p of ['flex','inline-size','min-inline-size','overflow']){const a=mh.filter(x=>x.prop===p);if(a.length!==2)throw new Error(`CSSOM ${p} cardinality ${w}: ${a.length}`);if(a.some(x=>x.priority!==''))throw new Error(`priority ${p} ${w}`);}
              const flex=mh.filter(x=>x.prop==='flex').map(x=>x.value), inline=mh.filter(x=>x.prop==='inline-size').map(x=>x.value), min=mh.filter(x=>x.prop==='min-inline-size').map(x=>x.value), over=mh.filter(x=>x.prop==='overflow').map(x=>x.value);
              if(JSON.stringify(flex)!==JSON.stringify(['0 0 auto','0 0 auto']))throw new Error(`flex values ${w}`);
              if(JSON.stringify(inline)!==JSON.stringify(['max-content','auto']))throw new Error(`inline values ${w}`);
              if(JSON.stringify(min)!==JSON.stringify(['max-content','max-content']))throw new Error(`min values ${w}`);
              if(JSON.stringify(over)!==JSON.stringify(['visible','visible']))throw new Error(`overflow values ${w}`);
              if(out.media)active++;
              await ctx.close();
            }
            await browser.close(); if(active!==5)throw new Error(`tablet boundary count=${active}`); console.log('REACH PASS|viewports=8|tabletActive=5|DOM=canonical|cssom=2+2+2+2');
          }finally{server.kill('SIGTERM')}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check /tmp/reach.js
          node /tmp/reach.js
      - name: Governance baseline
        run: |
          set -euo pipefail
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
      - name: Restore exact parent
        run: |
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test -z "$(git status --porcelain)"
