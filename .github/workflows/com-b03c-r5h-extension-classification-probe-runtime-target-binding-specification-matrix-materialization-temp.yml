name: COM-B03C R5H Runtime Target Binding Specification Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "a87a29272ec8b38e92bbf873680d8953520f727a"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed runtime target binding specification assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json)" = "9ad9c4ac7a8863ff54cde18bd898483685346906"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-boundary.json)" = "86d7ed97336fa8dc7d3f4f6cff8920720fe4d637"
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-execution-wiring.js)" = "27c1e962f0da3dbf2aaf7f122fa79211d5483dc2"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-execution-wiring-implementation-boundary.yml)" = "f8ad69ba0dfb27632c44291fe814699aedc44cd2"
          node - <<'NODE'
          const spec = require('./config/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification.json');
          if (spec.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || spec.functionalCheckpoint.r5iCreated !== false || spec.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          const binding = spec.bindingSpecification;
          if (binding.runtimeTargetBindingSpecificationDefined !== true || binding.runtimeTargetBindingDefined !== false || binding.runtimeTargetBindingImplemented !== false) throw new Error('RUNTIME_TARGET_BINDING_SPEC_STATE_DRIFT');
          for (const key of ['concreteRuntimeAdapter','concreteTargetEnvironment','concreteTargetResource','targetEnvironmentClass','targetEnvironmentStableIdentifier','targetResourceStableIdentifier','targetResourceScopeFingerprint','credentialProvider','credentialSecretName','credentialMaterial','syntheticIdentity','realtimeClientFactory','networkEndpoint','bindingCommand','bindingWorkflow','executionEntrypoint']) {
            if (binding[key] !== null) throw new Error(`${key}_MUST_REMAIN_NULL`);
          }
          const gov = spec.governance;
          for (const key of ['runtimeTargetBindingDefined','runtimeTargetBindingImplemented','transportBound','executionEntryPointExported','targetEnvironmentBound','targetResourceBound','runtimeAdapterBound','credentialProviderBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) {
            if (gov[key] !== false) throw new Error(`${key}_MUST_REMAIN_FALSE`);
          }
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-runtime-target-binding-specification-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for runtime target binding specification" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
