name: COM-B02R B02P-B02Q Runtime Repository Binding Composition Matrix Materialization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02r-runtime-repository-binding-composition-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=e0ea702ddc21bd5f4950152f0f5e47e98b13ed5a
          temp=.github/workflows/com-b02r-runtime-repository-binding-composition-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-repository-binding-composition.js)" = "cfc3bd8790d99b1ee61bf52fa93fd2bb2a6bf3bc"
          test "$(git rev-parse HEAD:config/com-b02r-runtime-repository-binding-composition.json)" = "4a5f808ea433e26d3af9a6ccaa44a4c608dc5f6b"
          test "$(git rev-parse HEAD:scripts/test-com-b02r-runtime-repository-binding-composition.js)" = "9ce6d59108004f603ea3a9a9b828220c5d57129d"
          test "$(git rev-parse HEAD:.github/workflows/com-b02r-runtime-repository-binding-composition.yml)" = "9a356e9d2dd7dee9ed9276e8ae957f27a6a5db64"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-repository-executor-service-role-provider-binding.js)" = "384c3a452b7e0e66d1bf2ddfeebb341c8b36f3c9"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-binding-integration-implementation.js)" = "19a5918f91df57ce991ff25e9fbd7eb15ecdfc2f"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02r-runtime-repository-binding-composition-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed B02R assertions
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/modules/communities/community-command-runtime-repository-binding-composition.js
          test "$(git rev-parse HEAD:$TARGET)" = "cfc3bd8790d99b1ee61bf52fa93fd2bb2a6bf3bc"
          test "$(git rev-parse HEAD:config/com-b02r-runtime-repository-binding-composition.json)" = "4a5f808ea433e26d3af9a6ccaa44a4c608dc5f6b"
          test "$(git rev-parse HEAD:scripts/test-com-b02r-runtime-repository-binding-composition.js)" = "9ce6d59108004f603ea3a9a9b828220c5d57129d"
          test "$(git rev-parse HEAD:.github/workflows/com-b02r-runtime-repository-binding-composition.yml)" = "9a356e9d2dd7dee9ed9276e8ae957f27a6a5db64"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-repository-executor-service-role-provider-binding.js)" = "384c3a452b7e0e66d1bf2ddfeebb341c8b36f3c9"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-runtime-binding-integration-implementation.js)" = "19a5918f91df57ce991ff25e9fbd7eb15ecdfc2f"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          node --check "$TARGET"
          node --check scripts/test-com-b02r-runtime-repository-binding-composition.js
          node scripts/test-com-b02r-runtime-repository-binding-composition.js
          ! grep -E 'process\.env|Deno\.env|Bun\.env|createClient\(|fetch\(|https?://|SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.rpc\(' "$TARGET"
          grep -F "repositoryBinding.bindRepositoryOperation" "$TARGET"
          grep -F "repositoryOperationInvoked: false" "$TARGET"
          grep -F "credentialSourceBound: false" "$TARGET"
          grep -F "remoteClientBound: false" "$TARGET"
          grep -F "runtimeActivated: false" "$TARGET"
          ! git diff --name-only f591dbe67594ef48a01fafb293fff2318721c072 HEAD | grep '^supabase/migrations/'

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02r-runtime-repository-binding-composition-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for B02R composition binding" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
