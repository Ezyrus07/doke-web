name: Doke UX CSS Important 007 Static R2
on:
  push:
    branches: [diag/ux-css-important-007-static-r2]
    paths: [.github/workflows/diag-ux-css-important-007-static-r2.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c84dd3fcacae7db5c616d2eeab745a864f31ae6b
      TARGET_FILE: assets/css/components/cards/mobile-card-contract.css
      TARGET_BLOB: fab02ea9f4b469d912d5f9c05b6091aad503b55f
      DIAG_BRANCH: diag/ux-css-important-007-static-r2
      RESULT_FILE: .diagnostics/ux-css-important-007-static-r2.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/proof.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const f=process.env.TARGET_FILE, parent=fs.readFileSync(f,'utf8');
          if((parent.match(/!important\b/g)||[]).length!==79) throw Error('parent count');
          let s=parent,removed=0;
          function strip(selector,expected){
            const key=selector+' {'; const i=s.indexOf(key); if(i<0||s.indexOf(key,i+1)>=0) throw Error('selector '+selector);
            const b=s.indexOf('{',i),e=s.indexOf('}',b); let block=s.slice(b+1,e); const n=(block.match(/!important\b/g)||[]).length;
            if(n!==expected) throw Error(`expected ${expected} got ${n}`);
            block=block.replace(/\s*!important\b/g,''); removed+=n; s=s.slice(0,b+1)+block+s.slice(e);
          }
          strip('body:not(.home-index-shell) :is(.video-card, .results-videos-grid .video-card, .profile-posts-stack .video-card)',5);
          strip('body.search-results-body :is(.results-grid, .results-videos-grid, .results-before-after-grid, .results-users-grid)',1);
          strip('body.profile-page-shell :is(.profile-posts-stack .short-videos__track, .profile-posts-stack .comparison-grid)',4);
          strip('body.search-results-body .results-layout[data-results-mode="services"] :is(.results-grid, .results-empty__grid) .service-card--result',4);
          strip('body.search-results-body .results-layout[data-results-mode="services"] :is(.results-grid, .results-empty__grid) .service-card--result .service-card__media',4);
          strip('body.search-results-body .results-layout[data-results-mode="services"] :is(.results-grid, .results-empty__grid) .service-card--result .service-card__favorite',4);
          strip('body.search-results-body .results-layout[data-results-mode="services"] :is(.results-grid, .results-empty__grid) .service-card--result .service-card__body',4);
          strip('body.search-results-body .results-layout[data-results-mode="services"] :is(.results-grid, .results-empty__grid) .service-card--result .service-card__category--body',1);
          strip('body.search-results-body .results-layout[data-results-mode="services"] :is(.results-grid, .results-empty__grid) .service-card--result .service-card__location',1);
          strip('body.profile-page-shell .profile-posts-stack .short-videos__track',5);
          strip('body.search-results-body .results-layout :is(.results-grid, .results-videos-grid) > .video-card,\n  body.profile-page-shell .profile-posts-stack .short-videos__track > .video-card',3);
          if(removed!==36||(s.match(/!important\b/g)||[]).length!==43) throw Error('candidate count');
          fs.writeFileSync('/tmp/candidate.css',s); const z=Buffer.from(s),h=crypto.createHash('sha256').update(z).digest('hex');
          const html=fs.readFileSync('index.html','utf8'); if(!/<body\b[^>]*class=["'][^"']*home-index-shell/i.test(html)) throw Error('home body authority');
          console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${z.length}|important=79->43|priorityMarkersRemoved=36|declarationsRemoved=0`);
          console.log('STATIC REACH PASS|rankingRun=32161790286|activePages=1|pageList=index.html|directImporter=assets/css/pages/home-runtime-components.css|bodyAuthority=home-index-shell|foreignBodySelectors=entrypoint-impossible');
          NODE
          test "$(git diff --no-index --numstat "$TARGET_FILE" /tmp/candidate.css | awk '{print $1" "$2}')" = '36 36'
      - id: restore
        if: always()
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA" >/dev/null
          git clean -fdx >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          result=FAIL
          if test '${{ steps.proof.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PROOF=${{ steps.proof.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|STATIC REACH PASS)\|' /tmp/proof.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 180 /tmp/proof.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"
          cp /tmp/evidence.txt "$RESULT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_FILE"
          git commit -m 'diag: record ux css important 007 static r2 [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
