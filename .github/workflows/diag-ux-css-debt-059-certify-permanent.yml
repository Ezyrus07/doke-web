name: Doke UX-CSS-DEBT-059 Permanent Certification

on:
  push:
    branches:
      - diag/ux-css-debt-059-certify-permanent

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      PERMANENT_BRANCH: ux/ux-css-debt-059-media-lightbox-compaction
      PERMANENT_SHA: 5a93b7fdf0b61e91d6dcd3867ae98d97f94d7eb9
      PARENT_SHA: 025ee39a521d8297dd68db58749b2f46a42bcdbe
      TREE_SHA: 8e4147ec5d8ddbeab6cb5910b94c961e006d86b0
      TARGET_FILE: assets/css/components/media-lightbox.css
      PARENT_TARGET_BLOB: c33b7b81f4e548f3206f889633f946c4daa5e5ec
      PERMANENT_TARGET_BLOB: 3c2c54f099bdfe2a2c3bb90857575fd88559783a
      EXPECTED_SHA256: 1fa9362a0562af0523f258a3c05f7bd1e52bac8964889b8c2512a957a5f399d1
      EXPECTED_BYTES: 14301
      DETAIL_IMPORTER: assets/css/pages/marketplace-detail-foundation.css
      DETAIL_IMPORTER_BLOB: d7bf543b8f00a34af6359f5fbe5b389c5bfe5796
      MESSAGES_IMPORTER: assets/css/pages/messaging-runtime-chat.css
      MESSAGES_IMPORTER_BLOB: 225939d37e493d4f7d3ae3349e75866a5196a94b
      RUNTIME_JS: assets/js/components/media-lightbox.js
      RUNTIME_BLOB: 795d7e171f79f37ac1bc440930281cabba90b6ef
      DETAIL_HTML_BLOB: 3735683f54ef18b805f97e3933db4f86c7e0ffe6
      MESSAGES_HTML_BLOB: 7259ddb38a68e911af815e2d7e628ac6d70dc945
      BROWSER_RUN: 31982937022
      BROWSER_JOB: 95252841151
      CANDIDATE_RUN: 31983120184
      CANDIDATE_JOB: 95253335275
    steps:
      - name: Checkout exact permanent SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PERMANENT_SHA }}
          fetch-depth: 2

      - name: Exact permanent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PERMANENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_TARGET_BLOB"
          test "$(git rev-parse "HEAD:$TARGET_FILE")" = "$PERMANENT_TARGET_BLOB"
          test "$(git hash-object "$TARGET_FILE")" = "$PERMANENT_TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA" HEAD -- "$TARGET_FILE")" = $'0\t79\t'"$TARGET_FILE"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = "1"
          git diff --quiet "$PARENT_SHA" HEAD -- package.json package-lock.json
          git diff --check "$PARENT_SHA" HEAD
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PERMANENT_SHA"
          echo "IDENTITY PASS|permanent=$PERMANENT_SHA|parent=$PARENT_SHA|tree=$TREE_SHA|parentBlob=$PARENT_TARGET_BLOB|targetBlob=$PERMANENT_TARGET_BLOB|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|commits=1|files=1|additions=0|deletions=79|branch=$remote_sha"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Independent reconstruction and runtime authority identity
        shell: bash
        run: |
          set -euo pipefail
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/ux059-parent.css
          cp "$TARGET_FILE" /tmp/ux059-permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\//g,m=>m.replace(/[^\n]/g,' '));
          const norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();
          function parse(src){const lines=strip(src).split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/;for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map(),dead=[];for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead.push({...d,winner:l});if(!l||d.important||!l.important)last.set(k,d)}return{declarations:ds,dead}}
          const parent=fs.readFileSync('/tmp/ux059-parent.css','utf8'),permanent=fs.readFileSync('/tmp/ux059-permanent.css','utf8');
          const p=parse(parent),q=parse(permanent);
          if(p.declarations.length!==359||p.dead.length!==79)throw new Error(`parent ${p.declarations.length}/${p.dead.length}`);
          if(q.declarations.length!==280||q.dead.length!==0)throw new Error(`permanent ${q.declarations.length}/${q.dead.length}`);
          if(new Set(p.dead.map(x=>x.selector)).size!==12)throw new Error('families');
          const identical=p.dead.filter(x=>x.value===x.winner.value&&x.important===x.winner.important).length;if(identical!==45)throw new Error(`identical ${identical}`);
          if(p.dead.some(x=>x.important||x.winner.important)||p.dead.some(x=>x.context!=='@media (max-width: 760px)')||p.dead.some(x=>!x.selector.includes('body[data-page="detalhe-anuncio"]')))throw new Error('scope/context/importance drift');
          const remove=new Set(p.dead.map(x=>x.line));const rebuilt=parent.split(/\r?\n/).filter((_,i)=>!remove.has(i+1)).join('\n');
          if(rebuilt!==permanent)throw new Error('independent reconstruction differs from permanent');
          const hash=crypto.createHash('sha256').update(rebuilt).digest('hex');if(hash!==process.env.EXPECTED_SHA256)throw new Error(`hash ${hash}`);
          console.log(`RECONSTRUCTION PASS|parent=359/79|permanent=280/0|families=12|identical=45|changed=34|context=max760|commentNormalized=1|byteIdentical=1|sha256=${hash}`);
          NODE
          test "$(git rev-parse "HEAD:$DETAIL_IMPORTER")" = "$DETAIL_IMPORTER_BLOB"
          test "$(git rev-parse "HEAD:$MESSAGES_IMPORTER")" = "$MESSAGES_IMPORTER_BLOB"
          test "$(git rev-parse "HEAD:$RUNTIME_JS")" = "$RUNTIME_BLOB"
          test "$(git rev-parse "HEAD:detalhe-anuncio.html")" = "$DETAIL_HTML_BLOB"
          test "$(git rev-parse "HEAD:mensagens.html")" = "$MESSAGES_HTML_BLOB"
          grep -q 'components/media-lightbox.css' "$DETAIL_IMPORTER"
          grep -q 'components/media-lightbox.css' "$MESSAGES_IMPORTER"
          grep -q 'data-page="detalhe-anuncio"' detalhe-anuncio.html
          grep -q 'data-page="mensagens"' mensagens.html
          grep -q 'data-lightbox-open' detalhe-anuncio.html
          grep -q 'window.DokeMediaLightbox' "$RUNTIME_JS"
          echo "RUNTIME AUTHORITY PASS|detail=detalhe-anuncio.html|messages=mensagens.html|detailImporter=$DETAIL_IMPORTER_BLOB|messagesImporter=$MESSAGES_IMPORTER_BLOB|runtime=$RUNTIME_BLOB|browserTransfer=$BROWSER_RUN/$BROWSER_JOB|candidateTransfer=$CANDIDATE_RUN/$CANDIDATE_JOB|sha256=$EXPECTED_SHA256|messagesDeadSelectorMatch=0"

      - name: Generate responsive baseline from exact parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA"
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          git checkout --detach "$PERMANENT_SHA"
          test "$(git rev-parse HEAD)" = "$PERMANENT_SHA"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "PARENT BASELINE PASS|parent=$PARENT_SHA|permanent=$PERMANENT_SHA"

      - name: Responsive contract on exact permanent SHA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-responsive-contract.js | tee /tmp/ux059-responsive.log
          grep -q 'Checks: 893' /tmp/ux059-responsive.log
          grep -q 'Failures: 0' /tmp/ux059-responsive.log
          grep -q 'Skips: 277' /tmp/ux059-responsive.log
          echo 'RESPONSIVE PASS|checks=893|failures=0|skips=277'

      - name: Governance and permanent canonical residual
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          test "$(sha256sum docs/PAGE-ASSET-AUTHORITY-MATRIX.md | awk '{print $1}')" = "345a91bbd8c9fa54ab5f548c5f586d60cef40bf28eb10c9554050752f6431bb6"
          test "$(sha256sum docs/HOME-AUTHORITY-CLASSIFICATION.md | awk '{print $1}')" = "b1027e88acf9a0a4b24c7870eca824b0ffbdc14fd75a6af31a86826051c58dda"
          git checkout "$PERMANENT_SHA" -- docs/PAGE-ASSET-AUTHORITY-MATRIX.md docs/HOME-AUTHORITY-CLASSIFICATION.md
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8'));const tracked=cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.css'));const importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,normImport=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));};const meta=new Map();for(const f of tracked){const text=fs.readFileSync(f,'utf8'),imports=[];let m;importRe.lastIndex=0;while((m=importRe.exec(text)))imports.push(normImport(m[1],f));meta.set(f,{text,imports,size:Buffer.byteLength(text),important:(text.match(/!important/gi)||[]).length});}const active=new Set(),todo=[...new Set(report.pageAssets.flatMap(p=>p.css))].filter(f=>meta.has(f));while(todo.length){const f=todo.pop();if(active.has(f)||!meta.has(f))continue;active.add(f);for(const n of meta.get(f).imports)if(meta.has(n))todo.push(n)}const high=[...active].filter(f=>{const x=meta.get(f);return x.size>=50000||x.important>=100||x.imports.length>=10});
          function deadCount(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const ds=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),o=(line.match(/\{/g)||[]).length,c=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[]}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t]}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth})}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');ds.push({selector:sel,property:m[1].toLowerCase(),important,context})}}depth+=o-c;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null}}const last=new Map();let dead=0;for(let i=ds.length-1;i>=0;i--){const d=ds[i],k=`${d.context} >>> ${d.selector} >>> ${d.property}`,l=last.get(k);if(l&&(!d.important||l.important))dead++;if(!l||d.important||!l.important)last.set(k,d)}return{decl:ds.length,dead}}
          if(active.size!==401||high.length!==37)throw new Error(`active/high ${active.size}/${high.length}`);let files=0,total=0,highDead=0;for(const f of active){const p=deadCount(meta.get(f).text);if(p.dead){files++;total+=p.dead;if(high.includes(f))highDead++}}const target=deadCount(meta.get(process.env.TARGET_FILE).text),p058=deadCount(meta.get('assets/css/components/before-after-workers-preview/workers-mobile-fullscreen-contract.css').text),p057=deadCount(meta.get('assets/css/components/chat-composer.css').text),p056=deadCount(meta.get('assets/css/components/before-after-workers-preview/mobile-comment-sheets.css').text),p055=deadCount(meta.get('assets/css/patterns/settings-shell.css').text),p054=deadCount(meta.get('assets/css/components/before-after-workers-preview/publication-light-modal.css').text);if(files!==15||total!==282||highDead!==0)throw new Error(`residual ${files}/${total}/${highDead}`);if(target.decl!==280||target.dead!==0)throw new Error(`target ${target.decl}/${target.dead}`);if(p058.decl!==216||p058.dead||p057.decl!==125||p057.dead||p056.decl!==302||p056.dead||p055.decl!==104||p055.dead||p054.decl!==75||p054.dead)throw new Error('prior guard drift');console.log('PERMANENT RESIDUAL PASS|active=401|high=37|files=15|dead=282|highDead=0|target=280/0|058=216/0|057=125/0|056=302/0|055=104/0|054=75/0');
          NODE
          echo 'GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0|authorityDocSemanticDelta=0'

      - name: Dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +e; npm audit --json >/tmp/audit.json; code=$?; set -e
          node <<'NODE'
          const a=require('/tmp/audit.json'),v=a.metadata?.vulnerabilities||{};console.log(`DEPENDENCY SNAPSHOT|total=${v.total??0}|critical=${v.critical??0}|high=${v.high??0}|moderate=${v.moderate??0}|low=${v.low??0}`);if(v.total!==13||v.critical!==0||v.high!==10||v.moderate!==1||v.low!==2)process.exit(2);
          NODE
          echo "npmAuditExit=$code"

      - name: Final exact-SHA restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PERMANENT_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$PERMANENT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$PERMANENT_TARGET_BLOB"
          test "$(sha256sum "$TARGET_FILE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$TARGET_FILE" | tr -d ' ')" = "$EXPECTED_BYTES"
          remote_sha="$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$PERMANENT_SHA"
          test -z "$(git status --porcelain)"
          echo "PERMANENT CERTIFICATION PASS|sha=$PERMANENT_SHA|parent=$PARENT_SHA|tree=$TREE_SHA|blob=$PERMANENT_TARGET_BLOB|sha256=$EXPECTED_SHA256|bytes=$EXPECTED_BYTES|files=1|additions=0|deletions=79|browserTransfer=$BROWSER_RUN/$BROWSER_JOB|candidateTransfer=$CANDIDATE_RUN/$CANDIDATE_JOB|branch=$remote_sha"
