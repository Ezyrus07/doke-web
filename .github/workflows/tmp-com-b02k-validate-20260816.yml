name: TEMP COM-B02K Validate and Matrix Materializer

on:
  push:
    branches: [tmp/com-b02k-validate-20260816]

permissions:
  contents: write

env:
  CANDIDATE: edfa9e58f7619941f7e712ed0e7ba7b7a9be2278
  TEMP_WORKFLOW: .github/workflows/tmp-com-b02k-validate-20260816.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/com-b02k-validate-20260816
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze temporary install and candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = "$TEMP_WORKFLOW"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02k-command-runtime-binding-readiness.yml \
            backend/modules/communities/community-command-runtime-binding-readiness.js \
            config/com-b02k-command-runtime-binding-readiness.json \
            scripts/test-com-b02k-command-runtime-binding-readiness.js | sort)"
          actual="$(git diff --name-only fb7f74e6a5e36f795fd9a1471080a452678d0c8e "$CANDIDATE" | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse "$CANDIDATE":config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          test "$(git rev-parse "$CANDIDATE":backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          test "$(git rev-parse "$CANDIDATE":backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Semantic and fail-closed validation
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-command-runtime-binding-readiness.js
          node --check scripts/test-com-b02k-command-runtime-binding-readiness.js
          node scripts/test-com-b02k-command-runtime-binding-readiness.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/modules/communities/community-command-runtime-binding-readiness.js
          grep -F 'COM_B02F_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          node - <<'NODE'
          const handlers=require('./backend/modules/communities/route-handlers');
          const loader=require('./backend/shared/http/module-route-loader');
          for(const name of ['executeMembershipCommand','executeGovernanceCommand','executeContentCommand'])if(loader.getHandler('communities',name)!==handlers[name])throw new Error(`EXECUTE_HANDLER_DRIFT:${name}`);
          for(const name of ['composeMembershipCommandRepositoryOnly','composeGovernanceCommandRepositoryOnly','composeContentCommandRepositoryOnly']){
            if(typeof handlers[name]!=='function')throw new Error(`COMPOSER_MISSING:${name}`);
            if(Object.prototype.hasOwnProperty.call(handlers.handlers,name))throw new Error(`COMPOSER_RUNTIME_BOUND:${name}`);
            if(loader.getHandler('communities',name)!==null)throw new Error(`LOADER_EXPOSES_COMPOSER:${name}`);
          }
          NODE

      - name: Generate exact Matrix derivatives
        run: npm run write:domain-completion-matrix

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Persist only Matrix derivatives and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add -f docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git rm "$TEMP_WORKFLOW"
          git commit -m 'ci(com): materialize B02K Matrix derivatives'
          git push origin HEAD:tmp/com-b02k-validate-20260816
