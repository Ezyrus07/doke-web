name: COM-B04I-R2 Attempt 3 Preinstalled Staging Workflow Readiness

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - 'config/com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.json'
  pull_request:
    branches:
      - rep/rep-001-baseline-audit
    paths:
      - 'backend/runtime/staging/community-moderation-live-route-canary-attempt-3.js'
      - 'scripts/test-com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.js'
      - 'scripts/test-com-b04i-r2-attempt-3-preinstalled-staging-workflow-envelope.js'
      - 'scripts/audit-com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.js'
      - 'config/com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.json'
      - 'docs/COM-B04I-R2-ATTEMPT-3-PREINSTALLED-STAGING-WORKFLOW-READINESS.md'
      - 'docs/validation/COM-B04I-R2-ATTEMPT-3-PREINSTALLED-STAGING-WORKFLOW-READINESS.json'
      - '.github/workflows/com-b04i-r2-attempt-3-readiness.yml'
      - '.github/workflows/com-b04i-r2-attempt-3-staging-live-composition-route-canary.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check backend/runtime/staging/community-moderation-live-route-canary-attempt-3.js
          node --check scripts/test-com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.js
          node --check scripts/test-com-b04i-r2-attempt-3-preinstalled-staging-workflow-envelope.js
          node --check scripts/audit-com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.js
      - name: Attempt-3 runtime local conformance
        run: node scripts/test-com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.js
      - name: Attempt-3 authorization envelope conformance
        run: node scripts/test-com-b04i-r2-attempt-3-preinstalled-staging-workflow-envelope.js
      - name: COM-B04I-R2 readiness audit
        run: node scripts/audit-com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.js
      - name: COM-B04I-R1 continuity
        run: node scripts/audit-com-b04i-r1-remote-node-execution-path-recovery.js
      - name: COM-B04H regression
        run: |
          node scripts/test-com-b04h-live-composition-activation-readiness.js
          node scripts/audit-com-b04h-live-composition-activation-readiness.js
      - name: COM-B04G regression
        run: |
          node scripts/test-com-b04g-route-runtime-wiring-execution.js
          node scripts/audit-com-b04g-route-runtime-wiring-execution.js
      - name: Dormant trigger gate
        shell: bash
        run: |
          test ! -e config/com-b04i-r2-attempt-3-staging-trigger.json
          grep -F "'config/com-b04i-r2-attempt-3-staging-trigger.json'" .github/workflows/com-b04i-r2-attempt-3-staging-live-composition-route-canary.yml
          grep -F '"received": false' config/com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.json
          grep -F '"consumed": false' config/com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.json
          grep -F '"executionAttempted": false' config/com-b04i-r2-attempt-3-preinstalled-staging-workflow-readiness.json
      - name: Core runtime remains fail closed
        shell: bash
        run: |
          grep -F 'COM_B04G_ROUTE_NOT_DEPLOYED_OR_ACTIVATED' backend/modules/communities/route-handlers.js
          grep -F "Object.freeze(['disabled', 'local_test_double'])" backend/modules/communities/community-moderation-runtime-composition.js
          ! grep -F "'staging_authenticated_server_runtime'" backend/modules/communities/community-moderation-runtime-composition.js
      - name: Diff hygiene
        run: git diff --check
