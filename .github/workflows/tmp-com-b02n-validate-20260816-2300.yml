name: TEMP COM-B02N Validate and Matrix Materializer

on:
  push:
    branches:
      - tmp/com-b02n-validate-20260816-2300

permissions:
  contents: write

auto_cancel_in_progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/com-b02n-validate-20260816-2300
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze candidate lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=ee81ce055b96b5c492203a25bc41824184a885f3
          CANDIDATE=5730ed2ed388901b7a87314ff66b26fa3300be4b
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02n-runtime-binding-integration-readiness.yml \
            backend/modules/communities/community-command-runtime-binding-integration-readiness.js \
            config/com-b02n-runtime-binding-integration-readiness.json \
            scripts/test-com-b02n-runtime-binding-integration-readiness.js | sort)"
          actual_candidate="$(git diff --name-only "$BASE" "$CANDIDATE" | sort)"
          test "$actual_candidate" = "$expected_candidate"
          expected_temp=".github/workflows/tmp-com-b02n-validate-20260816-2300.yml"
          actual_temp="$(git diff --name-only "$CANDIDATE" HEAD | sort)"
          test "$actual_temp" = "$expected_temp"
          test "$(git rev-parse "$CANDIDATE":backend/modules/communities/community-command-runtime-binding-integration-readiness.js)" = "6b424886266249eff93c47d814d3c2abc5564537"
          test "$(git rev-parse "$CANDIDATE":config/com-b02n-runtime-binding-integration-readiness.json)" = "ae417df251707a34d368cf772b9503d13ebc963c"
          test "$(git rev-parse "$CANDIDATE":scripts/test-com-b02n-runtime-binding-integration-readiness.js)" = "01ba77dd1ba1f8d2f50cac082c9ed47d33fba956"
          test "$(git rev-parse "$CANDIDATE":.github/workflows/com-b02n-runtime-binding-integration-readiness.yml)" = "ca5d54abdb0a9ca1f1d1c45a1065c22143ac5e9a"
          test "$(git rev-parse "$CANDIDATE":config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Semantic and fail-closed validation
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-command-runtime-binding-integration-readiness.js
          node --check scripts/test-com-b02n-runtime-binding-integration-readiness.js
          node scripts/test-com-b02n-runtime-binding-integration-readiness.js
          TARGET=backend/modules/communities/community-command-runtime-binding-integration-readiness.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'createCommandSourceRepository\(|beginRuntimeBindingAdapter\(|resumeWithCanonicalState\(|resumeWithIdempotencyClaim\(|resumeWithRepositoryWrite\(' "$TARGET"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "990ee5c8895446f44cdcd5819101f0b3d5370e63"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-source-repository-contract.js)" = "38cd77fd6d3cf0c9f13d4c35ed000b9831481840"
          test "$(git rev-parse HEAD:backend/modules/communities/sql/com-b02i-command-sources.sql)" = "1ff7621973be5ef38aa5e033b91f5b75216b9ec1"
          ! git diff --name-only ee81ce055b96b5c492203a25bc41824184a885f3 HEAD | grep '^supabase/migrations/'

      - name: Generate exact Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          npm run write:domain-completion-matrix
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"

      - name: Persist only Matrix derivatives and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name doke
          git config user.email bielantoniomma@gmail.com
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m "ci(com): materialize B02N Matrix derivatives"
          git rm .github/workflows/tmp-com-b02n-validate-20260816-2300.yml
          git commit -m "ci(com): remove temporary B02N materializer"
          git push origin HEAD:tmp/com-b02n-validate-20260816-2300
