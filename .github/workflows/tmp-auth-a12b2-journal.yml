name: TEMP AUTH-A12B.2 Encoded Journal Append

on:
  pull_request:
    branches: [MAIN, main, master]

permissions:
  contents: write

concurrency:
  group: tmp-auth-a12b2-encoded-journal-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  append:
    if: github.event.pull_request.head.ref == 'auth/auth-001-baseline-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENTRY_B64: 

    steps:
      - name: Checkout AUTH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Append journal entry when absent
        shell: bash
        run: |
          set -euo pipefail
          marker='AUTH-A12B.2 generic local profile mutation authority retired'
          if grep -Fq "$marker" docs/DOKE-ENGINEERING-JOURNAL.md; then
            echo 'Journal entry already present.'
            exit 0
          fi
          printf '%s' "$ENTRY_B64" | base64 --decode >> docs/DOKE-ENGINEERING-JOURNAL.md

      - name: Publish journal entry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/DOKE-ENGINEERING-JOURNAL.md; then
            echo 'No journal change to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOKE-ENGINEERING-JOURNAL.md
          git commit -m 'Record AUTH-A12B.2 engineering journal closure'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
