name: Doke SCHED-C01D Secret Capacity Preflight

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-c01d-secret-capacity-preflight.yml'

permissions:
  contents: read

jobs:
  secret-capacity:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLIENT_EMAIL: ${{ secrets.DOKE_STAGING_CLIENT_EMAIL }}
      CLIENT_PASSWORD: ${{ secrets.DOKE_STAGING_CLIENT_PASSWORD }}
      PROFESSIONAL_EMAIL: ${{ secrets.DOKE_STAGING_PROFESSIONAL_EMAIL }}
      PROFESSIONAL_PASSWORD: ${{ secrets.DOKE_STAGING_PROFESSIONAL_PASSWORD }}
    steps:
      - name: Verify authorized staging credential capacity
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLIENT_EMAIL CLIENT_PASSWORD PROFESSIONAL_EMAIL PROFESSIONAL_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "missing:${name}"
              missing=1
            else
              echo "present:${name}"
            fi
          done
          test "$missing" = "0"
          test "$CLIENT_EMAIL" != "$PROFESSIONAL_EMAIL"
          echo "C01D credential capacity is available; no value was printed."
