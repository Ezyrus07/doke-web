name: Doke UX CSS Important 005 Promote Permanent
on:
  push:
    branches: [diag/ux-css-important-005-promote-permanent]
    paths: [.github/workflows/diag-ux-css-important-005-promote-permanent.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PARENT_SHA: 1c1f6c97a851fc73b7f81c07fe646d7d60e03843
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      TARGET_BLOB: 1e24479b2b9065659a5a11a18854131e4ef90187
      EXPECTED_SHA256: 4bd9c3664ad99a35b3dbca9237f16a0c858125e74c5371d751322ae5f6e7d0df
      EXPECTED_BYTES: '9323'
      PERMANENT_BRANCH: ux/ux-css-important-005-home-mobile-composition-dormant-priority
      DIAG_BRANCH: diag/ux-css-important-005-promote-permanent
      RESULT_FILE: .diagnostics/ux-css-important-005-promotion.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.PARENT_SHA }}', fetch-depth: 0}
      - id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/promote.log) 2>&1
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          remote_before=$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}'); test "$remote_before" = "$PARENT_SHA"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8');if((s.match(/!important\b/g)||[]).length!==36)throw Error('parent drift');function strip(selector,props){const key=selector+' {';const hits=[];let at=0;while((at=s.indexOf(key,at))>=0){const b=s.indexOf('{',at),e=s.indexOf('}',b),block=s.slice(b+1,e);const ok=props.every(prop=>new RegExp(`(^|\\n)\\s*${prop.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')}\\s*:[^;]+?\\s*!important;`,'m').test(block));if(ok)hits.push({b,e,block});at=e+1;}if(hits.length!==1)throw Error(`selector ${selector} matchingBlocks=${hits.length}`);let out=hits[0].block;for(const prop of props){const re=new RegExp(`(^|\\n)(\\s*${prop.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')}\\s*:[^;]+?)\\s*!important;`,'m');out=out.replace(re,'$1$2;')}s=s.slice(0,hits[0].b+1)+out+s.slice(hits[0].e)}strip('body.home-index-shell #before-after-track > .comparison-card',['flex','width','min-width','max-width']);strip('body.home-index-shell #before-after-track > .comparison-card .comparison-card__visual',['aspect-ratio','min-height','max-height']);strip('body.home-index-shell .content-rail__arrow',['display']);strip('body.home-index-shell .home-mobile-hero__top',['grid-template-columns']);strip('body.home-index-shell .home-mobile-hero__quick-actions',['display','grid-template-columns']);strip('body.home-index-shell .home-mobile-hero__location-label',['display','overflow']);fs.writeFileSync(f,s);const z=fs.readFileSync(f),h=crypto.createHash('sha256').update(z).digest('hex');if(h!==process.env.EXPECTED_SHA256||z.length!==+process.env.EXPECTED_BYTES||(s.match(/!important\b/g)||[]).length!==23)throw Error(`candidate ${h}/${z.length}`);console.log(`CANDIDATE PASS|sha256=${h}|bytes=${z.length}|important=36->23`);
          NODE
          test "$(git diff --name-only)" = "$TARGET_FILE"; test "$(git diff --numstat -- "$TARGET_FILE")" = $'13\t13\t'"$TARGET_FILE"; git diff --check
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_FILE"; git commit -m 'UX-CSS-IMPORTANT-005: remove dormant Home mobile composition priorities' >/dev/null
          NEW_SHA=$(git rev-parse HEAD); NEW_TREE=$(git rev-parse HEAD^{tree}); NEW_BLOB=$(git hash-object "$TARGET_FILE"); test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git push --force-with-lease="refs/heads/$PERMANENT_BRANCH:$PARENT_SHA" origin "HEAD:refs/heads/$PERMANENT_BRANCH" >/dev/null
          test "$(git ls-remote origin "refs/heads/$PERMANENT_BRANCH" | awk '{print $1}')" = "$NEW_SHA"
          echo "NEW_SHA=$NEW_SHA"; echo "NEW_TREE=$NEW_TREE"; echo "NEW_BLOB=$NEW_BLOB"; echo "PARENT_BLOB=$TARGET_BLOB"; echo "SHA256=$EXPECTED_SHA256"; echo "BYTES=$EXPECTED_BYTES"; echo 'DIFF=1 file +13/-13'; echo 'RANKING_RUN=32143884413'; echo 'SOURCE_RUN=32144434761'; echo 'VISUAL_RUN=32144795646'; echo 'GOVERNANCE_RUN=32144845518'
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$PARENT_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$PARENT_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.promote.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "PROMOTE=${{ steps.promote.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE PASS|NEW_SHA=|NEW_TREE=|NEW_BLOB=|PARENT_BLOB=|SHA256=|BYTES=|DIFF=|RANKING_RUN=|SOURCE_RUN=|VISUAL_RUN=|GOVERNANCE_RUN=)' /tmp/promote.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 180 /tmp/promote.log || true; fi; } >/tmp/evidence.txt; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 005 promotion [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
