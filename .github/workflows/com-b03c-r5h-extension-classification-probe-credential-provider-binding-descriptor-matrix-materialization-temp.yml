name: COM-B03C R5H Credential Provider Binding Descriptor Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "1849e9def78e57834bb213c8c235b1d098f648e2"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json)" = "00de308adfa27fc46110100f15bc4942911afd2e"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.yml)" = "3363a344a9a3d03c004ab79cce6971cbfe749289"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed credential provider descriptor assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json)" = "00de308adfa27fc46110100f15bc4942911afd2e"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.yml)" = "3363a344a9a3d03c004ab79cce6971cbfe749289"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json)" = "0f711628b6755fe7025687042c0bbde7824dd1cb"
          node - <<'NODE'
          const d = require('./config/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary.json');
          const p = require('./config/com-b03c-r5h-extension-classification-probe-target-resource-binding-boundary.json');
          const expectedFields = ['providerContractId','providerModulePath','providerModuleBlob','bindingBoundaryHead'];
          const expectedResource = 'doke-web-staging-realtime-messages-extension-classification-probe';
          const expectedEnvironment = 'doke-web-staging';
          const expectedFingerprint = 'sha256:2ab84b52b269ef4c9556c9818f4355d466bce9f735878213b49d9840cdd00fbf';
          if (d.contractId !== 'com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-boundary-v1') throw new Error('CONTRACT_DRIFT');
          if (d.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || d.functionalCheckpoint.r5iCreated !== false || d.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          const b = d.credentialProviderBindingDescriptor;
          if (b.credentialProviderBindingDescriptorDefined !== true || b.credentialProviderBindingDefined !== false || b.credentialProviderBound !== false || b.schemaOnly !== true || b.transportBound !== false) throw new Error('CREDENTIAL_PROVIDER_DESCRIPTOR_STATE_DRIFT');
          if (b.requiredFields.join('|') !== expectedFields.join('|')) throw new Error('CREDENTIAL_PROVIDER_SCHEMA_DRIFT');
          for (const key of ['providerContractId','providerModulePath','providerModuleBlob','bindingBoundaryHead','credentialSecretName','credentialReference','credentialMaterial']) if (b[key] !== null) throw new Error(`CONCRETE_CREDENTIAL_VALUE_FORBIDDEN:${key}`);
          const pb = p.targetResourceBinding;
          if (pb.targetResourceBound !== true || pb.stableResourceIdentifier !== expectedResource || pb.targetEnvironmentStableIdentifier !== expectedEnvironment || pb.resourceScopeFingerprint !== expectedFingerprint) throw new Error('PARENT_TARGET_RESOURCE_DRIFT');
          if (pb.transportBound !== false || pb.credentialProviderBound !== false || pb.stagingReadAuthority !== false || pb.stagingMutationAuthority !== false || pb.networkAuthority !== false || pb.remoteExecutionAuthority !== false) throw new Error('PARENT_REMOTE_AUTHORITY_DRIFT');
          for (const slot of d.dependentPortState) if (slot.bound !== false || slot.concreteValuePresent !== false) throw new Error(`DEPENDENT_PORT_BOUND:${slot.slotId}`);
          const c = d.concreteBindingState;
          for (const key of ['credentialProvider','credentialSecretName','credentialReference','credentialMaterial','syntheticIdentity','realtimeClientFactory','sanitizedEvidenceRecorder','cleanupVerifier','networkEndpoint','executionCommand','executionWorkflow','executionEntrypoint']) if (c[key] !== null) throw new Error(`FORBIDDEN_CONCRETE_BINDING:${key}`);
          const g = d.governance;
          if (g.credentialProviderBindingDescriptorDefined !== true || g.credentialProviderBindingDefined !== false || g.credentialProviderBound !== false) throw new Error('CREDENTIAL_PROVIDER_GOVERNANCE_DRIFT');
          for (const key of ['transportBound','identityLifecycleBound','realtimeClientFactoryBound','sanitizedEvidenceRecorderBound','cleanupVerifierBound','executionEntryPointExported','executionWorkflowDefined','triggerCreated','receiptCreated','explicitExecutionAuthorizationReceived','executionAttempted','remoteExecutionAuthority','remoteCredentialReadAuthority','remoteDependencyLoadAuthority','networkAuthority','stagingReadAuthority','stagingMutationAuthority','realtimeSubscriptionAuthority','authIdentityLifecycleAuthority','runtimeChangeAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority']) if (g[key] !== false) throw new Error(`AUTHORITY_MUST_REMAIN_FALSE:${key}`);
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-credential-provider-binding-descriptor-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for credential provider binding descriptor" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
