name: COM-B03C-R5D Repository Execution Envelope Recovery Writer

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/com-b03c-r5d-boundary-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r5d-boundary-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 3f898ee30404c873a3ca5ba8b5228a7854e84872
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r5d-boundary-writer-temp.yml
  FUTURE_TRIGGER_PATH: config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
  RECEIPT_PATH: config/com-b03c-r5b-r5a-fresh-authorization-consumption.json
  RECEIPT_BLOB: a2ed29dc6a44f9d62f5159dfeabd2c769f677b50
  BRIDGE_PATH: scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js
  BRIDGE_BLOB: ff083f29e43b2f85045b23bf8f12a4b354fb0005

jobs:
  validate-reconcile-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fail-closed recovery lineage and exact R5D payload
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "${WRITER_PATH}"
          test "$(git hash-object backend/modules/communities/community-realtime-private-auth-r5d.js)" = "7cde416f2922230bae6b1e4b1e48fdfaf411da99"
          test "$(git hash-object config/com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.json)" = "372dc22b8d3a808799b4b753fb293db430706197"
          test "$(git hash-object scripts/test-com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.js)" = "a01d84f3312b41f08c1186238fab48599f5bfda0"
          test "$(git hash-object scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js)" = "7fa0ee82bbf627f8d1d3bf8c0323e79630841d05"
          test "$(git hash-object .github/workflows/com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.yml)" = "35851a8ed3fcc175617a7e89e9ff87329208f538"
          test "$(git hash-object docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-EXECUTION-ENVELOPE-READINESS.json)" = "6f9beace8205d4f44861355f54c8f1346ecf5c7e"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Preserve R5C receipt bridge and absent trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:${RECEIPT_PATH})" = "${RECEIPT_BLOB}"
          test "$(git rev-parse HEAD:${BRIDGE_PATH})" = "${BRIDGE_BLOB}"
          test ! -e "${FUTURE_TRIGGER_PATH}"
          node scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
      - name: Reconcile COM-001 machine-readable source through R5D
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(path, 'utf8'));
          const matches = matrix.domains.filter((domain) => domain.id === 'COM-001');
          if (matches.length !== 1) throw new Error(`COM-001 uniqueness violated: ${matches.length}`);
          const domain = matches[0];
          const expectedState = {maturity:3,userFacingAuthority:'hybrid',serverAuthority:'partial',stagingEvidence:'staging_canary',securityGate:'partial',productionGate:'blocked'};
          for (const [key,value] of Object.entries(expectedState)) if (domain[key] !== value) throw new Error(`COM-001 ${key} drift`);
          const blocker = domain.blockers.find((item) => item.id === 'COM-B03');
          const oldBlocker = 'Authenticated community_posts Postgres Changes is proven in staging. R3L narrowed the private Presence authorization failure to evaluation involving realtime.messages.extension without proving the exact root cause. R5B consumed the fresh R5A-bound authorization without execution, and R5C certified only repository readiness for a future single-use corrected terminal observation trigger: no trigger exists and no staging, network, credential or Realtime authority is active. Private Typing/Broadcast remains unproven and channel_messages still lacks canonical remote authority.';
          if (!blocker || blocker.description !== oldBlocker) throw new Error('COM-B03 blocker drift before R5D');
          blocker.description = 'Authenticated community_posts Postgres Changes is proven in staging. R3L narrowed the private Presence authorization failure to evaluation involving realtime.messages.extension without proving the exact root cause. R5B consumed the fresh R5A-bound authorization without execution; R5C certified trigger readiness; R5D now repository-certifies a corrected-terminal-observation execution envelope bound to the R5C head, frozen receipt and corrected R4Z bridge. The trigger remains absent and no staging, network, credential or Realtime authority is active. Private Typing/Broadcast remains unproven and channel_messages still lacks canonical remote authority.';
          const oldAction = 'Preserve the certified R5C repository-only boundary and continue root-cause narrowing without promoting Presence, Typing/Broadcast or channel_messages. Any future trigger must be a separate single-file boundary bound to the certified R5C head, frozen receipt and corrected bridge; staging execution remains separately gated by a new exact single-use authorization.';
          const actionIndex = domain.nextActions.indexOf(oldAction);
          if (actionIndex === -1) throw new Error('Expected R5C next action missing');
          domain.nextActions[actionIndex] = 'Preserve the R5D repository-only corrected terminal observation execution envelope without promoting Presence, Typing/Broadcast or channel_messages. After exact R5D head certification, any future trigger must be a separate single-file boundary bound to that R5D head, the certified R5C head, frozen R5B receipt and corrected R4Z bridge; staging execution remains separately gated by a new exact single-use authorization.';
          const requiredPaths = ['backend/modules/communities/community-realtime-private-auth-r5d.js','config/com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.json','scripts/test-com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.js','scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js','.github/workflows/com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.yml','docs/validation/COM-B03C-R5D-CORRECTED-TERMINAL-OBSERVATION-EXECUTION-ENVELOPE-READINESS.json'];
          for (const item of requiredPaths) if (!domain.requiredPaths.includes(item)) domain.requiredPaths.push(item);
          const evidence = 'COM-B03C-R5D repository-certifies a corrected terminal observation execution envelope bound to R5C head 65554baca33933cdbf6c660ba87658ab3ab4c5db, the frozen R5B receipt 7f83ad580442b634912f776745f25ec2de7d935ed93a6c3f5c0b622e561f3551 and R4Z corrected bridge blob ff083f29e43b2f85045b23bf8f12a4b354fb0005; the future trigger remains absent, all remote/staging/network/credential authority remains false, exactRootCauseProven remains false and causal promotion remains blocked.';
          if (!domain.evidence.includes(evidence)) domain.evidence.push(evidence);
          if (domain.evidence.filter((item) => item === evidence).length !== 1) throw new Error('R5D evidence duplication');
          for (const item of requiredPaths) if (domain.requiredPaths.filter((value) => value === item).length !== 1) throw new Error(`R5D requiredPath duplication: ${item}`);
          fs.writeFileSync(path, `${JSON.stringify(matrix,null,2)}\n`);
          NODE
      - name: Remove recovery writer and generate canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          rm "${WRITER_PATH}"
          npm run write:domain-completion-matrix
      - name: R5D repository-only validation
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-realtime-private-auth-r5d.js
          node --check scripts/test-com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.js
          node --check scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js
          node scripts/test-com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.js
          node scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js --repository-self-test
          workflow=.github/workflows/com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.yml
          test ! -e "${FUTURE_TRIGGER_PATH}"
          ! grep -Eq '^[[:space:]]*push:' "$workflow"
          ! grep -Eq '^[[:space:]]*environment:' "$workflow"
          ! grep -Eq 'secrets\.' "$workflow"
          set +e
          output="$(node scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R5D_REMOTE_EXECUTION_NOT_AUTHORIZED'
      - name: Domain Completion Matrix and Agent Governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check
      - name: Stage exact reconciliation delta
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only | sort > /tmp/actual
          printf '%s' 'LmdpdGh1Yi93b3JrZmxvd3MvY29tLWIwM2MtcjVkLWJvdW5kYXJ5LXdyaXRlci10ZW1wLnltbApjb25maWcvZG9tYWluLWNvbXBsZXRpb24tbWF0cml4Lmpzb24KZG9jcy9ET01BSU4tQ09NUExFVElPTi1NQVRSSVgubWQKcmVwb3J0cy9nZW5lcmF0ZWQvZG9tYWluLWNvbXBsZXRpb24tbWF0cml4LXJlcG9ydC5qc29uCg==' | base64 -d > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Commit reconciled R5D tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${GITHUB_SHA}"
          git commit -m "docs(com): reconcile matrix for R5D and remove writer"
          git push origin "HEAD:${TARGET_BRANCH}"
