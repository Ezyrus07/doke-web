name: COM-B03C-R5D Repository Execution Envelope Writer

on:
  push:
    branches:
      - com/com-001-baseline-audit
    paths:
      - '.github/workflows/com-b03c-r5d-boundary-writer-temp.yml'

permissions:
  contents: write

concurrency:
  group: com-b03c-r5d-boundary-writer-temp
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 3d720bde896ad870a9bf43ae61ddfa58f18d17e3
  TARGET_BRANCH: com/com-001-baseline-audit
  WRITER_PATH: .github/workflows/com-b03c-r5d-boundary-writer-temp.yml
  FUTURE_TRIGGER_PATH: config/com-b03c-r5c-single-use-corrected-terminal-observation-trigger.json
  R5C_HEAD: 65554baca33933cdbf6c660ba87658ab3ab4c5db
  RECEIPT_PATH: config/com-b03c-r5b-r5a-fresh-authorization-consumption.json
  RECEIPT_BLOB: a2ed29dc6a44f9d62f5159dfeabd2c769f677b50
  BRIDGE_PATH: scripts/build-com-b03c-r4z-corrected-terminal-realtime-bridge.js
  BRIDGE_BLOB: ff083f29e43b2f85045b23bf8f12a4b354fb0005

jobs:
  materialize-test-reconcile-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fail-closed writer installation lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "${WRITER_PATH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Preserve certified R5C, frozen receipt and corrected bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:${RECEIPT_PATH})" = "${RECEIPT_BLOB}"
          test "$(git rev-parse HEAD:${BRIDGE_PATH})" = "${BRIDGE_BLOB}"
          test ! -e "${FUTURE_TRIGGER_PATH}"
          node --check backend/modules/communities/community-realtime-private-auth-r5c.js
          node scripts/test-com-b03c-r5c-single-use-corrected-terminal-observation-trigger-readiness.js
          node - <<'NODE'
          const r5c = require('./backend/modules/communities/community-realtime-private-auth-r5c');
          try {
            r5c.assertRemoteExecutionBoundaryAbsent();
            process.exit(1);
          } catch (error) {
            if (error?.code !== r5c.REMOTE_EXECUTION_BLOCK_CODE) throw error;
          }
          NODE

      - name: Materialize R5D repository-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          bundle = json.loads(base64.b64decode('...TRUNCATED_FOR_SUMMARY...').decode())
          for path, encoded in bundle.items():
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))
          PY

      - name: Reconcile COM-001 machine-readable source through R5D
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' ' | base64 -d | node

      - name: Remove temporary writer before canonical generation
        shell: bash
        run: |
          set -euo pipefail
          rm "${WRITER_PATH}"

      - name: Generate canonical Domain Completion Matrix outputs
        run: npm run write:domain-completion-matrix

      - name: R5D syntax and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/modules/communities/community-realtime-private-auth-r5d.js
          node --check scripts/test-com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.js
          node --check scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js
          node scripts/test-com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.js
          node scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js --repository-self-test

      - name: No trigger or remote authority surface
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/com-b03c-r5d-corrected-terminal-observation-execution-envelope-readiness.yml
          test ! -e "${FUTURE_TRIGGER_PATH}"
          ! grep -Eq '^[[:space:]]*push:' "$workflow"
          ! grep -Eq '^[[:space:]]*environment:' "$workflow"
          ! grep -Eq 'secrets\.' "$workflow"
          set +e
          output="$(node scripts/execute-com-b03c-r5d-corrected-terminal-observation-envelope.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R5D_REMOTE_EXECUTION_NOT_AUTHORIZED'
          test "$(git hash-object "${RECEIPT_PATH}")" = "${RECEIPT_BLOB}"
          test "$(git hash-object "${BRIDGE_PATH}")" = "${BRIDGE_BLOB}"

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check

      - name: Stage and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only | sort > /tmp/actual-paths
          printf '%s' '' | base64 -d > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit clean R5D repository-only tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${GITHUB_SHA}"
          git commit -m "feat(com): add R5D corrected terminal observation execution envelope"
          git push origin "HEAD:${TARGET_BRANCH}"
