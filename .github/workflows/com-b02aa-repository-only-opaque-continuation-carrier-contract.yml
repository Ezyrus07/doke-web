name: COM-B02AA Repository-Only Opaque Continuation Carrier Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-carrier-contract.js'
      - 'config/com-b02aa-repository-only-opaque-continuation-carrier-contract.json'
      - 'scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js'
      - '.github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: com-b02aa-repository-only-opaque-continuation-carrier-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frozen B02Z predecessor and exact repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=3d3d9103029954e5ab03c6c48abc2382a7ccfb69
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-resume-dispatch-readiness.js)" = "b192f58e0ec5639cb1c5d524e5d015dc2699b1ef"
          test "$(git rev-parse HEAD:config/com-b02z-repository-only-route-resume-dispatch-readiness.json)" = "c852c28eb1a3d2f401a8db08518784f84bee5576"
          test "$(git rev-parse HEAD:scripts/test-com-b02z-repository-only-route-resume-dispatch-readiness.js)" = "76efb305135d72ca911d73d8f344ce022f47faf9"
          test "$(git rev-parse HEAD:.github/workflows/com-b02z-repository-only-route-resume-dispatch-readiness.yml)" = "659fcde2364cccbe22710edec7152c71879a8aab"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-begin-dispatcher.js)" = "00d8d8e62dfb7c30b70753f83fa172f3953aad83"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-surface-descriptor.js)" = "c899df5404d9d7f90795f8933dfc44bdd57a1971"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-orchestration.js)" = "f094ddc01a3f05975794bafb925d64f146a51ea2"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-handler-repository-binding-surface.js)" = "0778690aaaf428247159a08eac83a38796888f41"
          test "$(git rev-parse HEAD:backend/modules/communities/community-command-repository-executor-service-role-provider-binding.js)" = "384c3a452b7e0e66d1bf2ddfeebb341c8b36f3c9"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "85e061fe36339596ba9558a503b2fa7ce02574ae"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "04a039c1967ffb59502e05584d05831f7c9a1a41"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "b7f9f330f6d92c676eb76456b669bdf8dc749c20"
          test "$(git rev-parse HEAD:backend/runtime/staging/staging-api-runtime.js)" = "69de100fe3a269507a0da7847ae8e9887f831ceb"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"
          expected="$(printf '%s\n'             .github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml             backend/shared/http/repository-only-route-continuation-carrier-contract.js             config/com-b02aa-repository-only-opaque-continuation-carrier-contract.json             scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js | sort)"
          expected_reconciled="$(printf '%s\n'             .github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml             backend/shared/http/repository-only-route-continuation-carrier-contract.js             config/com-b02aa-repository-only-opaque-continuation-carrier-contract.json             docs/DOMAIN-COMPLETION-MATRIX.md             reports/generated/domain-completion-matrix-report.json             scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js | sort)"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          test "$actual" = "$expected" || test "$actual" = "$expected_reconciled"

      - name: Syntax and semantic continuation-carrier contract conformance
        run: |
          node --check backend/shared/http/repository-only-route-continuation-carrier-contract.js
          node --check scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js
          node scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js

      - name: Carrier remains contract-only and remote effects remain blocked
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'new (Map|WeakMap)\(|randomUUID\(|randomBytes\(|crypto\.' backend/shared/http/repository-only-route-continuation-carrier-contract.js
          ! grep -E 'resumeRepositoryOnlyCommandHandlerOrchestration\(|\.resumeSurface\(|resolution\.resumeSurface\(' backend/shared/http/repository-only-route-continuation-carrier-contract.js
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' backend/shared/http/repository-only-route-continuation-carrier-contract.js
          ! grep -F 'repository-only-route-continuation-carrier-contract' backend/runtime/staging/staging-api-runtime.js
          grep -F "const { getHandler } = require('../../shared/http/module-route-loader');" backend/runtime/staging/staging-api-runtime.js

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=3d3d9103029954e5ab03c6c48abc2382a7ccfb69
          git diff --check "$BASE" HEAD
