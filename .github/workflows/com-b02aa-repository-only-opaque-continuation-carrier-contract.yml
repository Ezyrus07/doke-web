name: COM-B02AA Repository-Only Opaque Continuation Carrier Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: com-b02aa-domain-completion-matrix-finalization-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT_HEAD: a83bf0b9aede838e4104a9b241e5d394757ea22b
  CANONICAL_B02AA_HEAD: a406d618749aca3c7281e032962e8c7abc8a7710
  EXPECTED_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
  EXPECTED_B02AA_CONTRACT_BLOB: fb7448f83fe385e94a2be61685f612d9e27d949f
  EXPECTED_B02AA_CONFIG_BLOB: cd0bb4a13f44a4465d3163fb63692732ac10bd3a
  EXPECTED_B02AA_TEST_BLOB: 57fe6c92012ad5fcbe98713a000ba33b4fd17731
  CANONICAL_CERTIFIER_BLOB: 7f9a67841ffe5f7cd1bade37d13f281c7a4c585a

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate exact B02AA derivatives and fast-forward final snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='com/com-001-baseline-audit'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'
          CERT='.github/workflows/com-b02aa-repository-only-opaque-continuation-carrier-contract.yml'
          OLD_TEMP='.github/workflows/com-b02aa-domain-completion-matrix-materialization-temp.yml'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test ! -e "$OLD_TEMP"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-carrier-contract.js)" = "$EXPECTED_B02AA_CONTRACT_BLOB"
          test "$(git rev-parse HEAD:config/com-b02aa-repository-only-opaque-continuation-carrier-contract.json)" = "$EXPECTED_B02AA_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js)" = "$EXPECTED_B02AA_TEST_BLOB"

          git show "$CANONICAL_B02AA_HEAD:$CERT" > "$CERT"
          test "$(git hash-object "$CERT")" = "$CANONICAL_CERTIFIER_BLOB"

          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json
          node scripts/test-com-b02aa-repository-only-opaque-continuation-carrier-contract.js
          npm ci --ignore-scripts
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            "$CERT" \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"

          test "$(git hash-object "$CERT")" = "$CANONICAL_CERTIFIER_BLOB"
          echo "MARKDOWN_BLOB=$(git hash-object docs/DOMAIN-COMPLETION-MATRIX.md)"
          echo "REPORT_BLOB=$(git hash-object reports/generated/domain-completion-matrix-report.json)"

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add "$CERT" docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'docs(com): reconcile B02AA Domain Completion Matrix derivatives'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"refs/heads/$BRANCH"
