name: COM-B02E Server Authority Main Runtime Integration Readiness Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02e-server-authority-main-runtime-integration-readiness-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          candidate=52c9704081868c89978a0a2f9bd84fb1d3861c51
          temp=.github/workflows/com-b02e-server-authority-main-runtime-integration-readiness-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"
          test "$(git rev-parse HEAD:backend/modules/communities/community-server-authority-runtime-integration-readiness.js)" = "e1e512dd9e92fcf66316cf2e45379978d114ad4a"
          test "$(git rev-parse HEAD:config/com-b02e-server-authority-main-runtime-integration-readiness.json)" = "468aa1d27ab88ed002f3bbf4b6c79bb829808144"
          test "$(git rev-parse HEAD:scripts/test-com-b02e-server-authority-main-runtime-integration-readiness.js)" = "790ee914b617501ba25ef501d6a075d4f09af8fa"
          test "$(git rev-parse HEAD:.github/workflows/com-b02e-server-authority-main-runtime-integration-readiness.yml)" = "0592f55fb98e9132a1cf8994d08db1296b7ba2ae"
          test "$(git rev-parse HEAD:config/com-b02d-community-composition-root-canary-readiness.json)" = "86bc40fc8d5700996e1c47e025a8af23aef75143"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "cda8292ce3669a2b76b70ed2d2aae9a017973254"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "7b3c897c0bf20069b733632c0b424b8664eb8cf5"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "e2eec65d156f023ef745eb96849277ec914a07f6"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "b9b2abbee1aed1033c122bf7f2802c7e80844623"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02e-server-authority-main-runtime-integration-readiness-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed B02E readiness assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-server-authority-runtime-integration-readiness.js)" = "e1e512dd9e92fcf66316cf2e45379978d114ad4a"
          test "$(git rev-parse HEAD:config/com-b02e-server-authority-main-runtime-integration-readiness.json)" = "468aa1d27ab88ed002f3bbf4b6c79bb829808144"
          test "$(git rev-parse HEAD:scripts/test-com-b02e-server-authority-main-runtime-integration-readiness.js)" = "790ee914b617501ba25ef501d6a075d4f09af8fa"
          test "$(git rev-parse HEAD:.github/workflows/com-b02e-server-authority-main-runtime-integration-readiness.yml)" = "0592f55fb98e9132a1cf8994d08db1296b7ba2ae"
          node scripts/test-com-b02e-server-authority-main-runtime-integration-readiness.js
          ! grep -F "communities.membership.command" backend/shared/http/route-registry.js
          ! grep -F "communities.governance.command" backend/shared/http/route-registry.js
          ! grep -F "communities.content.command" backend/shared/http/route-registry.js
          ! grep -F "executeMembershipCommand" backend/modules/communities/route-handlers.js
          ! grep -F "executeGovernanceCommand" backend/modules/communities/route-handlers.js
          ! grep -F "executeContentCommand" backend/modules/communities/route-handlers.js
          grep -F "communities.moderation.command" backend/shared/http/route-registry.js
          grep -F "COM_B04G_ROUTE_NOT_DEPLOYED_OR_ACTIVATED" backend/modules/communities/route-handlers.js
          node - <<'NODE'
          const b=require('./config/com-b02e-server-authority-main-runtime-integration-readiness.json');
          if(b.contractId!=='com-b02e-server-authority-main-runtime-integration-readiness-v1')throw new Error('B02E_CONTRACT_DRIFT');
          if(b.repositoryContext.parentCertifiedHead!=='5e3fbf6d0bfd8a6f254ef1d0f2fb0879be7ae894')throw new Error('B02E_PARENT_DRIFT');
          if(b.predecessor.contractId!=='com-b02d-community-composition-root-canary-readiness-v1'||b.predecessor.connectedToMainRuntime!==false||b.predecessor.routeRegistered!==false)throw new Error('B02D_PREDECESSOR_DRIFT');
          if(b.frozenCurrentRuntime.candidateRoutesRegistered!==false||b.frozenCurrentRuntime.candidateHandlersExported!==false)throw new Error('RUNTIME_ALREADY_WIRED');
          for(const k of ['routeRegistryMutationAuthority','routeHandlerMutationAuthority','runtimeWiringAuthority','stagingDeploymentAuthority','stagingTrafficAuthority','realCommunityMutationAuthority','realtimeActivationAuthority','remoteExecutionAuthority','networkAuthority','productionAuthority','pullRequestMergeAuthority','readyForReviewAuthority','r5iCreationAuthority'])if(b.authority[k]!==false)throw new Error(`AUTHORITY_DRIFT:${k}`);
          for(const k of ['routeRegistryChanged','moduleRouteLoaderChanged','communityRouteHandlersChanged','routeRegistered','candidateHandlerExported','runtimeActivated','networkRequestExecuted','stagingReadExecuted','stagingMutationExecuted','realtimeSubscriptionExecuted','credentialReadExecuted','identityMutationExecuted','triggerCreated','receiptCreated','productionChanged','pullRequestMerged'])if(b.effects[k]!==false)throw new Error(`EFFECT_DRIFT:${k}`);
          if(b.functionalCheckpoint.lastFunctionalCheckpoint!=='COM-B03C-R5H'||b.functionalCheckpoint.exactRootCauseProven!==false||b.functionalCheckpoint.causalPromotionAllowed!==false||b.functionalCheckpoint.privatePresencePromotionAllowed!==false||b.functionalCheckpoint.r5iCreated!==false||b.functionalCheckpoint.r5iInferred!==false)throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if(b.nextSublotAfterCertification!=='COM-B02F'||b.nextActionAfterCertification!=='request_separate_explicit_authority_for_repository_only_route_registry_and_blocked_handler_wiring')throw new Error('NEXT_ACTION_DRIFT');
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b02e-server-authority-main-runtime-integration-readiness-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg base "$base_tree" --arg md "$md_blob" --arg report "$report_blob" --arg temp "$temp" '{base_tree:$base,tree:[{path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},{path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},{path:$temp,mode:"100644",type:"blob",sha:null}]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message "docs(com): synchronize Matrix derivatives for B02E runtime integration readiness" --arg tree "$tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
