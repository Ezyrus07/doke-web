name: COM-B03C-R4J Hosted Terminal Status Observation Execution Envelope Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r4j.js'
      - 'scripts/test-com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.js'
      - 'scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js'
      - 'config/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.json'
      - 'config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json'
      - 'docs/validation/COM-B03C-R4J-HOSTED-TERMINAL-STATUS-OBSERVATION-EXECUTION-ENVELOPE-READINESS.json'
      - '.github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4j.js
          node --check scripts/test-com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.js
          node --check scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js
      - name: R4J repository execution envelope readiness
        run: node scripts/test-com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.js
      - name: R4J repository execution envelope self-test
        run: node scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js --repository-self-test
      - name: R4I receipt and historical observation adapters unchanged in R4J delta
        shell: bash
        run: |
          R4I_HEAD=1f134f087a5f6645f4c3ca86dd56e93da1c164ee
          test -z "$(git diff --name-only "$R4I_HEAD" "${{ github.event.pull_request.head.sha }}" -- \
            backend/modules/communities/community-realtime-private-auth-r4i.js \
            config/com-b03c-r4i-r4h-terminal-observation-authorization-consumption.json \
            docs/validation/COM-B03C-R4I-R4H-TERMINAL-OBSERVATION-AUTHORIZATION-CONSUMPTION.json \
            backend/modules/communities/community-realtime-private-auth-r4h.js \
            backend/modules/communities/community-realtime-private-auth-r4g.js \
            scripts/execute-com-b03c-r4g-presence-only-terminal-observation-envelope.js \
            scripts/execute-com-b03c-r3g-remote-adapter-staging-diagnostic.js \
            scripts/execute-com-b03c-r3v-single-use-remote-execution-envelope.js)"
      - name: No hosted trigger or remote authority surface
        shell: bash
        run: |
          test ! -e config/com-b03c-r4j-single-use-hosted-terminal-status-observation-trigger.json
          test "$(git rev-parse HEAD)" != ""
          ! grep -Eq '^[[:space:]]*push:' .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml
          ! grep -Eq '^[[:space:]]*environment:' .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml
          ! grep -Eq 'secrets\.' .github/workflows/com-b03c-r4j-hosted-terminal-status-observation-execution-envelope-readiness.yml
          set +e
          output="$(node scripts/execute-com-b03c-r4j-hosted-terminal-status-observation-envelope.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R4J_REMOTE_EXECUTION_NOT_AUTHORIZED'
      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix
      - name: Agent Governance
        run: npm run audit:agent-governance
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
