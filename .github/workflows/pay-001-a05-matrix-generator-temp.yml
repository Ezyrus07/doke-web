name: Doke PAY-A05 Matrix Generator Temporary

on:
  pull_request:
    paths:
      - 'backend/modules/payments/payment-provider-adapter-contract.js'
      - 'config/pay-001-a05-adapter-conformance-readiness.json'
      - 'docs/PAY-001-A05-ADAPTER-CONFORMANCE-READINESS.md'
      - 'docs/validation/PAY-001-A05-ADAPTER-CONFORMANCE-READINESS.json'
      - 'scripts/audit-pay-001-a05-adapter-contract.js'
      - 'scripts/test-pay-001-a05-adapter-contract.js'
      - '.github/workflows/pay-001-a05-matrix-generator-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate matrix derivatives
        run: |
          npm run write:domain-completion-matrix
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: pay-a05-matrix-generated-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            config/domain-completion-matrix.json
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
