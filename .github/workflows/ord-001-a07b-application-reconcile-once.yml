name: ORD-A07B Application Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07b-application-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07B application registry and matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['audit:ord-001-a07b-staging-migration-application'] =
            'node scripts/audit-ord-001-a07b-staging-migration-application.js';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.34';
          matrix.updatedAt = '2026-07-30T15:50:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'config/ord-001-a07b-staging-migration-application.json',
            'docs/ORD-001-A07B-STAGING-MIGRATION-APPLICATION.md',
            'docs/validation/ORD-001-A07B-STAGING-MIGRATION-APPLICATION.json',
            'scripts/audit-ord-001-a07b-staging-migration-application.js',
            '.github/workflows/ord-001-a07b-staging-migration-application.yml'
          ]);
          appendUnique(ord.tests, [
            'audit:ord-001-a07b-staging-migration-application'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07B was explicitly authorized and applied to Doke staging as migration ord_a07b_worker_invocation_nonce_ledger; Supabase recorded execution version 20260730184101 without manual migration-history edits.',
            'The staging nonce ledger, SECURITY INVOKER consume RPC, RLS, primary key, expiry constraint, expiry index and least-privilege grants were verified; anon and authenticated remain denied while service_role is authorized.',
            'Staging atomicity verification accepted the first nonce use and rejected duplicate, expired and excessively future uses; all order-domain counts remained zero.',
            'One source=test verification row remains because two narrowly scoped deletion attempts were blocked by tool safety; Cron headers, Edge Function deploy, A07C, Railway and production remain unchanged.'
          ]);
          ord.nextActions = ord.nextActions.filter((action) =>
            !/apply(?: and verify)? ord-a07b|ord_a07b_nonce_ledger_staging_application|exact staging authorization/i.test(action)
          );
          appendUnique(ord.nextActions, [
            'Require a separate exact authorization for ORD-A07C before applying the Cron header migration; keep the Edge Function undeployed until A07C is verified, then authorize the remote replay canary separately.'
          ]);

          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/audit-ord-001-a07b-staging-migration-application.js
          node scripts/test-ord-001-a07b-staging-migration-readiness.js
          node scripts/audit-ord-001-a07b-staging-migration-readiness.js
          node scripts/test-order-event-worker-invocation-freshness.js
          node scripts/audit-ord-001-a07b-worker-invocation-freshness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07B staging application evidence' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
