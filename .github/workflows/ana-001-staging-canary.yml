name: ANA-001 Synthetic Staging Canary Contract

on:
  pull_request:
    paths:
      - 'config/ana-001-staging-canary-readiness.json'
      - 'docs/ANA-001-STAGING-CANARY.md'
      - 'scripts/run-ana-001-staging-canary.js'
      - 'scripts/audit-ana-001-staging-canary.js'
      - 'scripts/test-ana-001-staging-canary.js'
      - '.github/workflows/ana-001-staging-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ana-001-staging-canary-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check scripts/run-ana-001-staging-canary.js
          node --check scripts/audit-ana-001-staging-canary.js
          node --check scripts/test-ana-001-staging-canary.js
      - name: Audit
        run: node scripts/audit-ana-001-staging-canary.js
      - name: Conformance
        run: node scripts/test-ana-001-staging-canary.js
      - name: Dry-run only
        run: node scripts/run-ana-001-staging-canary.js --dry-run
      - name: Assert workflow contains no remote execute command
        run: |
          node -e "const fs=require('fs');const t=fs.readFileSync('.github/workflows/ana-001-staging-canary.yml','utf8');const forbidden='node scripts/run-ana-001-staging-canary.js '+'--'+'execute';if(t.includes(forbidden)){console.error('Remote execute mode is forbidden in CI.');process.exit(1);}"
      - name: Domain matrix regression
        run: node scripts/audit-domain-completion-matrix.js
      - name: Diff hygiene
        run: git diff --check
