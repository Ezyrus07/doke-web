name: Doke SEARCH-A03 Apply Once

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-a03-apply.yml'
      - 'scripts/search-a03-apply-once.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doke-search-a03-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-search-a03:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply deterministic integration
        id: apply
        continue-on-error: true
        run: python scripts/search-a03-apply-once.py

      - name: Commit diagnostic on application failure
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/SEARCH-A03-APPLY-DIAGNOSTIC.txt
          git commit -m "Record SEARCH-A03 integration diagnostic" || true
          git push origin HEAD:${TARGET_BRANCH}
          exit 1

      - name: Run SEARCH-A03 audits
        if: steps.apply.outcome == 'success'
        run: |
          node scripts/audit-search-authority-baseline.js
          node scripts/audit-favorites-authority-retirement.js
          node scripts/test-favorites-authority-retirement-runtime.js
          node scripts/audit-service-favorites-surfaces.js
          node scripts/test-service-favorites-controller-runtime.js

      - name: Verify clean patch formatting
        if: steps.apply.outcome == 'success'
        run: git diff --check

      - name: Commit SEARCH-A03 integration
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/components/public-service-card.js assets/js/components/ad-card-interactions.js assets/js/pages/detalhe-anuncio-data-controller.js assets/js/pages/detail-ad-experience.js index.html resultados.html meu-perfil.html assets/css/pages/client-profile.css .github/workflows/quality.yml docs/validation/SEARCH-A03-APPLY-DIAGNOSTIC.txt
          git commit -m "Activate canonical favorites across service surfaces"
          git push origin HEAD:${TARGET_BRANCH}
