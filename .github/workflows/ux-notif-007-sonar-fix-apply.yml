name: UX-NOTIF-007 Sonar Cleanup Apply

on:
  push:
    branches:
      - ux/ux-notif-007-digest-dnd-policy
    paths:
      - '.github/workflows/ux-notif-007-sonar-fix-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-notif-007-digest-dnd-policy
          fetch-depth: 0

      - name: Guard exact cleanup ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f9d829e9ed5152da1def837ca92128f670ae85c3'
          test "$(git rev-parse HEAD^^)" = 'ca044660c96db3decb1234a91d1cde1a2ec2492f'
          test "$(git rev-parse HEAD^^^)" = 'd4f8437488ebeeb4eef1bffbd42ebd095ddf1bf6'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Sonar cleanup patch
        run: python3 scripts/tmp-ux-notif-007-sonar-fix.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/core/notification-delivery.js
          node --check assets/js/core/notification-toast.js
          node --check assets/js/features/in-app-notifications.js

      - name: Validate H07 after cleanup
        run: |
          node scripts/test-ux-notif-007-delivery-policy.js
          node scripts/test-ux-notif-007-toast-delivery-integration.js
          node scripts/test-ux-notif-007-adapter-delegation.js
          node scripts/test-notification-delivery-controls-contract.js

      - name: Preserve H01-H06 notification contracts
        run: |
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-002-notification-event.js
          node scripts/test-ux-notif-002-repository-adapter.js
          node scripts/test-ux-notif-002-producer-envelopes.js
          node scripts/test-ux-notif-002-financial-producer-handoff.js
          node scripts/test-ux-notif-003-toast-manager.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-in-app-delegation.js
          node scripts/test-ux-notif-004-badge-snapshot.js
          node scripts/test-ux-notif-005-inbox-reconciliation.js
          node scripts/test-ux-notif-005-adapter-repository-contract.js
          node scripts/test-ux-notif-005-remote-mutation-runtime.js
          node scripts/test-ux-notif-005-in-app-mutation-runtime.js
          node scripts/test-ux-notif-006-event-policy-matrix.js
          node scripts/test-ux-notif-006-badge-policy-integration.js
          node scripts/test-ux-notif-006-producer-policy-coverage.js

      - name: Remove temporary inspection and cleanup files
        run: |
          git rm .github/workflows/ux-notif-007-sonar-inspect.yml
          git rm .github/workflows/ux-notif-007-sonar-fix-apply.yml
          git rm scripts/tmp-ux-notif-007-sonar-fix.py

      - name: Validate intended permanent tree
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

      - name: Validate deterministic cleanup delta
        shell: bash
        run: |
          set -euo pipefail
          git add assets/js/core/notification-delivery.js \
            assets/js/core/notification-toast.js \
            assets/js/features/in-app-notifications.js
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 6
          printf '%s\n' "${paths[@]}" | grep -Fxq '.github/workflows/ux-notif-007-sonar-fix-apply.yml'
          printf '%s\n' "${paths[@]}" | grep -Fxq '.github/workflows/ux-notif-007-sonar-inspect.yml'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'assets/js/core/notification-delivery.js'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'assets/js/core/notification-toast.js'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'assets/js/features/in-app-notifications.js'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'scripts/tmp-ux-notif-007-sonar-fix.py'
          test "$(git diff --cached --name-status -- .github/workflows/ux-notif-007-sonar-inspect.yml | awk '{print $1}')" = 'D'
          test "$(git diff --cached --name-status -- scripts/tmp-ux-notif-007-sonar-fix.py | awk '{print $1}')" = 'D'

      - name: Publish permanent Sonar cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ux-notif-007): resolve Sonar delivery debt'
          git push origin HEAD:ux/ux-notif-007-digest-dnd-policy
