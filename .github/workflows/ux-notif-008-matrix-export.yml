name: Doke UX-NOTIF-008 Matrix Export

on:
  push:
    branches:
      - ux/ux-notif-008-browser-notifications
    paths:
      - '.github/workflows/ux-notif-008-matrix-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact H08 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard source head
        shell: bash
        env:
          EXPECTED_PARENT: 92189d467eb711492f4a67037c989503fcb23e83
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate and validate canonical matrix
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          git diff --check

      - name: Upload exact generated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-notif-008-canonical-matrix-${{ github.run_id }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 1
