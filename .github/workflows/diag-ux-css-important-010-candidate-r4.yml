name: Doke UX CSS Important 010 Candidate R4
on: [push]
permissions: {contents: write}
jobs:
  proof:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 839d20efdaf28d99508397722fb61cedafcdb556
      TARGET_FILE: assets/css/components/cards/mobile-card-contract.css
      TARGET_BLOB: 46ede4f081a686155ab4035581cbd8a796a831c9
      DIAG_BRANCH: diag/ux-css-important-010-candidate-r4
      RESULT_FILE: .diagnostics/ux-css-important-010-candidate-r4.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; exec > >(tee /tmp/p.log) 2>&1; test "$(git rev-parse HEAD^)" = "$TARGET_SHA"; git checkout "$TARGET_SHA" -- .; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; npm ci --ignore-scripts; npx playwright install --with-deps chromium >/tmp/pw.log 2>&1; cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),f=process.env.TARGET_FILE;let s=fs.readFileSync(f,'utf8');if((s.match(/!important\b/g)||[]).length!==4)throw Error('parent');function strip(sel,prop){const i=s.indexOf(sel+' {'),b=s.indexOf('{',i),e=s.indexOf('}',b);if(i<0)throw Error(sel);let z=s.slice(b+1,e),re=new RegExp('('+prop+'\\s*:[^;]+?)\\s*!important\\b');if(!re.test(z))throw Error(prop);z=z.replace(re,'$1');s=s.slice(0,b+1)+z+s.slice(e)}strip(':is(.service-grid, .service-grid--compact, .service-cards-grid, .profile-services-results):not([data-more-services-grid])','grid-template-columns');strip(':is(.comparison-card__visual, .profile-posts-stack .comparison-card__visual, body.home-index-shell .comparison-card__visual)','aspect-ratio');const h=crypto.createHash('sha256').update(Buffer.from(s)).digest('hex');if((s.match(/!important\b/g)||[]).length!==2)throw Error('candidate');fs.writeFileSync('/tmp/candidate.css',s);console.log(`CANDIDATE IDENTITY|sha256=${h}|bytes=${Buffer.byteLength(s)}|important=4->2|priorityMarkersRemoved=2|declarationsRemoved=0|preserved=gap,min-height`)
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');(async()=>{const f=process.env.TARGET_FILE,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/candidate.css','utf8'),browser=await chromium.launch({headless:true}),widths=[359,379,380,381,430,560,561],modalWidths=new Set([359,380,560]),H=b=>crypto.createHash('sha256').update(b).digest('hex'),items=Array.from({length:8},(_,i)=>({id:'c10-'+i,serviceId:'c10-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'p'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro']}));async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));for(const h of ['https://fonts.googleapis.com/**','https://fonts.gstatic.com/**','https://cdn.jsdelivr.net/**','https://unpkg.com/**'])await p.route(h,r=>r.fulfill({status:200,body:''}));await p.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await p.goto(`http://127.0.0.1:4173/index.html?c10=${phase}-${w}-${state}`,{waitUntil:'domcontentloaded'});await p.waitForLoadState('networkidle').catch(()=>{});await p.waitForFunction(()=>Boolean(Doke?.publicServiceCard?.create),null,{timeout:7000});await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(Doke.publicServiceCard.create(x,{results:true})))},items);if(state==='modal'){await p.waitForFunction(()=>Boolean(DokeHomeBeforeAfter?.create),null,{timeout:6000});await p.evaluate(()=>DokeHomeBeforeAfter.create());await p.locator('[data-before-after-id="case-bathroom"]').click();await p.waitForFunction(()=>{const e=document.querySelector('[data-before-after-preview]');return Boolean(e&&!e.hidden&&e.getAttribute('aria-hidden')!=='true')},null,{timeout:3000})}await p.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});const data=await p.evaluate(()=>{const g=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{display:c.display,gap:c.gap,grid:c.gridTemplateColumns,minHeight:c.minHeight,aspect:c.aspectRatio,width:c.width,height:c.height,rect:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*1000)/1000)}};return{featured:g('#featured-services-track'),more:g('[data-more-services-grid]'),cmp:g('.comparison-card__visual'),cards:document.querySelectorAll('.doke-ad-card').length,workers:document.querySelectorAll('.video-card').length}});if(data.cards<8||data.workers<6||(state==='modal'&&!data.cmp))throw Error('anatomy');const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs}}const states=[];for(const w of widths){states.push([w,'default']);if(modalWidths.has(w))states.push([w,'modal'])}const A={},B={};fs.writeFileSync(f,P);for(const [w,s] of states)A[`${w}-${s}`]=await cap(w,s,'p');fs.writeFileSync(f,C);for(const [w,s] of states)B[`${w}-${s}`]=await cap(w,s,'c');let md=0,sd=0,pe=0,details=[];for(const k in A){pe+=A[k].errs.length+B[k].errs.length;if(JSON.stringify(A[k].data)!==JSON.stringify(B[k].data)){md++;details.push(k)}if(A[k].png!==B[k].png)sd++}const p380=A['380-default'].data.featured,c380=B['380-default'].data.featured,pm=A['380-modal'].data.cmp,cm=B['380-modal'].data.cmp;console.log(`CANDIDATE PARITY|states=${states.length}|metadataDiffs=${md}|screenshotDiffs=${sd}|pageErrors=${pe}|featuredGapParent=${p380.gap}|featuredGapCandidate=${c380.gap}|featuredGridParent=${p380.grid}|featuredGridCandidate=${c380.grid}|cmpMinParent=${pm.minHeight}|cmpMinCandidate=${cm.minHeight}|cmpAspectParent=${pm.aspect}|cmpAspectCandidate=${cm.aspect}|diffKeys=${details.join(',')}`);if(md||sd||pe||p380.gap!==c380.gap||pm.minHeight!==cm.minHeight)throw Error('combined parity');await browser.close();fs.writeFileSync(f,P)})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
      - name: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.proof.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi; { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "PROOF=${{ steps.proof.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(CANDIDATE IDENTITY|CANDIDATE PARITY)\|' /tmp/p.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then tail -n 180 /tmp/p.log || true; fi; } >/tmp/out; git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: publish 010 candidate r4 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS