name: UX-FILTERS-001 Sonar CE Inspect

on:
  push:
    branches:
      - ux/ux-filters-001-applied-draft
    paths:
      - '.github/workflows/ux-filters-001-sonar-ce-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Sonar compute engine status
        shell: bash
        run: |
          set -euo pipefail
          ACTIVITY="$(curl --fail --silent --show-error --get \
            --data-urlencode 'component=Ezyrus07_doke-web' \
            --data-urlencode 'ps=50' \
            'https://sonarcloud.io/api/ce/activity')"
          echo "${ACTIVITY}" | jq -r '.tasks[] | select(.pullRequest == "70") | [.id, .status, .submittedAt, (.executedAt // ""), (.executionTimeMs // 0), (.errorMessage // "")] | @tsv'
          TASK_ID="$(echo "${ACTIVITY}" | jq -r '[.tasks[] | select(.pullRequest == "70")][0].id // empty')"
          if [[ -n "${TASK_ID}" ]]; then
            curl --fail --silent --show-error --get \
              --data-urlencode "id=${TASK_ID}" \
              'https://sonarcloud.io/api/ce/task' \
              | jq -r '.task | {id,status,errorMessage,errorStacktrace,warningCount,warnings,analysisId,componentKey,pullRequest}'
          fi
