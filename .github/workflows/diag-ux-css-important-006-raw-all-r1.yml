name: Doke UX CSS Important 006 Raw All R1
on:
  push:
    branches: [diag/ux-css-important-006-raw-all-r1]
    paths: [.github/workflows/diag-ux-css-important-006-raw-all-r1.yml]
permissions:
  contents: write
jobs:
  raw:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 24b49e5693f24621a1024b94c33c8ba6e18b12c0
      TARGET_FILE: assets/css/pages/home/mobile-composition.css
      TARGET_BLOB: 896730319ae0852caca8a0f93cd1507608dd9894
      DIAG_BRANCH: diag/ux-css-important-006-raw-all-r1
      RESULT_FILE: .diagnostics/ux-css-important-006-raw-all-r1.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - id: raw
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/raw.log) 2>&1
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA"..HEAD)" = '.github/workflows/diag-ux-css-important-006-raw-all-r1.yml'
          git checkout "$TARGET_SHA" -- .
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/tmp/pw.log 2>&1
          cp "$TARGET_FILE" /tmp/parent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),f=process.env.TARGET_FILE;
          const parent=fs.readFileSync(f,'utf8');const before=(parent.match(/!important\b/g)||[]).length;if(before!==23)throw Error(`parent important=${before}`);
          const candidate=parent.replace(/\s*!important\b/g,'');const after=(candidate.match(/!important\b/g)||[]).length;if(after!==0)throw Error(`candidate important=${after}`);
          fs.writeFileSync('/tmp/candidate.css',candidate);const b=Buffer.from(candidate),h=crypto.createHash('sha256').update(b).digest('hex');let stat='';try{stat=cp.execFileSync('git',['diff','--no-index','--numstat','/tmp/parent.css','/tmp/candidate.css'],{encoding:'utf8'}).trim()}catch(e){stat=String(e.stdout||'').trim()}const [a,d]=stat.split(/\s+/).map(Number);if(a!==23||d!==23)throw Error(`diff ${stat}`);console.log(`RAW IDENTITY|sha256=${h}|bytes=${b.length}|important=23->0|files=1|additions=${a}|deletions=${d}|priorityMarkersRemoved=23`);
          NODE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const {chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET_FILE,parent=fs.readFileSync('/tmp/parent.css','utf8'),candidate=fs.readFileSync('/tmp/candidate.css','utf8');const browser=await chromium.launch({headless:true});const widths=[359,379,380,381,390,430,560,561];const extraWidths=new Set([359,380,560]);const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const targets=[
            {s:'.featured-services',p:['display','overflow','overflow-x','overflow-y','width','max-width']},
            {s:'.short-videos',p:['display','overflow','overflow-x','overflow-y','width','max-width']},
            {s:'.featured-services .content-rail',p:['display','overflow','overflow-x','overflow-y','width','max-width','margin-left','margin-right','padding-left','padding-right']},
            {s:'#featured-services-track',p:['display','flex-direction','flex-wrap','grid-template-columns','grid-auto-flow','overflow-x','overflow-y','overscroll-behavior-x','scroll-snap-type','-webkit-overflow-scrolling','width','min-width','max-width','padding-left','padding-right','scroll-padding-left']},
            {s:'.short-videos .content-rail',p:['display','overflow','overflow-x','overflow-y','padding-left','padding-right']},
            {s:'#short-videos-track',p:['display','grid-template-columns','grid-auto-flow','grid-auto-columns','overflow','overflow-x','overflow-y','width','min-width','max-width']},
            {s:'.doke-search-panel__form',p:['display','position','overflow','overflow-x','overflow-y','height','min-height','padding-left','padding-right']},
            {s:'.home-search-hero__field',p:['display','height','min-height','padding-left','padding-right']}
          ];
          async function capture(width,state,phase){const ctx=await browser.newContext({viewport:{width,height:1050}});const page=await ctx.newPage();const errs=[];page.on('pageerror',e=>errs.push(e.message));await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));await page.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:200,contentType:'font/woff2',body:''}));await page.route('https://images.pexels.com/**',r=>r.fulfill({status:200,contentType:'image/png',body:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')}));await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await page.route('https://unpkg.com/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await page.goto(`http://127.0.0.1:4173/index.html?cssimp006=${phase}-${width}-${state}`,{waitUntil:'domcontentloaded'});await page.waitForLoadState('networkidle').catch(()=>{});await page.waitForTimeout(1200);
            if(state==='search'){const input=page.locator('#main-site-search');if(await input.count()!==1)throw Error('search input');await input.click();await input.fill('limpeza');await page.waitForTimeout(300)}
            if(state==='rail'){const m=await page.evaluate(()=>{const el=document.querySelector('#featured-services-track');if(!el)return null;const max=Math.max(0,el.scrollWidth-el.clientWidth);el.scrollLeft=Math.min(120,max);return{max,left:el.scrollLeft}});if(!m)throw Error('rail missing');await page.waitForTimeout(150)}
            await page.addStyleTag({content:'*,*::before,*::after{animation:none !important;transition:none !important;caret-color:transparent !important;}'});
            const data=await page.evaluate((targets)=>{const round=n=>Math.round(n*1000)/1000;const out={};for(const t of targets){const nodes=[...document.querySelectorAll(t.s)];out[t.s]=nodes.map(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),style={};for(const p of t.p)style[p]=cs.getPropertyValue(p).trim();return{style,rect:{x:round(r.x),y:round(r.y),w:round(r.width),h:round(r.height)},scroll:{cw:el.clientWidth,ch:el.clientHeight,sw:el.scrollWidth,sh:el.scrollHeight,sx:round(el.scrollLeft),sy:round(el.scrollTop)}}})}const track=document.querySelector('#featured-services-track');out.__scrollbar=track?{display:getComputedStyle(track,'::-webkit-scrollbar').display}:null;const field=document.querySelector('.home-search-hero__field');out.__fieldPseudo=field?{before:{display:getComputedStyle(field,'::before').display,content:getComputedStyle(field,'::before').content},after:{display:getComputedStyle(field,'::after').display,content:getComputedStyle(field,'::after').content}}:null;const dd=document.querySelector('[data-search-dropdown]');out.__search={dropdownHidden:dd?dd.hidden:null,dropdownDisplay:dd?getComputedStyle(dd).display:null};return out},targets);
            const required=['.featured-services','.short-videos','.featured-services .content-rail','#featured-services-track','.short-videos .content-rail','#short-videos-track','.doke-search-panel__form','.home-search-hero__field'];for(const s of required){if(!data[s]||data[s].length<1)throw Error(`required node ${s} width=${width} state=${state}`)}
            const png=hash(await page.screenshot({fullPage:true,animations:'disabled'}));await ctx.close();return{data,png,errs};}
          const states=[];for(const w of widths){states.push([w,'default']);if(extraWidths.has(w)){states.push([w,'search']);states.push([w,'rail'])}}const par={},can={};fs.writeFileSync(f,parent);for(const [w,s] of states)par[`${w}-${s}`]=await capture(w,s,'parent');fs.writeFileSync(f,candidate);for(const [w,s] of states)can[`${w}-${s}`]=await capture(w,s,'candidate');let styleDiffs=0,screenshotDiffs=0,pageErrors=0;const diffKeys=[];for(const k of Object.keys(par)){pageErrors+=par[k].errs.length+can[k].errs.length;if(JSON.stringify(par[k].data)!==JSON.stringify(can[k].data)){styleDiffs++;diffKeys.push(k)}if(par[k].png!==can[k].png){screenshotDiffs++;if(!diffKeys.includes(k))diffKeys.push(k)}}console.log(`RAW PARITY|states=${states.length}|viewports=${widths.join(',')}|searchStates=3|railStates=3|styleGeometryScrollDiffs=${styleDiffs}|screenshotDiffs=${screenshotDiffs}|pageErrors=${pageErrors}|diffKeys=${diffKeys.join(',')||'-'}|syntheticDOM=0|criteriaRelaxed=0`);if(styleDiffs||screenshotDiffs||pageErrors)throw Error(`raw removal unsafe diffs=${diffKeys.join(',')}`);console.log('DECISION|rawRemovalSafe=1|candidate=23->0|reason=active-runtime-computed-geometry-scroll-and-screenshot-parity');await browser.close();fs.writeFileSync(f,parent)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git checkout "$TARGET_SHA" -- "$TARGET_FILE"; git diff --exit-code -- "$TARGET_FILE"
      - id: restore
        if: always()
        run: |
          set -euo pipefail; git reset --hard "$TARGET_SHA" >/dev/null; git clean -fdx >/dev/null; test "$(git rev-parse HEAD)" = "$TARGET_SHA"; test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"; test -z "$(git status --porcelain)"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail; result=FAIL; if test '${{ steps.raw.outcome }}' = success && test '${{ steps.restore.outcome }}' = success; then result=PASS; fi
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "TARGET_SHA=$TARGET_SHA"; echo "RAW=${{ steps.raw.outcome }}"; echo "RESTORE=${{ steps.restore.outcome }}"; grep -E '^(RAW IDENTITY|RAW PARITY|DECISION)\|' /tmp/raw.log || true; echo "RESULT=$result"; if test "$result" = FAIL; then echo '--- FAILURE TAIL ---'; tail -n 240 /tmp/raw.log || true; fi; } >/tmp/evidence.txt
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null; git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null; mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/evidence.txt "$RESULT_FILE"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add "$RESULT_FILE"; git commit -m 'diag: record ux css important 006 raw all r1 [skip ci]' >/dev/null; git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null; test "$result" = PASS
