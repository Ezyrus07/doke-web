name: UX-HOME-002 Tab Selector Fix

on:
  push:
    branches:
      - ux/ux-home-002-more-services-filters
    paths:
      - '.github/workflows/ux-home-002-tab-selector-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact tab-routing fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/js/pages/home/more-services-surface.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "var TAB_SELECTOR = '[data-more-services-intent], #more-services-tabs-track .mini-tab';",
                  "var TAB_SELECTOR = '#more-services-tabs-track [role=\"tab\"][data-more-services-intent]';"
              ),
              (
                  'region.dataset.moreServicesIntent = snapshot.intent;',
                  'region.dataset.moreServicesActiveIntent = snapshot.intent;'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old}')
              text = text.replace(old, new, 1)
          if 'region.dataset.moreServicesIntent = snapshot.intent;' in text:
              raise SystemExit('Ambiguous region intent dataset remains.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/pages/home/more-services-surface.js
          node scripts/test-ux-home-002-index-contract.js
          node scripts/test-ux-home-002-more-services-state.js
          node scripts/test-ux-home-002-more-services-surface.js
          git diff --check

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doke-ci'
          git config user.email 'doke-ci@users.noreply.github.com'
          git add assets/js/pages/home/more-services-surface.js
          git commit -m 'fix: isolate more-services tab routing'
          git push origin HEAD:ux/ux-home-002-more-services-filters
