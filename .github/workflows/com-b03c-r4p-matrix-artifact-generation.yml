name: COM-B03C-R4P Matrix Artifact Generation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r4p-matrix-artifact-generation.yml'
      - 'backend/modules/communities/community-realtime-private-auth-r4p.js'
      - 'config/com-b03c-r4p-r4o-fresh-authorization-consumption.json'
      - 'scripts/test-com-b03c-r4p-r4o-fresh-authorization-consumption.js'

permissions: { contents: read }

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: R4P repository-only pre-gates
        shell: bash
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r4p.js
          node --check scripts/test-com-b03c-r4p-r4o-fresh-authorization-consumption.js
          node scripts/test-com-b03c-r4p-r4o-fresh-authorization-consumption.js
          test ! -e config/com-b03c-r4o-single-use-phase-attributed-hosted-terminal-observation-trigger.json
          ! grep -Eq '^[[:space:]]*push:' .github/workflows/com-b03c-r4p-r4o-fresh-authorization-consumption.yml
          ! grep -Eq 'workflow_dispatch' .github/workflows/com-b03c-r4p-r4o-fresh-authorization-consumption.yml
          ! grep -Eq 'environment:' .github/workflows/com-b03c-r4p-r4o-fresh-authorization-consumption.yml
          ! grep -Eq 'secrets\.' .github/workflows/com-b03c-r4p-r4o-fresh-authorization-consumption.yml
          grep -Fq 'permissions: { contents: read }' .github/workflows/com-b03c-r4p-r4o-fresh-authorization-consumption.yml
      - name: Generate canonical outputs locally
        run: npm run write:domain-completion-matrix
      - name: Require exactly two generated outputs
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/DOMAIN-COMPLETION-MATRIX.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'reports/generated/domain-completion-matrix-report.json'
      - name: Audit generated matrix
        run: npm run audit:domain-completion-matrix
      - name: Upload canonical outputs only
        uses: actions/upload-artifact@v4
        with:
          name: com-b03c-r4p-canonical-matrix-${{ github.run_id }}
          path: |
            docs/DOMAIN-COMPLETION-MATRIX.md
            reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 1
