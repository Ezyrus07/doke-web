name: Doke UX-CSS-DEBT-032 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-032-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5b0dbde506b210d5a4a25897abdb55ae9432cea7
      TARGET_CSS: assets/css/pages/home-overlays/before-after-preview.css
      TARGET_BLOB: b018b549acddef4e56937f6867ce2189daf7ee79
      TARGET_HASH: eafe0aa389719839be86295c82eec36df72826d20f6d7e228202417b3ca60fcb
      PERM_BRANCH: ux/ux-css-debt-032-before-after-preview-compaction
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Preserve promotion helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-032-promote.cjs /tmp/ux-css-debt-032-promote.cjs
          node --check /tmp/ux-css-debt-032-promote.cjs

      - name: Checkout exact certified UX-CSS-DEBT-031 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          clean: true
          persist-credentials: true

      - name: Guard exact parent and seeded permanent namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_CSS")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          REMOTE_BEFORE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE_BEFORE" = "$TARGET_SHA"
          echo "PROMOTION PARENT PASS|sha=$TARGET_SHA|blob=$TARGET_BLOB|permanentNamespace=seeded-at-parent"

      - name: Build exact candidate on permanent branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$PERM_BRANCH"
          node /tmp/ux-css-debt-032-promote.cjs
          test "$(sha256sum "$TARGET_CSS" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_CSS" | tr -d ' ')" = "17268"
          test "$(git diff --name-only)" = "$TARGET_CSS"
          read -r add del file < <(git diff --numstat -- "$TARGET_CSS")
          test "$add" = "0" && test "$del" = "17" && test "$file" = "$TARGET_CSS"

      - name: Commit exact permanent product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "doke"
          git config user.email "bielantoniomma@gmail.com"
          git add "$TARGET_CSS"
          git commit -m "UX-CSS-DEBT-032: compact superseded before after preview declarations"
          COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA"...HEAD)" = "$TARGET_CSS"
          read -r add del file < <(git diff --numstat "$TARGET_SHA"...HEAD -- "$TARGET_CSS")
          test "$add" = "0" && test "$del" = "17" && test "$file" = "$TARGET_CSS"
          test "$(sha256sum "$TARGET_CSS" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(wc -c < "$TARGET_CSS" | tr -d ' ')" = "17268"
          echo "PERMANENT COMMIT PASS|sha=$COMMIT|parent=$TARGET_SHA|hash=$TARGET_HASH|bytes=17268|files=1|additions=0|deletions=17"

      - name: Fast-forward permanent branch
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          REMOTE_BEFORE="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE_BEFORE" = "$TARGET_SHA"
          git push origin "HEAD:refs/heads/$PERM_BRANCH"
          REMOTE_AFTER="$(git ls-remote --heads origin "refs/heads/$PERM_BRANCH" | awk '{print $1}')"
          test "$REMOTE_AFTER" = "$COMMIT"
          echo "PROMOTION FINAL PASS|branch=$PERM_BRANCH|sha=$COMMIT|parent=$TARGET_SHA|hash=$TARGET_HASH|bytes=17268|files=1|additions=0|deletions=17|prCreated=0|transport=seeded-fast-forward"
