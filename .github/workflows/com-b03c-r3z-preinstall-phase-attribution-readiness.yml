name: COM-B03C-R3Z Preinstall Phase Attribution Readiness

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/modules/communities/community-realtime-private-auth-r3z.js'
      - 'scripts/execute-com-b03c-r3z-preinstall-phase-attribution.js'
      - 'scripts/test-com-b03c-r3z-preinstall-phase-attribution-readiness.js'
      - 'config/com-b03c-r3z-preinstall-phase-attribution-readiness.json'
      - 'docs/validation/COM-B03C-R3Z-PREINSTALL-PHASE-ATTRIBUTION-READINESS.json'
      - '.github/workflows/com-b03c-r3z-preinstall-phase-attribution-readiness.yml'
      - 'docs/DOMAIN-COMPLETION-MATRIX.md'
      - 'reports/generated/domain-completion-matrix-report.json'

permissions: { contents: read }

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }

      - run: npm ci --ignore-scripts

      - name: Syntax
        run: |
          node --check backend/modules/communities/community-realtime-private-auth-r3z.js
          node --check scripts/execute-com-b03c-r3z-preinstall-phase-attribution.js
          node --check scripts/test-com-b03c-r3z-preinstall-phase-attribution-readiness.js

      - name: R3Z preinstall phase attribution readiness
        run: node scripts/test-com-b03c-r3z-preinstall-phase-attribution-readiness.js

      - name: R3Y executor repository regression
        run: node scripts/execute-com-b03c-r3y-single-use-hosted-runtime-observation.js --repository-self-test

      - name: R3Y staging summary continuity
        run: |
          node - <<'NODE'
          const s=require('./docs/validation/COM-B03C-R3Y-HOSTED-RUNTIME-OBSERVATION-STAGING-SUMMARY.json');
          if(s.status!=='single_use_hosted_runtime_attempt_failed_before_observation_phase_attribution_required')process.exit(1);
          if(s.rootCauseNarrowing?.exactFailurePhaseProven!==false||s.rootCauseNarrowing?.exactRootCauseProven!==false)process.exit(1);
          if(s.authorization?.consumed!==true||s.authorization?.reusable!==false||s.trigger?.removed!==true)process.exit(1);
          NODE

      - name: Pre-remote hard block
        shell: bash
        run: |
          test ! -e config/com-b03c-r3y-single-use-hosted-runtime-observation-trigger.json
          set +e
          output="$(node scripts/execute-com-b03c-r3z-preinstall-phase-attribution.js 2>&1)"
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -q 'DOKE_COM_B03C_R3Z_REMOTE_EXECUTION_AUTHORIZATION_BOUNDARY_REQUIRED'

      - name: Repository-only workflow guard
        shell: bash
        run: |
          FILE=.github/workflows/com-b03c-r3z-preinstall-phase-attribution-readiness.yml
          test "$(grep -Ec '^[[:space:]]+push:' "$FILE" || true)" -eq 0
          test "$(grep -Ec '^[[:space:]]+environment:' "$FILE" || true)" -eq 0
          test "$(grep -Ec 'secrets[.]' "$FILE" || true)" -eq 0

      - name: Domain Completion Matrix
        run: npm run audit:domain-completion-matrix

      - name: Agent Governance
        run: npm run audit:agent-governance

      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"