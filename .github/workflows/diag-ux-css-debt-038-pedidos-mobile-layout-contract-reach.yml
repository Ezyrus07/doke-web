name: Doke UX-CSS-DEBT-038 Pedidos Mobile Layout Contract Reach

on:
  push:
    branches:
      - diag/ux-css-debt-038-pedidos-mobile-layout-contract-reach

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 2c2b87e287a2df5f261be5cc9f94439ed9719145
      PARENT_SHA: 10e1f40f56717f8384c712cd2a07ec5acf4b645e
      TARGET_BLOB: fdadf3122ce4536b45d9975687d92434fa0f830f
      TARGET_FILE: assets/css/pages/pedidos/mobile-layout-contract.css
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 5

      - name: Preserve harness and checkout exact UX-CSS-DEBT-037 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-038-pedidos-mobile-layout-contract-reach.cjs /tmp/ux-css-debt-038-pedidos-mobile-layout-contract-reach.cjs
          node --check /tmp/ux-css-debt-038-pedidos-mobile-layout-contract-reach.cjs
          git fetch origin "${TARGET_SHA}" --depth=2
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          git diff --check
          echo "CHECKPOINT GUARD PASS|sha=${TARGET_SHA}|parent=${PARENT_SHA}|blob=${TARGET_BLOB}|harness=R1"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate canonical active graph
        run: npm run audit:active-legacy-structures

      - name: Prove reach cascade and runtime parity
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$PWD/node_modules" node /tmp/ux-css-debt-038-pedidos-mobile-layout-contract-reach.cjs

      - name: Preserve governance baselines
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:agent-governance
          npm run audit:active-legacy-structures | tee /tmp/active.log
          grep -q 'css files: 533 (55 direct, 401 active/imported)' /tmp/active.log
          grep -q 'high risk active css: 37' /tmp/active.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          echo 'GOVERNANCE PASS|active=401|high=37|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Verify exact restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git hash-object "${TARGET_FILE}")" = "${TARGET_BLOB}"
          test -z "$(git status --porcelain)"
          echo "FINAL CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0"