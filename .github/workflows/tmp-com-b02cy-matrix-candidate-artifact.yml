name: TEMP COM-B02CY Clean Target Matrix Artifact

on:
  push:
    branches:
      - tmp/com-b02cy-matrix-candidate-artifact
    paths:
      - 'backend/modules/communities/community-command-post-idempotency-rate-limit-policy-snapshot-authority-readiness.js'
      - '.github/workflows/com-b02cy-repository-only-post-idempotency-rate-limit-policy-snapshot-authority-readiness.yml'
      - '.github/workflows/tmp-com-b02cy-matrix-candidate-artifact.yml'

permissions:
  contents: write

jobs:
  generate-clean-b02cy-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PREDECESSOR_HEAD: 6bb9608ce4b1b5a01ffb249030e3eb8cd71e88ca
      PREDECESSOR_TREE: e18f83d4e78f077af933b922124531840a23a8c1
      SOURCE: backend/modules/communities/community-command-post-idempotency-rate-limit-policy-snapshot-authority-readiness.js
      SOURCE_BLOB: 0ebc392f9dcff88b8698dd42020789901e8fd12e
      WORKFLOW: .github/workflows/com-b02cy-repository-only-post-idempotency-rate-limit-policy-snapshot-authority-readiness.yml
      WORKFLOW_BLOB: f697850077ecbdfd7f6c3fc41b76d16a520de4f4
      TEMP_WORKFLOW: .github/workflows/tmp-com-b02cy-matrix-candidate-artifact.yml
      MATRIX_SOURCE: config/domain-completion-matrix.json
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      MATRIX_GENERATOR: scripts/audit-domain-completion-matrix.js
      MATRIX_GENERATOR_BLOB: f60d9b9efc8a191822b34d39d4e9137a59b8727e
      PACKAGE_JSON: package.json
      PACKAGE_JSON_BLOB: 8b9670383773896d03410cb661a23e2061911495
      MATRIX_MD: docs/DOMAIN-COMPLETION-MATRIX.md
      MATRIX_REPORT: reports/generated/domain-completion-matrix-report.json
      TARGET_DIR: /tmp/com-b02cy-clean-target

    steps:
      - name: Checkout exact auxiliary head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze auxiliary authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$WORKFLOW")" = "$WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$MATRIX_GENERATOR")" = "$MATRIX_GENERATOR_BLOB"
          test "$(git rev-parse "HEAD:$PACKAGE_JSON")" = "$PACKAGE_JSON_BLOB"
          git diff --check "$PREDECESSOR_HEAD" HEAD

      - name: Build exact clean four-path target working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TARGET_DIR"
          git worktree add --detach "$TARGET_DIR" "$PREDECESSOR_HEAD"
          mkdir -p "$TARGET_DIR/$(dirname "$SOURCE")" "$TARGET_DIR/$(dirname "$WORKFLOW")"
          cp "$GITHUB_WORKSPACE/$SOURCE" "$TARGET_DIR/$SOURCE"
          cp "$GITHUB_WORKSPACE/$WORKFLOW" "$TARGET_DIR/$WORKFLOW"

          cd "$TARGET_DIR"
          git add -N "$SOURCE" "$WORKFLOW"
          actual="$(git diff --name-status | sort)"
          expected="$(printf 'A\t%s\nA\t%s\n' "$SOURCE" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"
          node --check "$SOURCE"
          git diff --check

      - name: Generate canonical Matrix derivatives on clean target
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET_DIR"
          npm run write:domain-completion-matrix

          test "$(git hash-object "$MATRIX_SOURCE")" = "$MATRIX_SOURCE_BLOB"
          test "$(git hash-object "$MATRIX_GENERATOR")" = "$MATRIX_GENERATOR_BLOB"
          test "$(git hash-object "$PACKAGE_JSON")" = "$PACKAGE_JSON_BLOB"

          git add -N "$SOURCE" "$WORKFLOW"
          actual="$(git diff --name-status | sort)"
          expected="$(printf 'A\t%s\nA\t%s\nM\t%s\nM\t%s\n' "$SOURCE" "$WORKFLOW" "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Validate canonical audits and report exact domain delta
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET_DIR"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

          node <<'NODE'
          'use strict';
          const cp = require('child_process');
          const fs = require('fs');
          const oldReport = JSON.parse(cp.execFileSync('git', ['show', `${process.env.PREDECESSOR_HEAD}:${process.env.MATRIX_REPORT}`], { encoding: 'utf8' }));
          const newReport = JSON.parse(fs.readFileSync(process.env.MATRIX_REPORT, 'utf8'));
          const byId = (report) => new Map(report.domains.map((d) => [d.id, d]));
          const a = byId(oldReport);
          const b = byId(newReport);
          const delta = [];
          for (const [id, next] of b) {
            const prev = a.get(id);
            if (!prev) { delta.push({ id, added: true }); continue; }
            const fields = {};
            for (const key of ['filesMatched', 'signals', 'sampleFiles']) {
              if (JSON.stringify(prev[key]) !== JSON.stringify(next[key])) fields[key] = { before: prev[key], after: next[key] };
            }
            if (Object.keys(fields).length) delta.push({ id, ...fields });
          }
          console.log('B02CY_DOMAIN_DELTA=' + JSON.stringify(delta));
          NODE

          printf 'BASE_HEAD=%s\n' "$PREDECESSOR_HEAD"
          printf 'SOURCE_BLOB=%s\n' "$(git hash-object "$SOURCE")"
          printf 'WORKFLOW_BLOB=%s\n' "$(git hash-object "$WORKFLOW")"
          printf 'MARKDOWN_BLOB=%s\n' "$(git hash-object "$MATRIX_MD")"
          printf 'REPORT_BLOB=%s\n' "$(git hash-object "$MATRIX_REPORT")"

      - name: Upload clean B02CY Matrix candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: com-b02cy-clean-target-${{ github.sha }}
          path: |
            /tmp/com-b02cy-clean-target/docs/DOMAIN-COMPLETION-MATRIX.md
            /tmp/com-b02cy-clean-target/reports/generated/domain-completion-matrix-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Materialize validated derivative blobs on auxiliary branch only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp "$TARGET_DIR/$MATRIX_MD" "$MATRIX_MD"
          cp "$TARGET_DIR/$MATRIX_REPORT" "$MATRIX_REPORT"

          test "$(git hash-object "$MATRIX_MD")" = '4a9db1aef14269c575c23eba9e810aab00b5bec0'
          test "$(git hash-object "$MATRIX_REPORT")" = '393969bdc0c21295d9d85c19d0d1c7a484e2a058'
          actual="$(git diff --name-status | sort)"
          expected="$(printf 'M\t%s\nM\t%s\n' "$MATRIX_MD" "$MATRIX_REPORT" | sort)"
          test "$actual" = "$expected"
          git diff --check

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add -- "$MATRIX_MD" "$MATRIX_REPORT"
          git commit -m 'ci(com): retain validated B02CY matrix derivative blobs'
          git push origin "HEAD:refs/heads/tmp/com-b02cy-matrix-candidate-artifact"
