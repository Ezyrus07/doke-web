name: UX-NOTIF-007 Phase 1 Apply

on:
  push:
    branches:
      - ux/ux-notif-007-digest-dnd-policy
    paths:
      - '.github/workflows/ux-notif-007-phase1-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-notif-007-digest-dnd-policy
          fetch-depth: 0

      - name: Guard exact temporary ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f81c6e6efe7c83ea95325bb5c8966c777f024780'
          test "$(git rev-parse HEAD^^)" = '7ba99bfbd293f83d8e14bccf75b4bd0703a4199d'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply H07 patch
        run: python3 scripts/tmp-ux-notif-007-phase1.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/core/notification-delivery.js
          node --check assets/js/core/notification-toast.js
          node --check assets/js/features/in-app-notifications.js
          node --check scripts/test-ux-notif-007-delivery-policy.js
          node --check scripts/test-ux-notif-007-toast-delivery-integration.js
          node --check scripts/test-ux-notif-007-adapter-delegation.js
          node --check scripts/test-ux-notif-001-in-app-adapter.js

      - name: Validate H07 contracts
        run: |
          node scripts/test-ux-notif-007-delivery-policy.js
          node scripts/test-ux-notif-007-toast-delivery-integration.js
          node scripts/test-ux-notif-007-adapter-delegation.js
          node scripts/test-notification-delivery-controls-contract.js

      - name: Preserve H01 and H03 runtime contracts
        run: |
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-003-toast-manager.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-in-app-delegation.js

      - name: Preserve H02 H04 H05 H06 contracts
        run: |
          node scripts/test-ux-notif-002-notification-event.js
          node scripts/test-ux-notif-002-repository-adapter.js
          node scripts/test-ux-notif-002-producer-envelopes.js
          node scripts/test-ux-notif-002-financial-producer-handoff.js
          node scripts/test-ux-notif-004-badge-snapshot.js
          node scripts/test-ux-notif-005-inbox-reconciliation.js
          node scripts/test-ux-notif-005-adapter-repository-contract.js
          node scripts/test-ux-notif-005-remote-mutation-runtime.js
          node scripts/test-ux-notif-005-in-app-mutation-runtime.js
          node scripts/test-ux-notif-006-event-policy-matrix.js
          node scripts/test-ux-notif-006-badge-policy-integration.js
          node scripts/test-ux-notif-006-producer-policy-coverage.js

      - name: Remove temporary executor files
        run: |
          git rm .github/workflows/ux-notif-007-phase1-apply.yml
          git rm scripts/tmp-ux-notif-007-phase1.py

      - name: Validate functional delta
        shell: bash
        run: |
          set -euo pipefail
          git add assets/js/core/notification-delivery.js \
            assets/js/core/notification-toast.js \
            assets/js/features/in-app-notifications.js \
            docs/ux/UX-NOTIF-007.md \
            scripts/test-ux-notif-001-in-app-adapter.js \
            scripts/test-notification-delivery-controls-contract.js \
            scripts/test-ux-notif-007-delivery-policy.js \
            scripts/test-ux-notif-007-toast-delivery-integration.js \
            scripts/test-ux-notif-007-adapter-delegation.js \
            comunidade-interna.html mensagens.html notificacoes.html
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 14
          test "${paths[0]}" = '.github/workflows/ux-notif-007-phase1-apply.yml'
          test "${paths[13]}" = 'scripts/tmp-ux-notif-007-phase1.py'
          test "$(git diff --cached --name-status -- .github/workflows/ux-notif-007-phase1-apply.yml | awk '{print $1}')" = 'D'
          test "$(git diff --cached --name-status -- scripts/tmp-ux-notif-007-phase1.py | awk '{print $1}')" = 'D'

      - name: Publish functional H07 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ux-notif-007): extract canonical digest and DND policy'
          git push origin HEAD:ux/ux-notif-007-digest-dnd-policy
