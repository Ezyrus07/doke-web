name: UX-NOTIF-005 Coverage Matrix Sync

on:
  push:
    branches:
      - ux/ux-notif-005-inbox-reconciliation
    paths:
      - '.github/workflows/ux-notif-005-coverage-matrix-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Guard exact coverage parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2f53473cce00a2280b29592528306e9a05c74dd4"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Remove transient executor from intended final tree
        run: git rm .github/workflows/ux-notif-005-coverage-matrix-sync.yml

      - name: Validate new H05 runtime coverage tests
        run: |
          node scripts/test-ux-notif-005-remote-mutation-runtime.js
          node scripts/test-ux-notif-005-in-app-mutation-runtime.js
          node scripts/test-ux-notif-005-inbox-reconciliation.js
          node scripts/test-ux-notif-005-adapter-repository-contract.js

      - name: Regenerate and audit canonical matrix on final tree
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix

      - name: Validate canonical agent governance
        run: npm run audit:agent-governance

      - name: Validate deterministic final-tree delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          unexpected="$(git status --porcelain | grep -vE '^(D  | M )(.github/workflows/ux-notif-005-coverage-matrix-sync.yml|docs/DOMAIN-COMPLETION-MATRIX.md)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo '::error::Unexpected tracked changes while generating the canonical matrix.'
            echo "${unexpected}"
            exit 1
          fi

      - name: Publish final-tree matrix sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --cached --check
          git commit -m 'test(ux-notif-005): certify reconciliation coverage harness'
          git push origin HEAD:ux/ux-notif-005-inbox-reconciliation
