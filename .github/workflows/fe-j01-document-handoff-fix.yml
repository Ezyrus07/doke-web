name: FE-J01 Document Handoff Fix

on:
  pull_request:
    paths:
      - "assets/js/dev/fe-j01-document-handoff-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply document navigation handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle_path = Path('assets/js/core/navigation-lifecycle.js')
          lifecycle = lifecycle_path.read_text()
          old_tail = """      }, 0);
            });
          }

          function go"""
          new_tail = """      }, 64);
            });
          }

          function go"""
          if old_tail not in lifecycle:
              raise SystemExit('document navigation timer tail not found')
          lifecycle_path.write_text(lifecycle.replace(old_tail, new_tail, 1))

          test_path = Path('scripts/test-navigation-lifecycle-core-contract.js')
          test = test_path.read_text()
          old_wait = "await new Promise((resolve) => setTimeout(resolve, 0));"
          new_wait = "await new Promise((resolve) => setTimeout(resolve, 80));"
          if old_wait not in test:
              raise SystemExit('document navigation handoff test wait not found')
          test_path.write_text(test.replace(old_wait, new_wait, 1))
          PY

      - name: Validate focused contracts
        run: |
          node --check assets/js/core/navigation-lifecycle.js
          node scripts/test-navigation-lifecycle-core-contract.js
          node scripts/audit-navigation-registry-ownership.js

      - name: Commit focused handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/core/navigation-lifecycle.js scripts/test-navigation-lifecycle-core-contract.js
          git commit -m "FE-J01: stabilize native navigation handoff"
          git push origin HEAD:${GITHUB_HEAD_REF}
