name: WAL-A01 Authority Baseline

on:
  pull_request:
    paths:
      - 'config/wal-a01-authority-baseline.json'
      - 'docs/WAL-A01-AUTHORITY-BASELINE.md'
      - 'scripts/audit-wal-a01-authority-baseline.js'
      - 'scripts/test-wal-a01-authority-baseline.js'
      - 'assets/js/repositories/wallet-repository.js'
      - 'assets/js/repositories/finance-repository.js'
      - 'backend/modules/wallet/**'
      - 'supabase/migrations/005_wallet_runtime_foundation.sql'
      - 'supabase/migrations/014_finance_wallet_shared_runtime.sql'
      - 'supabase/migrations/107_financial_rpc_authority.sql'
      - 'config/domain-completion-matrix.json'
      - '.github/workflows/wal-a01-authority-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wal-a01-authority-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax
        run: |
          node --check scripts/audit-wal-a01-authority-baseline.js
          node --check scripts/test-wal-a01-authority-baseline.js

      - name: Audit authority baseline
        run: node scripts/audit-wal-a01-authority-baseline.js

      - name: Conformance
        run: node scripts/test-wal-a01-authority-baseline.js

      - name: Diff hygiene
        run: git diff --check
