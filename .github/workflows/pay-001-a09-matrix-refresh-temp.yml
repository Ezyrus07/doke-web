name: Doke PAY-A09 Matrix Refresh Temporary

on:
  pull_request:
    paths:
      - '.github/workflows/pay-001-a09-matrix-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pay/pay-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pay/pay-001-baseline-audit
          fetch-depth: 0
      - name: Verify exact event head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate and validate matrix derivatives
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix
          npm run audit:pay-001-a09-deployment-inspection-handoff
          npm run test:pay-001-a09-deployment-inspection-handoff
          git diff --check
      - name: Verify bounded derivative changes
        run: |
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              docs/DOMAIN-COMPLETION-MATRIX.md|reports/generated/domain-completion-matrix-report.json) ;;
              *) echo "Unexpected derivative change: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git fetch origin pay/pay-001-baseline-audit
          test "$(git rev-parse origin/pay/pay-001-baseline-audit)" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish refreshed derivatives
        run: |
          if git diff --quiet -- docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json; then
            echo 'Matrix derivatives already current.'
            exit 0
          fi
          git config user.name 'doke-pay-a09-bot'
          git config user.email 'doke-pay-a09-bot@users.noreply.github.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git commit -m 'Refresh PAY-A09 domain matrix derivatives'
          git push origin HEAD:pay/pay-001-baseline-audit
