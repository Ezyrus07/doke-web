name: ORD-A07D Deploy Readiness Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07d-deploy-readiness-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07D deploy readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['audit:ord-001-a07d-edge-function-staging-deploy-readiness'] = 'node scripts/audit-ord-001-a07d-edge-function-staging-deploy-readiness.js';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.37';
          matrix.updatedAt = '2026-07-30T21:18:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');
          const appendUnique = (array, values) => { for (const value of values) if (!array.includes(value)) array.push(value); };
          appendUnique(ord.requiredPaths, [
            'config/ord-001-a07d-edge-function-staging-deploy-readiness.json',
            'docs/ORD-001-A07D-EDGE-FUNCTION-STAGING-DEPLOY-READINESS.md',
            'scripts/audit-ord-001-a07d-edge-function-staging-deploy-readiness.js',
            '.github/workflows/ord-001-a07d-edge-function-staging-deploy-readiness.yml'
          ]);
          appendUnique(ord.tests, ['audit:ord-001-a07d-edge-function-staging-deploy-readiness']);
          appendUnique(ord.evidence, [
            'ORD-A07D staging deploy readiness freezes the complete six-file order-event-worker bundle, including deno.json and the pinned Supabase JS import map.',
            'Read-only staging inspection records order-event-worker version 9 as ACTIVE with verify_jwt false; the deploy contract requires verify_jwt to remain false because the private Cron authenticates by worker token rather than Authorization JWT.',
            'The deploy gate has no deploy capability, requires an exact independent authorization phrase, and keeps remote canary, production, Railway and merge blocked.'
          ]);
          ord.nextActions = ord.nextActions.filter((action) => !/prepare.*edge function.*deploy.*readiness|a07d.*deploy.*readiness/i.test(action));
          appendUnique(ord.nextActions, [
            'Deploy the frozen order-event-worker bundle to Doke staging only after the exact A07D authorization phrase, preserve verify_jwt false, perform read-only post-deploy verification, and require separate authorization for the remote replay canary.'
          ]);
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE
          node scripts/audit-ord-001-a07d-edge-function-staging-deploy-readiness.js
          node scripts/audit-ord-001-a07d-edge-function-freshness-wiring.js
          node scripts/audit-ord-001-a07c-staging-migration-application.js
          node scripts/audit-ord-001-a07b-staging-migration-application.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js
          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07D deploy readiness evidence' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
