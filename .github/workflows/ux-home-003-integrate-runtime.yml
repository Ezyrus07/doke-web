name: UX-HOME-003 Runtime Integration Executor

on:
  push:
    branches:
      - ux/ux-home-003-rail-scroll
    paths:
      - '.github/workflows/ux-home-003-integrate-runtime.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ux/ux-home-003-rail-scroll
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply exact runtime integration
        shell: python
        run: |
          from pathlib import Path

          home = Path('assets/js/pages/home.js')
          text = home.read_text(encoding='utf-8')

          declarations = '''const catégoryTrack = document.querySelector("[data-catégory-track]");
          const catégoryArrows = document.querySelectorAll("[data-catégory-arrow]");
          const railArrows = document.querySelectorAll("[data-rail-arrow]");
          '''
          if text.count(declarations) != 1:
              raise SystemExit(f'expected one legacy declaration block, found {text.count(declarations)}')
          text = text.replace(declarations, '', 1)

          init_anchor = '''const initHomeBeforeAfter = window.DokeHomeBeforeAfter?.create({ signal }) || (() => {});
          const initHomeWorkers = window.DokeHomeWorkers?.create({ signal }) || (() => {});

          '''
          init_replacement = '''const initHomeBeforeAfter = window.DokeHomeBeforeAfter?.create({ signal }) || (() => {});
          const initHomeWorkers = window.DokeHomeWorkers?.create({ signal }) || (() => {});
          window.Doke?.homeRailScrollSurface?.bind?.({ signal });

          '''
          if text.count(init_anchor) != 1:
              raise SystemExit(f'expected one Home init anchor, found {text.count(init_anchor)}')
          text = text.replace(init_anchor, init_replacement, 1)

          legacy = '''const bindScrollRail = ({ track, arrows, directionAttr, amountFactor }) => {
            if (!track || !arrows.length) return;

            arrows.forEach((arrow) => {
              arrow.addEventListener("click", () => {
                const direction = arrow.dataset[directionAttr] === "next" ? 1 : -1;
                const amount = Math.max(220, Math.round(track.clientWidth * amountFactor));
                track.scrollBy({ left: amount * direction, behavior: "smooth" });
              });
            });
          };

          bindScrollRail({
            track: catégoryTrack,
            arrows: catégoryArrows,
            directionAttr: "catégoryArrow",
            amountFactor: 0.45
          });

          railArrows.forEach((arrow) => {
            const targetId = arrow.dataset.railTarget;
            if (!targetId) return;
            const track = document.getElementById(targetId);
            if (!track) return;

            bindScrollRail({
              track,
              arrows: [arrow],
              directionAttr: "railArrow",
              amountFactor: 0.82
            });
          });


          '''
          if text.count(legacy) != 1:
              raise SystemExit(f'expected one legacy rail binding block, found {text.count(legacy)}')
          text = text.replace(legacy, '', 1)
          home.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          script_anchor = '''  <script src="assets/js/pages/home/workers.js?v=20260628-route-scroll-v1"></script>
            <script src="assets/js/pages/home.js?v=20260719-onboarding-no-flash-v1"></script>
          '''
          script_replacement = '''  <script src="assets/js/pages/home/workers.js?v=20260628-route-scroll-v1"></script>
            <script src="assets/js/pages/home/rail-scroll-state.js?v=20260808-ux-home-003-v1"></script>
            <script src="assets/js/pages/home/rail-scroll-surface.js?v=20260808-ux-home-003-v1"></script>
            <script src="assets/js/pages/home.js?v=20260808-ux-home-003-v1"></script>
          '''
          if html.count(script_anchor) != 1:
              raise SystemExit(f'expected one Home script anchor, found {html.count(script_anchor)}')
          html = html.replace(script_anchor, script_replacement, 1)
          index.write_text(html, encoding='utf-8')

      - name: Validate integration contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/pages/home.js
          node --check assets/js/pages/home/rail-scroll-state.js
          node --check assets/js/pages/home/rail-scroll-surface.js
          node scripts/test-ux-home-003-rail-scroll-state.js
          node scripts/test-ux-home-003-rail-scroll-surface.js
          node scripts/test-ux-home-002-more-services-state.js
          node scripts/test-ux-home-002-more-services-surface.js
          node scripts/test-ux-home-001-rail-state.js
          test "$(grep -Fc 'homeRailScrollSurface?.bind?.({ signal })' assets/js/pages/home.js)" -eq 1
          test "$(grep -Fc 'const bindScrollRail' assets/js/pages/home.js)" -eq 0
          test "$(grep -Fc 'const railArrows' assets/js/pages/home.js)" -eq 0
          test "$(grep -Fc 'const catégoryArrows' assets/js/pages/home.js)" -eq 0
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          state = html.index('assets/js/pages/home/rail-scroll-state.js')
          surface = html.index('assets/js/pages/home/rail-scroll-surface.js')
          home = html.index('assets/js/pages/home.js')
          assert state < surface < home, (state, surface, home)
          PY
          git diff --check

      - name: Commit canonical runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doke-ci'
          git config user.email 'doke-ci@users.noreply.github.com'
          git add assets/js/pages/home.js index.html
          git diff --cached --quiet && { echo '::error::No canonical integration diff produced.'; exit 1; }
          git commit -m 'feat(ux-home-003): integrate rail scroll authority'
          git push origin HEAD:ux/ux-home-003-rail-scroll
