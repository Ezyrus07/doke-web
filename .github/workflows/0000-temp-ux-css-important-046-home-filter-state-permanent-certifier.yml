name: TEMP UX-CSS-IMPORTANT-046 Home Filter State Permanent Certifier
on:
  push:
    branches:
      - diag/ux-css-important-046-home-filter-state-permanent-certifier
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  certify:
    if: "${{ github.event.head_commit.message != 'diagnostic(ux-css-important-046): record permanent certification' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PARENT: 53e5733a4fb7cd293cc2ab17bd53f64338a72b8d
      PARENT_TREE: 4958068fa2e44aee05e390fae0af5ad18c633947
      PERM: 526c113eb4c0f1b05b3558dcefcf44269406300f
      PERM_TREE: 142dff93c8d6b01a1096bd83bd4b3d9f697a4239
      TARGET: assets/css/pages/home/mobile-hero-feed.css
      PARENT_BLOB: e3547c5ebeb6ddbcd5a934244c2d372eabcef9ba
      PERM_BLOB: 5c97346c40496a0b13e4ad1b509a91adcf7638e1
      PERM_SHA256: 40705c0b40ca3ef4d6f0252b9119e709d6673d1e5738fe9b8813df115f76bfa0
      R3_RECEIPT_BLOB: 975e7bd75ee8c0b36270de27bb33c50c6091c54e
      PR_NUMBER: 380
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify permanent lineage PR and evidence identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PERM^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PARENT:$TARGET")" = "$PARENT_BLOB"
          test "$(git rev-parse "$PERM:$TARGET")" = "$PERM_BLOB"
          test "$(git rev-list --parents -n1 "$PERM")" = "$PERM $PARENT"
          test "$(git merge-base "$PARENT" "$PERM")" = "$PARENT"
          test "$(git rev-list --count "$PARENT..$PERM")" = 1
          test "$(git rev-list --count "$PERM..$PARENT")" = 0
          test "$(git diff --name-only "$PARENT" "$PERM")" = "$TARGET"
          test "$(git diff --numstat "$PARENT" "$PERM" -- "$TARGET")" = $'10\t10\tassets/css/pages/home/mobile-hero-feed.css'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/pr.json
          for id in 32915721760 32915875216 32916219006; do curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$id" > "/tmp/run-$id.json"; done
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),path=require('path');
          const pr=JSON.parse(fs.readFileSync('/tmp/pr.json'));
          if(pr.state!=='open'||pr.draft!==true||pr.merged_at!==null||pr.mergeable!==true)throw Error(`pr state ${pr.state}/${pr.draft}/${pr.merged_at}/${pr.mergeable}`);
          if(pr.base.sha!==process.env.PARENT||pr.head.sha!==process.env.PERM||pr.commits!==1||pr.changed_files!==1||pr.additions!==10||pr.deletions!==10)throw Error('pr identity drift');
          for(const id of [32915721760,32915875216,32916219006]){const r=JSON.parse(fs.readFileSync(`/tmp/run-${id}.json`));if(r.status!=='completed'||r.conclusion!=='success')throw Error(`evidence run ${id}: ${r.status}/${r.conclusion}`)}
          const show=(rev,file)=>cp.execFileSync('git',['show',`${rev}:${file}`],{encoding:'utf8'}),f=process.env.TARGET,p=show(process.env.PARENT,f),q=show(process.env.PERM,f);let n=0,r=0;
          const c=p.replace(/\s*!important\b/gi,m=>{n++;if(n>=56&&n<=65){r++;return ''}return m});
          if(n!==127||r!==10||c!==q||(q.match(/!important\b/gi)||[]).length!==117)throw Error(`ordinal identity ${n}/${r}`);
          if(p.replace(/\s*!important\b/gi,'')!==q.replace(/\s*!important\b/gi,''))throw Error('marker-only drift');
          const sha=crypto.createHash('sha256').update(q).digest('hex');if(sha!==process.env.PERM_SHA256||Buffer.byteLength(q)!==37087)throw Error(`sha/bytes ${sha}/${Buffer.byteLength(q)}`);
          fs.writeFileSync('/tmp/parent.css',p);fs.writeFileSync('/tmp/permanent.css',q);
          console.log('PERMANENT_IDENTITY=PASS');
          NODE
          git checkout --detach "$PARENT" >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');const a=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,e.name);e.isDirectory()?w(q):q.endsWith('.css')&&a.push(q)}})('assets/css');const n=a.reduce((s,q)=>s+(fs.readFileSync(q,'utf8').match(/!important\b/gi)||[]).length,0);if(n!==169)throw Error(`parent global ${n}`);console.log('PARENT_GLOBAL='+n);
          NODE
          git checkout --detach "$PERM" >/dev/null
          node <<'NODE'
          const fs=require('fs'),path=require('path');const a=[];(function w(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,e.name);e.isDirectory()?w(q):q.endsWith('.css')&&a.push(q)}})('assets/css');const n=a.reduce((s,q)=>s+(fs.readFileSync(q,'utf8').match(/!important\b/gi)||[]).length,0);if(n!==159)throw Error(`permanent global ${n}`);console.log('PERMANENT_GLOBAL='+n);
          NODE
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT" >/dev/null
          npm ci --ignore-scripts >/dev/null
      - name: Independently rerun and reconcile 14 static gates
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/matrix.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1"; candidate="$2"; : > "/tmp/$phase.tsv"
          restore(){ git checkout "$PARENT" -- . >/dev/null 2>&1 || exit 90; if [ "$candidate" = 1 ]; then cp /tmp/permanent.css "$TARGET"; fi; return 0; }
          gate(){ label="$1"; shift; restore; log="/tmp/$phase-$label.log"; set +e; "$@" >"$log" 2>&1; rc=$?; set -e; sed -E 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$log" >"$log.n"; h=$(sha256sum "$log.n"|awk '{print $1}'); printf '%s\t%s\t%s\n' "$label" "$rc" "$h" >>"/tmp/$phase.tsv"; echo "$phase|$label|rc=$rc|hash=$h"; return 0; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/matrix.sh
          /tmp/matrix.sh parent 0
          /tmp/matrix.sh permanent 1
          node <<'NODE'
          const fs=require('fs'),read=f=>Object.fromEntries(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [k,rc,h]=x.split('\t');return[k,{rc:+rc,h}]}));const p=read('/tmp/parent.tsv'),c=read('/tmp/permanent.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'],debt=['important_reduction_plan','global_css_design_system'],rows=[];
          for(const k of exact){const a=p[k],b=c[k];if(!a||!b||a.rc!==b.rc||(a.rc!==0&&a.h!==b.h))throw Error(`static regression ${k}`);rows.push({label:k,classification:a.rc===0?'PASS_BOTH':'BASELINE_EQUIVALENT_FAILURE'});}
          for(const k of debt){const a=p[k],b=c[k];if(!a||!b||b.rc>a.rc)throw Error(`debt regression ${k}`);rows.push({label:k,classification:b.rc<a.rc?'CANDIDATE_IMPROVES_BASELINE':'EXPECTED_DEBT_DELTA'});}
          if(p.frontend_strict.rc!==c.frontend_strict.rc)throw Error('frontend rc drift');const sig=f=>fs.readFileSync(f,'utf8').split('\n').filter(x=>x.includes('**CRITICAL**')||x.includes('**WARNING**')).sort();if(JSON.stringify(sig('/tmp/parent-frontend_strict.log'))!==JSON.stringify(sig('/tmp/permanent-frontend_strict.log')))throw Error('frontend warning drift');rows.push({label:'frontend_strict',classification:'BASELINE_EQUIVALENT_EXPECTED_DEBT_DELTA'});
          fs.writeFileSync('/tmp/static.json',JSON.stringify({result:'PASS',rows,introducedRegressions:0,criteriaRelaxed:0}));console.log('PERMANENT_STATIC=PASS');
          NODE
          git checkout "$PARENT" -- .
          cp /tmp/parent.css "$TARGET"
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Independently rerun permanent browser A B
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT" >/dev/null
          cp /tmp/parent.css "$TARGET"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true; cp /tmp/parent.css "$TARGET" 2>/dev/null || true' EXIT
          sleep 1
          NODE_PATH="$PWD/node_modules" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('@playwright/test');
          (async()=>{const f=process.env.TARGET,P=fs.readFileSync('/tmp/parent.css','utf8'),C=fs.readFileSync('/tmp/permanent.css','utf8');const widths=[359,379,380,381,390,430,560,561],filter=new Set([359,380,390,560]),states=[];for(const w of widths){states.push([w,'default']);if(filter.has(w))states.push([w,'filters'])}
          const H=b=>crypto.createHash('sha256').update(b).digest('hex'),tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64'),items=Array.from({length:8},(_,i)=>({id:'c46-'+i,serviceId:'c46-'+i,status:'active',title:'Serviço '+i,category:'Reformas',providerName:'Prof '+i,providerHandle:'p'+i,rating:4.9,reviewsCount:20+i,price:120+i,location:'Salvador, BA',tags:['seguro']}));
          const sels=['.home-mobile-hero__location','.home-catégory','.home-catégory__icon','.home-mobile-hero__profile','.doke-search-panel__form','.home-search-hero__field','.doke-search-panel__input','.home-search-hero__mobile-submit','.home-search-hero__audio-button','#featured-services-track','.featured-services .home-section-header','.featured-services .home-section-title','[data-more-filters-panel]','.more-filters__header','.more-filters__dismiss','.more-filters__split-body','.more-filters__split-nav','.more-filters__split-content','.more-filters__pane:not([hidden])','.more-filters__actions'];const browser=await chromium.launch({headless:true});
          async function cap(w,state,phase){const c=await browser.newContext({viewport:{width:w,height:1050},reducedMotion:'reduce'}),p=await c.newPage(),errs=[];let loaded=false;p.on('pageerror',e=>errs.push(e.message));p.on('request',r=>{try{if(new URL(r.url()).pathname==='/'+f)loaded=true}catch{}});await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:4173/'))return r.continue();if(u.startsWith('https://images.pexels.com/'))return r.fulfill({status:200,contentType:'image/png',body:tiny});return r.abort()});await p.goto(`http://127.0.0.1:4173/index.html?c46=permanent-${phase}-${w}-${state}`,{waitUntil:'domcontentloaded',timeout:15000});await p.waitForLoadState('networkidle',{timeout:7000}).catch(()=>{});await p.waitForFunction(()=>Boolean(window.Doke?.publicServiceCard?.create),null,{timeout:7000});await p.evaluate(items=>{const a=document.querySelector('#featured-services-track'),b=document.querySelector('[data-more-services-grid]');if(!a||!b)throw Error('grids');a.textContent='';b.textContent='';items.slice(0,6).forEach(x=>a.appendChild(window.Doke.publicServiceCard.create(x)));items.slice(6).forEach(x=>b.appendChild(window.Doke.publicServiceCard.create(x,{results:true})))},items);if(state==='filters'){await p.waitForFunction(()=>Boolean(window.DokeHomeFiltersApi?.open),null,{timeout:7000});await p.evaluate(()=>window.DokeHomeFiltersApi.open('tabs'));await p.waitForFunction(()=>{const x=document.querySelector('[data-more-filters-panel]');return document.body.classList.contains('home-filter-sheet-open')&&Boolean(x&&!x.hidden&&x.getAttribute('aria-hidden')!=='true')},null,{timeout:4000})}await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;}'});await p.waitForTimeout(150);const data=await p.evaluate(sels=>{const pick=s=>{const e=document.querySelector(s);if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return{d:c.display,p:c.position,v:c.visibility,o:c.opacity,ov:c.overflow,ox:c.overflowX,oy:c.overflowY,w:c.width,h:c.height,minh:c.minHeight,maxh:c.maxHeight,maxw:c.maxWidth,f:c.flex,g:c.gridTemplateColumns,gap:c.gap,i:c.inset,t:c.top,ri:c.right,b:c.bottom,l:c.left,tr:c.transform,z:c.zIndex,r:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*100)/100)}};return{body:document.body.className,root:document.documentElement.className,dw:document.documentElement.scrollWidth,dh:document.documentElement.scrollHeight,filterOpen:document.body.classList.contains('home-filter-sheet-open'),styles:sels.map(pick)}},sels);const png=H(await p.screenshot({fullPage:true,animations:'disabled'}));await c.close();return{data,png,errs,loaded}}
          fs.writeFileSync(f,P);const base={};for(const [w,s] of states)base[`${w}-${s}`]=await cap(w,s,'parent');fs.writeFileSync(f,C);let md=0,sd=0,ld=0,pe=0;const diffs=[];for(const [w,s] of states){const k=`${w}-${s}`,a=base[k],b=await cap(w,s,'permanent');pe+=a.errs.length+b.errs.length;if(JSON.stringify(a.data)!==JSON.stringify(b.data)){md++;diffs.push('meta:'+k)}if(a.png!==b.png){sd++;diffs.push('png:'+k)}if(a.loaded!==b.loaded){ld++;diffs.push('load:'+k)}}fs.writeFileSync(f,P);await browser.close();const out={result:(!md&&!sd&&!ld&&!pe)?'PASS':'FAIL',states:states.length,filterStates:filter.size,metadataDiffs:md,screenshotDiffs:sd,loadDiffs:ld,pageErrors:pe,diffKeys:diffs};fs.writeFileSync('/tmp/browser.json',JSON.stringify(out));console.log('PERMANENT_BROWSER='+JSON.stringify(out));if(out.result!=='PASS')process.exit(2)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cp /tmp/parent.css "$TARGET"
      - name: Record independent permanent certification receipt
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA" >/dev/null
          mkdir -p .diagnostics
          node <<'NODE'
          const fs=require('fs');const receipt={result:'PASS',checkpoint:'UX-CSS-IMPORTANT-046',phase:'PERMANENT_CERTIFICATION',pr:380,parentSha:process.env.PARENT,parentTree:process.env.PARENT_TREE,permanentSha:process.env.PERM,permanentTree:process.env.PERM_TREE,target:process.env.TARGET,parentBlob:process.env.PARENT_BLOB,permanentBlob:process.env.PERM_BLOB,sha256:process.env.PERM_SHA256,bytes:37087,importantBefore:127,importantAfter:117,parentGlobal:169,permanentGlobal:159,globalDelta:-10,removedOrdinals:[56,57,58,59,60,61,62,63,64,65],markerOnly:true,selectorsRemoved:0,declarationsRemoved:0,propertiesChanged:0,valuesChanged:0,importsPreserved:true,lineage:{oneParent:true,mergeBaseExact:true,ahead:1,behind:0,diffFiles:1,additions:10,deletions:10},prState:{open:true,draft:true,unmerged:true,mergeable:true},priorEvidence:{staticRun:32915721760,staticJob:98018905585,browserRun:32915875216,browserJobs:[98019368950,98019369003,98019368868],materializationRun:32916219006,materializationJob:98020376595,materializationReceiptBlob:process.env.R3_RECEIPT_BLOB},static:JSON.parse(fs.readFileSync('/tmp/static.json')),browser:JSON.parse(fs.readFileSync('/tmp/browser.json')),introducedRegressions:0,criteriaRelaxed:0,repositoryOnly:true,staging:false,production:false,backend:false,supabase:false,rpc:false,migrations:false,credentials:false,runtimeRealtime:false,merge:false,readyForReview:false,forcePush:false,historyRewrite:false,runId:+process.env.GITHUB_RUN_ID};fs.writeFileSync('.diagnostics/ux-css-important-046-home-filter-state-permanent-certification.json',JSON.stringify(receipt,null,2)+'\n');
