name: Doke Temporary MSG-A05 Cumulative Repair

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msg-a05-cumulative-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'msg/msg-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 100
      - name: Freeze repair head
        run: |
          git merge-base --is-ancestor efecb8d82abcb3e722380f8d172142bdf533fa0d HEAD
          echo "RUN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded cumulative repair
        run: |
          node --check scripts/repair-msg-a05-cumulative-temporary.js
          node scripts/repair-msg-a05-cumulative-temporary.js
          node --check scripts/audit-msg-001-a01-authority-baseline.js
          git diff --check
          test "$(git diff --name-only)" = "scripts/audit-msg-001-a01-authority-baseline.js"
      - name: Publish cumulative audit repair
        run: |
          git fetch origin msg/msg-001-baseline-audit --depth=1
          test "$(git rev-parse origin/msg/msg-001-baseline-audit)" = "$RUN_HEAD"
          git add scripts/audit-msg-001-a01-authority-baseline.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(msg): evolve cumulative attachment authority audit"
          git push origin HEAD:msg/msg-001-baseline-audit
