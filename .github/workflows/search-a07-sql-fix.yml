name: Doke SEARCH-A07 SQL Fix Once

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-a07-sql-fix.yml'
      - 'scripts/search-a07-fix-sql-once.js'

permissions:
  contents: write

jobs:
  fix-search-a07-sql:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply deterministic SQL syntax fix
        run: node scripts/search-a07-fix-sql-once.js

      - name: Remove one-time applicator
        run: rm scripts/search-a07-fix-sql-once.js .github/workflows/search-a07-sql-fix.yml

      - name: Verify normalized SQL
        run: |
          ! grep -q 'pg_catalog\.greatest' supabase/migrations/160_service_search_ranking_v1.sql
          ! grep -q 'pg_catalog\.least' supabase/migrations/160_service_search_ranking_v1.sql
          ! grep -q 'pg_catalog\.extract' supabase/migrations/160_service_search_ranking_v1.sql
          git diff --check

      - name: Commit normalized migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/160_service_search_ranking_v1.sql
          git add -u scripts/search-a07-fix-sql-once.js .github/workflows/search-a07-sql-fix.yml
          git commit -m "Normalize SEARCH-A07 PostgreSQL expressions"
          git push origin HEAD:${TARGET_BRANCH}
