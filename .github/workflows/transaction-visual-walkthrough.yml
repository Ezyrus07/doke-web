name: Doke Transaction Visual Walkthrough

on:
  push:
    branches: [ agent/visual-transaction-walkthrough ]
  pull_request:
    branches: [ MAIN ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doke-transaction-walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare evidence directory
        run: |
          mkdir -p reports/generated/transaction-walkthrough
          printf '{"runId":"%s","sha":"%s","ref":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF" > reports/generated/transaction-walkthrough/run-metadata.json
      - name: Execute transaction walkthrough
        shell: bash
        run: |
          set +e
          node node_modules/@playwright/test/cli.js test tests/visual/transaction-walkthrough.spec.js --project=chromium 2>&1 | tee reports/generated/transaction-walkthrough/console.log
          code=${PIPESTATUS[0]}
          exit "$code"
        env:
          DOKE_TRANSACTION_WALKTHROUGH_OUTPUT: reports/generated/transaction-walkthrough
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doke-transaction-visual-walkthrough
          path: |
            reports/generated/transaction-walkthrough/
            reports/generated/playwright-results.json
            reports/generated/playwright-html/
            test-results/
          if-no-files-found: error
          retention-days: 14
