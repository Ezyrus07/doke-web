name: ORD-A07B Readiness Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07b-readiness-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07B readiness registry and matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(packageJson.scripts, {
            'test:ord-001-a07b-staging-migration-readiness': 'node scripts/test-ord-001-a07b-staging-migration-readiness.js',
            'audit:ord-001-a07b-staging-migration-readiness': 'node scripts/audit-ord-001-a07b-staging-migration-readiness.js',
            'plan:ord-001-a07b-staging-migration:dry-run': 'node scripts/plan-ord-001-a07b-staging-migration.js --dry-run',
            'plan:ord-001-a07b-staging-migration:check-env': 'node scripts/plan-ord-001-a07b-staging-migration.js --check-env'
          });
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.30';
          matrix.updatedAt = '2026-07-30T12:12:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'config/ord-001-a07b-staging-migration-readiness.json',
            'scripts/plan-ord-001-a07b-staging-migration.js',
            'scripts/test-ord-001-a07b-staging-migration-readiness.js',
            'scripts/audit-ord-001-a07b-staging-migration-readiness.js',
            'docs/ORD-001-A07B-STAGING-MIGRATION-READINESS.md',
            'docs/validation/ORD-001-A07B-STAGING-MIGRATION-READINESS.json',
            '.github/workflows/ord-001-a07b-staging-migration-readiness.yml'
          ]);
          appendUnique(ord.tables, ['private.order_event_worker_invocation_nonces']);
          appendUnique(ord.tests, [
            'test:ord-001-a07b-staging-migration-readiness',
            'audit:ord-001-a07b-staging-migration-readiness',
            'plan:ord-001-a07b-staging-migration:dry-run'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07B readiness pins the canonical nonce-ledger migration by SHA-256 and rejects renamed, regenerated or edited variants.',
            'A read-only staging preflight proved the ledger table, consume RPC and migration history entry remain absent while pgcrypto and required extension access are available.',
            'Generic continuation commands do not authorize staging SQL; only the exact migration authorization phrase can unlock a later application path.',
            'The readiness planner exposes dry-run and check-env only, has no execute mode, performs zero network requests and preserves production, Cron and Edge Function blocks.',
            'Rollback is forward-only through a separately reviewed migration; manual migration-history deletion is prohibited.'
          ]);
          appendUnique(ord.nextActions, [
            'Apply the canonical ORD-A07B nonce ledger migration to staging only after exact authorization, then run read-only grant, RLS, atomicity and zero-drift verification.'
          ]);
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/test-ord-001-a07b-staging-migration-readiness.js
          node scripts/plan-ord-001-a07b-staging-migration.js --dry-run
          node scripts/audit-ord-001-a07b-staging-migration-readiness.js
          node scripts/test-order-event-worker-invocation-freshness.js
          node scripts/audit-ord-001-a07b-worker-invocation-freshness.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07B staging migration readiness' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
