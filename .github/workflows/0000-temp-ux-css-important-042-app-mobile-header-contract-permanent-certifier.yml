name: TEMP UX-CSS-IMPORTANT-042 Permanent Certification

on:
  push:
    branches:
      - diag/ux-css-important-042-app-mobile-header-contract-permanent-certifier
    paths:
      - .github/workflows/0000-temp-ux-css-important-042-app-mobile-header-contract-permanent-certifier.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  permanent-certifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DIAG_SHA: ${{ github.sha }}
      OUTPUT_BRANCH: diag/ux-css-important-042-app-mobile-header-contract-permanent-certifier
      WORKFLOW_FILE: .github/workflows/0000-temp-ux-css-important-042-app-mobile-header-contract-permanent-certifier.yml
      RECEIPT_FILE: .diagnostics/ux-css-important-042-app-mobile-header-contract-permanent-certification.json
      PARENT_SHA: bbcfa17c8fd5ea5070baf0f77b9e2451840209a9
      PARENT_TREE: ebd6f2afd9b84f54f3a34763266d55e34a9451ac
      PERM_SHA: deb8aebc0235fda21f820d7dbfe1e0035f582111
      PERM_TREE: b3c52048119014a8c9b04b4355db7f92d6689239
      TARGET_FILE: assets/css/components/navigation/app-mobile-header-contract.css
      PARENT_BLOB: 87c1a677b3eb59b088063dbe8e7c7a4ed6d73f25
      PERM_BLOB: 3b16ae088ae3d9b758164091bdafc6f49a05ce85
      PERM_SHA256: a271d2fcdaf765c68ffc923f15eb5e30d1efb5932c3e59c4c6ab22e2b48a26ad
      PERM_BYTES: '36498'
      PARENT_GLOBAL: '4745'
      PERM_GLOBAL: '4045'
      PR_NUMBER: '370'
      BASE_BRANCH: ux/ux-css-important-041-app-header-dormant-priority
      PERM_BRANCH: ux/ux-css-important-042-app-mobile-header-contract-dormant-priority
      R1_BRANCH: diag/ux-css-important-042-app-mobile-header-contract-r1c
      R1_FILE: .diagnostics/ux-css-important-042-app-mobile-header-contract-r1c.json
      R1_BLOB: a4e495ab747ac2d1db419049c5d94e7ac3180fda
      R2_BRANCH: diag/ux-css-important-042-app-mobile-header-contract-candidate-r2
      R2_FILE: .diagnostics/ux-css-important-042-app-mobile-header-contract-candidate-r2.json
      R2_BLOB: 717f5002655b407c00ef2f6c8c05e2b52f58c9cc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Freeze permanent identity lineage and PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PERM_SHA^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PERM_SHA^")" = "$PARENT_SHA"
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          test "$(git rev-parse "$PARENT_SHA:$TARGET_FILE")" = "$PARENT_BLOB"
          test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git merge-base "$PARENT_SHA" "$PERM_SHA")" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..$PERM_SHA")" = 1
          test "$(git merge-base "$PERM_SHA" "$DIAG_SHA")" = "$PERM_SHA"
          test "$(git rev-list --count "$PERM_SHA..$DIAG_SHA")" = 1
          test "$(git diff --name-only "$PERM_SHA"..."$DIAG_SHA")" = "$WORKFLOW_FILE"
          test "$(git diff --name-only "$PARENT_SHA"..."$PERM_SHA")" = "$TARGET_FILE"
          test "$(git diff --numstat "$PARENT_SHA"..."$PERM_SHA")" = $'700\t700\t'"$TARGET_FILE"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >/tmp/pr.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/pr.json','utf8'));
          const ok=p.state==='open'&&p.draft===true&&p.merged_at===null&&p.mergeable===true&&p.head?.ref===process.env.PERM_BRANCH&&p.head?.sha===process.env.PERM_SHA&&p.base?.ref===process.env.BASE_BRANCH&&p.base?.sha===process.env.PARENT_SHA;
          if(!ok) throw new Error(`PR freeze failed state=${p.state} draft=${p.draft} merged=${p.merged_at} mergeable=${p.mergeable} head=${p.head?.ref}/${p.head?.sha} base=${p.base?.ref}/${p.base?.sha}`);
          fs.writeFileSync('/tmp/pr-facts.json',JSON.stringify({number:p.number,state:p.state,draft:p.draft,merged:false,mergeable:p.mergeable,head:p.head.sha,base:p.base.sha},null,2)+'\n');
          NODE

      - name: Transfer exact R1 and R2 receipts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$R1_BRANCH:refs/remotes/origin/$R1_BRANCH" "refs/heads/$R2_BRANCH:refs/remotes/origin/$R2_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$R1_BRANCH:$R1_FILE")" = "$R1_BLOB"
          test "$(git rev-parse "refs/remotes/origin/$R2_BRANCH:$R2_FILE")" = "$R2_BLOB"
          git show "refs/remotes/origin/$R1_BRANCH:$R1_FILE" >/tmp/r1.json
          git show "refs/remotes/origin/$R2_BRANCH:$R2_FILE" >/tmp/r2.json
          node <<'NODE'
          const fs=require('fs'),r1=JSON.parse(fs.readFileSync('/tmp/r1.json','utf8')),r2=JSON.parse(fs.readFileSync('/tmp/r2.json','utf8'));
          if(r1.result!=='PASS'||r1.checkpoint!=='UX-CSS-IMPORTANT-042'||r1.product?.sha!==process.env.PARENT_SHA||r1.product?.tree!==process.env.PARENT_TREE) throw Error('R1 identity mismatch');
          if(r1.target?.path!==process.env.TARGET_FILE||r1.target?.blob!==process.env.PARENT_BLOB||r1.target?.important!==700||r1.target?.importantSites!==700||r1.target?.unresolvedImportantSites!==0) throw Error('R1 target mismatch');
          if(r1.reach?.wholeFileDormant!==true||r1.reach?.browserReconciliationRequired!==false||(r1.reach?.targetPages||[]).length||(r1.reach?.directImporters||[]).length||(r1.reach?.directHtmlRefs||[]).length||(r1.reach?.runtimeJsRefs||[]).length) throw Error('R1 reach mismatch');
          if(r1.criteria?.criteriaRelaxed!==0||r1.criteria?.productMutation!==false) throw Error('R1 governance mismatch');
          if(r2.result!=='PASS'||r2.checkpoint!=='UX-CSS-IMPORTANT-042'||r2.parent?.sha!==process.env.PARENT_SHA||r2.parent?.tree!==process.env.PARENT_TREE||r2.parent?.targetBlob!==process.env.PARENT_BLOB) throw Error('R2 identity mismatch');
          if(r2.candidate?.gitBlob!==process.env.PERM_BLOB||r2.candidate?.sha256!==process.env.PERM_SHA256||r2.candidate?.bytes!==Number(process.env.PERM_BYTES)||r2.candidate?.importantBefore!==700||r2.candidate?.importantAfter!==0||r2.candidate?.markerOnly!==true) throw Error('R2 candidate mismatch');
          if(r2.staticMatrix?.introducedRegressions!==0||r2.staticMatrix?.criteriaRelaxed!==0||r2.browserRequired!==false) throw Error('R2 governance mismatch');
          NODE

      - name: Independently reconstruct candidate and global debt
        shell: bash
        run: |
          set -euo pipefail
          git show "$PARENT_SHA:$TARGET_FILE" >/tmp/parent.css
          git show "$PERM_SHA:$TARGET_FILE" >/tmp/permanent.css
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const p=fs.readFileSync('/tmp/parent.css','utf8'),c=fs.readFileSync('/tmp/permanent.css','utf8');
          const rebuilt=p.replace(/\s*!important\b/gi,'');
          const before=(p.match(/!important\b/gi)||[]).length,after=(c.match(/!important\b/gi)||[]).length;
          if(before!==700||after!==0||rebuilt!==c) throw Error(`reconstruction ${before}->${after} eq=${rebuilt===c}`);
          const sha256=crypto.createHash('sha256').update(c).digest('hex');
          if(sha256!==process.env.PERM_SHA256||Buffer.byteLength(c)!==Number(process.env.PERM_BYTES)) throw Error('hash/bytes mismatch');
          const css=cp.execFileSync('git',['ls-tree','-r','--name-only',process.env.PARENT_SHA,'assets/css'],{encoding:'utf8'}).trim().split('\n').filter(x=>x.endsWith('.css'));
          const count=sha=>css.reduce((n,f)=>n+(cp.execFileSync('git',['show',`${sha}:${f}`],{encoding:'utf8'}).match(/!important\b/gi)||[]).length,0);
          const pg=count(process.env.PARENT_SHA),cg=count(process.env.PERM_SHA);
          if(pg!==Number(process.env.PARENT_GLOBAL)||cg!==Number(process.env.PERM_GLOBAL)) throw Error(`global ${pg}->${cg}`);
          fs.writeFileSync('/tmp/comparison.json',JSON.stringify({parent:process.env.PARENT_SHA,parentTree:process.env.PARENT_TREE,permanent:process.env.PERM_SHA,permanentTree:process.env.PERM_TREE,parentBlob:process.env.PARENT_BLOB,permanentBlob:process.env.PERM_BLOB,importantBefore:before,importantAfter:after,globalBefore:pg,globalAfter:cg,globalDelta:cg-pg,markerOnly:true,selectorsRemoved:0,declarationsRemoved:0,propertiesChanged:0,valuesChanged:0,sha256,bytes:Buffer.byteLength(c),additions:700,deletions:700,changedFiles:1,ahead:1,behind:0,mergeBase:process.env.PARENT_SHA},null,2)+'\n');
          NODE

      - name: Independently reprove permanent whole-file dormancy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,posixpath,re,subprocess
          SHA=os.environ['PERM_SHA']; TARGET=os.environ['TARGET_FILE']
          def sh(*a): return subprocess.check_output(a,text=True).rstrip('\n')
          files=sh('git','ls-tree','-r','--name-only',SHA).splitlines(); S=set(files)
          def read(p): return subprocess.check_output(['git','show',f'{SHA}:{p}']).decode('utf8','replace')
          def imports(p):
            src=re.sub(r'/\*.*?\*/','',read(p),flags=re.S);out=[]
            rx=r'@import\s+(?:url\(\s*)?[\'\"]?([^\'\"\)\s;]+\.css(?:\?[^\'\"\)\s;]*)?)[\'\"]?\s*\)?[^;]*;'
            for m in re.finditer(rx,src,re.I):
              x=m.group(1).split('?',1)[0].split('#',1)[0]
              if re.match(r'^[a-z]+://',x,re.I): continue
              out.append(x.lstrip('/') if x.startswith('/') else posixpath.normpath(posixpath.join(posixpath.dirname(p),x)))
            return out
          css=[p for p in files if p.endswith('.css')]; im={p:imports(p) for p in css}; direct=sorted(p for p in css if TARGET in im[p])
          html=sorted(p for p in files if p.endswith('.html') and '/' not in p); lr=re.compile(r'<link\b[^>]*?href\s*=\s*[\'\"]([^\'\"]+)[\'\"][^>]*>',re.I|re.S); starts={}
          for h in html:
            arr=[]
            for x in lr.findall(read(h)):
              x=x.split('?',1)[0].split('#',1)[0]
              if x.endswith('.css') and not re.match(r'^[a-z]+://',x,re.I): arr.append(posixpath.normpath(x.lstrip('/')))
            starts[h]=arr
          def closure(xs):
            seen=set();st=list(xs)
            while st:
              p=st.pop()
              if p in seen or p not in S or not p.endswith('.css'): continue
              seen.add(p);st.extend(im.get(p,[]))
            return seen
          reach={h:closure(xs) for h,xs in starts.items()};pages=sorted(h for h,s in reach.items() if TARGET in s);loaded=set();[loaded.update(s) for s in reach.values()]
          direct_html=sorted(h for h,xs in starts.items() if TARGET in xs);runtime=[]
          for p in files:
            if p.startswith('assets/js/') and p.endswith(('.js','.mjs','.cjs')):
              t=read(p)
              if TARGET in t or posixpath.basename(TARGET) in t: runtime.append(p)
          d={'rootHtmlCount':len(html),'loadedCssCount':len(loaded),'canonicalLoaded':TARGET in loaded,'wholeFileDormant':TARGET not in loaded and not direct and not direct_html and not runtime,'targetPages':pages,'directImporters':direct,'directHtmlRefs':direct_html,'runtimeJsRefs':sorted(runtime),'browserRequired':False,'criteriaRelaxed':0}
          if not d['wholeFileDormant'] or d['canonicalLoaded'] or pages or direct or direct_html or runtime: raise SystemExit(json.dumps(d))
          open('/tmp/dormancy.json','w').write(json.dumps(d,indent=2)+'\n')
          print(json.dumps(d))
          PY

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PERM_SHA" >/dev/null
          git clean -fd >/dev/null
          npm ci --ignore-scripts >/dev/null

      - name: Reexecute parent permanent static governance matrix
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/gates.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          phase="$1";sha="$2";: >"/tmp/${phase}.tsv"
          restore(){ git reset --hard "$sha" >/dev/null 2>&1||exit 90;git clean -fd >/dev/null 2>&1||exit 91; }
          norm(){ sed -E -e 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+-]+Z?/<TIME>/g' -e 's#/home/runner/work/doke-web/doke-web#<ROOT>#g' "$1"; }
          gate(){ l="$1";shift;restore;log="/tmp/${phase}-${l}.log";set +e;"$@">"$log" 2>&1;rc=$?;set -e;norm "$log">"${log}.norm";h="$(sha256sum "${log}.norm"|awk '{print $1}')";printf '%s\t%s\t%s\n' "$l" "$rc" "$h">>"/tmp/${phase}.tsv";echo "$phase|$l|rc=$rc|hash=$h"; }
          set -e
          gate agent_governance node scripts/audit-agent-governance.js
          gate responsive_contract npm run test:responsive-contract
          gate responsive_boundaries npm run audit:responsive-boundaries
          gate css_responsive_conflicts npm run audit:css-responsive-conflicts
          gate shared_card_anatomy npm run audit:shared-card-anatomy
          gate domain_cards npm run audit:domain
          gate duplicate_assets node scripts/audit-duplicate-assets.js
          gate domain_completion_matrix npm run audit:domain-completion-matrix
          gate ad_card_required_info node scripts/test-ad-card-required-info-contract.js
          gate card_loading_parity node scripts/test-card-loading-parity-contract.js
          gate publication_card_narrow_tablet node scripts/test-publication-card-narrow-tablet-contract.js
          gate important_reduction_plan npm run audit:important-reduction-plan
          gate global_css_design_system npm run audit:global-css-design-system
          gate frontend_strict npm run audit:frontend:strict
          restore
          BASH
          chmod +x /tmp/gates.sh
          /tmp/gates.sh parent "$PARENT_SHA"
          /tmp/gates.sh permanent "$PERM_SHA"

      - name: Reconcile unchanged criteria
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const parse=f=>new Map(fs.readFileSync(f,'utf8').trim().split('\n').filter(Boolean).map(x=>{const [l,r,h]=x.split('\t');return[l,{rc:Number(r),hash:h}]}));
          const p=parse('/tmp/parent.tsv'),c=parse('/tmp/permanent.tsv');
          const exact=['agent_governance','responsive_contract','responsive_boundaries','css_responsive_conflicts','shared_card_anatomy','domain_cards','duplicate_assets','domain_completion_matrix','ad_card_required_info','card_loading_parity','publication_card_narrow_tablet'];
          const debt=['important_reduction_plan','global_css_design_system'];const rows=[];let introduced=0,relaxed=0;
          for(const l of exact){const a=p.get(l),b=c.get(l);if(!a||!b)throw Error('missing '+l);if(a.rc===0&&b.rc===0&&a.hash===b.hash)rows.push({label:l,classification:'PASS_BOTH_IDENTICAL',parent:a,permanent:b});else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash)rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,permanent:b});else{introduced++;throw Error(`${l} divergence ${a.rc}/${a.hash}->${b.rc}/${b.hash}`);}}
          for(const l of debt){const a=p.get(l),b=c.get(l);if(!a||!b)throw Error('missing '+l);if(a.rc===0&&b.rc===0)rows.push({label:l,classification:'PASS_BOTH_EXPECTED_DEBT_DELTA',parent:a,permanent:b});else if(a.rc!==0&&b.rc!==0&&a.rc===b.rc&&a.hash===b.hash)rows.push({label:l,classification:'BASELINE_EQUIVALENT_FAILURE',parent:a,permanent:b});else if(a.rc!==0&&b.rc===0)rows.push({label:l,classification:'PERMANENT_IMPROVES_BASELINE',parent:a,permanent:b});else{introduced++;throw Error(`${l} regression ${a.rc}->${b.rc}`);}}
          const a=p.get('frontend_strict'),b=c.get('frontend_strict');if(!a||!b||a.rc!==b.rc)throw Error(`frontend rc ${a?.rc}->${b?.rc}`);
          const pl=fs.readFileSync('/tmp/parent-frontend_strict.log','utf8'),cl=fs.readFileSync('/tmp/permanent-frontend_strict.log','utf8');const sig=s=>s.split('\n').filter(x=>x.includes('**CRITICAL**')||x.includes('**WARNING**')).sort();if(JSON.stringify(sig(pl))!==JSON.stringify(sig(cl)))throw Error('frontend critical/warning set changed');
          rows.push({label:'frontend_strict',classification:a.rc===0?'PASS_BOTH_EXPECTED_DEBT_DELTA':'BASELINE_EQUIVALENT_EXPECTED_DEBT_DELTA',parent:a,permanent:b});
          fs.writeFileSync('/tmp/matrix.json',JSON.stringify({rows,introducedRegressions:introduced,criteriaRelaxed:relaxed},null,2)+'\n');
          NODE

      - name: Restore permanent and publish certification receipt
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PERM_SHA" >/dev/null
          git clean -fd >/dev/null
          test "$(git rev-parse HEAD)" = "$PERM_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PERM_TREE"
          test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
          test "$(git status --porcelain)" = ""
          node <<'NODE'
          const fs=require('fs');
          const out={proof:'UX-CSS-IMPORTANT-042 Permanent Repository Certification',result:'PASS',checkpoint:'UX-CSS-IMPORTANT-042',pr:JSON.parse(fs.readFileSync('/tmp/pr-facts.json','utf8')),comparison:JSON.parse(fs.readFileSync('/tmp/comparison.json','utf8')),r1:{branch:process.env.R1_BRANCH,receiptBlob:process.env.R1_BLOB},r2:{branch:process.env.R2_BRANCH,receiptBlob:process.env.R2_BLOB},dormancy:JSON.parse(fs.readFileSync('/tmp/dormancy.json','utf8')),staticMatrix:JSON.parse(fs.readFileSync('/tmp/matrix.json','utf8')),browserRequired:false,permanentCandidateAltered:false,historicalDiagnosticFailures:[{run:32883916255,job:97919739676,classification:'DIAGNOSTIC_HARNESS_PROPERTY_GRAMMAR_REJECTED_VENDOR_PREFIX_698_OF_700'},{run:32884077643,job:97920262431,classification:'DIAGNOSTIC_HARNESS_VENDOR_PREFIX_OFFSETS_UNRESOLVED_2350_36412'}],parserCorrection:{exactAffectedProperty:'-webkit-backdrop-filter',exactOffsets:[2350,36412],criteriaRelaxed:false},restore:{headExact:true,treeExact:true,targetBlobExact:true,workspaceClean:true,head:process.env.PERM_SHA,tree:process.env.PERM_TREE,targetBlob:process.env.PERM_BLOB},scope:{repositoryOnly:true,staging:false,production:false,backend:false,supabase:false,rpc:false,migrations:false,credentials:false,runtimeRealtime:false,merge:false,readyForReview:false,forcePush:false,historyRewrite:false}};
          fs.writeFileSync('/tmp/cert.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out));
          NODE
          git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RECEIPT_FILE")"
          cp /tmp/cert.json "$RECEIPT_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RECEIPT_FILE"
          git commit -m "diagnostic(ux-css-important-042): publish permanent certification receipt"
          git push origin HEAD:"$OUTPUT_BRANCH"

      - name: Verify permanent remained frozen
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PERM_BRANCH" >/dev/null
          test "$(git rev-parse "origin/$PERM_BRANCH")" = "$PERM_SHA"
          test "$(git rev-parse "$PERM_SHA^{tree}")" = "$PERM_TREE"
          test "$(git rev-parse "$PERM_SHA:$TARGET_FILE")" = "$PERM_BLOB"
