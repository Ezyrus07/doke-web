name: ORD-A07E Reconcile Once

on:
  pull_request:
    paths:
      - '.github/workflows/ord-001-a07e-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile ORD-A07E registry and matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(packageJson.scripts, {
            'run:ord-001-a07e-concurrent-replay-canary': 'node scripts/run-ord-001-a07e-concurrent-replay-canary.mjs --concurrency=32',
            'test:ord-001-a07e-concurrent-replay-canary': 'node scripts/test-ord-001-a07e-concurrent-replay-canary.mjs',
            'audit:ord-001-a07e-concurrent-replay-canary': 'node scripts/audit-ord-001-a07e-concurrent-replay-canary.js'
          });
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const matrixPath = 'config/domain-completion-matrix.json';
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          matrix.version = '1.3.33';
          matrix.updatedAt = '2026-07-30T13:32:00-03:00';
          const ord = matrix.domains.find((domain) => domain.id === 'ORD-001');
          if (!ord) throw new Error('ORD-001 domain not found');

          const appendUnique = (array, values) => {
            for (const value of values) if (!array.includes(value)) array.push(value);
          };

          appendUnique(ord.requiredPaths, [
            'scripts/lib/ord-a07e-concurrent-replay-canary.mjs',
            'scripts/run-ord-001-a07e-concurrent-replay-canary.mjs',
            'scripts/test-ord-001-a07e-concurrent-replay-canary.mjs',
            'scripts/audit-ord-001-a07e-concurrent-replay-canary.js',
            'config/ord-001-a07e-concurrent-replay-canary.json',
            'docs/ORD-001-A07E-CONCURRENT-REPLAY-CANARY.md',
            'docs/validation/ORD-001-A07E-CONCURRENT-REPLAY-CANARY.json',
            '.github/workflows/ord-001-a07e-concurrent-replay-canary.yml'
          ]);
          appendUnique(ord.tests, [
            'run:ord-001-a07e-concurrent-replay-canary',
            'test:ord-001-a07e-concurrent-replay-canary',
            'audit:ord-001-a07e-concurrent-replay-canary'
          ]);
          appendUnique(ord.evidence, [
            'ORD-A07E executes 32 concurrent local invocations with the same nonce and proves exactly one acceptance, 31 HTTP 409 replay rejections, one worker run and one event-claim path.',
            'The ORD-A07E runner is local-only and rejects staging, remote, production, execute and deploy modes while performing zero network requests and zero mutations.',
            'The local canary preserves ORD-A07B, ORD-A07C and ORD-A07D contracts but does not authorize or replace the remote staging replay canary.'
          ]);
          appendUnique(ord.nextActions, [
            'Apply ORD-A07B only under its exact staging authorization, then separately authorize ORD-A07C, deploy the wired Edge Function through controlled staging release, and authorize the remote concurrent replay canary.'
          ]);
          fs.writeFileSync(matrixPath, JSON.stringify(matrix, null, 2) + '\n');
          NODE

          node scripts/run-ord-001-a07e-concurrent-replay-canary.mjs --concurrency=32
          node scripts/test-ord-001-a07e-concurrent-replay-canary.mjs
          node scripts/audit-ord-001-a07e-concurrent-replay-canary.js
          node scripts/test-ord-001-a07d-worker-invocation-gate.mjs
          node scripts/audit-ord-001-a07d-edge-function-freshness-wiring.js
          node scripts/audit-domain-completion-matrix.js --write
          node scripts/audit-domain-completion-matrix.js

          git add package.json config/domain-completion-matrix.json docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile ORD-A07E concurrent replay canary' || exit 0
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
