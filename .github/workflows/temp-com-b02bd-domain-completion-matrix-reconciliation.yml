name: TEMP COM-B02BD Domain Completion Matrix Reconciliation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02bd-domain-completion-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  reconcile-derived-matrix:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: 50cb57a8f2480ccd46fe0517b2c9802a3b7502d7
      CANDIDATE_TREE: c2768f0fb1c74a993862e74044f6faf6ad679cc9
      PREDECESSOR_HEAD: a344b2565b41b84079b444285140cafbf8825609
      PREDECESSOR_TREE: e210e851f47d75adb7d669ae172855935797bc67
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      B02BD_MODULE_BLOB: 4dfc1957f1de5edccf6301c4b10fa4ed208cca63
      B02BD_CONFIG_BLOB: 1bf1642345f85f3e696c47cff974c44cd83423bf
      B02BD_TEST_BLOB: dbae3003f8109bfb2555413f61da5818abed266d
      B02BD_WORKFLOW_BLOB: 047fd4b3ec3a40d13464310349ba3e7f887f70b2
      B02BC_MODULE_BLOB: 43bde8dbed4a82de957b06fb45e3678b31a43ea2
      B02BC_CONFIG_BLOB: b41a6c984746d1212e071c063f5ad497f455c27f
      B02BC_TEST_BLOB: 712d9489c620cdcb42e3d775b41fd7ab0ff75c62
      B02BC_WORKFLOW_BLOB: 0bf0f13116eda151af2a877f184068a1fb439033
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02bd-domain-completion-matrix-reconciliation.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary reconciliation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02BD candidate and temporary-only lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git diff --name-only "$CANDIDATE_HEAD" HEAD)" = "$TEMP_PATH"
          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js \
            config/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.json \
            scripts/test-com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js | sort)"
          actual_candidate="$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)"
          test "$actual_candidate" = "$expected_candidate"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js)" = "$B02BD_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.json)" = "$B02BD_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js)" = "$B02BD_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.yml)" = "$B02BD_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js)" = "$B02BC_MODULE_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.json)" = "$B02BC_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.js)" = "$B02BC_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02bc-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-implementation.yml)" = "$B02BC_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prove B02BD semantics and hard blocks before reconciliation
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js
          TEST=scripts/test-com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'new (Map|WeakMap|Set|WeakSet)\(|randomUUID\(|randomBytes\(|crypto\.' "$TARGET"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E '\.(registerOpaqueContinuationState|resolveOpaqueContinuationState|releaseOpaqueContinuationState)\(' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|entryContainerMaterialized[[:space:]]*:[[:space:]]*true|storageBackendMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableMethodReferenceMaterialized[[:space:]]*:[[:space:]]*true|carrierInstanceMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'opaqueStateHandleGenerated[[:space:]]*:[[:space:]]*true|continuationStateStored[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"
          git diff --check "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD"

      - name: Regenerate only canonical derived Matrix artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$changed" = "$expected"

      - name: Validate regenerated artifacts and repository governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node scripts/test-com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js
          git diff --check "$PREDECESSOR_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"

      - name: Commit derived artifacts and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f -- reports/generated/domain-completion-matrix-report.json
          git rm -- "$TEMP_PATH"
          git commit -m "docs(com): reconcile B02BD derived matrix artifacts"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep '^.github/workflows/temp-com-b02bd-'
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js \
            config/com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02bd-repository-only-continuation-state-registry-storage-backend-entry-container-instance-operation-methods-attachment-materialization-readiness.js | sort)"
          actual_final="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual_final" = "$expected_final"

      - name: Fast-forward branch only if temporary head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH