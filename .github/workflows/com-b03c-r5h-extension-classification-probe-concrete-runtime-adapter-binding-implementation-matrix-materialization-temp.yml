name: COM-B03C R5H Concrete Runtime Adapter Binding Implementation Matrix Materialization TEMP

on:
  push:
    branches: [com/com-001-baseline-audit]
    paths:
      - '.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-matrix-materialization-temp.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Exact repository-only installation scope
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-matrix-materialization-temp.yml
          test "$(git rev-parse HEAD^)" = "3bf6d0cbc96cc60d7a581381e088d0bfe0a50ebd"
          test "$(git diff --name-only HEAD^ HEAD)" = "$temp"

      - name: Generate final-tree Matrix derivatives
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-matrix-materialization-temp.yml
          rm "$temp"
          npm run write:domain-completion-matrix
          git diff --exit-code -- config/domain-completion-matrix.json
          expected="$(printf '%s\n' "$temp" docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

      - name: Fail-closed concrete runtime adapter implementation assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js)" = "6fc34e1b365ec801665fdab0c7d0c6761a8013e6"
          test "$(git rev-parse HEAD:config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json)" = "04a8aaac9a44dee241d852f6ca55f457b5adecfa"
          test "$(git rev-parse HEAD:.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.yml)" = "07fd3d7cf847efadc89661e756055f4b13d75808"
          node - <<'NODE'
          const boundary = require('./config/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary.json');
          const adapter = require('./backend/modules/communities/community-realtime-private-auth-r5h-extension-classification-probe-concrete-runtime-adapter-binding.js');
          if (boundary.contractId !== 'com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-boundary-v1') throw new Error('BOUNDARY_CONTRACT_DRIFT');
          if (boundary.functionalCheckpoint.lastFunctionalCheckpoint !== 'COM-B03C-R5H' || boundary.functionalCheckpoint.r5iCreated !== false || boundary.functionalCheckpoint.r5iInferred !== false) throw new Error('FUNCTIONAL_CHECKPOINT_DRIFT');
          if (boundary.implementation.runtimeAdapterImplementationPresent !== true || boundary.implementation.runtimeAdapterBindingDefined !== false || boundary.implementation.runtimeAdapterBound !== false || boundary.implementation.transportBound !== false) throw new Error('IMPLEMENTATION_STATE_DRIFT');
          if (Object.values(boundary.concreteBindingState).some((value) => value !== null)) throw new Error('CONCRETE_BINDING_STATE_MUST_REMAIN_NULL');
          const descriptor = adapter.repositoryDescriptor();
          if (descriptor.runtimeAdapterImplementationPresent !== true || descriptor.runtimeAdapterBindingDefined !== false || descriptor.runtimeAdapterBound !== false || descriptor.transportBound !== false || descriptor.remoteExecutionAuthority !== false) throw new Error('ADAPTER_DESCRIPTOR_DRIFT');
          let disabled = false;
          try { adapter.assertRemoteExecutionDisabled(); } catch (error) { disabled = error && error.code === adapter.REMOTE_EXECUTION_DISABLED_CODE; }
          if (!disabled) throw new Error('REMOTE_EXECUTION_HARD_BLOCK_REQUIRED');
          NODE

      - name: Prepare immutable Git commit without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp=.github/workflows/com-b03c-r5h-extension-classification-probe-concrete-runtime-adapter-binding-implementation-matrix-materialization-temp.yml
          parent="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          md_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' docs/DOMAIN-COMPLETION-MATRIX.md | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          report_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' reports/generated/domain-completion-matrix-report.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          tree="$(jq -n \
            --arg base "$base_tree" \
            --arg md "$md_blob" \
            --arg report "$report_blob" \
            --arg temp "$temp" \
            '{base_tree:$base,tree:[
              {path:"docs/DOMAIN-COMPLETION-MATRIX.md",mode:"100644",type:"blob",sha:$md},
              {path:"reports/generated/domain-completion-matrix-report.json",mode:"100644",type:"blob",sha:$report},
              {path:$temp,mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          commit="$(jq -n \
            --arg message "docs(com): synchronize Matrix derivatives for concrete runtime adapter implementation" \
            --arg tree "$tree" \
            --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          test "$(git rev-parse HEAD)" = "$parent"
          printf 'PREPARED_COMMIT_SHA=%s\n' "$commit"
          printf 'PREPARED_TREE_SHA=%s\n' "$tree"
          printf 'MARKDOWN_BLOB_SHA=%s\n' "$md_blob"
          printf 'REPORT_BLOB_SHA=%s\n' "$report_blob"
