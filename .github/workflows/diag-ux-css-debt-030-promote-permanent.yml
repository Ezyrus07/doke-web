name: Doke UX-CSS-DEBT-030 Promote Permanent

on:
  push:
    branches:
      - diag/ux-css-debt-030-promote-permanent

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 44bde2226174f0e5b3a8944ea754ca1635708d61
      TARGET_CSS: assets/css/pages/avaliacao-profissional.css
      TARGET_BLOB: 233130872b9ef0b4ca5c399da079caa25d4b8ee1
      TARGET_HASH: b5cef235b3ad83d0ac8c665014b125714058d517a539e1ca6439d4e8f44a28cc
      PERM_BRANCH: ux/ux-css-debt-030-avaliacao-profissional-compaction
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Preserve promotion helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diagnostics/ux-css-debt-030-promote.cjs /tmp/ux-css-debt-030-promote.cjs
          node --check /tmp/ux-css-debt-030-promote.cjs

      - name: Checkout exact certified UX-CSS-DEBT-029 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          clean: true
          persist-credentials: false

      - name: Guard exact parent and empty permanent namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_CSS")" = "$TARGET_BLOB"
          test -z "$(git status --porcelain)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PERM_BRANCH" >/dev/null 2>&1; then
            echo "permanent branch already exists: $PERM_BRANCH" >&2
            exit 1
          fi
          echo "PROMOTION PARENT PASS|sha=$TARGET_SHA|blob=$TARGET_BLOB|permanentNamespace=absent"

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/ux-css-debt-030-promote.cjs
          test "$(sha256sum "$TARGET_CSS" | awk '{print $1}')" = "$TARGET_HASH"
          test "$(git diff --name-only)" = "$TARGET_CSS"
          read -r add del file < <(git diff --numstat -- "$TARGET_CSS")
          test "$add" = "0" && test "$del" = "15" && test "$file" = "$TARGET_CSS"

      - name: Publish exact permanent commit via Git Data API
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_B64="$(base64 -w0 "$TARGET_CSS")"
          BLOB_SHA="$(jq -n --arg content "$CONTENT_B64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
          BASE_TREE="$(git rev-parse "$TARGET_SHA^{tree}")"
          TREE_SHA="$(jq -n --arg base "$BASE_TREE" --arg path "$TARGET_CSS" --arg blob "$BLOB_SHA" '{base_tree:$base,tree:[{path:$path,mode:"100644",type:"blob",sha:$blob}]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"
          COMMIT_SHA="$(jq -n --arg msg 'UX-CSS-DEBT-030: compact superseded avaliacao profissional declarations' --arg tree "$TREE_SHA" --arg parent "$TARGET_SHA" '{message:$msg,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"
          API_PARENT="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$COMMIT_SHA" --jq '.parents[0].sha')"
          API_TREE="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$COMMIT_SHA" --jq '.tree.sha')"
          test "$API_PARENT" = "$TARGET_SHA"
          test "$API_TREE" = "$TREE_SHA"
          jq -n --arg ref "refs/heads/$PERM_BRANCH" --arg sha "$COMMIT_SHA" '{ref:$ref,sha:$sha}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input - >/tmp/ref.json
          REMOTE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PERM_BRANCH" --jq '.object.sha')"
          test "$REMOTE" = "$COMMIT_SHA"
          REMOTE_BLOB="$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_CSS?ref=$PERM_BRANCH" --jq '.sha')"
          test "$REMOTE_BLOB" = "$BLOB_SHA"
          echo "PROMOTION FINAL PASS|branch=$PERM_BRANCH|sha=$COMMIT_SHA|parent=$TARGET_SHA|blob=$BLOB_SHA|hash=$TARGET_HASH|files=1|additions=0|deletions=15|prCreated=0|transport=git-data-api"
