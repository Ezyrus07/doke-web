name: Doke UX-CSS-DEBT-019 Home Mobile Categories Reach R2

on:
  push:
    branches:
      - diag/ux-css-debt-019-home-mobile-categories-reach-r2

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 70a99a6dd8b82fe54c8380ed9b1f28fe1965c836
      PARENT_SHA: f9c0d4b77abf00447c3440041e4966b7504f04bc
      TARGET_FILE: assets/css/pages/home/mobile/categories.css
      TARGET_SELECTOR: 'body.home-index-shell .home-catégories .section-heading, body.home-index-shell .featured-services .section-heading'
    steps:
      - name: Checkout exact certified parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact checkpoint and owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          grep -Fq "Single source of truth for the mobile landing experience." assets/css/pages/home/mobile/index.css
          grep -Fq "@import url('./categories.css');" assets/css/pages/home/mobile/index.css
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Prove static target and tracked consumer
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:active-legacy-structures >/tmp/legacy.log
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const target=process.env.TARGET_FILE,selector=process.env.TARGET_SELECTOR;
          function parse(src){const lines=src.split(/\r?\n/);let depth=0,sp=[],ap=[],sel=null;const declarations=[],stack=[],re=/^\s*([\w-]+)\s*:\s*(.*?)\s*;\s*$/,norm=p=>p.join(' ').replace(/\{\s*$/,'').replace(/\s+/g,' ').trim();for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim(),opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;if(!sel){if(ap.length){if(t)ap.push(t);if(line.includes('{')){stack.push({type:'at',header:norm(ap),depthBefore:depth});ap=[];}}else if(t.startsWith('@')&&!t.includes(';')){if(line.includes('{'))stack.push({type:'at',header:norm([t]),depthBefore:depth});else ap=[t];}else if(sp.length){if(t)sp.push(t);if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}else if(t&&!t.startsWith('/*')&&!t.startsWith('*')&&t!=='*/'&&t!=='}'&&!t.startsWith('@')&&!line.includes(';')){sp=[t];if(line.includes('{')){sel=norm(sp);sp=[];stack.push({type:'rule',selector:sel,depthBefore:depth});}}}if(sel){const m=line.match(re);if(m){const raw=m[2].trim(),important=/\s*!important\s*$/i.test(raw),context=stack.filter(x=>x.type==='at').map(x=>x.header).join(' || ');declarations.push({lineIndex:i,line:i+1,selector:sel,property:m[1].toLowerCase(),value:raw,important,context});}}depth+=opens-closes;while(stack.length&&depth<=stack[stack.length-1].depthBefore){const p=stack.pop();if(p.type==='rule')sel=null;}}const last=new Map(),dead=[];for(let i=declarations.length-1;i>=0;i--){const d=declarations[i],key=`${d.context} >>> ${d.selector} >>> ${d.property}`,later=last.get(key);if(later&&(!d.important||later.important))dead.push({...d,winnerLine:later.line,winnerValue:later.value,winnerImportant:later.important});if(!later||d.important||!later.important)last.set(key,d);}return{declarations,dead};}
          const p=parse(fs.readFileSync(target,'utf8'));if(p.declarations.length!==52||p.dead.length!==1)throw new Error(`parser drift ${p.declarations.length}/${p.dead.length}`);const d=p.dead[0];if(d.selector!==selector||d.property!=='margin'||d.context!=='@media (max-width: 560px)'||d.value!=='0 0 4px'||d.winnerValue!=='0'||d.important||d.winnerImportant)throw new Error('dead-row drift '+JSON.stringify(d));
          const report=JSON.parse(fs.readFileSync('reports/generated/active-legacy-structures-report.json','utf8')),tracked=new Set(cp.execFileSync('git',['ls-files','-z','assets/css'],{encoding:'utf8'}).split('\0').filter(Boolean)),importRe=/@import\s+(?:url\()?['"]?([^'"\);]+\.css(?:\?[^'"\)]*)?)['"]?\)?/gi,norm=(v,from)=>{v=v.replace(/\?.*$/,'').replace(/^\.\//,'');if(v.startsWith('/'))return v.replace(/^\/+/, '');if(v.startsWith('assets/'))return v;return path.posix.normalize(path.posix.join(path.posix.dirname(from),v));},imports=f=>{const src=fs.readFileSync(f,'utf8'),out=[];let m;importRe.lastIndex=0;while((m=importRe.exec(src)))out.push(norm(m[1],f));return out;};const consumers=[];for(const page of report.pageAssets){const seen=new Set(),stack=[...page.css.filter(f=>tracked.has(f))];let hit=false;while(stack.length){const f=stack.pop();if(seen.has(f)||!tracked.has(f))continue;seen.add(f);if(f===target){hit=true;break;}for(const n of imports(f))if(tracked.has(n))stack.push(n);}if(hit)consumers.push(page.page);}if(JSON.stringify(consumers)!==JSON.stringify(['index.html']))throw new Error('consumer drift '+JSON.stringify(consumers));console.log(`STATIC REACH R2 PASS: declarations=52 dead=1 margin ${d.value}->${d.winnerValue}; max560; consumer=index.html; lines=${d.line}->${d.winnerLine}`);
          NODE

      - name: Prove CSSOM and canonical DOM reach without cardinality assumption
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/reach-r2.js <<'NODE'
          const cp=require('child_process'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const selector=process.env.TARGET_SELECTOR,vps=[['1280',1280,802],['608',608,926],['561',561,900],['560',560,900],['390',390,844]],server=cp.spawn(process.execPath,['scripts/serve-static-site.js','--host=127.0.0.1','--port=5500'],{stdio:'ignore',env:{...process.env,DOKE_E2E_DISABLE_REMOTE_SERVICES:'1'}}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{await sleep(500);const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});let active=0,inactive=0;const counts={};for(const [name,width,height] of vps){const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'}),page=await ctx.newPage();await page.route('**/*',route=>{const u=new URL(route.request().url()),local=u.origin==='http://127.0.0.1:5500';if(local&&u.pathname.endsWith('.js'))return route.abort();if(local||u.protocol==='data:'||u.protocol==='blob:')return route.continue();return route.abort();});await page.goto('http://127.0.0.1:5500/index.html',{waitUntil:'domcontentloaded',timeout:15000});const snap=await page.evaluate(selector=>{const norm=s=>s.replace(/\s+/g,' ').trim(),nodes=[...document.querySelectorAll(selector)],hits=[];function walk(rules,ctx,href){for(const r of [...rules]){if(r.constructor?.name==='CSSImportRule'&&r.styleSheet){try{walk(r.styleSheet.cssRules,ctx,r.styleSheet.href||href);}catch{}}else if(r.constructor?.name==='CSSMediaRule'){walk(r.cssRules,[...ctx,`@media ${r.conditionText}`],href);}else if(norm(r.selectorText||'')===norm(selector)&&r.style?.getPropertyValue('margin'))hits.push({href,context:ctx.join(' || '),value:r.style.getPropertyValue('margin').trim(),priority:r.style.getPropertyPriority('margin')});}}for(const s of [...document.styleSheets]){try{walk(s.cssRules,[],s.href||'inline');}catch{}}return{count:nodes.length,media:matchMedia('(max-width:560px)').matches,nodes:nodes.map(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return{margin:cs.margin,rect:[+r.x.toFixed(3),+r.y.toFixed(3),+r.width.toFixed(3),+r.height.toFixed(3)]};}),hits:hits.filter(h=>String(h.href).includes('/assets/css/pages/home/mobile/categories.css'))};},selector);if(snap.count<1)throw new Error(`selector absent ${name}`);if(snap.hits.length!==2)throw new Error(`CSSOM hit count ${name}=${snap.hits.length} ${JSON.stringify(snap.hits)}`);const vals=snap.hits.map(h=>h.value).sort();if(JSON.stringify(vals)!==JSON.stringify(['0px','0px 0px 4px'])||snap.hits.some(h=>h.context!=='@media (max-width: 560px)'||h.priority!==''))throw new Error(`CSSOM drift ${name} ${JSON.stringify(snap.hits)}`);counts[name]=snap.count;if(snap.media)active++;else inactive++;console.log(name,JSON.stringify(snap));await ctx.close();}await browser.close();server.kill('SIGTERM');if(active!==2||inactive!==3)throw new Error(`boundary hits active=${active} inactive=${inactive}`);console.log('RUNTIME REACH R2 PASS counts='+JSON.stringify(counts)+' CSSOM=2 max560 active only at 560/390');})().catch(e=>{server.kill('SIGTERM');console.error(e);process.exit(1)});
          NODE
          node /tmp/reach-r2.js

      - name: Preserve governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log

      - name: Restore exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git diff --exit-code
