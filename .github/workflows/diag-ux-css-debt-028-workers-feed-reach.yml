name: Doke UX-CSS-DEBT-028 Workers Overlay Ownership Probe
on:
  push:
    branches: [diag/ux-css-debt-028-workers-feed-reach-r1]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    env: {TARGET_SHA: e648173f3f98966e3f5bf15413bec3c08f97aab1}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}'}
      - name: Guard certified parent
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object index.html)" = "266e4323115909cf174bafb361a33b19dd7d5433"
          test "$(git hash-object resultados.html)" = "fc9833984725957829311d31037a2e3dad86c4f7"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - name: Install browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Apply ephemeral ownership correction
        run: |
          node <<'JS'
          const fs=require('fs');
          for(const file of ['index.html','resultados.html']){
            const before=fs.readFileSync(file,'utf8');
            const re=/(<section class="worker-preview )doke-worker-card (doke-media-card doke-card doke-page-section doke-overlay doke-overlay--media" data-worker-preview)/g;
            const matches=[...before.matchAll(re)];
            if(matches.length!==1) throw new Error(`${file}: expected one worker-preview root with doke-worker-card, got ${matches.length}`);
            const after=before.replace(re,'$1$2');
            if(after===before) throw new Error(`${file}: no mutation`);
            fs.writeFileSync(file,after);
          }
          const results=fs.readFileSync('resultados.html','utf8');
          if(!results.includes('before-after-preview doke-worker-card')) throw new Error('before-after root changed unexpectedly');
          console.log('PATCH PASS|files=2|workerPreviewClassRemoved=2|beforeAfterUntouched=1');
          JS
          git diff --check
          test "$(git diff --name-only | sort)" = $'index.html\nresultados.html'
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a"/"d}')" = "2/2"
          test "$(git diff -- index.html | grep -c '^-.*worker-preview doke-worker-card')" = "1"
          test "$(git diff -- resultados.html | grep -c '^-.*worker-preview doke-worker-card')" = "1"
      - name: Prove restored viewer geometry
        run: |
          cat > tests/ux-css-debt-028-ownership-probe.spec.js <<'JS'
          const {test,expect}=require('@playwright/test');
          const widths=[1280,639,640,641,760,761,820,821];
          test('removing card semantics restores workers overlay ownership',async({page})=>{
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.route('https://images.pexels.com/**',r=>r.fulfill({status:204,body:''}));
            await page.goto('/index.html',{waitUntil:'domcontentloaded'});
            await expect.poll(()=>page.locator('[data-worker-feed-item]').count()).toBeGreaterThan(0);
            const pre=await page.locator('[data-worker-preview]').evaluate(el=>({hidden:el.hidden,hasWorkerCard:el.classList.contains('doke-worker-card')}));
            expect(pre.hidden).toBe(true); expect(pre.hasWorkerCard).toBe(false);
            await page.evaluate(()=>{const t=document.querySelector('[data-worker-trigger]'); if(!t||typeof window.DokeOpenWorkerPreview!=='function') throw new Error('worker opener unavailable'); window.DokeOpenWorkerPreview(t.dataset.workerId,t)});
            for(const w of widths){
              await page.setViewportSize({width:w,height:900}); await page.waitForTimeout(120);
              const r=await page.evaluate(()=>{
                const root=document.querySelector('[data-worker-preview]');
                const stage=root.querySelector('.worker-preview__stage');
                const feed=root.querySelector('[data-worker-preview-feed]');
                const item=root.querySelector('[data-worker-feed-item].is-active')||root.querySelector('[data-worker-feed-item]');
                const snap=x=>{const c=getComputedStyle(x),b=x.getBoundingClientRect();return{display:c.display,visibility:c.visibility,rect:[b.x,b.y,b.width,b.height]}};
                return {bodyOpen:document.body.classList.contains('worker-preview-open'),hidden:root.hidden,aria:root.getAttribute('aria-hidden'),hasWorkerCard:root.classList.contains('doke-worker-card'),root:snap(root),stage:snap(stage),feed:snap(feed),item:snap(item),active:root.querySelectorAll('[data-worker-feed-item].is-active').length,overflow:Math.max(0,document.documentElement.scrollWidth-window.innerWidth)};
              });
              console.log(`OWNERSHIP|${w}|${JSON.stringify(r)}`);
              expect(r.bodyOpen).toBe(true); expect(r.hidden).toBe(false); expect(r.aria).toBe('false'); expect(r.hasWorkerCard).toBe(false); expect(r.active).toBe(1);
              expect(r.stage.display).not.toBe('none'); expect(r.stage.visibility).toBe('visible'); expect(r.stage.rect[2]).toBeGreaterThan(0); expect(r.stage.rect[3]).toBeGreaterThan(0);
              expect(r.feed.display).not.toBe('none'); expect(r.feed.rect[2]).toBeGreaterThan(0); expect(r.feed.rect[3]).toBeGreaterThan(0);
              expect(r.item.display).not.toBe('none'); expect(r.item.rect[2]).toBeGreaterThan(0); expect(r.item.rect[3]).toBeGreaterThan(0);
              expect(r.overflow).toBe(0);
            }
            console.log(`OWNERSHIP PASS|viewports=${widths.length}|stageVisible=1|feedVisible=1|itemVisible=1|overflow=0`);
          });
          JS
          node node_modules/@playwright/test/cli.js test tests/ux-css-debt-028-ownership-probe.spec.js
      - name: Static parity on resultados
        run: |
          node <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('resultados.html','utf8');
          const worker=html.match(/<section class="([^"]*worker-preview[^"]*)" data-worker-preview/);
          if(!worker) throw new Error('resultados worker-preview root missing');
          if(/\bdoke-worker-card\b/.test(worker[1])) throw new Error('resultados worker-preview still has card semantics');
          if(!html.includes('before-after-preview doke-worker-card')) throw new Error('unrelated before-after root changed');
          console.log('RESULTADOS STATIC PASS|workerPreviewCardSemantics=0|beforeAfterUntouched=1');
          JS
      - if: always()
        name: Restore certified checkpoint
        run: |
          git reset --hard "$TARGET_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0"
