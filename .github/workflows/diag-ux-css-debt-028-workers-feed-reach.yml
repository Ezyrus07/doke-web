name: Doke UX-CSS-DEBT-028 Workers Feed Reach
on:
  push:
    branches: [diag/ux-css-debt-028-workers-feed-reach-r1]
permissions: {contents: read}
jobs:
  reach:
    runs-on: ubuntu-24.04
    env: {TARGET_SHA: e648173f3f98966e3f5bf15413bec3c08f97aab1}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}'}
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - run: |
          cat > tests/ux-css-debt-028-chain.spec.js <<'JS'
          const {test,expect}=require('@playwright/test');
          test('028 chain',async({page})=>{
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.route('https://images.pexels.com/**',r=>r.fulfill({status:204,body:''}));
            await page.goto('/index.html',{waitUntil:'domcontentloaded'});
            await expect.poll(()=>page.locator('[data-worker-feed-item]').count()).toBeGreaterThan(0);
            await page.evaluate(()=>{const t=document.querySelector('[data-worker-trigger]');window.DokeOpenWorkerPreview(t.dataset.workerId,t)});
            for(const w of [1280,639,640,641,761,821]){
              await page.setViewportSize({width:w,height:900});await page.waitForTimeout(100);
              const r=await page.evaluate(()=>{const root=document.querySelector('[data-worker-preview]'),stage=root.querySelector('.worker-preview__stage'),feed=root.querySelector('[data-worker-preview-feed]'),item=root.querySelector('[data-worker-feed-item]');const s=x=>{const c=getComputedStyle(x),b=x.getBoundingClientRect();return{display:c.display,visibility:c.visibility,width:c.width,height:c.height,rect:[b.x,b.y,b.width,b.height]}};return{bodyOpen:document.body.classList.contains('worker-preview-open'),hidden:root.hidden,aria:root.getAttribute('aria-hidden'),root:s(root),stage:s(stage),feed:s(feed),item:s(item),active:document.querySelectorAll('[data-worker-feed-item].is-active').length}});
              console.log(`CHAIN|${w}|${JSON.stringify(r)}`);expect(r.hidden).toBe(false);expect(r.active).toBe(1);
            }
            console.log('CHAIN PASS');
          });
          JS
          node node_modules/@playwright/test/cli.js test tests/ux-css-debt-028-chain.spec.js
      - if: always()
        run: |
          git reset --hard "$TARGET_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0"
