name: Doke UX-CSS-DEBT-028 Workers Feed Reach

on:
  push:
    branches:
      - diag/ux-css-debt-028-workers-feed-reach-r1

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: e648173f3f98966e3f5bf15413bec3c08f97aab1
      PARENT_SHA: 820896977bfbba4f499b67f1707298f5bd7339be
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-027 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Guard exact checkpoint and authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test -z "$(git status --porcelain)"
          git diff --check
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const home=fs.readFileSync('assets/css/pages/home.css','utf8');
          const runtime=fs.readFileSync('assets/css/pages/home-runtime.css','utf8');
          const page=fs.readFileSync('assets/css/pages/home-runtime-page.css','utf8');
          const overlay=fs.readFileSync('assets/css/pages/home-overlays.css','utf8');
          const js=fs.readFileSync('assets/js/pages/home/workers.js','utf8');
          for(const [src,needle] of [[html,'assets/css/pages/home.css'],[home,'./home-runtime.css'],[runtime,'./home-runtime-page.css'],[page,'./home-overlays.css'],[overlay,'./home-overlays/workers-feed-base.css'],[overlay,'./home-overlays/workers-feed-card-layout.css']]) if(!src.includes(needle)) throw new Error(`authority edge missing: ${needle}`);
          const base=overlay.indexOf('./home-overlays/workers-feed-base.css'),cards=overlay.indexOf('./home-overlays/workers-feed-card-layout.css');
          if(base<0||cards<0||base>=cards) throw new Error('overlay import order drift');
          if(!js.includes('window.DokeHomeWorkers = (() => {')||!js.includes('feed.innerHTML = WORKERS.map(createFeedItem).join')) throw new Error('production renderer drift');
          console.log('SOURCE AUTHORITY PASS|index>home>runtime>runtime-page>overlays>workers-feed-base|productionRenderer=1|rankingRun=31718664920|rankingJob=94509775708|canonicalPairs=6|max640=1');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install reach runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run production DOM and canonical reach proof
        shell: bash
        run: |
          cat > tests/ux-css-debt-028-workers-feed-runtime.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');
          const sizes=[[639,900],[640,900],[641,900],[760,900],[761,900],[820,1000],[821,1000]];
          test('canonical workers feed selectors are reached at runtime',async({page})=>{
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.route('https://images.pexels.com/**',r=>r.fulfill({status:204,body:''}));
            await page.goto('/index.html',{waitUntil:'domcontentloaded'});
            await expect.poll(()=>page.locator('[data-worker-preview]').count()).toBe(1);
            await expect.poll(()=>page.evaluate(()=>Boolean(window.DokeHomeWorkers?.create))).toBe(true);
            const natural=await page.evaluate(()=>({hidden:document.querySelector('[data-worker-preview]').hidden,triggers:document.querySelectorAll('[data-worker-trigger]').length,items:document.querySelectorAll('[data-worker-feed-item]').length}));
            expect(natural.hidden).toBe(true); expect(natural.triggers).toBeGreaterThan(0);
            if(!natural.items) await page.evaluate(()=>{window.__diagWorkersAbort=new AbortController();window.DokeHomeWorkers.create({signal:window.__diagWorkersAbort.signal});});
            await expect.poll(()=>page.locator('[data-worker-feed-item]').count()).toBeGreaterThan(0);
            await expect.poll(()=>page.evaluate(()=>typeof window.DokeOpenWorkerPreview)).toBe('function');
            await page.evaluate(()=>{const t=document.querySelector('[data-worker-trigger]');window.DokeOpenWorkerPreview(t?.dataset.workerId||'vid-pintura',t||null);});
            await expect.poll(()=>page.locator('[data-worker-preview]').evaluate(el=>el.hidden)).toBe(false);
            const card=await page.evaluate(()=>({items:document.querySelectorAll('[data-worker-feed-item]').length,caption:document.querySelectorAll('.worker-preview__caption').length,title:document.querySelectorAll('.worker-preview__title').length,actions:document.querySelectorAll('.worker-preview__actions').length,action:document.querySelectorAll('.worker-preview__action').length,open:document.body.classList.contains('worker-preview-open')}));
            expect(card.open).toBe(true); expect(card.items).toBeGreaterThan(0); expect(card.caption).toBe(card.items); expect(card.title).toBe(card.items); expect(card.actions).toBe(card.items); expect(card.action).toBe(card.items*4);
            console.log(`DOM REACH PASS|items=${card.items}|caption=${card.caption}|title=${card.title}|actions=${card.actions}|action=${card.action}`);
            const seen={};
            for(const [width,height] of sizes){
              await page.setViewportSize({width,height});
              const r=await page.evaluate(()=>{const c=document.querySelector('.worker-preview__caption'),t=document.querySelector('.worker-preview__title'),as=document.querySelector('.worker-preview__actions'),a=document.querySelector('.worker-preview__action'),cs=getComputedStyle(c),ts=getComputedStyle(t),ass=getComputedStyle(as),acs=getComputedStyle(a),cr=c.getBoundingClientRect(),tr=t.getBoundingClientRect(),asr=as.getBoundingClientRect(),ar=a.getBoundingClientRect();return{m640:matchMedia('(max-width: 640px)').matches,m760:matchMedia('(max-width: 760px)').matches,m820:matchMedia('(max-width: 820px)').matches,computed:{left:cs.left,right:cs.right,bottom:cs.bottom,title:ts.fontSize,gap:ass.gap,width:acs.width},rects:[[cr.width,cr.height],[tr.width,tr.height],[asr.width,asr.height],[ar.width,ar.height]],sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,bsw:document.body.scrollWidth,vw:innerWidth};});
              expect(r.m640).toBe(width<=640); expect(r.m760).toBe(width<=760); expect(r.m820).toBe(width<=820);
              for(const [w,h] of r.rects){expect(w).toBeGreaterThan(0);expect(h).toBeGreaterThan(0)}
              expect(r.sw).toBeLessThanOrEqual(r.cw+1); expect(r.bsw).toBeLessThanOrEqual(r.vw+1);
              if(width===640) expect(r.computed).toEqual({left:'14px',right:'76px',bottom:'24px',title:'16px',gap:'12px',width:'42px'});
              if(width===641) expect(r.computed).toEqual({left:'14px',right:'76px',bottom:'24px',title:'18.08px',gap:'12px',width:'42px'});
              if(width===761) expect(r.computed).toEqual({left:'20px',right:'20px',bottom:'24px',title:'18.08px',gap:'18px',width:'58px'});
              if(width===821) expect(r.computed.width).toBe('66px');
              seen[width]=r.computed;
              console.log(`REACH WIDTH PASS|w=${width}|m640=${r.m640?1:0}|m760=${r.m760?1:0}|m820=${r.m820?1:0}|computed=${JSON.stringify(r.computed)}|overflow=0`);
            }
            expect(seen[640].title).not.toBe(seen[641].title);
            expect(seen[640].right).toBe(seen[641].right);
            expect(seen[640].gap).toBe(seen[641].gap);
            expect(seen[640].width).toBe(seen[641].width);
            console.log('CASCADE PASS|rankingPairs=6|identical=4|changed=2|titleBoundary=640/641|caption+actions+actionShadowedByLaterComponentAt<=760');
            console.log('REACH PASS|viewports=7|boundaries=639/640/641+760/761+820/821|productionDOM=1|overflow=0');
          });
          JS
          node node_modules/@playwright/test/cli.js test tests/ux-css-debt-028-workers-feed-runtime.spec.js

      - name: Restore exact product before governance
        if: always()
        run: |
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain)"

      - name: Preserve governance baselines
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:agent-governance
          node scripts/audit-css-responsive-conflicts.js | tee /tmp/conflicts.log
          grep -q 'Conflicting class/property pairs: 339' /tmp/conflicts.log
          npm run audit:domain-completion-matrix | tee /tmp/domain.log
          grep -q 'Domains: 23' /tmp/domain.log
          grep -q 'Critical flows: 15' /tmp/domain.log
          grep -q 'Average maturity: 2.91/6' /tmp/domain.log
          grep -q 'Critical blockers: 12' /tmp/domain.log
          npm run audit:shared-app-header-contract
          npm run audit:mobile-shell-location-contract
          npm run audit:responsive-boundaries
          npm run audit:duplicate-assets | tee /tmp/dup.log
          grep -q 'Duplicate groups: 0' /tmp/dup.log
          grep -q 'Duplicated files: 0' /tmp/dup.log
          echo 'REACH GOVERNANCE PASS|conflicts=339|domain=23/15/2.91/12|duplicates=0/0'

      - name: Final exact checkpoint guard
        run: |
          git reset --hard "${TARGET_SHA}"
          git clean -fd
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain)"
          echo "REACH CHECKPOINT PASS|sha=${TARGET_SHA}|productMutation=0"