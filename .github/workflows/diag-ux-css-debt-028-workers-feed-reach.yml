name: Doke UX-CSS-DEBT-028 Workers Feed Reach
on:
  push:
    branches: [diag/ux-css-debt-028-workers-feed-reach-r1]
permissions:
  contents: read
jobs:
  reach:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: e648173f3f98966e3f5bf15413bec3c08f97aab1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
      - run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Visible-item runtime reach
        run: |
          cat > tests/ux-css-debt-028-reach.spec.js <<'JS'
          const {test,expect}=require('@playwright/test');
          test('028 reach',async({page})=>{
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.route('https://images.pexels.com/**',r=>r.fulfill({status:204,body:''}));
            await page.goto('/index.html',{waitUntil:'domcontentloaded'});
            await expect.poll(()=>page.evaluate(()=>Boolean(window.DokeHomeWorkers?.create))).toBe(true);
            const n=await page.evaluate(()=>({hidden:document.querySelector('[data-worker-preview]').hidden,triggers:document.querySelectorAll('[data-worker-trigger]').length,items:document.querySelectorAll('[data-worker-feed-item]').length}));
            expect(n.hidden).toBe(true);expect(n.triggers).toBeGreaterThan(0);
            if(!n.items)await page.evaluate(()=>{window.__d=new AbortController();window.DokeHomeWorkers.create({signal:window.__d.signal})});
            await expect.poll(()=>page.locator('[data-worker-feed-item]').count()).toBeGreaterThan(0);
            await page.evaluate(()=>{const t=document.querySelector('[data-worker-trigger]');window.DokeOpenWorkerPreview(t.dataset.workerId,t)});
            await expect.poll(()=>page.locator('[data-worker-preview]').evaluate(x=>x.hidden)).toBe(false);
            const dom=await page.evaluate(()=>({items:document.querySelectorAll('[data-worker-feed-item]').length,caption:document.querySelectorAll('.worker-preview__caption').length,title:document.querySelectorAll('.worker-preview__title').length,actions:document.querySelectorAll('.worker-preview__actions').length,action:document.querySelectorAll('.worker-preview__action').length}));
            expect(dom).toEqual({items:6,caption:6,title:6,actions:6,action:24});
            console.log('DOM PASS|items=6|caption=6|title=6|actions=6|action=24');
            const out={};
            for(const w of [639,640,641,760,761,820,821]){
              await page.setViewportSize({width:w,height:900});
              const r=await page.evaluate(()=>{
                const item=[...document.querySelectorAll('[data-worker-feed-item]')].find(x=>{const b=x.getBoundingClientRect();return b.width>0&&b.height>0&&b.bottom>0&&b.top<innerHeight});
                if(!item)return null;
                const c=item.querySelector('.worker-preview__caption'),t=item.querySelector('.worker-preview__title'),as=item.querySelector('.worker-preview__actions'),a=item.querySelector('.worker-preview__action');
                const cs=getComputedStyle(c),ts=getComputedStyle(t),ss=getComputedStyle(as),ac=getComputedStyle(a),root=parseFloat(getComputedStyle(document.documentElement).fontSize),ib=item.getBoundingClientRect();
                return{id:item.dataset.workerId,root,m640:matchMedia('(max-width: 640px)').matches,m760:matchMedia('(max-width: 760px)').matches,m820:matchMedia('(max-width: 820px)').matches,left:parseFloat(cs.left),right:parseFloat(cs.right),bottom:parseFloat(cs.bottom),title:parseFloat(ts.fontSize),gap:parseFloat(ss.gap),width:parseFloat(ac.width),itemW:ib.width,itemH:ib.height,overflow:Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-innerWidth)};
              });
              expect(r).not.toBeNull();expect(r.itemW).toBeGreaterThan(0);expect(r.itemH).toBeGreaterThan(0);expect(r.overflow).toBeLessThanOrEqual(1);
              expect(r.m640).toBe(w<=640);expect(r.m760).toBe(w<=760);expect(r.m820).toBe(w<=820);
              out[w]=r;console.log(`WIDTH|${w}|${JSON.stringify(r)}`);
            }
            expect(Math.abs(out[640].title-out[640].root)).toBeLessThan(.12);
            expect(Math.abs(out[641].title-out[641].root*1.13)).toBeLessThan(.12);
            expect(out[640].title).not.toBe(out[641].title);
            expect(Math.abs(out[640].right-out[641].right)).toBeLessThan(.1);
            expect(Math.abs(out[640].gap-out[641].gap)).toBeLessThan(.1);
            expect(Math.abs(out[640].width-out[641].width)).toBeLessThan(.1);
            console.log('REACH PASS|boundary=640/641|visibleItem=1|productionDOM=1|overflow=0');
          });
          JS
          node node_modules/@playwright/test/cli.js test tests/ux-css-debt-028-reach.spec.js
      - if: always()
        run: |
          git reset --hard "$TARGET_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0"
