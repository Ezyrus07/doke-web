name: Doke UX-CSS-DEBT-028 Workers Feed Candidate Final
on:
  push:
    branches: [diag/ux-css-debt-028-workers-feed-reach-r1]
permissions: {contents: read}
jobs:
  candidate-final:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: e648173f3f98966e3f5bf15413bec3c08f97aab1
      TARGET_CSS: assets/css/pages/home-overlays/workers-feed-base.css
      HARNESS_SHA: 7c2340b12a8c4273759aabb121644cc9c798e6f4
    steps:
      - name: Checkout exact certified UX-CSS-DEBT-027 parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          clean: true

      - name: Guard exact parent and authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_CSS")" = "59b2304099888c9bab059c9db133c20107122a05"
          test "$(git hash-object index.html)" = "266e4323115909cf174bafb361a33b19dd7d5433"
          test "$(git hash-object resultados.html)" = "fc9833984725957829311d31037a2e3dad86c4f7"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}

      - name: Install dependencies and generate parent baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run audit:active-legacy-structures
          node scripts/generate-responsive-index-baseline.js
          test -s reports/responsive-index-baseline.json
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo 'PARENT RESPONSIVE BASELINE PASS|beforeCandidate=1'

      - name: Extract R17 harness and patch only post-audit scope guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$HARNESS_SHA^{commit}"
          git show "$HARNESS_SHA:.github/workflows/diag-ux-css-debt-028-workers-feed-reach.yml" > /tmp/r17.yml
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/r17.yml').read_text()
          start = "          cat > /tmp/ux-css-debt-028-candidate.js <<'JS'\n"
          end = "\n          JS\n"
          a = src.find(start)
          if a < 0:
              raise SystemExit('R17 heredoc start missing')
          b = src.find(end, a + len(start))
          if b < 0:
              raise SystemExit('R17 heredoc end missing')
          body = src[a + len(start):b]
          lines = [(line[10:] if line.startswith('          ') else line) for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          old = "    assert(cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim()===TARGET,'post-audit product scope drift');"
          new = """    const productScope=cp.execFileSync('git',['diff','--name-only','--','assets','index.html','resultados.html'],{encoding:'utf8'}).trim();
    assert(productScope===TARGET,`post-audit product scope drift: ${productScope}`);
    const finalNum=cp.execFileSync('git',['diff','--numstat','--',TARGET],{encoding:'utf8'}).trim().split(/\\s+/);
    assert(finalNum[0]==='0'&&finalNum[1]==='6',`post-audit target delta ${finalNum.join('/')}`);
    assert(cp.spawnSync('git',['diff','--quiet','--','index.html','resultados.html']).status===0,'ownership HTML persisted');
    assert(crypto.createHash('sha256').update(fs.readFileSync(TARGET)).digest('hex')===build.hash,'post-audit target hash drift');"""
          if script.count(old) != 1:
              raise SystemExit(f'expected one R17 scope guard, got {script.count(old)}')
          script = script.replace(old, new)
          Path('/tmp/ux-css-debt-028-candidate.js').write_text(script)
          print(f'R17 HARNESS PATCH PASS|source={Path("/tmp/r17.yml").stat().st_size}|candidateScript={len(script.encode())}|changedGuard=1')
          PY
          node --check /tmp/ux-css-debt-028-candidate.js

      - name: Run exact CSS-only candidate proof
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/responsive-index-baseline.json
          node /tmp/ux-css-debt-028-candidate.js

      - name: Restore exact certified parent
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          clean: true

      - name: Verify exact restored checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object "$TARGET_CSS")" = "59b2304099888c9bab059c9db133c20107122a05"
          test "$(git hash-object index.html)" = "266e4323115909cf174bafb361a33b19dd7d5433"
          test "$(git hash-object resultados.html)" = "fc9833984725957829311d31037a2e3dad86c4f7"
          test ! -e reports/responsive-index-baseline.json
          test -z "$(git status --porcelain)"
          echo "CHECKPOINT PASS|sha=$TARGET_SHA|productMutation=0|generatedArtifactsCleaned=1"
