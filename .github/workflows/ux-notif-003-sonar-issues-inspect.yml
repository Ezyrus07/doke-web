name: UX-NOTIF-003 Sonar Cleanup Apply

on:
  push:
    branches:
      - ux/ux-notif-003-toast-manager
    paths:
      - '.github/workflows/ux-notif-003-sonar-issues-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard exact cleanup parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f1d806366bb39bca774b74acd4cdb33661865670"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply Sonar cleanup
        run: python scripts/tmp-ux-notif-003-sonar-cleanup.py

      - name: Validate syntax and focused behavior
        run: |
          node --check assets/js/core/notification-toast.js
          node --check scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-toast-manager.js
          node scripts/test-ux-notif-003-toast-manager-runtime.js
          node scripts/test-ux-notif-003-in-app-delegation.js

      - name: Regenerate canonical matrix
        run: |
          npm run write:domain-completion-matrix
          npm run audit:domain-completion-matrix

      - name: Preserve notification regressions and governance
        run: |
          node scripts/test-ux-notif-001-notification-center.js
          node scripts/test-ux-notif-001-in-app-adapter.js
          node scripts/test-ux-notif-001-surface-contract.js
          node scripts/test-ux-notif-002-notification-event.js
          node scripts/test-ux-notif-002-repository-adapter.js
          node scripts/test-ux-notif-002-producer-envelopes.js
          node scripts/test-ux-notif-002-financial-producer-handoff.js
          node scripts/test-notification-authority-contract.js
          node scripts/test-notifications-supabase-repository-contract.js
          node scripts/audit-notifications-api-contract.js
          node scripts/test-ux-priv-001-account-storage.js
          node scripts/audit-auth-session-contracts.js
          npm run audit:agent-governance

      - name: Validate patch and publish functional cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add assets/js/core/notification-toast.js \
            scripts/test-ux-notif-003-toast-manager-runtime.js \
            docs/DOMAIN-COMPLETION-MATRIX.md
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No functional cleanup to commit.'; exit 1; }
          git commit -m 'fix(ux-notif-003): resolve Sonar toast code smells'
          git push origin HEAD:ux/ux-notif-003-toast-manager
