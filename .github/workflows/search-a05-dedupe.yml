name: Doke SEARCH-A05 Dedupe Once

on:
  pull_request:
    branches:
      - 'cat/**'
      - 'search/**'
    paths:
      - '.github/workflows/search-a05-dedupe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe-search-service:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout SEARCH branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Remove legacy deferred search service script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('resultados.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <script src="assets/js/services/search-service.js?v=20260501-stage31-domain-services" defer></script>\n'
          count = text.count(marker)
          if count > 1:
              raise SystemExit(f'Unexpected duplicate legacy marker count: {count}')
          if count == 1:
              text = text.replace(marker, '', 1)
              path.write_text(text, encoding='utf-8')
          if text.count('assets/js/services/search-service.js') != 1:
              raise SystemExit('search-service.js must remain loaded exactly once')
          PY

      - name: Commit deterministic script deduplication
        shell: bash
        run: |
          if git diff --quiet -- resultados.html; then
            echo "Search service already loads once."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados.html
          git commit -m "Load canonical search service once"
          git push origin HEAD:${TARGET_BRANCH}
