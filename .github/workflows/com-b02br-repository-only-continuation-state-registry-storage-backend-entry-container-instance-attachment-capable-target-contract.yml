name: COM-B02BR Repository-Only Attachment-Capable Target Contract

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - 'backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.js'
      - 'config/com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.json'
      - 'scripts/test-com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.js'
      - '.github/workflows/com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREDECESSOR_HEAD: dba3807bba3766029c44014203513c6277bcf53d
      PREDECESSOR_TREE: 6c319e41db71419a09322d10745ecc674254d877
      B02BQ_READINESS_BLOB: d6bc5dc59ff56487888a46b4a63c10729c1c040e
      B02BQ_CONFIG_BLOB: 2722f04cb98bf0bd05be4273c2672c8f8d3cc4b1
      B02AZ_INSTANCE_BLOB: 35e2bbe0b983d6a249bc7f8cb4ee157d3b85d654
      B02BO_BINDING_BLOB: 16da9ada3a308535e5515a242ac381c54c7c2fc4
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      ROUTE_REGISTRY_BLOB: 04a039c1967ffb59502e05584d05831f7c9a1a41
      MODULE_ROUTE_LOADER_BLOB: 85e061fe36339596ba9558a503b2fa7ce02574ae
      COMMUNITY_ROUTE_HANDLERS_BLOB: b7f9f330f6d92c676eb76456b669bdf8dc749c20
      TARGET: backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.js
      CONFIG: config/com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.json
      TEST: scripts/test-com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.js
      WORKFLOW: .github/workflows/com-b02br-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-contract.yml

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze predecessor lineage and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PREDECESSOR_HEAD^{tree}")" = "$PREDECESSOR_TREE"
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR_HEAD"
          expected="$(printf '%s\n' "$TARGET" "$CONFIG" "$TEST" "$WORKFLOW" | sort)"
          actual="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization-readiness.js)" = "$B02BQ_READINESS_BLOB"
          test "$(git rev-parse HEAD:config/com-b02bq-repository-only-continuation-state-registry-storage-backend-entry-container-instance-attachment-capable-target-materialization-readiness.json)" = "$B02BQ_CONFIG_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-inert-instance.js)" = "$B02AZ_INSTANCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-entry-container-instance-executable-operation-method-references-binding.js)" = "$B02BO_BINDING_BLOB"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/route-registry.js)" = "$ROUTE_REGISTRY_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/module-route-loader.js)" = "$MODULE_ROUTE_LOADER_BLOB"
          test "$(git rev-parse HEAD:backend/modules/communities/route-handlers.js)" = "$COMMUNITY_ROUTE_HANDLERS_BLOB"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax semantic and hard-block B02BR
        shell: bash
        run: |
          set -euo pipefail
          node --check "$TARGET"
          node --check "$TEST"
          node "$TEST"
          ! grep -E 'createClient\(|\.rpc\(|\.from\(|fetch\(|process\.env|SUPABASE_SERVICE_ROLE_KEY' "$TARGET"
          ! grep -E 'Object\.definePropert(y|ies)\(' "$TARGET"
          ! grep -E '\.(call|apply)[[:space:]]*\(|Reflect\.apply[[:space:]]*\(' "$TARGET"
          ! grep -E 'attachmentCapableTargetImplementationMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'attachmentCapableTargetMaterialized[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'operationMethodsAttachedToInstance[[:space:]]*:[[:space:]]*true|attachmentAppliedToEntryContainerInstance[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'executableOperationMethodsInvoked[[:space:]]*:[[:space:]]*true' "$TARGET"
          ! grep -E 'continuationStateStored[[:space:]]*:[[:space:]]*true|registryOperationInvoked[[:space:]]*:[[:space:]]*true|registryLookupExecuted[[:space:]]*:[[:space:]]*true|registryReleaseExecuted[[:space:]]*:[[:space:]]*true' "$TARGET"

      - name: Domain Completion Matrix and governance
        run: |
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PREDECESSOR_HEAD" HEAD
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
