name: TEMP COM-B02AQ Domain Completion Matrix Reconciliation

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/temp-com-b02aq-domain-completion-matrix-reconciliation.yml'

permissions:
  contents: write

jobs:
  reconcile-derived-matrix:
    if: github.event.pull_request.head.ref == 'com/com-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: f9882801113cbf70e4b9db41f6af09cf2059764c
      CANDIDATE_TREE: 530f2546c6d55eb83c0e38d8d1aa644def129466
      PREDECESSOR_HEAD: 10c159ae94910af9beb8bdd718e8e17724bcc194
      MATRIX_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
      BRANCH: com/com-001-baseline-audit
      TEMP_PATH: .github/workflows/temp-com-b02aq-domain-completion-matrix-reconciliation.yml
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact temporary reconciliation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze B02AQ candidate and temporary-only lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse "$CANDIDATE_HEAD^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          actual="$(git diff --name-only "$CANDIDATE_HEAD" HEAD | sort)"
          test "$actual" = "$TEMP_PATH"
          expected_candidate="$(printf '%s\n' \
            .github/workflows/com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-materialization-readiness.js \
            config/com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.json \
            scripts/test-com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.js | sort)"
          actual_candidate="$(git diff --name-only "$PREDECESSOR_HEAD" "$CANDIDATE_HEAD" | sort)"
          test "$actual_candidate" = "$expected_candidate"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate only canonical derived Matrix artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run write:domain-completion-matrix
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json | sort)"
          test "$changed" = "$expected"

      - name: Validate regenerated artifacts and repository governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          node --check backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-materialization-readiness.js
          node --check scripts/test-com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.js
          node scripts/test-com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.js
          git diff --check "$PREDECESSOR_HEAD"

      - name: Commit derived artifacts and self-remove TEMP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/DOMAIN-COMPLETION-MATRIX.md reports/generated/domain-completion-matrix-report.json
          git rm -- "$TEMP_PATH"
          git commit -m "docs(com): reconcile B02AQ derived matrix artifacts"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$MATRIX_SOURCE_BLOB"
          ! git ls-tree -r --name-only HEAD | grep -Fx "$TEMP_PATH"
          expected_final="$(printf '%s\n' \
            .github/workflows/com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.yml \
            backend/shared/http/repository-only-route-continuation-state-registry-storage-backend-instance-materialization-readiness.js \
            config/com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.json \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json \
            scripts/test-com-b02aq-repository-only-continuation-state-registry-storage-backend-instance-materialization-readiness.js | sort)"
          actual_final="$(git diff --name-only "$PREDECESSOR_HEAD" HEAD | sort)"
          test "$actual_final" = "$expected_final"

      - name: Fast-forward branch only if temporary head is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$PR_HEAD_SHA"
          git push origin HEAD:refs/heads/$BRANCH
