name: TEMP UX Desktop Resultados Baseline Lineage R4

on:
  push:
    branches:
      - diag/ux-desktop-resultados-baseline-lineage-r4

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PARENT: 14bdb1af9cfefff4dfd27a78b937443975266001
      PARENT_TREE: 32f449b165b8cb119600c702c0625cc7199f3416
      LAST_RESULTS_CERT: 6fee4223f75b86833e0d6540315d6185d2e74f2a
      WORKFLOW_PATH: .github/workflows/0000-temp-ux-desktop-resultados-baseline-lineage-r4.yml
      DOKE_E2E_DISABLE_REMOTE_SERVICES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify diagnostic lineage only
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n1 "$HEAD_SHA" | awk '{print $2}')" = "$PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          git merge-base --is-ancestor "$LAST_RESULTS_CERT" "$PARENT"
          echo LINEAGE=PASS
          echo PRODUCT_MUTATION=false
          echo MATRIX_MUTATION=false

      - name: Install locked Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install chromium

      - name: Prove baseline chronology
        shell: bash
        run: |
          set -euo pipefail
          baseline_commit="$(git log -1 --format=%H -- tests/visual/doke-visual-regression.spec.js-snapshots/resultados-desktop-1366x768-win32.png)"
          baseline_date="$(git log -1 --format=%cI -- tests/visual/doke-visual-regression.spec.js-snapshots/resultados-desktop-1366x768-win32.png)"
          results_html_commit="$(git log -1 --format=%H "$PARENT" -- resultados.html)"
          results_html_date="$(git log -1 --format=%cI "$PARENT" -- resultados.html)"
          results_css_commit="$(git log -1 --format=%H "$PARENT" -- assets/css/pages/search-results.css)"
          results_css_date="$(git log -1 --format=%cI "$PARENT" -- assets/css/pages/search-results.css)"
          echo "BASELINE_COMMIT=$baseline_commit"
          echo "BASELINE_DATE=$baseline_date"
          echo "RESULTADOS_HTML_LAST_COMMIT=$results_html_commit"
          echo "RESULTADOS_HTML_LAST_DATE=$results_html_date"
          echo "RESULTADOS_CSS_LAST_COMMIT=$results_css_commit"
          echo "RESULTADOS_CSS_LAST_DATE=$results_css_date"
          test "$baseline_commit" = "43bf400830edb2ad9ca44643acca7abb656cf454"
          git merge-base --is-ancestor "$baseline_commit" "$LAST_RESULTS_CERT"
          test "$results_css_commit" = "$LAST_RESULTS_CERT"
          echo BASELINE_CHRONOLOGY=PASS

      - name: Capture current vs last Resultados certification on identical Win32 browser
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/current-results" "$PARENT" >/dev/null
          git worktree add --detach "$RUNNER_TEMP/cert-results" "$LAST_RESULTS_CERT" >/dev/null
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const http = require('http');

          const root = process.cwd();
          const currentRoot = path.join(process.env.RUNNER_TEMP, 'current-results');
          const certRoot = path.join(process.env.RUNNER_TEMP, 'cert-results');
          const serverScript = path.join(root, 'scripts', 'serve-static-site.js');

          function startServer(cwd, port) {
            return spawn(process.execPath, [serverScript, '--host=127.0.0.1', `--port=${port}`], {
              cwd,
              env: { ...process.env, DOKE_E2E_DISABLE_REMOTE_SERVICES: '1' },
              stdio: ['ignore', 'pipe', 'pipe']
            });
          }
          function waitFor(port) {
            return new Promise((resolve, reject) => {
              let attempts = 0;
              const probe = () => {
                attempts += 1;
                const req = http.get(`http://127.0.0.1:${port}/resultados.html`, (res) => {
                  res.resume();
                  if (res.statusCode === 200) return resolve();
                  if (attempts > 50) return reject(new Error(`server ${port} status ${res.statusCode}`));
                  setTimeout(probe, 250);
                });
                req.on('error', () => attempts > 50 ? reject(new Error(`server ${port} unavailable`)) : setTimeout(probe, 250));
              };
              probe();
            });
          }
          async function routeExternal(page) {
            await page.route('https://unpkg.com/**', (route) => route.fulfill({ contentType:'application/javascript', body:'' }));
            await page.route('https://cdn.jsdelivr.net/**', (route) => route.fulfill({ contentType:'application/javascript', body:'' }));
            await page.route('https://fonts.googleapis.com/**', (route) => route.fulfill({ contentType:'text/css', body:'' }));
            await page.route('https://fonts.gstatic.com/**', (route) => route.abort());
          }
          async function stable(page) {
            await page.waitForLoadState('domcontentloaded');
            await page.waitForLoadState('networkidle').catch(() => {});
            await page.addStyleTag({ content:'*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important;transition-delay:0s!important;scroll-behavior:auto!important;caret-color:transparent!important}' });
            await page.waitForTimeout(450);
          }
          async function load(page, port) {
            const errors = [];
            page.on('pageerror', (e) => errors.push(String(e)));
            await routeExternal(page);
            await page.goto(`http://127.0.0.1:${port}/resultados.html`);
            await stable(page);
            if (errors.length) throw new Error(`page errors port=${port}: ${JSON.stringify(errors)}`);
            return page.screenshot({ fullPage:false, animations:'disabled' });
          }
          async function signature(page) {
            return page.evaluate(() => {
              const visible = (el) => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const read = (selector) => {
                const el = Array.from(document.querySelectorAll(selector)).find(visible);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  left:+r.left.toFixed(2), top:+r.top.toFixed(2), width:+r.width.toFixed(2), height:+r.height.toFixed(2),
                  display:s.display, position:s.position, gridTemplateColumns:s.gridTemplateColumns,
                  gap:s.gap, padding:s.padding, margin:s.margin, borderRadius:s.borderRadius,
                  backgroundColor:s.backgroundColor, color:s.color, fontSize:s.fontSize, lineHeight:s.lineHeight
                };
              };
              const selectors = [
                '[data-app-header] .app-header__inner', '.search-results-workspace', '.results-searchbar',
                '.results-layout', '.results-main', '.results-sidebar', '.marketplace-card', '.service-card'
              ];
              const values = {};
              for (const selector of selectors) values[selector] = read(selector);
              return {
                dataPage: document.body?.dataset.page || '',
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                values
              };
            });
          }
          async function comparePng(context, a, b) {
            const p = await context.newPage();
            const result = await p.evaluate(async ({a64,b64}) => {
              const load = (src) => new Promise((resolve,reject) => {
                const img = new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=src;
              });
              const [aImg,bImg] = await Promise.all([load(`data:image/png;base64,${a64}`), load(`data:image/png;base64,${b64}`)]);
              if (aImg.width !== bImg.width || aImg.height !== bImg.height) return { dimensionMismatch:true, a:[aImg.width,aImg.height], b:[bImg.width,bImg.height] };
              const w=aImg.width,h=aImg.height;
              const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d',{willReadFrequently:true});
              ctx.drawImage(aImg,0,0); const ad=ctx.getImageData(0,0,w,h).data;
              ctx.clearRect(0,0,w,h); ctx.drawImage(bImg,0,0); const bd=ctx.getImageData(0,0,w,h).data;
              let exact=0, material=0, minX=w,minY=h,maxX=-1,maxY=-1;
              const tiles = Array.from({length:16},()=>0);
              for(let y=0;y<h;y++) for(let x=0;x<w;x++) {
                const i=(y*w+x)*4;
                const d=Math.max(Math.abs(ad[i]-bd[i]),Math.abs(ad[i+1]-bd[i+1]),Math.abs(ad[i+2]-bd[i+2]),Math.abs(ad[i+3]-bd[i+3]));
                if(d>0) exact++;
                if(d>51){ material++; minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y); const tx=Math.min(3,Math.floor(x/(w/4))),ty=Math.min(3,Math.floor(y/(h/4))); tiles[ty*4+tx]++; }
              }
              const total=w*h;
              return {dimensionMismatch:false,width:w,height:h,exactPixels:exact,exactRatio:exact/total,materialPixels:material,materialRatio:material/total,bbox:material?{minX,minY,maxX,maxY}:null,tiles};
            }, {a64:a.toString('base64'),b64:b.toString('base64')});
            await p.close();
            return result;
          }

          const currentServer = startServer(currentRoot, 5500);
          const certServer = startServer(certRoot, 5501);
          (async()=>{
            let browser;
            try {
              await Promise.all([waitFor(5500),waitFor(5501)]);
              browser=await chromium.launch();
              const context=await browser.newContext({viewport:{width:1366,height:768}});
              const current=await context.newPage();
              const cert=await context.newPage();
              const currentPng=await load(current,5500);
              const certPng=await load(cert,5501);
              const currentSig=await signature(current);
              const certSig=await signature(cert);
              const ab=await comparePng(context,currentPng,certPng);
              const baseline=fs.readFileSync(path.join(currentRoot,'tests/visual/doke-visual-regression.spec.js-snapshots/resultados-desktop-1366x768-win32.png'));
              const currentVsBaseline=await comparePng(context,currentPng,baseline);
              const certVsBaseline=await comparePng(context,certPng,baseline);
              console.log(`CURRENT_SIGNATURE=${JSON.stringify(currentSig)}`);
              console.log(`CERT_SIGNATURE=${JSON.stringify(certSig)}`);
              console.log(`CURRENT_VS_LAST_RESULTS_CERT=${JSON.stringify(ab)}`);
              console.log(`CURRENT_VS_JUNE_BASELINE=${JSON.stringify(currentVsBaseline)}`);
              console.log(`LAST_RESULTS_CERT_VS_JUNE_BASELINE=${JSON.stringify(certVsBaseline)}`);
              if (ab.dimensionMismatch) throw new Error('current/cert dimensions differ');
              if (currentSig.dataPage !== 'resultados' || certSig.dataPage !== 'resultados') throw new Error('wrong data-page');
              if (currentSig.scrollWidth > currentSig.clientWidth + 1 || certSig.scrollWidth > certSig.clientWidth + 1) throw new Error('horizontal overflow current/cert');
              console.log('RESULTADOS_LINEAGE_AB_CAPTURE=PASS');
            } finally {
              if(browser) await browser.close().catch(()=>{});
              currentServer.kill(); certServer.kill();
            }
          })().catch((e)=>{console.error(e);currentServer.kill();certServer.kill();process.exit(1);});
          NODE

      - name: Final diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .
          git clean -fd
          test "$(git rev-parse HEAD^1)" = "$PARENT"
          echo CRITERIA_RELAXED=0
          echo INTRODUCED_PRODUCT_MUTATIONS=0
          echo RESULTADOS_BASELINE_LINEAGE_DIAGNOSTIC=PASS
