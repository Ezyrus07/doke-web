name: Doke SCHED-B04C Execution Ledger Reconciliation

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-closure-governance-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-execution-ledger-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-ledger:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Reconcile execution ledger and contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          execution_path = Path('config/sched-001-b04c-authenticated-ord-sched-composition-canary-execution.json')
          execution = json.loads(execution_path.read_text())
          execution['authorization']['status'] = 'consumed_success'
          execution['authorization']['mayBeReusedForRetry'] = False
          attempts = execution['executionState'].setdefault('authorizedAttempts', [])
          additions = [
            {
              'runId': 30715551681,
              'jobId': 91410396095,
              'headSha': '13fb73a144a2f62dcc9a8cf113a2dedb54b4ab49',
              'result': 'failed_closed',
              'failureCode': 'DOKE_SCHED_B04C_EXPECTED_FAILURE_MISSING',
              'failureClass': 'check_violation_domain_error_mapping_mismatch',
              'transactionRolledBack': True,
              'postRollbackVerification': 'passed',
              'residueCountsZero': True,
              'authorityCountDeltaZero': True
            },
            {
              'runId': 30715701371,
              'jobId': 91410778851,
              'headSha': '476a90dcba0f34c23bc69abebee756d84d32a090',
              'result': 'failed_closed',
              'failureClass': 'transaction_aborted_after_unrecovered_negative_sql',
              'diagnosticSqlState': '25P02',
              'transactionRolledBack': True,
              'postRollbackVerification': 'passed',
              'residueCountsZero': True,
              'authorityCountDeltaZero': True
            },
            {
              'runId': 30715885793,
              'jobId': 91411247154,
              'headSha': '3774c701f95e4376a332828b629febaf5711d604',
              'result': 'failed_closed',
              'failureCode': 'DOKE_SCHED_B04C_PARTIAL_FAILURE_CHANGED_VERSION',
              'failureClass': 'bigint_driver_representation_false_negative',
              'transactionRolledBack': True,
              'postRollbackVerification': 'passed',
              'residueCountsZero': True,
              'authorityCountDeltaZero': True
            },
            {
              'runId': 30716088197,
              'jobId': 91411759384,
              'headSha': 'c2bddcd061d2136e07d8c3790abf8f66884c480f',
              'result': 'authenticated_ord_sched_composition_canary_passed',
              'transactionRolledBack': True,
              'postRollbackVerification': 'passed',
              'residueCountsZero': True,
              'authorityCountDeltaZero': True
            }
          ]
          existing = {item.get('runId') for item in attempts}
          attempts.extend(item for item in additions if item['runId'] not in existing)
          state = execution['executionState']
          state.update({
            'authenticatedCanaryExecuted': True,
            'canaryPassed': True,
            'blockedBy': None,
            'stagingReadPreflightsPerformed': 8,
            'transactionalAttemptsPerformed': 8,
            'successfulAttempts': 1,
            'failedClosedAttemptsBeforeSuccess': 7,
            'allAuthorizedAttemptsRolledBack': True,
            'allResidueCountsZero': True,
            'allAuthorityCountDeltasZero': True,
            'persistentMutationsPerformed': 0,
            'stagingReadsPerformed': 8,
            'stagingMutationsPerformed': 0,
            'temporaryAuthorizedWorkflowRemoved': True,
            'temporaryAuthorizedWorkflowRemovalCommit': '6b82edfb781ea167b6ec43113ac42ba2b0eb0de3',
            'temporaryBigintReconcilerRemoved': True,
            'temporaryBigintReconcilerRemovalCommit': '015b383d16611a4510aca769fff71b16764b654b'
          })
          state['successfulRun'] = {
            'runId': 30716088197,
            'jobId': 91411759384,
            'headSha': 'c2bddcd061d2136e07d8c3790abf8f66884c480f',
            'observedAt': '2026-08-01T20:02:54.753Z',
            'result': 'authenticated_ord_sched_composition_canary_passed',
            'personas': 4,
            'publishedServices': 1,
            'orders': 3,
            'isolation': 'SERIALIZABLE',
            'commandSavepoints': True,
            'finalStatement': 'ROLLBACK',
            'committed': False,
            'rolledBack': True,
            'residueCounters': 15,
            'residueCountsZero': True,
            'authorityCounters': 8,
            'authorityCountDeltaZero': True,
            'artifactId': 8823372228,
            'artifactSha256': '11c36ae4cf142dbc11f322302ade862cae178017b8edee831235d8439006df92'
          }
          execution_path.write_text(json.dumps(execution, indent=2) + '\n')

          audit_path = Path('scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js')
          audit = audit_path.read_text()
          audit = audit.replace(
            "  'consumed_failed_closed_blocked_on_b04d'\n].includes(config.authorization.status)",
            "  'consumed_failed_closed_blocked_on_b04d',\n  'consumed_success'\n].includes(config.authorization.status)"
          )
          old = """if (config.authorization.status === 'consumed_failed_closed_blocked_on_b04d') {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, true);
  assert.strictEqual(config.executionState.canaryPassed, false);
  assert.strictEqual(config.executionState.blockedBy, 'SCHED-B04D-STAGING-MIGRATION');
  assert.strictEqual(config.executionState.persistentMutationsPerformed, 0);
  assert.strictEqual(config.executionState.allAuthorizedAttemptsRolledBack, true);
  assert.strictEqual(config.executionState.allResidueCountsZero, true);
}
"""
          new = old + """else if (config.authorization.status === 'consumed_success') {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, true);
  assert.strictEqual(config.executionState.canaryPassed, true);
  assert.strictEqual(config.executionState.blockedBy, null);
  assert.strictEqual(config.executionState.successfulRun.runId, 30716088197);
  assert.strictEqual(config.executionState.successfulRun.result, 'authenticated_ord_sched_composition_canary_passed');
  assert.strictEqual(config.executionState.successfulRun.finalStatement, 'ROLLBACK');
  assert.strictEqual(config.executionState.allAuthorizedAttemptsRolledBack, true);
  assert.strictEqual(config.executionState.allResidueCountsZero, true);
  assert.strictEqual(config.executionState.allAuthorityCountDeltasZero, true);
}
"""
          if audit.count(old) != 1:
            raise SystemExit('Unexpected execution audit state block')
          audit_path.write_text(audit.replace(old, new, 1))

          test_path = Path('scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js')
          test = test_path.read_text()
          test = test.replace(
            "  'consumed_failed_closed_blocked_on_b04d'\n].includes(config.authorization.status));",
            "  'consumed_failed_closed_blocked_on_b04d',\n  'consumed_success'\n].includes(config.authorization.status));"
          )
          old_test = """if (config.authorization.status === 'awaiting_exact_authorization') {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, false);
} else {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, true);
  assert.strictEqual(config.executionState.canaryPassed, false);
  assert.strictEqual(config.executionState.blockedBy, 'SCHED-B04D-STAGING-MIGRATION');
  assert.strictEqual(config.executionState.persistentMutationsPerformed, 0);
  assert.strictEqual(config.executionState.allAuthorizedAttemptsRolledBack, true);
  assert.strictEqual(config.executionState.allResidueCountsZero, true);
}
"""
          new_test = """if (config.authorization.status === 'awaiting_exact_authorization') {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, false);
} else if (config.authorization.status === 'consumed_success') {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, true);
  assert.strictEqual(config.executionState.canaryPassed, true);
  assert.strictEqual(config.executionState.blockedBy, null);
  assert.strictEqual(config.executionState.successfulRun.runId, 30716088197);
  assert.strictEqual(config.executionState.successfulRun.finalStatement, 'ROLLBACK');
  assert.strictEqual(config.executionState.allAuthorizedAttemptsRolledBack, true);
  assert.strictEqual(config.executionState.allResidueCountsZero, true);
  assert.strictEqual(config.executionState.allAuthorityCountDeltasZero, true);
} else {
  assert.strictEqual(config.executionState.authenticatedCanaryExecuted, true);
  assert.strictEqual(config.executionState.canaryPassed, false);
  assert.strictEqual(config.executionState.blockedBy, 'SCHED-B04D-STAGING-MIGRATION');
  assert.strictEqual(config.executionState.persistentMutationsPerformed, 0);
  assert.strictEqual(config.executionState.allAuthorizedAttemptsRolledBack, true);
  assert.strictEqual(config.executionState.allResidueCountsZero, true);
}
"""
          if test.count(old_test) != 1:
            raise SystemExit('Unexpected execution test state block')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY

      - name: Validate execution ledger
        run: |
          set -euo pipefail
          node scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          node scripts/audit-sched-001-b04d-canonical-order-projection-guard-readiness.js
          node scripts/test-sched-001-b04d-canonical-order-projection-guard-runtime.js
          node scripts/test-sched-001-a05-postgres-repository-runtime.js
          git diff --check

      - name: Publish execution ledger
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add config/sched-001-b04c-authenticated-ord-sched-composition-canary-execution.json
          git add scripts/audit-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          git add scripts/test-sched-001-b04c-authenticated-ord-sched-composition-canary-execution.js
          git diff --cached --check
          git commit -m "docs(sched): reconcile successful B04C execution ledger"
          git push origin HEAD:ord/ord-001-baseline-audit
