[CONFIG_PATH, EVIDENCE_PATH, DOC_PATH, EXECUTION_PATH, MATRIX_PATH, WORKFLOW_PATH, PACKAGE_PATH]
  .forEach((file) => assert(fs.existsSync(file), `Missing B04C closure asset: ${file}`));

const config = JSON.parse(fs.readFileSync(CONFIG_PATH, 'utf8'));
