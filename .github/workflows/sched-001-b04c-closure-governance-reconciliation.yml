['authenticated_ord_sched_composition_canary_passed', 'SERIALIZABLE', 'ROLLBACK',
 'SCHED-B04', 'ORD-B04', 'ORD-B02', 'ORD-B03', 'ORD-B05'].forEach((fragment) => {
