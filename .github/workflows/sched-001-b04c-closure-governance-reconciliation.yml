name: Doke SCHED-B04C Closure Evidence Phase One

on:
  pull_request:
    branches:
      - search/search-ux02-intent-favorites-clean
    paths:
      - '.github/workflows/sched-001-b04c-closure-governance-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: sched-b04c-closure-evidence-phase-one
  cancel-in-progress: false

jobs:
  publish-evidence:
    if: >-
      github.event.pull_request.number == 25 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ord/ord-001-baseline-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ord/ord-001-baseline-audit
          fetch-depth: 0

      - name: Write immutable B04C closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          closure = {
            "schemaVersion": 1,
            "domain": "SCHED-001",
            "dependentDomain": "ORD-001",
            "sublot": "SCHED-B04C-CLOSURE",
            "contractVersion": "sched-b04c-authenticated-ord-sched-composition-canary-closure-v1",
            "status": "authenticated_staging_composition_canary_passed_pending_matrix_reconciliation",
            "target": {
              "repository": "Ezyrus07/doke-web",
              "pullRequest": 25,
              "branch": "ord/ord-001-baseline-audit",
              "environment": "doke-web-staging",
              "projectRef": "zwkczgewzbsorbrjuzpb"
            },
            "authorization": {
              "exactPhrase": "I_EXPLICITLY_AUTHORIZE_SCHED_B04C_AUTHENTICATED_ORD_SCHED_COMPOSITION_CANARIES_ON_DOKE_STAGING",
              "status": "consumed",
              "mayBeReused": False,
              "genericContinuationAllowed": False
            },
            "successfulRun": {
              "runId": 30716088197,
              "jobId": 91411759384,
              "headSha": "c2bddcd061d2136e07d8c3790abf8f66884c480f",
              "observedAt": "2026-08-01T20:02:54.753Z",
              "result": "authenticated_ord_sched_composition_canary_passed",
              "personas": 4,
              "publishedServices": 1,
              "orders": 3,
              "isolation": "SERIALIZABLE",
              "commandSavepoints": True,
              "finalStatement": "ROLLBACK",
              "committed": False,
              "rolledBack": True,
              "residueCounters": 15,
              "residueCountsZero": True,
              "authorityCounters": 8,
              "authorityCountDeltaZero": True,
              "artifactId": 8823372228,
              "artifactSha256": "11c36ae4cf142dbc11f322302ade862cae178017b8edee831235d8439006df92"
            },
            "assertions": {
              "clientPreferenceRemainedIntent": True,
              "holdAllowedWithoutSchedulingOrder": True,
              "clientConfirmationForbidden": True,
              "idempotentReplayPassed": True,
              "divergentPayloadRejected": True,
              "professionalAcceptAllowed": True,
              "manualScheduledTransitionForbidden": True,
              "startRequiredCanonicalAuthority": True,
              "confirmationProjectedAtomically": True,
              "reschedulePreservedReservationId": True,
              "cancellationClearedProjection": True,
              "genericCancellationBlocked": True,
              "differentReservationReplacementRejected": True,
              "partialProjectionRolledBack": True,
              "incompleteProjectionRejected": True,
              "orderScheduledEventObserved": True,
              "orderAcceptedEventObserved": True,
              "sharedCorrelationObserved": True
            },
            "attempts": {
              "totalAuthorized": 8,
              "failedClosedBeforeSuccess": 7,
              "successful": 1,
              "allEndedInRollback": True,
              "allResidueCountsZero": True,
              "allAuthorityCountDeltasZero": True
            },
            "independentPostRunVerification": {
              "performed": True,
              "residueCountersChecked": 15,
              "allResidueCountsZero": True,
              "authorityCountersChecked": 8,
              "allAuthorityCountsZero": True
            },
            "prohibitedActionsObserved": {
              "productionAccess": 0,
              "migrationsApplied": 0,
              "deployments": 0,
              "cronActivations": 0,
              "workerActivations": 0,
              "frontendConnections": 0,
              "billingChanges": 0,
              "infrastructureChanges": 0,
              "mergePerformed": False,
              "autoMergeEnabled": False,
              "realUserDataUsed": False,
              "persistentCanaryRows": 0
            }
          }

          config_path = Path('config/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.json')
          evidence_path = Path('docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.json')
          doc_path = Path('docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          payload = json.dumps(closure, indent=2, ensure_ascii=False) + '\n'
          config_path.write_text(payload)
          evidence_path.write_text(payload)
          doc_path.write_text('''# SCHED-001 / B04C — Authenticated ORD/SCHED staging closure

## Result

The exactly authorized authenticated ORD/SCHED composition canary passed on Doke staging in run `30716088197`, job `91411759384`, at head `c2bddcd061d2136e07d8c3790abf8f66884c480f`.

The authorization was consumed and cannot be reused.

## Proven behavior

The canary used four synthetic authenticated personas, one synthetic published service and three synthetic orders inside one PostgreSQL `SERIALIZABLE` transaction. It proved hold, confirmation, reschedule, canonical cancellation, idempotency, divergent-payload rejection, canonical start authority, reservation replacement rejection, incomplete projection rejection, partial-projection rollback and correlated ORD events.

## Transaction and cleanup

The final statement was `ROLLBACK`; `COMMIT` was prohibited. All 15 canary residue counters were zero and all 8 authority counters were unchanged. Independent post-run Supabase verification reconfirmed zero residue and zero authority rows.

Seven earlier authorized attempts failed closed. Every attempt ended in rollback with zero residue and no authority drift.

## Scope preserved

No production access, migration, deploy, frontend connection, Cron activation, worker activation, billing change, infrastructure change, merge, auto-merge, real-user-data use or persistent canary row occurred.

Matrix and blocker reconciliation are intentionally performed in a separate validated phase.
''')

          loaded = json.loads(config_path.read_text())
          assert loaded == json.loads(evidence_path.read_text())
          assert loaded['successfulRun']['result'] == 'authenticated_ord_sched_composition_canary_passed'
          assert loaded['successfulRun']['finalStatement'] == 'ROLLBACK'
          assert loaded['successfulRun']['residueCountsZero'] is True
          assert loaded['successfulRun']['authorityCountDeltaZero'] is True
          assert loaded['attempts']['totalAuthorized'] == 8
          PY

      - name: Publish closure evidence
        run: |
          set -euo pipefail
          git config user.name "doke-ci"
          git config user.email "doke-ci@users.noreply.github.com"
          git add config/sched-001-b04c-authenticated-ord-sched-composition-canary-closure.json
          git add docs/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.md
          git add docs/validation/SCHED-001-B04C-AUTHENTICATED-ORD-SCHED-COMPOSITION-CANARY-CLOSURE.json
          git diff --cached --check
          git commit -m "docs(sched): record successful B04C staging composition"
          git push origin HEAD:ord/ord-001-baseline-audit
