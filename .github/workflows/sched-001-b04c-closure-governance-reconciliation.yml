## Result

The exactly authorized authenticated ORD/SCHED composition canary passed on Doke staging in GitHub Actions run `30716088197`, job `91411759384`, at head `c2bddcd061d2136e07d8c3790abf8f66884c480f`.

The exact authorization was consumed:

```text
I_EXPLICITLY_AUTHORIZE_SCHED_B04C_AUTHENTICATED_ORD_SCHED_COMPOSITION_CANARIES_ON_DOKE_STAGING
```

It cannot be reused.

## Proven behavior

The canary used four synthetic authenticated personas, one synthetic published service and three synthetic orders inside one PostgreSQL `SERIALIZABLE` transaction. It proved:

- client scheduling preference remains intent rather than order authority;
- hold creation does not schedule the order;
- client confirmation is denied;
- idempotent replay returns the same result and divergent payload reuse is rejected;
- professionals can accept orders but cannot manufacture scheduled state;
- starting work requires the matching confirmed canonical reservation;
- confirmation atomically projects reservation reference, time and `scheduled` status;
- rescheduling preserves the canonical reservation ID;
- generic cancellation is blocked while canonical schedule authority is active;
- canonical reservation cancellation atomically clears reference and time and returns the order to `accepted`;
- replacing a canonical reservation with a reservation from another order is rejected;
- incomplete projection is rejected;
- a failed cross-domain projection rolls back to its command savepoint without changing the prior order or reservation state;
- ORD scheduled and accepted events are emitted under the shared correlation ID.

## Transaction and cleanup

The outer transaction ended with `ROLLBACK`; `COMMIT` was prohibited. All 15 canary residue counters were zero, and all 8 authority counters were unchanged. An independent post-run Supabase query reconfirmed zero residue and zero authority rows.

Seven earlier authorized attempts failed closed while progressively exposing and correcting harness assumptions. Every attempt ended in rollback with zero residue and no authority drift. The successful attempt did not weaken B04D or the generic ORD lifecycle graph.

## Blocker decision

The authenticated staging evidence closes:

- `SCHED-B04` — canonical ORD integration;
- `ORD-B04` — scheduling dependency.

This does not complete either domain. SCHED remains maturity `3`, server authority `partial`, staging evidence `staging_canary`, because frontend activation, continuous hold-expiration operations and production release remain separately gated.

ORD still has `ORD-B02`, `ORD-B03` and `ORD-B05` open.

## Explicitly untouched

No production access, migration, deploy, frontend connection, Cron activation, worker activation, billing change, infrastructure change, merge, auto-merge, real-user-data use or persistent canary row occurred.
''')

