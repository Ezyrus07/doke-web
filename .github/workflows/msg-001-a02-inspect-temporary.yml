name: Doke Temporary MSG-A02 Repository Inspector

on:
  pull_request:
    branches:
      - ord/ord-001-baseline-audit
    paths:
      - '.github/workflows/msg-001-a02-inspect-temporary.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'msg/msg-001-baseline-audit' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msg/msg-001-baseline-audit
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect authority decision points
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const source = fs.readFileSync('assets/js/repositories/messages-repository.js', 'utf8');
          const markers = [
            'function getSessionUser()',
            'function loadLocal(options)',
            'function loadRemote(options)',
            'function load(options)',
            'function list(filters)',
            'function save(conversation)',
            'function remove(id)',
            'repositories.messages ='
          ];
          for (const marker of markers) {
            const index = source.indexOf(marker);
            console.log('\n===== ' + marker + ' @ ' + index + ' =====');
            if (index < 0) continue;
            console.log(source.slice(index, index + 4200));
          }
          NODE
