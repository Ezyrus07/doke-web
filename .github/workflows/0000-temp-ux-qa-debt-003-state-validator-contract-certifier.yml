name: TEMP UX-QA-DEBT-003 Matrix Differential

on:
  push:
    branches:
      - diag/ux-qa-debt-003-state-validator-contract-certifier

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare parent and frozen candidate Matrix audit
        shell: bash
        run: |
          set -u
          PARENT='bac1f3578166b0db96b6f70ca742e17fd1980c71'
          CANDIDATE='bfb77e3fa1bfd1694094b6270751aed2c6fda2e7'
          for ref in "$PARENT" "$CANDIDATE"; do
            git checkout --detach "$ref"
            git checkout -- .
            git clean -fd
            set +e
            npm run audit:domain-completion-matrix >"/tmp/matrix-$ref.log" 2>&1
            rc=$?
            set -e
            echo "MATRIX_REF=$ref RC=$rc"
            cat "/tmp/matrix-$ref.log"
            echo "MATRIX_STATUS_END=$ref"
          done
          git checkout --detach "$CANDIDATE"
          git checkout -- .
          git clean -fd
          echo 'MATRIX_DIFFERENTIAL_CAPTURE=PASS'
