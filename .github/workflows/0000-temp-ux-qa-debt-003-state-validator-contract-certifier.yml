name: TEMP UX-QA-DEBT-003 Candidate B Matrix Gate

on:
  push:
    branches:
      - diag/ux-qa-debt-003-state-validator-contract-certifier

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen candidate B and Matrix
        shell: bash
        run: |
          set -euo pipefail
          PARENT='bac1f3578166b0db96b6f70ca742e17fd1980c71'
          CANDIDATE='0f38e88e8c0ae027d8b2eaab40ee5ad6cf90c9b2'
          test "$(git rev-parse "$CANDIDATE^")" = "$PARENT"
          git checkout --detach "$CANDIDATE"
          mapfile -t changed < <(git diff --name-only "$PARENT" "$CANDIDATE")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' scripts/audit-main-marketplace-state-contracts.js scripts/audit-main-support-state-contracts.js | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          node --check scripts/audit-main-marketplace-state-contracts.js
          node --check scripts/audit-main-support-state-contracts.js
          git diff --check "$PARENT" "$CANDIDATE"
          npm run audit:domain-completion-matrix
          test -z "$(git status --porcelain)"
          echo 'UX_QA_DEBT_003_CANDIDATE_B_MATRIX=PASS'
          echo "candidate=$CANDIDATE"
          echo 'changedFiles=2'
          echo 'productMutation=false'
          echo 'matrixMutation=false'
