name: UX-CSS-IMPORTANT-035 Domain Cards Reconcile R5B
on:
  push:
    branches:
      - diag/ux-css-important-035-domain-cards-reconcile-r5b
permissions:
  contents: write
jobs:
  reconcile035r5b:
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: 4d1a80ae7fe9763d53e06c342c2b9b89ea65567a
      PARENT_TREE: 714d5b26a67edec2fbcb4f87ebae8c1197304269
      TARGET_FILE: assets/css/components/domain/doke-domain-cards.css
      CANDIDATE_SHA256: d99be25b5e0c364890bec8bc0aa28226b227d9b4bd45131fe193c440328aebed
      CANDIDATE_BLOB: f7b0f8c5c4efcd7c0f821b18f514b788eef4cdfa
      R3_FILE: .diagnostics/ux-css-important-035-domain-cards-delta-r3.txt
      R3_BLOB: 253232f6a0c1b895b92da11a65a277a4f6207c86
      DIAG_BRANCH: diag/ux-css-important-post-010-ranking-r1
      RESULT_FILE: .diagnostics/ux-css-important-035-domain-cards-reconcile-r5b.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Reconcile full browser sweep
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/r5b.log) 2>&1
          test "$(git rev-parse "$PARENT_SHA^{tree}")" = "$PARENT_TREE"
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          test "$(git rev-parse "refs/remotes/origin/$DIAG_BRANCH:$R3_FILE")" = "$R3_BLOB"
          git show "refs/remotes/origin/$DIAG_BRANCH:$R3_FILE" >/tmp/r3.txt
          grep -q '^RUN_ID=32724815997$' /tmp/r3.txt
          grep -Fq "DELTA SUMMARY|nodes=977/977|styleOrRectDiffs=0|screenshotDiff=0|loads=6/6|pageErrors=0|candidateSha256=$CANDIDATE_SHA256" /tmp/r3.txt
          grep -q '^RESULT=PASS$' /tmp/r3.txt
          grep -q '^PROBE_RESULT=PASS$' /tmp/r3.txt
          echo "R3 TRANSFER PASS|blob=$R3_BLOB|state=resultados.html@760|nodes=977/977|styleOrRectDiffs=0|screenshotDiff=0"
          git checkout --detach "$PARENT_SHA" >/dev/null
          cp "$TARGET_FILE" /tmp/parent.css
          trap 'cp /tmp/parent.css "$TARGET_FILE" 2>/dev/null || true; kill $(cat /tmp/http.pid 2>/dev/null) 2>/dev/null || true' EXIT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const o=fs.readFileSync(process.env.TARGET_FILE,'utf8'),c=o.replace(/\s*!important\b/g,'');
          const before=(o.match(/!important\b/g)||[]).length,after=(c.match(/!important\b/g)||[]).length;
          const sha=crypto.createHash('sha256').update(Buffer.from(c)).digest('hex');
          fs.writeFileSync('/tmp/candidate.css',c);
          const blob=cp.execFileSync('git',['hash-object','/tmp/candidate.css'],{encoding:'utf8'}).trim();
          if(before!==215||after!==0||sha!==process.env.CANDIDATE_SHA256||blob!==process.env.CANDIDATE_BLOB) throw Error(`candidate ${before}/${after}/${sha}/${blob}`);
          console.log(`CANDIDATE PASS|important=215->0|removed=215|sha256=${sha}|blob=${blob}|bytes=${Buffer.byteLength(c)}|selectorsRemoved=0|declarationsRemoved=0|valuesChanged=0`);
          NODE
          npm ci --ignore-scripts >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          ok=0; for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done; test "$ok" = 1
          cat >/tmp/proof.js <<'NODE'
          const {chromium}=require('playwright'),crypto=require('crypto'),fs=require('fs');
          const pages=['index.html','resultados.html','pedidos.html','mensagens.html','comunidade.html','perfil.html','carteira.html','notificacoes.html','configuracoes.html'];
          const viewports=[{w:390,h:844},{w:760,h:1000},{w:761,h:1000},{w:1366,h:900}];
          const targetPath='/assets/css/components/domain/doke-domain-cards.css';
          const sel='.service-card,.doke-service-card,.doke-worker-card,.doke-order-card,.doke-message-card,.doke-community-card,.doke-wallet-card,.doke-notification-card,.doke-profile-card,.doke-media-card,.doke-stat-card';
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const meta=()=>[...document.querySelectorAll(sel)].slice(0,40).map(e=>{const r=e.getBoundingClientRect(),c=getComputedStyle(e);return{tag:e.tagName,cls:typeof e.className==='string'?e.className:'',rect:[r.x,r.y,r.width,r.height].map(v=>+v.toFixed(2)),display:c.display,position:c.position,gridTemplateColumns:c.gridTemplateColumns,gridTemplateRows:c.gridTemplateRows,gap:c.gap,padding:c.padding,width:c.width,height:c.height,minHeight:c.minHeight,maxHeight:c.maxHeight,overflow:c.overflow,borderRadius:c.borderRadius,transform:c.transform}});
          async function phase(label){const browser=await chromium.launch({headless:true}),out={};let errors=0,loads=0,metaStable=0,shotStable=0,nodes=0;for(const file of pages){for(const v of viewports){const key=`${file}@${v.w}`,ctx=await browser.newContext({viewport:{width:v.w,height:v.h},deviceScaleFactor:1,locale:'pt-BR',timezoneId:'America/Bahia',reducedMotion:'reduce'});await ctx.route('**/*',r=>{const u=new URL(r.request().url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')return r.continue();return r.abort();});await ctx.addInitScript(()=>{let n=0;Math.random=()=>((++n%997)/997);const fixed=1787562000000,R=Date;class F extends R{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return fixed}}globalThis.Date=F;});const p=await ctx.newPage();p.on('pageerror',e=>{errors++;console.log(`PAGE ERROR|phase=${label}|state=${key}|${String(e.message||e).slice(0,150)}`)});p.on('request',r=>{try{if(new URL(r.url()).pathname===targetPath)loads++;}catch{}});await p.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'domcontentloaded'});await p.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}input,textarea{caret-color:transparent!important}'});await p.evaluate(()=>document.fonts?.ready);await p.waitForTimeout(550);const m1=await p.evaluate(meta);await p.waitForTimeout(180);const m2=await p.evaluate(meta);if(JSON.stringify(m1)===JSON.stringify(m2))metaStable++;nodes+=m2.length;const a=await p.screenshot({fullPage:true});await p.waitForTimeout(180);const b=await p.screenshot({fullPage:true});const h1=hash(a),h2=hash(b);if(h1===h2)shotStable++;else console.log(`INTERNAL SHOT UNSTABLE|phase=${label}|state=${key}|shot1=${h1}|shot2=${h2}`);out[key]={meta:m2,shot:h2};await ctx.close();}}await browser.close();console.log(`PHASE|label=${label}|states=36|metadataStable=${metaStable}|screenshotStable=${shotStable}|pageErrors=${errors}|targetStylesheetLoads=${loads}|sampledDomainNodes=${nodes}`);return{out,errors,loads,metaStable,shotStable,nodes};}
          (async()=>{const r=await phase(process.argv[2]);fs.writeFileSync(process.argv[3],JSON.stringify(r));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/proof.js parent /tmp/parent.json
          cp /tmp/candidate.css "$TARGET_FILE"
          NODE_PATH="$PWD/node_modules" node /tmp/proof.js candidate /tmp/candidate.json
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/parent.json')),b=JSON.parse(fs.readFileSync('/tmp/candidate.json'));let md=0,sd=0;for(const k of Object.keys(a.out)){if(JSON.stringify(a.out[k].meta)!==JSON.stringify(b.out[k].meta)){md++;console.log(`META DIFF|state=${k}`)}if(a.out[k].shot!==b.out[k].shot){sd++;console.log(`SHOT DIFF|state=${k}`)}}const n=Object.keys(a.out).length;console.log(`RECONCILE PASS|states=${n}|metadataDiffs=${md}|screenshotDiffs=${sd}|metadataStable=${a.metaStable}/${b.metaStable}|screenshotStable=${a.shotStable}/${b.shotStable}|pageErrors=${a.errors+b.errors}|targetStylesheetLoads=${a.loads}/${b.loads}|sampledDomainNodes=${a.nodes}/${b.nodes}|r3DeepTransfer=PASS|syntheticDOM=0|syntheticAuth=0|credentialsUsed=0|criteriaRelaxed=0|externalResourcesBlocked=1|dateFrozen=1`);if(n!==36||md||sd||a.errors||b.errors||a.loads===0||b.loads===0||a.loads!==b.loads||a.nodes!==b.nodes||a.metaStable!==36||b.metaStable!==36||a.shotStable!==36||b.shotStable!==36)process.exit(1);
          NODE
          cp /tmp/parent.css "$TARGET_FILE"; cmp -s /tmp/parent.css "$TARGET_FILE"; echo 'RESTORE PASS|target=parent-exact'; echo 'RESULT=PASS'
      - name: Publish R5B receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL; grep -q '^RESULT=PASS$' /tmp/r5b.log && result=PASS || true
          { echo "RUN_ID=$GITHUB_RUN_ID"; echo "PARENT_SHA=$PARENT_SHA"; echo "TARGET_FILE=$TARGET_FILE"; grep -E '^(R3 TRANSFER PASS|CANDIDATE PASS|PHASE|PAGE ERROR|INTERNAL SHOT UNSTABLE|META DIFF|SHOT DIFF|RECONCILE PASS|RESTORE PASS|RESULT=)' /tmp/r5b.log || true; echo "PROOF_RESULT=$result"; } >/tmp/out
          git fetch origin "refs/heads/$DIAG_BRANCH:refs/remotes/origin/$DIAG_BRANCH" >/dev/null
          git checkout -B diag-output "origin/$DIAG_BRANCH" >/dev/null
          mkdir -p "$(dirname "$RESULT_FILE")"; cp /tmp/out "$RESULT_FILE"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$RESULT_FILE"; git commit -m 'diag: publish 035 domain cards reconcile r5b [skip ci]' >/dev/null
          git push origin "HEAD:refs/heads/$DIAG_BRANCH" >/dev/null
          test "$result" = PASS
