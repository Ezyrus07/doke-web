name: COM-B02Z Domain Completion Matrix Finalization TEMP

on:
  pull_request:
    branches: [rep/rep-001-baseline-audit]
    paths:
      - '.github/workflows/com-b02z-domain-completion-matrix-materialization-temp.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: com-b02z-domain-completion-matrix-finalization-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PARENT_HEAD: 9983841f5f3c9ce3731cd62ba4e787287c49a9db
  EXPECTED_SOURCE_BLOB: b9b2abbee1aed1033c122bf7f2802c7e80844623
  EXPECTED_B02Z_READINESS_BLOB: b192f58e0ec5639cb1c5d524e5d015dc2699b1ef
  EXPECTED_B02Z_CONFIG_BLOB: c852c28eb1a3d2f401a8db08518784f84bee5576
  EXPECTED_B02Z_TEST_BLOB: 76efb305135d72ca911d73d8f344ce022f47faf9
  EXPECTED_B02Z_CERTIFIER_BLOB: 659fcde2364cccbe22710edec7152c71879a8aab
  EXPECTED_MARKDOWN_BLOB: d062d0502c4973b3dad28e17785ea29f8f02b80b
  EXPECTED_REPORT_BLOB: 070d56f9cf45a657fb731867f43eb590ff77777b

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate exact B02Z derivatives and fast-forward final snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='com/com-001-baseline-audit'
          EVENT_HEAD='${{ github.event.pull_request.head.sha }}'

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git rev-parse HEAD:config/domain-completion-matrix.json)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:backend/shared/http/repository-only-route-resume-dispatch-readiness.js)" = "$EXPECTED_B02Z_READINESS_BLOB"
          test "$(git rev-parse HEAD:config/com-b02z-repository-only-route-resume-dispatch-readiness.json)" = "$EXPECTED_B02Z_CONFIG_BLOB"
          test "$(git rev-parse HEAD:scripts/test-com-b02z-repository-only-route-resume-dispatch-readiness.js)" = "$EXPECTED_B02Z_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/com-b02z-repository-only-route-resume-dispatch-readiness.yml)" = "$EXPECTED_B02Z_CERTIFIER_BLOB"

          rm .github/workflows/com-b02z-domain-completion-matrix-materialization-temp.yml
          node scripts/audit-domain-completion-matrix.js --write
          git diff --exit-code -- config/domain-completion-matrix.json

          test "$(git hash-object docs/DOMAIN-COMPLETION-MATRIX.md)" = "$EXPECTED_MARKDOWN_BLOB"
          test "$(git hash-object reports/generated/domain-completion-matrix-report.json)" = "$EXPECTED_REPORT_BLOB"

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/com-b02z-domain-completion-matrix-materialization-temp.yml \
            docs/DOMAIN-COMPLETION-MATRIX.md \
            reports/generated/domain-completion-matrix-report.json | sort)"
          test "$actual" = "$expected"

          node scripts/test-com-b02z-repository-only-route-resume-dispatch-readiness.js
          npm ci --ignore-scripts
          npm run audit:domain-completion-matrix
          npm run audit:agent-governance
          git diff --check

          git config user.name 'doke'
          git config user.email 'bielantoniomma@gmail.com'
          git add docs/DOMAIN-COMPLETION-MATRIX.md
          git add -f reports/generated/domain-completion-matrix-report.json
          git add -u .github/workflows/com-b02z-domain-completion-matrix-materialization-temp.yml
          git commit -m 'docs(com): reconcile B02Z Domain Completion Matrix derivatives'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"refs/heads/$BRANCH"
