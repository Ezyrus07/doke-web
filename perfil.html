<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doke | Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/core/tokens.css" />
    <link rel="stylesheet" href="assets/css/core/base.css" />
    <link rel="stylesheet" href="assets/css/core/layout.css" />
    <link rel="stylesheet" href="assets/css/core/components.css" />
    <link rel="stylesheet" href="assets/css/pages/app-shell.css" />
    <link rel="stylesheet" href="assets/css/pages/perfil.css" />
  </head>
  <body class="shell-home home-index-shell profile-page-shell" data-profile-type="professional" data-profile-view="visitor">
    <div class="app-shell">
      <aside class="sidebar">
        <button
          class="sidebar__collapse-button"
          type="button"
          data-sidebar-collapse
          aria-label="Diminuir ou expandir menu lateral"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m14.5 6.5-5 5 5 5"></path>
          </svg>
        </button>

        <div class="sidebar__brand">
          <div class="brand-logo" aria-label="Doke">
            <img src="assets/img/doke-logo-lockup.png" alt="Doke" />
          </div>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__label">Principal</div>
          <a class="nav-link nav-link--home" href="index.html">
            <span class="nav-link__start">
              <span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V20h13V9.5"></path></svg></span>
              <span>Início</span>
            </span>
            <span class="nav-link__count">Base</span>
          </a>
          <a class="nav-link nav-link--orders" href="pedidos.html">
            <span class="nav-link__start">
              <span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 5.5h10"></path><path d="M7 9.5h10"></path><path d="M7 13.5h6"></path><path d="M5 4h14v16H5z"></path></svg></span>
              <span>Pedidos</span>
            </span>
          </a>
          <a class="nav-link nav-link--messages" href="mensagens.html">
            <span class="nav-link__start">
              <span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 4V6z"></path><path d="M8 10h8"></path><path d="M8 13h5"></path></svg></span>
              <span>Mensagens</span>
            </span>
          </a>
          <a class="nav-link nav-link--notifications" href="notificacoes.html">
            <span class="nav-link__start">
              <span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4.5a4.8 4.8 0 0 0-4.8 4.8v2.6c0 1.4-.4 2.7-1.2 3.8h12c-.8-1.1-1.2-2.4-1.2-3.8V9.3A4.8 4.8 0 0 0 12 4.5z"></path><path d="M9.5 18a2.5 2.5 0 0 0 5 0"></path></svg></span>
              <span>Notificações</span>
            </span>
            <span class="nav-link__count">3</span>
          </a>
          <a class="nav-link nav-link--communities" href="comunidade.html">
            <span class="nav-link__start">
              <span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="10" r="2.5"></circle><circle cx="16" cy="9" r="2.5"></circle><path d="M3.5 18c.8-2.4 2.8-3.8 5.5-3.8S13.7 15.6 14.5 18"></path><path d="M12.5 18c.6-1.9 2.1-3.1 4.3-3.1 2 0 3.6 1.1 4.2 3.1"></path></svg></span>
              <span>Comunidades</span>
            </span>
          </a>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__label">Conta</div>
          <a class="nav-link nav-link--profile is-active" href="perfil.html">
            <span class="nav-link__start"><span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 19c1.2-3.2 3.7-4.8 7-4.8s5.8 1.6 7 4.8"></path></svg></span><span>Perfil</span></span>
          </a>
          <a class="nav-link nav-link--settings" href="mais.html">
            <span class="nav-link__start"><span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.8v2.1"></path><path d="M12 18.1v2.1"></path><path d="m18.2 5.8-1.5 1.5"></path><path d="m7.3 16.7-1.5 1.5"></path><path d="M20.2 12h-2.1"></path><path d="M5.9 12H3.8"></path><path d="m18.2 18.2-1.5-1.5"></path><path d="m7.3 7.3-1.5-1.5"></path></svg></span><span>Configurações</span></span>
          </a>
        </div>

        <div class="sidebar__footer">
          <div class="sidebar__group sidebar__group--footer">
            <button class="nav-link nav-link--footer-action" type="button" data-sidebar-logout aria-label="Sair">
              <span class="nav-link__start"><span class="nav-link__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 7.5V5.8A1.8 1.8 0 0 0 13.2 4H7.8A1.8 1.8 0 0 0 6 5.8v12.4A1.8 1.8 0 0 0 7.8 20h5.4a1.8 1.8 0 0 0 1.8-1.8v-1.7"></path><path d="M10 12h10"></path><path d="m17 8 3 4-3 4"></path></svg></span><span>Sair</span></span>
            </button>
          </div>
        </div>
      </aside>

      <div class="page">
        <header class="topbar topbar--location home-index-topbar">
          <div class="topbar__left">
            <button class="mobile-toggle" type="button" data-sidebar-toggle aria-label="Abrir menu lateral">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 17h16"></path>
              </svg>
            </button>
            <button class="topbar-search-icon" type="button" data-mobile-search-open aria-label="Abrir busca">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="m20 20-4.2-4.2"></path>
              </svg>
            </button>
            <form class="topbar-search topbar-search--subtle" data-global-topbar-search autocomplete="off" aria-label="Buscar no cabeçalho">
              <button class="topbar-search__icon" type="submit" data-global-topbar-submit aria-label="Pesquisar">
                <svg viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="6"></circle>
                  <path d="m20 20-4.2-4.2"></path>
                </svg>
              </button>
              <input type="search" placeholder="Buscar no perfil" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
              <button class="topbar-search-close" type="button" data-mobile-search-close aria-label="Fechar busca">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12"></path>
                  <path d="M18 6 6 18"></path>
                </svg>
              </button>
            </form>
          </div>
          <a class="mobile-header-logo" href="index.html" aria-label="Doke">
            <img src="assets/img/doke-logo-lockup.png" alt="Doke" />
          </a>
          <div class="mobile-header-shortcuts" aria-label="Atalhos rápidos mobile">
            <a class="mobile-header-shortcut" href="pedidos.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h10"></path><path d="M7 9.5h10"></path><path d="M7 13.5h6"></path><path d="M5 4h14v16H5z"></path></svg></a>
            <a class="mobile-header-shortcut" href="mensagens.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v10H8l-4 4V6z"></path><path d="M8 10h8"></path><path d="M8 13h5"></path></svg></a>
          </div>
          <div class="topbar__center profile-topbar-center">
            <div class="profile-topbar-actions" aria-label="Ações do perfil">
              <button class="profile-topbar-pill" type="button" data-profile-share>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8a3 3 0 1 0-2.8-4H12a3 3 0 0 0 .2 1l-5.3 3a3 3 0 1 0 0 7.1l5.3 3a3 3 0 1 0 .7-1.2l-5.2-2.9a3.2 3.2 0 0 0 0-2l5.2-2.9A3 3 0 0 0 15 8Z"></path></svg>
                <span>Compartilhar</span>
              </button>
            </div>
          </div>
          <div class="topbar__right">
            <div class="topbar-account-cluster">
              <div class="topbar-points">
                <span class="topbar-points__label">Progresso</span>
                <div class="topbar-points__row">
                  <span class="topbar-points__level">Nível 15</span>
                  <span class="topbar-points__badge">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.1 4.4 4.9.7-3.6 3.5.9 4.9-4.3-2.3-4.3 2.3.9-4.9-3.6-3.5 4.9-.7z"></path></svg>
                    230 pontos
                  </span>
                </div>
              </div>
              <div class="topbar-profile" aria-label="Perfil do usuário">
                <button class="topbar-profile__button" type="button" data-profile-menu-toggle aria-expanded="false" aria-haspopup="true" aria-label="Abrir menu do perfil"><div class="avatar">DK</div></button>
                <div class="profile-dropdown" data-profile-menu hidden>
                  <div class="profile-dropdown__header">@gabriel</div>
                  <div class="profile-dropdown__body">
                    <a class="profile-dropdown__item" href="perfil.html"><span class="profile-dropdown__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 19c1.2-3.2 3.7-4.8 7-4.8s5.8 1.6 7 4.8"></path></svg></span><span>Meu perfil</span></a>
                    <a class="profile-dropdown__item" href="carteira.html"><span class="profile-dropdown__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v10H4z"></path><path d="M16 12h4"></path><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h7A1.5 1.5 0 0 1 17 6.5V8"></path></svg></span><span>Carteira</span></a>
                    <a class="profile-dropdown__item" href="mais.html"><span class="profile-dropdown__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.8v2.1"></path><path d="M12 18.1v2.1"></path><path d="m18.2 5.8-1.5 1.5"></path><path d="m7.3 16.7-1.5 1.5"></path><path d="M20.2 12h-2.1"></path><path d="M5.9 12H3.8"></path><path d="m18.2 18.2-1.5-1.5"></path><path d="m7.3 7.3-1.5-1.5"></path></svg></span><span>Configurações</span></a>
                  </div>
                  <div class="profile-dropdown__footer"><button class="profile-dropdown__item profile-dropdown__item--danger" type="button" data-sidebar-logout><span class="profile-dropdown__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7.5V5.8A1.8 1.8 0 0 0 13.2 4H7.8A1.8 1.8 0 0 0 6 5.8v12.4A1.8 1.8 0 0 0 7.8 20h5.4a1.8 1.8 0 0 0 1.8-1.8v-1.7"></path><path d="M10 12h10"></path><path d="m17 8 3 4-3 4"></path></svg></span><span>Sair</span></button></div>
                </div>
              </div>
            </div>
          </div>
        </header>

        <main class="page__content">
          <div class="page__content-inner profile-shell-content">
            <section class="profile-screen" data-profile-root>
              <section class="profile-hero-shell" aria-labelledby="profile-name">
                <div class="profile-hero-shell__cover"></div>

                <div class="profile-card">
                  <div class="profile-card__content">
                    <div class="profile-avatar-column">
                      <div class="profile-avatar-frame">
                        <div class="profile-avatar" data-profile-avatar>GA</div>
                      </div>
                    </div>

                    <div class="profile-main-column">
                      <div class="profile-name-row">
                        <h1 class="profile-name" id="profile-name" data-profile-name>Gabriel Antonio</h1>
                        <span class="profile-verified-badge" data-profile-verified hidden aria-label="Perfil verificado">
                          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 14.5 6l3.5.5 1 3.3 2.5 2.2-1.2 3.2.3 3.5-3.2 1.2L15 22l-3-1.4L9 22 6.4 19.9l-3.2-1.2.3-3.5L2.3 13l2.5-2.2 1-3.3L9.3 6z"></path><path d="m8.9 12.3 2.1 2.1 4.3-4.6"></path></svg>
                        </span>
                        <div class="profile-name-actions" data-profile-name-actions></div>
                      </div>

                      <div class="profile-meta-row">
                        <span data-profile-username>@gabriel</span>
                        <span class="profile-meta-divider" aria-hidden="true">•</span>
                        <span data-profile-city>Salvador, BA</span>
                      </div>

                      <div class="profile-category-row" data-profile-categories></div>

                      <p class="profile-bio" data-profile-headline>
                        Descrição breve do perfil com foco em clareza, reputação e leitura rápida.
                      </p>
                    </div>

                    <div class="profile-side-column">
                      <div class="profile-stats-row" data-profile-stats></div>
                      <div class="profile-actions-row" data-profile-actions></div>
                    </div>
                  </div>
                </div>
              </section>

              <nav class="profile-tabs" aria-label="Seções do perfil">
                <button class="profile-tab is-active" type="button" data-profile-tab="services">Serviços</button>
                <button class="profile-tab" type="button" data-profile-tab="posts">Publicações</button>
                <button class="profile-tab" type="button" data-profile-tab="reviews">Avaliações</button>
                <button class="profile-tab" type="button" data-profile-tab="about">Sobre</button>
                <button class="profile-tab" type="button" data-profile-tab="portfolio">Portfólio</button>
              </nav>

              <div class="profile-panels">
                <section class="profile-panel is-active" data-profile-panel="services"></section>
                <section class="profile-panel" data-profile-panel="posts" hidden></section>
                <section class="profile-panel" data-profile-panel="reviews" hidden></section>
                <section class="profile-panel" data-profile-panel="about" hidden></section>
                <section class="profile-panel" data-profile-panel="portfolio" hidden></section>
              </div>
            </section>
          </div>
        </main>
      </div>

      <div class="mobile-scrim" data-sidebar-scrim></div>
    </div>

    <script src="assets/js/core/app.js"></script>
    <script src="assets/data/mocks/profile-data.js"></script>
    <script src="assets/js/pages/search-data.js"></script>
    <script src="assets/js/features/profile/profile-tabs.js"></script>
    <script src="assets/js/features/profile/profile-share.js"></script>
    <script src="assets/js/pages/perfil.js"></script>
  </body>
</html>
