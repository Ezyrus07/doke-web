<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doke | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/core/tokens.css">
  <link rel="stylesheet" href="../assets/css/core/base.css">
  <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>
<body class="auth-page auth-page--login">
  <main class="auth-shell">
    <section class="auth-stage">
      <div class="auth-layout">
        <section class="auth-form-panel">
          <span class="auth-mark" aria-hidden="true"><img src="../assets/img/doke-logo-sidebar.jpeg" alt=""></span>

          <header class="auth-copy">
            <h1>Entrar na conta</h1>
            <p>
              Acesse sua área para acompanhar pedidos, mensagens, comunidades e tudo o que move a experiência do Doke.
            </p>
          </header>

          <form class="auth-form" data-auth-login>
            <label class="auth-field">
              <span>E-mail ou telefone</span>
              <div class="auth-input">
                <input id="email-login" type="text" inputmode="email" placeholder="voce@email.com ou (11) 99999-9999" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
              </div>
            </label>

            <label class="auth-field">
              <span>Senha</span>
              <div class="auth-password">
                <input id="senha-login" type="password" placeholder="Digite sua senha" autocomplete="current-password">
                <button type="button" data-toggle-password="senha-login" aria-label="Mostrar senha">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </label>

            <div class="auth-meta-row">
              <label class="auth-check">
                <input type="checkbox" id="remember-login">
                <span class="auth-check__box" aria-hidden="true"></span>
                <span>Lembrar de mim</span>
              </label>
              <a class="auth-link auth-link--muted" href="esqueci-senha.html">Esqueci minha senha</a>
            </div>

            <div class="auth-feedback is-hidden" data-auth-feedback></div>

            <button class="auth-button" type="submit" data-auth-submit>Entrar</button>

            <div class="auth-divider">OU</div>

            <div class="auth-social">
              <button class="auth-social-btn" type="button" aria-label="Continuar com Google">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#111827" d="M12.15 21c5.28 0 8.75-3.69 8.75-8.89 0-.6-.05-1.03-.15-1.49H12.15v3.34h5.05c-.1.83-.64 2.07-1.84 2.91l-.02.11 2.74 2.08.19.02c1.72-1.56 2.73-3.86 2.73-6.97C21 7 17.1 3 12.15 3a9 9 0 0 0 0 18Zm0-3.48A5.42 5.42 0 0 1 6.98 14l-.11.01-2.83 2.15-.04.1A8.98 8.98 0 0 0 12.15 21Zm-5.17-6.12A5.3 5.3 0 0 1 6.67 9.7c0-.58.1-1.15.29-1.69l-.01-.11-2.87-2.19-.09.04A8.78 8.78 0 0 0 3 9.7c0 1.57.38 3.06 1.04 4.36l2.94-2.26Zm5.17-4.01c1.51 0 2.53.64 3.11 1.17l2.27-2.18C16.13 5.1 14.3 4.4 12.15 4.4A8.98 8.98 0 0 0 3.98 9.7l2.98 2.3c.74-2.16 2.76-3.61 5.19-3.61Z"></path>
                </svg>
              </button>
              <button class="auth-social-btn" type="button" aria-label="Continuar com Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#111827" d="M13.62 22v-8.04h2.7l.4-3.14h-3.1V8.81c0-.9.25-1.52 1.54-1.52H16.8V4.48c-.29-.04-1.27-.12-2.4-.12-2.38 0-4 1.45-4 4.12v2.34H7.7v3.14h2.7V22h3.22z"/>
                </svg>
              </button>
              <button class="auth-social-btn" type="button" aria-label="Continuar com Apple">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#111827" d="M15.1 3.5c.8-1 1.36-2.3 1.2-3.5-1.16.08-2.52.78-3.34 1.77-.74.86-1.38 2.18-1.2 3.44 1.3.1 2.56-.66 3.34-1.71Zm3.77 14.58c-.54 1.22-.8 1.76-1.5 2.83-.97 1.47-2.35 3.3-4.06 3.31-1.51.02-1.9-.98-3.95-.97-2.05.01-2.48.99-4 .97-1.7-.01-3-1.66-3.97-3.12C-1.35 16.96-.92 9.7 3.56 7.27c1.6-.87 3.14-.83 4.14-.83 1.03 0 2.95.85 4.98.85 1.95 0 3.13-.86 4.95-.86.65 0 2.67.06 3.94 1.88-3.47 1.9-2.9 6.88.3 9.77Z"/>
                </svg>
              </button>
            </div>

            <p class="auth-footer">
              Ainda não tem conta? <a class="auth-switch-link" href="cadastro.html">Criar cadastro</a>
            </p>
          </form>
        </section>

        <aside class="auth-visual-panel">
          <div class="auth-visual">
            <div class="auth-tag-row">
              <span class="auth-tag">Pedidos e orçamento</span>
              <span class="auth-tag">Mensagens e comunidade</span>
            </div>

            <div class="auth-arrows">
              <button class="auth-arrow" type="button" aria-label="Depoimento anterior" data-auth-prev>&larr;</button>
              <button class="auth-arrow" type="button" aria-label="Próximo depoimento" data-auth-next>&rarr;</button>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/core/supabase-config.js"></script>
  <script src="../assets/js/core/auth-service.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
