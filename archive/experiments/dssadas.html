<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Inovador</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <style>
    /* --- Variáveis Globais de Cores e Espaçamentos --- */
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    /* --- Reset Básico --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* --- Container Simulando Tela de App --- */
    .mobile-app-container {
      width: 100%;
      max-width: 414px; /* Tamanho de um iPhone Max */
      height: 896px;
      background-color: var(--bg-color);
      border-radius: 40px;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 8px solid #1e293b;
    }

    /* Ocultar barra de rolagem para um visual mais limpo */
    .mobile-app-container::-webkit-scrollbar {
      display: none;
    }

    /* --- Header --- */
    .profile-header {
      display: flex;
      justify-content: space-between;
      padding: 24px;
      position: sticky;
      top: 0;
      background: linear-gradient(
        to bottom,
        rgba(15, 23, 42, 1) 40%,
        rgba(15, 23, 42, 0) 100%
      );
      z-index: 10;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .icon-btn:hover {
      transform: scale(1.1);
    }

    /* --- Cartão de Perfil (Glassmorphism) --- */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin: 0 16px 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .profile-info-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    /* --- Avatar Moderno --- */
    .avatar-container {
      position: relative;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      padding: 3px;
      background: var(--accent-gradient);
    }

    .status-indicator {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      background-color: #10b981; /* Verde online */
      border: 2px solid var(--bg-color);
      border-radius: 50%;
    }

    /* --- Detalhes do Usuário --- */
    .user-details {
      flex: 1;
    }

    .user-name {
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .user-handle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 12px;
    }

    /* --- Botões --- */
    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      border: none;
      flex: 1;
      justify-content: center;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* --- Estatísticas --- */
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .stat-value {
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 12px;
      margin-top: 4px;
    }

    .stat-divider {
      width: 1px;
      height: 30px;
      background-color: var(--border-color);
    }

    /* --- Abas de Navegação --- */
    .content-tabs {
      display: flex;
      position: relative;
      margin-bottom: 16px;
      padding: 0 16px;
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      padding: 16px 0;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .tab.active {
      color: var(--text-primary);
    }

    /* Linha indicadora animada sob as abas */
    .tab-indicator {
      position: absolute;
      bottom: 0;
      left: 16px;
      width: calc((100% - 32px) / 3);
      height: 3px;
      background: var(--accent-gradient);
      border-radius: 3px 3px 0 0;
      transition: transform 0.3s ease;
    }

    /* --- Grid de Conteúdo --- */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 0 4px 24px;
    }

    .grid-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .grid-item:hover img {
      transform: scale(1.05);
    }

    /* Arredonda os cantos das imagens das bordas externas do grid */
    .grid-item:nth-child(1) {
      border-top-left-radius: var(--radius-md);
    }
    .grid-item:nth-child(3) {
      border-top-right-radius: var(--radius-md);
    }
    .grid-item:nth-last-child(3) {
      border-bottom-left-radius: var(--radius-md);
    }
    .grid-item:nth-last-child(1) {
      border-bottom-right-radius: var(--radius-md);
    }
  </style>
  <body>
    <div class="mobile-app-container">
      <header class="profile-header">
        <button class="icon-btn"><i class="ph ph-arrow-left"></i></button>
        <button class="icon-btn">
          <i class="ph ph-dots-three-outline-vertical"></i>
        </button>
      </header>

      <section class="profile-card">
        <div class="profile-info-row">
          <div class="avatar-container">
            <img
              src="https://i.pravatar.cc/150?img=68"
              alt="Foto de Perfil"
              class="avatar"
            />
            <div class="status-indicator"></div>
          </div>

          <div class="user-details">
            <h1 class="user-name">Nome Sobrenome</h1>
            <p class="user-handle">@usuario_inovador</p>

            <div class="action-buttons">
              <button class="btn btn-primary">Editar</button>
              <button class="btn btn-secondary">
                <i class="ph ph-user-plus"></i> Add
              </button>
            </div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-value">128</span>
            <span class="stat-label">Posts</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value">12.4k</span>
            <span class="stat-label">Seguidores</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value">450</span>
            <span class="stat-label">Seguindo</span>
          </div>
        </div>
      </section>

      <nav class="content-tabs">
        <button class="tab active">Posts</button>
        <button class="tab">Vídeos</button>
        <button class="tab">Fotos</button>
        <div class="tab-indicator"></div>
      </nav>

      <main class="content-grid">
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop"
            alt="Post 1"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=400&auto=format&fit=crop"
            alt="Post 2"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=400&auto=format&fit=crop"
            alt="Post 3"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=400&auto=format&fit=crop"
            alt="Post 4"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=400&auto=format&fit=crop"
            alt="Post 5"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=400&auto=format&fit=crop"
            alt="Post 6"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop"
            alt="Post 7"
          />
        </div>
        <div class="grid-item">
          <img
            src="https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=400&auto=format&fit=crop"
            alt="Post 8"

        <div class="grid-item">

      </main>
    </div>
  </body>
</html>
