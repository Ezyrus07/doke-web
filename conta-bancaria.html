<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Doke | Conta bancaria</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="assets/css/core/index.css">
 <link rel="stylesheet" href="assets/css/pages/app-shell.css">
  <link rel="stylesheet" href="assets/css/pages/wallet-manage.css">
</head>
<body class="app-shell-page wallet-manage-shell">
 <div class="app-shell">
  <aside class="sidebar" data-shell-sidebar></aside>
  <div class="page">
   <main class="page__content">
    <div class="page__content-inner container app-shell-page__workspace app-shell-page__workspace--clean shell-home__workspace shell-home__workspace--clean">
     <section class="wallet-manage-page">
      <article class="wallet-manage-card">
       <div class="wallet-manage-card__header">
        <div>
         <span class="wallet-section__eyebrow">Conta de destino</span>
         <h1>Gerenciar contas bancarias</h1>
         <p>Escolha a conta principal para saque ou adicione uma nova conta bancaria.</p>
        </div>
        <a class="wallet-page__button" href="carteira.html">Voltar</a>
       </div>
       <div class="wallet-manage-list">
        <article class="wallet-manage-option">
         <div>
          <strong>Banco Inter • final 2049</strong>
          <p>Titular: Gabriel Oliveira</p>
         </div>
         <span class="wallet-manage-option__badge">Principal</span>
        </article>
        <article class="wallet-manage-option">
         <div>
          <strong>Nubank • final 9921</strong>
          <p>Titular: Gabriel Oliveira</p>
         </div>
         <a class="wallet-page__button" href="carteira.html">Usar esta</a>
        </article>
       </div>
       <div class="wallet-manage-grid">
        <label class="wallet-manage-field"><span>Banco</span><input type="text" value="Caixa Economica"></label>
        <label class="wallet-manage-field"><span>Agencia</span><input type="text" value="0001"></label>
        <label class="wallet-manage-field"><span>Conta</span><input type="text" value="12345-6"></label>
        <label class="wallet-manage-field"><span>Tipo</span><select><option>Conta corrente</option><option>Poupanca</option></select></label>
        <label class="wallet-manage-field wallet-manage-field--full"><span>Titular</span><input type="text" value="Gabriel Oliveira"></label>
       </div>
       <div class="wallet-manage-actions">
        <a class="wallet-page__button wallet-page__button--primary" href="carteira.html">Adicionar conta</a>
       </div>
      </article>
     </section>
    </div>
   </main>
  </div>
 </div>
 <script src="assets/js/core/auth.js"></script>
 <script src="assets/js/core/app.js"></script>
</body>
</html>
