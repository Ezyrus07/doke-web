<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Aquarela - Header Premium</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #2c5394 0%, #35c4a1 100%);
        --glass-bg: rgba(255, 255, 255, 0.85);
        --text-dark: #1a202c;
        --text-muted: #718096;
        --accent: #2d9d86;
        --radius: 24px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f0f4f8;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }

      .profile-container {
        width: 100%;
        max-width: 1100px;
        background: white;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        position: relative;
      }

      /* Banner Superior */
      .banner {
        height: 180px;
        background: var(--primary-gradient);
        position: relative;
      }

      /* Área de Conteúdo */
      .content-wrapper {
        padding: 0 40px 40px 40px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 30px;
        position: relative;
      }

      /* Avatar */
      .avatar-box {
        width: 150px;
        height: 150px;
        background: var(--primary-gradient);
        border-radius: 30px;
        margin-top: -75px; /* Sobe metade do avatar */
        border: 6px solid white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        font-weight: 800;
        color: white;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        z-index: 10;
      }

      /* Info Principal */
      .main-info {
        padding-top: 20px;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .title-row h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text-dark);
      }

      .verified-icon {
        color: #3b82f6;
        font-size: 1.2rem;
      }

      .follow-btn {
        padding: 6px 20px;
        border-radius: 50px;
        border: 1px solid #e2e8f0;
        background: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .follow-btn:hover {
        background: #f8fafc;
        border-color: #cbd5e1;
      }

      .location-row {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 15px;
      }

      .badges {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .badge {
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .badge-verified {
        background: #e6fffa;
        color: #234e52;
        border: 1px solid #b2f5ea;
      }
      .badge-design {
        background: #edf2f7;
        color: #2d3748;
      }

      .bio {
        color: #4a5568;
        line-height: 1.6;
        max-width: 600px;
      }

      /* Lado Direito: Stats e Ações */
      .right-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        padding-top: 20px;
      }

      .stats-row {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
      }

      .stat-item {
        background: #f8fafc;
        border: 1px solid #edf2f7;
        padding: 12px 20px;
        border-radius: 16px;
        text-align: center;
        min-width: 100px;
      }

      .stat-value {
        display: block;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-dark);
      }

      .stat-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
      }

      .action-btns {
        display: flex;
        gap: 12px;
      }

      .btn {
        padding: 12px 28px;
        border-radius: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        border: none;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 4px 14px rgba(45, 157, 134, 0.3);
      }

      .btn-secondary {
        background: white;
        border: 1px solid #e2e8f0;
        color: #2d3748;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      /* Responsividade */
      @media (max-width: 900px) {
        .content-wrapper {
          grid-template-columns: 1fr;
          text-align: center;
          padding-top: 0;
        }
        .avatar-box {
          margin: -75px auto 0 auto;
        }
        .title-row,
        .badges,
        .stats-row,
        .action-btns {
          justify-content: center;
        }
        .right-side {
          align-items: center;
        }
        .bio {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="profile-container">
      <div class="banner"></div>

      <div class="content-wrapper">
        <div class="avatar-box">SA</div>

        <div class="main-info">
          <div class="title-row">
            <h1>Studio Aquarela</h1>
            <span class="verified-icon">●</span>
            <button class="follow-btn">Seguir</button>
          </div>

          <div class="location-row">@studioaquarela • Salvador, BA</div>

          <div class="badges">
            <span class="badge badge-verified">Profissional verificado</span>
            <span class="badge badge-design">Design de interiores</span>
          </div>

          <p class="bio">
            Especialista em ambientes residenciais com foco em leitura visual
            limpa, acabamento consistente e comunicação objetiva do início ao
            fim.
          </p>
        </div>

        <div class="right-side">
          <div class="stats-row">
            <div class="stat-item">
              <span class="stat-value">4,9</span>
              <span class="stat-label">Nota média</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">46</span>
              <span class="stat-label">Projetos</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">2h</span>
              <span class="stat-label">Resposta</span>
            </div>
          </div>

          <div class="action-btns">
            <button class="btn btn-primary">Orçamento</button>
            <button class="btn btn-secondary">Mensagem</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
