<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --brand-gradient: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
        --accent-green: #10b981;
        --white: #ffffff;
        --soft-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      body {
        margin: 0;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f8fafc;
      }

      /* Header com curvatura moderna */
      .header-premium {
        background: var(--brand-gradient);
        padding: 30px 24px 60px 24px;
        border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px;
        position: relative;
      }

      /* Barra superior */
      .nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .profile-section {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .avatar-box {
        width: 48px;
        height: 48px;
        background: var(--accent-green);
        color: white;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      }

      .welcome-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        margin: 0;
      }

      .user-name {
        color: var(--white);
        font-size: 20px;
        font-weight: 700;
        margin: 0;
        display: block;
      }

      /* Botões de Ação Superior */
      .actions-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .location-pill {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 16px;
        border-radius: 50px;
        color: white;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .location-pill:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .notif-icon {
        background: white;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
      }

      .notif-dot {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
        border: 2px solid white;
      }

      /* Barra de Busca - O destaque do design */
      .search-wrapper {
        position: absolute;
        bottom: -28px;
        left: 24px;
        right: 24px;
        background: var(--white);
        height: 56px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        box-shadow: var(--soft-shadow);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }

      .search-wrapper input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #1e293b;
        font-weight: 500;
        margin-left: 12px;
      }

      .search-wrapper input::placeholder {
        color: #94a3b8;
      }

      .search-tools {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-left: 16px;
        border-left: 2px solid #f1f5f9;
      }

      .icon-btn {
        cursor: pointer;
        opacity: 0.6;
        transition: 0.2s;
      }

      .icon-btn:hover {
        opacity: 1;
        color: #1e40af;
      }
    </style>
  </head>
  <body>
    <header class="header-premium">
      <div class="nav-row">
        <div class="profile-section">
          <div class="avatar-box">DK</div>
          <div>
            <p class="welcome-text">Bom dia,</p>
            <span class="user-name">Gabriel Santos</span>
          </div>
        </div>

        <div class="actions-row">
          <div class="location-pill">
            <span style="color: #10b981">●</span>
            Salvar localização
            <span style="font-size: 10px">▼</span>
          </div>
          <div class="notif-icon">
            🔔
            <div class="notif-dot"></div>
          </div>
        </div>
      </div>

      <div class="search-wrapper">
        <span style="font-size: 20px">🔍</span>
        <input type="text" placeholder="O que você precisa hoje?" />
        <div class="search-tools">
          <span class="icon-btn">🎙️</span>
          <span class="icon-btn" style="color: #10b981">⚖️</span>
        </div>
      </div>
    </header>
  </body>
</html>
