sonar.projectKey=Ezyrus07_doke-web
sonar.organization=ezyrus07
sonar.sourceEncoding=UTF-8

# Keep product, infrastructure and workflow code in the main source scope.
# Test and audit harnesses are analyzed as tests and do not count toward
# production coverage metrics.
sonar.sources=.
sonar.tests=scripts,tests
sonar.exclusions=scripts/**,tests/**,docs/**,coverage/**,node_modules/**,playwright-report/**,test-results/**,reports/**,.scannerwork/**,assets/img/**,assets/media/**,**/__pycache__/**,**/*.pyc
sonar.test.exclusions=tests/**/*.png,tests/**/*.jpg,tests/**/*.jpeg,tests/**/*.gif,tests/**/*.webp,tests/**/*.svg,tests/**/*.ico,tests/**/*.mp4,tests/**/*.mov,tests/**/*.webm,tests/**/*.zip

sonar.javascript.lcov.reportPaths=coverage/ux-search-debt-001/lcov.info
