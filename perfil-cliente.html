<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doke | Perfil público do cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/core/tokens.css" />
    <link rel="stylesheet" href="assets/css/core/base.css" />
    <link rel="stylesheet" href="assets/css/pages/perfil.css" />
  </head>
  <body class="public-profile-page" data-profile-key="clientPublic">
    <header class="public-sitebar" aria-label="Cabeçalho público da Doke">
      <a class="public-sitebar__brand" href="index.html" aria-label="Doke">
        <img src="assets/img/doke-logo-lockup.png" alt="Doke" />
      </a>
      <div class="public-sitebar__actions">
        <a class="public-sitebar__link" href="resultados.html">Voltar para resultados</a>
        <a class="public-sitebar__button public-sitebar__button--primary" href="mensagens.html">Convidar para proposta</a>
      </div>
    </header>

    <main class="profile-shell" data-profile-page>
      <section class="profile-hero">
        <div class="profile-hero__cover"></div>
        <div class="profile-hero__card">
          <div class="profile-hero__avatar-wrap">
            <div class="profile-hero__avatar" data-profile-avatar>GA</div>
          </div>

          <div class="profile-hero__main">
            <div class="profile-hero__identity">
              <h1 class="profile-hero__title" data-profile-name>Gabriel Antonio</h1>
              <span class="profile-hero__verified" data-profile-verified hidden aria-label="Perfil verificado"></span>
            </div>
            <div class="profile-hero__meta">
              <span data-profile-username>@gabriel</span>
              <span class="profile-hero__divider" aria-hidden="true">•</span>
              <span data-profile-location>Salvador, BA</span>
            </div>
            <div class="profile-badges" data-profile-badges></div>
            <p class="profile-hero__headline" data-profile-headline></p>
          </div>

          <aside class="profile-hero__aside" aria-label="Resumo do perfil">
            <div class="profile-stat-grid" data-profile-stats></div>
            <div class="profile-actions" data-profile-actions></div>
          </aside>
        </div>
      </section>

      <nav class="profile-tabs" data-profile-tabs aria-label="Seções do perfil"></nav>
      <div class="profile-panels" data-profile-panels></div>
    </main>

    <script src="assets/data/mocks/profile-data.js"></script>
    <script src="assets/js/features/profile/profile-tabs.js"></script>
    <script src="assets/js/features/profile/profile-renderer.js"></script>
    <script src="assets/js/pages/profile-public.js"></script>
  </body>
</html>
